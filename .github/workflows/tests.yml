name: Tests

on: push

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task:
          - name: Check
            command: pnpm check
          # The unit test files are split into shards that run in parallel, as spawning a worker
          # per file is what takes most of the time on the runner
          - name: Test (1/3)
            command: pnpm test --project unit --shard=1/3
          - name: Test (2/3)
            command: pnpm test --project unit --shard=2/3
          - name: Test (3/3)
            command: pnpm test --project unit --shard=3/3
          # The component tests run in Chromium, which only these jobs install. They are split
          # the same way, as a runner has few cores to run the files in parallel on
          - name: Test (components 1/3)
            command: pnpm test --project browser --shard=1/3
            browser: true
          - name: Test (components 2/3)
            command: pnpm test --project browser --shard=2/3
            browser: true
          - name: Test (components 3/3)
            command: pnpm test --project browser --shard=3/3
            browser: true
          # The end-to-end tests run against the production bundle, so each shard builds it first.
          # They take the longest, so they get twice as many shards as the component tests
          - name: Test (end-to-end 1/6)
            command: pnpm build && pnpm test:e2e --shard=1/6
            browser: true
            report: e2e-1
          - name: Test (end-to-end 2/6)
            command: pnpm build && pnpm test:e2e --shard=2/6
            browser: true
            report: e2e-2
          - name: Test (end-to-end 3/6)
            command: pnpm build && pnpm test:e2e --shard=3/6
            browser: true
            report: e2e-3
          - name: Test (end-to-end 4/6)
            command: pnpm build && pnpm test:e2e --shard=4/6
            browser: true
            report: e2e-4
          - name: Test (end-to-end 5/6)
            command: pnpm build && pnpm test:e2e --shard=5/6
            browser: true
            report: e2e-5
          - name: Test (end-to-end 6/6)
            command: pnpm build && pnpm test:e2e --shard=6/6
            browser: true
            report: e2e-6
          - name: Build
            command: pnpm build
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v7.0.1
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3.0.0
        with:
          version: latest
          runtime: node@26
          cache: true
      # The browser is cached per Playwright version, which pins the Chromium build. The tests run
      # headless, so only the headless shell is installed, not the full browser. The system packages
      # it needs aren’t cached, and are installed on every run
      - name: Get the Playwright version
        id: playwright
        if: ${{ matrix.task.browser }}
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium-cache
        if: ${{ matrix.task.browser }}
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: ${{ matrix.task.browser && steps.chromium-cache.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install chromium --only-shell --with-deps
      - name: Install Chromium dependencies
        if: ${{ matrix.task.browser && steps.chromium-cache.outputs.cache-hit == 'true' }}
        run: pnpm exec playwright install-deps chromium-headless-shell
      - name: ${{ matrix.task.name }}
        run: ${{ matrix.task.command }}
      # The report holds a trace of each failed test, retried or not, to step through what the page
      # did. Each shard uploads its own, which lists the tests of that shard only
      - name: Upload the end-to-end test report
        if: ${{ matrix.task.report && failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-${{ matrix.task.report }}
          path: playwright-report/
          retention-days: 14
