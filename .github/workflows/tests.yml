name: Tests

on: push

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task:
          - name: Check
            command: pnpm check
          - name: Test
            command: pnpm test
          - name: Build
            command: pnpm build
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v7.0.1
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: latest
          runtime: node@26
          cache: true
      - name: ${{ matrix.task.name }}
        run: ${{ matrix.task.command }}
