name: Tests

on: push

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task:
          - name: Check
            command: pnpm check
          # The test files are split into shards that run in parallel, as spawning a worker per
          # file is what takes most of the time on the runner
          - name: Test (1/3)
            command: pnpm test --shard=1/3
          - name: Test (2/3)
            command: pnpm test --shard=2/3
          - name: Test (3/3)
            command: pnpm test --shard=3/3
          - name: Build
            command: pnpm build
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v7.0.1
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: latest
          runtime: node@26
          cache: true
      - name: ${{ matrix.task.name }}
        run: ${{ matrix.task.command }}
