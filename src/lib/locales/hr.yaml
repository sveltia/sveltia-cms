        saved: URL hooka je spremljen.
        removed: URL hooka je uklonjen.
      # Authorization header input
      auth:
        field_label: Zaglavlje Authorization (npr. Bearer <token>) (neobavezno)
        saved: Zaglavlje Authorization je spremljeno.
        removed: Zaglavlje Authorization je uklonjeno.
    clear_data:
      title: Očisti podatke
      # Clear File Cache button
      file_cache:
        description: Izbrišite lokalno predmemorirani sadržaj datoteka i sličice slika kako biste oslobodili prostor za pohranu ili riješili probleme uzrokovane zastarjelim podacima.
        button_label: Očisti predmemoriju datoteka
        confirmation: Lokalno predmemorirani sadržaj datoteka i sličice slika bit će izbrisani. Vaše nespremljene skice i postavke bit će zadržane, a izbrisani podaci po potrebi će se ponovno preuzeti ili generirati. CMS će se po završetku ponovno učitati.
      # Erase All Data button
      all_data:
        description: Izbrišite sve što CMS čuva u ovom pregledniku, uključujući predmemorirane datoteke, nespremljene skice i postavke. Ono što je već spremljeno u vašem repozitoriju neće biti zahvaćeno.
        button_label: Izbriši sve podatke
        confirmation: Svi podaci pohranjeni u ovom pregledniku bit će izbrisani, uključujući predmemorirani sadržaj datoteka, sličice slika, nespremljene skice, postavke i stanje prijave. Vaš repozitorij neće biti zahvaćen, ali sve nespremljene promjene bit će izgubljene i morat ćete se ponovno prijaviti. CMS će se po završetku ponovno učitati.

