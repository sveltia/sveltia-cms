# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: Ovo je polje obavezno.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: Datum i vrijeme moraju biti {$min} ili kasnije.
    date: Datum mora biti {$min} ili kasnije.
    time: Vrijeme mora biti {$min} ili kasnije.
    number: Vrijednost mora biti veća od ili jednaka {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Morate odabrati barem {$min} opciju. }}
        few {{ Morate odabrati barem {$min} opcije. }}
        *   {{ Morate odabrati barem {$min} opcija. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Morate dodati barem {$min} stavku. }}
        few {{ Morate dodati barem {$min} stavke. }}
        *   {{ Morate dodati barem {$min} stavki. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: Datum i vrijeme moraju biti {$max} ili ranije.
    date: Datum mora biti {$max} ili ranije.
    time: Vrijeme mora biti {$max} ili ranije.
    number: Vrijednost mora biti manja od ili jednaka {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ Ne možete odabrati više od {$max} opcije. }}
        few {{ Ne možete odabrati više od {$max} opcije. }}
        *   {{ Ne možete odabrati više od {$max} opcija. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ Ne možete dodati više od {$max} stavke. }}
        few {{ Ne možete dodati više od {$max} stavke. }}
        *   {{ Ne možete dodati više od {$max} stavki. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Morate unijeti barem {$min} znak. }}
      few {{ Morate unijeti barem {$min} znaka. }}
      *   {{ Morate unijeti barem {$min} znakova. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ Ne možete unijeti više od {$max} znaka. }}
      few {{ Ne možete unijeti više od {$max} znaka. }}
      *   {{ Ne možete unijeti više od {$max} znakova. }}

  # Type validation errors
  type_mismatch:
    number: Unesite broj.
    email: Unesite valjanu e-mail adresu.
    url: Unesite valjani URL.

