# ==============================================================================
# Content and Asset Libraries
# ==============================================================================
# Strings used in the main content and asset management interfaces, including
# lists, navigation, and collection/folder views.

# Page container aria-labels
content_library: Biblioteka sadržaja
asset_library: Biblioteka resursa

# Primary sidebar section headings and list aria-labels
collections: Zbirke
entries: Unosi
files: Datoteke

# Asset location selector: option group labels
asset_location:
  # Assets stored in the site’s Git repository
  repository: Vaše web-mjesto
  external: Vanjske lokacije
  stock_photos: Stock fotografije

# Sidebar and list labels
# Collection assets panel aria-label
collection_assets: Resursi zbirke
# List aria-labels for different list types
entry_list: Popis unosa
file_list: Popis datoteka
asset_list: Popis resursa

# Collection and folder page titles
# Used as aria-labels on page containers
# {$collection} is the current collection label
x_collection: Zbirka „{$collection}”
# {$folder} is the current asset folder label
x_asset_folder: Mapa resursa „{$folder}”

# Navigation announcements (ARIA live regions)
# Announce page changes for screen reader users
viewing_collection_list: Sada pregledavate popis zbirki.
viewing_asset_folder_list: Sada pregledavate popis mapa s resursima.
# Collection view announcements with entry counts
# {$collection} is the collection label and {$count} is the number of entries in it
viewing_x_collection: |
  .input {$count :integer}
  .match $count
    0   {{ Sada pregledavate zbirku „{$collection}”, koja još nema unosa. }}
    one {{ Sada pregledavate zbirku „{$collection}”, koja ima {$count} unos. }}
    few {{ Sada pregledavate zbirku „{$collection}”, koja ima {$count} unosa. }}
    *   {{ Sada pregledavate zbirku „{$collection}”, koja ima {$count} unosa. }}
# Asset folder view announcements with asset counts
# {$folder} is the folder label and {$count} is the number of assets in it
viewing_x_asset_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Sada pregledavate mapu resursa „{$folder}”, koja još nema resursa. }}
    one {{ Sada pregledavate mapu resursa „{$folder}”, koja ima {$count} resurs. }}
    few {{ Sada pregledavate mapu resursa „{$folder}”, koja ima {$count} resursa. }}
    *   {{ Sada pregledavate mapu resursa „{$folder}”, koja ima {$count} resursa. }}
# Cloud storage service view announcement
# {$service} is the cloud storage service name, e.g. Uploadcare
viewing_x_external_location: Sada pregledavate resurse na usluzi {$service}.

# Singleton file selection announcement
# {$file} is the singleton file name
singleton_selected_announcement: Pritisnite Enter za uređivanje datoteke „{$file}”.

# Error messages: page, collection, folder or file not found
page_not_found: Stranica nije pronađena.
collection_not_found: Zbirka nije pronađena.
asset_folder_not_found: Mapa resursa nije pronađena.
file_not_found: Datoteka nije pronađena.

# Selection count indicator
