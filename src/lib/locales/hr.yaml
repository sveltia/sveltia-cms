    unsupported_folder_template_tag: Opcija `{$option}` sadrži oznaku predloška `{$tag}`, koja ondje nije podržana. Mogu se koristiti samo oznake predloška sluga, poput `\{\{slug\}\}` i `\{\{year\}\}`, te oznake `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` i `\{\{public_folder\}\}`.
