# Upload confirmation with destination folder
# {$folder} is the destination folder label and {$count} is the number of files being uploaded
confirm_uploading_files: |
  .input {$count :integer}
  .match $count
    1   {{ Ova datoteka bit će spremljena u mapu „{$folder}”: }}
    one {{ Ova {$count} datoteka bit će spremljena u mapu „{$folder}”: }}
    few {{ Ove {$count} datoteke bit će spremljene u mapu „{$folder}”: }}
    *   {{ Ovih {$count} datoteka bit će spremljeno u mapu „{$folder}”: }}

# File size validation
# Warning section for files exceeding size limits
oversized_files: Prevelike datoteke
# {$size} is the maximum allowed file size and {$count} is the number of oversized files
warning_oversized_files: |
  .input {$count :integer}
  .match $count
    1   {{ Ova datoteka ne može se prenijeti jer premašuje najveću dopuštenu veličinu od {$size}. Smanjite je ili odaberite drugu datoteku. }}
    *   {{ Ove datoteke ne mogu se prenijeti jer premašuju najveću dopuštenu veličinu od {$size}. Smanjite ih ili odaberite druge datoteke. }}

# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: Nevaljane datoteke
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    1   {{ Ova datoteka ne može se prenijeti jer je oštećena ili njezin sadržaj ne odgovara nastavku datoteke. To se često događa kada se fotografija preimenuje umjesto da se pretvori, primjerice HEIC slika spremljena kao JPEG datoteka. Pretvorite datoteku i pokušajte ponovno. }}
    *   {{ Ove datoteke ne mogu se prenijeti jer su oštećene ili njihov sadržaj ne odgovara nastavcima datoteka. To se često događa kada se fotografije preimenuju umjesto da se pretvore, primjerice HEIC slike spremljene kao JPEG datoteke. Pretvorite datoteke i pokušajte ponovno. }}
# {$count} is the number of files that are not of a type the field accepts, even once transformed
# {$types} is the list of accepted file types, such as “.pdf or .txt”
warning_unsupported_files: |
  .input {$count :integer}
  .match $count
    1   {{ Ova datoteka ne može se prenijeti jer nije nijedna od sljedećih vrsta: {$types}. }}
    *   {{ Ove datoteke ne mogu se prenijeti jer nisu nijedna od sljedećih vrsta: {$types}. }}
# {$count} is the number of files that are not of an image type the field accepts
# {$types} is the list of accepted image formats, such as “PNG or WebP”
warning_unsupported_image_files: |
  .input {$count :integer}
  .match $count
    1   {{ Ova datoteka ne može se prenijeti jer se prihvaća samo slika sljedećih vrsta: {$types}. }}
    *   {{ Ove datoteke ne mogu se prenijeti jer se prihvaćaju samo slike sljedećih vrsta: {$types}. }}

# File format validation when replacing an asset
# Warning section for replacement files that are in a different format
mismatched_files: Datoteke različitog formata
# {$name} is the name of the asset being replaced and {$count} is the number of mismatched files
warning_mismatched_files: |
  .input {$count :integer}
  .match $count
    1   {{ Ova datoteka ne može zamijeniti „{$name}” jer je u drugom formatu. Pretvorite datoteku u isti format i pokušajte ponovno. }}
    *   {{ Ove datoteke ne mogu zamijeniti „{$name}” jer su u drugom formatu. Pretvorite datoteke u isti format i pokušajte ponovno. }}

# File name conflict resolution
# {$count} is the number of conflicting file names in the target folder
file_name_conflict_confirmation: |
  .input {$count :integer}
  .match $count
    1   {{ U ovoj mapi već postoji datoteka istog naziva. Želite li je zamijeniti? }}
    one {{ U ovoj mapi već postoji {$count} datoteka istog naziva. Želite li je zamijeniti? }}
    few {{ U ovoj mapi već postoje {$count} datoteke istih naziva. Želite li ih zamijeniti? }}
    *   {{ U ovoj mapi već postoji {$count} datoteka istih naziva. Želite li ih zamijeniti? }}
# {$name} is the conflicting file name when there is exactly one conflict; {$count} is the total conflict count
file_name_conflict_confirmation_with_name: |
  .input {$count :integer}
  .input {$name :string}
  .match $count
    1   {{ U ovoj mapi već postoji datoteka naziva „{$name}”. Želite li je zamijeniti? }}
    one {{ U ovoj mapi već postoji {$count} datoteka istog naziva. Želite li je zamijeniti? }}
    few {{ U ovoj mapi već postoje {$count} datoteke istih naziva. Želite li ih zamijeniti? }}
    *   {{ U ovoj mapi već postoji {$count} datoteka istih naziva. Želite li ih zamijeniti? }}
file_name_conflict_resolution: Rješavanje sukoba naziva datoteka
