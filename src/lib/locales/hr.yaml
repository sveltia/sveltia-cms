  .input {$count :integer}
  .match $count
    one {{ Izbriši resurs }}
    *   {{ Izbriši resurse }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Izbriši odabrani resurs }}
    *   {{ Izbriši odabrane resurse }}
confirm_deleting_this_asset: Jeste li sigurni da želite izbrisati ovaj resurs?
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Jeste li sigurni da želite izbrisati odabrani resurs? }}
    few {{ Jeste li sigurni da želite izbrisati odabrana {$count} resursa? }}
    *   {{ Jeste li sigurni da želite izbrisati odabranih {$count} resursa? }}
confirm_deleting_all_assets: Jeste li sigurni da želite izbrisati sve resurse?

# Delete entries: dialog titles and confirmation messages
# {$count} is the number of entries targeted by the action
delete_entries: |
  .input {$count :integer}
  .match $count
    one {{ Izbriši unos }}
    *   {{ Izbriši unose }}
# {$count} is the number of selected entries
delete_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Izbriši odabrani unos }}
    *   {{ Izbriši odabrane unose }}
confirm_deleting_this_entry: Jeste li sigurni da želite izbrisati ovaj unos?
