# ==============================================================================
# File Upload and Processing
# ==============================================================================
# Strings for file upload dialogs, progress indicators, and validation.

# Processing indicator shown during file preparation
# {$count} is the number of files currently being processed
processing_files: |
  .input {$count :integer}
  .match $count
    one {{ Obrada datoteke. To može potrajati. }}
    *   {{ Obrada datoteka. To može potrajati. }}

# Uploading section aria-label
uploading_files: Prijenos datoteka

# Replace file confirmation
# Dialog body when replacing an existing file
# {$name} is the existing file name that will be replaced
confirm_replacing_file: 'Datoteka „{$name}” bit će zamijenjena ovom datotekom:'

# Upload confirmation with destination folder
# {$folder} is the destination folder label and {$count} is the number of files being uploaded
confirm_uploading_files: |
  .input {$count :integer}
  .match $count
    one {{ Ova datoteka bit će spremljena u mapu „{$folder}”: }}
    few {{ Ove {$count} datoteke bit će spremljene u mapu „{$folder}”: }}
    *   {{ Ovih {$count} datoteka bit će spremljeno u mapu „{$folder}”: }}

# File size validation
# Warning section for files exceeding size limits
oversized_files: Prevelike datoteke
# {$size} is the maximum allowed file size and {$count} is the number of oversized files
warning_oversized_files: |
  .input {$count :integer}
  .match $count
    one {{ Ova datoteka ne može se prenijeti jer premašuje najveću dopuštenu veličinu od {$size}. Smanjite je ili odaberite drugu datoteku. }}
    *   {{ Ove datoteke ne mogu se prenijeti jer premašuju najveću dopuštenu veličinu od {$size}. Smanjite ih ili odaberite druge datoteke. }}

# File name conflict resolution
# {$count} is the number of conflicting file names in the target folder
file_name_conflict_confirmation: |
  .input {$count :integer}
  .match $count
    one {{ U ovoj mapi već postoji datoteka istog naziva. Želite li je zamijeniti? }}
    few {{ U ovoj mapi već postoje {$count} datoteke istih naziva. Želite li ih zamijeniti? }}
    *   {{ U ovoj mapi već postoji {$count} datoteka istih naziva. Želite li ih zamijeniti? }}
# {$name} is the conflicting file name when there is exactly one conflict; {$count} is the total conflict count
file_name_conflict_confirmation_with_name: |
  .input {$count :integer}
  .input {$name :string}
  .match $count
    one {{ U ovoj mapi već postoji datoteka naziva „{$name}”. Želite li je zamijeniti? }}
    few {{ U ovoj mapi već postoje {$count} datoteke istih naziva. Želite li ih zamijeniti? }}
    *   {{ U ovoj mapi već postoji {$count} datoteka istih naziva. Želite li ih zamijeniti? }}
file_name_conflict_resolution: Rješavanje sukoba naziva datoteka
# Option to keep both files (rename the new one)
keep_both: Zadrži obje

# Upload progress and error messages
uploading_files_progress: Prijenos…
uploading_files_failed: Prijenos nije uspio.

# File metadata display
# Shows file type and size in upload preview and asset info
# {$type} is the localized file type label and {$size} is the formatted file size
