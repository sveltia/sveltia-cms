  unsupported_repository: Vaš repozitorij koristi značajku Gita koju CMS ne podržava, primjerice povezano radno stablo (linked worktree), SHA-256 nazive objekata, format reftable, sparse indeks ili indeks u verziji 3 ili 4, koji koriste opcija feature.manyFiles i git add -N.
