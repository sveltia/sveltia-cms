    merge: U tijeku je spajanje (merge). Dovršite ga naredbom git commit ili ga otkažite naredbom git merge --abort.
    rebase: U tijeku je rebase. Dovršite ga naredbom git rebase --continue ili ga otkažite naredbom git rebase --abort. Ako ste već nastavili dalje, git rebase --quit odbacuje ga bez promjene vaših datoteka.
    cherry_pick: U tijeku je cherry-pick. Dovršite ga naredbom git cherry-pick --continue ili ga otkažite naredbom git cherry-pick --abort.
    revert: U tijeku je revert. Dovršite ga naredbom git revert --continue ili ga otkažite naredbom git revert --abort.
    am: U tijeku je primjena zakrpa naredbom git am. Dovršite je naredbom git am --continue ili je otkažite naredbom git am --abort.
    conflict: Neke datoteke imaju sukobe. Najprije ih riješite i pripremite rezultate (stage).
  detached_head: Nijedna grana nije aktivna (checkout).
  staged_changes: Imate drugih promjena pripremljenih za commit. Najprije ih commitajte ili uklonite iz pripreme.
