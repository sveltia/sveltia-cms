# ==============================================================================
# Common Actions
# ==============================================================================
# Generic action button labels used throughout the application. These are
# reusable strings for common operations like save, delete, cancel, etc.

# Primary actions: creation, selection, and file operations
create: Novo
select: Odaberi
select_all: Odaberi sve
upload: Prenesi
copy: Kopiraj
download: Preuzmi
duplicate: Dupliciraj
delete: Izbriši
reorder: Promijeni redoslijed

# Dialog and form actions: confirmation and cancellation
cancel: Odustani
done: Gotovo
save: Spremi
# Progress indicator shown on the save button while a save operation is in progress
saving: Spremanje…

# Publishing actions: used when committing changes to the repository
publish: Objavi
# Progress indicator shown on the publish button during publishing
publishing: Objavljivanje…

# Modification actions: editing and updating content
rename: Preimenuj
update: Ažuriraj
replace: Zamijeni

# List and collection actions: adding and removing items
add: Dodaj
remove: Ukloni
clear: Očisti

# Expansion and collapse actions: used for accordions, trees, and expandable sections
expand: Proširi
expand_all: Proširi sve
collapse: Sažmi
collapse_all: Sažmi sve

# Content manipulation: inserting, restoring, and discarding
insert: Umetni
restore: Vrati
discard: Odbaci

# ==============================================================================
# Common UI Elements
# ==============================================================================
# Reusable labels and messages for common interface elements like status
# indicators, loading states, and toolbar regions.

# Status messages: search and results indicators
# Shown in ARIA live regions during search operations
searching: Pretraživanje…
no_results: Nema pronađenih rezultata.

# Toolbar region labels: used as aria-labels for different toolbar areas
# These help screen readers identify which toolbar is being navigated
global: Globalno
primary: Primarno
secondary: Sekundarno
collection: Zbirka
folder: Mapa

# ==============================================================================
# Miscellaneous Labels
# ==============================================================================
# Various labels used across the application for specific UI elements
# that don’t fit into other categories.

# Field and input labels
api_key: API ključ
details: Pojedinosti
back: Natrag
# Loading indicator shown during async operations (asset preview, panels, etc.)
loading: Učitavanje…
# Dismiss button for temporary notifications and infobars
later: Kasnije

# Entry and collection labels
# Slug field heading in entry editors
slug: Slug
# Fallback labels for singleton collections when names aren’t configured
singleton: Samostalna datoteka
singletons: Samostalne datoteke

# Error messages
# Toast notification when clipboard operations fail
clipboard_error: Kopiranje u međuspremnik nije uspjelo.

# ==============================================================================
# Sign-In Page
# ==============================================================================
# Strings specific to the authentication and sign-in page, including welcome
# messages, loading states, OAuth flows, and repository access options.

# Welcome and branding
# Screen reader announcement when the sign-in page loads
# {$name} is the app title shown on the sign-in screen, Sveltia CMS by default
welcome_message: 'Dobrodošli u {$name}'
# Footer text with CMS branding
# {$name} is the CMS brand name shown in the footer, Sveltia CMS by default
powered_by: 'Pokreće {$name}'

# Shown during initial configuration and data loading
loading_cms_config: Učitavanje konfiguracije CMS-a…
loading_site_data: Učitavanje podataka web-mjesta…
loading_site_data_error: Došlo je do pogreške pri učitavanju podataka web-mjesta.

# OAuth and token authentication
# Primary sign-in button label for OAuth providers (GitHub, GitLab, etc.)
# {$service} is the sign-in provider label, such as GitHub or GitLab
sign_in_with_x: 'Prijava putem usluge {$service}'

# Access token dialog: alternative authentication method
sign_in_using_access_token: Prijava pomoću pristupnog tokena
sign_in_using_access_token_description: Unesite svoj token u nastavku. Mora imati pravo čitanja i pisanja sadržaja repozitorija.
# Inline link text with embedded HTML anchor tag
# {$service} is the provider name whose user settings page contains the token generator, e.g., GitHub or GitLab
sign_in_using_access_token_link: Token možete generirati na <a>stranici korisničkih postavki usluge {$service}</a>.
# Input field label for personal access token
personal_access_token: Osobni pristupni token

# Authentication progress indicators
authorizing: Autorizacija…
signing_in: Prijava u tijeku…

# Local and test repository options
# Button label and description for working with a local Git repository
work_with_local_repo: Rad s lokalnim repozitorijem
# {$repo} is the configured repository name shown when it is available
work_with_local_repo_description: Kada se to od vas zatraži, odaberite korijenski direktorij repozitorija „{$repo}”.
work_with_local_repo_description_no_repo: Kada se to od vas zatraži, odaberite korijenski direktorij svojeg Git repozitorija.
# Button label for demo/test repository
work_with_test_repo: Rad s testnim repozitorijem

# Authentication errors
# Error messages shown during sign-in failures
sign_in_error:
  not_project_root: Odabrana mapa nije korijenski direktorij repozitorija. Pokušajte ponovno.
  picker_dismissed: Korijenski direktorij repozitorija nije odabran. Pokušajte ponovno.
  authentication_aborted: Autentifikacija je prekinuta. Pokušajte ponovno.
  invalid_token: Navedeni token nije valjan. Provjerite ga i pokušajte ponovno.
  # OAuth and authenticator errors (shown with error codes) — keys are defined in the Sveltia CMS Authenticator library
  UNSUPPORTED_BACKEND: Autentifikator ne podržava vaš Git backend.
  UNSUPPORTED_DOMAIN: Vaša domena ne smije koristiti autentifikator.
  MISCONFIGURED_CLIENT: ID klijenta ili tajna OAuth aplikacije nisu konfigurirani.
  AUTH_CODE_REQUEST_FAILED: Primanje autorizacijskog koda nije uspjelo. Pokušajte ponovno kasnije.
  CSRF_DETECTED: Otkriven je mogući CSRF napad. Postupak autentifikacije je prekinut.
  TOKEN_REQUEST_FAILED: Traženje pristupnog tokena nije uspjelo. Pokušajte ponovno kasnije.
  TOKEN_REFRESH_FAILED: Osvježavanje pristupnog tokena nije uspjelo. Pokušajte ponovno kasnije.
  MALFORMED_RESPONSE: Poslužitelj je vratio neispravne podatke. Pokušajte ponovno kasnije.

# Backend and repository validation errors
# Shown when the configured backend or repository is invalid or inaccessible
# {$name} is the backend display name like Forgejo and {$version} is the minimum supported version
backend_unsupported_version: 'Backend {$name} zahtijeva {$name} {$version} ili noviji.'
# {$repo} is the repository identifier, typically in owner/repo format
repository_no_access: Nemate pristup repozitoriju „{$repo}”.
repository_not_found: Repozitorij „{$repo}” ne postoji.
repository_empty: Repozitorij „{$repo}” nema nijednu granu.
# {$repo} is the repository identifier, and {$branch} is the configured branch name
branch_not_found: Repozitorij „{$repo}” nema granu „{$branch}”.

# General errors
# Fallback error dialog title for unexpected errors
unexpected_error: Neočekivana pogreška

# Entry file parsing errors
# Toast notification when entry files fail to parse on initial load
# {$count} is the number of entry files that failed to parse
entry_parse_errors: |
  .input {$count :integer}
  .match $count
    one {{ Došlo je do pogreške pri obradi datoteke unosa. Pojedinosti potražite u konzoli preglednika. }}
    *   {{ Došlo je do pogrešaka pri obradi datoteka unosa. Pojedinosti potražite u konzoli preglednika. }}

