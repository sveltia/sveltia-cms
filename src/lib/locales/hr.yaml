    duplicate_field_name: Nazivi polja moraju biti jedinstveni, ali `{$name}` se koristi više puta.
    # {$count} is the 1-based variable type index in the current types array
    missing_variable_type: Varijabilna vrsta {$count} mora imati opciju `name` definiranu kao neprazan niz znakova.
    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: Naziv varijabilne vrste `{$name}` nije valjan. Ne smije sadržavati posebne znakove.
    duplicate_variable_type: Nazivi varijabilnih vrsta moraju biti jedinstveni, ali `{$name}` se koristi više puta.
    date_field_type: 'Zastarjela vrsta polja Date nije podržana u Sveltia CMS-u. Umjesto nje upotrijebite vrstu polja DateTime s opcijom `type: date`.'
    # {$timeZone} is the invalid IANA timezone identifier from the configuration
    invalid_timezone: 'Nevaljana vremenska zona: {$timeZone}. Mora biti valjani IANA identifikator vremenske zone poput `America/New_York` ili `Asia/Tokyo`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: Zastarjela opcija `{$prop}` nije podržana u Sveltia CMS-u. Umjesto nje upotrijebite opciju `{$newProp}`.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: Opcija `allow_multiple` nije podržana u Sveltia CMS-u. Umjesto nje upotrijebite opciju `multiple`, koja je prema zadanome `false`.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: Polje vrste List ne može imati opcije `field`, `fields` i `types` istodobno.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: Varijabilna vrsta polja List nije valjana. Opcija `widget` postavljena je na `{$widget}`, ali mora biti `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: Polje vrste Object ne može imati opcije `fields` i `types` istodobno.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: Referencirana zbirka `{$collection}` nije valjana ili nije definirana.
    relation_field_invalid_collection_file: Referencirana datoteka `{$file}` nije valjana ili nije definirana.
    # Don’t localize `file`
    relation_field_missing_file_name: Opcija `file` mora biti definirana za relaciju prema zbirci datoteka.
    relation_field_invalid_value_field: Referencirano polje vrijednosti `{$field}` nije valjano ili nije definirano.
    unexpected: Neočekivana pogreška

    # Schema validation errors, reported when the configuration doesn’t match the published JSON
    # schema. In all of these, {$option} is a configuration option path such as `backend.name` or
    # `view_filters[0].pattern`, relative to the collection, file or field named before it.
    # {$type} is a value type name from `schema_value_type` below
    schema_invalid_type: Opcija `{$option}` mora biti {$type}.
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'Opcija `{$option}` mora biti jedna od sljedećih vrijednosti: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: Opcija `{$option}` mora biti `{$value}`.
    schema_invalid_empty_value: Opcija `{$option}` mora biti prazan niz znakova.
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: Opcija `{$option}` mora biti polje s {$count} stavki.
    schema_invalid_value: Opcija `{$option}` ima nevaljanu vrijednost.
    schema_missing_option: Opcija `{$option}` je obavezna.
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Obavezna je jedna od sljedećih opcija: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: niz znakova
      number: broj
      integer: cijeli broj
      boolean: logička vrijednost
      array: polje
      object: objekt
      'null': prazna

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: ID OAuth aplikacije nije definiran. Korisnici se moraju prijaviti pomoću pristupnog tokena.
    editorial_workflow_unsupported: Uredničko radno okruženje još nije podržano u Sveltia CMS-u.
    open_authoring_unsupported_backend: Open Authoring trenutačno je podržan samo s GitHub backendom.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: Opcija `{$prop}` nije podržana u Sveltia CMS-u. Bit će zanemarena.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Postavljeni su i `picker_utc` i novije opcije vremenske zone (`input_timezone` ili `output_utc`). Nove opcije imaju prednost. Razmislite o uklanjanju opcije `picker_utc` iz konfiguracije.
    # Don’t localize `preview_path`
    preview_path_no_date_field: Opcija `preview_path` koristi oznake datuma i vremena, ali zbirka nema polje DateTime iz kojeg bi ih čitala, pa se poveznica na pretpregled neće prikazati.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: Opcija `preview_path_date_field` upućuje na polje naziva `{$name}`, ali polje DateTime s tim nazivom nije definirano, pa se poveznica na pretpregled neće prikazati.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: Opcija `preview_path` upućuje na `{$name}`, ali takvo polje nije definirano u zbirci, pa se poveznica na pretpregled neće prikazati.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: Opcija `{$option}` nije definirana u shemi konfiguracije Sveltia CMS-a. Bit će zanemarena. Provjerite postoji li pogreška u pisanju ili sintaksi.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Pojedinosti potražite u napomenama o kompatibilnosti: {$link}'

  # Console tip shown after config load
  schema_tip: Za bolje razvojno iskustvo možete provjeriti svoju konfiguracijsku datoteku prema JSON shemi Sveltia CMS-a. Pojedinosti potražite na {$link}.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Lokalno
  # Browser compatibility warnings
  unsupported_browser: Lokalno radno okruženje nije podržano u vašem pregledniku. Upotrijebite Chrome ili Edge.
  disabled: Lokalno radno okruženje onemogućeno je u vašem pregledniku. <a>Evo kako ga omogućiti</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Sada pregledavate ploču uredničkog radnog okruženja. Skice: {$draft}. Na pregledu: {$review}. Spremno: {$ready}. Čeka brisanje: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Sada pregledavate ploču uredničkog radnog okruženja. Skice: {$draft}. Na pregledu: {$review}. Čeka brisanje: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Skica
  drafts: Skice
  in_review: Na pregledu
  ready: Spremno
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Čeka brisanje

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Otkaži brisanje
  confirm_cancelling_deletion: Jeste li sigurni da želite otkazati ovo brisanje? Unos će ostati objavljen.
  confirm_completing_deletion: Jeste li sigurni da želite izbrisati ovaj unos? Bit će odmah uklonjen.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      1   {{ Unos je označen za brisanje. }}
      one {{ Označen je {$count} unos za brisanje. }}
      few {{ Označena su {$count} unosa za brisanje. }}
      *   {{ Označeno je {$count} unosa za brisanje. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      1   {{ Promjene su odbačene. }}
      one {{ Odbačene su promjene u {$count} unosu. }}
      few {{ Odbačene su promjene u {$count} unosa. }}
      *   {{ Odbačene su promjene u {$count} unosa. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Otkazivanje brisanja…
  deletion_cancelled: Brisanje je otkazano.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Otkazivanje brisanja nije uspjelo. Pokušajte ponovno.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Neobjavljeni unosi
  published_entries: Objavljeni unosi
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Status: {$status}'
  change_entry_status: Promijeni status unosa
  # Editor toolbar: progress label while the status is being changed
  changing_status: Promjena statusa…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Ažuriranje statusa…
  status_updated: Status je ažuriran.
  # Error notification when the status could not be changed
  status_change_failed: Promjena statusa nije uspjela. Pokušajte ponovno.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: Unos sadrži pogreške. Ispravite ih prije promjene statusa.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: Unos sadrži pogreške. Ispravite ih prije objave.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Pošalji na pregled
  confirm_sending_for_review: Vaše su promjene spremljene kao skica. Želite li poslati unos na pregled kako bi ga netko mogao pregledati i objaviti?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Objavi unos
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Odbaci promjene
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Jeste li sigurni da želite izbrisati ovaj unos? Neće biti uklonjen dok se brisanje ne objavi. Do tada ćete ga i dalje pronaći na popisu unosa, označen kao „Čeka brisanje”.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Ovaj unos još nije objavljen, pa će brisanjem biti u potpunosti odbačen.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Ovaj unos ima neobjavljene promjene. Njihovim odbacivanjem vratit će se objavljena verzija. Sam unos neće biti izbrisan.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      1   {{ Još nije objavljen, pa će vaše neobjavljene promjene biti odbačene. Objavljena verzija, ako postoji, ostat će objavljena. }}
      *   {{ Još nisu objavljeni, pa će vaše neobjavljene promjene biti odbačene. Objavljene verzije, ako postoje, ostat će objavljene. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      1   {{ Jedan od njih još nije objavljen, pa će vaše neobjavljene promjene biti odbačene. Objavljena verzija, ako postoji, ostat će objavljena. }}
      one {{ {$count} njih još nije objavljen, pa će vaše neobjavljene promjene biti odbačene. Objavljena verzija, ako postoji, ostat će objavljena. }}
      few {{ {$count} njih još nisu objavljena, pa će vaše neobjavljene promjene biti odbačene. Objavljene verzije, ako postoje, ostat će objavljene. }}
      *   {{ {$count} njih još nije objavljeno, pa će vaše neobjavljene promjene biti odbačene. Objavljene verzije, ako postoje, ostat će objavljene. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry: Jeste li sigurni da želite objaviti ovaj unos? Vaše će promjene odmah stupiti na snagu.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Objavljivanje unosa…
  entry_published: Unos je objavljen.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Brisanje unosa…
  discarding_changes: Odbacivanje promjena…
  entry_deleted: Unos je izbrisan.
  # Error notification when publishing fails
  publishing_entry_failed: Objava unosa nije uspjela. Pokušajte ponovno.
  # Workflow page: empty column message
  no_entries: Nema unosa.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Povucite za promjenu statusa

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Forkaj repozitorij
  fork: Forkaj
  confirm_forking_repository: Da biste predložili promjene za „{$repo}”, na vašem računu mora se stvoriti fork repozitorija. Vaše se promjene spremaju u taj fork, a održavatelj ih pregledava prije objave.
  # Error shown when the user declined the dialog above
  fork_declined: Za predlaganje promjena trebate fork repozitorija na svojem računu.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Nije moguće stvoriti fork repozitorija „{$repo}” na vašem računu.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Nije moguće provjeriti vaš pristup repozitoriju „{$repo}”. Pokušajte ponovno za trenutak.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Repozitorij „{$repo}” ne dopušta forkove. Zamolite održavatelja da omogući forkanje.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Imate pozivnicu na čekanju za repozitorij „{$repo}”. Prihvatite je na GitHubu, a zatim se ponovno prijavite.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Vaša prijava ne uključuje pristup privatnim repozitorijima, pa repozitorij „{$repo}” nije moguće čitati. Zamolite održavatelja da provjeri postavke provjere autentičnosti CMS-a.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Samo održavatelj može objaviti promjene na ovom web-mjestu. Umjesto toga označite svoj unos kao „Na pregledu” i netko će ga pogledati.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Ovu promjenu nije moguće izravno napraviti. Na pregled se mogu predložiti samo uređivanja unosa.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Vaše se promjene spremaju u vaš fork ovog repozitorija na „{$repo}” i pregledavaju prije objave.
  view_fork: Prikaži fork

# ==============================================================================
