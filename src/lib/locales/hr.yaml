    title: Pogreška
    description: Došlo je do pogreške pri spremanju unosa. Pokušajte ponovno kasnije.

# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: Unos je promijenio netko drugi
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} promijenio/promijenila je ovaj unos {$date}, nakon što ste ga otvorili.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Ovaj je unos promijenjen u repozitoriju nakon što ste ga otvorili.
  deleted: Ovaj je unos izbrisan iz repozitorija nakon što ste ga otvorili.
  # Follows `modified_by` or `modified`
  overwrite_warning: Ako sada spremite, njihove promjene bit će izgubljene.
  # Follows `deleted`
  recreate_warning: Ako sada spremite, unos će biti ponovno stvoren.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Budući da je unos pohranjen u istoj datoteci kao i drugi unosi, ne može se spremiti preko te promjene. Odustanite od uređivanja, ponovno otvorite unos s popisa i unesite svoje izmjene.
  # OK button label
  save_anyway: Ipak spremi
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: Netko drugi ažurirao je repozitorij tijekom spremanja. Pokušajte ponovno.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Netko drugi promijenio je unos pohranjen u istoj datoteci. Pokušajte ponovno.
  # {$path} is the file path
  array_file_invalid: Datoteku {$path} nije moguće ažurirati jer ne sadrži valjani popis unosa.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
# repository while the user has it open. The change itself is described with the `save_conflict`
# strings above
remote_change:
  reload_entry: Ponovno učitaj unos
  # Confirmation shown before reloading when the user has unsaved changes
  confirm_reloading_entry: Jeste li sigurni da želite ponovno učitati unos? Vaše nespremljene promjene bit će izgubljene.

