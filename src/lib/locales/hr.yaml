    editor:
      title: Uređivač
      use_draft_backup:
        switch_label: Automatski izrađuj sigurnosne kopije skica unosa
      close_on_save:
        switch_label: Zatvori uređivač nakon spremanja skice
      close_with_escape:
        switch_label: Zatvori uređivač tipkom Escape

  # Internationalization panel
  i18n:
    title: Internacionalizacija
    translators:
      default:
        title: Zadana usluga prevođenja
        select_service: Odaberite uslugu
      api_keys:
        title: API ključevi usluga prevođenja
        description: Upravljajte API ključevima za <a>usluge prevođenja</a>. API ključevima za opće usluge umjetne inteligencije možete upravljati u postavkama umjetne inteligencije.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: Ključ za {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Registrirajte se za <a {$homeHref}>{$service}</a> i ovdje unesite <a {$apiKeyHref}>svoj API ključ</a> kako biste omogućili brzo prevođenje tekstualnih polja unosa.

  # Media panel
  media:
    title: Mediji
    stock_photos:
      api_keys:
        title: API ključevi usluga stock fotografija
        description: Upravljajte API ključevima za <a>usluge stock fotografija</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: API ključ za {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Registrirajte se za <a {$homeHref}>{$service} API</a> i ovdje unesite <a {$apiKeyHref}>svoj API ključ</a> kako biste u slikovna polja unosa mogli umetati besplatne stock fotografije.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Fotografije ustupa {$service}
      no_services: Nije konfigurirana nijedna <a>usluga stock fotografija</a>.
    cloud_storage:
      api_keys:
        title: API ključevi usluga pohrane u oblaku
        description: Upravljajte API ključevima za <a>usluge pohrane u oblaku</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: API ključ za {$service}
      no_services: Nije konfigurirana nijedna <a>usluga pohrane u oblaku</a>.

  # AI panel
  ai:
    title: Umjetna inteligencija
    api_keys:
      title: API ključevi usluga umjetne inteligencije
      description: Upravljajte API ključevima za usluge umjetne inteligencije.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: API ključ za {$service}

  # Accessibility panel
  accessibility:
    title: Pristupačnost
    underline_links:
      title: Podcrtavanje poveznica
      description: Prikaži podcrtavanje poveznica u pretpregledu unosa i oznakama korisničkog sučelja.
      switch_label: Uvijek podcrtaj poveznice

  # Data Management panel
  data:
    title: Upravljanje podacima
    clear_data:
      title: Očisti podatke
      # Clear File Cache button
      file_cache:
        description: Izbrišite lokalno predmemorirani sadržaj datoteka i sličice slika kako biste oslobodili prostor za pohranu ili riješili probleme uzrokovane zastarjelim podacima.
        button_label: Očisti predmemoriju datoteka
        confirmation: Lokalno predmemorirani sadržaj datoteka i sličice slika bit će izbrisani. Vaše nespremljene skice i postavke bit će zadržane, a izbrisani podaci po potrebi će se ponovno preuzeti ili generirati. CMS će se po završetku ponovno učitati.
      # Erase All Data button
      all_data:
        description: Izbrišite sve što CMS čuva u ovom pregledniku, uključujući predmemorirane datoteke, nespremljene skice i postavke. Ono što je već spremljeno u vašem repozitoriju neće biti zahvaćeno.
        button_label: Izbriši sve podatke
        confirmation: Svi podaci pohranjeni u ovom pregledniku bit će izbrisani, uključujući predmemorirani sadržaj datoteka, sličice slika, nespremljene skice, postavke i stanje prijave. Vaš repozitorij neće biti zahvaćen, ali sve nespremljene promjene bit će izgubljene i morat ćete se ponovno prijaviti. CMS će se po završetku ponovno učitati.

  # Developer panel
  developer:
    title: Razvoj
    developer_mode:
      title: Razvojni način rada
      description: Omogućite neke značajke namijenjene razvojnim programerima, uključujući detaljne zapise u konzoli i izvorne kontekstne izbornike.
      switch_label: Omogući razvojni način rada
    local_git:
      title: Git commitovi
      description: Commitajte svoje promjene u trenutačnu granu lokalnog repozitorija pri svakom spremanju, kao što CMS radi kada radite s udaljenim repozitorijem. Commitove zatim možete pregledati i poslati uobičajenim Git alatima.
      switch_label: Commitaj promjene u Git
      checking: Provjera repozitorija…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Promjene će biti commitane u granu {$branch} kao {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Promjene trenutačno nije moguće commitati. {$reason}
    deploy_hook:
      title: Deploy Hook
      description: Unesite URL webhooka koji će se pozvati kada ručno pokrenete objavu odabirom stavke Objavi promjene. Možete ga ostaviti praznim ako koristite GitHub Actions ili GitLab CI/CD.
      # Hook URL input
      url:
        field_label: URL hooka
        saved: URL hooka je spremljen.
        removed: URL hooka je uklonjen.
      # Authorization header input
      auth:
        field_label: Zaglavlje Authorization (npr. Bearer <token>) (neobavezno)
        saved: Zaglavlje Authorization je spremljeno.
        removed: Zaglavlje Authorization je uklonjeno.

