    one {{ Ova se zbirka približava ograničenju od {$quota} unosa. Možete stvoriti još samo {$remaining} unos. }}
    few {{ Ova se zbirka približava ograničenju od {$quota} unosa. Možete stvoriti još samo {$remaining} unosa. }}
    *   {{ Ova se zbirka približava ograničenju od {$quota} unosa. Možete stvoriti još samo {$remaining} unosa. }}

# Navigation: back links and list labels
back_to_collection: Natrag na zbirku
collection_list: Popis zbirki
back_to_collection_list: Natrag na popis zbirki
asset_folder_list: Popis mapa s resursima
back_to_asset_folder_list: Natrag na popis mapa s resursima

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: Rezultati pretraživanja
# {$terms} is the current search query text
search_results_for_x: Rezultati pretraživanja za „{$terms}”

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Sada pregledavate rezultate pretraživanja za „{$terms}”. Nismo pronašli nijedan unos. }}
    one {{ Sada pregledavate rezultate pretraživanja za „{$terms}”. Pronašli smo {$count} unos. }}
    few {{ Sada pregledavate rezultate pretraživanja za „{$terms}”. Pronašli smo {$count} unosa. }}
    *   {{ Sada pregledavate rezultate pretraživanja za „{$terms}”. Pronašli smo {$count} unosa. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Sada pregledavate rezultate pretraživanja za „{$terms}”. Nismo pronašli nijedan resurs. }}
    one {{ Sada pregledavate rezultate pretraživanja za „{$terms}”. Pronašli smo {$count} resurs. }}
    few {{ Sada pregledavate rezultate pretraživanja za „{$terms}”. Pronašli smo {$count} resursa. }}
    *   {{ Sada pregledavate rezultate pretraživanja za „{$terms}”. Pronašli smo {$count} resursa. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ Nema unosa }}
    one {{ {$count} unos }}
    few {{ {$count} unosa }}
    *   {{ {$count} unosa }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ Nema resursa }}
    one {{ {$count} resurs }}
    few {{ {$count} resursa }}
    *   {{ {$count} resursa }}

# Empty state messages
no_files_found: Nema pronađenih datoteka.
no_entries_found: Nema pronađenih unosa.

