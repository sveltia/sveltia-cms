signed_in_as_x: 'Prijavljeni ste kao {$name}'
working_with_local_repo: Rad s lokalnim repozitorijem
working_with_test_repo: Rad s testnim repozitorijem

# Account menu: action items for sign-out and app installation
sign_out: Odjava
install_as_app: Instaliraj kao aplikaciju

