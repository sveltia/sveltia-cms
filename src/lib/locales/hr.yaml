domain: Domena
# Asset type labels
image: Slika
video: Videozapis
audio: Zvuk
document: Dokument
other: Ostalo

# Toolbar toggles: show/hide panels
show_assets: Prikaži resurse
hide_assets: Sakrij resurse
show_info: Prikaži informacije
hide_info: Sakrij informacije

# Folder display labels when no specific path is configured
all_assets: Svi resursi
global_assets: Globalni resursi
# Virtual location listing the files that File/Image fields link to by URL, wherever they are hosted
linked_files: Povezane datoteke
# Badge and message shown on a linked file that couldn’t be loaded, e.g. because it has been deleted
file_unavailable: Nedostupno
file_unavailable_description: Ovu datoteku nije moguće učitati. Možda je premještena ili izbrisana.

# ==============================================================================
# Entry and Collection Actions
# ==============================================================================
# Strings related to creating, editing, and managing entries and collections.

# Message shown while entries are still being retrieved: in the entry editor, when it was opened
# with a direct link before all the data has been loaded, and on the Editorial Workflow page while
# the pull requests are being fetched. {$count} selects the form
loading_entries: |
  .input {$count :integer}
  .match $count
    1   {{ Učitavanje unosa… }}
    *   {{ Učitavanje unosa… }}
# Error message when entry cannot be found
entry_not_found: Unos nije pronađen.

# Entry creation restrictions: tooltip and advisory messages
creating_entries_disabled_by_admin: Administrator je onemogućio stvaranje novih unosa u ovoj zbirci.
# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: U ovu zbirku ne možete dodavati nove unose jer je dosegnula ograničenje od {$quota} unosa.
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$remaining :integer}
  .match $remaining
    one {{ Ova se zbirka približava ograničenju od {$quota} unosa. Možete stvoriti još samo {$remaining} unos. }}
    few {{ Ova se zbirka približava ograničenju od {$quota} unosa. Možete stvoriti još samo {$remaining} unosa. }}
    *   {{ Ova se zbirka približava ograničenju od {$quota} unosa. Možete stvoriti još samo {$remaining} unosa. }}

# Read-only restrictions set with the `readonly` option: advisory messages
readonly_cms: CMS je u načinu samo za čitanje. Možete pregledavati sadržaj i resurse, ali ne možete unositi promjene.
readonly_collection: Ova je zbirka samo za čitanje. Možete pregledavati njezin sadržaj, ali ne možete unositi promjene.
readonly_entry: Ovaj je unos samo za čitanje. Možete ga pregledavati, ali ne možete unositi promjene.
readonly_asset_folder: Ova je mapa samo za čitanje. Možete pregledavati njezine resurse, ali ne možete unositi promjene.
readonly_branch: Nemate dopuštenje za slanje promjena u granu „{$branch}”. Možete pregledavati ovaj sadržaj, ali ne možete unositi promjene.
readonly_role: Imate pristup samo za pregledavanje. Možete pregledavati sadržaj i resurse, ali ne možete unositi promjene.
readonly_reference: Unos je samo za čitanje, pa referencu nije moguće ukloniti.
# {$entries} is a comma-separated list of entries, each shown as “Collection › Entry”
cannot_rename_referenced_entry: 'Ovaj unos nije moguće preimenovati jer na njega po trenutačnom nazivu upućuju sljedeći unosi samo za čitanje: {$entries}.'
# {$entries} is a comma-separated list of entries, each shown as “Collection › Entry”
cannot_move_referenced_asset: 'Ovaj resurs nije moguće premjestiti ni preimenovati jer ga koriste sljedeći unosi samo za čitanje: {$entries}.'

# Navigation: back links and list labels
back_to_collection: Natrag na zbirku
collection_list: Popis zbirki
back_to_collection_list: Natrag na popis zbirki
asset_folder_list: Popis mapa s resursima
back_to_asset_folder_list: Natrag na popis mapa s resursima
# Back button shown in place of the one above while browsing a subfolder of an asset folder
back_to_parent_folder: Natrag na nadređenu mapu

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: Rezultati pretraživanja
# {$terms} is the current search query text
search_results_for_x: Rezultati pretraživanja za „{$terms}”

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Sada pregledavate rezultate pretraživanja za „{$terms}”. Nismo pronašli nijedan unos. }}
    one {{ Sada pregledavate rezultate pretraživanja za „{$terms}”. Pronašli smo {$count} unos. }}
    few {{ Sada pregledavate rezultate pretraživanja za „{$terms}”. Pronašli smo {$count} unosa. }}
    *   {{ Sada pregledavate rezultate pretraživanja za „{$terms}”. Pronašli smo {$count} unosa. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Sada pregledavate rezultate pretraživanja za „{$terms}”. Nismo pronašli nijedan resurs. }}
    one {{ Sada pregledavate rezultate pretraživanja za „{$terms}”. Pronašli smo {$count} resurs. }}
    few {{ Sada pregledavate rezultate pretraživanja za „{$terms}”. Pronašli smo {$count} resursa. }}
    *   {{ Sada pregledavate rezultate pretraživanja za „{$terms}”. Pronašli smo {$count} resursa. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ Nema unosa }}
    one {{ {$count} unos }}
    few {{ {$count} unosa }}
    *   {{ {$count} unosa }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ Nema resursa }}
    one {{ {$count} resurs }}
    few {{ {$count} resursa }}
    *   {{ {$count} resursa }}

# Empty state messages
no_files_found: Nema pronađenih datoteka.
no_entries_found: Nema pronađenih unosa.

# ==============================================================================
# Asset Management
# ==============================================================================
# Strings for uploading, editing, and managing assets (images, documents, etc.).

# Upload dialog: title and button label
upload_assets: Prijenos novih resursa

# New Folder button and dialog in the Asset Library
new_folder: Nova mapa
new_folder_name: Naziv mape
new_folder_create: Stvori
# {$folder} is the path of the folder the new one will be created in, starting with a slash
new_folder_description: Nova mapa bit će stvorena u mapi „{$folder}”.
# Validation errors for the new folder name
new_folder_error:
  empty: Naziv mape ne može biti prazan.
  invalid: Naziv mape ne smije sadržavati kose crte ni počinjati točkom.
  # A name the CMS itself is usually served from, e.g. `admin` or `cms`
  reserved: Datoteke u mapi s tim nazivom samo su za čitanje jer se iz nje obično poslužuje sam CMS.
  duplicate: Mapa ili datoteka s tim nazivom ovdje već postoji.
# Progress and error messages while the folder is being created
creating_folder: Stvaranje mape…
creating_folder_failed: Stvaranje mape nije uspjelo.

# Menu on a folder in the Asset Library, and the Rename Folder and Delete Folder dialogs
folder_options: Opcije mape
show_folder_options: Prikaži opcije mape
rename_folder: Preimenuj mapu
delete_folder: Izbriši mapu
# Rename Folder dialog body text
# {$count} is the number of assets in the folder, which are moved along with it
enter_new_name_for_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Unesite novi naziv u nastavku. }}
    1   {{ Unesite novi naziv u nastavku. Resurs u mapi bit će premješten zajedno s njom, a svaki unos koji ga koristi bit će ažuriran. }}
    one {{ Unesite novi naziv u nastavku. {$count} resurs u mapi bit će premješten zajedno s njom, a svi unosi koji ga koriste bit će ažurirani. }}
    few {{ Unesite novi naziv u nastavku. {$count} resursa u mapi bit će premještena zajedno s njom, a svi unosi koji ih koriste bit će ažurirani. }}
    *   {{ Unesite novi naziv u nastavku. {$count} resursa u mapi bit će premješteno zajedno s njom, a svi unosi koji ih koriste bit će ažurirani. }}
# Delete Folder confirmation
# {$name} is the folder name and {$count} is the number of assets in the folder
confirm_deleting_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Jeste li sigurni da želite izbrisati praznu mapu „{$name}”? }}
    1   {{ Jeste li sigurni da želite izbrisati mapu „{$name}” i resurs u njoj? }}
    one {{ Jeste li sigurni da želite izbrisati mapu „{$name}” i {$count} resurs u njoj? }}
    few {{ Jeste li sigurni da želite izbrisati mapu „{$name}” i {$count} resursa u njoj? }}
    *   {{ Jeste li sigurni da želite izbrisati mapu „{$name}” i {$count} resursa u njoj? }}
# Progress and error messages while the folder is being renamed or deleted
renaming_folder: Preimenovanje mape…
renaming_folder_failed: Preimenovanje mape nije uspjelo.
deleting_folder: Brisanje mape…
deleting_folder_failed: Brisanje mape nije uspjelo.
# Asset Library and asset picker: notice shown when a cloud storage service holds more files than
# are listed at once
external_assets_truncated: Na usluzi ima previše datoteka da bi se sve prikazale, pa su neke izostavljene.

# Edit options menu: button and item labels
edit_options: Opcije uređivanja
show_edit_options: Prikaži opcije uređivanja
# Copy menu aria-label
copy_options: Opcije kopiranja
# Edit menu items with specific asset names
edit_asset: Uredi resurs
# {$name} is the selected asset name
edit_x: Uredi {$name}

# Asset text editor: switch for line wrapping
wrap_long_lines: Prelomi duge retke

# Move assets: dialog for moving assets to another folder in the repository
move: Premjesti
move_asset: Premjesti resurs
# Dialog title. {$name} is the asset name when a single asset is moved, and {$count} is the number of
# assets being moved
move_assets_title: |
  .input {$count :integer}
  .match $count
    1   {{ Premjesti {$name} }}
    one {{ Premjesti {$count} resurs }}
    few {{ Premjesti {$count} resursa }}
    *   {{ Premjesti {$count} resursa }}
# Dialog body text. {$count} is the number of entries that currently use the assets
select_asset_move_destination: |
  .input {$count :integer}
  .match $count
    0   {{ Odaberite mapu u koju želite premjestiti. }}
    1   {{ Odaberite mapu u koju želite premjestiti. Ažurirat će se i unos koji koristi resurse. }}
    one {{ Odaberite mapu u koju želite premjestiti. Ažurirat će se i {$count} unos koji koristi resurse. }}
    few {{ Odaberite mapu u koju želite premjestiti. Ažurirat će se i {$count} unosa koji koriste resurse. }}
    *   {{ Odaberite mapu u koju želite premjestiti. Ažurirat će se i {$count} unosa koji koriste resurse. }}
# Accessible label of the folder tree in the Move dialog
asset_move_destination: Odredišna mapa
# Shown when the assets being moved are all in the selected folder already
assets_already_in_folder: |
  .input {$count :integer}
  .match $count
    1   {{ Resurs je već u ovoj mapi. }}
    *   {{ Resursi su već u ovoj mapi. }}
# Shown when files with the same names exist in the selected folder. {$names} is a comma-separated
# list of file names
asset_move_conflict: 'Sljedeće datoteke već postoje u ovoj mapi: {$names}.'
moving_assets: Premještanje resursa…
moving_assets_failed: Premještanje resursa nije uspjelo.
# Warning shown when files have been moved off a cloud storage service, but the originals couldn’t
# be deleted from it
asset_move_cleanup_failed: Datoteke su premještene, ali izvornike nije bilo moguće izbrisati s usluge pohrane.
# Shown when files on a cloud storage service can’t be renamed or moved, because the entries using
# them can’t be updated, e.g. for an Open Authoring contributor. {$count} is the number of files
cannot_change_used_external_files: |
  .input {$count :integer}
  .match $count
    1   {{ Ovu datoteku nije moguće preimenovati ni premjestiti jer unose koji je koriste nije moguće ažurirati. }}
    *   {{ Ove datoteke nije moguće preimenovati ni premjestiti jer unose koji ih koriste nije moguće ažurirati. }}

# Rename asset: dialog and validation
rename_asset: Preimenuj resurs
# {$name} is the current asset name
rename_x: Preimenuj {$name}
# Dialog body text indicating how many entries reference this asset
# {$count} is the number of entries that currently reference the asset
enter_new_name_for_asset: |
  .input {$count :integer}
  .match $count
    0   {{ Unesite novi naziv u nastavku. }}
    one {{ Unesite novi naziv u nastavku. Ažurirat će se i {$count} unos koji koristi taj resurs. }}
    few {{ Unesite novi naziv u nastavku. Ažurirat će se i {$count} unosa koji koriste taj resurs. }}
    *   {{ Unesite novi naziv u nastavku. Ažurirat će se i {$count} unosa koji koriste taj resurs. }}
# Validation errors for asset renaming
enter_new_name_for_asset_error:
  empty: Naziv datoteke ne može biti prazan.
  character: Naziv datoteke ne smije sadržavati posebne znakove.
  duplicate: Taj se naziv datoteke već koristi za drugi resurs.
  # A name starting with a dot hides the file, which the CMS wouldn’t list any more
  leading_dot: Naziv datoteke ne smije počinjati točkom.
  # The name of a file next to the asset that isn’t an asset, like an entry file
  file_duplicate: Ovdje već postoji druga datoteka s tim nazivom.
  # The name of a folder next to the file
  folder_duplicate: Ovdje već postoji mapa s tim nazivom.
# Shown while renaming a file whose name will be changed on saving, e.g. by the `slugify_filename`
# media library option
file_will_be_saved_as: Datoteka će biti spremljena kao „{$name}”.
# Confirmation dialog shown when the file extension is changed while renaming an asset
change_file_extension: Promijeni nastavak datoteke
# {$oldExtension} and {$newExtension} are file extensions without a leading dot, e.g. png
confirm_file_extension_change:
  change: Jeste li sigurni da želite promijeniti nastavak iz „.{$oldExtension}” u „.{$newExtension}”?
  add: Jeste li sigurni da želite dodati nastavak „.{$newExtension}”?
  remove: Jeste li sigurni da želite ukloniti nastavak „.{$oldExtension}”?
file_extension_change_warning: Datoteka se možda neće ispravno prikazati ili obraditi ako nastavak ne odgovara stvarnom formatu datoteke.

# Replace asset: menu item and dialog title
replace_asset: Zamijeni resurs
# {$name} is the asset being replaced
replace_x: Zamijeni {$name}
# File/Image field: labels of the Replace and Remove buttons
replace_file: Zamijeni datoteku
replace_image: Zamijeni sliku
remove_file: Ukloni datoteku
remove_image: Ukloni sliku

# File selection prompts: drop zones and file pickers
# Browse prompt shown when drag-and-drop is unavailable on desktop and pointer devices
click_to_browse: Kliknite za pregledavanje…
# Browse prompt shown on touch devices
tap_to_browse: Dodirnite za pregledavanje…
# Drop zone text with browse button
# {$count} is the number of files expected by the current picker mode
drop_files_or_click_to_browse: |
  .input {$count :integer}
  .match $count
    1   {{ Ispustite datoteku ovdje ili kliknite za pregledavanje… }}
    *   {{ Ispustite datoteke ovdje ili kliknite za pregledavanje… }}
# Partial drop zone text (ends with inline button)
# {$count} is the number of files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_files_or: |
  .input {$count :integer}
  .match $count
    1   {{ Ispustite datoteku ovdje ili }}
    *   {{ Ispustite datoteke ovdje ili }}
# Image-specific drop zone text
# {$count} is the number of image files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_image_files_or: |
  .input {$count :integer}
  .match $count
    1   {{ Ispustite slikovnu datoteku ovdje ili }}
    *   {{ Ispustite slikovne datoteke ovdje ili }}

# File picker and clipboard actions used by upload controls
browse: Pregledaj
# Generic clipboard paste action used by non-image file fields
paste: Zalijepi
# Clipboard paste action used by image fields
paste_image: Zalijepi sliku

# Clipboard paste errors
no_image_in_clipboard: U međuspremniku nije pronađena slika.
clipboard_access_denied: Pristup međuspremniku je odbijen.

# Drag-and-drop overlay text (shown while dragging)
# {$count} is the number of files expected by the current picker mode
drop_files_here: |
  .input {$count :integer}
  .match $count
    1   {{ Ispustite datoteku ovdje }}
    *   {{ Ispustite datoteke ovdje }}

# File type validation errors
unsupported_file_type: Nepodržana vrsta datoteke
# {$type} is the expected asset type label, such as image or document
dropped_file_type_mismatch: 'Ispuštena datoteka nije jedna od sljedećih vrsta: {$types}. Pokušajte ponovno.'
dropped_image_type_mismatch: 'Ispuštena datoteka nije podržana. Prihvaća se samo slika sljedećih vrsta: {$types}. Pokušajte ponovno.'

# File chooser button label
# {$count} is the number of files the picker allows the user to choose
choose_files: |
  .input {$count :integer}
  .match $count
    1   {{ Odaberi datoteku }}
    *   {{ Odaberi datoteke }}

# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    1   {{ Izbriši resurs }}
    *   {{ Izbriši resurse }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    1   {{ Izbriši odabrani resurs }}
    *   {{ Izbriši odabrane resurse }}
confirm_deleting_this_asset: Jeste li sigurni da želite izbrisati ovaj resurs?
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    1   {{ Jeste li sigurni da želite izbrisati odabrani resurs? }}
    one {{ Jeste li sigurni da želite izbrisati {$count} odabrani resurs? }}
    few {{ Jeste li sigurni da želite izbrisati odabrana {$count} resursa? }}
    *   {{ Jeste li sigurni da želite izbrisati odabranih {$count} resursa? }}
confirm_deleting_all_assets: Jeste li sigurni da želite izbrisati sve resurse?
# Note added to the confirmation when entries use the assets being deleted; the references are
# removed in the same commit. {$count} is the number of entries using them
deleting_referenced_assets_note: |
  .input {$count :integer}
  .match $count
    1   {{ Uklonit će se i referenca u unosu koji ga koristi. }}
    one {{ Uklonit će se i reference u {$count} unosu koji ga koristi. }}
    few {{ Uklonit će se i reference u {$count} unosa koji ga koriste. }}
    *   {{ Uklonit će se i reference u {$count} unosa koji ga koriste. }}
# Shown in place of the confirmation when removing the references would leave a field in an entry
# invalid, e.g. a required Image field with nothing left, so the deletion is refused. The fields are
# listed below the message, each with the validation error it would have. {$count} is the number of
# assets being deleted
cannot_delete_referenced_assets: |
  .input {$count :integer}
  .match $count
    1   {{ Ovaj resurs nije moguće izbrisati jer sljedeća polja u unosima koji ga koriste bez njega više ne bi bila valjana. Najprije ažurirajte te unose. }}
    *   {{ Ove resurse nije moguće izbrisati jer sljedeća polja u unosima koji ih koriste bez njih više ne bi bila valjana. Najprije ažurirajte te unose. }}
# Error shown in the asset deletion dialog when the entries using the assets couldn’t be looked up,
# so the deletion can’t go ahead. {$count} is the number of assets being deleted
checking_asset_references_failed: |
  .input {$count :integer}
  .match $count
    1   {{ Nije moguće provjeriti koji unosi koriste ovaj resurs. Zatvorite ovaj dijalog i pokušajte ponovno. }}
    *   {{ Nije moguće provjeriti koji unosi koriste ove resurse. Zatvorite ovaj dijalog i pokušajte ponovno. }}

# Delete entries: dialog titles and confirmation messages
# {$count} is the number of entries targeted by the action
delete_entries: |
  .input {$count :integer}
  .match $count
    1   {{ Izbriši unos }}
    *   {{ Izbriši unose }}
# {$count} is the number of selected entries
delete_selected_entries: |
  .input {$count :integer}
  .match $count
    1   {{ Izbriši odabrani unos }}
    *   {{ Izbriši odabrane unose }}
confirm_deleting_this_entry: Jeste li sigurni da želite izbrisati ovaj unos?
confirm_deleting_this_entry_with_assets: Jeste li sigurni da želite izbrisati ovaj unos i pripadajuće resurse?
# Error notification shown when an entry could not be deleted
deleting_entry_failed: Brisanje unosa nije uspjelo. Pokušajte ponovno.
# {$count} is the number of selected entries
confirm_deleting_selected_entries: |
  .input {$count :integer}
  .match $count
    1   {{ Jeste li sigurni da želite izbrisati odabrani unos? }}
    one {{ Jeste li sigurni da želite izbrisati {$count} odabrani unos? }}
    few {{ Jeste li sigurni da želite izbrisati odabrana {$count} unosa? }}
    *   {{ Jeste li sigurni da želite izbrisati odabranih {$count} unosa? }}
# {$count} is the number of selected entries whose associated assets would also be removed
confirm_deleting_selected_entries_with_assets: |
  .input {$count :integer}
  .match $count
    1   {{ Jeste li sigurni da želite izbrisati odabrani unos i pripadajuće resurse? }}
    one {{ Jeste li sigurni da želite izbrisati {$count} odabrani unos i pripadajuće resurse? }}
    few {{ Jeste li sigurni da želite izbrisati odabrana {$count} unosa i pripadajuće resurse? }}
    *   {{ Jeste li sigurni da želite izbrisati odabranih {$count} unosa i pripadajuće resurse? }}
confirm_deleting_all_entries: Jeste li sigurni da želite izbrisati sve unose?
confirm_deleting_all_entries_with_assets: Jeste li sigurni da želite izbrisati sve unose i pripadajuće resurse?
# Note added to the confirmation when other entries reference the entries being deleted through
# Relation fields; the references are removed in the same commit. {$count} is the number of
# referencing entries
deleting_referenced_entries_note: |
  .input {$count :integer}
  .match $count
    1   {{ Uklonit će se i referenca na njega u jednom drugom unosu. }}
    one {{ Uklonit će se i reference na njega u {$count} drugom unosu. }}
    few {{ Uklonit će se i reference na njega u {$count} druga unosa. }}
    *   {{ Uklonit će se i reference na njega u {$count} drugih unosa. }}
# Shown in place of the confirmation when removing the references would leave a Relation field in
# another entry invalid, e.g. a required field with nothing selected, so the deletion is refused.
# The fields are listed below the message, each with the validation error it would have. {$count}
# is the number of entries being deleted
cannot_delete_referenced_entries: |
  .input {$count :integer}
  .match $count
