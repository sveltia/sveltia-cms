    select_field_invalid_default: Opcija `default` polja Select postavljena je na `{$value}`, ali ta vrijednost nije među opcijama `options`.
    # Don’t localize `fields` and `types`
    list_field_no_subfields: Opcija `fields` ili `types` polja List mora imati barem jednu stavku. Za popis običnih vrijednosti izostavite tu opciju.
    # Don’t localize `default`, `fields` and `types`
    list_field_invalid_default_object: Opcija `default` polja List sadrži objekt, ali svaka stavka mora biti obična vrijednost jer polje nema opciju `fields` ni `types`.
    # {$value} is the default item from the configuration; Don’t localize `default`, `fields` and `types`
    list_field_invalid_default_item: Opcija `default` polja List sadrži `{$value}`, ali svaka stavka mora biti objekt jer polje ima opciju `fields` ili `types`.
    # {$key} is a property name of the default item from the configuration; Don’t localize `default`
    list_field_invalid_default_key: Opcija `default` polja List sadrži stavku sa svojstvom `{$key}`, ali nijedno podpolje nema taj naziv.
    # {$typeKey} is the configured type key, `type` by default; Don’t localize `default` and `types`
    list_field_default_missing_type: Opcija `default` polja List sadrži stavku bez svojstva `{$typeKey}`, koje označava jednu od vrsta u opciji `types`.
    # {$typeKey} is the configured type key, `type` by default, and {$value} is its value in the default item; Don’t localize `default` and `types`
    list_field_invalid_default_type: Opcija `default` polja List sadrži stavku čije svojstvo `{$typeKey}` ima vrijednost `{$value}`, ali ona nije među vrstama u opciji `types`.
    # Don’t localize `map_key_field`, `fields` and `types`
    list_field_map_key_no_subfields: Opcija `map_key_field` polja List zahtijeva opciju `fields` ili `types` jer se svaki ključ uzima iz podpolja.
    # {$name} is the subfield name; Don’t localize `map_key_field`
    list_field_map_key_not_found: Opcija `map_key_field` polja List upućuje na `{$name}`, ali nijedno podpolje nema taj naziv.
    # {$name} is the subfield name, and {$type} is the variable type name; Don’t localize `map_key_field`
    list_field_map_key_missing_in_type: Opcija `map_key_field` polja List upućuje na `{$name}`, ali vrsta `{$type}` nema podpolje s tim nazivom.
    # {$name} is the subfield name, and {$widget} is its field type; Don’t localize `map_key_field`
    list_field_map_key_invalid_type: Opcija `map_key_field` polja List upućuje na `{$name}`, ali to mora biti polje vrste String, Relation ili Select, a ne polje `{$widget}`.
    # {$name} is the subfield name; Don’t localize `map_key_field` and `multiple`
    list_field_map_key_multiple: Opcija `map_key_field` polja List upućuje na `{$name}`, ali to podpolje ne smije primati više vrijednosti jer svaka stavka treba jedan ključ. Uklonite njegovu opciju `multiple`.
    # {$name} is the subfield name; Don’t localize `map_key_field`
    list_field_map_key_option_not_string: Opcija `map_key_field` polja List upućuje na `{$name}`, ali opcije tog podpolja moraju imati vrijednosti u obliku niza znakova jer se svaki ključ sprema kao niz znakova.
    # {$name} is the subfield name; Don’t localize `map_key_field` and `required`
    list_field_map_key_not_required: Opcija `map_key_field` polja List upućuje na `{$name}`, ali to podpolje ne smije biti neobavezno jer svaka stavka treba ključ. Uklonite njegovu opciju `required`.
    # {$name} is the subfield name; Don’t localize `map_key_field`, `i18n: false` and `i18n: duplicate`
    list_field_map_key_not_localized: 'Opcija `map_key_field` polja List upućuje na `{$name}`, ali to podpolje ne smije imati `i18n: false` jer stavke trebaju ključ na svakom jeziku. Upotrijebite `i18n: duplicate` ili uklonite opciju.'
    # Don’t localize `i18n`, `duplicate_if_empty`, `multiple` and `true`
    duplicate_if_empty_multiple: 'Opcija `i18n: duplicate_if_empty` nije podržana za polje s opcijom `multiple`, pa se polje ponaša kao da ima `i18n: true`.'
    # Don’t localize `default` and `multiple`
    invalid_default_multiple: Opcija `default` mora biti polje (array) jer je opcija `multiple` postavljena na `true`.
    invalid_default_single: Opcija `default` mora biti jedna vrijednost, a ne polje (array), jer opcija `multiple` nije postavljena na `true`.
    # {$key} is a property name of the default object from the configuration; Don’t localize `default`
    object_field_invalid_default_key: Opcija `default` polja Object ima svojstvo `{$key}`, ali nijedno podpolje nema taj naziv.
    # {$typeKey} is the configured type key, `type` by default; Don’t localize `default` and `types`
    object_field_default_missing_type: Opcija `default` polja Object nema svojstvo `{$typeKey}`, koje označava jednu od vrsta u opciji `types`.
    # {$typeKey} is the configured type key, `type` by default, and {$value} is its value in the default object; Don’t localize `default` and `types`
    object_field_invalid_default_type: Svojstvo `{$typeKey}` opcije `default` polja Object ima vrijednost `{$value}`, ali ona nije među vrstama u opciji `types`.
    # Don’t localize `default` and `output_code_only`
    code_field_invalid_default_object: Opcija `default` polja Code mora biti niz znakova jer je opcija `output_code_only` postavljena na `true`.
    # {$key} is a property name of the default object, {$code} and {$lang} are the configured property names; Don’t localize `default` and `keys`
    code_field_invalid_default_key: Opcija `default` polja Code ima svojstvo `{$key}`, ali opcija `keys` dopušta samo `{$code}` i `{$lang}`.
    # {$valueType} is the configured value type; Don’t localize `value` and `value_type`
    compute_field_invalid_expression: Opcija `value` polja Compute mora biti valjani aritmetički izraz, poput `\{\{fields.price\}\} * \{\{fields.quantity\}\}`, jer je opcija `value_type` postavljena na `{$valueType}`.
    # {$valueType} is the configured value type; Don’t localize `value` and `value_type`
    compute_field_uuid_in_expression: Opcija `value` polja Compute ne smije koristiti UUID oznaku poput `\{\{uuid\}\}` jer je opcija `value_type` postavljena na `{$valueType}`, zbog čega je vrijednost aritmetički izraz.
    # {$value} is the default value and {$valueType} is the configured value type; Don’t localize `default` and `value_type`
    number_field_default_not_integer: Opcija `default` polja Number postavljena je na `{$value}`, ali mora biti cijeli broj jer je opcija `value_type` postavljena na `{$valueType}`.
    number_field_default_not_number: Opcija `default` polja Number postavljena je na `{$value}`, ali mora biti broj jer je opcija `value_type` postavljena na `{$valueType}`.
    # Don’t localize `fields` and `types`
    object_field_no_subfields: Opcija `fields` ili `types` polja Object mora imati barem jednu stavku.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: Referencirana zbirka `{$collection}` nije valjana ili nije definirana.
    relation_field_invalid_collection_file: Referencirana datoteka `{$file}` nije valjana ili nije definirana.
    # Don’t localize `file`
    relation_field_missing_file_name: Opcija `file` mora biti definirana za relaciju prema zbirci datoteka.
    relation_field_invalid_value_field: Referencirano polje vrijednosti `{$field}` nije valjano ili nije definirano.
    # {$collection} is the referenced collection name; Don’t localize `file`, `value_field` and `slug`.
    # The curly brackets are escaped with backslashes for MessageFormat 2
    relation_field_array_file_slug: Relacija prema zbirci `{$collection}` ne može spremati vrijednost `\{\{slug\}\}` jer je slug unosa u zbirci s opcijom `file` njegov položaj, koji se mijenja pri promjeni redoslijeda ili brisanju unosa. Umjesto toga postavite opciju `value_field` na polje s jedinstvenom vrijednošću.
    # {$collection} is the referenced collection name; Don’t localize `file`
    relation_field_array_file_workflow: Zbirka s opcijom `file` ne može imati relaciju prema zbirci `{$collection}`, koja koristi uredničko radno okruženje ili radno okruženje pretpregleda, jer se reference na unos koji je ondje preimenovan ili izbrisan ne mogu ažurirati u datoteci.
    relation_field_invalid_display_field: Referencirano polje za prikaz `{$field}` nije valjano ili nije definirano.
    relation_field_invalid_search_field: Referencirano polje za pretraživanje `{$field}` nije valjano ili nije definirano.
    relation_field_invalid_filter_field: Referencirano polje za filtriranje `{$field}` nije valjano ili nije definirano.
    relation_field_invalid_sort_field: Referencirano polje za sortiranje `{$field}` nije valjano ili nije definirano.
    # Don’t localize `sort_by` and `file`
    relation_field_sort_by_file_ignored: Opcija `sort_by` ne primjenjuje se na relaciju prema datoteci, čije opcije prate redoslijed stavki popisa. Bit će zanemarena.
    unexpected: Neočekivana pogreška

    # Schema validation errors, reported when the configuration doesn’t match the published JSON
    # schema. In all of these, {$option} is a configuration option path such as `backend.name` or
    # `view_filters[0].pattern`, relative to the collection, file or field named before it.
    # {$type} is a value type name from `schema_value_type` below
    schema_invalid_type: Opcija `{$option}` mora biti {$type}.
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'Opcija `{$option}` mora biti jedna od sljedećih vrijednosti: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: Opcija `{$option}` mora biti `{$value}`.
    schema_invalid_empty_value: Opcija `{$option}` mora biti prazan niz znakova.
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: Opcija `{$option}` mora biti polje s {$count} stavki.
    schema_invalid_value: Opcija `{$option}` ima nevaljanu vrijednost.
    schema_missing_option: Opcija `{$option}` je obavezna.
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Obavezna je jedna od sljedećih opcija: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: niz znakova
      number: broj
      integer: cijeli broj
      boolean: logička vrijednost
      array: polje
      object: objekt
      'null': prazna

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: ID OAuth aplikacije nije definiran. Korisnici se moraju prijaviti pomoću pristupnog tokena.
    # Don’t localize `prefix`
    site_library_prefix_template: Opcija `prefix` medijske biblioteke sadrži oznake predloška, koje su podržane samo na razini polja jer na najvišoj razini ne postoji unos kojim bi se ispunile.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: Opcija `{$prop}` nije podržana u Sveltia CMS-u. Bit će zanemarena.
    # Don’t localize `stages`, `publish_mode`, `editorial_workflow` and {$type}, which is `preview` or `simple`
    publish_mode_stages_ignored: Opcija `stages` opcije `publish_mode` primjenjuje se samo na način objave `editorial_workflow`, pa se uz `{$type}` zanemaruje.
    # Don’t localize `pattern`, `m` and `s`
    inline_component_multiline_pattern: Opcija `pattern` ove ugrađene komponente ima zastavicu `m` ili `s` ili odgovara prijelomima redaka, ali ugrađena komponenta prepoznaje se samo unutar odlomka.
    # {$name} is a button or component name and {$option} is `buttons` or `editor_components`; Don’t localize them and `multiline: false`
    single_line_block_item: 'Stavka `{$name}` opcije `{$option}` zanemaruje se jer polje s `multiline: false` može sadržavati samo sadržaj unutar retka.'
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Postavljeni su i `picker_utc` i novije opcije vremenske zone (`input_timezone` ili `output_utc`). Nove opcije imaju prednost. Razmislite o uklanjanju opcije `picker_utc` iz konfiguracije.
    # Don’t localize `localize_format` and `format`
    localize_format_without_format: Opcija `localize_format` nema učinka jer polje nema opciju `format`, a njegova se vrijednost sprema u formatu ISO 8601.
    # {$name} is a template tag like `fields.lines.*.price`; Don’t localize `value`, `*` and `sum()`
    compute_field_wildcard_without_item: Opcija `value` polja Compute upućuje na `{$name}`, ali polje nije u stavci popisa koji `*` predstavlja, pa se razrješava u ništa. Samo agregatna funkcija poput `sum()` može koristiti sve stavke popisa.
    # {$name} is a template tag like `fields.lines.*.amount`; Don’t localize `value`
    compute_field_self_reference: Opcija `value` polja Compute upućuje na samo polje kao `{$name}`, pa se njegova vrijednost mijenja pri svakom izračunu i nikada se ne ustali.
    # {$name} is a template tag like `fields.total`; Don’t localize `value`
    compute_field_reference_cycle: Opcija `value` polja Compute upućuje na `{$name}`, drugo polje Compute koje upućuje natrag na ovo polje, izravno ili preko drugih polja, pa se njihove vrijednosti nikada ne ustale.
    # Don’t localize `localize_format`, `true` and `de`
    localize_format_without_i18n: Opcija `localize_format` postavljena je na `true`, ali i18n nije omogućen za zbirku, pa se vrijednost zapisuje na engleskom. Umjesto toga postavite opciju na kôd jezika poput `de`.
    # {$locale} is the locale code from the configuration; Don’t localize `localize_format`
    localize_format_unsupported_locale: Opcija `localize_format` postavljena je na `{$locale}`, što nije podržani jezik, pa se vrijednost zapisuje na engleskom.
    # Don’t localize `preview_path`
    preview_path_no_date_field: Opcija `preview_path` koristi oznake datuma i vremena, ali zbirka nema polje DateTime iz kojeg bi ih čitala, pa se poveznica na pretpregled neće prikazati.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: Opcija `preview_path_date_field` upućuje na polje naziva `{$name}`, ali polje DateTime s tim nazivom nije definirano, pa se poveznica na pretpregled neće prikazati.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: Opcija `preview_path` upućuje na `{$name}`, ali takvo polje nije definirano u zbirci, pa se poveznica na pretpregled neće prikazati.
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: Zbirka nema polje `{$name}` kojim bi se imenovali novi unosi, pa svaki novi unos dobiva nasumični slug. Dodajte polje `{$name}` ili postavite opciju `identifier_field` ili `slug`.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: Opcija `i18n` opcije `slug` nema učinka jer zbirka ne koristi i18n strukturu `multiple_files`, `multiple_folders` ili `multiple_root_folders`, u kojoj svaki jezik ima vlastitu datoteku.
    # Don’t localize `slug`, `template` and `auto_increment`
    slug_template_ignored: Opcija `template` opcije `slug` zanemaruje se jer opcija `auto_increment` umjesto toga numerira slugove.
    # {$file} is the file path; Don’t localize `file`, `locale`, `i18n`, `false`,
    # `omit_default_locale_from_file_path` and the example paths. The curly brackets in the examples
    # are escaped with backslashes for MessageFormat 2
    locale_not_omitted_from_file_path: Rezervirano mjesto `locale` nije moguće ukloniti iz putanje `file` `{$file}`, pa zadani jezik u njoj ostaje unatoč i18n opciji `omit_default_locale_from_file_path`. Da biste izostavili jezik, upotrijebite rezervirano mjesto kao cijeli naziv mape, primjerice `\{\{locale\}\}/about.md`, ili između naziva datoteke i nastavka, primjerice `about.\{\{locale\}\}.md`. Da biste ga zadržali, postavite opciju na `false` u opciji `i18n` datoteke.
    # Don’t localize `i18n`
    i18n_not_configured: Opcija `i18n` je omogućena, ali i18n nije konfiguriran na najvišoj razini konfiguracije ni u zbirci, pa opcija nema učinka.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: Opcija `public_folder` prazan je niz znakova, pa se za putanje resursa spremljene u unosima umjesto nje koristi putanja `media_folder`. Uklonite opciju ili je postavite na putanju koju želite koristiti, primjerice `/images`.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: Opcija `{$option}` nije definirana u shemi konfiguracije Sveltia CMS-a. Bit će zanemarena. Provjerite postoji li pogreška u pisanju ili sintaksi.
    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: Opcija `default_localized` nema učinka jer i18n nije omogućen za zbirku. Umjesto nje upotrijebite opciju `default`.
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: Opcija `default_localized` ima vrijednost za `{$locale}`, koji nije među jezicima zbirke, pa se ta vrijednost nikada ne koristi.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Pojedinosti potražite u napomenama o kompatibilnosti: {$link}'

  # Console tip shown after config load
  schema_tip: Za bolje razvojno iskustvo možete provjeriti svoju konfiguracijsku datoteku prema JSON shemi Sveltia CMS-a. Pojedinosti potražite na {$link}.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Lokalno
  # Browser compatibility warnings
  unsupported_browser: Lokalno radno okruženje nije podržano u vašem pregledniku. Upotrijebite Chrome ili Edge.
  disabled: Lokalno radno okruženje onemogućeno je u vašem pregledniku. <a>Evo kako ga omogućiti</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Sada pregledavate ploču uredničkog radnog okruženja. Skice: {$draft}. Na pregledu: {$review}. Spremno: {$ready}. Čeka brisanje: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Sada pregledavate ploču uredničkog radnog okruženja. Skice: {$draft}. Na pregledu: {$review}. Čeka brisanje: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'Sada pregledavate ploču uredničkog radnog okruženja. Skice: {$draft}. Spremno: {$ready}. Čeka brisanje: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'Sada pregledavate stranicu Skice. Skice: {$draft}. Čeka brisanje: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Skica
  drafts: Skice
  in_review: Na pregledu
  ready: Spremno
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Čeka brisanje
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: Uvođenje

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Otkaži brisanje
  confirm_cancelling_deletion: Jeste li sigurni da želite otkazati ovo brisanje? Unos će ostati objavljen.
  confirm_completing_deletion: Jeste li sigurni da želite izbrisati ovaj unos? Bit će odmah uklonjen.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      1   {{ Unos je označen za brisanje. }}
      one {{ Označen je {$count} unos za brisanje. }}
      few {{ Označena su {$count} unosa za brisanje. }}
      *   {{ Označeno je {$count} unosa za brisanje. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      1   {{ Promjene su odbačene. }}
      one {{ Odbačene su promjene u {$count} unosu. }}
      few {{ Odbačene su promjene u {$count} unosa. }}
      *   {{ Odbačene su promjene u {$count} unosa. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Otkazivanje brisanja…
  deletion_cancelled: Brisanje je otkazano.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Otkazivanje brisanja nije uspjelo. Pokušajte ponovno.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Neobjavljeni unosi
  published_entries: Objavljeni unosi
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Status: {$status}'
  change_entry_status: Promijeni status unosa
  # Editor toolbar: progress label while the status is being changed
  changing_status: Promjena statusa…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Ažuriranje statusa…
  status_updated: Status je ažuriran.
  # Error notification when the status could not be changed
  status_change_failed: Promjena statusa nije uspjela. Pokušajte ponovno.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: Osvježi
  refreshing: Osvježavanje…
  refreshed: Ploča je ažurna.
  # Error notification when the board could not be refreshed
  refresh_failed: Osvježavanje ploče nije uspjelo. Pokušajte ponovno.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: Unos sadrži pogreške. Ispravite ih prije promjene statusa.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: Unos sadrži pogreške. Ispravite ih prije objave.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Pošalji na pregled
  confirm_sending_for_review: Vaše su promjene spremljene kao skica. Želite li poslati unos na pregled kako bi ga netko mogao pregledati i objaviti?
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: Označi kao spremno
  confirm_marking_as_ready: Vaše su promjene spremljene kao skica. Želite li označiti unos kao spreman kako bi se mogao objaviti?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Objavi unos
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Odbaci promjene
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Jeste li sigurni da želite izbrisati ovaj unos? Neće biti uklonjen dok se brisanje ne objavi. Do tada ćete ga i dalje pronaći na popisu unosa, označen kao „Čeka brisanje”.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Ovaj unos još nije objavljen, pa će brisanjem biti u potpunosti odbačen.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Ovaj unos ima neobjavljene promjene. Njihovim odbacivanjem vratit će se objavljena verzija. Sam unos neće biti izbrisan.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      1   {{ Još nije objavljen, pa će vaše neobjavljene promjene biti odbačene. Objavljena verzija, ako postoji, ostat će objavljena. }}
      *   {{ Još nisu objavljeni, pa će vaše neobjavljene promjene biti odbačene. Objavljene verzije, ako postoje, ostat će objavljene. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      1   {{ Jedan od njih još nije objavljen, pa će vaše neobjavljene promjene biti odbačene. Objavljena verzija, ako postoji, ostat će objavljena. }}
      one {{ {$count} njih još nije objavljen, pa će vaše neobjavljene promjene biti odbačene. Objavljena verzija, ako postoji, ostat će objavljena. }}
      few {{ {$count} njih još nisu objavljena, pa će vaše neobjavljene promjene biti odbačene. Objavljene verzije, ako postoje, ostat će objavljene. }}
      *   {{ {$count} njih još nije objavljeno, pa će vaše neobjavljene promjene biti odbačene. Objavljene verzije, ako postoje, ostat će objavljene. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: Jeste li sigurni da želite objaviti ovaj unos? Vaše promjene bit će objavljene nakon ponovne izgradnje web-mjesta.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Objavljivanje unosa…
  entry_published: Unos je objavljen.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Brisanje unosa…
  discarding_changes: Odbacivanje promjena…
  entry_deleted: Unos je izbrisan.
  # Error notification when publishing fails
  publishing_entry_failed: Objava unosa nije uspjela. Pokušajte ponovno.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: Ovaj unos nije moguće objaviti ovdje jer uključuje druge promjene koje vam CMS ne može prikazati. Zamolite razvojnog programera da ga pregleda.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: Unos je promijenjen nakon što ste ga otvorili. Ponovno učitajte stranicu kako biste pregledali najnoviju verziju prije objave.
  review_on_x: Pregledaj na usluzi {$service}
  from_fork: Iz forka
  fork_entry_editable: Ovaj unos potječe iz zahtjeva za povlačenje suradnika otvorenog iz „{$fork}”. Vaše se promjene spremaju u njegovu granu. Pregledajte i spojite zahtjev za povlačenje na Git usluzi.
  fork_entry_locked: Ovaj unos potječe iz zahtjeva za povlačenje suradnika otvorenog iz „{$fork}”. Suradnik ne dopušta održavateljima da ga uređuju, pa ga ovdje možete samo pregledavati.
  fork_not_editable: Suradnik ne dopušta održavateljima da uređuju ovaj zahtjev za povlačenje.
  fork_entry_gone: Zahtjev za povlačenje suradnika više nije otvoren, pa se promjene u njega ne mogu spremiti.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: Za ovaj je unos izvan CMS-a već otvoren drugi zahtjev ({$number}). Zamolite razvojnog programera da ga najprije zatvori.
  # Workflow page: empty column message
  no_entries: Nema unosa.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Povucite za promjenu statusa
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Brisanje
  # Workflow page: note on a card listing the new entries that were created from a Relation field
  # of the entry and are published along with it, e.g. “Also adds Section: Getting Started”
  companion_entries: Dodaje i {$entries}
  # Workflow page: note on a card listing the existing entries that were edited from a Relation
  # field of the entry and are published along with it, e.g. “Also changes Author: Ada Lovelace”
  edited_companion_entries: Mijenja i {$entries}
  # Workflow page: one of the entries listed by `companion_entries` or `edited_companion_entries`,
  # named by its collection’s singular label and its title
  companion_entry: '{$collection}: {$title}'

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: Poruka commita
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: Opišite svoje promjene. Poruka se bilježi u povijesti zajedno s njima.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: Dodajte napomenu poruci koja se bilježi u povijesti zajedno s vašim promjenama, primjerice broj problema. Može ostati prazna.
  # Accessible name of the text box when the user writes the whole message
  message: Poruka commita
  # Accessible name of the text box when the text is added before or after the message
  addition: Napomena
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'Poruka: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Forkaj repozitorij
  fork: Forkaj
  confirm_forking_repository: Da biste predložili promjene za „{$repo}”, na vašem računu mora se stvoriti fork repozitorija. Vaše se promjene spremaju u taj fork, a održavatelj ih pregledava prije objave.
  # Error shown when the user declined the dialog above
  fork_declined: Za predlaganje promjena trebate fork repozitorija na svojem računu.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Nije moguće stvoriti fork repozitorija „{$repo}” na vašem računu.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: Vaš fork „{$fork}” nema granu „{$branch}”. Ažurirajte fork iz repozitorija „{$repo}”, a zatim se ponovno prijavite.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Nije moguće provjeriti vaš pristup repozitoriju „{$repo}”. Pokušajte ponovno za trenutak.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Repozitorij „{$repo}” ne dopušta forkove. Zamolite održavatelja da omogući forkanje.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Imate pozivnicu na čekanju za repozitorij „{$repo}”. Prihvatite je na GitHubu, a zatim se ponovno prijavite.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Vaša prijava ne uključuje pristup privatnim repozitorijima, pa repozitorij „{$repo}” nije moguće čitati. Zamolite održavatelja da provjeri postavke provjere autentičnosti CMS-a.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Samo održavatelj može objaviti promjene na ovom web-mjestu. Umjesto toga označite svoj unos kao „Na pregledu” i netko će ga pogledati.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: Održavatelj je već objavio ovaj unos, pa nema više ničega za pregledati.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Ovu promjenu nije moguće izravno napraviti. Na pregled se mogu predložiti samo uređivanja unosa.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Vaše se promjene spremaju u vaš fork ovog repozitorija na „{$repo}” i pregledavaju prije objave.
  view_fork: Prikaži fork

