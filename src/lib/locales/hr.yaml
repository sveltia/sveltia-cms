      1   {{ U konfiguraciji CMS-a postoji pogreška. Riješite problem i pokušajte ponovno. }}
      *   {{ U konfiguraciji CMS-a postoje pogreške. Riješite probleme i pokušajte ponovno. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: zbirka {$collection}
    file: datoteka {$file}
    component: komponenta {$component}
    # Don’t localize `{$field}`
    field: polje `{$field}`

