# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: Недійсні файли
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    1   {{ Цей файл не можна завантажити, оскільки він пошкоджений або його вміст не відповідає розширенню файлу. Це часто трапляється, коли фотографію перейменовують замість того, щоб конвертувати, наприклад зображення HEIC зберігають як файл JPEG. Конвертуйте файл і спробуйте ще раз. }}
    *   {{ Ці файли не можна завантажити, оскільки вони пошкоджені або їхній вміст не відповідає розширенням файлів. Це часто трапляється, коли фотографії перейменовують замість того, щоб конвертувати, наприклад зображення HEIC зберігають як файли JPEG. Конвертуйте файли і спробуйте ще раз. }}
# {$count} is the number of files that are not of a type the field accepts, even once transformed
# {$types} is the list of accepted file types, such as “.pdf or .txt”
warning_unsupported_files: |
  .input {$count :integer}
  .match $count
    1    {{ Цей файл не можна завантажити, оскільки він не належить до жодного з таких типів: {$types}. }}
    *    {{ Ці файли не можна завантажити, оскільки вони не належать до жодного з таких типів: {$types}. }}
# {$count} is the number of files that are not of an image type the field accepts
# {$types} is the list of accepted image formats, such as “PNG or WebP”
warning_unsupported_image_files: |
  .input {$count :integer}
  .match $count
    1    {{ Цей файл не можна завантажити, оскільки приймається лише зображення таких типів: {$types}. }}
    *    {{ Ці файли не можна завантажити, оскільки приймаються лише зображення таких типів: {$types}. }}

# File format validation when replacing an asset
# Warning section for replacement files that are in a different format
