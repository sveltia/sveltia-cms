  'true': Так
  'false': Ні

# ==============================================================================
# Cloud Storage Services
# ==============================================================================
# Strings for external cloud storage service integrations.

cloud_storage:
  # Configuration error
  invalid: Службу налаштовано неправильно.

  # Authentication states
  auth:
    api_key:
      key_label: Ключ API
      # {$key} is the credential label, e.g., API Key, and {$service} is the cloud service name
      initial: Введіть свій {$key} для {$service}.
      requested: Перевірка…
      # {$key} is the credential label the user entered, e.g., API Key
      error: Наданий {$key} недійсний. Перевірте ще раз і спробуйте знову.
    password:
      # {$service} is the cloud service name
      initial: Введіть свій пароль для {$service}.
      requested: Вхід…
      error: Логін або пароль неправильні. Перевірте ще раз і спробуйте знову.

  # Service-specific configurations
  cloudinary:
    iframe_title: Медіабібліотека Cloudinary
    activate:
      button_label: Активувати Cloudinary
      description: Після входу знову натисніть кнопку «Увійти», щоб продовжити.
    auth_key_label: Секрет API
    open_library: Відкрити Cloudinary

  uploadcare:
    auth_key_label: Секретний ключ API

  aws_s3:
    auth_key_label: Секретний ключ доступу

  cloudflare_r2:
    auth_key_label: Секретний ключ доступу

  digitalocean_spaces:
    auth_key_label: Секретний ключ доступу

# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      1   {{ У конфігурації CMS є помилка. Вирішіть проблему та спробуйте ще раз. }}
      *   {{ У конфігурації CMS є помилки. Вирішіть проблеми та спробуйте ще раз. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: колекція {$collection}
    file: файл {$file}
    component: компонент {$component}
    # Don’t localize `{$field}`
    field: поле `{$field}`

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS працює лише з URL-адресами HTTPS або localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        1   {{ URL-адреса файлу конфігурації має використовувати протокол HTTPS або адресу localhost. }}
        *   {{ URL-адреси файлу конфігурації мають використовувати протокол HTTPS або адреси localhost. }}
    fetch_failed: Не вдалося отримати файл конфігурації.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: HTTP-відповідь повернулася зі статусом {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Не вдалося отримати файл конфігурації. Щоб запобігти завантаженню файлу `config.yml`, додайте <a>`load_config_file: false`</a> до конфігурації, що передається в `CMS.init()`.'
    parse_failed: Не вдалося розібрати файл конфігурації.
    parse_failed_invalid_object: Файл конфігурації не є дійсним об’єктом JavaScript.
    parse_failed_unsupported_type: Файл конфігурації має непідтримуваний тип. Підтримуються лише YAML, TOML і JSON.
    no_collection: Колекції не визначено.
    # Don’t localize `hide`
    no_visible_collection: Принаймні одна колекція має бути видимою. Перевірте параметр `hide`.
    missing_backend: Бекенд не визначено.
    missing_backend_name: Назву бекенду не визначено.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Бекенд {$name} <a>не підтримується</a> в Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Застарілий бекенд {$name} <a>не підтримується</a> в Sveltia CMS.
    unsupported_custom_backend: Власні бекенди <a>не підтримуються</a> в Sveltia CMS.
    unsupported_backend_suggestion: Натомість використовуйте один із <a>бекендів, що підтримуються</a>.
    missing_repository: Репозиторій не визначено.
    invalid_repository: Налаштований репозиторій недійсний. Він має бути у форматі «owner/repo».
    oauth_implicit_flow: Налаштований метод автентифікації (implicit flow) не підтримується в Sveltia CMS. Використовуйте інший <a>метод автентифікації</a>.
    github_pkce_unsupported: Авторизація PKCE поки не підтримується через обмеження GitHub. Використовуйте інший <a>метод автентифікації</a>.
    oauth_no_app_id: Ідентифікатор OAuth-застосунку не визначено.
    # Don’t localize `open_authoring` and `editorial_workflow`
    open_authoring_no_workflow: Параметр `open_authoring` вимагає режиму публікації `editorial_workflow`. Подробиці див. у <a>документації</a>.
    # Don’t localize `auth_methods`
    no_auth_methods: Параметр `auth_methods` має містити щонайменше один метод.
    missing_media_folder: Теку медіа не визначено.
    public_folder_relative_path: Налаштована публічна тека недійсна. Вона має бути абсолютним шляхом, що починається з «/».
    public_folder_absolute_url: Абсолютний URL для параметра публічної теки не підтримується в Sveltia CMS.
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: Параметр `transformations` містить непідтримуваний ключ `{$key}`. Це має бути `raster_image`, `svg` або підтримуваний формат растрового зображення.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: Параметр `quality` для перетворення `{$key}` недійсний. Це має бути ціле число від 0 до 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: Параметр `{$prop}` для перетворення `{$key}` недійсний. Це має бути додатне ціле число.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: Колекція ресурсів {$count} повинна мати параметр `name`, визначений як непорожній рядок.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Назва колекції ресурсів `{$name}` недійсна. Вона не може містити спеціальних символів.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Назви колекцій ресурсів мають бути унікальними, але `{$name}` використовується більше одного разу.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_no_options: Колекція повинна мати визначений один із параметрів `folder`, `files` або `divider`.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_multiple_options: Колекція не може мати параметри `folder`, `files` та `divider` одночасно.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: Розширення `{$extension}` не відповідає формату `{$format}`.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Шаблон слага `{$slug}` недійсний, оскільки не може містити косих рисок `/`. Щоб організувати записи в підтеках, використовуйте параметр `path` замість `slug`.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: Параметр `reorder` посилається на групу подання з назвою `{$name}`, але такої групи не визначено в параметрі `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: Параметр `sortable_fields` посилається на поле з назвою `{$name}`, але такого поля не визначено в колекції.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: Параметр `view_groups` посилається на поле з назвою `{$name}`, але такого поля не визначено в колекції.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: Параметр `view_filters` посилається на поле з назвою `{$name}`, але такого поля не визначено в колекції.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: Група подання {$count} повинна мати параметр `name`, визначений як непорожній рядок.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: Назва групи подання `{$name}` недійсна. Вона не повинна містити спеціальних символів.
    duplicate_view_group_name: Назви груп подання мають бути унікальними, але `{$name}` використовується більше ніж один раз.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: Фільтр подання {$count} повинен мати параметр `name`, визначений як непорожній рядок.
    # {$name} is the invalid or duplicate view filter name
    invalid_view_filter_name: Назва фільтра подання `{$name}` недійсна. Вона не повинна містити спеціальних символів.
    duplicate_view_filter_name: Назви фільтрів подання мають бути унікальними, але `{$name}` використовується більше ніж один раз.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: Колекція {$count} повинна мати параметр `name`, визначений як непорожній рядок.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: Назва колекції `{$name}` недійсна. Вона не може містити спеціальних символів.
    duplicate_collection_name: Назви колекцій мають бути унікальними, але `{$name}` використовується більше одного разу.
    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
    missing_collection_file_name: Файл колекції {$count} повинен мати параметр `name`, визначений як непорожній рядок.
    # {$name} is the invalid or duplicate collection file name
    invalid_collection_file_name: Назва файлу колекції `{$name}` недійсна. Вона не може містити спеціальних символів.
    duplicate_collection_file_name: Назви файлів колекцій мають бути унікальними, але `{$name}` використовується більше одного разу.
    # Don’t localize `fields`
    collection_no_fields: Колекція повинна мати параметр `fields` із щонайменше одним полем.
    # Don’t localize `fields`
    collection_file_no_fields: Файл колекції повинен мати параметр `fields` із щонайменше одним полем.
    # Don’t localize `i18n`, `locale` and `file`
    collection_file_i18n_required: Файл колекції повинен мати визначений параметр `i18n`, якщо в шляху `file` використовується заповнювач `locale`.
    # {$count} is the 1-based field index in the current fields array; Don’t localize `name`
    missing_field_name: Поле {$count} повинно мати параметр `name`, визначений як непорожній рядок.
    # {$name} is the invalid or duplicate field name
    invalid_field_name: Назва поля `{$name}` недійсна. Вона не може містити спеціальних символів. Якщо ви хочете вкладати поля, <a>використовуйте поля Object замість крапкової нотації</a>.
    duplicate_field_name: Назви полів мають бути унікальними, але `{$name}` використовується більше одного разу.
    # {$count} is the 1-based variable type index in the current types array
    missing_variable_type: Змінний тип {$count} повинен мати параметр `name`, визначений як непорожній рядок.
    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: Назва змінного типу `{$name}` недійсна. Вона не може містити спеціальних символів.
    duplicate_variable_type: Назви змінних типів мають бути унікальними, але `{$name}` використовується більше одного разу.
    date_field_type: 'Застарілий тип поля Date не підтримується в Sveltia CMS. Натомість використовуйте тип поля DateTime з параметром `type: date`.'
    # {$timeZone} is the invalid IANA timezone identifier from the configuration
    invalid_timezone: 'Недійсний часовий пояс: {$timeZone}. Має бути дійсним ідентифікатором часового поясу IANA, наприклад `America/New_York` або `Asia/Tokyo`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: Застарілий параметр `{$prop}` не підтримується в Sveltia CMS. Натомість використовуйте параметр `{$newProp}`.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: Параметр `allow_multiple` не підтримується в Sveltia CMS. Натомість використовуйте параметр `multiple`, який за замовчуванням має значення `false`.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: Поле List не може мати параметри `field`, `fields` та `types` одночасно.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: Змінний тип поля List недійсний. Параметр `widget` встановлено на `{$widget}`, але він має бути `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: Поле Object не може мати параметри `fields` та `types` одночасно.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: Колекція `{$collection}`, на яку є посилання, недійсна або не визначена.
    relation_field_invalid_collection_file: Файл `{$file}`, на який є посилання, недійсний або не визначений.
    # Don’t localize `file`
    relation_field_missing_file_name: Параметр `file` має бути визначений для зв’язку з файловою колекцією.
    relation_field_invalid_value_field: Поле значення `{$field}`, на яке є посилання, недійсне або не визначене.
    unexpected: Неочікувана помилка

    # Schema validation errors, reported when the configuration doesn’t match the published JSON
    # schema. In all of these, {$option} is a configuration option path such as `backend.name` or
    # `view_filters[0].pattern`, relative to the collection, file or field named before it.
    # {$type} is a value type name from `schema_value_type` below
    schema_invalid_type: Параметр `{$option}` має бути {$type}.
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'Параметр `{$option}` має мати одне з таких значень: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: Параметр `{$option}` має мати значення `{$value}`.
    schema_invalid_empty_value: Параметр `{$option}` має бути порожнім рядком.
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: Параметр `{$option}` має бути масивом із {$count} елементів.
    schema_invalid_value: Параметр `{$option}` має недійсне значення.
    schema_missing_option: Параметр `{$option}` обов’язковий.
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Потрібен один із таких параметрів: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: рядком
      number: числом
      integer: цілим числом
      boolean: логічним значенням
      array: масивом
      object: об’єктом
      'null': порожнім

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: Ідентифікатор OAuth-застосунку не визначено. Користувачі повинні надати токен доступу для входу.
    editorial_workflow_unsupported: Редакційний процес поки не підтримується в Sveltia CMS.
    open_authoring_unsupported_backend: Open Authoring наразі підтримується лише з бекендом GitHub.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: Параметр `{$prop}` не підтримується в Sveltia CMS. Його буде проігноровано.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Встановлено як `picker_utc`, так і новіші параметри часового поясу (`input_timezone` або `output_utc`). Новіші параметри мають пріоритет. Розгляньте можливість видалення `picker_utc` з вашої конфігурації.
    # Don’t localize `preview_path`
    preview_path_no_date_field: Параметр `preview_path` використовує теги дати й часу, але в колекції немає поля DateTime, з якого їх можна прочитати, тому посилання на попередній перегляд не буде показано.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: Параметр `preview_path_date_field` посилається на поле з назвою `{$name}`, але поля DateTime з такою назвою не визначено, тому посилання на попередній перегляд не буде показано.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: Параметр `preview_path` посилається на `{$name}`, але такого поля не визначено в колекції, тому посилання на попередній перегляд не буде показано.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: Параметр `{$option}` не визначено в схемі конфігурації Sveltia CMS. Його буде проігноровано. Перевірте, чи немає одруку або синтаксичної помилки.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Докладніше дивиться у примітках щодо сумісності: {$link}'

  # Console tip shown after config load
  schema_tip: Для кращого досвіду розробки ви можете перевірити свій файл конфігурації за JSON-схемою Sveltia CMS. Докладніше дивиться {$link}.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Локальний
  # Browser compatibility warnings
  unsupported_browser: Локальний робочий процес не підтримується у вашому браузері. Використовуйте Chrome або Edge.
  disabled: Локальний робочий процес вимкнено у вашому браузері. <a>Ось як його ввімкнути</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Ви переглядаєте дошку редакційного процесу. Чернетки: {$draft}. На розгляді: {$review}. Готово: {$ready}. Очікують видалення: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Ви переглядаєте дошку редакційного процесу. Чернетки: {$draft}. На розгляді: {$review}. Очікують видалення: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Чернетка
  drafts: Чернетки
  in_review: На розгляді
  ready: Готово
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Очікує видалення

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Скасувати видалення
  confirm_cancelling_deletion: Ви впевнені, що хочете скасувати це видалення? Запис залишиться опублікованим.
  confirm_completing_deletion: Ви впевнені, що хочете видалити цей запис? Його буде видалено негайно.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      1    {{ Запис позначено на видалення. }}
      one  {{ {$count} запис позначено на видалення. }}
      few  {{ {$count} записи позначено на видалення. }}
      many {{ {$count} записів позначено на видалення. }}
      *    {{ {$count} записів позначено на видалення. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      1    {{ Зміни відхилено. }}
      one  {{ Зміни в {$count} записі відхилено. }}
      few  {{ Зміни в {$count} записах відхилено. }}
      many {{ Зміни в {$count} записах відхилено. }}
      *    {{ Зміни в {$count} записах відхилено. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Скасування видалення…
  deletion_cancelled: Видалення скасовано.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Не вдалося скасувати видалення. Спробуйте ще раз.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Неопубліковані записи
  published_entries: Опубліковані записи
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Статус: {$status}'
  change_entry_status: Змінити статус запису
  # Editor toolbar: progress label while the status is being changed
  changing_status: Зміна статусу…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Оновлення статусу…
  status_updated: Статус оновлено.
  # Error notification when the status could not be changed
  status_change_failed: Не вдалося змінити статус. Спробуйте ще раз.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: У записі є помилки. Виправте їх, перш ніж змінювати статус.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: У записі є помилки. Виправте їх, перш ніж публікувати.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Надіслати на розгляд
  confirm_sending_for_review: Ваші зміни збережено як чернетку. Надіслати запис на розгляд, щоб хтось переглянув і опублікував його?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Опублікувати запис
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Відхилити зміни
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Ви впевнені, що хочете видалити цей запис? Його не буде видалено, доки видалення не буде опубліковано. До того часу він залишиться в списку записів із позначкою «Очікує видалення».
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Цей запис ще не опубліковано, тому після видалення його буде повністю відхилено.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: У цьому записі є неопубліковані зміни. Якщо їх відхилити, буде відновлено опубліковану версію. Сам запис не буде видалено.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      1   {{ Його ще не опубліковано, тому ваші неопубліковані зміни буде відхилено. Опублікована версія, якщо вона є, залишиться опублікованою. }}
      *   {{ Їх ще не опубліковано, тому ваші неопубліковані зміни буде відхилено. Опубліковані версії, якщо вони є, залишаться опублікованими. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      1    {{ Один із них ще не опубліковано, тому ваші неопубліковані зміни буде відхилено. Опублікована версія, якщо вона є, залишиться опублікованою. }}
      one  {{ {$count} з них ще не опубліковано, тому ваші неопубліковані зміни буде відхилено. Опублікована версія, якщо вона є, залишиться опублікованою. }}
      few  {{ {$count} з них ще не опубліковано, тому ваші неопубліковані зміни буде відхилено. Опубліковані версії, якщо вони є, залишаться опублікованими. }}
      many {{ {$count} з них ще не опубліковано, тому ваші неопубліковані зміни буде відхилено. Опубліковані версії, якщо вони є, залишаться опублікованими. }}
      *    {{ {$count} з них ще не опубліковано, тому ваші неопубліковані зміни буде відхилено. Опубліковані версії, якщо вони є, залишаться опублікованими. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry: Ви впевнені, що хочете опублікувати цей запис? Ваші зміни набудуть чинності негайно.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Публікація запису…
  entry_published: Запис опубліковано.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Видалення запису…
  discarding_changes: Відхилення змін…
  entry_deleted: Запис видалено.
  # Error notification when publishing fails
  publishing_entry_failed: Не вдалося опублікувати запис. Спробуйте ще раз.
  # Workflow page: empty column message
  no_entries: Немає записів.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Перетягніть, щоб змінити статус

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Створити форк репозиторію
  fork: Створити форк
  confirm_forking_repository: Щоб запропонувати зміни до «{$repo}», у вашому обліковому записі потрібно створити форк репозиторію. Ваші зміни зберігаються в цьому форку, і супровідник перевіряє їх перед публікацією.
  # Error shown when the user declined the dialog above
  fork_declined: Щоб пропонувати зміни, вам потрібен форк репозиторію у вашому обліковому записі.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Не вдалося створити форк репозиторію «{$repo}» у вашому обліковому записі.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Не вдалося перевірити ваш доступ до репозиторію «{$repo}». Спробуйте ще раз за мить.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Репозиторій «{$repo}» не дозволяє створювати форки. Попросіть супровідника дозволити форки для нього.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: У вас є запрошення до репозиторію «{$repo}», що очікує на розгляд. Прийміть його на GitHub, а потім увійдіть знову.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Ваш вхід не включає доступ до приватних репозиторіїв, тому репозиторій «{$repo}» неможливо прочитати. Попросіть супровідника перевірити налаштування автентифікації CMS.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Публікувати зміни на цьому сайті може лише супровідник. Натомість позначте запис як «На розгляді», і хтось його перегляне.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Цю зміну не можна внести напряму. На розгляд можна пропонувати лише правки записів.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Ваші зміни зберігаються у вашому форку цього репозиторію «{$repo}» і перевіряються перед публікацією.
  view_fork: Відкрити форк

# ==============================================================================
