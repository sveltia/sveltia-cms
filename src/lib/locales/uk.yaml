# {$name} is the name of the asset being replaced and {$count} is the number of mismatched files
warning_mismatched_files: |
  .input {$count :integer}
  .match $count
    1   {{ Цей файл не може замінити «{$name}», оскільки він в іншому форматі. Конвертуйте файл у той самий формат і спробуйте ще раз. }}
    *   {{ Ці файли не можуть замінити «{$name}», оскільки вони в іншому форматі. Конвертуйте файли в той самий формат і спробуйте ще раз. }}

# File name conflict resolution
# {$count} is the number of conflicting file names in the target folder
file_name_conflict_confirmation: |
  .input {$count :integer}
  .match $count
    one  {{ {$count} файл з такою самою назвою вже існує в цій теці. Замінити його? }}
    few  {{ {$count} файли з такими самими назвами вже існують у цій теці. Замінити їх? }}
    many {{ {$count} файлів з такими самими назвами вже існують у цій теці. Замінити їх? }}
