local_git_skip_reasons:
  unsupported_repository: Ваш репозиторій використовує функцію Git, яку CMS не підтримує, як-от пов’язане робоче дерево (worktree), імена об’єктів SHA-256, формат reftable, розріджений індекс (sparse index) або індекс версії 3 чи 4, який використовують параметр feature.manyFiles і git add -N.
  missing_identity: Ваше ім’я та електронну адресу не задано в конфігурації Git репозиторію, а CMS не може прочитати вашу глобальну конфігурацію. Задайте їх у репозиторії командами git config --local user.name "Your Name" і git config --local user.email "you@example.com".
  locked: Репозиторій використовує інший процес Git. Якщо жоден не запущено, видаліть файл .git/index.lock.
  # The operation in progress, with how to finish or cancel it
  operation_in_progress:
    merge: Триває злиття. Завершіть його командою git commit або скасуйте командою git merge --abort.
    rebase: Триває перебазування. Завершіть його командою git rebase --continue або скасуйте командою git rebase --abort. Якщо воно вам більше не потрібне, git rebase --quit припинить його без змін у ваших файлах.
    cherry_pick: Триває cherry-pick. Завершіть його командою git cherry-pick --continue або скасуйте командою git cherry-pick --abort.
    revert: Триває скасування коміту (revert). Завершіть його командою git revert --continue або скасуйте командою git revert --abort.
    am: Триває застосування патчів за допомогою git am. Завершіть його командою git am --continue або скасуйте командою git am --abort.
    conflict: Деякі файли містять конфлікти. Спочатку розв’яжіть їх і додайте результати до індексу.
  detached_head: Жодну гілку не активовано (checkout).
  staged_changes: У вас є інші зміни, додані до індексу для коміту. Спочатку зафіксуйте їх або вилучіть з індексу.
  # {$path} is the file path
  lfs: '{$path} відстежується за допомогою Git LFS, у який CMS не може робити коміти.'
  # {$message} is the error message
