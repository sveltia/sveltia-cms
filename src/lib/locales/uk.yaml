  edited_with_entry: Зміни в цьому записі очікують публікації разом із записом «{$name}». Якщо зберегти його зараз, обидва набори змін буде об’єднано під час публікації того запису, що може не вдатися, якщо вони перетинаються.
  # Warning shown in the dialog when an entry edited from the field has been changed by someone else
