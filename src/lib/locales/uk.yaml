# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      1   {{ У конфігурації CMS є помилка. Вирішіть проблему та спробуйте ще раз. }}
      *   {{ У конфігурації CMS є помилки. Вирішіть проблеми та спробуйте ще раз. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: колекція {$collection}
    file: файл {$file}
    component: компонент {$component}
    # Don’t localize `{$field}`
    field: поле `{$field}`

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS працює лише з URL-адресами HTTPS або localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        1   {{ URL-адреса файлу конфігурації має використовувати протокол HTTPS або адресу localhost. }}
        *   {{ URL-адреси файлів конфігурації мають використовувати протокол HTTPS або адреси localhost. }}
    fetch_failed: Не вдалося отримати файл конфігурації.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: HTTP-відповідь повернулася зі статусом {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Не вдалося отримати файл конфігурації. Щоб запобігти завантаженню файлу `config.yml`, додайте <a>`load_config_file: false`</a> до конфігурації, що передається в `CMS.init()`.'
    parse_failed: Не вдалося розібрати файл конфігурації.
    parse_failed_invalid_object: Файл конфігурації не є дійсним об’єктом JavaScript.
    parse_failed_unsupported_type: Файл конфігурації має непідтримуваний тип. Підтримуються лише YAML, TOML і JSON.
    no_collection: Колекції не визначено.
    # Don’t localize `hide`
    no_visible_collection: Принаймні одна колекція має бути видимою. Перевірте параметр `hide`.
    missing_backend: Бекенд не визначено.
    missing_backend_name: Назву бекенду не визначено.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Бекенд {$name} <a>не підтримується</a> в Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Застарілий бекенд {$name} <a>не підтримується</a> в Sveltia CMS.
    unsupported_custom_backend: Власні бекенди <a>не підтримуються</a> в Sveltia CMS.
    unsupported_backend_suggestion: Натомість використовуйте один із <a>бекендів, що підтримуються</a>.
    missing_repository: Репозиторій не визначено.
    invalid_repository: Налаштований репозиторій недійсний. Він має бути у форматі «owner/repo».
    # Don’t localize `api_root`
    missing_api_root: Параметр `api_root` не визначено. Він обов’язковий для бекенду Forgejo.
    invalid_root_dir: Коренева тека недійсна. Це має бути шлях у межах репозиторію без «..».
    invalid_root_dir_branch: Кореневу теку неможливо використати в назвах гілок режимів публікації `editorial_workflow` і `preview`. Жодна частина її шляху не може починатися з крапки, закінчуватися на «.lock» або містити пробіл чи спеціальний символ, як-от двокрапку або зірочку.
    path_outside_root_dir: Шлях «{$path}» веде за межі кореневої теки, де CMS не може переглядати файли.
    oauth_implicit_flow: Налаштований метод автентифікації (implicit flow) не підтримується в Sveltia CMS. Використовуйте інший <a>метод автентифікації</a>.
    github_pkce_unsupported: Авторизація PKCE поки не підтримується через обмеження GitHub. Використовуйте інший <a>метод автентифікації</a>.
    additions_no_base_url: Параметр `base_url` має містити URL вашої служби Sveltia CMS Additions.
    oauth_no_app_id: Ідентифікатор OAuth-застосунку не визначено.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: Параметр `open_authoring` вимагає режиму публікації `editorial_workflow` або `preview`. Подробиці див. у <a>документації</a>.
    # Don’t localize `auth_methods`
    no_auth_methods: Параметр `auth_methods` має містити щонайменше один метод.
    # Don’t localize `auth_scope`, `repo` and `public_repo`
    auth_scope_no_repo: Параметр `auth_scope` має включати `repo` або `public_repo`.
    missing_media_folder: Теку медіа не визначено.
    public_folder_relative_path: Налаштована публічна тека недійсна. Вона має бути абсолютним шляхом, що починається з «/».
    public_folder_absolute_url: Абсолютний URL для параметра публічної теки не підтримується в Sveltia CMS.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: Параметр `{$option}` містить шаблонний тег `{$tag}`, який там не підтримується. Можна використовувати лише шаблонні теги слага, як-от `\{\{slug\}\}` і `\{\{year\}\}`, а також теги `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` і `\{\{public_folder\}\}`.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: Параметр `{$option}` містить шаблонний тег `{$tag}`, який можна використовувати лише в параметрі колекції, файлу колекції або поля, де є запис, з якого його можна заповнити.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: Параметр `sanitize_replacement` має значення `{$replacement}`, але воно містить символ, який не можна використовувати в слагу, тому воно не може його замінювати.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: Параметр `{$option}` має значення `{$url}`, але це має бути абсолютний URL, що починається з `https://` або `http://`.
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: Параметр `stages` у `publish_mode` має починатися з `draft` і перелічувати етапи в порядку `draft`, `pending_review`, `pending_publish` без повторів.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: Параметр `i18n.locales` має містити щонайменше одну локаль.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: Параметр `default_locale` має значення `{$locale}`, але його немає серед `locales`.
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: Параметр `initial_locales` містить `{$locale}`, але його немає серед `locales`.
    # Don’t localize `i18n`
    i18n_no_collections: 'Параметр `i18n` налаштовано на верхньому рівні, але жодна колекція чи одиничний файл не має параметра `i18n`, тому жоден вміст не можна перекласти. Додайте `i18n: true` до колекцій і одиничних файлів, які потрібно перекладати.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: Параметр `transformations` містить непідтримуваний ключ `{$key}`. Це має бути `raster_image`, `svg` або підтримуваний формат растрового зображення.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: Параметр `quality` для перетворення `{$key}` недійсний. Це має бути ціле число від 0 до 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: Параметр `{$prop}` для перетворення `{$key}` недійсний. Це має бути додатне ціле число.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: Колекція ресурсів {$count} повинна мати параметр `name`, визначений як непорожній рядок.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Назва колекції ресурсів `{$name}` недійсна. Вона не може містити спеціальних символів.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Назви колекцій ресурсів мають бути унікальними, але `{$name}` використовується більше одного разу.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: Колекція повинна мати визначений один із параметрів `folder`, `file`, `files` або `divider`.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: Колекція не може мати більше одного з параметрів `folder`, `file`, `files` і `divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: Розширення `{$extension}` не відповідає формату `{$format}`.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: Поле `{$name}` зберігається як тіло під front matter, яке може містити лише текст, а не число, логічне значення, список чи об’єкт, як поле `{$widget}`. Використайте тип поля, що містить текст, або перейменуйте поле.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
    # brackets are escaped with backslashes for MessageFormat 2
    invalid_collection_data_file: Параметр `file` зі значенням `{$file}` недійсний. Це має бути шлях до файлу JSON без заповнювача `\{\{locale\}\}`.
    # {$prop} is the option name; Don’t localize `file`
    unsupported_collection_data_file_option: Параметр `{$prop}` не підтримується в колекції з параметром `file`.
    # Don’t localize `file`, `publish_mode` and `simple`
    collection_data_file_workflow: Редакційний процес і процес попереднього перегляду, зокрема відкрите авторство, не підтримуються в колекції з параметром `file`. Встановіть для параметра `publish_mode` колекції значення `simple`.
    # {$prop} is the option name; Don’t localize `file` and `slug`. The curly brackets are escaped
    # with backslashes for MessageFormat 2
    collection_data_file_slug_tag: Параметр `{$prop}` не може містити тег `\{\{slug\}\}` у колекції з параметром `file`, оскільки слаг запису — це його позиція, яка змінюється, коли записи переставляють або видаляють. Натомість використайте поле з унікальним значенням.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Шаблон слага `{$slug}` недійсний, оскільки не може містити косих рисок `/`. Щоб організувати записи в підтеках, використовуйте параметр `path` замість `slug`.
    # {$name} is the field name from the configuration; Don’t localize `identifier_field`
    invalid_identifier_field: Параметр `identifier_field` посилається на `{$name}`, але такого поля не визначено в колекції.
    # {$name} is the field name from the configuration; Don’t localize `filter`
    invalid_filter_field: Параметр `filter` посилається на `{$name}`, але такого поля не визначено в колекції.
    # Don’t localize `filter`, `value` and `pattern`
    invalid_filter_no_condition: Параметр `filter` повинен мати параметр `value` або `pattern`, за яким відбираються записи.
    # {$option} is an option name such as `slug` or `summary` and {$name} is the field name or template tag from the configuration
    option_field_not_found: Параметр `{$option}` посилається на `{$name}`, але такого поля не визначено.
    # {$name} is the field name from the configuration and {$widget} is its field type; Don’t localize `thumbnail`
    thumbnail_field_not_media: Параметр `thumbnail` посилається на `{$name}`, але це має бути поле Image або File, а не поле `{$widget}`.
    # Don’t localize `inline` or `multiple`
    invalid_inline_component_fields: Режим `inline` вимагає одного поля Boolean, Color, DateTime, Number, Relation, Select або String. Поле Relation або Select не може мати ввімкненого параметра `multiple`.
    # {$option} is an option name such as `pattern` or `filter` and {$pattern} is the configured pattern
    invalid_regex: Параметр `{$option}` містить недійсний регулярний вираз `{$pattern}`, який ігнорується.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: Параметр `reorder` посилається на групу подання з назвою `{$name}`, але такої групи не визначено в параметрі `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit` and `fields`
    invalid_bulk_edit_field: Список `fields` параметра `bulk_edit` посилається на поле з назвою `{$name}`, але такого поля верхнього рівня не визначено в колекції.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit`, `fields` and `multiple`
    unsupported_bulk_edit_field: Поле `{$name}` у списку `fields` параметра `bulk_edit` не можна редагувати масово. Підтримуються лише поля Boolean, Color, DateTime, Number, Relation, Select або String, які не доступні лише для читання, не мають увімкненого параметра `multiple` і не встановлюються автоматично під час збереження.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: Параметр `sortable_fields` посилається на поле з назвою `{$name}`, але такого поля не визначено в колекції.
    # Don’t localize `sortable_fields` and `default_sort`
    multiple_sortable_field_defaults: Лише один елемент у параметрі `sortable_fields` може мати параметр `default_sort`.
    # {$option} is `table_columns` or `summary_fields`, and {$name} is the field name from the configuration
    invalid_table_column_field: Параметр `{$option}` посилається на поле з назвою `{$name}`, але такого поля не визначено в колекції.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: Параметр `view_groups` посилається на поле з назвою `{$name}`, але такого поля не визначено в колекції.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: Параметр `view_filters` посилається на поле з назвою `{$name}`, але такого поля не визначено в колекції.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: Група подання {$count} повинна мати параметр `name`, визначений як непорожній рядок.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: Назва групи подання `{$name}` недійсна. Вона не повинна містити спеціальних символів.
