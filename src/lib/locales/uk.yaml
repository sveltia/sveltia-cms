    # Don’t localize `stages`, `publish_mode`, `editorial_workflow` and {$type}, which is `preview` or `simple`
    publish_mode_stages_ignored: Параметр `stages` у `publish_mode` застосовується лише до режиму публікації `editorial_workflow`, тому з `{$type}` він ігнорується.
    # Don’t localize `pattern`, `m` and `s`
    inline_component_multiline_pattern: Параметр `pattern` цього вбудованого компонента має прапорець `m` або `s` чи збігається з розривами рядків, але вбудований компонент шукається лише в межах абзацу.
    # {$name} is a button or component name and {$option} is `buttons` or `editor_components`; Don’t localize them and `multiline: false`
    single_line_block_item: 'Елемент `{$name}` параметра `{$option}` ігнорується, оскільки поле з `multiline: false` може містити лише вбудований вміст.'
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Встановлено як `picker_utc`, так і новіші параметри часового поясу (`input_timezone` або `output_utc`). Новіші параметри мають пріоритет. Розгляньте можливість видалення `picker_utc` з вашої конфігурації.
    # Don’t localize `localize_format` and `format`
    localize_format_without_format: Параметр `localize_format` не діє, оскільки поле не має параметра `format`, і його значення зберігається у форматі ISO 8601.
    # {$name} is a template tag like `fields.lines.*.price`; Don’t localize `value`, `*` and `sum()`
    compute_field_wildcard_without_item: Параметр `value` поля Compute посилається на `{$name}`, але поле не перебуває в елементі списку, який позначає `*`, тому значення виявляється порожнім. Лише агрегатна функція, як-от `sum()`, може використовувати всі елементи списку.
    # {$name} is a template tag like `fields.lines.*.amount`; Don’t localize `value`
    compute_field_self_reference: Параметр `value` поля Compute посилається на саме поле як `{$name}`, тому його значення змінюється під час кожного обчислення й ніколи не встановлюється.
    # {$name} is a template tag like `fields.total`; Don’t localize `value`
    compute_field_reference_cycle: Параметр `value` поля Compute посилається на `{$name}` — інше поле Compute, яке посилається назад на це поле прямо або через інші поля, тому їхні значення ніколи не встановлюються.
    # Don’t localize `localize_format`, `true` and `de`
    localize_format_without_i18n: Параметр `localize_format` має значення `true`, але i18n для колекції не ввімкнено, тому значення записується англійською. Натомість встановіть для параметра код локалі, наприклад `de`.
    # {$locale} is the locale code from the configuration; Don’t localize `localize_format`
    localize_format_unsupported_locale: Параметр `localize_format` має значення `{$locale}`, яке не є підтримуваною локаллю, тому значення записується англійською.
    # Don’t localize `preview_path`
    preview_path_no_date_field: Параметр `preview_path` використовує теги дати й часу, але в колекції немає поля DateTime, з якого їх можна прочитати, тому посилання на попередній перегляд не буде показано.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: Параметр `preview_path_date_field` посилається на поле з назвою `{$name}`, але поля DateTime з такою назвою не визначено, тому посилання на попередній перегляд не буде показано.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: Параметр `preview_path` посилається на `{$name}`, але такого поля не визначено в колекції, тому посилання на попередній перегляд не буде показано.
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: Колекція не має поля `{$name}` для назв нових записів, тому кожен новий запис отримує випадковий слаг. Додайте поле `{$name}` або встановіть параметр `identifier_field` чи `slug`.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: Параметр `i18n` у `slug` не діє, оскільки колекція не використовує структуру i18n `multiple_files`, `multiple_folders` або `multiple_root_folders`, де кожна локаль має окремий файл.
    # Don’t localize `slug`, `template` and `auto_increment`
    slug_template_ignored: Параметр `template` у `slug` ігнорується, оскільки натомість параметр `auto_increment` нумерує слаги.
    # {$file} is the file path; Don’t localize `file`, `locale`, `i18n`, `false`,
    # `omit_default_locale_from_file_path` and the example paths. The curly brackets in the examples
    # are escaped with backslashes for MessageFormat 2
    locale_not_omitted_from_file_path: Заповнювач `locale` неможливо вилучити зі шляху `file` `{$file}`, тому локаль за замовчуванням залишається в ньому попри параметр i18n `omit_default_locale_from_file_path`. Щоб пропустити локаль, використовуйте заповнювач як повну назву теки, наприклад `\{\{locale\}\}/about.md`, або між назвою файлу та розширенням, наприклад `about.\{\{locale\}\}.md`. Щоб залишити її, встановіть для параметра значення `false` у параметрі `i18n` файлу.
    # Don’t localize `i18n`
    i18n_not_configured: Параметр `i18n` увімкнено, але i18n не налаштовано на верхньому рівні конфігурації або в колекції, тому параметр не діє.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: Параметр `public_folder` є порожнім рядком, тому для шляхів до ресурсів, що зберігаються в записах, натомість використовується шлях `media_folder`. Вилучіть параметр або встановіть шлях, який потрібно використовувати, наприклад `/images`.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: Параметр `{$option}` не визначено в схемі конфігурації Sveltia CMS. Його буде проігноровано. Перевірте, чи немає одруку або синтаксичної помилки.
    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: Параметр `default_localized` не діє, оскільки i18n для колекції не ввімкнено. Натомість використовуйте параметр `default`.
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: Параметр `default_localized` має значення для `{$locale}`, але цієї локалі немає серед локалей колекції, тому значення ніколи не використовується.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Докладніше дивиться у примітках щодо сумісності: {$link}'

  # Console tip shown after config load
  schema_tip: Для кращого досвіду розробки ви можете перевірити свій файл конфігурації за JSON-схемою Sveltia CMS. Докладніше дивиться {$link}.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Локальний
  # Browser compatibility warnings
  unsupported_browser: Локальний робочий процес не підтримується у вашому браузері. Використовуйте Chrome або Edge.
  disabled: Локальний робочий процес вимкнено у вашому браузері. <a>Ось як його ввімкнути</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Ви переглядаєте дошку редакційного процесу. Чернетки: {$draft}. На розгляді: {$review}. Готово: {$ready}. Очікують видалення: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Ви переглядаєте дошку редакційного процесу. Чернетки: {$draft}. На розгляді: {$review}. Очікують видалення: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'Ви переглядаєте дошку редакційного процесу. Чернетки: {$draft}. Готово: {$ready}. Очікують видалення: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'Ви переглядаєте сторінку чернеток. Чернетки: {$draft}. Очікують видалення: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Чернетка
  drafts: Чернетки
  in_review: На розгляді
  ready: Готово
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Очікує видалення
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: Розгортання

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Скасувати видалення
  confirm_cancelling_deletion: Ви впевнені, що хочете скасувати це видалення? Запис залишиться опублікованим.
  confirm_completing_deletion: Ви впевнені, що хочете видалити цей запис? Його буде видалено негайно.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      1    {{ Запис позначено на видалення. }}
      one  {{ {$count} запис позначено на видалення. }}
      few  {{ {$count} записи позначено на видалення. }}
      many {{ {$count} записів позначено на видалення. }}
      *    {{ {$count} записів позначено на видалення. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      1    {{ Зміни відкинуто. }}
      one  {{ Зміни в {$count} записі відкинуто. }}
      few  {{ Зміни в {$count} записах відкинуто. }}
      many {{ Зміни в {$count} записах відкинуто. }}
      *    {{ Зміни в {$count} записах відкинуто. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Скасування видалення…
  deletion_cancelled: Видалення скасовано.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Не вдалося скасувати видалення. Спробуйте ще раз.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Неопубліковані записи
  published_entries: Опубліковані записи
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Статус: {$status}'
  change_entry_status: Змінити статус запису
  # Editor toolbar: progress label while the status is being changed
  changing_status: Зміна статусу…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Оновлення статусу…
  status_updated: Статус оновлено.
  # Error notification when the status could not be changed
  status_change_failed: Не вдалося змінити статус. Спробуйте ще раз.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: Оновити
  refreshing: Оновлення…
  refreshed: Дошка актуальна.
  # Error notification when the board could not be refreshed
  refresh_failed: Не вдалося оновити дошку. Спробуйте ще раз.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: У записі є помилки. Виправте їх, перш ніж змінювати статус.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: У записі є помилки. Виправте їх, перш ніж публікувати.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Надіслати на розгляд
  confirm_sending_for_review: Ваші зміни збережено як чернетку. Надіслати запис на розгляд, щоб хтось переглянув і опублікував його?
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: Позначити як готовий
  confirm_marking_as_ready: Ваші зміни збережено як чернетку. Позначити запис як готовий, щоб його можна було опублікувати?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Опублікувати запис
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Відкинути зміни
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Ви впевнені, що хочете видалити цей запис? Його не буде видалено, доки видалення не буде опубліковано. До того часу він залишиться в списку записів із позначкою «Очікує видалення».
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Цей запис ще не опубліковано, тому після видалення його буде повністю відкинуто.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: У цьому записі є неопубліковані зміни. Якщо їх відкинути, буде відновлено опубліковану версію. Сам запис не буде видалено.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      1   {{ Його ще не опубліковано, тому ваші неопубліковані зміни буде відкинуто. Опублікована версія, якщо вона є, залишиться опублікованою. }}
      *   {{ Їх ще не опубліковано, тому ваші неопубліковані зміни буде відкинуто. Опубліковані версії, якщо вони є, залишаться опублікованими. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      1    {{ Один із них ще не опубліковано, тому ваші неопубліковані зміни буде відкинуто. Опублікована версія, якщо вона є, залишиться опублікованою. }}
      one  {{ {$count} з них ще не опубліковано, тому ваші неопубліковані зміни буде відкинуто. Опублікована версія, якщо вона є, залишиться опублікованою. }}
      few  {{ {$count} з них ще не опубліковано, тому ваші неопубліковані зміни буде відкинуто. Опубліковані версії, якщо вони є, залишаться опублікованими. }}
      many {{ {$count} з них ще не опубліковано, тому ваші неопубліковані зміни буде відкинуто. Опубліковані версії, якщо вони є, залишаться опублікованими. }}
      *    {{ {$count} з них ще не опубліковано, тому ваші неопубліковані зміни буде відкинуто. Опубліковані версії, якщо вони є, залишаться опублікованими. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: Ви впевнені, що хочете опублікувати цей запис? Ваші зміни з’являться на сайті після його повторного збирання.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Публікація запису…
  entry_published: Запис опубліковано.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Видалення запису…
  discarding_changes: Відкидання змін…
  entry_deleted: Запис видалено.
  # Error notification when publishing fails
  publishing_entry_failed: Не вдалося опублікувати запис. Спробуйте ще раз.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: Цей запис неможливо опублікувати тут, оскільки він містить інші зміни, які CMS не може вам показати. Попросіть розробника переглянути його.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: Запис було змінено після того, як ви його відкрили. Перезавантажте сторінку, щоб переглянути останню версію перед публікацією.
  review_on_x: Переглянути на {$service}
  from_fork: З форку
  fork_entry_editable: Цей запис походить із запиту на злиття учасника, відкритого з «{$fork}». Ваші зміни зберігаються в його гілці. Перегляньте та злийте запит на злиття в Git-сервісі.
  fork_entry_locked: Цей запис походить із запиту на злиття учасника, відкритого з «{$fork}». Учасник не дозволяє супровідникам редагувати його, тому тут його можна лише переглядати.
  fork_not_editable: Учасник не дозволяє супровідникам редагувати цей запит на злиття.
  fork_entry_gone: Запит на злиття учасника більше не відкритий, тому зміни неможливо в нього зберегти.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: Для цього запису поза CMS уже відкрито інший запит ({$number}). Попросіть розробника спочатку закрити його.
  # Workflow page: empty column message
  no_entries: Немає записів.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Перетягніть, щоб змінити статус
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Видалення
  # Workflow page: note on a card listing the new entries that were created from a Relation field
  # of the entry and are published along with it, e.g. “Also adds Section: Getting Started”
  companion_entries: 'Також додає: {$entries}'
  # Workflow page: note on a card listing the existing entries that were edited from a Relation
  # field of the entry and are published along with it, e.g. “Also changes Author: Ada Lovelace”
  edited_companion_entries: 'Також змінює: {$entries}'
  # Workflow page: one of the entries listed by `companion_entries` or `edited_companion_entries`,
  # named by its collection’s singular label and its title
  companion_entry: '{$collection}: {$title}'

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: Повідомлення коміту
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: Опишіть свої зміни. Повідомлення буде записано в історію разом із ними.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: Додайте примітку до повідомлення, яке буде записано в історію разом із вашими змінами, наприклад номер завдання. Її можна залишити порожньою.
  # Accessible name of the text box when the user writes the whole message
  message: Повідомлення коміту
  # Accessible name of the text box when the text is added before or after the message
  addition: Примітка
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'Повідомлення: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Створити форк репозиторію
  fork: Створити форк
  confirm_forking_repository: Щоб запропонувати зміни до «{$repo}», у вашому обліковому записі потрібно створити форк репозиторію. Ваші зміни зберігаються в цьому форку, і супровідник перевіряє їх перед публікацією.
  # Error shown when the user declined the dialog above
  fork_declined: Щоб пропонувати зміни, вам потрібен форк репозиторію у вашому обліковому записі.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Не вдалося створити форк репозиторію «{$repo}» у вашому обліковому записі.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: Ваш форк «{$fork}» не має гілки «{$branch}». Оновіть форк з репозиторію «{$repo}», а потім увійдіть знову.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Не вдалося перевірити ваш доступ до репозиторію «{$repo}». Спробуйте ще раз за мить.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Репозиторій «{$repo}» не дозволяє створювати форки. Попросіть супровідника дозволити форки для нього.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: У вас є запрошення до репозиторію «{$repo}», що очікує на розгляд. Прийміть його на GitHub, а потім увійдіть знову.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Ваш вхід не включає доступ до приватних репозиторіїв, тому репозиторій «{$repo}» неможливо прочитати. Попросіть супровідника перевірити налаштування автентифікації CMS.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Публікувати зміни на цьому сайті може лише супровідник. Натомість позначте запис як «На розгляді», і хтось його перегляне.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: Супровідник уже опублікував цей запис, тому розглядати більше нічого.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Цю зміну не можна внести напряму. На розгляд можна пропонувати лише правки записів.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Ваші зміни зберігаються у вашому форку цього репозиторію «{$repo}» і перевіряються перед публікацією.
  view_fork: Відкрити форк

