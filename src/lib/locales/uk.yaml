    api_key_removed: Ключ API видалено.
    api_key_invalid: Наданий ключ API недійсний. Перевірте і спробуйте знову.

  # Preferences operation errors
  error:
    permission_denied: Доступ до сховища cookie заборонено. Перевірте дозволи браузера та спробуйте ще раз.

  # Appearance panel
  appearance:
    title: Зовнішній вигляд
    theme: Тема
    select_theme: Вибрати тему

  # Theme options
  theme:
    dark: Темна
    light: Світла

  # Language panel
  language:
    title: Мова
    ui_language:
      title: Мова інтерфейсу
      select_language: Вибрати мову

  # Contents panel
  contents:
    title: Вміст
    editor:
      title: Редактор
      use_draft_backup:
        switch_label: Автоматично створювати резервні копії чернеток записів
      close_on_save:
        switch_label: Закривати редактор після збереження чернетки
      close_with_escape:
        switch_label: Закривати редактор клавішею Escape

  # Internationalization panel
  i18n:
    title: Інтернаціоналізація
    translators:
      default:
        title: Служба перекладу за замовчуванням
        select_service: Вибрати службу
      api_keys:
        title: Ключі API служб перекладу
        description: Керуйте ключами API для <a>служб перекладу</a>. Ключами API для універсальних служб ШІ можна керувати в налаштуваннях ШІ.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: Ключ {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Зареєструйтеся в <a {$homeHref}>{$service}</a> та введіть <a {$apiKeyHref}>свій ключ API</a>, щоб увімкнути швидкий переклад текстових полів.

  # Media panel
  media:
    title: Медіа
    stock_photos:
      api_keys:
        title: Ключі API служб стокових фото
        description: Керуйте ключами API для <a>служб стокових фото</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: Ключ API {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Зареєструйтеся в <a {$homeHref}>{$service} API</a> та введіть <a {$apiKeyHref}>свій ключ API</a>, щоб вставляти безкоштовні стокові фото в поля зображень.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Фото надані {$service}
      no_services: <a>Служби стокових фото</a> не налаштовано.
    cloud_storage:
      api_keys:
        title: Ключі API служб хмарного сховища
        description: Керуйте ключами API для <a>служб хмарного сховища</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: Ключ API {$service}
      no_services: <a>Служби хмарного сховища</a> не налаштовано.

  # AI panel
  ai:
    title: ШІ
    api_keys:
      title: Ключі API служб ШІ
      description: Керуйте ключами API для служб ШІ.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: Ключ API {$service}

  # Accessibility panel
  accessibility:
    title: Доступність
    underline_links:
      title: Підкреслення посилань
      description: Показувати підкреслення посилань у попередньому перегляді запису та в написах інтерфейсу.
      switch_label: Завжди підкреслювати посилання

  # Data Management panel
  data:
    title: Керування даними
    clear_data:
      title: Очистити дані
      # Clear File Cache button
      file_cache:
        description: Видалити локально кешований вміст файлів і мініатюри зображень, щоб звільнити місце або усунути проблеми, спричинені застарілими даними.
        button_label: Очистити кеш файлів
        confirmation: Локально кешований вміст файлів і мініатюри зображень буде видалено. Ваші незбережені чернетки та налаштування буде збережено, а видалені дані за потреби буде звантажено або створено знову. Після завершення CMS буде перезавантажено.
      # Erase All Data button
      all_data:
        description: Видалити все, що CMS зберігає в цьому браузері, зокрема кешовані файли, незбережені чернетки та налаштування. Усе, що вже збережено у вашому репозиторії, не буде змінено.
        button_label: Видалити всі дані
        confirmation: Усі дані, збережені в цьому браузері, буде видалено, зокрема кешований вміст файлів, мініатюри зображень, незбережені чернетки, налаштування та стан входу. Ваш репозиторій не буде змінено, але всі незбережені зміни буде втрачено, і вам доведеться увійти знову. Після завершення CMS буде перезавантажено.

  # Developer panel
  developer:
    title: Розробник
    developer_mode:
      title: Режим розробника
      description: Увімкнути деякі функції для розробників, зокрема детальні журнали консолі та власні контекстні меню.
      switch_label: Увімкнути режим розробника
    local_git:
      title: Коміти Git
      description: Фіксуйте зміни в поточній гілці вашого локального репозиторію щоразу, коли ви їх зберігаєте, як це робить CMS під час роботи з віддаленим репозиторієм. Потім ви можете переглянути й надіслати коміти звичними інструментами Git.
      switch_label: Фіксувати зміни в Git
      checking: Перевірка репозиторію…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Зміни буде зафіксовано в гілці {$branch} від імені {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Зараз неможливо зафіксувати зміни. {$reason}
    deploy_hook:
      title: Хук розгортання
      description: Введіть URL вебхука, який викликатиметься, коли ви вручну запускаєте розгортання, вибираючи «Опублікувати зміни». Це можна залишити порожнім, якщо ви використовуєте GitHub Actions або GitLab CI/CD.
      # Hook URL input
      url:
        field_label: URL хука
        saved: URL хука збережено.
        removed: URL хука видалено.
      # Authorization header input
      auth:
        field_label: Заголовок авторизації (напр., Bearer <token>) (необов'язково)
        saved: Заголовок авторизації збережено.
        removed: Заголовок авторизації видалено.

