    few  {{ Ви переглядаєте теку ресурсів «{$folder}», у якій {$count} ресурси. }}
    many {{ Ви переглядаєте теку ресурсів «{$folder}», у якій {$count} ресурсів. }}
    *    {{ Ви переглядаєте теку ресурсів «{$folder}», у якій {$count} ресурсів. }}

