  # Note shown in the dialog. {$name} is the singular label of the referenced collection
  edit_together_hint: Ваші зміни в записі ({$name}) буде збережено разом із записом, який ви редагуєте.
  # Error shown when the changes couldn’t be prepared. {$name} is the singular label of the collection
  edit_failed: Не вдалося застосувати зміни до запису ({$name}). Подробиці див. у консолі браузера.
