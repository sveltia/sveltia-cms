  edit_deleted: Запис «{$name}» було видалено іншою особою після того, як ви його редагували. Вилучіть його з поля, щоб зберегти запис.
  # Accessible label of the menu listing the selected entries that can be edited
  select_entry_to_edit: Виберіть запис для редагування
  # Warning shown in the editor of an entry that has been edited from a Relation field of another
