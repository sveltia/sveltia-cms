editor:
  translation:
    none: Немає чого перекладати.
    started: Переклад…
    error: Не вдалося перекласти.
    # {$source} is the source language name and {$count} is the number of translated fields
    complete: |
      .input {$count :integer}
      .match $count
        0    {{ Не перекладено жодного поля з {$source}. }}
        one  {{ Перекладено {$count} поле з {$source}. }}
        few  {{ Перекладено {$count} поля з {$source}. }}
        many {{ Перекладено {$count} полів з {$source}. }}
        *    {{ Перекладено {$count} полів з {$source}. }}
  copy:
    none: Немає чого копіювати.
    # {$source} is the source language name and {$count} is the number of copied fields
    complete: |
      .input {$count :integer}
      .match $count
        0    {{ Не скопійовано жодного поля з {$source}. }}
        one  {{ Скопійовано {$count} поле з {$source}. }}
        few  {{ Скопійовано {$count} поля з {$source}. }}
        many {{ Скопійовано {$count} полів з {$source}. }}
        *    {{ Скопійовано {$count} полів з {$source}. }}

# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: Це поле обов’язкове.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: Дата/час має бути не раніше {$min}.
    date: Дата має бути не раніше {$min}.
    time: Час має бути не раніше {$min}.
    number: Значення має бути більше або дорівнювати {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one  {{ Ви повинні вибрати щонайменше {$min} варіант. }}
        few  {{ Ви повинні вибрати щонайменше {$min} варіанти. }}
        many {{ Ви повинні вибрати щонайменше {$min} варіантів. }}
        *    {{ Ви повинні вибрати щонайменше {$min} варіантів. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one  {{ Ви повинні додати щонайменше {$min} елемент. }}
        few  {{ Ви повинні додати щонайменше {$min} елементи. }}
        many {{ Ви повинні додати щонайменше {$min} елементів. }}
        *    {{ Ви повинні додати щонайменше {$min} елементів. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: Дата/час має бути не пізніше {$max}.
    date: Дата має бути не пізніше {$max}.
    time: Час має бути не пізніше {$max}.
    number: Значення має бути менше або дорівнювати {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one  {{ Ви не можете вибрати більше ніж {$max} варіант. }}
        few  {{ Ви не можете вибрати більше ніж {$max} варіанти. }}
        many {{ Ви не можете вибрати більше ніж {$max} варіантів. }}
        *    {{ Ви не можете вибрати більше ніж {$max} варіантів. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one  {{ Ви не можете додати більше ніж {$max} елемент. }}
        few  {{ Ви не можете додати більше ніж {$max} елементи. }}
        many {{ Ви не можете додати більше ніж {$max} елементів. }}
        *    {{ Ви не можете додати більше ніж {$max} елементів. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one  {{ Ви повинні ввести щонайменше {$min} символ. }}
      few  {{ Ви повинні ввести щонайменше {$min} символи. }}
      many {{ Ви повинні ввести щонайменше {$min} символів. }}
      *    {{ Ви повинні ввести щонайменше {$min} символів. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one  {{ Ви не можете ввести більше ніж {$max} символ. }}
      few  {{ Ви не можете ввести більше ніж {$max} символи. }}
      many {{ Ви не можете ввести більше ніж {$max} символів. }}
      *    {{ Ви не можете ввести більше ніж {$max} символів. }}

  # Type validation errors
  type_mismatch:
    number: Введіть число.
    email: Введіть дійсну електронну адресу.
    url: Введіть дійсний URL.

  # Value used for the same field in another entry of the collection
  value_not_unique: Це значення використовується для іншого запису.
  # Key of a keyed List field item used for another item of the same list
  key_not_unique: Цей ключ використовується для іншого елемента.
  # Key of a keyed List field item that is a whole number, which doesn’t keep its order in a map
  key_numeric: Ключ не може бути цілим числом, оскільки елементи втратять свій порядок.

  # Custom field validation error
  invalid_value: Недійсне значення.
  unexpected_error: Сталася неочікувана помилка.

# ==============================================================================
# Entry Sidebar
# ==============================================================================
# Panels shown in the entry editor sidebar.

entry_sidebar:
  # Sidebar tab list aria-label
  sidebar_panels: Бічні панелі

  # Validation panel: shows field validation errors
  validation:
    title: Перевірка
    placeholder: Тут відображатимуться результати перевірки.
    no_errors_found: Помилок не знайдено.
    # Button in the panel header that validates the entry on demand
    validate: Перевірити

  # Slug panel: shows the entry slug and lets the user edit it
  slug:
    title: Слаг
    generated_on_save: Слаг генерується з вмісту запису під час збереження. Будь-які дата й час у ньому відповідатимуть моменту збереження.
    unavailable: Цей запис не має слага.

  # History panel: shows entry commit history
  history:
    title: Історія
    fetch_failed: Не вдалося завантажити історію.
    no_history: Історію не знайдено.

  # Backlinks panel: shows entries referencing this entry
  backlinks:
    title: Зворотні посилання
    no_entries: Жоден запис не посилається на цей запис.

  # Tab label of a panel with a count, e.g. of comments. {$title} is the panel title
  title_with_count: '{$title} ({$count})'

# Status shown next to the Save button while an entry with many new files is being saved
# {$done} and {$total} are the number of files prepared and to prepare, or the number of commits
# made and the estimated number of commits in all
save_progress:
  preparing: 'Підготовка файлів: {$done} з {$total}'
  committing: 'Збереження на GitHub: {$done} з приблизно {$total} комітів'

# Entry save error dialog
saving_entry:
  error:
    title: Помилка
    description: Під час збереження запису сталася помилка. Спробуйте пізніше.

# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: Запис змінено іншою особою
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} змінив(-ла) цей запис {$date}, після того як ви його відкрили.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Цей запис було змінено в репозиторії після того, як ви його відкрили.
  deleted: Цей запис було видалено з репозиторію після того, як ви його відкрили.
  # Follows `modified_by` or `modified`
  overwrite_warning: Якщо зберегти зараз, їхні зміни буде втрачено.
  # Follows `deleted`
  recreate_warning: Якщо зберегти зараз, запис буде створено знову.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Оскільки запис зберігається в тому самому файлі, що й інші записи, його неможливо зберегти поверх цієї зміни. Скасуйте редагування, знову відкрийте запис зі списку та внесіть свої правки.
  # OK button label
  save_anyway: Усе одно зберегти
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: Під час збереження репозиторій було оновлено іншою особою. Спробуйте ще раз.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Запис, що зберігається в тому самому файлі, було змінено іншою особою. Спробуйте ще раз.
  # {$path} is the file path
  array_file_invalid: Файл {$path} неможливо оновити, оскільки він не містить дійсного списку записів.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
# repository while the user has it open. The change itself is described with the `save_conflict`
# strings above
remote_change:
  reload_entry: Перезавантажити запис
  # Confirmation shown before reloading when the user has unsaved changes
  confirm_reloading_entry: Ви впевнені, що хочете перезавантажити запис? Ваші незбережені зміни буде втрачено.

