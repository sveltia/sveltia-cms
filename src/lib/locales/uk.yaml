  .input {$count :integer}
  .match $count
    0    {{ Ви переглядаєте результати пошуку за запитом «{$terms}». Ресурсів не знайдено. }}
    one  {{ Ви переглядаєте результати пошуку за запитом «{$terms}». Знайдено {$count} ресурс. }}
