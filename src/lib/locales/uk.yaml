    one  {{ Елемент вставлено, але не вдалося знайти {$count} файл, який він використовує. Перевірте файлові поля в елементі. }}
    few  {{ Елемент вставлено, але не вдалося знайти {$count} файли, які він використовує. Перевірте файлові поля в елементі. }}
    many {{ Елемент вставлено, але не вдалося знайти {$count} файлів, які він використовує. Перевірте файлові поля в елементі. }}
    *    {{ Елемент вставлено, але не вдалося знайти {$count} файлів, які він використовує. Перевірте файлові поля в елементі. }}

