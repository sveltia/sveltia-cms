  .match $count
    one {{ Item geplakt. Een waarde die deze lijst niet accepteert, is weggelaten. }}
    *   {{ Item geplakt. {$count} waarden die deze lijst niet accepteert, zijn weggelaten. }}
# {$count} is the number of the files the pasted item references that couldn’t be found
list_item_pasted_without_files: |
  .input {$count :integer}
  .match $count
    one {{ Item geplakt, maar een bestand dat het gebruikt, kon niet worden gevonden. Controleer de bestandsvelden in het item. }}
    *   {{ Item geplakt, maar {$count} bestanden die het gebruikt, konden niet worden gevonden. Controleer de bestandsvelden in het item. }}

# Variable-type list selector
