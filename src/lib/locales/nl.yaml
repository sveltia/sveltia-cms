  validation:
    title: Validatie
    placeholder: De validatieresultaten verschijnen hier.
    no_errors_found: Geen fouten gevonden.
    # Button in the panel header that validates the entry on demand
    validate: Valideren

  # Slug panel: shows the entry slug and lets the user edit it
  slug:
    title: Slug
    generated_on_save: De slug wordt bij het opslaan gegenereerd uit de inhoud van het item. Eventuele datums en tijden erin zijn die van het moment van opslaan.
    unavailable: Dit item heeft geen slug.

  # History panel: shows entry commit history
  history:
    title: Geschiedenis
    fetch_failed: De geschiedenis kon niet worden geladen.
    no_history: Geen geschiedenis gevonden.

  # Backlinks panel: shows entries referencing this entry
  backlinks:
    title: Backlinks
    no_entries: Er zijn geen items die naar dit item verwijzen.

  # Tab label of a panel with a count, e.g. of comments. {$title} is the panel title
  title_with_count: '{$title} ({$count})'

# Status shown next to the Save button while an entry with many new files is being saved
# {$done} and {$total} are the number of files prepared and to prepare, or the number of commits
# made and the estimated number of commits in all
save_progress:
  preparing: 'Bestanden voorbereiden: {$done} van {$total}'
  committing: 'Opslaan naar GitHub: {$done} van ongeveer {$total} commits'

# Entry save error dialog
saving_entry:
  error:
    title: Fout
    description: Er is een fout opgetreden bij het opslaan van het item. Probeer het later opnieuw.

# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: Item gewijzigd door iemand anders
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} heeft dit item op {$date} gewijzigd, nadat jij het had geopend.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Dit item is in de repository gewijzigd nadat je het had geopend.
  deleted: Dit item is uit de repository verwijderd nadat je het had geopend.
  # Follows `modified_by` or `modified`
  overwrite_warning: Als je nu opslaat, gaan hun wijzigingen verloren.
  # Follows `deleted`
  recreate_warning: Als je nu opslaat, wordt het item opnieuw aangemaakt.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Omdat het item in hetzelfde bestand is opgeslagen als andere items, kan het niet over de wijziging heen worden opgeslagen. Annuleer het bewerken, open het item opnieuw vanuit de lijst en breng je wijzigingen aan.
  # OK button label
  save_anyway: Toch opslaan
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: De repository is tijdens het opslaan door iemand anders bijgewerkt. Probeer het opnieuw.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Een item dat in hetzelfde bestand is opgeslagen, is door iemand anders gewijzigd. Probeer het opnieuw.
  # {$path} is the file path
  array_file_invalid: Het bestand {$path} kan niet worden bijgewerkt, omdat het geen geldige lijst met items bevat.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
# repository while the user has it open. The change itself is described with the `save_conflict`
# strings above
remote_change:
  reload_entry: Item opnieuw laden
  # Confirmation shown before reloading when the user has unsaved changes
  confirm_reloading_entry: Weet je zeker dat je het item opnieuw wilt laden? Je niet-opgeslagen wijzigingen gaan verloren.

