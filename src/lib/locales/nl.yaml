    # `omit_default_locale_from_file_path` and the example paths. The curly brackets in the examples
    # are escaped with backslashes for MessageFormat 2
    locale_not_omitted_from_file_path: De placeholder `locale` kan niet uit het pad `file` `{$file}` worden verwijderd, dus de standaardtaal blijft erin staan ondanks de i18n-optie `omit_default_locale_from_file_path`. Om de taal weg te laten, gebruik je de placeholder als volledige mapnaam, zoals `\{\{locale\}\}/about.md`, of tussen de bestandsnaam en de extensie, zoals `about.\{\{locale\}\}.md`. Om de taal te behouden, stel je de optie in op `false` in de optie `i18n` van het bestand.
    # Don’t localize `i18n`
    i18n_not_configured: De optie `i18n` is ingeschakeld, maar i18n is niet geconfigureerd op het hoogste niveau van de configuratie of in de collectie, dus de optie heeft geen effect.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: De optie `public_folder` is een lege string, dus het pad `media_folder` wordt in plaats daarvan gebruikt voor de mediapaden die in items worden opgeslagen. Verwijder de optie of stel deze in op het pad dat je wilt gebruiken, zoals `/images`.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: De optie `{$option}` is niet gedefinieerd in het configuratieschema van Sveltia CMS. Deze wordt genegeerd. Controleer op een typefout of een syntaxisfout.
    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: De optie `default_localized` heeft geen effect, omdat i18n niet is ingeschakeld voor de collectie. Gebruik in plaats daarvan de optie `default`.
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: De optie `default_localized` heeft een waarde voor `{$locale}`, wat niet een van de talen van de collectie is, dus de waarde wordt nooit gebruikt.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Zie de compatibiliteitsnotities voor details: {$link}'

  # Console tip shown after config load
  schema_tip: Voor een betere ontwikkelaarservaring kun je je configuratiebestand valideren tegen het JSON-schema van Sveltia CMS. Zie {$link} voor details.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Lokaal
  # Browser compatibility warnings
  unsupported_browser: Local Workflow wordt niet ondersteund in je browser. Gebruik in plaats daarvan Chrome of Edge.
  disabled: Local Workflow is uitgeschakeld in je browser. <a>Zo schakel je het in</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Je bekijkt nu het bord van de redactionele workflow. Concepten: {$draft}. In review: {$review}. Klaar: {$ready}. Verwijdering in behandeling: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Je bekijkt nu het bord van de redactionele workflow. Concepten: {$draft}. In review: {$review}. Verwijdering in behandeling: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'Je bekijkt nu het bord van de redactionele workflow. Concepten: {$draft}. Klaar: {$ready}. Verwijdering in behandeling: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'Je bekijkt nu de pagina Concepten. Concepten: {$draft}. Verwijdering in behandeling: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Concept
  drafts: Concepten
  in_review: In review
  ready: Klaar
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Verwijdering in behandeling
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: Wordt gedeployed

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Verwijdering annuleren
  confirm_cancelling_deletion: Weet je zeker dat je deze verwijdering wilt annuleren? Het item blijft gepubliceerd.
  confirm_completing_deletion: Weet je zeker dat je dit item wilt verwijderen? Het wordt direct verwijderd.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ Item gemarkeerd voor verwijdering. }}
      *   {{ {$count} items gemarkeerd voor verwijdering. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Wijzigingen verworpen. }}
      *   {{ Wijzigingen in {$count} items verworpen. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Verwijdering wordt geannuleerd…
  deletion_cancelled: Verwijdering geannuleerd.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: De verwijdering kon niet worden geannuleerd. Probeer het opnieuw.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Niet-gepubliceerde items
  published_entries: Gepubliceerde items
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Status: {$status}'
  change_entry_status: Itemstatus wijzigen
  # Editor toolbar: progress label while the status is being changed
  changing_status: Status wordt gewijzigd…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Status wordt bijgewerkt…
  status_updated: Status bijgewerkt.
  # Error notification when the status could not be changed
  status_change_failed: De status kon niet worden gewijzigd. Probeer het opnieuw.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: Vernieuwen
  refreshing: Bezig met vernieuwen…
  refreshed: Het bord is bijgewerkt.
  # Error notification when the board could not be refreshed
  refresh_failed: Het bord kon niet worden vernieuwd. Probeer het opnieuw.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: Het item bevat fouten. Corrigeer deze voordat je de status wijzigt.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: Het item bevat fouten. Corrigeer deze voordat je het publiceert.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Ter review indienen
  confirm_sending_for_review: Je wijzigingen zijn opgeslagen als concept. Wil je het item ter review indienen, zodat iemand het kan bekijken en publiceren?
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: Markeren als klaar
  confirm_marking_as_ready: Je wijzigingen zijn opgeslagen als concept. Wil je het item als klaar markeren, zodat het kan worden gepubliceerd?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Item publiceren
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Wijzigingen verwerpen
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Weet je zeker dat je dit item wilt verwijderen? Het wordt pas verwijderd zodra de verwijdering is gepubliceerd. Tot die tijd vind je het nog in de itemlijst, gemarkeerd als “Verwijdering in behandeling”.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Dit item is nog niet gepubliceerd, dus als je het verwijdert, wordt het volledig verworpen.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Dit item heeft niet-gepubliceerde wijzigingen. Als je deze verwerpt, wordt de gepubliceerde versie hersteld. Het item zelf wordt niet verwijderd.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Het is nog niet gepubliceerd, dus je niet-gepubliceerde wijzigingen worden verworpen. Een eventueel gepubliceerde versie blijft gepubliceerd. }}
      *   {{ Ze zijn nog niet gepubliceerd, dus je niet-gepubliceerde wijzigingen worden verworpen. Eventueel gepubliceerde versies blijven gepubliceerd. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ Een ervan is nog niet gepubliceerd, dus je niet-gepubliceerde wijzigingen worden verworpen. Een eventueel gepubliceerde versie blijft gepubliceerd. }}
      *   {{ {$count} ervan zijn nog niet gepubliceerd, dus je niet-gepubliceerde wijzigingen worden verworpen. Eventueel gepubliceerde versies blijven gepubliceerd. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: Weet je zeker dat je dit item wilt publiceren? Je wijzigingen gaan live zodra je site opnieuw is gebouwd.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Item wordt gepubliceerd…
  entry_published: Item gepubliceerd.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Item wordt verwijderd…
  discarding_changes: Wijzigingen worden verworpen…
  entry_deleted: Item verwijderd.
  # Error notification when publishing fails
  publishing_entry_failed: Het item kon niet worden gepubliceerd. Probeer het opnieuw.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: Dit item kan hier niet worden gepubliceerd, omdat het andere wijzigingen bevat die het CMS je niet kan tonen. Vraag een ontwikkelaar om het te controleren.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: Het item is gewijzigd sinds je het hebt geopend. Laad de pagina opnieuw om de nieuwste versie te controleren voordat je het publiceert.
  review_on_x: Reviewen op {$service}
  from_fork: Vanuit een fork
  fork_entry_editable: Dit item komt uit een pull request van een bijdrager, geopend vanuit “{$fork}”. Je wijzigingen worden opgeslagen in diens branch. Review en merge de pull request op de Git-service.
  fork_entry_locked: Dit item komt uit een pull request van een bijdrager, geopend vanuit “{$fork}”. De bijdrager staat beheerders niet toe deze te bewerken, dus het item kan hier alleen worden bekeken.
  fork_not_editable: De bijdrager staat beheerders niet toe deze pull request te bewerken.
  fork_entry_gone: De pull request van de bijdrager is niet meer open, dus de wijzigingen kunnen er niet in worden opgeslagen.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: Er staat buiten het CMS al een ander verzoek ({$number}) open voor dit item. Vraag een ontwikkelaar om dit eerst te sluiten.
  # Workflow page: empty column message
  no_entries: Geen items.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Sleep om de status te wijzigen
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Verwijdering
  # Workflow page: note on a card listing the new entries that were created from a Relation field
  # of the entry and are published along with it, e.g. “Also adds Section: Getting Started”
  companion_entries: Voegt ook {$entries} toe
  # Workflow page: note on a card listing the existing entries that were edited from a Relation
  # field of the entry and are published along with it, e.g. “Also changes Author: Ada Lovelace”
  edited_companion_entries: Wijzigt ook {$entries}
  # Workflow page: one of the entries listed by `companion_entries` or `edited_companion_entries`,
  # named by its collection’s singular label and its title
  companion_entry: '{$collection}: {$title}'

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: Commitbericht
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: Beschrijf je wijzigingen. Het bericht wordt samen met de wijzigingen in de geschiedenis vastgelegd.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: Voeg een notitie toe aan het bericht dat samen met je wijzigingen in de geschiedenis wordt vastgelegd, zoals een issuenummer. Dit kan leeg blijven.
  # Accessible name of the text box when the user writes the whole message
  message: Commitbericht
  # Accessible name of the text box when the text is added before or after the message
  addition: Notitie
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'Bericht: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Repository forken
  fork: Forken
  confirm_forking_repository: Om wijzigingen voor te stellen aan “{$repo}” moet er een fork van de repository worden aangemaakt in je account. Je wijzigingen worden in die fork opgeslagen en door een beheerder beoordeeld voordat ze live gaan.
  # Error shown when the user declined the dialog above
  fork_declined: Je hebt een fork van de repository in je account nodig om wijzigingen voor te stellen.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Er kon geen fork van de repository “{$repo}” worden aangemaakt in je account.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: Je fork “{$fork}” heeft geen branch “{$branch}”. Werk de fork bij vanuit de repository “{$repo}” en log daarna opnieuw in.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Je toegang tot de repository “{$repo}” kon niet worden gecontroleerd. Probeer het zo meteen opnieuw.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: De repository “{$repo}” staat geen forks toe. Vraag een beheerder om forken in te schakelen.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Je hebt een openstaande uitnodiging voor de repository “{$repo}”. Accepteer deze op GitHub en log daarna opnieuw in.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Je login geeft geen toegang tot privérepository’s, dus de repository “{$repo}” kan niet worden gelezen. Vraag een beheerder om de authenticatie-instellingen van het CMS te controleren.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Alleen een beheerder kan wijzigingen op deze site publiceren. Markeer je item in plaats daarvan als “In review”, dan kijkt iemand ernaar.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: Een beheerder heeft dit item al gepubliceerd, dus er valt niets meer te reviewen.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Deze wijziging kan niet direct worden doorgevoerd. Alleen bewerkingen van items kunnen ter review worden voorgesteld.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Je wijzigingen worden opgeslagen in je fork van deze repository op “{$repo}” en beoordeeld voordat ze live gaan.
  view_fork: Fork bekijken

# ==============================================================================
# Settings Dialog
# ==============================================================================
# Strings for the settings/preferences dialog and its panels.

# Settings page aria-label
categories: Categorieën

# Preferences panels
prefs:
  account:
    title: Account
  # API key management feedback messages
  changes:
    api_key_saved: API key opgeslagen.
    api_key_removed: API key verwijderd.
    api_key_invalid: De opgegeven API key is ongeldig. Controleer deze en probeer het opnieuw.

  # Preferences operation errors
  error:
    permission_denied: Toegang tot de cookieopslag is geweigerd. Controleer de rechten in je browser en probeer het opnieuw.

  # Appearance panel
  appearance:
    title: Weergave
    theme: Thema
    select_theme: Thema selecteren

  # Theme options
  theme:
    dark: Donker
    light: Licht

  # Language panel
  language:
    title: Taal
    ui_language:
      title: Taal van de gebruikersinterface
      select_language: Taal selecteren

  # Contents panel
  contents:
    title: Inhoud
    editor:
      title: Editor
      use_draft_backup:
        switch_label: Automatisch een back-up maken van conceptitems
      close_on_save:
        switch_label: De editor sluiten na het opslaan van een concept
      close_with_escape:
        switch_label: De editor sluiten met de Escape-toets

  # Internationalization panel
  i18n:
    title: Internationalisatie
    translators:
      default:
        title: Standaardvertaaldienst
        select_service: Dienst selecteren
      api_keys:
        title: API keys voor vertaaldiensten
        description: Beheer de API keys voor <a>vertaaldiensten</a>. API keys voor algemene AI-diensten kun je beheren in de AI-instellingen.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: '{$service}-key'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Meld je aan bij <a {$homeHref}>{$service}</a> en voer hier <a {$apiKeyHref}>je API key</a> in om tekstvelden snel te kunnen vertalen.

  # Media panel
  media:
    title: Media
    stock_photos:
      api_keys:
        title: API keys voor stockfotodiensten
        description: Beheer de API keys voor <a>stockfotodiensten</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: '{$service} API key'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Meld je aan bij de <a {$homeHref}>{$service} API</a> en voer hier <a {$apiKeyHref}>je API key</a> in om gratis stockfoto’s in afbeeldingsvelden in te voegen.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Foto’s geleverd door {$service}
      no_services: Er zijn geen <a>stockfotodiensten</a> geconfigureerd.
    cloud_storage:
      api_keys:
        title: API keys voor cloudopslagdiensten
        description: Beheer de API keys voor <a>cloudopslagdiensten</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: '{$service} API key'
      no_services: Er zijn geen <a>cloudopslagdiensten</a> geconfigureerd.

  # AI panel
  ai:
    title: AI
    api_keys:
      title: API keys voor AI-diensten
      description: Beheer de API keys voor AI-diensten.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: '{$service} API key'

  # Accessibility panel
  accessibility:
    title: Toegankelijkheid
    underline_links:
      title: Links onderstrepen
      description: Links onderstrepen in het voorbeeld van het item en in labels van de gebruikersinterface.
      switch_label: Links altijd onderstrepen

  # Data Management panel
  data:
    title: Gegevensbeheer
    clear_data:
      title: Gegevens wissen
      # Clear File Cache button
      file_cache:
        description: Verwijder de lokaal gecachte bestandsinhoud en afbeeldingsminiaturen om opslagruimte vrij te maken of problemen door verouderde gegevens op te lossen.
        button_label: Bestandscache wissen
        confirmation: De lokaal gecachte bestandsinhoud en afbeeldingsminiaturen worden verwijderd. Je niet-opgeslagen concepten en instellingen blijven behouden, en verwijderde gegevens worden waar nodig opnieuw gedownload of gegenereerd. Het CMS wordt daarna opnieuw geladen.
      # Erase All Data button
      all_data:
        description: Verwijder alles wat het CMS in deze browser bewaart, inclusief gecachte bestanden, niet-opgeslagen concepten en instellingen. Alles wat al in je repository is opgeslagen, blijft ongewijzigd.
        button_label: Alle gegevens wissen
        confirmation: Alle gegevens die in deze browser zijn opgeslagen, worden verwijderd, inclusief gecachte bestandsinhoud, afbeeldingsminiaturen, niet-opgeslagen concepten, instellingen en de inlogstatus. Je repository blijft ongewijzigd, maar wijzigingen die je niet hebt opgeslagen gaan verloren en je moet opnieuw inloggen. Het CMS wordt daarna opnieuw geladen.

  # Developer panel
  developer:
    title: Ontwikkelaar
    developer_mode:
      title: Ontwikkelaarsmodus
      description: Schakel functies voor ontwikkelaars in, waaronder gedetailleerde consolelogs en native contextmenu’s.
      switch_label: Ontwikkelaarsmodus inschakelen
    local_git:
      title: Git-commits
      description: Commit je wijzigingen naar de huidige branch van je lokale repository wanneer je ze opslaat, zoals het CMS doet wanneer je met een externe repository werkt. Daarna kun je de commits controleren en pushen met je gebruikelijke Git-tools.
      switch_label: Wijzigingen naar Git committen
      checking: Bezig met controleren van de repository…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Wijzigingen worden gecommit naar de branch {$branch} als {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Wijzigingen kunnen nu niet worden gecommit. {$reason}
    deploy_hook:
      title: Deploy hook
