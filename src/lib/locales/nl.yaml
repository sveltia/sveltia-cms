# ==============================================================================
# Field Widgets
# ==============================================================================
# Strings for specific field widget types.

# Color field: opacity slider
opacity: Dekking

# Select field: empty option placeholder
unselected_option: (Geen)

# Relation field: creating or editing a referenced entry without leaving the editor
relation_field:
  # Note shown in the dialog. {$name} is the singular label of the referenced collection
  save_together_hint: De nieuwe {$name} wordt samen met het item dat je bewerkt opgeslagen.
  # Error shown when the entry couldn’t be prepared. {$name} is the singular label of the collection
  add_failed: '{$name} kon niet worden toegevoegd. Bekijk de browserconsole voor details.'
  # Title of the dialog to edit an entry selected in the field. {$name} is the singular label of the
  # referenced collection
  edit_entry_title: '{$name} bewerken'
  # Note shown in the dialog. {$name} is the singular label of the referenced collection
  edit_together_hint: Je wijzigingen aan {$name} worden samen met het item dat je bewerkt opgeslagen.
  # Error shown when the changes couldn’t be prepared. {$name} is the singular label of the collection
  edit_failed: De wijzigingen aan {$name} konden niet worden toegepast. Bekijk de browserconsole voor details.
  # Error shown when the changes would move the entry to another file path, e.g. through a path
  # template using a field. {$name} is the singular label of the collection
  move_unsupported: Door deze wijzigingen zou {$name} naar een andere locatie worden verplaatst. Dat kan alleen door het item afzonderlijk te bewerken.
  # Error shown when saving, if someone else has changed an entry edited from the field since. {$name}
  # is the summary of that entry
  edit_conflict: “{$name}” is door iemand anders gewijzigd sinds jij het hebt bewerkt. Open het opnieuw vanuit het veld om je wijzigingen te vergelijken met de nieuwste versie.
  # Error shown when saving, if someone else has deleted an entry edited from the field since.
  # {$name} is the summary of that entry
  edit_deleted: “{$name}” is door iemand anders verwijderd sinds jij het hebt bewerkt. Verwijder het uit het veld om het item op te slaan.
  # Accessible label of the menu listing the selected entries that can be edited
  select_entry_to_edit: Selecteer een item om te bewerken
  # Warning shown in the editor of an entry that has been edited from a Relation field of another
  # entry, while the changes wait in that entry’s pull request. {$name} is the summary of that
  # entry
  edited_with_entry: Wijzigingen aan dit item wachten erop om samen met “{$name}” te worden gepubliceerd. Als je het nu opslaat, worden beide sets wijzigingen gecombineerd wanneer dat item wordt gepubliceerd. Dit kan mislukken als ze overlappen.
  # Warning shown in the dialog when an entry edited from the field has been changed by someone else
  # since. {$name} is the singular label of the collection
  changed_since_edit: '{$name} is door iemand anders gewijzigd sinds jij het hebt bewerkt. Je wijzigingen worden getoond bovenop de nieuwste versie. Controleer ze voordat je bijwerkt.'

# Select Assets dialog
assets_dialog:
  # Dialog titles for different selection modes
  title:
    file: Bestand selecteren
    image: Afbeelding selecteren
    folder: Map selecteren

  # Search input labels
  search_for_file: Zoeken naar bestanden
  search_for_image: Zoeken naar afbeeldingen

  # Locations panel aria-label
  locations: Locaties

  # Folder selection mode for a File field with the `select_folder` option. {$path} is the public
  # path of the folder to be selected, and {$count} is the number of folders selected
  selected_folder: 'Geselecteerde map: {$path}'
  selected_folders: |
    .input {$count :integer}
    .match $count
      one {{ {$count} map geselecteerd }}
      *   {{ {$count} mappen geselecteerd }}
  no_subfolders: Deze map heeft geen submappen.
  # Shown for a cloud storage service whose `prefix` option depends on fields of the entry
  prefix_unresolved: Vul de velden in waarvan deze locatie afhangt om de bestanden ervan te bekijken en te uploaden.

  # Asset folder options
  folder:
    field: Veldmedia
    entry: Itemmedia
    file: Bestandsmedia
    collection: Collectiemedia
    global: Globale media

  # Error messages
  error:
    invalid_key: Je API key is ongeldig of verlopen. Controleer deze en probeer het opnieuw.
    search_fetch_failed: Er is een fout opgetreden bij het zoeken naar mediabestanden. Probeer het later opnieuw.
    image_fetch_failed: Er is een fout opgetreden bij het downloaden van het geselecteerde mediabestand. Probeer het later opnieuw.

  # Stock photo panels
  available_images: Beschikbare afbeeldingen
  available_files: Beschikbare bestanden

  # URL entry option
  enter_url: URL invoeren
  enter_file_url: 'Voer de URL van het bestand in:'
  enter_image_url: 'Voer de URL van de afbeelding in:'

  # Large file warning dialog
  large_file:
    title: Groot bestand

  # Invalid file warning dialog
  invalid_file:
    title: Ongeldig bestand

  # Warning dialog shown when files are rejected for more than one reason
  rejected_files:
    title: Bestanden kunnen niet worden geüpload

  # Photo credit dialog (stock photos)
  photo_credit:
    title: Fotocredits
    description: 'Gebruik indien mogelijk de volgende creditvermelding:'
    # {$field} is the label of the Markdown field the credit is added to
    insert_to_field: Invoegen in {$field}
    copy_as_markdown: Kopiëren als Markdown

  # Unsaved asset badge
  unsaved: Niet opgeslagen

# Character counter: shows character count for text fields
character_counter:
  # {$count} is the current character count; {$min} and {$max} are configured limits
  min_max: |
    .input {$count :integer}
    .match $count
      0   {{ Geen teken ingevoerd. Minimum: {$min}. Maximum: {$max}. }}
      one {{ {$count} teken ingevoerd. Minimum: {$min}. Maximum: {$max}. }}
      *   {{ {$count} tekens ingevoerd. Minimum: {$min}. Maximum: {$max}. }}
  # {$count} is the current character count and {$min} is the minimum allowed count
  min: |
    .input {$count :integer}
    .match $count
      0   {{ Geen teken ingevoerd. Minimum: {$min}. }}
      one {{ {$count} teken ingevoerd. Minimum: {$min}. }}
      *   {{ {$count} tekens ingevoerd. Minimum: {$min}. }}
  # {$count} is the current character count and {$max} is the maximum allowed count
  max: |
    .input {$count :integer}
    .match $count
      0   {{ Geen teken ingevoerd. Maximum: {$max}. }}
      one {{ {$count} teken ingevoerd. Maximum: {$max}. }}
      *   {{ {$count} tekens ingevoerd. Maximum: {$max}. }}

