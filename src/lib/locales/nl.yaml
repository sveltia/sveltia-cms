    auth_key_label: Application Key

  bunny_storage:
    auth_key_label: Wachtwoord van de Storage Zone

# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Er zit een fout in de CMS-configuratie. Los het probleem op en probeer het opnieuw. }}
      *   {{ Er zitten fouten in de CMS-configuratie. Los de problemen op en probeer het opnieuw. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: collectie {$collection}
    file: bestand {$file}
    component: component {$component}
    # Don’t localize `{$field}`
    field: veld `{$field}`

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS werkt alleen met HTTPS- of localhost-URL’s.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ De URL van het configuratiebestand moet het HTTPS-protocol of een localhost-adres gebruiken. }}
        *   {{ De URL’s van de configuratiebestanden moeten het HTTPS-protocol of localhost-adressen gebruiken. }}
    fetch_failed: Het configuratiebestand kon niet worden opgehaald.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: HTTP-respons ontvangen met status {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Het configuratiebestand kon niet worden opgehaald. Voeg <a>`load_config_file: false`</a> toe aan het configuratieobject dat aan `CMS.init()` wordt doorgegeven om te voorkomen dat het `config.yml`-bestand wordt geladen.'
    parse_failed: Het configuratiebestand kon niet worden verwerkt.
    parse_failed_invalid_object: Het configuratiebestand is geen geldig JavaScript-object.
    parse_failed_unsupported_type: Het configuratiebestand heeft geen geldig bestandstype. Alleen YAML, TOML en JSON worden ondersteund.
    no_collection: Er zijn geen collecties gedefinieerd.
    # Don’t localize `hide`
    no_visible_collection: Ten minste één collectie moet zichtbaar zijn. Controleer de optie `hide`.
    missing_backend: De backend is niet gedefinieerd.
    missing_backend_name: De naam van de backend is niet gedefinieerd.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: De {$name}-backend wordt <a>niet ondersteund</a> in Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: De verouderde {$name}-backend wordt <a>niet ondersteund</a> in Sveltia CMS.
    unsupported_custom_backend: Eigen backends worden <a>niet ondersteund</a> in Sveltia CMS.
    unsupported_backend_suggestion: Gebruik in plaats daarvan een van de <a>ondersteunde backends</a>.
    missing_repository: De repository is niet gedefinieerd.
    invalid_repository: De geconfigureerde repository is ongeldig. Deze moet de indeling “owner/repo” hebben.
    # Don’t localize `api_root`
    missing_api_root: De optie `api_root` is niet gedefinieerd. Deze is vereist voor de Forgejo-backend.
    invalid_root_dir: De hoofdmap is ongeldig. Het moet een pad binnen de repository zijn, zonder “..”.
    invalid_root_dir_branch: De hoofdmap kan niet worden gebruikt in de branchnamen van de publicatiemodi `editorial_workflow` en `preview`. Geen enkel deel van het pad mag met een punt beginnen, op “.lock” eindigen of een spatie of een speciaal teken zoals een dubbele punt of een asterisk bevatten.
    path_outside_root_dir: Het pad “{$path}” leidt buiten de hoofdmap, waar het CMS geen bestanden kan weergeven.
    oauth_implicit_flow: De geconfigureerde authenticatiemethode (implicit flow) wordt niet ondersteund in Sveltia CMS. Gebruik in plaats daarvan een andere <a>authenticatiemethode</a>.
    github_pkce_unsupported: PKCE-autorisatie wordt nog niet ondersteund vanwege beperkingen van GitHub. Gebruik in plaats daarvan een andere <a>authenticatiemethode</a>.
    additions_no_base_url: De optie `base_url` moet de URL van je Sveltia CMS Additions-service zijn.
    oauth_no_app_id: De OAuth-applicatie-ID is niet gedefinieerd.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: De optie `open_authoring` vereist de publicatiemodus `editorial_workflow` of `preview`. Zie de <a>documentatie</a> voor details.
    # Don’t localize `auth_methods`
    no_auth_methods: De optie `auth_methods` moet minstens één methode bevatten.
    # Don’t localize `auth_scope`, `repo` and `public_repo`
    auth_scope_no_repo: De optie `auth_scope` moet `repo` of `public_repo` bevatten.
    missing_media_folder: De mediamap is niet gedefinieerd.
    public_folder_relative_path: De geconfigureerde publieke map is ongeldig. Deze moet een absoluut pad zijn dat begint met “/”.
    public_folder_absolute_url: Een absolute URL voor de optie voor de publieke map wordt niet ondersteund in Sveltia CMS.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: De optie `{$option}` bevat de sjabloontag `{$tag}`, die daar niet wordt ondersteund. Alleen de slugsjabloontags, zoals `\{\{slug\}\}` en `\{\{year\}\}`, en de tags `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` en `\{\{public_folder\}\}` kunnen worden gebruikt.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: De optie `{$option}` bevat de sjabloontag `{$tag}`, die alleen kan worden gebruikt in de optie van een collectie, een collectiebestand of een veld, waar een item is om de tag mee in te vullen.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: De optie `sanitize_replacement` is ingesteld op `{$replacement}`, maar bevat een teken dat niet in een slug kan worden gebruikt, dus het kan geen ander teken vervangen.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: De optie `{$option}` is ingesteld op `{$url}`, maar moet een absolute URL zijn die begint met `https://` of `http://`.
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: De optie `stages` van `publish_mode` moet beginnen met `draft` en de fasen vermelden in de volgorde `draft`, `pending_review`, `pending_publish`, zonder herhalingen.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: De optie `i18n.locales` moet minstens één taal bevatten.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: De optie `default_locale` is ingesteld op `{$locale}`, maar dit is niet een van de `locales`.
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: De optie `initial_locales` bevat `{$locale}`, maar dit is niet een van de `locales`.
    # Don’t localize `i18n`
    i18n_no_collections: 'De optie `i18n` is op het hoogste niveau geconfigureerd, maar geen van de collecties of singletons heeft de optie `i18n`, dus er kan geen inhoud worden vertaald. Voeg `i18n: true` toe aan de collecties en singletons die je wilt vertalen.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: De optie `transformations` bevat een niet-ondersteunde sleutel `{$key}`. Dit moet `raster_image`, `svg` of een ondersteund rasterafbeeldingsformaat zijn.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: De optie `quality` voor de transformatie `{$key}` is ongeldig. Dit moet een geheel getal tussen 0 en 100 zijn.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: De optie `{$prop}` voor de transformatie `{$key}` is ongeldig. Dit moet een positief geheel getal zijn.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: Voor mediacollectie {$count} moet de optie `name` als niet-lege string zijn gedefinieerd.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: De naam `{$name}` van de mediacollectie is ongeldig. Deze mag geen speciale tekens bevatten.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Namen van mediacollecties moeten uniek zijn, maar `{$name}` wordt meer dan eens gebruikt.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: Voor de collectie moet de optie `folder`, `file`, `files` of `divider` zijn gedefinieerd.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: De collectie kan niet meer dan één van de opties `folder`, `file`, `files` en `divider` hebben.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: De extensie `{$extension}` komt niet overeen met het formaat `{$format}`.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: Het veld `{$name}` wordt opgeslagen als de body onder de front matter, die alleen tekst kan bevatten, geen getal, booleaanse waarde, lijst of object zoals een `{$widget}`-veld. Gebruik een veldtype dat tekst bevat of hernoem het veld.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
    # brackets are escaped with backslashes for MessageFormat 2
    invalid_collection_data_file: De optie `file` `{$file}` is ongeldig. Het moet het pad naar een JSON-bestand zijn, zonder de placeholder `\{\{locale\}\}`.
    # {$prop} is the option name; Don’t localize `file`
    unsupported_collection_data_file_option: De optie `{$prop}` wordt niet ondersteund in een collectie met de optie `file`.
    # Don’t localize `file`, `publish_mode` and `simple`
    collection_data_file_workflow: De redactionele workflow en de voorbeeldworkflow, inclusief Open Authoring, worden niet ondersteund in een collectie met de optie `file`. Stel de optie `publish_mode` van de collectie in op `simple`.
    # {$prop} is the option name; Don’t localize `file` and `slug`. The curly brackets are escaped
    # with backslashes for MessageFormat 2
    collection_data_file_slug_tag: De optie `{$prop}` mag de tag `\{\{slug\}\}` niet bevatten in een collectie met de optie `file`, omdat de slug van een item de positie ervan is, die verandert wanneer de items opnieuw worden geordend of verwijderd. Gebruik in plaats daarvan een veld met een unieke waarde.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: De slugsjabloon `{$slug}` is ongeldig, omdat deze geen schuine strepen mag bevatten. Gebruik de optie `path` in plaats van `slug` om items in submappen te ordenen.
    # {$name} is the field name from the configuration; Don’t localize `identifier_field`
    invalid_identifier_field: De optie `identifier_field` verwijst naar `{$name}`, maar er is geen veld met die naam gedefinieerd in de collectie.
    # {$name} is the field name from the configuration; Don’t localize `filter`
    invalid_filter_field: De optie `filter` verwijst naar `{$name}`, maar er is geen veld met die naam gedefinieerd in de collectie.
    # Don’t localize `filter`, `value` and `pattern`
    invalid_filter_no_condition: De optie `filter` moet de optie `value` of `pattern` hebben om items mee te vergelijken.
    # {$option} is an option name such as `slug` or `summary` and {$name} is the field name or template tag from the configuration
    option_field_not_found: De optie `{$option}` verwijst naar `{$name}`, maar er is geen veld met die naam gedefinieerd.
    # {$name} is the field name from the configuration and {$widget} is its field type; Don’t localize `thumbnail`
    thumbnail_field_not_media: De optie `thumbnail` verwijst naar `{$name}`, maar dit moet een Image- of File-veld zijn, geen `{$widget}`-veld.
    # Don’t localize `inline` or `multiple`
    invalid_inline_component_fields: De modus `inline` vereist één Boolean-, Color-, DateTime-, Number-, Relation-, Select- of String-veld. Bij een Relation- of Select-veld mag de optie `multiple` niet zijn ingeschakeld.
    # {$option} is an option name such as `pattern` or `filter` and {$pattern} is the configured pattern
    invalid_regex: De optie `{$option}` bevat een ongeldige reguliere expressie `{$pattern}`, die wordt genegeerd.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: De optie `reorder` verwijst naar een weergavegroep met de naam `{$name}`, maar er is geen groep met die naam gedefinieerd in de optie `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit` and `fields`
    invalid_bulk_edit_field: De lijst `fields` van de optie `bulk_edit` verwijst naar een veld met de naam `{$name}`, maar er is geen veld op het hoogste niveau met die naam gedefinieerd in de collectie.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit`, `fields` and `multiple`
    unsupported_bulk_edit_field: Het veld `{$name}` in de lijst `fields` van de optie `bulk_edit` kan niet bulksgewijs worden bewerkt. Alleen een Boolean-, Color-, DateTime-, Number-, Relation-, Select- of String-veld dat niet alleen-lezen is, waarvoor de optie `multiple` niet is ingeschakeld en dat niet automatisch wordt ingesteld bij het opslaan, wordt ondersteund.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: De optie `sortable_fields` verwijst naar een veld met de naam `{$name}`, maar er is geen veld met die naam gedefinieerd in de collectie.
    # Don’t localize `sortable_fields` and `default_sort`
    multiple_sortable_field_defaults: Slechts één item in de optie `sortable_fields` mag de optie `default_sort` hebben.
    # {$option} is `table_columns` or `summary_fields`, and {$name} is the field name from the configuration
    invalid_table_column_field: De optie `{$option}` verwijst naar een veld met de naam `{$name}`, maar er is geen veld met die naam gedefinieerd in de collectie.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: De optie `view_groups` verwijst naar een veld met de naam `{$name}`, maar er is geen veld met die naam gedefinieerd in de collectie.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
