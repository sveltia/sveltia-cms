    few  one  {{ Эта коллекция приближается к лимиту в {$quota} записи. Вы можете создать ещё только {$remaining} запись. }}
    few  few  {{ Эта коллекция приближается к лимиту в {$quota} записи. Вы можете создать ещё только {$remaining} записи. }}
    few  many {{ Эта коллекция приближается к лимиту в {$quota} записи. Вы можете создать ещё только {$remaining} записей. }}
    few  *    {{ Эта коллекция приближается к лимиту в {$quota} записи. Вы можете создать ещё только {$remaining} записей. }}
    many one  {{ Эта коллекция приближается к лимиту в {$quota} записей. Вы можете создать ещё только {$remaining} запись. }}
    many few  {{ Эта коллекция приближается к лимиту в {$quota} записей. Вы можете создать ещё только {$remaining} записи. }}
    many many {{ Эта коллекция приближается к лимиту в {$quota} записей. Вы можете создать ещё только {$remaining} записей. }}
    many *    {{ Эта коллекция приближается к лимиту в {$quota} записей. Вы можете создать ещё только {$remaining} записей. }}
    *    one  {{ Эта коллекция приближается к лимиту в {$quota} записей. Вы можете создать ещё только {$remaining} запись. }}
    *    few  {{ Эта коллекция приближается к лимиту в {$quota} записей. Вы можете создать ещё только {$remaining} записи. }}
