local_git_skip_reasons:
  unsupported_repository: Ваш репозиторий использует функцию Git, которую CMS не поддерживает, например связанное рабочее дерево (linked worktree), имена объектов SHA-256, формат reftable, разреженный индекс или индекс версии 3 или 4, который используют параметр feature.manyFiles и команда git add -N.
  missing_identity: Ваше имя и адрес эл. почты не заданы в конфигурации Git репозитория, а CMS не может прочитать вашу глобальную конфигурацию. Задайте их в репозитории командами git config --local user.name "Your Name" и git config --local user.email "you@example.com".
  locked: Репозиторий используется другим процессом Git. Если такой процесс не запущен, удалите файл .git/index.lock.
  # The operation in progress, with how to finish or cancel it
  operation_in_progress:
    merge: Выполняется слияние. Завершите его командой git commit или отмените командой git merge --abort.
    rebase: Выполняется перебазирование. Завершите его командой git rebase --continue или отмените командой git rebase --abort. Если вы уже перешли к другой работе, команда git rebase --quit прекратит его, не изменяя ваши файлы.
    cherry_pick: Выполняется cherry-pick. Завершите его командой git cherry-pick --continue или отмените командой git cherry-pick --abort.
    revert: Выполняется отмена коммита (revert). Завершите её командой git revert --continue или отмените командой git revert --abort.
    am: Выполняется применение патчей с помощью git am. Завершите его командой git am --continue или отмените командой git am --abort.
    conflict: В некоторых файлах есть конфликты. Сначала разрешите их и добавьте результаты в индекс.
  detached_head: Ни одна ветка не извлечена.
  staged_changes: В индексе есть другие изменения, подготовленные к коммиту. Сначала зафиксируйте их или уберите из индекса.
  # {$path} is the file path
  lfs: '{$path} отслеживается с помощью Git LFS, в который CMS не может делать коммиты.'
