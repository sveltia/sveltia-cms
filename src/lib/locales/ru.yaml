    # {$name} is the subfield name; Don’t localize `map_key_field`
    list_field_map_key_not_found: Параметр `map_key_field` поля List ссылается на `{$name}`, но вложенного поля с таким именем нет.
    # {$name} is the subfield name, and {$type} is the variable type name; Don’t localize `map_key_field`
    list_field_map_key_missing_in_type: Параметр `map_key_field` поля List ссылается на `{$name}`, но у типа `{$type}` нет вложенного поля с таким именем.
    # {$name} is the subfield name, and {$widget} is its field type; Don’t localize `map_key_field`
    list_field_map_key_invalid_type: Параметр `map_key_field` поля List ссылается на `{$name}`, но это должно быть поле String, Relation или Select, а не поле `{$widget}`.
    # {$name} is the subfield name; Don’t localize `map_key_field` and `multiple`
    list_field_map_key_multiple: Параметр `map_key_field` поля List ссылается на `{$name}`, но вложенное поле не может принимать несколько значений, так как каждому элементу нужен один ключ. Удалите его параметр `multiple`.
    # {$name} is the subfield name; Don’t localize `map_key_field`
    list_field_map_key_option_not_string: Параметр `map_key_field` поля List ссылается на `{$name}`, но варианты вложенного поля должны иметь строковые значения, так как каждый ключ хранится в виде строки.
    # {$name} is the subfield name; Don’t localize `map_key_field` and `required`
    list_field_map_key_not_required: Параметр `map_key_field` поля List ссылается на `{$name}`, но вложенное поле не может быть необязательным, так как каждому элементу нужен ключ. Удалите его параметр `required`.
    # {$name} is the subfield name; Don’t localize `map_key_field`, `i18n: false` and `i18n: duplicate`
    list_field_map_key_not_localized: 'Параметр `map_key_field` поля List ссылается на `{$name}`, но у вложенного поля не может быть `i18n: false`, так как элементам нужен ключ в каждой локали. Используйте `i18n: duplicate` или удалите этот параметр.'
    # Don’t localize `i18n`, `duplicate_if_empty`, `multiple` and `true`
    duplicate_if_empty_multiple: 'Параметр `i18n: duplicate_if_empty` не поддерживается для поля с параметром `multiple`, поэтому поле работает так же, как с `i18n: true`.'
    # Don’t localize `default` and `multiple`
    invalid_default_multiple: Параметр `default` должен быть массивом, так как параметр `multiple` имеет значение `true`.
    invalid_default_single: Параметр `default` должен быть одиночным значением, а не массивом, так как параметр `multiple` не имеет значения `true`.
    # {$key} is a property name of the default object from the configuration; Don’t localize `default`
    object_field_invalid_default_key: Параметр `default` поля Object имеет свойство `{$key}`, но вложенного поля с таким именем нет.
    # {$typeKey} is the configured type key, `type` by default; Don’t localize `default` and `types`
    object_field_default_missing_type: Параметр `default` поля Object не имеет свойства `{$typeKey}`, которое указывает один из типов `types`.
    # {$typeKey} is the configured type key, `type` by default, and {$value} is its value in the default object; Don’t localize `default` and `types`
    object_field_invalid_default_type: Свойство `{$typeKey}` параметра `default` поля Object равно `{$value}`, но это значение не входит в `types`.
    # Don’t localize `default` and `output_code_only`
    code_field_invalid_default_object: Параметр `default` поля Code должен быть строкой, так как параметр `output_code_only` имеет значение `true`.
    # {$key} is a property name of the default object, {$code} and {$lang} are the configured property names; Don’t localize `default` and `keys`
    code_field_invalid_default_key: Параметр `default` поля Code имеет свойство `{$key}`, но параметр `keys` допускает только `{$code}` и `{$lang}`.
    # {$valueType} is the configured value type; Don’t localize `value` and `value_type`
    compute_field_invalid_expression: Параметр `value` поля Compute должен быть допустимым арифметическим выражением, например `\{\{fields.price\}\} * \{\{fields.quantity\}\}`, так как параметр `value_type` имеет значение `{$valueType}`.
    # {$valueType} is the configured value type; Don’t localize `value` and `value_type`
    compute_field_uuid_in_expression: Параметр `value` поля Compute не может использовать тег UUID, например `\{\{uuid\}\}`, так как параметр `value_type` имеет значение `{$valueType}`, что делает его арифметическим выражением.
    # {$value} is the default value and {$valueType} is the configured value type; Don’t localize `default` and `value_type`
    number_field_default_not_integer: Параметр `default` поля Number установлен в `{$value}`, но это должно быть целое число, так как параметр `value_type` имеет значение `{$valueType}`.
    number_field_default_not_number: Параметр `default` поля Number установлен в `{$value}`, но это должно быть число, так как параметр `value_type` имеет значение `{$valueType}`.
    # Don’t localize `fields` and `types`
    object_field_no_subfields: Параметр `fields` или `types` поля Object должен содержать хотя бы один элемент.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: Коллекция `{$collection}`, на которую есть ссылка, недействительна или не определена.
    relation_field_invalid_collection_file: Файл `{$file}`, на который есть ссылка, недействителен или не определён.
    # Don’t localize `file`
    relation_field_missing_file_name: Параметр `file` должен быть определён для связи с файловой коллекцией.
    relation_field_invalid_value_field: Поле значения `{$field}`, на которое есть ссылка, недействительно или не определено.
    # {$collection} is the referenced collection name; Don’t localize `file`, `value_field` and `slug`.
    # The curly brackets are escaped with backslashes for MessageFormat 2
    relation_field_array_file_slug: Связь с коллекцией `{$collection}` не может хранить значение `\{\{slug\}\}`, так как слаг записи в коллекции с параметром `file` — это её позиция, которая меняется при изменении порядка или удалении записей. Вместо этого укажите в параметре `value_field` поле с уникальным значением.
    # {$collection} is the referenced collection name; Don’t localize `file`
    relation_field_array_file_workflow: Коллекция с параметром `file` не может иметь связь с коллекцией `{$collection}`, которая использует редакционный процесс или процесс предпросмотра, так как ссылки на запись, переименованную или удалённую там, невозможно обновить в файле.
    relation_field_invalid_display_field: Поле отображения `{$field}`, на которое есть ссылка, недействительно или не определено.
    relation_field_invalid_search_field: Поле поиска `{$field}`, на которое есть ссылка, недействительно или не определено.
    relation_field_invalid_filter_field: Поле фильтра `{$field}`, на которое есть ссылка, недействительно или не определено.
    relation_field_invalid_sort_field: Поле сортировки `{$field}`, на которое есть ссылка, недействительно или не определено.
    # Don’t localize `sort_by` and `file`
    relation_field_sort_by_file_ignored: Параметр `sort_by` не применяется к связи с файлом, варианты которой следуют порядку элементов списка. Он будет проигнорирован.
    unexpected: Непредвиденная ошибка

    # Schema validation errors, reported when the configuration doesn’t match the published JSON
    # schema. In all of these, {$option} is a configuration option path such as `backend.name` or
    # `view_filters[0].pattern`, relative to the collection, file or field named before it.
    # {$type} is a value type name from `schema_value_type` below
    schema_invalid_type: Параметр `{$option}` должен быть {$type}.
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'Параметр `{$option}` должен иметь одно из следующих значений: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: Параметр `{$option}` должен иметь значение `{$value}`.
    schema_invalid_empty_value: Параметр `{$option}` должен быть пустой строкой.
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: |
      .input {$count :integer}
      .match $count
        one  {{ Параметр `{$option}` должен быть массивом из {$count} элемента. }}
        few  {{ Параметр `{$option}` должен быть массивом из {$count} элементов. }}
        many {{ Параметр `{$option}` должен быть массивом из {$count} элементов. }}
        *    {{ Параметр `{$option}` должен быть массивом из {$count} элементов. }}
    schema_invalid_value: Параметр `{$option}` имеет недопустимое значение.
    schema_missing_option: Параметр `{$option}` обязателен.
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Требуется один из следующих параметров: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: строкой
      number: числом
      integer: целым числом
      boolean: логическим значением
      array: массивом
      object: объектом
      'null': пустым

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: Идентификатор OAuth-приложения не определён. Пользователи должны предоставить токен доступа для входа.
    # Don’t localize `prefix`
    site_library_prefix_template: Параметр `prefix` медиатеки содержит теги шаблона, которые поддерживаются только на уровне поля, так как на верхнем уровне нет записи для их заполнения.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: Параметр `{$prop}` не поддерживается в Sveltia CMS. Он будет проигнорирован.
    # Don’t localize `stages`, `publish_mode`, `editorial_workflow` and {$type}, which is `preview` or `simple`
    publish_mode_stages_ignored: Параметр `stages` в `publish_mode` применяется только к режиму публикации `editorial_workflow`, поэтому с `{$type}` он игнорируется.
    # Don’t localize `pattern`, `m` and `s`
    inline_component_multiline_pattern: Параметр `pattern` этого встроенного компонента имеет флаг `m` или `s` либо совпадает с переносами строк, но встроенный компонент сопоставляется только в пределах абзаца.
    # {$name} is a button or component name and {$option} is `buttons` or `editor_components`; Don’t localize them and `multiline: false`
    single_line_block_item: 'Элемент `{$name}` параметра `{$option}` игнорируется, так как поле с `multiline: false` может содержать только встроенное содержимое.'
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Установлены как `picker_utc`, так и более новые параметры часового пояса (`input_timezone` или `output_utc`). Более новые параметры имеют приоритет. Рассмотрите возможность удаления `picker_utc` из вашей конфигурации.
    # Don’t localize `localize_format` and `format`
    localize_format_without_format: Параметр `localize_format` не действует, так как у поля нет параметра `format` и его значение хранится в формате ISO 8601.
    # {$name} is a template tag like `fields.lines.*.price`; Don’t localize `value`, `*` and `sum()`
    compute_field_wildcard_without_item: Параметр `value` поля Compute ссылается на `{$name}`, но поле не находится в элементе списка, который обозначает `*`, поэтому ссылка ничего не возвращает. Использовать все элементы списка может только агрегатная функция, например `sum()`.
    # {$name} is a template tag like `fields.lines.*.amount`; Don’t localize `value`
    compute_field_self_reference: Параметр `value` поля Compute ссылается на само поле как `{$name}`, поэтому его значение меняется при каждом вычислении и никогда не стабилизируется.
    # {$name} is a template tag like `fields.total`; Don’t localize `value`
    compute_field_reference_cycle: Параметр `value` поля Compute ссылается на `{$name}` — другое поле Compute, которое ссылается обратно на это поле напрямую или через другие поля, поэтому их значения никогда не стабилизируются.
    # Don’t localize `localize_format`, `true` and `de`
    localize_format_without_i18n: Параметр `localize_format` имеет значение `true`, но интернационализация не включена для коллекции, поэтому значение записывается на английском. Вместо этого укажите код локали, например `de`.
    # {$locale} is the locale code from the configuration; Don’t localize `localize_format`
    localize_format_unsupported_locale: Параметр `localize_format` установлен в `{$locale}`, но эта локаль не поддерживается, поэтому значение записывается на английском.
    # Don’t localize `preview_path`
    preview_path_no_date_field: Параметр `preview_path` использует теги даты и времени, но в коллекции нет поля DateTime, из которого их можно прочитать, поэтому ссылка на предпросмотр не будет показана.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: Параметр `preview_path_date_field` ссылается на поле с именем `{$name}`, но поле DateTime с таким именем не определено, поэтому ссылка на предпросмотр не будет показана.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: Параметр `preview_path` ссылается на `{$name}`, но такое поле не определено в коллекции, поэтому ссылка на предпросмотр не будет показана.
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: В коллекции нет поля `{$name}` для именования новых записей, поэтому каждая новая запись получает случайный слаг. Добавьте поле `{$name}` или задайте параметр `identifier_field` или `slug`.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: Параметр `i18n` в `slug` не действует, так как коллекция не использует структуру i18n `multiple_files`, `multiple_folders` или `multiple_root_folders`, в которой у каждой локали свой файл.
    # Don’t localize `slug`, `template` and `auto_increment`
    slug_template_ignored: Параметр `template` в `slug` игнорируется, так как слаги нумеруются параметром `auto_increment`.
    # {$file} is the file path; Don’t localize `file`, `locale`, `i18n`, `false`,
    # `omit_default_locale_from_file_path` and the example paths. The curly brackets in the examples
    # are escaped with backslashes for MessageFormat 2
    locale_not_omitted_from_file_path: Заполнитель `locale` невозможно убрать из пути `file` `{$file}`, поэтому локаль по умолчанию остаётся в нём, несмотря на параметр i18n `omit_default_locale_from_file_path`. Чтобы исключить локаль, используйте заполнитель как целое имя папки, например `\{\{locale\}\}/about.md`, или между именем файла и расширением, например `about.\{\{locale\}\}.md`. Чтобы сохранить её, установите этот параметр в `false` в параметре `i18n` файла.
    # Don’t localize `i18n`
    i18n_not_configured: Параметр `i18n` включён, но интернационализация не настроена ни на верхнем уровне конфигурации, ни в коллекции, поэтому параметр не действует.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: Параметр `public_folder` является пустой строкой, поэтому для путей к ресурсам, сохраняемых в записях, используется путь `media_folder`. Удалите параметр или укажите нужный путь, например `/images`.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: Параметр `{$option}` не определён в схеме конфигурации Sveltia CMS. Он будет проигнорирован. Проверьте, нет ли опечатки или синтаксической ошибки.
    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: Параметр `default_localized` не действует, так как интернационализация не включена для коллекции. Используйте вместо него параметр `default`.
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: Параметр `default_localized` содержит значение для `{$locale}`, но эта локаль не входит в локали коллекции, поэтому значение никогда не используется.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Подробнее см. в примечаниях о совместимости: {$link}'

  # Console tip shown after config load
  schema_tip: Для лучшего опыта разработки вы можете проверить свой файл конфигурации по JSON-схеме Sveltia CMS. Подробнее см. {$link}.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Локальный
  # Browser compatibility warnings
  unsupported_browser: Локальный рабочий процесс не поддерживается в вашем браузере. Используйте Chrome или Edge.
  disabled: Локальный рабочий процесс отключён в вашем браузере. <a>Вот как его включить</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Вы просматриваете доску редакционного процесса. Черновики: {$draft}. На рассмотрении: {$review}. Готово: {$ready}. Ожидают удаления: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Вы просматриваете доску редакционного процесса. Черновики: {$draft}. На рассмотрении: {$review}. Ожидают удаления: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'Вы просматриваете доску редакционного процесса. Черновики: {$draft}. Готово: {$ready}. Ожидают удаления: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'Вы просматриваете страницу черновиков. Черновики: {$draft}. Ожидают удаления: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Черновик
  drafts: Черновики
  in_review: На рассмотрении
  ready: Готово
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Ожидает удаления
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: Развёртывание

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Отменить удаление
  confirm_cancelling_deletion: Вы уверены, что хотите отменить это удаление? Запись останется опубликованной.
  confirm_completing_deletion: Вы уверены, что хотите удалить эту запись? Она будет удалена немедленно.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      1    {{ Запись помечена на удаление. }}
      one  {{ {$count} запись помечена на удаление. }}
      few  {{ {$count} записи помечены на удаление. }}
      many {{ {$count} записей помечены на удаление. }}
      *    {{ {$count} записей помечены на удаление. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      1    {{ Изменения отброшены. }}
      one  {{ Изменения в {$count} записи отброшены. }}
      few  {{ Изменения в {$count} записях отброшены. }}
      many {{ Изменения в {$count} записях отброшены. }}
      *    {{ Изменения в {$count} записях отброшены. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Отмена удаления…
  deletion_cancelled: Удаление отменено.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Не удалось отменить удаление. Попробуйте ещё раз.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Неопубликованные записи
  published_entries: Опубликованные записи
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Статус: {$status}'
  change_entry_status: Изменить статус записи
  # Editor toolbar: progress label while the status is being changed
  changing_status: Изменение статуса…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Обновление статуса…
  status_updated: Статус обновлён.
  # Error notification when the status could not be changed
  status_change_failed: Не удалось изменить статус. Попробуйте ещё раз.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: Обновить
  refreshing: Обновление…
  refreshed: Доска обновлена.
  # Error notification when the board could not be refreshed
  refresh_failed: Не удалось обновить доску. Попробуйте ещё раз.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: В записи есть ошибки. Исправьте их, прежде чем менять статус.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: В записи есть ошибки. Исправьте их, прежде чем публиковать.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Отправить на рассмотрение
  confirm_sending_for_review: Ваши изменения сохранены как черновик. Отправить запись на рассмотрение, чтобы кто-нибудь проверил и опубликовал её?
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: Отметить как готовое
  confirm_marking_as_ready: Ваши изменения сохранены как черновик. Отметить запись как готовую, чтобы её можно было опубликовать?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Опубликовать запись
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Отбросить изменения
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Вы уверены, что хотите удалить эту запись? Она не будет удалена, пока удаление не будет опубликовано. До тех пор она останется в списке записей с пометкой «Ожидает удаления».
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Эта запись ещё не опубликована, поэтому при удалении она будет полностью отброшена.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: В этой записи есть неопубликованные изменения. При их отбрасывании будет восстановлена опубликованная версия. Сама запись удалена не будет.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      1   {{ Она ещё не опубликована, поэтому ваши неопубликованные изменения будут отброшены. Опубликованная версия, если она есть, останется опубликованной. }}
      *   {{ Они ещё не опубликованы, поэтому ваши неопубликованные изменения будут отброшены. Опубликованные версии, если они есть, останутся опубликованными. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      1    {{ Одна из них ещё не опубликована, поэтому ваши неопубликованные изменения будут отброшены. Опубликованная версия, если она есть, останется опубликованной. }}
      one  {{ {$count} из них ещё не опубликована, поэтому ваши неопубликованные изменения будут отброшены. Опубликованная версия, если она есть, останется опубликованной. }}
      few  {{ {$count} из них ещё не опубликованы, поэтому ваши неопубликованные изменения будут отброшены. Опубликованные версии, если они есть, останутся опубликованными. }}
      many {{ {$count} из них ещё не опубликованы, поэтому ваши неопубликованные изменения будут отброшены. Опубликованные версии, если они есть, останутся опубликованными. }}
      *    {{ {$count} из них ещё не опубликованы, поэтому ваши неопубликованные изменения будут отброшены. Опубликованные версии, если они есть, останутся опубликованными. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: Вы уверены, что хотите опубликовать эту запись? Изменения появятся на сайте после его пересборки.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Публикация записи…
  entry_published: Запись опубликована.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Удаление записи…
  discarding_changes: Отбрасывание изменений…
  entry_deleted: Запись удалена.
  # Error notification when publishing fails
  publishing_entry_failed: Не удалось опубликовать запись. Попробуйте ещё раз.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: Эту запись нельзя опубликовать здесь, так как она содержит другие изменения, которые CMS не может вам показать. Попросите разработчика проверить её.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: Запись была изменена после того, как вы её открыли. Перезагрузите страницу, чтобы проверить последнюю версию перед публикацией.
  review_on_x: Проверить на {$service}
  from_fork: Из форка
  fork_entry_editable: Эта запись взята из пул-реквеста участника, открытого из «{$fork}». Ваши изменения сохраняются в его ветку. Проверьте и слейте пул-реквест в Git-сервисе.
  fork_entry_locked: Эта запись взята из пул-реквеста участника, открытого из «{$fork}». Участник не разрешает сопровождающим редактировать его, поэтому здесь его можно только просматривать.
  fork_not_editable: Участник не разрешает сопровождающим редактировать этот пул-реквест.
  fork_entry_gone: Пул-реквест участника больше не открыт, поэтому изменения невозможно в него сохранить.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: Для этой записи вне CMS уже открыт другой запрос ({$number}). Попросите разработчика сначала закрыть его.
  # Workflow page: empty column message
  no_entries: Нет записей.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Перетащите, чтобы изменить статус
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Удаление
  # Workflow page: note on a card listing the new entries that were created from a Relation field
  # of the entry and are published along with it, e.g. “Also adds Section: Getting Started”
  companion_entries: 'Также добавляет: {$entries}'
  # Workflow page: note on a card listing the existing entries that were edited from a Relation
  # field of the entry and are published along with it, e.g. “Also changes Author: Ada Lovelace”
  edited_companion_entries: 'Также изменяет: {$entries}'
  # Workflow page: one of the entries listed by `companion_entries` or `edited_companion_entries`,
  # named by its collection’s singular label and its title
  companion_entry: '{$collection}: {$title}'

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: Сообщение коммита
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: Опишите свои изменения. Сообщение будет записано в историю вместе с ними.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: Добавьте примечание к сообщению, записываемому в историю вместе с вашими изменениями, например номер задачи. Его можно оставить пустым.
  # Accessible name of the text box when the user writes the whole message
  message: Сообщение коммита
  # Accessible name of the text box when the text is added before or after the message
  addition: Примечание
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'Сообщение: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Создать форк репозитория
  fork: Создать форк
  confirm_forking_repository: Чтобы предложить изменения в «{$repo}», в вашей учётной записи нужно создать форк репозитория. Ваши изменения сохраняются в этом форке, и сопровождающий проверяет их перед публикацией.
  # Error shown when the user declined the dialog above
  fork_declined: Чтобы предлагать изменения, вам нужен форк репозитория в вашей учётной записи.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Не удалось создать форк репозитория «{$repo}» в вашей учётной записи.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: В вашем форке «{$fork}» нет ветки «{$branch}». Обновите форк из репозитория «{$repo}», а затем войдите снова.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Не удалось проверить ваш доступ к репозиторию «{$repo}». Попробуйте ещё раз через некоторое время.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Репозиторий «{$repo}» не разрешает создавать форки. Попросите сопровождающего разрешить форки для него.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: У вас есть ожидающее приглашение в репозиторий «{$repo}». Примите его на GitHub, а затем войдите снова.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Ваш вход не включает доступ к приватным репозиториям, поэтому репозиторий «{$repo}» невозможно прочитать. Попросите сопровождающего проверить настройки аутентификации CMS.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Публиковать изменения на этом сайте может только сопровождающий. Вместо этого отметьте запись как «На рассмотрении», и кто-нибудь её посмотрит.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: Сопровождающий уже опубликовал эту запись, поэтому проверять больше нечего.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Это изменение нельзя внести напрямую. На рассмотрение можно предлагать только правки записей.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Ваши изменения сохраняются в вашем форке этого репозитория «{$repo}» и проверяются перед публикацией.
  view_fork: Открыть форк

# ==============================================================================
# Settings Dialog
# ==============================================================================
# Strings for the settings/preferences dialog and its panels.

# Settings page aria-label
categories: Категории

# Preferences panels
prefs:
  account:
    title: Учётная запись
  # API key management feedback messages
  changes:
    api_key_saved: Ключ API сохранён.
    api_key_removed: Ключ API удалён.
    api_key_invalid: Предоставленный ключ API недействителен. Проверьте ещё раз и попробуйте снова.

  # Preferences operation errors
  error:
    permission_denied: Доступ к хранилищу cookie запрещён. Проверьте разрешения браузера и попробуйте ещё раз.

  # Appearance panel
  appearance:
    title: Внешний вид
    theme: Тема
    select_theme: Выбрать тему

  # Theme options
  theme:
    dark: Тёмная
    light: Светлая

  # Language panel
  language:
    title: Язык
    ui_language:
      title: Язык интерфейса
      select_language: Выбрать язык

  # Contents panel
  contents:
    title: Содержимое
    editor:
      title: Редактор
      use_draft_backup:
        switch_label: Автоматически создавать резервные копии черновиков записей
      close_on_save:
        switch_label: Закрывать редактор после сохранения черновика
      close_with_escape:
        switch_label: Закрывать редактор клавишей Escape

  # Internationalization panel
  i18n:
    title: Интернационализация
    translators:
      default:
        title: Служба перевода по умолчанию
        select_service: Выбрать службу
      api_keys:
        title: Ключи API служб перевода
        description: Управляйте ключами API для <a>служб перевода</a>. Ключами API универсальных ИИ-сервисов можно управлять в настройках ИИ.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: Ключ {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Зарегистрируйтесь в <a {$homeHref}>{$service}</a> и введите <a {$apiKeyHref}>свой ключ API</a>, чтобы включить быстрый перевод текстовых полей.

  # Media panel
  media:
    title: Медиа
    stock_photos:
      api_keys:
        title: Ключи API служб стоковых фото
        description: Управляйте ключами API для <a>служб стоковых фото</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: Ключ API {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Зарегистрируйтесь в <a {$homeHref}>{$service} API</a> и введите <a {$apiKeyHref}>свой ключ API</a>, чтобы вставлять бесплатные стоковые фото в поля изображений.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Фото предоставлены {$service}
      no_services: <a>Службы стоковых фото</a> не настроены.
    cloud_storage:
      api_keys:
        title: Ключи API служб облачного хранилища
        description: Управляйте ключами API для <a>служб облачного хранилища</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: Ключ API {$service}
      no_services: <a>Службы облачного хранилища</a> не настроены.

  # AI panel
  ai:
    title: ИИ
    api_keys:
      title: Ключи API ИИ-сервисов
      description: Управляйте ключами API для ИИ-сервисов.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: Ключ API {$service}

  # Accessibility panel
  accessibility:
    title: Доступность
    underline_links:
      title: Подчёркивание ссылок
      description: Показывать подчёркивание ссылок в предпросмотре записи и в надписях интерфейса.
      switch_label: Всегда подчёркивать ссылки

  # Data Management panel
  data:
    title: Управление данными
    clear_data:
      title: Очистить данные
      # Clear File Cache button
      file_cache:
        description: Удалить локально кэшированное содержимое файлов и миниатюры изображений, чтобы освободить место или устранить проблемы, вызванные устаревшими данными.
        button_label: Очистить кэш файлов
        confirmation: Локально кэшированное содержимое файлов и миниатюры изображений будут удалены. Ваши несохранённые черновики и настройки будут сохранены, а удалённые данные при необходимости будут загружены или созданы заново. По завершении CMS будет перезагружена.
      # Erase All Data button
      all_data:
        description: Удалить всё, что CMS хранит в этом браузере, включая кэшированные файлы, несохранённые черновики и настройки. Всё, что уже сохранено в вашем репозитории, не будет затронуто.
        button_label: Удалить все данные
        confirmation: Все данные, хранящиеся в этом браузере, будут удалены, включая кэшированное содержимое файлов, миниатюры изображений, несохранённые черновики, настройки и состояние входа. Ваш репозиторий не будет затронут, но все несохранённые изменения будут потеряны, и вам придётся войти снова. По завершении CMS будет перезагружена.

  # Developer panel
  developer:
    title: Разработчик
    developer_mode:
      title: Режим разработчика
      description: Включить некоторые функции для разработчиков, включая подробные журналы консоли и собственные контекстные меню.
      switch_label: Включить режим разработчика
    local_git:
      title: Коммиты Git
      description: Фиксировать изменения в текущей ветке локального репозитория при каждом сохранении, как CMS делает при работе с удалённым репозиторием. Затем вы сможете проверить и отправить коммиты привычными инструментами Git.
      switch_label: Фиксировать изменения в Git
      checking: Проверка репозитория…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Изменения будут зафиксированы в ветке {$branch} от имени {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Сейчас изменения невозможно зафиксировать. {$reason}
    deploy_hook:
      title: Хук развёртывания
      description: Введите URL веб-хука, который будет вызываться, когда вы вручную запускаете развёртывание, выбирая «Опубликовать изменения». Это можно оставить пустым, если вы используете GitHub Actions или GitLab CI/CD.
      # Hook URL input
      url:
        field_label: URL хука
        saved: URL хука сохранён.
        removed: URL хука удалён.
      # Authorization header input
      auth:
        field_label: Заголовок авторизации (напр., Bearer <token>) (необязательно)
        saved: Заголовок авторизации сохранён.
        removed: Заголовок авторизации удалён.

