    title: Ошибка
    description: При сохранении записи произошла ошибка. Попробуйте позже.

# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: Запись изменена другим пользователем
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} изменил(а) эту запись {$date}, уже после того, как вы её открыли.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Эта запись была изменена в репозитории после того, как вы её открыли.
  deleted: Эта запись была удалена из репозитория после того, как вы её открыли.
  # Follows `modified_by` or `modified`
  overwrite_warning: Если сохранить сейчас, эти изменения будут потеряны.
  # Follows `deleted`
  recreate_warning: Если сохранить сейчас, запись будет создана заново.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Поскольку запись хранится в одном файле с другими записями, её нельзя сохранить поверх этого изменения. Отмените редактирование, затем снова откройте запись из списка и внесите правки.
  # OK button label
  save_anyway: Всё равно сохранить
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: Во время сохранения репозиторий был обновлён другим пользователем. Попробуйте ещё раз.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Запись, хранящаяся в том же файле, была изменена другим пользователем. Попробуйте ещё раз.
  # {$path} is the file path
  array_file_invalid: Файл {$path} невозможно обновить, так как он не содержит допустимого списка записей.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
