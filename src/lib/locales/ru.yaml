  change_password: Изменить пароль
  # {$name} is the user’s username, {$role} their role, e.g. Editor
  signed_in_as_x_with_role: Вы вошли как {$name} ({$role})
  link_github: Привязать учётную запись GitHub
  link_github_error: Не удалось привязать учётную запись GitHub
