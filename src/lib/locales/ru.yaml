# File Upload and Processing
# ==============================================================================
# Strings for file upload dialogs, progress indicators, and validation.

# Processing indicator shown during file preparation
# {$count} is the number of files currently being processed
processing_files: |
  .input {$count :integer}
  .match $count
    1   {{ Обработка файла. Это может занять некоторое время. }}
    *   {{ Обработка файлов. Это может занять некоторое время. }}

# Uploading section aria-label
uploading_files: Выгрузка файлов

# Replace file confirmation
# Dialog body when replacing an existing file
# {$name} is the existing file name that will be replaced
confirm_replacing_file: 'Файл «{$name}» будет заменён этим файлом:'

# Upload confirmation with destination folder
# {$folder} is the destination folder label and {$count} is the number of files being uploaded
confirm_uploading_files: |
  .input {$count :integer}
  .match $count
    one  {{ {$count} файл будет сохранён в папку «{$folder}»: }}
    few  {{ {$count} файла будут сохранены в папку «{$folder}»: }}
    many {{ {$count} файлов будут сохранены в папку «{$folder}»: }}
    *    {{ {$count} файлов будут сохранены в папку «{$folder}»: }}

# File size validation
# Warning section for files exceeding size limits
oversized_files: Слишком большие файлы
# {$size} is the maximum allowed file size and {$count} is the number of oversized files
warning_oversized_files: |
  .input {$count :integer}
  .match $count
    1   {{ Этот файл нельзя выгрузить, так как он превышает максимальный размер {$size}. Уменьшите размер или выберите другой файл. }}
    *   {{ Эти файлы нельзя выгрузить, так как они превышают максимальный размер {$size}. Уменьшите размеры или выберите другие файлы. }}

# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: Недопустимые файлы
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    1   {{ Этот файл нельзя выгрузить, так как он повреждён или его содержимое не соответствует расширению файла. Это часто происходит, когда фотографию переименовывают вместо того, чтобы конвертировать, например изображение HEIC сохраняют как файл JPEG. Конвертируйте файл и попробуйте ещё раз. }}
    *   {{ Эти файлы нельзя выгрузить, так как они повреждены или их содержимое не соответствует расширениям файлов. Это часто происходит, когда фотографии переименовывают вместо того, чтобы конвертировать, например изображения HEIC сохраняют как файлы JPEG. Конвертируйте файлы и попробуйте ещё раз. }}
# {$count} is the number of files that are not of a type the field accepts, even once transformed
# {$types} is the list of accepted file types, such as “.pdf or .txt”
warning_unsupported_files: |
  .input {$count :integer}
  .match $count
    1   {{ Этот файл нельзя выгрузить, так как он не относится ни к одному из следующих типов: {$types}. }}
    *   {{ Эти файлы нельзя выгрузить, так как они не относятся ни к одному из следующих типов: {$types}. }}
# {$count} is the number of files that are not of an image type the field accepts
# {$types} is the list of accepted image formats, such as “PNG or WebP”
warning_unsupported_image_files: |
  .input {$count :integer}
  .match $count
    1   {{ Этот файл нельзя выгрузить, так как принимается только изображение следующих типов: {$types}. }}
    *   {{ Эти файлы нельзя выгрузить, так как принимаются только изображения следующих типов: {$types}. }}

# File format validation when replacing an asset
# Warning section for replacement files that are in a different format
mismatched_files: Файлы другого формата
# {$name} is the name of the asset being replaced and {$count} is the number of mismatched files
warning_mismatched_files: |
  .input {$count :integer}
  .match $count
    1   {{ Этот файл не может заменить «{$name}», так как он в другом формате. Конвертируйте файл в тот же формат и попробуйте ещё раз. }}
    *   {{ Эти файлы не могут заменить «{$name}», так как они в другом формате. Конвертируйте файлы в тот же формат и попробуйте ещё раз. }}

# File name conflict resolution
# {$count} is the number of conflicting file names in the target folder
file_name_conflict_confirmation: |
  .input {$count :integer}
  .match $count
    one  {{ {$count} файл с таким же именем уже существует в этой папке. Заменить его? }}
    few  {{ {$count} файла с такими же именами уже существуют в этой папке. Заменить их? }}
    many {{ {$count} файлов с такими же именами уже существуют в этой папке. Заменить их? }}
    *    {{ {$count} файлов с такими же именами уже существуют в этой папке. Заменить их? }}
# {$name} is the conflicting file name when there is exactly one conflict; {$count} is the total conflict count
file_name_conflict_confirmation_with_name: |
  .input {$count :integer}
  .input {$name :string}
  .match $count
    1    {{ Файл с именем «{$name}» уже существует в этой папке. Заменить его? }}
    one  {{ {$count} файл с таким же именем уже существует в этой папке. Заменить его? }}
    few  {{ {$count} файла с такими же именами уже существуют в этой папке. Заменить их? }}
    many {{ {$count} файлов с такими же именами уже существуют в этой папке. Заменить их? }}
    *    {{ {$count} файлов с такими же именами уже существуют в этой папке. Заменить их? }}
file_name_conflict_resolution: Разрешение конфликта имён файлов
