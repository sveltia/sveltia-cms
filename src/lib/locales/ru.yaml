    temporary_password_description: Передайте это имя пользователя и временный пароль пользователю {$name}. Пароль больше не будет показан, а свой пароль пользователь выберет при входе.
    copy_username: Копировать имя пользователя
    copy_password: Копировать пароль
    # {$name} is the user’s name
    email_credentials: 'Отправить письмо: {$name}'
