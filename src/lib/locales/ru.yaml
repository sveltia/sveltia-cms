# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: |
  .input {$quota :integer}
  .match $quota
    one  {{ Вы не можете добавлять новые записи в эту коллекцию, так как она достигла лимита в {$quota} запись. }}
    few  {{ Вы не можете добавлять новые записи в эту коллекцию, так как она достигла лимита в {$quota} записи. }}
    many {{ Вы не можете добавлять новые записи в эту коллекцию, так как она достигла лимита в {$quota} записей. }}
    *    {{ Вы не можете добавлять новые записи в эту коллекцию, так как она достигла лимита в {$quota} записей. }}
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$quota :integer}
  .input {$remaining :integer}
  .match $quota $remaining
    one  one  {{ Эта коллекция приближается к лимиту в {$quota} запись. Вы можете создать ещё только {$remaining} запись. }}
    one  few  {{ Эта коллекция приближается к лимиту в {$quota} запись. Вы можете создать ещё только {$remaining} записи. }}
