# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    1   {{ Удалить ресурс }}
    *   {{ Удалить ресурсы }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    1   {{ Удалить выбранный ресурс }}
    *   {{ Удалить выбранные ресурсы }}
confirm_deleting_this_asset: Вы уверены, что хотите удалить этот ресурс?
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    one  {{ Вы уверены, что хотите удалить {$count} выбранный ресурс? }}
    few  {{ Вы уверены, что хотите удалить {$count} выбранных ресурса? }}
    many {{ Вы уверены, что хотите удалить {$count} выбранных ресурсов? }}
    *    {{ Вы уверены, что хотите удалить {$count} выбранных ресурсов? }}
confirm_deleting_all_assets: Вы уверены, что хотите удалить все ресурсы?
# Note added to the confirmation when entries use the assets being deleted; the references are
# removed in the same commit. {$count} is the number of entries using them
deleting_referenced_assets_note: |
  .input {$count :integer}
  .match $count
    1    {{ Ссылка на него в записи также будет удалена. }}
    one  {{ Ссылки на него в {$count} записи также будут удалены. }}
    few  {{ Ссылки на него в {$count} записях также будут удалены. }}
    many {{ Ссылки на него в {$count} записях также будут удалены. }}
    *    {{ Ссылки на него в {$count} записях также будут удалены. }}
# Shown in place of the confirmation when removing the references would leave a field in an entry
# invalid, e.g. a required Image field with nothing left, so the deletion is refused. The fields are
# listed below the message, each with the validation error it would have. {$count} is the number of
# assets being deleted
cannot_delete_referenced_assets: |
  .input {$count :integer}
  .match $count
    1   {{ Этот ресурс нельзя удалить, так как следующие поля в использующих его записях без него станут недействительными. Сначала обновите эти записи. }}
    *   {{ Эти ресурсы нельзя удалить, так как следующие поля в использующих их записях без них станут недействительными. Сначала обновите эти записи. }}
# Error shown in the asset deletion dialog when the entries using the assets couldn’t be looked up,
# so the deletion can’t go ahead. {$count} is the number of assets being deleted
checking_asset_references_failed: |
  .input {$count :integer}
  .match $count
    1   {{ Не удалось проверить, какие записи используют этот ресурс. Закройте это окно и попробуйте ещё раз. }}
    *   {{ Не удалось проверить, какие записи используют эти ресурсы. Закройте это окно и попробуйте ещё раз. }}

# Delete entries: dialog titles and confirmation messages
# {$count} is the number of entries targeted by the action
delete_entries: |
  .input {$count :integer}
  .match $count
    1   {{ Удалить запись }}
    *   {{ Удалить записи }}
# {$count} is the number of selected entries
delete_selected_entries: |
  .input {$count :integer}
  .match $count
    1   {{ Удалить выбранную запись }}
    *   {{ Удалить выбранные записи }}
confirm_deleting_this_entry: Вы уверены, что хотите удалить эту запись?
confirm_deleting_this_entry_with_assets: Вы уверены, что хотите удалить эту запись и связанные ресурсы?
# Error notification shown when an entry could not be deleted
deleting_entry_failed: Не удалось удалить запись. Попробуйте ещё раз.
# {$count} is the number of selected entries
confirm_deleting_selected_entries: |
  .input {$count :integer}
  .match $count
    one  {{ Вы уверены, что хотите удалить {$count} выбранную запись? }}
    few  {{ Вы уверены, что хотите удалить {$count} выбранные записи? }}
    many {{ Вы уверены, что хотите удалить {$count} выбранных записей? }}
    *    {{ Вы уверены, что хотите удалить {$count} выбранных записей? }}
# {$count} is the number of selected entries whose associated assets would also be removed
confirm_deleting_selected_entries_with_assets: |
  .input {$count :integer}
  .match $count
    one  {{ Вы уверены, что хотите удалить {$count} выбранную запись и связанные ресурсы? }}
    few  {{ Вы уверены, что хотите удалить {$count} выбранные записи и связанные ресурсы? }}
    many {{ Вы уверены, что хотите удалить {$count} выбранных записей и связанные ресурсы? }}
    *    {{ Вы уверены, что хотите удалить {$count} выбранных записей и связанные ресурсы? }}
confirm_deleting_all_entries: Вы уверены, что хотите удалить все записи?
confirm_deleting_all_entries_with_assets: Вы уверены, что хотите удалить все записи и связанные ресурсы?
# Note added to the confirmation when other entries reference the entries being deleted through
# Relation fields; the references are removed in the same commit. {$count} is the number of
# referencing entries
deleting_referenced_entries_note: |
  .input {$count :integer}
  .match $count
    1    {{ Ссылка на неё в другой записи также будет удалена. }}
    one  {{ Ссылки на неё в {$count} другой записи также будут удалены. }}
    few  {{ Ссылки на неё в {$count} других записях также будут удалены. }}
    many {{ Ссылки на неё в {$count} других записях также будут удалены. }}
    *    {{ Ссылки на неё в {$count} других записях также будут удалены. }}
# Shown in place of the confirmation when removing the references would leave a Relation field in
# another entry invalid, e.g. a required field with nothing selected, so the deletion is refused.
# The fields are listed below the message, each with the validation error it would have. {$count}
# is the number of entries being deleted
cannot_delete_referenced_entries: |
  .input {$count :integer}
  .match $count
    1   {{ Эту запись нельзя удалить, так как следующие поля в других записях без неё станут недействительными. Сначала обновите эти записи. }}
    *   {{ Эти записи нельзя удалить, так как следующие поля в других записях без них станут недействительными. Сначала обновите эти записи. }}

