  .match $count
    0    {{ إسحب الملفات هنا أو انقر للتصفح… }}
    one  {{ إسحب ملفاً واحداً هنا أو انقر للتصفح… }}
    two  {{ إسحب ملفين هنا أو انقر للتصفح… }}
    few  {{ إسحب {$count} أجهزة أو ملفات هنا أو انقر للتصفح… }}
    many {{ إسحب {$count} ملفاً هنا أو انقر للتصفح… }}
    *    {{ إسحب {$count} ملف هنا أو انقر للتصفح… }}
