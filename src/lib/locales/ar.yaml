      # Erase All Data button
      all_data:
        description: حذف كل ما يحتفظ به نظام إدارة المحتوى في هذا المتصفح، بما في ذلك الملفات المخزنة مؤقتاً والمسودات غير المحفوظة والإعدادات. لن يتأثر أي شيء محفوظ بالفعل في مستودعك.
        button_label: مسح جميع البيانات
        confirmation: سيتم حذف جميع البيانات المخزنة في هذا المتصفح، بما في ذلك محتويات الملفات المخزنة مؤقتاً والصور المصغرة والمسودات غير المحفوظة والإعدادات وحالة تسجيل الدخول. لن يتأثر مستودعك، لكن أي تغيير لم تحفظه سيُفقد، وستحتاج إلى تسجيل الدخول مرة أخرى. سيتم إعادة تحميل نظام إدارة المحتوى بعد الانتهاء.

  # Developer panel
  developer:
    title: المطور
    developer_mode:
      title: وضع المطور
      description: تمكين بعض الميزات الموجهة للمطورين، بما في ذلك سجلات Console التفصيلية وقوائم الـ Context.
      switch_label: تمكين وضع المطور
    local_git:
      title: إيداعات Git
      description: أودع تغييراتك في الفرع الحالي لمستودعك المحلي كلما حفظتها، كما يفعل نظام إدارة المحتوى عند العمل مع مستودع بعيد. يمكنك بعد ذلك مراجعة الإيداعات ودفعها باستخدام أدوات Git المعتادة.
      switch_label: إيداع التغييرات في Git
      checking: جارٍ التحقق من المستودع…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: سيتم إيداع التغييرات في الفرع {$branch} باسم {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: لا يمكن إيداع التغييرات الآن. {$reason}
    deploy_hook:
      title: خطاف النشر (Deploy Hook)
      description: أدخل رابط Webhook ليتم استدعاؤه عند تشغيل النشر يدوياً من خلال تحديد “نشر التغييرات”. يمكن ترك هذا الحقل فارغاً إذا كنت تستخدم GitHub Actions أو GitLab CI/CD.
      # Hook URL input
      url:
        field_label: رابط الـ Hook
        saved: تم حفظ رابط الـ Hook.
        removed: تم إزالة رابط الـ Hook.
      # Authorization header input
      auth:
        field_label: ترويسة التفويض (Authorization header) (مثل Bearer <token>) (اختياري)
        saved: تم حفظ ترويسة التفويض.
        removed: تم إزالة ترويسة التفويض.

