# Entry creation restrictions: tooltip and advisory messages
creating_entries_disabled_by_admin: تم تعطيل إنشاء عناصر جديدة في هذه المجموعة بواسطة المسؤول.
# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: |
  .input {$quota :integer}
  .match $quota
    zero {{ لا يمكنك إضافة عناصر جديدة إلى هذه المجموعة لأنها وصلت إلى الحد الأقصى البالغ {$quota} عنصر. }}
    one  {{ لا يمكنك إضافة عناصر جديدة إلى هذه المجموعة لأنها وصلت إلى الحد الأقصى البالغ عنصراً واحداً. }}
    two  {{ لا يمكنك إضافة عناصر جديدة إلى هذه المجموعة لأنها وصلت إلى الحد الأقصى البالغ عنصرين اثنين. }}
    few  {{ لا يمكنك إضافة عناصر جديدة إلى هذه المجموعة لأنها وصلت إلى الحد الأقصى البالغ {$quota} عناصر. }}
    many {{ لا يمكنك إضافة عناصر جديدة إلى هذه المجموعة لأنها وصلت إلى الحد الأقصى البالغ {$quota} عنصراً. }}
    *    {{ لا يمكنك إضافة عناصر جديدة إلى هذه المجموعة لأنها وصلت إلى الحد الأقصى البالغ {$quota} عنصر. }}
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$quota :integer}
  .input {$remaining :integer}
  .match $quota $remaining
    zero one {{ تقترب هذه المجموعة من حدها الأقصى البالغ {$quota} عنصر. يمكنك إنشاء عنصر واحد فقط بعد. }}
