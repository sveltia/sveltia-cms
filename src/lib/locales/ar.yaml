    two  {{ إسحب ملفين هنا أو }}
    few  {{ إسحب {$count} أجهزة أو ملفات هنا أو }}
    many {{ إسحب {$count} ملفاً هنا أو }}
    *    {{ إسحب {$count} ملف هنا أو }}
