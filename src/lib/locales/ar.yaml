    # {$timeZone} is the invalid IANA timezone identifier from the configuration
    invalid_timezone: 'منطقة زمنية غير صالحة: {$timeZone}. يجب أن تكون معرف منطقة زمنية صالحة من IANA مثل `America/New_York` أو `Asia/Tokyo`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: الخيار المهجور `{$prop}` غير مدعوم في Sveltia CMS. استخدم الخيار `{$newProp}` بدلاً من ذلك.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: الخيار `allow_multiple` غير مدعوم في Sveltia CMS. استخدم الخيار `multiple` بدلاً من ذلك، والذي يتخفف افتراضياً إلى `false`.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: لا يمكن لحقل List أن يحتوي على الخيارات `field` و `fields` و `types` معاً.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: نوع المتغير لحقل List غير صالح. الخيار `widget` مضبوط على `{$widget}` ولكن يجب أن يكون `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: لا يمكن لحقل Object أن يحتوي على الخيارين `fields` و `types` معاً.
    # Don’t localize `fields`, and `types`
    object_field_missing_fields: يجب أن يحتوي حقل Object إما على الخيار `fields` أو `types` محددًا.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: المجموعة المشار إليها `{$collection}` غير صالحة أو غير معرفة.
    relation_field_invalid_collection_file: الملف المشار إليه `{$file}` غير صالح أو غير معرف.
    # Don’t localize `file`
    relation_field_missing_file_name: يجب تحديد الخيار `file` للربط بملف مجموعة.
    relation_field_invalid_value_field: حقل القيمة المشار إليه `{$field}` غير صالح أو غير معرف.
    unexpected: خطأ غير متوقع

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: معرف تطبيق OAuth غير محدد. يلزم المستخدمون بتوفير رمز وصول لتسجيل الدخول.
