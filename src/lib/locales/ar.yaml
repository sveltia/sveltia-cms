# {$count} is the number of conflicting file names in the target folder
file_name_conflict_confirmation: |
  .input {$count :integer}
  .match $count
    0    {{ توجد ملفات بنفس الأسماء بالفعل في هذا المجلد. هل تريد استبدالها؟ }}
    one  {{ يوجد ملف بنفس الاسم بالفعل في هذا المجلد. هل تريد استبداله؟ }}
    two  {{ يوجد ملفان بنفس الاسم بالفعل في هذا المجلد. هل تريد استبدالهما؟ }}
    few  {{ توجد {$count} ملفات بنفس الأسماء بالفعل في هذا المجلد. هل تريد استبدالها؟ }}
    many {{ يوجد {$count} ملفاً بنفس الأسماء بالفعل في هذا المجلد. هل تريد استبدالها؟ }}
    *    {{ يوجد {$count} ملف بنفس الأسماء بالفعل في هذا المجلد. هل تريد استبدالها؟ }}
# {$name} is the conflicting file name when there is exactly one conflict; {$count} is the total conflict count
file_name_conflict_confirmation_with_name: |
  .input {$count :integer}
  .input {$name :string}
  .match $count
    0    {{ توجد ملفات بنفس الأسماء بالفعل في هذا المجلد. هل تريد استبدالها؟ }}
    one  {{ يوجد ملف باسم "{$name}" بالفعل في هذا المجلد. هل تريد استبداله؟ }}
    two  {{ يوجد ملفان بنفس الاسم بالفعل في هذا المجلد. هل تريد استبدالهما؟ }}
    few  {{ توجد {$count} ملفات بنفس الأسماء بالفعل في هذا المجلد. هل تريد استبدالها؟ }}
    many {{ يوجد {$count} ملفاً بنفس الأسماء بالفعل في هذا المجلد. هل تريد استبدالها؟ }}
    *    {{ يوجد {$count} ملف بنفس الأسماء بالفعل في هذا المجلد. هل تريد استبدالها؟ }}
