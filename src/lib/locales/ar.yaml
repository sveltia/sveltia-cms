# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: هذا الحقل مطلوب.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: يجب أن يكون التاريخ/الوقت في أو بعد {$min}.
    date: يجب أن يكون التاريخ في أو بعد {$min}.
    time: يجب أن يكون الوقت في أو بعد {$min}.
    number: يجب أن تكون القيمة أكبر من أو تساوي {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        0    {{ يجب عليك تحديد الخيارات. }}
        one  {{ يجب عليك تحديد خيار واحد على الأقل. }}
        two  {{ يجب عليك تحديد خيارين على الأقل. }}
        few  {{ يجب عليك تحديد {$min} خيارات على الأقل. }}
        many {{ يجب عليك تحديد {$min} خياراً على الأقل. }}
        *    {{ يجب عليك تحديد {$min} خيار على الأقل. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        0    {{ يجب عليك إضافة العناصر. }}
        one  {{ يجب عليك إضافة عنصر واحد على الأقل. }}
        two  {{ يجب عليك إضافة عنصرين على الأقل. }}
        few  {{ يجب عليك إضافة {$min} عناصر على الأقل. }}
        many {{ يجب عليك إضافة {$min} عنصراً على الأقل. }}
        *    {{ يجب عليك إضافة {$min} عنصر على الأقل. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: يجب أن يكون التاريخ/الوقت في أو قبل {$max}.
    date: يجب أن يكون التاريخ في أو قبل {$max}.
    time: يجب أن يكون الوقت في أو قبل {$max}.
    number: يجب أن تكون القيمة أقل من أو تساوي {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        0    {{ لا يمكنك تحديد أي خيارات. }}
        one  {{ لا يمكنك تحديد أكثر من خيار واحد. }}
        two  {{ لا يمكنك تحديد أكثر من خيارين. }}
        few  {{ لا يمكنك تحديد أكثر من {$max} خيارات. }}
        many {{ لا يمكنك تحديد أكثر من {$max} خياراً. }}
        *    {{ لا يمكنك تحديد أكثر من {$max} خيار. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        0    {{ لا يمكنك إضافة أي عناصر. }}
        one  {{ لا يمكنك إضافة أكثر من عنصر واحد. }}
        two  {{ لا يمكنك إضافة أكثر من عنصرين. }}
        few  {{ لا يمكنك إضافة أكثر من {$max} عناصر. }}
        many {{ لا يمكنك إضافة أكثر من {$max} عنصراً. }}
        *    {{ لا يمكنك إضافة أكثر من {$max} عنصر. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      0    {{ يجب عليك إدخال الأحرف. }}
      one  {{ يجب عليك إدخال حرف واحد على الأقل. }}
      two  {{ يجب عليك إدخال حرفين على الأقل. }}
      few  {{ يجب عليك إدخال {$min} أحرف على الأقل. }}
      many {{ يجب عليك إدخال {$min} حرفاً على الأقل. }}
      *    {{ يجب عليك إدخال {$min} حرف على الأقل. }}
  too_long: |
    .input {$max :integer}
    .match $max
      0    {{ لا يمكنك إدخال أي أحرف. }}
      one  {{ لا يمكنك إدخال أكثر من حرف واحد. }}
      two  {{ لا يمكنك إدخال أكثر من حرفين. }}
      few  {{ لا يمكنك إدخال أكثر من {$max} أحرف. }}
      many {{ لا يمكنك إدخال أكثر من {$max} حرفاً. }}
      *    {{ لا يمكنك إدخال أكثر من {$max} حرف. }}

  # Type validation errors
  type_mismatch:
    number: يرجى إدخال رقم.
    email: يرجى إدخال بريد إلكتروني صالح.
    url: يرجى إدخال رابط URL صالح.

