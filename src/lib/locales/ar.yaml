# ==============================================================================
# Content and Asset Libraries
# ==============================================================================
# Strings used in the main content and asset management interfaces, including
# lists, navigation, and collection/folder views.

# Page container aria-labels
content_library: مكتبة المحتوى
asset_library: مكتبة الوسائط

# Primary sidebar section headings and list aria-labels
collections: المجموعات
entries: العناصر
files: الملفات

# Asset location selector: option group labels
asset_location:
  # Assets stored in the site’s Git repository
  repository: موقعك
  external: مواقع خارجية
  stock_photos: صور مجانية (Stock)

# Sidebar and list labels
# Collection assets panel aria-label
collection_assets: وسائط المجموعة
# List aria-labels for different list types
entry_list: قائمة العناصر
file_list: قائمة الملفات
asset_list: قائمة الوسائط

# Collection and folder page titles
# Used as aria-labels on page containers
# {$collection} is the current collection label
x_collection: مجموعة "{$collection}"
# {$folder} is the current asset folder label
x_asset_folder: مجلد الوسائط "{$folder}"

# Navigation announcements (ARIA live regions)
# Announce page changes for screen reader users
viewing_collection_list: أنت تعرض الآن قائمة المجموعات.
viewing_asset_folder_list: أنت تعرض الآن قائمة مجلدات الوسائط.
# Collection view announcements with entry counts
# {$collection} is the collection label and {$count} is the number of entries in it
viewing_x_collection: |
  .input {$count :integer}
  .match $count
    0    {{ أنت تعرض الآن مجموعة "{$collection}"، والتي لا تحتوي على أي عناصر بعد. }}
    one  {{ أنت تعرض الآن مجموعة "{$collection}"، والتي تحتوي على عنصر واحد. }}
    two  {{ أنت تعرض الآن مجموعة "{$collection}"، والتي تحتوي على عنصرين اثنين. }}
    few  {{ أنت تعرض الآن مجموعة "{$collection}"، والتي تحتوي على {$count} عناصر. }}
    many {{ أنت تعرض الآن مجموعة "{$collection}"، والتي تحتوي على {$count} عنصراً. }}
    *    {{ أنت تعرض الآن مجموعة "{$collection}"، والتي تحتوي على {$count} عنصر. }}
# Asset folder view announcements with asset counts
# {$folder} is the folder label and {$count} is the number of assets in it
viewing_x_asset_folder: |
  .input {$count :integer}
  .match $count
    0    {{ أنت تعرض الآن مجلد الأصول "{$folder}"، والذي لا يحتوي على أي وسائط بعد. }}
    one  {{ أنت تعرض الآن مجلد الأصول "{$folder}"، والذي يحتوي على عنصر وسائط واحد. }}
    two  {{ أنت تعرض الآن مجلد الأصول "{$folder}"، والذي يحتوي على عنصري وسائط. }}
    few  {{ أنت تعرض الآن مجلد الأصول "{$folder}"، والذي يحتوي على {$count} عناصر وسائط. }}
    many {{ أنت تعرض الآن مجلد الأصول "{$folder}"، والذي يحتوي على {$count} عنصر وسائط. }}
    *    {{ أنت تعرض الآن مجلد الأصول "{$folder}"، والذي يحتوي على {$count} عنصر وسائط. }}

