  edited_with_entry: التغييرات على هذا العنصر بانتظار النشر مع “{$name}”. إذا حفظته الآن، فسيتم دمج مجموعتي التغييرات عند نشر ذلك العنصر، وقد يفشل ذلك إذا تداخلتا.
