  .match $count
    0    {{ إسحب الملفات هنا }}
    one  {{ إسحب الملف هنا }}
    two  {{ إسحب الملفين هنا }}
    few  {{ إسحب الـ {$count} ملفات هنا }}
    many {{ إسحب الـ {$count} ملفاً هنا }}
