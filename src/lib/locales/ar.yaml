    nested_collections_unsupported: المجموعات المتداخلة غير مدعومة بعد في Sveltia CMS.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: الخيار `{$prop}` غير مدعوم في Sveltia CMS. سيتم تجاهله.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: تم ضبط كل من `picker_utc` وخيارات المنطقة الزمنية الأحدث (`input_timezone` أو `output_utc`). الخيارات الجديدة لها الأسبقية. يرجى النظر في إزالة `picker_utc` من الأعدادات الخاص بك.

