  new_password: كلمة المرور الجديدة
  password_too_short: كلمة المرور قصيرة جداً. استخدم 12 حرفاً على الأقل.
  change_password: تغيير كلمة المرور
  # {$name} is the user’s username, {$role} their role, e.g. Editor
  signed_in_as_x_with_role: تم تسجيل الدخول باسم {$name} ({$role})
  link_github: ربط حساب GitHub
  link_github_error: تعذر ربط حساب GitHub
  current_password: كلمة المرور الحالية
  # {$username} is the username filled in from a magic link emailed to the user
  filled_from_link: تم ملء اسم المستخدم وكلمة المرور من رابط. لا تسجّل الدخول إلا إذا كان “{$username}” هو اسم المستخدم الخاص بك.
  change_password_description: ستبقى مسجّلاً الدخول هنا، وسيتم تسجيل خروجك من أجهزتك الأخرى.
  password_changed: تم تغيير كلمة المرور الخاصة بك.
