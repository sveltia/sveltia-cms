# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      0    {{ هناك أخطاء في إعداد الـ CMS. يرجى حل المشكلات والمحاولة مرة أخرى. }}
      one  {{ هناك خطأ واحد في إعداد الـ CMS. يرجى حل المشكلة والمحاولة مرة أخرى. }}
      two  {{ هناك خطآن في إعداد الـ CMS. يرجى حل المشكلتين والمحاولة مرة أخرى. }}
      few  {{ هناك {$count} أخطاء في إعداد الـ CMS. يرجى حل المشكلات والمحاولة مرة أخرى. }}
      many {{ هناك {$count} خطأً في إعداد الـ CMS. يرجى حل المشكلات والمحاولة مرة أخرى. }}
      *    {{ هناك {$count} خطأ في إعداد الـ CMS. يرجى حل المشكلات والمحاولة مرة أخرى. }}
  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: 'مجموعة {$collection}'
    file: 'ملف {$file}'
    component: 'مكون {$component}'
    # Don’t localize `{$field}`
    field: 'حقل `{$field}`'

  # Configuration error messages
  error:
    no_secure_context: يعمل Sveltia CMS فقط مع روابط HTTPS أو عناوين localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        0    {{ يجب أن تستخدم روابط ملفات الإعدادات بروتوكول HTTPS أو عناوين localhost. }}
        one  {{ يجب أن يستخدم رابط ملف الإعدادات بروتوكول HTTPS أو عنوان localhost. }}
        two  {{ يجب أن يستخدم رابطا ملفي الإعدادات بروتوكول HTTPS أو عناوين localhost. }}
        few  {{ يجب أن تستخدم {$count} روابط لملفات الإعدادات بروتوكول HTTPS أو عناوين localhost. }}
        many {{ يجب أن يستخدم {$count} رابطاً لملفات الإعدادات بروتوكول HTTPS أو عناوين localhost. }}
        *    {{ يجب أن يستخدم {$count} رابط لملفات الإعدادات بروتوكول HTTPS أو عناوين localhost. }}
    fetch_failed: تعذر جلب ملف الأعدادات.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: تم إرجاع استجابة HTTP مع الحالة {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'تعذر جلب ملف الأعدادات. لمنع تحميل ملف `config.yml`، أضف <a>`load_config_file: false`</a> إلى كائن الأعدادات الممرر إلى `CMS.init()`.'
    parse_failed: تعذر تحليل ملف الأعدادات.
    parse_failed_invalid_object: ملف الأعدادات ليس كائن JavaScript صالباً.
    parse_failed_unsupported_type: ملف الأعدادات ليس نوع ملف مدعوم. يتم دعم YAML و TOML و JSON فقط.
    no_collection: لم يتم تعريف المجموعات.
    missing_backend: لم يتم تعريف الخادم الخلفي (Backend).
    missing_backend_name: لم يتم تعريف اسم الخادم الخلفي (Backend).
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: الخادم الخلفي (Backend) {$name} <a>غير مدعوم</a> في Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: الخادم الخلفي (Backend) المهجور {$name} <a>غير مدعوم</a> في Sveltia CMS.
    unsupported_custom_backend: الخوادم الخلفية (Backends) المخصصة <a>غير مدعومة</a> في Sveltia CMS.
    unsupported_backend_suggestion: استخدم أحد <a>الخوادم الخلفية (Backends) المدعومة</a> بدلاً من ذلك.
    missing_repository: لم يتم تعريف المستودع.
    invalid_repository: المستودع المعد غير صالح. يجب أن يكون بصيغة “owner/repo”.
    oauth_implicit_flow: طريقة المصادقة المُعدة (الانسياب الضمني) غير مدعومة في Sveltia CMS. استخدم <a>طريقة مصادقة</a> مختلفة بدلاً من ذلك.
    github_pkce_unsupported: تفويض PKCE غير مدعوم بعد بسبب قيود GitHub. استخدم <a>طريقة مصادقة</a> مختلفة بدلاً من ذلك.
    oauth_no_app_id: معرف تطبيق OAuth غير محدد.
    # Don’t localize `auth_methods`
    no_auth_methods: يجب أن يحتوي الخيار `auth_methods` على طريقة واحدة على الأقل.
    missing_media_folder: مجلد الوسائط غير محدد.
    invalid_media_folder: مجلد الوسائط المعد غير صالح. يجب أن يكون سلسلة نصية.
    invalid_public_folder: المجلد العام المعد غير صالح. يجب أن يكون سلسلة نصية.
