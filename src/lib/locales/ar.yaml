    asset_collection_invalid_media_folder: يجب أن تكون مجموعة الوسائط `{$name}` تمتلك خيار `media_folder` معرفاً كسلسلة نصية.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_no_options: يجب أن تحتوي المجموعة إما على خيار `folder` أو `files` أو `divider`.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_multiple_options: لا يمكن للمجموعة أن تحتوي على الخيارات `folder` و `files` و `divider` معاً.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: الامتداد `{$extension}` لا يتطابق مع التنسيق `{$format}`.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: قالب المعرف الفريد (Slug) `{$slug}` غير صالح لأنه لا يمكن أن يحتوي على شرطات مائلة. لتنظيم العناصر في مجلدات فرعية، استخدم الخيار `path` بدلاً من `slug`.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: يجب أن تتضمن المجموعة {$count} الخيار `name` محددًا كسلسلة نصية غير فارغة.
