# ==============================================================================
# Strings for file upload dialogs, progress indicators, and validation.

# Processing indicator shown during file preparation
# {$count} is the number of files currently being processed
processing_files: |
  .input {$count :integer}
  .match $count
    0    {{ جاري معالجة الملفات. قد يستغرق هذا بعض الوقت. }}
    one  {{ جاري معالجة ملف واحد. قد يستغرق هذا بعض الوقت. }}
    two  {{ جاري معالجة ملفين اثنين. قد يستغرق هذا بعض الوقت. }}
    few  {{ جاري معالجة {$count} ملفات. قد يستغرق هذا بعض الوقت. }}
    many {{ جاري معالجة {$count} ملفاً. قد يستغرق هذا بعض الوقت. }}
    *    {{ جاري معالجة {$count} ملف. قد يستغرق هذا بعض الوقت. }}

# Uploading section aria-label
uploading_files: جاري رفع الملفات

# Replace file confirmation
# Dialog body when replacing an existing file
# {$name} is the existing file name that will be replaced
confirm_replacing_file: 'سيتم استبدال "{$name}" بهذا الملف:'

# Upload confirmation with destination folder
# {$folder} is the destination folder label and {$count} is the number of files being uploaded
confirm_uploading_files: |
  .input {$count :integer}
  .match $count
    0    {{ سيتم حفظ هذه الملفات في مجلد "{$folder}": }}
    one  {{ سيتم حفظ هذا الملف في مجلد "{$folder}": }}
    two  {{ سيتم حفظ هذين الملفين في مجلد "{$folder}": }}
    few  {{ سيتم حفظ هذه الـ {$count} ملفات في مجلد "{$folder}": }}
    many {{ سيتم حفظ هذه الـ {$count} ملفاً في مجلد "{$folder}": }}
    *    {{ سيتم حفظ هذه الـ {$count} ملف في مجلد "{$folder}": }}

# File size validation
# Warning section for files exceeding size limits
oversized_files: ملفات تتجاوز الحجم المسموح
# {$size} is the maximum allowed file size and {$count} is the number of oversized files
warning_oversized_files: |
  .input {$count :integer}
  .match $count
    0    {{ لا يمكن رفع هذه الملفات لأنها تتجاوز الحد الأقصى للحجم البالغ {$size}. يرجى تقليل الأحجام أو اختيار ملفات أخرى. }}
    one  {{ لا يمكن رفع هذا الملف لأنه يتجاوز الحد الأقصى للحجم البالغ {$size}. يرجى تقليل الحجم أو اختيار ملف آخر. }}
    two  {{ لا يمكن رفع هذين الملفين لأنهما يتجاوزان الحد الأقصى للحجم البالغ {$size}. يرجى تقليل الحجم أو اختيار ملفين آخرين. }}
    few  {{ لا يمكن رفع هذه الـ {$count} ملفات لأنها تتجاوز الحد الأقصى للحجم البالغ {$size}. يرجى تقليل الأحجام أو اختيار ملفات أخرى. }}
    many {{ لا يمكن رفع هذه الـ {$count} ملفاً لأنها تتجاوز الحد الأقصى للحجم البالغ {$size}. يرجى تقليل الأحجام أو اختيار ملفات أخرى. }}
    *    {{ لا يمكن رفع هذه الـ {$count} ملف لأنها تتجاوز الحد الأقصى للحجم البالغ {$size}. يرجى تقليل الأحجام أو اختيار ملفات أخرى. }}

# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: ملفات غير صالحة
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    one {{ لا يمكن رفع هذا الملف لأنه تالف أو لأن محتواه لا يطابق امتداده. يحدث هذا غالباً عند إعادة تسمية صورة بدلاً من تحويلها، مثل صورة HEIC محفوظة كملف JPEG. يرجى تحويل الملف والمحاولة مرة أخرى. }}
    *   {{ لا يمكن رفع هذه الملفات لأنها تالفة أو لأن محتواها لا يطابق امتداداتها. يحدث هذا غالباً عند إعادة تسمية الصور بدلاً من تحويلها، مثل صور HEIC محفوظة كملفات JPEG. يرجى تحويل الملفات والمحاولة مرة أخرى. }}
# {$count} is the number of files that are not of a type the field accepts, even once transformed
# {$types} is the list of accepted file types, such as “.pdf or .txt”
warning_unsupported_files: |
  .input {$count :integer}
  .match $count
    one {{ لا يمكن رفع هذا الملف لأنه ليس من أحد الأنواع التالية: {$types}. }}
    *   {{ لا يمكن رفع هذه الملفات لأنها ليست من أحد الأنواع التالية: {$types}. }}
# {$count} is the number of files that are not of an image type the field accepts
# {$types} is the list of accepted image formats, such as “PNG or WebP”
warning_unsupported_image_files: |
  .input {$count :integer}
  .match $count
    one {{ لا يمكن رفع هذا الملف لأنه يتم قبول الصور من الأنواع التالية فقط: {$types}. }}
    *   {{ لا يمكن رفع هذه الملفات لأنه يتم قبول الصور من الأنواع التالية فقط: {$types}. }}

# File format validation when replacing an asset
# Warning section for replacement files that are in a different format
mismatched_files: ملفات غير متطابقة
# {$name} is the name of the asset being replaced and {$count} is the number of mismatched files
warning_mismatched_files: |
  .input {$count :integer}
  .match $count
    one {{ لا يمكن لهذا الملف أن يحل محل "{$name}" لأنه بتنسيق مختلف. يرجى تحويل الملف إلى التنسيق نفسه والمحاولة مرة أخرى. }}
    *   {{ لا يمكن لهذه الملفات أن تحل محل "{$name}" لأنها بتنسيق مختلف. يرجى تحويل الملفات إلى التنسيق نفسه والمحاولة مرة أخرى. }}

