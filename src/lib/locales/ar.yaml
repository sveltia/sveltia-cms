  .input {$count :integer}
  .match $count
    0    {{ لا يمكن رفع هذه الملفات لأنها تتجاوز الحد الأقصى للحجم البالغ {$size}. يرجى تقليل الأحجام أو اختيار ملفات أخرى. }}
    one  {{ لا يمكن رفع هذا الملف لأنه يتجاوز الحد الأقصى للحجم البالغ {$size}. يرجى تقليل الحجم أو اختيار ملف آخر. }}
    two  {{ لا يمكن رفع هذين الملفين لأنهما يتجاوزان الحد الأقصى للحجم البالغ {$size}. يرجى تقليل الحجم أو اختيار ملفين آخرين. }}
    few  {{ لا يمكن رفع هذه الـ {$count} ملفات لأنها تتجاوز الحد الأقصى للحجم البالغ {$size}. يرجى تقليل الأحجام أو اختيار ملفات أخرى. }}
    many {{ لا يمكن رفع هذه الـ {$count} ملفاً لأنها تتجاوز الحد الأقصى للحجم البالغ {$size}. يرجى تقليل الأحجام أو اختيار ملفات أخرى. }}
    *    {{ لا يمكن رفع هذه الـ {$count} ملف لأنها تتجاوز الحد الأقصى للحجم البالغ {$size}. يرجى تقليل الأحجام أو اختيار ملفات أخرى. }}

