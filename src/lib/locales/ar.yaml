back_to_parent_folder: العودة إلى المجلد الأصلي

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: نتائج البحث
# {$terms} is the current search query text
search_results_for_x: نتائج البحث عن "{$terms}"

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0    {{ أنت تعرض الآن نتائج البحث عن "{$terms}". لم نتمكن من العثور على أي عناصر. }}
    one  {{ أنت تعرض الآن نتائج البحث عن "{$terms}". وجدنا عنصراً واحداً. }}
    two  {{ أنت تعرض الآن نتائج البحث عن "{$terms}". وجدنا عنصرين اثنين. }}
    few  {{ أنت تعرض الآن نتائج البحث عن "{$terms}". وجدنا {$count} عناصر. }}
    many {{ أنت تعرض الآن نتائج البحث عن "{$terms}". وجدنا {$count} عنصراً. }}
    *    {{ أنت تعرض الآن نتائج البحث عن "{$terms}". وجدنا {$count} عنصر. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0    {{ أنت تعرض الآن نتائج البحث عن "{$terms}". لم نتمكن من العثور على أي وسائط. }}
    one  {{ أنت تعرض الآن نتائج البحث عن "{$terms}". وجدنا عنصر وسائط واحداً. }}
    two  {{ أنت تعرض الآن نتائج البحث عن "{$terms}". وجدنا عنصري وسائط. }}
    few  {{ أنت تعرض الآن نتائج البحث عن "{$terms}". وجدنا {$count} عناصر وسائط. }}
    many {{ أنت تعرض الآن نتائج البحث عن "{$terms}". وجدنا {$count} عنصر وسائط. }}
    *    {{ أنت تعرض الآن نتائج البحث عن "{$terms}". وجدنا {$count} عنصر وسائط. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0    {{ لا توجد عناصر }}
    one  {{ عنصر واحد }}
    two  {{ عنصران }}
    few  {{ {$count} عناصر }}
    many {{ {$count} عنصراً }}
    *    {{ {$count} عنصر }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0    {{ لا توجد وسائط }}
    one  {{ عنصر وسائط واحد }}
    two  {{ عنصرا وسائط }}
    few  {{ {$count} عناصر وسائط }}
    many {{ {$count} عنصر وسائط }}
    *    {{ {$count} عنصر وسائط }}

# Empty state messages
no_files_found: لم يتم العثور على ملفات.
no_entries_found: لم يتم العثور على عناصر.

# ==============================================================================
# Asset Management
# ==============================================================================
# Strings for uploading, editing, and managing assets (images, documents, etc.).

# Upload dialog: title and button label
upload_assets: رفع وسائط جديدة

# New Folder button and dialog in the Asset Library
new_folder: مجلد جديد
new_folder_name: اسم المجلد
new_folder_create: إنشاء
# {$folder} is the path of the folder the new one will be created in, starting with a slash
new_folder_description: سيتم إنشاء المجلد الجديد داخل “{$folder}”.
# Validation errors for the new folder name
new_folder_error:
  empty: لا يمكن أن يكون اسم المجلد فارغاً.
  invalid: لا يمكن أن يحتوي اسم المجلد على شرطات مائلة أو أن يبدأ بنقطة.
  # A name the CMS itself is usually served from, e.g. `admin` or `cms`
  reserved: الملفات الموجودة في مجلد بهذا الاسم للقراءة فقط، لأن نظام إدارة المحتوى نفسه يُقدَّم منه عادةً.
  duplicate: يوجد مجلد أو ملف بهذا الاسم هنا بالفعل.
# Progress and error messages while the folder is being created
creating_folder: جارٍ إنشاء المجلد…
creating_folder_failed: تعذر إنشاء المجلد.

# Menu on a folder in the Asset Library, and the Rename Folder and Delete Folder dialogs
folder_options: خيارات المجلد
show_folder_options: إظهار خيارات المجلد
rename_folder: إعادة تسمية المجلد
delete_folder: حذف المجلد
# Rename Folder dialog body text
# {$count} is the number of assets in the folder, which are moved along with it
enter_new_name_for_folder: |
  .input {$count :integer}
  .match $count
    0    {{ أدخل اسماً جديداً أدناه. }}
    one  {{ أدخل اسماً جديداً أدناه. سيتم نقل الوسيط الموجود في المجلد معه، وسيتم تحديث أي عنصر يستخدمه. }}
    two  {{ أدخل اسماً جديداً أدناه. سيتم نقل الوسيطين الموجودين في المجلد معه، وسيتم تحديث أي عناصر تستخدمهما. }}
    few  {{ أدخل اسماً جديداً أدناه. سيتم نقل الـ {$count} وسائط الموجودة في المجلد معه، وسيتم تحديث أي عناصر تستخدمها. }}
    many {{ أدخل اسماً جديداً أدناه. سيتم نقل الـ {$count} وسيطاً الموجودة في المجلد معه، وسيتم تحديث أي عناصر تستخدمها. }}
    *    {{ أدخل اسماً جديداً أدناه. سيتم نقل الـ {$count} وسيط الموجودة في المجلد معه، وسيتم تحديث أي عناصر تستخدمها. }}
# Delete Folder confirmation
# {$name} is the folder name and {$count} is the number of assets in the folder
confirm_deleting_folder: |
  .input {$count :integer}
  .match $count
    0    {{ هل أنت متأكد من أنك تريد حذف المجلد الفارغ “{$name}”؟ }}
    one  {{ هل أنت متأكد من أنك تريد حذف المجلد “{$name}” والوسيط الموجود فيه؟ }}
    two  {{ هل أنت متأكد من أنك تريد حذف المجلد “{$name}” والوسيطين الموجودين فيه؟ }}
    few  {{ هل أنت متأكد من أنك تريد حذف المجلد “{$name}” والـ {$count} وسائط الموجودة فيه؟ }}
    many {{ هل أنت متأكد من أنك تريد حذف المجلد “{$name}” والـ {$count} وسيطاً الموجودة فيه؟ }}
    *    {{ هل أنت متأكد من أنك تريد حذف المجلد “{$name}” والـ {$count} وسيط الموجودة فيه؟ }}
# Progress and error messages while the folder is being renamed or deleted
renaming_folder: جارٍ إعادة تسمية المجلد…
renaming_folder_failed: تعذرت إعادة تسمية المجلد.
deleting_folder: جارٍ حذف المجلد…
deleting_folder_failed: تعذر حذف المجلد.
# Asset Library and asset picker: notice shown when a cloud storage service holds more files than
# are listed at once
external_assets_truncated: توجد ملفات كثيرة جداً على الخدمة بحيث لا يمكن عرضها كلها، لذلك تم استبعاد بعضها.

# Edit options menu: button and item labels
edit_options: خيارات التعديل
show_edit_options: إظهار خيارات التعديل
# Copy menu aria-label
copy_options: خيارات النسخ
# Edit menu items with specific asset names
edit_asset: تعديل الوسيط
# {$name} is the selected asset name
edit_x: تعديل {$name}

# Asset text editor: switch for line wrapping
wrap_long_lines: التفاف الأسطر الطويلة

# Move assets: dialog for moving assets to another folder in the repository
move: نقل
move_asset: نقل الوسيط
# Dialog title. {$name} is the asset name when a single asset is moved, and {$count} is the number of
# assets being moved
move_assets_title: |
  .input {$count :integer}
  .match $count
    0    {{ نقل الوسائط }}
    one  {{ نقل {$name} }}
    two  {{ نقل وسيطين }}
    few  {{ نقل {$count} وسائط }}
    many {{ نقل {$count} وسيطاً }}
    *    {{ نقل {$count} وسيط }}
# Dialog body text. {$count} is the number of entries that currently use the assets
select_asset_move_destination: |
  .input {$count :integer}
  .match $count
    0    {{ حدد المجلد المراد النقل إليه. }}
    one  {{ حدد المجلد المراد النقل إليه. سيتم أيضاً تحديث عنصر واحد يستخدم الوسائط. }}
    two  {{ حدد المجلد المراد النقل إليه. سيتم أيضاً تحديث عنصرين يستخدمان الوسائط. }}
    few  {{ حدد المجلد المراد النقل إليه. سيتم أيضاً تحديث {$count} عناصر تستخدم الوسائط. }}
    many {{ حدد المجلد المراد النقل إليه. سيتم أيضاً تحديث {$count} عنصراً يستخدم الوسائط. }}
    *    {{ حدد المجلد المراد النقل إليه. سيتم أيضاً تحديث {$count} عنصر يستخدم الوسائط. }}
# Accessible label of the folder tree in the Move dialog
asset_move_destination: المجلد الوجهة
# Shown when the assets being moved are all in the selected folder already
assets_already_in_folder: |
  .input {$count :integer}
  .match $count
    one {{ الوسيط موجود بالفعل في هذا المجلد. }}
    *   {{ الوسائط موجودة بالفعل في هذا المجلد. }}
# Shown when files with the same names exist in the selected folder. {$names} is a comma-separated
# list of file names
asset_move_conflict: 'الملفات التالية موجودة بالفعل في هذا المجلد: {$names}.'
moving_assets: جارٍ نقل الوسائط…
moving_assets_failed: تعذر نقل الوسائط.
# Warning shown when files have been moved off a cloud storage service, but the originals couldn’t
# be deleted from it
asset_move_cleanup_failed: تم نقل الملفات، لكن تعذر حذف الملفات الأصلية من خدمة التخزين.
# Shown when files on a cloud storage service can’t be renamed or moved, because the entries using
# them can’t be updated, e.g. for an Open Authoring contributor. {$count} is the number of files
cannot_change_used_external_files: |
  .input {$count :integer}
  .match $count
    one {{ لا يمكن إعادة تسمية هذا الملف أو نقله، لأنه لا يمكن تحديث العناصر التي تستخدمه. }}
    *   {{ لا يمكن إعادة تسمية هذه الملفات أو نقلها، لأنه لا يمكن تحديث العناصر التي تستخدمها. }}

# Rename asset: dialog and validation
rename_asset: إعادة تسمية الوسيط
# {$name} is the current asset name
rename_x: إعادة تسمية {$name}
# Dialog body text indicating how many entries reference this asset
# {$count} is the number of entries that currently reference the asset
enter_new_name_for_asset: |
  .input {$count :integer}
  .match $count
    0    {{ أدخل اسماً جديداً أدناه. }}
    one  {{ أدخل اسماً جديداً أدناه. سيتم أيضاً تحديث عنصر واحد يستخدم هذا الوسيط. }}
    two  {{ أدخل اسماً جديداً أدناه. سيتم أيضاً تحديث عنصرين اثنين يستخدمان هذا الوسيط. }}
    few  {{ أدخل اسماً جديداً أدناه. سيتم أيضاً تحديث {$count} عناصر تستخدم هذا الوسيط. }}
    many {{ أدخل اسماً جديداً أدناه. سيتم أيضاً تحديث {$count} عنصراً تستخدم هذا الوسيط. }}
    *    {{ أدخل اسماً جديداً أدناه. سيتم أيضاً تحديث {$count} عنصر يستخدم هذا الوسيط. }}
# Validation errors for asset renaming
enter_new_name_for_asset_error:
  empty: لا يمكن أن يكون اسم الملف فارغاً.
  character: لا يمكن أن يحتوي اسم الملف على رموز خاصة.
  duplicate: اسم الملف هذا مستخدم بالفعل لوسيط آخر.
  # A name starting with a dot hides the file, which the CMS wouldn’t list any more
  leading_dot: لا يمكن أن يبدأ اسم الملف بنقطة.
  # The name of a file next to the asset that isn’t an asset, like an entry file
  file_duplicate: يوجد ملف آخر بهذا الاسم هنا بالفعل.
  # The name of a folder next to the file
  folder_duplicate: يوجد مجلد بهذا الاسم هنا بالفعل.
# Shown while renaming a file whose name will be changed on saving, e.g. by the `slugify_filename`
# media library option
file_will_be_saved_as: سيتم حفظ الملف باسم “{$name}”.
# Confirmation dialog shown when the file extension is changed while renaming an asset
change_file_extension: تغيير امتداد الملف
# {$oldExtension} and {$newExtension} are file extensions without a leading dot, e.g. png
confirm_file_extension_change:
  change: هل أنت متأكد من أنك تريد تغيير الامتداد من ".{$oldExtension}" إلى ".{$newExtension}"؟
  add: هل أنت متأكد من أنك تريد إضافة الامتداد ".{$newExtension}"؟
  remove: هل أنت متأكد من أنك تريد إزالة الامتداد ".{$oldExtension}"؟
file_extension_change_warning: قد لا يتم عرض الملف أو معالجته بشكل صحيح إذا كان الامتداد لا يطابق تنسيق الملف الفعلي.

# Replace asset: menu item and dialog title
replace_asset: استبدال الوسيط
# {$name} is the asset being replaced
replace_x: استبدال {$name}
# File/Image field: labels of the Replace and Remove buttons
replace_file: استبدال الملف
replace_image: استبدال الصورة
remove_file: إزالة الملف
remove_image: إزالة الصورة

