# ==============================================================================
# Entry and Collection Actions
# ==============================================================================
# Strings related to creating, editing, and managing entries and collections.

# Error message when entry cannot be found
entry_not_found: لم يتم العثور على العنصر.

# Entry creation restrictions: tooltip and advisory messages
creating_entries_disabled_by_admin: تم تعطيل إنشاء عناصر جديدة في هذه المجموعة بواسطة المسؤول.
# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: لا يمكنك إضافة عناصر جديدة إلى هذه المجموعة لأنها وصلت إلى الحد الأقصى البالغ {$quota} عنصراً.
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$remaining :integer}
  .match $remaining
    0    {{ تقترب هذه المجموعة من حدها الأقصى البالغ {$quota} عنصراً. لا يمكنك إنشاء أي عناصر بعد. }}
    one  {{ تقترب هذه المجموعة من حدها الأقصى البالغ {$quota} عنصراً. يمكنك إنشاء عنصر واحد فقط بعد. }}
    two  {{ تقترب هذه المجموعة من حدها الأقصى البالغ {$quota} عنصراً. يمكنك إنشاء عنصرين اثنين فقط بعد. }}
    few  {{ تقترب هذه المجموعة من حدها الأقصى البالغ {$quota} عنصراً. يمكنك إنشاء {$remaining} عناصر فقط بعد. }}
    many {{ تقترب هذه المجموعة من حدها الأقصى البالغ {$quota} عنصراً. يمكنك إنشاء {$remaining} عنصراً فقط بعد. }}
    *    {{ تقترب هذه المجموعة من حدها الأقصى البالغ {$quota} عنصراً. يمكنك إنشاء {$remaining} عنصر فقط بعد. }}

# Navigation: back links and list labels
back_to_collection: العودة إلى المجموعة
collection_list: قائمة المجموعات
back_to_collection_list: العودة إلى قائمة المجموعات
asset_folder_list: قائمة مجلدات الوسائط
back_to_asset_folder_list: العودة إلى قائمة مجلدات الوسائط

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: نتائج البحث
# {$terms} is the current search query text
search_results_for_x: نتائج البحث عن "{$terms}"

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0    {{ أنت تعرض الآن نتائج البحث عن "{$terms}". لم نتمكن من العثور على أي عناصر. }}
    one  {{ أنت تعرض الآن نتائج البحث عن "{$terms}". وجدنا عنصراً واحداً. }}
    two  {{ أنت تعرض الآن نتائج البحث عن "{$terms}". وجدنا عنصرين اثنين. }}
    few  {{ أنت تعرض الآن نتائج البحث عن "{$terms}". وجدنا {$count} عناصر. }}
    many {{ أنت تعرض الآن نتائج البحث عن "{$terms}". وجدنا {$count} عنصراً. }}
    *    {{ أنت تعرض الآن نتائج البحث عن "{$terms}". وجدنا {$count} عنصر. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
