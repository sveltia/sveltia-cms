    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
    missing_collection_file_name: يجب أن يحتوي ملف المجموعة {$count} على الخيار `name` محددًا كسلسلة نصية غير فارغة.
    # {$name} is the invalid or duplicate collection file name
    invalid_collection_file_name: اسم ملف المجموعة `{$name}` غير صالح. يجب ألا يحتوي على رموز خاصة.
    duplicate_collection_file_name: يجب أن تكون أسماء ملفات المجموعات فريدة، ولكن `{$name}` مستخدم أكثر من مرة.
    # Don’t localize `fields`
    collection_no_fields: يجب أن تحتوي المجموعة على الخيار `fields` محددًا بحقل واحد على الأقل.
    # Don’t localize `fields`
    collection_file_no_fields: يجب أن يحتوي ملف المجموعة على الخيار `fields` محددًا بحقل واحد على الأقل.
    # Don’t localize `i18n`, `locale` and `file`
    collection_file_i18n_required: يجب أن يحتوي ملف المجموعة على الخيار `i18n` محددًا إذا تم استخدام العنصر البديل `locale` في مسار `file`.
    # {$count} is the 1-based field index in the current fields array; Don’t localize `name`
    missing_field_name: يجب أن يحتوي الحقل {$count} على الخيار `name` محددًا كسلسلة نصية غير فارغة.
    # {$name} is the invalid or duplicate field name
    invalid_field_name: اسم الحقل `{$name}` غير صالح. يجب ألا يحتوي على رموز خاصة. إذا كنت تريد تضمين الحقول داخل بعضها، <a>استخدم حقول Object بدلاً من تدوين النقطة</a>.
    duplicate_field_name: يجب أن تكون أسماء الحقول فريدة، ولكن `{$name}` مستخدم أكثر من مرة.
    # {$count} is the 1-based variable type index in the current types array
    missing_variable_type: يجب أن يحتوي نوع المتغير {$count} على الخيار `name` محددًا كسلسلة نصية غير فارغة.
    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: اسم نوع المتغير `{$name}` غير صالح. يجب ألا يحتوي على رموز خاصة.
    duplicate_variable_type: يجب أن تكون أسماء أنواع المتغيرات فريدة، ولكن `{$name}` مستخدم أكثر من مرة.
