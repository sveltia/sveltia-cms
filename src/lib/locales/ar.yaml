    public_folder_absolute_url: استخدام رابط URL مطلق لخيار المجلد العام غير مدعوم في Sveltia CMS.
    # Don’t localize `asset_collections`
    invalid_asset_collections: الخيار `asset_collections` غير صالح. يجب أن يكون مصفوفة.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: يجب أن تكون مجموعة الوسائط {$count} تمتلك خيار `name` معرفاً كسلسلة نصية غير فارغة.
