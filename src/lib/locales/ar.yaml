choose_files: |
  .input {$count :integer}
  .match $count
    0    {{ اختيار ملفات }}
    one  {{ اختيار ملف واحد }}
    two  {{ اختيار ملفين }}
    few  {{ اختيار {$count} ملفات }}
    many {{ اختيار {$count} ملفاً }}
    *    {{ اختيار {$count} ملف }}

# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    0    {{ حذف الوسائط }}
    one  {{ حذف عنصر الوسائط }}
    two  {{ حذف عنصري الوسائط }}
    few  {{ حذف {$count} عناصر وسائط }}
    many {{ حذف {$count} عنصر وسائط }}
    *    {{ حذف {$count} عنصر وسائط }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    0    {{ حذف الوسائط المحددة }}
    one  {{ حذف عنصر الوسائط المحدد }}
    two  {{ حذف عنصري الوسائط المحددين }}
    few  {{ حذف {$count} عناصر وسائط محددة }}
    many {{ حذف {$count} عنصر وسائط محدداً }}
    *    {{ حذف {$count} عنصر وسائط محدد }}
confirm_deleting_this_asset: هل أنت متأكد من أنك تريد حذف هذا الوسيط؟
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    0    {{ حذف الوسائط المحددة }}
    one  {{ حذف عنصر الوسائط المحدد }}
    two  {{ حذف عنصري الوسائط المحددين }}
    few  {{ حذف {$count} عناصر وسائط محددة }}
    many {{ حذف {$count} عنصر وسائط محدداً }}
    *    {{ حذف {$count} عنصر وسائط محدد }}
confirm_deleting_all_assets: هل أنت متأكد من أنك تريد حذف جميع الوسائط؟
# Note added to the confirmation when entries use the assets being deleted; the references are
# removed in the same commit. {$count} is the number of entries using them
deleting_referenced_assets_note: |
  .input {$count :integer}
  .match $count
    0    {{ لا توجد إشارات إليه في أي عنصر. }}
    one  {{ ستتم أيضاً إزالة الإشارة إليه في عنصر واحد. }}
    two  {{ ستتم أيضاً إزالة الإشارات إليه في عنصرين. }}
    few  {{ ستتم أيضاً إزالة الإشارات إليه في {$count} عناصر. }}
    many {{ ستتم أيضاً إزالة الإشارات إليه في {$count} عنصراً. }}
    *    {{ ستتم أيضاً إزالة الإشارات إليه في {$count} عنصر. }}
# Shown in place of the confirmation when removing the references would leave a field in an entry
# invalid, e.g. a required Image field with nothing left, so the deletion is refused. The fields are
# listed below the message, each with the validation error it would have. {$count} is the number of
# assets being deleted
cannot_delete_referenced_assets: |
  .input {$count :integer}
  .match $count
    one {{ لا يمكن حذف هذا الوسيط، لأن الحقول التالية في العناصر التي تستخدمه لن تكون صالحة بدونه. حدّث تلك العناصر أولاً. }}
    *   {{ لا يمكن حذف هذه الوسائط، لأن الحقول التالية في العناصر التي تستخدمها لن تكون صالحة بدونها. حدّث تلك العناصر أولاً. }}
# Error shown in the asset deletion dialog when the entries using the assets couldn’t be looked up,
# so the deletion can’t go ahead. {$count} is the number of assets being deleted
checking_asset_references_failed: |
  .input {$count :integer}
  .match $count
    one {{ تعذر التحقق من العناصر التي تستخدم هذا الوسيط. أغلق مربع الحوار هذا وحاول مرة أخرى. }}
    *   {{ تعذر التحقق من العناصر التي تستخدم هذه الوسائط. أغلق مربع الحوار هذا وحاول مرة أخرى. }}

# Delete entries: dialog titles and confirmation messages
