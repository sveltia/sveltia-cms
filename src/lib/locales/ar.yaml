locale_load_failed: تعذر تحميل ترجمة {$locale}. يرجى المحاولة مرة أخرى لاحقاً.

# Toast notification shown when changes saved with the local backend couldn’t be committed to Git
# {$reason} is one of the `local_git_skip_reasons` strings below
local_git_not_committed: تم حفظ تغييراتك ولكن لم يتم إيداعها في Git. {$reason} لحفظ الملفات فقط، أوقف إيداعات Git ضمن الإعدادات > المطور.
local_git_skip_reasons:
  unsupported_repository: يستخدم مستودعك ميزة في Git لا يدعمها نظام إدارة المحتوى، مثل شجرة عمل مرتبطة (Linked Worktree)، أو أسماء كائنات SHA-256، أو تنسيق reftable، أو فهرس متفرق (Sparse Index)، أو فهرس بالإصدار 3 أو 4، الذي يستخدمه الخيار feature.manyFiles والأمر git add -N.
  missing_identity: لم يتم تعيين اسمك وعنوان بريدك الإلكتروني في إعدادات Git الخاصة بالمستودع، ولا يمكن لنظام إدارة المحتوى قراءة إعداداتك العامة. عيّنهما في المستودع باستخدام git config --local user.name "Your Name" و git config --local user.email "you@example.com".
  locked: تستخدم عملية Git أخرى المستودع. إذا لم تكن هناك أي عملية قيد التشغيل، فاحذف الملف .git/index.lock.
  # The operation in progress, with how to finish or cancel it
  operation_in_progress:
    merge: عملية دمج (Merge) قيد التنفيذ. أكملها باستخدام git commit، أو ألغها باستخدام git merge --abort.
    rebase: عملية إعادة تأسيس (Rebase) قيد التنفيذ. أكملها باستخدام git rebase --continue، أو ألغها باستخدام git rebase --abort. إذا كنت قد تجاوزتها، فإن git rebase --quit يتخلى عنها دون تغيير ملفاتك.
    cherry_pick: عملية انتقاء (Cherry-pick) قيد التنفيذ. أكملها باستخدام git cherry-pick --continue، أو ألغها باستخدام git cherry-pick --abort.
    revert: عملية تراجع (Revert) قيد التنفيذ. أكملها باستخدام git revert --continue، أو ألغها باستخدام git revert --abort.
    am: تطبيق التصحيحات باستخدام git am قيد التنفيذ. أكمله باستخدام git am --continue، أو ألغه باستخدام git am --abort.
    conflict: تحتوي بعض الملفات على تعارضات. قم بحلها وأضف النتائج إلى منطقة التجهيز (Staging) أولاً.
  detached_head: لم يتم سحب أي فرع (Checkout).
  staged_changes: لديك تغييرات أخرى مجهّزة للإيداع. أودعها أو ألغِ تجهيزها أولاً.
  # {$path} is the file path
  lfs: يتم تتبع {$path} باستخدام Git LFS، الذي لا يمكن لنظام إدارة المحتوى الإيداع فيه.
  # {$message} is the error message
  error: حدث خطأ غير متوقع. {$message}

