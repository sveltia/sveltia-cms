    one  {{ يوجد ملف بنفس الاسم بالفعل في هذا المجلد. هل تريد استبداله؟ }}
    two  {{ يوجد ملفان بنفس الاسم بالفعل في هذا المجلد. هل تريد استبدالهما؟ }}
