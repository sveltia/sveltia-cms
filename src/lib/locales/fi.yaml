# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: Tämä kenttä on pakollinen.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: Päivämäärän ja kellonajan on oltava {$min} tai sen jälkeen.
    date: Päivämäärän on oltava {$min} tai sen jälkeen.
    time: Kellonajan on oltava {$min} tai sen jälkeen.
    number: Arvon on oltava vähintään {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Sinun on valittava vähintään {$min} vaihtoehto. }}
        *   {{ Sinun on valittava vähintään {$min} vaihtoehtoa. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Sinun on lisättävä vähintään {$min} kohde. }}
        *   {{ Sinun on lisättävä vähintään {$min} kohdetta. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: Päivämäärän ja kellonajan on oltava {$max} tai sitä ennen.
    date: Päivämäärän on oltava {$max} tai sitä ennen.
    time: Kellonajan on oltava {$max} tai sitä ennen.
    number: Arvon on oltava enintään {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ Et voi valita enempää kuin {$max} vaihtoehto. }}
        *   {{ Et voi valita enempää kuin {$max} vaihtoehtoa. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ Et voi lisätä enempää kuin {$max} kohde. }}
        *   {{ Et voi lisätä enempää kuin {$max} kohdetta. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Syötä vähintään {$min} merkki. }}
      *   {{ Syötä vähintään {$min} merkkiä. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ Et voi syöttää enempää kuin {$max} merkki. }}
      *   {{ Et voi syöttää enempää kuin {$max} merkkiä. }}

  # Type validation errors
  type_mismatch:
    number: Anna numero.
    email: Anna kelvollinen sähköpostiosoite.
    url: Anna kelvollinen URL-osoite.

  # Custom field validation error
  invalid_value: Virheellinen arvo.
  unexpected_error: Odottamaton virhe.

