        title: Pilvitallennuspalvelujen API-avaimet
        description: Hallitse <a>pilvitallennuspalvelujen</a> API-avaimia.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: '{$service}-API-avain'
      no_services: Yhtään <a>pilvitallennuspalvelua</a> ei ole määritetty.

