    also_open_by_x: 'Avoinna myös: {$names}'
    # {$names} is a list of the people who have the entry open, besides anyone editing it
    open_by_x: 'Avoinna: {$names}'
  users:
    title: Käyttäjät
    add_user: Lisää käyttäjä
    edit_user: Muokkaa käyttäjää
    add: Lisää
    name: Nimi
    username_description: Käyttäjätunnusta ei voi muuttaa, kun käyttäjä on lisätty.
    email_optional: Sähköposti (valinnainen)
