# repository since the entry was opened in the editor
save_conflict:
  title: Joku muu on muuttanut merkintää
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} muutti tätä merkintää {$date}, sen jälkeen kun avasit sen.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Tätä merkintää on muutettu repositoriossa sen jälkeen, kun avasit sen.
  deleted: Tämä merkintä on poistettu repositoriosta sen jälkeen, kun avasit sen.
  # Follows `modified_by` or `modified`
  overwrite_warning: Jos tallennat nyt, heidän muutoksensa menetetään.
  # Follows `deleted`
  recreate_warning: Jos tallennat nyt, merkintä luodaan uudelleen.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Koska merkintä on tallennettu samaan tiedostoon muiden merkintöjen kanssa, sitä ei voi tallentaa muutoksen päälle. Peruuta muokkaus, avaa merkintä uudelleen listauksesta ja tee muokkauksesi.
  # OK button label
  save_anyway: Tallenna silti
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: Joku muu päivitti repositoriota tallennuksen aikana. Yritä uudelleen.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Joku muu on muuttanut samaan tiedostoon tallennettua merkintää. Yritä uudelleen.
  # {$path} is the file path
  array_file_invalid: Tiedostoa {$path} ei voi päivittää, koska se ei sisällä kelvollista merkintäluetteloa.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
# repository while the user has it open. The change itself is described with the `save_conflict`
# strings above
remote_change:
  reload_entry: Lataa merkintä uudelleen
  # Confirmation shown before reloading when the user has unsaved changes
  confirm_reloading_entry: Haluatko varmasti ladata merkinnän uudelleen? Tallentamattomat muutoksesi menetetään.

