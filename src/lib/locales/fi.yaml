cloud_storage:
  # Configuration error
  invalid: Palvelua ei ole määritetty oikein.

  # Authentication states
  auth:
    api_key:
      key_label: API-avain
      # {$key} is the credential label, e.g., API Key, and {$service} is the cloud service name
      initial: Anna {$key} palvelulle {$service}.
      requested: Vahvistetaan…
      # {$key} is the credential label the user entered, e.g., API Key
      error: Annettu {$key} on virheellinen. Tarkista se ja yritä uudelleen.
    password:
      # {$service} is the cloud service name
      initial: Anna salasanasi palvelulle {$service}.
      requested: Kirjaudutaan sisään…
      error: Käyttäjätunnus tai salasana on virheellinen. Tarkista tiedot ja yritä uudelleen.

  # Service-specific configurations
  cloudinary:
    iframe_title: Cloudinary-mediakirjasto
    activate:
      button_label: Aktivoi Cloudinary
      description: Kirjauduttuasi sisään, napsauta Kirjaudu sisään -painiketta uudelleen jatkaaksesi.
    auth_key_label: API-salaisuus
    open_library: Avaa Cloudinary

  uploadcare:
    auth_key_label: Salainen API-avain

  aws_s3:
    auth_key_label: Salainen pääsyavain

  cloudflare_r2:
    auth_key_label: Salainen pääsyavain

  digitalocean_spaces:
    auth_key_label: Salainen pääsyavain

# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ CMS-asetuksissa on virhe. Korjaa ongelma ja yritä uudelleen. }}
      *   {{ CMS-asetuksissa on virheitä. Korjaa ongelmat ja yritä uudelleen. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: '{$collection}-kokoelma'
    file: '{$file}-tiedosto'
    component: '{$component}-komponentti'
    # Don’t localize `{$field}`
    field: '`{$field}`-kenttä'

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS toimii vain HTTPS- tai localhost-osoitteilla.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ Asetustiedoston URL-osoitteen on käytettävä HTTPS-protokollaa tai localhost-osoitetta. }}
        *   {{ Asetustiedostojen URL-osoitteiden on käytettävä HTTPS-protokollaa tai localhost-osoitteita. }}
    fetch_failed: Asetustiedostoa ei voitu hakea.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: HTTP-vastaus palautti tilakoodin {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Asetustiedostoa ei voitu hakea. Jos haluat estää `config.yml`-tiedoston lataamisen, lisää <a>`load_config_file: false`</a> `CMS.init()`-kutsulle välitettävään asetusobjektiin.'
    parse_failed: Asetustiedostoa ei voitu jäsentää.
    parse_failed_invalid_object: Asetustiedosto ei ole validi JavaScript-objekti.
    parse_failed_unsupported_type: Asetustiedosto ei ole validi tiedostotyyppi. Vain YAML, TOML ja JSON ovat tuettuja.
    no_collection: Kokoelmia ei ole määritetty.
    # Don’t localize `hide`
    no_visible_collection: Vähintään yhden kokoelman on oltava näkyvissä. Tarkista asetus `hide`.
    missing_backend: Taustajärjestelmää ei ole määritetty.
    missing_backend_name: Taustajärjestelmän nimeä ei ole määritetty.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Taustajärjestelmää {$name} ei <a>tueta</a> Sveltia CMS:ssä.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Vanhentunutta taustajärjestelmää {$name} ei <a>tueta</a> Sveltia CMS:ssä.
    unsupported_custom_backend: Mukautettuja taustajärjestelmiä ei <a>tueta</a> Sveltia CMS:ssä.
    unsupported_backend_suggestion: Käytä jotakin <a>tuetuista taustajärjestelmistä</a>.
    missing_repository: Repositoriota ei ole määritetty.
    invalid_repository: Määritetty repositorio on virheellinen. Sen on oltava muodossa ”omistaja/repositorio”.
    oauth_implicit_flow: Määritettyä todennustapaa (implicit flow) ei tueta Sveltia CMS:ssä. Käytä toista <a>todennustapaa</a>.
    github_pkce_unsupported: PKCE-valtuutusta ei vielä tueta GitHubin rajoitusten vuoksi. Käytä toista <a>todennustapaa</a>.
    oauth_no_app_id: OAuth-sovelluksen application ID:tä ei ole määritetty.
    # Don’t localize `open_authoring` and `editorial_workflow`
    open_authoring_no_workflow: Asetus `open_authoring` edellyttää julkaisutilaa `editorial_workflow`. Katso lisätietoja <a>dokumentaatiosta</a>.
    # Don’t localize `auth_methods`
    no_auth_methods: Asetuksen `auth_methods` on sisällettävä vähintään yksi metodi.
    missing_media_folder: Mediakansiota ei ole määritetty.
    public_folder_relative_path: Määritetty julkinen kansio on virheellinen. Sen on oltava absoluuttinen polku, joka alkaa merkillä ”/”.
    public_folder_absolute_url: Julkisen kansion absoluuttista URL-osoitetta ei tueta Sveltia CMS:ssä.
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: Asetus `transformations` sisältää avaimen `{$key}`, jota ei tueta. Sen on oltava `raster_image`, `svg` tai tuettu rasterikuvamuoto.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: Muunnoksen `{$key}` asetus `quality` on virheellinen. Sen on oltava kokonaisluku väliltä 0–100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: Muunnoksen `{$key}` asetus `{$prop}` on virheellinen. Sen on oltava positiivinen kokonaisluku.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: Assettikokoelmalla {$count} on oltava asetus `name` määritettynä ei-tyhjänä merkkijonona.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Assettikokoelman nimi `{$name}` on virheellinen. Se ei saa sisältää erikoismerkkejä.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Assettikokoelmien nimien on oltava yksilöllisiä, mutta `{$name}` on käytössä useammin kuin kerran.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_no_options: Kokoelmalla on oltava jokin asetuksista `folder`, `files` tai `divider`.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_multiple_options: Kokoelmalla ei voi olla asetuksia `folder`, `files` ja `divider` samanaikaisesti.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: Tiedostopääte `{$extension}` ei vastaa muotoa `{$format}`.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Polku-templaatti `{$slug}` on virheellinen, koska se ei voi sisältää kauttaviivoja. Järjestääksesi merkinnät alikansioihin, käytä asetusta `path` asetuksen `slug` sijaan.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: Asetus `reorder` viittaa näkymäryhmään `{$name}`, mutta sellaista ryhmää ei ole määritetty asetuksessa `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: Asetus `sortable_fields` viittaa kenttään `{$name}`, mutta sellaista kenttää ei ole määritetty kokoelmassa.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: Asetus `view_groups` viittaa kenttään `{$name}`, mutta sellaista kenttää ei ole määritetty kokoelmassa.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: Asetus `view_filters` viittaa kenttään `{$name}`, mutta sellaista kenttää ei ole määritetty kokoelmassa.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: Näkymäryhmällä {$count} on oltava asetus `name` ei-tyhjänä merkkijonona.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: Näkymäryhmän nimi `{$name}` on virheellinen. Se ei voi sisältää erikoismerkkejä.
    duplicate_view_group_name: Näkymäryhmien nimien on oltava yksilöllisiä, mutta nimi `{$name}` on käytössä useammin kuin kerran.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: Näkymäsuodattimella {$count} on oltava asetus `name` ei-tyhjänä merkkijonona.
    # {$name} is the invalid or duplicate view filter name
    invalid_view_filter_name: Näkymäsuodattimen nimi `{$name}` on virheellinen. Se ei voi sisältää erikoismerkkejä.
    duplicate_view_filter_name: Näkymäsuodattimien nimien on oltava yksilöllisiä, mutta nimi `{$name}` on käytössä useammin kuin kerran.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: Kokoelmalla {$count} on oltava asetus `name` ei-tyhjänä merkkijonona.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: Kokoelman nimi `{$name}` on virheellinen. Se ei saa sisältää erikoismerkkejä.
    duplicate_collection_name: Kokoelmien nimien on oltava yksilöllisiä, mutta `{$name}` on käytössä useammin kuin kerran.
    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
    missing_collection_file_name: Kokoelmatiedostolla {$count} on oltava asetus `name` määritettynä ei-tyhjänä merkkijonona.
    # {$name} is the invalid or duplicate collection file name
    invalid_collection_file_name: Kokoelmatiedoston nimi `{$name}` on virheellinen. Se ei saa sisältää erikoismerkkejä.
    duplicate_collection_file_name: Kokoelmatiedostojen nimien on oltava yksilöllisiä, mutta `{$name}` on käytössä useammin kuin kerran.
    # Don’t localize `fields`
    collection_no_fields: Kokoelmalla on oltava asetus `fields` määritettynä vähintään yhdellä kentällä.
    # Don’t localize `fields`
    collection_file_no_fields: Kokoelmatiedostolla on oltava asetus `fields` määritettynä vähintään yhdellä kentällä.
    # Don’t localize `i18n`, `locale` and `file`
    collection_file_i18n_required: Kokoelmatiedostolla on oltava asetus `i18n` määritettynä, jos `file`-polussa käytetään `locale`-paikkamerkkiä.
    # {$count} is the 1-based field index in the current fields array; Don’t localize `name`
    missing_field_name: Kentällä {$count} on oltava asetus `name` määritettynä ei-tyhjänä merkkijonona.
    # {$name} is the invalid or duplicate field name
    invalid_field_name: Kentän nimi `{$name}` on virheellinen. Se ei saa sisältää erikoismerkkejä. Jos haluat sisäkkäisiä kenttiä, <a>käytä Object-kenttiä pistemerkinnän sijaan</a>.
    duplicate_field_name: Kenttien nimien on oltava yksilöllisiä, mutta `{$name}` on käytössä useammin kuin kerran.
    # {$count} is the 1-based variable type index in the current types array
    missing_variable_type: Muuttujatyypillä {$count} on oltava asetus `name` määritettynä ei-tyhjänä merkkijonona.
    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: Muuttujatyypin nimi `{$name}` on virheellinen. Se ei saa sisältää erikoismerkkejä.
    duplicate_variable_type: Muuttujatyyppien nimien on oltava yksilöllisiä, mutta `{$name}` on käytössä useammin kuin kerran.
    date_field_type: 'Vanhentunutta Date-kenttätyyppiä ei tueta Sveltia CMS:ssä. Käytä DateTime-kenttätyyppiä asetuksella `type: date`.'
    # {$timeZone} is the invalid IANA timezone identifier from the configuration
    invalid_timezone: 'Virheellinen aikavyöhyke: {$timeZone}. Sen on oltava kelvollinen IANA-aikavyöhyketunniste, kuten `America/New_York` tai `Asia/Tokyo`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: Vanhentunutta asetusta `{$prop}` ei tueta Sveltia CMS:ssä. Käytä asetusta `{$newProp}`.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: Asetusta `allow_multiple` ei tueta Sveltia CMS:ssä. Käytä sen sijaan asetusta `multiple`, jonka oletusarvo on `false`.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: List-kentällä ei voi olla asetuksia `field`, `fields` ja `types` samanaikaisesti.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: List-kentän muuttujatyyppi on virheellinen. Asetus `widget` on `{$widget}`, mutta sen on oltava `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: Object-kentällä ei voi olla asetuksia `fields` ja `types` samanaikaisesti.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: Viitattu kokoelma `{$collection}` on virheellinen tai sitä ei ole määritetty.
    relation_field_invalid_collection_file: Viitattu tiedosto `{$file}` on virheellinen tai sitä ei ole määritetty.
    # Don’t localize `file`
    relation_field_missing_file_name: Asetus `file` on määritettävä, kun viitataan tiedostokokoelmaan.
    relation_field_invalid_value_field: Viitattu arvokenttä `{$field}` on virheellinen tai sitä ei ole määritetty.
    unexpected: Odottamaton virhe

    # Schema validation errors, reported when the configuration doesn’t match the published JSON
    # schema. In all of these, {$option} is a configuration option path such as `backend.name` or
    # `view_filters[0].pattern`, relative to the collection, file or field named before it.
    # {$type} is a value type name from `schema_value_type` below
    schema_invalid_type: Asetuksen `{$option}` on oltava {$type}.
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'Asetuksen `{$option}` on oltava jokin näistä arvoista: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: Asetuksen `{$option}` on oltava `{$value}`.
    schema_invalid_empty_value: Asetuksen `{$option}` on oltava tyhjä merkkijono.
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: Asetuksen `{$option}` on oltava taulukko, jossa on {$count} alkiota.
    schema_invalid_value: Asetuksen `{$option}` arvo on virheellinen.
    schema_missing_option: Asetus `{$option}` on pakollinen.
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Jokin näistä asetuksista on pakollinen: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: merkkijono
      number: luku
      integer: kokonaisluku
      boolean: totuusarvo
      array: taulukko
      object: objekti
      'null': tyhjä

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: OAuth-sovelluksen tunnusta ei ole määritetty. Käyttäjien on annettava pääsytunnus kirjautuakseen sisään.
    editorial_workflow_unsupported: Editoinnin työnkulkua ei vielä tueta Sveltia CMS:ssä.
    open_authoring_unsupported_backend: Open Authoring -ominaisuutta tuetaan tällä hetkellä vain GitHub-taustajärjestelmällä.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: Asetusta `{$prop}` ei tueta Sveltia CMS:ssä. Se jätetään huomiotta.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Sekä `picker_utc` että uudemmat aikavyöhykeasetukset (`input_timezone` tai `output_utc`) on asetettu. Uudet asetukset ovat ensisijaisia. Harkitse asetuksen `picker_utc` poistamista määrityksistäsi.
    # Don’t localize `preview_path`
    preview_path_no_date_field: Asetus `preview_path` käyttää päivämäärä- ja aikatageja, mutta kokoelmassa ei ole DateTime-kenttää, josta ne voitaisiin lukea, joten esikatselulinkkiä ei näytetä.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: Asetus `preview_path_date_field` viittaa kenttään `{$name}`, mutta sennimistä DateTime-kenttää ei ole määritetty, joten esikatselulinkkiä ei näytetä.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: Asetus `preview_path` viittaa kenttään `{$name}`, mutta sellaista kenttää ei ole määritetty kokoelmassa, joten esikatselulinkkiä ei näytetä.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: Asetusta `{$option}` ei ole määritetty Sveltia CMS:n konfiguraatioskeemassa. Se jätetään huomiotta. Tarkista, ettei kyseessä ole kirjoitus- tai syntaksivirhe.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Katso yhteensopivuustiedot: {$link}'

  # Console tip shown after config load
  schema_tip: 'Saadaksesi paremman kehittäjäkokemuksen voit tarkistaa asetustiedostosi Sveltia CMS:n JSON-skeemaa vasten. Katso lisätietoja: {$link}'

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Paikallinen
  # Browser compatibility warnings
  unsupported_browser: Paikallinen työnkulku ei ole tuettu selaimessasi. Käytä Chromea tai Edgeä.
  disabled: Paikallinen työnkulku on pois käytöstä selaimessasi. <a>Näin otat sen käyttöön</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Katselet nyt editoinnin työnkulun taulua. Luonnokset: {$draft}. Tarkistuksessa: {$review}. Valmiit: {$ready}. Odottaa poistoa: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Katselet nyt editoinnin työnkulun taulua. Luonnokset: {$draft}. Tarkistuksessa: {$review}. Odottaa poistoa: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Luonnos
  drafts: Luonnokset
  in_review: Tarkistuksessa
  ready: Valmis
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Odottaa poistoa

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Peruuta poisto
  confirm_cancelling_deletion: Haluatko varmasti peruuttaa tämän poiston? Merkintä pysyy julkaistuna.
  confirm_completing_deletion: Haluatko varmasti poistaa tämän merkinnän? Se poistetaan heti.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ Merkintä merkitty poistettavaksi. }}
      *   {{ {$count} merkintää merkitty poistettavaksi. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Muutokset hylätty. }}
      *   {{ {$count} merkinnän muutokset hylätty. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Peruutetaan poistoa…
  deletion_cancelled: Poisto peruutettu.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Poiston peruuttaminen epäonnistui. Yritä uudelleen.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Julkaisemattomat merkinnät
  published_entries: Julkaistut merkinnät
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Tila: {$status}'
  change_entry_status: Vaihda merkinnän tilaa
  # Editor toolbar: progress label while the status is being changed
  changing_status: Vaihdetaan tilaa…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Päivitetään tilaa…
  status_updated: Tila päivitetty.
  # Error notification when the status could not be changed
  status_change_failed: Tilan vaihtaminen epäonnistui. Yritä uudelleen.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: Merkinnässä on virheitä. Korjaa ne ennen tilan vaihtamista.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: Merkinnässä on virheitä. Korjaa ne ennen julkaisemista.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Lähetä tarkistettavaksi
  confirm_sending_for_review: Muutoksesi on tallennettu luonnoksena. Lähetetäänkö merkintä tarkistettavaksi, jotta joku voi katsoa sen ja julkaista sen?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Julkaise merkintä
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Hylkää muutokset
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Haluatko varmasti poistaa tämän merkinnän? Sitä ei poisteta ennen kuin poisto on julkaistu. Siihen asti löydät sen edelleen merkintäluettelosta merkinnällä ”Odottaa poistoa”.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Tätä merkintää ei ole vielä julkaistu, joten sen poistaminen hylkää sen kokonaan.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Tässä merkinnässä on julkaisemattomia muutoksia. Niiden hylkääminen palauttaa julkaistun version. Itse merkintää ei poisteta.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Sitä ei ole vielä julkaistu, joten julkaisemattomat muutoksesi hylätään. Mahdollinen julkaistu versio pysyy julkaistuna. }}
      *   {{ Niitä ei ole vielä julkaistu, joten julkaisemattomat muutoksesi hylätään. Mahdolliset julkaistut versiot pysyvät julkaistuina. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ Yhtä niistä ei ole vielä julkaistu, joten julkaisemattomat muutoksesi hylätään. Mahdollinen julkaistu versio pysyy julkaistuna. }}
      *   {{ {$count} niistä ei ole vielä julkaistu, joten julkaisemattomat muutoksesi hylätään. Mahdolliset julkaistut versiot pysyvät julkaistuina. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry: Haluatko varmasti julkaista tämän merkinnän? Muutoksesi tulevat voimaan heti.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Julkaistaan merkintää…
  entry_published: Merkintä julkaistu.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Poistetaan merkintää…
  discarding_changes: Hylätään muutoksia…
  entry_deleted: Merkintä poistettu.
  # Error notification when publishing fails
  publishing_entry_failed: Merkinnän julkaiseminen epäonnistui. Yritä uudelleen.
  # Workflow page: empty column message
  no_entries: Ei merkintöjä.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Vaihda tilaa vetämällä

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Forkkaa repositorio
  fork: Forkkaa
  confirm_forking_repository: Jotta voit ehdottaa muutoksia repositorioon ”{$repo}”, tilillesi on luotava siitä forkki. Muutoksesi tallennetaan tähän forkkiin, ja ylläpitäjä tarkistaa ne ennen niiden julkaisua.
  # Error shown when the user declined the dialog above
  fork_declined: Tarvitset repositorion forkin tilillesi voidaksesi ehdottaa muutoksia.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Repositorion ”{$repo}” forkkia ei voitu luoda tilillesi.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Käyttöoikeuttasi repositorioon ”{$repo}” ei voitu tarkistaa. Yritä hetken kuluttua uudelleen.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Repositorio ”{$repo}” ei salli forkkeja. Pyydä ylläpitäjää sallimaan sen forkkaus.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Sinulla on odottava kutsu repositorioon ”{$repo}”. Hyväksy se GitHubissa ja kirjaudu sitten uudelleen sisään.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Kirjautumisesi ei sisällä pääsyä yksityisiin repositorioihin, joten repositoriota ”{$repo}” ei voi lukea. Pyydä ylläpitäjää tarkistamaan CMS:n todennusasetukset.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Vain ylläpitäjä voi julkaista muutoksia tälle sivustolle. Merkitse merkintäsi sen sijaan tilaan ”Tarkistuksessa”, niin joku katsoo sen.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Tätä muutosta ei voi tehdä suoraan. Vain merkintöjen muokkauksia voi ehdottaa tarkistettavaksi.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Muutoksesi tallennetaan tämän repositorion forkkiin ”{$repo}” ja tarkistetaan ennen niiden julkaisua.
  view_fork: Näytä forkki

