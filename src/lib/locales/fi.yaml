  .match $count
    one {{ Pudota tiedosto tähän tai napsauta selataksesi… }}
    *   {{ Pudota tiedostoja tähän tai napsauta selataksesi… }}
# Partial drop zone text (ends with inline button)
# {$count} is the number of files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Pudota tiedosto tähän tai }}
    *   {{ Pudota tiedostoja tähän tai }}
# Image-specific drop zone text
# {$count} is the number of image files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_image_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Pudota kuvatiedosto tähän tai }}
    *   {{ Pudota kuvatiedostoja tähän tai }}

# File picker and clipboard actions used by upload controls
browse: Selaa
# Generic clipboard paste action used by non-image file fields
paste: Liitä
# Clipboard paste action used by image fields
paste_image: Liitä kuva

# Clipboard paste errors
no_image_in_clipboard: Leikepöydältä ei löytynyt kuvaa.
clipboard_access_denied: Pääsy leikepöytään estetty.

# Drag-and-drop overlay text (shown while dragging)
# {$count} is the number of files expected by the current picker mode
drop_files_here: |
  .input {$count :integer}
  .match $count
    one {{ Pudota tiedosto tähän }}
    *   {{ Pudota tiedostoja tähän }}

# File type validation errors
unsupported_file_type: Tiedostotyyppiä ei tueta
# {$type} is the expected asset type label, such as image or document
dropped_file_type_mismatch: 'Pudotettu tiedosto ei ole yksi seuraavista tyypeistä: {$types}. Yritä uudelleen.'
dropped_image_type_mismatch: 'Pudotettua tiedostoa ei tueta. Vain seuraavien tyyppien kuvat hyväksytään: {$types}. Yritä uudelleen.'

# File chooser button label
# {$count} is the number of files the picker allows the user to choose
choose_files: |
  .input {$count :integer}
  .match $count
    one {{ Valitse tiedosto }}
    *   {{ Valitse tiedostot }}

# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    one {{ Poista assetti }}
    *   {{ Poista assetit }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Poista valittu assetti }}
    *   {{ Poista valitut assetit }}
confirm_deleting_this_asset: Haluatko varmasti poistaa tämän assetin?
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Haluatko varmasti poistaa valitun assetin? }}
    *   {{ Haluatko varmasti poistaa valitut {$count} assetit? }}
confirm_deleting_all_assets: Haluatko varmasti poistaa kaikki assetit?
# Note added to the confirmation when entries use the assets being deleted; the references are
# removed in the same commit. {$count} is the number of entries using them
deleting_referenced_assets_note: |
  .input {$count :integer}
  .match $count
    one {{ Myös viittaus siihen merkinnässä poistetaan. }}
    *   {{ Myös viittaukset siihen {$count} merkinnässä poistetaan. }}
# Shown in place of the confirmation when removing the references would leave a field in an entry
# invalid, e.g. a required Image field with nothing left, so the deletion is refused. The fields are
# listed below the message, each with the validation error it would have. {$count} is the number of
# assets being deleted
cannot_delete_referenced_assets: |
  .input {$count :integer}
  .match $count
    one {{ Tätä assettia ei voi poistaa, koska seuraavat sitä käyttävien merkintöjen kentät eivät olisi enää kelvollisia ilman sitä. Päivitä nämä merkinnät ensin. }}
    *   {{ Näitä assetteja ei voi poistaa, koska seuraavat niitä käyttävien merkintöjen kentät eivät olisi enää kelvollisia ilman niitä. Päivitä nämä merkinnät ensin. }}
# Error shown in the asset deletion dialog when the entries using the assets couldn’t be looked up,
# so the deletion can’t go ahead. {$count} is the number of assets being deleted
checking_asset_references_failed: |
  .input {$count :integer}
  .match $count
    one {{ Tätä assettia käyttäviä merkintöjä ei voitu tarkistaa. Sulje tämä valintaikkuna ja yritä uudelleen. }}
    *   {{ Näitä assetteja käyttäviä merkintöjä ei voitu tarkistaa. Sulje tämä valintaikkuna ja yritä uudelleen. }}

# Delete entries: dialog titles and confirmation messages
# {$count} is the number of entries targeted by the action
delete_entries: |
  .input {$count :integer}
  .match $count
    one {{ Poista merkintä }}
    *   {{ Poista merkinnät }}
# {$count} is the number of selected entries
delete_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Poista valittu merkintä }}
    *   {{ Poista valitut merkinnät }}
confirm_deleting_this_entry: Haluatko varmasti poistaa tämän merkinnän?
confirm_deleting_this_entry_with_assets: Haluatko varmasti poistaa tämän merkinnän ja siihen liittyvät assetit?
# Error notification shown when an entry could not be deleted
deleting_entry_failed: Merkinnän poistaminen epäonnistui. Yritä uudelleen.
# {$count} is the number of selected entries
confirm_deleting_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Haluatko varmasti poistaa valitun merkinnän? }}
    *   {{ Haluatko varmasti poistaa valitut {$count} merkintää? }}
# {$count} is the number of selected entries whose associated assets would also be removed
confirm_deleting_selected_entries_with_assets: |
  .input {$count :integer}
  .match $count
    one {{ Haluatko varmasti poistaa valitun merkinnän ja siihen liittyvät assetit? }}
    *   {{ Haluatko varmasti poistaa valitut {$count} merkintää ja niihin liittyvät assetit? }}
confirm_deleting_all_entries: Haluatko varmasti poistaa kaikki merkinnät?
confirm_deleting_all_entries_with_assets: Haluatko varmasti poistaa kaikki merkinnät ja niihin liittyvät assetit?
# Note added to the confirmation when other entries reference the entries being deleted through
# Relation fields; the references are removed in the same commit. {$count} is the number of
# referencing entries
deleting_referenced_entries_note: |
  .input {$count :integer}
  .match $count
    one {{ Myös viittaus siihen toisessa merkinnässä poistetaan. }}
    *   {{ Myös viittaukset siihen {$count} muussa merkinnässä poistetaan. }}
# Shown in place of the confirmation when removing the references would leave a Relation field in
# another entry invalid, e.g. a required field with nothing selected, so the deletion is refused.
# The fields are listed below the message, each with the validation error it would have. {$count}
# is the number of entries being deleted
cannot_delete_referenced_entries: |
  .input {$count :integer}
  .match $count
    one {{ Tätä merkintää ei voi poistaa, koska seuraavat muiden merkintöjen kentät eivät olisi enää kelvollisia ilman sitä. Päivitä nämä merkinnät ensin. }}
    *   {{ Näitä merkintöjä ei voi poistaa, koska seuraavat muiden merkintöjen kentät eivät olisi enää kelvollisia ilman niitä. Päivitä nämä merkinnät ensin. }}

