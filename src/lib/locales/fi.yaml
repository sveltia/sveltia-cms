      waiting_for_sign_in: Odottaa ensimmäistä kirjautumista
      disabled: Poistettu käytöstä
    # {$name} is the user’s name
    show_options_for_x: Näytä käyttäjän {$name} asetukset
    options: Käyttäjän asetukset
    reset_password: Nollaa salasana
    sign_out_everywhere: Kirjaa ulos kaikkialta
