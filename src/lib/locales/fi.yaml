global_assets: Yleiset assetit

# ==============================================================================
# Entry and Collection Actions
# ==============================================================================
# Strings related to creating, editing, and managing entries and collections.

# Error message when entry cannot be found
entry_not_found: Merkintää ei löytynyt.

# Entry creation restrictions: tooltip and advisory messages
creating_entries_disabled_by_admin: Ylläpitäjä on poistanut käytöstä uusien merkintöjen luomisen tähän kokoelmaan.
# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: Et voi lisätä uusia merkintöjä tähän kokoelmaan, koska sen enimmäismäärä {$quota} merkintää on saavutettu.
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$remaining :integer}
  .match $remaining
    one {{ Tämä kokoelma lähestyy enimmäismääräänsä {$quota} merkintää. Voit luoda vielä {$remaining} merkinnän. }}
    *   {{ Tämä kokoelma lähestyy enimmäismääräänsä {$quota} merkintää. Voit luoda vielä {$remaining} merkintää. }}

# Navigation: back links and list labels
back_to_collection: Takaisin kokoelmaan
collection_list: Kokoelmalistaus
back_to_collection_list: Takaisin kokoelmalistaukseen
asset_folder_list: Assettikansiolistaus
back_to_asset_folder_list: Takaisin assettikansiolistaukseen

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: Hakutulokset
# {$terms} is the current search query text
search_results_for_x: Hakutulokset haulle ”{$terms}”

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Katselet nyt hakutuloksia haulle ”{$terms}”. Merkintöjä ei löytynyt. }}
    one {{ Katselet nyt hakutuloksia haulle ”{$terms}”. Löysimme yhden merkinnän. }}
    *   {{ Katselet nyt hakutuloksia haulle ”{$terms}”. Löysimme {$count} merkintää. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Katselet nyt hakutuloksia haulle ”{$terms}”. Assetteja ei löytynyt. }}
    one {{ Katselet nyt hakutuloksia haulle ”{$terms}”. Löysimme yhden assetin. }}
    *   {{ Katselet nyt hakutuloksia haulle ”{$terms}”. Löysimme {$count} assettia. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ Ei merkintöjä }}
    one {{ {$count} merkintä }}
    *   {{ {$count} merkintää }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ Ei assetteja }}
    one {{ {$count} assetti }}
    *   {{ {$count} assettia }}

# Empty state messages
no_files_found: Tiedostoja ei löytynyt.
no_entries_found: Merkintöjä ei löytynyt.

