# ==============================================================================
# Content and Asset Libraries
# ==============================================================================
# Strings used in the main content and asset management interfaces, including
# lists, navigation, and collection/folder views.

# Page container aria-labels
content_library: Sisältökirjasto
asset_library: Assettikirjasto

# Primary sidebar section headings and list aria-labels
collections: Kokoelmat
entries: Merkinnät
files: Tiedostot

# Asset location selector: option group labels
asset_location:
  # Assets stored in the site’s Git repository
  repository: Sivustosi
  external: Ulkoiset sijainnit
  stock_photos: Kuvapankit

# Sidebar and list labels
# Collection assets panel aria-label
collection_assets: Kokoelman assetit
# List aria-labels for different list types
entry_list: Merkintälistaus
file_list: Tiedostolistaus
asset_list: Assettilistaus

# Collection and folder page titles
# Used as aria-labels on page containers
# {$collection} is the current collection label
x_collection: ”{$collection}”-kokoelma
# {$folder} is the current asset folder label
x_asset_folder: ”{$folder}”-assettikansio

# Navigation announcements (ARIA live regions)
# Announce page changes for screen reader users
viewing_collection_list: Katselet nyt kokoelmalistausta.
viewing_asset_folder_list: Katselet nyt assettikansiolistausta.
# Collection view announcements with entry counts
# {$collection} is the collection label and {$count} is the number of entries in it
viewing_x_collection: |
  .input {$count :integer}
  .match $count
    0   {{ Katselet nyt kokoelmaa ”{$collection}”, jossa ei ole vielä merkintöjä. }}
    one {{ Katselet nyt kokoelmaa ”{$collection}”, jossa on yksi merkintä. }}
    *   {{ Katselet nyt kokoelmaa ”{$collection}”, jossa on {$count} merkintää. }}
# Asset folder view announcements with asset counts
# {$folder} is the folder label and {$count} is the number of assets in it
viewing_x_asset_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Katselet nyt assettikansiota ”{$folder}”, jossa ei vielä ole assetteja. }}
    one {{ Katselet nyt assettikansiota ”{$folder}”, jossa on yksi assetti. }}
    *   {{ Katselet nyt assettikansiota ”{$folder}”, jossa on {$count} assettia. }}

# Singleton file selection announcement
# {$file} is the singleton file name
singleton_selected_announcement: Paina Enter muokataksesi tiedostoa ”{$file}”.

# Error messages: collection or file not found
collection_not_found: Kokoelmaa ei löytynyt.
file_not_found: Tiedostoa ei löytynyt.

# Selection count indicator
# Shown in the toolbar when items are selected (e.g., “2 of 10 selected”)
# {$selected} is the selected item count and {$total} is the total item count
x_of_x_selected: '{$selected}/{$total} valittu'

# View switcher: toggle between list and grid views
switch_view: Vaihda näkymää
list_view: Listausnäkymä
grid_view: Ruudukkonäkymä
switch_to_list_view: Vaihda listausnäkymään
switch_to_grid_view: Vaihda ruudukkonäkymään

