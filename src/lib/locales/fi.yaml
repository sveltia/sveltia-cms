# ==============================================================================
# File Upload and Processing
# ==============================================================================
# Strings for file upload dialogs, progress indicators, and validation.

# Processing indicator shown during file preparation
# {$count} is the number of files currently being processed
processing_files: |
  .input {$count :integer}
  .match $count
    one {{ Käsitellään tiedostoa. Tämä voi kestää hetken. }}
    *   {{ Käsitellään tiedostoja. Tämä voi kestää hetken. }}

# Uploading section aria-label
uploading_files: Lähetetään tiedostoja

# Replace file confirmation
# Dialog body when replacing an existing file
# {$name} is the existing file name that will be replaced
confirm_replacing_file: '”{$name}” korvataan tällä tiedostolla:'

# Upload confirmation with destination folder
# {$folder} is the destination folder label and {$count} is the number of files being uploaded
confirm_uploading_files: |
  .input {$count :integer}
  .match $count
    one {{ Tämä tiedosto tallennetaan kansioon ”{$folder}”: }}
    *   {{ Nämä {$count} tiedostoa tallennetaan kansioon ”{$folder}”: }}

# File size validation
# Warning section for files exceeding size limits
oversized_files: Ylikokoiset tiedostot
# {$size} is the maximum allowed file size and {$count} is the number of oversized files
warning_oversized_files: |
  .input {$count :integer}
  .match $count
    one {{ Tätä tiedostoa ei voi lähettää, koska se ylittää enimmäiskoon {$size}. Pienennä tiedoston kokoa tai valitse toinen tiedosto. }}
    *   {{ Näitä tiedostoja ei voi lähettää, koska ne ylittävät enimmäiskoon {$size}. Pienennä tiedostojen kokoa tai valitse toiset tiedostot. }}

# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: Virheelliset tiedostot
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    one {{ Tätä tiedostoa ei voi lähettää, koska se on vioittunut tai sen sisältö ei vastaa tiedostopäätettä. Näin käy usein, kun valokuva on nimetty uudelleen muuntamisen sijaan, esimerkiksi HEIC-kuva on tallennettu JPEG-tiedostona. Muunna tiedosto ja yritä uudelleen. }}
    *   {{ Näitä tiedostoja ei voi lähettää, koska ne ovat vioittuneet tai niiden sisältö ei vastaa tiedostopäätteitä. Näin käy usein, kun valokuvia on nimetty uudelleen muuntamisen sijaan, esimerkiksi HEIC-kuvia on tallennettu JPEG-tiedostoina. Muunna tiedostot ja yritä uudelleen. }}

# File format validation when replacing an asset
# Warning section for replacement files that are in a different format
mismatched_files: Erimuotoiset tiedostot
# {$name} is the name of the asset being replaced and {$count} is the number of mismatched files
warning_mismatched_files: |
  .input {$count :integer}
  .match $count
    one {{ Tämä tiedosto ei voi korvata assettia ”{$name}”, koska se on eri muodossa. Muunna tiedosto samaan muotoon ja yritä uudelleen. }}
    *   {{ Nämä tiedostot eivät voi korvata assettia ”{$name}”, koska ne ovat eri muodossa. Muunna tiedostot samaan muotoon ja yritä uudelleen. }}

# File name conflict resolution
# {$count} is the number of conflicting file names in the target folder
file_name_conflict_confirmation: |
  .input {$count :integer}
  .match $count
    one {{ Samanniminen tiedosto on jo olemassa tässä kansiossa. Haluatko korvata sen? }}
    *   {{ {$count} samannimistä tiedostoa on jo olemassa tässä kansiossa. Haluatko korvata ne? }}
# {$name} is the conflicting file name when there is exactly one conflict; {$count} is the total conflict count
file_name_conflict_confirmation_with_name: |
  .input {$count :integer}
  .input {$name :string}
  .match $count
    one {{ Tiedosto nimeltä ”{$name}” on jo olemassa tässä kansiossa. Haluatko korvata sen? }}
    *   {{ {$count} samannimistä tiedostoa on jo olemassa tässä kansiossa. Haluatko korvata ne? }}
file_name_conflict_resolution: Tiedostonimien ristiriidan ratkaisu
# Option to keep both files (rename the new one)
