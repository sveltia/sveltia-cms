    title: Suuri tiedosto

  # Invalid file warning dialog
  invalid_file:
    title: Virheellinen tiedosto

  # Warning dialog shown when files are rejected for more than one reason
  rejected_files:
    title: Tiedostoja ei voi lähettää

  # Photo credit dialog (stock photos)
  photo_credit:
    title: Kuvan lähde
    description: 'Käytä seuraavaa lähdettä mahdollisuuksien mukaan:'

  # Unsaved asset badge
  unsaved: Tallentamaton

# Character counter: shows character count for text fields
character_counter:
  # {$count} is the current character count; {$min} and {$max} are configured limits
  min_max: |
    .input {$count :integer}
    .match $count
      0   {{ Merkkejä ei syötetty. Vähintään: {$min}. Enintään: {$max}. }}
      one {{ {$count} merkki syötetty. Vähintään: {$min}. Enintään: {$max}. }}
      *   {{ {$count} merkkiä syötetty. Vähintään: {$min}. Enintään: {$max}. }}
  # {$count} is the current character count and {$min} is the minimum allowed count
  min: |
    .input {$count :integer}
    .match $count
      0   {{ Merkkejä ei syötetty. Vähintään: {$min}. }}
      one {{ {$count} merkki syötetty. Vähintään: {$min}. }}
      *   {{ {$count} merkkiä syötetty. Vähintään: {$min}. }}
  # {$count} is the current character count and {$max} is the maximum allowed count
  max: |
    .input {$count :integer}
    .match $count
      0   {{ Merkkejä ei syötetty. Enintään: {$max}. }}
      one {{ {$count} merkki syötetty. Enintään: {$max}. }}
      *   {{ {$count} merkkiä syötetty. Enintään: {$max}. }}

# YouTube video player iframe title
youtube_video_player: YouTube-videosoitin

# Date/time field: quick action buttons
today: Tänään
now: Nyt

# Rich-text editor: component field labels
editor_components:
  image: Kuva
  src: Lähde
  alt: Vaihtoehtoinen teksti
  title: Otsikko
  link: Linkki

# Key-Value field: column headers and validation
key_value:
  key: Avain
  value: Arvo
  action: Toiminto
  empty_key: Avain vaaditaan.
  duplicate_key: Avaimen on oltava yksilöllinen.

# Map field: location search and geolocation
find_place: Etsi paikka
use_your_location: Käytä sijaintiasi

# Geolocation error dialog
geolocation_error_title: Sijaintivirhe
geolocation_error_body: Sijaintia haettaessa tapahtui virhe.
geolocation_unsupported: Tämä selain ei tue Geolocation-rajapintaa.

# Boolean field: display labels
