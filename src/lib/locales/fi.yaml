  .input {$count :integer}
  .match $count
    one {{ Kohde liitetty, mutta sen käyttämää tiedostoa ei löytynyt. Tarkista kohteen tiedostokentät. }}
    *   {{ Kohde liitetty, mutta {$count} sen käyttämää tiedostoa ei löytynyt. Tarkista kohteen tiedostokentät. }}

# Variable-type list selector
select_list_type: Valitse luettelotyyppi

# Variable-type mismatch
