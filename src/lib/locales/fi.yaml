global_assets: Yleiset assetit
# Virtual location listing the files that File/Image fields link to by URL, wherever they are hosted
linked_files: Linkitetyt tiedostot
# Badge and message shown on a linked file that couldn’t be loaded, e.g. because it has been deleted
file_unavailable: Ei saatavilla
file_unavailable_description: Tätä tiedostoa ei voitu ladata. Se on ehkä siirretty tai poistettu.

# ==============================================================================
# Entry and Collection Actions
# ==============================================================================
# Strings related to creating, editing, and managing entries and collections.

# Message shown while entries are still being retrieved: in the entry editor, when it was opened
# with a direct link before all the data has been loaded, and on the Editorial Workflow page while
# the pull requests are being fetched. {$count} selects the form
loading_entries: |
  .input {$count :integer}
  .match $count
    one {{ Ladataan merkintää… }}
    *   {{ Ladataan merkintöjä… }}
# Error message when entry cannot be found
entry_not_found: Merkintää ei löytynyt.

# Entry creation restrictions: tooltip and advisory messages
creating_entries_disabled_by_admin: Ylläpitäjä on poistanut käytöstä uusien merkintöjen luomisen tähän kokoelmaan.
# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: |
  .input {$quota :integer}
  .match $quota
    one {{ Et voi lisätä uusia merkintöjä tähän kokoelmaan, koska sen enimmäismäärä {$quota} merkintä on saavutettu. }}
    *   {{ Et voi lisätä uusia merkintöjä tähän kokoelmaan, koska sen enimmäismäärä {$quota} merkintää on saavutettu. }}
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$quota :integer}
  .input {$remaining :integer}
  .match $quota $remaining
    one one {{ Tämä kokoelma lähestyy enimmäismääräänsä {$quota} merkintä. Voit luoda vielä {$remaining} merkinnän. }}
    one *   {{ Tämä kokoelma lähestyy enimmäismääräänsä {$quota} merkintä. Voit luoda vielä {$remaining} merkintää. }}
    *   one {{ Tämä kokoelma lähestyy enimmäismääräänsä {$quota} merkintää. Voit luoda vielä {$remaining} merkinnän. }}
    *   *   {{ Tämä kokoelma lähestyy enimmäismääräänsä {$quota} merkintää. Voit luoda vielä {$remaining} merkintää. }}

# Read-only restrictions set with the `readonly` option: advisory messages
readonly_cms: CMS on vain luku -tilassa. Voit katsella sisältöä ja assetteja, mutta et voi tehdä muutoksia.
readonly_collection: Tämä kokoelma on vain luku -tilassa. Voit katsella sen sisältöä, mutta et voi tehdä muutoksia.
readonly_entry: Tämä merkintä on vain luku -tilassa. Voit katsella sitä, mutta et voi tehdä muutoksia.
readonly_asset_folder: Tämä kansio on vain luku -tilassa. Voit katsella sen assetteja, mutta et voi tehdä muutoksia.
readonly_branch: Sinulla ei ole oikeutta pushata haaraan ”{$branch}”. Voit katsella tätä sisältöä, mutta et voi tehdä muutoksia.
readonly_role: Sinulla on vain katseluoikeus. Voit katsella sisältöä ja assetteja, mutta et voi tehdä muutoksia.
readonly_reference: Merkintä on vain luku -tilassa, joten viittausta ei voi poistaa.
# {$entries} is a comma-separated list of entries, each shown as “Collection › Entry”
cannot_rename_referenced_entry: 'Tätä merkintää ei voi nimetä uudelleen, koska seuraavat vain luku -tilassa olevat merkinnät viittaavat siihen sen nykyisellä nimellä: {$entries}.'
# {$entries} is a comma-separated list of entries, each shown as “Collection › Entry”
cannot_move_referenced_asset: 'Tätä assettia ei voi siirtää tai nimetä uudelleen, koska seuraavat vain luku -tilassa olevat merkinnät käyttävät sitä: {$entries}.'

# Navigation: back links and list labels
back_to_collection: Takaisin kokoelmaan
collection_list: Kokoelmalistaus
back_to_collection_list: Takaisin kokoelmalistaukseen
asset_folder_list: Assettikansiolistaus
back_to_asset_folder_list: Takaisin assettikansiolistaukseen
# Back button shown in place of the one above while browsing a subfolder of an asset folder
back_to_parent_folder: Takaisin yläkansioon

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: Hakutulokset
# {$terms} is the current search query text
search_results_for_x: Hakutulokset haulle ”{$terms}”

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Katselet nyt hakutuloksia haulle ”{$terms}”. Merkintöjä ei löytynyt. }}
    one {{ Katselet nyt hakutuloksia haulle ”{$terms}”. Löysimme yhden merkinnän. }}
    *   {{ Katselet nyt hakutuloksia haulle ”{$terms}”. Löysimme {$count} merkintää. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Katselet nyt hakutuloksia haulle ”{$terms}”. Assetteja ei löytynyt. }}
    one {{ Katselet nyt hakutuloksia haulle ”{$terms}”. Löysimme yhden assetin. }}
    *   {{ Katselet nyt hakutuloksia haulle ”{$terms}”. Löysimme {$count} assettia. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ Ei merkintöjä }}
    one {{ {$count} merkintä }}
    *   {{ {$count} merkintää }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ Ei assetteja }}
    one {{ {$count} assetti }}
    *   {{ {$count} assettia }}

# Empty state messages
no_files_found: Tiedostoja ei löytynyt.
no_entries_found: Merkintöjä ei löytynyt.

# ==============================================================================
# Asset Management
# ==============================================================================
# Strings for uploading, editing, and managing assets (images, documents, etc.).

# Upload dialog: title and button label
upload_assets: Lähetä uusia assetteja

# New Folder button and dialog in the Asset Library
new_folder: Uusi kansio
new_folder_name: Kansion nimi
new_folder_create: Luo
# {$folder} is the path of the folder the new one will be created in, starting with a slash
new_folder_description: Uusi kansio luodaan kansioon ”{$folder}”.
# Validation errors for the new folder name
new_folder_error:
  empty: Kansion nimi ei voi olla tyhjä.
  invalid: Kansion nimi ei voi sisältää kauttaviivoja eikä alkaa pisteellä.
  # A name the CMS itself is usually served from, e.g. `admin` or `cms`
  reserved: Tämännimisen kansion tiedostot ovat vain luku -tilassa, koska itse CMS tarjoillaan yleensä siitä.
  duplicate: Tässä on jo samanniminen kansio tai tiedosto.
# Progress and error messages while the folder is being created
creating_folder: Luodaan kansiota…
creating_folder_failed: Kansion luominen epäonnistui.

# Menu on a folder in the Asset Library, and the Rename Folder and Delete Folder dialogs
folder_options: Kansion asetukset
show_folder_options: Näytä kansion asetukset
rename_folder: Nimeä kansio uudelleen
delete_folder: Poista kansio
# Rename Folder dialog body text
# {$count} is the number of assets in the folder, which are moved along with it
enter_new_name_for_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Anna uusi nimi alla. }}
    one {{ Anna uusi nimi alla. Kansiossa oleva assetti siirretään sen mukana, ja sitä käyttävät merkinnät päivitetään. }}
    *   {{ Anna uusi nimi alla. Kansiossa olevat {$count} assettia siirretään sen mukana, ja niitä käyttävät merkinnät päivitetään. }}
# Delete Folder confirmation
# {$name} is the folder name and {$count} is the number of assets in the folder
confirm_deleting_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Haluatko varmasti poistaa tyhjän kansion ”{$name}”? }}
    one {{ Haluatko varmasti poistaa kansion ”{$name}” ja siinä olevan assetin? }}
    *   {{ Haluatko varmasti poistaa kansion ”{$name}” ja siinä olevat {$count} assettia? }}
# Progress and error messages while the folder is being renamed or deleted
renaming_folder: Nimetään kansiota uudelleen…
renaming_folder_failed: Kansion uudelleennimeäminen epäonnistui.
deleting_folder: Poistetaan kansiota…
deleting_folder_failed: Kansion poistaminen epäonnistui.
# Asset Library and asset picker: notice shown when a cloud storage service holds more files than
# are listed at once
external_assets_truncated: Palvelussa on liian monta tiedostoa kaikkien listaamiseen, joten osa niistä jätetään pois.

# Edit options menu: button and item labels
edit_options: Muokkausasetukset
show_edit_options: Näytä muokkausasetukset
# Copy menu aria-label
copy_options: Kopiointiasetukset
# Edit menu items with specific asset names
edit_asset: Muokkaa assettia
# {$name} is the selected asset name
edit_x: 'Muokkaa: {$name}'

# Asset text editor: switch for line wrapping
wrap_long_lines: Rivitä pitkät rivit

# Move assets: dialog for moving assets to another folder in the repository
move: Siirrä
move_asset: Siirrä assetti
# Dialog title. {$name} is the asset name when a single asset is moved, and {$count} is the number of
# assets being moved
move_assets_title: |
  .input {$count :integer}
  .match $count
    one {{ Siirrä {$name} }}
    *   {{ Siirrä {$count} assettia }}
# Dialog body text. {$count} is the number of entries that currently use the assets
select_asset_move_destination: |
  .input {$count :integer}
  .match $count
    0   {{ Valitse kansio, johon siirretään. }}
    one {{ Valitse kansio, johon siirretään. Myös assetteja käyttävä merkintä päivitetään. }}
    *   {{ Valitse kansio, johon siirretään. Myös {$count} assetteja käyttävää merkintää päivitetään. }}
# Accessible label of the folder tree in the Move dialog
asset_move_destination: Kohdekansio
# Shown when the assets being moved are all in the selected folder already
assets_already_in_folder: |
  .input {$count :integer}
  .match $count
    one {{ Assetti on jo tässä kansiossa. }}
    *   {{ Assetit ovat jo tässä kansiossa. }}
# Shown when files with the same names exist in the selected folder. {$names} is a comma-separated
# list of file names
asset_move_conflict: 'Seuraavat tiedostot ovat jo tässä kansiossa: {$names}.'
moving_assets: Siirretään assetteja…
moving_assets_failed: Assettien siirtäminen epäonnistui.
# Warning shown when files have been moved off a cloud storage service, but the originals couldn’t
# be deleted from it
asset_move_cleanup_failed: Tiedostot on siirretty, mutta alkuperäisiä ei voitu poistaa tallennuspalvelusta.
# Shown when files on a cloud storage service can’t be renamed or moved, because the entries using
# them can’t be updated, e.g. for an Open Authoring contributor. {$count} is the number of files
cannot_change_used_external_files: |
  .input {$count :integer}
  .match $count
    one {{ Tätä tiedostoa ei voi nimetä uudelleen tai siirtää, koska sitä käyttäviä merkintöjä ei voi päivittää. }}
    *   {{ Näitä tiedostoja ei voi nimetä uudelleen tai siirtää, koska niitä käyttäviä merkintöjä ei voi päivittää. }}

# Rename asset: dialog and validation
rename_asset: Nimeä assetti uudelleen
# {$name} is the current asset name
rename_x: 'Nimeä uudelleen: {$name}'
# Dialog body text indicating how many entries reference this asset
# {$count} is the number of entries that currently reference the asset
enter_new_name_for_asset: |
  .input {$count :integer}
  .match $count
    0   {{ Anna uusi nimi alla. }}
    one {{ Anna uusi nimi alla. Myös asettia käyttävä merkintä päivitetään. }}
    *   {{ Anna uusi nimi alla. Myös {$count} assettia käyttävää merkintää päivitetään. }}
# Validation errors for asset renaming
enter_new_name_for_asset_error:
  empty: Tiedostonimi ei voi olla tyhjä.
  character: Tiedostonimi ei voi sisältää erikoismerkkejä.
  duplicate: Tämä nimi on käytössä toisella assetilla.
  # A name starting with a dot hides the file, which the CMS wouldn’t list any more
  leading_dot: Tiedostonimi ei voi alkaa pisteellä.
  # The name of a file next to the asset that isn’t an asset, like an entry file
  file_duplicate: Tässä on jo toinen samanniminen tiedosto.
  # The name of a folder next to the file
  folder_duplicate: Tässä on jo samanniminen kansio.
# Shown while renaming a file whose name will be changed on saving, e.g. by the `slugify_filename`
# media library option
file_will_be_saved_as: Tiedosto tallennetaan nimellä ”{$name}”.
# Confirmation dialog shown when the file extension is changed while renaming an asset
change_file_extension: Vaihda tiedostopääte
# {$oldExtension} and {$newExtension} are file extensions without a leading dot, e.g. png
confirm_file_extension_change:
  change: Haluatko varmasti vaihtaa tiedostopäätteen ”.{$oldExtension}” päätteeksi ”.{$newExtension}”?
  add: Haluatko varmasti lisätä tiedostopäätteen ”.{$newExtension}”?
  remove: Haluatko varmasti poistaa tiedostopäätteen ”.{$oldExtension}”?
file_extension_change_warning: Tiedostoa ei välttämättä näytetä tai käsitellä oikein, jos pääte ei vastaa tiedoston todellista muotoa.

# Replace asset: menu item and dialog title
replace_asset: Korvaa assetti
# {$name} is the asset being replaced
replace_x: 'Korvaa: {$name}'
# File/Image field: labels of the Replace and Remove buttons
replace_file: Korvaa tiedosto
replace_image: Korvaa kuva
remove_file: Poista tiedosto
remove_image: Poista kuva

# File selection prompts: drop zones and file pickers
# Browse prompt shown when drag-and-drop is unavailable on desktop and pointer devices
click_to_browse: Napsauta selataksesi…
# Browse prompt shown on touch devices
tap_to_browse: Napauta selataksesi…
# Drop zone text with browse button
# {$count} is the number of files expected by the current picker mode
drop_files_or_click_to_browse: |
