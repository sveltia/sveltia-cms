viewing_x_asset_details: Katselet assetin ”{$name}” tietoja.

# Asset editor container aria-label
asset_editor: Assetin muokkain

# Buttons to move between the listed assets in the asset editor
previous_asset: Edellinen assetti
next_asset: Seuraava assetti

# Preview unavailable message
preview_unavailable: Esikatselu ei ole käytettävissä.

# Copy menu items: public URLs, file paths, file data
# {$count} is the number of selected assets
public_urls: |
  .input {$count :integer}
  .match $count
    one {{ Julkinen URL-osoite }}
    *   {{ Julkiset URL-osoitteet }}
# {$count} is the number of selected assets
file_paths: |
  .input {$count :integer}
  .match $count
    one {{ Tiedostopolku }}
    *   {{ Tiedostopolut }}
# Identifier of a file on a cloud storage service, e.g. an object key or a UUID
# {$count} is the number of selected assets
file_ids: |
  .input {$count :integer}
  .match $count
    one {{ Tiedoston tunniste }}
    *   {{ Tiedostojen tunnisteet }}
file_data: Tiedoston data

# ==============================================================================
# Asset Info Panel
# ==============================================================================
# Section headings and labels in the asset information panel.

# Panel title and empty state shown in the asset sidebar
asset_info: Assetin tiedot
select_asset_show_info: Valitse assetti nähdäksesi sen tiedot.

kind: Tyyppi
size: Koko
dimensions: Mitat
duration: Kesto
# Short heading for a list of entries using the selected asset
used_in: Käytössä
created_date: Luontipäivä
location: Sijainti

# Map aria-label showing GPS coordinates
