publishing_changes_failed: Muutosten julkaiseminen epäonnistui. Yritä uudelleen.

# Notifications: button aria-labels and section headings
show_notifications: Näytä ilmoitukset
notifications: Ilmoitukset

# Account menu: button aria-labels and section headings
show_account_menu: Näytä tilivalikko
