    disable: Poista käyttäjä käytöstä
    delete: Poista käyttäjä
    # {$name} is the user’s name
    reset_password_confirmation: Annetaanko käyttäjälle {$name} uusi väliaikainen salasana? Hänet kirjataan ulos kaikkialta, ja hänen on valittava uusi salasana seuraavalla kirjautumiskerralla.
