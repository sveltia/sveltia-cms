      # Erase All Data button
      all_data:
        description: Poista kaikki, mitä CMS säilyttää tässä selaimessa, mukaan lukien välimuistiin tallennetut tiedostot, tallentamattomat luonnokset ja asetukset. Tämä ei vaikuta repositorioosi jo tallennettuihin tietoihin.
        button_label: Poista kaikki tiedot
        confirmation: Kaikki tähän selaimeen tallennetut tiedot poistetaan, mukaan lukien välimuistiin tallennettu tiedostosisältö, kuvien pikkukuvat, tallentamattomat luonnokset, asetukset ja kirjautumistila. Tämä ei vaikuta repositorioosi, mutta kaikki tallentamattomat muutokset menetetään, ja sinun on kirjauduttava uudelleen sisään. CMS ladataan uudelleen, kun toiminto on valmis.

