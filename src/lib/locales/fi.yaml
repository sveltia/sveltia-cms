visit_live_site: Käy sivustolla
# Page switcher button group aria-label for switching between main sections
switch_page: Vaihda sivua

# Search input placeholders
search_placeholder_contents: Hae sisältöä…
search_placeholder_assets: Hae assetteja…
search_placeholder_all: Hae sisältöä ja assetteja…

# Create button: aria-label for the create menu in the toolbar
create_entry_or_assets: Luo merkintä tai assetteja

# Publishing actions: button labels and progress indicators
publish_changes: Julkaise muutokset
publishing_changes: Julkaistaan muutoksia…
