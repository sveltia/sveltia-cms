    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: Asetus `{$option}` sisältää templaattitagin `{$tag}`, jota ei tueta siinä. Vain slug-templaattitageja, kuten `\{\{slug\}\}` ja `\{\{year\}\}`, sekä tageja `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` ja `\{\{public_folder\}\}` voi käyttää.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
