switching_language: Vaihdetaan kieleen {$locale}…
locale_load_failed: Käännöstä kielelle {$locale} ei voitu ladata. Yritä myöhemmin uudelleen.

# Site and page navigation
# Toolbar button aria-label for visiting the live site
visit_live_site: Käy sivustolla
# Page switcher button group aria-label for switching between main sections
switch_page: Vaihda sivua

# Search input placeholders
search_placeholder_contents: Hae sisältöä…
search_placeholder_assets: Hae assetteja…
search_placeholder_all: Hae sisältöä ja assetteja…

# Create button: aria-label for the create menu in the toolbar
create_entry_or_assets: Luo merkintä tai assetteja

# Publishing actions: button labels and progress indicators
publish_changes: Julkaise muutokset
publishing_changes: Julkaistaan muutoksia…
# Error notification when publishing fails
publishing_changes_failed: Muutosten julkaiseminen epäonnistui. Yritä uudelleen.

# Notifications: button aria-labels and section headings
show_notifications: Näytä ilmoitukset
notifications: Ilmoitukset

# Account menu: button aria-labels and section headings
show_account_menu: Näytä tilivalikko
# Account section heading in the account menu and mobile menu page
account: Tili

# Account menu items: links to external resources
live_site: Julkaistu sivusto
git_repository: Git-repositorio
settings: Asetukset

# Help menu: button aria-labels and section headings
show_help_menu: Näytä ohjevalikko
# Help section heading in dropdowns and mobile menu
help: Ohje

# Help menu items: documentation and support resources
keyboard_shortcuts: Pikanäppäimet
documentation: Dokumentaatio
release_notes: Julkaisutiedot
announcements: Tiedotteet
# Version badge aria-label in the release notes menu item
