# ==============================================================================
# Controls for List and Object field types.

# List item actions
remove_this_item: Poista tämä kohde
move_up: Siirrä ylös
move_down: Siirrä alas
# aria-label for the drag handle that reorders a list item. The item can be dragged with a pointer,
# or moved with the arrow keys while the handle has focus
reorder_item: Järjestä kohde uudelleen
# aria-label for the text input holding one item of a simple List field, which has no subfield to
# take a label from
list_item_value: Kohteen arvo

# Add item button label
# Example: “Add Image”, “Add Author”
# {$name} is the label of the item type that can be added
add_x: Lisää {$name}

# List item context menu
add_item_above: Lisää kohde yläpuolelle
add_item_below: Lisää kohde alapuolelle

# Variable-type list selector
select_list_type: Valitse luettelotyyppi

# Variable-type mismatch
unknown_variable_type: Tätä kohdetta ei voi näyttää tuntemattoman tyypin vuoksi. Katso lisätietoja selaimen konsolista.

