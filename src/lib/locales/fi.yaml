# Read https://github.com/sveltia/sveltia-cms/blob/main/src/lib/locales/README.md
# for instructions on how to add new languages or update existing translations.

# ==============================================================================
# Common Actions
# ==============================================================================
# Generic action button labels used throughout the application. These are
# reusable strings for common operations like save, delete, cancel, etc.

# Primary actions: creation, selection, and file operations
create: Luo
select: Valitse
select_all: Valitse kaikki
# Accessible name of the checkbox that selects a single entry or asset in a list
select_item: Valitse {$name}
upload: Lähetä
copy: Kopioi
download: Lataa
duplicate: Monista
delete: Poista
reorder: Järjestä uudelleen

# Dialog and form actions: confirmation and cancellation
cancel: Peruuta
done: Valmis
save: Tallenna
# Progress indicator shown on the save button while a save operation is in progress
saving: Tallennetaan…

# Publishing actions: used when committing changes to the repository
publish: Julkaise
# Progress indicator shown on the publish button during publishing
publishing: Julkaistaan…

# Modification actions: editing and updating content
rename: Nimeä uudelleen
update: Päivitä
replace: Korvaa

# List and collection actions: adding and removing items
add: Lisää
remove: Poista
clear: Tyhjennä

# Expansion and collapse actions: used for accordions, trees, and expandable sections
expand: Näytä
expand_all: Näytä kaikki
collapse: Piilota
collapse_all: Piilota kaikki

# Content manipulation: inserting, restoring, and discarding
insert: Lisää
restore: Palauta
discard: Hylkää

# ==============================================================================
# Common UI Elements
# ==============================================================================
# Reusable labels and messages for common interface elements like status
# indicators, loading states, and toolbar regions.

# Status messages: search and results indicators
# Shown in ARIA live regions during search operations
searching: Haetaan…
no_results: Tuloksia ei löytynyt.

# Toolbar region labels: used as aria-labels for different toolbar areas
# These help screen readers identify which toolbar is being navigated
global: Yleinen
primary: Ensisijainen
secondary: Toissijainen
collection: Kokoelma
folder: Kansio
# Label of the subfolder list in the asset picker
folders: Kansiot
# Menu in a breadcrumb holding the folders that don’t fit
more_folders: Lisää kansioita

# ==============================================================================
# Miscellaneous Labels
# ==============================================================================
# Various labels used across the application for specific UI elements
# that don’t fit into other categories.

# Field and input labels
api_key: API-avain
details: Tiedot
back: Takaisin
# Reusable label for an option whose value is determined automatically, e.g. the UI language
automatic: Automaattinen
# Loading indicator shown during async operations (asset preview, panels, etc.)
loading: Ladataan…
# Dismiss button for temporary notifications and infobars
later: Myöhemmin

# Entry and collection labels
# Slug field heading in entry editors
slug: Slug
# Fallback labels for singleton collections when names aren’t configured
singleton: Singleton
singletons: Singletonit

# Error messages
# Toast notification when clipboard operations fail
clipboard_error: Leikepöydälle kopiointi epäonnistui.

# ==============================================================================
# Sign-In Page
# ==============================================================================
# Strings specific to the authentication and sign-in page, including welcome
# messages, loading states, OAuth flows, and repository access options.

# Welcome and branding
# Screen reader announcement when the sign-in page loads
# {$name} is the app title shown on the sign-in screen, Sveltia CMS by default
welcome_message: Tervetuloa käyttämään {$name} -palvelua
# Footer text with CMS branding
# {$name} is the CMS brand name shown in the footer, Sveltia CMS by default
powered_by: Palvelun tarjoaa {$name}

# Shown during initial configuration and data loading
unsupported_browser_error: Selaintasi ei tueta. Päivitä se uusimpaan versioon tai käytä toista selainta.
loading_cms_config: Ladataan CMS-asetuksia…
loading_site_data: Ladataan sivuston tietoja…
loading_site_data_error: Sivuston tietojen lataamisessa tapahtui virhe.

# OAuth and token authentication
# Primary sign-in button label for OAuth providers (GitHub, GitLab, etc.)
# {$service} is the sign-in provider label, such as GitHub or GitLab
sign_in_with_x: Kirjaudu sisään palvelulla {$service}

# Access token dialog: alternative authentication method
sign_in_using_access_token: Kirjaudu sisään access tokenilla
sign_in_using_access_token_description: Anna access tokenisi. Sillä on oltava luku- ja kirjoitusoikeus repositorion sisältöön.
# Shown after the description above when Editorial Workflow is enabled, which opens and merges pull requests
sign_in_using_access_token_workflow_note: Koska editoinnin työnkulku on käytössä, sillä on oltava myös luku- ja kirjoitusoikeus pull requesteihin.
# Inline link text with embedded HTML anchor tag
# {$service} is the provider name whose user settings page contains the token generator, e.g., GitHub or GitLab
sign_in_using_access_token_link: Voit luoda tunnuksen <a>{$service}-palvelun käyttäjäasetuksissa</a>.
# Input field label for personal access token
personal_access_token: Henkilökohtainen access token

# Authentication progress indicators
authorizing: Valtuutetaan…
signing_in: Kirjaudutaan sisään…

# Local and test repository options
# Button label and description for working with a local Git repository
work_with_local_repo: Työskentele paikallisen repositorion kanssa
# {$repo} is the configured repository name shown when it is available
work_with_local_repo_description: Kun sinulta pyydetään, valitse repositorion ”{$repo}” juurikansio.
work_with_local_repo_description_no_repo: Kun sinulta pyydetään, valitse Git-repositoriosi juurikansio.
# Button label for demo/test repository
work_with_test_repo: Työskentele testirepositorion kanssa
# Button label for the test repository when sample content is seeded, e.g. on a demo site
start_demo: Aloita demo
# Shown below the disabled test repository option in a browser that can’t save files to its
# storage, e.g. Safari before version 26
test_repo_unsupported_browser: Selaimesi ei pysty tallentamaan testirepositorion tiedostoja. Päivitä se uusimpaan versioon tai käytä toista selainta.

# Authentication errors
# Error messages shown during sign-in failures
sign_in_error:
  not_project_root: Valittu kansio ei ole repositorion juurikansio. Yritä uudelleen.
  picker_dismissed: Repositorion juurikansiota ei voitu valita. Yritä uudelleen.
  authentication_aborted: Todennus keskeytettiin. Yritä uudelleen.
  invalid_token: Annettu tunnus on virheellinen. Tarkista se ja yritä uudelleen.
  # OAuth and authenticator errors (shown with error codes) — keys are defined in the Sveltia CMS Authenticator library
  UNSUPPORTED_BACKEND: Git-taustajärjestelmääsi ei tueta todentajassa.
  UNSUPPORTED_DOMAIN: Verkkotunnuksesi ei saa käyttää todentajaa.
  MISCONFIGURED_CLIENT: OAuth-sovelluksen client ID:tä tai salaisuutta ei ole määritetty.
  AUTH_CODE_REQUEST_FAILED: Valtuutuskoodin vastaanottaminen epäonnistui. Yritä myöhemmin uudelleen.
  CSRF_DETECTED: Mahdollinen CSRF-hyökkäys havaittu. Todennus keskeytettiin.
  TOKEN_REQUEST_FAILED: Access tokenin pyytäminen epäonnistui. Yritä myöhemmin uudelleen.
  TOKEN_REFRESH_FAILED: Access tokenin päivittäminen epäonnistui. Yritä myöhemmin uudelleen.
  MALFORMED_RESPONSE: Palvelin vastasi virheellisillä tiedoilla. Yritä myöhemmin uudelleen.

# Backend and repository validation errors
# Shown when the configured backend or repository is invalid or inaccessible
# {$name} is the backend display name like Forgejo and {$version} is the minimum supported version
backend_unsupported_version: Taustajärjestelmä {$name} vaatii version {$name} {$version} tai uudemman.
# {$repo} is the repository identifier, typically in owner/repo format
repository_no_access: Sinulla ei ole pääsyä repositorioon ”{$repo}”.
# {$repo} is the repository identifier, typically in owner/repo format
repository_no_write_access: Sinulla ei ole kirjoitusoikeutta repositorioon ”{$repo}”.
repository_not_found: Repositoriota ”{$repo}” ei ole olemassa.
repository_empty: Repositoriolla ”{$repo}” ei ole yhtään haaraa.
# {$repo} is the repository identifier, and {$branch} is the configured branch name
branch_not_found: Repositoriossa ”{$repo}” ei ole haaraa ”{$branch}”.
# {$repo} is the repository identifier, and {$dir} is the configured root directory
root_dir_not_found: Juurihakemistoa ”{$dir}” ei ole repositoriossa ”{$repo}”.

# General errors
# Fallback error dialog title for unexpected errors
unexpected_error: Odottamaton virhe
# Shown in place of the page when an unexpected error stops it from being displayed
# {$message} is the error message
page_crashed: Jokin meni vikaan, eikä tätä sivua voida näyttää. {$message}
# Shown in place of a field editor or preview when an unexpected error stops it from being displayed
# {$message} is the error message
field_crashed: Jokin meni vikaan, eikä tätä kenttää voida näyttää. {$message}
# Button label for displaying a part of the page again after an unexpected error
try_again: Yritä uudelleen
# Button label for reloading the CMS after an unexpected error
reload_cms: Lataa CMS uudelleen

# Entry file parsing errors
# Toast notification when entry files fail to parse on initial load
# {$count} is the number of entry files that failed to parse
entry_parse_errors: |
  .input {$count :integer}
  .match $count
    one {{ Merkintätiedostoa jäsentäessä tapahtui virhe. Tarkista selaimen konsoli saadaksesi lisätietoja. }}
    *   {{ Merkintätiedostoja jäsentäessä tapahtui virheitä. Tarkista selaimen konsoli saadaksesi lisätietoja. }}

# ==============================================================================
# Authentication and Account
# ==============================================================================
# These strings are used for sign-in, account management, and authentication
# flows throughout the application.

# Sign-in page and external assets panel: credential input field aria-labels
username: Käyttäjätunnus
password: Salasana

# Sign-in actions: primary button labels and account menu items
# Used on the sign-in page and in confirmation dialogs for external assets
sign_in: Kirjaudu sisään

# Mobile sign-in feature: dialog title and instructions for QR code authentication
sign_in_with_mobile: Kirjaudu sisään mobiililla
# Instructions shown in the mobile sign-in dialog for passwordless authentication
sign_in_with_mobile_instruction: Skannaa alla oleva QR-koodi puhelimellasi tai tabletillasi kirjautuaksesi sisään ilman salasanaa. Asetuksesi kopioidaan automaattisesti.
# Confirmation dialog shown when the CMS is opened with a sign-in link from the mobile sign-in
# QR code. {$account} is the account name, {$service} is the Git service name, e.g. GitHub
sign_in_with_link: Kirjaudu sisään linkillä
sign_in_with_link_confirmation: Tämä linkki kirjaa sinut sisään käyttäjänä {$account} palveluun {$service} ja kopioi asetukset laitteesta, jolla linkki luotiin. Jatka vain, jos loit linkin itse.

# Sign-in with Sveltia CMS Additions, which manages its own user accounts instead of the Git
# service’s. Don’t localize “Sveltia CMS Additions”
additions:
  username: Käyttäjätunnus
  password: Salasana
  sign_in: Kirjaudu sisään
  new_password_title: Valitse uusi salasana
  new_password_description: Kirjauduit sisään väliaikaisella salasanalla. Valitse uusi salasana jatkaaksesi.
  new_password: Uusi salasana
  password_too_short: Salasana on liian lyhyt. Käytä vähintään 12 merkkiä.
  change_password: Vaihda salasana
  # {$name} is the user’s username, {$role} their role, e.g. Editor
  signed_in_as_x_with_role: 'Kirjautuneena: {$name} ({$role})'
  link_github: Yhdistä GitHub-tili
  link_github_error: GitHub-tilin yhdistäminen epäonnistui
  current_password: Nykyinen salasana
  # {$username} is the username filled in from a magic link emailed to the user
  filled_from_link: Käyttäjätunnus ja salasana täytettiin linkistä. Kirjaudu sisään vain, jos ”{$username}” on käyttäjätunnuksesi.
  change_password_description: Pysyt kirjautuneena tässä, mutta sinut kirjataan ulos muilla laitteillasi.
  password_changed: Salasanasi on vaihdettu.
  # The Account settings panel of a Sveltia CMS Additions user
  account:
    profile: Profiili
    profile_description: Nimesi näkyy muille käyttäjille CMS:ssä, esimerkiksi merkintöjen lukoissa ja kommenteissa, sekä commiteissasi.
    username_description: Käyttäjätunnustasi ei voi vaihtaa.
    email: Sähköposti
    email_description: Sitä käytetään tekemissäsi commiteissa, jotta GitHub voi yhdistää ne tiliisi. Jos sitä ei ole, käytetään paikkamerkkiosoitetta. Vain ylläpitäjä voi muuttaa sitä.
    change_name: Vaihda nimi
    name_changed: Nimesi on vaihdettu.
    password: Salasana
    no_password: Tilisi kirjautuu sisään vain GitHubilla, joten sillä ei ole vaihdettavaa salasanaa. Ylläpitäjä voi antaa sinulle salasanan nollaamalla salasanasi.
  setup:
    use_admin_secret: Käytä ylläpitäjän salaista avainta
