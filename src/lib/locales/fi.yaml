uploading_files_failed: Lähetys epäonnistui.
# Errors shown when a file on a cloud storage service could not be deleted or renamed
deleting_assets_failed: Poistaminen epäonnistui.
renaming_asset_failed: Uudelleennimeäminen epäonnistui.

