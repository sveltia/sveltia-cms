paste_item: Liitä kohde
list_item_copied: Kohde kopioitu.
# ⋮ stands for the icon of the item menu button; keep it, along with the button’s aria-label
no_list_item_to_paste: Liitettävää kopioitua kohdetta ei ole. Kopioidaksesi kohteen avaa sen ⋮ (Kohteen asetukset) -valikko ja valitse Kopioi.
