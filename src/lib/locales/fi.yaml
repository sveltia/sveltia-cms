  ai:
    title: Tekoäly
    api_keys:
      title: Tekoälypalvelujen API-avaimet
      description: Hallitse tekoälypalvelujen API-avaimia.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: '{$service}-API-avain'

  # Accessibility panel
  accessibility:
    title: Saavutettavuus
    underline_links:
      title: Alleviivaa linkit
      description: Näytä alleviivaus linkeille sisällön esikatselussa ja käyttöliittymän teksteissä.
      switch_label: Alleviivaa linkit aina

  # Data Management panel
  data:
    title: Tiedonhallinta
    clear_data:
      title: Tyhjennä tiedot
      # Clear File Cache button
      file_cache:
        description: Poista paikallisesti välimuistiin tallennettu tiedostosisältö ja kuvien pikkukuvat vapauttaaksesi tallennustilaa tai ratkaistaksesi vanhentuneista tiedoista johtuvia ongelmia.
        button_label: Tyhjennä tiedostovälimuisti
        confirmation: Paikallisesti välimuistiin tallennettu tiedostosisältö ja kuvien pikkukuvat poistetaan. Tallentamattomat luonnoksesi ja asetuksesi säilytetään, ja poistetut tiedot ladataan tai luodaan tarvittaessa uudelleen. CMS ladataan uudelleen, kun toiminto on valmis.
      # Erase All Data button
      all_data:
        description: Poista kaikki, mitä CMS säilyttää tässä selaimessa, mukaan lukien välimuistiin tallennetut tiedostot, tallentamattomat luonnokset ja asetukset. Tämä ei vaikuta repositorioosi jo tallennettuihin tietoihin.
        button_label: Poista kaikki tiedot
        confirmation: Kaikki tähän selaimeen tallennetut tiedot poistetaan, mukaan lukien välimuistiin tallennettu tiedostosisältö, kuvien pikkukuvat, tallentamattomat luonnokset, asetukset ja kirjautumistila. Tämä ei vaikuta repositorioosi, mutta kaikki tallentamattomat muutokset menetetään, ja sinun on kirjauduttava uudelleen sisään. CMS ladataan uudelleen, kun toiminto on valmis.

  # Developer panel
  developer:
    title: Kehittäjä
    developer_mode:
      title: Kehittäjätila
      description: Ota käyttöön kehittäjille suunnattuja ominaisuuksia, kuten yksityiskohtaiset konsolilokit ja natiivit kontekstivalikot.
      switch_label: Ota kehittäjätila käyttöön
    local_git:
      title: Git-commitit
      description: Commitoi muutoksesi paikallisen repositoriosi nykyiseen haaraan aina, kun tallennat ne, kuten CMS tekee, kun työskentelet etärepositorion kanssa. Voit sitten tarkistaa ja pushata commitit tavallisilla Git-työkaluillasi.
      switch_label: Commitoi muutokset Gitiin
      checking: Tarkistetaan repositoriota…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Muutokset commitoidaan haaraan {$branch} tekijänä {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Muutoksia ei voi commitoida juuri nyt. {$reason}
    deploy_hook:
      title: Julkaisu-webhook
      description: Anna webhook-URL-osoite, jota kutsutaan, kun käynnistät julkaisun manuaalisesti valitsemalla Julkaise muutokset. Voit jättää tämän tyhjäksi, jos käytät GitHub Actionsia tai GitLab CI/CD:tä.
      # Hook URL input
      url:
        field_label: Hookin URL-osoite
        saved: Hookin URL-osoite tallennettu.
        removed: Hookin URL-osoite poistettu.
      # Authorization header input
      auth:
        field_label: Authorization-otsikko (esim. Bearer <token>) (valinnainen)
        saved: Authorization-otsikko tallennettu.
        removed: Authorization-otsikko poistettu.

