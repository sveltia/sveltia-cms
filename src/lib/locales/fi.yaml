    invalid_publish_mode_stages: Asetuksen `publish_mode` asetuksen `stages` on alettava vaiheella `draft` ja lueteltava vaiheet järjestyksessä `draft`, `pending_review`, `pending_publish` toistamatta yhtään.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: Asetuksessa `i18n.locales` on lueteltava vähintään yksi kieli.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
