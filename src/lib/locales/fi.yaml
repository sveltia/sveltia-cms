    copy_username: Kopioi käyttäjätunnus
    copy_password: Kopioi salasana
    # {$name} is the user’s name
    email_credentials: Lähetä sähköpostilla käyttäjälle {$name}
    # The emails the admin sends from their own email app, with the sign-in details: `new` to a user
    # who has just been added, `reset` to one whose password has been reset. Each line is a string of
    # its own, as line breaks aren’t kept in these files
    credentials_email:
      # {$name} is the user’s name
      greeting: Hei {$name},
      # {$url} is a link to the CMS that fills in the username and the temporary password
      sign_in_link: 'Kirjautumislinkki: {$url}'
      # {$username} is the username
      username: 'Käyttäjätunnus: {$username}'
      # {$password} is the temporary password
      password: 'Väliaikainen salasana: {$password}'
      new:
        # {$app} is the name of the CMS
        subject: Kirjautumistietosi palveluun {$app}
        # {$app} is the name of the CMS
        message: Voit nyt kirjautua sisään palveluun {$app}. Avaa alla oleva linkki, joka täyttää käyttäjätunnuksesi ja väliaikaisen salasanasi, ja valitse oma salasanasi kirjautuessasi sisään.
      reset:
        # {$app} is the name of the CMS
        subject: Salasanasi palveluun {$app} on nollattu
        # {$app} is the name of the CMS
        message: Salasanasi palveluun {$app} on nollattu, ja sinut on kirjattu ulos kaikkialta. Avaa alla oleva linkki, joka täyttää käyttäjätunnuksesi ja väliaikaisen salasanasi, ja valitse uusi salasana kirjautuessasi sisään.
    allowed_domains: Sallitut verkkotunnukset
    allowed_domains_description: Sivustot, jotka voivat käyttää Sveltia CMS Additionsia, yksi isäntänimi riviä kohden. Jokerimerkki (*) vastaa mitä tahansa aliverkkotunnusta, esim. *.example.com. Luettele tarkat isäntänimet aina kun mahdollista. Luettelo koskee vain tätä sivustoa, vaikka sama Sveltia CMS Additions -instanssi palvelisi myös muita sivustoja.
    save_allowed_domains: Tallenna sallitut verkkotunnukset
    allowed_domains_saved: Sallitut verkkotunnukset on tallennettu.
    sign_in_tab: Kirjautuminen
    # {$latest} is the newest version of Sveltia CMS Additions, {$current} the one in use
    update_available: Sveltia CMS Additions {$latest} on saatavilla. Käytössäsi on {$current}.
    release_notes: Julkaisutiedot
    github_username_optional: GitHub-käyttäjätunnus (valinnainen)
    github_username_description: Jos GitHub-käyttäjätunnus on annettu, käyttäjä kirjautuu sisään kyseisellä GitHub-tilillä salasanan sijaan.
    # {$name} is the user’s name
    github_required: '{$name} voi kirjautua sisään vain GitHubilla, joten hänen GitHub-käyttäjätunnustaan ei voi poistaa. Nollaa ensin hänen salasanansa, jotta hänellä on salasana kirjautumista varten.'
    adopt: Ota tili hallintaan
    sign_in:
      github: Salli kirjautuminen GitHubilla
      github_description: Käyttäjät kirjautuvat sisään GitHub-tilillään ja saavat oman GitHub-tunnuksensa, joten heidän muutoksensa commitoidaan heidän nimissään. Ylläpitäjä lisää heidät ensin GitHub-käyttäjätunnuksella, ellei jokin rekisteröitymissääntö koske heitä.
      # Shown when signing in with GitHub is being turned off while {$count} users can only sign in
