sign_in: Kirjaudu sisään

# Mobile sign-in feature: dialog title and instructions for QR code authentication
sign_in_with_mobile: Kirjaudu sisään mobiililla
# Instructions shown in the mobile sign-in dialog for passwordless authentication
sign_in_with_mobile_instruction: Skannaa alla oleva QR-koodi puhelimellasi tai tabletillasi kirjautuaksesi sisään ilman salasanaa. Asetuksesi kopioidaan automaattisesti.

# Account menu: user status and repository mode indicators
# Shown at the top of the account dropdown menu
# {$name} is the signed-in user’s login name
signed_in_as_x: 'Kirjautuneena: {$name}'
working_with_local_repo: Työskennellään paikallisen repositorion kanssa
working_with_test_repo: Työskennellään testirepositorion kanssa

# Account menu: action items for sign-out and app installation
sign_out: Kirjaudu ulos
install_as_app: Asenna sovelluksena

