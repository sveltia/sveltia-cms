ascending_number: '{$label}, pienimmästä suurimpaan'
descending_number: '{$label}, suurimmasta pienimpään'

# Filter menu: button labels and options
filter: Suodata
filtering_options: Suodatusasetukset

# Group menu: button labels and options
group: Ryhmittele
