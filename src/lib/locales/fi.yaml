# Field Widgets
# ==============================================================================
# Strings for specific field widget types.

# Color field: opacity slider
opacity: Opasiteetti

# Select field: empty option placeholder
unselected_option: (Ei valintaa)

# Select Assets dialog
assets_dialog:
  # Dialog titles for different selection modes
  title:
    file: Valitse tiedosto
    image: Valitse kuva

  # Search input labels
  search_for_file: Hae tiedostoja
  search_for_image: Hae kuvia

  # Locations panel aria-label
  locations: Sijainnit

  # Asset folder options
  folder:
    field: Kentän assetit
    entry: Merkinnän assetit
    file: Tiedoston assetit
    collection: Kokoelman assetit
    global: Yleiset assetit

  # Error messages
  error:
    invalid_key: API-avaimesi on virheellinen tai vanhentunut. Tarkista se ja yritä uudelleen.
    search_fetch_failed: Assettien haussa tapahtui virhe. Yritä myöhemmin uudelleen.
    image_fetch_failed: Valitun assetin lataamisessa tapahtui virhe. Yritä myöhemmin uudelleen.

  # Stock photo panels
  available_images: Saatavilla olevat kuvat

  # URL entry option
  enter_url: Anna URL-osoite
