# Character counter: shows character count for text fields
character_counter:
  # {$count} is the current character count; {$min} and {$max} are configured limits
  min_max: |
    .input {$count :integer}
    .match $count
      0   {{ Nebyly zadány žádné znaky. Minimum: {$min}. Maximum: {$max}. }}
      one {{ Zadán {$count} znak. Minimum: {$min}. Maximum: {$max}. }}
      few {{ Zadány {$count} znaky. Minimum: {$min}. Maximum: {$max}. }}
      *   {{ Zadáno {$count} znaků. Minimum: {$min}. Maximum: {$max}. }}
  # {$count} is the current character count and {$min} is the minimum allowed count
  min: |
    .input {$count :integer}
    .match $count
      0   {{ Nebyly zadány žádné znaky. Minimum: {$min}. }}
      one {{ Zadán {$count} znak. Minimum: {$min}. }}
      few {{ Zadány {$count} znaky. Minimum: {$min}. }}
      *   {{ Zadáno {$count} znaků. Minimum: {$min}. }}
  # {$count} is the current character count and {$max} is the maximum allowed count
  max: |
    .input {$count :integer}
    .match $count
      0   {{ Nebyly zadány žádné znaky. Maximum: {$max}. }}
      one {{ Zadán {$count} znak. Maximum: {$max}. }}
      few {{ Zadány {$count} znaky. Maximum: {$max}. }}
      *   {{ Zadáno {$count} znaků. Maximum: {$max}. }}

