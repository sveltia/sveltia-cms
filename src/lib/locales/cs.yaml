# Editor operation feedback
# Translation and copy operation status messages
editor:
  translation:
    none: Není co překládat.
    started: Překládání…
    error: Překlad selhal.
    # {$source} is the source language name and {$count} is the number of translated fields
    complete: |
      .input {$count :integer}
      .match $count
        0   {{ Nebyla přeložena žádná pole z jazyka {$source}. }}
        one {{ Bylo přeloženo pole z jazyka {$source}. }}
        few {{ Byla přeložena {$count} pole z jazyka {$source}. }}
        *   {{ Bylo přeloženo {$count} polí z jazyka {$source}. }}
  copy:
    none: Není co kopírovat.
    # {$source} is the source language name and {$count} is the number of copied fields
    complete: |
      .input {$count :integer}
      .match $count
        0   {{ Nebyla zkopírována žádná pole z jazyka {$source}. }}
        one {{ Bylo zkopírováno pole z jazyka {$source}. }}
        few {{ Byla zkopírována {$count} pole z jazyka {$source}. }}
        *   {{ Bylo zkopírováno {$count} polí z jazyka {$source}. }}

# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: Toto pole je povinné.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: Datum a čas musí být {$min} nebo pozdější.
    date: Datum musí být {$min} nebo pozdější.
    time: Čas musí být {$min} nebo pozdější.
    number: Hodnota musí být větší nebo rovna {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Musíte vybrat alespoň {$min} možnost. }}
        few {{ Musíte vybrat alespoň {$min} možnosti. }}
        *   {{ Musíte vybrat alespoň {$min} možností. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Musíte přidat alespoň {$min} položku. }}
        few {{ Musíte přidat alespoň {$min} položky. }}
        *   {{ Musíte přidat alespoň {$min} položek. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: Datum a čas musí být {$max} nebo dřívější.
    date: Datum musí být {$max} nebo dřívější.
    time: Čas musí být {$max} nebo dřívější.
    number: Hodnota musí být menší nebo rovna {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ Nelze vybrat více než {$max} možnost. }}
        few {{ Nelze vybrat více než {$max} možnosti. }}
        *   {{ Nelze vybrat více než {$max} možností. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ Nelze přidat více než {$max} položku. }}
        few {{ Nelze přidat více než {$max} položky. }}
        *   {{ Nelze přidat více než {$max} položek. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Musíte zadat alespoň {$min} znak. }}
      few {{ Musíte zadat alespoň {$min} znaky. }}
      *   {{ Musíte zadat alespoň {$min} znaků. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ Nelze zadat více než {$max} znak. }}
      few {{ Nelze zadat více než {$max} znaky. }}
      *   {{ Nelze zadat více než {$max} znaků. }}

  # Type validation errors
  type_mismatch:
    number: Zadejte prosím číslo.
    email: Zadejte prosím platnou e-mailovou adresu.
    url: Zadejte prosím platnou URL adresu.

  # Value used for the same field in another entry of the collection
  value_not_unique: Tato hodnota je již použita u jiné položky.
  # Key of a keyed List field item used for another item of the same list
  key_not_unique: Tento klíč je již použit u jiné položky seznamu.
  # Key of a keyed List field item that is a whole number, which doesn’t keep its order in a map
  key_numeric: Klíč nesmí být celé číslo, protože by položky ztratily své pořadí.

  # Custom field validation error
  invalid_value: Neplatná hodnota.
  unexpected_error: Došlo k neočekávané chybě.

# ==============================================================================
# Entry Sidebar
# ==============================================================================
# Panels shown in the entry editor sidebar.

entry_sidebar:
  # Sidebar tab list aria-label
  sidebar_panels: Postranní panely

  # Validation panel: shows field validation errors
  validation:
    title: Validace
    placeholder: Výsledky validace se zobrazí zde.
    no_errors_found: Nebyly nalezeny žádné chyby.
    # Button in the panel header that validates the entry on demand
    validate: Zkontrolovat

  # Slug panel: shows the entry slug and lets the user edit it
  slug:
    title: Slug
    generated_on_save: Slug se vygeneruje z obsahu položky při jejím uložení. Případné datum a čas v něm budou odpovídat okamžiku uložení.
    unavailable: Tato položka nemá slug.

  # History panel: shows entry commit history
  history:
    title: Historie
    fetch_failed: Nepodařilo se načíst historii.
    no_history: Historie nebyla nalezena.

  # Backlinks panel: shows entries referencing this entry
  backlinks:
    title: Zpětné odkazy
    no_entries: Na tuto položku neodkazují žádné jiné položky.

  # Tab label of a panel with a count, e.g. of comments. {$title} is the panel title
  title_with_count: '{$title} ({$count})'

# Status shown next to the Save button while an entry with many new files is being saved
# {$done} and {$total} are the number of files prepared and to prepare, or the number of commits
# made and the estimated number of commits in all
save_progress:
  preparing: 'Příprava souborů: {$done} z {$total}'
  committing: 'Ukládání na GitHub: {$done} z přibližně {$total} commitů'

# Entry save error dialog
saving_entry:
  error:
    title: Chyba
    description: Při ukládání položky došlo k chybě. Zkuste to prosím později.

# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: Položku změnil někdo jiný
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} změnil(a) tuto položku {$date}, poté co jste ji otevřeli.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Tato položka byla v repozitáři změněna poté, co jste ji otevřeli.
  deleted: Tato položka byla z repozitáře smazána poté, co jste ji otevřeli.
  # Follows `modified_by` or `modified`
  overwrite_warning: Pokud nyní uložíte, jejich změny budou ztraceny.
  # Follows `deleted`
  recreate_warning: Pokud nyní uložíte, položka bude vytvořena znovu.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Protože je položka uložena ve stejném souboru jako jiné položky, nelze ji uložit přes provedenou změnu. Zrušte úpravy, poté položku znovu otevřete ze seznamu a proveďte své úpravy.
  # OK button label
  save_anyway: Přesto uložit
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: Během ukládání repozitář aktualizoval někdo jiný. Zkuste to prosím znovu.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Položku uloženou ve stejném souboru změnil někdo jiný. Zkuste to prosím znovu.
  # {$path} is the file path
  array_file_invalid: Soubor {$path} nelze aktualizovat, protože neobsahuje platný seznam položek.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
# repository while the user has it open. The change itself is described with the `save_conflict`
# strings above
remote_change:
  reload_entry: Znovu načíst položku
  # Confirmation shown before reloading when the user has unsaved changes
  confirm_reloading_entry: Opravdu chcete položku znovu načíst? Vaše neuložené změny budou ztraceny.

