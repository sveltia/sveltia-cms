# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ V konfiguraci CMS je chyba. Vyřešte prosím problém a zkuste to znovu. }}
      *   {{ V konfiguraci CMS jsou chyby. Vyřešte prosím problémy a zkuste to znovu. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: kolekce {$collection}
    file: soubor {$file}
    component: komponenta {$component}
    # Don’t localize `{$field}`
    field: pole `{$field}`

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS funguje pouze s adresami URL využívajícími HTTPS nebo localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ URL adresa konfiguračního souboru musí používat protokol HTTPS nebo adresu localhost. }}
        *   {{ URL adresy konfiguračních souborů musí používat protokol HTTPS nebo adresy localhost. }}
    fetch_failed: Konfigurační soubor se nepodařilo načíst.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: HTTP odpověď vrátila stav {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Konfigurační soubor se nepodařilo načíst. Chcete-li zabránit načtení souboru `config.yml`, přidejte <a>`load_config_file: false`</a> do konfiguračního objektu předaného do `CMS.init()`.'
    parse_failed: Konfigurační soubor se nepodařilo zpracovat.
    parse_failed_invalid_object: Konfigurační soubor není platným objektem JavaScriptu.
    parse_failed_unsupported_type: Konfigurační soubor není podporovaným typem souboru. Podporovány jsou pouze formáty YAML, TOML a JSON.
    no_collection: Kolekce nejsou definovány.
    # Don’t localize `hide`
    no_visible_collection: Alespoň jedna kolekce musí být viditelná. Zkontrolujte možnost `hide`.
    missing_backend: Backend není definován.
    missing_backend_name: Název backendu není definován.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Backend {$name} <a>není podporován</a> ve Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Zastaralý backend {$name} <a>není podporován</a> ve Sveltia CMS.
    unsupported_custom_backend: Vlastní backendy <a>nejsou podporovány</a> ve Sveltia CMS.
    unsupported_backend_suggestion: Použijte místo toho jeden z <a>podporovaných backendů</a>.
    missing_repository: Repozitář není definován.
    invalid_repository: Nakonfigurovaný repozitář je neplatný. Musí být ve formátu „vlastník/repozitář“.
    # Don’t localize `api_root`
    missing_api_root: Možnost `api_root` není definována. Pro backend Forgejo je povinná.
    invalid_root_dir: Kořenový adresář je neplatný. Musí to být cesta v rámci repozitáře, bez „..“.
    invalid_root_dir_branch: Kořenový adresář nelze použít v názvech větví režimů publikování `editorial_workflow` a `preview`. Žádná část jeho cesty nesmí začínat tečkou, končit na „.lock“ ani obsahovat mezeru nebo speciální znak, jako je dvojtečka nebo hvězdička.
    path_outside_root_dir: Cesta „{$path}“ vede mimo kořenový adresář, kde CMS nemůže vypisovat soubory.
    oauth_implicit_flow: Nakonfigurovaná metoda ověření (implicit flow) není ve Sveltia CMS podporována. Použijte jinou <a>metodu ověření</a>.
    github_pkce_unsupported: Autorizace PKCE zatím není podporována kvůli omezením služby GitHub. Použijte jinou <a>metodu ověření</a>.
    additions_no_base_url: Možnost `base_url` musí být URL adresa vaší služby Sveltia CMS Additions.
    oauth_no_app_id: ID aplikace OAuth není definováno.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: Možnost `open_authoring` vyžaduje režim publikování `editorial_workflow` nebo `preview`. Podrobnosti najdete v <a>dokumentaci</a>.
    # Don’t localize `auth_methods`
    no_auth_methods: Možnost `auth_methods` musí obsahovat alespoň jednu metodu.
    # Don’t localize `auth_scope`, `repo` and `public_repo`
    auth_scope_no_repo: Možnost `auth_scope` musí obsahovat `repo` nebo `public_repo`.
    missing_media_folder: Složka médií není definována.
    public_folder_relative_path: Nakonfigurovaná veřejná složka je neplatná. Musí se jednat o absolutní cestu začínající znakem „/“.
    public_folder_absolute_url: Absolutní URL adresa pro možnost veřejné složky není ve Sveltia CMS podporována.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: Možnost `{$option}` obsahuje značku šablony `{$tag}`, která zde není podporována. Použít lze pouze značky šablony slugu, jako je `\{\{slug\}\}` a `\{\{year\}\}`, a značky `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` a `\{\{public_folder\}\}`.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: Možnost `{$option}` obsahuje značku šablony `{$tag}`, kterou lze použít pouze v možnosti kolekce, souboru kolekce nebo pole, kde existuje položka, z níž ji lze vyplnit.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: Možnost `sanitize_replacement` je nastavena na `{$replacement}`, ale obsahuje znak, který nelze použít ve slugu, takže jím nemůže nahrazovat jiné znaky.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: Možnost `{$option}` je nastavena na `{$url}`, ale musí to být absolutní URL adresa začínající na `https://` nebo `http://`.
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: Možnost `stages` v `publish_mode` musí začínat fází `draft` a uvádět fáze v pořadí `draft`, `pending_review`, `pending_publish`, bez opakování.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: Možnost `i18n.locales` musí obsahovat alespoň jeden jazyk.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: Možnost `default_locale` je nastavena na `{$locale}`, ale tento jazyk není mezi `locales`.
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: Možnost `initial_locales` obsahuje `{$locale}`, ale tento jazyk není mezi `locales`.
    # Don’t localize `i18n`
    i18n_no_collections: 'Možnost `i18n` je nakonfigurována na nejvyšší úrovni, ale žádná z kolekcí ani samostatných položek nemá možnost `i18n`, takže nelze překládat žádný obsah. Přidejte `i18n: true` do kolekcí a samostatných položek, které chcete překládat.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: Možnost `transformations` obsahuje nepodporovaný klíč `{$key}`. Musí to být `raster_image`, `svg` nebo podporovaný formát rastrového obrázku.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: Možnost `quality` u transformace `{$key}` je neplatná. Musí to být celé číslo od 0 do 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: Možnost `{$prop}` u transformace `{$key}` je neplatná. Musí to být kladné celé číslo.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: Kolekce médií {$count} musí mít možnost `name` definovánu jako neprázdný řetězec.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Název kolekce médií `{$name}` je neplatný. Nesmí obsahovat speciální znaky.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Názvy kolekcí médií musí být unikátní, ale `{$name}` je použit více než jednou.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: Kolekce musí mít definovanou buď možnost `folder`, `file`, `files`, nebo `divider`.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: Kolekce nemůže mít definováno více než jednu z možností `folder`, `file`, `files` a `divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: Přípona `{$extension}` neodpovídá formátu `{$format}`.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: Pole `{$name}` se ukládá jako tělo pod front matter, které může obsahovat pouze text, nikoli číslo, logickou hodnotu, seznam nebo objekt, jako je tomu u pole `{$widget}`. Použijte typ pole, který obsahuje text, nebo pole přejmenujte.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
    # brackets are escaped with backslashes for MessageFormat 2
    invalid_collection_data_file: Možnost `file` s hodnotou `{$file}` je neplatná. Musí to být cesta k souboru JSON bez zástupného symbolu `\{\{locale\}\}`.
    # {$prop} is the option name; Don’t localize `file`
    unsupported_collection_data_file_option: Možnost `{$prop}` není podporována v kolekci s možností `file`.
    # Don’t localize `file`, `publish_mode` and `simple`
    collection_data_file_workflow: Redakční workflow a workflow s náhledy, včetně otevřeného přispívání (Open Authoring), nejsou podporovány v kolekci s možností `file`. Nastavte možnost `publish_mode` kolekce na `simple`.
    # {$prop} is the option name; Don’t localize `file` and `slug`. The curly brackets are escaped
    # with backslashes for MessageFormat 2
    collection_data_file_slug_tag: Možnost `{$prop}` nesmí v kolekci s možností `file` obsahovat značku `\{\{slug\}\}`, protože slug položky je její pozice, která se mění při změně pořadí nebo smazání položek. Použijte místo toho pole s unikátní hodnotou.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Šablona slugu `{$slug}` je neplatná, protože nesmí obsahovat lomítka. Chcete-li organizovat položky do podsložek, použijte volbu `path` namísto `slug`.
    # {$name} is the field name from the configuration; Don’t localize `identifier_field`
    invalid_identifier_field: Možnost `identifier_field` odkazuje na `{$name}`, ale žádné takové pole není v kolekci definováno.
    # {$name} is the field name from the configuration; Don’t localize `filter`
    invalid_filter_field: Možnost `filter` odkazuje na `{$name}`, ale žádné takové pole není v kolekci definováno.
    # Don’t localize `filter`, `value` and `pattern`
    invalid_filter_no_condition: Možnost `filter` musí mít buď možnost `value`, nebo `pattern`, podle které se položky porovnávají.
    # {$option} is an option name such as `slug` or `summary` and {$name} is the field name or template tag from the configuration
    option_field_not_found: Možnost `{$option}` odkazuje na `{$name}`, ale žádné takové pole není definováno.
    # {$name} is the field name from the configuration and {$widget} is its field type; Don’t localize `thumbnail`
    thumbnail_field_not_media: Možnost `thumbnail` odkazuje na `{$name}`, ale musí to být pole Image nebo File, nikoli pole `{$widget}`.
    # Don’t localize `inline` or `multiple`
    invalid_inline_component_fields: Režim `inline` vyžaduje jediné pole typu Boolean, Color, DateTime, Number, Relation, Select nebo String. Pole Relation nebo Select nesmí mít povolenou možnost `multiple`.
    # {$option} is an option name such as `pattern` or `filter` and {$pattern} is the configured pattern
    invalid_regex: Možnost `{$option}` obsahuje neplatný regulární výraz `{$pattern}`, který bude ignorován.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: Volba `reorder` se odkazuje na skupinu zobrazení s názvem `{$name}`, ale žádná taková skupina není definována ve volbě `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit` and `fields`
    invalid_bulk_edit_field: Seznam `fields` v možnosti `bulk_edit` odkazuje na pole s názvem `{$name}`, ale žádné takové pole nejvyšší úrovně není v kolekci definováno.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit`, `fields` and `multiple`
    unsupported_bulk_edit_field: Pole `{$name}` v seznamu `fields` možnosti `bulk_edit` nelze hromadně upravovat. Podporováno je pouze pole typu Boolean, Color, DateTime, Number, Relation, Select nebo String, které není pouze pro čtení, nemá povolenou možnost `multiple` a nenastavuje se automaticky při uložení.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: Volba `sortable_fields` se odkazuje na pole s názvem `{$name}`, ale žádné takové pole v kolekci není definováno.
    # Don’t localize `sortable_fields` and `default_sort`
    multiple_sortable_field_defaults: Možnost `default_sort` může mít pouze jedna položka v možnosti `sortable_fields`.
    # {$option} is `table_columns` or `summary_fields`, and {$name} is the field name from the configuration
    invalid_table_column_field: Možnost `{$option}` odkazuje na pole s názvem `{$name}`, ale žádné takové pole není v kolekci definováno.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: Volba `view_groups` se odkazuje na pole s názvem `{$name}`, ale žádné takové pole v kolekci není definováno.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: Volba `view_filters` se odkazuje na pole s názvem `{$name}`, ale žádné takové pole v kolekci není definováno.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: Skupina zobrazení na pozici {$count} musí mít volbu `name` definovanou jako neprázdný řetězec.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: Název skupiny zobrazení `{$name}` je neplatný. Nesmí obsahovat speciální znaky.
    duplicate_view_group_name: Názvy skupin zobrazení musí být unikátní, ale název `{$name}` je použit vícekrát.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: Filtr zobrazení na pozici {$count} musí mít volbu `name` definovanou jako neprázdný řetězec.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `pattern`, `eq` and `gte`
    invalid_view_filter_no_condition: Filtr zobrazení {$count} musí mít možnost `pattern` nebo možnost porovnání, jako je `eq` nebo `gte`, podle které se položky porovnávají.
    # {$name} is the invalid or duplicate view filter name
    invalid_view_filter_name: Název filtru zobrazení `{$name}` je neplatný. Nesmí obsahovat speciální znaky.
    duplicate_view_filter_name: Názvy filtrů zobrazení musí být unikátní, ale název `{$name}` je použit vícekrát.
    # {$name} is the default view group name from the configuration; Don’t localize `default` and `view_groups`
    invalid_view_group_default: Možnost `default` ve `view_groups` je nastavena na `{$name}`, ale žádná skupina zobrazení nemá tento název.
    # {$name} is the default view filter name from the configuration; Don’t localize `default` and `view_filters`
    invalid_view_filter_default: Možnost `default` ve `view_filters` je nastavena na `{$name}`, ale žádný filtr zobrazení nemá tento název.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: Kolekce {$count} musí mít možnost `name` definovánu jako neprázdný řetězec.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: Název kolekce `{$name}` je neplatný. Nesmí obsahovat speciální znaky.
    duplicate_collection_name: Názvy kolekcí musí být unikátní, ale `{$name}` je použit více než jednou.
    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
    missing_collection_file_name: Soubor kolekce {$count} musí mít možnost `name` definovánu jako neprázdný řetězec.
    # {$name} is the invalid or duplicate collection file name
    invalid_collection_file_name: Název souboru kolekce `{$name}` je neplatný. Nesmí obsahovat speciální znaky.
    duplicate_collection_file_name: Názvy souborů kolekce musí být unikátní, ale `{$name}` je použit více než jednou.
    # Don’t localize `fields`
    collection_no_fields: Kolekce musí mít možnost `fields` definovanou s alespoň jedním polem.
    # Don’t localize `fields`
    collection_file_no_fields: Soubor kolekce musí mít možnost `fields` definovanou s alespoň jedním polem.
    # Don’t localize `i18n`, `locale` and `folder`
    collection_folder_i18n_required: Kolekce musí mít definovanou možnost `i18n`, pokud je v cestě `folder` použit zástupný symbol `locale`.
    # {$folder} is the invalid folder path; Don’t localize `locale`, `folder` and the example path. The
