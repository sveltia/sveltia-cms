    few few {{ Tato kolekce se blíží svému limitu {$quota} položek. Můžete vytvořit již pouze {$remaining} položky. }}
    few *   {{ Tato kolekce se blíží svému limitu {$quota} položek. Můžete vytvořit již pouze {$remaining} položek. }}
    *   one {{ Tato kolekce se blíží svému limitu {$quota} položek. Můžete vytvořit již pouze {$remaining} položku. }}
