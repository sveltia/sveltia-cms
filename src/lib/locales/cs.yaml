  .input {$remaining :integer}
  .match $remaining
    one {{ Tato kolekce se blíží svému limitu {$quota} položek. Můžete vytvořit již pouze {$remaining} položku. }}
    few {{ Tato kolekce se blíží svému limitu {$quota} položek. Můžete vytvořit již pouze {$remaining} položky. }}
    *   {{ Tato kolekce se blíží svému limitu {$quota} položek. Můžete vytvořit již pouze {$remaining} položek. }}

# Navigation: back links and list labels
back_to_collection: Zpět do kolekce
collection_list: Seznam kolekcí
back_to_collection_list: Zpět na seznam kolekcí
asset_folder_list: Seznam složek médií
back_to_asset_folder_list: Zpět na seznam složek médií

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: Výsledky vyhledávání
# {$terms} is the current search query text
search_results_for_x: Výsledky vyhledávání pro „{$terms}“

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Nyní si prohlížíte výsledky vyhledávání pro „{$terms}“. Nebyly nalezeny žádné položky. }}
    one {{ Nyní si prohlížíte výsledky vyhledávání pro „{$terms}“. Byla nalezena jedna položka. }}
    few {{ Nyní si prohlížíte výsledky vyhledávání pro „{$terms}“. Byly nalezeny {$count} položky. }}
    *   {{ Nyní si prohlížíte výsledky vyhledávání pro „{$terms}“. Bylo nalezeno {$count} položek. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Nyní si prohlížíte výsledky vyhledávání pro „{$terms}“. Nebyla nalezena žádná média. }}
    one {{ Nyní si prohlížíte výsledky vyhledávání pro „{$terms}“. Bylo nalezeno jedno médium. }}
    few {{ Nyní si prohlížíte výsledky vyhledávání pro „{$terms}“. Byla nalezena {$count} média. }}
    *   {{ Nyní si prohlížíte výsledky vyhledávání pro „{$terms}“. Bylo nalezeno {$count} médií. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ Žádné položky }}
    one {{ {$count} položka }}
    few {{ {$count} položky }}
    *   {{ {$count} položek }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ Žádná média }}
    one {{ {$count} médium }}
    few {{ {$count} média }}
    *   {{ {$count} médií }}

# Empty state messages
no_files_found: Nebyly nalezeny žádné soubory.
no_entries_found: Nebyly nalezeny žádné položky.

