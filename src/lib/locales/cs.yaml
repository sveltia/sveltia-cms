        button_label: Vymazat mezipaměť souborů
        confirmation: Lokálně uložený obsah souborů a miniatury obrázků z mezipaměti budou smazány. Vaše neuložené koncepty a nastavení zůstanou zachovány a smazaná data se podle potřeby znovu stáhnou nebo vygenerují. Po dokončení bude CMS znovu načteno.
      # Erase All Data button
      all_data:
        description: Smazat vše, co CMS uchovává v tomto prohlížeči, včetně souborů v mezipaměti, neuložených konceptů a nastavení. Nic, co je již uloženo ve vašem repozitáři, nebude ovlivněno.
        button_label: Vymazat všechna data
        confirmation: Všechna data uložená v tomto prohlížeči budou smazána, včetně obsahu souborů v mezipaměti, miniatur obrázků, neuložených konceptů, nastavení a stavu přihlášení. Váš repozitář nebude ovlivněn, ale všechny neuložené změny budou ztraceny a budete se muset znovu přihlásit. Po dokončení bude CMS znovu načteno.

  # Developer panel
  developer:
    title: Pro vývojáře
    developer_mode:
      title: Vývojářský režim
      description: Povolit funkce určené pro vývojáře, včetně podrobných protokolů konzole a nativních kontextových nabídek.
      switch_label: Povolit vývojářský režim
    local_git:
      title: Commity Git
      description: Při každém uložení commitovat vaše změny do aktuální větve lokálního repozitáře, stejně jako to CMS dělá při práci se vzdáleným repozitářem. Commity pak můžete zkontrolovat a pushnout svými obvyklými nástroji Git.
      switch_label: Commitovat změny do Gitu
      checking: Kontrola repozitáře…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Změny budou commitovány do větve {$branch} jako {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Změny nyní nelze commitovat. {$reason}
    deploy_hook:
      title: Webhook pro nasazení (Deploy Hook)
      description: Zadejte URL adresu webhooku, který má být zavolán při ručním spuštění nasazení výběrem možnosti Publikovat změny. Pokud používáte GitHub Actions nebo GitLab CI/CD, můžete pole nechat prázdné.
      # Hook URL input
      url:
        field_label: URL adresa webhooku
        saved: URL adresa webhooku byla uložena.
        removed: URL adresa webhooku byla odebrána.
      # Authorization header input
      auth:
        field_label: Autorizační hlavička (např. Bearer <token>) (volitelné)
        saved: Autorizační hlavička byla uložena.
        removed: Autorizační hlavička byla odebrána.

