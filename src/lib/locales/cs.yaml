# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: Toto pole je povinné.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: Datum a čas musí být {$min} nebo pozdější.
    date: Datum musí být {$min} nebo pozdější.
    time: Čas musí být {$min} nebo pozdější.
    number: Hodnota musí být větší nebo rovna {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Musíte vybrat alespoň {$min} možnost. }}
        few {{ Musíte vybrat alespoň {$min} možnosti. }}
        *   {{ Musíte vybrat alespoň {$min} možností. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Musíte přidat alespoň {$min} položku. }}
        few {{ Musíte přidat alespoň {$min} položky. }}
        *   {{ Musíte přidat alespoň {$min} položek. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: Datum a čas musí být {$max} nebo dřívější.
    date: Datum musí být {$max} nebo dřívější.
    time: Čas musí být {$max} nebo dřívější.
    number: Hodnota musí být menší nebo rovna {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ Nelze vybrat více než {$max} možnost. }}
        few {{ Nelze vybrat více než {$max} možnosti. }}
        *   {{ Nelze vybrat více než {$max} možností. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ Nelze přidat více než {$max} položku. }}
        few {{ Nelze přidat více než {$max} položky. }}
        *   {{ Nelze přidat více než {$max} položek. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Musíte zadat alespoň {$min} znak. }}
      few {{ Musíte zadat alespoň {$min} znaky. }}
      *   {{ Musíte zadat alespoň {$min} znaků. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ Nelze zadat více než {$max} znak. }}
      few {{ Nelze zadat více než {$max} znaky. }}
      *   {{ Nelze zadat více než {$max} znaků. }}

  # Type validation errors
  type_mismatch:
    number: Zadejte prosím číslo.
    email: Zadejte prosím platnou e-mailovou adresu.
    url: Zadejte prosím platnou URL adresu.

  # Custom field validation error
  invalid_value: Neplatná hodnota.
  unexpected_error: Došlo k neočekávané chybě.

