# Toast notification shown when changes saved with the local backend couldn’t be committed to Git
# {$reason} is one of the `local_git_skip_reasons` strings below
local_git_not_committed: Vaše změny byly uloženy, ale nebyly commitnuty do Gitu. {$reason} Chcete-li soubory pouze ukládat, vypněte commity Git v Nastavení > Pro vývojáře.
local_git_skip_reasons:
  unsupported_repository: Váš repozitář používá funkci Gitu, kterou CMS nepodporuje, například propojený pracovní strom (linked worktree), názvy objektů SHA-256, formát reftable, řídký index (sparse index) nebo index ve verzi 3 či 4, který používá volba feature.manyFiles a příkaz git add -N.
  missing_identity: Vaše jméno a e-mailová adresa nejsou nastaveny v konfiguraci Gitu repozitáře a CMS nedokáže přečíst vaši globální konfiguraci. Nastavte je v repozitáři pomocí git config --local user.name "Vaše jméno" a git config --local user.email "vy@example.com".
  locked: Repozitář používá jiný proces Gitu. Pokud žádný neběží, smažte soubor .git/index.lock.
  # The operation in progress, with how to finish or cancel it
  operation_in_progress:
    merge: Probíhá slučování (merge). Dokončete jej pomocí git commit, nebo jej zrušte pomocí git merge --abort.
    rebase: Probíhá rebase. Dokončete jej pomocí git rebase --continue, nebo jej zrušte pomocí git rebase --abort. Pokud jste již pokračovali jinak, git rebase --quit jej ukončí beze změny vašich souborů.
    cherry_pick: Probíhá cherry-pick. Dokončete jej pomocí git cherry-pick --continue, nebo jej zrušte pomocí git cherry-pick --abort.
    revert: Probíhá revert. Dokončete jej pomocí git revert --continue, nebo jej zrušte pomocí git revert --abort.
    am: Probíhá aplikace patchů pomocí git am. Dokončete ji pomocí git am --continue, nebo ji zrušte pomocí git am --abort.
    conflict: Některé soubory obsahují konflikty. Nejprve je vyřešte a výsledky připravte k commitu (stage).
  detached_head: Není aktivní žádná větev.
  staged_changes: Máte jiné změny připravené k commitu. Nejprve je commitněte, nebo je z přípravy odeberte.
  # {$path} is the file path
  lfs: '{$path} je sledován pomocí Git LFS, do kterého CMS nemůže commitovat.'
  # {$message} is the error message
  error: Došlo k neočekávané chybě. {$message}

