  .input {$count :integer}
  .match $count
    0   {{ Nyní si prohlížíte kolekci „{$collection}“, která zatím neobsahuje žádné položky. }}
    one {{ Nyní si prohlížíte kolekci „{$collection}“, která obsahuje jednu položku. }}
    few {{ Nyní si prohlížíte kolekci „{$collection}“, která obsahuje {$count} položky. }}
    *   {{ Nyní si prohlížíte kolekci „{$collection}“, která obsahuje {$count} položek. }}
