# File Upload and Processing
# ==============================================================================
# Strings for file upload dialogs, progress indicators, and validation.

# Processing indicator shown during file preparation
# {$count} is the number of files currently being processed
processing_files: |
  .input {$count :integer}
  .match $count
    one {{ Zpracovává se soubor. To může chvíli trvat. }}
    *   {{ Zpracovávají se soubory. To může chvíli trvat. }}

# Uploading section aria-label
uploading_files: Nahrávání souborů

# Replace file confirmation
# Dialog body when replacing an existing file
# {$name} is the existing file name that will be replaced
confirm_replacing_file: '„{$name}“ bude nahrazen tímto souborem:'

# Upload confirmation with destination folder
# {$folder} is the destination folder label and {$count} is the number of files being uploaded
confirm_uploading_files: |
  .input {$count :integer}
  .match $count
    one {{ Tento soubor bude uložen do složky „{$folder}“: }}
    few {{ Tyto {$count} soubory budou uloženy do složky „{$folder}“: }}
    *   {{ Těchto {$count} souborů bude uloženo do složky „{$folder}“: }}

# File size validation
# Warning section for files exceeding size limits
oversized_files: Příliš velké soubory
# {$size} is the maximum allowed file size and {$count} is the number of oversized files
warning_oversized_files: |
  .input {$count :integer}
  .match $count
    one {{ Tento soubor nelze nahrát, protože překračuje maximální velikost {$size}. Zmenšete jeho velikost nebo vyberte jiný soubor. }}
    *   {{ Tyto soubory nelze nahrát, protože překračují maximální velikost {$size}. Zmenšete jejich velikost nebo vyberte jiné soubory. }}

# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: Neplatné soubory
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    one  {{ Tento soubor nelze nahrát, protože je poškozený, nebo jeho obsah neodpovídá příponě. K tomu často dochází, když je fotografie pouze přejmenována namísto konverze (např. HEIC obrázek uložen jako JPEG). Převeďte soubor a zkuste to znovu. }}
    *    {{ Tyto soubory nelze nahrát, protože jsou poškozené, nebo jejich obsah neodpovídá příponě. K tomu často dochází, když jsou fotografie pouze přejmenovány namísto konverze (např. HEIC obrázky uloženy jako JPEG). Převeďte soubory a zkuste to znovu. }}
# {$count} is the number of files that are not of a type the field accepts, even once transformed
# {$types} is the list of accepted file types, such as “.pdf or .txt”
warning_unsupported_files: |
  .input {$count :integer}
  .match $count
    one {{ Tento soubor nelze nahrát, protože nepatří mezi následující typy: {$types}. }}
    *   {{ Tyto soubory nelze nahrát, protože nepatří mezi následující typy: {$types}. }}
# {$count} is the number of files that are not of an image type the field accepts
# {$types} is the list of accepted image formats, such as “PNG or WebP”
warning_unsupported_image_files: |
  .input {$count :integer}
  .match $count
    one {{ Tento soubor nelze nahrát, protože jsou přijímány pouze obrázky následujících typů: {$types}. }}
    *   {{ Tyto soubory nelze nahrát, protože jsou přijímány pouze obrázky následujících typů: {$types}. }}

# File format validation when replacing an asset
# Warning section for replacement files that are in a different format
mismatched_files: Soubory s odlišným formátem
# {$name} is the name of the asset being replaced and {$count} is the number of mismatched files
warning_mismatched_files: |
  .input {$count :integer}
  .match $count
    one {{ Tento soubor nemůže nahradit „{$name}“, protože má jiný formát. Převeďte soubor do stejného formátu a zkuste to znovu. }}
    *   {{ Tyto soubory nemohou nahradit „{$name}“, protože mají jiný formát. Převeďte soubory do stejného formátu a zkuste to znovu. }}

# File name conflict resolution
# {$count} is the number of conflicting file names in the target folder
file_name_conflict_confirmation: |
  .input {$count :integer}
  .match $count
    one {{ Soubor se stejným názvem již v této složce existuje. Chcete jej nahradit? }}
    few {{ V této složce již existují {$count} soubory se stejným názvem. Chcete je nahradit? }}
    *   {{ V této složce již existuje {$count} souborů se stejným názvem. Chcete je nahradit? }}
# {$name} is the conflicting file name when there is exactly one conflict; {$count} is the total conflict count
file_name_conflict_confirmation_with_name: |
  .input {$count :integer}
  .input {$name :string}
  .match $count
    one {{ Soubor s názvem „{$name}“ již v této složce existuje. Chcete jej nahradit? }}
    few {{ V této složce již existují {$count} soubory se stejným názvem. Chcete je nahradit? }}
    *   {{ V této složce již existuje {$count} souborů se stejným názvem. Chcete je nahradit? }}
file_name_conflict_resolution: Řešení konfliktu názvů souborů
