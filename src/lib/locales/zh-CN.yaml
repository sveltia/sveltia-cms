    light: 浅色

  # Language panel
  language:
    title: 语言
    ui_language:
      title: 界面语言
      select_language: 选择语言

  # Contents panel
  contents:
    title: 内容
    editor:
      title: 编辑器
      use_draft_backup:
        switch_label: 自动备份条目草稿
      close_on_save:
        switch_label: 保存草稿后关闭编辑器
      close_with_escape:
        switch_label: 按 Escape 键关闭编辑器

  # Internationalization panel
  i18n:
    title: 国际化
    translators:
      default:
        title: 默认翻译服务
        select_service: 选择服务
      api_keys:
        title: 翻译服务 API 密钥
        description: 管理<a>翻译服务</a>的 API 密钥。通用 AI 服务的 API 密钥可在 AI 设置中管理。
      # API key input label, e.g., “DeepL Key”
