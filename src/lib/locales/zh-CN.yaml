    global_folder_template_tag: '`{$option}` 选项包含模板标签 `{$tag}`，该标签只能用于集合、集合文件或字段的选项中，因为只有在那里才有可供填充的条目。'
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: '`sanitize_replacement` 选项设置为 `{$replacement}`，但其中包含不能用于别名的字符，因此无法用作替换字符。'
