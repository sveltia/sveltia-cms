  # Data Management panel
  data:
    title: 数据管理
    clear_data:
      title: 清除数据
      # Clear File Cache button
      file_cache:
        description: 删除本地缓存的文件内容和图片缩略图，以释放存储空间或解决过期数据导致的问题。
        button_label: 清除文件缓存
        confirmation: 本地缓存的文件内容和图片缩略图将被删除。您未保存的草稿和设置将保留，删除的数据会在需要时重新下载或生成。完成后 CMS 将重新加载。
      # Erase All Data button
      all_data:
        description: 删除 CMS 在此浏览器中保存的所有内容，包括缓存文件、未保存的草稿和设置。已保存到仓库的内容不受影响。
        button_label: 清除所有数据
        confirmation: 此浏览器中存储的所有数据将被删除，包括缓存的文件内容、图片缩略图、未保存的草稿、设置和登录状态。您的仓库不受影响，但任何未保存的更改都将丢失，并且您需要重新登录。完成后 CMS 将重新加载。

  # Developer panel
  developer:
    title: 开发者
    developer_mode:
      title: 开发者模式
      description: 启用一些面向开发者的功能，包括详细的控制台日志和原生上下文菜单。
      switch_label: 启用开发者模式
    local_git:
      title: Git 提交
      description: 每次保存更改时，都将其提交到本地仓库的当前分支，就像使用远程仓库时 CMS 所做的那样。之后您可以使用常用的 Git 工具审查并推送这些提交。
      switch_label: 将更改提交到 Git
      checking: 正在检查仓库……
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: 更改将以 {$name}（{$email}）的身份提交到 {$branch} 分支。
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: 目前无法提交更改。{$reason}
    deploy_hook:
      title: 部署钩子
      description: 输入一个 Webhook URL，在您选择「发布更改」手动触发部署时调用。如果使用 GitHub Actions 或 GitLab CI/CD，可留空。
      # Hook URL input
      url:
        field_label: Hook URL
        saved: Hook URL 已保存。
        removed: Hook URL 已移除。
      # Authorization header input
      auth:
        field_label: Authorization 标头（例如 Bearer &lt;token&gt;）（可选）
        saved: Authorization 标头已保存。
        removed: Authorization 标头已移除。

