# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: Dette feltet er påkrevd.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: Datoen og klokkeslettet må være {$min} eller senere.
    date: Datoen må være {$min} eller senere.
    time: Klokkeslettet må være {$min} eller senere.
    number: Verdien må være større enn eller lik {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Du må velge minst {$min} alternativ. }}
        *   {{ Du må velge minst {$min} alternativer. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Du må legge til minst {$min} element. }}
        *   {{ Du må legge til minst {$min} elementer. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: Datoen og klokkeslettet må være {$max} eller tidligere.
    date: Datoen må være {$max} eller tidligere.
    time: Klokkeslettet må være {$max} eller tidligere.
    number: Verdien må være mindre enn eller lik {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ Du kan ikke velge mer enn {$max} alternativ. }}
        *   {{ Du kan ikke velge mer enn {$max} alternativer. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ Du kan ikke legge til mer enn {$max} element. }}
        *   {{ Du kan ikke legge til mer enn {$max} elementer. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Du må skrive minst {$min} tegn. }}
      *   {{ Du må skrive minst {$min} tegn. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ Du kan ikke skrive mer enn {$max} tegn. }}
      *   {{ Du kan ikke skrive mer enn {$max} tegn. }}

  # Type validation errors
  type_mismatch:
    number: Skriv inn et tall.
    email: Skriv inn en gyldig e-postadresse.
    url: Skriv inn en gyldig URL.

  # Value used for the same field in another entry of the collection
  value_not_unique: Denne verdien brukes allerede av en annen oppføring.
  # Key of a keyed List field item used for another item of the same list
  key_not_unique: Denne nøkkelen brukes allerede av et annet element.
  # Key of a keyed List field item that is a whole number, which doesn’t keep its order in a map
  key_numeric: Nøkkelen kan ikke være et heltall, fordi elementene da ville mistet rekkefølgen sin.

  # Custom field validation error
  invalid_value: Ugyldig verdi.
  unexpected_error: Det oppstod en uventet feil.

