# Strings for uploading, editing, and managing assets (images, documents, etc.).

# Upload dialog: title and button label
upload_assets: Last opp nye mediefiler

# New Folder button and dialog in the Asset Library
new_folder: Ny mappe
new_folder_name: Mappenavn
new_folder_create: Opprett
# {$folder} is the path of the folder the new one will be created in, starting with a slash
new_folder_description: Den nye mappen blir opprettet i «{$folder}».
# Validation errors for the new folder name
new_folder_error:
  empty: Mappenavnet kan ikke være tomt.
  invalid: Mappenavnet kan ikke inneholde skråstreker eller begynne med punktum.
  # A name the CMS itself is usually served from, e.g. `admin` or `cms`
  reserved: Filene i en mappe med dette navnet er skrivebeskyttet, fordi CMS-et selv vanligvis ligger der.
  duplicate: Det finnes allerede en mappe eller fil med dette navnet her.
# Progress and error messages while the folder is being created
creating_folder: Oppretter mappen…
creating_folder_failed: Kunne ikke opprette mappen.

# Menu on a folder in the Asset Library, and the Rename Folder and Delete Folder dialogs
folder_options: Mappevalg
show_folder_options: Vis mappevalg
rename_folder: Gi mappen nytt navn
delete_folder: Slett mappe
# Rename Folder dialog body text
# {$count} is the number of assets in the folder, which are moved along with it
enter_new_name_for_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Skriv inn et nytt navn nedenfor. }}
    one {{ Skriv inn et nytt navn nedenfor. Mediefilen i mappen blir flyttet med, og oppføringer som bruker den, blir oppdatert. }}
    *   {{ Skriv inn et nytt navn nedenfor. De {$count} mediefilene i mappen blir flyttet med, og oppføringer som bruker dem, blir oppdatert. }}
# Delete Folder confirmation
# {$name} is the folder name and {$count} is the number of assets in the folder
confirm_deleting_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Er du sikker på at du vil slette den tomme mappen «{$name}»? }}
    one {{ Er du sikker på at du vil slette mappen «{$name}» og mediefilen i den? }}
    *   {{ Er du sikker på at du vil slette mappen «{$name}» og de {$count} mediefilene i den? }}
# Progress and error messages while the folder is being renamed or deleted
renaming_folder: Gir mappen nytt navn…
renaming_folder_failed: Kunne ikke gi mappen nytt navn.
deleting_folder: Sletter mappen…
deleting_folder_failed: Kunne ikke slette mappen.
# Asset Library and asset picker: notice shown when a cloud storage service holds more files than
# are listed at once
external_assets_truncated: Det er for mange filer på tjenesten til å vise alle, så noen er utelatt.

# Edit options menu: button and item labels
edit_options: Redigeringsvalg
show_edit_options: Vis redigeringsvalg
# Copy menu aria-label
copy_options: Kopieringsvalg
# Edit menu items with specific asset names
edit_asset: Rediger mediefil
# {$name} is the selected asset name
edit_x: Rediger {$name}

# Asset text editor: switch for line wrapping
wrap_long_lines: Bryt lange linjer

# Move assets: dialog for moving assets to another folder in the repository
move: Flytt
move_asset: Flytt mediefil
# Dialog title. {$name} is the asset name when a single asset is moved, and {$count} is the number of
# assets being moved
move_assets_title: |
  .input {$count :integer}
  .match $count
    one {{ Flytt {$name} }}
    *   {{ Flytt {$count} mediefiler }}
# Dialog body text. {$count} is the number of entries that currently use the assets
select_asset_move_destination: |
  .input {$count :integer}
  .match $count
    0   {{ Velg mappen du vil flytte til. }}
    one {{ Velg mappen du vil flytte til. En oppføring som bruker mediefilene, blir også oppdatert. }}
    *   {{ Velg mappen du vil flytte til. {$count} oppføringer som bruker mediefilene, blir også oppdatert. }}
# Accessible label of the folder tree in the Move dialog
asset_move_destination: Målmappe
# Shown when the assets being moved are all in the selected folder already
assets_already_in_folder: |
  .input {$count :integer}
  .match $count
    one {{ Mediefilen ligger allerede i denne mappen. }}
    *   {{ Mediefilene ligger allerede i denne mappen. }}
# Shown when files with the same names exist in the selected folder. {$names} is a comma-separated
# list of file names
asset_move_conflict: 'Disse filene finnes allerede i mappen: {$names}.'
moving_assets: Flytter mediefilene…
moving_assets_failed: Kunne ikke flytte mediefilene.
# Warning shown when files have been moved off a cloud storage service, but the originals couldn’t
# be deleted from it
asset_move_cleanup_failed: Filene er flyttet, men originalene kunne ikke slettes fra lagringstjenesten.
# Shown when files on a cloud storage service can’t be renamed or moved, because the entries using
# them can’t be updated, e.g. for an Open Authoring contributor. {$count} is the number of files
cannot_change_used_external_files: |
  .input {$count :integer}
  .match $count
    one {{ Denne filen kan ikke få nytt navn eller flyttes, fordi oppføringene som bruker den, ikke kan oppdateres. }}
    *   {{ Disse filene kan ikke få nytt navn eller flyttes, fordi oppføringene som bruker dem, ikke kan oppdateres. }}

# Rename asset: dialog and validation
rename_asset: Gi mediefilen nytt navn
# {$name} is the current asset name
rename_x: Gi {$name} nytt navn
# Dialog body text indicating how many entries reference this asset
# {$count} is the number of entries that currently reference the asset
enter_new_name_for_asset: |
  .input {$count :integer}
  .match $count
    0   {{ Skriv inn et nytt navn nedenfor. }}
    one {{ Skriv inn et nytt navn nedenfor. En oppføring som bruker mediefilen, blir også oppdatert. }}
    *   {{ Skriv inn et nytt navn nedenfor. {$count} oppføringer som bruker mediefilen, blir også oppdatert. }}
# Validation errors for asset renaming
enter_new_name_for_asset_error:
  empty: Filnavnet kan ikke være tomt.
  character: Filnavnet kan ikke inneholde spesialtegn.
  duplicate: Dette filnavnet brukes allerede av en annen mediefil.
  # A name starting with a dot hides the file, which the CMS wouldn’t list any more
  leading_dot: Filnavnet kan ikke begynne med punktum.
  # The name of a file next to the asset that isn’t an asset, like an entry file
  file_duplicate: Det finnes allerede en annen fil med dette navnet her.
  # The name of a folder next to the file
  folder_duplicate: Det finnes allerede en mappe med dette navnet her.
# Shown while renaming a file whose name will be changed on saving, e.g. by the `slugify_filename`
# media library option
file_will_be_saved_as: Filen blir lagret som «{$name}».
# Confirmation dialog shown when the file extension is changed while renaming an asset
change_file_extension: Endre filtype
# {$oldExtension} and {$newExtension} are file extensions without a leading dot, e.g. png
confirm_file_extension_change:
  change: Er du sikker på at du vil endre filtypen fra «.{$oldExtension}» til «.{$newExtension}»?
  add: Er du sikker på at du vil legge til filtypen «.{$newExtension}»?
  remove: Er du sikker på at du vil fjerne filtypen «.{$oldExtension}»?
file_extension_change_warning: Filen vises eller håndteres kanskje ikke riktig hvis filtypen ikke stemmer med det faktiske filformatet.

# Replace asset: menu item and dialog title
replace_asset: Erstatt mediefil
# {$name} is the asset being replaced
replace_x: Erstatt {$name}
# File/Image field: labels of the Replace and Remove buttons
replace_file: Erstatt fil
replace_image: Erstatt bilde
remove_file: Fjern fil
remove_image: Fjern bilde

# File selection prompts: drop zones and file pickers
# Browse prompt shown when drag-and-drop is unavailable on desktop and pointer devices
click_to_browse: Klikk for å bla gjennom…
# Browse prompt shown on touch devices
tap_to_browse: Trykk for å bla gjennom…
# Drop zone text with browse button
# {$count} is the number of files expected by the current picker mode
drop_files_or_click_to_browse: |
  .input {$count :integer}
  .match $count
    one {{ Slipp en fil her, eller klikk for å bla gjennom… }}
    *   {{ Slipp filer her, eller klikk for å bla gjennom… }}
# Partial drop zone text (ends with inline button)
# {$count} is the number of files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Slipp en fil her eller }}
    *   {{ Slipp filer her eller }}
# Image-specific drop zone text
# {$count} is the number of image files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_image_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Slipp en bildefil her eller }}
    *   {{ Slipp bildefiler her eller }}

# File picker and clipboard actions used by upload controls
browse: Bla gjennom
# Generic clipboard paste action used by non-image file fields
paste: Lim inn
# Clipboard paste action used by image fields
paste_image: Lim inn bilde

# Clipboard paste errors
no_image_in_clipboard: Fant ikke noe bilde på utklippstavlen.
clipboard_access_denied: Ingen tilgang til utklippstavlen.

# Drag-and-drop overlay text (shown while dragging)
# {$count} is the number of files expected by the current picker mode
drop_files_here: |
  .input {$count :integer}
  .match $count
    one {{ Slipp en fil her }}
    *   {{ Slipp filer her }}

# File type validation errors
unsupported_file_type: Filtypen støttes ikke
# {$type} is the expected asset type label, such as image or document
dropped_file_type_mismatch: 'Filen du dro hit, er ikke av noen av disse typene: {$types}. Prøv igjen.'
dropped_image_type_mismatch: 'Filen du dro hit, støttes ikke. Bare bilder av disse typene godtas: {$types}. Prøv igjen.'

# File chooser button label
# {$count} is the number of files the picker allows the user to choose
choose_files: |
  .input {$count :integer}
  .match $count
    one {{ Velg fil }}
    *   {{ Velg filer }}

# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    one {{ Slett mediefil }}
    *   {{ Slett mediefiler }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Slett valgt mediefil }}
    *   {{ Slett valgte mediefiler }}
confirm_deleting_this_asset: Er du sikker på at du vil slette denne mediefilen?
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Er du sikker på at du vil slette den valgte mediefilen? }}
    *   {{ Er du sikker på at du vil slette de {$count} valgte mediefilene? }}
confirm_deleting_all_assets: Er du sikker på at du vil slette alle mediefilene?
# Note added to the confirmation when entries use the assets being deleted; the references are
# removed in the same commit. {$count} is the number of entries using them
deleting_referenced_assets_note: |
  .input {$count :integer}
  .match $count
    one {{ Referansen til den i en oppføring blir også fjernet. }}
    *   {{ Referansene til den i {$count} oppføringer blir også fjernet. }}
# Shown in place of the confirmation when removing the references would leave a field in an entry
# invalid, e.g. a required Image field with nothing left, so the deletion is refused. The fields are
# listed below the message, each with the validation error it would have. {$count} is the number of
# assets being deleted
cannot_delete_referenced_assets: |
  .input {$count :integer}
  .match $count
    one {{ Denne mediefilen kan ikke slettes, fordi disse feltene i oppføringene som bruker den, ikke lenger ville vært gyldige uten den. Oppdater de oppføringene først. }}
    *   {{ Disse mediefilene kan ikke slettes, fordi disse feltene i oppføringene som bruker dem, ikke lenger ville vært gyldige uten dem. Oppdater de oppføringene først. }}
# Error shown in the asset deletion dialog when the entries using the assets couldn’t be looked up,
# so the deletion can’t go ahead. {$count} is the number of assets being deleted
checking_asset_references_failed: |
  .input {$count :integer}
  .match $count
    one {{ Kunne ikke sjekke hvilke oppføringer som bruker denne mediefilen. Lukk dialogen og prøv igjen. }}
    *   {{ Kunne ikke sjekke hvilke oppføringer som bruker disse mediefilene. Lukk dialogen og prøv igjen. }}

# Delete entries: dialog titles and confirmation messages
# {$count} is the number of entries targeted by the action
delete_entries: |
  .input {$count :integer}
  .match $count
    one {{ Slett oppføring }}
    *   {{ Slett oppføringer }}
# {$count} is the number of selected entries
delete_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Slett valgt oppføring }}
    *   {{ Slett valgte oppføringer }}
confirm_deleting_this_entry: Er du sikker på at du vil slette denne oppføringen?
confirm_deleting_this_entry_with_assets: Er du sikker på at du vil slette denne oppføringen og mediefilene som hører til?
# Error notification shown when an entry could not be deleted
deleting_entry_failed: Kunne ikke slette oppføringen. Prøv igjen.
# {$count} is the number of selected entries
confirm_deleting_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Er du sikker på at du vil slette den valgte oppføringen? }}
    *   {{ Er du sikker på at du vil slette de {$count} valgte oppføringene? }}
# {$count} is the number of selected entries whose associated assets would also be removed
confirm_deleting_selected_entries_with_assets: |
  .input {$count :integer}
  .match $count
    one {{ Er du sikker på at du vil slette den valgte oppføringen og mediefilene som hører til? }}
    *   {{ Er du sikker på at du vil slette de {$count} valgte oppføringene og mediefilene som hører til? }}
confirm_deleting_all_entries: Er du sikker på at du vil slette alle oppføringene?
confirm_deleting_all_entries_with_assets: Er du sikker på at du vil slette alle oppføringene og mediefilene som hører til?
# Note added to the confirmation when other entries reference the entries being deleted through
# Relation fields; the references are removed in the same commit. {$count} is the number of
# referencing entries
deleting_referenced_entries_note: |
  .input {$count :integer}
  .match $count
    one {{ Referansen til den i en annen oppføring blir også fjernet. }}
    *   {{ Referansene til den i {$count} andre oppføringer blir også fjernet. }}
# Shown in place of the confirmation when removing the references would leave a Relation field in
# another entry invalid, e.g. a required field with nothing selected, so the deletion is refused.
# The fields are listed below the message, each with the validation error it would have. {$count}
# is the number of entries being deleted
cannot_delete_referenced_entries: |
  .input {$count :integer}
  .match $count
    one {{ Denne oppføringen kan ikke slettes, fordi disse feltene i andre oppføringer ikke lenger ville vært gyldige uten den. Oppdater de oppføringene først. }}
    *   {{ Disse oppføringene kan ikke slettes, fordi disse feltene i andre oppføringer ikke lenger ville vært gyldige uten dem. Oppdater de oppføringene først. }}

# ==============================================================================
# Entry Reordering
# ==============================================================================
# Strings for manually reordering entries via drag-and-drop.

# Reorder mode: toggle buttons
reorder_entries: Endre rekkefølgen på oppføringene
done_reordering_entries: Ferdig med å endre rekkefølgen
cancel_reordering_entries: Avbryt endring av rekkefølgen

# Reorder error message
saving_reorder_failed: Kunne ikke lagre den nye rekkefølgen. Prøv igjen.

# ==============================================================================
# Bulk Entry Editing
# ==============================================================================
# Strings for editing the fields of many entries at once in a table.

# Bulk edit mode: toggle buttons
bulk_edit_entries: Rediger flere oppføringer samtidig
save_bulk_edits: Lagre endringene
cancel_bulk_edits: Avbryt endringene

# Bulk edit table: column header of the entry titles
bulk_edit_entry: Oppføring

# Bulk edit table: label of the table
bulk_edit_table: Masseredigering

# Bulk edit table: label of a cell input; {$field} is the field label, {$entry} is the entry title
bulk_edit_cell: '{$field} for {$entry}'

# Bulk edit status: number of changed fields
bulk_edit_count: |
  .input {$count :integer}
  .match $count
    0   {{ Ingen endringer }}
    one {{ 1 endring }}
    *   {{ {$count} endringer }}

# Bulk edit error messages
bulk_edit_invalid: Noen av verdiene er ugyldige. Rett de markerte feltene og prøv igjen.
saving_bulk_edits_failed: Kunne ikke lagre endringene. Prøv igjen.

# Bulk edit: confirmation shown when leaving the mode with unsaved changes
discard_bulk_edits_confirm: Vil du forkaste endringene du har gjort i oppføringene?

# ==============================================================================
# File Upload and Processing
# ==============================================================================
# Strings for file upload dialogs, progress indicators, and validation.

# Processing indicator shown during file preparation
# {$count} is the number of files currently being processed
processing_files: |
  .input {$count :integer}
  .match $count
    one {{ Behandler en fil. Dette kan ta litt tid. }}
    *   {{ Behandler filer. Dette kan ta litt tid. }}

# Uploading section aria-label
uploading_files: Laster opp filer

# Replace file confirmation
# Dialog body when replacing an existing file
# {$name} is the existing file name that will be replaced
confirm_replacing_file: '«{$name}» blir erstattet med denne filen:'

# Upload confirmation with destination folder
# {$folder} is the destination folder label and {$count} is the number of files being uploaded
confirm_uploading_files: |
  .input {$count :integer}
  .match $count
    one {{ Denne filen blir lagret i mappen «{$folder}»: }}
    *   {{ Disse {$count} filene blir lagret i mappen «{$folder}»: }}

# File size validation
# Warning section for files exceeding size limits
oversized_files: For store filer
# {$size} is the maximum allowed file size and {$count} is the number of oversized files
warning_oversized_files: |
  .input {$count :integer}
  .match $count
    one {{ Denne filen kan ikke lastes opp, fordi den er større enn maksgrensen på {$size}. Gjør den mindre eller velg en annen fil. }}
    *   {{ Disse filene kan ikke lastes opp, fordi de er større enn maksgrensen på {$size}. Gjør dem mindre eller velg andre filer. }}

# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: Ugyldige filer
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    one {{ Denne filen kan ikke lastes opp, fordi den er skadet, eller fordi innholdet ikke stemmer med filtypen. Dette skjer ofte når et bilde har fått nytt navn i stedet for å bli konvertert, for eksempel et HEIC-bilde lagret som en JPEG-fil. Konverter filen og prøv igjen. }}
    *   {{ Disse filene kan ikke lastes opp, fordi de er skadet, eller fordi innholdet ikke stemmer med filtypene. Dette skjer ofte når bilder har fått nytt navn i stedet for å bli konvertert, for eksempel HEIC-bilder lagret som JPEG-filer. Konverter filene og prøv igjen. }}
# {$count} is the number of files that are not of a type the field accepts, even once transformed
# {$types} is the list of accepted file types, such as “.pdf or .txt”
warning_unsupported_files: |
  .input {$count :integer}
  .match $count
    one {{ Denne filen kan ikke lastes opp, fordi den ikke er av noen av disse typene: {$types}. }}
    *   {{ Disse filene kan ikke lastes opp, fordi de ikke er av noen av disse typene: {$types}. }}
# {$count} is the number of files that are not of an image type the field accepts
# {$types} is the list of accepted image formats, such as “PNG or WebP”
warning_unsupported_image_files: |
  .input {$count :integer}
  .match $count
    one {{ Denne filen kan ikke lastes opp, fordi bare bilder av disse typene godtas: {$types}. }}
    *   {{ Disse filene kan ikke lastes opp, fordi bare bilder av disse typene godtas: {$types}. }}

# File format validation when replacing an asset
# Warning section for replacement files that are in a different format
mismatched_files: Filer med feil format
# {$name} is the name of the asset being replaced and {$count} is the number of mismatched files
warning_mismatched_files: |
  .input {$count :integer}
  .match $count
    one {{ Denne filen kan ikke erstatte «{$name}», fordi den har et annet format. Konverter filen til samme format og prøv igjen. }}
    *   {{ Disse filene kan ikke erstatte «{$name}», fordi de har et annet format. Konverter filene til samme format og prøv igjen. }}

# File name conflict resolution
# {$count} is the number of conflicting file names in the target folder
file_name_conflict_confirmation: |
  .input {$count :integer}
  .match $count
    one {{ Det finnes allerede en fil med samme navn i denne mappen. Vil du erstatte den? }}
    *   {{ Det finnes allerede {$count} filer med samme navn i denne mappen. Vil du erstatte dem? }}
# {$name} is the conflicting file name when there is exactly one conflict; {$count} is the total conflict count
file_name_conflict_confirmation_with_name: |
  .input {$count :integer}
  .input {$name :string}
  .match $count
    one {{ Det finnes allerede en fil som heter «{$name}», i denne mappen. Vil du erstatte den? }}
    *   {{ Det finnes allerede {$count} filer med samme navn i denne mappen. Vil du erstatte dem? }}
file_name_conflict_resolution: Løs navnekonflikt
# Option to keep both files (rename the new one)
keep_both: Behold begge

# Upload progress and error messages
uploading_files_progress: Laster opp…
uploading_files_failed: Opplastingen mislyktes.
# Errors shown when a file on a cloud storage service could not be deleted or renamed
deleting_assets_failed: Slettingen mislyktes.
renaming_asset_failed: Kunne ikke gi nytt navn.
# Error shown when an edited text file in the Asset Library could not be saved
saving_asset_failed: Lagringen mislyktes.

# File metadata display
# Appended when a file was auto-converted (e.g., HEIF to JPEG)
# {$type} is the original file type before conversion
file_meta_converted_from_x: (konvertert fra {$type})

# ==============================================================================
# Entry Management
# ==============================================================================
# Strings for creating and managing entries in collections

# Empty state messages
no_entries_created: Denne samlingen har ingen oppføringer ennå.
# Button to create first entry
create_new_entry: Lag ny oppføring
# “Entry” option label in the create button menu
entry: Oppføring

# Special entry types
# Fallback label for collection index files when no custom label is configured
index_file: Indeksfil

# Empty state for file collections
no_files_in_collection: Det finnes ingen filer i denne samlingen.

# Entry duplication
duplicate_entry: Dupliser oppføring
entry_duplicated: Oppføringen er duplisert som et nytt utkast.

# Validation errors
# Toast shown when entry has validation errors preventing save
# {$count} is the number of fields with validation errors
entry_validation_errors: |
  .input {$count :integer}
  .match $count
    one {{ Ett felt har en feil. Rett den for å lagre oppføringen. }}
    *   {{ {$count} felt har feil. Rett dem for å lagre oppføringen. }}
# Button on the validation error toast that opens the Validation panel listing the errors
show_errors: Vis feil

# ==============================================================================
# Success Notifications
# ==============================================================================
# Toast notifications shown after successful operations.

# Entry operations
# {$count} is the number of entries affected by the operation
entry_saved: |
  .input {$count :integer}
  .match $count
    one {{ Oppføringen er lagret. }}
    *   {{ {$count} oppføringer er lagret. }}
entry_saved_and_published: |
  .input {$count :integer}
  .match $count
    one {{ Oppføringen er lagret og publisert. }}
    *   {{ {$count} oppføringer er lagret og publisert. }}
entries_deleted: |
  .input {$count :integer}
  .match $count
    one {{ Oppføringen er slettet. }}
    *   {{ {$count} oppføringer er slettet. }}

# Asset operations
# {$count} is the number of assets or asset-derived values affected by the operation
assets_saved: |
  .input {$count :integer}
  .match $count
    one {{ Mediefilen er lagret. }}
    *   {{ {$count} mediefiler er lagret. }}
assets_saved_and_published: |
  .input {$count :integer}
  .match $count
    one {{ Mediefilen er lagret og publisert. }}
    *   {{ {$count} mediefiler er lagret og publisert. }}
asset_urls_copied: |
  .input {$count :integer}
  .match $count
    one {{ URL-en er kopiert til utklippstavlen. }}
    *   {{ {$count} URL-er er kopiert til utklippstavlen. }}
asset_paths_copied: |
  .input {$count :integer}
  .match $count
    one {{ Filbanen er kopiert til utklippstavlen. }}
    *   {{ {$count} filbaner er kopiert til utklippstavlen. }}
asset_ids_copied: |
  .input {$count :integer}
  .match $count
