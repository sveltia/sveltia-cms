  min_max: |
    .input {$count :integer}
    .match $count
      0   {{ Ingen tegn skrevet. Minst {$min}. Høyst {$max}. }}
      one {{ {$count} tegn skrevet. Minst {$min}. Høyst {$max}. }}
      *   {{ {$count} tegn skrevet. Minst {$min}. Høyst {$max}. }}
  # {$count} is the current character count and {$min} is the minimum allowed count
  min: |
    .input {$count :integer}
    .match $count
      0   {{ Ingen tegn skrevet. Minst {$min}. }}
      one {{ {$count} tegn skrevet. Minst {$min}. }}
      *   {{ {$count} tegn skrevet. Minst {$min}. }}
  # {$count} is the current character count and {$max} is the maximum allowed count
  max: |
    .input {$count :integer}
    .match $count
      0   {{ Ingen tegn skrevet. Høyst {$max}. }}
      one {{ {$count} tegn skrevet. Høyst {$max}. }}
      *   {{ {$count} tegn skrevet. Høyst {$max}. }}

