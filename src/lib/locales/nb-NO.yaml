    # {$count} is the 1-based variable type index in the current types array
    missing_variable_type: Type nr. {$count} i `types` må ha alternativet `name`, og det kan ikke være tomt.
    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: Navnet `{$name}` på typen er ugyldig. Det kan ikke inneholde spesialtegn.
