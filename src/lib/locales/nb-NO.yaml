# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: Oppføringen er endret av noen andre
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} endret denne oppføringen {$date}, etter at du åpnet den.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Denne oppføringen er endret i repositoriet etter at du åpnet den.
  deleted: Denne oppføringen er slettet fra repositoriet etter at du åpnet den.
  # Follows `modified_by` or `modified`
  overwrite_warning: Hvis du lagrer nå, går endringene deres tapt.
  # Follows `deleted`
  recreate_warning: Hvis du lagrer nå, blir oppføringen opprettet på nytt.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Siden oppføringen ligger i samme fil som andre oppføringer, kan den ikke lagres over endringen. Avbryt redigeringen, åpne oppføringen på nytt fra listen og gjør endringene dine.
  # OK button label
  save_anyway: Lagre likevel
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: Repositoriet ble oppdatert av noen andre mens du lagret. Prøv igjen.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: En oppføring i samme fil er endret av noen andre. Prøv igjen.
  # {$path} is the file path
  array_file_invalid: Filen {$path} kan ikke oppdateres, fordi den ikke inneholder en gyldig liste over oppføringer.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
# repository while the user has it open. The change itself is described with the `save_conflict`
