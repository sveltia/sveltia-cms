  edit_conflict: «{$name}» er endret av noen andre siden du redigerte den. Åpne den på nytt fra feltet for å sammenligne endringene dine med den nyeste versjonen.
  # Error shown when saving, if someone else has deleted an entry edited from the field since.
  # {$name} is the summary of that entry
  edit_deleted: «{$name}» er slettet av noen andre siden du redigerte den. Fjern den fra feltet for å lagre oppføringen.
  # Accessible label of the menu listing the selected entries that can be edited
  select_entry_to_edit: Velg en oppføring å redigere
  # Warning shown in the editor of an entry that has been edited from a Relation field of another
  # entry, while the changes wait in that entry’s pull request. {$name} is the summary of that
  # entry
  edited_with_entry: Endringer i denne oppføringen venter på å bli publisert sammen med «{$name}». Hvis du lagrer den nå, blir de to settene med endringer slått sammen når den oppføringen publiseres. Det kan mislykkes hvis de overlapper.
  # Warning shown in the dialog when an entry edited from the field has been changed by someone else
  # since. {$name} is the singular label of the collection
  changed_since_edit: Denne oppføringen ({$name}) er endret av noen andre siden du redigerte den. Endringene dine vises oppå den nyeste versjonen. Se over dem før du oppdaterer.

