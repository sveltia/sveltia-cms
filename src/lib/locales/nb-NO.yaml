    # {$name} is the user’s name
    github_required: '{$name} kan bare logge inn med GitHub, så GitHub-brukernavnet kan ikke fjernes. Tilbakestill passordet først for å gi personen et passord å logge inn med.'
    adopt: Overta konto
    sign_in:
