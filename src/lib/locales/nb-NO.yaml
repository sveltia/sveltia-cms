  # Shown when the build failed, so no preview is available. The failure may lie in the site’s own
  # code rather than the entry, so the editor is told not to assume it’s theirs, and who to ask
  build_failed: Forhåndsvisningen kunne ikke lages. Det er ikke nødvendigvis endringene dine som er årsaken. Hvis problemet vedvarer, kan du kontakte administratoren for nettstedet.
  # Shown briefly while the CI/CD provider is being queried
  checking: Ser etter forhåndsvisning…
  # Menu item to query the CI/CD provider again, offered once the automatic checks gave up
  check_again: Se etter forhåndsvisning
