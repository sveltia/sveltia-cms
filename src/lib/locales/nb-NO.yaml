    invalid_range_options: Alternativet `{$min}` kan ikke være større enn alternativet `{$max}`.
    # {$step} is the configured value; Don’t localize `step`
    invalid_step: Alternativet `step` er satt til `{$step}`, men det må være større enn null, eller `-1` for å slå av trinn.
    # Don’t localize `options`
    select_field_no_options: Select-feltet må ha minst ett element i alternativet `options`.
    # {$value} is the option value from the configuration; Don’t localize `options`
    select_field_duplicate_option: Verdiene i `options` for Select-feltet må være unike, men `{$value}` brukes mer enn én gang.
    # {$value} is the default value from the configuration; Don’t localize `default` and `options`
    select_field_invalid_default: Alternativet `default` for Select-feltet er satt til `{$value}`, men det er ikke en av verdiene i `options`.
    # Don’t localize `fields` and `types`
    list_field_no_subfields: Alternativet `fields` eller `types` for List-feltet må ha minst ett element. Utelat alternativet for en liste med enkle verdier.
    # Don’t localize `default`, `fields` and `types`
    list_field_invalid_default_object: Alternativet `default` for List-feltet inneholder et objekt, men hvert element må være en enkel verdi, fordi feltet ikke har `fields` eller `types`.
    # {$value} is the default item from the configuration; Don’t localize `default`, `fields` and `types`
    list_field_invalid_default_item: Alternativet `default` for List-feltet inneholder `{$value}`, men hvert element må være et objekt, fordi feltet har `fields` eller `types`.
    # {$key} is a property name of the default item from the configuration; Don’t localize `default`
    list_field_invalid_default_key: Alternativet `default` for List-feltet inneholder et element med egenskapen `{$key}`, men ingen underfelt har det navnet.
    # {$typeKey} is the configured type key, `type` by default; Don’t localize `default` and `types`
    list_field_default_missing_type: Alternativet `default` for List-feltet inneholder et element uten egenskapen `{$typeKey}`, som angir en av typene i `types`.
    # {$typeKey} is the configured type key, `type` by default, and {$value} is its value in the default item; Don’t localize `default` and `types`
    list_field_invalid_default_type: Alternativet `default` for List-feltet inneholder et element der egenskapen `{$typeKey}` er `{$value}`, men det er ikke en av typene i `types`.
    # Don’t localize `map_key_field`, `fields` and `types`
    list_field_map_key_no_subfields: Alternativet `map_key_field` for List-feltet krever alternativet `fields` eller `types`, fordi hver nøkkel hentes fra et underfelt.
    # {$name} is the subfield name; Don’t localize `map_key_field`
    list_field_map_key_not_found: Alternativet `map_key_field` for List-feltet viser til `{$name}`, men ingen underfelt har det navnet.
    # {$name} is the subfield name, and {$type} is the variable type name; Don’t localize `map_key_field`
    list_field_map_key_missing_in_type: Alternativet `map_key_field` for List-feltet viser til `{$name}`, men typen `{$type}` har ikke noe underfelt med det navnet.
    # {$name} is the subfield name, and {$widget} is its field type; Don’t localize `map_key_field`
    list_field_map_key_invalid_type: Alternativet `map_key_field` for List-feltet viser til `{$name}`, men det må være et String-, Relation- eller Select-felt, ikke et `{$widget}`-felt.
    # {$name} is the subfield name; Don’t localize `map_key_field` and `multiple`
    list_field_map_key_multiple: Alternativet `map_key_field` for List-feltet viser til `{$name}`, men underfeltet kan ikke ha flere verdier, fordi hvert element trenger én nøkkel. Fjern alternativet `multiple` fra det.
    # {$name} is the subfield name; Don’t localize `map_key_field`
    list_field_map_key_option_not_string: Alternativet `map_key_field` for List-feltet viser til `{$name}`, men valgene i underfeltet må ha tekstverdier, fordi hver nøkkel lagres som tekst.
    # {$name} is the subfield name; Don’t localize `map_key_field` and `required`
    list_field_map_key_not_required: Alternativet `map_key_field` for List-feltet viser til `{$name}`, men underfeltet kan ikke være valgfritt, fordi hvert element trenger en nøkkel. Fjern alternativet `required` fra det.
    # {$name} is the subfield name; Don’t localize `map_key_field`, `i18n: false` and `i18n: duplicate`
    list_field_map_key_not_localized: 'Alternativet `map_key_field` for List-feltet viser til `{$name}`, men underfeltet kan ikke ha `i18n: false`, fordi elementene trenger en nøkkel på hvert språk. Bruk `i18n: duplicate` eller fjern alternativet.'
    # Don’t localize `i18n`, `duplicate_if_empty`, `multiple` and `true`
    duplicate_if_empty_multiple: 'Alternativet `i18n: duplicate_if_empty` er ikke støttet for et felt med alternativet `multiple`, så feltet virker som et med `i18n: true`.'
    # Don’t localize `default` and `multiple`
    invalid_default_multiple: Alternativet `default` må være en matrise, fordi alternativet `multiple` er `true`.
    invalid_default_single: Alternativet `default` må være én enkelt verdi, ikke en matrise, fordi alternativet `multiple` ikke er `true`.
    # {$key} is a property name of the default object from the configuration; Don’t localize `default`
    object_field_invalid_default_key: Alternativet `default` for Object-feltet har egenskapen `{$key}`, men ingen underfelt har det navnet.
    # {$typeKey} is the configured type key, `type` by default; Don’t localize `default` and `types`
    object_field_default_missing_type: Alternativet `default` for Object-feltet mangler egenskapen `{$typeKey}`, som angir en av typene i `types`.
    # {$typeKey} is the configured type key, `type` by default, and {$value} is its value in the default object; Don’t localize `default` and `types`
    object_field_invalid_default_type: Egenskapen `{$typeKey}` i alternativet `default` for Object-feltet er `{$value}`, men det er ikke en av typene i `types`.
    # Don’t localize `default` and `output_code_only`
    code_field_invalid_default_object: Alternativet `default` for Code-feltet må være en tekst, fordi alternativet `output_code_only` er `true`.
    # {$key} is a property name of the default object, {$code} and {$lang} are the configured property names; Don’t localize `default` and `keys`
    code_field_invalid_default_key: Alternativet `default` for Code-feltet har egenskapen `{$key}`, men alternativet `keys` tillater bare `{$code}` og `{$lang}`.
    # {$valueType} is the configured value type; Don’t localize `value` and `value_type`
    compute_field_invalid_expression: Alternativet `value` for Compute-feltet må være et gyldig regneuttrykk, som `\{\{fields.price\}\} * \{\{fields.quantity\}\}`, fordi alternativet `value_type` er `{$valueType}`.
    # {$valueType} is the configured value type; Don’t localize `value` and `value_type`
    compute_field_uuid_in_expression: Alternativet `value` for Compute-feltet kan ikke bruke en UUID-kode som `\{\{uuid\}\}`, fordi alternativet `value_type` er `{$valueType}`, som gjør det til et regneuttrykk.
    # {$value} is the default value and {$valueType} is the configured value type; Don’t localize `default` and `value_type`
    number_field_default_not_integer: Alternativet `default` for Number-feltet er satt til `{$value}`, men det må være et heltall, fordi alternativet `value_type` er `{$valueType}`.
    number_field_default_not_number: Alternativet `default` for Number-feltet er satt til `{$value}`, men det må være et tall, fordi alternativet `value_type` er `{$valueType}`.
    # Don’t localize `fields` and `types`
    object_field_no_subfields: Alternativet `fields` eller `types` for Object-feltet må ha minst ett element.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: Samlingen `{$collection}` som det vises til, er ugyldig eller ikke definert.
    relation_field_invalid_collection_file: Filen `{$file}` som det vises til, er ugyldig eller ikke definert.
    # Don’t localize `file`
    relation_field_missing_file_name: Alternativet `file` må være definert for en relasjon til en filsamling.
    relation_field_invalid_value_field: Verdifeltet `{$field}` som det vises til, er ugyldig eller ikke definert.
    # {$collection} is the referenced collection name; Don’t localize `file`, `value_field` and `slug`.
    # The curly brackets are escaped with backslashes for MessageFormat 2
    relation_field_array_file_slug: Relasjonen til samlingen `{$collection}` kan ikke lagre verdien `\{\{slug\}\}`, fordi slugen til en oppføring i en samling med alternativet `file` er plasseringen dens, som endres når oppføringene flyttes eller slettes. Sett alternativet `value_field` til et felt med en unik verdi i stedet.
    # {$collection} is the referenced collection name; Don’t localize `file`
    relation_field_array_file_workflow: En samling med alternativet `file` kan ikke ha en relasjon til samlingen `{$collection}`, som bruker redaksjonell arbeidsflyt eller forhåndsvisningsflyt, fordi referansene til en oppføring som får nytt navn eller slettes der, ikke kan oppdateres i filen.
    relation_field_invalid_display_field: Visningsfeltet `{$field}` som det vises til, er ugyldig eller ikke definert.
    relation_field_invalid_search_field: Søkefeltet `{$field}` som det vises til, er ugyldig eller ikke definert.
    relation_field_invalid_filter_field: Filterfeltet `{$field}` som det vises til, er ugyldig eller ikke definert.
    relation_field_invalid_sort_field: Sorteringsfeltet `{$field}` som det vises til, er ugyldig eller ikke definert.
    # Don’t localize `sort_by` and `file`
    relation_field_sort_by_file_ignored: Alternativet `sort_by` gjelder ikke for en relasjon til en fil, der valgene følger rekkefølgen i listen. Det blir ignorert.
    unexpected: Uventet feil

    # Schema validation errors, reported when the configuration doesn’t match the published JSON
    # schema. In all of these, {$option} is a configuration option path such as `backend.name` or
    # `view_filters[0].pattern`, relative to the collection, file or field named before it.
    # {$type} is a value type name from `schema_value_type` below
    schema_invalid_type: Alternativet `{$option}` må være {$type}.
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'Alternativet `{$option}` må være en av disse verdiene: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: Alternativet `{$option}` må være `{$value}`.
    schema_invalid_empty_value: Alternativet `{$option}` må være en tom tekst.
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: Alternativet `{$option}` må være en matrise med {$count} elementer.
    schema_invalid_value: Alternativet `{$option}` har en ugyldig verdi.
    schema_missing_option: Alternativet `{$option}` er påkrevd.
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Ett av disse alternativene er påkrevd: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: en tekst
      number: et tall
      integer: et heltall
      boolean: en boolsk verdi
      array: en matrise
      object: et objekt
      'null': tomt

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: ID for OAuth-applikasjonen er ikke definert. Brukerne må oppgi et tilgangstoken for å logge inn.
    # Don’t localize `prefix`
    site_library_prefix_template: Alternativet `prefix` for et mediebibliotek inneholder malkoder, som bare er støttet på feltnivå, fordi det ikke finnes noen oppføring å fylle dem ut med på toppnivå.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: Alternativet `{$prop}` er ikke støttet i Sveltia CMS. Det blir ignorert.
    # Don’t localize `stages`, `publish_mode`, `editorial_workflow` and {$type}, which is `preview` or `simple`
    publish_mode_stages_ignored: Alternativet `stages` i `publish_mode` gjelder bare publiseringsmodusen `editorial_workflow`, så det ignoreres med `{$type}`.
    # Don’t localize `pattern`, `m` and `s`
    inline_component_multiline_pattern: Alternativet `pattern` for denne innebygde komponenten har flagget `m` eller `s` eller treffer linjeskift, men en innebygd komponent søkes bare innenfor et avsnitt.
    # {$name} is a button or component name and {$option} is `buttons` or `editor_components`; Don’t localize them and `multiline: false`
    single_line_block_item: 'Elementet `{$name}` i alternativet `{$option}` blir ignorert, fordi et felt med `multiline: false` bare kan inneholde innebygd innhold.'
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Både `picker_utc` og de nyere tidssonealternativene (`input_timezone` eller `output_utc`) er satt. De nye alternativene har forrang. Vurder å fjerne `picker_utc` fra konfigurasjonen.
    # Don’t localize `localize_format` and `format`
    localize_format_without_format: Alternativet `localize_format` har ingen virkning, fordi feltet ikke har alternativet `format`, og verdien lagres i ISO 8601-format.
    # {$name} is a template tag like `fields.lines.*.price`; Don’t localize `value`, `*` and `sum()`
    compute_field_wildcard_without_item: Alternativet `value` for Compute-feltet viser til `{$name}`, men feltet er ikke i et element i listen som `*` står for, så det blir tomt. Bare en samlefunksjon som `sum()` kan bruke alle elementene i en liste.
    # {$name} is a template tag like `fields.lines.*.amount`; Don’t localize `value`
    compute_field_self_reference: Alternativet `value` for Compute-feltet viser til feltet selv som `{$name}`, så verdien endres hver gang den regnes ut og blir aldri stabil.
    # {$name} is a template tag like `fields.total`; Don’t localize `value`
    compute_field_reference_cycle: Alternativet `value` for Compute-feltet viser til `{$name}`, et annet Compute-felt som viser tilbake til dette feltet, direkte eller gjennom andre felt, så verdiene blir aldri stabile.
    # Don’t localize `localize_format`, `true` and `de`
    localize_format_without_i18n: Alternativet `localize_format` er `true`, men i18n er ikke slått på for samlingen, så verdien skrives på engelsk. Sett alternativet til en språkkode som `de` i stedet.
    # {$locale} is the locale code from the configuration; Don’t localize `localize_format`
    localize_format_unsupported_locale: Alternativet `localize_format` er satt til `{$locale}`, som ikke er et støttet språk, så verdien skrives på engelsk.
    # Don’t localize `preview_path`
    preview_path_no_date_field: Alternativet `preview_path` bruker dato- og tidskoder, men samlingen har ikke noe DateTime-felt å lese dem fra, så lenken til forhåndsvisningen vises ikke.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: Alternativet `preview_path_date_field` viser til et felt som heter `{$name}`, men det finnes ikke noe DateTime-felt med det navnet, så lenken til forhåndsvisningen vises ikke.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: Alternativet `preview_path` viser til `{$name}`, men det finnes ikke noe slikt felt i samlingen, så lenken til forhåndsvisningen vises ikke.
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: Samlingen har ikke noe `{$name}`-felt å navngi nye oppføringer med, så hver nye oppføring får en tilfeldig slug. Legg til et `{$name}`-felt, eller sett alternativet `identifier_field` eller `slug`.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: Alternativet `i18n` i `slug` har ingen virkning, fordi samlingen ikke bruker i18n-strukturen `multiple_files`, `multiple_folders` eller `multiple_root_folders`, der hvert språk har sin egen fil.
    # Don’t localize `slug`, `template` and `auto_increment`
    slug_template_ignored: Alternativet `template` i `slug` blir ignorert, fordi alternativet `auto_increment` nummererer slugene i stedet.
    # {$file} is the file path; Don’t localize `file`, `locale`, `i18n`, `false`,
    # `omit_default_locale_from_file_path` and the example paths. The curly brackets in the examples
    # are escaped with backslashes for MessageFormat 2
    locale_not_omitted_from_file_path: Plassholderen `locale` kan ikke fjernes fra banen `{$file}` i `file`, så standardspråket blir stående i den til tross for i18n-alternativet `omit_default_locale_from_file_path`. For å utelate språket bruker du plassholderen som et helt mappenavn, som `\{\{locale\}\}/about.md`, eller mellom filnavnet og filtypen, som `about.\{\{locale\}\}.md`. For å beholde det setter du alternativet til `false` i alternativet `i18n` for filen.
    # Don’t localize `i18n`
    i18n_not_configured: Alternativet `i18n` er slått på, men i18n er ikke satt opp på toppnivå i konfigurasjonen eller i samlingen, så alternativet har ingen virkning.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: Alternativet `public_folder` er en tom tekst, så banen i `media_folder` brukes i stedet for mediebanene som lagres i oppføringene. Fjern alternativet, eller sett det til banen du vil bruke, for eksempel `/images`.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: Alternativet `{$option}` er ikke definert i konfigurasjonsskjemaet til Sveltia CMS. Det blir ignorert. Se etter skrivefeil eller syntaksfeil.
    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: Alternativet `default_localized` har ingen virkning, fordi i18n ikke er slått på for samlingen. Bruk alternativet `default` i stedet.
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: Alternativet `default_localized` har en verdi for `{$locale}`, som ikke er et av språkene i samlingen, så verdien blir aldri brukt.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Se kompatibilitetsnotatene for detaljer: {$link}'

  # Console tip shown after config load
  schema_tip: For en bedre utvikleropplevelse kan du validere konfigurasjonsfilen mot JSON-skjemaet til Sveltia CMS. Se {$link} for detaljer.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Lokal
  # Browser compatibility warnings
  unsupported_browser: Lokal arbeidsflyt støttes ikke i nettleseren din. Bruk Chrome eller Edge i stedet.
  disabled: Lokal arbeidsflyt er slått av i nettleseren din. <a>Slik slår du den på</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Du ser nå tavlen for redaksjonell arbeidsflyt. Utkast: {$draft}. Til godkjenning: {$review}. Klar: {$ready}. Venter på sletting: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Du ser nå tavlen for redaksjonell arbeidsflyt. Utkast: {$draft}. Til godkjenning: {$review}. Venter på sletting: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'Du ser nå tavlen for redaksjonell arbeidsflyt. Utkast: {$draft}. Klar: {$ready}. Venter på sletting: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'Du ser nå siden Utkast. Utkast: {$draft}. Venter på sletting: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Utkast
  drafts: Utkast
  in_review: Til godkjenning
  ready: Klar
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Venter på sletting
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: Publiseres

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Avbryt sletting
  confirm_cancelling_deletion: Er du sikker på at du vil avbryte denne slettingen? Oppføringen forblir publisert.
  confirm_completing_deletion: Er du sikker på at du vil slette denne oppføringen? Den blir fjernet med en gang.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ Oppføringen er merket for sletting. }}
      *   {{ {$count} oppføringer er merket for sletting. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Endringene er forkastet. }}
      *   {{ Endringene i {$count} oppføringer er forkastet. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Avbryter slettingen…
  deletion_cancelled: Slettingen er avbrutt.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Kunne ikke avbryte slettingen. Prøv igjen.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Upubliserte oppføringer
  published_entries: Publiserte oppføringer
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Status: {$status}'
  change_entry_status: Endre status for oppføringen
  # Editor toolbar: progress label while the status is being changed
  changing_status: Endrer status…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Oppdaterer status…
  status_updated: Statusen er oppdatert.
  # Error notification when the status could not be changed
  status_change_failed: Kunne ikke endre statusen. Prøv igjen.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: Oppdater
  refreshing: Oppdaterer…
  refreshed: Tavlen er oppdatert.
  # Error notification when the board could not be refreshed
  refresh_failed: Kunne ikke oppdatere tavlen. Prøv igjen.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: Oppføringen har feil. Rett dem før du endrer statusen.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: Oppføringen har feil. Rett dem før du publiserer den.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Send til godkjenning
  confirm_sending_for_review: Endringene dine er lagret som utkast. Vil du sende oppføringen til godkjenning, slik at noen kan se på den og publisere den?
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: Merk som klar
  confirm_marking_as_ready: Endringene dine er lagret som utkast. Vil du merke oppføringen som klar, slik at den kan publiseres?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Publiser oppføring
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Forkast endringer
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Er du sikker på at du vil slette denne oppføringen? Den blir ikke fjernet før slettingen er publisert. Inntil da finner du den fortsatt i listen over oppføringer, merket Venter på sletting.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Denne oppføringen er ikke publisert ennå, så hvis du sletter den, forsvinner den helt.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Denne oppføringen har endringer som ikke er publisert. Hvis du forkaster dem, får du tilbake den publiserte versjonen. Selve oppføringen blir ikke slettet.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Den er ikke publisert ennå, så endringene du ikke har publisert, blir forkastet. En eventuell publisert versjon forblir publisert. }}
      *   {{ De er ikke publisert ennå, så endringene du ikke har publisert, blir forkastet. Eventuelle publiserte versjoner forblir publisert. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ Én av dem er ikke publisert ennå, så endringene du ikke har publisert, blir forkastet. En eventuell publisert versjon forblir publisert. }}
      *   {{ {$count} av dem er ikke publisert ennå, så endringene du ikke har publisert, blir forkastet. Eventuelle publiserte versjoner forblir publisert. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: Er du sikker på at du vil publisere denne oppføringen? Endringene dine blir synlige når nettstedet er bygget på nytt.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Publiserer oppføringen…
  entry_published: Oppføringen er publisert.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Sletter oppføringen…
  discarding_changes: Forkaster endringene…
  entry_deleted: Oppføringen er slettet.
  # Error notification when publishing fails
  publishing_entry_failed: Kunne ikke publisere oppføringen. Prøv igjen.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: Denne oppføringen kan ikke publiseres her, fordi den kommer med andre endringer som CMS-et ikke kan vise deg. Be en utvikler om å se over den.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: Oppføringen er endret siden du åpnet den. Last inn siden på nytt for å se over den nyeste versjonen før du publiserer den.
  review_on_x: Se over på {$service}
  from_fork: Fra en fork
  fork_entry_editable: Denne oppføringen kommer fra en pull request som en bidragsyter har åpnet fra «{$fork}». Endringene dine lagres i grenen deres. Se over og merge pull requesten hos Git-tjenesten.
  fork_entry_locked: Denne oppføringen kommer fra en pull request som en bidragsyter har åpnet fra «{$fork}». Bidragsyteren tillater ikke at vedlikeholdere redigerer den, så den kan bare vises her.
  fork_not_editable: Bidragsyteren tillater ikke at vedlikeholdere redigerer denne pull requesten.
  fork_entry_gone: Pull requesten fra bidragsyteren er ikke lenger åpen, så endringene kan ikke lagres i den.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: En annen forespørsel ({$number}) er allerede åpen for denne oppføringen utenfor CMS-et. Be en utvikler om å lukke den først.
  # Workflow page: empty column message
  no_entries: Ingen oppføringer.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Dra for å endre statusen
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Sletting
  # Workflow page: note on a card listing the new entries that were created from a Relation field
  # of the entry and are published along with it, e.g. “Also adds Section: Getting Started”
  companion_entries: Legger også til {$entries}
  # Workflow page: note on a card listing the existing entries that were edited from a Relation
  # field of the entry and are published along with it, e.g. “Also changes Author: Ada Lovelace”
  edited_companion_entries: Endrer også {$entries}
  # Workflow page: one of the entries listed by `companion_entries` or `edited_companion_entries`,
  # named by its collection’s singular label and its title
  companion_entry: '{$collection}: {$title}'

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: Commit-melding
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: Beskriv endringene dine. Meldingen lagres i historikken sammen med dem.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: Legg til en merknad i meldingen som lagres i historikken sammen med endringene, for eksempel et saksnummer. Feltet kan stå tomt.
  # Accessible name of the text box when the user writes the whole message
  message: Commit-melding
  # Accessible name of the text box when the text is added before or after the message
  addition: Merknad
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'Melding: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Lag fork av repositoriet
  fork: Lag fork
  confirm_forking_repository: For å foreslå endringer i «{$repo}» må det lages en fork av repositoriet på kontoen din. Endringene dine lagres i den forken, og en vedlikeholder ser over dem før de blir synlige.
  # Error shown when the user declined the dialog above
  fork_declined: Du trenger en fork av repositoriet på kontoen din for å foreslå endringer.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Kunne ikke lage en fork av repositoriet «{$repo}» på kontoen din.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: Forken din «{$fork}» har ikke grenen «{$branch}». Oppdater forken fra repositoriet «{$repo}», og logg inn på nytt.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Kunne ikke sjekke tilgangen din til repositoriet «{$repo}». Prøv igjen om litt.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Repositoriet «{$repo}» tillater ikke forks. Be en vedlikeholder om å slå på forking for det.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Du har en invitasjon til repositoriet «{$repo}» som venter. Godta den på GitHub, og logg inn på nytt.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Innloggingen din gir ikke tilgang til private repositorier, så repositoriet «{$repo}» kan ikke leses. Be en vedlikeholder om å sjekke innloggingsinnstillingene til CMS-et.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Bare en vedlikeholder kan publisere endringer på dette nettstedet. Merk oppføringen som Til godkjenning i stedet, så ser noen på den.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: En vedlikeholder har allerede publisert denne oppføringen, så det er ikke noe mer å se over.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Denne endringen kan ikke gjøres direkte. Bare endringer i oppføringer kan foreslås til godkjenning.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Endringene dine lagres i forken din av dette repositoriet, «{$repo}», og blir sett over før de blir synlige.
  view_fork: Vis fork

# ==============================================================================
# Settings Dialog
# ==============================================================================
# Strings for the settings/preferences dialog and its panels.

# Settings page aria-label
categories: Kategorier

# Preferences panels
prefs:
  account:
    title: Konto
  # API key management feedback messages
  changes:
    api_key_saved: API-nøkkelen er lagret.
    api_key_removed: API-nøkkelen er fjernet.
    api_key_invalid: API-nøkkelen er ugyldig. Sjekk den og prøv igjen.

  # Preferences operation errors
  error:
    permission_denied: Tilgang til lagring av informasjonskapsler er nektet. Sjekk tillatelsene i nettleseren og prøv igjen.

  # Appearance panel
  appearance:
    title: Utseende
    theme: Tema
    select_theme: Velg tema

  # Theme options
  theme:
    dark: Mørkt
    light: Lyst

  # Language panel
  language:
    title: Språk
    ui_language:
      title: Språk i brukergrensesnittet
      select_language: Velg språk

  # Contents panel
  contents:
    title: Innhold
    editor:
      title: Redigering
      use_draft_backup:
        switch_label: Ta sikkerhetskopi av utkast automatisk
      close_on_save:
        switch_label: Lukk redigeringen etter at et utkast er lagret
      close_with_escape:
        switch_label: Lukk redigeringen med Esc-tasten

  # Internationalization panel
  i18n:
    title: Internasjonalisering
    translators:
      default:
        title: Standard oversettelsestjeneste
        select_service: Velg tjeneste
      api_keys:
        title: API-nøkler for oversettelsestjenester
        description: Administrer API-nøkler for <a>oversettelsestjenester</a>. API-nøkler for generelle KI-tjenester administreres i KI-innstillingene.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: Nøkkel for {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Registrer deg hos <a {$homeHref}>{$service}</a> og skriv inn <a {$apiKeyHref}>API-nøkkelen din</a> her for å kunne oversette tekstfelt raskt.

  # Media panel
  media:
    title: Medier
    stock_photos:
      api_keys:
        title: API-nøkler for arkivbildetjenester
        description: Administrer API-nøkler for <a>arkivbildetjenester</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: API-nøkkel for {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Registrer deg hos <a {$homeHref}>{$service} API</a> og skriv inn <a {$apiKeyHref}>API-nøkkelen din</a> her for å sette inn gratis arkivbilder i bildefelt.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Bilder fra {$service}
      no_services: Ingen <a>arkivbildetjenester</a> er satt opp.
    cloud_storage:
      api_keys:
        title: API-nøkler for skylagringstjenester
        description: Administrer API-nøkler for <a>skylagringstjenester</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: API-nøkkel for {$service}
      no_services: Ingen <a>skylagringstjenester</a> er satt opp.

  # AI panel
  ai:
    title: KI
    api_keys:
      title: API-nøkler for KI-tjenester
      description: Administrer API-nøkler for KI-tjenester.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: API-nøkkel for {$service}

  # Accessibility panel
  accessibility:
    title: Tilgjengelighet
    underline_links:
      title: Understrek lenker
      description: Vis understreking av lenker i forhåndsvisningen av oppføringer og i tekst i brukergrensesnittet.
      switch_label: Understrek alltid lenker

  # Data Management panel
  data:
    title: Databehandling
    clear_data:
      title: Tøm data
      # Clear File Cache button
      file_cache:
        description: Slett filinnhold og miniatyrbilder som er mellomlagret lokalt, for å frigjøre lagringsplass eller løse problemer med utdaterte data.
        button_label: Tøm filbufferen
        confirmation: Filinnhold og miniatyrbilder som er mellomlagret lokalt, blir slettet. Utkast som ikke er lagret, og innstillingene dine blir beholdt, og slettede data lastes ned eller lages på nytt ved behov. CMS-et lastes inn på nytt når det er gjort.
      # Erase All Data button
      all_data:
        description: Slett alt CMS-et har lagret i denne nettleseren, også mellomlagrede filer, utkast som ikke er lagret, og innstillinger. Det du allerede har lagret i repositoriet, blir ikke påvirket.
        button_label: Slett alle data
        confirmation: Alle data som er lagret i denne nettleseren, blir slettet, også mellomlagret filinnhold, miniatyrbilder, utkast som ikke er lagret, innstillinger og innlogging. Repositoriet blir ikke påvirket, men endringer du ikke har lagret, går tapt, og du må logge inn på nytt. CMS-et lastes inn på nytt når det er gjort.

  # Developer panel
  developer:
    title: Utvikler
    developer_mode:
      title: Utviklermodus
      description: Slå på noen funksjoner for utviklere, blant annet detaljerte konsollogger og nettleserens egne kontekstmenyer.
      switch_label: Slå på utviklermodus
    local_git:
      title: Git-commits
      description: Commit endringene dine til gjeldende gren i det lokale repositoriet hver gang du lagrer, slik CMS-et gjør når du arbeider med et eksternt repositorium. Så kan du se over og pushe commitene med de vanlige Git-verktøyene dine.
      switch_label: Commit endringer til Git
      checking: Sjekker repositoriet…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Endringer blir committet til grenen {$branch} som {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Endringer kan ikke committes akkurat nå. {$reason}
    deploy_hook:
      title: Deploy-hook
      description: Skriv inn en webhook-URL som kalles når du starter en publisering manuelt ved å velge Publiser endringer. Feltet kan stå tomt hvis du bruker GitHub Actions eller GitLab CI/CD.
      # Hook URL input
      url:
        field_label: Hook-URL
        saved: Hook-URL-en er lagret.
        removed: Hook-URL-en er fjernet.
      # Authorization header input
      auth:
        field_label: Authorization-header (f.eks. Bearer <token>) (valgfritt)
        saved: Authorization-headeren er lagret.
        removed: Authorization-headeren er fjernet.

