    # curly brackets in the placeholder are escaped with backslashes for MessageFormat 2
    hidden_field_locale_without_i18n: Alternativet `default` i et Hidden-felt bruker plassholderen `\{\{locale\}\}`, men i18n er ikke slått på for samlingen, så innholdet har ikke noe språk å fylle den ut med.
    # {$timeZone} is the invalid IANA timezone identifier from the configuration
    invalid_timezone: 'Ugyldig tidssone: {$timeZone}. Den må være en gyldig IANA-tidssone som `Europe/Oslo` eller `Asia/Tokyo`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: Det utfasede alternativet `{$prop}` er ikke støttet i Sveltia CMS. Bruk alternativet `{$newProp}` i stedet.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: Alternativet `allow_multiple` er ikke støttet i Sveltia CMS. Bruk alternativet `multiple` i stedet, som er `false` som standard.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: List-feltet kan ikke ha alternativene `field`, `fields` og `types` samtidig.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: En av typene i `types` for List-feltet er ugyldig. Alternativet `widget` er satt til `{$widget}`, men det må være `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: Object-feltet kan ikke ha alternativene `fields` og `types` samtidig.
