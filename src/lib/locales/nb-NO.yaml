# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Det er en feil i CMS-konfigurasjonen. Rett feilen og prøv igjen. }}
      *   {{ Det er feil i CMS-konfigurasjonen. Rett feilene og prøv igjen. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: Samlingen {$collection}
    file: Filen {$file}
    component: Komponenten {$component}
    # Don’t localize `{$field}`
    field: Feltet `{$field}`

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS virker bare med HTTPS- eller localhost-adresser.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ URL-en til konfigurasjonsfilen må bruke HTTPS eller en localhost-adresse. }}
        *   {{ URL-ene til konfigurasjonsfilene må bruke HTTPS eller localhost-adresser. }}
    fetch_failed: Konfigurasjonsfilen kunne ikke hentes.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: HTTP-svaret kom med status {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Konfigurasjonsfilen kunne ikke hentes. For å hindre at filen `config.yml` lastes inn, legger du til <a>`load_config_file: false`</a> i konfigurasjonsobjektet som sendes til `CMS.init()`.'
    parse_failed: Konfigurasjonsfilen kunne ikke leses.
    parse_failed_invalid_object: Konfigurasjonsfilen er ikke et gyldig JavaScript-objekt.
    parse_failed_unsupported_type: Konfigurasjonsfilen har en ugyldig filtype. Bare YAML, TOML og JSON støttes.
    no_collection: Ingen samlinger er definert.
    # Don’t localize `hide`
    no_visible_collection: Minst én samling må være synlig. Sjekk alternativet `hide`.
    missing_backend: Backend er ikke definert.
    missing_backend_name: Navnet på backenden er ikke definert.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Backenden {$name} er <a>ikke støttet</a> i Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Den utfasede backenden {$name} er <a>ikke støttet</a> i Sveltia CMS.
    unsupported_custom_backend: Egendefinerte backender er <a>ikke støttet</a> i Sveltia CMS.
    unsupported_backend_suggestion: Bruk en av de <a>støttede backendene</a> i stedet.
    missing_repository: Repositoriet er ikke definert.
    invalid_repository: Det konfigurerte repositoriet er ugyldig. Det må ha formatet «eier/repo».
    # Don’t localize `api_root`
    missing_api_root: Alternativet `api_root` er ikke definert. Det er påkrevd for Forgejo-backenden.
    invalid_root_dir: Rotmappen er ugyldig. Den må være en bane i repositoriet, uten «..».
    invalid_root_dir_branch: Rotmappen kan ikke brukes i grennavnene til publiseringsmodusene `editorial_workflow` og `preview`. Ingen del av banen kan begynne med punktum, slutte på «.lock» eller inneholde mellomrom eller spesialtegn som kolon eller stjerne.
    path_outside_root_dir: Banen «{$path}» peker utenfor rotmappen, der CMS-et ikke kan liste filer.
    oauth_implicit_flow: Den konfigurerte innloggingsmetoden (implicit flow) er ikke støttet i Sveltia CMS. Bruk en annen <a>innloggingsmetode</a> i stedet.
    github_pkce_unsupported: PKCE-autorisasjon er ikke støttet ennå på grunn av begrensninger hos GitHub. Bruk en annen <a>innloggingsmetode</a> i stedet.
    additions_no_base_url: Alternativet `base_url` må være URL-en til Sveltia CMS Additions-tjenesten din.
    oauth_no_app_id: ID for OAuth-applikasjonen er ikke definert.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: Alternativet `open_authoring` krever publiseringsmodusen `editorial_workflow` eller `preview`. Se <a>dokumentasjonen</a> for detaljer.
    # Don’t localize `auth_methods`
    no_auth_methods: Alternativet `auth_methods` må inneholde minst én metode.
    # Don’t localize `auth_scope`, `repo` and `public_repo`
    auth_scope_no_repo: Alternativet `auth_scope` må inneholde `repo` eller `public_repo`.
    missing_media_folder: Mediemappen er ikke definert.
    public_folder_relative_path: Den konfigurerte offentlige mappen er ugyldig. Den må være en absolutt bane som begynner med «/».
    public_folder_absolute_url: En absolutt URL for den offentlige mappen er ikke støttet i Sveltia CMS.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: Alternativet `{$option}` inneholder malkoden `{$tag}`, som ikke er støttet der. Bare slug-malkodene, som `\{\{slug\}\}` og `\{\{year\}\}`, og kodene `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` og `\{\{public_folder\}\}` kan brukes.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: Alternativet `{$option}` inneholder malkoden `{$tag}`, som bare kan brukes i alternativet til en samling, en fil i en samling eller et felt, der det finnes en oppføring å fylle den ut med.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: Alternativet `sanitize_replacement` er satt til `{$replacement}`, men det inneholder et tegn som ikke kan brukes i en slug, så det kan ikke erstatte et tegn.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: Alternativet `{$option}` er satt til `{$url}`, men det må være en absolutt URL som begynner med `https://` eller `http://`.
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: Alternativet `stages` i `publish_mode` må begynne med `draft` og liste stegene i rekkefølgen `draft`, `pending_review`, `pending_publish`, uten å gjenta noen.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: Alternativet `i18n.locales` må inneholde minst ett språk.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: Alternativet `default_locale` er satt til `{$locale}`, men det er ikke et av språkene i `locales`.
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: Alternativet `initial_locales` inneholder `{$locale}`, men det er ikke et av språkene i `locales`.
    # Don’t localize `i18n`
    i18n_no_collections: 'Alternativet `i18n` er satt opp på toppnivå, men ingen av samlingene eller enkeltfilene har alternativet `i18n`, så ikke noe innhold kan oversettes. Legg til `i18n: true` i samlingene og enkeltfilene som skal oversettes.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: Alternativet `transformations` inneholder en nøkkel som ikke er støttet, `{$key}`. Den må være `raster_image`, `svg` eller et støttet rasterbildeformat.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: Alternativet `quality` for transformasjonen `{$key}` er ugyldig. Det må være et heltall mellom 0 og 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: Alternativet `{$prop}` for transformasjonen `{$key}` er ugyldig. Det må være et positivt heltall.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: Mediesamling nr. {$count} må ha alternativet `name`, og det kan ikke være tomt.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Navnet `{$name}` på mediesamlingen er ugyldig. Det kan ikke inneholde spesialtegn.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Navnene på mediesamlingene må være unike, men `{$name}` brukes mer enn én gang.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: Samlingen må ha et av alternativene `folder`, `file`, `files` eller `divider` definert.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: Samlingen kan ikke ha mer enn ett av alternativene `folder`, `file`, `files` og `divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: Filtypen `{$extension}` stemmer ikke med formatet `{$format}`.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: Feltet `{$name}` lagres som brødteksten under front matter, som bare kan inneholde tekst, ikke et tall, en boolsk verdi, en liste eller et objekt slik et `{$widget}`-felt gjør. Bruk en felttype som inneholder tekst, eller gi feltet et annet navn.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
    # brackets are escaped with backslashes for MessageFormat 2
    invalid_collection_data_file: Alternativet `file` med verdien `{$file}` er ugyldig. Det må være banen til en JSON-fil, uten plassholderen `\{\{locale\}\}`.
    # {$prop} is the option name; Don’t localize `file`
    unsupported_collection_data_file_option: Alternativet `{$prop}` er ikke støttet i en samling med alternativet `file`.
    # Don’t localize `file`, `publish_mode` and `simple`
    collection_data_file_workflow: Redaksjonell arbeidsflyt og forhåndsvisningsflyt, også Open Authoring, er ikke støttet i en samling med alternativet `file`. Sett alternativet `publish_mode` for samlingen til `simple`.
    # {$prop} is the option name; Don’t localize `file` and `slug`. The curly brackets are escaped
    # with backslashes for MessageFormat 2
    collection_data_file_slug_tag: Alternativet `{$prop}` kan ikke inneholde koden `\{\{slug\}\}` i en samling med alternativet `file`, fordi slugen til en oppføring er plasseringen dens, som endres når oppføringene flyttes eller slettes. Bruk et felt med en unik verdi i stedet.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Slug-malen `{$slug}` er ugyldig, fordi den ikke kan inneholde skråstreker. For å ordne oppføringer i undermapper bruker du alternativet `path` i stedet for `slug`.
    # {$name} is the field name from the configuration; Don’t localize `identifier_field`
    invalid_identifier_field: Alternativet `identifier_field` viser til `{$name}`, men det finnes ikke noe slikt felt i samlingen.
    # {$name} is the field name from the configuration; Don’t localize `filter`
    invalid_filter_field: Alternativet `filter` viser til `{$name}`, men det finnes ikke noe slikt felt i samlingen.
    # Don’t localize `filter`, `value` and `pattern`
    invalid_filter_no_condition: Alternativet `filter` må ha alternativet `value` eller `pattern` å sammenligne oppføringene med.
    # {$option} is an option name such as `slug` or `summary` and {$name} is the field name or template tag from the configuration
    option_field_not_found: Alternativet `{$option}` viser til `{$name}`, men det finnes ikke noe slikt felt.
    # {$name} is the field name from the configuration and {$widget} is its field type; Don’t localize `thumbnail`
    thumbnail_field_not_media: Alternativet `thumbnail` viser til `{$name}`, men det må være et Image- eller File-felt, ikke et `{$widget}`-felt.
    # Don’t localize `inline` or `multiple`
    invalid_inline_component_fields: Modusen `inline` krever ett enkelt Boolean-, Color-, DateTime-, Number-, Relation-, Select- eller String-felt. Et Relation- eller Select-felt kan ikke ha alternativet `multiple` slått på.
    # {$option} is an option name such as `pattern` or `filter` and {$pattern} is the configured pattern
    invalid_regex: Alternativet `{$option}` inneholder et ugyldig regulært uttrykk, `{$pattern}`, som blir ignorert.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: Alternativet `reorder` viser til en visningsgruppe som heter `{$name}`, men det finnes ingen slik gruppe i alternativet `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit` and `fields`
    invalid_bulk_edit_field: Listen `fields` i alternativet `bulk_edit` viser til et felt som heter `{$name}`, men det finnes ikke noe slikt felt på toppnivå i samlingen.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit`, `fields` and `multiple`
    unsupported_bulk_edit_field: Feltet `{$name}` i listen `fields` i alternativet `bulk_edit` kan ikke masseredigeres. Bare Boolean-, Color-, DateTime-, Number-, Relation-, Select- eller String-felt som ikke er skrivebeskyttet, ikke har alternativet `multiple` slått på og ikke settes automatisk ved lagring, er støttet.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: Alternativet `sortable_fields` viser til et felt som heter `{$name}`, men det finnes ikke noe slikt felt i samlingen.
    # Don’t localize `sortable_fields` and `default_sort`
    multiple_sortable_field_defaults: Bare ett element i alternativet `sortable_fields` kan ha alternativet `default_sort`.
    # {$option} is `table_columns` or `summary_fields`, and {$name} is the field name from the configuration
    invalid_table_column_field: Alternativet `{$option}` viser til et felt som heter `{$name}`, men det finnes ikke noe slikt felt i samlingen.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: Alternativet `view_groups` viser til et felt som heter `{$name}`, men det finnes ikke noe slikt felt i samlingen.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: Alternativet `view_filters` viser til et felt som heter `{$name}`, men det finnes ikke noe slikt felt i samlingen.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: Visningsgruppe nr. {$count} må ha alternativet `name`, og det kan ikke være tomt.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: Navnet `{$name}` på visningsgruppen er ugyldig. Det kan ikke inneholde spesialtegn.
    duplicate_view_group_name: Navnene på visningsgruppene må være unike, men `{$name}` brukes mer enn én gang.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: Visningsfilter nr. {$count} må ha alternativet `name`, og det kan ikke være tomt.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `pattern`, `eq` and `gte`
    invalid_view_filter_no_condition: Visningsfilter {$count} må ha alternativet `pattern` eller et sammenligningsalternativ som `eq` eller `gte` å sammenligne oppføringene med.
    # {$name} is the invalid or duplicate view filter name
    invalid_view_filter_name: Navnet `{$name}` på visningsfilteret er ugyldig. Det kan ikke inneholde spesialtegn.
    duplicate_view_filter_name: Navnene på visningsfiltrene må være unike, men `{$name}` brukes mer enn én gang.
    # {$name} is the default view group name from the configuration; Don’t localize `default` and `view_groups`
    invalid_view_group_default: Alternativet `default` i `view_groups` er satt til `{$name}`, men ingen visningsgruppe har det navnet.
    # {$name} is the default view filter name from the configuration; Don’t localize `default` and `view_filters`
    invalid_view_filter_default: Alternativet `default` i `view_filters` er satt til `{$name}`, men ingen visningsfiltre har det navnet.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: Samling nr. {$count} må ha alternativet `name`, og det kan ikke være tomt.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: Navnet `{$name}` på samlingen er ugyldig. Det kan ikke inneholde spesialtegn.
    duplicate_collection_name: Navnene på samlingene må være unike, men `{$name}` brukes mer enn én gang.
    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
    missing_collection_file_name: Fil nr. {$count} i samlingen må ha alternativet `name`, og det kan ikke være tomt.
    # {$name} is the invalid or duplicate collection file name
    invalid_collection_file_name: Navnet `{$name}` på filen i samlingen er ugyldig. Det kan ikke inneholde spesialtegn.
    duplicate_collection_file_name: Filene i en samling må ha unike navn, men `{$name}` brukes mer enn én gang.
