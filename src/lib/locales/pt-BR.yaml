    one one {{ Esta coleção está próxima do limite de {$quota} entrada. Você só pode criar mais {$remaining} entrada. }}
    one *   {{ Esta coleção está próxima do limite de {$quota} entrada. Você só pode criar mais {$remaining} entradas. }}
