      branch_bypassed: Rulesets protegem a branch “{$branch}”, mas o app pode ignorá-los, então os editores ainda poderiam fazer force push nela ou excluí-la. Remova o app das listas de bypass desses rulesets.
      branch_unprotected: Nenhum ruleset protege a branch “{$branch}” contra force pushes e exclusão, então os editores poderiam reescrever seu histórico ou excluí-la. Adicione nas configurações do repositório um ruleset que bloqueie ambos, sem o app na lista de bypass.
