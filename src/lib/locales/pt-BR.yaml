    # curly brackets in the placeholder are escaped with backslashes for MessageFormat 2
    hidden_field_locale_without_i18n: A opção `default` de um campo Hidden usa o placeholder `\{\{locale\}\}`, mas a i18n não está ativada para a coleção, então o conteúdo não tem um idioma com que preenchê-lo.
