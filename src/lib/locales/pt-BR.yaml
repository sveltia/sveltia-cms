    revert: Um revert está em andamento. Conclua-o com git revert --continue ou cancele-o com git revert --abort.
    am: A aplicação de patches com git am está em andamento. Conclua-a com git am --continue ou cancele-a com git am --abort.
    conflict: Alguns arquivos têm conflitos. Resolva-os e adicione os resultados ao stage primeiro.
  detached_head: Nenhuma branch está em checkout.
  staged_changes: Você tem outras alterações no stage para commit. Faça o commit delas ou remova-as do stage primeiro.
