# ==============================================================================
# Strings for specific field widget types.

# Color field: opacity slider
opacity: Opacidade

# Select field: empty option placeholder
unselected_option: (Nenhum)

# Select Assets dialog
assets_dialog:
  # Dialog titles for different selection modes
  title:
    file: Selecionar Arquivo
    image: Selecionar Imagem

  # Search input labels
  search_for_file: Pesquisar Arquivos
  search_for_image: Pesquisar Imagens

  # Locations panel aria-label
  locations: Locais

  # Asset folder options
  folder:
    field: Recursos do Campo
    entry: Recursos da Entrada
    file: Recursos do Arquivo
    collection: Recursos da Coleção
    global: Recursos Globais

  # Error messages
  error:
    invalid_key: Sua chave de API é inválida ou expirou. Verifique e tente novamente.
    search_fetch_failed: Ocorreu um erro ao pesquisar recursos. Tente novamente mais tarde.
    image_fetch_failed: Ocorreu um erro ao baixar o recurso selecionado. Tente novamente mais tarde.

  # Stock photo panels
  available_images: Imagens Disponíveis

  # URL entry option
  enter_url: Inserir URL
  enter_file_url: 'Insira a URL do arquivo:'
  enter_image_url: 'Insira a URL da imagem:'

  # Large file warning dialog
  large_file:
    title: Arquivo Grande

  # Invalid file warning dialog
  invalid_file:
    title: Arquivo Inválido

  # Warning dialog shown when files are rejected for more than one reason
  rejected_files:
    title: Os Arquivos Não Podem Ser Enviados

  # Photo credit dialog (stock photos)
  photo_credit:
    title: Crédito da Foto
    description: 'Use o seguinte crédito, se possível:'

  # Unsaved asset badge
  unsaved: Não Salvo

# Character counter: shows character count for text fields
character_counter:
  # {$count} is the current character count; {$min} and {$max} are configured limits
  min_max: |
    .input {$count :integer}
    .match $count
      0   {{ Nenhum caractere inserido. Mínimo: {$min}. Máximo: {$max}. }}
      one {{ {$count} caractere inserido. Mínimo: {$min}. Máximo: {$max}. }}
      *   {{ {$count} caracteres inseridos. Mínimo: {$min}. Máximo: {$max}. }}
  # {$count} is the current character count and {$min} is the minimum allowed count
  min: |
    .input {$count :integer}
    .match $count
      0   {{ Nenhum caractere inserido. Mínimo: {$min}. }}
      one {{ {$count} caractere inserido. Mínimo: {$min}. }}
      *   {{ {$count} caracteres inseridos. Mínimo: {$min}. }}
  # {$count} is the current character count and {$max} is the maximum allowed count
  max: |
    .input {$count :integer}
    .match $count
      0   {{ Nenhum caractere inserido. Máximo: {$max}. }}
      one {{ {$count} caractere inserido. Máximo: {$max}. }}
      *   {{ {$count} caracteres inseridos. Máximo: {$max}. }}

# YouTube video player iframe title
youtube_video_player: Player de vídeo do YouTube

# Date/time field: quick action buttons
today: Hoje
now: Agora

# Rich-text editor: component field labels
editor_components:
  image: Imagem
  src: Origem
  alt: Texto Alternativo
  title: Título
  link: Link

# Key-Value field: column headers and validation
key_value:
  key: Chave
  value: Valor
  action: Ação
  empty_key: A chave é obrigatória.
  duplicate_key: A chave deve ser única.

# Map field: location search and geolocation
find_place: Encontrar um Local
use_your_location: Usar Sua Localização

# Geolocation error dialog
geolocation_error_title: Erro de Geolocalização
geolocation_error_body: Ocorreu um erro ao obter sua localização.
geolocation_unsupported: A API de Geolocalização não é suportada por este navegador.

# Boolean field: display labels
# Note that the keys must be quoted strings to avoid being interpreted as YAML booleans
boolean:
  'true': Sim
  'false': Não

# ==============================================================================
# Cloud Storage Services
# ==============================================================================
# Strings for external cloud storage service integrations.

cloud_storage:
  # Configuration error
  invalid: O serviço não está configurado corretamente.

  # Authentication states
  auth:
    api_key:
      key_label: Chave de API
      # {$key} is the credential label, e.g., API Key, and {$service} is the cloud service name
      initial: Insira sua {$key} do {$service}.
      requested: Validando…
      # {$key} is the credential label the user entered, e.g., API Key
      error: A {$key} fornecida é inválida. Verifique e tente novamente.
    password:
      # {$service} is the cloud service name
      initial: Insira sua senha do {$service}.
      requested: Entrando…
      error: Nome de usuário ou senha incorretos. Verifique e tente novamente.

  # Service-specific configurations
  cloudinary:
    iframe_title: Biblioteca de mídia do Cloudinary
    activate:
      button_label: Ativar Cloudinary
      description: Depois de entrar, clique no botão Entrar novamente para continuar.
    auth_key_label: API Secret
    open_library: Abrir Cloudinary

  uploadcare:
    auth_key_label: API Secret Key

  aws_s3:
    auth_key_label: Secret Access Key

  cloudflare_r2:
    auth_key_label: Secret Access Key

  digitalocean_spaces:
    auth_key_label: Secret Access Key

# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Há um erro na configuração do CMS. Resolva o problema e tente novamente. }}
      *   {{ Há erros na configuração do CMS. Resolva os problemas e tente novamente. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: 'coleção {$collection}'
    file: 'arquivo {$file}'
    component: 'componente {$component}'
    # Don’t localize `{$field}`
    field: 'campo `{$field}`'

  # Configuration error messages
  error:
    no_secure_context: O Sveltia CMS só funciona com URLs HTTPS ou localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ A URL do arquivo de configuração deve usar o protocolo HTTPS ou um endereço localhost. }}
        *   {{ As URLs do arquivo de configuração devem usar o protocolo HTTPS ou endereços localhost. }}
    fetch_failed: Não foi possível obter o arquivo de configuração.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: A resposta HTTP retornou com o status {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Não foi possível obter o arquivo de configuração. Para impedir o carregamento do arquivo `config.yml`, adicione <a>`load_config_file: false`</a> ao objeto de configuração passado para `CMS.init()`.'
    parse_failed: Não foi possível analisar o arquivo de configuração.
    parse_failed_invalid_object: O arquivo de configuração não é um objeto JavaScript válido.
    parse_failed_unsupported_type: O arquivo de configuração não é um tipo de arquivo válido. Somente YAML, TOML e JSON são suportados.
    no_collection: Nenhuma coleção está definida.
    # Don’t localize `hide`
    no_visible_collection: Pelo menos uma coleção deve estar visível. Verifique a opção `hide`.
    missing_backend: O backend não está definido.
    missing_backend_name: O nome do backend não está definido.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: O backend {$name} <a>não é suportado</a> no Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: O backend obsoleto {$name} <a>não é suportado</a> no Sveltia CMS.
    unsupported_custom_backend: Backends personalizados <a>não são suportados</a> no Sveltia CMS.
    unsupported_backend_suggestion: Use um dos <a>backends suportados</a>.
    missing_repository: O repositório não está definido.
    invalid_repository: O repositório configurado é inválido. Deve estar no formato “owner/repo”.
    oauth_implicit_flow: O método de autenticação configurado (implicit flow) não é suportado no Sveltia CMS. Use um <a>método de autenticação</a> diferente.
    github_pkce_unsupported: A autorização PKCE ainda não é suportada devido a limitações do GitHub. Use um <a>método de autenticação</a> diferente.
    oauth_no_app_id: O ID do aplicativo OAuth não está definido.
    # Don’t localize `open_authoring` and `editorial_workflow`
    open_authoring_no_workflow: A opção `open_authoring` requer o modo de publicação `editorial_workflow`. Consulte a <a>documentação</a> para mais detalhes.
    # Don’t localize `auth_methods`
    no_auth_methods: A opção `auth_methods` deve conter pelo menos um método.
    missing_media_folder: A pasta de mídia não está definida.
    public_folder_relative_path: A pasta pública configurada é inválida. Deve ser um caminho absoluto começando com “/”.
    public_folder_absolute_url: Uma URL absoluta para a opção de pasta pública não é suportada no Sveltia CMS.
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: A opção `transformations` contém uma chave `{$key}` não suportada. Ela deve ser `raster_image`, `svg` ou um formato de imagem rasterizada suportado.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: A opção `quality` da transformação `{$key}` é inválida. Ela deve ser um inteiro entre 0 e 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: A opção `{$prop}` da transformação `{$key}` é inválida. Ela deve ser um inteiro positivo.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: A coleção de recursos {$count} deve ter a opção `name` definida como uma string não vazia.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: O nome da coleção de recursos `{$name}` é inválido. Não deve conter caracteres especiais.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Os nomes das coleções de recursos devem ser únicos, mas `{$name}` é usado mais de uma vez.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_no_options: A coleção deve ter uma das opções `folder`, `files` ou `divider` definida.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_multiple_options: A coleção não pode ter as opções `folder`, `files` e `divider` juntas.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: A extensão `{$extension}` não corresponde ao formato `{$format}`.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: O template de slug `{$slug}` é inválido pois não pode conter barras. Para organizar entradas em subpastas, use a opção `path` em vez de `slug`.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: A opção `reorder` faz referência a um grupo de visualização chamado `{$name}`, mas nenhum grupo com esse nome está definido na opção `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: A opção `sortable_fields` faz referência a um campo chamado `{$name}`, mas nenhum campo com esse nome está definido na coleção.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: A opção `view_groups` faz referência a um campo chamado `{$name}`, mas nenhum campo com esse nome está definido na coleção.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: A opção `view_filters` faz referência a um campo chamado `{$name}`, mas nenhum campo com esse nome está definido na coleção.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: O grupo de visualização {$count} deve ter a opção `name` definida como uma string não vazia.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: O nome do grupo de visualização `{$name}` é inválido. Ele não pode conter caracteres especiais.
    duplicate_view_group_name: Os nomes dos grupos de visualização devem ser únicos, mas `{$name}` é usado mais de uma vez.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: O filtro de visualização {$count} deve ter a opção `name` definida como uma string não vazia.
    # {$name} is the invalid or duplicate view filter name
    invalid_view_filter_name: O nome do filtro de visualização `{$name}` é inválido. Ele não pode conter caracteres especiais.
    duplicate_view_filter_name: Os nomes dos filtros de visualização devem ser únicos, mas `{$name}` é usado mais de uma vez.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: A coleção {$count} deve ter a opção `name` definida como uma string não vazia.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: O nome da coleção `{$name}` é inválido. Não deve conter caracteres especiais.
    duplicate_collection_name: Os nomes das coleções devem ser únicos, mas `{$name}` é usado mais de uma vez.
    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
    missing_collection_file_name: O arquivo de coleção {$count} deve ter a opção `name` definida como uma string não vazia.
    # {$name} is the invalid or duplicate collection file name
    invalid_collection_file_name: O nome do arquivo de coleção `{$name}` é inválido. Não deve conter caracteres especiais.
    duplicate_collection_file_name: Os nomes dos arquivos de coleção devem ser únicos, mas `{$name}` é usado mais de uma vez.
    # Don’t localize `fields`
    collection_no_fields: A coleção deve ter a opção `fields` definida com pelo menos um campo.
    # Don’t localize `fields`
    collection_file_no_fields: O arquivo de coleção deve ter a opção `fields` definida com pelo menos um campo.
    # Don’t localize `i18n`, `locale` and `file`
    collection_file_i18n_required: O arquivo de coleção deve ter a opção `i18n` definida se o placeholder `locale` for usado no caminho `file`.
    # {$count} is the 1-based field index in the current fields array; Don’t localize `name`
    missing_field_name: O campo {$count} deve ter a opção `name` definida como uma string não vazia.
    # {$name} is the invalid or duplicate field name
    invalid_field_name: O nome do campo `{$name}` é inválido. Não deve conter caracteres especiais. Se você quiser aninhar campos, <a>use campos Object em vez de notação de ponto</a>.
    duplicate_field_name: Os nomes dos campos devem ser únicos, mas `{$name}` é usado mais de uma vez.
    # {$count} is the 1-based variable type index in the current types array
    missing_variable_type: O tipo de variável {$count} deve ter a opção `name` definida como uma string não vazia.
    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: O nome do tipo de variável `{$name}` é inválido. Não deve conter caracteres especiais.
    duplicate_variable_type: Os nomes dos tipos de variável devem ser únicos, mas `{$name}` é usado mais de uma vez.
    date_field_type: 'O tipo de campo Date, que está obsoleto, não é suportado no Sveltia CMS. Use o tipo de campo DateTime com a opção `type: date`.'
    # {$timeZone} is the invalid IANA timezone identifier from the configuration
    invalid_timezone: 'Fuso horário inválido: {$timeZone}. Deve ser um identificador de fuso horário IANA válido, como `America/New_York` ou `Asia/Tokyo`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: A opção obsoleta `{$prop}` não é suportada no Sveltia CMS. Use a opção `{$newProp}`.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: A opção `allow_multiple` não é suportada no Sveltia CMS. Use a opção `multiple`, que tem `false` como padrão.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: O campo List não pode ter as opções `field`, `fields` e `types` juntas.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: O tipo de variável do campo List é inválido. A opção `widget` está definida como `{$widget}`, mas deve ser `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: O campo Object não pode ter as opções `fields` e `types` juntas.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: A coleção `{$collection}` referenciada é inválida ou não está definida.
    relation_field_invalid_collection_file: O arquivo `{$file}` referenciado é inválido ou não está definido.
    # Don’t localize `file`
    relation_field_missing_file_name: A opção `file` deve estar definida para uma relação com uma coleção de arquivos.
    relation_field_invalid_value_field: O campo de valor `{$field}` referenciado é inválido ou não está definido.
    unexpected: Erro inesperado

    # Schema validation errors, reported when the configuration doesn’t match the published JSON
    # schema. In all of these, {$option} is a configuration option path such as `backend.name` or
    # `view_filters[0].pattern`, relative to the collection, file or field named before it.
    # {$type} is a value type name from `schema_value_type` below
    schema_invalid_type: A opção `{$option}` deve ser {$type}.
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'A opção `{$option}` deve ser um destes valores: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: A opção `{$option}` deve ser `{$value}`.
    schema_invalid_empty_value: A opção `{$option}` deve ser uma string vazia.
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: A opção `{$option}` deve ser um array com {$count} itens.
    schema_invalid_value: A opção `{$option}` tem um valor inválido.
    schema_missing_option: A opção `{$option}` é obrigatória.
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Uma destas opções é obrigatória: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: uma string
      number: um número
      integer: um inteiro
      boolean: um booleano
      array: um array
      object: um objeto
      'null': vazia

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: O ID do aplicativo OAuth não está definido. Os usuários precisarão fornecer um token de acesso para entrar.
    editorial_workflow_unsupported: O fluxo de trabalho editorial ainda não é suportado no Sveltia CMS.
    open_authoring_unsupported_backend: No momento, o Open Authoring é suportado apenas com o backend do GitHub.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: A opção `{$prop}` não é suportada no Sveltia CMS. Ela será ignorada.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: As opções `picker_utc` e as novas opções de fuso horário (`input_timezone` ou `output_utc`) estão definidas juntas. As novas opções têm precedência. Considere remover `picker_utc` da sua configuração.
    # Don’t localize `preview_path`
    preview_path_no_date_field: A opção `preview_path` usa tags de data e hora, mas a coleção não tem nenhum campo DateTime de onde lê-las, então o link de pré-visualização não será exibido.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: A opção `preview_path_date_field` faz referência a um campo chamado `{$name}`, mas nenhum campo DateTime com esse nome está definido, então o link de pré-visualização não será exibido.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: A opção `preview_path` faz referência a `{$name}`, mas nenhum campo com esse nome está definido na coleção, então o link de pré-visualização não será exibido.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: A opção `{$option}` não está definida no esquema de configuração do Sveltia CMS. Ela será ignorada. Verifique se há um erro de digitação ou de sintaxe.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Veja as notas de compatibilidade para mais detalhes: {$link}'

  # Console tip shown after config load
  schema_tip: Para uma melhor experiência de desenvolvimento, você pode validar seu arquivo de configuração com o schema JSON do Sveltia CMS. Veja {$link} para mais detalhes.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Local
  # Browser compatibility warnings
  unsupported_browser: O Fluxo de Trabalho Local não é suportado no seu navegador. Use o Chrome ou o Edge.
  disabled: O Fluxo de Trabalho Local está desativado no seu navegador. <a>Veja como ativá-lo</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Você está agora visualizando o quadro do fluxo de trabalho editorial. Rascunhos: {$draft}. Em revisão: {$review}. Prontos: {$ready}. Exclusão pendente: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Você está agora visualizando o quadro do fluxo de trabalho editorial. Rascunhos: {$draft}. Em revisão: {$review}. Exclusão pendente: {$deletion}.'

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Column headings for the Editorial Workflow feature (content review process).

status:
  draft: Rascunho
  drafts: Rascunhos
  in_review: Em Revisão
  ready: Pronto
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Exclusão Pendente

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Cancelar Exclusão
  confirm_cancelling_deletion: Tem certeza de que deseja cancelar esta exclusão? A entrada permanecerá publicada.
  confirm_completing_deletion: Tem certeza de que deseja excluir esta entrada? Ela será removida imediatamente.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ Entrada marcada para exclusão. }}
      *   {{ {$count} entradas marcadas para exclusão. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Alterações descartadas. }}
      *   {{ Alterações em {$count} entradas descartadas. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Cancelando Exclusão…
  deletion_cancelled: Exclusão cancelada.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Não foi possível cancelar a exclusão. Tente novamente.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Entradas Não Publicadas
  published_entries: Entradas Publicadas
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Status: {$status}'
  change_entry_status: Alterar Status da Entrada
  # Editor toolbar: progress label while the status is being changed
  changing_status: Alterando Status…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Atualizando Status…
  status_updated: Status atualizado.
  # Error notification when the status could not be changed
  status_change_failed: Não foi possível alterar o status. Tente novamente.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: A entrada contém erros. Corrija-os antes de alterar o status.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: A entrada contém erros. Corrija-os antes de publicá-la.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Enviar para Revisão
  confirm_sending_for_review: Suas alterações foram salvas como rascunho. Deseja enviar a entrada para revisão para que alguém possa analisá-la e publicá-la?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Publicar Entrada
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Descartar Alterações
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Tem certeza de que deseja excluir esta entrada? Ela só será removida quando a exclusão for publicada. Até lá, você ainda a encontrará na lista de entradas, marcada como “Exclusão Pendente”.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Esta entrada ainda não foi publicada, então excluí-la a descartará completamente.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Esta entrada tem alterações não publicadas. Descartá-las restaurará a versão publicada. A entrada em si não será excluída.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Ela ainda não foi publicada, então suas alterações não publicadas serão descartadas. Qualquer versão publicada permanecerá publicada. }}
      *   {{ Elas ainda não foram publicadas, então suas alterações não publicadas serão descartadas. Quaisquer versões publicadas permanecerão publicadas. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ Uma delas ainda não foi publicada, então suas alterações não publicadas serão descartadas. Qualquer versão publicada permanecerá publicada. }}
      *   {{ {$count} delas ainda não foram publicadas, então suas alterações não publicadas serão descartadas. Quaisquer versões publicadas permanecerão publicadas. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry: Tem certeza de que deseja publicar esta entrada? Suas alterações entrarão em vigor imediatamente.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Publicando Entrada…
  entry_published: Entrada publicada.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Excluindo Entrada…
  discarding_changes: Descartando Alterações…
  entry_deleted: Entrada excluída.
  # Error notification when publishing fails
  publishing_entry_failed: Não foi possível publicar a entrada. Tente novamente.
  # Workflow page: empty column message
  no_entries: Nenhuma entrada.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Arraste para alterar o status

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Fazer Fork do Repositório
  fork: Fazer Fork
  confirm_forking_repository: Para sugerir alterações em “{$repo}”, é preciso criar um fork do repositório na sua conta. Suas alterações são salvas nesse fork e um mantenedor as revisa antes de serem publicadas.
  # Error shown when the user declined the dialog above
  fork_declined: Você precisa de um fork do repositório na sua conta para sugerir alterações.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Não foi possível criar um fork do repositório “{$repo}” na sua conta.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Não foi possível verificar seu acesso ao repositório “{$repo}”. Tente novamente em instantes.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: O repositório “{$repo}” não permite forks. Peça a um mantenedor para habilitar forks nele.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Você tem um convite pendente para o repositório “{$repo}”. Aceite-o no GitHub e entre novamente.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Seu login não inclui acesso a repositórios privados, então o repositório “{$repo}” não pode ser lido. Peça a um mantenedor para verificar as configurações de autenticação do CMS.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Apenas um mantenedor pode publicar alterações neste site. Em vez disso, marque sua entrada como “Em Revisão” e alguém dará uma olhada.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Esta alteração não pode ser feita diretamente. Apenas edições em entradas podem ser sugeridas para revisão.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Suas alterações são salvas no seu fork deste repositório em “{$repo}” e revisadas antes de serem publicadas.
  view_fork: Ver Fork

