  .input {$quota :integer}
  .match $quota
    one {{ Você não pode adicionar novas entradas a esta coleção porque ela atingiu o limite de {$quota} entrada. }}
    *   {{ Você não pode adicionar novas entradas a esta coleção porque ela atingiu o limite de {$quota} entradas. }}
