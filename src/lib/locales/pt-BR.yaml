  # Error shown when the changes couldn’t be prepared. {$name} is the singular label of the collection
  edit_failed: Não foi possível aplicar as alterações na entrada de {$name}. Verifique o console do navegador para mais detalhes.
  # Error shown when the changes would move the entry to another file path, e.g. through a path
  # template using a field. {$name} is the singular label of the collection
  move_unsupported: Essas alterações moveriam a entrada de {$name} para outro local, o que só pode ser feito editando-a separadamente.
  # Error shown when saving, if someone else has changed an entry edited from the field since. {$name}
  # is the summary of that entry
  edit_conflict: A entrada “{$name}” foi alterada por outra pessoa desde que você a editou. Abra-a novamente a partir do campo para revisar suas alterações em relação à versão mais recente.
  # Error shown when saving, if someone else has deleted an entry edited from the field since.
  # {$name} is the summary of that entry
  edit_deleted: A entrada “{$name}” foi excluída por outra pessoa desde que você a editou. Remova-a do campo para salvar a entrada.
  # Accessible label of the menu listing the selected entries that can be edited
  select_entry_to_edit: Selecionar uma Entrada para Editar
  # Warning shown in the editor of an entry that has been edited from a Relation field of another
  # entry, while the changes wait in that entry’s pull request. {$name} is the summary of that
  # entry
  edited_with_entry: As alterações nesta entrada estão aguardando para serem publicadas junto com “{$name}”. Se você salvá-la agora, os dois conjuntos de alterações serão combinados quando aquela entrada for publicada, o que pode falhar se eles se sobrepuserem.
  # Warning shown in the dialog when an entry edited from the field has been changed by someone else
  # since. {$name} is the singular label of the collection
  changed_since_edit: Esta entrada de {$name} foi alterada por outra pessoa desde que você a editou. Suas alterações são exibidas sobre a versão mais recente. Revise-as antes de atualizar.

# Select Assets dialog
assets_dialog:
  # Dialog titles for different selection modes
  title:
    file: Selecionar Arquivo
    image: Selecionar Imagem
    folder: Selecionar Pasta

  # Search input labels
  search_for_file: Pesquisar Arquivos
  search_for_image: Pesquisar Imagens

  # Locations panel aria-label
  locations: Locais

  # Folder selection mode for a File field with the `select_folder` option. {$path} is the public
  # path of the folder to be selected, and {$count} is the number of folders selected
  selected_folder: 'Pasta selecionada: {$path}'
  selected_folders: |
    .input {$count :integer}
    .match $count
      one {{ {$count} pasta selecionada }}
      *   {{ {$count} pastas selecionadas }}
  no_subfolders: Esta pasta não tem subpastas.
  # Shown for a cloud storage service whose `prefix` option depends on fields of the entry
  prefix_unresolved: Preencha os campos dos quais este local depende para navegar e enviar seus arquivos.

  # Asset folder options
  folder:
    field: Recursos do Campo
    entry: Recursos da Entrada
    file: Recursos do Arquivo
    collection: Recursos da Coleção
    global: Recursos Globais

  # Error messages
  error:
    invalid_key: Sua chave de API é inválida ou expirou. Verifique e tente novamente.
    search_fetch_failed: Ocorreu um erro ao pesquisar recursos. Tente novamente mais tarde.
    image_fetch_failed: Ocorreu um erro ao baixar o recurso selecionado. Tente novamente mais tarde.

  # Stock photo panels
  available_images: Imagens Disponíveis
  available_files: Arquivos Disponíveis

