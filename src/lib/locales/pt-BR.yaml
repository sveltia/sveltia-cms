# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Há um erro na configuração do CMS. Resolva o problema e tente novamente. }}
      *   {{ Há erros na configuração do CMS. Resolva os problemas e tente novamente. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: coleção {$collection}
    file: arquivo {$file}
    component: componente {$component}
    # Don’t localize `{$field}`
    field: campo `{$field}`

  # Configuration error messages
  error:
    no_secure_context: O Sveltia CMS só funciona com URLs HTTPS ou localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ A URL do arquivo de configuração deve usar o protocolo HTTPS ou um endereço localhost. }}
        *   {{ As URLs do arquivo de configuração devem usar o protocolo HTTPS ou endereços localhost. }}
    fetch_failed: Não foi possível obter o arquivo de configuração.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: A resposta HTTP retornou com o status {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Não foi possível obter o arquivo de configuração. Para impedir o carregamento do arquivo `config.yml`, adicione <a>`load_config_file: false`</a> ao objeto de configuração passado para `CMS.init()`.'
    parse_failed: Não foi possível analisar o arquivo de configuração.
    parse_failed_invalid_object: O arquivo de configuração não é um objeto JavaScript válido.
    parse_failed_unsupported_type: O arquivo de configuração não é um tipo de arquivo válido. Somente YAML, TOML e JSON são suportados.
    no_collection: Nenhuma coleção está definida.
    # Don’t localize `hide`
    no_visible_collection: Pelo menos uma coleção deve estar visível. Verifique a opção `hide`.
    missing_backend: O backend não está definido.
    missing_backend_name: O nome do backend não está definido.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: O backend {$name} <a>não é suportado</a> no Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: O backend obsoleto {$name} <a>não é suportado</a> no Sveltia CMS.
    unsupported_custom_backend: Backends personalizados <a>não são suportados</a> no Sveltia CMS.
    unsupported_backend_suggestion: Use um dos <a>backends suportados</a>.
    missing_repository: O repositório não está definido.
    invalid_repository: O repositório configurado é inválido. Deve estar no formato “owner/repo”.
    # Don’t localize `api_root`
    missing_api_root: A opção `api_root` não está definida. Ela é obrigatória para o backend Forgejo.
    invalid_root_dir: O diretório raiz é inválido. Ele deve ser um caminho dentro do repositório, sem “..”.
    invalid_root_dir_branch: O diretório raiz não pode ser usado nos nomes de branch dos modos de publicação `editorial_workflow` e `preview`. Nenhuma parte do caminho pode começar com um ponto, terminar com “.lock” ou conter um espaço ou um caractere especial, como dois-pontos ou asterisco.
    path_outside_root_dir: O caminho “{$path}” leva para fora do diretório raiz, onde o CMS não consegue listar arquivos.
    oauth_implicit_flow: O método de autenticação configurado (implicit flow) não é suportado no Sveltia CMS. Use um <a>método de autenticação</a> diferente.
    github_pkce_unsupported: A autorização PKCE ainda não é suportada devido a limitações do GitHub. Use um <a>método de autenticação</a> diferente.
    additions_no_base_url: A opção `base_url` deve ser a URL do seu serviço Sveltia CMS Additions.
    oauth_no_app_id: O ID do aplicativo OAuth não está definido.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: A opção `open_authoring` requer o modo de publicação `editorial_workflow` ou `preview`. Consulte a <a>documentação</a> para mais detalhes.
    # Don’t localize `auth_methods`
    no_auth_methods: A opção `auth_methods` deve conter pelo menos um método.
    # Don’t localize `auth_scope`, `repo` and `public_repo`
    auth_scope_no_repo: A opção `auth_scope` deve incluir `repo` ou `public_repo`.
    missing_media_folder: A pasta de mídia não está definida.
    public_folder_relative_path: A pasta pública configurada é inválida. Deve ser um caminho absoluto começando com “/”.
    public_folder_absolute_url: Uma URL absoluta para a opção de pasta pública não é suportada no Sveltia CMS.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: A opção `{$option}` contém a tag de template `{$tag}`, que não é suportada nela. Somente as tags de template de slug, como `\{\{slug\}\}` e `\{\{year\}\}`, e as tags `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` e `\{\{public_folder\}\}` podem ser usadas.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: A opção `{$option}` contém a tag de template `{$tag}`, que só pode ser usada na opção de uma coleção, de um arquivo de coleção ou de um campo, onde há uma entrada para preenchê-la.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: A opção `sanitize_replacement` está definida como `{$replacement}`, mas contém um caractere que não pode ser usado em um slug, então não pode substituir um.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: A opção `{$option}` está definida como `{$url}`, mas deve ser uma URL absoluta começando com `https://` ou `http://`.
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: A opção `stages` de `publish_mode` deve começar com `draft` e listar as etapas na ordem `draft`, `pending_review`, `pending_publish`, sem repetir nenhuma.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: A opção `i18n.locales` deve listar pelo menos um idioma.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: A opção `default_locale` está definida como `{$locale}`, mas esse valor não está entre os `locales`.
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: A opção `initial_locales` contém `{$locale}`, mas esse valor não está entre os `locales`.
    # Don’t localize `i18n`
    i18n_no_collections: 'A opção `i18n` está configurada no nível superior, mas nenhuma das coleções ou arquivos únicos tem a opção `i18n`, então nenhum conteúdo pode ser traduzido. Adicione `i18n: true` às coleções e arquivos únicos a serem traduzidos.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: A opção `transformations` contém uma chave `{$key}` não suportada. Ela deve ser `raster_image`, `svg` ou um formato de imagem rasterizada suportado.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: A opção `quality` da transformação `{$key}` é inválida. Ela deve ser um inteiro entre 0 e 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: A opção `{$prop}` da transformação `{$key}` é inválida. Ela deve ser um inteiro positivo.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: A coleção de recursos {$count} deve ter a opção `name` definida como uma string não vazia.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: O nome da coleção de recursos `{$name}` é inválido. Não deve conter caracteres especiais.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Os nomes das coleções de recursos devem ser únicos, mas `{$name}` é usado mais de uma vez.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: A coleção deve ter uma das opções `folder`, `file`, `files` ou `divider` definida.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: A coleção não pode ter mais de uma das opções `folder`, `file`, `files` e `divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: A extensão `{$extension}` não corresponde ao formato `{$format}`.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: O campo `{$name}` é salvo como o corpo abaixo do front matter, que só pode conter texto, e não um número, um booleano, uma lista ou um objeto, como faz um campo `{$widget}`. Use um tipo de campo que contenha texto ou renomeie o campo.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
    # brackets are escaped with backslashes for MessageFormat 2
    invalid_collection_data_file: A opção `file` `{$file}` é inválida. Ela deve ser o caminho para um arquivo JSON, sem o placeholder `\{\{locale\}\}`.
    # {$prop} is the option name; Don’t localize `file`
    unsupported_collection_data_file_option: A opção `{$prop}` não é suportada em uma coleção com a opção `file`.
    # Don’t localize `file`, `publish_mode` and `simple`
    collection_data_file_workflow: O Fluxo de Trabalho Editorial e o Fluxo de Trabalho de Pré-visualização, incluindo a Autoria Aberta, não são suportados em uma coleção com a opção `file`. Defina a opção `publish_mode` da coleção como `simple`.
    # {$prop} is the option name; Don’t localize `file` and `slug`. The curly brackets are escaped
    # with backslashes for MessageFormat 2
    collection_data_file_slug_tag: A opção `{$prop}` não pode conter a tag `\{\{slug\}\}` em uma coleção com a opção `file`, pois o slug de uma entrada é a sua posição, que muda quando as entradas são reordenadas ou excluídas. Em vez disso, use um campo com um valor único.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: O template de slug `{$slug}` é inválido pois não pode conter barras. Para organizar entradas em subpastas, use a opção `path` em vez de `slug`.
    # {$name} is the field name from the configuration; Don’t localize `identifier_field`
    invalid_identifier_field: A opção `identifier_field` faz referência a `{$name}`, mas nenhum campo com esse nome está definido na coleção.
    # {$name} is the field name from the configuration; Don’t localize `filter`
    invalid_filter_field: A opção `filter` faz referência a `{$name}`, mas nenhum campo com esse nome está definido na coleção.
    # Don’t localize `filter`, `value` and `pattern`
    invalid_filter_no_condition: A opção `filter` deve ter a opção `value` ou `pattern` para comparar as entradas.
    # {$option} is an option name such as `slug` or `summary` and {$name} is the field name or template tag from the configuration
    option_field_not_found: A opção `{$option}` faz referência a `{$name}`, mas nenhum campo com esse nome está definido.
    # {$name} is the field name from the configuration and {$widget} is its field type; Don’t localize `thumbnail`
    thumbnail_field_not_media: A opção `thumbnail` faz referência a `{$name}`, mas ele deve ser um campo Image ou File, e não um campo `{$widget}`.
    # Don’t localize `inline` or `multiple`
    invalid_inline_component_fields: O modo `inline` requer um único campo Boolean, Color, DateTime, Number, Relation, Select ou String. Um campo Relation ou Select não pode ter a opção `multiple` ativada.
    # {$option} is an option name such as `pattern` or `filter` and {$pattern} is the configured pattern
    invalid_regex: A opção `{$option}` contém uma expressão regular inválida `{$pattern}`, que será ignorada.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: A opção `reorder` faz referência a um grupo de visualização chamado `{$name}`, mas nenhum grupo com esse nome está definido na opção `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit` and `fields`
    invalid_bulk_edit_field: A lista `fields` da opção `bulk_edit` faz referência a um campo chamado `{$name}`, mas nenhum campo de nível superior com esse nome está definido na coleção.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit`, `fields` and `multiple`
    unsupported_bulk_edit_field: O campo `{$name}` na lista `fields` da opção `bulk_edit` não pode ser editado em massa. Somente campos Boolean, Color, DateTime, Number, Relation, Select ou String que não sejam somente leitura, não tenham a opção `multiple` ativada e não sejam definidos automaticamente ao salvar são suportados.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: A opção `sortable_fields` faz referência a um campo chamado `{$name}`, mas nenhum campo com esse nome está definido na coleção.
    # Don’t localize `sortable_fields` and `default_sort`
    multiple_sortable_field_defaults: Somente um item da opção `sortable_fields` pode ter a opção `default_sort`.
    # {$option} is `table_columns` or `summary_fields`, and {$name} is the field name from the configuration
    invalid_table_column_field: A opção `{$option}` faz referência a um campo chamado `{$name}`, mas nenhum campo com esse nome está definido na coleção.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: A opção `view_groups` faz referência a um campo chamado `{$name}`, mas nenhum campo com esse nome está definido na coleção.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: A opção `view_filters` faz referência a um campo chamado `{$name}`, mas nenhum campo com esse nome está definido na coleção.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: O grupo de visualização {$count} deve ter a opção `name` definida como uma string não vazia.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: O nome do grupo de visualização `{$name}` é inválido. Ele não pode conter caracteres especiais.
    duplicate_view_group_name: Os nomes dos grupos de visualização devem ser únicos, mas `{$name}` é usado mais de uma vez.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: O filtro de visualização {$count} deve ter a opção `name` definida como uma string não vazia.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `pattern`, `eq` and `gte`
    invalid_view_filter_no_condition: O filtro de visualização {$count} deve ter a opção `pattern` ou uma opção de comparação, como `eq` ou `gte`, para comparar as entradas.
    # {$name} is the invalid or duplicate view filter name
    invalid_view_filter_name: O nome do filtro de visualização `{$name}` é inválido. Ele não pode conter caracteres especiais.
    duplicate_view_filter_name: Os nomes dos filtros de visualização devem ser únicos, mas `{$name}` é usado mais de uma vez.
    # {$name} is the default view group name from the configuration; Don’t localize `default` and `view_groups`
    invalid_view_group_default: A opção `default` de `view_groups` está definida como `{$name}`, mas nenhum grupo de visualização tem esse nome.
    # {$name} is the default view filter name from the configuration; Don’t localize `default` and `view_filters`
    invalid_view_filter_default: A opção `default` de `view_filters` está definida como `{$name}`, mas nenhum filtro de visualização tem esse nome.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: A coleção {$count} deve ter a opção `name` definida como uma string não vazia.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: O nome da coleção `{$name}` é inválido. Não deve conter caracteres especiais.
    duplicate_collection_name: Os nomes das coleções devem ser únicos, mas `{$name}` é usado mais de uma vez.
    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
