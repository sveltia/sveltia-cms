  unsupported_repository: Seu repositório usa um recurso do Git que o CMS não suporta, como um worktree vinculado, nomes de objetos SHA-256, o formato reftable, um índice esparso ou um índice na versão 3 ou 4, que a opção feature.manyFiles e o git add -N usam.
