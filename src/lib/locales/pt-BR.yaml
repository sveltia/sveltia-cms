# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: Este campo é obrigatório.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: A data/hora deve ser igual ou posterior a {$min}.
    date: A data deve ser igual ou posterior a {$min}.
    time: A hora deve ser igual ou posterior a {$min}.
    number: O valor deve ser maior ou igual a {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Você deve selecionar pelo menos {$min} opção. }}
        *   {{ Você deve selecionar pelo menos {$min} opções. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Você deve adicionar pelo menos {$min} item. }}
        *   {{ Você deve adicionar pelo menos {$min} itens. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: A data/hora deve ser igual ou anterior a {$max}.
    date: A data deve ser igual ou anterior a {$max}.
    time: A hora deve ser igual ou anterior a {$max}.
    number: O valor deve ser menor ou igual a {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ Você não pode selecionar mais de {$max} opção. }}
        *   {{ Você não pode selecionar mais de {$max} opções. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ Você não pode adicionar mais de {$max} item. }}
        *   {{ Você não pode adicionar mais de {$max} itens. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Você deve inserir pelo menos {$min} caractere. }}
      *   {{ Você deve inserir pelo menos {$min} caracteres. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ Você não pode inserir mais de {$max} caractere. }}
      *   {{ Você não pode inserir mais de {$max} caracteres. }}

  # Type validation errors
  type_mismatch:
    number: Insira um número.
    email: Insira um e-mail válido.
    url: Insira uma URL válida.

  # Value used for the same field in another entry of the collection
  value_not_unique: Este valor já é usado por outra entrada.
  # Key of a keyed List field item used for another item of the same list
  key_not_unique: Esta chave já é usada por outro item.
  # Key of a keyed List field item that is a whole number, which doesn’t keep its order in a map
  key_numeric: A chave não pode ser um número inteiro, pois os itens perderiam a ordem.

  # Custom field validation error
  invalid_value: Valor inválido.
  unexpected_error: Ocorreu um erro inesperado.

# ==============================================================================
# Entry Sidebar
# ==============================================================================
# Panels shown in the entry editor sidebar.

entry_sidebar:
  # Sidebar tab list aria-label
  sidebar_panels: Painéis Laterais

  # Validation panel: shows field validation errors
  validation:
    title: Validação
    placeholder: Os resultados da validação serão exibidos aqui.
    no_errors_found: Nenhum erro encontrado.
    # Button in the panel header that validates the entry on demand
    validate: Validar

  # Slug panel: shows the entry slug and lets the user edit it
  slug:
    title: Slug
    generated_on_save: O slug é gerado a partir do conteúdo da entrada quando ela é salva. Qualquer data e hora nele serão as do momento do salvamento.
    unavailable: Esta entrada não tem um slug.

  # History panel: shows entry commit history
  history:
    title: Histórico
    fetch_failed: Falha ao carregar o histórico.
    no_history: Nenhum histórico encontrado.

  # Backlinks panel: shows entries referencing this entry
  backlinks:
    title: Backlinks
    no_entries: Nenhuma entrada está referenciando esta entrada.

  # Tab label of a panel with a count, e.g. of comments. {$title} is the panel title
  title_with_count: '{$title} ({$count})'

# Status shown next to the Save button while an entry with many new files is being saved
# {$done} and {$total} are the number of files prepared and to prepare, or the number of commits
# made and the estimated number of commits in all
save_progress:
  preparing: 'Preparando arquivos: {$done} de {$total}'
  committing: 'Salvando no GitHub: {$done} de cerca de {$total} commits'

# Entry save error dialog
saving_entry:
  error:
    title: Erro
    description: Ocorreu um erro ao salvar a entrada. Tente novamente mais tarde.

# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: Entrada Alterada por Outra Pessoa
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} alterou esta entrada em {$date}, depois que você a abriu.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Esta entrada foi alterada no repositório depois que você a abriu.
  deleted: Esta entrada foi excluída do repositório depois que você a abriu.
  # Follows `modified_by` or `modified`
  overwrite_warning: Se você salvar agora, as alterações dessa pessoa serão perdidas.
  # Follows `deleted`
  recreate_warning: Se você salvar agora, a entrada será criada novamente.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Como a entrada está armazenada no mesmo arquivo que outras entradas, ela não pode ser salva por cima da alteração. Cancele a edição, abra a entrada novamente a partir da lista e faça suas edições.
  # OK button label
  save_anyway: Salvar Mesmo Assim
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: O repositório foi atualizado por outra pessoa durante o salvamento. Tente novamente.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Uma entrada armazenada no mesmo arquivo foi alterada por outra pessoa. Tente novamente.
  # {$path} is the file path
  array_file_invalid: O arquivo {$path} não pode ser atualizado, pois não contém uma lista válida de entradas.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
# repository while the user has it open. The change itself is described with the `save_conflict`
# strings above
remote_change:
  reload_entry: Recarregar Entrada
  # Confirmation shown before reloading when the user has unsaved changes
  confirm_reloading_entry: Tem certeza de que deseja recarregar a entrada? Suas alterações não salvas serão perdidas.

