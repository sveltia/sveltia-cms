    # {$step} is the configured value; Don’t localize `step`
    invalid_step: A opção `step` está definida como `{$step}`, mas deve ser maior que zero, ou `-1` para desativar o incremento.
    # Don’t localize `options`
    select_field_no_options: O campo Select deve ter pelo menos um item na opção `options`.
    # {$value} is the option value from the configuration; Don’t localize `options`
    select_field_duplicate_option: As `options` do campo Select devem ser únicas, mas `{$value}` é usado mais de uma vez.
    # {$value} is the default value from the configuration; Don’t localize `default` and `options`
    select_field_invalid_default: A opção `default` do campo Select está definida como `{$value}`, mas esse valor não está entre as `options`.
    # Don’t localize `fields` and `types`
    list_field_no_subfields: A opção `fields` ou `types` do campo List deve ter pelo menos um item. Omita a opção para uma lista de valores simples.
    # Don’t localize `default`, `fields` and `types`
    list_field_invalid_default_object: A opção `default` do campo List contém um objeto, mas cada item deve ser um valor simples porque o campo não tem `fields` nem `types`.
    # {$value} is the default item from the configuration; Don’t localize `default`, `fields` and `types`
    list_field_invalid_default_item: A opção `default` do campo List contém `{$value}`, mas cada item deve ser um objeto porque o campo tem `fields` ou `types`.
    # {$key} is a property name of the default item from the configuration; Don’t localize `default`
    list_field_invalid_default_key: A opção `default` do campo List contém um item com a propriedade `{$key}`, mas nenhum subcampo tem esse nome.
    # {$typeKey} is the configured type key, `type` by default; Don’t localize `default` and `types`
    list_field_default_missing_type: A opção `default` do campo List contém um item sem a propriedade `{$typeKey}`, que identifica um dos `types`.
    # {$typeKey} is the configured type key, `type` by default, and {$value} is its value in the default item; Don’t localize `default` and `types`
    list_field_invalid_default_type: A opção `default` do campo List contém um item cuja propriedade `{$typeKey}` é `{$value}`, mas esse valor não está entre os `types`.
    # Don’t localize `map_key_field`, `fields` and `types`
    list_field_map_key_no_subfields: A opção `map_key_field` do campo List requer a opção `fields` ou `types`, pois cada chave é obtida de um subcampo.
    # {$name} is the subfield name; Don’t localize `map_key_field`
    list_field_map_key_not_found: A opção `map_key_field` do campo List faz referência a `{$name}`, mas nenhum subcampo tem esse nome.
    # {$name} is the subfield name, and {$type} is the variable type name; Don’t localize `map_key_field`
    list_field_map_key_missing_in_type: A opção `map_key_field` do campo List faz referência a `{$name}`, mas o tipo `{$type}` não tem nenhum subcampo com esse nome.
    # {$name} is the subfield name, and {$widget} is its field type; Don’t localize `map_key_field`
    list_field_map_key_invalid_type: A opção `map_key_field` do campo List faz referência a `{$name}`, mas ele deve ser um campo String, Relation ou Select, e não um campo `{$widget}`.
    # {$name} is the subfield name; Don’t localize `map_key_field` and `multiple`
    list_field_map_key_multiple: A opção `map_key_field` do campo List faz referência a `{$name}`, mas o subcampo não pode aceitar vários valores, pois cada item precisa de uma única chave. Remova a opção `multiple` dele.
    # {$name} is the subfield name; Don’t localize `map_key_field`
    list_field_map_key_option_not_string: A opção `map_key_field` do campo List faz referência a `{$name}`, mas as opções do subcampo devem ter valores de string, pois cada chave é armazenada como string.
    # {$name} is the subfield name; Don’t localize `map_key_field` and `required`
    list_field_map_key_not_required: A opção `map_key_field` do campo List faz referência a `{$name}`, mas o subcampo não pode ser opcional, pois cada item precisa de uma chave. Remova a opção `required` dele.
    # {$name} is the subfield name; Don’t localize `map_key_field`, `i18n: false` and `i18n: duplicate`
    list_field_map_key_not_localized: 'A opção `map_key_field` do campo List faz referência a `{$name}`, mas o subcampo não pode ter `i18n: false`, pois os itens precisam de uma chave em todos os idiomas. Use `i18n: duplicate` ou remova a opção.'
    # Don’t localize `i18n`, `duplicate_if_empty`, `multiple` and `true`
    duplicate_if_empty_multiple: 'A opção `i18n: duplicate_if_empty` não é suportada em um campo com a opção `multiple`, então o campo funciona como um com `i18n: true`.'
    # Don’t localize `default` and `multiple`
    invalid_default_multiple: A opção `default` deve ser um array porque a opção `multiple` é `true`.
    invalid_default_single: A opção `default` deve ser um valor único, e não um array, porque a opção `multiple` não é `true`.
    # {$key} is a property name of the default object from the configuration; Don’t localize `default`
    object_field_invalid_default_key: A opção `default` do campo Object tem a propriedade `{$key}`, mas nenhum subcampo tem esse nome.
    # {$typeKey} is the configured type key, `type` by default; Don’t localize `default` and `types`
    object_field_default_missing_type: A opção `default` do campo Object não tem a propriedade `{$typeKey}`, que identifica um dos `types`.
    # {$typeKey} is the configured type key, `type` by default, and {$value} is its value in the default object; Don’t localize `default` and `types`
    object_field_invalid_default_type: A propriedade `{$typeKey}` da opção `default` do campo Object é `{$value}`, mas esse valor não está entre os `types`.
    # Don’t localize `default` and `output_code_only`
    code_field_invalid_default_object: A opção `default` do campo Code deve ser uma string porque a opção `output_code_only` é `true`.
    # {$key} is a property name of the default object, {$code} and {$lang} are the configured property names; Don’t localize `default` and `keys`
    code_field_invalid_default_key: A opção `default` do campo Code tem a propriedade `{$key}`, mas a opção `keys` só permite `{$code}` e `{$lang}`.
    # {$valueType} is the configured value type; Don’t localize `value` and `value_type`
    compute_field_invalid_expression: A opção `value` do campo Compute deve ser uma expressão aritmética válida, como `\{\{fields.price\}\} * \{\{fields.quantity\}\}`, porque a opção `value_type` é `{$valueType}`.
    # {$valueType} is the configured value type; Don’t localize `value` and `value_type`
    compute_field_uuid_in_expression: A opção `value` do campo Compute não pode usar uma tag de UUID como `\{\{uuid\}\}` porque a opção `value_type` é `{$valueType}`, o que a torna uma expressão aritmética.
    # {$value} is the default value and {$valueType} is the configured value type; Don’t localize `default` and `value_type`
    number_field_default_not_integer: A opção `default` do campo Number está definida como `{$value}`, mas deve ser um inteiro porque a opção `value_type` é `{$valueType}`.
    number_field_default_not_number: A opção `default` do campo Number está definida como `{$value}`, mas deve ser um número porque a opção `value_type` é `{$valueType}`.
    # Don’t localize `fields` and `types`
    object_field_no_subfields: A opção `fields` ou `types` do campo Object deve ter pelo menos um item.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: A coleção `{$collection}` referenciada é inválida ou não está definida.
    relation_field_invalid_collection_file: O arquivo `{$file}` referenciado é inválido ou não está definido.
    # Don’t localize `file`
    relation_field_missing_file_name: A opção `file` deve estar definida para uma relação com uma coleção de arquivos.
    relation_field_invalid_value_field: O campo de valor `{$field}` referenciado é inválido ou não está definido.
    # {$collection} is the referenced collection name; Don’t localize `file`, `value_field` and `slug`.
    # The curly brackets are escaped with backslashes for MessageFormat 2
    relation_field_array_file_slug: A relação com a coleção `{$collection}` não pode armazenar o valor `\{\{slug\}\}`, pois o slug de uma entrada em uma coleção com a opção `file` é a sua posição, que muda quando as entradas são reordenadas ou excluídas. Em vez disso, defina a opção `value_field` como um campo com um valor único.
    # {$collection} is the referenced collection name; Don’t localize `file`
    relation_field_array_file_workflow: Uma coleção com a opção `file` não pode ter uma relação com a coleção `{$collection}`, que usa o Fluxo de Trabalho Editorial ou o Fluxo de Trabalho de Pré-visualização, pois as referências a uma entrada renomeada ou excluída nela não podem ser atualizadas no arquivo.
    relation_field_invalid_display_field: O campo de exibição `{$field}` referenciado é inválido ou não está definido.
    relation_field_invalid_search_field: O campo de pesquisa `{$field}` referenciado é inválido ou não está definido.
    relation_field_invalid_filter_field: O campo de filtro `{$field}` referenciado é inválido ou não está definido.
    relation_field_invalid_sort_field: O campo de ordenação `{$field}` referenciado é inválido ou não está definido.
    # Don’t localize `sort_by` and `file`
    relation_field_sort_by_file_ignored: A opção `sort_by` não se aplica a uma relação com um arquivo, cujas opções seguem a ordem dos itens da lista. Ela será ignorada.
    unexpected: Erro inesperado

    # Schema validation errors, reported when the configuration doesn’t match the published JSON
    # schema. In all of these, {$option} is a configuration option path such as `backend.name` or
    # `view_filters[0].pattern`, relative to the collection, file or field named before it.
    # {$type} is a value type name from `schema_value_type` below
    schema_invalid_type: A opção `{$option}` deve ser {$type}.
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'A opção `{$option}` deve ser um destes valores: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: A opção `{$option}` deve ser `{$value}`.
    schema_invalid_empty_value: A opção `{$option}` deve ser uma string vazia.
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: A opção `{$option}` deve ser um array com {$count} itens.
    schema_invalid_value: A opção `{$option}` tem um valor inválido.
    schema_missing_option: A opção `{$option}` é obrigatória.
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Uma destas opções é obrigatória: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: uma string
      number: um número
      integer: um inteiro
      boolean: um booleano
      array: um array
      object: um objeto
      'null': vazia

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: O ID do aplicativo OAuth não está definido. Os usuários precisarão fornecer um token de acesso para entrar.
    # Don’t localize `prefix`
    site_library_prefix_template: A opção `prefix` de uma biblioteca de mídia contém tags de template, que só são suportadas no nível do campo, pois no nível superior não há nenhuma entrada para preenchê-las.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: A opção `{$prop}` não é suportada no Sveltia CMS. Ela será ignorada.
    # Don’t localize `stages`, `publish_mode`, `editorial_workflow` and {$type}, which is `preview` or `simple`
    publish_mode_stages_ignored: A opção `stages` de `publish_mode` só se aplica ao modo de publicação `editorial_workflow`, então é ignorada com `{$type}`.
    # Don’t localize `pattern`, `m` and `s`
    inline_component_multiline_pattern: O `pattern` deste componente inline tem a flag `m` ou `s` ou corresponde a quebras de linha, mas um componente inline só é reconhecido dentro de um parágrafo.
    # {$name} is a button or component name and {$option} is `buttons` or `editor_components`; Don’t localize them and `multiline: false`
    single_line_block_item: 'O item `{$name}` da opção `{$option}` é ignorado, pois um campo com `multiline: false` só pode conter conteúdo inline.'
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: As opções `picker_utc` e as novas opções de fuso horário (`input_timezone` ou `output_utc`) estão definidas juntas. As novas opções têm precedência. Considere remover `picker_utc` da sua configuração.
    # Don’t localize `localize_format` and `format`
    localize_format_without_format: A opção `localize_format` não tem efeito, porque o campo não tem a opção `format` e seu valor é armazenado no formato ISO 8601.
    # {$name} is a template tag like `fields.lines.*.price`; Don’t localize `value`, `*` and `sum()`
    compute_field_wildcard_without_item: A opção `value` do campo Compute faz referência a `{$name}`, mas o campo não está em um item da lista representada por `*`, então não resulta em nada. Somente uma função de agregação como `sum()` pode usar todos os itens de uma lista.
    # {$name} is a template tag like `fields.lines.*.amount`; Don’t localize `value`
    compute_field_self_reference: A opção `value` do campo Compute faz referência ao próprio campo como `{$name}`, então seu valor muda toda vez que é calculado e nunca se estabiliza.
    # {$name} is a template tag like `fields.total`; Don’t localize `value`
    compute_field_reference_cycle: A opção `value` do campo Compute faz referência a `{$name}`, outro campo Compute que faz referência de volta a este campo, diretamente ou por meio de outros campos, então seus valores nunca se estabilizam.
    # Don’t localize `localize_format`, `true` and `de`
    localize_format_without_i18n: A opção `localize_format` é `true`, mas a i18n não está ativada para a coleção, então o valor é escrito em inglês. Em vez disso, defina a opção como um código de idioma, como `de`.
    # {$locale} is the locale code from the configuration; Don’t localize `localize_format`
    localize_format_unsupported_locale: A opção `localize_format` está definida como `{$locale}`, que não é um idioma suportado, então o valor é escrito em inglês.
    # Don’t localize `preview_path`
    preview_path_no_date_field: A opção `preview_path` usa tags de data e hora, mas a coleção não tem nenhum campo DateTime de onde lê-las, então o link de pré-visualização não será exibido.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: A opção `preview_path_date_field` faz referência a um campo chamado `{$name}`, mas nenhum campo DateTime com esse nome está definido, então o link de pré-visualização não será exibido.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: A opção `preview_path` faz referência a `{$name}`, mas nenhum campo com esse nome está definido na coleção, então o link de pré-visualização não será exibido.
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: A coleção não tem um campo `{$name}` para nomear novas entradas, então cada nova entrada recebe um slug aleatório. Adicione um campo `{$name}` ou defina a opção `identifier_field` ou `slug`.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: A opção `i18n` de `slug` não tem efeito, porque a coleção não usa a estrutura de i18n `multiple_files`, `multiple_folders` ou `multiple_root_folders`, em que cada idioma tem seu próprio arquivo.
    # Don’t localize `slug`, `template` and `auto_increment`
    slug_template_ignored: A opção `template` de `slug` é ignorada, porque a opção `auto_increment` numera os slugs em vez disso.
    # {$file} is the file path; Don’t localize `file`, `locale`, `i18n`, `false`,
    # `omit_default_locale_from_file_path` and the example paths. The curly brackets in the examples
    # are escaped with backslashes for MessageFormat 2
    locale_not_omitted_from_file_path: O placeholder `locale` não pode ser removido do caminho `file` `{$file}`, então o idioma padrão é mantido nele apesar da opção de i18n `omit_default_locale_from_file_path`. Para omitir o idioma, use o placeholder como um nome de pasta completo, como `\{\{locale\}\}/about.md`, ou entre o nome do arquivo e a extensão, como `about.\{\{locale\}\}.md`. Para mantê-lo, defina a opção como `false` na opção `i18n` do arquivo.
    # Don’t localize `i18n`
    i18n_not_configured: A opção `i18n` está ativada, mas a i18n não está configurada no nível superior da configuração nem na coleção, então a opção não tem efeito.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: A opção `public_folder` é uma string vazia, então o caminho `media_folder` é usado nos caminhos de recursos salvos nas entradas. Remova a opção ou defina-a como o caminho que você deseja usar, como `/images`.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: A opção `{$option}` não está definida no esquema de configuração do Sveltia CMS. Ela será ignorada. Verifique se há um erro de digitação ou de sintaxe.
    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: A opção `default_localized` não tem efeito, porque a i18n não está ativada para a coleção. Em vez disso, use a opção `default`.
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: A opção `default_localized` tem um valor para `{$locale}`, que não é um dos idiomas da coleção, então o valor nunca é usado.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Veja as notas de compatibilidade para mais detalhes: {$link}'

  # Console tip shown after config load
  schema_tip: Para uma melhor experiência de desenvolvimento, você pode validar seu arquivo de configuração com o schema JSON do Sveltia CMS. Veja {$link} para mais detalhes.

