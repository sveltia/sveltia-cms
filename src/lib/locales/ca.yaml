# Column headings for the Editorial Workflow feature (content review process).

status:
  drafts: Esborranys
  in_review: En revisió
  ready: Llest

# ==============================================================================
# Settings Dialog
# ==============================================================================
# Strings for the settings/preferences dialog and its panels.

# Settings page aria-label
categories: Categories

# Site Configuration Editor
site_configuration_editor: Editor de configuració del lloc

# Preferences panels
prefs:
  # API key management feedback messages
  changes:
    api_key_saved: Clau API desada.
    api_key_removed: Clau API suprimida.
    api_key_invalid: La clau API proporcionada no és vàlida. Comproveu-la i torneu-ho a provar.

  # Preferences operation errors
  error:
    permission_denied: S’ha denegat l’accés a l’emmagatzematge de galetes. Comproveu els permisos del navegador i torneu-ho a provar.

  # Appearance panel
  appearance:
    title: Aparença
    theme: Tema
    select_theme: Selecciona un tema

  # Theme options
  theme:
    dark: Fosc
    light: Clar

  # Language panel
  language:
    title: Llengua
    ui_language:
      title: Llengua de la interfície
      select_language: Selecciona una llengua

  # Contents panel
  contents:
    title: Continguts
    editor:
      title: Editor
      use_draft_backup:
        switch_label: Fes còpia de seguretat automàtica dels esborranys d’entrada
      close_on_save:
        switch_label: Tanca l’editor després de desar un esborrany
      close_with_escape:
        switch_label: Tanca l’editor amb la tecla d’escapada (Esc)

  # Internationalization panel
  i18n:
    title: Internacionalització
    translators:
      default:
        title: Servei de traducció per defecte
        select_service: Selecciona un servei
      api_keys:
        title: Claus API dels serveis de traducció
        description: Gestionar les claus API per als <a>serveis de traducció</a>.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: 'Clau de {$service}'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Registrau-vos a <a {$homeHref}>{$service}</a> i introduïu <a {$apiKeyHref}>la vostra clau API</a> aquí per habilitar la traducció ràpida dels camps de text de les entrades.

  # Media panel
  media:
    title: Multimèdia
    stock_photos:
      api_keys:
        title: Claus API dels serveis de bancs d’imatges
        description: Gestionar les claus API per als <a>serveis de bancs d’imatges</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: 'Clau API de {$service}'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Registrau-vos a l’<a {$homeHref}>API de {$service}</a> i introduïu <a {$apiKeyHref}>la vostra clau API</a> aquí per inserir fotos de banc d’imatges gratuïtes als camps d’imatge de les entrades.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Fotos proporcionades per {$service}
      no_services: No hi ha cap <a>servei de banc d’imatges</a> configurat.
    cloud_storage:
      api_keys:
        title: Claus API dels serveis d’emmagatzematge al núvol
        description: Gestionar les claus API per als <a>serveis d’emmagatzematge al núvol</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: 'Clau API de {$service}'
      no_services: No hi ha cap <a>servei d’emmagatzematge al núvol</a> configurat.

  # Accessibility panel
  accessibility:
    title: Accessibilitat
    underline_links:
      title: Subratlla els enllaços
      description: Mostra el subratllat dels enllaços a la previsualització de l’entrada i a les etiquetes de la interfície d’usuari.
      switch_label: Subratlla sempre els enllaços

  # Advanced panel
  advanced:
    title: Avançat
    beta:
      title: Funcionalitats beta
      description: Habilita algunes funcionalitats beta que poden ser inestables o no localitzades.
      switch_label: Uneix-te al programa beta
    developer_mode:
      title: Mode de desenvolupador
      description: Habilita algunes funcionalitats orientades al desenvolupador, inclosos els registres detallats de la consola i els menús de context nadius.
      switch_label: Habilita el mode de desenvolupador
    deploy_hook:
      title: Ganxo de desplegament
      description: Introduïu un URL de webhook que es cridarà quan activeu manualment un desplegament seleccionant Publica els canvis. Es pot deixar en blanc si useu GitHub Actions.
      # Hook URL input
      url:
        field_label: URL del ganxo
        saved: URL del ganxo desat.
        removed: URL del ganxo suprimit.
      # Authorization header input
      auth:
        field_label: Capçalera d’autorització (p. ex., Bearer <testimoni>) (opcional)
        saved: Capçalera d’autorització desada.
        removed: Capçalera d’autorització suprimida.

