  # API key management feedback messages
  changes:
    api_key_saved: Clau API desada.
    api_key_removed: Clau API suprimida.
    api_key_invalid: La clau API proporcionada no és vàlida. Comproveu-la i torneu-ho a provar.

  # Preferences operation errors
  error:
    permission_denied: S’ha denegat l’accés a l’emmagatzematge de galetes. Comproveu els permisos del navegador i torneu-ho a provar.

  # Appearance panel
  appearance:
    title: Aparença
    theme: Tema
    select_theme: Selecciona un tema

  # Theme options
  theme:
    dark: Fosc
    light: Clar

  # Language panel
  language:
    title: Llengua
    ui_language:
      title: Llengua de la interfície
      select_language: Selecciona una llengua

  # Contents panel
  contents:
    title: Continguts
    editor:
      title: Editor
      use_draft_backup:
        switch_label: Fes còpia de seguretat automàtica dels esborranys d’entrada
      close_on_save:
        switch_label: Tanca l’editor després de desar un esborrany
      close_with_escape:
        switch_label: Tanca l’editor amb la tecla d’escapada (Esc)

  # Internationalization panel
  i18n:
    title: Internacionalització
    translators:
      default:
        title: Servei de traducció per defecte
        select_service: Selecciona un servei
      api_keys:
        title: Claus API dels serveis de traducció
        description: Gestionar les claus API per als <a>serveis de traducció</a>. Les claus API dels serveis d’IA genèrics es poden gestionar a la configuració d’IA.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: Clau de {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Registrau-vos a <a {$homeHref}>{$service}</a> i introduïu <a {$apiKeyHref}>la vostra clau API</a> aquí per habilitar la traducció ràpida dels camps de text de les entrades.

  # Media panel
  media:
    title: Multimèdia
    stock_photos:
      api_keys:
        title: Claus API dels serveis de bancs d’imatges
        description: Gestionar les claus API per als <a>serveis de bancs d’imatges</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: Clau API de {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Registrau-vos a l’<a {$homeHref}>API de {$service}</a> i introduïu <a {$apiKeyHref}>la vostra clau API</a> aquí per inserir fotos de banc d’imatges gratuïtes als camps d’imatge de les entrades.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Fotos proporcionades per {$service}
      no_services: No hi ha cap <a>servei de banc d’imatges</a> configurat.
    cloud_storage:
      api_keys:
        title: Claus API dels serveis d’emmagatzematge al núvol
        description: Gestionar les claus API per als <a>serveis d’emmagatzematge al núvol</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: Clau API de {$service}
      no_services: No hi ha cap <a>servei d’emmagatzematge al núvol</a> configurat.

  # AI panel
  ai:
    title: IA
    api_keys:
      title: Claus API dels serveis d’IA
      description: Gestionar les claus API per als serveis d’IA.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: Clau API de {$service}

  # Accessibility panel
  accessibility:
    title: Accessibilitat
    underline_links:
      title: Subratlla els enllaços
      description: Mostra el subratllat dels enllaços a la previsualització de l’entrada i a les etiquetes de la interfície d’usuari.
      switch_label: Subratlla sempre els enllaços

  # Data Management panel
  data:
    title: Gestió de dades
    clear_data:
      title: Esborra les dades
      # Clear File Cache button
      file_cache:
        description: Suprimeix el contingut dels fitxers i les miniatures d’imatges desats a la memòria cau local per alliberar espai d’emmagatzematge o resoldre problemes causats per dades obsoletes.
        button_label: Esborra la memòria cau de fitxers
        confirmation: Se suprimiran el contingut dels fitxers i les miniatures d’imatges desats a la memòria cau local. Els esborranys no desats i la configuració es conservaran, i les dades suprimides es tornaran a baixar o generar quan calgui. El CMS es tornarà a carregar quan acabi.
      # Erase All Data button
      all_data:
        description: Suprimeix tot el que el CMS guarda en aquest navegador, inclosos els fitxers a la memòria cau, els esborranys no desats i la configuració. El que ja estigui desat al repositori no es veurà afectat.
        button_label: Esborra totes les dades
        confirmation: Se suprimiran totes les dades emmagatzemades en aquest navegador, inclosos el contingut dels fitxers a la memòria cau, les miniatures d’imatges, els esborranys no desats, la configuració i l’estat de la sessió. El repositori no es veurà afectat, però es perdrà qualsevol canvi que no hàgiu desat i haureu de tornar a iniciar la sessió. El CMS es tornarà a carregar quan acabi.

  # Developer panel
  developer:
    title: Desenvolupador
    developer_mode:
      title: Mode de desenvolupador
      description: Habilita algunes funcionalitats orientades al desenvolupador, inclosos els registres detallats de la consola i els menús de context nadius.
      switch_label: Habilita el mode de desenvolupador
    local_git:
      title: Confirmacions de Git
      description: Confirmeu els vostres canvis a la branca actual del repositori local cada vegada que els deseu, tal com fa el CMS quan treballeu amb un repositori remot. Després podeu revisar i pujar les confirmacions amb les vostres eines de Git habituals.
      switch_label: Confirma els canvis a Git
      checking: S’està comprovant el repositori…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Els canvis es confirmaran a la branca {$branch} com a {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Ara mateix no es poden confirmar els canvis. {$reason}
    deploy_hook:
      title: Ganxo de desplegament
      description: Introduïu un URL de webhook que es cridarà quan activeu manualment un desplegament seleccionant Publica els canvis. Es pot deixar en blanc si useu GitHub Actions o GitLab CI/CD.
      # Hook URL input
      url:
        field_label: URL del ganxo
        saved: URL del ganxo desat.
        removed: URL del ganxo suprimit.
      # Authorization header input
      auth:
        field_label: Capçalera d’autorització (p. ex., Bearer <testimoni>) (opcional)
        saved: Capçalera d’autorització desada.
        removed: Capçalera d’autorització suprimida.

