# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: Aquest camp és obligatori.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: La data/hora ha de ser posterior o igual a {$min}.
    date: La data ha de ser posterior o igual a {$min}.
    time: L’hora ha de ser posterior o igual a {$min}.
    number: El valor ha de ser superior o igual a {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Heu de seleccionar almenys {$min} opció. }}
        *   {{ Heu de seleccionar almenys {$min} opcions. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Heu d’afegir almenys {$min} element. }}
        *   {{ Heu d’afegir almenys {$min} elements. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: La data/hora ha de ser anterior o igual a {$max}.
    date: La data ha de ser anterior o igual a {$max}.
    time: L’hora ha de ser anterior o igual a {$max}.
    number: El valor ha de ser inferior o igual a {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ No podeu seleccionar més de {$max} opció. }}
        *   {{ No podeu seleccionar més de {$max} opcions. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ No podeu afegir més de {$max} element. }}
        *   {{ No podeu afegir més de {$max} elements. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Heu d’introduir almenys {$min} caràcter. }}
      *   {{ Heu d’introduir almenys {$min} caràcters. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ No podeu introduir més de {$max} caràcter. }}
      *   {{ No podeu introduir més de {$max} caràcters. }}

  # Type validation errors
  type_mismatch:
    number: Introduïu un número.
    email: Introduïu un correu electrònic vàlid.
    url: Introduïu un URL vàlid.

  # Value used for the same field in another entry of the collection
  value_not_unique: Aquest valor ja s’usa per a una altra entrada.
  # Key of a keyed List field item used for another item of the same list
  key_not_unique: Aquesta clau ja s’usa per a un altre element.
  # Key of a keyed List field item that is a whole number, which doesn’t keep its order in a map
  key_numeric: La clau no pot ser un nombre enter, ja que els elements perdrien l’ordre.

  # Custom field validation error
  invalid_value: Valor no vàlid.
  unexpected_error: S’ha produït un error inesperat.

