      .input {$max :integer}
      .match $max
        one {{ No podeu seleccionar més de {$max} opció. }}
        *   {{ No podeu seleccionar més de {$max} opcions. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ No podeu afegir més de {$max} element. }}
        *   {{ No podeu afegir més de {$max} elements. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Heu d’introduir almenys {$min} caràcter. }}
      *   {{ Heu d’introduir almenys {$min} caràcters. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ No podeu introduir més de {$max} caràcter. }}
      *   {{ No podeu introduir més de {$max} caràcters. }}

