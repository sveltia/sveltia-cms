    cherry_pick: Hi ha una selecció de confirmacions (cherry-pick) en curs. Acabeu-la amb git cherry-pick --continue o cancel·leu-la amb git cherry-pick --abort.
    revert: Hi ha una reversió en curs. Acabeu-la amb git revert --continue o cancel·leu-la amb git revert --abort.
    am: Hi ha una aplicació de pedaços amb git am en curs. Acabeu-la amb git am --continue o cancel·leu-la amb git am --abort.
    conflict: Alguns fitxers tenen conflictes. Primer resoleu-los i prepareu-ne els resultats.
