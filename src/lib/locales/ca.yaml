  # entry
  edited_with_entry: Els canvis d’aquesta entrada estan pendents de publicar-se juntament amb «{$name}». Si la deseu ara, els dos conjunts de canvis es combinaran quan es publiqui aquella entrada, cosa que pot fallar si se superposen.
  # Warning shown in the dialog when an entry edited from the field has been changed by someone else
  # since. {$name} is the singular label of the collection
  changed_since_edit: Una altra persona ha modificat aquest element de tipus «{$name}» des que l’heu editat. Els vostres canvis es mostren sobre la versió més recent. Reviseu-los abans d’actualitzar.

