visit_live_site: Visita el lloc en línia
# Page switcher button group aria-label for switching between main sections
switch_page: Canvia de pàgina

# Search input placeholders
search_placeholder_contents: Cerqueu continguts…
search_placeholder_assets: Cerqueu recursos…
search_placeholder_all: Cerqueu continguts i recursos…

# Create button: aria-label for the create menu in the toolbar
create_entry_or_assets: Crea una entrada o recursos

# Publishing actions: button labels and progress indicators
publish_changes: Publica els canvis
publishing_changes: S’estan publicant els canvis…
# Error notification when publishing fails
publishing_changes_failed: No s’han pogut publicar els canvis. Torneu-ho a provar.

# Notifications: button aria-labels and section headings
show_notifications: Mostra les notificacions
notifications: Notificacions

# Account menu: button aria-labels and section headings
show_account_menu: Mostra el menú del compte
# Account section heading in the account menu and mobile menu page
account: Compte

# Account menu items: links to external resources
live_site: Lloc en línia
git_repository: Repositori Git
settings: Configuració

# Help menu: button aria-labels and section headings
show_help_menu: Mostra el menú d’ajuda
# Help section heading in dropdowns and mobile menu
help: Ajuda

# Help menu items: documentation and support resources
keyboard_shortcuts: Dreceres de teclat
documentation: Documentació
release_notes: Notes de la versió
announcements: Anuncis
# Version badge aria-label in the release notes menu item
# {$version} is the current app version string
version_x: 'Versió {$version}'
# Additional help menu items
report_issue: Informa d’un problema
share_feedback: Comparteix comentaris
get_help: Demana ajuda
donate: Feu un donatiu
join_discord: Uneix-te a nosaltres a Discord
bluesky: Segueix-nos a Bluesky

# Update notification: infobar message and button
update_available: La versió més recent de Sveltia CMS està disponible.
update_now: Actualitza ara

# Backend status notifications
# Shown when the Git backend (GitHub, GitLab, etc.) is experiencing issues
# {$service} is the backend service label shown in the toolbar notice, e.g., GitHub or GitLab
backend_status:
  minor_incident: '{$service} està patint una incidència menor. El vostre flux de treball es pot veure afectat.'
  major_incident: '{$service} està patint una incidència greu. Potser val més que espereu fins que la situació millori.'

# ==============================================================================
# Content and Asset Libraries
# ==============================================================================
# Strings used in the main content and asset management interfaces, including
# lists, navigation, and collection/folder views.

# Page container aria-labels
content_library: Biblioteca de continguts
asset_library: Biblioteca de recursos

# Primary sidebar section headings and list aria-labels
collections: Col·leccions
entries: Entrades
files: Fitxers

# Asset location selector: option group labels
asset_location:
  # Assets stored in the site’s Git repository
  repository: El vostre lloc
  external: Ubicacions externes
  stock_photos: Banc d’imatges

# Sidebar and list labels
# Collection assets panel aria-label
collection_assets: Recursos de la col·lecció
# List aria-labels for different list types
entry_list: Llista d’entrades
file_list: Llista de fitxers
asset_list: Llista de recursos

# Collection and folder page titles
# Used as aria-labels on page containers
# {$collection} is the current collection label
x_collection: Col·lecció «{$collection}»
# {$folder} is the current asset folder label
x_asset_folder: Carpeta de recursos «{$folder}»

# Navigation announcements (ARIA live regions)
# Announce page changes for screen reader users
viewing_collection_list: Ara esteu veient la llista de col·leccions.
viewing_asset_folder_list: Ara esteu veient la llista de carpetes de recursos.
# Collection view announcements with entry counts
# {$collection} is the collection label and {$count} is the number of entries in it
viewing_x_collection: |
  .input {$count :integer}
  .match $count
    0   {{ Ara esteu veient la col·lecció «{$collection}», que encara no té cap entrada. }}
    one {{ Ara esteu veient la col·lecció «{$collection}», que té una entrada. }}
    *   {{ Ara esteu veient la col·lecció «{$collection}», que té {$count} entrades. }}
# Asset folder view announcements with asset counts
# {$folder} is the folder label and {$count} is the number of assets in it
viewing_x_asset_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Ara esteu veient la carpeta de recursos «{$folder}», que encara no té cap recurs. }}
    one {{ Ara esteu veient la carpeta de recursos «{$folder}», que té un recurs. }}
    *   {{ Ara esteu veient la carpeta de recursos «{$folder}», que té {$count} recursos. }}

# Singleton file selection announcement
# {$file} is the singleton file name
singleton_selected_announcement: Premeu Retorn per editar el fitxer «{$file}».

# Error messages: collection or file not found
collection_not_found: No s’ha trobat la col·lecció.
file_not_found: No s’ha trobat el fitxer.

# Selection count indicator
# Shown in the toolbar when items are selected (e.g., “2 of 10 selected”)
# {$selected} is the selected item count and {$total} is the total item count
x_of_x_selected: '{$selected} de {$total} seleccionats'

# View switcher: toggle between list and grid views
switch_view: Canvia la vista
list_view: Vista de llista
grid_view: Vista de graella
switch_to_list_view: Canvia a la vista de llista
switch_to_grid_view: Canvia a la vista de graella

# ==============================================================================
