  # Note shown in the dialog. {$name} is the singular label of the referenced collection
  edit_together_hint: Els vostres canvis a l’element de tipus «{$name}» es desaran juntament amb l’entrada que esteu editant.
  # Error shown when the changes couldn’t be prepared. {$name} is the singular label of the collection
  edit_failed: No s’han pogut aplicar els canvis a l’element de tipus «{$name}». Comproveu la consola del navegador per a més detalls.
  # Error shown when the changes would move the entry to another file path, e.g. through a path
  # template using a field. {$name} is the singular label of the collection
  move_unsupported: Aquests canvis mourien l’element de tipus «{$name}» a una altra ubicació, cosa que només es pot fer editant-lo per separat.
  # Error shown when saving, if someone else has changed an entry edited from the field since. {$name}
  # is the summary of that entry
  edit_conflict: Una altra persona ha modificat «{$name}» des que l’heu editat. Torneu-lo a obrir des del camp per revisar els vostres canvis respecte a la versió més recent.
  # Error shown when saving, if someone else has deleted an entry edited from the field since.
  # {$name} is the summary of that entry
  edit_deleted: Una altra persona ha suprimit «{$name}» des que l’heu editat. Traieu-lo del camp per desar l’entrada.
