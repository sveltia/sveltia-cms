  .match $count
    one {{ Deixeu anar un fitxer aquí }}
    *   {{ Deixeu anar fitxers aquí }}

# File type validation errors
unsupported_file_type: Tipus de fitxer no compatible
# {$type} is the expected asset type label, such as image or document
dropped_file_type_mismatch: 'El fitxer deixat anar no és cap dels tipus següents: {$types}. Torneu-ho a provar.'
dropped_image_type_mismatch: 'El fitxer deixat anar no és compatible. Només s’accepta una imatge dels tipus següents: {$types}. Torneu-ho a provar.'

# File chooser button label
# {$count} is the number of files the picker allows the user to choose
choose_files: |
  .input {$count :integer}
  .match $count
    one {{ Tria un fitxer }}
    *   {{ Tria fitxers }}

# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    one {{ Suprimeix el recurs }}
    *   {{ Suprimeix els recursos }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Suprimeix el recurs seleccionat }}
    *   {{ Suprimeix els recursos seleccionats }}
confirm_deleting_this_asset: Segur que voleu suprimir aquest recurs?
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Segur que voleu suprimir el recurs seleccionat? }}
    *   {{ Segur que voleu suprimir els {$count} recursos seleccionats? }}
confirm_deleting_all_assets: Segur que voleu suprimir tots els recursos?

# Delete entries: dialog titles and confirmation messages
# {$count} is the number of entries targeted by the action
delete_entries: |
  .input {$count :integer}
  .match $count
    one {{ Suprimeix l’entrada }}
