    one {{ Ja existeix un fitxer anomenat «{$name}» en aquesta carpeta. Voleu reemplaçar-lo? }}
    *   {{ Ja existeixen {$count} fitxers amb els mateixos noms en aquesta carpeta. Voleu reemplaçar-los? }}
