      string: una cadena
      number: un nombre
      integer: un nombre enter
      boolean: un valor booleà
      array: una matriu
      object: un objecte
      'null': buida

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: No s’ha definit l’ID de l’aplicació OAuth. Es demanarà als usuaris que proporcioneu un testimoni d’accés per iniciar la sessió.
    # Don’t localize `prefix`
    site_library_prefix_template: L’opció `prefix` d’una biblioteca multimèdia conté etiquetes de plantilla, que només s’admeten al nivell del camp, ja que al nivell superior no hi ha cap entrada amb què emplenar-les.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: L’opció `{$prop}` no és compatible amb Sveltia CMS. S’ignorarà.
    # Don’t localize `stages`, `publish_mode`, `editorial_workflow` and {$type}, which is `preview` or `simple`
    publish_mode_stages_ignored: L’opció `stages` de `publish_mode` només s’aplica al mode de publicació `editorial_workflow`, de manera que s’ignora amb `{$type}`.
    # Don’t localize `pattern`, `m` and `s`
    inline_component_multiline_pattern: El `pattern` d’aquest component en línia té el marcador `m` o `s` o coincideix amb salts de línia, però un component en línia només es cerca dins d’un paràgraf.
    # {$name} is a button or component name and {$option} is `buttons` or `editor_components`; Don’t localize them and `multiline: false`
    single_line_block_item: 'L’element `{$name}` de l’opció `{$option}` s’ignora, ja que un camp amb `multiline: false` només pot contenir contingut en línia.'
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Tant `picker_utc` com les opcions més noves de zona horària (`input_timezone` o `output_utc`) estan definides. Les opcions noves tenen precedència. Considereu eliminar `picker_utc` de la vostra configuració.
    # Don’t localize `localize_format` and `format`
    localize_format_without_format: L’opció `localize_format` no té cap efecte, perquè el camp no té l’opció `format` i el seu valor s’emmagatzema en format ISO 8601.
    # {$name} is a template tag like `fields.lines.*.price`; Don’t localize `value`, `*` and `sum()`
    compute_field_wildcard_without_item: L’opció `value` del camp Compute fa referència a `{$name}`, però el camp no és dins d’un element de la llista que representa `*`, de manera que no es resol en res. Només una funció d’agregació com ara `sum()` pot usar tots els elements d’una llista.
    # {$name} is a template tag like `fields.lines.*.amount`; Don’t localize `value`
    compute_field_self_reference: L’opció `value` del camp Compute fa referència al mateix camp com a `{$name}`, de manera que el seu valor canvia cada vegada que es calcula i no s’estabilitza mai.
    # {$name} is a template tag like `fields.total`; Don’t localize `value`
    compute_field_reference_cycle: L’opció `value` del camp Compute fa referència a `{$name}`, un altre camp Compute que fa referència a aquest camp, directament o a través d’altres camps, de manera que els seus valors no s’estabilitzen mai.
    # Don’t localize `localize_format`, `true` and `de`
    localize_format_without_i18n: L’opció `localize_format` és `true`, però la i18n no està habilitada per a la col·lecció, de manera que el valor s’escriu en anglès. Definiu l’opció amb un codi de llengua com ara `de` en el seu lloc.
    # {$locale} is the locale code from the configuration; Don’t localize `localize_format`
    localize_format_unsupported_locale: L’opció `localize_format` està definida com a `{$locale}`, que no és una llengua compatible, de manera que el valor s’escriu en anglès.
    # Don’t localize `preview_path`
    preview_path_no_date_field: L’opció `preview_path` usa etiquetes de data i hora, però la col·lecció no té cap camp DateTime d’on llegir-les, de manera que no es mostrarà l’enllaç de previsualització.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: L’opció `preview_path_date_field` fa referència a un camp anomenat `{$name}`, però no hi ha cap camp DateTime definit amb aquest nom, de manera que no es mostrarà l’enllaç de previsualització.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: L’opció `preview_path` fa referència a `{$name}`, però no hi ha cap camp amb aquest nom definit a la col·lecció, de manera que no es mostrarà l’enllaç de previsualització.
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: La col·lecció no té cap camp `{$name}` per anomenar les entrades noves, de manera que cada entrada nova rep un slug aleatori. Afegiu un camp `{$name}` o definiu l’opció `identifier_field` o `slug`.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: L’opció `i18n` de `slug` no té cap efecte, perquè la col·lecció no usa l’estructura i18n `multiple_files`, `multiple_folders` o `multiple_root_folders`, on cada llengua té el seu propi fitxer.
    # Don’t localize `slug`, `template` and `auto_increment`
    slug_template_ignored: L’opció `template` de `slug` s’ignora, perquè l’opció `auto_increment` numera els slugs en el seu lloc.
    # {$file} is the file path; Don’t localize `file`, `locale`, `i18n`, `false`,
    # `omit_default_locale_from_file_path` and the example paths. The curly brackets in the examples
    # are escaped with backslashes for MessageFormat 2
    locale_not_omitted_from_file_path: El marcador `locale` no es pot treure del camí `file` `{$file}`, de manera que la llengua per defecte s’hi manté malgrat l’opció i18n `omit_default_locale_from_file_path`. Per ometre la llengua, useu el marcador com a nom de carpeta complet, com ara `\{\{locale\}\}/about.md`, o entre el nom del fitxer i l’extensió, com ara `about.\{\{locale\}\}.md`. Per mantenir-la, definiu l’opció com a `false` a l’opció `i18n` del fitxer.
    # Don’t localize `i18n`
    i18n_not_configured: L’opció `i18n` està habilitada, però la i18n no està configurada al nivell superior de la configuració ni a la col·lecció, de manera que l’opció no té cap efecte.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: L’opció `public_folder` és una cadena buida, de manera que per als camins de recursos desats a les entrades s’usa el camí `media_folder`. Suprimiu l’opció o definiu-la amb el camí que vulgueu usar, com ara `/images`.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: L’opció `{$option}` no està definida a l’esquema de configuració de Sveltia CMS. S’ignorarà. Comproveu si hi ha un error tipogràfic o de sintaxi.
    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: L’opció `default_localized` no té cap efecte, perquè la i18n no està habilitada per a la col·lecció. Useu l’opció `default` en el seu lloc.
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: L’opció `default_localized` té un valor per a `{$locale}`, que no és cap de les llengües de la col·lecció, de manera que el valor no s’usa mai.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Vegeu les notes de compatibilitat per a més detalls: {$link}'

  # Console tip shown after config load
  schema_tip: Per a una millor experiència de desenvolupador, podeu validar el fitxer de configuració contra l’esquema JSON de Sveltia CMS. Vegeu {$link} per a més detalls.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Local
  # Browser compatibility warnings
  unsupported_browser: El flux de treball local no és compatible amb el vostre navegador. Useu Chrome o Edge en el seu lloc.
  disabled: El flux de treball local està desactivat al vostre navegador. <a>Aquí s’explica com habilitar-lo</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Ara esteu veient el tauler del flux editorial. Esborranys: {$draft}. En revisió: {$review}. Llestes: {$ready}. Pendents de supressió: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Ara esteu veient el tauler del flux editorial. Esborranys: {$draft}. En revisió: {$review}. Pendents de supressió: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'Ara esteu veient el tauler del flux editorial. Esborranys: {$draft}. Llestes: {$ready}. Pendents de supressió: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'Ara esteu veient la pàgina d’esborranys. Esborranys: {$draft}. Pendents de supressió: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Esborrany
  drafts: Esborranys
  in_review: En revisió
  ready: Llest
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Pendent de supressió
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: En desplegament

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Cancel·la la supressió
  confirm_cancelling_deletion: Segur que voleu cancel·lar aquesta supressió? L’entrada continuarà publicada.
  confirm_completing_deletion: Segur que voleu suprimir aquesta entrada? S’eliminarà immediatament.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ Entrada marcada per a la supressió. }}
      *   {{ {$count} entrades marcades per a la supressió. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Canvis descartats. }}
      *   {{ S’han descartat els canvis de {$count} entrades. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: S’està cancel·lant la supressió…
  deletion_cancelled: Supressió cancel·lada.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: No s’ha pogut cancel·lar la supressió. Torneu-ho a provar.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Entrades no publicades
  published_entries: Entrades publicades
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Estat: {$status}'
  change_entry_status: Canvia l’estat de l’entrada
  # Editor toolbar: progress label while the status is being changed
  changing_status: S’està canviant l’estat…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: S’està actualitzant l’estat…
  status_updated: Estat actualitzat.
  # Error notification when the status could not be changed
  status_change_failed: No s’ha pogut canviar l’estat. Torneu-ho a provar.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: Actualitza
  refreshing: S’està actualitzant…
  refreshed: El tauler està actualitzat.
  # Error notification when the board could not be refreshed
  refresh_failed: No s’ha pogut actualitzar el tauler. Torneu-ho a provar.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: L’entrada té errors. Corregiu-los abans de canviar l’estat.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: L’entrada té errors. Corregiu-los abans de publicar-la.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Envia a revisió
  confirm_sending_for_review: Els canvis s’han desat com a esborrany. Voleu enviar l’entrada a revisió perquè algú la pugui revisar i publicar?
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: Marca com a llesta
  confirm_marking_as_ready: Els canvis s’han desat com a esborrany. Voleu marcar l’entrada com a llesta perquè es pugui publicar?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Publica l’entrada
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Descarta els canvis
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Segur que voleu suprimir aquesta entrada? No s’eliminarà fins que es publiqui la supressió. Mentrestant, la continuareu trobant a la llista d’entrades, marcada com a «Pendent de supressió».
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Aquesta entrada encara no s’ha publicat, de manera que suprimir-la la descartarà completament.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Aquesta entrada té canvis no publicats. Descartar-los restaurarà la versió publicada. L’entrada en si no se suprimirà.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Encara no s’ha publicat, de manera que els canvis no publicats es descartaran. Qualsevol versió publicada continuarà publicada. }}
      *   {{ Encara no s’han publicat, de manera que els canvis no publicats es descartaran. Qualsevol versió publicada continuarà publicada. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ Una d’elles encara no s’ha publicat, de manera que els canvis no publicats es descartaran. Qualsevol versió publicada continuarà publicada. }}
      *   {{ {$count} d’elles encara no s’han publicat, de manera que els canvis no publicats es descartaran. Qualsevol versió publicada continuarà publicada. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: Segur que voleu publicar aquesta entrada? Els vostres canvis seran visibles un cop s’hagi tornat a generar el lloc.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: S’està publicant l’entrada…
  entry_published: Entrada publicada.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: S’està suprimint l’entrada…
  discarding_changes: S’estan descartant els canvis…
  entry_deleted: Entrada suprimida.
  # Error notification when publishing fails
  publishing_entry_failed: No s’ha pogut publicar l’entrada. Torneu-ho a provar.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: Aquesta entrada no es pot publicar aquí perquè inclou altres canvis que el CMS no us pot mostrar. Demaneu a un desenvolupador que la revisi.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: L’entrada s’ha modificat des que la vau obrir. Torneu a carregar la pàgina per revisar-ne la versió més recent abans de publicar-la.
  review_on_x: Revisa a {$service}
  from_fork: Des d’una bifurcació
  fork_entry_editable: Aquesta entrada prové d’una sol·licitud d’incorporació d’un col·laborador oberta des de «{$fork}». Els vostres canvis es desen a la seva branca. Reviseu i fusioneu la sol·licitud d’incorporació al servei Git.
  fork_entry_locked: Aquesta entrada prové d’una sol·licitud d’incorporació d’un col·laborador oberta des de «{$fork}». El col·laborador no permet que els mantenidors l’editin, de manera que aquí només es pot veure.
  fork_not_editable: El col·laborador no permet que els mantenidors editin aquesta sol·licitud d’incorporació.
  fork_entry_gone: La sol·licitud d’incorporació del col·laborador ja no està oberta, de manera que els canvis no s’hi poden desar.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: Ja hi ha una altra sol·licitud ({$number}) oberta per a aquesta entrada fora del CMS. Demaneu a un desenvolupador que primer la tanqui.
  # Workflow page: empty column message
  no_entries: No hi ha cap entrada.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Arrossegueu per canviar l’estat
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Supressió
  # Workflow page: note on a card listing the new entries that were created from a Relation field
  # of the entry and are published along with it, e.g. “Also adds Section: Getting Started”
  companion_entries: També afegeix {$entries}
  # Workflow page: note on a card listing the existing entries that were edited from a Relation
  # field of the entry and are published along with it, e.g. “Also changes Author: Ada Lovelace”
  edited_companion_entries: També modifica {$entries}
  # Workflow page: one of the entries listed by `companion_entries` or `edited_companion_entries`,
  # named by its collection’s singular label and its title
  companion_entry: '{$collection}: {$title}'

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: Missatge de confirmació
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: Descriviu els vostres canvis. El missatge es registra a l’historial juntament amb ells.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: Afegiu una nota al missatge que es registra a l’historial juntament amb els vostres canvis, com ara un número d’incidència. Es pot deixar en blanc.
  # Accessible name of the text box when the user writes the whole message
  message: Missatge de confirmació
  # Accessible name of the text box when the text is added before or after the message
  addition: Nota
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'Missatge: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Bifurca el repositori
  fork: Bifurca
  confirm_forking_repository: Per suggerir canvis a «{$repo}», cal crear una bifurcació del repositori al vostre compte. Els canvis es desen en aquesta bifurcació i un mantenidor els revisa abans que es publiquin.
  # Error shown when the user declined the dialog above
  fork_declined: Necessiteu una bifurcació del repositori al vostre compte per suggerir canvis.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: No s’ha pogut crear una bifurcació del repositori «{$repo}» al vostre compte.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: La vostra bifurcació «{$fork}» no té la branca «{$branch}». Actualitzeu la bifurcació a partir del repositori «{$repo}» i torneu a iniciar la sessió.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: No s’ha pogut comprovar el vostre accés al repositori «{$repo}». Torneu-ho a provar d’aquí a un moment.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: El repositori «{$repo}» no permet bifurcacions. Demaneu a un mantenidor que les habiliti.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Teniu una invitació pendent al repositori «{$repo}». Accepteu-la a GitHub i torneu a iniciar la sessió.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: El vostre inici de sessió no inclou accés als repositoris privats, de manera que no es pot llegir el repositori «{$repo}». Demaneu a un mantenidor que comprovi la configuració d’autenticació del CMS.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Només un mantenidor pot publicar canvis en aquest lloc. En lloc d’això, marqueu l’entrada com a «En revisió» i algú se la mirarà.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: Un mantenidor ja ha publicat aquesta entrada, de manera que no queda res per revisar.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Aquest canvi no es pot fer directament. Només es poden suggerir per a revisió les edicions d’entrades.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Els canvis es desen a la vostra bifurcació d’aquest repositori a «{$repo}» i es revisen abans que es publiquin.
  view_fork: Mostra la bifurcació

