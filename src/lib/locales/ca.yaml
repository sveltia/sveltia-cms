config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Hi ha un error en la configuració del CMS. Resoleu el problema i torneu-ho a provar. }}
      *   {{ Hi ha errors en la configuració del CMS. Resoleu els problemes i torneu-ho a provar. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: 'col·lecció {$collection}'
    file: 'fitxer {$file}'
    component: 'component {$component}'
    # Don’t localize `{$field}`
    field: 'camp `{$field}`'

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS només funciona amb URLs HTTPS o de localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ L’URL del fitxer de configuració ha d’usar el protocol HTTPS o una adreça localhost. }}
        *   {{ Els URLs del fitxer de configuració han d’usar el protocol HTTPS o adreces localhost. }}
    fetch_failed: No s’ha pogut recuperar el fitxer de configuració.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: La resposta HTTP ha retornat amb l’estat {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'No s’ha pogut recuperar el fitxer de configuració. Per evitar que es carregui el fitxer `config.yml`, afegiu <a>`load_config_file: false`</a> a l’objecte de configuració passat a `CMS.init()`.'
    parse_failed: No s’ha pogut analitzar el fitxer de configuració.
    parse_failed_invalid_object: El fitxer de configuració no és un objecte JavaScript vàlid.
    parse_failed_unsupported_type: El fitxer de configuració no és un tipus de fitxer vàlid. Només s’admeten YAML, TOML i JSON.
    no_collection: No s’han definit col·leccions.
    missing_backend: No s’ha definit el rerefons.
    missing_backend_name: No s’ha definit el nom del rerefons.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: El rerefons {$name} no està <a>suportat</a> a Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: El rerefons obsolet {$name} no està <a>suportat</a> a Sveltia CMS.
    unsupported_custom_backend: Els rerefons personalitzats no estan <a>suportats</a> a Sveltia CMS.
    unsupported_backend_suggestion: Useu un dels <a>rerefons suportats</a> en el seu lloc.
    missing_repository: No s’ha definit el repositori.
    invalid_repository: El repositori configurat no és vàlid. Ha de tenir el format «owner/repo».
    oauth_implicit_flow: El mètode d’autenticació configurat (flux implícit) no és compatible amb Sveltia CMS. Useu un <a>mètode d’autenticació</a> diferent.
    github_pkce_unsupported: L’autorització PKCE encara no és compatible a causa de les limitacions de GitHub. Useu un <a>mètode d’autenticació</a> diferent.
    oauth_no_app_id: No s’ha definit l’ID de l’aplicació OAuth.
    # Don’t localize `auth_methods`
    no_auth_methods: L’opció `auth_methods` ha de contenir almenys un mètode.
    missing_media_folder: No s’ha definit la carpeta multimèdia.
    public_folder_relative_path: La carpeta pública configurada no és vàlida. Ha de ser un camí absolut que comenci per «/».
    public_folder_absolute_url: No s’admet un URL absolut per a l’opció de carpeta pública a Sveltia CMS.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: La col·lecció de recursos {$count} ha de tenir l’opció `name` definida com a cadena no buida.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: El nom de la col·lecció de recursos `{$name}` no és vàlid. No pot contenir caràcters especials.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Els noms de les col·leccions de recursos han de ser únics, però `{$name}` s’usa més d’una vegada.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_no_options: La col·lecció ha de tenir definida l’opció `folder`, `files` o `divider`.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_multiple_options: La col·lecció no pot tenir alhora les opcions `folder`, `files` i `divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: L’extensió `{$extension}` no coincideix amb el format `{$format}`.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: La plantilla de slug `{$slug}` no és vàlida perquè no pot contenir barres. Per organitzar les entrades en subcarpetes, useu l’opció `path` en lloc de `slug`.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: La col·lecció {$count} ha de tenir l’opció `name` definida com a cadena no buida.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: El nom de la col·lecció `{$name}` no és vàlid. No pot contenir caràcters especials.
    duplicate_collection_name: Els noms de les col·leccions han de ser únics, però `{$name}` s’usa més d’una vegada.
    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
    missing_collection_file_name: El fitxer de col·lecció {$count} ha de tenir l’opció `name` definida com a cadena no buida.
    # {$name} is the invalid or duplicate collection file name
    invalid_collection_file_name: El nom del fitxer de col·lecció `{$name}` no és vàlid. No pot contenir caràcters especials.
    duplicate_collection_file_name: Els noms dels fitxers de col·lecció han de ser únics, però `{$name}` s’usa més d’una vegada.
    # Don’t localize `fields`
    collection_no_fields: La col·lecció ha de tenir l’opció `fields` definida amb almenys un camp.
    # Don’t localize `fields`
    collection_file_no_fields: El fitxer de col·lecció ha de tenir l’opció `fields` definida amb almenys un camp.
    # Don’t localize `i18n`, `locale` and `file`
    collection_file_i18n_required: El fitxer de col·lecció ha de tenir definida l’opció `i18n` si el marcador `locale` s’usa al camí `file`.
    # {$count} is the 1-based field index in the current fields array; Don’t localize `name`
    missing_field_name: El camp {$count} ha de tenir l’opció `name` definida com a cadena no buida.
    # {$name} is the invalid or duplicate field name
    invalid_field_name: El nom del camp `{$name}` no és vàlid. No pot contenir caràcters especials. Si voleu imbricar camps, <a>useu camps Object en lloc de la notació de punt</a>.
    duplicate_field_name: Els noms dels camps han de ser únics, però `{$name}` s’usa més d’una vegada.
    # {$count} is the 1-based variable type index in the current types array
    missing_variable_type: El tipus variable {$count} ha de tenir l’opció `name` definida com a cadena no buida.
    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: El nom del tipus variable `{$name}` no és vàlid. No pot contenir caràcters especials.
    duplicate_variable_type: Els noms dels tipus variables han de ser únics, però `{$name}` s’usa més d’una vegada.
    date_field_type: 'El tipus de camp Date obsolet no és compatible amb Sveltia CMS. Useu el tipus de camp DateTime amb l’opció `type: date` en el seu lloc.'
    # {$timeZone} is the invalid IANA timezone identifier from the configuration
    invalid_timezone: 'Zona horària no vàlida: {$timeZone}. Ha de ser un identificador de zona horària IANA vàlid com `America/New_York` o `Asia/Tokyo`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: L’opció obsoleta `{$prop}` no és compatible amb Sveltia CMS. Useu l’opció `{$newProp}` en el seu lloc.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: L’opció `allow_multiple` no és compatible amb Sveltia CMS. Useu l’opció `multiple`, que per defecte és `false`.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: El camp List no pot tenir alhora les opcions `field`, `fields` i `types`.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: El tipus variable del camp List no és vàlid. L’opció `widget` està definida com a `{$widget}` però ha de ser `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: El camp Object no pot tenir alhora les opcions `fields` i `types`.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: La col·lecció referenciada `{$collection}` no és vàlida o no està definida.
    relation_field_invalid_collection_file: El fitxer referenciat `{$file}` no és vàlid o no està definit.
    # Don’t localize `file`
    relation_field_missing_file_name: L’opció `file` ha de estar definida per a una relació amb una col·lecció de fitxers.
    relation_field_invalid_value_field: El camp de valor referenciat `{$field}` no és vàlid o no està definit.
    unexpected: Error inesperat

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: No s’ha definit l’ID de l’aplicació OAuth. Es demanarà als usuaris que proporcioneu un testimoni d’accés per iniciar la sessió.
    editorial_workflow_unsupported: El flux editorial encara no és compatible amb Sveltia CMS.
    nested_collections_unsupported: Les col·leccions imbricades encara no són compatibles amb Sveltia CMS.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: L’opció `{$prop}` no és compatible amb Sveltia CMS. S’ignorarà.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Tant `picker_utc` com les opcions més noves de zona horària (`input_timezone` o `output_utc`) estan definides. Les opcions noves tenen precedència. Considereu eliminar `picker_utc` de la vostra configuració.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Vegeu les notes de compatibilitat per a més detalls: {$link}'

  # Console tip shown after config load
  schema_tip: Per a una millor experiència de desenvolupador, podeu validar el fitxer de configuració contra l’esquema JSON de Sveltia CMS. Vegeu {$link} per a més detalls.

