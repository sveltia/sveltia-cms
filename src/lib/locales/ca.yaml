  .match $count
    one {{ Deixeu anar un fitxer aquí o feu clic per explorar… }}
    *   {{ Deixeu anar fitxers aquí o feu clic per explorar… }}
# Partial drop zone text (ends with inline button)
# {$count} is the number of files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Deixeu anar un fitxer aquí o }}
    *   {{ Deixeu anar fitxers aquí o }}
# Image-specific drop zone text
# {$count} is the number of image files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_image_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Deixeu anar un fitxer d’imatge aquí o }}
    *   {{ Deixeu anar fitxers d’imatge aquí o }}

# File picker and clipboard actions used by upload controls
browse: Explora
# Generic clipboard paste action used by non-image file fields
paste: Enganxa
# Clipboard paste action used by image fields
paste_image: Enganxa la imatge

# Clipboard paste errors
no_image_in_clipboard: No s’ha trobat cap imatge al porta-retalls.
clipboard_access_denied: S’ha denegat l’accés al porta-retalls.

# Drag-and-drop overlay text (shown while dragging)
