# Read https://github.com/sveltia/sveltia-cms/blob/main/src/lib/locales/README.md
# for instructions on how to add new languages or update existing translations.

# ==============================================================================
# Common Actions
# ==============================================================================
# Generic action button labels used throughout the application. These are
# reusable strings for common operations like save, delete, cancel, etc.

# Primary actions: creation, selection, and file operations
create: Nou
select: Selecciona
select_all: Selecciona-ho tot
# Accessible name of the checkbox that selects a single entry or asset in a list
select_item: Selecciona {$name}
upload: Puja
copy: Copia
download: Baixa
duplicate: Duplica
delete: Suprimeix
reorder: Reordena

# Dialog and form actions: confirmation and cancellation
cancel: Cancel·la
done: Fet
save: Desa
# Progress indicator shown on the save button while a save operation is in progress
saving: S’està desant…

# Publishing actions: used when committing changes to the repository
publish: Publica
# Progress indicator shown on the publish button during publishing
publishing: S’està publicant…

# Modification actions: editing and updating content
rename: Reanomena
update: Actualitza
replace: Reemplaça

# List and collection actions: adding and removing items
add: Afegeix
remove: Suprimeix
clear: Neteja

# Expansion and collapse actions: used for accordions, trees, and expandable sections
expand: Desplega
expand_all: Desplega-ho tot
collapse: Replega
collapse_all: Replega-ho tot

# Content manipulation: inserting, restoring, and discarding
insert: Insereix
restore: Restaura
discard: Descarta

# ==============================================================================
# Common UI Elements
# ==============================================================================
# Reusable labels and messages for common interface elements like status
# indicators, loading states, and toolbar regions.

# Status messages: search and results indicators
# Shown in ARIA live regions during search operations
searching: Cercant…
no_results: No s’han trobat resultats.

# Toolbar region labels: used as aria-labels for different toolbar areas
# These help screen readers identify which toolbar is being navigated
global: Global
primary: Primari
secondary: Secundari
collection: Col·lecció
folder: Carpeta
# Label of the subfolder list in the asset picker
folders: Carpetes
# Menu in a breadcrumb holding the folders that don’t fit
more_folders: Més carpetes

# ==============================================================================
# Miscellaneous Labels
# ==============================================================================
# Various labels used across the application for specific UI elements
# that don’t fit into other categories.

# Field and input labels
api_key: Clau API
details: Detalls
back: Enrere
# Reusable label for an option whose value is determined automatically, e.g. the UI language
automatic: Automàtic
# Loading indicator shown during async operations (asset preview, panels, etc.)
loading: Carregant…
# Dismiss button for temporary notifications and infobars
later: Més tard

# Entry and collection labels
# Slug field heading in entry editors
slug: Slug
# Fallback labels for singleton collections when names aren’t configured
singleton: Singleton
singletons: Singletons

# Error messages
# Toast notification when clipboard operations fail
clipboard_error: No s’ha pogut copiar al porta-retalls.

# ==============================================================================
# Sign-In Page
# ==============================================================================
# Strings specific to the authentication and sign-in page, including welcome
# messages, loading states, OAuth flows, and repository access options.

# Welcome and branding
# Screen reader announcement when the sign-in page loads
# {$name} is the app title shown on the sign-in screen, Sveltia CMS by default
welcome_message: Benvinguts al {$name}
# Footer text with CMS branding
# {$name} is the CMS brand name shown in the footer, Sveltia CMS by default
powered_by: Amb la tecnologia del {$name}

# Shown during initial configuration and data loading
unsupported_browser_error: El vostre navegador no és compatible. Actualitzeu-lo a la versió més recent o useu un altre navegador.
loading_cms_config: S’està carregant la configuració del CMS…
loading_site_data: S’estan carregant les dades del lloc…
loading_site_data_error: S’ha produït un error en carregar les dades del lloc.

# OAuth and token authentication
# Primary sign-in button label for OAuth providers (GitHub, GitLab, etc.)
# {$service} is the sign-in provider label, such as GitHub or GitLab
sign_in_with_x: Inicia la sessió amb {$service}

# Access token dialog: alternative authentication method
sign_in_using_access_token: Inicia la sessió amb un testimoni d’accés
sign_in_using_access_token_description: Introduïu el vostre testimoni a continuació. Ha de tenir accés de lectura/escriptura al contingut del repositori.
# Shown after the description above when Editorial Workflow is enabled, which opens and merges pull requests
sign_in_using_access_token_workflow_note: Com que el flux editorial està habilitat, també ha de tenir accés de lectura/escriptura a les sol·licituds d’incorporació.
# Inline link text with embedded HTML anchor tag
# {$service} is the provider name whose user settings page contains the token generator, e.g., GitHub or GitLab
sign_in_using_access_token_link: Podeu generar un testimoni a la <a>pàgina de configuració d’usuari del {$service}</a>.
# Input field label for personal access token
personal_access_token: Testimoni d’accés personal

# Authentication progress indicators
authorizing: S’està autoritzant…
signing_in: S’està iniciant la sessió…

# Local and test repository options
# Button label and description for working with a local Git repository
work_with_local_repo: Treballa amb un repositori local
# {$repo} is the configured repository name shown when it is available
work_with_local_repo_description: Quan se us demani, seleccioneu el directori arrel del repositori «{$repo}».
work_with_local_repo_description_no_repo: Quan se us demani, seleccioneu el directori arrel del vostre repositori Git.
# Button label for demo/test repository
work_with_test_repo: Treballa amb un repositori de prova
# Button label for the test repository when sample content is seeded, e.g. on a demo site
start_demo: Inicia la demostració
# Shown below the disabled test repository option in a browser that can’t save files to its
# storage, e.g. Safari before version 26
test_repo_unsupported_browser: El vostre navegador no pot desar els fitxers del repositori de prova. Actualitzeu-lo a la versió més recent o useu un altre navegador.

# Authentication errors
# Error messages shown during sign-in failures
sign_in_error:
  not_project_root: La carpeta seleccionada no és un directori arrel de repositori. Torneu-ho a provar.
  picker_dismissed: No s’ha pogut seleccionar un directori arrel de repositori. Torneu-ho a provar.
  authentication_aborted: S’ha avortat l’autenticació. Torneu-ho a provar.
  invalid_token: El testimoni proporcionat no és vàlid. Comproveu-ho i torneu-ho a provar.
  # OAuth and authenticator errors (shown with error codes) — keys are defined in the Sveltia CMS Authenticator library
  UNSUPPORTED_BACKEND: El vostre rerefons Git no és compatible amb l’autenticador.
  UNSUPPORTED_DOMAIN: El vostre domini no té permès utilitzar l’autenticador.
  MISCONFIGURED_CLIENT: L’ID de client o el secret de l’aplicació OAuth no estan configurats.
  AUTH_CODE_REQUEST_FAILED: No s’ha pogut rebre un codi d’autorització. Proveu-ho de nou més tard.
  CSRF_DETECTED: S’ha detectat un possible atac CSRF. S’ha avortat el flux d’autenticació.
  TOKEN_REQUEST_FAILED: No s’ha pogut demanar un testimoni d’accés. Proveu-ho de nou més tard.
  TOKEN_REFRESH_FAILED: No s’ha pogut renovar el testimoni d’accés. Proveu-ho de nou més tard.
  MALFORMED_RESPONSE: El servidor ha respost amb dades mal formades. Proveu-ho de nou més tard.

# Backend and repository validation errors
# Shown when the configured backend or repository is invalid or inaccessible
# {$name} is the backend display name like Forgejo and {$version} is the minimum supported version
backend_unsupported_version: El rerefons {$name} requereix {$name} {$version} o posterior.
# {$repo} is the repository identifier, typically in owner/repo format
repository_no_access: No teniu accés al repositori «{$repo}».
# {$repo} is the repository identifier, typically in owner/repo format
repository_no_write_access: No teniu accés d’escriptura al repositori «{$repo}».
repository_not_found: El repositori «{$repo}» no existeix.
repository_empty: El repositori «{$repo}» no té cap branca.
# {$repo} is the repository identifier, and {$branch} is the configured branch name
branch_not_found: El repositori «{$repo}» no té la branca «{$branch}».
# {$repo} is the repository identifier, and {$dir} is the configured root directory
root_dir_not_found: El directori arrel «{$dir}» no existeix al repositori «{$repo}».

# General errors
# Fallback error dialog title for unexpected errors
unexpected_error: Error inesperat
# Shown in place of the page when an unexpected error stops it from being displayed
# {$message} is the error message
page_crashed: Alguna cosa ha anat malament i aquesta pàgina no es pot mostrar. {$message}
# Shown in place of a field editor or preview when an unexpected error stops it from being displayed
# {$message} is the error message
field_crashed: Alguna cosa ha anat malament i aquest camp no es pot mostrar. {$message}
# Button label for displaying a part of the page again after an unexpected error
try_again: Torna-ho a provar
# Button label for reloading the CMS after an unexpected error
reload_cms: Torna a carregar el CMS

# Entry file parsing errors
# Toast notification when entry files fail to parse on initial load
# {$count} is the number of entry files that failed to parse
entry_parse_errors: |
  .input {$count :integer}
  .match $count
    one {{ S’ha produït un error en analitzar un fitxer d’entrada. Comproveu la consola del navegador per a més detalls. }}
    *   {{ S’han produït errors en analitzar fitxers d’entrada. Comproveu la consola del navegador per a més detalls. }}

# ==============================================================================
# Authentication and Account
# ==============================================================================
# These strings are used for sign-in, account management, and authentication
# flows throughout the application.

# Sign-in page and external assets panel: credential input field aria-labels
username: Nom d’usuari
password: Contrasenya

# Sign-in actions: primary button labels and account menu items
# Used on the sign-in page and in confirmation dialogs for external assets
sign_in: Inicia la sessió

# Mobile sign-in feature: dialog title and instructions for QR code authentication
sign_in_with_mobile: Inicia la sessió amb el mòbil
# Instructions shown in the mobile sign-in dialog for passwordless authentication
sign_in_with_mobile_instruction: Escanegeu el codi QR següent amb el telèfon o la tauleta per a una sessió sense contrasenya. La vostra configuració es copiarà automàticament.
# Confirmation dialog shown when the CMS is opened with a sign-in link from the mobile sign-in
# QR code. {$account} is the account name, {$service} is the Git service name, e.g. GitHub
sign_in_with_link: Inicia la sessió amb un enllaç
sign_in_with_link_confirmation: Aquest enllaç inicia la vostra sessió com a {$account} a {$service} i copia la configuració del dispositiu on es va crear. Continueu només si heu creat l’enllaç vosaltres mateixos.

# Sign-in with Sveltia CMS Additions, which manages its own user accounts instead of the Git
# service’s. Don’t localize “Sveltia CMS Additions”
additions:
  username: Nom d’usuari
  password: Contrasenya
  sign_in: Inicia la sessió
  new_password_title: Trieu una contrasenya nova
  new_password_description: Heu iniciat la sessió amb una contrasenya temporal. Trieu-ne una de nova per continuar.
  new_password: Contrasenya nova
  password_too_short: La contrasenya és massa curta. Useu almenys 12 caràcters.
  change_password: Canvia la contrasenya
  # {$name} is the user’s username, {$role} their role, e.g. Editor
  signed_in_as_x_with_role: Sessió iniciada com a {$name} ({$role})
  link_github: Vincula el compte de GitHub
  link_github_error: No s’ha pogut vincular el compte de GitHub
  current_password: Contrasenya actual
  # {$username} is the username filled in from a magic link emailed to the user
  filled_from_link: El nom d’usuari i la contrasenya s’han emplenat a partir d’un enllaç. Inicieu la sessió només si «{$username}» és el vostre nom d’usuari.
  change_password_description: Mantindreu la sessió iniciada aquí i es tancarà als altres dispositius.
  password_changed: S’ha canviat la contrasenya.
  # The Account settings panel of a Sveltia CMS Additions user
  account:
    profile: Perfil
    profile_description: El vostre nom és visible per a altres usuaris al CMS, per exemple en els bloquejos d’entrades i els comentaris, i també en les vostres confirmacions.
    username_description: El vostre nom d’usuari no es pot canviar.
    email: Correu electrònic
    email_description: S’usa a les confirmacions que feu perquè GitHub les pugui vincular al vostre compte. Si no n’hi ha cap, s’usa una adreça provisional. Només un administrador el pot canviar.
    change_name: Canvia el nom
    name_changed: S’ha canviat el nom.
    password: Contrasenya
    no_password: El vostre compte només inicia la sessió amb GitHub, de manera que no té cap contrasenya per canviar. Un administrador us en pot donar una restablint-vos la contrasenya.
  setup:
    use_admin_secret: Usa el secret d’administrador
    title: Configura Sveltia CMS Additions
    secret_description: Introduïu el secret d’administrador definit a la configuració del vostre servei de Sveltia CMS Additions. Només es conserva en aquesta pestanya mentre feu la configuració.
    admin_secret: Secret d’administrador
    continue: Continua
    back: Torna a l’inici de sessió
    admin_title: Compte d’administrador
    admin_create_description: Creeu el primer compte d’administrador. L’usareu per iniciar la sessió i gestionar els altres usuaris.
    admin_reset_description: Ja existeix un compte d’administrador. Per tornar a entrar, restabliu aquí la contrasenya d’un administrador o creeu-ne un altre.
    admin_saved: El compte d’administrador està llest. Inicieu la sessió amb la contrasenya que acabeu d’introduir.
    create_admin: Crea l’administrador
    reset_password: Desa l’administrador
    github_title: GitHub
    # {$repo} is the repository, e.g. octocat/site
    github_description: Creeu una GitHub App per a aquest lloc i instal·leu-la al repositori «{$repo}». GitHub us demanarà que ho confirmeu i després us tornarà aquí.
    # {$repo} is the repository, {$app} is the name of the GitHub App
    github_connected: Connectat al repositori «{$repo}» amb la GitHub App «{$app}».
    connect_github: Connecta amb GitHub
    # {$step} is the number of the current step, {$total} the number of steps
    step_x_of_y: Pas {$step} de {$total}
    admin_exists: Ja existeix un compte d’administrador.
    reset_admin_password: Restableix la contrasenya de l’administrador
    setup_complete: La configuració s’ha completat. Inicieu la sessió amb un compte d’administrador per gestionar els usuaris i la configuració. Podeu tornar aquí amb el secret d’administrador en qualsevol moment.
    manage_sites: Gestiona altres llocs
    back_to_setup: Enrere
    sites_title: Altres llocs
    sites_description: Aquest servei també pot donar servei a altres llocs, cadascun amb els seus propis usuaris, configuració i GitHub App. Definiu «base_url» a la configuració del CMS d’un lloc amb l’URL corresponent i després configureu-hi el lloc amb el secret d’administrador.
    no_sites: Encara no hi ha cap altre lloc.
    site_id: ID del lloc
    site_id_description: D’1 a 32 lletres minúscules, xifres i guionets, p. ex., «acme». Apareix a l’URL del lloc i no es pot canviar.
    site_name_optional: Nom (opcional)
    add_site: Afegeix un lloc
    # {$name} is the name of the site
    site_added: S’ha afegit «{$name}». Definiu «base_url» a la seva configuració del CMS amb el seu URL i després obriu-hi l’assistent de configuració.
    # {$name} is the name of the site
    copy_site_url: Copia l’URL de {$name}
    delete_site: Suprimeix el lloc
    # {$name} is the name of the site
    delete_site_x: Suprimeix {$name}
    # {$name} is the name of the site, {$id} is its ID
    delete_site_confirmation: Suprimir «{$name}» també en suprimeix els usuaris, la configuració i els comentaris. Aquesta acció no es pot desfer. La GitHub App es manté a GitHub, on la podeu suprimir. Escriviu «{$id}» per confirmar-ho.
    site_id_to_confirm: ID del lloc per confirmar
    data_key_locked_title: S’ha canviat el secret d’administrador
    data_key_locked_description: El secret d’administrador s’ha canviat, de manera que la configuració emmagatzemada no es pot llegir. Introduïu el secret anterior per conservar-la, o torneu a començar si l’heu perdut.
    previous_secret: Secret d’administrador anterior
    unlock: Desbloqueja
    rekey: Torna a començar
    rekey_confirmation: Tornar a començar suprimeix les credencials de la GitHub App i els altres secrets emmagatzemats, i tanca la sessió de tothom. Les contrasenyes es conserven. Voleu continuar?
    result:
      ok: GitHub està connectat. Ara podeu iniciar la sessió.
      github_app_not_created: No s’ha creat la GitHub App. Useu el secret d’administrador per tornar-ho a provar.
      github_app_not_installed: No s’ha instal·lat la GitHub App. Useu el secret d’administrador per tornar-ho a provar.
      github_wrong_account: La GitHub App s’ha instal·lat en un compte que no és el propietari del repositori. Instal·leu-la al compte propietari del repositori i torneu-ho a provar.
      github_repository_not_included: La GitHub App s’ha instal·lat sense accés al repositori. Doneu-li accés al repositori a GitHub i torneu-ho a provar.
      unexpected: La connexió amb GitHub ha fallat a causa d’un error inesperat. Torneu-ho a provar.
  locks:
    # {$name} is the name of the person editing the entry, {$time} when they started
    being_edited: '{$name} està editant aquesta entrada des de {$time}, de manera que només la podeu veure.'
    being_edited_by_you: Esteu editant aquesta entrada en una altra pestanya, de manera que aquí només la podeu veure.
    # {$name} is the name of the person who took over the entry
    taken_over: '{$name} ha pres el control d’aquesta entrada, de manera que ara només la podeu veure.'
    take_over: Pren el control
    unavailable: Els bloquejos d’entrades no estan disponibles, de manera que és possible que algú altre estigui editant aquesta entrada alhora.
    # {$name} is the name of the person editing the entry
    being_edited_by_x: En edició per {$name}
    # {$names} is a list of the other people who have the entry open in the editor
    also_open_by_x: També oberta per {$names}
    # {$names} is a list of the people who have the entry open, besides anyone editing it
    open_by_x: Oberta per {$names}
  users:
    title: Usuaris
    add_user: Afegeix un usuari
    edit_user: Edita l’usuari
    add: Afegeix
    name: Nom
    username_description: Un nom d’usuari no es pot canviar un cop s’ha afegit l’usuari.
    email_optional: Correu electrònic (opcional)
    email_description: S’usa a les confirmacions que fa aquesta persona perquè GitHub les pugui vincular al seu compte. Si no n’hi ha cap, s’usa una adreça provisional.
    role: Rol
    status: Estat
    last_sign_in: Últim inici de sessió
    sign_in_column: Inici de sessió
    methods:
      password: Contrasenya
      # {$login} is a GitHub username
      github: GitHub ({$login})
    actions: Accions
    you: (vós)
    never: Mai
    roles:
      admin: Administrador
      editor: Editor
      viewer: Lector
    statuses:
      active: Actiu
      temporary_password: Contrasenya temporal
      waiting_for_sign_in: Pendent del primer inici de sessió
      disabled: Desactivat
    # {$name} is the user’s name
    show_options_for_x: Mostra les opcions de {$name}
    options: Opcions de l’usuari
    reset_password: Restableix la contrasenya
    sign_out_everywhere: Tanca la sessió a tot arreu
    enable: Activa l’usuari
    disable: Desactiva l’usuari
    delete: Suprimeix l’usuari
    # {$name} is the user’s name
    reset_password_confirmation: Voleu donar una contrasenya temporal nova a {$name}? Se li tancarà la sessió a tot arreu i haurà de triar una contrasenya nova en el pròxim inici de sessió.
    delete_confirmation: Voleu suprimir {$name}? Aquesta acció no es pot desfer.
    temporary_password: Contrasenya temporal
    # {$name} is the user’s name
    temporary_password_description: Doneu aquest nom d’usuari i aquesta contrasenya temporal a {$name}. No es tornarà a mostrar, i triarà la seva pròpia contrasenya quan iniciï la sessió.
    copy_username: Copia el nom d’usuari
    copy_password: Copia la contrasenya
    # {$name} is the user’s name
    email_credentials: Envia per correu a {$name}
    # The emails the admin sends from their own email app, with the sign-in details: `new` to a user
    # who has just been added, `reset` to one whose password has been reset. Each line is a string of
    # its own, as line breaks aren’t kept in these files
    credentials_email:
      # {$name} is the user’s name
      greeting: 'Hola, {$name}:'
      # {$url} is a link to the CMS that fills in the username and the temporary password
      sign_in_link: 'Enllaç d’inici de sessió: {$url}'
      # {$username} is the username
      username: 'Nom d’usuari: {$username}'
      # {$password} is the temporary password
      password: 'Contrasenya temporal: {$password}'
      new:
        # {$app} is the name of the CMS
        subject: Les vostres dades d’inici de sessió per a {$app}
        # {$app} is the name of the CMS
        message: Ja podeu iniciar la sessió a {$app}. Obriu l’enllaç següent, que emplena el vostre nom d’usuari i la contrasenya temporal, i trieu la vostra pròpia contrasenya quan inicieu la sessió.
      reset:
        # {$app} is the name of the CMS
        subject: S’ha restablert la vostra contrasenya per a {$app}
        # {$app} is the name of the CMS
        message: S’ha restablert la vostra contrasenya per a {$app} i s’ha tancat la vostra sessió a tot arreu. Obriu l’enllaç següent, que emplena el vostre nom d’usuari i la contrasenya temporal, i trieu una contrasenya nova quan inicieu la sessió.
    allowed_domains: Dominis permesos
    allowed_domains_description: Els llocs que poden usar Sveltia CMS Additions, un nom d’amfitrió per línia. Un comodí (*) coincideix amb qualsevol subdomini, p. ex., *.example.com. Indiqueu noms d’amfitrió exactes sempre que pugueu. La llista només s’aplica a aquest lloc, encara que la mateixa instància de Sveltia CMS Additions també doni servei a altres llocs.
    save_allowed_domains: Desa els dominis permesos
    allowed_domains_saved: S’han desat els dominis permesos.
    sign_in_tab: Inici de sessió
    # {$latest} is the newest version of Sveltia CMS Additions, {$current} the one in use
    update_available: Sveltia CMS Additions {$latest} ja és disponible. Esteu executant la versió {$current}.
    release_notes: Notes de la versió
    github_username_optional: Nom d’usuari de GitHub (opcional)
    github_username_description: Amb un nom d’usuari de GitHub, l’usuari inicia la sessió amb aquest compte de GitHub en lloc d’una contrasenya.
    # {$name} is the user’s name
    github_required: '{$name} només pot iniciar la sessió amb GitHub, de manera que el seu nom d’usuari de GitHub no es pot suprimir. Primer restabliu-li la contrasenya perquè tingui una contrasenya amb què iniciar la sessió.'
    adopt: Adopta el compte
    sign_in:
      github: Permet iniciar la sessió amb GitHub
      github_description: Els usuaris inicien la sessió amb el seu compte de GitHub i obtenen el seu propi testimoni de GitHub, de manera que els seus canvis es confirmen al seu nom. Primer els ha d’afegir un administrador amb el seu nom d’usuari de GitHub, tret que els cobreixi una regla de registre.
      # Shown when signing in with GitHub is being turned off while {$count} users can only sign in
      # with it
      github_only_warning: |
        .input {$count :integer}
        .match $count
          one {{ Un usuari només pot iniciar la sessió amb GitHub i no ho podrà fer un cop es desactivi, fins que no li restabliu la contrasenya. }}
          *   {{ {$count} usuaris només poden iniciar la sessió amb GitHub i no ho podran fer un cop es desactivi, fins que no els restabliu la contrasenya. }}
      rules: Regles de registre
      rules_description: Els membres de l’organització de GitHub on està instal·lada l’aplicació poden iniciar la sessió sense que se’ls hagi d’afegir abans. El seu compte rep el rol que trieu i es desactiva si abandonen l’organització, tret que l’adopteu.
      org: Organització de GitHub
      add_rule: Afegeix una regla
      # {$org} is the name of a GitHub organization
