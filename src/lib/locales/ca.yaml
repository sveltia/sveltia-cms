  # Shown while the site is still being built, with or without a URL to open yet
  building: La previsualització encara s’està generant.
  # Shown when the build failed, so no preview is available. The failure may lie in the site’s own
  # code rather than the entry, so the editor is told not to assume it’s theirs, and who to ask
  build_failed: No s’ha pogut generar la previsualització. No necessàriament és a causa dels vostres canvis. Si el problema persisteix, poseu-vos en contacte amb l’administrador del lloc.
  # Shown briefly while the CI/CD provider is being queried
  checking: S’està cercant una previsualització…
  # Menu item to query the CI/CD provider again, offered once the automatic checks gave up
  check_again: Cerca una previsualització
  # Button label while the CMS is waiting for the provider to build a preview of this entry. The
