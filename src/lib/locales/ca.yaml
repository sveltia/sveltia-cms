    title: Error
    description: S’ha produït un error en desar l’entrada. Proveu-ho de nou més tard.

# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: Entrada modificada per una altra persona
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} ha modificat aquesta entrada el {$date}, després que l’obrísseu.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Aquesta entrada s’ha modificat al repositori després que l’obrísseu.
  deleted: Aquesta entrada s’ha suprimit del repositori després que l’obrísseu.
  # Follows `modified_by` or `modified`
  overwrite_warning: Si deseu ara, es perdran els seus canvis.
  # Follows `deleted`
  recreate_warning: Si deseu ara, l’entrada es tornarà a crear.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Com que l’entrada està emmagatzemada al mateix fitxer que altres entrades, no es pot desar per sobre del canvi. Cancel·leu l’edició, torneu a obrir l’entrada des de la llista i feu-hi les vostres modificacions.
  # OK button label
  save_anyway: Desa igualment
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: Una altra persona ha actualitzat el repositori mentre es desava. Torneu-ho a provar.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Una altra persona ha modificat una entrada emmagatzemada al mateix fitxer. Torneu-ho a provar.
  # {$path} is the file path
  array_file_invalid: El fitxer {$path} no es pot actualitzar perquè no conté una llista d’entrades vàlida.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
# repository while the user has it open. The change itself is described with the `save_conflict`
# strings above
remote_change:
  reload_entry: Torna a carregar l’entrada
  # Confirmation shown before reloading when the user has unsaved changes
  confirm_reloading_entry: Segur que voleu tornar a carregar l’entrada? Es perdran els canvis no desats.

