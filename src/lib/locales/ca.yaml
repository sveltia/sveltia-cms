# Asset type filter and group labels
type: Tipus
all: Tots
# Asset type labels
image: Imatge
video: Vídeo
audio: Àudio
document: Document
other: Altres

# Toolbar toggles: show/hide panels
show_assets: Mostra els recursos
hide_assets: Amaga els recursos
show_info: Mostra la informació
hide_info: Amaga la informació

# Folder display labels when no specific path is configured
all_assets: Tots els recursos
global_assets: Recursos globals

# ==============================================================================
# Entry and Collection Actions
# ==============================================================================
# Strings related to creating, editing, and managing entries and collections.

# Error message when entry cannot be found
entry_not_found: No s’ha trobat l’entrada.

# Entry creation restrictions: tooltip and advisory messages
creating_entries_disabled_by_admin: La creació d’entrades noves en aquesta col·lecció està desactivada per l’administrador.
# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: No podeu afegir entrades noves a aquesta col·lecció perquè ha arribat al seu límit de {$quota} entrades.
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$remaining :integer}
  .match $remaining
    one {{ Aquesta col·lecció s’acosta al seu límit de {$quota} entrades. Només podeu crear {$remaining} entrada més. }}
    *   {{ Aquesta col·lecció s’acosta al seu límit de {$quota} entrades. Només podeu crear {$remaining} entrades més. }}

# Navigation: back links and list labels
back_to_collection: Torna a la col·lecció
collection_list: Llista de col·leccions
back_to_collection_list: Torna a la llista de col·leccions
asset_folder_list: Llista de carpetes de recursos
back_to_asset_folder_list: Torna a la llista de carpetes de recursos

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: Resultats de la cerca
# {$terms} is the current search query text
search_results_for_x: Resultats de la cerca de «{$terms}»

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Ara esteu veient els resultats de la cerca de «{$terms}». No hem trobat cap entrada. }}
    one {{ Ara esteu veient els resultats de la cerca de «{$terms}». Hem trobat una entrada. }}
    *   {{ Ara esteu veient els resultats de la cerca de «{$terms}». Hem trobat {$count} entrades. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Ara esteu veient els resultats de la cerca de «{$terms}». No hem trobat cap recurs. }}
    one {{ Ara esteu veient els resultats de la cerca de «{$terms}». Hem trobat un recurs. }}
    *   {{ Ara esteu veient els resultats de la cerca de «{$terms}». Hem trobat {$count} recursos. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ Cap entrada }}
    one {{ {$count} entrada }}
    *   {{ {$count} entrades }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ Cap recurs }}
    one {{ {$count} recurs }}
    *   {{ {$count} recursos }}

# Empty state messages
no_files_found: No s’ha trobat cap fitxer.
no_entries_found: No s’ha trobat cap entrada.

# ==============================================================================
# Asset Management
# ==============================================================================
# Strings for uploading, editing, and managing assets (images, documents, etc.).

# Upload dialog: title and button label
upload_assets: Puja recursos nous

# Edit options menu: button and item labels
edit_options: Opcions d’edició
show_edit_options: Mostra les opcions d’edició
# Edit menu items with specific asset names
edit_asset: Edita el recurs
# {$name} is the selected asset name
edit_x: 'Edita {$name}'

# Asset text editor: switch for line wrapping
wrap_long_lines: Ajusta les línies llargues

# Rename asset: dialog and validation
rename_asset: Reanomena el recurs
# {$name} is the current asset name
rename_x: 'Reanomena {$name}'
# Dialog body text indicating how many entries reference this asset
# {$count} is the number of entries that currently reference the asset
enter_new_name_for_asset: |
  .input {$count :integer}
  .match $count
    0   {{ Introduïu un nom nou a continuació. }}
    one {{ Introduïu un nom nou a continuació. També s’actualitzarà una entrada que usa aquest recurs. }}
    *   {{ Introduïu un nom nou a continuació. També s’actualitzaran {$count} entrades que usen aquest recurs. }}
# Validation errors for asset renaming
enter_new_name_for_asset_error:
  empty: El nom del fitxer no pot ser buit.
  character: El nom del fitxer no pot contenir caràcters especials.
  duplicate: Aquest nom de fitxer ja s’usa per a un altre recurs.

# Replace asset: menu item and dialog title
replace_asset: Reemplaça el recurs
# {$name} is the asset being replaced
replace_x: 'Reemplaça {$name}'

# File selection prompts: drop zones and file pickers
# Browse prompt shown when drag-and-drop is unavailable on desktop and pointer devices
click_to_browse: Feu clic per explorar…
# Browse prompt shown on touch devices
tap_to_browse: Toqueu per explorar…
# Drop zone text with browse button
# {$count} is the number of files expected by the current picker mode
drop_files_or_click_to_browse: |
