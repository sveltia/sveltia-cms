  unsupported_repository: El vostre repositori usa una funcionalitat de Git que el CMS no admet, com ara un arbre de treball enllaçat, noms d’objecte SHA-256, el format reftable, un índex dispers o un índex de la versió 3 o 4, que usen l’opció feature.manyFiles i git add -N.
