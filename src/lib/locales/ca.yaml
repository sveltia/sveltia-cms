    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Heu d’afegir almenys {$min} element. }}
        *   {{ Heu d’afegir almenys {$min} elements. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: La data/hora ha de ser anterior o igual a {$max}.
    date: La data ha de ser anterior o igual a {$max}.
    time: L’hora ha de ser anterior o igual a {$max}.
    number: El valor ha de ser inferior o igual a {$max}.
    # {$max} is the maximum number of selected options
