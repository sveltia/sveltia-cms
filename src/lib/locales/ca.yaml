  # Badge text in account button
  indicator: Local
  # Browser compatibility warnings
  unsupported_browser: El flux de treball local no és compatible amb el vostre navegador. Useu Chrome o Edge en el seu lloc.
  disabled: El flux de treball local està desactivat al vostre navegador. <a>Aquí s’explica com habilitar-lo</a>.

