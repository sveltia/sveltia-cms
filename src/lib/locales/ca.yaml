# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Hi ha un error en la configuració del CMS. Resoleu el problema i torneu-ho a provar. }}
      *   {{ Hi ha errors en la configuració del CMS. Resoleu els problemes i torneu-ho a provar. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: col·lecció {$collection}
    file: fitxer {$file}
    component: component {$component}
    # Don’t localize `{$field}`
    field: camp `{$field}`

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS només funciona amb URLs HTTPS o de localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ L’URL del fitxer de configuració ha d’usar el protocol HTTPS o una adreça localhost. }}
        *   {{ Els URLs del fitxer de configuració han d’usar el protocol HTTPS o adreces localhost. }}
    fetch_failed: No s’ha pogut recuperar el fitxer de configuració.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: La resposta HTTP ha retornat amb l’estat {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'No s’ha pogut recuperar el fitxer de configuració. Per evitar que es carregui el fitxer `config.yml`, afegiu <a>`load_config_file: false`</a> a l’objecte de configuració passat a `CMS.init()`.'
    parse_failed: No s’ha pogut analitzar el fitxer de configuració.
    parse_failed_invalid_object: El fitxer de configuració no és un objecte JavaScript vàlid.
    parse_failed_unsupported_type: El fitxer de configuració no és un tipus de fitxer vàlid. Només s’admeten YAML, TOML i JSON.
    no_collection: No s’han definit col·leccions.
    # Don’t localize `hide`
    no_visible_collection: Almenys una col·lecció ha de ser visible. Comproveu l’opció `hide`.
    missing_backend: No s’ha definit el rerefons.
    missing_backend_name: No s’ha definit el nom del rerefons.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: El rerefons {$name} no està <a>suportat</a> a Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: El rerefons obsolet {$name} no està <a>suportat</a> a Sveltia CMS.
    unsupported_custom_backend: Els rerefons personalitzats no estan <a>suportats</a> a Sveltia CMS.
    unsupported_backend_suggestion: Useu un dels <a>rerefons suportats</a> en el seu lloc.
    missing_repository: No s’ha definit el repositori.
    invalid_repository: El repositori configurat no és vàlid. Ha de tenir el format «owner/repo».
    # Don’t localize `api_root`
    missing_api_root: L’opció `api_root` no està definida. És obligatòria per al rerefons Forgejo.
    invalid_root_dir: El directori arrel no és vàlid. Ha de ser un camí dins del repositori, sense «..».
    invalid_root_dir_branch: El directori arrel no es pot usar als noms de branca dels modes de publicació `editorial_workflow` i `preview`. Cap part del camí pot començar amb un punt, acabar amb «.lock» ni contenir un espai o un caràcter especial com ara dos punts o un asterisc.
    path_outside_root_dir: El camí «{$path}» surt fora del directori arrel, on el CMS no pot llistar fitxers.
    oauth_implicit_flow: El mètode d’autenticació configurat (flux implícit) no és compatible amb Sveltia CMS. Useu un <a>mètode d’autenticació</a> diferent.
    github_pkce_unsupported: L’autorització PKCE encara no és compatible a causa de les limitacions de GitHub. Useu un <a>mètode d’autenticació</a> diferent.
    additions_no_base_url: L’opció `base_url` ha de ser l’URL del vostre servei de Sveltia CMS Additions.
    oauth_no_app_id: No s’ha definit l’ID de l’aplicació OAuth.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: L’opció `open_authoring` requereix el mode de publicació `editorial_workflow` o `preview`. Consulteu la <a>documentació</a> per a més detalls.
    # Don’t localize `auth_methods`
    no_auth_methods: L’opció `auth_methods` ha de contenir almenys un mètode.
    # Don’t localize `auth_scope`, `repo` and `public_repo`
    auth_scope_no_repo: L’opció `auth_scope` ha d’incloure `repo` o `public_repo`.
    missing_media_folder: No s’ha definit la carpeta multimèdia.
    public_folder_relative_path: La carpeta pública configurada no és vàlida. Ha de ser un camí absolut que comenci per «/».
    public_folder_absolute_url: No s’admet un URL absolut per a l’opció de carpeta pública a Sveltia CMS.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: L’opció `{$option}` conté l’etiqueta de plantilla `{$tag}`, que no s’admet en aquest lloc. Només es poden usar les etiquetes de plantilla del slug, com ara `\{\{slug\}\}` i `\{\{year\}\}`, i les etiquetes `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` i `\{\{public_folder\}\}`.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: L’opció `{$option}` conté l’etiqueta de plantilla `{$tag}`, que només es pot usar a l’opció d’una col·lecció, d’un fitxer de col·lecció o d’un camp, on hi ha una entrada amb què emplenar-la.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: L’opció `sanitize_replacement` està definida com a `{$replacement}`, però conté un caràcter que no es pot usar en un slug, de manera que no pot substituir-ne cap.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: L’opció `{$option}` està definida com a `{$url}`, però ha de ser un URL absolut que comenci per `https://` o `http://`.
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: L’opció `stages` de `publish_mode` ha de començar amb `draft` i llistar les etapes en l’ordre `draft`, `pending_review`, `pending_publish`, sense repetir-ne cap.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: L’opció `i18n.locales` ha de llistar almenys una llengua.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: L’opció `default_locale` està definida com a `{$locale}`, però no és cap de les `locales`.
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: L’opció `initial_locales` conté `{$locale}`, però no és cap de les `locales`.
    # Don’t localize `i18n`
    i18n_no_collections: 'L’opció `i18n` està configurada al nivell superior, però cap de les col·leccions ni dels singletons no té l’opció `i18n`, de manera que no es pot traduir cap contingut. Afegiu `i18n: true` a les col·leccions i els singletons que vulgueu traduir.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: L’opció `transformations` conté una clau `{$key}` no compatible. Ha de ser `raster_image`, `svg` o un format d’imatge ràster compatible.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: L’opció `quality` de la transformació `{$key}` no és vàlida. Ha de ser un nombre enter entre 0 i 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: L’opció `{$prop}` de la transformació `{$key}` no és vàlida. Ha de ser un nombre enter positiu.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: La col·lecció de recursos {$count} ha de tenir l’opció `name` definida com a cadena no buida.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: El nom de la col·lecció de recursos `{$name}` no és vàlid. No pot contenir caràcters especials.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Els noms de les col·leccions de recursos han de ser únics, però `{$name}` s’usa més d’una vegada.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: La col·lecció ha de tenir definida l’opció `folder`, `file`, `files` o `divider`.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: La col·lecció no pot tenir més d’una de les opcions `folder`, `file`, `files` i `divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: L’extensió `{$extension}` no coincideix amb el format `{$format}`.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: El camp `{$name}` es desa com a cos sota la capçalera (front matter), que només pot contenir text, no un número, un booleà, una llista o un objecte com fa un camp `{$widget}`. Useu un tipus de camp que contingui text o reanomeneu el camp.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
