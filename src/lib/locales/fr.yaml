    # {$name} is the user’s name
    github_required: '{$name} ne peut se connecter qu’avec GitHub, son nom d’utilisateur GitHub ne peut donc pas être supprimé. Réinitialisez d’abord son mot de passe pour lui permettre de se connecter avec un mot de passe.'
