      rules_description: Les membres de l’organisation GitHub sur laquelle l’application est installée peuvent se connecter sans avoir été ajoutés au préalable. Leur compte reçoit le rôle que vous choisissez et est désactivé s’ils quittent l’organisation, sauf si vous l’adoptez.
      org: Organisation GitHub
      add_rule: Ajouter une règle
