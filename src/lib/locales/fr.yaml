    github_tab: GitHub
    github:
      app: GitHub App
      repository: Dépôt
      not_installed: Non installée
      statuses:
        ok: L’application fonctionne.
        not_registered: Aucune GitHub App n’est encore configurée. Lancez l’assistant de configuration depuis la page de connexion avec le secret d’administration.
        key_missing: La clé privée de l’application a été perdue lors du remplacement du secret d’administration. Générez une nouvelle clé privée dans les paramètres de l’application sur GitHub et téléversez-la ci-dessous.
