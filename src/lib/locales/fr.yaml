    # its own, as line breaks aren’t kept in these files
    credentials_email:
      # {$name} is the user’s name
      greeting: Bonjour {$name},
      # {$url} is a link to the CMS that fills in the username and the temporary password
      sign_in_link: 'Lien de connexion : {$url}'
