    # {$field} is the label of the Markdown field the credit is added to
    insert_to_field: Insérer dans {$field}
    copy_as_markdown: Copier au format Markdown

  # Unsaved asset badge
  unsaved: Non enregistré

# Character counter: shows character count for text fields
character_counter:
  # {$count} is the current character count; {$min} and {$max} are configured limits
  min_max: |
    .input {$count :integer}
    .match $count
      0   {{ Aucun caractère saisi. Minimum : {$min}. Maximum : {$max}. }}
      one {{ {$count} caractère saisi. Minimum : {$min}. Maximum : {$max}. }}
      *   {{ {$count} caractères saisis. Minimum : {$min}. Maximum : {$max}. }}
  # {$count} is the current character count and {$min} is the minimum allowed count
  min: |
    .input {$count :integer}
    .match $count
      0   {{ Aucun caractère saisi. Minimum : {$min}. }}
      one {{ {$count} caractère saisi. Minimum : {$min}. }}
      *   {{ {$count} caractères saisis. Minimum : {$min}. }}
  # {$count} is the current character count and {$max} is the maximum allowed count
  max: |
    .input {$count :integer}
    .match $count
      0   {{ Aucun caractère saisi. Maximum : {$max}. }}
      one {{ {$count} caractère saisi. Maximum : {$max}. }}
      *   {{ {$count} caractères saisis. Maximum : {$max}. }}

# YouTube video player iframe title
youtube_video_player: Lecteur vidéo YouTube

