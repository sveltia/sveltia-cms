# Add item button label, also used by the Relation field to create a new entry in the referenced
# collection, with the collection’s singular label
# Example: “Add Image”, “Add Author”
# {$name} is the label of the item type that can be added
add_x: Ajouter {$name}

# List item context menu
# aria-label for the button opening the menu, and for the menu itself
list_item_options: Options de l’élément de liste
add_item_above: Ajouter un élément au-dessus
add_item_below: Ajouter un élément en dessous
paste_item_above: Coller l’élément au-dessus
paste_item_below: Coller l’élément en dessous
paste_item_to_replace: Coller pour remplacer

# List item clipboard
# Button in the list toolbar to paste a copied item, from any list in any entry, at the end of the
# list, or at the start with the `add_to_top` option
paste_item: Coller l’élément
list_item_copied: Élément copié.
# ⋮ stands for the icon of the item menu button; keep it, along with the button’s aria-label
no_list_item_to_paste: Aucun élément copié à coller. Pour en copier un, ouvrez le menu ⋮ (Options de l’élément de liste) d’un élément et sélectionnez Copier.
list_item_not_compatible: L’élément copié ne convient pas à cette liste.
# {$count} is the number of the values left out, as the list doesn’t have the fields
list_item_pasted_without_values: |
  .input {$count :integer}
  .match $count
    one {{ Élément collé. Une valeur que cette liste n’accepte pas a été ignorée. }}
    *   {{ Élément collé. {$count} valeurs que cette liste n’accepte pas ont été ignorées. }}
# {$count} is the number of the files the pasted item references that couldn’t be found
list_item_pasted_without_files: |
  .input {$count :integer}
  .match $count
    one {{ Élément collé, mais un fichier qu’il utilise est introuvable. Vérifiez les champs de fichier de l’élément. }}
    *   {{ Élément collé, mais {$count} fichiers qu’il utilise sont introuvables. Vérifiez les champs de fichier de l’élément. }}

# Variable-type list selector
select_list_type: Sélectionner le type de liste

# Variable-type mismatch
unknown_variable_type: Cet élément ne peut pas être affiché en raison d’un type inconnu. Consultez la console du navigateur pour plus de détails.

# ==============================================================================
# Field Widgets
# ==============================================================================
# Strings for specific field widget types.

# Color field: opacity slider
opacity: Opacité

# Select field: empty option placeholder
unselected_option: (Aucun)

# Relation field: creating or editing a referenced entry without leaving the editor
relation_field:
  # Note shown in the dialog. {$name} is the singular label of the referenced collection
  save_together_hint: Le nouvel élément ({$name}) sera enregistré en même temps que l’entrée que vous modifiez.
  # Error shown when the entry couldn’t be prepared. {$name} is the singular label of the collection
  add_failed: Impossible d’ajouter l’élément ({$name}). Consultez la console du navigateur pour plus de détails.
  # Title of the dialog to edit an entry selected in the field. {$name} is the singular label of the
  # referenced collection
  edit_entry_title: 'Modification : {$name}'
  # Note shown in the dialog. {$name} is the singular label of the referenced collection
  edit_together_hint: Vos modifications de cet élément ({$name}) seront enregistrées en même temps que l’entrée que vous modifiez.
  # Error shown when the changes couldn’t be prepared. {$name} is the singular label of the collection
  edit_failed: Impossible d’appliquer les modifications de l’élément ({$name}). Consultez la console du navigateur pour plus de détails.
  # Error shown when the changes would move the entry to another file path, e.g. through a path
  # template using a field. {$name} is the singular label of the collection
  move_unsupported: Ces modifications déplaceraient l’élément ({$name}) vers un autre emplacement, ce qui n’est possible qu’en le modifiant séparément.
  # Error shown when saving, if someone else has changed an entry edited from the field since. {$name}
  # is the summary of that entry
  edit_conflict: « {$name} » a été modifié par quelqu’un d’autre depuis que vous l’avez modifié. Rouvrez-le depuis le champ pour comparer vos modifications avec la dernière version.
  # Error shown when saving, if someone else has deleted an entry edited from the field since.
  # {$name} is the summary of that entry
  edit_deleted: « {$name} » a été supprimé par quelqu’un d’autre depuis que vous l’avez modifié. Retirez-le du champ pour enregistrer l’entrée.
  # Accessible label of the menu listing the selected entries that can be edited
  select_entry_to_edit: Sélectionner une entrée à modifier
  # Warning shown in the editor of an entry that has been edited from a Relation field of another
  # entry, while the changes wait in that entry’s pull request. {$name} is the summary of that
  # entry
  edited_with_entry: Des modifications de cette entrée attendent d’être publiées avec « {$name} ». Si vous l’enregistrez maintenant, les deux ensembles de modifications seront combinés lors de la publication de cette entrée, ce qui risque d’échouer s’ils se chevauchent.
  # Warning shown in the dialog when an entry edited from the field has been changed by someone else
  # since. {$name} is the singular label of the collection
  changed_since_edit: Cet élément ({$name}) a été modifié par quelqu’un d’autre depuis que vous l’avez modifié. Vos modifications sont affichées par-dessus la dernière version. Vérifiez-les avant de mettre à jour.

# Select Assets dialog
assets_dialog:
  # Dialog titles for different selection modes
  title:
    file: Sélectionner un fichier
    image: Sélectionner une image
    folder: Sélectionner un dossier

  # Search input labels
  search_for_file: Rechercher des fichiers
  search_for_image: Rechercher des images

