switching_language: Passage en {$locale}…
locale_load_failed: Impossible de charger la traduction en {$locale}. Veuillez réessayer plus tard.

# Site and page navigation
# Toolbar button aria-label for visiting the live site
visit_live_site: Visiter le site en ligne
# Page switcher button group aria-label for switching between main sections
switch_page: Changer de page

# Search input placeholders
search_placeholder_contents: Rechercher des contenus…
search_placeholder_assets: Rechercher des ressources…
search_placeholder_all: Rechercher des contenus et des ressources…

# Create button: aria-label for the create menu in the toolbar
create_entry_or_assets: Créer une entrée ou des ressources

# Publishing actions: button labels and progress indicators
publish_changes: Publier les modifications
publishing_changes: Publication des modifications…
# Error notification when publishing fails
publishing_changes_failed: Impossible de publier les modifications. Veuillez réessayer.

# Notifications: button aria-labels and section headings
show_notifications: Afficher les notifications
notifications: Notifications

# Account menu: button aria-labels and section headings
show_account_menu: Afficher le menu du compte
# Account section heading in the account menu and mobile menu page
account: Compte

# Account menu items: links to external resources
live_site: Site en ligne
git_repository: Dépôt Git
settings: Paramètres

# Help menu: button aria-labels and section headings
show_help_menu: Afficher le menu d’aide
# Help section heading in dropdowns and mobile menu
help: Aide

# Help menu items: documentation and support resources
keyboard_shortcuts: Raccourcis clavier
documentation: Documentation
release_notes: Notes de version
announcements: Annonces
# Version badge aria-label in the release notes menu item
# {$version} is the current app version string
version_x: 'Version {$version}'
# Additional help menu items
report_issue: Signaler un problème
share_feedback: Donner votre avis
get_help: Obtenir de l’aide
donate: Faire un don
join_discord: Rejoignez-nous sur Discord
bluesky: Suivez-nous sur Bluesky

# Update notification: infobar message and button
update_available: La dernière version de Sveltia CMS est disponible.
update_now: Mettre à jour maintenant

# Backend status notifications
# Shown when the Git backend (GitHub, GitLab, etc.) is experiencing issues
# {$service} is the backend service label shown in the toolbar notice, e.g., GitHub or GitLab
backend_status:
  minor_incident: '{$service} rencontre un incident mineur. Votre flux de travail peut être affecté.'
  major_incident: '{$service} rencontre un incident majeur. Il est conseillé d’attendre que la situation s’améliore.'

# ==============================================================================
# Content and Asset Libraries
# ==============================================================================
# Strings used in the main content and asset management interfaces, including
# lists, navigation, and collection/folder views.

# Page container aria-labels
content_library: Bibliothèque de contenu
asset_library: Bibliothèque de ressources

# Primary sidebar section headings and list aria-labels
collections: Collections
entries: Entrées
files: Fichiers

# Asset location selector: option group labels
asset_location:
  # Assets stored in the site’s Git repository
  repository: Votre site
  external: Emplacements externes
  stock_photos: Banques d’images

# Sidebar and list labels
# Collection assets panel aria-label
collection_assets: Ressources de la collection
# List aria-labels for different list types
entry_list: Liste des entrées
file_list: Liste des fichiers
asset_list: Liste des ressources

# Collection and folder page titles
# Used as aria-labels on page containers
# {$collection} is the current collection label
x_collection: Collection « {$collection} »
# {$folder} is the current asset folder label
x_asset_folder: Dossier de ressources « {$folder} »

# Navigation announcements (ARIA live regions)
# Announce page changes for screen reader users
viewing_collection_list: Vous consultez maintenant la liste des collections.
viewing_asset_folder_list: Vous consultez maintenant la liste des dossiers de ressources.
# Collection view announcements with entry counts
# {$collection} is the collection label and {$count} is the number of entries in it
viewing_x_collection: |
  .input {$count :integer}
  .match $count
    0   {{ Vous consultez maintenant la collection « {$collection} », qui ne contient encore aucune entrée. }}
    one {{ Vous consultez maintenant la collection « {$collection} », qui contient une entrée. }}
    *   {{ Vous consultez maintenant la collection « {$collection} », qui contient {$count} entrées. }}
# Asset folder view announcements with asset counts
# {$folder} is the folder label and {$count} is the number of assets in it
viewing_x_asset_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Vous consultez maintenant le dossier de ressources « {$folder} », qui ne contient encore aucune ressource. }}
    one {{ Vous consultez maintenant le dossier de ressources « {$folder} », qui contient une ressource. }}
    *   {{ Vous consultez maintenant le dossier de ressources « {$folder} », qui contient {$count} ressources. }}

# Singleton file selection announcement
# {$file} is the singleton file name
singleton_selected_announcement: Appuyez sur Entrée pour modifier le fichier « {$file} ».

# Error messages: collection or file not found
collection_not_found: Collection introuvable.
file_not_found: Fichier introuvable.

# Selection count indicator
# Shown in the toolbar when items are selected (e.g., “2 of 10 selected”)
# {$selected} is the selected item count and {$total} is the total item count
x_of_x_selected: '{$selected} sur {$total} sélectionné(s)'

# View switcher: toggle between list and grid views
switch_view: Changer de vue
list_view: Vue liste
grid_view: Vue grille
switch_to_list_view: Passer à la vue liste
switch_to_grid_view: Passer à la vue grille

