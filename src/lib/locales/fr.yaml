      github_only_warning: |
        .input {$count :integer}
        .match $count
          one {{ Un utilisateur ne peut se connecter qu’avec GitHub et ne pourra plus se connecter une fois cette option désactivée, tant que vous n’aurez pas réinitialisé son mot de passe. }}
          *   {{ {$count} utilisateurs ne peuvent se connecter qu’avec GitHub et ne pourront plus se connecter une fois cette option désactivée, tant que vous n’aurez pas réinitialisé leurs mots de passe. }}
