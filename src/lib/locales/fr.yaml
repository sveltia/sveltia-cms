  # Appearance panel
  appearance:
    title: Apparence
    theme: Thème
    select_theme: Sélectionner un thème

  # Theme options
  theme:
    dark: Sombre
    light: Clair

  # Language panel
  language:
    title: Langue
    ui_language:
      title: Langue de l’interface utilisateur
      select_language: Sélectionner une langue

  # Contents panel
  contents:
    title: Contenus
    editor:
      title: Éditeur
      use_draft_backup:
        switch_label: Sauvegarde automatique des brouillons d’entrée
      close_on_save:
        switch_label: Fermer l’éditeur après l’enregistrement d’un brouillon
      close_with_escape:
        switch_label: Fermer l’éditeur avec la touche Échap

  # Internationalization panel
  i18n:
    title: Internationalisation
    translators:
      default:
        title: Service de traduction par défaut
        select_service: Sélectionner un service
      api_keys:
        title: Clés API des services de traduction
        description: Gérez les clés API des <a>services de traduction</a>.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: 'Clé {$service}'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Inscrivez-vous à <a {$homeHref}>{$service}</a> et saisissez ici <a {$apiKeyHref}>votre clé API</a> pour activer la traduction rapide des champs de texte.

  # Media panel
  media:
    title: Médias
    stock_photos:
      api_keys:
        title: Clés API des services de banques d’images
        description: Gérez les clés API des <a>services de banques d’images</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: 'Clé API {$service}'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Inscrivez-vous à <a {$homeHref}>l’API {$service}</a> et saisissez ici <a {$apiKeyHref}>votre clé API</a> pour insérer des photos libres de droits dans les champs image.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Photos fournies par {$service}
      no_services: Aucun <a>service de banques d’images</a> n’est configuré.
    cloud_storage:
      api_keys:
        title: Clés API des services de stockage cloud
        description: Gérez les clés API des <a>services de stockage cloud</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: 'Clé API {$service}'
      no_services: Aucun <a>service de stockage cloud</a> n’est configuré.

  # Accessibility panel
  accessibility:
    title: Accessibilité
    underline_links:
      title: Souligner les liens
      description: Afficher un soulignement pour les liens dans l’aperçu de l’entrée et les libellés de l’interface utilisateur.
      switch_label: Toujours souligner les liens

  # Advanced panel
  advanced:
    title: Avancé
    beta:
      title: Fonctionnalités bêta
      description: Activer certaines fonctionnalités bêta susceptibles d’être instables ou non localisées.
      switch_label: Rejoindre le programme bêta
    developer_mode:
      title: Mode développeur
      description: Activer certaines fonctionnalités destinées aux développeurs, notamment des journaux de console détaillés et des menus contextuels natifs.
      switch_label: Activer le mode développeur
    deploy_hook:
      title: Hook de déploiement
      description: Saisissez l’URL du webhook à appeler lorsque vous déclenchez manuellement un déploiement en sélectionnant Publier les modifications. Ce champ peut rester vide si vous utilisez GitHub Actions.
      # Hook URL input
      url:
        field_label: URL du hook
        saved: URL du hook enregistrée.
        removed: URL du hook supprimée.
      # Authorization header input
      auth:
        field_label: En-tête d’autorisation (par exemple, Bearer <token>) (facultatif)
        saved: En-tête d’autorisation enregistré.
        removed: En-tête d’autorisation supprimé.

