    sign_in:
      github: Autoriser la connexion avec GitHub
      github_description: Les utilisateurs se connectent avec leur compte GitHub et obtiennent leur propre jeton GitHub, de sorte que leurs modifications sont commitées en leur nom. Un administrateur doit d’abord les ajouter avec leur nom d’utilisateur GitHub, sauf si une règle d’inscription les couvre.
