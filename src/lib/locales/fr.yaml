  .input {$count :integer}
  .match $count
    one {{ Impossible de vérifier quelles entrées utilisent cette ressource. Fermez cette boîte de dialogue et réessayez. }}
    *   {{ Impossible de vérifier quelles entrées utilisent ces ressources. Fermez cette boîte de dialogue et réessayez. }}

