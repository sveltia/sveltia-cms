descending: '{$label}, de Z à A'
descending_date: '{$label}, du plus récent au plus ancien'

# Filter menu: button labels and options
filter: Filtrer
filtering_options: Options de filtrage

# Group menu: button labels and options
group: Grouper
grouping_options: Options de groupement

# Asset type filter and group labels
type: Type
all: Tous
# Asset type labels
image: Image
video: Vidéo
audio: Audio
document: Document
other: Autre

# Toolbar toggles: show/hide panels
show_assets: Afficher les ressources
hide_assets: Masquer les ressources
show_info: Afficher les informations
hide_info: Masquer les informations

# Folder display labels when no specific path is configured
all_assets: Toutes les ressources
global_assets: Ressources globales

# ==============================================================================
# Entry and Collection Actions
# ==============================================================================
# Strings related to creating, editing, and managing entries and collections.

# Error message when entry cannot be found
entry_not_found: Entrée introuvable.

# Entry creation restrictions: tooltip and advisory messages
creating_entries_disabled_by_admin: La création d’entrées dans cette collection est désactivée par l’administrateur.
# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: Vous ne pouvez pas ajouter d’entrées à cette collection, car elle a atteint sa limite de {$quota} entrées.
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$remaining :integer}
  .match $remaining
    one {{ Cette collection approche de sa limite de {$quota} entrées. Vous ne pouvez plus créer que {$remaining} entrée supplémentaire. }}
    *   {{ Cette collection approche de sa limite de {$quota} entrées. Vous ne pouvez plus créer que {$remaining} entrées supplémentaires. }}

# Navigation: back links and list labels
back_to_collection: Retour à la collection
collection_list: Liste des collections
back_to_collection_list: Retour à la liste des collections
asset_folder_list: Liste des dossiers de ressources
back_to_asset_folder_list: Retour à la liste des dossiers de ressources

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: Résultats de recherche
# {$terms} is the current search query text
search_results_for_x: Résultats de recherche pour « {$terms} »

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Vous consultez maintenant les résultats de recherche pour « {$terms} ». Nous n’avons trouvé aucune entrée. }}
    one {{ Vous consultez maintenant les résultats de recherche pour « {$terms} ». Nous avons trouvé une entrée. }}
    *   {{ Vous consultez maintenant les résultats de recherche pour « {$terms} ». Nous avons trouvé {$count} entrées. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Vous consultez maintenant les résultats de recherche pour « {$terms} ». Nous n’avons trouvé aucune ressource. }}
    one {{ Vous consultez maintenant les résultats de recherche pour « {$terms} ». Nous avons trouvé une ressource. }}
    *   {{ Vous consultez maintenant les résultats de recherche pour « {$terms} ». Nous avons trouvé {$count} ressources. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ Aucune entrée }}
    one {{ {$count} entrée }}
    *   {{ {$count} entrées }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ Aucune ressource }}
    one {{ {$count} ressource }}
    *   {{ {$count} ressources }}

# Empty state messages
no_files_found: Aucun fichier trouvé.
no_entries_found: Aucune entrée trouvée.

# ==============================================================================
# Asset Management
# ==============================================================================
# Strings for uploading, editing, and managing assets (images, documents, etc.).

# Upload dialog: title and button label
upload_assets: Téléverser de nouvelles ressources

# Edit options menu: button and item labels
edit_options: Options de modification
show_edit_options: Afficher les options de modification
# Edit menu items with specific asset names
edit_asset: Modifier la ressource
# {$name} is the selected asset name
edit_x: 'Modifier {$name}'

# Asset text editor: switch for line wrapping
wrap_long_lines: Retour à la ligne automatique

# Rename asset: dialog and validation
rename_asset: Renommer la ressource
# {$name} is the current asset name
rename_x: 'Renommer {$name}'
# Dialog body text indicating how many entries reference this asset
# {$count} is the number of entries that currently reference the asset
enter_new_name_for_asset: |
  .input {$count :integer}
  .match $count
    0   {{ Saisissez un nouveau nom ci-dessous. }}
    one {{ Saisissez un nouveau nom ci-dessous. Une entrée utilisant cette ressource sera également mise à jour. }}
    *   {{ Saisissez un nouveau nom ci-dessous. {$count} entrées utilisant cette ressource seront également mises à jour. }}
# Validation errors for asset renaming
enter_new_name_for_asset_error:
  empty: Le nom du fichier ne peut pas être vide.
  character: Le nom du fichier ne peut pas contenir de caractères spéciaux.
  duplicate: Ce nom de fichier est déjà utilisé par une autre ressource.
# Confirmation dialog shown when the file extension is changed while renaming an asset
change_file_extension: Modifier l’extension de fichier
# {$oldExtension} and {$newExtension} are file extensions without a leading dot, e.g. png
confirm_file_extension_change:
  change: Voulez-vous vraiment remplacer l’extension « .{$oldExtension} » par « .{$newExtension} » ?
  add: Voulez-vous vraiment ajouter l’extension « .{$newExtension} » ?
  remove: Voulez-vous vraiment supprimer l’extension « .{$oldExtension} » ?
file_extension_change_warning: Le fichier risque de ne pas s’afficher ou d’être traité incorrectement si l’extension ne correspond pas au format réel du fichier.

# Replace asset: menu item and dialog title
replace_asset: Remplacer la ressource
# {$name} is the asset being replaced
replace_x: 'Remplacer {$name}'

# File selection prompts: drop zones and file pickers
# Browse prompt shown when drag-and-drop is unavailable on desktop and pointer devices
click_to_browse: Cliquez pour parcourir…
# Browse prompt shown on touch devices
tap_to_browse: Appuyez pour parcourir…
# Drop zone text with browse button
# {$count} is the number of files expected by the current picker mode
drop_files_or_click_to_browse: |
