        # {$app} is the name of the CMS
        message: Vous pouvez désormais vous connecter à {$app}. Ouvrez le lien ci-dessous, qui remplit votre nom d’utilisateur et votre mot de passe temporaire, puis choisissez votre propre mot de passe lors de la connexion.
      reset:
        # {$app} is the name of the CMS
        subject: Votre mot de passe pour {$app} a été réinitialisé
        # {$app} is the name of the CMS
        message: Votre mot de passe pour {$app} a été réinitialisé et vous avez été déconnecté partout. Ouvrez le lien ci-dessous, qui remplit votre nom d’utilisateur et votre mot de passe temporaire, puis choisissez un nouveau mot de passe lors de la connexion.
