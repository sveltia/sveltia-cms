local_git_skip_reasons:
  unsupported_repository: Votre dépôt utilise une fonctionnalité de Git que le CMS ne prend pas en charge, comme un worktree lié, des noms d’objets SHA-256, le format reftable, un index partiel (sparse index) ou un index en version 3 ou 4, utilisé par l’option feature.manyFiles et par git add -N.
  missing_identity: Votre nom et votre adresse e-mail ne sont pas définis dans la configuration Git du dépôt, et le CMS ne peut pas lire votre configuration globale. Définissez-les dans le dépôt avec git config --local user.name "Your Name" et git config --local user.email "you@example.com".
  locked: Un autre processus Git utilise le dépôt. Si aucun n’est en cours d’exécution, supprimez le fichier .git/index.lock.
  # The operation in progress, with how to finish or cancel it
  operation_in_progress:
    merge: Une fusion (merge) est en cours. Terminez-la avec git commit ou annulez-la avec git merge --abort.
    rebase: Un rebase est en cours. Terminez-le avec git rebase --continue ou annulez-le avec git rebase --abort. Si vous êtes passé à autre chose, git rebase --quit l’abandonne sans modifier vos fichiers.
    cherry_pick: Un cherry-pick est en cours. Terminez-le avec git cherry-pick --continue ou annulez-le avec git cherry-pick --abort.
    revert: Un revert est en cours. Terminez-le avec git revert --continue ou annulez-le avec git revert --abort.
    am: L’application de correctifs avec git am est en cours. Terminez-la avec git am --continue ou annulez-la avec git am --abort.
    conflict: Certains fichiers comportent des conflits. Résolvez-les et indexez d’abord les résultats.
  detached_head: Aucune branche n’est extraite.
  staged_changes: D’autres modifications sont indexées pour le commit. Commitez-les ou retirez-les d’abord de l’index.
