    search_fetch_failed: Une erreur s’est produite lors de la recherche de ressources. Veuillez réessayer plus tard.
    image_fetch_failed: Une erreur s’est produite lors du téléchargement de la ressource sélectionnée. Veuillez réessayer plus tard.

