  .input {$count :integer}
  .match $count
    one {{ Déposez un fichier image ici ou }}
    *   {{ Déposez des fichiers image ici ou }}

# File picker and clipboard actions used by upload controls
browse: Parcourir
# Generic clipboard paste action used by non-image file fields
paste: Coller
# Clipboard paste action used by image fields
paste_image: Coller l’image

# Clipboard paste errors
no_image_in_clipboard: Aucune image trouvée dans le presse-papiers.
clipboard_access_denied: Accès au presse-papiers refusé.

# Drag-and-drop overlay text (shown while dragging)
# {$count} is the number of files expected by the current picker mode
drop_files_here: |
  .input {$count :integer}
  .match $count
    one {{ Déposez un fichier ici }}
    *   {{ Déposez des fichiers ici }}

# File type validation errors
unsupported_file_type: Type de fichier non pris en charge
# {$type} is the expected asset type label, such as image or document
dropped_file_type_mismatch: 'Le fichier déposé n’est pas d’un des types suivants : {$types}. Veuillez réessayer.'
dropped_image_type_mismatch: 'Le fichier déposé n’est pas pris en charge. Seule une image des types suivants est acceptée : {$types}. Veuillez réessayer.'

# File chooser button label
# {$count} is the number of files the picker allows the user to choose
choose_files: |
  .input {$count :integer}
  .match $count
    one {{ Choisir un fichier }}
    *   {{ Choisir des fichiers }}

# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    one {{ Supprimer la ressource }}
    *   {{ Supprimer les ressources }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Supprimer la ressource sélectionnée }}
    *   {{ Supprimer les ressources sélectionnées }}
confirm_deleting_this_asset: Voulez-vous vraiment supprimer cette ressource ?
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
