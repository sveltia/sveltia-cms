  .input {$quota :integer}
  .match $quota
    one {{ Vous ne pouvez pas ajouter d’entrées à cette collection, car elle a atteint sa limite de {$quota} entrée. }}
    *   {{ Vous ne pouvez pas ajouter d’entrées à cette collection, car elle a atteint sa limite de {$quota} entrées. }}
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$quota :integer}
  .input {$remaining :integer}
  .match $quota $remaining
    one one {{ Cette collection approche de sa limite de {$quota} entrée. Vous ne pouvez plus créer que {$remaining} entrée supplémentaire. }}
    one *   {{ Cette collection approche de sa limite de {$quota} entrée. Vous ne pouvez plus créer que {$remaining} entrées supplémentaires. }}
    *   one {{ Cette collection approche de sa limite de {$quota} entrées. Vous ne pouvez plus créer que {$remaining} entrée supplémentaire. }}
