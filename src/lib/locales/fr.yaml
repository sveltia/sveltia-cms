  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: La date/heure doit être égale ou postérieure à {$min}.
    date: La date doit être égale ou postérieure à {$min}.
    time: L’heure doit être égale ou postérieure à {$min}.
    number: La valeur doit être supérieure ou égale à {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Vous devez sélectionner au moins {$min} option. }}
        *   {{ Vous devez sélectionner au moins {$min} options. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Vous devez ajouter au moins {$min} élément. }}
        *   {{ Vous devez ajouter au moins {$min} éléments. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: La date/heure doit être égale ou antérieure à {$max}.
    date: La date doit être égale ou antérieure à {$max}.
    time: L’heure doit être égale ou antérieure à {$max}.
    number: La valeur doit être inférieure ou égale à {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ Vous ne pouvez pas sélectionner plus de {$max} option. }}
        *   {{ Vous ne pouvez pas sélectionner plus de {$max} options. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ Vous ne pouvez pas ajouter plus de {$max} élément. }}
        *   {{ Vous ne pouvez pas ajouter plus de {$max} éléments. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Vous devez saisir au moins {$min} caractère. }}
      *   {{ Vous devez saisir au moins {$min} caractères. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ Vous ne pouvez pas saisir plus de {$max} caractère. }}
      *   {{ Vous ne pouvez pas saisir plus de {$max} caractères. }}

  # Type validation errors
  type_mismatch:
    number: Veuillez saisir un nombre.
    email: Veuillez saisir une adresse e-mail valide.
    url: Veuillez saisir une URL valide.

