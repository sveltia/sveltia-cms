    save_allowed_domains: Enregistrer les domaines autorisés
    allowed_domains_saved: Les domaines autorisés ont été enregistrés.
    sign_in_tab: Connexion
    # {$latest} is the newest version of Sveltia CMS Additions, {$current} the one in use
