    auth_key_label: Clé secrète API
    open_library: Ouvrir Cloudinary

  uploadcare:
    auth_key_label: Clé secrète API

  aws_s3:
    auth_key_label: Clé d’accès secrète

  cloudflare_r2:
    auth_key_label: Clé d’accès secrète

  digitalocean_spaces:
    auth_key_label: Clé d’accès secrète

# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ La configuration du CMS comporte une erreur. Veuillez résoudre le problème et réessayer. }}
      *   {{ La configuration du CMS comporte des erreurs. Veuillez résoudre les problèmes et réessayer. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: 'collection {$collection}'
    file: 'fichier {$file}'
    component: 'composant {$component}'
    # Don’t localize `{$field}`
    field: 'champ `{$field}`'

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS ne fonctionne qu’avec des URL HTTPS ou localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ L’URL du fichier de configuration doit utiliser le protocole HTTPS ou une adresse localhost. }}
        *   {{ Les URL des fichiers de configuration doivent utiliser le protocole HTTPS ou des adresses localhost. }}
    fetch_failed: Impossible de récupérer le fichier de configuration.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: La réponse HTTP a renvoyé le statut {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Impossible de récupérer le fichier de configuration. Pour empêcher le chargement du fichier `config.yml`, ajoutez <a>`load_config_file: false`</a> à l’objet de configuration transmis à `CMS.init()`.'
    parse_failed: Impossible d’analyser le fichier de configuration.
    parse_failed_invalid_object: Le fichier de configuration n’est pas un objet JavaScript valide.
    parse_failed_unsupported_type: Le fichier de configuration n’est pas d’un type valide. Seuls les formats YAML, TOML et JSON sont pris en charge.
    no_collection: Aucune collection n’est définie.
    missing_backend: Le backend n’est pas défini.
    missing_backend_name: Le nom du backend n’est pas défini.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Le backend {$name} n’est <a>pas pris en charge</a> dans Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Le backend {$name}, obsolète, n’est <a>pas pris en charge</a> dans Sveltia CMS.
    unsupported_custom_backend: Les backends personnalisés ne sont <a>pas pris en charge</a> dans Sveltia CMS.
    unsupported_backend_suggestion: Utilisez plutôt l’un des <a>backends pris en charge</a>.
    missing_repository: Le dépôt n’est pas défini.
    invalid_repository: Le dépôt configuré n’est pas valide. Il doit être au format « owner/repo ».
    oauth_implicit_flow: La méthode d’authentification configurée (flux implicite) n’est pas prise en charge dans Sveltia CMS. Utilisez plutôt une autre <a>méthode d’authentification</a>.
    github_pkce_unsupported: L’autorisation PKCE n’est pas encore prise en charge en raison des limitations de GitHub. Utilisez plutôt une autre <a>méthode d’authentification</a>.
    oauth_no_app_id: L’identifiant de l’application OAuth n’est pas défini.
    # Don’t localize `auth_methods`
    no_auth_methods: L’option `auth_methods` doit contenir au moins une méthode.
    missing_media_folder: Le dossier des médias n’est pas défini.
    invalid_media_folder: Le dossier des médias configuré n’est pas valide. Il doit s’agir d’une chaîne.
    invalid_public_folder: Le dossier public configuré n’est pas valide. Il doit s’agir d’une chaîne.
    public_folder_relative_path: Le dossier public configuré n’est pas valide. Il doit s’agir d’un chemin absolu commençant par « / ».
    public_folder_absolute_url: Une URL absolue pour l’option de dossier public n’est pas prise en charge dans Sveltia CMS.
    # Don’t localize `asset_collections`
    invalid_asset_collections: L’option `asset_collections` n’est pas valide. Il doit s’agir d’un tableau.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: La collection de ressources {$count} doit avoir l’option `name` définie comme une chaîne non vide.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Le nom de collection de ressources `{$name}` n’est pas valide. Il ne doit pas contenir de caractères spéciaux.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Les noms de collections de ressources doivent être uniques, or `{$name}` est utilisé plusieurs fois.
    # Don’t localize `media_folder`
    asset_collection_invalid_media_folder: La collection de ressources `{$name}` doit avoir l’option `media_folder` définie comme une chaîne.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_no_options: La collection doit avoir l’option `folder`, `files` ou `divider` définie.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_multiple_options: La collection ne peut pas avoir les options `folder`, `files` et `divider` en même temps.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: L’extension `{$extension}` ne correspond pas au format `{$format}`.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Le modèle de slug `{$slug}` n’est pas valide, car il ne peut pas contenir de barres obliques. Pour organiser les entrées dans des sous-dossiers, utilisez l’option `path` au lieu de `slug`.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: L’option `reorder` fait référence à un groupe de vue nommé `{$name}`, mais aucun groupe de ce nom n’est défini dans l’option `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: L’option `sortable_fields` fait référence à un champ nommé `{$name}`, mais aucun champ de ce nom n’est défini dans la collection.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: L’option `view_groups` fait référence à un champ nommé `{$name}`, mais aucun champ de ce nom n’est défini dans la collection.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: L’option `view_filters` fait référence à un champ nommé `{$name}`, mais aucun champ de ce nom n’est défini dans la collection.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: Le groupe de vue {$count} doit avoir l’option `name` définie comme une chaîne non vide.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: Le nom de groupe de vue `{$name}` n’est pas valide. Il ne doit pas contenir de caractères spéciaux.
    duplicate_view_group_name: Les noms de groupes de vue doivent être uniques, or `{$name}` est utilisé plusieurs fois.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: Le filtre de vue {$count} doit avoir l’option `name` définie comme une chaîne non vide.
    # {$name} is the invalid or duplicate view filter name
    invalid_view_filter_name: Le nom de filtre de vue `{$name}` n’est pas valide. Il ne doit pas contenir de caractères spéciaux.
    duplicate_view_filter_name: Les noms de filtres de vue doivent être uniques, or `{$name}` est utilisé plusieurs fois.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: La collection {$count} doit avoir l’option `name` définie comme une chaîne non vide.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: Le nom de collection `{$name}` n’est pas valide. Il ne doit pas contenir de caractères spéciaux.
    duplicate_collection_name: Les noms de collections doivent être uniques, or `{$name}` est utilisé plusieurs fois.
    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
    missing_collection_file_name: Le fichier de collection {$count} doit avoir l’option `name` définie comme une chaîne non vide.
    # {$name} is the invalid or duplicate collection file name
    invalid_collection_file_name: Le nom de fichier de collection `{$name}` n’est pas valide. Il ne doit pas contenir de caractères spéciaux.
    duplicate_collection_file_name: Les noms de fichiers de collection doivent être uniques, or `{$name}` est utilisé plusieurs fois.
    # Don’t localize `fields`
    collection_no_fields: La collection doit avoir l’option `fields` définie avec au moins un champ.
    # Don’t localize `fields`
    collection_file_no_fields: Le fichier de collection doit avoir l’option `fields` définie avec au moins un champ.
    # Don’t localize `i18n`, `locale` and `file`
    collection_file_i18n_required: Le fichier de collection doit avoir l’option `i18n` définie si l’espace réservé `locale` est utilisé dans le chemin `file`.
    # {$count} is the 1-based field index in the current fields array; Don’t localize `name`
    missing_field_name: Le champ {$count} doit avoir l’option `name` définie comme une chaîne non vide.
    # {$name} is the invalid or duplicate field name
    invalid_field_name: Le nom de champ `{$name}` n’est pas valide. Il ne doit pas contenir de caractères spéciaux. Si vous souhaitez imbriquer des champs, <a>utilisez des champs Object plutôt que la notation par points</a>.
    duplicate_field_name: Les noms de champs doivent être uniques, or `{$name}` est utilisé plusieurs fois.
    # {$count} is the 1-based variable type index in the current types array
    missing_variable_type: Le type variable {$count} doit avoir l’option `name` définie comme une chaîne non vide.
    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: Le nom de type variable `{$name}` n’est pas valide. Il ne doit pas contenir de caractères spéciaux.
    duplicate_variable_type: Les noms de types variables doivent être uniques, or `{$name}` est utilisé plusieurs fois.
    date_field_type: 'Le type de champ Date, obsolète, n’est pas pris en charge dans Sveltia CMS. Utilisez plutôt le type de champ DateTime avec l’option `type: date`.'
    # {$timeZone} is the invalid IANA timezone identifier from the configuration
    invalid_timezone: 'Fuseau horaire non valide : {$timeZone}. Il doit s’agir d’un identifiant de fuseau horaire IANA valide, comme `America/New_York` ou `Asia/Tokyo`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: L’option `{$prop}`, obsolète, n’est pas prise en charge dans Sveltia CMS. Utilisez plutôt l’option `{$newProp}`.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: L’option `allow_multiple` n’est pas prise en charge dans Sveltia CMS. Utilisez plutôt l’option `multiple`, dont la valeur par défaut est `false`.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: Le champ List ne peut pas avoir les options `field`, `fields` et `types` en même temps.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: Le type variable du champ List n’est pas valide. L’option `widget` est définie sur `{$widget}` alors qu’elle doit être `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: Le champ Object ne peut pas avoir les options `fields` et `types` en même temps.
    # Don’t localize `fields`, and `types`
    object_field_missing_fields: Le champ Object doit avoir l’option `fields` ou `types` définie.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: La collection `{$collection}` référencée n’est pas valide ou n’est pas définie.
    relation_field_invalid_collection_file: Le fichier `{$file}` référencé n’est pas valide ou n’est pas défini.
    # Don’t localize `file`
    relation_field_missing_file_name: L’option `file` doit être définie pour une relation vers une collection de fichiers.
    relation_field_invalid_value_field: Le champ de valeur référencé `{$field}` n’est pas valide ou n’est pas défini.
    unexpected: Erreur inattendue

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: L’identifiant de l’application OAuth n’est pas défini. Les utilisateurs doivent fournir un jeton d’accès pour se connecter.
    editorial_workflow_unsupported: Le flux éditorial n’est pas encore pris en charge dans Sveltia CMS.
    open_authoring_unsupported: L’Open Authoring n’est pas encore pris en charge dans Sveltia CMS.
    nested_collections_unsupported: Les collections imbriquées ne sont pas encore prises en charge dans Sveltia CMS.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: L’option `{$prop}` n’est pas prise en charge dans Sveltia CMS. Elle sera ignorée.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Les options `picker_utc` et les nouvelles options de fuseau horaire (`input_timezone` ou `output_utc`) sont toutes définies. Les nouvelles options sont prioritaires. Envisagez de supprimer `picker_utc` de votre configuration.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Consultez les notes de compatibilité pour plus de détails : {$link}'

  # Console tip shown after config load
  schema_tip: Pour une meilleure expérience de développement, vous pouvez valider votre fichier de configuration avec le schéma JSON de Sveltia CMS. Consultez {$link} pour plus de détails.

