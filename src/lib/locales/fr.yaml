  # Configuration error
  invalid: Le service n’est pas configuré correctement.

  # Authentication states
  auth:
    api_key:
      key_label: Clé API
      # {$key} is the credential label, e.g., API Key, and {$service} is the cloud service name
      initial: Saisissez votre {$key} pour {$service}.
      requested: Validation…
      # {$key} is the credential label the user entered, e.g., API Key
      error: La {$key} fournie n’est pas valide. Veuillez la vérifier et réessayer.
