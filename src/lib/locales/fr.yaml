# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ La configuration du CMS comporte une erreur. Veuillez résoudre le problème et réessayer. }}
      *   {{ La configuration du CMS comporte des erreurs. Veuillez résoudre les problèmes et réessayer. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: collection {$collection}
    file: fichier {$file}
    component: composant {$component}
    # Don’t localize `{$field}`
    field: champ `{$field}`

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS ne fonctionne qu’avec des URL HTTPS ou localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ L’URL du fichier de configuration doit utiliser le protocole HTTPS ou une adresse localhost. }}
        *   {{ Les URL des fichiers de configuration doivent utiliser le protocole HTTPS ou des adresses localhost. }}
    fetch_failed: Impossible de récupérer le fichier de configuration.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: La réponse HTTP a renvoyé le statut {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Impossible de récupérer le fichier de configuration. Pour empêcher le chargement du fichier `config.yml`, ajoutez <a>`load_config_file: false`</a> à l’objet de configuration transmis à `CMS.init()`.'
    parse_failed: Impossible d’analyser le fichier de configuration.
    parse_failed_invalid_object: Le fichier de configuration n’est pas un objet JavaScript valide.
    parse_failed_unsupported_type: Le fichier de configuration n’est pas d’un type valide. Seuls les formats YAML, TOML et JSON sont pris en charge.
    no_collection: Aucune collection n’est définie.
    # Don’t localize `hide`
    no_visible_collection: Au moins une collection doit être visible. Vérifiez l’option `hide`.
    missing_backend: Le backend n’est pas défini.
    missing_backend_name: Le nom du backend n’est pas défini.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Le backend {$name} n’est <a>pas pris en charge</a> dans Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Le backend {$name}, obsolète, n’est <a>pas pris en charge</a> dans Sveltia CMS.
    unsupported_custom_backend: Les backends personnalisés ne sont <a>pas pris en charge</a> dans Sveltia CMS.
    unsupported_backend_suggestion: Utilisez plutôt l’un des <a>backends pris en charge</a>.
    missing_repository: Le dépôt n’est pas défini.
    invalid_repository: Le dépôt configuré n’est pas valide. Il doit être au format « owner/repo ».
    # Don’t localize `api_root`
    missing_api_root: L’option `api_root` n’est pas définie. Elle est obligatoire pour le backend Forgejo.
    invalid_root_dir: Le répertoire racine n’est pas valide. Il doit s’agir d’un chemin à l’intérieur du dépôt, sans « .. ».
    invalid_root_dir_branch: Le répertoire racine ne peut pas être utilisé dans les noms de branche des modes de publication `editorial_workflow` et `preview`. Aucune partie de son chemin ne peut commencer par un point, se terminer par « .lock » ou contenir une espace ou un caractère spécial tel qu’un deux-points ou un astérisque.
    path_outside_root_dir: Le chemin « {$path} » mène en dehors du répertoire racine, où le CMS ne peut pas lister les fichiers.
    oauth_implicit_flow: La méthode d’authentification configurée (flux implicite) n’est pas prise en charge dans Sveltia CMS. Utilisez plutôt une autre <a>méthode d’authentification</a>.
    github_pkce_unsupported: L’autorisation PKCE n’est pas encore prise en charge en raison des limitations de GitHub. Utilisez plutôt une autre <a>méthode d’authentification</a>.
    additions_no_base_url: L’option `base_url` doit être l’URL de votre service Sveltia CMS Additions.
    oauth_no_app_id: L’identifiant de l’application OAuth n’est pas défini.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: L’option `open_authoring` nécessite le mode de publication `editorial_workflow` ou `preview`. Consultez la <a>documentation</a> pour plus de détails.
    # Don’t localize `auth_methods`
    no_auth_methods: L’option `auth_methods` doit contenir au moins une méthode.
    # Don’t localize `auth_scope`, `repo` and `public_repo`
    auth_scope_no_repo: L’option `auth_scope` doit inclure `repo` ou `public_repo`.
    missing_media_folder: Le dossier des médias n’est pas défini.
    public_folder_relative_path: Le dossier public configuré n’est pas valide. Il doit s’agir d’un chemin absolu commençant par « / ».
    public_folder_absolute_url: Une URL absolue pour l’option de dossier public n’est pas prise en charge dans Sveltia CMS.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: L’option `{$option}` contient la balise de modèle `{$tag}`, qui n’y est pas prise en charge. Seules les balises de modèle de slug, comme `\{\{slug\}\}` et `\{\{year\}\}`, ainsi que les balises `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` et `\{\{public_folder\}\}` peuvent être utilisées.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: L’option `{$option}` contient la balise de modèle `{$tag}`, qui ne peut être utilisée que dans l’option d’une collection, d’un fichier de collection ou d’un champ, où une entrée permet de la remplir.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: L’option `sanitize_replacement` est définie sur `{$replacement}`, mais elle contient un caractère qui ne peut pas être utilisé dans un slug ; elle ne peut donc pas servir de remplacement.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: L’option `{$option}` est définie sur `{$url}`, mais elle doit être une URL absolue commençant par `https://` ou `http://`.
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: L’option `stages` de `publish_mode` doit commencer par `draft` et lister les étapes dans l’ordre `draft`, `pending_review`, `pending_publish`, sans répétition.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: L’option `i18n.locales` doit contenir au moins une langue.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: L’option `default_locale` est définie sur `{$locale}`, mais cette valeur ne fait pas partie des `locales`.
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: L’option `initial_locales` contient `{$locale}`, mais cette valeur ne fait pas partie des `locales`.
    # Don’t localize `i18n`
    i18n_no_collections: 'L’option `i18n` est configurée au niveau supérieur, mais aucune collection ni aucun singleton n’a l’option `i18n` ; aucun contenu ne peut donc être traduit. Ajoutez `i18n: true` aux collections et aux singletons à traduire.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: L’option `transformations` contient une clé `{$key}` non prise en charge. Elle doit être `raster_image`, `svg` ou un format d’image matricielle pris en charge.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: L’option `quality` de la transformation `{$key}` n’est pas valide. Elle doit être un entier compris entre 0 et 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: L’option `{$prop}` de la transformation `{$key}` n’est pas valide. Elle doit être un entier positif.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: La collection de ressources {$count} doit avoir l’option `name` définie comme une chaîne non vide.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Le nom de collection de ressources `{$name}` n’est pas valide. Il ne doit pas contenir de caractères spéciaux.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Les noms de collections de ressources doivent être uniques, or `{$name}` est utilisé plusieurs fois.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: La collection doit avoir l’option `folder`, `file`, `files` ou `divider` définie.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: La collection ne peut pas avoir plus d’une des options `folder`, `file`, `files` et `divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: L’extension `{$extension}` ne correspond pas au format `{$format}`.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: Le champ `{$name}` est enregistré comme corps sous le front matter, qui ne peut contenir que du texte, et non un nombre, un booléen, une liste ou un objet comme le fait un champ `{$widget}`. Utilisez un type de champ contenant du texte, ou renommez le champ.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
    # brackets are escaped with backslashes for MessageFormat 2
    invalid_collection_data_file: L’option `file` `{$file}` n’est pas valide. Il doit s’agir du chemin d’un fichier JSON, sans l’espace réservé `\{\{locale\}\}`.
    # {$prop} is the option name; Don’t localize `file`
    unsupported_collection_data_file_option: L’option `{$prop}` n’est pas prise en charge dans une collection avec l’option `file`.
    # Don’t localize `file`, `publish_mode` and `simple`
    collection_data_file_workflow: Le flux éditorial et le flux d’aperçu, y compris la contribution ouverte, ne sont pas pris en charge dans une collection avec l’option `file`. Définissez l’option `publish_mode` de la collection sur `simple`.
    # {$prop} is the option name; Don’t localize `file` and `slug`. The curly brackets are escaped
    # with backslashes for MessageFormat 2
    collection_data_file_slug_tag: L’option `{$prop}` ne peut pas contenir la balise `\{\{slug\}\}` dans une collection avec l’option `file`, car le slug d’une entrée correspond à sa position, qui change lorsque les entrées sont réorganisées ou supprimées. Utilisez plutôt un champ à valeur unique.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Le modèle de slug `{$slug}` n’est pas valide, car il ne peut pas contenir de barres obliques. Pour organiser les entrées dans des sous-dossiers, utilisez l’option `path` au lieu de `slug`.
    # {$name} is the field name from the configuration; Don’t localize `identifier_field`
    invalid_identifier_field: L’option `identifier_field` fait référence à `{$name}`, mais aucun champ de ce nom n’est défini dans la collection.
    # {$name} is the field name from the configuration; Don’t localize `filter`
    invalid_filter_field: L’option `filter` fait référence à `{$name}`, mais aucun champ de ce nom n’est défini dans la collection.
    # Don’t localize `filter`, `value` and `pattern`
    invalid_filter_no_condition: L’option `filter` doit avoir l’option `value` ou `pattern` pour filtrer les entrées.
    # {$option} is an option name such as `slug` or `summary` and {$name} is the field name or template tag from the configuration
    option_field_not_found: L’option `{$option}` fait référence à `{$name}`, mais aucun champ de ce nom n’est défini.
    # {$name} is the field name from the configuration and {$widget} is its field type; Don’t localize `thumbnail`
    thumbnail_field_not_media: L’option `thumbnail` fait référence à `{$name}`, mais il doit s’agir d’un champ Image ou File, et non d’un champ `{$widget}`.
    # Don’t localize `inline` or `multiple`
    invalid_inline_component_fields: Le mode `inline` nécessite un seul champ Boolean, Color, DateTime, Number, Relation, Select ou String. Un champ Relation ou Select ne peut pas avoir l’option `multiple` activée.
    # {$option} is an option name such as `pattern` or `filter` and {$pattern} is the configured pattern
    invalid_regex: L’option `{$option}` contient une expression régulière non valide `{$pattern}`, qui est ignorée.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: L’option `reorder` fait référence à un groupe de vue nommé `{$name}`, mais aucun groupe de ce nom n’est défini dans l’option `view_groups`.
