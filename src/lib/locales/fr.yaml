    preview_path_no_date_field: L’option `preview_path` utilise des balises de date et d’heure, mais la collection n’a aucun champ DateTime pour les lire. Le lien d’aperçu ne sera donc pas affiché.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: L’option `preview_path_date_field` fait référence à un champ nommé `{$name}`, mais aucun champ DateTime portant ce nom n’est défini. Le lien d’aperçu ne sera donc pas affiché.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: L’option `preview_path` fait référence à `{$name}`, mais aucun champ de ce nom n’est défini dans la collection. Le lien d’aperçu ne sera donc pas affiché.
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: La collection n’a pas de champ `{$name}` pour nommer les nouvelles entrées ; chaque nouvelle entrée reçoit donc un slug aléatoire. Ajoutez un champ `{$name}`, ou définissez l’option `identifier_field` ou `slug`.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: L’option `i18n` de `slug` n’a aucun effet, car la collection n’utilise pas la structure i18n `multiple_files`, `multiple_folders` ou `multiple_root_folders`, dans laquelle chaque langue a son propre fichier.
    # Don’t localize `slug`, `template` and `auto_increment`
    slug_template_ignored: L’option `template` de `slug` est ignorée, car l’option `auto_increment` numérote les slugs à la place.
    # {$file} is the file path; Don’t localize `file`, `locale`, `i18n`, `false`,
    # `omit_default_locale_from_file_path` and the example paths. The curly brackets in the examples
    # are escaped with backslashes for MessageFormat 2
    locale_not_omitted_from_file_path: L’espace réservé `locale` ne peut pas être retiré du chemin `file` `{$file}` ; la langue par défaut y est donc conservée malgré l’option i18n `omit_default_locale_from_file_path`. Pour omettre la langue, utilisez l’espace réservé comme nom de dossier complet, par exemple `\{\{locale\}\}/about.md`, ou entre le nom du fichier et l’extension, par exemple `about.\{\{locale\}\}.md`. Pour la conserver, définissez l’option sur `false` dans l’option `i18n` du fichier.
    # Don’t localize `i18n`
    i18n_not_configured: L’option `i18n` est activée, mais l’i18n n’est pas configurée au niveau supérieur de la configuration ni dans la collection ; l’option n’a donc aucun effet.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: L’option `public_folder` est une chaîne vide ; le chemin `media_folder` est donc utilisé à la place pour les chemins de ressources enregistrés dans les entrées. Supprimez l’option ou définissez-la sur le chemin souhaité, par exemple `/images`.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: L’option `{$option}` n’est pas définie dans le schéma de configuration de Sveltia CMS. Elle sera ignorée. Vérifiez qu’il n’y a pas de faute de frappe ou d’erreur de syntaxe.
    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: L’option `default_localized` n’a aucun effet, car l’i18n n’est pas activée pour la collection. Utilisez plutôt l’option `default`.
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: L’option `default_localized` a une valeur pour `{$locale}`, qui ne fait pas partie des langues de la collection ; cette valeur n’est donc jamais utilisée.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Consultez les notes de compatibilité pour plus de détails : {$link}'

  # Console tip shown after config load
  schema_tip: Pour une meilleure expérience de développement, vous pouvez valider votre fichier de configuration avec le schéma JSON de Sveltia CMS. Consultez {$link} pour plus de détails.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Local
  # Browser compatibility warnings
  unsupported_browser: Le flux de travail local n’est pas pris en charge par votre navigateur. Veuillez utiliser Chrome ou Edge.
  disabled: Le flux de travail local est désactivé dans votre navigateur. <a>Voici comment l’activer</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Vous consultez maintenant le tableau du flux éditorial. Brouillons : {$draft}. En révision : {$review}. Prêts : {$ready}. Suppression en attente : {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Vous consultez maintenant le tableau du flux éditorial. Brouillons : {$draft}. En révision : {$review}. Suppression en attente : {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'Vous consultez maintenant le tableau du flux éditorial. Brouillons : {$draft}. Prêts : {$ready}. Suppression en attente : {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'Vous consultez maintenant la page Brouillons. Brouillons : {$draft}. Suppression en attente : {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Brouillon
  drafts: Brouillons
  in_review: En révision
  ready: Prêt
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Suppression en attente
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: Déploiement en cours

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Annuler la suppression
  confirm_cancelling_deletion: Voulez-vous vraiment annuler cette suppression ? L’entrée restera publiée.
  confirm_completing_deletion: Voulez-vous vraiment supprimer cette entrée ? Elle sera retirée immédiatement.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ Entrée marquée pour suppression. }}
      *   {{ {$count} entrées marquées pour suppression. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Modifications abandonnées. }}
      *   {{ Modifications de {$count} entrées abandonnées. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Annulation de la suppression…
  deletion_cancelled: Suppression annulée.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Impossible d’annuler la suppression. Veuillez réessayer.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Entrées non publiées
  published_entries: Entrées publiées
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Statut : {$status}'
  change_entry_status: Changer le statut de l’entrée
  # Editor toolbar: progress label while the status is being changed
  changing_status: Changement de statut…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Mise à jour du statut…
  status_updated: Statut mis à jour.
  # Error notification when the status could not be changed
  status_change_failed: Impossible de changer le statut. Veuillez réessayer.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: Actualiser
  refreshing: Actualisation…
  refreshed: Le tableau est à jour.
  # Error notification when the board could not be refreshed
  refresh_failed: Impossible d’actualiser le tableau. Veuillez réessayer.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: L’entrée contient des erreurs. Veuillez les corriger avant de changer le statut.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: L’entrée contient des erreurs. Veuillez les corriger avant de la publier.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Envoyer en révision
  confirm_sending_for_review: Vos modifications ont été enregistrées en tant que brouillon. Envoyer l’entrée en révision pour que quelqu’un puisse la relire et la publier ?
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: Marquer comme prête
  confirm_marking_as_ready: Vos modifications ont été enregistrées en tant que brouillon. Marquer l’entrée comme prête pour qu’elle puisse être publiée ?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Publier l’entrée
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Abandonner les modifications
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Voulez-vous vraiment supprimer cette entrée ? Elle ne sera retirée qu’une fois la suppression publiée. D’ici là, vous la retrouverez dans la liste des entrées, marquée « Suppression en attente ».
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Cette entrée n’a pas encore été publiée ; la supprimer revient à l’abandonner complètement.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Cette entrée contient des modifications non publiées. Les abandonner restaurera la version publiée. L’entrée elle-même ne sera pas supprimée.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Elle n’a pas encore été publiée, vos modifications non publiées seront donc abandonnées. Toute version déjà publiée restera publiée. }}
      *   {{ Elles n’ont pas encore été publiées, vos modifications non publiées seront donc abandonnées. Toute version déjà publiée restera publiée. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ L’une d’elles n’a pas encore été publiée, vos modifications non publiées seront donc abandonnées. Toute version déjà publiée restera publiée. }}
      *   {{ {$count} d’entre elles n’ont pas encore été publiées, vos modifications non publiées seront donc abandonnées. Toute version déjà publiée restera publiée. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: Voulez-vous vraiment publier cette entrée ? Vos modifications seront mises en ligne une fois votre site reconstruit.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Publication de l’entrée…
  entry_published: Entrée publiée.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Suppression de l’entrée…
  discarding_changes: Abandon des modifications…
  entry_deleted: Entrée supprimée.
  # Error notification when publishing fails
  publishing_entry_failed: Impossible de publier l’entrée. Veuillez réessayer.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: Cette entrée ne peut pas être publiée ici, car elle s’accompagne d’autres modifications que le CMS ne peut pas vous montrer. Demandez à un développeur de la vérifier.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: L’entrée a été modifiée depuis que vous l’avez ouverte. Rechargez la page pour vérifier la dernière version avant de la publier.
  review_on_x: Réviser sur {$service}
  from_fork: Depuis un fork
  fork_entry_editable: Cette entrée provient de la pull request d’un contributeur, ouverte depuis « {$fork} ». Vos modifications sont enregistrées dans sa branche. Révisez et fusionnez la pull request sur le service Git.
  fork_entry_locked: Cette entrée provient de la pull request d’un contributeur, ouverte depuis « {$fork} ». Le contributeur n’autorise pas les mainteneurs à la modifier ; elle ne peut donc qu’être consultée ici.
  fork_not_editable: Le contributeur n’autorise pas les mainteneurs à modifier cette pull request.
  fork_entry_gone: La pull request du contributeur n’est plus ouverte ; les modifications ne peuvent donc pas y être enregistrées.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: Une autre demande ({$number}) est déjà ouverte pour cette entrée en dehors du CMS. Demandez à un développeur de la fermer d’abord.
  # Workflow page: empty column message
  no_entries: Aucune entrée.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Faire glisser pour changer le statut
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Suppression
  # Workflow page: note on a card listing the new entries that were created from a Relation field
  # of the entry and are published along with it, e.g. “Also adds Section: Getting Started”
  companion_entries: Ajoute aussi {$entries}
  # Workflow page: note on a card listing the existing entries that were edited from a Relation
  # field of the entry and are published along with it, e.g. “Also changes Author: Ada Lovelace”
  edited_companion_entries: Modifie aussi {$entries}
  # Workflow page: one of the entries listed by `companion_entries` or `edited_companion_entries`,
  # named by its collection’s singular label and its title
  companion_entry: '{$collection} : {$title}'

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: Message de commit
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: Décrivez vos modifications. Le message est enregistré dans l’historique avec celles-ci.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: Ajoutez une note au message enregistré dans l’historique avec vos modifications, par exemple un numéro de ticket. Ce champ peut rester vide.
  # Accessible name of the text box when the user writes the whole message
  message: Message de commit
  # Accessible name of the text box when the text is added before or after the message
  addition: Note
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'Message : {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Créer un fork du dépôt
  fork: Créer un fork
  confirm_forking_repository: Pour proposer des modifications à « {$repo} », un fork du dépôt doit être créé sur votre compte. Vos modifications sont enregistrées dans ce fork, puis relues par un mainteneur avant d’être mises en ligne.
  # Error shown when the user declined the dialog above
  fork_declined: Vous avez besoin d’un fork du dépôt sur votre compte pour proposer des modifications.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Impossible de créer un fork du dépôt « {$repo} » sur votre compte.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: Votre fork « {$fork} » n’a pas de branche « {$branch} ». Mettez à jour le fork à partir du dépôt « {$repo} », puis reconnectez-vous.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Impossible de vérifier votre accès au dépôt « {$repo} ». Veuillez réessayer dans un instant.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Le dépôt « {$repo} » n’autorise pas les forks. Demandez à un mainteneur d’activer les forks pour ce dépôt.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Vous avez une invitation en attente pour le dépôt « {$repo} ». Acceptez-la sur GitHub, puis reconnectez-vous.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Votre connexion n’inclut pas l’accès aux dépôts privés, le dépôt « {$repo} » ne peut donc pas être lu. Demandez à un mainteneur de vérifier les paramètres d’authentification du CMS.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Seul un mainteneur peut publier des modifications sur ce site. Passez plutôt votre entrée en « En révision », et quelqu’un y jettera un œil.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: Un mainteneur a déjà publié cette entrée ; il n’y a donc plus rien à réviser.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Cette modification ne peut pas être effectuée directement. Seules les modifications d’entrées peuvent être proposées à la révision.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Vos modifications sont enregistrées dans votre fork de ce dépôt, « {$repo} », et relues avant d’être mises en ligne.
  view_fork: Voir le fork

# ==============================================================================
# Settings Dialog
# ==============================================================================
# Strings for the settings/preferences dialog and its panels.

# Settings page aria-label
categories: Catégories

# Preferences panels
prefs:
  account:
    title: Compte
  # API key management feedback messages
  changes:
    api_key_saved: Clé API enregistrée.
    api_key_removed: Clé API supprimée.
    api_key_invalid: La clé API fournie n’est pas valide. Veuillez la vérifier et réessayer.

  # Preferences operation errors
  error:
    permission_denied: L’accès au stockage des cookies a été refusé. Veuillez vérifier les autorisations de votre navigateur et réessayer.

  # Appearance panel
  appearance:
    title: Apparence
    theme: Thème
    select_theme: Sélectionner un thème

  # Theme options
  theme:
    dark: Sombre
    light: Clair

  # Language panel
  language:
    title: Langue
    ui_language:
      title: Langue de l’interface utilisateur
      select_language: Sélectionner une langue

  # Contents panel
  contents:
    title: Contenus
    editor:
      title: Éditeur
      use_draft_backup:
        switch_label: Sauvegarde automatique des brouillons d’entrée
      close_on_save:
        switch_label: Fermer l’éditeur après l’enregistrement d’un brouillon
      close_with_escape:
        switch_label: Fermer l’éditeur avec la touche Échap

  # Internationalization panel
  i18n:
    title: Internationalisation
    translators:
      default:
        title: Service de traduction par défaut
        select_service: Sélectionner un service
      api_keys:
        title: Clés API des services de traduction
        description: Gérez les clés API des <a>services de traduction</a>. Les clés API des services d’IA génériques peuvent être gérées dans les paramètres d’IA.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: Clé {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Inscrivez-vous à <a {$homeHref}>{$service}</a> et saisissez ici <a {$apiKeyHref}>votre clé API</a> pour activer la traduction rapide des champs de texte.

  # Media panel
  media:
    title: Médias
    stock_photos:
      api_keys:
        title: Clés API des services de banques d’images
        description: Gérez les clés API des <a>services de banques d’images</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: Clé API {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Inscrivez-vous à <a {$homeHref}>l’API {$service}</a> et saisissez ici <a {$apiKeyHref}>votre clé API</a> pour insérer des photos libres de droits dans les champs image.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Photos fournies par {$service}
      no_services: Aucun <a>service de banques d’images</a> n’est configuré.
    cloud_storage:
      api_keys:
        title: Clés API des services de stockage cloud
        description: Gérez les clés API des <a>services de stockage cloud</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: Clé API {$service}
      no_services: Aucun <a>service de stockage cloud</a> n’est configuré.

  # AI panel
  ai:
    title: IA
    api_keys:
      title: Clés API des services d’IA
      description: Gérez les clés API des services d’IA.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: Clé API {$service}

  # Accessibility panel
  accessibility:
    title: Accessibilité
    underline_links:
      title: Souligner les liens
      description: Afficher un soulignement pour les liens dans l’aperçu de l’entrée et les libellés de l’interface utilisateur.
      switch_label: Toujours souligner les liens

  # Data Management panel
  data:
    title: Gestion des données
    clear_data:
      title: Effacer les données
      # Clear File Cache button
      file_cache:
        description: Supprimer le contenu des fichiers et les miniatures d’images mis en cache localement pour libérer de l’espace de stockage ou résoudre les problèmes causés par des données obsolètes.
        button_label: Vider le cache des fichiers
        confirmation: Le contenu des fichiers et les miniatures d’images mis en cache localement seront supprimés. Vos brouillons non enregistrés et vos paramètres seront conservés, et les données supprimées seront téléchargées ou générées à nouveau si nécessaire. Le CMS sera rechargé une fois l’opération terminée.
      # Erase All Data button
      all_data:
        description: Supprimer tout ce que le CMS conserve dans ce navigateur, y compris les fichiers en cache, les brouillons non enregistrés et les paramètres. Tout ce qui est déjà enregistré dans votre dépôt ne sera pas affecté.
        button_label: Effacer toutes les données
        confirmation: Toutes les données stockées dans ce navigateur seront supprimées, y compris le contenu des fichiers en cache, les miniatures d’images, les brouillons non enregistrés, les paramètres et l’état de connexion. Votre dépôt ne sera pas affecté, mais toute modification non enregistrée sera perdue et vous devrez vous reconnecter. Le CMS sera rechargé une fois l’opération terminée.

  # Developer panel
  developer:
    title: Développeur
    developer_mode:
      title: Mode développeur
      description: Activer certaines fonctionnalités destinées aux développeurs, notamment des journaux de console détaillés et des menus contextuels natifs.
      switch_label: Activer le mode développeur
    local_git:
      title: Commits Git
      description: Commiter vos modifications dans la branche actuelle de votre dépôt local à chaque enregistrement, comme le fait le CMS lorsque vous travaillez avec un dépôt distant. Vous pouvez ensuite vérifier et pousser les commits avec vos outils Git habituels.
      switch_label: Commiter les modifications dans Git
      checking: Vérification du dépôt…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Les modifications seront commitées dans la branche {$branch} en tant que {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Les modifications ne peuvent pas être commitées pour le moment. {$reason}
    deploy_hook:
      title: Hook de déploiement
      description: Saisissez l’URL du webhook à appeler lorsque vous déclenchez manuellement un déploiement en sélectionnant Publier les modifications. Ce champ peut rester vide si vous utilisez GitHub Actions ou GitLab CI/CD.
      # Hook URL input
      url:
        field_label: URL du hook
        saved: URL du hook enregistrée.
        removed: URL du hook supprimée.
      # Authorization header input
      auth:
        field_label: En-tête d’autorisation (par exemple, Bearer <token>) (facultatif)
        saved: En-tête d’autorisation enregistré.
        removed: En-tête d’autorisation supprimé.

