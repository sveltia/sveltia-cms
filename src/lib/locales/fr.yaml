  error:
    title: Erreur
    description: Une erreur s’est produite lors de l’enregistrement de l’entrée. Veuillez réessayer plus tard.

# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: Entrée modifiée par quelqu’un d’autre
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} a modifié cette entrée le {$date}, après que vous l’avez ouverte.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Cette entrée a été modifiée dans le dépôt après que vous l’avez ouverte.
  deleted: Cette entrée a été supprimée du dépôt après que vous l’avez ouverte.
  # Follows `modified_by` or `modified`
  overwrite_warning: Si vous enregistrez maintenant, les modifications de l’autre personne seront perdues.
  # Follows `deleted`
  recreate_warning: Si vous enregistrez maintenant, l’entrée sera recréée.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: L’entrée étant stockée dans le même fichier que d’autres entrées, elle ne peut pas être enregistrée par-dessus cette modification. Annulez la modification, puis rouvrez l’entrée depuis la liste et apportez vos changements.
  # OK button label
  save_anyway: Enregistrer quand même
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: Le dépôt a été mis à jour par quelqu’un d’autre pendant l’enregistrement. Veuillez réessayer.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Une entrée stockée dans le même fichier a été modifiée par quelqu’un d’autre. Veuillez réessayer.
  # {$path} is the file path
  array_file_invalid: Le fichier {$path} ne peut pas être mis à jour, car il ne contient pas de liste d’entrées valide.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
# repository while the user has it open. The change itself is described with the `save_conflict`
# strings above
remote_change:
  reload_entry: Recharger l’entrée
  # Confirmation shown before reloading when the user has unsaved changes
  confirm_reloading_entry: Voulez-vous vraiment recharger l’entrée ? Vos modifications non enregistrées seront perdues.

