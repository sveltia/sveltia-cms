# Strings used in the main content and asset management interfaces, including
# lists, navigation, and collection/folder views.

# Page container aria-labels
content_library: Библиотека със съдържание
asset_library: Библиотека с ресурси

# Primary sidebar section headings and list aria-labels
collections: Колекции
entries: Записи
files: Файлове

# Asset location selector: option group labels
asset_location:
  # Assets stored in the site’s Git repository
  repository: Вашият сайт
  external: Външни местоположения
  stock_photos: Стокови снимки

# Sidebar and list labels
# Collection assets panel aria-label
collection_assets: Ресурси на колекцията
# List aria-labels for different list types
entry_list: Списък със записи
file_list: Списък с файлове
asset_list: Списък с ресурси

# Collection and folder page titles
# Used as aria-labels on page containers
# {$collection} is the current collection label
x_collection: Колекция „{$collection}“
# {$folder} is the current asset folder label
x_asset_folder: Папка с ресурси „{$folder}“

# Navigation announcements (ARIA live regions)
# Announce page changes for screen reader users
viewing_collection_list: В момента разглеждате списъка с колекции.
viewing_asset_folder_list: В момента разглеждате списъка с папки с ресурси.
# Collection view announcements with entry counts
# {$collection} is the collection label and {$count} is the number of entries in it
viewing_x_collection: |
  .input {$count :integer}
  .match $count
    0   {{ В момента разглеждате колекцията „{$collection}“, която още няма записи. }}
    one {{ В момента разглеждате колекцията „{$collection}“, която има един запис. }}
    *   {{ В момента разглеждате колекцията „{$collection}“, която има {$count} записа. }}
# Asset folder view announcements with asset counts
# {$folder} is the folder label and {$count} is the number of assets in it
viewing_x_asset_folder: |
  .input {$count :integer}
  .match $count
    0   {{ В момента разглеждате папката с ресурси „{$folder}“, която още няма ресурси. }}
    one {{ В момента разглеждате папката с ресурси „{$folder}“, която има един ресурс. }}
    *   {{ В момента разглеждате папката с ресурси „{$folder}“, която има {$count} ресурса. }}

# Singleton file selection announcement
# {$file} is the singleton file name
