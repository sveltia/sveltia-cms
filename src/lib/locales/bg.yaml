# File Type Labels
# ==============================================================================
# Display labels for file types shown in asset info and upload previews.

file_type_labels:
  # Image formats
  avif: AVIF изображение
  bmp: Bitmap изображение
  gif: GIF изображение
  heic: HEIC изображение
  heif: HEIF изображение
  ico: Икона
  jpeg: JPEG изображение
  jpg: JPEG изображение
  png: PNG изображение
  svg: SVG изображение
  tif: TIFF изображение
  tiff: TIFF изображение
  webp: WebP изображение
  # Video formats
  avi: AVI видео
  m4v: MP4 видео
  mov: QuickTime видео
  mp4: MP4 видео
  mpeg: MPEG видео
  mpg: MPEG видео
  ogg: Ogg видео
  ogv: Ogg видео
  ts: MPEG видео
  webm: WebM видео
  3gp: 3GPP видео
  3g2: 3GPP2 видео
  # Audio formats
  aac: AAC аудио
  mid: MIDI
  midi: MIDI
  m4a: MP4 аудио
  mp3: MP3 аудио
  oga: Ogg аудио
  opus: OPUS аудио
  wav: WAV аудио
  weba: WebM аудио
  # Document formats
  csv: CSV електронна таблица
  doc: Word документ
  docx: Word документ
  odp: OpenDocument презентация
  ods: OpenDocument електронна таблица
  odt: OpenDocument текст
  pdf: PDF документ
  ppt: PowerPoint презентация
  pptx: PowerPoint презентация
  rtf: Форматиран текстов документ
  xls: Excel електронна таблица
  xlsx: Excel електронна таблица
  # Text formats
  html: HTML текст
  js: JavaScript
  json: JSON текст
  md: Markdown текст
  toml: TOML текст
  yaml: YAML текст
  yml: YAML текст

# ==============================================================================
# File Size Units
# ==============================================================================
# Labels for file size units used in formatted file sizes.

file_size_units:
  # {$size} is the formatted numeric size for the current unit
  b: '{$size} байта'
  kb: '{$size} КБ'
  mb: '{$size} МБ'
  gb: '{$size} ГБ'
  tb: '{$size} ТБ'
