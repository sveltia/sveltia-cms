# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Има грешка в конфигурацията на CMS. Отстранете проблема и опитайте отново. }}
      *   {{ Има грешки в конфигурацията на CMS. Отстранете проблемите и опитайте отново. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: колекция {$collection}
    file: файл {$file}
    component: компонент {$component}
    # Don’t localize `{$field}`
    field: поле `{$field}`

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS работи само с HTTPS или localhost адреси.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ URL адресът на конфигурационния файл трябва да използва протокол HTTPS или localhost адрес. }}
        *   {{ URL адресите на конфигурационните файлове трябва да използват протокол HTTPS или localhost адреси. }}
    fetch_failed: Конфигурационният файл не можа да бъде получен.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: HTTP отговорът върна статус {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Конфигурационният файл не можа да бъде получен. За да предотвратите зареждането на файла `config.yml`, добавете <a>`load_config_file: false`</a> към конфигурационния обект, подаден на `CMS.init()`.'
    parse_failed: Конфигурационният файл не можа да бъде обработен.
    parse_failed_invalid_object: Конфигурационният файл не е валиден JavaScript обект.
    parse_failed_unsupported_type: Конфигурационният файл не е от валиден тип. Поддържат се само YAML, TOML и JSON.
    no_collection: Не са дефинирани колекции.
    # Don’t localize `hide`
    no_visible_collection: Поне една колекция трябва да е видима. Проверете опцията `hide`.
    missing_backend: Бекендът не е дефиниран.
    missing_backend_name: Името на бекенда не е дефинирано.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Бекендът {$name} <a>не се поддържа</a> в Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Остарелият бекенд {$name} <a>не се поддържа</a> в Sveltia CMS.
    unsupported_custom_backend: Персонализираните бекенди <a>не се поддържат</a> в Sveltia CMS.
    unsupported_backend_suggestion: Използвайте един от <a>поддържаните бекенди</a>.
    missing_repository: Хранилището не е дефинирано.
    invalid_repository: Конфигурираното хранилище е невалидно. То трябва да е във формат „owner/repo“.
    oauth_implicit_flow: Конфигурираният метод за удостоверяване (implicit flow) не се поддържа в Sveltia CMS. Използвайте друг <a>метод за удостоверяване</a>.
    github_pkce_unsupported: PKCE оторизацията все още не се поддържа поради ограничения на GitHub. Използвайте друг <a>метод за удостоверяване</a>.
    oauth_no_app_id: Идентификаторът на OAuth приложението не е дефиниран.
    # Don’t localize `open_authoring` and `editorial_workflow`
    open_authoring_no_workflow: Опцията `open_authoring` изисква режим на публикуване `editorial_workflow`. Вижте <a>документацията</a> за подробности.
    # Don’t localize `auth_methods`
    no_auth_methods: Опцията `auth_methods` трябва да съдържа поне един метод.
    missing_media_folder: Папката за медия не е дефинирана.
    public_folder_relative_path: Конфигурираната публична папка е невалидна. Тя трябва да е абсолютен път, започващ с „/“.
    public_folder_absolute_url: Абсолютен URL адрес за опцията за публична папка не се поддържа в Sveltia CMS.
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: Опцията `transformations` съдържа неподдържан ключ `{$key}`. Той трябва да бъде `raster_image`, `svg` или поддържан формат за растерни изображения.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: Опцията `quality` за трансформацията `{$key}` е невалидна. Тя трябва да е цяло число между 0 и 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: Опцията `{$prop}` за трансформацията `{$key}` е невалидна. Тя трябва да е положително цяло число.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: Колекцията с ресурси {$count} трябва да има дефинирана опция `name` като непразен низ.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Името на колекцията с ресурси `{$name}` е невалидно. То не трябва да съдържа специални знаци.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Имената на колекциите с ресурси трябва да са уникални, но `{$name}` се използва повече от веднъж.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_no_options: Колекцията трябва да има дефинирана една от опциите `folder`, `files` или `divider`.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_multiple_options: Колекцията не може да има опциите `folder`, `files` и `divider` едновременно.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: Разширението `{$extension}` не съответства на формата `{$format}`.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Шаблонът за слъг `{$slug}` е невалиден, защото не може да съдържа наклонени черти. За да организирате записите в подпапки, използвайте опцията `path` вместо `slug`.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: Опцията `reorder` се отнася до група за изглед с име `{$name}`, но такава група не е дефинирана в опцията `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: Опцията `sortable_fields` се отнася до поле с име `{$name}`, но такова поле не е дефинирано в колекцията.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: Опцията `view_groups` се отнася до поле с име `{$name}`, но такова поле не е дефинирано в колекцията.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: Опцията `view_filters` се отнася до поле с име `{$name}`, но такова поле не е дефинирано в колекцията.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: Групата за изглед {$count} трябва да има дефинирана опция `name` като непразен низ.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: Името на групата за изглед `{$name}` е невалидно. То не трябва да съдържа специални знаци.
    duplicate_view_group_name: Имената на групите за изглед трябва да са уникални, но `{$name}` се използва повече от веднъж.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: Филтърът за изглед {$count} трябва да има дефинирана опция `name` като непразен низ.
    # {$name} is the invalid or duplicate view filter name
    invalid_view_filter_name: Името на филтъра за изглед `{$name}` е невалидно. То не трябва да съдържа специални знаци.
    duplicate_view_filter_name: Имената на филтрите за изглед трябва да са уникални, но `{$name}` се използва повече от веднъж.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: Колекцията {$count} трябва да има дефинирана опция `name` като непразен низ.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: Името на колекцията `{$name}` е невалидно. То не трябва да съдържа специални знаци.
    duplicate_collection_name: Имената на колекциите трябва да са уникални, но `{$name}` се използва повече от веднъж.
    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
    missing_collection_file_name: Файлът от колекция {$count} трябва да има дефинирана опция `name` като непразен низ.
    # {$name} is the invalid or duplicate collection file name
    invalid_collection_file_name: Името на файла от колекция `{$name}` е невалидно. То не трябва да съдържа специални знаци.
    duplicate_collection_file_name: Имената на файловете в колекциите трябва да са уникални, но `{$name}` се използва повече от веднъж.
    # Don’t localize `fields`
    collection_no_fields: Колекцията трябва да има дефинирана опция `fields` с поне едно поле.
    # Don’t localize `fields`
    collection_file_no_fields: Файлът от колекция трябва да има дефинирана опция `fields` с поне едно поле.
    # Don’t localize `i18n`, `locale` and `file`
    collection_file_i18n_required: Файлът от колекция трябва да има дефинирана опция `i18n`, ако в пътя `file` се използва заместителят `locale`.
    # {$count} is the 1-based field index in the current fields array; Don’t localize `name`
    missing_field_name: Полето {$count} трябва да има дефинирана опция `name` като непразен низ.
    # {$name} is the invalid or duplicate field name
    invalid_field_name: Името на полето `{$name}` е невалидно. То не трябва да съдържа специални знаци. Ако искате да влагате полета, <a>използвайте полета Object вместо точкова нотация</a>.
    duplicate_field_name: Имената на полетата трябва да са уникални, но `{$name}` се използва повече от веднъж.
    # {$count} is the 1-based variable type index in the current types array
    missing_variable_type: Променливият тип {$count} трябва да има дефинирана опция `name` като непразен низ.
    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: Името на променливия тип `{$name}` е невалидно. То не трябва да съдържа специални знаци.
    duplicate_variable_type: Имената на променливите типове трябва да са уникални, но `{$name}` се използва повече от веднъж.
    date_field_type: 'Остарелият тип поле Date не се поддържа в Sveltia CMS. Използвайте типа поле DateTime с опцията `type: date`.'
    # {$timeZone} is the invalid IANA timezone identifier from the configuration
    invalid_timezone: 'Невалидна часова зона: {$timeZone}. Трябва да е валиден идентификатор на часова зона по IANA, например `America/New_York` или `Asia/Tokyo`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: Остарялата опция `{$prop}` не се поддържа в Sveltia CMS. Използвайте опцията `{$newProp}`.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: Опцията `allow_multiple` не се поддържа в Sveltia CMS. Използвайте опцията `multiple`, чиято стойност по подразбиране е `false`.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: Полето List не може да има опциите `field`, `fields` и `types` едновременно.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: Променливият тип на полето List е невалиден. Опцията `widget` е зададена на `{$widget}`, но трябва да е `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: Полето Object не може да има опциите `fields` и `types` едновременно.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: Посочената колекция `{$collection}` е невалидна или не е дефинирана.
    relation_field_invalid_collection_file: Посоченият файл `{$file}` е невалиден или не е дефиниран.
    # Don’t localize `file`
    relation_field_missing_file_name: Опцията `file` трябва да е дефинирана за връзка към колекция от файлове.
    relation_field_invalid_value_field: Посоченото поле за стойност `{$field}` е невалидно или не е дефинирано.
    unexpected: Неочаквана грешка

    # Schema validation errors, reported when the configuration doesn’t match the published JSON
    # schema. In all of these, {$option} is a configuration option path such as `backend.name` or
    # `view_filters[0].pattern`, relative to the collection, file or field named before it.
    # {$type} is a value type name from `schema_value_type` below
    schema_invalid_type: Опцията `{$option}` трябва да бъде {$type}.
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'Опцията `{$option}` трябва да е една от следните стойности: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: Опцията `{$option}` трябва да бъде `{$value}`.
    schema_invalid_empty_value: Опцията `{$option}` трябва да бъде празен низ.
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: Опцията `{$option}` трябва да бъде масив от {$count} елемента.
    schema_invalid_value: Опцията `{$option}` има невалидна стойност.
    schema_missing_option: Опцията `{$option}` е задължителна.
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Една от следните опции е задължителна: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: низ
      number: число
      integer: цяло число
      boolean: булева стойност
      array: масив
      object: обект
      'null': празна

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: Идентификаторът на OAuth приложението не е дефиниран. За да влязат, потребителите трябва да предоставят токен за достъп.
    editorial_workflow_unsupported: Редакционният процес все още не се поддържа в Sveltia CMS.
    open_authoring_unsupported_backend: Open Authoring в момента се поддържа само с бекенда на GitHub.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: Опцията `{$prop}` не се поддържа в Sveltia CMS. Тя ще бъде пренебрегната.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Зададени са едновременно `picker_utc` и по-новите опции за часова зона (`input_timezone` или `output_utc`). Новите опции имат предимство. Обмислете премахването на `picker_utc` от вашата конфигурация.
    # Don’t localize `preview_path`
    preview_path_no_date_field: Опцията `preview_path` използва тагове за дата и час, но колекцията няма поле DateTime, от което да ги прочете, така че връзката за преглед няма да бъде показана.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: Опцията `preview_path_date_field` се отнася до поле с име `{$name}`, но не е дефинирано поле DateTime с това име, така че връзката за преглед няма да бъде показана.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: Опцията `preview_path` се отнася до `{$name}`, но такова поле не е дефинирано в колекцията, така че връзката за преглед няма да бъде показана.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: Опцията `{$option}` не е дефинирана в схемата за конфигурация на Sveltia CMS. Тя ще бъде пренебрегната. Проверете за печатна или синтактична грешка.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Вижте бележките за съвместимост за подробности: {$link}'

  # Console tip shown after config load
  schema_tip: За по-добро изживяване при разработка можете да проверите конфигурационния си файл спрямо JSON схемата на Sveltia CMS. Вижте {$link} за подробности.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Локално
  # Browser compatibility warnings
  unsupported_browser: Локалният работен процес не се поддържа във вашия браузър. Използвайте Chrome или Edge.
  disabled: Локалният работен процес е изключен във вашия браузър. <a>Ето как да го включите</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'В момента разглеждате таблото на редакционния процес. Чернови: {$draft}. За преглед: {$review}. Готови: {$ready}. Чакащи изтриване: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'В момента разглеждате таблото на редакционния процес. Чернови: {$draft}. За преглед: {$review}. Чакащи изтриване: {$deletion}.'

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Column headings for the Editorial Workflow feature (content review process).

status:
  draft: Чернова
  drafts: Чернови
  in_review: За преглед
  ready: Готови
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Чака изтриване

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Отказ от изтриването
  confirm_cancelling_deletion: Сигурни ли сте, че искате да се откажете от това изтриване? Записът ще остане публикуван.
  confirm_completing_deletion: Сигурни ли сте, че искате да изтриете този запис? Той ще бъде премахнат веднага.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ Записът е маркиран за изтриване. }}
      *   {{ {$count} записа са маркирани за изтриване. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Промените са отхвърлени. }}
      *   {{ Промените в {$count} записа са отхвърлени. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Отказ от изтриването…
  deletion_cancelled: Изтриването е отказано.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Изтриването не можа да бъде отказано. Опитайте отново.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Непубликувани записи
  published_entries: Публикувани записи
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Състояние: {$status}'
  change_entry_status: Промяна на състоянието на записа
  # Editor toolbar: progress label while the status is being changed
  changing_status: Промяна на състоянието…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Обновяване на състоянието…
  status_updated: Състоянието е обновено.
  # Error notification when the status could not be changed
  status_change_failed: Състоянието не можа да бъде променено. Опитайте отново.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: Записът съдържа грешки. Поправете ги, преди да промените състоянието.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: Записът съдържа грешки. Поправете ги, преди да го публикувате.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Изпращане за преглед
  confirm_sending_for_review: Промените ви са запазени като чернова. Да се изпрати ли записът за преглед, за да може някой да го прегледа и публикува?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Публикуване на записа
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Отхвърляне на промените
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Сигурни ли сте, че искате да изтриете този запис? Той няма да бъде премахнат, докато изтриването не бъде публикувано. Дотогава ще го намирате в списъка със записи, маркиран като „Чака изтриване“.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Този запис все още не е публикуван, така че изтриването му ще го отхвърли напълно.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Този запис има непубликувани промени. Отхвърлянето им ще възстанови публикуваната версия. Самият запис няма да бъде изтрит.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Той все още не е публикуван, така че непубликуваните ви промени ще бъдат отхвърлени. Всяка публикувана версия ще остане публикувана. }}
      *   {{ Те все още не са публикувани, така че непубликуваните ви промени ще бъдат отхвърлени. Всички публикувани версии ще останат публикувани. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ Един от тях все още не е публикуван, така че непубликуваните ви промени ще бъдат отхвърлени. Всяка публикувана версия ще остане публикувана. }}
      *   {{ {$count} от тях все още не са публикувани, така че непубликуваните ви промени ще бъдат отхвърлени. Всички публикувани версии ще останат публикувани. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry: Сигурни ли сте, че искате да публикувате този запис? Промените ви ще влязат в сила веднага.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Публикуване на записа…
  entry_published: Записът е публикуван.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Изтриване на записа…
  discarding_changes: Отхвърляне на промените…
  entry_deleted: Записът е изтрит.
  # Error notification when publishing fails
  publishing_entry_failed: Записът не можа да бъде публикуван. Опитайте отново.
  # Workflow page: empty column message
  no_entries: Няма записи.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Плъзнете, за да промените състоянието

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Разклоняване на хранилището
  fork: Разклоняване
  confirm_forking_repository: За да предложите промени в „{$repo}“, трябва да бъде създадено разклонение на хранилището в акаунта ви. Промените ви се запазват в това разклонение и поддържащ ги преглежда, преди да бъдат публикувани.
  # Error shown when the user declined the dialog above
  fork_declined: За да предлагате промени, ви е необходимо разклонение на хранилището в акаунта ви.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Не можа да бъде създадено разклонение на хранилището „{$repo}“ в акаунта ви.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Достъпът ви до хранилището „{$repo}“ не можа да бъде проверен. Опитайте отново след малко.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Хранилището „{$repo}“ не позволява разклонения. Помолете поддържащ да разреши разклоняването му.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Имате чакаща покана за хранилището „{$repo}“. Приемете я в GitHub и след това влезте отново.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Входът ви не включва достъп до частни хранилища, така че хранилището „{$repo}“ не може да бъде прочетено. Помолете поддържащ да провери настройките за удостоверяване на CMS.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Само поддържащ може да публикува промени в този сайт. Вместо това маркирайте записа си като „За преглед“ и някой ще го прегледа.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Тази промяна не може да бъде направена директно. Само редакции на записи могат да бъдат предлагани за преглед.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Промените ви се запазват в разклонението ви на това хранилище в „{$repo}“ и се преглеждат, преди да бъдат публикувани.
  view_fork: Преглед на разклонението

# ==============================================================================
# Settings Dialog
# ==============================================================================
# Strings for the settings/preferences dialog and its panels.

# Settings page aria-label
categories: Категории

# Site Configuration Editor
site_configuration_editor: Редактор на конфигурацията на сайта

# Preferences panels
prefs:
  # API key management feedback messages
  changes:
    api_key_saved: API ключът е запазен.
    api_key_removed: API ключът е премахнат.
    api_key_invalid: Предоставеният API ключ е невалиден. Проверете го и опитайте отново.

  # Preferences operation errors
  error:
    permission_denied: Достъпът до бисквитките е отказан. Проверете разрешенията на браузъра си и опитайте отново.

  # Appearance panel
  appearance:
    title: Външен вид
    theme: Тема
    select_theme: Избор на тема

  # Theme options
  theme:
    dark: Тъмна
    light: Светла

  # Language panel
  language:
    title: Език
    ui_language:
      title: Език на потребителския интерфейс
      select_language: Избор на език

  # Contents panel
  contents:
    title: Съдържание
    editor:
      title: Редактор
      use_draft_backup:
        switch_label: Автоматично създаване на резервни копия на черновите
      close_on_save:
        switch_label: Затваряне на редактора след запазване на чернова
      close_with_escape:
        switch_label: Затваряне на редактора с клавиша Escape

  # Internationalization panel
  i18n:
    title: Интернационализация
    translators:
      default:
        title: Услуга за превод по подразбиране
        select_service: Избор на услуга
      api_keys:
        title: API ключове за услугите за превод
        description: Управлявайте API ключовете за <a>услугите за превод</a>.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: Ключ за {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Регистрирайте се в <a {$homeHref}>{$service}</a> и въведете <a {$apiKeyHref}>своя API ключ</a> тук, за да включите бързия превод на текстовите полета.

  # Media panel
  media:
    title: Медия
    stock_photos:
      api_keys:
        title: API ключове за услугите за стокови снимки
        description: Управлявайте API ключовете за <a>услугите за стокови снимки</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: API ключ за {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Регистрирайте се за <a {$homeHref}>{$service} API</a> и въведете <a {$apiKeyHref}>своя API ключ</a> тук, за да вмъквате безплатни стокови снимки в полетата за изображения.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Снимките са предоставени от {$service}
      no_services: Не са конфигурирани <a>услуги за стокови снимки</a>.
    cloud_storage:
      api_keys:
        title: API ключове за услугите за облачно съхранение
        description: Управлявайте API ключовете за <a>услугите за облачно съхранение</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: API ключ за {$service}
      no_services: Не са конфигурирани <a>услуги за облачно съхранение</a>.

  # Accessibility panel
  accessibility:
    title: Достъпност
    underline_links:
      title: Подчертаване на връзките
      description: Показване на подчертаване на връзките в прегледа на записа и в етикетите на потребителския интерфейс.
      switch_label: Винаги подчертавай връзките

  # Advanced panel
  advanced:
    title: Разширени
    beta:
      title: Бета функции
      description: Включване на някои бета функции, които може да са нестабилни или непреведени.
      switch_label: Присъединяване към бета програмата
    developer_mode:
      title: Режим за разработчици
      description: Включване на някои функции за разработчици, включително подробни записи в конзолата и системни контекстни менюта.
      switch_label: Включване на режима за разработчици
    deploy_hook:
      title: Кука за внедряване
      description: Въведете URL адрес на уебкука, който да бъде извикан, когато ръчно стартирате внедряване чрез „Публикуване на промените“. Може да го оставите празен, ако използвате GitHub Actions.
      # Hook URL input
      url:
        field_label: URL адрес на куката
        saved: URL адресът на куката е запазен.
        removed: URL адресът на куката е премахнат.
      # Authorization header input
      auth:
        field_label: Заглавка Authorization (например Bearer <token>) (незадължително)
        saved: Заглавката Authorization е запазена.
        removed: Заглавката Authorization е премахната.
    clear_data:
      title: Изчистване на данните
      # Clear File Cache button
      file_cache:
        description: Изтриване на локално кешираното съдържание на файлове и миниатюри на изображения, за да се освободи място за съхранение или да се решат проблеми, причинени от остарели данни.
        button_label: Изчистване на файловия кеш
        confirmation: Локално кешираното съдържание на файлове и миниатюрите на изображения ще бъдат изтрити. Незапазените ви чернови и настройки ще бъдат запазени, а изтритите данни ще бъдат изтеглени или генерирани отново при нужда. CMS ще бъде презаредена след приключване.
      # Erase All Data button
      all_data:
        description: Изтриване на всичко, което CMS съхранява в този браузър, включително кешираните файлове, незапазените чернови и настройките. Всичко, което вече е запазено в хранилището ви, няма да бъде засегнато.
        button_label: Изтриване на всички данни
        confirmation: Всички данни, съхранени в този браузър, ще бъдат изтрити, включително кешираното съдържание на файлове, миниатюрите на изображения, незапазените чернови, настройките и състоянието на входа. Хранилището ви няма да бъде засегнато, но всички незапазени промени ще бъдат загубени и ще трябва да влезете отново. CMS ще бъде презаредена след приключване.

