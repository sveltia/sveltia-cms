viewing_asset_folder_list: В момента разглеждате списъка с папки с ресурси.
# Collection view announcements with entry counts
# {$collection} is the collection label and {$count} is the number of entries in it
viewing_x_collection: |
  .input {$count :integer}
  .match $count
    0   {{ В момента разглеждате колекцията „{$collection}“, която още няма записи. }}
    one {{ В момента разглеждате колекцията „{$collection}“, която има един запис. }}
    *   {{ В момента разглеждате колекцията „{$collection}“, която има {$count} записа. }}
# Asset folder view announcements with asset counts
# {$folder} is the folder label and {$count} is the number of assets in it
viewing_x_asset_folder: |
  .input {$count :integer}
  .match $count
    0   {{ В момента разглеждате папката с ресурси „{$folder}“, която още няма ресурси. }}
    one {{ В момента разглеждате папката с ресурси „{$folder}“, която има един ресурс. }}
    *   {{ В момента разглеждате папката с ресурси „{$folder}“, която има {$count} ресурса. }}
# Cloud storage service view announcement
# {$service} is the cloud storage service name, e.g. Uploadcare
viewing_x_external_location: В момента разглеждате ресурсите в {$service}.

# Singleton file selection announcement
# {$file} is the singleton file name
singleton_selected_announcement: Натиснете Enter, за да редактирате файла „{$file}“.

# Error messages: page, collection, folder or file not found
