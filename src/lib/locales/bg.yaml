# Main page titles in the global navigation and page switcher button group
contents: Съдържание
assets: Ресурси
editorial_workflow: Редакционен процес
# Name of the Editorial Workflow page when all the content uses Preview Workflow, which has no
# review stages, so the page only lists the drafts
drafts: Чернови
cms_config: Конфигурация на CMS
# Mobile menu page title (shown only on small screens)
menu: Меню
# Mobile menu page section heading listing the custom pages registered by the site
custom_pages: Страници

# Mobile promo infobar: encouraging users to try the mobile version
mobile_promo_title: Sveltia CMS вече е достъпна и на мобилни устройства!
mobile_promo_button: Опитайте

# New language infobar: encouraging users to switch to a newly available language
# {$locale} is the localized language name, e.g., “French”
new_language_available: Sveltia CMS вече е достъпна на {$locale}!
change_language: Смяна на езика

# Live reload infobar: shown when the CMS runs on a page that a framework’s development server (e.g.
# Astro) reloads on every file change, instead of a static HTML file
live_reload_warning: Сървърът ви за разработка презарежда тази страница при всяка промяна на файл, което може да прекъсне запазването и да повреди файловете ви. Вместо това заредете CMS от статичен HTML файл. <a>Научете повече</a>

# Toast notification shown while the translation for the selected language is being downloaded
# {$locale} is the localized language name, e.g., “French”
switching_language: Превключване към {$locale}…
locale_load_failed: Преводът на {$locale} не можа да бъде зареден. Опитайте отново по-късно.

# Toast notification shown when changes saved with the local backend couldn’t be committed to Git
# {$reason} is one of the `local_git_skip_reasons` strings below
local_git_not_committed: Промените ви са запазени, но не са комитнати в Git. {$reason} За да се запазват само файловете, изключете комитите в Git в Настройки > За разработчици.
local_git_skip_reasons:
  unsupported_repository: Хранилището ви използва функция на Git, която CMS не поддържа, например свързано работно дърво (linked worktree), SHA-256 имена на обекти, формата reftable, разреден индекс (sparse index) или индекс във версия 3 или 4, който се използва от опцията feature.manyFiles и от git add -N.
  missing_identity: Името и имейл адресът ви не са зададени в конфигурацията на Git на хранилището, а CMS не може да прочете глобалната ви конфигурация. Задайте ги в хранилището с git config --local user.name "Your Name" и git config --local user.email "you@example.com".
  locked: Друг процес на Git използва хранилището. Ако няма такъв процес, изтрийте файла .git/index.lock.
  # The operation in progress, with how to finish or cancel it
  operation_in_progress:
    merge: В момента тече сливане (merge). Завършете го с git commit или го отменете с git merge --abort.
    rebase: В момента тече пребазиране (rebase). Завършете го с git rebase --continue или го отменете с git rebase --abort. Ако вече не работите по него, git rebase --quit го прекратява, без да променя файловете ви.
    cherry_pick: В момента тече cherry-pick. Завършете го с git cherry-pick --continue или го отменете с git cherry-pick --abort.
    revert: В момента тече връщане (revert). Завършете го с git revert --continue или го отменете с git revert --abort.
    am: В момента се прилагат кръпки (patches) с git am. Завършете процеса с git am --continue или го отменете с git am --abort.
    conflict: Някои файлове имат конфликти. Първо ги разрешете и добавете резултатите в индекса (stage).
  detached_head: Не е избран никакъв клон.
  staged_changes: Имате други промени, добавени в индекса за комит. Първо ги комитнете или ги махнете от индекса.
  # {$path} is the file path
  lfs: '{$path} се следи с Git LFS, а CMS не може да комитва такива файлове.'
  # {$message} is the error message
  error: Възникна неочаквана грешка. {$message}

