# {$types} is the list of accepted file types, such as “.pdf or .txt”
warning_unsupported_files: |
  .input {$count :integer}
  .match $count
    one {{ Този файл не може да бъде качен, защото не е от следните типове: {$types}. }}
    *   {{ Тези файлове не могат да бъдат качени, защото не са от следните типове: {$types}. }}
# {$count} is the number of files that are not of an image type the field accepts
# {$types} is the list of accepted image formats, such as “PNG or WebP”
warning_unsupported_image_files: |
  .input {$count :integer}
  .match $count
    one {{ Този файл не може да бъде качен, защото се приемат само изображения от следните типове: {$types}. }}
    *   {{ Тези файлове не могат да бъдат качени, защото се приемат само изображения от следните типове: {$types}. }}

# File format validation when replacing an asset
# Warning section for replacement files that are in a different format
mismatched_files: Файлове с различен формат
# {$name} is the name of the asset being replaced and {$count} is the number of mismatched files
warning_mismatched_files: |
  .input {$count :integer}
  .match $count
    one {{ Този файл не може да замени „{$name}“, защото е в различен формат. Конвертирайте файла в същия формат и опитайте отново. }}
    *   {{ Тези файлове не могат да заменят „{$name}“, защото са в различен формат. Конвертирайте файловете в същия формат и опитайте отново. }}

