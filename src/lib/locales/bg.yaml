    allow_multiple: Опцията `allow_multiple` не се поддържа в Sveltia CMS. Използвайте опцията `multiple`, чиято стойност по подразбиране е `false`.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: Полето List не може да има опциите `field`, `fields` и `types` едновременно.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: Променливият тип на полето List е невалиден. Опцията `widget` е зададена на `{$widget}`, но трябва да е `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: Полето Object не може да има опциите `fields` и `types` едновременно.
    # {$min} and {$max} are option names such as `min` and `max` or `minlength` and `maxlength`
    invalid_range_options: Опцията `{$min}` не трябва да е по-голяма от опцията `{$max}`.
    # {$step} is the configured value; Don’t localize `step`
    invalid_step: Опцията `step` е зададена на `{$step}`, но трябва да е по-голяма от нула или да е `-1`, за да се изключи задаването на стъпка.
    # Don’t localize `options`
    select_field_no_options: Полето Select трябва да има поне един елемент в опцията `options`.
    # {$value} is the option value from the configuration; Don’t localize `options`
    select_field_duplicate_option: Стойностите в `options` на полето Select трябва да са уникални, но `{$value}` се използва повече от веднъж.
    # {$value} is the default value from the configuration; Don’t localize `default` and `options`
    select_field_invalid_default: Опцията `default` на полето Select е зададена на `{$value}`, но тази стойност не е сред `options`.
    # Don’t localize `fields` and `types`
    list_field_no_subfields: Опцията `fields` или `types` на полето List трябва да има поне един елемент. Пропуснете опцията, ако списъкът е от обикновени стойности.
    # Don’t localize `default`, `fields` and `types`
    list_field_invalid_default_object: Опцията `default` на полето List съдържа обект, но всеки елемент трябва да е обикновена стойност, защото полето няма `fields` или `types`.
    # {$value} is the default item from the configuration; Don’t localize `default`, `fields` and `types`
    list_field_invalid_default_item: Опцията `default` на полето List съдържа `{$value}`, но всеки елемент трябва да е обект, защото полето има `fields` или `types`.
    # {$key} is a property name of the default item from the configuration; Don’t localize `default`
    list_field_invalid_default_key: Опцията `default` на полето List съдържа елемент със свойство `{$key}`, но никое подполе няма такова име.
    # {$typeKey} is the configured type key, `type` by default; Don’t localize `default` and `types`
    list_field_default_missing_type: Опцията `default` на полето List съдържа елемент без свойство `{$typeKey}`, което определя един от `types`.
    # {$typeKey} is the configured type key, `type` by default, and {$value} is its value in the default item; Don’t localize `default` and `types`
    list_field_invalid_default_type: Опцията `default` на полето List съдържа елемент, чието свойство `{$typeKey}` е `{$value}`, но тази стойност не е сред `types`.
    # Don’t localize `map_key_field`, `fields` and `types`
    list_field_map_key_no_subfields: Опцията `map_key_field` на полето List изисква опцията `fields` или `types`, тъй като всеки ключ се взема от подполе.
    # {$name} is the subfield name; Don’t localize `map_key_field`
    list_field_map_key_not_found: Опцията `map_key_field` на полето List се отнася до `{$name}`, но никое подполе няма такова име.
    # {$name} is the subfield name, and {$type} is the variable type name; Don’t localize `map_key_field`
    list_field_map_key_missing_in_type: Опцията `map_key_field` на полето List се отнася до `{$name}`, но типът `{$type}` няма подполе с такова име.
    # {$name} is the subfield name, and {$widget} is its field type; Don’t localize `map_key_field`
    list_field_map_key_invalid_type: Опцията `map_key_field` на полето List се отнася до `{$name}`, но подполето трябва да е от тип String, Relation или Select, а не `{$widget}`.
    # {$name} is the subfield name; Don’t localize `map_key_field` and `multiple`
    list_field_map_key_multiple: Опцията `map_key_field` на полето List се отнася до `{$name}`, но подполето не може да приема няколко стойности, тъй като всеки елемент се нуждае от един ключ. Премахнете опцията му `multiple`.
    # {$name} is the subfield name; Don’t localize `map_key_field`
    list_field_map_key_option_not_string: Опцията `map_key_field` на полето List се отнася до `{$name}`, но опциите на подполето трябва да имат стойности от тип низ, тъй като всеки ключ се записва като низ.
    # {$name} is the subfield name; Don’t localize `map_key_field` and `required`
    list_field_map_key_not_required: Опцията `map_key_field` на полето List се отнася до `{$name}`, но подполето не може да е незадължително, тъй като всеки елемент се нуждае от ключ. Премахнете опцията му `required`.
    # {$name} is the subfield name; Don’t localize `map_key_field`, `i18n: false` and `i18n: duplicate`
    list_field_map_key_not_localized: 'Опцията `map_key_field` на полето List се отнася до `{$name}`, но подполето не може да има `i18n: false`, тъй като елементите се нуждаят от ключ във всеки език. Използвайте `i18n: duplicate` или премахнете опцията.'
    # Don’t localize `i18n`, `duplicate_if_empty`, `multiple` and `true`
    duplicate_if_empty_multiple: 'Опцията `i18n: duplicate_if_empty` не се поддържа за поле с опцията `multiple`, така че полето работи като поле с `i18n: true`.'
    # Don’t localize `default` and `multiple`
    invalid_default_multiple: Опцията `default` трябва да е масив, защото опцията `multiple` е `true`.
    invalid_default_single: Опцията `default` трябва да е единична стойност, а не масив, защото опцията `multiple` не е `true`.
    # {$key} is a property name of the default object from the configuration; Don’t localize `default`
    object_field_invalid_default_key: Опцията `default` на полето Object има свойство `{$key}`, но никое подполе няма такова име.
    # {$typeKey} is the configured type key, `type` by default; Don’t localize `default` and `types`
    object_field_default_missing_type: Опцията `default` на полето Object няма свойство `{$typeKey}`, което определя един от `types`.
    # {$typeKey} is the configured type key, `type` by default, and {$value} is its value in the default object; Don’t localize `default` and `types`
    object_field_invalid_default_type: Свойството `{$typeKey}` на опцията `default` на полето Object е `{$value}`, но тази стойност не е сред `types`.
    # Don’t localize `default` and `output_code_only`
    code_field_invalid_default_object: Опцията `default` на полето Code трябва да е низ, защото опцията `output_code_only` е `true`.
    # {$key} is a property name of the default object, {$code} and {$lang} are the configured property names; Don’t localize `default` and `keys`
    code_field_invalid_default_key: Опцията `default` на полето Code има свойство `{$key}`, но опцията `keys` позволява само `{$code}` и `{$lang}`.
    # {$valueType} is the configured value type; Don’t localize `value` and `value_type`
    compute_field_invalid_expression: Опцията `value` на полето Compute трябва да е валиден аритметичен израз, например `\{\{fields.price\}\} * \{\{fields.quantity\}\}`, защото опцията `value_type` е `{$valueType}`.
    # {$valueType} is the configured value type; Don’t localize `value` and `value_type`
    compute_field_uuid_in_expression: Опцията `value` на полето Compute не може да използва таг за UUID като `\{\{uuid\}\}`, защото опцията `value_type` е `{$valueType}`, което превръща опцията в аритметичен израз.
    # {$value} is the default value and {$valueType} is the configured value type; Don’t localize `default` and `value_type`
    number_field_default_not_integer: Опцията `default` на полето Number е зададена на `{$value}`, но трябва да е цяло число, защото опцията `value_type` е `{$valueType}`.
    number_field_default_not_number: Опцията `default` на полето Number е зададена на `{$value}`, но трябва да е число, защото опцията `value_type` е `{$valueType}`.
    # Don’t localize `fields` and `types`
    object_field_no_subfields: Опцията `fields` или `types` на полето Object трябва да има поне един елемент.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: Посочената колекция `{$collection}` е невалидна или не е дефинирана.
    relation_field_invalid_collection_file: Посоченият файл `{$file}` е невалиден или не е дефиниран.
    # Don’t localize `file`
    relation_field_missing_file_name: Опцията `file` трябва да е дефинирана за връзка към колекция от файлове.
    relation_field_invalid_value_field: Посоченото поле за стойност `{$field}` е невалидно или не е дефинирано.
    # {$collection} is the referenced collection name; Don’t localize `file`, `value_field` and `slug`.
    # The curly brackets are escaped with backslashes for MessageFormat 2
    relation_field_array_file_slug: Връзката към колекцията `{$collection}` не може да запазва стойността `\{\{slug\}\}`, тъй като слъгът на запис в колекция с опцията `file` е позицията му, която се променя при пренареждане или изтриване на записите. Вместо това задайте опцията `value_field` на поле с уникална стойност.
    # {$collection} is the referenced collection name; Don’t localize `file`
    relation_field_array_file_workflow: Колекция с опцията `file` не може да има връзка към колекцията `{$collection}`, която използва редакционния процес или процеса с предварителен преглед, тъй като препратките към преименуван или изтрит там запис не могат да бъдат обновени във файла.
    relation_field_invalid_display_field: Посоченото поле за показване `{$field}` е невалидно или не е дефинирано.
    relation_field_invalid_search_field: Посоченото поле за търсене `{$field}` е невалидно или не е дефинирано.
    relation_field_invalid_filter_field: Посоченото поле за филтриране `{$field}` е невалидно или не е дефинирано.
    relation_field_invalid_sort_field: Посоченото поле за сортиране `{$field}` е невалидно или не е дефинирано.
    # Don’t localize `sort_by` and `file`
    relation_field_sort_by_file_ignored: Опцията `sort_by` не се прилага за връзка към файл, чиито опции следват реда на елементите в списъка. Тя ще бъде пренебрегната.
    unexpected: Неочаквана грешка

    # Schema validation errors, reported when the configuration doesn’t match the published JSON
    # schema. In all of these, {$option} is a configuration option path such as `backend.name` or
    # `view_filters[0].pattern`, relative to the collection, file or field named before it.
    # {$type} is a value type name from `schema_value_type` below
    schema_invalid_type: Опцията `{$option}` трябва да бъде {$type}.
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'Опцията `{$option}` трябва да е една от следните стойности: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: Опцията `{$option}` трябва да бъде `{$value}`.
    schema_invalid_empty_value: Опцията `{$option}` трябва да бъде празен низ.
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: Опцията `{$option}` трябва да бъде масив от {$count} елемента.
    schema_invalid_value: Опцията `{$option}` има невалидна стойност.
    schema_missing_option: Опцията `{$option}` е задължителна.
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Една от следните опции е задължителна: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: низ
      number: число
      integer: цяло число
      boolean: булева стойност
      array: масив
      object: обект
      'null': празна

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: Идентификаторът на OAuth приложението не е дефиниран. За да влязат, потребителите трябва да предоставят токен за достъп.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: Опцията `{$prop}` не се поддържа в Sveltia CMS. Тя ще бъде пренебрегната.
    # Don’t localize `stages`, `publish_mode`, `editorial_workflow` and {$type}, which is `preview` or `simple`
    publish_mode_stages_ignored: Опцията `stages` на `publish_mode` се прилага само за режима на публикуване `editorial_workflow`, затова се пренебрегва при `{$type}`.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Зададени са едновременно `picker_utc` и по-новите опции за часова зона (`input_timezone` или `output_utc`). Новите опции имат предимство. Обмислете премахването на `picker_utc` от вашата конфигурация.
    # Don’t localize `localize_format` and `format`
    localize_format_without_format: Опцията `localize_format` няма ефект, защото полето няма опцията `format` и стойността му се съхранява във формата ISO 8601.
    # {$name} is a template tag like `fields.lines.*.price`; Don’t localize `value`, `*` and `sum()`
    compute_field_wildcard_without_item: Опцията `value` на полето Compute се отнася до `{$name}`, но полето не е в елемент от списъка, който `*` обозначава, затова не получава стойност. Само агрегираща функция като `sum()` може да използва всички елементи на списъка.
    # {$name} is a template tag like `fields.lines.*.amount`; Don’t localize `value`
    compute_field_self_reference: Опцията `value` на полето Compute се отнася до самото поле като `{$name}`, затова стойността му се променя при всяко изчисляване и никога не се стабилизира.
    # {$name} is a template tag like `fields.total`; Don’t localize `value`
    compute_field_reference_cycle: Опцията `value` на полето Compute се отнася до `{$name}`, друго поле Compute, което се отнася обратно към това поле, пряко или чрез други полета, затова стойностите им никога не се стабилизират.
    # Don’t localize `localize_format`, `true` and `de`
    localize_format_without_i18n: Опцията `localize_format` е `true`, но i18n не е включена за колекцията, затова стойността се записва на английски. Задайте опцията на код на език, например `de`.
    # {$locale} is the locale code from the configuration; Don’t localize `localize_format`
    localize_format_unsupported_locale: Опцията `localize_format` е зададена на `{$locale}`, който не е поддържан език, затова стойността се записва на английски.
    # Don’t localize `preview_path`
    preview_path_no_date_field: Опцията `preview_path` използва тагове за дата и час, но колекцията няма поле DateTime, от което да ги прочете, така че връзката за преглед няма да бъде показана.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: Опцията `preview_path_date_field` се отнася до поле с име `{$name}`, но не е дефинирано поле DateTime с това име, така че връзката за преглед няма да бъде показана.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: Опцията `preview_path` се отнася до `{$name}`, но такова поле не е дефинирано в колекцията, така че връзката за преглед няма да бъде показана.
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: Колекцията няма поле `{$name}`, с което да се именуват новите записи, затова всеки нов запис получава случаен слъг. Добавете поле `{$name}` или задайте опцията `identifier_field` или `slug`.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: Опцията `i18n` на `slug` няма ефект, защото колекцията не използва структурата на i18n `multiple_files`, `multiple_folders` или `multiple_root_folders`, при която всеки език има свой файл.
    # Don’t localize `slug`, `template` and `auto_increment`
    slug_template_ignored: Опцията `template` на `slug` се пренебрегва, защото вместо това опцията `auto_increment` номерира слъговете.
    # {$file} is the file path; Don’t localize `file`, `locale`, `i18n`, `false`,
    # `omit_default_locale_from_file_path` and the example paths. The curly brackets in the examples
    # are escaped with backslashes for MessageFormat 2
    locale_not_omitted_from_file_path: Заместителят `locale` не може да бъде премахнат от пътя `{$file}` в опцията `file`, така че езикът по подразбиране остава в него въпреки опцията `omit_default_locale_from_file_path` на i18n. За да пропуснете езика, използвайте заместителя като цяло име на папка, например `\{\{locale\}\}/about.md`, или между името на файла и разширението, например `about.\{\{locale\}\}.md`. За да го запазите, задайте опцията на `false` в опцията `i18n` на файла.
    # Don’t localize `i18n`
    i18n_not_configured: Опцията `i18n` е включена, но i18n не е зададена нито на най-високо ниво в конфигурацията, нито в колекцията, така че опцията няма ефект.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: Опцията `public_folder` е празен низ, затова за пътищата на ресурсите, запазвани в записите, се използва пътят `media_folder`. Премахнете опцията или я задайте на пътя, който искате да използвате, например `/images`.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: Опцията `{$option}` не е дефинирана в схемата за конфигурация на Sveltia CMS. Тя ще бъде пренебрегната. Проверете за печатна или синтактична грешка.
    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: Опцията `default_localized` няма ефект, защото i18n не е включена за колекцията. Вместо това използвайте опцията `default`.
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: Опцията `default_localized` има стойност за `{$locale}`, който не е един от езиците на колекцията, така че стойността никога не се използва.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Вижте бележките за съвместимост за подробности: {$link}'

  # Console tip shown after config load
  schema_tip: За по-добро изживяване при разработка можете да проверите конфигурационния си файл спрямо JSON схемата на Sveltia CMS. Вижте {$link} за подробности.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Локално
  # Browser compatibility warnings
  unsupported_browser: Локалният работен процес не се поддържа във вашия браузър. Използвайте Chrome или Edge.
  disabled: Локалният работен процес е изключен във вашия браузър. <a>Ето как да го включите</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'В момента разглеждате таблото на редакционния процес. Чернови: {$draft}. За преглед: {$review}. Готови: {$ready}. Чакащи изтриване: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'В момента разглеждате таблото на редакционния процес. Чернови: {$draft}. За преглед: {$review}. Чакащи изтриване: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'В момента разглеждате таблото на редакционния процес. Чернови: {$draft}. Готови: {$ready}. Чакащи изтриване: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'В момента разглеждате страницата с чернови. Чернови: {$draft}. Чакащи изтриване: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Чернова
  drafts: Чернови
  in_review: За преглед
  ready: Готови
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Чака изтриване
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: Внедряване

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Отказ от изтриването
  confirm_cancelling_deletion: Сигурни ли сте, че искате да се откажете от това изтриване? Записът ще остане публикуван.
  confirm_completing_deletion: Сигурни ли сте, че искате да изтриете този запис? Той ще бъде премахнат веднага.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ Записът е маркиран за изтриване. }}
      *   {{ {$count} записа са маркирани за изтриване. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Промените са отхвърлени. }}
      *   {{ Промените в {$count} записа са отхвърлени. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Отказ от изтриването…
  deletion_cancelled: Изтриването е отказано.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Изтриването не можа да бъде отказано. Опитайте отново.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Непубликувани записи
  published_entries: Публикувани записи
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Състояние: {$status}'
  change_entry_status: Промяна на състоянието на записа
  # Editor toolbar: progress label while the status is being changed
  changing_status: Промяна на състоянието…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Обновяване на състоянието…
  status_updated: Състоянието е обновено.
  # Error notification when the status could not be changed
  status_change_failed: Състоянието не можа да бъде променено. Опитайте отново.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: Обнови
  refreshing: Опресняване…
  refreshed: Таблото е актуално.
  # Error notification when the board could not be refreshed
  refresh_failed: Таблото не можа да бъде опреснено. Опитайте отново.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: Записът съдържа грешки. Поправете ги, преди да промените състоянието.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: Записът съдържа грешки. Поправете ги, преди да го публикувате.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Изпращане за преглед
  confirm_sending_for_review: Промените ви са запазени като чернова. Да се изпрати ли записът за преглед, за да може някой да го прегледа и публикува?
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: Маркирай като готов
  confirm_marking_as_ready: Промените ви са запазени като чернова. Да се маркира ли записът като готов, за да може да бъде публикуван?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Публикуване на записа
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Отхвърляне на промените
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Сигурни ли сте, че искате да изтриете този запис? Той няма да бъде премахнат, докато изтриването не бъде публикувано. Дотогава ще го намирате в списъка със записи, маркиран като „Чака изтриване“.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Този запис все още не е публикуван, така че изтриването му ще го отхвърли напълно.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Този запис има непубликувани промени. Отхвърлянето им ще възстанови публикуваната версия. Самият запис няма да бъде изтрит.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Той все още не е публикуван, така че непубликуваните ви промени ще бъдат отхвърлени. Всяка публикувана версия ще остане публикувана. }}
      *   {{ Те все още не са публикувани, така че непубликуваните ви промени ще бъдат отхвърлени. Всички публикувани версии ще останат публикувани. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ Един от тях все още не е публикуван, така че непубликуваните ви промени ще бъдат отхвърлени. Всяка публикувана версия ще остане публикувана. }}
      *   {{ {$count} от тях все още не са публикувани, така че непубликуваните ви промени ще бъдат отхвърлени. Всички публикувани версии ще останат публикувани. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: Сигурни ли сте, че искате да публикувате този запис? Промените ви ще се появят на сайта, след като той бъде изграден отново.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Публикуване на записа…
  entry_published: Записът е публикуван.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Изтриване на записа…
  discarding_changes: Отхвърляне на промените…
  entry_deleted: Записът е изтрит.
  # Error notification when publishing fails
  publishing_entry_failed: Записът не можа да бъде публикуван. Опитайте отново.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: Този запис не може да бъде публикуван оттук, защото включва и други промени, които CMS не може да ви покаже. Помолете разработчик да го прегледа.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: Записът е променен, откакто го отворихте. Презаредете страницата, за да прегледате най-новата версия, преди да го публикувате.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: За този запис вече има друга заявка ({$number}), отворена извън CMS. Помолете разработчик първо да я затвори.
  # Workflow page: empty column message
  no_entries: Няма записи.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Плъзнете, за да промените състоянието
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Изтриване

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: Съобщение за комит
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: Опишете промените си. Съобщението се записва в историята заедно с тях.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: Добавете бележка към съобщението, записвано в историята заедно с промените ви, например номер на задача. Може да я оставите празна.
  # Accessible name of the text box when the user writes the whole message
  message: Съобщение за комит
  # Accessible name of the text box when the text is added before or after the message
  addition: Бележка
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'Съобщение: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Разклоняване на хранилището
  fork: Разклоняване
  confirm_forking_repository: За да предложите промени в „{$repo}“, трябва да бъде създадено разклонение на хранилището в акаунта ви. Промените ви се запазват в това разклонение и поддържащ ги преглежда, преди да бъдат публикувани.
  # Error shown when the user declined the dialog above
  fork_declined: За да предлагате промени, ви е необходимо разклонение на хранилището в акаунта ви.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Не можа да бъде създадено разклонение на хранилището „{$repo}“ в акаунта ви.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: Разклонението ви „{$fork}“ няма клон „{$branch}“. Обновете разклонението от хранилището „{$repo}“ и след това влезте отново.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Достъпът ви до хранилището „{$repo}“ не можа да бъде проверен. Опитайте отново след малко.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Хранилището „{$repo}“ не позволява разклонения. Помолете поддържащ да разреши разклоняването му.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Имате чакаща покана за хранилището „{$repo}“. Приемете я в GitHub и след това влезте отново.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Входът ви не включва достъп до частни хранилища, така че хранилището „{$repo}“ не може да бъде прочетено. Помолете поддържащ да провери настройките за удостоверяване на CMS.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Само поддържащ може да публикува промени в този сайт. Вместо това маркирайте записа си като „За преглед“ и някой ще го прегледа.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: Някой от поддържащите вече е публикувал този запис, така че няма какво да се преглежда.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Тази промяна не може да бъде направена директно. Само редакции на записи могат да бъдат предлагани за преглед.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Промените ви се запазват в разклонението ви на това хранилище в „{$repo}“ и се преглеждат, преди да бъдат публикувани.
  view_fork: Преглед на разклонението

