  .input {$count :integer}
  .input {$name :string}
  .match $count
    one {{ В тази папка вече съществува файл с име „{$name}“. Искате ли да го замените? }}
    *   {{ В тази папка вече съществуват {$count} файла със същите имена. Искате ли да ги замените? }}
