# ==============================================================================
# Entry and Collection Actions
# ==============================================================================
# Strings related to creating, editing, and managing entries and collections.

# Error message when entry cannot be found
entry_not_found: Записът не е намерен.

# Entry creation restrictions: tooltip and advisory messages
creating_entries_disabled_by_admin: Създаването на нови записи в тази колекция е забранено от администратора.
# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: Не можете да добавяте нови записи в тази колекция, защото тя достигна ограничението си от {$quota} записа.
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$remaining :integer}
  .match $remaining
    one {{ Тази колекция наближава ограничението си от {$quota} записа. Можете да създадете още само {$remaining} запис. }}
    *   {{ Тази колекция наближава ограничението си от {$quota} записа. Можете да създадете още само {$remaining} записа. }}

# Navigation: back links and list labels
back_to_collection: Обратно към колекцията
collection_list: Списък с колекции
back_to_collection_list: Обратно към списъка с колекции
asset_folder_list: Списък с папки с ресурси
back_to_asset_folder_list: Обратно към списъка с папки с ресурси

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: Резултати от търсенето
# {$terms} is the current search query text
search_results_for_x: Резултати от търсенето за „{$terms}“

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ В момента разглеждате резултатите от търсенето за „{$terms}“. Не намерихме нито един запис. }}
    one {{ В момента разглеждате резултатите от търсенето за „{$terms}“. Намерихме един запис. }}
    *   {{ В момента разглеждате резултатите от търсенето за „{$terms}“. Намерихме {$count} записа. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ В момента разглеждате резултатите от търсенето за „{$terms}“. Не намерихме нито един ресурс. }}
    one {{ В момента разглеждате резултатите от търсенето за „{$terms}“. Намерихме един ресурс. }}
    *   {{ В момента разглеждате резултатите от търсенето за „{$terms}“. Намерихме {$count} ресурса. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ Няма записи }}
    one {{ {$count} запис }}
    *   {{ {$count} записа }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ Няма ресурси }}
    one {{ {$count} ресурс }}
    *   {{ {$count} ресурса }}

# Empty state messages
no_files_found: Няма намерени файлове.
no_entries_found: Няма намерени записи.

# ==============================================================================
# Asset Management
# ==============================================================================
# Strings for uploading, editing, and managing assets (images, documents, etc.).

# Upload dialog: title and button label
upload_assets: Качване на нови ресурси

# Edit options menu: button and item labels
edit_options: Опции за редактиране
show_edit_options: Показване на опциите за редактиране
# Edit menu items with specific asset names
edit_asset: Редактиране на ресурса
# {$name} is the selected asset name
edit_x: Редактиране на {$name}

# Asset text editor: switch for line wrapping
wrap_long_lines: Пренасяне на дългите редове

# Rename asset: dialog and validation
rename_asset: Преименуване на ресурса
# {$name} is the current asset name
rename_x: Преименуване на {$name}
# Dialog body text indicating how many entries reference this asset
# {$count} is the number of entries that currently reference the asset
enter_new_name_for_asset: |
  .input {$count :integer}
  .match $count
    0   {{ Въведете ново име по-долу. }}
    one {{ Въведете ново име по-долу. Записът, който използва ресурса, също ще бъде обновен. }}
    *   {{ Въведете ново име по-долу. {$count} записа, които използват ресурса, също ще бъдат обновени. }}
# Validation errors for asset renaming
enter_new_name_for_asset_error:
  empty: Името на файла не може да е празно.
  character: Името на файла не може да съдържа специални знаци.
  duplicate: Това име на файл се използва от друг ресурс.

# Replace asset: menu item and dialog title
replace_asset: Замяна на ресурса
# {$name} is the asset being replaced
replace_x: Замяна на {$name}

# File selection prompts: drop zones and file pickers
# Browse prompt shown when drag-and-drop is unavailable on desktop and pointer devices
click_to_browse: Щракнете, за да прегледате…
# Browse prompt shown on touch devices
tap_to_browse: Докоснете, за да прегледате…
# Drop zone text with browse button
# {$count} is the number of files expected by the current picker mode
drop_files_or_click_to_browse: |
  .input {$count :integer}
  .match $count
    one {{ Пуснете файл тук или щракнете, за да прегледате… }}
    *   {{ Пуснете файлове тук или щракнете, за да прегледате… }}
# Partial drop zone text (ends with inline button)
# {$count} is the number of files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_files_or: |
