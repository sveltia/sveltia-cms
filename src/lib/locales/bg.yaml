# Character counter: shows character count for text fields
character_counter:
  # {$count} is the current character count; {$min} and {$max} are configured limits
  min_max: |
    .input {$count :integer}
    .match $count
      0   {{ Няма въведени знаци. Минимум: {$min}. Максимум: {$max}. }}
      one {{ {$count} въведен знак. Минимум: {$min}. Максимум: {$max}. }}
      *   {{ {$count} въведени знака. Минимум: {$min}. Максимум: {$max}. }}
  # {$count} is the current character count and {$min} is the minimum allowed count
  min: |
    .input {$count :integer}
    .match $count
      0   {{ Няма въведени знаци. Минимум: {$min}. }}
      one {{ {$count} въведен знак. Минимум: {$min}. }}
      *   {{ {$count} въведени знака. Минимум: {$min}. }}
  # {$count} is the current character count and {$max} is the maximum allowed count
  max: |
    .input {$count :integer}
    .match $count
      0   {{ Няма въведени знаци. Максимум: {$max}. }}
      one {{ {$count} въведен знак. Максимум: {$max}. }}
      *   {{ {$count} въведени знака. Максимум: {$max}. }}

