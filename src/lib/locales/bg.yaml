# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: Това поле е задължително.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: Датата и часът трябва да са {$min} или по-късно.
    date: Датата трябва да е {$min} или по-късно.
    time: Часът трябва да е {$min} или по-късно.
    number: Стойността трябва да е по-голяма или равна на {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Трябва да изберете поне {$min} опция. }}
        *   {{ Трябва да изберете поне {$min} опции. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Трябва да добавите поне {$min} елемент. }}
        *   {{ Трябва да добавите поне {$min} елемента. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: Датата и часът трябва да са {$max} или по-рано.
    date: Датата трябва да е {$max} или по-рано.
    time: Часът трябва да е {$max} или по-рано.
    number: Стойността трябва да е по-малка или равна на {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ Не можете да изберете повече от {$max} опция. }}
        *   {{ Не можете да изберете повече от {$max} опции. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ Не можете да добавите повече от {$max} елемент. }}
        *   {{ Не можете да добавите повече от {$max} елемента. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Трябва да въведете поне {$min} знак. }}
      *   {{ Трябва да въведете поне {$min} знака. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ Не можете да въведете повече от {$max} знак. }}
      *   {{ Не можете да въведете повече от {$max} знака. }}

  # Type validation errors
  type_mismatch:
    number: Въведете число.
    email: Въведете валиден имейл адрес.
    url: Въведете валиден URL адрес.

  # Custom field validation error
  invalid_value: Невалидна стойност.
  unexpected_error: Възникна неочаквана грешка.

