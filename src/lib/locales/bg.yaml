# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Има грешка в конфигурацията на CMS. Отстранете проблема и опитайте отново. }}
      *   {{ Има грешки в конфигурацията на CMS. Отстранете проблемите и опитайте отново. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: колекция {$collection}
    file: файл {$file}
    component: компонент {$component}
    # Don’t localize `{$field}`
    field: поле `{$field}`

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS работи само с HTTPS или localhost адреси.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ URL адресът на конфигурационния файл трябва да използва протокол HTTPS или localhost адрес. }}
        *   {{ URL адресите на конфигурационните файлове трябва да използват протокол HTTPS или localhost адреси. }}
    fetch_failed: Конфигурационният файл не можа да бъде получен.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: HTTP отговорът върна статус {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Конфигурационният файл не можа да бъде получен. За да предотвратите зареждането на файла `config.yml`, добавете <a>`load_config_file: false`</a> към конфигурационния обект, подаден на `CMS.init()`.'
    parse_failed: Конфигурационният файл не можа да бъде обработен.
    parse_failed_invalid_object: Конфигурационният файл не е валиден JavaScript обект.
    parse_failed_unsupported_type: Конфигурационният файл не е от валиден тип. Поддържат се само YAML, TOML и JSON.
    no_collection: Не са дефинирани колекции.
    missing_backend: Бекендът не е дефиниран.
    missing_backend_name: Името на бекенда не е дефинирано.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Бекендът {$name} <a>не се поддържа</a> в Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Остарелият бекенд {$name} <a>не се поддържа</a> в Sveltia CMS.
    unsupported_custom_backend: Персонализираните бекенди <a>не се поддържат</a> в Sveltia CMS.
    unsupported_backend_suggestion: Използвайте един от <a>поддържаните бекенди</a>.
    missing_repository: Хранилището не е дефинирано.
    invalid_repository: Конфигурираното хранилище е невалидно. То трябва да е във формат „owner/repo“.
    oauth_implicit_flow: Конфигурираният метод за удостоверяване (implicit flow) не се поддържа в Sveltia CMS. Използвайте друг <a>метод за удостоверяване</a>.
    github_pkce_unsupported: PKCE оторизацията все още не се поддържа поради ограничения на GitHub. Използвайте друг <a>метод за удостоверяване</a>.
    oauth_no_app_id: Идентификаторът на OAuth приложението не е дефиниран.
    # Don’t localize `auth_methods`
    no_auth_methods: Опцията `auth_methods` трябва да съдържа поне един метод.
    missing_media_folder: Папката за медия не е дефинирана.
    invalid_media_folder: Конфигурираната папка за медия е невалидна. Тя трябва да е низ.
    invalid_public_folder: Конфигурираната публична папка е невалидна. Тя трябва да е низ.
    public_folder_relative_path: Конфигурираната публична папка е невалидна. Тя трябва да е абсолютен път, започващ с „/“.
    public_folder_absolute_url: Абсолютен URL адрес за опцията за публична папка не се поддържа в Sveltia CMS.
    # Don’t localize `asset_collections`
    invalid_asset_collections: Опцията `asset_collections` е невалидна. Тя трябва да е масив.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: Колекцията с ресурси {$count} трябва да има дефинирана опция `name` като непразен низ.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Името на колекцията с ресурси `{$name}` е невалидно. То не трябва да съдържа специални знаци.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Имената на колекциите с ресурси трябва да са уникални, но `{$name}` се използва повече от веднъж.
    # Don’t localize `media_folder`
    asset_collection_invalid_media_folder: Колекцията с ресурси `{$name}` трябва да има дефинирана опция `media_folder` като низ.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_no_options: Колекцията трябва да има дефинирана една от опциите `folder`, `files` или `divider`.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_multiple_options: Колекцията не може да има опциите `folder`, `files` и `divider` едновременно.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: Разширението `{$extension}` не съответства на формата `{$format}`.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Шаблонът за слъг `{$slug}` е невалиден, защото не може да съдържа наклонени черти. За да организирате записите в подпапки, използвайте опцията `path` вместо `slug`.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: Колекцията {$count} трябва да има дефинирана опция `name` като непразен низ.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: Името на колекцията `{$name}` е невалидно. То не трябва да съдържа специални знаци.
    duplicate_collection_name: Имената на колекциите трябва да са уникални, но `{$name}` се използва повече от веднъж.
    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
    missing_collection_file_name: Файлът от колекция {$count} трябва да има дефинирана опция `name` като непразен низ.
    # {$name} is the invalid or duplicate collection file name
    invalid_collection_file_name: Името на файла от колекция `{$name}` е невалидно. То не трябва да съдържа специални знаци.
    duplicate_collection_file_name: Имената на файловете в колекциите трябва да са уникални, но `{$name}` се използва повече от веднъж.
    # Don’t localize `fields`
    collection_no_fields: Колекцията трябва да има дефинирана опция `fields` с поне едно поле.
    # Don’t localize `fields`
    collection_file_no_fields: Файлът от колекция трябва да има дефинирана опция `fields` с поне едно поле.
    # Don’t localize `i18n`, `locale` and `file`
    collection_file_i18n_required: Файлът от колекция трябва да има дефинирана опция `i18n`, ако в пътя `file` се използва заместителят `locale`.
    # {$count} is the 1-based field index in the current fields array; Don’t localize `name`
    missing_field_name: Полето {$count} трябва да има дефинирана опция `name` като непразен низ.
    # {$name} is the invalid or duplicate field name
    invalid_field_name: Името на полето `{$name}` е невалидно. То не трябва да съдържа специални знаци. Ако искате да влагате полета, <a>използвайте полета Object вместо точкова нотация</a>.
    duplicate_field_name: Имената на полетата трябва да са уникални, но `{$name}` се използва повече от веднъж.
    # {$count} is the 1-based variable type index in the current types array
    missing_variable_type: Променливият тип {$count} трябва да има дефинирана опция `name` като непразен низ.
    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: Името на променливия тип `{$name}` е невалидно. То не трябва да съдържа специални знаци.
    duplicate_variable_type: Имената на променливите типове трябва да са уникални, но `{$name}` се използва повече от веднъж.
    date_field_type: 'Остарелият тип поле Date не се поддържа в Sveltia CMS. Използвайте типа поле DateTime с опцията `type: date`.'
    # {$timeZone} is the invalid IANA timezone identifier from the configuration
    invalid_timezone: 'Невалидна часова зона: {$timeZone}. Трябва да е валиден идентификатор на часова зона по IANA, например `America/New_York` или `Asia/Tokyo`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: Остарялата опция `{$prop}` не се поддържа в Sveltia CMS. Използвайте опцията `{$newProp}`.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: Опцията `allow_multiple` не се поддържа в Sveltia CMS. Използвайте опцията `multiple`, чиято стойност по подразбиране е `false`.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: Полето List не може да има опциите `field`, `fields` и `types` едновременно.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: Променливият тип на полето List е невалиден. Опцията `widget` е зададена на `{$widget}`, но трябва да е `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: Полето Object не може да има опциите `fields` и `types` едновременно.
    # Don’t localize `fields`, and `types`
    object_field_missing_fields: Полето Object трябва да има дефинирана опция `fields` или `types`.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: Посочената колекция `{$collection}` е невалидна или не е дефинирана.
    relation_field_invalid_collection_file: Посоченият файл `{$file}` е невалиден или не е дефиниран.
    # Don’t localize `file`
    relation_field_missing_file_name: Опцията `file` трябва да е дефинирана за връзка към колекция от файлове.
    relation_field_invalid_value_field: Посоченото поле за стойност `{$field}` е невалидно или не е дефинирано.
    unexpected: Неочаквана грешка

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: Идентификаторът на OAuth приложението не е дефиниран. За да влязат, потребителите трябва да предоставят токен за достъп.
    editorial_workflow_unsupported: Редакционният процес все още не се поддържа в Sveltia CMS.
    open_authoring_unsupported: Отвореното авторство все още не се поддържа в Sveltia CMS.
    nested_collections_unsupported: Вложените колекции все още не се поддържат в Sveltia CMS.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: Опцията `{$prop}` не се поддържа в Sveltia CMS. Тя ще бъде пренебрегната.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Зададени са едновременно `picker_utc` и по-новите опции за часова зона (`input_timezone` или `output_utc`). Новите опции имат предимство. Обмислете премахването на `picker_utc` от вашата конфигурация.

  # Compatibility link appended to unsupported feature messages
