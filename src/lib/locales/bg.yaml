# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: Записът е променен от някой друг
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} промени този запис на {$date}, след като го отворихте.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Този запис е променен в хранилището, след като го отворихте.
  deleted: Този запис е изтрит от хранилището, след като го отворихте.
  # Follows `modified_by` or `modified`
  overwrite_warning: Ако запазите сега, техните промени ще бъдат загубени.
  # Follows `deleted`
  recreate_warning: Ако запазите сега, записът ще бъде създаден отново.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Тъй като записът се съхранява в същия файл като други записи, не може да презапише промяната. Откажете редактирането, след това отворете записа отново от списъка и направете редакциите си.
  # OK button label
  save_anyway: Запази все пак
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: Хранилището беше обновено от някой друг по време на запазването. Опитайте отново.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Запис, който се съхранява в същия файл, е променен от някой друг. Опитайте отново.
  # {$path} is the file path
  array_file_invalid: Файлът {$path} не може да бъде обновен, защото не съдържа валиден списък със записи.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
