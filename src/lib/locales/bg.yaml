    *   {{ Тези {$count} файла ще бъдат запазени в папката „{$folder}“: }}

# File size validation
# Warning section for files exceeding size limits
oversized_files: Прекалено големи файлове
# {$size} is the maximum allowed file size and {$count} is the number of oversized files
warning_oversized_files: |
  .input {$count :integer}
  .match $count
    one {{ Този файл не може да бъде качен, защото надвишава максималния размер от {$size}. Намалете размера му или изберете друг файл. }}
    *   {{ Тези файлове не могат да бъдат качени, защото надвишават максималния размер от {$size}. Намалете размерите им или изберете други файлове. }}

# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: Невалидни файлове
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    one {{ Този файл не може да бъде качен, защото е повреден или съдържанието му не съответства на разширението на файла. Това често се случва, когато снимка е преименувана, вместо да бъде конвертирана, например HEIC изображение, запазено като JPEG файл. Конвертирайте файла и опитайте отново. }}
    *   {{ Тези файлове не могат да бъдат качени, защото са повредени или съдържанието им не съответства на разширенията на файловете. Това често се случва, когато снимки са преименувани, вместо да бъдат конвертирани, например HEIC изображения, запазени като JPEG файлове. Конвертирайте файловете и опитайте отново. }}
