# Strings for the settings/preferences dialog and its panels.

# Settings page aria-label
categories: Категории

# Site Configuration Editor
site_configuration_editor: Редактор на конфигурацията на сайта

# Preferences panels
prefs:
  # API key management feedback messages
  changes:
    api_key_saved: API ключът е запазен.
    api_key_removed: API ключът е премахнат.
    api_key_invalid: Предоставеният API ключ е невалиден. Проверете го и опитайте отново.

  # Preferences operation errors
  error:
    permission_denied: Достъпът до бисквитките е отказан. Проверете разрешенията на браузъра си и опитайте отново.

  # Appearance panel
  appearance:
    title: Външен вид
    theme: Тема
    select_theme: Избор на тема

  # Theme options
  theme:
    dark: Тъмна
    light: Светла

  # Language panel
  language:
    title: Език
    ui_language:
      title: Език на потребителския интерфейс
      select_language: Избор на език

  # Contents panel
  contents:
    title: Съдържание
    editor:
      title: Редактор
      use_draft_backup:
        switch_label: Автоматично създаване на резервни копия на черновите
      close_on_save:
        switch_label: Затваряне на редактора след запазване на чернова
      close_with_escape:
        switch_label: Затваряне на редактора с клавиша Escape

  # Internationalization panel
  i18n:
    title: Интернационализация
    translators:
      default:
        title: Услуга за превод по подразбиране
        select_service: Избор на услуга
      api_keys:
        title: API ключове за услугите за превод
        description: Управлявайте API ключовете за <a>услугите за превод</a>.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: Ключ за {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Регистрирайте се в <a {$homeHref}>{$service}</a> и въведете <a {$apiKeyHref}>своя API ключ</a> тук, за да включите бързия превод на текстовите полета.

  # Media panel
  media:
    title: Медия
    stock_photos:
      api_keys:
        title: API ключове за услугите за стокови снимки
        description: Управлявайте API ключовете за <a>услугите за стокови снимки</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: API ключ за {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Регистрирайте се за <a {$homeHref}>{$service} API</a> и въведете <a {$apiKeyHref}>своя API ключ</a> тук, за да вмъквате безплатни стокови снимки в полетата за изображения.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Снимките са предоставени от {$service}
      no_services: Не са конфигурирани <a>услуги за стокови снимки</a>.
    cloud_storage:
      api_keys:
        title: API ключове за услугите за облачно съхранение
        description: Управлявайте API ключовете за <a>услугите за облачно съхранение</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: API ключ за {$service}
      no_services: Не са конфигурирани <a>услуги за облачно съхранение</a>.

  # Accessibility panel
  accessibility:
    title: Достъпност
    underline_links:
      title: Подчертаване на връзките
      description: Показване на подчертаване на връзките в прегледа на записа и в етикетите на потребителския интерфейс.
      switch_label: Винаги подчертавай връзките

  # Data Management panel
  data:
    title: Управление на данните
    clear_data:
      title: Изчистване на данните
      # Clear File Cache button
      file_cache:
        description: Изтриване на локално кешираното съдържание на файлове и миниатюри на изображения, за да се освободи място за съхранение или да се решат проблеми, причинени от остарели данни.
        button_label: Изчистване на файловия кеш
        confirmation: Локално кешираното съдържание на файлове и миниатюрите на изображения ще бъдат изтрити. Незапазените ви чернови и настройки ще бъдат запазени, а изтритите данни ще бъдат изтеглени или генерирани отново при нужда. CMS ще бъде презаредена след приключване.
      # Erase All Data button
      all_data:
        description: Изтриване на всичко, което CMS съхранява в този браузър, включително кешираните файлове, незапазените чернови и настройките. Всичко, което вече е запазено в хранилището ви, няма да бъде засегнато.
        button_label: Изтриване на всички данни
        confirmation: Всички данни, съхранени в този браузър, ще бъдат изтрити, включително кешираното съдържание на файлове, миниатюрите на изображения, незапазените чернови, настройките и състоянието на входа. Хранилището ви няма да бъде засегнато, но всички незапазени промени ще бъдат загубени и ще трябва да влезете отново. CMS ще бъде презаредена след приключване.

  # Developer panel
  developer:
    title: За разработчици
    developer_mode:
      title: Режим за разработчици
      description: Включване на някои функции за разработчици, включително подробни записи в конзолата и системни контекстни менюта.
      switch_label: Включване на режима за разработчици
    local_git:
      title: Комити в Git
      description: Комитване на промените в текущия клон на локалното хранилище при всяко запазване, както прави CMS при работа с отдалечено хранилище. След това можете да прегледате и изпратите комитите с обичайните си инструменти за Git.
      switch_label: Комитване на промените в Git
      checking: Проверка на хранилището…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Промените ще бъдат комитнати в клона {$branch} като {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Промените не могат да бъдат комитнати в момента. {$reason}
    deploy_hook:
      title: Кука за внедряване
      description: Въведете URL адрес на уебкука, който да бъде извикан, когато ръчно стартирате внедряване чрез „Публикуване на промените“. Може да го оставите празен, ако използвате GitHub Actions.
      # Hook URL input
      url:
        field_label: URL адрес на куката
        saved: URL адресът на куката е запазен.
        removed: URL адресът на куката е премахнат.
      # Authorization header input
      auth:
        field_label: Заглавка Authorization (например Bearer <token>) (незадължително)
        saved: Заглавката Authorization е запазена.
        removed: Заглавката Authorization е премахната.

