  reset_hint: За да започнете отначало с оригиналното съдържание, изберете „Изтриване на всички данни“ в Настройки > Управление на данните.
  button_label: Започни

# Account menu: action items for sign-out and app installation
sign_out: Изход
install_as_app: Инсталиране като приложение

