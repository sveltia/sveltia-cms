no_list_item_to_paste: هیچ آیتم کپی‌شده‌ای برای جای‌گذاری وجود ندارد. برای کپی یک آیتم، منوی ⋮ (گزینه‌های آیتم لیست) آن را باز کرده و «کپی» را انتخاب کنید.
list_item_not_compatible: آیتم کپی‌شده با این لیست سازگار نیست.
# {$count} is the number of the values left out, as the list doesn’t have the fields
list_item_pasted_without_values: |
  .input {$count :integer}
  .match $count
    one {{ آیتم جای‌گذاری شد. مقداری که این لیست نمی‌پذیرد کنار گذاشته شد. }}
    *   {{ آیتم جای‌گذاری شد. {$count} مقدار که این لیست نمی‌پذیرد کنار گذاشته شدند. }}
# {$count} is the number of the files the pasted item references that couldn’t be found
list_item_pasted_without_files: |
  .input {$count :integer}
  .match $count
    one {{ آیتم جای‌گذاری شد، اما فایلی که از آن استفاده می‌کند یافت نشد. فیلدهای فایل را در آیتم بررسی کنید. }}
    *   {{ آیتم جای‌گذاری شد، اما {$count} فایلی که از آن‌ها استفاده می‌کند یافت نشدند. فیلدهای فایل را در آیتم بررسی کنید. }}

# Variable-type list selector
