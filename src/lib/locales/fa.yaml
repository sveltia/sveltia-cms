new_parent_folder_description: پوشه جدید در «{$folder}» ایجاد خواهد شد.
new_parent_folder_error:
  empty: نام پوشه نمی‌تواند خالی باشد.
  invalid: نام پوشه نمی‌تواند شامل اسلش باشد یا با نقطه شروع شود و باید شامل حروف یا اعداد باشد.
  duplicate: پوشه‌ای با این نام از قبل در اینجا وجود دارد.
edit_path_error:
  invalid: مسیر نمی‌تواند شامل بخش‌های نسبی مانند «..» باشد.
  recursive: ورودی را نمی‌توان به یکی از زیرپوشه‌های خودش منتقل کرد.
  duplicate: این مسیر برای ورودی دیگری استفاده شده است.

# Required field indicator
required: الزامی

# Editor operation feedback
# Translation and copy operation status messages
editor:
  translation:
    none: چیزی برای ترجمه وجود ندارد.
    started: در حال ترجمه…
    error: ترجمه ناموفق بود.
    # {$source} is the source language name and {$count} is the number of translated fields
    complete: |
      .input {$count :integer}
      .match $count
        0   {{ هیچ فیلدی از {$source} ترجمه نشد. }}
        one {{ فیلد از {$source} ترجمه شد. }}
        *   {{ {$count} فیلد از {$source} ترجمه شدند. }}
  copy:
    none: چیزی برای کپی وجود ندارد.
    # {$source} is the source language name and {$count} is the number of copied fields
    complete: |
      .input {$count :integer}
      .match $count
        0   {{ هیچ فیلدی از {$source} کپی نشد. }}
        one {{ فیلد از {$source} کپی شد. }}
        *   {{ {$count} فیلد از {$source} کپی شدند. }}

# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: این فیلد الزامی است.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: تاریخ/زمان باید در یا بعد از {$min} باشد.
    date: تاریخ باید در یا بعد از {$min} باشد.
    time: زمان باید در یا بعد از {$min} باشد.
    number: مقدار باید بزرگ‌تر یا مساوی {$min} باشد.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ شما باید حداقل {$min} گزینه را انتخاب کنید. }}
        *   {{ شما باید حداقل {$min} گزینه را انتخاب کنید. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ شما باید حداقل {$min} آیتم اضافه کنید. }}
        *   {{ شما باید حداقل {$min} آیتم اضافه کنید. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: تاریخ/زمان باید در یا قبل از {$max} باشد.
    date: تاریخ باید در یا قبل از {$max} باشد.
    time: زمان باید در یا قبل از {$max} باشد.
    number: مقدار باید کوچک‌تر یا مساوی {$max} باشد.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ شما نمی‌توانید بیش از {$max} گزینه انتخاب کنید. }}
        *   {{ شما نمی‌توانید بیش از {$max} گزینه انتخاب کنید. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ شما نمی‌توانید بیش از {$max} آیتم اضافه کنید. }}
        *   {{ شما نمی‌توانید بیش از {$max} آیتم اضافه کنید. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ شما باید حداقل {$min} کاراکتر وارد کنید. }}
      *   {{ شما باید حداقل {$min} کاراکتر وارد کنید. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ شما نمی‌توانید بیش از {$max} کاراکتر وارد کنید. }}
      *   {{ شما نمی‌توانید بیش از {$max} کاراکتر وارد کنید. }}

  # Type validation errors
  type_mismatch:
    number: لطفاً یک عدد وارد کنید.
    email: لطفاً یک ایمیل معتبر وارد کنید.
    url: لطفاً یک URL معتبر وارد کنید.

  # Value used for the same field in another entry of the collection
  value_not_unique: این مقدار برای ورودی دیگری استفاده شده است.
  # Key of a keyed List field item used for another item of the same list
  key_not_unique: این کلید برای آیتم دیگری استفاده شده است.
  # Key of a keyed List field item that is a whole number, which doesn’t keep its order in a map
  key_numeric: کلید نمی‌تواند یک عدد صحیح باشد، زیرا آیتم‌ها ترتیب خود را از دست می‌دهند.

  # Custom field validation error
  invalid_value: مقدار نامعتبر است.
  unexpected_error: خطای غیرمنتظره‌ای رخ داد.

# ==============================================================================
# Entry Sidebar
# ==============================================================================
# Panels shown in the entry editor sidebar.

entry_sidebar:
  # Sidebar tab list aria-label
  sidebar_panels: پنل‌های نوار کناری

  # Validation panel: shows field validation errors
  validation:
    title: اعتبارسنجی
    placeholder: نتایج اعتبارسنجی اینجا نمایش داده می‌شوند.
    no_errors_found: هیچ خطایی یافت نشد.
    # Button in the panel header that validates the entry on demand
    validate: اعتبارسنجی

  # Slug panel: shows the entry slug and lets the user edit it
  slug:
    title: اسلاگ
    generated_on_save: اسلاگ هنگام ذخیره از محتوای ورودی ساخته می‌شود. هر تاریخ و زمانی در آن، تاریخ و زمان ذخیره خواهد بود.
    unavailable: این ورودی اسلاگ ندارد.

  # History panel: shows entry commit history
  history:
    title: تاریخچه
    fetch_failed: بارگذاری تاریخچه ناموفق بود.
    no_history: هیچ تاریخچه‌ای یافت نشد.

  # Backlinks panel: shows entries referencing this entry
  backlinks:
    title: بک‌لینک‌ها
    no_entries: هیچ ورودی‌ای به این ورودی ارجاع نمی‌دهد.

  # Tab label of a panel with a count, e.g. of comments. {$title} is the panel title
  title_with_count: '{$title} ({$count})'

# Status shown next to the Save button while an entry with many new files is being saved
# {$done} and {$total} are the number of files prepared and to prepare, or the number of commits
# made and the estimated number of commits in all
save_progress:
  preparing: 'آماده‌سازی فایل‌ها: {$done} از {$total}'
  committing: 'ذخیره در GitHub: {$done} از حدود {$total} کامیت'

# Entry save error dialog
saving_entry:
  error:
    title: خطا
    description: خطایی هنگام ذخیره ورودی رخ داد. لطفاً بعداً دوباره تلاش کنید.

# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: ورودی توسط شخص دیگری تغییر کرده است
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} این ورودی را در {$date}، پس از باز کردن آن توسط شما، تغییر داد.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: این ورودی پس از باز کردن آن توسط شما، در مخزن تغییر کرده است.
  deleted: این ورودی پس از باز کردن آن توسط شما، از مخزن حذف شده است.
  # Follows `modified_by` or `modified`
  overwrite_warning: اگر اکنون ذخیره کنید، تغییرات آن‌ها از بین خواهد رفت.
  # Follows `deleted`
  recreate_warning: اگر اکنون ذخیره کنید، ورودی دوباره ایجاد خواهد شد.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: از آنجا که این ورودی در همان فایلی ذخیره می‌شود که ورودی‌های دیگر در آن هستند، نمی‌توان آن را روی این تغییر ذخیره کرد. ویرایش را لغو کنید، سپس ورودی را دوباره از فهرست باز کرده و ویرایش‌های خود را انجام دهید.
  # OK button label
  save_anyway: ذخیره در هر صورت
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: مخزن هنگام ذخیره توسط شخص دیگری به‌روزرسانی شد. لطفاً دوباره تلاش کنید.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: ورودی دیگری که در همان فایل ذخیره شده است توسط شخص دیگری تغییر کرده است. لطفاً دوباره تلاش کنید.
  # {$path} is the file path
  array_file_invalid: فایل {$path} قابل به‌روزرسانی نیست، زیرا شامل فهرست معتبری از ورودی‌ها نیست.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
# repository while the user has it open. The change itself is described with the `save_conflict`
# strings above
remote_change:
  reload_entry: بارگذاری مجدد ورودی
  # Confirmation shown before reloading when the user has unsaved changes
  confirm_reloading_entry: آیا مطمئن هستید که می‌خواهید ورودی را دوباره بارگذاری کنید؟ تغییرات ذخیره‌نشده شما از بین خواهند رفت.

