    light: روشن

  # Language panel
  language:
    title: زبان
    ui_language:
      title: زبان رابط کاربری
      select_language: انتخاب زبان

  # Contents panel
  contents:
    title: محتواها
    editor:
      title: ویرایشگر
      use_draft_backup:
        switch_label: پشتیبان‌گیری خودکار از پیش‌نویس‌های ورودی
      close_on_save:
        switch_label: بستن ویرایشگر پس از ذخیره پیش‌نویس
      close_with_escape:
        switch_label: بستن ویرایشگر با کلید Escape

  # Internationalization panel
