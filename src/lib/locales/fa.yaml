# Character counter: shows character count for text fields
character_counter:
  # {$count} is the current character count; {$min} and {$max} are configured limits
  min_max: |
    .input {$count :integer}
    .match $count
      0   {{ هیچ کاراکتری وارد نشده است. حداقل: {$min}. حداکثر: {$max}. }}
      one {{ {$count} کاراکتر وارد شده است. حداقل: {$min}. حداکثر: {$max}. }}
      *   {{ {$count} کاراکتر وارد شده است. حداقل: {$min}. حداکثر: {$max}. }}
  # {$count} is the current character count and {$min} is the minimum allowed count
  min: |
    .input {$count :integer}
    .match $count
      0   {{ هیچ کاراکتری وارد نشده است. حداقل: {$min}. }}
      one {{ {$count} کاراکتر وارد شده است. حداقل: {$min}. }}
      *   {{ {$count} کاراکتر وارد شده است. حداقل: {$min}. }}
  # {$count} is the current character count and {$max} is the maximum allowed count
  max: |
    .input {$count :integer}
    .match $count
      0   {{ هیچ کاراکتری وارد نشده است. حداکثر: {$max}. }}
      one {{ {$count} کاراکتر وارد شده است. حداکثر: {$max}. }}
      *   {{ {$count} کاراکتر وارد شده است. حداکثر: {$max}. }}

