# ==============================================================================
# Controls for List and Object field types.

# List item actions
remove_this_item: حذف این آیتم
move_up: انتقال به بالا
move_down: انتقال به پایین
# Menu of a list item or file with the extra reorder actions, shown in a list of 3 or more items
reorder_options: گزینه‌های تغییر ترتیب
move_to_top: انتقال به ابتدا
move_to_bottom: انتقال به انتها
