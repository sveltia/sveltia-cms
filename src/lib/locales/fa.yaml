change_language: تغییر زبان

# Live reload infobar: shown when the CMS runs on a page that a framework’s development server (e.g.
# Astro) reloads on every file change, instead of a static HTML file
live_reload_warning: سرور توسعه شما با هر تغییر فایل این صفحه را دوباره بارگذاری می‌کند، که می‌تواند ذخیره‌سازی را قطع کرده و فایل‌های شما را خراب کند. به جای آن، CMS را از یک فایل HTML ایستا ارائه دهید. <a>بیشتر بدانید</a>

# Toast notification shown while the translation for the selected language is being downloaded
# {$locale} is the localized language name, e.g., “French”
switching_language: در حال تغییر زبان به {$locale}…
locale_load_failed: بارگذاری ترجمه {$locale} امکان‌پذیر نبود. لطفاً بعداً دوباره تلاش کنید.

# Toast notification shown when changes saved with the local backend couldn’t be committed to Git
# {$reason} is one of the `local_git_skip_reasons` strings below
local_git_not_committed: تغییرات شما ذخیره شد اما در Git کامیت نشد. {$reason} برای اینکه فقط فایل‌ها ذخیره شوند، کامیت‌های Git را در تنظیمات > توسعه‌دهنده خاموش کنید.
local_git_skip_reasons:
  unsupported_repository: مخزن شما از قابلیتی از Git استفاده می‌کند که CMS از آن پشتیبانی نمی‌کند، مانند worktree پیوندی، نام‌های شیء SHA-256، فرمت reftable، ایندکس پراکنده (sparse index)، یا ایندکس نسخه ۳ یا ۴ که گزینه feature.manyFiles و دستور git add -N از آن استفاده می‌کنند.
  missing_identity: نام و آدرس ایمیل شما در پیکربندی Git مخزن تنظیم نشده است و CMS نمی‌تواند پیکربندی سراسری شما را بخواند. آن‌ها را در مخزن با git config --local user.name "Your Name" و git config --local user.email "you@example.com" تنظیم کنید.
  locked: فرایند Git دیگری در حال استفاده از مخزن است. اگر هیچ فرایندی در حال اجرا نیست، فایل .git/index.lock را حذف کنید.
  # The operation in progress, with how to finish or cancel it
  operation_in_progress:
    merge: یک ادغام (merge) در حال انجام است. آن را با git commit کامل کنید یا با git merge --abort لغو کنید.
    rebase: یک rebase در حال انجام است. آن را با git rebase --continue کامل کنید یا با git rebase --abort لغو کنید. اگر از آن گذشته‌اید، git rebase --quit آن را بدون تغییر فایل‌های شما کنار می‌گذارد.
    cherry_pick: یک cherry-pick در حال انجام است. آن را با git cherry-pick --continue کامل کنید یا با git cherry-pick --abort لغو کنید.
    revert: یک revert در حال انجام است. آن را با git revert --continue کامل کنید یا با git revert --abort لغو کنید.
    am: اعمال وصله‌ها با git am در حال انجام است. آن را با git am --continue کامل کنید یا با git am --abort لغو کنید.
    conflict: برخی فایل‌ها دارای تداخل هستند. ابتدا آن‌ها را حل کرده و نتایج را stage کنید.
  detached_head: هیچ شاخه‌ای checkout نشده است.
  staged_changes: شما تغییرات دیگری دارید که برای کامیت stage شده‌اند. ابتدا آن‌ها را کامیت یا unstage کنید.
  # {$path} is the file path
  lfs: '{$path} با Git LFS ردیابی می‌شود که CMS نمی‌تواند در آن کامیت کند.'
  # {$message} is the error message
  error: یک خطای غیرمنتظره رخ داد. {$message}

