      description: در <a {$homeHref}>{$service}</a> ثبت‌نام کرده و <a {$apiKeyHref}>کلید API خود</a> را در اینجا وارد کنید تا ترجمه سریع فیلدهای متنی فعال شود.

  # Media panel
  media:
    title: رسانه
    stock_photos:
      api_keys:
        title: کلیدهای API سرویس تصویر استوک
        description: مدیریت کلیدهای API برای <a>سرویس‌های تصویر استوک</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: کلید API سرویس {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: در <a {$homeHref}>API سرویس {$service}</a> ثبت‌نام کرده و <a {$apiKeyHref}>کلید API خود</a> را در اینجا وارد کنید تا تصاویر استوک رایگان را درج کنید.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: تصاویر ارائه شده توسط {$service}
      no_services: هیچ <a>سرویس تصویر استوکی</a> پیکربندی نشده است.
    cloud_storage:
      api_keys:
        title: کلیدهای API سرویس ذخیره‌سازی ابری
        description: مدیریت کلیدهای API برای <a>سرویس‌های ذخیره‌سازی ابری</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: کلید API سرویس {$service}
      no_services: هیچ <a>سرویس ذخیره‌سازی ابری</a> پیکربندی نشده است.

  # AI panel
  ai:
    title: هوش مصنوعی
    api_keys:
      title: کلیدهای API سرویس هوش مصنوعی
      description: مدیریت کلیدهای API برای سرویس‌های هوش مصنوعی.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: کلید API سرویس {$service}

  # Accessibility panel
  accessibility:
    title: دسترسی‌پذیری
    underline_links:
      title: زیرخط‌دار کردن لینک‌ها
      description: نمایش زیرخط برای لینک‌ها در پیش‌نمایش ورودی و برچسب‌های رابط کاربری.
      switch_label: همیشه لینک‌ها زیرخط‌دار باشند

  # Data Management panel
  data:
    title: مدیریت داده‌ها
    clear_data:
      title: پاک‌سازی داده‌ها
      # Clear File Cache button
      file_cache:
        description: حذف محتوای فایل‌ها و تصاویر بندانگشتی ذخیره‌شده در حافظه نهان محلی برای آزاد کردن فضای ذخیره‌سازی یا رفع مشکلات ناشی از داده‌های قدیمی.
        button_label: پاک‌سازی حافظه نهان فایل‌ها
        confirmation: محتوای فایل‌ها و تصاویر بندانگشتی ذخیره‌شده در حافظه نهان محلی حذف خواهند شد. پیش‌نویس‌های ذخیره‌نشده و تنظیمات شما حفظ می‌شوند و داده‌های حذف‌شده در صورت نیاز دوباره دانلود یا تولید خواهند شد. پس از اتمام، CMS دوباره بارگذاری می‌شود.
      # Erase All Data button
      all_data:
        description: حذف همه چیزهایی که CMS در این مرورگر نگه می‌دارد، از جمله فایل‌های ذخیره‌شده در حافظه نهان، پیش‌نویس‌های ذخیره‌نشده و تنظیمات. هر چیزی که قبلاً در مخزن شما ذخیره شده باشد تحت تأثیر قرار نمی‌گیرد.
        button_label: پاک کردن همه داده‌ها
        confirmation: همه داده‌های ذخیره‌شده در این مرورگر حذف خواهند شد، از جمله محتوای فایل‌های ذخیره‌شده در حافظه نهان، تصاویر بندانگشتی، پیش‌نویس‌های ذخیره‌نشده، تنظیمات و وضعیت ورود. مخزن شما تحت تأثیر قرار نمی‌گیرد، اما هر تغییری که ذخیره نکرده‌اید از دست می‌رود و باید دوباره وارد شوید. پس از اتمام، CMS دوباره بارگذاری می‌شود.

  # Developer panel
  developer:
    title: توسعه‌دهنده
    developer_mode:
      title: حالت توسعه‌دهنده
      description: فعال‌سازی برخی ویژگی‌های مخصوص توسعه‌دهندگان، از جمله لوگ‌های تفصیلی کنسول و منوهای زمینه بومی.
      switch_label: فعال‌سازی حالت توسعه‌دهنده
    local_git:
      title: کامیت‌های Git
      description: هر بار که تغییرات خود را ذخیره می‌کنید، آن‌ها را در شاخه فعلی مخزن محلی خود کامیت کنید، همان‌طور که CMS هنگام کار با مخزن راه دور انجام می‌دهد. سپس می‌توانید کامیت‌ها را با ابزارهای معمول Git خود بررسی و push کنید.
      switch_label: کامیت تغییرات در Git
      checking: در حال بررسی مخزن…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: تغییرات در شاخه {$branch} به نام {$name} ({$email}) کامیت خواهند شد.
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: در حال حاضر نمی‌توان تغییرات را کامیت کرد. {$reason}
    deploy_hook:
      title: هوک انتشار (Deploy Hook)
      description: آدرس وب‌هوک را وارد کنید تا هنگام فراخوانی دستی انتشار با انتخاب «انتشار تغییرات»، فراخوانی شود. اگر از GitHub Actions یا GitLab CI/CD استفاده می‌کنید می‌توانید این را خالی بگذارید.
      # Hook URL input
      url:
        field_label: آدرس URL هوک
        saved: آدرس URL هوک ذخیره شد.
        removed: آدرس URL هوک حذف شد.
      # Authorization header input
      auth:
        field_label: هدر احراز هویت (مثلاً Bearer <token>) (اختیاری)
        saved: هدر احراز هویت ذخیره شد.
        removed: هدر احراز هویت حذف شد.

