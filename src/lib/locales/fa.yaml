    compute_field_uuid_in_expression: گزینه `value` فیلد Compute نمی‌تواند از برچسب UUID مانند `\{\{uuid\}\}` استفاده کند، زیرا گزینه `value_type` برابر `{$valueType}` است که آن را به یک عبارت حسابی تبدیل می‌کند.
    # {$value} is the default value and {$valueType} is the configured value type; Don’t localize `default` and `value_type`
    number_field_default_not_integer: گزینه `default` فیلد Number روی `{$value}` تنظیم شده است، اما باید یک عدد صحیح باشد زیرا گزینه `value_type` برابر `{$valueType}` است.
    number_field_default_not_number: گزینه `default` فیلد Number روی `{$value}` تنظیم شده است، اما باید یک عدد باشد زیرا گزینه `value_type` برابر `{$valueType}` است.
    # Don’t localize `fields` and `types`
    object_field_no_subfields: گزینه `fields` یا `types` فیلد Object باید حداقل یک آیتم داشته باشد.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: مجموعه ارجاع‌شده `{$collection}` نامعتبر است یا تعریف نشده است.
    relation_field_invalid_collection_file: فایل ارجاع‌شده `{$file}` نامعتبر است یا تعریف نشده است.
    # Don’t localize `file`
    relation_field_missing_file_name: گزینه `file` باید برای ارتباط با یک مجموعه فایل تعریف شود.
    relation_field_invalid_value_field: فیلد مقدار ارجاع‌شده `{$field}` نامعتبر است یا تعریف نشده است.
    # {$collection} is the referenced collection name; Don’t localize `file`, `value_field` and `slug`.
    # The curly brackets are escaped with backslashes for MessageFormat 2
    relation_field_array_file_slug: ارتباط با مجموعه `{$collection}` نمی‌تواند مقدار `\{\{slug\}\}` را ذخیره کند، زیرا اسلاگ هر ورودی در مجموعه‌ای با گزینه `file` موقعیت آن است که با تغییر ترتیب یا حذف ورودی‌ها تغییر می‌کند. به جای آن گزینه `value_field` را روی فیلدی با مقدار یکتا تنظیم کنید.
    # {$collection} is the referenced collection name; Don’t localize `file`
    relation_field_array_file_workflow: مجموعه‌ای با گزینه `file` نمی‌تواند با مجموعه `{$collection}` ارتباط داشته باشد که از گردش کار تحریریه یا گردش کار پیش‌نمایش استفاده می‌کند، زیرا ارجاع‌ها به ورودی‌ای که در آنجا تغییر نام داده یا حذف شود، در فایل قابل به‌روزرسانی نیستند.
    relation_field_invalid_display_field: فیلد نمایش ارجاع‌شده `{$field}` نامعتبر است یا تعریف نشده است.
    relation_field_invalid_search_field: فیلد جستجوی ارجاع‌شده `{$field}` نامعتبر است یا تعریف نشده است.
    relation_field_invalid_filter_field: فیلد فیلتر ارجاع‌شده `{$field}` نامعتبر است یا تعریف نشده است.
    relation_field_invalid_sort_field: فیلد مرتب‌سازی ارجاع‌شده `{$field}` نامعتبر است یا تعریف نشده است.
    # Don’t localize `sort_by` and `file`
    relation_field_sort_by_file_ignored: گزینه `sort_by` برای ارتباط با یک فایل اعمال نمی‌شود، زیرا گزینه‌های آن از ترتیب آیتم‌های لیست پیروی می‌کنند. این گزینه نادیده گرفته خواهد شد.
    unexpected: خطای غیرمنتظره

    # Schema validation errors, reported when the configuration doesn’t match the published JSON
    # schema. In all of these, {$option} is a configuration option path such as `backend.name` or
    # `view_filters[0].pattern`, relative to the collection, file or field named before it.
    # {$type} is a value type name from `schema_value_type` below
    schema_invalid_type: گزینه `{$option}` باید {$type} باشد.
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'گزینه `{$option}` باید یکی از این مقادیر باشد: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: گزینه `{$option}` باید `{$value}` باشد.
    schema_invalid_empty_value: گزینه `{$option}` باید یک رشته خالی باشد.
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: گزینه `{$option}` باید آرایه‌ای از {$count} آیتم باشد.
    schema_invalid_value: گزینه `{$option}` دارای مقدار نامعتبر است.
    schema_missing_option: گزینه `{$option}` الزامی است.
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'یکی از این گزینه‌ها الزامی است: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: یک رشته
      number: یک عدد
      integer: یک عدد صحیح
      boolean: یک مقدار بولین
      array: یک آرایه
      object: یک شیء
      'null': خالی

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: شناسه برنامه OAuth تعریف نشده است. کاربران برای ورود باید یک توکن دسترسی ارائه دهند.
    # Don’t localize `prefix`
    site_library_prefix_template: گزینه `prefix` یک کتابخانه رسانه شامل برچسب‌های قالب است که فقط در سطح فیلد پشتیبانی می‌شوند، زیرا در سطح بالا ورودی‌ای برای پر کردن آن‌ها وجود ندارد.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: گزینه `{$prop}` در Sveltia CMS پشتیبانی نمی‌شود. این گزینه نادیده گرفته خواهد شد.
    # Don’t localize `stages`, `publish_mode`, `editorial_workflow` and {$type}, which is `preview` or `simple`
    publish_mode_stages_ignored: گزینه `stages` در `publish_mode` فقط برای حالت انتشار `editorial_workflow` اعمال می‌شود، بنابراین با `{$type}` نادیده گرفته می‌شود.
    # Don’t localize `pattern`, `m` and `s`
    inline_component_multiline_pattern: '`pattern` این کامپوننت درون‌خطی دارای پرچم `m` یا `s` است یا با شکستگی خط مطابقت دارد، اما کامپوننت درون‌خطی فقط درون یک پاراگراف تطبیق داده می‌شود.'
    # {$name} is a button or component name and {$option} is `buttons` or `editor_components`; Don’t localize them and `multiline: false`
    single_line_block_item: 'آیتم `{$name}` از گزینه `{$option}` نادیده گرفته می‌شود، زیرا فیلدی با `multiline: false` فقط می‌تواند محتوای درون‌خطی نگه دارد.'
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: هر دو گزینه `picker_utc` و گزینه‌های جدیدتر منطقه زمانی (`input_timezone` یا `output_utc`) تنظیم شده‌اند. گزینه‌های جدید اولویت دارند. حذف `picker_utc` را از پیکربندی خود مد نظر قرار دهید.
    # Don’t localize `localize_format` and `format`
    localize_format_without_format: گزینه `localize_format` هیچ تأثیری ندارد، زیرا فیلد گزینه `format` ندارد و مقدار آن در فرمت ISO 8601 ذخیره می‌شود.
    # {$name} is a template tag like `fields.lines.*.price`; Don’t localize `value`, `*` and `sum()`
    compute_field_wildcard_without_item: گزینه `value` فیلد Compute به `{$name}` ارجاع می‌دهد، اما فیلد درون آیتمی از لیستی که `*` نماینده آن است قرار ندارد، بنابراین به هیچ مقداری تبدیل نمی‌شود. فقط یک تابع تجمیعی مانند `sum()` می‌تواند از همه آیتم‌های یک لیست استفاده کند.
    # {$name} is a template tag like `fields.lines.*.amount`; Don’t localize `value`
    compute_field_self_reference: گزینه `value` فیلد Compute با `{$name}` به خود فیلد ارجاع می‌دهد، بنابراین مقدار آن با هر بار محاسبه تغییر می‌کند و هرگز ثابت نمی‌شود.
    # {$name} is a template tag like `fields.total`; Don’t localize `value`
    compute_field_reference_cycle: گزینه `value` فیلد Compute به `{$name}` ارجاع می‌دهد، که فیلد Compute دیگری است که به طور مستقیم یا از طریق فیلدهای دیگر به این فیلد ارجاع می‌دهد، بنابراین مقادیر آن‌ها هرگز ثابت نمی‌شوند.
    # Don’t localize `localize_format`, `true` and `de`
    localize_format_without_i18n: گزینه `localize_format` برابر `true` است، اما i18n برای مجموعه فعال نیست، بنابراین مقدار به انگلیسی نوشته می‌شود. به جای آن، گزینه را روی یک کد زبان مانند `de` تنظیم کنید.
    # {$locale} is the locale code from the configuration; Don’t localize `localize_format`
    localize_format_unsupported_locale: گزینه `localize_format` روی `{$locale}` تنظیم شده است که زبان پشتیبانی‌شده‌ای نیست، بنابراین مقدار به انگلیسی نوشته می‌شود.
    # Don’t localize `preview_path`
    preview_path_no_date_field: گزینه `preview_path` از برچسب‌های تاریخ و زمان استفاده می‌کند، اما مجموعه هیچ فیلد DateTime برای خواندن آن‌ها ندارد، بنابراین لینک پیش‌نمایش نمایش داده نخواهد شد.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: گزینه `preview_path_date_field` به فیلدی به نام `{$name}` ارجاع می‌دهد، اما هیچ فیلد DateTime با این نام تعریف نشده است، بنابراین لینک پیش‌نمایش نمایش داده نخواهد شد.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: گزینه `preview_path` به `{$name}` ارجاع می‌دهد، اما چنین فیلدی در مجموعه تعریف نشده است، بنابراین لینک پیش‌نمایش نمایش داده نخواهد شد.
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: مجموعه هیچ فیلد `{$name}` برای نام‌گذاری ورودی‌های جدید ندارد، بنابراین هر ورودی جدید یک اسلاگ تصادفی می‌گیرد. یک فیلد `{$name}` اضافه کنید، یا گزینه `identifier_field` یا `slug` را تنظیم کنید.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: گزینه `i18n` در `slug` هیچ تأثیری ندارد، زیرا مجموعه از ساختار i18n از نوع `multiple_files`، `multiple_folders` یا `multiple_root_folders` استفاده نمی‌کند که در آن هر زبان فایل خود را دارد.
    # Don’t localize `slug`, `template` and `auto_increment`
    slug_template_ignored: گزینه `template` در `slug` نادیده گرفته می‌شود، زیرا گزینه `auto_increment` به جای آن اسلاگ‌ها را شماره‌گذاری می‌کند.
    # {$file} is the file path; Don’t localize `file`, `locale`, `i18n`, `false`,
    # `omit_default_locale_from_file_path` and the example paths. The curly brackets in the examples
    # are escaped with backslashes for MessageFormat 2
    locale_not_omitted_from_file_path: جانگهدار `locale` را نمی‌توان از مسیر `file` با مقدار `{$file}` حذف کرد، بنابراین با وجود گزینه i18n با نام `omit_default_locale_from_file_path`، زبان پیش‌فرض در آن باقی می‌ماند. برای حذف زبان، از جانگهدار به عنوان نام کامل یک پوشه استفاده کنید، مانند `\{\{locale\}\}/about.md`، یا آن را بین نام فایل و پسوند قرار دهید، مانند `about.\{\{locale\}\}.md`. برای حفظ آن، گزینه را در گزینه `i18n` فایل روی `false` تنظیم کنید.
    # Don’t localize `i18n`
    i18n_not_configured: گزینه `i18n` فعال است، اما i18n در سطح بالای پیکربندی یا در مجموعه پیکربندی نشده است، بنابراین این گزینه هیچ تأثیری ندارد.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: گزینه `public_folder` یک رشته خالی است، بنابراین به جای آن از مسیر `media_folder` برای مسیرهای دارایی ذخیره‌شده در ورودی‌ها استفاده می‌شود. این گزینه را حذف کنید، یا آن را روی مسیری که می‌خواهید استفاده کنید، مانند `/images`، تنظیم کنید.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: گزینه `{$option}` در طرحواره پیکربندی Sveltia CMS تعریف نشده است. این گزینه نادیده گرفته خواهد شد. وجود اشتباه تایپی یا خطای نحوی را بررسی کنید.
    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: گزینه `default_localized` هیچ تأثیری ندارد، زیرا i18n برای مجموعه فعال نیست. به جای آن از گزینه `default` استفاده کنید.
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: گزینه `default_localized` مقداری برای `{$locale}` دارد که جزو زبان‌های مجموعه نیست، بنابراین این مقدار هرگز استفاده نمی‌شود.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'برای جزئیات یادداشت‌های سازگاری را ببینید: {$link}'

  # Console tip shown after config load
  schema_tip: برای تجربه بهتر توسعه‌دهندگان، می‌توانید فایل پیکربندی خود را در برابر طرحواره JSON مربوط به Sveltia CMS اعتبارسنجی کنید. برای جزئیات {$link} را ببینید.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: محلی
  # Browser compatibility warnings
  unsupported_browser: گردش کار محلی در مرورگر شما پشتیبانی نمی‌شود. لطفاً به جای آن از Chrome یا Edge استفاده کنید.
  disabled: گردش کار محلی در مرورگر شما غیرفعال شده است. <a>در اینجا نحوه فعال‌سازی آن آمده است</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'شما اکنون در حال مشاهده تابلوی گردش کار تحریریه هستید. پیش‌نویس‌ها: {$draft}. در حال بررسی: {$review}. آماده: {$ready}. در انتظار حذف: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'شما اکنون در حال مشاهده تابلوی گردش کار تحریریه هستید. پیش‌نویس‌ها: {$draft}. در حال بررسی: {$review}. در انتظار حذف: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'شما اکنون در حال مشاهده تابلوی گردش کار تحریریه هستید. پیش‌نویس‌ها: {$draft}. آماده: {$ready}. در انتظار حذف: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'شما اکنون در حال مشاهده صفحه پیش‌نویس‌ها هستید. پیش‌نویس‌ها: {$draft}. در انتظار حذف: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: پیش‌نویس
  drafts: پیش‌نویس‌ها
  in_review: در حال بررسی
  ready: آماده
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: در انتظار حذف
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: در حال استقرار

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: لغو حذف
  confirm_cancelling_deletion: آیا مطمئن هستید که می‌خواهید این حذف را لغو کنید؟ ورودی منتشرشده باقی خواهد ماند.
  confirm_completing_deletion: آیا مطمئن هستید که می‌خواهید این ورودی را حذف کنید؟ بلافاصله حذف خواهد شد.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ ورودی برای حذف علامت‌گذاری شد. }}
      *   {{ {$count} ورودی برای حذف علامت‌گذاری شدند. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ تغییرات دور انداخته شدند. }}
      *   {{ تغییرات {$count} ورودی دور انداخته شدند. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: در حال لغو حذف…
  deletion_cancelled: حذف لغو شد.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: لغو حذف امکان‌پذیر نبود. لطفاً دوباره تلاش کنید.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: ورودی‌های منتشرنشده
  published_entries: ورودی‌های منتشرشده
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'وضعیت: {$status}'
  change_entry_status: تغییر وضعیت ورودی
  # Editor toolbar: progress label while the status is being changed
  changing_status: در حال تغییر وضعیت…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: در حال به‌روزرسانی وضعیت…
  status_updated: وضعیت به‌روزرسانی شد.
  # Error notification when the status could not be changed
  status_change_failed: تغییر وضعیت امکان‌پذیر نبود. لطفاً دوباره تلاش کنید.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: تازه‌سازی
  refreshing: در حال تازه‌سازی…
  refreshed: تابلو به‌روز است.
  # Error notification when the board could not be refreshed
  refresh_failed: تازه‌سازی تابلو امکان‌پذیر نبود. لطفاً دوباره تلاش کنید.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: ورودی دارای خطا است. لطفاً پیش از تغییر وضعیت، آن‌ها را اصلاح کنید.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: ورودی دارای خطا است. لطفاً پیش از انتشار، آن‌ها را اصلاح کنید.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: ارسال برای بررسی
  confirm_sending_for_review: تغییرات شما به عنوان پیش‌نویس ذخیره شده است. ورودی را برای بررسی ارسال می‌کنید تا فردی آن را بررسی و منتشر کند؟
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: علامت‌گذاری به عنوان آماده
  confirm_marking_as_ready: تغییرات شما به عنوان پیش‌نویس ذخیره شد. ورودی را به عنوان آماده علامت‌گذاری می‌کنید تا قابل انتشار باشد؟
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: انتشار ورودی
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: دور انداختن تغییرات
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: آیا مطمئن هستید که می‌خواهید این ورودی را حذف کنید؟ تا زمانی که حذف منتشر نشود، برداشته نخواهد شد. تا آن زمان همچنان آن را در فهرست ورودی‌ها با علامت «در انتظار حذف» خواهید یافت.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: این ورودی هنوز منتشر نشده است، بنابراین حذف آن باعث دور انداختن کامل آن می‌شود.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: این ورودی دارای تغییرات منتشرنشده است. دور انداختن آن‌ها نسخه منتشرشده را بازیابی خواهد کرد. خود ورودی حذف نخواهد شد.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ هنوز منتشر نشده است، بنابراین تغییرات منتشرنشده شما دور انداخته خواهند شد. هر نسخه منتشرشده‌ای منتشرشده باقی خواهد ماند. }}
      *   {{ هنوز منتشر نشده‌اند، بنابراین تغییرات منتشرنشده شما دور انداخته خواهند شد. هر نسخه منتشرشده‌ای منتشرشده باقی خواهد ماند. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ یکی از آن‌ها هنوز منتشر نشده است، بنابراین تغییرات منتشرنشده شما دور انداخته خواهند شد. هر نسخه منتشرشده‌ای منتشرشده باقی خواهد ماند. }}
      *   {{ {$count} مورد از آن‌ها هنوز منتشر نشده‌اند، بنابراین تغییرات منتشرنشده شما دور انداخته خواهند شد. هر نسخه منتشرشده‌ای منتشرشده باقی خواهند ماند. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: آیا مطمئن هستید که می‌خواهید این ورودی را منتشر کنید؟ تغییرات شما پس از بازسازی سایت آنلاین خواهند شد.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: در حال انتشار ورودی…
  entry_published: ورودی منتشر شد.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: در حال حذف ورودی…
  discarding_changes: در حال دور انداختن تغییرات…
  entry_deleted: ورودی حذف شد.
  # Error notification when publishing fails
  publishing_entry_failed: انتشار ورودی امکان‌پذیر نبود. لطفاً دوباره تلاش کنید.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: این ورودی را نمی‌توان در اینجا منتشر کرد، زیرا همراه با تغییرات دیگری است که CMS نمی‌تواند به شما نشان دهد. از یک توسعه‌دهنده بخواهید آن را بررسی کند.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: ورودی پس از باز کردن آن توسط شما تغییر کرده است. صفحه را دوباره بارگذاری کنید تا پیش از انتشار، آخرین نسخه را بررسی کنید.
  review_on_x: بررسی در {$service}
  from_fork: از یک فورک
  fork_entry_editable: این ورودی از درخواست ادغام یک مشارکت‌کننده می‌آید که از «{$fork}» باز شده است. تغییرات شما در شاخه او ذخیره می‌شوند. درخواست ادغام را در سرویس Git بررسی و ادغام کنید.
  fork_entry_locked: این ورودی از درخواست ادغام یک مشارکت‌کننده می‌آید که از «{$fork}» باز شده است. مشارکت‌کننده اجازه ویرایش آن را به نگه‌دارندگان نمی‌دهد، بنابراین در اینجا فقط قابل مشاهده است.
  fork_not_editable: مشارکت‌کننده اجازه ویرایش این درخواست ادغام را به نگه‌دارندگان نمی‌دهد.
  fork_entry_gone: درخواست ادغام مشارکت‌کننده دیگر باز نیست، بنابراین تغییرات را نمی‌توان در آن ذخیره کرد.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: درخواست دیگری ({$number}) از قبل برای این ورودی خارج از CMS باز است. از یک توسعه‌دهنده بخواهید ابتدا آن را ببندد.
  # Workflow page: empty column message
  no_entries: بدون ورودی.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: کشیدن برای تغییر وضعیت
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: حذف
  # Workflow page: note on a card listing the new entries that were created from a Relation field
  # of the entry and are published along with it, e.g. “Also adds Section: Getting Started”
  companion_entries: همچنین افزودن {$entries}
  # Workflow page: note on a card listing the existing entries that were edited from a Relation
  # field of the entry and are published along with it, e.g. “Also changes Author: Ada Lovelace”
  edited_companion_entries: همچنین تغییر {$entries}
  # Workflow page: one of the entries listed by `companion_entries` or `edited_companion_entries`,
  # named by its collection’s singular label and its title
  companion_entry: '{$collection}: {$title}'

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: پیام کامیت
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: تغییرات خود را شرح دهید. این پیام همراه با آن‌ها در تاریخچه ثبت می‌شود.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: یادداشتی به پیامی که همراه با تغییرات شما در تاریخچه ثبت می‌شود اضافه کنید، مانند شماره یک مسئله (issue). می‌توانید آن را خالی بگذارید.
  # Accessible name of the text box when the user writes the whole message
  message: پیام کامیت
  # Accessible name of the text box when the text is added before or after the message
  addition: یادداشت
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'پیام: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: فورک کردن مخزن
  fork: فورک
  confirm_forking_repository: برای پیشنهاد تغییرات در «{$repo}»، باید یک فورک از مخزن روی حساب کاربری شما ایجاد شود. تغییرات شما در آن فورک ذخیره می‌شود و یک مدیر قبل از آنلاین شدن آن‌ها را بررسی می‌کند.
  # Error shown when the user declined the dialog above
  fork_declined: برای پیشنهاد تغییرات به یک فورک از مخزن روی حساب کاربری خود نیاز دارید.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: ایجاد فورک از مخزن «{$repo}» روی حساب کاربری شما امکان‌پذیر نبود.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: فورک «{$fork}» شما شاخه «{$branch}» را ندارد. فورک را از مخزن «{$repo}» به‌روزرسانی کنید، سپس دوباره وارد شوید.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: بررسی دسترسی شما به مخزن «{$repo}» امکان‌پذیر نبود. لطفاً لحظاتی دیگر دوباره تلاش کنید.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: مخزن «{$repo}» اجازه فورک کردن را نمی‌دهد. از یک مدیر بخواهید قابلیت فورک را برای آن فعال کند.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: شما یک دعوت‌نامه معلق برای مخزن «{$repo}» دارید. آن را در GitHub بپذیرید، سپس دوباره وارد شوید.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: ورود شما شامل دسترسی به مخازن خصوصی نیست، بنابراین مخزن «{$repo}» قابل خواندن نیست. از یک مدیر بخواهید تنظیمات احراز هویت CMS را بررسی کند.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: فقط یک مدیر می‌تواند تغییرات این سایت را منتشر کند. ورودی خود را به عنوان «در حال بررسی» علامت‌گذاری کنید تا شخص دیگری آن را بررسی کند.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: یکی از نگه‌دارندگان این ورودی را قبلاً منتشر کرده است، بنابراین چیزی برای بررسی باقی نمانده است.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: این تغییر نمی‌تواند به طور مستقیم انجام شود. فقط ویرایش‌های ورودی‌ها را می‌توان برای بررسی پیشنهاد داد.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: تغییرات شما در فورک مخزن شما در «{$repo}» ذخیره شده و قبل از آنلاین شدن بررسی می‌شوند.
  view_fork: مشاهده فورک

