  # Preferences operation errors
  error:
    permission_denied: دسترسی به ذخیره‌سازی کوکی رد شده است. لطفاً مجوزهای مرورگر خود را بررسی کرده و دوباره تلاش کنید.

  # Appearance panel
  appearance:
