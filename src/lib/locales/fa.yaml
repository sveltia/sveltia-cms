# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ یک خطا در پیکربندی CMS وجود دارد. لطفاً مشکل را حل کرده و دوباره تلاش کنید. }}
      *   {{ خطاهایی در پیکربندی CMS وجود دارد. لطفاً مشکلات را حل کرده و دوباره تلاش کنید. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: 'مجموعه {$collection}'
    file: 'فایل {$file}'
    component: 'کامپوننت {$component}'
    # Don’t localize `{$field}`
    field: 'فیلد `{$field}`'

  # Configuration error messages
  error:
    no_secure_context: برنامه Sveltia CMS فقط با آدرس‌های HTTPS یا localhost کار می‌کند.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ آدرس فایل پیکربندی باید از پروتکل HTTPS یا آدرس localhost استفاده کند. }}
        *   {{ آدرس‌های فایل پیکربندی باید از پروتکل HTTPS یا آدرس‌های localhost استفاده کنند. }}
    fetch_failed: دریافت فایل پیکربندی امکان‌پذیر نبود.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: 'پاسخ HTTP با وضعیت {$status} بازگشت.'
