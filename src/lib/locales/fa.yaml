# ==============================================================================
# Content and Asset Libraries
# ==============================================================================
# Strings used in the main content and asset management interfaces, including
# lists, navigation, and collection/folder views.

# Page container aria-labels
content_library: کتابخانه محتوا
asset_library: کتابخانه دارایی‌ها

# Primary sidebar section headings and list aria-labels
collections: مجموعه‌ها
entries: ورودی‌ها
files: فایل‌ها

# Asset location selector: option group labels
asset_location:
  # Assets stored in the site’s Git repository
  repository: سایت شما
  external: مکان‌های خارجی
  stock_photos: تصاویر استوک

# Sidebar and list labels
# Collection assets panel aria-label
collection_assets: دارایی‌های مجموعه
# List aria-labels for different list types
entry_list: فهرست ورودی‌ها
file_list: فهرست فایل‌ها
asset_list: فهرست دارایی‌ها

# Collection and folder page titles
# Used as aria-labels on page containers
# {$collection} is the current collection label
x_collection: 'مجموعه «{$collection}»'
# {$folder} is the current asset folder label
x_asset_folder: 'پوشه دارایی «{$folder}»'

# Navigation announcements (ARIA live regions)
# Announce page changes for screen reader users
viewing_collection_list: شما اکنون در حال مشاهده فهرست مجموعه‌ها هستید.
viewing_asset_folder_list: شما اکنون در حال مشاهده فهرست پوشه‌های دارایی هستید.
# Collection view announcements with entry counts
# {$collection} is the collection label and {$count} is the number of entries in it
viewing_x_collection: |
  .input {$count :integer}
  .match $count
    0   {{ شما اکنون در حال مشاهده مجموعه «{$collection}» هستید که هنوز هیچ ورودی ندارد. }}
    one {{ شما اکنون در حال مشاهده مجموعه «{$collection}» هستید که یک ورودی دارد. }}
    *   {{ شما اکنون در حال مشاهده مجموعه «{$collection}» هستید که {$count} ورودی دارد. }}
# Asset folder view announcements with asset counts
# {$folder} is the folder label and {$count} is the number of assets in it
viewing_x_asset_folder: |
  .input {$count :integer}
  .match $count
    0   {{ شما اکنون در حال مشاهده پوشه دارایی «{$folder}» هستید که هنوز هیچ دارایی ندارد. }}
    one {{ شما اکنون در حال مشاهده پوشه دارایی «{$folder}» هستید که یک دارایی دارد. }}
    *   {{ شما اکنون در حال مشاهده پوشه دارایی «{$folder}» هستید که {$count} دارایی دارد. }}

# Singleton file selection announcement
# {$file} is the singleton file name
singleton_selected_announcement: کلید Enter را فشار دهید تا فایل «{$file}» ویرایش شود.

