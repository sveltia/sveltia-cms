# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ یک خطا در پیکربندی CMS وجود دارد. لطفاً مشکل را حل کرده و دوباره تلاش کنید. }}
      *   {{ خطاهایی در پیکربندی CMS وجود دارد. لطفاً مشکلات را حل کرده و دوباره تلاش کنید. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: مجموعه {$collection}
    file: فایل {$file}
    component: کامپوننت {$component}
    # Don’t localize `{$field}`
    field: فیلد `{$field}`

  # Configuration error messages
  error:
    no_secure_context: برنامه Sveltia CMS فقط با آدرس‌های HTTPS یا localhost کار می‌کند.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ آدرس فایل پیکربندی باید از پروتکل HTTPS یا آدرس localhost استفاده کند. }}
        *   {{ آدرس‌های فایل پیکربندی باید از پروتکل HTTPS یا آدرس‌های localhost استفاده کنند. }}
    fetch_failed: دریافت فایل پیکربندی امکان‌پذیر نبود.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: پاسخ HTTP با وضعیت {$status} بازگشت.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'دریافت فایل پیکربندی امکان‌پذیر نبود. برای جلوگیری از بارگذاری فایل `config.yml`، مقدار <a>`load_config_file: false`</a> را به شیء پیکربندی پاس داده شده به `CMS.init()` اضافه کنید.'
    parse_failed: تجزیه فایل پیکربندی امکان‌پذیر نبود.
    parse_failed_invalid_object: فایل پیکربندی یک شیء معتبر JavaScript نیست.
    parse_failed_unsupported_type: فایل پیکربندی نوع فایل معتبری نیست. فقط فرمت‌های YAML، TOML و JSON پشتیبانی می‌شوند.
    no_collection: مجموعه‌ها تعریف نشده‌اند.
    # Don’t localize `hide`
    no_visible_collection: حداقل یک مجموعه باید مرئی باشد. گزینه `hide` را بررسی کنید.
    missing_backend: بک‌اند تعریف نشده است.
    missing_backend_name: نام بک‌اند تعریف نشده است.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: بک‌اند {$name} در Sveltia CMS <a>پشتیبانی نمی‌شود</a>.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: بک‌اند منسوخ‌شده {$name} در Sveltia CMS <a>پشتیبانی نمی‌شود</a>.
    unsupported_custom_backend: بک‌اند‌های سفارشی در Sveltia CMS <a>پشتیبانی نمی‌شوند</a>.
    unsupported_backend_suggestion: از یکی از <a>بک‌اندهای پشتیبانی‌شده</a> استفاده کنید.
    missing_repository: مخزن تعریف نشده است.
    invalid_repository: مخزن پیکربندی‌شده نامعتبر است. باید به فرمت «owner/repo» باشد.
    # Don’t localize `api_root`
    missing_api_root: گزینه `api_root` تعریف نشده است. این گزینه برای بک‌اند Forgejo الزامی است.
    invalid_root_dir: پوشه ریشه نامعتبر است. باید مسیری درون مخزن و بدون «..» باشد.
    invalid_root_dir_branch: پوشه ریشه را نمی‌توان در نام شاخه‌های حالت‌های انتشار `editorial_workflow` و `preview` استفاده کرد. هیچ بخشی از مسیر آن نمی‌تواند با نقطه شروع شود، به «.lock» ختم شود یا شامل فاصله یا کاراکتر خاصی مانند دونقطه یا ستاره باشد.
    path_outside_root_dir: مسیر «{$path}» به خارج از پوشه ریشه می‌رود، جایی که CMS نمی‌تواند فایل‌ها را فهرست کند.
    oauth_implicit_flow: روش احراز هویت پیکربندی‌شده (implicit flow) در Sveltia CMS پشتیبانی نمی‌شود. از یک <a>روش احراز هویت</a> دیگر استفاده کنید.
    github_pkce_unsupported: احراز هویت PKCE به دلیل محدودیت‌های GitHub هنوز پشتیبانی نمی‌شود. از یک <a>روش احراز هویت</a> دیگر استفاده کنید.
    additions_no_base_url: گزینه `base_url` باید آدرس URL سرویس Sveltia CMS Additions شما باشد.
    oauth_no_app_id: شناسه برنامه OAuth تعریف نشده است.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: گزینه `open_authoring` نیازمند حالت انتشار `editorial_workflow` یا `preview` است. برای جزئیات <a>مستندات</a> را ببینید.
    # Don’t localize `auth_methods`
    no_auth_methods: گزینه `auth_methods` باید حداقل شامل یک روش باشد.
    # Don’t localize `auth_scope`, `repo` and `public_repo`
    auth_scope_no_repo: گزینه `auth_scope` باید شامل `repo` یا `public_repo` باشد.
    missing_media_folder: پوشه رسانه تعریف نشده است.
    public_folder_relative_path: پوشه عمومی پیکربندی‌شده نامعتبر است. باید یک مسیر مطلق با شروع از «/» باشد.
    public_folder_absolute_url: آدرس مطلق URL برای گزینه پوشه عمومی در Sveltia CMS پشتیبانی نمی‌شود.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: گزینه `{$option}` شامل برچسب قالب `{$tag}` است که در آنجا پشتیبانی نمی‌شود. فقط برچسب‌های قالب اسلاگ، مانند `\{\{slug\}\}` و `\{\{year\}\}`، و برچسب‌های `\{\{dirname\}\}`، `\{\{filename\}\}`، `\{\{extension\}\}`، `\{\{media_folder\}\}` و `\{\{public_folder\}\}` قابل استفاده هستند.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: گزینه `{$option}` شامل برچسب قالب `{$tag}` است که فقط در گزینه یک مجموعه، یک فایل مجموعه یا یک فیلد قابل استفاده است، جایی که ورودی‌ای برای پر کردن آن وجود دارد.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: گزینه `sanitize_replacement` روی `{$replacement}` تنظیم شده است، اما شامل کاراکتری است که در اسلاگ قابل استفاده نیست، بنابراین نمی‌تواند جایگزین آن شود.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: گزینه `{$option}` روی `{$url}` تنظیم شده است، اما باید یک آدرس URL مطلق باشد که با `https://` یا `http://` شروع شود.
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: گزینه `stages` در `publish_mode` باید با `draft` شروع شود و مراحل را به ترتیب `draft`، `pending_review`، `pending_publish` و بدون تکرار فهرست کند.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: گزینه `i18n.locales` باید حداقل یک زبان را فهرست کند.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: گزینه `default_locale` روی `{$locale}` تنظیم شده است، اما جزو `locales` نیست.
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: گزینه `initial_locales` شامل `{$locale}` است، اما جزو `locales` نیست.
    # Don’t localize `i18n`
    i18n_no_collections: 'گزینه `i18n` در سطح بالا پیکربندی شده است، اما هیچ‌یک از مجموعه‌ها یا تک نسخه‌ها گزینه `i18n` را ندارند، بنابراین هیچ محتوایی قابل ترجمه نیست. `i18n: true` را به مجموعه‌ها و تک نسخه‌هایی که باید ترجمه شوند اضافه کنید.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: گزینه `transformations` شامل کلید پشتیبانی‌نشده `{$key}` است. باید `raster_image`، `svg` یا یک فرمت تصویر رستری پشتیبانی‌شده باشد.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: گزینه `quality` برای تغییر `{$key}` نامعتبر است. باید یک عدد صحیح بین ۰ تا ۱۰۰ باشد.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: گزینه `{$prop}` برای تغییر `{$key}` نامعتبر است. باید یک عدد صحیح مثبت باشد.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: مجموعه دارایی {$count} باید دارای گزینه `name` تعریف‌شده به عنوان رشته غیرخالی باشد.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: نام مجموعه دارایی `{$name}` نامعتبر است. نباید شامل کاراکترهای خاص باشد.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: نام‌های مجموعه دارایی باید یکتا باشند، اما `{$name}` بیش از یک‌بار استفاده شده است.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: مجموعه باید یکی از گزینه‌های `folder`، `file`، `files` یا `divider` را تعریف کرده باشد.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: مجموعه نمی‌تواند بیش از یکی از گزینه‌های `folder`، `file`، `files` و `divider` را داشته باشد.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: پسوند `{$extension}` با فرمت `{$format}` مطابقت ندارد.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: فیلد `{$name}` به عنوان بدنه زیر front matter ذخیره می‌شود که فقط می‌تواند متن نگه دارد، نه عدد، مقدار بولین، لیست یا شیء، آن‌طور که فیلد `{$widget}` نگه می‌دارد. از نوع فیلدی استفاده کنید که متن نگه می‌دارد، یا نام فیلد را تغییر دهید.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
    # brackets are escaped with backslashes for MessageFormat 2
    invalid_collection_data_file: گزینه `file` با مقدار `{$file}` نامعتبر است. باید مسیر یک فایل JSON و بدون جانگهدار `\{\{locale\}\}` باشد.
    # {$prop} is the option name; Don’t localize `file`
    unsupported_collection_data_file_option: گزینه `{$prop}` در مجموعه‌ای با گزینه `file` پشتیبانی نمی‌شود.
    # Don’t localize `file`, `publish_mode` and `simple`
    collection_data_file_workflow: گردش کار تحریریه و گردش کار پیش‌نمایش، از جمله نویسندگی باز، در مجموعه‌ای با گزینه `file` پشتیبانی نمی‌شوند. گزینه `publish_mode` مجموعه را روی `simple` تنظیم کنید.
    # {$prop} is the option name; Don’t localize `file` and `slug`. The curly brackets are escaped
    # with backslashes for MessageFormat 2
    collection_data_file_slug_tag: گزینه `{$prop}` در مجموعه‌ای با گزینه `file` نمی‌تواند شامل برچسب `\{\{slug\}\}` باشد، زیرا اسلاگ هر ورودی موقعیت آن است که با تغییر ترتیب یا حذف ورودی‌ها تغییر می‌کند. به جای آن از فیلدی با مقدار یکتا استفاده کنید.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: قالب اسلاگ `{$slug}` نامعتبر است زیرا نمی‌تواند شامل اسلش باشد. برای سازماندهی ورودی‌ها در زیرپوشه‌ها، به جای `slug` از گزینه `path` استفاده کنید.
    # {$name} is the field name from the configuration; Don’t localize `identifier_field`
    invalid_identifier_field: گزینه `identifier_field` به `{$name}` ارجاع می‌دهد، اما چنین فیلدی در مجموعه تعریف نشده است.
    # {$name} is the field name from the configuration; Don’t localize `filter`
    invalid_filter_field: گزینه `filter` به `{$name}` ارجاع می‌دهد، اما چنین فیلدی در مجموعه تعریف نشده است.
    # Don’t localize `filter`, `value` and `pattern`
    invalid_filter_no_condition: گزینه `filter` باید یکی از گزینه‌های `value` یا `pattern` را برای تطبیق ورودی‌ها داشته باشد.
    # {$option} is an option name such as `slug` or `summary` and {$name} is the field name or template tag from the configuration
    option_field_not_found: گزینه `{$option}` به `{$name}` ارجاع می‌دهد، اما چنین فیلدی تعریف نشده است.
    # {$name} is the field name from the configuration and {$widget} is its field type; Don’t localize `thumbnail`
