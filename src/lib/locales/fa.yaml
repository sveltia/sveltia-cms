  description: با خیال راحت CMS را بررسی کنید و محتوای نمونه را ویرایش کنید. تغییرات شما فقط در همین مرورگر ذخیره می‌شوند. هیچ چیزی به صورت آنلاین منتشر نمی‌شود و هیچ‌کس دیگری نمی‌تواند آن‌ها را ببیند.
  reset_hint: برای شروع دوباره با محتوای اصلی، گزینه «پاک کردن همه داده‌ها» را در تنظیمات > مدیریت داده‌ها انتخاب کنید.
  button_label: شروع کنید

