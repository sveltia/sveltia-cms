# ==============================================================================
# Entry and Collection Actions
# ==============================================================================
# Strings related to creating, editing, and managing entries and collections.

# Message shown while entries are still being retrieved: in the entry editor, when it was opened
# with a direct link before all the data has been loaded, and on the Editorial Workflow page while
# the pull requests are being fetched. {$count} selects the form
loading_entries: |
  .input {$count :integer}
  .match $count
    one {{ در حال بارگذاری ورودی… }}
    *   {{ در حال بارگذاری ورودی‌ها… }}
# Error message when entry cannot be found
entry_not_found: ورودی یافت نشد.

# Entry creation restrictions: tooltip and advisory messages
creating_entries_disabled_by_admin: ایجاد ورودی‌های جدید در این مجموعه توسط مدیر غیرفعال شده است.
# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: |
  .input {$quota :integer}
  .match $quota
    one {{ شما نمی‌توانید ورودی‌های جدیدی به این مجموعه اضافه کنید زیرا به حد مجاز {$quota} ورودی رسیده است. }}
    *   {{ شما نمی‌توانید ورودی‌های جدیدی به این مجموعه اضافه کنید زیرا به حد مجاز {$quota} ورودی رسیده است. }}
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$quota :integer}
  .input {$remaining :integer}
  .match $quota $remaining
    one one {{ این مجموعه به حد مجاز {$quota} ورودی نزدیک می‌شود. شما فقط می‌توانید {$remaining} ورودی دیگر ایجاد کنید. }}
    one *   {{ این مجموعه به حد مجاز {$quota} ورودی نزدیک می‌شود. شما فقط می‌توانید {$remaining} ورودی دیگر ایجاد کنید. }}
    *   one {{ این مجموعه به حد مجاز {$quota} ورودی نزدیک می‌شود. شما فقط می‌توانید {$remaining} ورودی دیگر ایجاد کنید. }}
    *   *   {{ این مجموعه به حد مجاز {$quota} ورودی نزدیک می‌شود. شما فقط می‌توانید {$remaining} ورودی دیگر ایجاد کنید. }}

# Read-only restrictions set with the `readonly` option: advisory messages
readonly_cms: CMS در حالت فقط‌خواندنی است. می‌توانید محتوا و دارایی‌ها را مشاهده کنید اما نمی‌توانید هیچ تغییری ایجاد کنید.
readonly_collection: این مجموعه فقط‌خواندنی است. می‌توانید محتوای آن را مشاهده کنید اما نمی‌توانید هیچ تغییری ایجاد کنید.
readonly_entry: این ورودی فقط‌خواندنی است. می‌توانید آن را مشاهده کنید اما نمی‌توانید هیچ تغییری ایجاد کنید.
readonly_asset_folder: این پوشه فقط‌خواندنی است. می‌توانید دارایی‌های آن را مشاهده کنید اما نمی‌توانید هیچ تغییری ایجاد کنید.
readonly_branch: شما اجازه push به شاخه «{$branch}» را ندارید. می‌توانید این محتوا را مشاهده کنید اما نمی‌توانید هیچ تغییری ایجاد کنید.
readonly_role: شما فقط دسترسی مشاهده دارید. می‌توانید محتوا و دارایی‌ها را مشاهده کنید اما نمی‌توانید هیچ تغییری ایجاد کنید.
readonly_reference: ورودی فقط‌خواندنی است، بنابراین ارجاع قابل حذف نیست.
# {$entries} is a comma-separated list of entries, each shown as “Collection › Entry”
cannot_rename_referenced_entry: 'نام این ورودی قابل تغییر نیست، زیرا ورودی‌های فقط‌خواندنی زیر با نام فعلی به آن ارجاع می‌دهند: {$entries}.'
# {$entries} is a comma-separated list of entries, each shown as “Collection › Entry”
cannot_move_referenced_asset: 'این دارایی قابل انتقال یا تغییر نام نیست، زیرا ورودی‌های فقط‌خواندنی زیر از آن استفاده می‌کنند: {$entries}.'

