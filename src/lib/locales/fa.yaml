collection_list: فهرست مجموعه‌ها
back_to_collection_list: بازگشت به فهرست مجموعه‌ها
asset_folder_list: فهرست پوشه‌های دارایی
back_to_asset_folder_list: بازگشت به فهرست پوشه‌های دارایی
