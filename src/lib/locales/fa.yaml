# ==============================================================================
# File Upload and Processing
# ==============================================================================
# Strings for file upload dialogs, progress indicators, and validation.

# Processing indicator shown during file preparation
# {$count} is the number of files currently being processed
processing_files: |
  .input {$count :integer}
  .match $count
    one {{ در حال پردازش یک فایل. این عملیات ممکن است مدتی طول بکشد. }}
    *   {{ در حال پردازش فایل‌ها. این عملیات ممکن است مدتی طول بکشد. }}

# Uploading section aria-label
uploading_files: در حال بارگذاری فایل‌ها

# Replace file confirmation
# Dialog body when replacing an existing file
# {$name} is the existing file name that will be replaced
confirm_replacing_file: '«{$name}» با این فایل جایگزین خواهد شد:'

# Upload confirmation with destination folder
# {$folder} is the destination folder label and {$count} is the number of files being uploaded
confirm_uploading_files: |
  .input {$count :integer}
  .match $count
    one {{ این فایل در پوشه «{$folder}» ذخیره خواهد شد: }}
    *   {{ این {$count} فایل در پوشه «{$folder}» ذخیره خواهند شد: }}

# File size validation
# Warning section for files exceeding size limits
oversized_files: فایل‌های بیش از حد بزرگ
# {$size} is the maximum allowed file size and {$count} is the number of oversized files
warning_oversized_files: |
  .input {$count :integer}
  .match $count
    one {{ این فایل قابل بارگذاری نیست زیرا حجم آن از حداکثر مجاز {$size} بیشتر است. لطفاً حجم آن را کاهش دهید یا فایل دیگری را انتخاب کنید. }}
    *   {{ این فایل‌ها قابل بارگذاری نیستند زیرا حجم آن‌ها از حداکثر مجاز {$size} بیشتر است. لطفاً حجم آن‌ها را کاهش دهید یا فایل‌های دیگری را انتخاب کنید. }}

# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: فایل‌های نامعتبر
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    one {{ این فایل قابل بارگذاری نیست زیرا آسیب دیده است یا محتوای آن با پسوند فایل مطابقت ندارد. این اتفاق معمولاً زمانی رخ می‌دهد که یک عکس به جای تبدیل، تغییر نام داده شده باشد (مانند تصویر HEIC که به عنوان فایل JPEG ذخیره شده باشد). لطفاً فایل را تبدیل کرده و دوباره تلاش کنید. }}
    *   {{ این فایل‌ها قابل بارگذاری نیستند زیرا آسیب دیده‌اند یا محتوای آن‌ها با پسوند فایل مطابقت ندارد. این اتفاق معمولاً زمانی رخ می‌دهد که عکس‌ها به جای تبدیل، تغییر نام داده شده باشند (مانند تصاویر HEIC که به عنوان فایل JPEG ذخیره شده باشند). لطفاً فایل‌ها را تبدیل کرده و دوباره تلاش کنید. }}
# {$count} is the number of files that are not of a type the field accepts, even once transformed
# {$types} is the list of accepted file types, such as “.pdf or .txt”
warning_unsupported_files: |
  .input {$count :integer}
  .match $count
    one {{ این فایل قابل بارگذاری نیست زیرا از انواع زیر نیست: {$types}. }}
    *   {{ این فایل‌ها قابل بارگذاری نیستند زیرا از انواع زیر نیستند: {$types}. }}
# {$count} is the number of files that are not of an image type the field accepts
# {$types} is the list of accepted image formats, such as “PNG or WebP”
warning_unsupported_image_files: |
  .input {$count :integer}
  .match $count
    one {{ این فایل قابل بارگذاری نیست زیرا فقط تصویری از انواع زیر پذیرفته می‌شود: {$types}. }}
    *   {{ این فایل‌ها قابل بارگذاری نیستند زیرا فقط تصاویری از انواع زیر پذیرفته می‌شوند: {$types}. }}

# File format validation when replacing an asset
# Warning section for replacement files that are in a different format
mismatched_files: فایل‌های ناهماهنگ
# {$name} is the name of the asset being replaced and {$count} is the number of mismatched files
warning_mismatched_files: |
  .input {$count :integer}
  .match $count
    one {{ این فایل نمی‌تواند جایگزین «{$name}» شود زیرا فرمت متفاوتی دارد. لطفاً فایل را به همان فرمت تبدیل کرده و دوباره تلاش کنید. }}
    *   {{ این فایل‌ها نمی‌توانند جایگزین «{$name}» شوند زیرا فرمت متفاوتی دارند. لطفاً فایل‌ها را به همان فرمت تبدیل کرده و دوباره تلاش کنید. }}

# File name conflict resolution
# {$count} is the number of conflicting file names in the target folder
file_name_conflict_confirmation: |
  .input {$count :integer}
  .match $count
    one {{ فایلی با همین نام قبلاً در این پوشه وجود دارد. آیا می‌خواهید آن را جایگزین کنید؟ }}
    *   {{ {$count} فایل با همین نام‌ها قبلاً در این پوشه وجود دارند. آیا می‌خواهید آن‌ها را جایگزین کنید؟ }}
# {$name} is the conflicting file name when there is exactly one conflict; {$count} is the total conflict count
file_name_conflict_confirmation_with_name: |
  .input {$count :integer}
  .input {$name :string}
  .match $count
    one {{ فایلی به نام «{$name}» قبلاً در این پوشه وجود دارد. آیا می‌خواهید آن را جایگزین کنید؟ }}
    *   {{ {$count} فایل با همین نام‌ها قبلاً در این پوشه وجود دارند. آیا می‌خواهید آن‌ها را جایگزین کنید؟ }}
file_name_conflict_resolution: حل تداخل نام فایل
# Option to keep both files (rename the new one)
keep_both: نگه داشتن هر دو

# Upload progress and error messages
uploading_files_progress: در حال بارگذاری…
uploading_files_failed: بارگذاری ناموفق بود.
# Errors shown when a file on a cloud storage service could not be deleted or renamed
deleting_assets_failed: حذف انجام نشد.
renaming_asset_failed: تغییر نام انجام نشد.
# Error shown when an edited text file in the Asset Library could not be saved
saving_asset_failed: ذخیره ناموفق بود.

# File metadata display
# Appended when a file was auto-converted (e.g., HEIF to JPEG)
