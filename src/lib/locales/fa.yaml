# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: این فیلد الزامی است.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: 'تاریخ/زمان باید در یا بعد از {$min} باشد.'
    date: 'تاریخ باید در یا بعد از {$min} باشد.'
    time: 'زمان باید در یا بعد از {$min} باشد.'
    number: 'مقدار باید بزرگ‌تر یا مساوی {$min} باشد.'
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ شما باید حداقل {$min} گزینه را انتخاب کنید. }}
        *   {{ شما باید حداقل {$min} گزینه را انتخاب کنید. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ شما باید حداقل {$min} آیتم اضافه کنید. }}
        *   {{ شما باید حداقل {$min} آیتم اضافه کنید. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: 'تاریخ/زمان باید در یا قبل از {$max} باشد.'
    date: 'تاریخ باید در یا قبل از {$max} باشد.'
    time: 'زمان باید در یا قبل از {$max} باشد.'
    number: 'مقدار باید کوچک‌تر یا مساوی {$max} باشد.'
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ شما نمی‌توانید بیش از {$max} گزینه انتخاب کنید. }}
        *   {{ شما نمی‌توانید بیش از {$max} گزینه انتخاب کنید. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ شما نمی‌توانید بیش از {$max} آیتم اضافه کنید. }}
        *   {{ شما نمی‌توانید بیش از {$max} آیتم اضافه کنید. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ شما باید حداقل {$min} کاراکتر وارد کنید. }}
      *   {{ شما باید حداقل {$min} کاراکتر وارد کنید. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ شما نمی‌توانید بیش از {$max} کاراکتر وارد کنید. }}
      *   {{ شما نمی‌توانید بیش از {$max} کاراکتر وارد کنید. }}

  # Type validation errors
  type_mismatch:
    number: لطفاً یک عدد وارد کنید.
    email: لطفاً یک ایمیل معتبر وارد کنید.
    url: لطفاً یک URL معتبر وارد کنید.

  # Custom field validation error
  invalid_value: مقدار نامعتبر است.
  unexpected_error: خطای غیرمنتظره‌ای رخ داد.

