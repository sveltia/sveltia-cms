    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: La fecha/hora debe ser igual o posterior a {$min}.
    date: La fecha debe ser igual o posterior a {$min}.
    time: La hora debe ser igual o posterior a {$min}.
    number: El valor debe ser mayor o igual que {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Debes seleccionar al menos {$min} opción. }}
        *   {{ Debes seleccionar al menos {$min} opciones. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Debes agregar al menos {$min} elemento. }}
        *   {{ Debes agregar al menos {$min} elementos. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: La fecha/hora debe ser igual o anterior a {$max}.
    date: La fecha debe ser igual o anterior a {$max}.
    time: La hora debe ser igual o anterior a {$max}.
    number: El valor debe ser menor o igual que {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ No puedes seleccionar más de {$max} opción. }}
        *   {{ No puedes seleccionar más de {$max} opciones. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ No puedes agregar más de {$max} elemento. }}
        *   {{ No puedes agregar más de {$max} elementos. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Debes ingresar al menos {$min} carácter. }}
      *   {{ Debes ingresar al menos {$min} caracteres. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ No puedes ingresar más de {$max} carácter. }}
      *   {{ No puedes ingresar más de {$max} caracteres. }}

