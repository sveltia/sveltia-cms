switching_language: Cambiando a {$locale}…
locale_load_failed: No se pudo cargar la traducción de {$locale}. Inténtalo de nuevo más tarde.

# Site and page navigation
# Toolbar button aria-label for visiting the live site
visit_live_site: Visitar el sitio en vivo
# Page switcher button group aria-label for switching between main sections
switch_page: Cambiar de página

# Search input placeholders
search_placeholder_contents: Buscar contenido…
search_placeholder_assets: Buscar recursos…
search_placeholder_all: Buscar contenido y recursos…

# Create button: aria-label for the create menu in the toolbar
create_entry_or_assets: Crear una entrada o recursos

# Publishing actions: button labels and progress indicators
publish_changes: Publicar cambios
publishing_changes: Publicando cambios…
# Error notification when publishing fails
publishing_changes_failed: No se pudieron publicar los cambios. Inténtalo de nuevo.

# Notifications: button aria-labels and section headings
show_notifications: Mostrar las notificaciones
notifications: Notificaciones

# Account menu: button aria-labels and section headings
show_account_menu: Mostrar el menú de la cuenta
# Account section heading in the account menu and mobile menu page
account: Cuenta

# Account menu items: links to external resources
live_site: Sitio en vivo
git_repository: Repositorio Git
settings: Ajustes

# Help menu: button aria-labels and section headings
show_help_menu: Mostrar el menú de ayuda
# Help section heading in dropdowns and mobile menu
help: Ayuda

# Help menu items: documentation and support resources
keyboard_shortcuts: Atajos de teclado
documentation: Documentación
release_notes: Notas de la versión
announcements: Anuncios
# Version badge aria-label in the release notes menu item
# {$version} is the current app version string
version_x: 'Versión {$version}'
# Additional help menu items
report_issue: Reportar un problema
share_feedback: Enviar comentarios
get_help: Obtener ayuda
donate: Donar
join_discord: Únete a nosotros en Discord
bluesky: Síguenos en Bluesky

# Update notification: infobar message and button
update_available: La última versión de Sveltia CMS está disponible.
update_now: Actualizar ahora

# Backend status notifications
# Shown when the Git backend (GitHub, GitLab, etc.) is experiencing issues
# {$service} is the backend service label shown in the toolbar notice, e.g., GitHub or GitLab
backend_status:
  minor_incident: '{$service} está experimentando un incidente menor. Tu flujo de trabajo podría verse afectado.'
  major_incident: '{$service} está experimentando un incidente grave. Quizá prefieras esperar hasta que la situación mejore.'

# ==============================================================================
# Content and Asset Libraries
# ==============================================================================
# Strings used in the main content and asset management interfaces, including
# lists, navigation, and collection/folder views.

# Page container aria-labels
content_library: Biblioteca de contenido
asset_library: Biblioteca de recursos

# Primary sidebar section headings and list aria-labels
collections: Colecciones
entries: Entradas
files: Archivos

# Asset location selector: option group labels
asset_location:
  # Assets stored in the site’s Git repository
  repository: Tu sitio
  external: Ubicaciones externas
  stock_photos: Fotos de stock

# Sidebar and list labels
# Collection assets panel aria-label
collection_assets: Recursos de la colección
# List aria-labels for different list types
entry_list: Lista de entradas
file_list: Lista de archivos
asset_list: Lista de recursos

# Collection and folder page titles
# Used as aria-labels on page containers
# {$collection} is the current collection label
x_collection: Colección “{$collection}”
# {$folder} is the current asset folder label
x_asset_folder: Carpeta de recursos “{$folder}”

# Navigation announcements (ARIA live regions)
# Announce page changes for screen reader users
viewing_collection_list: Ahora estás viendo la lista de colecciones.
viewing_asset_folder_list: Ahora estás viendo la lista de carpetas de recursos.
# Collection view announcements with entry counts
# {$collection} is the collection label and {$count} is the number of entries in it
viewing_x_collection: |
  .input {$count :integer}
  .match $count
    0   {{ Ahora estás viendo la colección “{$collection}”, que aún no tiene entradas. }}
    one {{ Ahora estás viendo la colección “{$collection}”, que tiene una entrada. }}
    *   {{ Ahora estás viendo la colección “{$collection}”, que tiene {$count} entradas. }}
# Asset folder view announcements with asset counts
# {$folder} is the folder label and {$count} is the number of assets in it
viewing_x_asset_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Ahora estás viendo la carpeta de recursos “{$folder}”, que aún no tiene recursos. }}
    one {{ Ahora estás viendo la carpeta de recursos “{$folder}”, que tiene un recurso. }}
    *   {{ Ahora estás viendo la carpeta de recursos “{$folder}”, que tiene {$count} recursos. }}

# Singleton file selection announcement
# {$file} is the singleton file name
singleton_selected_announcement: Presiona Enter para editar el archivo “{$file}”.

# Error messages: collection or file not found
collection_not_found: No se encontró la colección.
file_not_found: No se encontró el archivo.

# Selection count indicator
# Shown in the toolbar when items are selected (e.g., “2 of 10 selected”)
# {$selected} is the selected item count and {$total} is the total item count
x_of_x_selected: '{$selected} de {$total} seleccionados'

# View switcher: toggle between list and grid views
switch_view: Cambiar de vista
list_view: Vista de lista
grid_view: Vista de cuadrícula
switch_to_list_view: Cambiar a la vista de lista
switch_to_grid_view: Cambiar a la vista de cuadrícula

# ==============================================================================
# List Controls: Sort, Filter, and Group
# ==============================================================================
# Strings for sorting, filtering, and grouping entries and assets in lists.

# Sort menu: button labels and options
sort: Ordenar
sorting_options: Opciones de ordenación
