  _summary: Resumen
  # Manual order defined by the user via drag-and-drop
  _manual: Manual
# Sort order labels used with field names
# Example: “Name, A to Z” or “Updated on, new to old”
# {$label} is the localized sort field label
ascending: '{$label}, de la A a la Z'
ascending_date: '{$label}, de lo más antiguo a lo más reciente'
descending: '{$label}, de la Z a la A'
descending_date: '{$label}, de lo más reciente a lo más antiguo'

# Filter menu: button labels and options
filter: Filtrar
filtering_options: Opciones de filtrado

# Group menu: button labels and options
group: Agrupar
grouping_options: Opciones de agrupación

# Asset type filter and group labels
type: Tipo
all: Todos
# Asset type labels
image: Imagen
video: Video
audio: Audio
document: Documento
other: Otro

# Toolbar toggles: show/hide panels
show_assets: Mostrar los recursos
hide_assets: Ocultar los recursos
show_info: Mostrar la información
hide_info: Ocultar la información

# Folder display labels when no specific path is configured
all_assets: Todos los recursos
global_assets: Recursos globales

# ==============================================================================
# Entry and Collection Actions
# ==============================================================================
# Strings related to creating, editing, and managing entries and collections.

# Error message when entry cannot be found
entry_not_found: No se encontró la entrada.

# Entry creation restrictions: tooltip and advisory messages
creating_entries_disabled_by_admin: El administrador ha deshabilitado la creación de nuevas entradas en esta colección.
# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: No puedes agregar nuevas entradas a esta colección porque alcanzó su límite de {$quota} entradas.
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$remaining :integer}
  .match $remaining
    one {{ Esta colección se acerca a su límite de {$quota} entradas. Solo puedes crear {$remaining} entrada más. }}
    *   {{ Esta colección se acerca a su límite de {$quota} entradas. Solo puedes crear {$remaining} entradas más. }}

# Navigation: back links and list labels
back_to_collection: Volver a la colección
collection_list: Lista de colecciones
back_to_collection_list: Volver a la lista de colecciones
asset_folder_list: Lista de carpetas de recursos
back_to_asset_folder_list: Volver a la lista de carpetas de recursos

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: Resultados de búsqueda
# {$terms} is the current search query text
search_results_for_x: Resultados de búsqueda para “{$terms}”

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Ahora estás viendo los resultados de búsqueda para “{$terms}”. No encontramos ninguna entrada. }}
    one {{ Ahora estás viendo los resultados de búsqueda para “{$terms}”. Encontramos una entrada. }}
    *   {{ Ahora estás viendo los resultados de búsqueda para “{$terms}”. Encontramos {$count} entradas. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Ahora estás viendo los resultados de búsqueda para “{$terms}”. No encontramos ningún recurso. }}
    one {{ Ahora estás viendo los resultados de búsqueda para “{$terms}”. Encontramos un recurso. }}
    *   {{ Ahora estás viendo los resultados de búsqueda para “{$terms}”. Encontramos {$count} recursos. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ Sin entradas }}
    one {{ {$count} entrada }}
    *   {{ {$count} entradas }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ Sin recursos }}
    one {{ {$count} recurso }}
    *   {{ {$count} recursos }}

# Empty state messages
no_files_found: No se encontraron archivos.
no_entries_found: No se encontraron entradas.

# ==============================================================================
# Asset Management
# ==============================================================================
# Strings for uploading, editing, and managing assets (images, documents, etc.).

# Upload dialog: title and button label
upload_assets: Subir nuevos recursos

# Edit options menu: button and item labels
edit_options: Opciones de edición
show_edit_options: Mostrar las opciones de edición
# Edit menu items with specific asset names
edit_asset: Editar recurso
# {$name} is the selected asset name
edit_x: 'Editar {$name}'

# Asset text editor: switch for line wrapping
wrap_long_lines: Ajustar las líneas largas

# Rename asset: dialog and validation
rename_asset: Cambiar el nombre del recurso
# {$name} is the current asset name
rename_x: 'Cambiar el nombre de {$name}'
# Dialog body text indicating how many entries reference this asset
# {$count} is the number of entries that currently reference the asset
enter_new_name_for_asset: |
  .input {$count :integer}
  .match $count
    0   {{ Ingresa un nuevo nombre a continuación. }}
    one {{ Ingresa un nuevo nombre a continuación. También se actualizará una entrada que usa el recurso. }}
    *   {{ Ingresa un nuevo nombre a continuación. También se actualizarán {$count} entradas que usan el recurso. }}
# Validation errors for asset renaming
enter_new_name_for_asset_error:
  empty: El nombre del archivo no puede estar vacío.
  character: El nombre del archivo no puede contener caracteres especiales.
  duplicate: Este nombre de archivo ya se usa para otro recurso.
# Confirmation dialog shown when the file extension is changed while renaming an asset
change_file_extension: Cambiar la extensión del archivo
# {$oldExtension} and {$newExtension} are file extensions without a leading dot, e.g. png
confirm_file_extension_change:
  change: ¿Seguro que quieres cambiar la extensión de “.{$oldExtension}” a “.{$newExtension}”?
  add: ¿Seguro que quieres agregar la extensión “.{$newExtension}”?
  remove: ¿Seguro que quieres quitar la extensión “.{$oldExtension}”?
file_extension_change_warning: Es posible que el archivo no se muestre o no se procese correctamente si la extensión no coincide con el formato real del archivo.

# Replace asset: menu item and dialog title
replace_asset: Reemplazar recurso
# {$name} is the asset being replaced
replace_x: 'Reemplazar {$name}'

# File selection prompts: drop zones and file pickers
# Browse prompt shown when drag-and-drop is unavailable on desktop and pointer devices
click_to_browse: Haz clic para explorar…
# Browse prompt shown on touch devices
tap_to_browse: Toca para explorar…
# Drop zone text with browse button
# {$count} is the number of files expected by the current picker mode
drop_files_or_click_to_browse: |
  .input {$count :integer}
  .match $count
    one {{ Arrastra un archivo aquí o haz clic para explorar… }}
    *   {{ Arrastra archivos aquí o haz clic para explorar… }}
# Partial drop zone text (ends with inline button)
# {$count} is the number of files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Arrastra un archivo aquí o }}
    *   {{ Arrastra archivos aquí o }}
# Image-specific drop zone text
# {$count} is the number of image files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_image_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Arrastra un archivo de imagen aquí o }}
    *   {{ Arrastra archivos de imagen aquí o }}

# File picker and clipboard actions used by upload controls
browse: Explorar
# Generic clipboard paste action used by non-image file fields
paste: Pegar
# Clipboard paste action used by image fields
paste_image: Pegar imagen

# Clipboard paste errors
no_image_in_clipboard: No se encontró ninguna imagen en el portapapeles.
clipboard_access_denied: Se denegó el acceso al portapapeles.

# Drag-and-drop overlay text (shown while dragging)
# {$count} is the number of files expected by the current picker mode
drop_files_here: |
  .input {$count :integer}
  .match $count
    one {{ Arrastra un archivo aquí }}
    *   {{ Arrastra archivos aquí }}

# File type validation errors
unsupported_file_type: Tipo de archivo no admitido
# {$type} is the expected asset type label, such as image or document
dropped_file_type_mismatch: 'El archivo arrastrado no es de ninguno de los siguientes tipos: {$types}. Inténtalo de nuevo.'
dropped_image_type_mismatch: 'El archivo arrastrado no es compatible. Solo se acepta una imagen de los siguientes tipos: {$types}. Inténtalo de nuevo.'

# File chooser button label
# {$count} is the number of files the picker allows the user to choose
choose_files: |
  .input {$count :integer}
  .match $count
    one {{ Elegir archivo }}
    *   {{ Elegir archivos }}

# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    one {{ Eliminar recurso }}
    *   {{ Eliminar recursos }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Eliminar el recurso seleccionado }}
    *   {{ Eliminar los recursos seleccionados }}
confirm_deleting_this_asset: ¿Seguro que quieres eliminar este recurso?
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ ¿Seguro que quieres eliminar el recurso seleccionado? }}
    *   {{ ¿Seguro que quieres eliminar los {$count} recursos seleccionados? }}
confirm_deleting_all_assets: ¿Seguro que quieres eliminar todos los recursos?

# Delete entries: dialog titles and confirmation messages
# {$count} is the number of entries targeted by the action
delete_entries: |
  .input {$count :integer}
  .match $count
    one {{ Eliminar entrada }}
