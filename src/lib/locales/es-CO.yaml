# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Hay un error en la configuración del CMS. Soluciona el problema e inténtalo de nuevo. }}
      *   {{ Hay errores en la configuración del CMS. Soluciona los problemas e inténtalo de nuevo. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: 'colección {$collection}'
    file: 'archivo {$file}'
    component: 'componente {$component}'
    # Don’t localize `{$field}`
    field: 'campo `{$field}`'

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS solo funciona con URL HTTPS o localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ La URL del archivo de configuración debe usar el protocolo HTTPS o una dirección localhost. }}
        *   {{ Las URL de los archivos de configuración deben usar el protocolo HTTPS o direcciones localhost. }}
    fetch_failed: No se pudo obtener el archivo de configuración.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: La respuesta HTTP se devolvió con el estado {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'No se pudo obtener el archivo de configuración. Para evitar que se cargue el archivo `config.yml`, añade <a>`load_config_file: false`</a> al objeto de configuración que se pasa a `CMS.init()`.'
    parse_failed: No se pudo analizar el archivo de configuración.
    parse_failed_invalid_object: El archivo de configuración no es un objeto de JavaScript válido.
    parse_failed_unsupported_type: El archivo de configuración no es un tipo de archivo válido. Solo se admiten YAML, TOML y JSON.
    no_collection: No se han definido colecciones.
    missing_backend: No se ha definido el backend.
    missing_backend_name: No se ha definido el nombre del backend.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: El backend {$name} <a>no es compatible</a> con Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: El backend obsoleto {$name} <a>no es compatible</a> con Sveltia CMS.
    unsupported_custom_backend: Los backends personalizados <a>no son compatibles</a> con Sveltia CMS.
    unsupported_backend_suggestion: Usa uno de los <a>backends compatibles</a> en su lugar.
    missing_repository: No se ha definido el repositorio.
    invalid_repository: El repositorio configurado no es válido. Debe tener el formato “owner/repo”.
    oauth_implicit_flow: El método de autenticación configurado (flujo implícito) no es compatible con Sveltia CMS. Usa un <a>método de autenticación</a> diferente en su lugar.
    github_pkce_unsupported: La autorización PKCE aún no es compatible debido a las limitaciones de GitHub. Usa un <a>método de autenticación</a> diferente en su lugar.
    oauth_no_app_id: No se ha definido el ID de la aplicación OAuth.
    # Don’t localize `auth_methods`
    no_auth_methods: La opción `auth_methods` debe contener al menos un método.
    missing_media_folder: No se ha definido la carpeta de medios.
    invalid_media_folder: La carpeta de medios configurada no es válida. Debe ser una cadena de texto.
    invalid_public_folder: La carpeta pública configurada no es válida. Debe ser una cadena de texto.
    public_folder_relative_path: La carpeta pública configurada no es válida. Debe ser una ruta absoluta que empiece con “/”.
    public_folder_absolute_url: No se admite una URL absoluta para la opción de carpeta pública en Sveltia CMS.
    # Don’t localize `asset_collections`
    invalid_asset_collections: La opción `asset_collections` no es válida. Debe ser un arreglo.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: La colección de recursos {$count} debe tener la opción `name` definida como una cadena de texto no vacía.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: El nombre de la colección de recursos `{$name}` no es válido. No debe contener caracteres especiales.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Los nombres de las colecciones de recursos deben ser únicos, pero `{$name}` se usa más de una vez.
    # Don’t localize `media_folder`
    asset_collection_invalid_media_folder: La colección de recursos `{$name}` debe tener la opción `media_folder` definida como una cadena de texto.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_no_options: La colección debe tener definida una de las opciones `folder`, `files` o `divider`.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_multiple_options: La colección no puede tener las opciones `folder`, `files` y `divider` juntas.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: La extensión `{$extension}` no coincide con el formato `{$format}`.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: La plantilla de slug `{$slug}` no es válida porque no puede contener barras. Para organizar las entradas en subcarpetas, usa la opción `path` en lugar de `slug`.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: La opción `reorder` hace referencia a un grupo de vista llamado `{$name}`, pero no se ha definido ningún grupo con ese nombre en la opción `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: La opción `sortable_fields` hace referencia a un campo llamado `{$name}`, pero no se ha definido ningún campo con ese nombre en la colección.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: La opción `view_groups` hace referencia a un campo llamado `{$name}`, pero no se ha definido ningún campo con ese nombre en la colección.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: La opción `view_filters` hace referencia a un campo llamado `{$name}`, pero no se ha definido ningún campo con ese nombre en la colección.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: El grupo de vista {$count} debe tener la opción `name` definida como una cadena de texto no vacía.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: El nombre del grupo de vista `{$name}` no es válido. No debe contener caracteres especiales.
    duplicate_view_group_name: Los nombres de los grupos de vista deben ser únicos, pero `{$name}` se usa más de una vez.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: El filtro de vista {$count} debe tener la opción `name` definida como una cadena de texto no vacía.
    # {$name} is the invalid or duplicate view filter name
    invalid_view_filter_name: El nombre del filtro de vista `{$name}` no es válido. No debe contener caracteres especiales.
    duplicate_view_filter_name: Los nombres de los filtros de vista deben ser únicos, pero `{$name}` se usa más de una vez.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: La colección {$count} debe tener la opción `name` definida como una cadena de texto no vacía.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: El nombre de la colección `{$name}` no es válido. No debe contener caracteres especiales.
    duplicate_collection_name: Los nombres de las colecciones deben ser únicos, pero `{$name}` se usa más de una vez.
    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
    missing_collection_file_name: El archivo de colección {$count} debe tener la opción `name` definida como una cadena de texto no vacía.
    # {$name} is the invalid or duplicate collection file name
    invalid_collection_file_name: El nombre del archivo de colección `{$name}` no es válido. No debe contener caracteres especiales.
    duplicate_collection_file_name: Los nombres de los archivos de colección deben ser únicos, pero `{$name}` se usa más de una vez.
    # Don’t localize `fields`
    collection_no_fields: La colección debe tener la opción `fields` definida con al menos un campo.
    # Don’t localize `fields`
    collection_file_no_fields: El archivo de colección debe tener la opción `fields` definida con al menos un campo.
    # Don’t localize `i18n`, `locale` and `file`
    collection_file_i18n_required: El archivo de colección debe tener la opción `i18n` definida si se usa el marcador de posición `locale` en la ruta de `file`.
    # {$count} is the 1-based field index in the current fields array; Don’t localize `name`
    missing_field_name: El campo {$count} debe tener la opción `name` definida como una cadena de texto no vacía.
    # {$name} is the invalid or duplicate field name
    invalid_field_name: El nombre del campo `{$name}` no es válido. No debe contener caracteres especiales. Si quieres anidar campos, <a>usa campos de objeto en lugar de la notación con puntos</a>.
    duplicate_field_name: Los nombres de los campos deben ser únicos, pero `{$name}` se usa más de una vez.
    # {$count} is the 1-based variable type index in the current types array
    missing_variable_type: El tipo variable {$count} debe tener la opción `name` definida como una cadena de texto no vacía.
    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: El nombre del tipo variable `{$name}` no es válido. No debe contener caracteres especiales.
    duplicate_variable_type: Los nombres de los tipos variables deben ser únicos, pero `{$name}` se usa más de una vez.
    date_field_type: 'El tipo de campo Date, que está obsoleto, no es compatible con Sveltia CMS. Usa el tipo de campo DateTime con la opción `type: date` en su lugar.'
    # {$timeZone} is the invalid IANA timezone identifier from the configuration
    invalid_timezone: 'Zona horaria no válida: {$timeZone}. Debe ser un identificador de zona horaria IANA válido, como `America/New_York` o `Asia/Tokyo`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: La opción obsoleta `{$prop}` no es compatible con Sveltia CMS. Usa la opción `{$newProp}` en su lugar.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: La opción `allow_multiple` no es compatible con Sveltia CMS. Usa la opción `multiple` en su lugar, cuyo valor predeterminado es `false`.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: El campo List no puede tener las opciones `field`, `fields` y `types` juntas.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: El tipo variable del campo List no es válido. La opción `widget` está establecida en `{$widget}`, pero debe ser `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: El campo Object no puede tener las opciones `fields` y `types` juntas.
    # Don’t localize `fields`, and `types`
    object_field_missing_fields: El campo Object debe tener definida una de las opciones `fields` o `types`.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: La colección `{$collection}` a la que se hace referencia no es válida o no está definida.
    relation_field_invalid_collection_file: El archivo `{$file}` al que se hace referencia no es válido o no está definido.
    # Don’t localize `file`
    relation_field_missing_file_name: La opción `file` debe estar definida para una relación con un archivo de colección.
    relation_field_invalid_value_field: El campo de valor `{$field}` al que se hace referencia no es válido o no está definido.
    unexpected: Error inesperado

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: No se ha definido el ID de la aplicación OAuth. Los usuarios deben proporcionar un token de acceso para iniciar sesión.
    editorial_workflow_unsupported: El flujo editorial aún no es compatible con Sveltia CMS.
    nested_collections_unsupported: Las colecciones anidadas aún no son compatibles con Sveltia CMS.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: La opción `{$prop}` no es compatible con Sveltia CMS. Se ignorará.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Se han establecido tanto `picker_utc` como las nuevas opciones de zona horaria (`input_timezone` u `output_utc`). Las nuevas opciones tienen prioridad. Considera quitar `picker_utc` de tu configuración.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Consulta las notas de compatibilidad para ver los detalles: {$link}'

  # Console tip shown after config load
  schema_tip: Para una mejor experiencia de desarrollo, puedes validar tu archivo de configuración con el esquema JSON de Sveltia CMS. Consulta {$link} para ver los detalles.

