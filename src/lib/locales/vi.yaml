    collection_folder_i18n_required: Chuyên mục phải có tùy chọn `i18n` nếu trình giữ chỗ `locale` được dùng trong đường dẫn `folder`.
    # {$folder} is the invalid folder path; Don’t localize `locale`, `folder` and the example path. The
