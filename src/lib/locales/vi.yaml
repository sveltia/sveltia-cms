# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: Trường bắt buộc.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: Ngày và giờ phải từ {$min} trở đi.
    date: Ngày phải từ {$min} trở đi.
    time: Giờ phải từ {$min} trở đi.
    number: Giá trị phải lớn hơn hoặc bằng {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        *   {{ Bạn phải chọn ít nhất {$min} tùy chọn. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        *   {{ Bạn phải thêm ít nhất {$min} mục. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: Ngày và giờ không được sau {$max}.
    date: Ngày không được sau {$max}.
    time: Giờ không được sau {$max}.
    number: Giá trị phải nhỏ hơn hoặc bằng {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        *   {{ Bạn không thể chọn nhiều hơn {$max} tùy chọn. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        *   {{ Bạn không thể thêm nhiều hơn {$max} mục. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      *   {{ Bạn phải nhập ít nhất {$min} ký tự. }}
  too_long: |
    .input {$max :integer}
    .match $max
      *   {{ Bạn không thể nhập nhiều hơn {$max} ký tự. }}

  # Type validation errors
  type_mismatch:
    number: Vui lòng nhập một số.
    email: Vui lòng nhập một email hợp lệ.
    url: Vui lòng nhập một URL hợp lệ.

  # Value used for the same field in another entry of the collection
  value_not_unique: Giá trị này đã được dùng cho một bài viết khác.
  # Key of a keyed List field item used for another item of the same list
  key_not_unique: Khóa này đã được dùng cho một mục khác.
  # Key of a keyed List field item that is a whole number, which doesn’t keep its order in a map
  key_numeric: Khóa không được là số nguyên, vì các mục sẽ mất thứ tự.

  # Custom field validation error
  invalid_value: Giá trị không hợp lệ.
  unexpected_error: Đã xảy ra lỗi không mong muốn.

