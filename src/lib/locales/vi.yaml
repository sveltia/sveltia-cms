# ==============================================================================
# Sign-In Page
# ==============================================================================
# Strings specific to the authentication and sign-in page, including welcome
# messages, loading states, OAuth flows, and repository access options.

# Welcome and branding
# Screen reader announcement when the sign-in page loads
# {$name} is the app title shown on the sign-in screen, Sveltia CMS by default
welcome_message: 'Chào mừng đến với {$name}'
# Footer text with CMS branding
# {$name} is the CMS brand name shown in the footer, Sveltia CMS by default
powered_by: 'Được cung cấp bởi {$name}'

# Shown during initial configuration and data loading
loading_cms_config: Đang tải cấu hình CMS…
loading_site_data: Đang tải dữ liệu trang web…
loading_site_data_error: Đã xảy ra lỗi khi tải dữ liệu trang web.

# OAuth and token authentication
# Primary sign-in button label for OAuth providers (GitHub, GitLab, etc.)
# {$service} is the sign-in provider label, such as GitHub or GitLab
sign_in_with_x: 'Đăng nhập bằng {$service}'

# Access token dialog: alternative authentication method
sign_in_using_access_token: Đăng nhập bằng mã thông báo truy cập
sign_in_using_access_token_description: Nhập mã thông báo của bạn dưới đây. Nó phải có quyền truy cập đọc/ghi vào nội dung kho lưu trữ.
# Inline link text with embedded HTML anchor tag
# {$service} is the provider name whose user settings page contains the token generator, e.g., GitHub or GitLab
sign_in_using_access_token_link: Bạn có thể tạo mã thông báo trên trang cài đặt người dùng <a>{$service}</a>.
# Input field label for personal access token
personal_access_token: Mã thông báo truy cập cá nhân

# Authentication progress indicators
authorizing: Đang ủy quyền…
signing_in: Đang đăng nhập…

# Local and test repository options
# Button label and description for working with a local Git repository
work_with_local_repo: Làm việc với kho lưu trữ cục bộ
# {$repo} is the configured repository name shown when it is available
work_with_local_repo_description: Sau khi được nhắc, hãy chọn thư mục gốc của kho lưu trữ “{$repo}”.
work_with_local_repo_description_no_repo: Sau khi được nhắc, hãy chọn thư mục gốc của kho lưu trữ Git của bạn.
# Button label for demo/test repository
work_with_test_repo: Làm việc với Kho lưu trữ thử nghiệm

# Authentication errors
# Error messages shown during sign-in failures
sign_in_error:
  not_project_root: Thư mục đã chọn không phải là thư mục gốc của kho lưu trữ. Vui lòng thử lại.
  picker_dismissed: Không thể chọn thư mục gốc của kho lưu trữ. Vui lòng thử lại.
  authentication_aborted: Xác thực bị hủy bỏ. Vui lòng thử lại.
  invalid_token: Mã thông báo được cung cấp không hợp lệ. Vui lòng kiểm tra và thử lại.
  # OAuth and authenticator errors (shown with error codes) — keys are defined in the Sveltia CMS Authenticator library
  UNSUPPORTED_BACKEND: Chương trình phụ trợ Git của bạn không được trình xác thực hỗ trợ.  #TODO: phụ trợ sai sai
  UNSUPPORTED_DOMAIN: Tên miền của bạn không được phép sử dụng trình xác thực.
  MISCONFIGURED_CLIENT: ID ứng dụng khách hoặc bí mật của ứng dụng OAuth chưa được định cấu hình.
  AUTH_CODE_REQUEST_FAILED: Không nhận được mã ủy quyền. Vui lòng thử lại sau.
  CSRF_DETECTED: Đã phát hiện thấy cuộc tấn công CSRF tiềm ẩn. Luồng xác thực bị hủy bỏ.
  TOKEN_REQUEST_FAILED: Không thể yêu cầu mã thông báo truy cập. Vui lòng thử lại sau.
  TOKEN_REFRESH_FAILED: Không làm mới được mã thông báo truy cập. Vui lòng thử lại sau.
  MALFORMED_RESPONSE: Máy chủ phản hồi với dữ liệu không đúng định dạng. Vui lòng thử lại sau.

# Backend and repository validation errors
# Shown when the configured backend or repository is invalid or inaccessible
# {$name} is the backend display name like Forgejo and {$version} is the minimum supported version
backend_unsupported_version: 'Phần phụ trợ {$name} yêu cầu {$name} {$version} trở lên.'  #TODO: phụ trợ sai sai
# {$repo} is the repository identifier, typically in owner/repo format
repository_no_access: Bạn không có quyền truy cập vào kho lưu trữ “{$repo}”.  #TODO: Kho lưu trữ  sai sai
repository_not_found: Kho lưu trữ “{$repo}” không tồn tại.  #TODO: Kho lưu trữ  sai sai
repository_empty: Kho lưu trữ “{$repo}” không có nhánh.  #TODO: Kho lưu trữ  sai sai
# {$repo} is the repository identifier, and {$branch} is the configured branch name
branch_not_found: Kho lưu trữ “{$repo}” không có nhánh “{$branch}”.   #TODO: Kho lưu trữ  sai sai

# General errors
# Fallback error dialog title for unexpected errors
unexpected_error: Lỗi không mong muốn   #TODO: sai sai

# Entry file parsing errors
# Toast notification when entry files fail to parse on initial load
# {$count} is the number of entry files that failed to parse
entry_parse_errors: |
  .input {$count :integer}
  .match $count
    one {{ Đã xảy ra lỗi khi phân tích cú pháp tệp mục nhập. Kiểm tra bảng điều khiển trình duyệt để biết chi tiết. }}
    *   {{ Đã xảy ra lỗi khi phân tích cú pháp các tệp mục nhập. Kiểm tra bảng điều khiển trình duyệt để biết chi tiết. }}

