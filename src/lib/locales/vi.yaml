# Asset Library and asset picker: notice shown when a cloud storage service holds more files than
# are listed at once
external_assets_truncated: Dịch vụ có quá nhiều tệp nên không thể liệt kê hết. Một số tệp đã bị bỏ qua.

# Edit options menu: button and item labels
edit_options: Chỉnh sửa tùy chọn
show_edit_options: Hiển thị tùy chọn chỉnh sửa
# Copy menu aria-label
copy_options: Tùy chọn sao chép
# Edit menu items with specific asset names
edit_asset: Chỉnh sửa tệp
# {$name} is the selected asset name
edit_x: Chỉnh sửa {$name}

# Asset text editor: switch for line wrapping
wrap_long_lines: Ngắt dòng

# Move assets: dialog for moving assets to another folder in the repository
move: Di chuyển
move_asset: Di chuyển tệp
# Dialog title. {$name} is the asset name when a single asset is moved, and {$count} is the number of
# assets being moved
move_assets_title: |
  .input {$count :integer}
  .match $count
    1   {{ Di chuyển {$name} }}
    *   {{ Di chuyển {$count} tệp }}
# Dialog body text. {$count} is the number of entries that currently use the assets
select_asset_move_destination: |
  .input {$count :integer}
  .match $count
    0   {{ Chọn thư mục đích. }}
    1   {{ Chọn thư mục đích. Bài viết đang sử dụng các tệp này cũng sẽ được cập nhật. }}
    *   {{ Chọn thư mục đích. {$count} bài viết đang sử dụng các tệp này cũng sẽ được cập nhật. }}
# Accessible label of the folder tree in the Move dialog
asset_move_destination: Thư mục đích
# Shown when the assets being moved are all in the selected folder already
assets_already_in_folder: |
  .input {$count :integer}
  .match $count
    1   {{ Tệp đã nằm trong thư mục này. }}
    *   {{ Các tệp đã nằm trong thư mục này. }}
# Shown when files with the same names exist in the selected folder. {$names} is a comma-separated
# list of file names
asset_move_conflict: 'Các tệp sau đã tồn tại trong thư mục này: {$names}.'
moving_assets: Đang di chuyển tệp…
moving_assets_failed: Không thể di chuyển tệp.
# Warning shown when files have been moved off a cloud storage service, but the originals couldn’t
# be deleted from it
asset_move_cleanup_failed: Các tệp đã được di chuyển, nhưng không thể xóa bản gốc khỏi dịch vụ lưu trữ.
# Shown when files on a cloud storage service can’t be renamed or moved, because the entries using
# them can’t be updated, e.g. for an Open Authoring contributor. {$count} is the number of files
cannot_change_used_external_files: |
  .input {$count :integer}
  .match $count
    1   {{ Không thể đổi tên hoặc di chuyển tệp này vì không thể cập nhật các bài viết đang sử dụng nó. }}
    *   {{ Không thể đổi tên hoặc di chuyển các tệp này vì không thể cập nhật các bài viết đang sử dụng chúng. }}

# Rename asset: dialog and validation
rename_asset: Đổi tên tệp
# {$name} is the current asset name
rename_x: Đổi tên {$name}
# Dialog body text indicating how many entries reference this asset
# {$count} is the number of entries that currently reference the asset
enter_new_name_for_asset: |
  .input {$count :integer}
  .match $count
    0   {{ Nhập tên mới bên dưới. }}
    1   {{ Nhập tên mới bên dưới. Bài viết đang sử dụng tệp này cũng sẽ được cập nhật. }}
    *   {{ Nhập tên mới bên dưới. {$count} bài viết đang sử dụng tệp này cũng sẽ được cập nhật. }}
# Validation errors for asset renaming
enter_new_name_for_asset_error:
  empty: Tên tệp không được để trống.
  character: Tên tệp không được chứa ký tự đặc biệt.
  duplicate: Tên tệp này đang được một tệp khác sử dụng.
  # A name starting with a dot hides the file, which the CMS wouldn’t list any more
  leading_dot: Tên tệp không được bắt đầu bằng dấu chấm.
  # The name of a file next to the asset that isn’t an asset, like an entry file
  file_duplicate: Đã có một tệp khác cùng tên ở đây.
  # The name of a folder next to the file
  folder_duplicate: Đã có một thư mục cùng tên ở đây.
# Shown while renaming a file whose name will be changed on saving, e.g. by the `slugify_filename`
# media library option
file_will_be_saved_as: Tệp sẽ được lưu với tên “{$name}”.
# Confirmation dialog shown when the file extension is changed while renaming an asset
change_file_extension: Thay đổi phần mở rộng
# {$oldExtension} and {$newExtension} are file extensions without a leading dot, e.g. png
confirm_file_extension_change:
  change: Bạn có chắc chắn muốn đổi phần mở rộng từ “.{$oldExtension}” thành “.{$newExtension}” không?
  add: Bạn có chắc chắn muốn thêm phần mở rộng “.{$newExtension}” không?
  remove: Bạn có chắc chắn muốn xóa phần mở rộng “.{$oldExtension}” không?
file_extension_change_warning: Tệp có thể không được hiển thị hoặc xử lý chính xác nếu phần mở rộng không khớp với định dạng thực tế.

# Replace asset: menu item and dialog title
replace_asset: Thay thế tệp
# {$name} is the asset being replaced
replace_x: Thay thế {$name}
# File/Image field: labels of the Replace and Remove buttons
replace_file: Thay thế tệp
replace_image: Thay thế ảnh
remove_file: Gỡ bỏ tệp
remove_image: Gỡ bỏ ảnh

# File selection prompts: drop zones and file pickers
# Browse prompt shown when drag-and-drop is unavailable on desktop and pointer devices
click_to_browse: Nhấp để duyệt tệp…
# Browse prompt shown on touch devices
tap_to_browse: Chạm để duyệt tệp…
# Drop zone text with browse button
# {$count} is the number of files expected by the current picker mode
drop_files_or_click_to_browse: |
  .input {$count :integer}
  .match $count
    *   {{ Thả tệp vào đây hoặc nhấp để duyệt }}
# Partial drop zone text (ends with inline button)
# {$count} is the number of files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_files_or: |
  .input {$count :integer}
  .match $count
    *   {{ Thả tệp vào đây hoặc }}
# Image-specific drop zone text
# {$count} is the number of image files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_image_files_or: |
  .input {$count :integer}
  .match $count
    *   {{ Thả tệp ảnh vào đây hoặc }}

# File picker and clipboard actions used by upload controls
browse: Duyệt tệp
# Generic clipboard paste action used by non-image file fields
paste: Dán
# Clipboard paste action used by image fields
paste_image: Dán ảnh

# Clipboard paste errors
no_image_in_clipboard: Không tìm thấy ảnh nào trong bộ nhớ tạm.
clipboard_access_denied: Quyền truy cập bộ nhớ tạm bị từ chối.

# Drag-and-drop overlay text (shown while dragging)
# {$count} is the number of files expected by the current picker mode
drop_files_here: |
  .input {$count :integer}
  .match $count
    *   {{ Thả tệp vào đây }}

# File type validation errors
unsupported_file_type: Loại tệp không được hỗ trợ
# {$type} is the expected asset type label, such as image or document
dropped_file_type_mismatch: 'Tệp vừa thả không đúng định dạng. Các định dạng được chấp nhận: {$types}. Vui lòng thử lại.'
dropped_image_type_mismatch: 'Tệp vừa thả không có định dạng ảnh được hỗ trợ. Các định dạng được chấp nhận: {$types}. Vui lòng thử lại.'

# File chooser button label
# {$count} is the number of files the picker allows the user to choose
choose_files: |
  .input {$count :integer}
  .match $count
    *   {{ Chọn tệp }}

# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    1   {{ Xóa tệp }}
    *   {{ Xóa {$count} tệp }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    1   {{ Xóa tệp đã chọn }}
    *   {{ Xóa {$count} tệp đã chọn }}
confirm_deleting_this_asset: Bạn có chắc chắn muốn xóa tệp này không?
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    1   {{ Bạn có chắc chắn muốn xóa tệp đã chọn không? }}
    *   {{ Bạn có chắc chắn muốn xóa {$count} tệp đã chọn không? }}
confirm_deleting_all_assets: Bạn có chắc chắn muốn xóa tất cả tệp không?
# Note added to the confirmation when entries use the assets being deleted; the references are
# removed in the same commit. {$count} is the number of entries using them
deleting_referenced_assets_note: |
  .input {$count :integer}
  .match $count
    1   {{ Tham chiếu đến tệp trong một bài viết cũng sẽ bị gỡ bỏ. }}
    *   {{ Các tham chiếu đến tệp trong {$count} bài viết cũng sẽ bị gỡ bỏ. }}
# Shown in place of the confirmation when removing the references would leave a field in an entry
# invalid, e.g. a required Image field with nothing left, so the deletion is refused. The fields are
# listed below the message, each with the validation error it would have. {$count} is the number of
# assets being deleted
cannot_delete_referenced_assets: |
  .input {$count :integer}
  .match $count
    1   {{ Không thể xóa tệp này vì các trường sau trong những bài viết đang sử dụng nó sẽ không còn hợp lệ nếu thiếu tệp. Hãy cập nhật các bài viết đó trước. }}
    *   {{ Không thể xóa các tệp này vì các trường sau trong những bài viết đang sử dụng chúng sẽ không còn hợp lệ nếu thiếu các tệp. Hãy cập nhật các bài viết đó trước. }}
# Error shown in the asset deletion dialog when the entries using the assets couldn’t be looked up,
# so the deletion can’t go ahead. {$count} is the number of assets being deleted
checking_asset_references_failed: |
  .input {$count :integer}
  .match $count
    1   {{ Không thể kiểm tra những bài viết nào đang sử dụng tệp này. Hãy đóng hộp thoại này và thử lại. }}
    *   {{ Không thể kiểm tra những bài viết nào đang sử dụng các tệp này. Hãy đóng hộp thoại này và thử lại. }}

# Delete entries: dialog titles and confirmation messages
# {$count} is the number of entries targeted by the action
delete_entries: |
  .input {$count :integer}
  .match $count
    1   {{ Xóa bài viết }}
    *   {{ Xóa {$count} bài viết }}
# {$count} is the number of selected entries
delete_selected_entries: |
  .input {$count :integer}
  .match $count
    1   {{ Xóa bài viết đã chọn }}
    *   {{ Xóa {$count} bài viết đã chọn }}
confirm_deleting_this_entry: Bạn có chắc chắn muốn xóa bài viết này?
confirm_deleting_this_entry_with_assets: Bạn có chắc chắn muốn xóa bài viết này và các tệp liên quan không?
# Error notification shown when an entry could not be deleted
deleting_entry_failed: Không thể xóa bài viết. Vui lòng thử lại.
# {$count} is the number of selected entries
confirm_deleting_selected_entries: |
  .input {$count :integer}
  .match $count
    1   {{ Bạn có chắc chắn muốn xóa bài viết đã chọn không? }}
    *   {{ Bạn có chắc chắn muốn xóa {$count} bài viết đã chọn không? }}
# {$count} is the number of selected entries whose associated assets would also be removed
confirm_deleting_selected_entries_with_assets: |
  .input {$count :integer}
  .match $count
    1   {{ Bạn có chắc chắn muốn xóa bài viết đã chọn và các tệp liên quan không? }}
    *   {{ Bạn có chắc chắn muốn xóa {$count} bài viết đã chọn và các tệp liên quan không? }}
confirm_deleting_all_entries: Bạn có chắc chắn muốn xóa tất cả bài viết?
confirm_deleting_all_entries_with_assets: Bạn có chắc chắn muốn xóa tất cả bài viết và các tệp liên quan không?
# Note added to the confirmation when other entries reference the entries being deleted through
# Relation fields; the references are removed in the same commit. {$count} is the number of
# referencing entries
deleting_referenced_entries_note: |
  .input {$count :integer}
  .match $count
    1   {{ Tham chiếu đến bài viết này trong một bài viết khác cũng sẽ bị gỡ bỏ. }}
    *   {{ Các tham chiếu đến bài viết này trong {$count} bài viết khác cũng sẽ bị gỡ bỏ. }}
# Shown in place of the confirmation when removing the references would leave a Relation field in
# another entry invalid, e.g. a required field with nothing selected, so the deletion is refused.
# The fields are listed below the message, each with the validation error it would have. {$count}
# is the number of entries being deleted
cannot_delete_referenced_entries: |
  .input {$count :integer}
  .match $count
    1   {{ Không thể xóa bài viết này vì các trường sau trong những bài viết khác sẽ không còn hợp lệ nếu thiếu nó. Hãy cập nhật các bài viết đó trước. }}
    *   {{ Không thể xóa các bài viết này vì các trường sau trong những bài viết khác sẽ không còn hợp lệ nếu thiếu chúng. Hãy cập nhật các bài viết đó trước. }}

# ==============================================================================
# Entry Reordering
# ==============================================================================
# Strings for manually reordering entries via drag-and-drop.

# Reorder mode: toggle buttons
reorder_entries: Sắp xếp lại bài viết
done_reordering_entries: Hoàn tất sắp xếp lại bài viết
cancel_reordering_entries: Hủy sắp xếp lại bài viết

# Reorder error message
saving_reorder_failed: Không thể lưu thứ tự mới. Vui lòng thử lại.

# ==============================================================================
# Bulk Entry Editing
# ==============================================================================
# Strings for editing the fields of many entries at once in a table.

# Bulk edit mode: toggle buttons
bulk_edit_entries: Chỉnh sửa hàng loạt bài viết
save_bulk_edits: Lưu chỉnh sửa hàng loạt
cancel_bulk_edits: Hủy chỉnh sửa hàng loạt

# Bulk edit table: column header of the entry titles
bulk_edit_entry: Bài viết

# Bulk edit table: label of the table
bulk_edit_table: Trình chỉnh sửa hàng loạt

# Bulk edit table: label of a cell input; {$field} is the field label, {$entry} is the entry title
bulk_edit_cell: '{$field} của {$entry}'

# Bulk edit status: number of changed fields
bulk_edit_count: |
  .input {$count :integer}
  .match $count
    0   {{ Không có thay đổi }}
    *   {{ {$count} thay đổi }}

# Bulk edit error messages
bulk_edit_invalid: Một số giá trị không hợp lệ. Hãy sửa các trường được đánh dấu và thử lại.
saving_bulk_edits_failed: Không thể lưu các thay đổi. Vui lòng thử lại.

# Bulk edit: confirmation shown when leaving the mode with unsaved changes
discard_bulk_edits_confirm: Hủy bỏ các thay đổi đã thực hiện với các bài viết?

# ==============================================================================
# File Upload and Processing
# ==============================================================================
# Strings for file upload dialogs, progress indicators, and validation.

# Processing indicator shown during file preparation
# {$count} is the number of files currently being processed
processing_files: |
  .input {$count :integer}
  .match $count
    1   {{ Đang xử lý tệp. Quá trình này có thể mất vài phút. }}
    *   {{ Đang xử lý {$count} tệp. Quá trình này có thể mất vài phút. }}

# Uploading section aria-label
uploading_files: Đang tải tệp lên

# Replace file confirmation
# Dialog body when replacing an existing file
# {$name} is the existing file name that will be replaced
confirm_replacing_file: '“{$name}” sẽ được thay thế bằng tệp này:'

# Upload confirmation with destination folder
# {$folder} is the destination folder label and {$count} is the number of files being uploaded
confirm_uploading_files: |
  .input {$count :integer}
  .match $count
    1   {{ Tệp sau sẽ được tải lên thư mục “{$folder}”: }}
    *   {{ {$count} tệp sau sẽ được tải lên thư mục “{$folder}”: }}

# File size validation
# Warning section for files exceeding size limits
oversized_files: Tệp vượt quá dung lượng cho phép
# {$size} is the maximum allowed file size and {$count} is the number of oversized files
warning_oversized_files: |
  .input {$count :integer}
  .match $count
    1   {{ Không thể tải tệp lên vì vượt quá dung lượng tối đa {$size}. Vui lòng giảm dung lượng hoặc chọn tệp khác. }}
    *   {{ Không thể tải lên {$count} tệp vì vượt quá dung lượng tối đa {$size}. Vui lòng giảm dung lượng hoặc chọn tệp khác. }}

# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: Tệp không hợp lệ
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    1   {{ Không thể tải tệp lên vì tệp bị hỏng hoặc nội dung không khớp với định dạng tệp. Điều này thường xảy ra khi ảnh chỉ được đổi tên thay vì chuyển đổi, chẳng hạn như đổi ảnh HEIC thành tệp JPEG. Vui lòng chuyển đổi tệp và thử lại. }}
    *   {{ Không thể tải lên {$count} tệp vì tệp bị hỏng hoặc nội dung không khớp với định dạng tệp. Điều này thường xảy ra khi ảnh chỉ được đổi tên thay vì chuyển đổi, chẳng hạn như đổi ảnh HEIC thành tệp JPEG. Vui lòng chuyển đổi tệp và thử lại. }}
# {$count} is the number of files that are not of a type the field accepts, even once transformed
# {$types} is the list of accepted file types, such as “.pdf or .txt”
warning_unsupported_files: |
  .input {$count :integer}
  .match $count
    1   {{ Không thể tải tệp này lên vì nó không thuộc một trong các loại sau: {$types}. }}
    *   {{ Không thể tải các tệp này lên vì chúng không thuộc một trong các loại sau: {$types}. }}
# {$count} is the number of files that are not of an image type the field accepts
# {$types} is the list of accepted image formats, such as “PNG or WebP”
warning_unsupported_image_files: |
  .input {$count :integer}
  .match $count
    1   {{ Không thể tải tệp này lên vì chỉ chấp nhận ảnh thuộc các loại sau: {$types}. }}
    *   {{ Không thể tải các tệp này lên vì chỉ chấp nhận ảnh thuộc các loại sau: {$types}. }}

# File format validation when replacing an asset
# Warning section for replacement files that are in a different format
mismatched_files: Tệp không đúng định dạng
# {$name} is the name of the asset being replaced and {$count} is the number of mismatched files
warning_mismatched_files: |
  .input {$count :integer}
  .match $count
    1   {{ Tệp này không thể thay thế “{$name}” vì có định dạng khác. Vui lòng chuyển đổi tệp sang cùng định dạng rồi thử lại. }}
    *   {{ Các tệp này không thể thay thế “{$name}” vì có định dạng khác. Vui lòng chuyển đổi các tệp sang cùng định dạng rồi thử lại. }}

# File name conflict resolution
# {$count} is the number of conflicting file names in the target folder
file_name_conflict_confirmation: |
  .input {$count :integer}
  .match $count
    1   {{ Một tệp trùng tên đã tồn tại trong thư mục này. Bạn có muốn thay thế tệp hiện có không? }}
    *   {{ {$count} tệp trùng tên đã tồn tại trong thư mục này. Bạn có muốn thay thế các tệp hiện có không? }}
# {$name} is the conflicting file name when there is exactly one conflict; {$count} is the total conflict count
file_name_conflict_confirmation_with_name: |
  .input {$count :integer}
  .input {$name :string}
  .match $count
    1   {{ Tệp “{$name}” đã tồn tại trong thư mục này. Bạn có muốn thay thế tệp đó không? }}
    *   {{ {$count} tệp trùng tên đã tồn tại trong thư mục này. Bạn có muốn thay thế các tệp hiện có không? }}
file_name_conflict_resolution: Xử lý tệp trùng tên
# Option to keep both files (rename the new one)
keep_both: Giữ cả hai

# Upload progress and error messages
uploading_files_progress: Đang tải lên…
uploading_files_failed: Tải lên không thành công.
# Errors shown when a file on a cloud storage service could not be deleted or renamed
deleting_assets_failed: Xóa không thành công.
renaming_asset_failed: Đổi tên không thành công.
# Error shown when an edited text file in the Asset Library could not be saved
saving_asset_failed: Lưu không thành công.

# File metadata display
