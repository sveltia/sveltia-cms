    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: Tên loại biến `{$name}` không hợp lệ. Nó không được chứa các ký tự đặc biệt.
    duplicate_variable_type: Tên loại biến `{$name}` đã tồn tại. Hãy chọn tên khác.
    date_field_type: 'Loại trường Date đã lỗi thời và không được Sveltia CMS hỗ trợ. Hãy dùng trường DateTime với tùy chọn `type: date`.'
    # curly brackets in the placeholder are escaped with backslashes for MessageFormat 2
    hidden_field_locale_without_i18n: Tùy chọn `default` của trường Hidden sử dụng trình giữ chỗ `\{\{locale\}\}`, nhưng i18n chưa được bật cho chuyên mục, vì vậy nội dung không có ngôn ngữ để điền vào.
    # {$timeZone} is the invalid IANA timezone identifier from the configuration
    invalid_timezone: 'Múi giờ không hợp lệ: {$timeZone}. Phải là mã định danh múi giờ IANA hợp lệ như `America/New_York` hoặc `Asia/Tokyo`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: Tùy chọn `{$prop}` đã lỗi thời và không được Sveltia CMS hỗ trợ. Hãy dùng tùy chọn `{$newProp}` thay thế.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: Tùy chọn `allow_multiple` không được hỗ trợ trong Sveltia CMS. Thay vào đó, hãy sử dụng tùy chọn `multiple`, mặc định là `false`.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: Trường Danh sách không thể có các tùy chọn `field`, `fields` và `types` cùng nhau.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: Loại biến của trường Danh sách không hợp lệ. Tùy chọn `widget` được đặt thành `{$widget}` nhưng phải là `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: Trường Đối tượng không thể có các tùy chọn `fields` và `types` cùng nhau.
    # {$min} and {$max} are option names such as `min` and `max` or `minlength` and `maxlength`
    invalid_range_options: Tùy chọn `{$min}` không được lớn hơn tùy chọn `{$max}`.
    # {$step} is the configured value; Don’t localize `step`
    invalid_step: Tùy chọn `step` được đặt thành `{$step}`, nhưng giá trị phải lớn hơn 0, hoặc là `-1` để tắt bước nhảy.
    # Don’t localize `options`
    select_field_no_options: Trường Select phải có ít nhất một mục trong tùy chọn `options`.
    # {$value} is the option value from the configuration; Don’t localize `options`
    select_field_duplicate_option: Các giá trị `options` của trường Select phải là duy nhất, nhưng `{$value}` được dùng nhiều lần.
    # {$value} is the default value from the configuration; Don’t localize `default` and `options`
    select_field_invalid_default: Tùy chọn `default` của trường Select được đặt thành `{$value}`, nhưng giá trị này không nằm trong `options`.
    # Don’t localize `fields` and `types`
    list_field_no_subfields: Tùy chọn `fields` hoặc `types` của trường Danh sách phải có ít nhất một mục. Hãy bỏ tùy chọn này nếu muốn tạo danh sách các giá trị đơn giản.
    # Don’t localize `default`, `fields` and `types`
    list_field_invalid_default_object: Tùy chọn `default` của trường Danh sách chứa một đối tượng, nhưng mỗi mục phải là một giá trị đơn giản vì trường không có `fields` hoặc `types`.
    # {$value} is the default item from the configuration; Don’t localize `default`, `fields` and `types`
    list_field_invalid_default_item: Tùy chọn `default` của trường Danh sách chứa `{$value}`, nhưng mỗi mục phải là một đối tượng vì trường có `fields` hoặc `types`.
    # {$key} is a property name of the default item from the configuration; Don’t localize `default`
    list_field_invalid_default_key: Tùy chọn `default` của trường Danh sách chứa một mục có thuộc tính `{$key}`, nhưng không có trường con nào có tên đó.
    # {$typeKey} is the configured type key, `type` by default; Don’t localize `default` and `types`
    list_field_default_missing_type: Tùy chọn `default` của trường Danh sách chứa một mục không có thuộc tính `{$typeKey}`, thuộc tính dùng để xác định một trong các `types`.
    # {$typeKey} is the configured type key, `type` by default, and {$value} is its value in the default item; Don’t localize `default` and `types`
    list_field_invalid_default_type: Tùy chọn `default` của trường Danh sách chứa một mục có thuộc tính `{$typeKey}` là `{$value}`, nhưng giá trị này không nằm trong `types`.
    # Don’t localize `map_key_field`, `fields` and `types`
    list_field_map_key_no_subfields: Tùy chọn `map_key_field` của trường Danh sách yêu cầu tùy chọn `fields` hoặc `types`, vì mỗi khóa được lấy từ một trường con.
    # {$name} is the subfield name; Don’t localize `map_key_field`
    list_field_map_key_not_found: Tùy chọn `map_key_field` của trường Danh sách tham chiếu đến `{$name}`, nhưng không có trường con nào có tên đó.
    # {$name} is the subfield name, and {$type} is the variable type name; Don’t localize `map_key_field`
    list_field_map_key_missing_in_type: Tùy chọn `map_key_field` của trường Danh sách tham chiếu đến `{$name}`, nhưng loại `{$type}` không có trường con nào có tên đó.
    # {$name} is the subfield name, and {$widget} is its field type; Don’t localize `map_key_field`
    list_field_map_key_invalid_type: Tùy chọn `map_key_field` của trường Danh sách tham chiếu đến `{$name}`, nhưng đó phải là trường String, Relation hoặc Select, không phải trường `{$widget}`.
    # {$name} is the subfield name; Don’t localize `map_key_field` and `multiple`
    list_field_map_key_multiple: Tùy chọn `map_key_field` của trường Danh sách tham chiếu đến `{$name}`, nhưng trường con này không thể nhận nhiều giá trị vì mỗi mục cần một khóa duy nhất. Hãy xóa tùy chọn `multiple` của nó.
    # {$name} is the subfield name; Don’t localize `map_key_field`
    list_field_map_key_option_not_string: Tùy chọn `map_key_field` của trường Danh sách tham chiếu đến `{$name}`, nhưng các tùy chọn của trường con phải có giá trị chuỗi vì mỗi khóa được lưu dưới dạng chuỗi.
    # {$name} is the subfield name; Don’t localize `map_key_field` and `required`
    list_field_map_key_not_required: Tùy chọn `map_key_field` của trường Danh sách tham chiếu đến `{$name}`, nhưng trường con không thể là không bắt buộc vì mỗi mục cần một khóa. Hãy xóa tùy chọn `required` của nó.
    # {$name} is the subfield name; Don’t localize `map_key_field`, `i18n: false` and `i18n: duplicate`
    list_field_map_key_not_localized: 'Tùy chọn `map_key_field` của trường Danh sách tham chiếu đến `{$name}`, nhưng trường con không thể có `i18n: false` vì các mục cần có khóa ở mọi ngôn ngữ. Hãy dùng `i18n: duplicate` hoặc xóa tùy chọn này.'
    # Don’t localize `i18n`, `duplicate_if_empty`, `multiple` and `true`
    duplicate_if_empty_multiple: 'Tùy chọn `i18n: duplicate_if_empty` không được hỗ trợ cho trường có tùy chọn `multiple`, vì vậy trường sẽ hoạt động như khi có `i18n: true`.'
    # Don’t localize `default` and `multiple`
    invalid_default_multiple: Tùy chọn `default` phải là một mảng vì tùy chọn `multiple` là `true`.
    invalid_default_single: Tùy chọn `default` phải là một giá trị đơn, không phải mảng, vì tùy chọn `multiple` không phải là `true`.
    # {$key} is a property name of the default object from the configuration; Don’t localize `default`
    object_field_invalid_default_key: Tùy chọn `default` của trường Đối tượng có thuộc tính `{$key}`, nhưng không có trường con nào có tên đó.
    # {$typeKey} is the configured type key, `type` by default; Don’t localize `default` and `types`
    object_field_default_missing_type: Tùy chọn `default` của trường Đối tượng không có thuộc tính `{$typeKey}`, thuộc tính dùng để xác định một trong các `types`.
    # {$typeKey} is the configured type key, `type` by default, and {$value} is its value in the default object; Don’t localize `default` and `types`
    object_field_invalid_default_type: Thuộc tính `{$typeKey}` trong tùy chọn `default` của trường Đối tượng là `{$value}`, nhưng giá trị này không nằm trong `types`.
    # Don’t localize `default` and `output_code_only`
    code_field_invalid_default_object: Tùy chọn `default` của trường Code phải là một chuỗi vì tùy chọn `output_code_only` là `true`.
    # {$key} is a property name of the default object, {$code} and {$lang} are the configured property names; Don’t localize `default` and `keys`
    code_field_invalid_default_key: Tùy chọn `default` của trường Code có thuộc tính `{$key}`, nhưng tùy chọn `keys` chỉ cho phép `{$code}` và `{$lang}`.
    # {$valueType} is the configured value type; Don’t localize `value` and `value_type`
    compute_field_invalid_expression: Tùy chọn `value` của trường Compute phải là một biểu thức số học hợp lệ, chẳng hạn `\{\{fields.price\}\} * \{\{fields.quantity\}\}`, vì tùy chọn `value_type` là `{$valueType}`.
    # {$valueType} is the configured value type; Don’t localize `value` and `value_type`
    compute_field_uuid_in_expression: Tùy chọn `value` của trường Compute không thể dùng thẻ UUID như `\{\{uuid\}\}` vì tùy chọn `value_type` là `{$valueType}`, khiến giá trị trở thành một biểu thức số học.
    # {$value} is the default value and {$valueType} is the configured value type; Don’t localize `default` and `value_type`
    number_field_default_not_integer: Tùy chọn `default` của trường Number được đặt thành `{$value}`, nhưng giá trị phải là số nguyên vì tùy chọn `value_type` là `{$valueType}`.
    number_field_default_not_number: Tùy chọn `default` của trường Number được đặt thành `{$value}`, nhưng giá trị phải là một số vì tùy chọn `value_type` là `{$valueType}`.
    # Don’t localize `fields` and `types`
    object_field_no_subfields: Tùy chọn `fields` hoặc `types` của trường Đối tượng phải có ít nhất một mục.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: Chuyên mục `{$collection}` được tham chiếu không hợp lệ hoặc không được xác định.
    relation_field_invalid_collection_file: Tệp `{$file}` được tham chiếu không hợp lệ hoặc không được xác định.
    # Don’t localize `file`
    relation_field_missing_file_name: Phải xác định tùy chọn `file` cho quan hệ với chuyên mục dạng tệp.
    relation_field_invalid_value_field: Trường giá trị tham chiếu `{$field}` không hợp lệ hoặc không được xác định.
    # {$collection} is the referenced collection name; Don’t localize `file`, `value_field` and `slug`.
    # The curly brackets are escaped with backslashes for MessageFormat 2
    relation_field_array_file_slug: Quan hệ với chuyên mục `{$collection}` không thể lưu giá trị `\{\{slug\}\}`, vì slug của bài viết trong chuyên mục có tùy chọn `file` là vị trí của nó, vốn sẽ thay đổi khi các bài viết được sắp xếp lại hoặc bị xóa. Hãy đặt tùy chọn `value_field` thành một trường có giá trị duy nhất.
    # {$collection} is the referenced collection name; Don’t localize `file`
    relation_field_array_file_workflow: Chuyên mục có tùy chọn `file` không thể có quan hệ với chuyên mục `{$collection}` đang dùng Quy trình biên tập hoặc Quy trình xem trước, vì không thể cập nhật trong tệp các tham chiếu đến bài viết bị đổi tên hoặc bị xóa ở đó.
    relation_field_invalid_display_field: Trường hiển thị tham chiếu `{$field}` không hợp lệ hoặc không được xác định.
    relation_field_invalid_search_field: Trường tìm kiếm tham chiếu `{$field}` không hợp lệ hoặc không được xác định.
    relation_field_invalid_filter_field: Trường lọc tham chiếu `{$field}` không hợp lệ hoặc không được xác định.
    relation_field_invalid_sort_field: Trường sắp xếp tham chiếu `{$field}` không hợp lệ hoặc không được xác định.
    # Don’t localize `sort_by` and `file`
    relation_field_sort_by_file_ignored: Tùy chọn `sort_by` không áp dụng cho quan hệ với một tệp, vì các tùy chọn của nó tuân theo thứ tự của các mục trong danh sách. Tùy chọn này sẽ bị bỏ qua.
    unexpected: Đã xảy ra lỗi

    # Schema validation errors, reported when the configuration doesn’t match the published JSON
    # schema. In all of these, {$option} is a configuration option path such as `backend.name` or
    # `view_filters[0].pattern`, relative to the collection, file or field named before it.
    # {$type} is a value type name from `schema_value_type` below
    schema_invalid_type: Tùy chọn `{$option}` phải là {$type}.
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'Tùy chọn `{$option}` phải là một trong các giá trị sau: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: Tùy chọn `{$option}` phải là `{$value}`.
    schema_invalid_empty_value: Tùy chọn `{$option}` phải là một chuỗi trống.
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: Tùy chọn `{$option}` phải là một mảng gồm {$count} phần tử.
    schema_invalid_value: Tùy chọn `{$option}` có giá trị không hợp lệ.
    schema_missing_option: Tùy chọn `{$option}` là bắt buộc.
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Cần có một trong các tùy chọn sau: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: một chuỗi
      number: một số
      integer: một số nguyên
      boolean: một giá trị boolean
      array: một mảng
      object: một đối tượng
      'null': trống

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: ID ứng dụng OAuth không được xác định. Người dùng được yêu cầu cung cấp mã truy cập để đăng nhập.
    # Don’t localize `prefix`
    site_library_prefix_template: Tùy chọn `prefix` của một thư viện phương tiện chứa các thẻ mẫu, vốn chỉ được hỗ trợ ở cấp trường, vì ở cấp cao nhất không có bài viết nào để điền giá trị vào.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: Tùy chọn `{$prop}` không được hỗ trợ trong Sveltia CMS. Nó sẽ bị bỏ qua.
    # Don’t localize `stages`, `publish_mode`, `editorial_workflow` and {$type}, which is `preview` or `simple`
    publish_mode_stages_ignored: Tùy chọn `stages` của `publish_mode` chỉ áp dụng cho chế độ xuất bản `editorial_workflow`, vì vậy nó bị bỏ qua với `{$type}`.
    # Don’t localize `pattern`, `m` and `s`
    inline_component_multiline_pattern: '`pattern` của thành phần nội tuyến này có cờ `m` hoặc `s` hoặc khớp với ký tự xuống dòng, nhưng thành phần nội tuyến chỉ được so khớp trong phạm vi một đoạn văn.'
    # {$name} is a button or component name and {$option} is `buttons` or `editor_components`; Don’t localize them and `multiline: false`
    single_line_block_item: 'Mục `{$name}` của tùy chọn `{$option}` bị bỏ qua, vì trường có `multiline: false` chỉ có thể chứa nội dung nội tuyến.'
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Cả hai tùy chọn `picker_utc` và múi giờ mới hơn (`input_timezone` hoặc `output_utc`) đều được đặt. Các tùy chọn mới được ưu tiên. Hãy cân nhắc xóa `picker_utc` khỏi cấu hình của bạn.
    # Don’t localize `localize_format` and `format`
    localize_format_without_format: Tùy chọn `localize_format` không có tác dụng vì trường không có tùy chọn `format` và giá trị của nó được lưu ở định dạng ISO 8601.
    # {$name} is a template tag like `fields.lines.*.price`; Don’t localize `value`, `*` and `sum()`
    compute_field_wildcard_without_item: Tùy chọn `value` của trường Compute tham chiếu đến `{$name}`, nhưng trường không nằm trong một mục của danh sách mà `*` đại diện, vì vậy giá trị sẽ trống. Chỉ hàm tổng hợp như `sum()` mới có thể dùng tất cả các mục của danh sách.
    # {$name} is a template tag like `fields.lines.*.amount`; Don’t localize `value`
    compute_field_self_reference: Tùy chọn `value` của trường Compute tham chiếu đến chính trường đó dưới dạng `{$name}`, vì vậy giá trị của nó thay đổi mỗi lần được tính và không bao giờ ổn định.
    # {$name} is a template tag like `fields.total`; Don’t localize `value`
    compute_field_reference_cycle: Tùy chọn `value` của trường Compute tham chiếu đến `{$name}`, một trường Compute khác tham chiếu ngược lại trường này, trực tiếp hoặc thông qua các trường khác, vì vậy giá trị của chúng không bao giờ ổn định.
    # Don’t localize `localize_format`, `true` and `de`
    localize_format_without_i18n: Tùy chọn `localize_format` là `true`, nhưng i18n chưa được bật cho chuyên mục, vì vậy giá trị được viết bằng tiếng Anh. Thay vào đó, hãy đặt tùy chọn thành một mã ngôn ngữ như `de`.
    # {$locale} is the locale code from the configuration; Don’t localize `localize_format`
    localize_format_unsupported_locale: Tùy chọn `localize_format` được đặt thành `{$locale}`, đây không phải là ngôn ngữ được hỗ trợ, vì vậy giá trị được viết bằng tiếng Anh.
    # Don’t localize `preview_path`
    preview_path_no_date_field: Tùy chọn `preview_path` sử dụng các thẻ ngày và giờ, nhưng chuyên mục không có trường DateTime nào để đọc chúng, vì vậy liên kết xem trước sẽ không được hiển thị.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: Tùy chọn `preview_path_date_field` tham chiếu đến trường có tên `{$name}`, nhưng không có trường DateTime nào với tên đó được xác định, vì vậy liên kết xem trước sẽ không được hiển thị.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: Tùy chọn `preview_path` tham chiếu đến `{$name}`, nhưng không có trường nào như vậy được xác định trong chuyên mục, vì vậy liên kết xem trước sẽ không được hiển thị.
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: Chuyên mục không có trường `{$name}` để đặt tên cho bài viết mới, vì vậy mỗi bài viết mới sẽ nhận một slug ngẫu nhiên. Hãy thêm trường `{$name}` hoặc đặt tùy chọn `identifier_field` hay `slug`.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: Tùy chọn `i18n` của `slug` không có tác dụng vì chuyên mục không dùng cấu trúc i18n `multiple_files`, `multiple_folders` hoặc `multiple_root_folders`, trong đó mỗi ngôn ngữ có tệp riêng.
    # Don’t localize `slug`, `template` and `auto_increment`
    slug_template_ignored: Tùy chọn `template` của `slug` bị bỏ qua vì tùy chọn `auto_increment` sẽ đánh số các slug thay thế.
    # {$file} is the file path; Don’t localize `file`, `locale`, `i18n`, `false`,
    # `omit_default_locale_from_file_path` and the example paths. The curly brackets in the examples
    # are escaped with backslashes for MessageFormat 2
    locale_not_omitted_from_file_path: Không thể loại bỏ trình giữ chỗ `locale` khỏi đường dẫn `file` `{$file}`, vì vậy ngôn ngữ mặc định vẫn được giữ trong đó bất chấp tùy chọn i18n `omit_default_locale_from_file_path`. Để bỏ ngôn ngữ ra, hãy dùng trình giữ chỗ làm toàn bộ tên một thư mục, như `\{\{locale\}\}/about.md`, hoặc đặt giữa tên tệp và phần mở rộng, như `about.\{\{locale\}\}.md`. Để giữ lại, hãy đặt tùy chọn này thành `false` trong tùy chọn `i18n` của tệp.
    # Don’t localize `i18n`
    i18n_not_configured: Tùy chọn `i18n` đã được bật, nhưng i18n chưa được cấu hình ở cấp cao nhất của cấu hình hoặc trong chuyên mục, vì vậy tùy chọn này không có tác dụng.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: Tùy chọn `public_folder` là một chuỗi trống, vì vậy đường dẫn `media_folder` sẽ được dùng cho các đường dẫn tệp lưu trong bài viết. Hãy xóa tùy chọn này hoặc đặt nó thành đường dẫn bạn muốn dùng, chẳng hạn `/images`.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: Tùy chọn `{$option}` không được xác định trong lược đồ cấu hình của Sveltia CMS. Nó sẽ bị bỏ qua. Hãy kiểm tra xem có lỗi chính tả hoặc lỗi cú pháp không.
    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: Tùy chọn `default_localized` không có tác dụng vì i18n chưa được bật cho chuyên mục. Hãy dùng tùy chọn `default` thay thế.
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: Tùy chọn `default_localized` có giá trị cho `{$locale}`, đây không phải là một trong các ngôn ngữ của chuyên mục, vì vậy giá trị này không bao giờ được sử dụng.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Xem ghi chú tương thích để biết chi tiết: {$link}'

  # Console tip shown after config load
  schema_tip: Để có trải nghiệm tốt hơn cho nhà phát triển, bạn có thể xác thực tệp cấu hình của mình dựa trên lược đồ JSON của Sveltia CMS. Xem {$link} để biết chi tiết.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Cục bộ
  # Browser compatibility warnings
  unsupported_browser: Trình duyệt của bạn không hỗ trợ Quy trình cục bộ. Vui lòng sử dụng Chrome hoặc Edge.
  disabled: Quy trình cục bộ đang bị tắt trong trình duyệt của bạn. <a>Xem cách bật tính năng này</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Bạn hiện đang xem bảng Quy trình biên tập. Bản nháp: {$draft}. Đang duyệt: {$review}. Sẵn sàng: {$ready}. Đang chờ xóa: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Bạn hiện đang xem bảng Quy trình biên tập. Bản nháp: {$draft}. Đang duyệt: {$review}. Đang chờ xóa: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'Bạn hiện đang xem bảng Quy trình biên tập. Bản nháp: {$draft}. Sẵn sàng: {$ready}. Đang chờ xóa: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'Bạn hiện đang xem trang Bản nháp. Bản nháp: {$draft}. Đang chờ xóa: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Bản nháp
  drafts: Bản nháp
  in_review: Đang duyệt
  ready: Sẵn sàng
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Đang chờ xóa
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: Đang triển khai

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Hủy xóa
  confirm_cancelling_deletion: Bạn có chắc chắn muốn hủy việc xóa này không? Bài viết sẽ vẫn được xuất bản.
  confirm_completing_deletion: Bạn có chắc chắn muốn xóa bài viết này? Bài viết sẽ bị xóa ngay lập tức.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      1   {{ Bài viết đã được đánh dấu để xóa. }}
      *   {{ {$count} bài viết đã được đánh dấu để xóa. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      1   {{ Đã hủy thay đổi của bài viết. }}
      *   {{ Đã hủy thay đổi của {$count} bài viết. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Đang hủy xóa…
  deletion_cancelled: Việc xóa đã bị hủy.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Không thể hủy thao tác xóa. Vui lòng thử lại.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Bài viết chưa xuất bản
  published_entries: Bài viết đã xuất bản
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Trạng thái: {$status}'
  change_entry_status: Đổi trạng thái bài viết
  # Editor toolbar: progress label while the status is being changed
  changing_status: Đang thay đổi trạng thái…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Đang cập nhật trạng thái…
  status_updated: Đã cập nhật trạng thái.
  # Error notification when the status could not be changed
  status_change_failed: Không thể thay đổi trạng thái. Vui lòng thử lại.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: Làm mới
  refreshing: Đang làm mới…
  refreshed: Bảng đã là mới nhất.
  # Error notification when the board could not be refreshed
  refresh_failed: Không thể làm mới bảng. Vui lòng thử lại.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: Bài viết còn lỗi. Vui lòng sửa lỗi trước khi thay đổi trạng thái.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: Bài viết có lỗi. Vui lòng sửa lỗi trước khi xuất bản.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Gửi duyệt
  confirm_sending_for_review: Các thay đổi của bạn đã được lưu thành bản nháp. Bạn có muốn gửi bài viết đi duyệt để người khác xem xét và xuất bản không?
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: Đánh dấu là sẵn sàng
  confirm_marking_as_ready: Các thay đổi của bạn đã được lưu thành bản nháp. Đánh dấu bài viết là sẵn sàng để có thể xuất bản?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Xuất bản bài viết
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Hủy thay đổi
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Bạn có chắc chắn muốn xóa bài viết này? Bài viết chỉ bị xóa sau khi thay đổi được xuất bản. Trước lúc đó, bài viết vẫn xuất hiện trong danh sách với trạng thái Đang chờ xóa.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Bài viết này chưa được xuất bản nên sẽ bị xóa vĩnh viễn.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Bài viết này có các thay đổi chưa xuất bản. Nếu hủy, nội dung sẽ trở về phiên bản đã xuất bản. Bài viết sẽ không bị xóa.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      1   {{ Bài viết chưa được xuất bản nên các thay đổi chưa xuất bản sẽ bị hủy. Phiên bản đã xuất bản vẫn được giữ nguyên. }}
      *   {{ {$count} bài viết chưa được xuất bản nên các thay đổi chưa xuất bản sẽ bị hủy. Các phiên bản đã xuất bản vẫn được giữ nguyên. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      1   {{ Một bài viết chưa được xuất bản nên các thay đổi chưa xuất bản sẽ bị hủy. Phiên bản đã xuất bản vẫn được giữ nguyên. }}
      *   {{ {$count} bài viết chưa được xuất bản nên các thay đổi chưa xuất bản sẽ bị hủy. Các phiên bản đã xuất bản vẫn được giữ nguyên. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: Bạn có chắc chắn muốn xuất bản bài viết này không? Các thay đổi của bạn sẽ được đưa lên trang web sau khi trang web được dựng lại.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Đang xuất bản bài viết…
  entry_published: Đã xuất bản bài viết.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Đang xóa bài viết…
  discarding_changes: Đang hủy các thay đổi…
  entry_deleted: Đã xóa bài viết.
  # Error notification when publishing fails
  publishing_entry_failed: Không thể xuất bản bài viết này. Vui lòng thử lại.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: Không thể xuất bản bài viết này tại đây vì nó đi kèm các thay đổi khác mà CMS không thể hiển thị cho bạn. Hãy đề nghị nhà phát triển xem xét.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: Bài viết đã bị thay đổi kể từ khi bạn mở nó. Hãy tải lại trang để xem phiên bản mới nhất trước khi xuất bản.
  review_on_x: Xem xét trên {$service}
  from_fork: Từ một bản fork
  fork_entry_editable: Bài viết này đến từ pull request của một người đóng góp, được mở từ “{$fork}”. Các thay đổi của bạn sẽ được lưu vào nhánh của họ. Hãy xem xét và merge pull request trên dịch vụ Git.
  fork_entry_locked: Bài viết này đến từ pull request của một người đóng góp, được mở từ “{$fork}”. Người đóng góp không cho phép người duy trì chỉnh sửa nên tại đây chỉ có thể xem.
  fork_not_editable: Người đóng góp không cho phép người duy trì chỉnh sửa pull request này.
  fork_entry_gone: Pull request của người đóng góp không còn mở nên không thể lưu các thay đổi vào đó.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: Đã có một yêu cầu khác ({$number}) được mở cho bài viết này bên ngoài CMS. Hãy đề nghị nhà phát triển đóng yêu cầu đó trước.
  # Workflow page: empty column message
  no_entries: Không có bài viết nào.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Kéo để thay đổi trạng thái
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Đang xóa
  # Workflow page: note on a card listing the new entries that were created from a Relation field
  # of the entry and are published along with it, e.g. “Also adds Section: Getting Started”
  companion_entries: Thêm cả {$entries}
  # Workflow page: note on a card listing the existing entries that were edited from a Relation
  # field of the entry and are published along with it, e.g. “Also changes Author: Ada Lovelace”
  edited_companion_entries: Thay đổi cả {$entries}
  # Workflow page: one of the entries listed by `companion_entries` or `edited_companion_entries`,
  # named by its collection’s singular label and its title
  companion_entry: '{$collection}: {$title}'

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: Thông điệp commit
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: Mô tả các thay đổi của bạn. Thông điệp sẽ được ghi vào lịch sử cùng với các thay đổi.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: Thêm ghi chú vào thông điệp được ghi vào lịch sử cùng với các thay đổi của bạn, chẳng hạn như số issue. Có thể để trống.
  # Accessible name of the text box when the user writes the whole message
  message: Thông điệp commit
  # Accessible name of the text box when the text is added before or after the message
  addition: Ghi chú
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'Thông điệp: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Tạo bản fork của kho mã nguồn
  fork: Fork
  confirm_forking_repository: Để đề xuất thay đổi cho “{$repo}”, cần tạo một bản fork của kho mã nguồn trên tài khoản của bạn. Các thay đổi của bạn sẽ được lưu vào bản fork đó và được người quản trị xem xét trước khi xuất bản.
  # Error shown when the user declined the dialog above
  fork_declined: Bạn cần có một bản fork của kho mã nguồn trên tài khoản của mình để đề xuất thay đổi.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Không thể tạo bản fork của kho mã nguồn “{$repo}” trên tài khoản của bạn.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: Bản fork “{$fork}” của bạn không có nhánh “{$branch}”. Hãy cập nhật bản fork từ kho mã nguồn “{$repo}”, sau đó đăng nhập lại.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Không thể kiểm tra quyền truy cập của bạn vào kho mã nguồn “{$repo}”. Vui lòng thử lại sau giây lát.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Kho mã nguồn “{$repo}” không cho phép fork. Hãy đề nghị người quản trị bật tính năng fork cho kho này.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Bạn có một lời mời đang chờ vào kho mã nguồn “{$repo}”. Hãy chấp nhận lời mời trên GitHub rồi đăng nhập lại.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Phiên đăng nhập của bạn không bao gồm quyền truy cập các kho mã nguồn riêng tư, vì vậy không thể đọc kho mã nguồn “{$repo}”. Hãy đề nghị người quản trị kiểm tra cài đặt xác thực của CMS.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Chỉ người quản trị mới có thể xuất bản thay đổi lên trang web này. Thay vào đó, hãy đánh dấu bài viết là “Đang duyệt” và sẽ có người xem xét.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: Người duy trì đã xuất bản bài viết này nên không còn gì để duyệt.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Không thể thực hiện thay đổi này trực tiếp. Chỉ có thể đề xuất các chỉnh sửa bài viết để duyệt.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Các thay đổi của bạn được lưu vào bản fork của kho mã nguồn này tại “{$repo}” và được xem xét trước khi xuất bản.
  view_fork: Xem bản fork

# ==============================================================================
# Settings Dialog
# ==============================================================================
# Strings for the settings/preferences dialog and its panels.

# Settings page aria-label
categories: Danh mục

# Preferences panels
prefs:
  account:
    title: Tài khoản
  # API key management feedback messages
  changes:
    api_key_saved: Đã lưu khóa API.
    api_key_removed: Đã xóa khóa API.
    api_key_invalid: Khóa API được cung cấp không hợp lệ. Vui lòng kiểm tra lại và thử lại.

  # Preferences operation errors
  error:
    permission_denied: Quyền truy cập bộ nhớ cookie đã bị từ chối. Vui lòng kiểm tra quyền của trình duyệt của bạn và thử lại.

  # Appearance panel
  appearance:
    title: Giao diện
    theme: Chủ đề
    select_theme: Chọn chủ đề

  # Theme options
  theme:
    dark: Tối
    light: Sáng

  # Language panel
  language:
    title: Ngôn ngữ
    ui_language:
      title: Ngôn ngữ giao diện
      select_language: Chọn ngôn ngữ

  # Contents panel
  contents:
    title: Nội dung
    editor:
      title: Trình soạn thảo
      use_draft_backup:
        switch_label: Tự động sao lưu bản nháp
      close_on_save:
        switch_label: Đóng trình soạn thảo sau khi lưu bản nháp
      close_with_escape:
        switch_label: Nhấn phím Esc để đóng trình soạn thảo

  # Internationalization panel
  i18n:
    title: Ngôn ngữ và khu vực
    translators:
      default:
        title: Công cụ dịch mặc định
        select_service: Chọn công cụ
      api_keys:
        title: Khóa API công cụ dịch
        description: Quản lý khóa API cho các <a>công cụ dịch</a>. Khóa API cho các dịch vụ AI tổng quát có thể được quản lý trong cài đặt AI.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: Khóa {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Đăng ký <a {$homeHref}>{$service}</a> và nhập <a {$apiKeyHref}>khóa API</a> tại đây để dịch nhanh các trường văn bản.

  # Media panel
  media:
    title: Tệp phương tiện
    stock_photos:
      api_keys:
        title: Khóa API dịch vụ ảnh stock
        description: Quản lý khóa API cho các <a>dịch vụ ảnh stock</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: Khóa API {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Đăng ký sử dụng <a {$homeHref}>API của {$service}</a>, sau đó nhập <a {$apiKeyHref}>khóa API</a> tại đây để tìm và chèn ảnh miễn phí.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Ảnh do {$service} cung cấp
      no_services: Chưa cấu hình <a>dịch vụ ảnh stock</a>.
    cloud_storage:
      api_keys:
        title: Khóa API dịch vụ lưu trữ đám mây
        description: Quản lý khóa API cho các <a>dịch vụ lưu trữ đám mây</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: Khóa API {$service}
      no_services: Chưa cấu hình <a>dịch vụ lưu trữ đám mây</a>.

  # AI panel
  ai:
    title: AI
    api_keys:
      title: Khóa API dịch vụ AI
      description: Quản lý khóa API cho các dịch vụ AI.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: Khóa API {$service}

  # Accessibility panel
  accessibility:
    title: Trợ năng
    underline_links:
      title: Gạch chân liên kết
      description: Hiển thị gạch chân dưới các liên kết trong bản xem trước nội dung và trên giao diện.
      switch_label: Luôn gạch chân các liên kết

  # Data Management panel
  data:
    title: Quản lý dữ liệu
    clear_data:
      title: Xóa dữ liệu
      # Clear File Cache button
      file_cache:
        description: Xóa nội dung tệp và hình thu nhỏ được lưu trong bộ nhớ đệm cục bộ để giải phóng dung lượng lưu trữ hoặc khắc phục sự cố do dữ liệu cũ gây ra.
        button_label: Xóa bộ nhớ đệm tệp
        confirmation: Nội dung tệp và hình thu nhỏ được lưu trong bộ nhớ đệm cục bộ sẽ bị xóa. Các bản nháp chưa lưu và cài đặt của bạn sẽ được giữ lại. Dữ liệu đã xóa sẽ được tải xuống hoặc tạo lại khi cần. CMS sẽ được tải lại sau khi hoàn tất.
      # Erase All Data button
      all_data:
        description: Xóa mọi thứ mà CMS lưu trong trình duyệt này, bao gồm các tệp trong bộ nhớ đệm, bản nháp chưa lưu và cài đặt. Những gì đã lưu vào kho mã nguồn của bạn sẽ không bị ảnh hưởng.
        button_label: Xóa toàn bộ dữ liệu
        confirmation: Toàn bộ dữ liệu lưu trong trình duyệt này sẽ bị xóa, gồm nội dung tệp trong bộ nhớ đệm, hình thu nhỏ, bản nháp chưa lưu, cài đặt và trạng thái đăng nhập. Kho mã nguồn của bạn không bị ảnh hưởng, nhưng mọi thay đổi chưa lưu sẽ bị mất và bạn sẽ phải đăng nhập lại. CMS sẽ được tải lại sau khi hoàn tất.

  # Developer panel
  developer:
    title: Nhà phát triển
    developer_mode:
      title: Chế độ nhà phát triển
      description: Bật các tính năng dành cho nhà phát triển, bao gồm thông tin chi tiết trong nhật ký bảng điều khiển và trình đơn chuột phải mặc định.
      switch_label: Bật chế độ nhà phát triển
    local_git:
      title: Commit Git
      description: Commit các thay đổi vào nhánh hiện tại của kho mã nguồn cục bộ mỗi khi bạn lưu, giống như CMS làm khi bạn làm việc với kho mã nguồn từ xa. Sau đó, bạn có thể xem xét và push các commit bằng công cụ Git quen thuộc của mình.
      switch_label: Commit thay đổi vào Git
      checking: Đang kiểm tra kho mã nguồn…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Các thay đổi sẽ được commit vào nhánh {$branch} với tư cách {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Hiện không thể commit các thay đổi. {$reason}
    deploy_hook:
      title: Webhook triển khai
      description: Nhập URL webhook sẽ được gọi khi bạn kích hoạt triển khai theo cách thủ công bằng cách chọn Xuất bản thay đổi. Phần này có thể để trống nếu bạn đang sử dụng GitHub Actions hoặc GitLab CI/CD.
      # Hook URL input
      url:
        field_label: URL webhook
        saved: Đã lưu URL webhook.
        removed: Đã xóa URL webhook.
      # Authorization header input
      auth:
        field_label: 'Header xác thực (ví dụ: Bearer <token>) (không bắt buộc)'
        saved: Đã lưu header xác thực.
        removed: Đã xóa header xác thực.

# ==============================================================================
# Keyboard Shortcuts
# ==============================================================================
# Action descriptions for the keyboard shortcuts dialog.

keyboard_shortcuts_:
  view_content_library: Xem thư viện nội dung
  view_asset_library: Xem thư viện tệp
  search: Tìm bài viết và tệp
  create_entry: Tạo bài viết mới
  save_entry: Lưu bài viết
  cancel_editing: Hủy chỉnh sửa

# ==============================================================================
# File Type Labels
# ==============================================================================
# Display labels for file types shown in asset info and upload previews.

file_type_labels:
  # Image formats
  avif: Ảnh AVIF
  bmp: Ảnh bitmap
  gif: Ảnh GIF
  heic: Ảnh HEIC
  heif: Ảnh HEIF
  ico: Tệp biểu tượng
  jpeg: Ảnh JPEG
  jpg: Ảnh JPEG
  png: Ảnh PNG
  svg: Ảnh SVG
  tif: Ảnh TIFF
  tiff: Ảnh TIFF
  webp: Ảnh WebP
  # Video formats
  avi: Video AVI
  m4v: Video MP4
  mov: Video QuickTime
  mp4: Video MP4
  mpeg: Video MPEG
  mpg: Video MPEG
  ogg: Video Ogg
  ogv: Video Ogg
  ts: Video MPEG
  webm: Video WebM
  3gp: Video 3GPP
  3g2: Video 3GPP2
  # Audio formats
  aac: Âm thanh AAC
  mid: MIDI
  midi: MIDI
  m4a: Âm thanh MP4
  mp3: Âm thanh MP3
  oga: Âm thanh Ogg
  opus: Âm thanh OPUS
  wav: Âm thanh WAV
  weba: Âm thanh WebM
  # Document formats
  csv: Bảng tính CSV
  doc: Tài liệu Word
  docx: Tài liệu Word
  odp: Bản trình chiếu OpenDocument
  ods: Bảng tính OpenDocument
  odt: Văn bản OpenDocument
  pdf: Tài liệu PDF
  ppt: Thuyết trình PowerPoint
  pptx: Thuyết trình PowerPoint
  rtf: Tài liệu Rich Text
  xls: Bảng tính Excel
  xlsx: Bảng tính Excel
  # Text formats
  html: Văn bản HTML
  js: JavaScript
  json: Văn bản JSON
  md: Văn bản Markdown
  toml: Văn bản TOML
  yaml: Văn bản YAML
  yml: Văn bản YAML

# ==============================================================================
# File Size Units
# ==============================================================================
# Labels for file size units used in formatted file sizes.

file_size_units:
  # {$size} is the formatted numeric size for the current unit
  b: '{$size} byte'
  kb: '{$size} KB'
  mb: '{$size} MB'
  gb: '{$size} GB'
  tb: '{$size} TB'
