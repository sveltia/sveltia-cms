# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: Bài viết đã bị người khác thay đổi
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} đã thay đổi bài viết này vào {$date}, sau khi bạn mở nó.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Bài viết này đã bị thay đổi trong kho mã nguồn sau khi bạn mở nó.
  deleted: Bài viết này đã bị xóa khỏi kho mã nguồn sau khi bạn mở nó.
  # Follows `modified_by` or `modified`
  overwrite_warning: Nếu bạn lưu bây giờ, các thay đổi của họ sẽ bị mất.
  # Follows `deleted`
  recreate_warning: Nếu bạn lưu bây giờ, bài viết sẽ được tạo lại.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Vì bài viết được lưu trong cùng một tệp với các bài viết khác nên không thể lưu đè lên thay đổi đó. Hãy hủy chỉnh sửa, sau đó mở lại bài viết từ danh sách và thực hiện chỉnh sửa.
  # OK button label
  save_anyway: Vẫn lưu
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: Kho mã nguồn đã được người khác cập nhật trong khi lưu. Vui lòng thử lại.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Một bài viết được lưu trong cùng tệp đã bị người khác thay đổi. Vui lòng thử lại.
  # {$path} is the file path
  array_file_invalid: Không thể cập nhật tệp {$path} vì tệp không chứa danh sách bài viết hợp lệ.

