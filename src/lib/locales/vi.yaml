    # {$name} is the field name from the configuration; Don’t localize `bulk_edit`, `fields` and `multiple`
    unsupported_bulk_edit_field: Không thể chỉnh sửa hàng loạt trường `{$name}` trong danh sách `fields` của tùy chọn `bulk_edit`. Chỉ hỗ trợ trường Boolean, Color, DateTime, Number, Relation, Select hoặc String không ở chế độ chỉ đọc, không bật tùy chọn `multiple` và không được tự động đặt giá trị khi lưu.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: Tùy chọn `sortable_fields` đề cập đến trường có tên `{$name}`, nhưng không có trường nào như vậy trong chuyên mục.
