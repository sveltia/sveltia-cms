# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Có lỗi trong cấu hình CMS. Vui lòng giải quyết vấn đề và thử lại. }}
      *   {{ Có lỗi trong cấu hình CMS. Vui lòng giải quyết vấn đề và thử lại. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: 'Bộ sưu tập {$collection}'
    file: 'Tệp {$file}'
    component: 'Thành phần {$component}'
    # Don’t localize `{$field}`
    field: 'Trường `{$field}`'

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS chỉ hoạt động với URL HTTPS hoặc localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ URL tệp cấu hình phải sử dụng giao thức HTTPS hoặc địa chỉ localhost. }}
        *   {{ URL của tệp cấu hình phải sử dụng giao thức HTTPS hoặc địa chỉ localhost. }}
    fetch_failed: Không thể truy xuất tập tin cấu hình.
