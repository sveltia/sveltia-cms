# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: Trường này là bắt buộc.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: Ngày/giờ phải ở hoặc sau {$min}.
    date: Ngày phải vào hoặc sau {$min}.
    time: Thời gian phải ở hoặc sau {$min}.
    number: Giá trị phải lớn hơn hoặc bằng {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Bạn phải chọn ít nhất tùy chọn {$min}. }}
        *   {{ Bạn phải chọn ít nhất các tùy chọn {$min}. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Bạn phải thêm ít nhất mục {$min}. }}
        *   {{ Bạn phải thêm ít nhất các mục {$min}. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: Ngày/giờ phải ở hoặc trước {$max}.
    date: Ngày phải vào hoặc trước {$max}.
    time: Thời gian phải bằng hoặc trước {$max}.
    number: Giá trị phải nhỏ hơn hoặc bằng {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ Bạn không thể chọn nhiều hơn tùy chọn {$max}. }}
        *   {{ Bạn không thể chọn nhiều hơn các tùy chọn {$max}. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ Bạn không thể thêm nhiều hơn mục {$max}. }}
        *   {{ Bạn không thể thêm nhiều hơn các mục {$max}. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Bạn phải nhập ít nhất ký tự {$min}. }}
      *   {{ Bạn phải nhập ít nhất các ký tự {$min}. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ Bạn không thể nhập nhiều hơn ký tự {$max}. }}
      *   {{ Bạn không thể nhập nhiều hơn {$max} ký tự. }}

  # Type validation errors
  type_mismatch:
    number: Vui lòng nhập một số.
    email: Vui lòng nhập một email hợp lệ.
    url: Vui lòng nhập một URL hợp lệ.

  # Custom field validation error
  invalid_value: Giá trị không hợp lệ.
  unexpected_error: Đã xảy ra lỗi không mong muốn.

