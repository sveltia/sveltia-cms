    parse_failed_invalid_object: Tệp cấu hình không phải là đối tượng JavaScript hợp lệ.
    parse_failed_unsupported_type: Tệp cấu hình không phải là loại tệp hợp lệ. Chỉ hỗ trợ YAML, TOML và JSON.
    no_collection: Bộ sưu tập không được xác định.
    # Don’t localize `hide`
