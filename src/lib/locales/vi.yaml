    additions_no_base_url: Tùy chọn `base_url` phải là URL của dịch vụ Sveltia CMS Additions của bạn.
    oauth_no_app_id: ID ứng dụng OAuth không được xác định.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: Tùy chọn `open_authoring` yêu cầu chế độ xuất bản `editorial_workflow` hoặc `preview`. Xem <a>tài liệu</a> để biết chi tiết.
    # Don’t localize `auth_methods`
    no_auth_methods: Tùy chọn `auth_methods` phải chứa ít nhất một phương thức.
    # Don’t localize `auth_scope`, `repo` and `public_repo`
    auth_scope_no_repo: Tùy chọn `auth_scope` phải bao gồm `repo` hoặc `public_repo`.
    missing_media_folder: Thư mục phương tiện không được xác định.
    public_folder_relative_path: Thư mục chung được cấu hình không hợp lệ. Giá trị phải là đường dẫn tuyệt đối bắt đầu bằng “/”.
    public_folder_absolute_url: URL tuyệt đối cho tùy chọn thư mục chung không được hỗ trợ trong Sveltia CMS.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: Tùy chọn `{$option}` chứa thẻ mẫu `{$tag}`, thẻ này không được hỗ trợ ở đó. Chỉ có thể dùng các thẻ mẫu của slug, chẳng hạn như `\{\{slug\}\}` và `\{\{year\}\}`, cùng các thẻ `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` và `\{\{public_folder\}\}`.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: Tùy chọn `{$option}` chứa thẻ mẫu `{$tag}`, thẻ này chỉ có thể được dùng trong tùy chọn của một chuyên mục, một tệp trong chuyên mục hoặc một trường, nơi có bài viết để điền giá trị vào.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: Tùy chọn `sanitize_replacement` được đặt thành `{$replacement}`, nhưng giá trị này chứa ký tự không thể dùng trong slug nên không thể dùng để thay thế ký tự.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: Tùy chọn `{$option}` được đặt thành `{$url}`, nhưng giá trị phải là URL tuyệt đối bắt đầu bằng `https://` hoặc `http://`.
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: Tùy chọn `stages` của `publish_mode` phải bắt đầu bằng `draft` và liệt kê các giai đoạn theo thứ tự `draft`, `pending_review`, `pending_publish`, không lặp lại giai đoạn nào.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: Tùy chọn `i18n.locales` phải liệt kê ít nhất một ngôn ngữ.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: Tùy chọn `default_locale` được đặt thành `{$locale}`, nhưng giá trị này không nằm trong `locales`.
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: Tùy chọn `initial_locales` chứa `{$locale}`, nhưng giá trị này không nằm trong `locales`.
    # Don’t localize `i18n`
    i18n_no_collections: 'Tùy chọn `i18n` được cấu hình ở cấp cao nhất, nhưng không có chuyên mục hay trang đơn nào có tùy chọn `i18n`, vì vậy không có nội dung nào có thể được dịch. Hãy thêm `i18n: true` vào các chuyên mục và trang đơn cần dịch.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: Tùy chọn `transformations` chứa khóa `{$key}` không được hỗ trợ. Khóa phải là `raster_image`, `svg` hoặc một định dạng ảnh raster được hỗ trợ.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: Tùy chọn `quality` của phép biến đổi `{$key}` không hợp lệ. Giá trị phải là số nguyên từ 0 đến 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: Tùy chọn `{$prop}` của phép biến đổi `{$key}` không hợp lệ. Giá trị phải là số nguyên dương.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: Nhóm tệp {$count} phải có tùy chọn `name` là một chuỗi không trống.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Tên nhóm tệp `{$name}` không hợp lệ. Tên không được chứa ký tự đặc biệt.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Tên `{$name}` đã được dùng cho một nhóm tệp khác. Hãy chọn tên khác.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: Chuyên mục phải có tùy chọn `folder`, `file`, `files` hoặc `divider`.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: Chuyên mục không thể có nhiều hơn một trong các tùy chọn `folder`, `file`, `files` và `divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: Phần mở rộng `{$extension}` không khớp với định dạng `{$format}`.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: Trường `{$name}` được lưu làm phần thân bên dưới front matter, phần này chỉ có thể chứa văn bản, không thể chứa số, giá trị boolean, danh sách hay đối tượng như trường `{$widget}`. Hãy dùng loại trường chứa văn bản hoặc đổi tên trường.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
    # brackets are escaped with backslashes for MessageFormat 2
    invalid_collection_data_file: Tùy chọn `file` `{$file}` không hợp lệ. Giá trị phải là đường dẫn đến một tệp JSON, không chứa trình giữ chỗ `\{\{locale\}\}`.
    # {$prop} is the option name; Don’t localize `file`
    unsupported_collection_data_file_option: Tùy chọn `{$prop}` không được hỗ trợ trong chuyên mục có tùy chọn `file`.
    # Don’t localize `file`, `publish_mode` and `simple`
    collection_data_file_workflow: Quy trình biên tập và Quy trình xem trước, bao gồm cả Đóng góp mở, không được hỗ trợ trong chuyên mục có tùy chọn `file`. Hãy đặt tùy chọn `publish_mode` của chuyên mục thành `simple`.
    # {$prop} is the option name; Don’t localize `file` and `slug`. The curly brackets are escaped
    # with backslashes for MessageFormat 2
    collection_data_file_slug_tag: Tùy chọn `{$prop}` không được chứa thẻ `\{\{slug\}\}` trong chuyên mục có tùy chọn `file`, vì slug của bài viết là vị trí của nó, vốn sẽ thay đổi khi các bài viết được sắp xếp lại hoặc bị xóa. Hãy dùng một trường có giá trị duy nhất thay thế.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Mẫu slug `{$slug}` không hợp lệ vì không được chứa dấu gạch chéo. Để sắp xếp các bài viết trong thư mục con, hãy sử dụng tùy chọn `path` thay cho `slug`.
    # {$name} is the field name from the configuration; Don’t localize `identifier_field`
    invalid_identifier_field: Tùy chọn `identifier_field` tham chiếu đến `{$name}`, nhưng không có trường nào như vậy được xác định trong chuyên mục.
    # {$name} is the field name from the configuration; Don’t localize `filter`
    invalid_filter_field: Tùy chọn `filter` tham chiếu đến `{$name}`, nhưng không có trường nào như vậy được xác định trong chuyên mục.
    # Don’t localize `filter`, `value` and `pattern`
    invalid_filter_no_condition: Tùy chọn `filter` phải có tùy chọn `value` hoặc `pattern` để so khớp bài viết.
    # {$option} is an option name such as `slug` or `summary` and {$name} is the field name or template tag from the configuration
    option_field_not_found: Tùy chọn `{$option}` tham chiếu đến `{$name}`, nhưng không có trường nào như vậy được xác định.
    # {$name} is the field name from the configuration and {$widget} is its field type; Don’t localize `thumbnail`
    thumbnail_field_not_media: Tùy chọn `thumbnail` tham chiếu đến `{$name}`, nhưng đó phải là trường Image hoặc File, không phải trường `{$widget}`.
    # Don’t localize `inline` or `multiple`
    invalid_inline_component_fields: Chế độ `inline` yêu cầu một trường Boolean, Color, DateTime, Number, Relation, Select hoặc String duy nhất. Trường Relation hoặc Select không được bật tùy chọn `multiple`.
    # {$option} is an option name such as `pattern` or `filter` and {$pattern} is the configured pattern
    invalid_regex: Tùy chọn `{$option}` chứa biểu thức chính quy không hợp lệ `{$pattern}`, biểu thức này sẽ bị bỏ qua.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: Tùy chọn `reorder` đề cập đến nhóm chế độ xem có tên `{$name}`, nhưng không có nhóm nào như vậy được xác định trong tùy chọn `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit` and `fields`
