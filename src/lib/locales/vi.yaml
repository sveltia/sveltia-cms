    # Don’t localize `asset_collections`
    invalid_asset_collections: Tùy chọn `asset_collections` không hợp lệ. Nó phải là một mảng.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: Bộ sưu tập nội dung {$count} phải có tùy chọn `name` được xác định là một chuỗi không trống.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Tên bộ sưu tập nội dung `{$name}` không hợp lệ. Nó không được chứa các ký tự đặc biệt.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Tên bộ sưu tập nội dung phải là duy nhất nhưng `{$name}` được sử dụng nhiều lần.
    # Don’t localize `media_folder`
    asset_collection_invalid_media_folder: Bộ sưu tập nội dung `{$name}` phải có tùy chọn `media_folder` được xác định dưới dạng chuỗi.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_no_options: Bộ sưu tập phải được xác định tùy chọn `folder`, `files` hoặc `divider`.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_multiple_options: Bộ sưu tập không thể có các tùy chọn `folder`, `files` và `divider` cùng nhau.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: Tiện ích mở rộng `{$extension}` không khớp với định dạng `{$format}`.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Mẫu sên `{$slug}` không hợp lệ vì nó không thể chứa dấu gạch chéo. Để sắp xếp các mục trong thư mục con, hãy sử dụng tùy chọn `path` thay vì `slug`. #TODO: sên
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: Tùy chọn `reorder` đề cập đến nhóm chế độ xem có tên `{$name}`, nhưng không có nhóm nào như vậy được xác định trong tùy chọn `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: Tùy chọn `sortable_fields` đề cập đến trường có tên `{$name}`, nhưng không có trường nào như vậy được xác định trong bộ sưu tập.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: Tùy chọn `view_groups` đề cập đến trường có tên `{$name}`, nhưng không có trường nào như vậy được xác định trong bộ sưu tập.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: Tùy chọn `view_filters` đề cập đến trường có tên `{$name}`, nhưng không có trường nào như vậy được xác định trong bộ sưu tập.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: Nhóm chế độ xem {$count} phải có tùy chọn `name` được xác định là một chuỗi không trống.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: Tên nhóm chế độ xem `{$name}` không hợp lệ. Nó không được chứa các ký tự đặc biệt.
    duplicate_view_group_name: Tên nhóm xem phải là duy nhất nhưng `{$name}` được sử dụng nhiều lần.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: Bộ lọc chế độ xem {$count} phải có tùy chọn `name` được xác định là một chuỗi không trống.
    # {$name} is the invalid or duplicate view filter name
    invalid_view_filter_name: Tên bộ lọc chế độ xem `{$name}` không hợp lệ. Nó không được chứa các ký tự đặc biệt.
    duplicate_view_filter_name: Tên bộ lọc chế độ xem phải là duy nhất nhưng `{$name}` được sử dụng nhiều lần.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: Bộ sưu tập {$count} phải có tùy chọn `name` được xác định là một chuỗi không trống.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: Tên bộ sưu tập `{$name}` không hợp lệ. Nó không được chứa các ký tự đặc biệt.
    duplicate_collection_name: Tên bộ sưu tập phải là duy nhất nhưng `{$name}` được sử dụng nhiều lần.
    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
    missing_collection_file_name: Tệp bộ sưu tập {$count} phải có tùy chọn `name` được xác định là một chuỗi không trống.
    # {$name} is the invalid or duplicate collection file name
    invalid_collection_file_name: Tên tệp bộ sưu tập `{$name}` không hợp lệ. Nó không được chứa các ký tự đặc biệt.
    duplicate_collection_file_name: Tên tệp bộ sưu tập phải là duy nhất nhưng `{$name}` được sử dụng nhiều lần.
    # Don’t localize `fields`
    collection_no_fields: Bộ sưu tập phải có tùy chọn `fields` được xác định bằng ít nhất một trường.
    # Don’t localize `fields`
    collection_file_no_fields: Tệp bộ sưu tập phải có tùy chọn `fields` được xác định bằng ít nhất một trường.
    # Don’t localize `i18n`, `locale` and `file`
    collection_file_i18n_required: Tệp bộ sưu tập phải có tùy chọn `i18n` được xác định nếu trình giữ chỗ `locale` được sử dụng trong đường dẫn `file`.
    # {$count} is the 1-based field index in the current fields array; Don’t localize `name`
    missing_field_name: Trường {$count} phải có tùy chọn `name` được xác định là một chuỗi không trống.
    # {$name} is the invalid or duplicate field name
    invalid_field_name: Tên trường `{$name}` không hợp lệ. Nó không được chứa các ký tự đặc biệt. Nếu bạn muốn lồng các trường, <a>hãy sử dụng các trường Đối tượng thay vì ký hiệu dấu chấm</a>.   #TODO: lồng
    duplicate_field_name: Tên trường phải là duy nhất nhưng `{$name}` được sử dụng nhiều lần.
    # {$count} is the 1-based variable type index in the current types array
    missing_variable_type: Loại biến {$count} phải có tùy chọn `name` được xác định là một chuỗi không trống.
    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: Tên loại biến `{$name}` không hợp lệ. Nó không được chứa các ký tự đặc biệt.
    duplicate_variable_type: Tên loại biến phải là duy nhất nhưng `{$name}` được sử dụng nhiều lần.
    date_field_type: 'Loại trường Ngày không được dùng nữa không được hỗ trợ trong Sveltia CMS. Thay vào đó, hãy sử dụng loại trường DateTime với tùy chọn `type: date`.'
    # {$timeZone} is the invalid IANA timezone identifier from the configuration
    invalid_timezone: 'Múi giờ không hợp lệ: {$timeZone}. Phải là mã định danh múi giờ IANA hợp lệ như `America/New_York` hoặc `Asia/Tokyo`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: Tùy chọn `{$prop}` không được dùng nữa không được hỗ trợ trong Sveltia CMS. Thay vào đó hãy sử dụng tùy chọn `{$newProp}`.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: Tùy chọn `allow_multiple` không được hỗ trợ trong Sveltia CMS. Thay vào đó, hãy sử dụng tùy chọn `multiple`, mặc định là `false`.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: Trường Danh sách không thể có các tùy chọn `field`, `fields` và `types` cùng nhau.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: Loại biến của trường Danh sách không hợp lệ. Tùy chọn `widget` được đặt thành `{$widget}` nhưng phải là `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: Trường Đối tượng không thể có các tùy chọn `fields` và `types` cùng nhau.
    # Don’t localize `fields`, and `types`
    object_field_missing_fields: Trường Đối tượng phải được xác định tùy chọn `fields` hoặc `types`.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: Bộ sưu tập `{$collection}` được tham chiếu không hợp lệ hoặc không được xác định.
    relation_field_invalid_collection_file: Tệp `{$file}` được tham chiếu không hợp lệ hoặc không được xác định.
    # Don’t localize `file`
    relation_field_missing_file_name: Tùy chọn `file` phải được xác định cho mối quan hệ với bộ sưu tập tệp.
    relation_field_invalid_value_field: Trường giá trị tham chiếu `{$field}` không hợp lệ hoặc không được xác định.
    unexpected: Lỗi không mong muốn  #TODO: không mong muốn

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: ID ứng dụng OAuth không được xác định. Người dùng được yêu cầu cung cấp mã thông báo truy cập để đăng nhập.
    editorial_workflow_unsupported: Quy trình biên tập hiện chỉ được hỗ trợ với phần phụ trợ GitHub và GitLab. #TODO:phụ trợ ?
    open_authoring_unsupported: Tác giả mở chưa được hỗ trợ trong Sveltia CMS.
    nested_collections_unsupported: Các bộ sưu tập lồng nhau chưa được hỗ trợ trong Sveltia CMS.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: Tùy chọn `{$prop}` không được hỗ trợ trong Sveltia CMS. Nó sẽ bị bỏ qua.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Cả hai tùy chọn `picker_utc` và múi giờ mới hơn (`input_timezone` hoặc `output_utc`) đều được đặt. Các tùy chọn mới được ưu tiên. Hãy cân nhắc xóa `picker_utc` khỏi cấu hình của bạn.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Xem ghi chú tương thích để biết chi tiết: {$link}'

  # Console tip shown after config load
  schema_tip: Để có trải nghiệm tốt hơn cho nhà phát triển, bạn có thể xác thực tệp cấu hình của mình dựa trên lược đồ JSON của Sveltia CMS. Xem {$link} để biết chi tiết.

