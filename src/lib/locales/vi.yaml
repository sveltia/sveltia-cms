    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Không thể truy xuất tập tin cấu hình. Để ngăn tải tệp `config.yml`, hãy thêm <a>`load_config_file: false`</a> vào đối tượng cấu hình được chuyển tới `CMS.init()`.'
