# {$folder} is the current asset folder label
x_asset_folder: Thư mục nội dung “{$folder}”

# Navigation announcements (ARIA live regions)
# Announce page changes for screen reader users
viewing_collection_list: Bây giờ bạn đang xem danh sách bộ sưu tập.
viewing_asset_folder_list: Bây giờ bạn đang xem danh sách thư mục nội dung.
# Collection view announcements with entry counts
# {$collection} is the collection label and {$count} is the number of entries in it
viewing_x_collection: |
  .input {$count :integer}
  .match $count
    0   {{ Bạn hiện đang xem bộ sưu tập “{$collection}”, chưa có mục nào. }}
    one {{ Bạn hiện đang xem bộ sưu tập “{$collection}”, có một mục. }}
    *   {{ Bạn hiện đang xem bộ sưu tập “{$collection}”, có các mục {$count}. }}
# Asset folder view announcements with asset counts
# {$folder} is the folder label and {$count} is the number of assets in it
viewing_x_asset_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Hiện bạn đang xem thư mục nội dung “{$folder}”, thư mục này chưa có nội dung nào. }}
    one {{ Hiện bạn đang xem thư mục nội dung “{$folder}”, thư mục này có một nội dung. }}
    *   {{ Bây giờ bạn đang xem thư mục nội dung “{$folder}”, trong đó có nội dung {$count}. }}

