    invalid_collection_folder_locale: Đường dẫn `folder` `{$folder}` không hợp lệ. Trình giữ chỗ `locale` chỉ được dùng một lần và phải là toàn bộ tên một thư mục, ví dụ `content/\{\{locale\}\}/posts`.
    # Don’t localize `i18n`, `locale` and `file`
