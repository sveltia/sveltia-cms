# ==============================================================================
# Entry and Collection Actions
# ==============================================================================
# Strings related to creating, editing, and managing entries and collections.

# Message shown while entries are still being retrieved: in the entry editor, when it was opened
# with a direct link before all the data has been loaded, and on the Editorial Workflow page while
# the pull requests are being fetched. {$count} selects the form
loading_entries: |
  .input {$count :integer}
  .match $count
    1   {{ Đang tải bài viết… }}
    *   {{ Đang tải {$count} bài viết… }}
# Error message when entry cannot be found
entry_not_found: Không tìm thấy bài viết.

# Entry creation restrictions: tooltip and advisory messages
creating_entries_disabled_by_admin: Quản trị viên đã tắt tính năng tạo bài viết mới trong chuyên mục này.
# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: |
  .input {$quota :integer}
  .match $quota
    *   {{ Bạn không thể thêm bài viết mới vì chuyên mục này đã đạt giới hạn {$quota} bài viết. }}
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$quota :integer}
  .input {$remaining :integer}
  .match $quota $remaining
    *   *   {{ Chuyên mục này sắp đạt giới hạn {$quota} bài viết. Bạn chỉ có thể tạo thêm {$remaining} bài viết. }}

# Read-only restrictions set with the `readonly` option: advisory messages
readonly_cms: CMS đang ở chế độ chỉ đọc. Bạn có thể xem nội dung và tệp nhưng không thể thực hiện bất kỳ thay đổi nào.
readonly_collection: Chuyên mục này ở chế độ chỉ đọc. Bạn có thể xem nội dung nhưng không thể thực hiện bất kỳ thay đổi nào.
readonly_entry: Bài viết này ở chế độ chỉ đọc. Bạn có thể xem nhưng không thể thực hiện bất kỳ thay đổi nào.
readonly_asset_folder: Thư mục này ở chế độ chỉ đọc. Bạn có thể xem các tệp trong đó nhưng không thể thực hiện bất kỳ thay đổi nào.
readonly_branch: Bạn không có quyền push lên nhánh “{$branch}”. Bạn có thể xem nội dung này nhưng không thể thực hiện bất kỳ thay đổi nào.
readonly_role: Bạn chỉ có quyền xem. Bạn có thể xem nội dung và tệp nhưng không thể thực hiện bất kỳ thay đổi nào.
readonly_reference: Bài viết ở chế độ chỉ đọc nên không thể gỡ bỏ tham chiếu.
# {$entries} is a comma-separated list of entries, each shown as “Collection › Entry”
cannot_rename_referenced_entry: 'Không thể đổi tên bài viết này vì các bài viết chỉ đọc sau đang tham chiếu đến nó bằng tên hiện tại: {$entries}.'
# {$entries} is a comma-separated list of entries, each shown as “Collection › Entry”
cannot_move_referenced_asset: 'Không thể di chuyển hoặc đổi tên tệp này vì các bài viết chỉ đọc sau đang sử dụng nó: {$entries}.'

