change_language: Thay đổi ngôn ngữ

# Live reload infobar: shown when the CMS runs on a page that a framework’s development server (e.g.
# Astro) reloads on every file change, instead of a static HTML file
live_reload_warning: Máy chủ phát triển của bạn tải lại trang này mỗi khi có tệp thay đổi, điều này có thể làm gián đoạn việc lưu và khiến tệp của bạn bị hỏng. Thay vào đó, hãy phục vụ CMS từ một tệp HTML tĩnh. <a>Tìm hiểu thêm</a>

# Toast notification shown while the translation for the selected language is being downloaded
# {$locale} is the localized language name, e.g., “French”
switching_language: Đang chuyển sang {$locale}…
locale_load_failed: Không thể tải bản dịch {$locale}. Vui lòng thử lại sau.

# Toast notification shown when changes saved with the local backend couldn’t be committed to Git
# {$reason} is one of the `local_git_skip_reasons` strings below
local_git_not_committed: Các thay đổi của bạn đã được lưu nhưng chưa được commit vào Git. {$reason} Để chỉ lưu tệp, hãy tắt commit Git trong Cài đặt > Nhà phát triển.
local_git_skip_reasons:
  unsupported_repository: Kho mã nguồn của bạn sử dụng một tính năng Git mà CMS không hỗ trợ, chẳng hạn như linked worktree, tên đối tượng SHA-256, định dạng reftable, sparse index hoặc index phiên bản 3 hay 4 (được tùy chọn feature.manyFiles và git add -N sử dụng).
  missing_identity: Tên và địa chỉ email của bạn chưa được đặt trong cấu hình Git của kho mã nguồn, và CMS không thể đọc cấu hình toàn cục của bạn. Hãy đặt chúng trong kho mã nguồn bằng git config --local user.name "Your Name" và git config --local user.email "you@example.com".
  locked: Một tiến trình Git khác đang sử dụng kho mã nguồn. Nếu không có tiến trình nào đang chạy, hãy xóa tệp .git/index.lock.
  # The operation in progress, with how to finish or cancel it
  operation_in_progress:
    merge: Đang có một thao tác merge. Hoàn tất bằng git commit hoặc hủy bằng git merge --abort.
    rebase: Đang có một thao tác rebase. Hoàn tất bằng git rebase --continue hoặc hủy bằng git rebase --abort. Nếu bạn đã chuyển sang việc khác, git rebase --quit sẽ bỏ thao tác này mà không thay đổi tệp của bạn.
    cherry_pick: Đang có một thao tác cherry-pick. Hoàn tất bằng git cherry-pick --continue hoặc hủy bằng git cherry-pick --abort.
    revert: Đang có một thao tác revert. Hoàn tất bằng git revert --continue hoặc hủy bằng git revert --abort.
    am: Đang áp dụng bản vá bằng git am. Hoàn tất bằng git am --continue hoặc hủy bằng git am --abort.
    conflict: Một số tệp đang bị xung đột. Hãy giải quyết xung đột và stage kết quả trước.
  detached_head: Chưa checkout nhánh nào.
  staged_changes: Bạn có các thay đổi khác đã được stage để commit. Hãy commit hoặc bỏ stage chúng trước.
  # {$path} is the file path
  lfs: '{$path} được theo dõi bằng Git LFS nên CMS không thể commit tệp này.'
  # {$message} is the error message
  error: Đã xảy ra lỗi không mong muốn. {$message}

