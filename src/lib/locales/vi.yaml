    # Don’t localize `i18n` and `i18n: true`
    collection_i18n_no_files: 'Chuyên mục có tùy chọn `i18n`, nhưng không có tệp nào của nó có tùy chọn `i18n`, vì vậy không có tệp nào có thể được dịch. Hãy thêm `i18n: true` vào các tệp cần dịch.'
    # Don’t localize `i18n`, `i18n: true` and `i18n: duplicate`
    collection_file_i18n_no_fields: 'Tệp trong chuyên mục có tùy chọn `i18n`, nhưng không có trường nào của nó có tùy chọn `i18n`, vì vậy không có trường nào có thể được dịch. Hãy thêm `i18n: true` hoặc `i18n: duplicate` vào các trường cần dịch.'
    # {$count} is the 1-based field index in the current fields array; Don’t localize `name`
