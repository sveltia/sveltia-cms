# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ V konfigurácii CMS je chyba. Vyriešte problém a skúste to znova. }}
      *   {{ V konfigurácii CMS sú chyby. Vyriešte problémy a skúste to znova. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: kolekcia {$collection}
    file: súbor {$file}
    component: komponent {$component}
    # Don’t localize `{$field}`
    field: pole `{$field}`

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS funguje iba s URL využívajúcimi HTTPS alebo localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ URL konfiguračného súboru musí používať protokol HTTPS alebo adresu localhost. }}
        *   {{ URL konfiguračných súborov musia používať protokol HTTPS alebo adresy localhost. }}
    fetch_failed: Konfiguračný súbor sa nepodarilo načítať.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: Odpoveď HTTP vrátila stav {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Konfiguračný súbor sa nepodarilo načítať. Ak chcete zabrániť načítaniu súboru `config.yml`, pridajte <a>`load_config_file: false`</a> do konfiguračného objektu odovzdaného do `CMS.init()`.'
    parse_failed: Konfiguračný súbor sa nepodarilo spracovať.
    parse_failed_invalid_object: Konfiguračný súbor nie je platný objekt JavaScriptu.
    parse_failed_unsupported_type: Konfiguračný súbor nemá platný typ súboru. Podporované sú iba formáty YAML, TOML a JSON.
    no_collection: Kolekcie nie sú definované.
    # Don’t localize `hide`
    no_visible_collection: Aspoň jedna kolekcia musí byť viditeľná. Skontrolujte možnosť `hide`.
    missing_backend: Backend nie je definovaný.
    missing_backend_name: Názov backendu nie je definovaný.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Backend {$name} <a>nie je podporovaný</a> vo Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Zastaraný backend {$name} <a>nie je podporovaný</a> vo Sveltia CMS.
    unsupported_custom_backend: Vlastné backendy <a>nie sú podporované</a> vo Sveltia CMS.
    unsupported_backend_suggestion: Namiesto toho použite jeden z <a>podporovaných backendov</a>.
    missing_repository: Repozitár nie je definovaný.
    invalid_repository: Nakonfigurovaný repozitár je neplatný. Musí byť vo formáte „vlastník/repozitár“.
    oauth_implicit_flow: Nakonfigurovaná metóda overenia (implicit flow) nie je vo Sveltia CMS podporovaná. Namiesto nej použite inú <a>metódu overenia</a>.
    github_pkce_unsupported: Autorizácia PKCE zatiaľ nie je podporovaná kvôli obmedzeniam GitHubu. Namiesto nej použite inú <a>metódu overenia</a>.
    oauth_no_app_id: ID aplikácie OAuth nie je definované.
    # Don’t localize `open_authoring` and `editorial_workflow`
    open_authoring_no_workflow: Možnosť `open_authoring` vyžaduje režim publikovania `editorial_workflow`. Podrobnosti nájdete v <a>dokumentácii</a>.
    # Don’t localize `auth_methods`
    no_auth_methods: Možnosť `auth_methods` musí obsahovať aspoň jednu metódu.
    missing_media_folder: Priečinok médií nie je definovaný.
    public_folder_relative_path: Nakonfigurovaný verejný priečinok je neplatný. Musí to byť absolútna cesta začínajúca znakom „/“.
    public_folder_absolute_url: Absolútna URL v možnosti verejného priečinka nie je vo Sveltia CMS podporovaná.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: Možnosť `sanitize_replacement` je nastavená na `{$replacement}`, ale obsahuje znak, ktorý sa v slugu nedá použiť, takže nemôže slúžiť ako náhrada.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: Možnosť `{$option}` je nastavená na `{$url}`, ale musí to byť absolútna URL začínajúca na `https://` alebo `http://`.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: Možnosť `i18n.locales` musí obsahovať aspoň jeden jazyk.
