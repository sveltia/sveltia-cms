        button_label: Vymazať všetky údaje
        confirmation: Všetky údaje uložené v tomto prehliadači sa odstránia vrátane obsahu súborov v cache, miniatúr obrázkov, neuložených konceptov, nastavení a stavu prihlásenia. Váš repozitár nebude ovplyvnený, ale všetky neuložené zmeny sa stratia a budete sa musieť znova prihlásiť. Po dokončení sa CMS znova načíta.

