# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: Položku zmenil niekto iný
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: Položka bola zmenená používateľom {$name} ({$date}) potom, ako ste ju otvorili.
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Táto položka bola v repozitári zmenená potom, ako ste ju otvorili.
  deleted: Táto položka bola z repozitára odstránená potom, ako ste ju otvorili.
  # Follows `modified_by` or `modified`
  overwrite_warning: Ak položku teraz uložíte, tieto zmeny sa stratia.
  # Follows `deleted`
  recreate_warning: Ak položku teraz uložíte, vytvorí sa znova.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Keďže je položka uložená v rovnakom súbore ako iné položky, nemožno ju uložiť tak, aby prepísala túto zmenu. Zrušte úpravy, znova otvorte položku zo zoznamu a vykonajte úpravy.
  # OK button label
  save_anyway: Napriek tomu uložiť
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: Počas ukladania repozitár aktualizoval niekto iný. Skúste to znova.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Položku uloženú v rovnakom súbore zmenil niekto iný. Skúste to znova.
  # {$path} is the file path
  array_file_invalid: Súbor {$path} nemožno aktualizovať, pretože neobsahuje platný zoznam položiek.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
# repository while the user has it open. The change itself is described with the `save_conflict`
