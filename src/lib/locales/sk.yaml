    invalid_list_field: Pole typu List nemôže mať súčasne možnosti `field`, `fields` a `types`.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: Typ premennej poľa List je neplatný. Možnosť `widget` je nastavená na `{$widget}`, ale musí byť `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: Pole typu Object nemôže mať súčasne možnosti `fields` a `types`.
    # {$min} and {$max} are option names such as `min` and `max` or `minlength` and `maxlength`
    invalid_range_options: Možnosť `{$min}` nesmie byť väčšia ako možnosť `{$max}`.
    # {$step} is the configured value; Don’t localize `step`
    invalid_step: Možnosť `step` je nastavená na `{$step}`, ale musí byť väčšia ako nula.
    # Don’t localize `options`
    select_field_no_options: Pole typu Select musí mať v možnosti `options` aspoň jednu položku.
    # {$value} is the option value from the configuration; Don’t localize `options`
    select_field_duplicate_option: Hodnoty v možnosti `options` poľa Select musia byť unikátne, ale `{$value}` sa používa viackrát.
    # {$value} is the default value from the configuration; Don’t localize `default` and `options`
    select_field_invalid_default: Možnosť `default` poľa Select je nastavená na `{$value}`, ale táto hodnota nie je medzi `options`.
    # Don’t localize `fields` and `types`
    list_field_no_subfields: Možnosť `fields` alebo `types` poľa List musí mať aspoň jednu položku. Pre zoznam jednoduchých hodnôt túto možnosť vynechajte.
    # Don’t localize `default`, `fields` and `types`
    list_field_invalid_default_object: Možnosť `default` poľa List obsahuje objekt, ale každá položka musí byť jednoduchá hodnota, pretože pole nemá `fields` ani `types`.
    # {$value} is the default item from the configuration; Don’t localize `default`, `fields` and `types`
    list_field_invalid_default_item: Možnosť `default` poľa List obsahuje `{$value}`, ale každá položka musí byť objekt, pretože pole má `fields` alebo `types`.
    # {$key} is a property name of the default item from the configuration; Don’t localize `default`
    list_field_invalid_default_key: Možnosť `default` poľa List obsahuje položku s vlastnosťou `{$key}`, ale žiadne vnorené pole nemá taký názov.
    # {$typeKey} is the configured type key, `type` by default; Don’t localize `default` and `types`
    list_field_default_missing_type: Možnosť `default` poľa List obsahuje položku bez vlastnosti `{$typeKey}`, ktorá určuje jeden z typov v `types`.
    # {$typeKey} is the configured type key, `type` by default, and {$value} is its value in the default item; Don’t localize `default` and `types`
    list_field_invalid_default_type: Možnosť `default` poľa List obsahuje položku, ktorej vlastnosť `{$typeKey}` má hodnotu `{$value}`, ale tá nie je medzi `types`.
    # Don’t localize `default` and `multiple`
    invalid_default_multiple: Možnosť `default` musí byť pole hodnôt, pretože možnosť `multiple` má hodnotu `true`.
    invalid_default_single: Možnosť `default` musí byť jedna hodnota, nie pole hodnôt, pretože možnosť `multiple` nemá hodnotu `true`.
    # {$key} is a property name of the default object from the configuration; Don’t localize `default`
    object_field_invalid_default_key: Možnosť `default` poľa Object má vlastnosť `{$key}`, ale žiadne vnorené pole nemá taký názov.
    # {$typeKey} is the configured type key, `type` by default; Don’t localize `default` and `types`
    object_field_default_missing_type: Možnosť `default` poľa Object nemá vlastnosť `{$typeKey}`, ktorá určuje jeden z typov v `types`.
    # {$typeKey} is the configured type key, `type` by default, and {$value} is its value in the default object; Don’t localize `default` and `types`
    object_field_invalid_default_type: Vlastnosť `{$typeKey}` v možnosti `default` poľa Object má hodnotu `{$value}`, ale tá nie je medzi `types`.
    # Don’t localize `default` and `output_code_only`
    code_field_invalid_default_object: Možnosť `default` poľa Code musí byť reťazec, pretože možnosť `output_code_only` má hodnotu `true`.
    # {$key} is a property name of the default object, {$code} and {$lang} are the configured property names; Don’t localize `default` and `keys`
    code_field_invalid_default_key: Možnosť `default` poľa Code má vlastnosť `{$key}`, ale možnosť `keys` povoľuje iba `{$code}` a `{$lang}`.
    # {$value} is the default value and {$valueType} is the configured value type; Don’t localize `default` and `value_type`
    number_field_default_not_integer: Možnosť `default` poľa Number je nastavená na `{$value}`, ale musí to byť celé číslo, pretože možnosť `value_type` má hodnotu `{$valueType}`.
    number_field_default_not_number: Možnosť `default` poľa Number je nastavená na `{$value}`, ale musí to byť číslo, pretože možnosť `value_type` má hodnotu `{$valueType}`.
    # Don’t localize `fields` and `types`
    object_field_no_subfields: Možnosť `fields` alebo `types` poľa Object musí mať aspoň jednu položku.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: Odkazovaná kolekcia `{$collection}` je neplatná alebo nie je definovaná.
    relation_field_invalid_collection_file: Odkazovaný súbor `{$file}` je neplatný alebo nie je definovaný.
    # Don’t localize `file`
    relation_field_missing_file_name: Pri vzťahu ku kolekcii súborov musí byť definovaná možnosť `file`.
    relation_field_invalid_value_field: Odkazované pole hodnoty `{$field}` je neplatné alebo nie je definované.
    # {$collection} is the referenced collection name; Don’t localize `file`, `value_field` and `slug`.
    # The curly brackets are escaped with backslashes for MessageFormat 2
    relation_field_array_file_slug: Vzťah ku kolekcii `{$collection}` nemôže ukladať hodnotu `\{\{slug\}\}`, pretože v kolekcii s možnosťou `file` je slug položky jej poradie, ktoré sa mení pri zmene poradia alebo odstránení položiek. Namiesto toho nastavte možnosť `value_field` na pole s unikátnou hodnotou.
    # {$collection} is the referenced collection name; Don’t localize `file`
    relation_field_array_file_workflow: Kolekcia s možnosťou `file` nemôže mať vzťah ku kolekcii `{$collection}`, ktorá používa schvaľovací proces, pretože odkazy na položku, ktorá sa tam premenuje alebo odstráni, nie je možné v súbore aktualizovať.
    relation_field_invalid_display_field: Odkazované zobrazované pole `{$field}` je neplatné alebo nie je definované.
    relation_field_invalid_search_field: Odkazované pole vyhľadávania `{$field}` je neplatné alebo nie je definované.
    relation_field_invalid_filter_field: Odkazované pole filtra `{$field}` je neplatné alebo nie je definované.
    unexpected: Neočakávaná chyba

    # Schema validation errors, reported when the configuration doesn’t match the published JSON
    # schema. In all of these, {$option} is a configuration option path such as `backend.name` or
    # `view_filters[0].pattern`, relative to the collection, file or field named before it.
    # {$type} is a value type name from `schema_value_type` below
    schema_invalid_type: Možnosť `{$option}` musí byť {$type}.
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'Možnosť `{$option}` musí mať jednu z týchto hodnôt: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: Možnosť `{$option}` musí mať hodnotu `{$value}`.
    schema_invalid_empty_value: Možnosť `{$option}` musí byť prázdny reťazec.
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: Možnosť `{$option}` musí byť pole s počtom prvkov {$count}.
    schema_invalid_value: Možnosť `{$option}` má neplatnú hodnotu.
    schema_missing_option: Možnosť `{$option}` je povinná.
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Vyžaduje sa jedna z týchto možností: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: reťazec
      number: číslo
      integer: celé číslo
      boolean: logická hodnota
      array: pole
      object: objekt
      'null': prázdna

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: ID aplikácie OAuth nie je definované. Používatelia sa musia prihlásiť pomocou prístupového tokenu.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: Možnosť `{$prop}` nie je vo Sveltia CMS podporovaná. Bude ignorovaná.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Je nastavená možnosť `picker_utc` aj novšie možnosti časového pásma (`input_timezone` alebo `output_utc`). Prednosť majú nové možnosti. Zvážte odstránenie `picker_utc` z konfigurácie.
    # Don’t localize `preview_path`
    preview_path_no_date_field: Možnosť `preview_path` používa parametre dátumu a času, ale kolekcia nemá žiadne pole DateTime, z ktorého by ich bolo možné načítať, takže odkaz na náhľad sa nezobrazí.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: Možnosť `preview_path_date_field` odkazuje na pole s názvom `{$name}`, ale žiadne pole DateTime s týmto názvom nie je definované, takže odkaz na náhľad sa nezobrazí.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: Možnosť `preview_path` odkazuje na `{$name}`, ale v kolekcii nie je definované žiadne také pole, takže odkaz na náhľad sa nezobrazí.
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: Kolekcia nemá pole `{$name}`, podľa ktorého by sa pomenovali nové položky, takže každá nová položka dostane náhodný slug. Pridajte pole `{$name}` alebo nastavte možnosť `identifier_field` či `slug`.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: Možnosť `i18n` v `slug` nemá žiadny efekt, pretože kolekcia nepoužíva štruktúru i18n `multiple_files`, `multiple_folders` ani `multiple_root_folders`, v ktorej má každý jazyk vlastný súbor.
    # Don’t localize `i18n`
    i18n_not_configured: Možnosť `i18n` je zapnutá, ale i18n nie je nakonfigurované na najvyššej úrovni konfigurácie ani v kolekcii, takže táto možnosť nemá žiadny efekt.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: Možnosť `public_folder` je prázdny reťazec, preto sa pre cesty k médiám ukladané v položkách použije namiesto nej cesta `media_folder`. Odstráňte túto možnosť alebo ju nastavte na cestu, ktorú chcete použiť, napríklad `/images`.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: Možnosť `{$option}` nie je definovaná v schéme konfigurácie Sveltia CMS. Bude ignorovaná. Skontrolujte, či nejde o preklep alebo syntaktickú chybu.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Podrobnosti nájdete v poznámkach o kompatibilite: {$link}'

  # Console tip shown after config load
  schema_tip: Aby ste chyby odhalili skôr, môžete svoj konfiguračný súbor overiť voči schéme JSON Sveltia CMS. Podrobnosti nájdete na {$link}.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Lokálne
  # Browser compatibility warnings
  unsupported_browser: Lokálny pracovný postup nie je vo vašom prehliadači podporovaný. Použite Chrome alebo Edge.
  disabled: Lokálny pracovný postup je vo vašom prehliadači vypnutý. <a>Tu je návod, ako ho zapnúť</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Teraz si prezeráte tabuľu schvaľovacieho procesu. Koncepty: {$draft}. Na kontrole: {$review}. Pripravené: {$ready}. Čaká na odstránenie: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Teraz si prezeráte tabuľu schvaľovacieho procesu. Koncepty: {$draft}. Na kontrole: {$review}. Čaká na odstránenie: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Koncept
  drafts: Koncepty
  in_review: Na kontrole
  ready: Pripravené
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Čaká na odstránenie
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: Nasadzuje sa

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Zrušiť odstránenie
  confirm_cancelling_deletion: Naozaj chcete zrušiť toto odstránenie? Položka zostane publikovaná.
  confirm_completing_deletion: Naozaj chcete odstrániť túto položku? Odstráni sa okamžite.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ Položka bola označená na odstránenie. }}
      few {{ {$count} položky boli označené na odstránenie. }}
      *   {{ {$count} položiek bolo označených na odstránenie. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Zmeny boli zahodené. }}
      few {{ Zmeny v {$count} položkách boli zahodené. }}
      *   {{ Zmeny v {$count} položkách boli zahodené. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Ruší sa odstránenie…
  deletion_cancelled: Odstránenie bolo zrušené.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Odstránenie sa nepodarilo zrušiť. Skúste to znova.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Nepublikované položky
  published_entries: Publikované položky
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Stav: {$status}'
  change_entry_status: Zmeniť stav položky
  # Editor toolbar: progress label while the status is being changed
  changing_status: Mení sa stav…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Aktualizuje sa stav…
  status_updated: Stav bol aktualizovaný.
  # Error notification when the status could not be changed
  status_change_failed: Stav sa nepodarilo zmeniť. Skúste to znova.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: Položka obsahuje chyby. Pred zmenou stavu ich opravte.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: Položka obsahuje chyby. Pred publikovaním ich opravte.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Odoslať na kontrolu
  confirm_sending_for_review: Vaše zmeny boli uložené ako koncept. Odoslať položku na kontrolu, aby si ju niekto mohol pozrieť a publikovať?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Publikovať položku
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Zahodiť zmeny
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Naozaj chcete odstrániť túto položku? Odstráni sa až po publikovaní odstránenia. Dovtedy ju nájdete v zozname položiek s označením „Čaká na odstránenie“.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Táto položka ešte nebola publikovaná, takže sa jej odstránením úplne zahodí.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Táto položka má nepublikované zmeny. Ich zahodením sa obnoví publikovaná verzia. Samotná položka sa neodstráni.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Ešte nebola publikovaná, takže vaše nepublikované zmeny sa zahodia. Prípadná publikovaná verzia zostane publikovaná. }}
      *   {{ Ešte neboli publikované, takže vaše nepublikované zmeny sa zahodia. Prípadné publikované verzie zostanú publikované. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ Jedna z nich ešte nebola publikovaná, takže vaše nepublikované zmeny sa zahodia. Prípadná publikovaná verzia zostane publikovaná. }}
      few {{ {$count} z nich ešte neboli publikované, takže vaše nepublikované zmeny sa zahodia. Prípadné publikované verzie zostanú publikované. }}
      *   {{ {$count} z nich ešte nebolo publikovaných, takže vaše nepublikované zmeny sa zahodia. Prípadné publikované verzie zostanú publikované. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: Naozaj chcete publikovať túto položku? Vaše zmeny sa prejavia po aktualizácii webu.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Publikuje sa položka…
  entry_published: Položka bola publikovaná.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Odstraňuje sa položka…
  discarding_changes: Zahadzujú sa zmeny…
  entry_deleted: Položka bola odstránená.
  # Error notification when publishing fails
  publishing_entry_failed: Položku sa nepodarilo publikovať. Skúste to znova.
  # Workflow page: empty column message
  no_entries: Žiadne položky.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Presunutím zmeníte stav
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Odstránenie

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Vytvoriť fork repozitára
  fork: Vytvoriť fork
  confirm_forking_repository: Ak chcete navrhnúť zmeny v repozitári „{$repo}“, musí sa vo vašom účte vytvoriť jeho fork. Vaše zmeny sa uložia do tohto forku a správca ich pred zverejnením skontroluje.
  # Error shown when the user declined the dialog above
  fork_declined: Na navrhovanie zmien potrebujete vo svojom účte fork repozitára.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Vo vašom účte sa nepodarilo vytvoriť fork repozitára „{$repo}“.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Nepodarilo sa overiť váš prístup k repozitáru „{$repo}“. Skúste to znova o chvíľu.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Repozitár „{$repo}“ nepovoľuje forky. Požiadajte správcu, aby pre neho povolil forkovanie.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Máte čakajúcu pozvánku do repozitára „{$repo}“. Prijmite ju na GitHube a potom sa znova prihláste.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Vaše prihlásenie nezahŕňa prístup k súkromným repozitárom, takže repozitár „{$repo}“ nie je možné načítať. Požiadajte správcu, aby skontroloval nastavenia overovania CMS.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Zmeny na tomto webe môže publikovať iba správca. Namiesto toho označte svoju položku ako „Na kontrole“ a niekto sa na ňu pozrie.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Túto zmenu nie je možné vykonať priamo. Na kontrolu je možné navrhnúť iba úpravy položiek.
