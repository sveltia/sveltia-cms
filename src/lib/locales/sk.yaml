sign_in_with_link: Prihlásiť sa pomocou odkazu
sign_in_with_link_confirmation: Tento odkaz vás prihlási ako {$account} v službe {$service} a skopíruje nastavenia zo zariadenia, na ktorom bol vytvorený. Pokračujte, iba ak ste odkaz vytvorili sami.

# Account menu: user status and repository mode indicators
# Shown at the top of the account dropdown menu
# {$name} is the signed-in user’s login name
signed_in_as_x: 'Prihlásený účet: {$name}'
working_with_local_repo: Práca s lokálnym repozitárom
working_with_test_repo: Práca s testovacím repozitárom

# Account menu: action items for sign-out and app installation
sign_out: Odhlásiť sa
install_as_app: Nainštalovať ako aplikáciu

