# Toast notification shown when changes saved with the local backend couldn’t be committed to Git
# {$reason} is one of the `local_git_skip_reasons` strings below
local_git_not_committed: Vaše zmeny boli uložené, ale neboli commitnuté do Gitu. {$reason} Ak chcete iba ukladať súbory, vypnite commity Git v časti Nastavenia > Pre vývojárov.
local_git_skip_reasons:
  unsupported_repository: Váš repozitár používa funkciu Gitu, ktorú CMS nepodporuje, napríklad prepojený pracovný strom (worktree), názvy objektov SHA-256, formát reftable, riedky index (sparse index) alebo index vo verzii 3 alebo 4, ktorý používajú možnosť feature.manyFiles a príkaz git add -N.
  missing_identity: Vaše meno a e-mailová adresa nie sú nastavené v konfigurácii Gitu repozitára a CMS nedokáže prečítať vašu globálnu konfiguráciu. Nastavte ich v repozitári príkazmi git config --local user.name "Your Name" a git config --local user.email "you@example.com".
  locked: Repozitár používa iný proces Gitu. Ak žiadny nebeží, odstráňte súbor .git/index.lock.
  # The operation in progress, with how to finish or cancel it
  operation_in_progress:
    merge: Prebieha zlučovanie (merge). Dokončite ho príkazom git commit alebo ho zrušte príkazom git merge --abort.
    rebase: Prebieha rebase. Dokončite ho príkazom git rebase --continue alebo ho zrušte príkazom git rebase --abort. Ak ste už pokračovali inou prácou, príkaz git rebase --quit ho zahodí bez zmeny vašich súborov.
    cherry_pick: Prebieha cherry-pick. Dokončite ho príkazom git cherry-pick --continue alebo ho zrušte príkazom git cherry-pick --abort.
    revert: Prebieha revert. Dokončite ho príkazom git revert --continue alebo ho zrušte príkazom git revert --abort.
    am: Prebieha aplikovanie záplat príkazom git am. Dokončite ho príkazom git am --continue alebo ho zrušte príkazom git am --abort.
    conflict: Niektoré súbory obsahujú konflikty. Najprv ich vyriešte a výsledky pripravte na commit (stage).
  detached_head: Nie je vybraná (checkout) žiadna vetva.
  staged_changes: Na commit máte pripravené iné zmeny. Najprv ich commitnite alebo zrušte ich prípravu (unstage).
