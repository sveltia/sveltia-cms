# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ V konfigurácii CMS je chyba. Vyriešte problém a skúste to znova. }}
      *   {{ V konfigurácii CMS sú chyby. Vyriešte problémy a skúste to znova. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: kolekcia {$collection}
    file: súbor {$file}
    component: komponent {$component}
    # Don’t localize `{$field}`
    field: pole `{$field}`

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS funguje iba s URL využívajúcimi HTTPS alebo localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ URL konfiguračného súboru musí používať protokol HTTPS alebo adresu localhost. }}
        *   {{ URL konfiguračných súborov musia používať protokol HTTPS alebo adresy localhost. }}
    fetch_failed: Konfiguračný súbor sa nepodarilo načítať.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: Odpoveď HTTP vrátila stav {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Konfiguračný súbor sa nepodarilo načítať. Ak chcete zabrániť načítaniu súboru `config.yml`, pridajte <a>`load_config_file: false`</a> do konfiguračného objektu odovzdaného do `CMS.init()`.'
    parse_failed: Konfiguračný súbor sa nepodarilo spracovať.
    parse_failed_invalid_object: Konfiguračný súbor nie je platný objekt JavaScriptu.
    parse_failed_unsupported_type: Konfiguračný súbor nemá platný typ súboru. Podporované sú iba formáty YAML, TOML a JSON.
    no_collection: Kolekcie nie sú definované.
    # Don’t localize `hide`
    no_visible_collection: Aspoň jedna kolekcia musí byť viditeľná. Skontrolujte možnosť `hide`.
    missing_backend: Backend nie je definovaný.
    missing_backend_name: Názov backendu nie je definovaný.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Backend {$name} <a>nie je podporovaný</a> vo Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Zastaraný backend {$name} <a>nie je podporovaný</a> vo Sveltia CMS.
    unsupported_custom_backend: Vlastné backendy <a>nie sú podporované</a> vo Sveltia CMS.
    unsupported_backend_suggestion: Namiesto toho použite jeden z <a>podporovaných backendov</a>.
    missing_repository: Repozitár nie je definovaný.
    invalid_repository: Nakonfigurovaný repozitár je neplatný. Musí byť vo formáte „vlastník/repozitár“.
    # Don’t localize `api_root`
    missing_api_root: Možnosť `api_root` nie je definovaná. Pre backend Forgejo je povinná.
    invalid_root_dir: Koreňový priečinok je neplatný. Musí to byť cesta v rámci repozitára bez „..“.
    invalid_root_dir_branch: Koreňový priečinok nemožno použiť v názvoch vetiev režimov publikovania `editorial_workflow` a `preview`. Žiadna časť jeho cesty nesmie začínať bodkou, končiť na „.lock“ ani obsahovať medzeru alebo špeciálny znak, napríklad dvojbodku či hviezdičku.
    path_outside_root_dir: Cesta „{$path}“ vedie mimo koreňového priečinka, kde CMS nemôže zobraziť súbory.
    oauth_implicit_flow: Nakonfigurovaná metóda overenia (implicit flow) nie je vo Sveltia CMS podporovaná. Namiesto nej použite inú <a>metódu overenia</a>.
    github_pkce_unsupported: Autorizácia PKCE zatiaľ nie je podporovaná kvôli obmedzeniam GitHubu. Namiesto nej použite inú <a>metódu overenia</a>.
    additions_no_base_url: Možnosť `base_url` musí byť URL vašej služby Sveltia CMS Additions.
    oauth_no_app_id: ID aplikácie OAuth nie je definované.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: Možnosť `open_authoring` vyžaduje režim publikovania `editorial_workflow` alebo `preview`. Podrobnosti nájdete v <a>dokumentácii</a>.
    # Don’t localize `auth_methods`
    no_auth_methods: Možnosť `auth_methods` musí obsahovať aspoň jednu metódu.
    # Don’t localize `auth_scope`, `repo` and `public_repo`
    auth_scope_no_repo: Možnosť `auth_scope` musí obsahovať `repo` alebo `public_repo`.
    missing_media_folder: Priečinok médií nie je definovaný.
    public_folder_relative_path: Nakonfigurovaný verejný priečinok je neplatný. Musí to byť absolútna cesta začínajúca znakom „/“.
    public_folder_absolute_url: Absolútna URL v možnosti verejného priečinka nie je vo Sveltia CMS podporovaná.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: Možnosť `{$option}` obsahuje značku šablóny `{$tag}`, ktorá tam nie je podporovaná. Použiť možno iba značky šablóny slugu, napríklad `\{\{slug\}\}` a `\{\{year\}\}`, a značky `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` a `\{\{public_folder\}\}`.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: Možnosť `{$option}` obsahuje značku šablóny `{$tag}`, ktorú možno použiť iba v možnosti kolekcie, súboru kolekcie alebo poľa, kde existuje položka, z ktorej sa dá vyplniť.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: Možnosť `sanitize_replacement` je nastavená na `{$replacement}`, ale obsahuje znak, ktorý sa v slugu nedá použiť, takže nemôže slúžiť ako náhrada.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: Možnosť `{$option}` je nastavená na `{$url}`, ale musí to byť absolútna URL začínajúca na `https://` alebo `http://`.
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: Možnosť `stages` v `publish_mode` musí začínať na `draft` a uvádzať fázy v poradí `draft`, `pending_review`, `pending_publish` bez opakovania.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: Možnosť `i18n.locales` musí obsahovať aspoň jeden jazyk.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: Možnosť `default_locale` je nastavená na `{$locale}`, ale tento jazyk nie je medzi `locales`.
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: Možnosť `initial_locales` obsahuje `{$locale}`, ale tento jazyk nie je medzi `locales`.
    # Don’t localize `i18n`
    i18n_no_collections: 'Možnosť `i18n` je nakonfigurovaná na najvyššej úrovni, ale žiadna z kolekcií ani samostatných položiek nemá možnosť `i18n`, takže nemožno prekladať žiadny obsah. Pridajte `i18n: true` do kolekcií a samostatných položiek, ktoré chcete prekladať.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: Možnosť `transformations` obsahuje nepodporovaný kľúč `{$key}`. Musí to byť `raster_image`, `svg` alebo podporovaný formát rastrového obrázka.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: Možnosť `quality` pri transformácii `{$key}` je neplatná. Musí to byť celé číslo od 0 do 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: Možnosť `{$prop}` pri transformácii `{$key}` je neplatná. Musí to byť kladné celé číslo.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: Kolekcia médií {$count} musí mať možnosť `name` definovanú ako neprázdny reťazec.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Názov kolekcie médií `{$name}` je neplatný. Nesmie obsahovať špeciálne znaky.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Názvy kolekcií médií musia byť unikátne, ale `{$name}` sa používa viackrát.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: Kolekcia musí mať definovanú jednu z možností `folder`, `file`, `files` alebo `divider`.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: Kolekcia nemôže mať viac ako jednu z možností `folder`, `file`, `files` a `divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: Prípona `{$extension}` nezodpovedá formátu `{$format}`.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: Pole `{$name}` sa ukladá ako telo pod front matter, ktoré môže obsahovať iba text, nie číslo, logickú hodnotu, zoznam ani objekt, ako to robí pole `{$widget}`. Použite typ poľa, ktorý obsahuje text, alebo pole premenujte.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
    # brackets are escaped with backslashes for MessageFormat 2
    invalid_collection_data_file: Možnosť `file` s hodnotou `{$file}` je neplatná. Musí to byť cesta k súboru JSON bez parametra `\{\{locale\}\}`.
    # {$prop} is the option name; Don’t localize `file`
    unsupported_collection_data_file_option: Možnosť `{$prop}` nie je podporovaná v kolekcii s možnosťou `file`.
    # Don’t localize `file`, `publish_mode` and `simple`
    collection_data_file_workflow: Schvaľovací proces a náhľadový proces vrátane Open Authoring nie sú podporované v kolekcii s možnosťou `file`. Nastavte možnosť `publish_mode` kolekcie na `simple`.
    # {$prop} is the option name; Don’t localize `file` and `slug`. The curly brackets are escaped
    # with backslashes for MessageFormat 2
    collection_data_file_slug_tag: Možnosť `{$prop}` nemôže v kolekcii s možnosťou `file` obsahovať parameter `\{\{slug\}\}`, pretože slug položky je jej poradie, ktoré sa mení pri zmene poradia alebo odstránení položiek. Namiesto toho použite pole s unikátnou hodnotou.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Šablóna slugu `{$slug}` je neplatná, pretože nesmie obsahovať lomky. Ak chcete položky usporiadať do podpriečinkov, použite namiesto `slug` možnosť `path`.
    # {$name} is the field name from the configuration; Don’t localize `identifier_field`
    invalid_identifier_field: Možnosť `identifier_field` odkazuje na `{$name}`, ale v kolekcii nie je definované žiadne také pole.
    # {$name} is the field name from the configuration; Don’t localize `filter`
    invalid_filter_field: Možnosť `filter` odkazuje na `{$name}`, ale v kolekcii nie je definované žiadne také pole.
    # Don’t localize `filter`, `value` and `pattern`
    invalid_filter_no_condition: Možnosť `filter` musí mať možnosť `value` alebo `pattern`, podľa ktorej sa položky porovnávajú.
    # {$option} is an option name such as `slug` or `summary` and {$name} is the field name or template tag from the configuration
    option_field_not_found: Možnosť `{$option}` odkazuje na `{$name}`, ale žiadne také pole nie je definované.
    # {$name} is the field name from the configuration and {$widget} is its field type; Don’t localize `thumbnail`
    thumbnail_field_not_media: Možnosť `thumbnail` odkazuje na `{$name}`, ale musí to byť pole typu Image alebo File, nie pole typu `{$widget}`.
    # Don’t localize `inline` or `multiple`
    invalid_inline_component_fields: Režim `inline` vyžaduje jedno pole typu Boolean, Color, DateTime, Number, Relation, Select alebo String. Pole Relation alebo Select nemôže mať zapnutú možnosť `multiple`.
    # {$option} is an option name such as `pattern` or `filter` and {$pattern} is the configured pattern
    invalid_regex: Možnosť `{$option}` obsahuje neplatný regulárny výraz `{$pattern}`, ktorý sa ignoruje.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: Možnosť `reorder` odkazuje na skupinu zobrazenia s názvom `{$name}`, ale v možnosti `view_groups` nie je definovaná žiadna taká skupina.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit` and `fields`
    invalid_bulk_edit_field: Zoznam `fields` v možnosti `bulk_edit` odkazuje na pole s názvom `{$name}`, ale v kolekcii nie je definované žiadne také pole najvyššej úrovne.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit`, `fields` and `multiple`
    unsupported_bulk_edit_field: Pole `{$name}` v zozname `fields` možnosti `bulk_edit` nemožno upravovať hromadne. Podporované je iba pole typu Boolean, Color, DateTime, Number, Relation, Select alebo String, ktoré nie je iba na čítanie, nemá zapnutú možnosť `multiple` a nenastavuje sa automaticky pri uložení.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: Možnosť `sortable_fields` odkazuje na pole s názvom `{$name}`, ale v kolekcii nie je definované žiadne také pole.
    # Don’t localize `sortable_fields` and `default_sort`
    multiple_sortable_field_defaults: Možnosť `default_sort` môže mať iba jedna položka v možnosti `sortable_fields`.
    # {$option} is `table_columns` or `summary_fields`, and {$name} is the field name from the configuration
    invalid_table_column_field: Možnosť `{$option}` odkazuje na pole s názvom `{$name}`, ale v kolekcii nie je definované žiadne také pole.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: Možnosť `view_groups` odkazuje na pole s názvom `{$name}`, ale v kolekcii nie je definované žiadne také pole.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: Možnosť `view_filters` odkazuje na pole s názvom `{$name}`, ale v kolekcii nie je definované žiadne také pole.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: Skupina zobrazenia {$count} musí mať možnosť `name` definovanú ako neprázdny reťazec.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: Názov skupiny zobrazenia `{$name}` je neplatný. Nesmie obsahovať špeciálne znaky.
    duplicate_view_group_name: Názvy skupín zobrazenia musia byť unikátne, ale `{$name}` sa používa viackrát.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: Filter zobrazenia {$count} musí mať možnosť `name` definovanú ako neprázdny reťazec.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `pattern`, `eq` and `gte`
    invalid_view_filter_no_condition: Filter zobrazenia {$count} musí mať možnosť `pattern` alebo porovnávací operátor, napríklad `eq` alebo `gte`, podľa ktorého sa položky vyfiltrujú.
    # {$name} is the invalid or duplicate view filter name
    invalid_view_filter_name: Názov filtra zobrazenia `{$name}` je neplatný. Nesmie obsahovať špeciálne znaky.
    duplicate_view_filter_name: Názvy filtrov zobrazenia musia byť unikátne, ale `{$name}` sa používa viackrát.
    # {$name} is the default view group name from the configuration; Don’t localize `default` and `view_groups`
    invalid_view_group_default: Možnosť `default` v `view_groups` je nastavená na `{$name}`, ale žiadna skupina zobrazenia nemá taký názov.
    # {$name} is the default view filter name from the configuration; Don’t localize `default` and `view_filters`
    invalid_view_filter_default: Možnosť `default` vo `view_filters` je nastavená na `{$name}`, ale žiadny filter zobrazenia nemá taký názov.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: Kolekcia {$count} musí mať možnosť `name` definovanú ako neprázdny reťazec.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: Názov kolekcie `{$name}` je neplatný. Nesmie obsahovať špeciálne znaky.
    duplicate_collection_name: Názvy kolekcií musia byť unikátne, ale `{$name}` sa používa viackrát.
    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
    missing_collection_file_name: Súbor kolekcie {$count} musí mať možnosť `name` definovanú ako neprázdny reťazec.
    # {$name} is the invalid or duplicate collection file name
    invalid_collection_file_name: Názov súboru kolekcie `{$name}` je neplatný. Nesmie obsahovať špeciálne znaky.
    duplicate_collection_file_name: Názvy súborov kolekcie musia byť unikátne, ale `{$name}` sa používa viackrát.
    # Don’t localize `fields`
    collection_no_fields: Kolekcia musí mať definovanú možnosť `fields` s aspoň jedným poľom.
    # Don’t localize `fields`
    collection_file_no_fields: Súbor kolekcie musí mať definovanú možnosť `fields` s aspoň jedným poľom.
    # Don’t localize `i18n`, `locale` and `folder`
    collection_folder_i18n_required: Kolekcia musí mať definovanú možnosť `i18n`, ak sa v ceste `folder` používa parameter `locale`.
    # {$folder} is the invalid folder path; Don’t localize `locale`, `folder` and the example path. The
    # curly brackets in the example are escaped with backslashes for MessageFormat 2
    invalid_collection_folder_locale: Cesta `folder` s hodnotou `{$folder}` je neplatná. Zástupný symbol `locale` sa musí použiť iba raz ako celý názov priečinka, napríklad `content/\{\{locale\}\}/posts`.
    # Don’t localize `i18n`, `locale` and `file`
