      0   {{ Nie je zadaný žiadny znak. Minimum: {$min}. Maximum: {$max}. }}
      one {{ Zadaný {$count} znak. Minimum: {$min}. Maximum: {$max}. }}
      few {{ Zadané {$count} znaky. Minimum: {$min}. Maximum: {$max}. }}
      *   {{ Zadaných {$count} znakov. Minimum: {$min}. Maximum: {$max}. }}
  # {$count} is the current character count and {$min} is the minimum allowed count
  min: |
    .input {$count :integer}
    .match $count
      0   {{ Nie je zadaný žiadny znak. Minimum: {$min}. }}
      one {{ Zadaný {$count} znak. Minimum: {$min}. }}
      few {{ Zadané {$count} znaky. Minimum: {$min}. }}
      *   {{ Zadaných {$count} znakov. Minimum: {$min}. }}
  # {$count} is the current character count and {$max} is the maximum allowed count
  max: |
    .input {$count :integer}
    .match $count
      0   {{ Nie je zadaný žiadny znak. Maximum: {$max}. }}
      one {{ Zadaný {$count} znak. Maximum: {$max}. }}
      few {{ Zadané {$count} znaky. Maximum: {$max}. }}
      *   {{ Zadaných {$count} znakov. Maximum: {$max}. }}

