# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: Výsledky vyhľadávania
# {$terms} is the current search query text
search_results_for_x: Výsledky vyhľadávania pre „{$terms}“

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Teraz si prezeráte výsledky vyhľadávania pre „{$terms}“. Nenašli sa žiadne položky. }}
    one {{ Teraz si prezeráte výsledky vyhľadávania pre „{$terms}“. Našla sa jedna položka. }}
    few {{ Teraz si prezeráte výsledky vyhľadávania pre „{$terms}“. Našli sa {$count} položky. }}
    *   {{ Teraz si prezeráte výsledky vyhľadávania pre „{$terms}“. Našlo sa {$count} položiek. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Teraz si prezeráte výsledky vyhľadávania pre „{$terms}“. Nenašli sa žiadne médiá. }}
    one {{ Teraz si prezeráte výsledky vyhľadávania pre „{$terms}“. Našlo sa jedno médium. }}
    few {{ Teraz si prezeráte výsledky vyhľadávania pre „{$terms}“. Našli sa {$count} médiá. }}
    *   {{ Teraz si prezeráte výsledky vyhľadávania pre „{$terms}“. Našlo sa {$count} médií. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ Žiadne položky }}
    one {{ {$count} položka }}
    few {{ {$count} položky }}
    *   {{ {$count} položiek }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ Žiadne médiá }}
    one {{ {$count} médium }}
    few {{ {$count} médiá }}
    *   {{ {$count} médií }}

# Empty state messages
no_files_found: Nenašli sa žiadne súbory.
no_entries_found: Nenašli sa žiadne položky.

# ==============================================================================
# Asset Management
# ==============================================================================
# Strings for uploading, editing, and managing assets (images, documents, etc.).

# Upload dialog: title and button label
upload_assets: Nahrať nové médiá

# New Folder button and dialog in the Asset Library
new_folder: Nový priečinok
new_folder_name: Názov priečinka
new_folder_create: Vytvoriť
# {$folder} is the path of the folder the new one will be created in, starting with a slash
new_folder_description: Nový priečinok sa vytvorí v priečinku „{$folder}“.
# Validation errors for the new folder name
new_folder_error:
  empty: Názov priečinka nemôže byť prázdny.
  invalid: Názov priečinka nemôže obsahovať lomky ani začínať bodkou.
  duplicate: Priečinok alebo súbor s týmto názvom tu už existuje.
# Progress and error messages while the folder is being created
creating_folder: Vytvára sa priečinok…
creating_folder_failed: Priečinok sa nepodarilo vytvoriť.

# Menu on a folder in the Asset Library, and the Rename Folder and Delete Folder dialogs
folder_options: Možnosti priečinka
show_folder_options: Zobraziť možnosti priečinka
rename_folder: Premenovať priečinok
delete_folder: Odstrániť priečinok
# Rename Folder dialog body text
# {$count} is the number of assets in the folder, which are moved along with it
enter_new_name_for_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Nižšie zadajte nový názov. }}
    one {{ Nižšie zadajte nový názov. Médium v priečinku sa presunie spolu s ním a všetky položky, ktoré ho používajú, sa aktualizujú. }}
    few {{ Nižšie zadajte nový názov. {$count} médiá v priečinku sa presunú spolu s ním a všetky položky, ktoré ich používajú, sa aktualizujú. }}
    *   {{ Nižšie zadajte nový názov. {$count} médií v priečinku sa presunie spolu s ním a všetky položky, ktoré ich používajú, sa aktualizujú. }}
# Rename Folder dialog body text for a cloud storage service, whose files are hotlinked from the
# entries, so a move changes the URLs and the entries aren’t updated
enter_new_name_for_external_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Nižšie zadajte nový názov. }}
    one {{ Nižšie zadajte nový názov. Súbor v priečinku sa presunie spolu s ním a jeho URL sa zmení, preto aktualizujte všetky položky, ktoré ho používajú. }}
    few {{ Nižšie zadajte nový názov. {$count} súbory v priečinku sa presunú spolu s ním a ich URL sa zmenia, preto aktualizujte všetky položky, ktoré ich používajú. }}
    *   {{ Nižšie zadajte nový názov. {$count} súborov v priečinku sa presunie spolu s ním a ich URL sa zmenia, preto aktualizujte všetky položky, ktoré ich používajú. }}
# Delete Folder confirmation
# {$name} is the folder name and {$count} is the number of assets in the folder
confirm_deleting_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Naozaj chcete odstrániť prázdny priečinok „{$name}“? }}
    one {{ Naozaj chcete odstrániť priečinok „{$name}“ aj s médiom, ktoré obsahuje? }}
    few {{ Naozaj chcete odstrániť priečinok „{$name}“ aj s {$count} médiami, ktoré obsahuje? }}
    *   {{ Naozaj chcete odstrániť priečinok „{$name}“ aj s {$count} médiami, ktoré obsahuje? }}
# Progress and error messages while the folder is being renamed or deleted
renaming_folder: Premenúva sa priečinok…
renaming_folder_failed: Priečinok sa nepodarilo premenovať.
deleting_folder: Odstraňuje sa priečinok…
deleting_folder_failed: Priečinok sa nepodarilo odstrániť.

# Edit options menu: button and item labels
edit_options: Možnosti úprav
show_edit_options: Zobraziť možnosti úprav
# Copy menu aria-label
copy_options: Možnosti kopírovania
# Edit menu items with specific asset names
edit_asset: Upraviť médium
# {$name} is the selected asset name
edit_x: Upraviť {$name}

# Asset text editor: switch for line wrapping
wrap_long_lines: Zalamovať dlhé riadky

# Rename asset: dialog and validation
rename_asset: Premenovať médium
# {$name} is the current asset name
rename_x: Premenovať {$name}
# Dialog body text indicating how many entries reference this asset
# {$count} is the number of entries that currently reference the asset
enter_new_name_for_asset: |
  .input {$count :integer}
  .match $count
    0   {{ Nižšie zadajte nový názov. }}
    one {{ Nižšie zadajte nový názov. Aktualizuje sa aj položka, ktorá toto médium používa. }}
    few {{ Nižšie zadajte nový názov. Aktualizujú sa aj {$count} položky, ktoré toto médium používajú. }}
    *   {{ Nižšie zadajte nový názov. Aktualizuje sa aj {$count} položiek, ktoré toto médium používajú. }}
# Validation errors for asset renaming
enter_new_name_for_asset_error:
  empty: Názov súboru nemôže byť prázdny.
  character: Názov súboru nemôže obsahovať špeciálne znaky.
  duplicate: Tento názov súboru už používa iné médium.
# Confirmation dialog shown when the file extension is changed while renaming an asset
change_file_extension: Zmeniť príponu súboru
# {$oldExtension} and {$newExtension} are file extensions without a leading dot, e.g. png
confirm_file_extension_change:
  change: Naozaj chcete zmeniť príponu z „.{$oldExtension}“ na „.{$newExtension}“?
  add: Naozaj chcete pridať príponu „.{$newExtension}“?
  remove: Naozaj chcete odobrať príponu „.{$oldExtension}“?
file_extension_change_warning: Ak prípona nezodpovedá skutočnému formátu súboru, súbor sa nemusí zobraziť alebo spracovať správne.

# Replace asset: menu item and dialog title
replace_asset: Nahradiť médium
# {$name} is the asset being replaced
replace_x: Nahradiť {$name}
# File/Image field: labels of the Replace and Remove buttons
replace_file: Nahradiť súbor
replace_image: Nahradiť obrázok
remove_file: Odobrať súbor
remove_image: Odobrať obrázok

# File selection prompts: drop zones and file pickers
# Browse prompt shown when drag-and-drop is unavailable on desktop and pointer devices
click_to_browse: Kliknite a prehľadávajte…
# Browse prompt shown on touch devices
tap_to_browse: Ťuknite a prehľadávajte…
# Drop zone text with browse button
# {$count} is the number of files expected by the current picker mode
drop_files_or_click_to_browse: |
  .input {$count :integer}
  .match $count
    one {{ Presuňte sem súbor alebo kliknite a prehľadávajte… }}
    *   {{ Presuňte sem súbory alebo kliknite a prehľadávajte… }}
# Partial drop zone text (ends with inline button)
# {$count} is the number of files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Presuňte sem súbor alebo }}
    *   {{ Presuňte sem súbory alebo }}
# Image-specific drop zone text
# {$count} is the number of image files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_image_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Presuňte sem obrázok alebo }}
    *   {{ Presuňte sem obrázky alebo }}

# File picker and clipboard actions used by upload controls
browse: Prehľadávať
# Generic clipboard paste action used by non-image file fields
paste: Vložiť
# Clipboard paste action used by image fields
paste_image: Vložiť obrázok

# Clipboard paste errors
no_image_in_clipboard: V schránke sa nenašiel žiadny obrázok.
clipboard_access_denied: Prístup k schránke bol zamietnutý.

# Drag-and-drop overlay text (shown while dragging)
# {$count} is the number of files expected by the current picker mode
drop_files_here: |
  .input {$count :integer}
  .match $count
    one {{ Presuňte súbor sem }}
    *   {{ Presuňte súbory sem }}

# File type validation errors
unsupported_file_type: Nepodporovaný typ súboru
# {$type} is the expected asset type label, such as image or document
dropped_file_type_mismatch: 'Presunutý súbor nie je žiadneho z týchto typov: {$types}. Skúste to znova.'
dropped_image_type_mismatch: 'Presunutý súbor nie je podporovaný. Prijímajú sa iba obrázky týchto typov: {$types}. Skúste to znova.'

# File chooser button label
# {$count} is the number of files the picker allows the user to choose
choose_files: |
  .input {$count :integer}
  .match $count
    one {{ Vybrať súbor }}
    *   {{ Vybrať súbory }}

# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    one {{ Odstrániť médium }}
    *   {{ Odstrániť médiá }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Odstrániť vybrané médium }}
    *   {{ Odstrániť vybrané médiá }}
confirm_deleting_this_asset: Naozaj chcete odstrániť toto médium?
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Naozaj chcete odstrániť vybrané médium? }}
    few {{ Naozaj chcete odstrániť {$count} vybrané médiá? }}
    *   {{ Naozaj chcete odstrániť {$count} vybraných médií? }}
confirm_deleting_all_assets: Naozaj chcete odstrániť všetky médiá?
# Note added to the confirmation when entries use the assets being deleted; the references are
# removed in the same commit. {$count} is the number of entries using them
deleting_referenced_assets_note: |
  .input {$count :integer}
  .match $count
    one {{ Odstráni sa aj odkaz naň v jednej položke. }}
    few {{ Odstránia sa aj odkazy naň v {$count} položkách. }}
    *   {{ Odstránia sa aj odkazy naň v {$count} položkách. }}
# Shown in place of the confirmation when removing the references would leave a field in an entry
# invalid, e.g. a required Image field with nothing left, so the deletion is refused. The fields are
# listed below the message, each with the validation error it would have. {$count} is the number of
# assets being deleted
cannot_delete_referenced_assets: |
  .input {$count :integer}
  .match $count
    one {{ Toto médium nie je možné odstrániť, pretože nasledujúce polia v položkách, ktoré ho používajú, by bez neho už neboli platné. Najprv tieto položky upravte. }}
    *   {{ Tieto médiá nie je možné odstrániť, pretože nasledujúce polia v položkách, ktoré ich používajú, by bez nich už neboli platné. Najprv tieto položky upravte. }}

# Delete entries: dialog titles and confirmation messages
# {$count} is the number of entries targeted by the action
delete_entries: |
  .input {$count :integer}
  .match $count
    one {{ Odstrániť položku }}
    *   {{ Odstrániť položky }}
# {$count} is the number of selected entries
delete_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Odstrániť vybranú položku }}
    *   {{ Odstrániť vybrané položky }}
confirm_deleting_this_entry: Naozaj chcete odstrániť túto položku?
confirm_deleting_this_entry_with_assets: Naozaj chcete odstrániť túto položku a súvisiace médiá?
# Error notification shown when an entry could not be deleted
deleting_entry_failed: Položku sa nepodarilo odstrániť. Skúste to znova.
# {$count} is the number of selected entries
confirm_deleting_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Naozaj chcete odstrániť vybranú položku? }}
    few {{ Naozaj chcete odstrániť {$count} vybrané položky? }}
    *   {{ Naozaj chcete odstrániť {$count} vybraných položiek? }}
# {$count} is the number of selected entries whose associated assets would also be removed
confirm_deleting_selected_entries_with_assets: |
  .input {$count :integer}
  .match $count
    one {{ Naozaj chcete odstrániť vybranú položku a súvisiace médiá? }}
    few {{ Naozaj chcete odstrániť {$count} vybrané položky a súvisiace médiá? }}
    *   {{ Naozaj chcete odstrániť {$count} vybraných položiek a súvisiace médiá? }}
confirm_deleting_all_entries: Naozaj chcete odstrániť všetky položky?
confirm_deleting_all_entries_with_assets: Naozaj chcete odstrániť všetky položky a súvisiace médiá?
# Note added to the confirmation when other entries reference the entries being deleted through
# Relation fields; the references are removed in the same commit. {$count} is the number of
# referencing entries
deleting_referenced_entries_note: |
  .input {$count :integer}
  .match $count
    one {{ Odstráni sa aj odkaz naň v inej položke. }}
    few {{ Odstránia sa aj odkazy naň v {$count} ďalších položkách. }}
    *   {{ Odstránia sa aj odkazy naň v {$count} ďalších položkách. }}
# Shown in place of the confirmation when removing the references would leave a Relation field in
# another entry invalid, e.g. a required field with nothing selected, so the deletion is refused.
# The fields are listed below the message, each with the validation error it would have. {$count}
# is the number of entries being deleted
cannot_delete_referenced_entries: |
  .input {$count :integer}
  .match $count
    one {{ Túto položku nie je možné odstrániť, pretože nasledujúce polia v iných položkách by bez nej už neboli platné. Najprv tieto položky upravte. }}
    *   {{ Tieto položky nie je možné odstrániť, pretože nasledujúce polia v iných položkách by bez nich už neboli platné. Najprv tieto položky upravte. }}

# ==============================================================================
# Entry Reordering
# ==============================================================================
# Strings for manually reordering entries via drag-and-drop.

# Reorder mode: toggle buttons
reorder_entries: Zmeniť poradie položiek
done_reordering_entries: Dokončiť zmenu poradia
cancel_reordering_entries: Zrušiť zmenu poradia

# Reorder error message
saving_reorder_failed: Nové poradie položiek sa nepodarilo uložiť. Skúste to znova.

# ==============================================================================
# File Upload and Processing
# ==============================================================================
# Strings for file upload dialogs, progress indicators, and validation.

# Processing indicator shown during file preparation
# {$count} is the number of files currently being processed
processing_files: |
  .input {$count :integer}
  .match $count
    one {{ Spracúva sa súbor. Môže to chvíľu trvať. }}
    *   {{ Spracúvajú sa súbory. Môže to chvíľu trvať. }}

# Uploading section aria-label
uploading_files: Nahrávanie súborov

# Replace file confirmation
# Dialog body when replacing an existing file
# {$name} is the existing file name that will be replaced
confirm_replacing_file: 'Súbor „{$name}“ bude nahradený týmto súborom:'

# Upload confirmation with destination folder
# {$folder} is the destination folder label and {$count} is the number of files being uploaded
confirm_uploading_files: |
  .input {$count :integer}
  .match $count
    one {{ Tento súbor sa uloží do priečinka „{$folder}“: }}
    few {{ Tieto {$count} súbory sa uložia do priečinka „{$folder}“: }}
    *   {{ Týchto {$count} súborov sa uloží do priečinka „{$folder}“: }}

# File size validation
# Warning section for files exceeding size limits
oversized_files: Príliš veľké súbory
# {$size} is the maximum allowed file size and {$count} is the number of oversized files
warning_oversized_files: |
  .input {$count :integer}
  .match $count
    one {{ Tento súbor nie je možné nahrať, pretože prekračuje maximálnu veľkosť {$size}. Zmenšite ho alebo vyberte iný súbor. }}
    *   {{ Tieto súbory nie je možné nahrať, pretože prekračujú maximálnu veľkosť {$size}. Zmenšite ich alebo vyberte iné súbory. }}

# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: Neplatné súbory
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    one {{ Tento súbor nie je možné nahrať, pretože je poškodený alebo jeho obsah nezodpovedá jeho prípone. Často sa to stáva, keď sa fotografia namiesto konverzie len premenuje, napríklad obrázok HEIC uložený ako súbor JPEG. Skonvertujte súbor a skúste to znova. }}
    *   {{ Tieto súbory nie je možné nahrať, pretože sú poškodené alebo ich obsah nezodpovedá ich príponám. Často sa to stáva, keď sa fotografie namiesto konverzie len premenujú, napríklad obrázky HEIC uložené ako súbory JPEG. Skonvertujte súbory a skúste to znova. }}

# File format validation when replacing an asset
# Warning section for replacement files that are in a different format
mismatched_files: Súbory v inom formáte
# {$name} is the name of the asset being replaced and {$count} is the number of mismatched files
warning_mismatched_files: |
  .input {$count :integer}
  .match $count
    one {{ Tento súbor nemôže nahradiť „{$name}“, pretože je v inom formáte. Skonvertujte súbor do rovnakého formátu a skúste to znova. }}
    *   {{ Tieto súbory nemôžu nahradiť „{$name}“, pretože sú v inom formáte. Skonvertujte súbory do rovnakého formátu a skúste to znova. }}

# File name conflict resolution
# {$count} is the number of conflicting file names in the target folder
file_name_conflict_confirmation: |
  .input {$count :integer}
  .match $count
    one {{ Súbor s rovnakým názvom už v tomto priečinku existuje. Chcete ho nahradiť? }}
    few {{ V tomto priečinku už existujú {$count} súbory s rovnakými názvami. Chcete ich nahradiť? }}
    *   {{ V tomto priečinku už existuje {$count} súborov s rovnakými názvami. Chcete ich nahradiť? }}
# {$name} is the conflicting file name when there is exactly one conflict; {$count} is the total conflict count
file_name_conflict_confirmation_with_name: |
  .input {$count :integer}
  .input {$name :string}
  .match $count
    one {{ Súbor s názvom „{$name}“ už v tomto priečinku existuje. Chcete ho nahradiť? }}
    few {{ V tomto priečinku už existujú {$count} súbory s rovnakými názvami. Chcete ich nahradiť? }}
    *   {{ V tomto priečinku už existuje {$count} súborov s rovnakými názvami. Chcete ich nahradiť? }}
file_name_conflict_resolution: Riešenie konfliktu názvov súborov
# Option to keep both files (rename the new one)
keep_both: Ponechať oba

# Upload progress and error messages
uploading_files_progress: Nahrávanie…
uploading_files_failed: Nahrávanie zlyhalo.
# Errors shown when a file on a cloud storage service could not be deleted or renamed
deleting_assets_failed: Odstránenie zlyhalo.
renaming_asset_failed: Premenovanie zlyhalo.

# File metadata display
# Appended when a file was auto-converted (e.g., HEIF to JPEG)
# {$type} is the original file type before conversion
file_meta_converted_from_x: (skonvertované z {$type})

# ==============================================================================
# Entry Management
# ==============================================================================
# Strings for creating and managing entries in collections

# Empty state messages
no_entries_created: Táto kolekcia zatiaľ nemá žiadne položky.
# Button to create first entry
create_new_entry: Vytvoriť novú položku
# “Entry” option label in the create button menu
entry: Položka

# Special entry types
# Fallback label for collection index files when no custom label is configured
index_file: Indexový súbor

# Empty state for file collections
no_files_in_collection: V tejto kolekcii nie sú k dispozícii žiadne súbory.

# Entry duplication
duplicate_entry: Duplikovať položku
entry_duplicated: Položka bola duplikovaná ako nový koncept.

# Validation errors
# Toast shown when entry has validation errors preventing save
# {$count} is the number of fields with validation errors
entry_validation_errors: |
  .input {$count :integer}
  .match $count
    one {{ Jedno pole obsahuje chybu. Ak chcete položku uložiť, opravte ju. }}
    few {{ {$count} polia obsahujú chyby. Ak chcete položku uložiť, opravte ich. }}
    *   {{ {$count} polí obsahuje chyby. Ak chcete položku uložiť, opravte ich. }}
# Button on the validation error toast that opens the Validation panel listing the errors
show_errors: Zobraziť chyby

# ==============================================================================
# Success Notifications
# ==============================================================================
# Toast notifications shown after successful operations.

# Entry operations
# {$count} is the number of entries affected by the operation
entry_saved: |
  .input {$count :integer}
  .match $count
    one {{ Položka bola uložená. }}
    few {{ {$count} položky boli uložené. }}
    *   {{ {$count} položiek bolo uložených. }}
