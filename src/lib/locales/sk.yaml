# ==============================================================================
# Common Actions
# ==============================================================================
# Generic action button labels used throughout the application. These are
# reusable strings for common operations like save, delete, cancel, etc.

# Primary actions: creation, selection, and file operations
create: Vytvoriť
select: Vybrať
select_all: Vybrať všetko
# Accessible name of the checkbox that selects a single entry or asset in a list
select_item: Vybrať {$name}
upload: Nahrať
copy: Kopírovať
download: Stiahnuť
duplicate: Duplikovať
delete: Odstrániť
reorder: Zmeniť poradie

# Dialog and form actions: confirmation and cancellation
cancel: Zrušiť
done: Hotovo
save: Uložiť
# Progress indicator shown on the save button while a save operation is in progress
saving: Ukladá sa…

# Publishing actions: used when committing changes to the repository
publish: Publikovať
# Progress indicator shown on the publish button during publishing
publishing: Publikuje sa…

# Modification actions: editing and updating content
rename: Premenovať
update: Aktualizovať
replace: Nahradiť

# List and collection actions: adding and removing items
add: Pridať
remove: Odobrať
clear: Vymazať

# Expansion and collapse actions: used for accordions, trees, and expandable sections
expand: Rozbaliť
expand_all: Rozbaliť všetko
collapse: Zbaliť
collapse_all: Zbaliť všetko

# Content manipulation: inserting, restoring, and discarding
insert: Vložiť
restore: Obnoviť
discard: Zahodiť

# ==============================================================================
# Common UI Elements
# ==============================================================================
# Reusable labels and messages for common interface elements like status
# indicators, loading states, and toolbar regions.

# Status messages: search and results indicators
# Shown in ARIA live regions during search operations
searching: Vyhľadáva sa…
no_results: Nenašli sa žiadne výsledky.

# Toolbar region labels: used as aria-labels for different toolbar areas
# These help screen readers identify which toolbar is being navigated
global: Globálny
primary: Hlavný
secondary: Sekundárny
collection: Kolekcia
folder: Priečinok
# Label of the subfolder list in the asset picker
folders: Priečinky
# Menu in a breadcrumb holding the folders that don’t fit
more_folders: Ďalšie priečinky

# ==============================================================================
# Miscellaneous Labels
# ==============================================================================
# Various labels used across the application for specific UI elements
# that don’t fit into other categories.

# Field and input labels
api_key: API kľúč
details: Podrobnosti
back: Späť
# Reusable label for an option whose value is determined automatically, e.g. the UI language
automatic: Automaticky
# Loading indicator shown during async operations (asset preview, panels, etc.)
loading: Načítava sa…
# Dismiss button for temporary notifications and infobars
later: Neskôr

# Entry and collection labels
# Slug field heading in entry editors
slug: Slug
# Fallback labels for singleton collections when names aren’t configured
singleton: Samostatná položka
singletons: Samostatné položky

# Error messages
# Toast notification when clipboard operations fail
clipboard_error: Nepodarilo sa skopírovať do schránky.

# ==============================================================================
# Sign-In Page
# ==============================================================================
# Strings specific to the authentication and sign-in page, including welcome
# messages, loading states, OAuth flows, and repository access options.

# Welcome and branding
# Screen reader announcement when the sign-in page loads
# {$name} is the app title shown on the sign-in screen, Sveltia CMS by default
welcome_message: Vitajte v aplikácii {$name}
# Footer text with CMS branding
# {$name} is the CMS brand name shown in the footer, Sveltia CMS by default
powered_by: Beží na {$name}

# Shown during initial configuration and data loading
loading_cms_config: Načítava sa konfigurácia CMS…
loading_site_data: Načítavajú sa údaje webu…
loading_site_data_error: Pri načítavaní údajov webu sa vyskytla chyba.

# OAuth and token authentication
# Primary sign-in button label for OAuth providers (GitHub, GitLab, etc.)
# {$service} is the sign-in provider label, such as GitHub or GitLab
sign_in_with_x: Prihlásiť sa cez {$service}

# Access token dialog: alternative authentication method
sign_in_using_access_token: Prihlásiť sa pomocou prístupového tokenu
sign_in_using_access_token_description: Nižšie zadajte svoj token. Musí mať prístup na čítanie a zápis k obsahu repozitára.
# Shown after the description above when Editorial Workflow is enabled, which opens and merges pull requests
sign_in_using_access_token_workflow_note: Keďže je zapnutý schvaľovací proces, musí mať prístup na čítanie a zápis aj k pull requestom.
# Inline link text with embedded HTML anchor tag
# {$service} is the provider name whose user settings page contains the token generator, e.g., GitHub or GitLab
sign_in_using_access_token_link: Token môžete vygenerovať na <a>stránke používateľských nastavení služby {$service}</a>.
# Input field label for personal access token
personal_access_token: Osobný prístupový token

# Authentication progress indicators
authorizing: Prebieha autorizácia…
signing_in: Prebieha prihlasovanie…

# Local and test repository options
# Button label and description for working with a local Git repository
work_with_local_repo: Pracovať s lokálnym repozitárom
# {$repo} is the configured repository name shown when it is available
work_with_local_repo_description: Po výzve vyberte koreňový priečinok repozitára „{$repo}“.
work_with_local_repo_description_no_repo: Po výzve vyberte koreňový priečinok svojho Git repozitára.
# Button label for demo/test repository
work_with_test_repo: Pracovať s testovacím repozitárom

# Authentication errors
# Error messages shown during sign-in failures
sign_in_error:
  not_project_root: Vybraný priečinok nie je koreňovým priečinkom repozitára. Skúste to znova.
  picker_dismissed: Koreňový priečinok repozitára sa nepodarilo vybrať. Skúste to znova.
  authentication_aborted: Overenie bolo prerušené. Skúste to znova.
  invalid_token: Zadaný token je neplatný. Skontrolujte ho a skúste to znova.
  # OAuth and authenticator errors (shown with error codes) — keys are defined in the Sveltia CMS Authenticator library
  UNSUPPORTED_BACKEND: Autentifikátor nepodporuje váš Git backend.
  UNSUPPORTED_DOMAIN: Vaša doména nemá povolené používať autentifikátor.
  MISCONFIGURED_CLIENT: ID klienta alebo tajný kľúč aplikácie OAuth nie je nakonfigurovaný.
  AUTH_CODE_REQUEST_FAILED: Nepodarilo sa získať autorizačný kód. Skúste to neskôr.
  CSRF_DETECTED: Zistil sa možný útok CSRF. Proces overenia bol prerušený.
  TOKEN_REQUEST_FAILED: Nepodarilo sa vyžiadať prístupový token. Skúste to neskôr.
  TOKEN_REFRESH_FAILED: Nepodarilo sa obnoviť prístupový token. Skúste to neskôr.
  MALFORMED_RESPONSE: Server odpovedal chybne formátovanými údajmi. Skúste to neskôr.

# Backend and repository validation errors
# Shown when the configured backend or repository is invalid or inaccessible
# {$name} is the backend display name like Forgejo and {$version} is the minimum supported version
backend_unsupported_version: Backend {$name} vyžaduje {$name} vo verzii {$version} alebo novšej.
# {$repo} is the repository identifier, typically in owner/repo format
repository_no_access: Nemáte prístup k repozitáru „{$repo}“.
repository_not_found: Repozitár „{$repo}“ neexistuje.
repository_empty: Repozitár „{$repo}“ nemá žiadne vetvy.
# {$repo} is the repository identifier, and {$branch} is the configured branch name
branch_not_found: Repozitár „{$repo}“ nemá vetvu „{$branch}“.

# General errors
# Fallback error dialog title for unexpected errors
unexpected_error: Neočakávaná chyba

# Entry file parsing errors
# Toast notification when entry files fail to parse on initial load
# {$count} is the number of entry files that failed to parse
entry_parse_errors: |
  .input {$count :integer}
  .match $count
    one {{ Pri spracovaní súboru položky sa vyskytla chyba. Podrobnosti nájdete v konzole prehliadača. }}
    *   {{ Pri spracovaní súborov položiek sa vyskytli chyby. Podrobnosti nájdete v konzole prehliadača. }}

# ==============================================================================
# Authentication and Account
# ==============================================================================
# These strings are used for sign-in, account management, and authentication
# flows throughout the application.

# Sign-in page and external assets panel: credential input field aria-labels
username: Používateľské meno
password: Heslo

# Sign-in actions: primary button labels and account menu items
# Used on the sign-in page and in confirmation dialogs for external assets
sign_in: Prihlásiť sa

# Mobile sign-in feature: dialog title and instructions for QR code authentication
sign_in_with_mobile: Prihlásiť sa cez mobil
# Instructions shown in the mobile sign-in dialog for passwordless authentication
sign_in_with_mobile_instruction: Na prihlásenie bez hesla naskenujte QR kód nižšie telefónom alebo tabletom. Vaše nastavenia sa automaticky skopírujú.
# Confirmation dialog shown when the CMS is opened with a sign-in link from the mobile sign-in
