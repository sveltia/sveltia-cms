# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: Toto pole je povinné.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: Dátum a čas nemôžu byť skôr ako {$min}.
    date: Dátum nemôže byť skôr ako {$min}.
    time: Čas nemôže byť skôr ako {$min}.
    number: Hodnota musí byť väčšia alebo rovná {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Musíte vybrať aspoň {$min} možnosť. }}
        few {{ Musíte vybrať aspoň {$min} možnosti. }}
        *   {{ Musíte vybrať aspoň {$min} možností. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Musíte pridať aspoň {$min} položku. }}
        few {{ Musíte pridať aspoň {$min} položky. }}
        *   {{ Musíte pridať aspoň {$min} položiek. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: Dátum a čas nemôžu byť neskôr ako {$max}.
    date: Dátum nemôže byť neskôr ako {$max}.
    time: Čas nemôže byť neskôr ako {$max}.
    number: Hodnota musí byť menšia alebo rovná {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ Nemôžete vybrať viac ako {$max} možnosť. }}
        few {{ Nemôžete vybrať viac ako {$max} možnosti. }}
        *   {{ Nemôžete vybrať viac ako {$max} možností. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ Nemôžete pridať viac ako {$max} položku. }}
        few {{ Nemôžete pridať viac ako {$max} položky. }}
        *   {{ Nemôžete pridať viac ako {$max} položiek. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Musíte zadať aspoň {$min} znak. }}
      few {{ Musíte zadať aspoň {$min} znaky. }}
      *   {{ Musíte zadať aspoň {$min} znakov. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ Nemôžete zadať viac ako {$max} znak. }}
      few {{ Nemôžete zadať viac ako {$max} znaky. }}
      *   {{ Nemôžete zadať viac ako {$max} znakov. }}

  # Type validation errors
  type_mismatch:
    number: Zadajte číslo.
    email: Zadajte platnú e-mailovú adresu.
    url: Zadajte platnú URL.

  # Custom field validation error
  invalid_value: Neplatná hodnota.
  unexpected_error: Vyskytla sa neočakávaná chyba.

