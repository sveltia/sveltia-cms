# ==============================================================================
# Entry and Collection Actions
# ==============================================================================
# Strings related to creating, editing, and managing entries and collections.

# Message shown while entries are still being retrieved: in the entry editor, when it was opened
# with a direct link before all the data has been loaded, and on the Editorial Workflow page while
# the pull requests are being fetched. {$count} selects the form
loading_entries: |
  .input {$count :integer}
  .match $count
    one {{ Načítava sa položka… }}
    *   {{ Načítavajú sa položky… }}
# Error message when entry cannot be found
entry_not_found: Položka sa nenašla.

# Entry creation restrictions: tooltip and advisory messages
creating_entries_disabled_by_admin: Vytváranie nových položiek v tejto kolekcii zakázal správca.
# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: |
  .input {$quota :integer}
  .match $quota
    one {{ Do tejto kolekcie nemôžete pridať nové položky, pretože dosiahla svoj limit {$quota} položky. }}
    few {{ Do tejto kolekcie nemôžete pridať nové položky, pretože dosiahla svoj limit {$quota} položiek. }}
    *   {{ Do tejto kolekcie nemôžete pridať nové položky, pretože dosiahla svoj limit {$quota} položiek. }}
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$quota :integer}
  .input {$remaining :integer}
  .match $quota $remaining
    one one {{ Táto kolekcia sa blíži k svojmu limitu {$quota} položky. Môžete vytvoriť už len {$remaining} položku. }}
    one few {{ Táto kolekcia sa blíži k svojmu limitu {$quota} položky. Môžete vytvoriť už len {$remaining} položky. }}
    one *   {{ Táto kolekcia sa blíži k svojmu limitu {$quota} položky. Môžete vytvoriť už len {$remaining} položiek. }}
    few one {{ Táto kolekcia sa blíži k svojmu limitu {$quota} položiek. Môžete vytvoriť už len {$remaining} položku. }}
    few few {{ Táto kolekcia sa blíži k svojmu limitu {$quota} položiek. Môžete vytvoriť už len {$remaining} položky. }}
    few *   {{ Táto kolekcia sa blíži k svojmu limitu {$quota} položiek. Môžete vytvoriť už len {$remaining} položiek. }}
    *   one {{ Táto kolekcia sa blíži k svojmu limitu {$quota} položiek. Môžete vytvoriť už len {$remaining} položku. }}
    *   few {{ Táto kolekcia sa blíži k svojmu limitu {$quota} položiek. Môžete vytvoriť už len {$remaining} položky. }}
    *   *   {{ Táto kolekcia sa blíži k svojmu limitu {$quota} položiek. Môžete vytvoriť už len {$remaining} položiek. }}

# Read-only restrictions set with the `readonly` option: advisory messages
readonly_cms: CMS je v režime iba na čítanie. Obsah a médiá si môžete prezerať, ale nemôžete robiť žiadne zmeny.
readonly_collection: Táto kolekcia je iba na čítanie. Jej obsah si môžete prezerať, ale nemôžete robiť žiadne zmeny.
readonly_entry: Táto položka je iba na čítanie. Môžete si ju prezerať, ale nemôžete robiť žiadne zmeny.
readonly_asset_folder: Tento priečinok je iba na čítanie. Jeho médiá si môžete prezerať, ale nemôžete robiť žiadne zmeny.
readonly_branch: Nemáte oprávnenie odosielať zmeny do vetvy „{$branch}“. Tento obsah si môžete prezerať, ale nemôžete robiť žiadne zmeny.
readonly_reference: Položka je iba na čítanie, preto odkaz nemožno odobrať.
# {$entries} is a comma-separated list of entries, each shown as “Collection › Entry”
cannot_rename_referenced_entry: 'Túto položku nemožno premenovať, pretože by bolo potrebné upraviť odkazy na ňu v týchto položkách, ktoré sa nedajú upravovať: {$entries}.'
# {$entries} is a comma-separated list of entries, each shown as “Collection › Entry”
cannot_move_referenced_asset: 'Toto médium nemožno presunúť ani premenovať, pretože by bolo potrebné upraviť odkazy naň v týchto položkách, ktoré sa nedajú upravovať: {$entries}.'

# Navigation: back links and list labels
back_to_collection: Späť na kolekciu
collection_list: Zoznam kolekcií
back_to_collection_list: Späť na zoznam kolekcií
asset_folder_list: Zoznam priečinkov médií
back_to_asset_folder_list: Späť na zoznam priečinkov médií
