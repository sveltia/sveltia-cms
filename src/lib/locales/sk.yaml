# ==============================================================================
# Content and Asset Libraries
# ==============================================================================
# Strings used in the main content and asset management interfaces, including
# lists, navigation, and collection/folder views.

# Page container aria-labels
content_library: Knižnica obsahu
asset_library: Knižnica médií

# Primary sidebar section headings and list aria-labels
collections: Kolekcie
entries: Položky
files: Súbory

# Asset location selector: option group labels
asset_location:
  # Assets stored in the site’s Git repository
  repository: Váš web
  external: Externé úložiská
  stock_photos: Fotobanky

# Sidebar and list labels
# Collection assets panel aria-label
collection_assets: Médiá kolekcie
# List aria-labels for different list types
entry_list: Zoznam položiek
file_list: Zoznam súborov
asset_list: Zoznam médií

# Collection and folder page titles
# Used as aria-labels on page containers
# {$collection} is the current collection label
x_collection: Kolekcia {$collection}
# {$folder} is the current asset folder label
x_asset_folder: Priečinok médií {$folder}

# Navigation announcements (ARIA live regions)
# Announce page changes for screen reader users
viewing_collection_list: Teraz si prezeráte zoznam kolekcií.
viewing_asset_folder_list: Teraz si prezeráte zoznam priečinkov médií.
# Collection view announcements with entry counts
# {$collection} is the collection label and {$count} is the number of entries in it
viewing_x_collection: |
  .input {$count :integer}
  .match $count
    0   {{ Teraz si prezeráte kolekciu „{$collection}“, ktorá zatiaľ neobsahuje žiadne položky. }}
    one {{ Teraz si prezeráte kolekciu „{$collection}“, ktorá obsahuje jednu položku. }}
    few {{ Teraz si prezeráte kolekciu „{$collection}“, ktorá obsahuje {$count} položky. }}
    *   {{ Teraz si prezeráte kolekciu „{$collection}“, ktorá obsahuje {$count} položiek. }}
# Asset folder view announcements with asset counts
# {$folder} is the folder label and {$count} is the number of assets in it
viewing_x_asset_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Teraz si prezeráte priečinok médií „{$folder}“, ktorý zatiaľ neobsahuje žiadne médiá. }}
    one {{ Teraz si prezeráte priečinok médií „{$folder}“, ktorý obsahuje jedno médium. }}
    few {{ Teraz si prezeráte priečinok médií „{$folder}“, ktorý obsahuje {$count} médiá. }}
    *   {{ Teraz si prezeráte priečinok médií „{$folder}“, ktorý obsahuje {$count} médií. }}
# Cloud storage service view announcement
# {$service} is the cloud storage service name, e.g. Uploadcare
viewing_x_external_location: Teraz si prezeráte médiá v službe {$service}.

# Singleton file selection announcement
# {$file} is the singleton file name
singleton_selected_announcement: Stlačením klávesu Enter upravíte súbor „{$file}“.

# Error messages: page, collection, folder or file not found
