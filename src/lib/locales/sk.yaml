  # Data Management panel
  data:
    title: Správa údajov
    clear_data:
      title: Vymazať údaje
      # Clear File Cache button
      file_cache:
        description: Odstrániť obsah súborov a miniatúry obrázkov uložené v lokálnej cache, aby sa uvoľnilo miesto v úložisku alebo vyriešili problémy spôsobené zastaranými údajmi.
        button_label: Vymazať cache súborov
        confirmation: Obsah súborov a miniatúry obrázkov uložené v lokálnej cache sa odstránia. Vaše neuložené koncepty a nastavenia zostanú zachované a odstránené údaje sa podľa potreby znova stiahnu alebo vygenerujú. Po dokončení sa CMS znova načíta.
      # Erase All Data button
      all_data:
        description: Odstrániť všetko, čo CMS uchováva v tomto prehliadači, vrátane súborov v cache, neuložených konceptov a nastavení. Nič, čo je už uložené vo vašom repozitári, nebude ovplyvnené.
        button_label: Vymazať všetky údaje
        confirmation: Všetky údaje uložené v tomto prehliadači sa odstránia vrátane obsahu súborov v cache, miniatúr obrázkov, neuložených konceptov, nastavení a stavu prihlásenia. Váš repozitár nebude ovplyvnený, ale všetky neuložené zmeny sa stratia a budete sa musieť znova prihlásiť. Po dokončení sa CMS znova načíta.

  # Developer panel
  developer:
    title: Pre vývojárov
    developer_mode:
      title: Režim pre vývojárov
      description: Povoliť niektoré funkcie určené pre vývojárov vrátane podrobných záznamov v konzole a natívnych kontextových menu.
      switch_label: Zapnúť režim pre vývojárov
    local_git:
      title: Commity Git
      description: Pri každom uložení commitnite svoje zmeny do aktuálnej vetvy lokálneho repozitára, ako to CMS robí pri práci so vzdialeným repozitárom. Commity potom môžete skontrolovať a odoslať (push) svojimi bežnými nástrojmi Git.
      switch_label: Commitovať zmeny do Gitu
      checking: Kontroluje sa repozitár…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Zmeny sa budú commitovať do vetvy {$branch} ako {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Zmeny teraz nemožno commitnúť. {$reason}
    deploy_hook:
      title: Webhook pre nasadenie (Deploy Hook)
      description: Zadajte URL webhooku, ktorý sa zavolá, keď ručne spustíte nasadenie výberom možnosti Publikovať zmeny. Ak používate GitHub Actions alebo GitLab CI/CD, môžete toto pole nechať prázdne.
      # Hook URL input
      url:
        field_label: URL webhooku
        saved: URL webhooku bola uložená.
        removed: URL webhooku bola odobraná.
      # Authorization header input
      auth:
        field_label: Autorizačná hlavička (napr. Bearer <token>) (voliteľné)
        saved: Autorizačná hlavička bola uložená.
        removed: Autorizačná hlavička bola odobraná.

