    schema_invalid_type: האפשרות `{$option}` חייבת להיות {$type}.
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'האפשרות `{$option}` חייבת להיות אחד מהערכים האלה: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: האפשרות `{$option}` חייבת להיות `{$value}`.
    schema_invalid_empty_value: האפשרות `{$option}` חייבת להיות מחרוזת ריקה.
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: האפשרות `{$option}` חייבת להיות מערך של {$count} פריטים.
    schema_invalid_value: לאפשרות `{$option}` יש ערך לא תקין.
    schema_missing_option: האפשרות `{$option}` נדרשת.
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'אחת מהאפשרויות האלה נדרשת: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: מחרוזת
      number: מספר
      integer: מספר שלם
      boolean: ערך בוליאני
      array: מערך
      object: אובייקט
      'null': ריק

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: לא הוגדר מזהה יישום OAuth. המשתמשים יידרשו לספק אסימון גישה כדי להתחבר.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: האפשרות `{$prop}` אינה נתמכת ב-Sveltia CMS. המערכת תתעלם ממנה.
    # Don’t localize `stages`, `publish_mode`, `editorial_workflow` and {$type}, which is `preview` or `simple`
    publish_mode_stages_ignored: האפשרות `stages` של `publish_mode` חלה רק על מצב הפרסום `editorial_workflow`, ולכן המערכת מתעלמת ממנה עם `{$type}`.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: גם `picker_utc` וגם אפשרויות אזור הזמן החדשות (`input_timezone` או `output_utc`) מוגדרות. לאפשרויות החדשות יש עדיפות. שקלו להסיר את `picker_utc` מהתצורה שלכם.
    # Don’t localize `preview_path`
    preview_path_no_date_field: האפשרות `preview_path` משתמשת בתגי תאריך ושעה, אך לאוסף אין שדה DateTime לקרוא מהם, ולכן קישור התצוגה המקדימה לא יוצג.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: האפשרות `preview_path_date_field` מפנה לשדה בשם `{$name}`, אך לא מוגדר שדה DateTime בשם הזה, ולכן קישור התצוגה המקדימה לא יוצג.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: האפשרות `preview_path` מפנה אל `{$name}`, אך שדה כזה אינו מוגדר באוסף, ולכן קישור התצוגה המקדימה לא יוצג.
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: לאוסף אין שדה `{$name}` שישמש לשמות של פריטים חדשים, ולכן כל פריט חדש מקבל מזהה אקראי. הוסיפו שדה `{$name}`, או הגדירו את האפשרות `identifier_field` או `slug`.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: לאפשרות `i18n` של `slug` אין השפעה, מפני שהאוסף אינו משתמש במבנה ה-i18n מסוג `multiple_files`, `multiple_folders` או `multiple_root_folders`, שבהם לכל שפה יש קובץ משלה.
    # Don’t localize `slug`, `template` and `auto_increment`
    slug_template_ignored: המערכת מתעלמת מהאפשרות `template` של `slug`, מפני שהאפשרות `auto_increment` ממספרת את המזהים במקום זאת.
    # {$file} is the file path; Don’t localize `file`, `locale`, `i18n`, `false`,
    # `omit_default_locale_from_file_path` and the example paths. The curly brackets in the examples
    # are escaped with backslashes for MessageFormat 2
    locale_not_omitted_from_file_path: לא ניתן להסיר את מציין המיקום `locale` מנתיב ה-`file` בערך `{$file}`, ולכן שפת ברירת המחדל נשארת בו למרות אפשרות ה-i18n בשם `omit_default_locale_from_file_path`. כדי להשמיט את השפה, השתמשו במציין המיקום כשם תיקייה שלם, כמו `\{\{locale\}\}/about.md`, או בין שם הקובץ לסיומת, כמו `about.\{\{locale\}\}.md`. כדי להשאיר אותה, הגדירו את האפשרות כ-`false` באפשרות ה-`i18n` של הקובץ.
    # Don’t localize `i18n`
    i18n_not_configured: האפשרות `i18n` מופעלת, אך i18n אינו מוגדר ברמה העליונה של התצורה או באוסף, ולכן לאפשרות אין השפעה.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: האפשרות `public_folder` היא מחרוזת ריקה, ולכן נתיב ה-`media_folder` משמש לנתיבי קובצי המדיה הנשמרים בפריטים במקום זאת. הסירו את האפשרות, או הגדירו אותה לנתיב שברצונכם להשתמש בו, כגון `/images`.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: האפשרות `{$option}` אינה מוגדרת בסכמת התצורה של Sveltia CMS. המערכת תתעלם ממנה. בדקו אם יש שגיאת כתיב או שגיאת תחביר.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'ראו את הערות התאימות לפרטים: {$link}'

  # Console tip shown after config load
  schema_tip: לחוויית פיתוח טובה יותר, אפשר לבדוק את קובץ התצורה שלכם מול סכמת ה-JSON של Sveltia CMS. ראו {$link} לפרטים.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: מקומי
  # Browser compatibility warnings
  unsupported_browser: תהליך העבודה המקומי אינו נתמך בדפדפן שלכם. השתמשו ב-Chrome או ב-Edge במקום זאת.
  disabled: תהליך העבודה המקומי מושבת בדפדפן שלכם. <a>כך מפעילים אותו</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'זהו לוח תהליך העריכה. טיוטות: {$draft}. בבדיקה: {$review}. מוכנים: {$ready}. ממתינים למחיקה: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'זהו לוח תהליך העריכה. טיוטות: {$draft}. בבדיקה: {$review}. ממתינים למחיקה: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'זהו לוח תהליך העריכה. טיוטות: {$draft}. מוכנים: {$ready}. ממתינים למחיקה: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'זהו עמוד הטיוטות. טיוטות: {$draft}. ממתינים למחיקה: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: טיוטה
  drafts: טיוטות
  in_review: בבדיקה
  ready: מוכן
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: ממתין למחיקה
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: בפרסום

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: ביטול המחיקה
  confirm_cancelling_deletion: לבטל את המחיקה? הפריט יישאר מפורסם.
  confirm_completing_deletion: למחוק את הפריט? הוא יוסר מיד.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ הפריט סומן למחיקה. }}
      two {{ שני פריטים סומנו למחיקה. }}
      *   {{ {$count} פריטים סומנו למחיקה. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ השינויים בוטלו. }}
      two {{ השינויים בשני פריטים בוטלו. }}
      *   {{ השינויים ב-{$count} פריטים בוטלו. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: מבטל מחיקה…
  deletion_cancelled: המחיקה בוטלה.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: ביטול המחיקה נכשל. אפשר לנסות שוב.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: ממתינים לפרסום
  published_entries: פורסמו
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'סטטוס: {$status}'
  change_entry_status: שינוי סטטוס
  # Editor toolbar: progress label while the status is being changed
  changing_status: משנה סטטוס…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: מעדכן סטטוס…
  status_updated: הסטטוס עודכן.
  # Error notification when the status could not be changed
  status_change_failed: שינוי הסטטוס נכשל. אפשר לנסות שוב.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: יש שגיאות בפריט. צריך לתקן אותן לפני שינוי הסטטוס.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: יש שגיאות בפריט. צריך לתקן אותן לפני הפרסום.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: שליחה לבדיקה
  confirm_sending_for_review: השינויים נשמרו כטיוטה. לשלוח לבדיקה? זה פותח ענף נפרד ובונה כתובת תצוגה מקדימה, שבה אפשר לראות את השינוי באתר אמיתי לפני שהוא עולה לאוויר. הפרסום נשאר בידיך.
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: סימון כמוכן
  confirm_marking_as_ready: השינויים שלכם נשמרו כטיוטה. לסמן את הפריט כמוכן כדי שניתן יהיה לפרסם אותו?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: פרסום הפריט
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: ביטול השינויים
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: למחוק את הפריט? הוא לא יוסר מהאתר עד שהמחיקה תפורסם. עד אז הוא עדיין יופיע ברשימת הממתינים לפרסום.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: הפריט הזה טרם פורסם, ולכן מחיקתו תבטל אותו לגמרי.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: לפריט הזה יש שינויים שטרם פורסמו. ביטולם יחזיר את הגרסה המפורסמת. הפריט עצמו לא יימחק.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ הוא טרם פורסם, ולכן השינויים שלא פורסמו יבוטלו. גרסה מפורסמת, אם קיימת, תישאר. }}
      *   {{ הם טרם פורסמו, ולכן השינויים שלא פורסמו יבוטלו. גרסאות מפורסמות, אם קיימות, יישארו. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ אחד מהם טרם פורסם, ולכן השינויים שלא פורסמו בו יבוטלו. כל גרסה שפורסמה תישאר מפורסמת. }}
      two {{ שניים מהם טרם פורסמו, ולכן השינויים שלא פורסמו בהם יבוטלו. כל גרסה שפורסמה תישאר מפורסמת. }}
      *   {{ {$count} מהם טרם פורסמו, ולכן השינויים שלא פורסמו בהם יבוטלו. כל גרסה שפורסמה תישאר מפורסמת. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: לפרסם את הפריט הזה? השינויים שלכם יעלו לאוויר לאחר בנייה מחדש של האתר.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: מפרסם…
  entry_published: הפריט פורסם.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: מוחק פריט…
  discarding_changes: מבטל שינויים…
  entry_deleted: הפריט נמחק.
  # Error notification when publishing fails
  publishing_entry_failed: הפרסום נכשל. אפשר לנסות שוב.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: לא ניתן לפרסם כאן את הפריט הזה, מפני שנלווים אליו שינויים נוספים שהמערכת אינה יכולה להציג לכם. בקשו ממפתח לבדוק אותו.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: הפריט שונה מאז שפתחתם אותו. טענו מחדש את העמוד כדי לבדוק את הגרסה האחרונה לפני הפרסום.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: בקשה אחרת ({$number}) כבר פתוחה עבור הפריט הזה מחוץ למערכת. בקשו ממפתח לסגור אותה קודם.
  # Workflow page: empty column message
  no_entries: אין פריטים.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: אפשר לגרור כדי לשנות סטטוס
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: מחיקה

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: תיאור השינוי
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: תארו את השינוי שביצעתם. התיאור נרשם בהיסטוריה יחד איתו.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: הוסיפו הערה לתיאור שנרשם בהיסטוריה יחד עם השינוי, למשל מספר פנייה. אפשר להשאיר ריק.
  # Accessible name of the text box when the user writes the whole message
  message: תיאור השינוי
  # Accessible name of the text box when the text is added before or after the message
  addition: הערה
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'תיאור: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: יצירת עותק של המאגר
  fork: עותק
  confirm_forking_repository: כדי להציע שינויים ל-„{$repo}”, יש ליצור עותק של המאגר בחשבון שלכם. השינויים שלכם נשמרים באותו עותק, ומתחזק בודק אותם לפני שהם עולים לאוויר.
  # Error shown when the user declined the dialog above
  fork_declined: נדרש עותק של המאגר בחשבון שלכם כדי להציע שינויים.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: לא ניתן היה ליצור עותק של המאגר „{$repo}” בחשבון שלכם.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: לעותק „{$fork}” שלכם אין את הענף „{$branch}”. עדכנו את העותק מהמאגר „{$repo}” והתחברו שוב.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: לא ניתן היה לבדוק את ההרשאות שלכם למאגר „{$repo}”. נסו שוב בעוד רגע.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: המאגר „{$repo}” אינו מאפשר יצירת עותקים. בקשו ממתחזק להפעיל זאת.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: יש לכם הזמנה ממתינה למאגר „{$repo}”. אשרו אותה ב-GitHub והתחברו שוב.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: הכניסה שלכם אינה כוללת גישה למאגרים פרטיים, ולכן לא ניתן לקרוא את המאגר „{$repo}”. בקשו ממתחזק לבדוק את הגדרות האימות של המערכת.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: רק מתחזק יכול לפרסם שינויים באתר הזה. סמנו את הפריט שלכם כ״בבדיקה״ במקום זאת, ומישהו יבדוק אותו.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: מתחזק כבר פרסם את הפריט הזה, ולכן לא נותר מה לבדוק.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: לא ניתן לבצע את השינוי הזה ישירות. אפשר להציע לבדיקה רק עריכות של פריטים.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: השינויים שלכם נשמרים בעותק שלכם מהמאגר הזה ב-„{$repo}” ונבדקים לפני שהם עולים לאוויר.
  view_fork: הצגת העותק

