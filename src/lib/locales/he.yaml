# Strings for external cloud storage service integrations.

cloud_storage:
  # Configuration error
  invalid: השירות אינו מוגדר כראוי.

  # Authentication states
  auth:
    api_key:
      key_label: מפתח API
      # {$key} is the credential label, e.g., API Key, and {$service} is the cloud service name
      initial: הזינו את ה{$key} שלכם עבור {$service}.
      requested: מאמת…
      # {$key} is the credential label the user entered, e.g., API Key
      error: ה{$key} שהוזן אינו תקין. בדקו אותו ונסו שוב.
    password:
      # {$service} is the cloud service name
      initial: הזינו את הסיסמה שלכם עבור {$service}.
      requested: מתחבר…
      error: שם המשתמש או הסיסמה שגויים. בדקו אותם ונסו שוב.

