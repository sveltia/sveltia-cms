# View switcher: toggle between list and grid views
switch_view: החלפת תצוגה
table_view: תצוגת טבלה
list_view: תצוגת רשימה
grid_view: תצוגת רשת
switch_to_list_view: מעבר לתצוגת רשימה
switch_to_grid_view: מעבר לתצוגת רשת

# ==============================================================================
# List Controls: Sort, Filter, and Group
# ==============================================================================
# Strings for sorting, filtering, and grouping entries and assets in lists.

# Sort menu: button labels and options
sort: מיון
sorting_options: אפשרויות מיון
# Table view column labels for the entry metadata used as `{{…}}` template tags
table_column_keys:
  # The folder containing the entry file
  dirname: תיקייה
  # The entry file name without the extension
  filename: שם הקובץ
  # The entry file extension
  extension: סיומת
  # The enabled locales of the entry
  locales: שפות
# Sort key option labels
sort_keys:
  # No sorting; entries appear in their natural repository order
  none: ללא
  name: שם
  slug: מזהה בכתובת
  # Sort by the last commit’s author name
  commit_author: עורך אחרון
  # Sort by the last commit date
  commit_date: תאריך עדכון
  # Sort by the date a file on a cloud storage service was last modified
  last_modified: תאריך שינוי
  # Sort by file size
  size: גודל
  # Sort by the entry’s computed summary text
  _summary: תקציר
  # Manual order defined by the user via drag-and-drop
  _manual: ידני
# Sort order labels used with field names
# Example: “Name, A to Z” or “Updated on, new to old”
# {$label} is the localized sort field label
ascending: '{$label}, מא׳ עד ת׳'
ascending_date: '{$label}, מהישן לחדש'
descending: '{$label}, מת׳ עד א׳'
descending_date: '{$label}, מהחדש לישן'
ascending_number: '{$label}, מהקטן לגדול'
descending_number: '{$label}, מהגדול לקטן'

# Filter menu: button labels and options
filter: סינון
filtering_options: אפשרויות סינון

# Group menu: button labels and options
group: קיבוץ
grouping_options: אפשרויות קיבוץ

# Asset type filter and group labels
type: סוג
all: הכל
# Group option for the linked files, which can be hosted anywhere: the host name of the file’s URL
domain: דומיין
# Asset type labels
image: תמונה
video: וידאו
audio: שמע
document: מסמך
other: אחר

# Toolbar toggles: show/hide panels
show_assets: הצגת קובצי מדיה
hide_assets: הסתרת קובצי מדיה
show_info: הצגת מידע
hide_info: הסתרת מידע

# Folder display labels when no specific path is configured
all_assets: כל קובצי המדיה
global_assets: קובצי מדיה כלליים
# Virtual location listing the files that File/Image fields link to by URL, wherever they are hosted
linked_files: קבצים מקושרים
# Badge and message shown on a linked file that couldn’t be loaded, e.g. because it has been deleted
file_unavailable: לא זמין
file_unavailable_description: לא ניתן לטעון את הקובץ. ייתכן שהוא הועבר או נמחק.

# ==============================================================================
# Entry and Collection Actions
# ==============================================================================
# Strings related to creating, editing, and managing entries and collections.

# Message shown while entries are still being retrieved: in the entry editor, when it was opened
# with a direct link before all the data has been loaded, and on the Editorial Workflow page while
# the pull requests are being fetched. {$count} selects the form
loading_entries: |
  .input {$count :integer}
  .match $count
    one {{ טוען פריט… }}
    *   {{ טוען פריטים… }}
# Error message when entry cannot be found
entry_not_found: הפריט לא נמצא.

# Entry creation restrictions: tooltip and advisory messages
creating_entries_disabled_by_admin: יצירת פריטים חדשים באוסף הזה חסומה על ידי מנהל המערכת.
# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: |
  .input {$quota :integer}
  .match $quota
    one {{ לא ניתן להוסיף פריטים חדשים לאוסף הזה, מפני שהוא הגיע למכסה של פריט אחד. }}
    two {{ לא ניתן להוסיף פריטים חדשים לאוסף הזה, מפני שהוא הגיע למכסה של שני פריטים. }}
    *   {{ לא ניתן להוסיף פריטים חדשים לאוסף הזה, מפני שהוא הגיע למכסה של {$quota} פריטים. }}
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$quota :integer}
  .input {$remaining :integer}
  .match $quota $remaining
    one one {{ האוסף הזה מתקרב למכסה של פריט אחד. אפשר ליצור עוד פריט אחד בלבד. }}
    one two {{ האוסף הזה מתקרב למכסה של פריט אחד. אפשר ליצור עוד שני פריטים בלבד. }}
    one *   {{ האוסף הזה מתקרב למכסה של פריט אחד. אפשר ליצור עוד {$remaining} פריטים בלבד. }}
    two one {{ האוסף הזה מתקרב למכסה של שני פריטים. אפשר ליצור עוד פריט אחד בלבד. }}
    two two {{ האוסף הזה מתקרב למכסה של שני פריטים. אפשר ליצור עוד שני פריטים בלבד. }}
    two *   {{ האוסף הזה מתקרב למכסה של שני פריטים. אפשר ליצור עוד {$remaining} פריטים בלבד. }}
    *   one {{ האוסף הזה מתקרב למכסה של {$quota} פריטים. אפשר ליצור עוד פריט אחד בלבד. }}
    *   two {{ האוסף הזה מתקרב למכסה של {$quota} פריטים. אפשר ליצור עוד שני פריטים בלבד. }}
    *   *   {{ האוסף הזה מתקרב למכסה של {$quota} פריטים. אפשר ליצור עוד {$remaining} פריטים בלבד. }}

# Read-only restrictions set with the `readonly` option: advisory messages
readonly_cms: המערכת במצב קריאה בלבד. אפשר לצפות בתוכן ובקובצי המדיה אך לא לבצע שינויים.
readonly_collection: האוסף הזה לקריאה בלבד. אפשר לצפות בתוכן שלו אך לא לבצע שינויים.
readonly_entry: הפריט הזה לקריאה בלבד. אפשר לצפות בו אך לא לבצע שינויים.
readonly_asset_folder: התיקייה הזו לקריאה בלבד. אפשר לצפות בקובצי המדיה שבה אך לא לבצע שינויים.
readonly_branch: אין לכם הרשאה לדחוף לענף „{$branch}”. אפשר לצפות בתוכן אך לא לבצע שינויים.
readonly_role: יש לכם הרשאת צפייה בלבד. אפשר לצפות בתוכן ובקובצי המדיה אך לא לבצע שינויים.
readonly_reference: הפריט לקריאה בלבד, ולכן לא ניתן להסיר את ההפניה.
# {$entries} is a comma-separated list of entries, each shown as “Collection › Entry”
cannot_rename_referenced_entry: 'לא ניתן לשנות את שם הפריט, מפני שהפריטים הבאים, שהם לקריאה בלבד, מפנים אליו בשמו הנוכחי: {$entries}.'
# {$entries} is a comma-separated list of entries, each shown as “Collection › Entry”
cannot_move_referenced_asset: 'לא ניתן להעביר את קובץ המדיה או לשנות את שמו, מפני שהפריטים הבאים, שהם לקריאה בלבד, משתמשים בו: {$entries}.'

# Navigation: back links and list labels
back_to_collection: חזרה לאוסף
collection_list: רשימת האוספים
back_to_collection_list: חזרה לרשימת האוספים
asset_folder_list: רשימת תיקיות המדיה
back_to_asset_folder_list: חזרה לרשימת תיקיות המדיה
# Back button shown in place of the one above while browsing a subfolder of an asset folder
back_to_parent_folder: חזרה לתיקיית האב

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: תוצאות חיפוש
# {$terms} is the current search query text
search_results_for_x: תוצאות חיפוש עבור „{$terms}”

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ אלה תוצאות החיפוש עבור „{$terms}”. לא נמצאו פריטים. }}
    one {{ אלה תוצאות החיפוש עבור „{$terms}”. נמצא פריט אחד. }}
    two {{ אלה תוצאות החיפוש עבור „{$terms}”. נמצאו שני פריטים. }}
    *   {{ אלה תוצאות החיפוש עבור „{$terms}”. נמצאו {$count} פריטים. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ אלה תוצאות החיפוש עבור „{$terms}”. לא נמצאו קבצים. }}
    one {{ אלה תוצאות החיפוש עבור „{$terms}”. נמצא קובץ אחד. }}
    two {{ אלה תוצאות החיפוש עבור „{$terms}”. נמצאו שני קבצים. }}
    *   {{ אלה תוצאות החיפוש עבור „{$terms}”. נמצאו {$count} קבצים. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ אין פריטים }}
    one {{ פריט אחד }}
    two {{ שני פריטים }}
    *   {{ {$count} פריטים }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ אין קבצים }}
    one {{ קובץ אחד }}
    two {{ שני קבצים }}
    *   {{ {$count} קבצים }}

# Empty state messages
no_files_found: לא נמצאו קבצים.
no_entries_found: לא נמצאו פריטים.

# ==============================================================================
# Asset Management
# ==============================================================================
# Strings for uploading, editing, and managing assets (images, documents, etc.).

# Upload dialog: title and button label
upload_assets: העלאת קובצי מדיה חדשים

# New Folder button and dialog in the Asset Library
new_folder: תיקייה חדשה
new_folder_name: שם התיקייה
new_folder_create: יצירה
# {$folder} is the path of the folder the new one will be created in, starting with a slash
new_folder_description: התיקייה החדשה תיווצר בתוך „{$folder}”.
# Validation errors for the new folder name
new_folder_error:
  empty: שם התיקייה אינו יכול להיות ריק.
  invalid: שם התיקייה אינו יכול להכיל לוכסנים או להתחיל בנקודה.
  # A name the CMS itself is usually served from, e.g. `admin` or `cms`
  reserved: הקבצים בתיקייה בשם הזה הם לקריאה בלבד, מפני שהמערכת עצמה מוגשת ממנה בדרך כלל.
  duplicate: תיקייה או קובץ בשם הזה כבר קיימים כאן.
# Progress and error messages while the folder is being created
creating_folder: יוצר את התיקייה…
creating_folder_failed: לא ניתן ליצור את התיקייה.

# Menu on a folder in the Asset Library, and the Rename Folder and Delete Folder dialogs
folder_options: אפשרויות התיקייה
show_folder_options: הצגת אפשרויות התיקייה
rename_folder: שינוי שם התיקייה
delete_folder: מחיקת התיקייה
# Rename Folder dialog body text
# {$count} is the number of assets in the folder, which are moved along with it
enter_new_name_for_folder: |
  .input {$count :integer}
  .match $count
    0   {{ הזינו שם חדש למטה. }}
    one {{ הזינו שם חדש למטה. קובץ המדיה שבתיקייה יועבר יחד איתה, וכל פריט שמשתמש בו יתעדכן. }}
    two {{ הזינו שם חדש למטה. שני קובצי המדיה שבתיקייה יועברו יחד איתה, וכל פריט שמשתמש בהם יתעדכן. }}
    *   {{ הזינו שם חדש למטה. {$count} קובצי המדיה שבתיקייה יועברו יחד איתה, וכל פריט שמשתמש בהם יתעדכן. }}
# Delete Folder confirmation
# {$name} is the folder name and {$count} is the number of assets in the folder
confirm_deleting_folder: |
  .input {$count :integer}
  .match $count
    0   {{ למחוק את התיקייה הריקה „{$name}”? }}
    one {{ למחוק את התיקייה „{$name}” ואת קובץ המדיה שבתוכה? }}
    two {{ למחוק את התיקייה „{$name}” ואת שני קובצי המדיה שבתוכה? }}
    *   {{ למחוק את התיקייה „{$name}” ואת {$count} קובצי המדיה שבתוכה? }}
# Progress and error messages while the folder is being renamed or deleted
renaming_folder: משנה את שם התיקייה…
renaming_folder_failed: לא ניתן לשנות את שם התיקייה.
deleting_folder: מוחק את התיקייה…
deleting_folder_failed: לא ניתן למחוק את התיקייה.
# Asset Library and asset picker: notice shown when a cloud storage service holds more files than
# are listed at once
external_assets_truncated: יש בשירות יותר מדי קבצים מכדי להציג את כולם, ולכן חלקם הושמטו.

# Edit options menu: button and item labels
edit_options: אפשרויות עריכה
show_edit_options: הצגת אפשרויות עריכה
# Copy menu aria-label
copy_options: אפשרויות העתקה
# Edit menu items with specific asset names
edit_asset: עריכת קובץ מדיה
# {$name} is the selected asset name
edit_x: עריכת {$name}

# Asset text editor: switch for line wrapping
wrap_long_lines: גלישת שורות ארוכות

# Move assets: dialog for moving assets to another folder in the repository
move: העברה
move_asset: העברת קובץ המדיה
# Dialog title. {$name} is the asset name when a single asset is moved, and {$count} is the number of
# assets being moved
move_assets_title: |
  .input {$count :integer}
  .match $count
    one {{ העברת {$name} }}
    two {{ העברת שני קובצי מדיה }}
    *   {{ העברת {$count} קובצי מדיה }}
# Dialog body text. {$count} is the number of entries that currently use the assets
select_asset_move_destination: |
  .input {$count :integer}
  .match $count
    0   {{ בחרו את תיקיית היעד. }}
    one {{ בחרו את תיקיית היעד. גם פריט אחד שמשתמש בקובצי המדיה יתעדכן. }}
    two {{ בחרו את תיקיית היעד. גם שני פריטים שמשתמשים בקובצי המדיה יתעדכנו. }}
    *   {{ בחרו את תיקיית היעד. גם {$count} פריטים שמשתמשים בקובצי המדיה יתעדכנו. }}
# Accessible label of the folder tree in the Move dialog
asset_move_destination: תיקיית היעד
# Shown when the assets being moved are all in the selected folder already
assets_already_in_folder: |
  .input {$count :integer}
  .match $count
    one {{ קובץ המדיה כבר נמצא בתיקייה הזו. }}
    *   {{ קובצי המדיה כבר נמצאים בתיקייה הזו. }}
# Shown when files with the same names exist in the selected folder. {$names} is a comma-separated
# list of file names
asset_move_conflict: 'הקבצים הבאים כבר קיימים בתיקייה הזו: {$names}.'
moving_assets: מעביר את קובצי המדיה…
moving_assets_failed: לא ניתן להעביר את קובצי המדיה.
# Warning shown when files have been moved off a cloud storage service, but the originals couldn’t
# be deleted from it
asset_move_cleanup_failed: הקבצים הועברו, אך לא ניתן היה למחוק את הקבצים המקוריים משירות האחסון.
# Shown when files on a cloud storage service can’t be renamed or moved, because the entries using
# them can’t be updated, e.g. for an Open Authoring contributor. {$count} is the number of files
cannot_change_used_external_files: |
  .input {$count :integer}
  .match $count
    one {{ לא ניתן לשנות את שם הקובץ הזה או להעביר אותו, מפני שלא ניתן לעדכן את הפריטים שמשתמשים בו. }}
    *   {{ לא ניתן לשנות את שמות הקבצים האלה או להעביר אותם, מפני שלא ניתן לעדכן את הפריטים שמשתמשים בהם. }}

# Rename asset: dialog and validation
rename_asset: שינוי שם קובץ המדיה
# {$name} is the current asset name
rename_x: שינוי שם — {$name}
# Dialog body text indicating how many entries reference this asset
# {$count} is the number of entries that currently reference the asset
enter_new_name_for_asset: |
  .input {$count :integer}
  .match $count
    0   {{ הזינו שם חדש למטה. }}
    one {{ הזינו שם חדש למטה. גם פריט אחד שמשתמש בקובץ המדיה יתעדכן. }}
    two {{ הזינו שם חדש למטה. גם שני פריטים שמשתמשים בקובץ המדיה יתעדכנו. }}
    *   {{ הזינו שם חדש למטה. גם {$count} פריטים שמשתמשים בקובץ המדיה יתעדכנו. }}
# Validation errors for asset renaming
enter_new_name_for_asset_error:
  empty: שם הקובץ אינו יכול להיות ריק.
  character: שם הקובץ אינו יכול להכיל תווים מיוחדים.
  duplicate: שם הקובץ הזה כבר משמש קובץ מדיה אחר.
  # A name starting with a dot hides the file, which the CMS wouldn’t list any more
  leading_dot: שם הקובץ אינו יכול להתחיל בנקודה.
  # The name of a file next to the asset that isn’t an asset, like an entry file
  file_duplicate: קובץ אחר בשם הזה כבר קיים כאן.
  # The name of a folder next to the file
  folder_duplicate: תיקייה בשם הזה כבר קיימת כאן.
# Shown while renaming a file whose name will be changed on saving, e.g. by the `slugify_filename`
# media library option
file_will_be_saved_as: הקובץ יישמר בשם „{$name}”.
# Confirmation dialog shown when the file extension is changed while renaming an asset
change_file_extension: שינוי סיומת הקובץ
# {$oldExtension} and {$newExtension} are file extensions without a leading dot, e.g. png
confirm_file_extension_change:
  change: לשנות את הסיומת מ-„.{$oldExtension}” ל-„.{$newExtension}”?
  add: להוסיף את הסיומת „.{$newExtension}”?
  remove: להסיר את הסיומת „.{$oldExtension}”?
file_extension_change_warning: ייתכן שהקובץ לא יוצג או לא יטופל כראוי אם הסיומת אינה תואמת לפורמט שלו בפועל.

# Replace asset: menu item and dialog title
replace_asset: החלפת קובץ המדיה
# {$name} is the asset being replaced
replace_x: החלפת {$name}
# File/Image field: labels of the Replace and Remove buttons
replace_file: החלפת הקובץ
replace_image: החלפת התמונה
remove_file: הסרת הקובץ
remove_image: הסרת התמונה

# File selection prompts: drop zones and file pickers
# Browse prompt shown when drag-and-drop is unavailable on desktop and pointer devices
click_to_browse: לחצו לבחירת קובץ…
# Browse prompt shown on touch devices
tap_to_browse: הקישו לבחירת קובץ…
# Drop zone text with browse button
# {$count} is the number of files expected by the current picker mode
drop_files_or_click_to_browse: |
  .input {$count :integer}
  .match $count
    one {{ גררו קובץ לכאן או לחצו לבחירה… }}
    *   {{ גררו קבצים לכאן או לחצו לבחירה… }}
# Partial drop zone text (ends with inline button)
# {$count} is the number of files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_files_or: |
  .input {$count :integer}
  .match $count
    one {{ גררו קובץ לכאן או }}
    *   {{ גררו קבצים לכאן או }}
# Image-specific drop zone text
# {$count} is the number of image files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_image_files_or: |
  .input {$count :integer}
  .match $count
    one {{ גררו קובץ תמונה לכאן או }}
    *   {{ גררו קובצי תמונה לכאן או }}

# File picker and clipboard actions used by upload controls
browse: עיון
# Generic clipboard paste action used by non-image file fields
paste: הדבקה
# Clipboard paste action used by image fields
paste_image: הדבקת תמונה

# Clipboard paste errors
no_image_in_clipboard: לא נמצאה תמונה בלוח.
clipboard_access_denied: הגישה ללוח נדחתה.

# Drag-and-drop overlay text (shown while dragging)
# {$count} is the number of files expected by the current picker mode
drop_files_here: |
  .input {$count :integer}
  .match $count
    one {{ גררו קובץ לכאן }}
    *   {{ גררו קבצים לכאן }}

# File type validation errors
unsupported_file_type: סוג קובץ שאינו נתמך
# {$type} is the expected asset type label, such as image or document
dropped_file_type_mismatch: 'הקובץ שנגרר אינו מאחד הסוגים הבאים: {$types}. נסו שוב.'
dropped_image_type_mismatch: 'הקובץ שנגרר אינו נתמך. מתקבלת רק תמונה מהסוגים הבאים: {$types}. נסו שוב.'

# File chooser button label
# {$count} is the number of files the picker allows the user to choose
choose_files: |
  .input {$count :integer}
  .match $count
    one {{ בחירת קובץ }}
    *   {{ בחירת קבצים }}

# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    one {{ מחיקת קובץ מדיה }}
    *   {{ מחיקת קובצי מדיה }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ מחיקת קובץ המדיה הנבחר }}
    *   {{ מחיקת קובצי המדיה הנבחרים }}
confirm_deleting_this_asset: למחוק את קובץ המדיה הזה?
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ למחוק את קובץ המדיה הנבחר? }}
    two {{ למחוק את שני קובצי המדיה הנבחרים? }}
    *   {{ למחוק את {$count} קובצי המדיה הנבחרים? }}
confirm_deleting_all_assets: למחוק את כל קובצי המדיה?
# Note added to the confirmation when entries use the assets being deleted; the references are
# removed in the same commit. {$count} is the number of entries using them
deleting_referenced_assets_note: |
  .input {$count :integer}
  .match $count
    one {{ גם ההפניה אליו בפריט אחד תוסר. }}
    two {{ גם ההפניות אליו בשני פריטים יוסרו. }}
    *   {{ גם ההפניות אליו ב-{$count} פריטים יוסרו. }}
# Shown in place of the confirmation when removing the references would leave a field in an entry
# invalid, e.g. a required Image field with nothing left, so the deletion is refused. The fields are
# listed below the message, each with the validation error it would have. {$count} is the number of
# assets being deleted
cannot_delete_referenced_assets: |
  .input {$count :integer}
  .match $count
    one {{ לא ניתן למחוק את קובץ המדיה הזה, מפני שהשדות הבאים בפריטים שמשתמשים בו לא יהיו תקינים בלעדיו. עדכנו קודם את הפריטים האלה. }}
    *   {{ לא ניתן למחוק את קובצי המדיה האלה, מפני שהשדות הבאים בפריטים שמשתמשים בהם לא יהיו תקינים בלעדיהם. עדכנו קודם את הפריטים האלה. }}
# Error shown in the asset deletion dialog when the entries using the assets couldn’t be looked up,
# so the deletion can’t go ahead. {$count} is the number of assets being deleted
checking_asset_references_failed: |
  .input {$count :integer}
  .match $count
    one {{ לא ניתן לבדוק אילו פריטים משתמשים בקובץ המדיה הזה. סגרו את החלון ונסו שוב. }}
    *   {{ לא ניתן לבדוק אילו פריטים משתמשים בקובצי המדיה האלה. סגרו את החלון ונסו שוב. }}

# Delete entries: dialog titles and confirmation messages
# {$count} is the number of entries targeted by the action
delete_entries: |
  .input {$count :integer}
  .match $count
    one {{ מחיקת פריט }}
    *   {{ מחיקת פריטים }}
# {$count} is the number of selected entries
delete_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ מחיקת הפריט הנבחר }}
    *   {{ מחיקת הפריטים הנבחרים }}
confirm_deleting_this_entry: למחוק את הפריט הזה?
confirm_deleting_this_entry_with_assets: למחוק את הפריט הזה ואת קובצי המדיה המשויכים אליו?
# Error notification shown when an entry could not be deleted
deleting_entry_failed: מחיקת הפריט נכשלה. נסו שוב.
# {$count} is the number of selected entries
confirm_deleting_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ למחוק את הפריט הנבחר? }}
    two {{ למחוק את שני הפריטים הנבחרים? }}
    *   {{ למחוק את {$count} הפריטים הנבחרים? }}
# {$count} is the number of selected entries whose associated assets would also be removed
confirm_deleting_selected_entries_with_assets: |
  .input {$count :integer}
  .match $count
    one {{ למחוק את הפריט הנבחר ואת קובצי המדיה המשויכים אליו? }}
    two {{ למחוק את שני הפריטים הנבחרים ואת קובצי המדיה המשויכים אליהם? }}
    *   {{ למחוק את {$count} הפריטים הנבחרים ואת קובצי המדיה המשויכים אליהם? }}
confirm_deleting_all_entries: למחוק את כל הפריטים?
confirm_deleting_all_entries_with_assets: למחוק את כל הפריטים ואת קובצי המדיה המשויכים אליהם?
# Note added to the confirmation when other entries reference the entries being deleted through
# Relation fields; the references are removed in the same commit. {$count} is the number of
# referencing entries
deleting_referenced_entries_note: |
  .input {$count :integer}
  .match $count
    one {{ גם ההפניה אליו בפריט אחר תוסר. }}
    two {{ גם ההפניות אליו בשני פריטים אחרים יוסרו. }}
    *   {{ גם ההפניות אליו ב-{$count} פריטים אחרים יוסרו. }}
# Shown in place of the confirmation when removing the references would leave a Relation field in
# another entry invalid, e.g. a required field with nothing selected, so the deletion is refused.
# The fields are listed below the message, each with the validation error it would have. {$count}
# is the number of entries being deleted
cannot_delete_referenced_entries: |
  .input {$count :integer}
  .match $count
    one {{ לא ניתן למחוק את הפריט הזה, מפני שהשדות הבאים בפריטים אחרים לא יהיו תקינים בלעדיו. עדכנו קודם את הפריטים האלה. }}
    *   {{ לא ניתן למחוק את הפריטים האלה, מפני שהשדות הבאים בפריטים אחרים לא יהיו תקינים בלעדיהם. עדכנו קודם את הפריטים האלה. }}

