switching_language: מחליף ל{$locale}…
locale_load_failed: לא ניתן לטעון את התרגום ל{$locale}. נסו שוב מאוחר יותר.

# Toast notification shown when changes saved with the local backend couldn’t be committed to Git
# {$reason} is one of the `local_git_skip_reasons` strings below
local_git_not_committed: השינויים נשמרו אך לא נשלחו ל-Git. {$reason} כדי לשמור את הקבצים בלבד, כבו את שליחת השינויים ל-Git בהגדרות, בלשונית מפתחים.
local_git_skip_reasons:
  unsupported_repository: המאגר שלכם משתמש ביכולת של Git שהמערכת אינה תומכת בה, כגון עץ עבודה מקושר, שמות אובייקטים בתקן SHA-256, תבנית reftable, אינדקס דליל, או אינדקס בגרסה 3 או 4 שבהן משתמשות האפשרות feature.manyFiles והפקודה git add -N.
  missing_identity: השם וכתובת הדוא״ל שלכם אינם מוגדרים בתצורת ה-Git של המאגר, והמערכת אינה יכולה לקרוא את ההגדרה הגלובלית. הגדירו אותם במאגר באמצעות git config --local user.name "השם שלכם" ו-git config --local user.email "you@example.com".
  locked: תהליך Git אחר משתמש במאגר. אם אף תהליך אינו פעיל, מחקו את הקובץ .git/index.lock.
  # The operation in progress, with how to finish or cancel it
  operation_in_progress:
    merge: מיזוג נמצא בעיצומו. סיימו אותו עם git commit, או בטלו אותו עם git merge --abort.
    rebase: פעולת rebase נמצאת בעיצומה. סיימו אותה עם git rebase --continue, או בטלו אותה עם git rebase --abort. אם כבר המשכתם הלאה, git rebase --quit מבטל אותה בלי לשנות את הקבצים שלכם.
    cherry_pick: פעולת cherry-pick נמצאת בעיצומה. סיימו אותה עם git cherry-pick --continue, או בטלו אותה עם git cherry-pick --abort.
    revert: פעולת revert נמצאת בעיצומה. סיימו אותה עם git revert --continue, או בטלו אותה עם git revert --abort.
    am: החלת תיקונים עם git am נמצאת בעיצומה. סיימו אותה עם git am --continue, או בטלו אותה עם git am --abort.
    conflict: בחלק מהקבצים יש התנגשויות. פתרו אותן והוסיפו את התוצאות ל-staging קודם.
  detached_head: לא נבחר ענף.
  staged_changes: יש לכם שינויים אחרים שממתינים ב-staging. בצעו עליהם commit או הוציאו אותם משם קודם.
  # {$path} is the file path
  lfs: '{$path} מנוהל באמצעות Git LFS, והמערכת אינה יכולה לבצע אליו commit.'
  # {$message} is the error message
  error: אירעה שגיאה בלתי צפויה. {$message}

