      title: עורך
      use_draft_backup:
        switch_label: גיבוי אוטומטי של טיוטות פריטים
      close_on_save:
        switch_label: סגירת העורך לאחר שמירת טיוטה
      close_with_escape:
        switch_label: סגירת העורך במקש Escape

  # Internationalization panel
  i18n:
    title: שפות ותרגום
    translators:
      default:
        title: שירות התרגום המוגדר כברירת מחדל
        select_service: בחירת שירות
      api_keys:
        title: מפתחות API לשירותי תרגום
        description: ניהול מפתחות API עבור <a>שירותי תרגום</a>. את מפתחות ה-API לשירותי בינה מלאכותית כלליים אפשר לנהל בהגדרות הבינה המלאכותית.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: מפתח {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: הירשמו ל-<a {$homeHref}>{$service}</a> והזינו כאן את <a {$apiKeyHref}>מפתח ה-API שלכם</a> כדי לאפשר תרגום מהיר של שדות טקסט.

  # Media panel
  media:
