# ==============================================================================
# Controls for List and Object field types.

# List item actions
remove_this_item: הסרת הפריט
move_up: העברה למעלה
move_down: העברה למטה
# Menu of a list item or file with the extra reorder actions, shown in a list of 3 or more items
reorder_options: אפשרויות שינוי הסדר
move_to_top: העברה לראש הרשימה
move_to_bottom: העברה לסוף הרשימה
# Opens a dialog asking for the position to move a list item to
move_to: העברה למיקום…
