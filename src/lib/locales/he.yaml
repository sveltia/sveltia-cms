live_reload_warning: שרת הפיתוח טוען את העמוד הזה מחדש בכל שינוי בקובץ, מה שעלול לקטוע שמירה ולהשאיר את הקבצים פגומים. הגישו את המערכת מקובץ HTML סטטי במקום זאת. <a>מידע נוסף</a>

# Toast notification shown while the translation for the selected language is being downloaded
