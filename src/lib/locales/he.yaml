# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: יש למלא את השדה הזה.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: התאריך והשעה חייבים להיות {$min} או אחרי כן.
    date: התאריך חייב להיות {$min} או אחרי כן.
    time: השעה חייבת להיות {$min} או אחרי כן.
    number: הערך חייב להיות גדול מ-{$min} או שווה לו.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ יש לבחור אפשרות אחת לפחות. }}
        two {{ יש לבחור שתי אפשרויות לפחות. }}
        *   {{ יש לבחור {$min} אפשרויות לפחות. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ יש להוסיף פריט אחד לפחות. }}
        two {{ יש להוסיף שני פריטים לפחות. }}
        *   {{ יש להוסיף {$min} פריטים לפחות. }}
  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: התאריך והשעה חייבים להיות {$max} או לפני כן.
    date: התאריך חייב להיות {$max} או לפני כן.
    time: השעה חייבת להיות {$max} או לפני כן.
    number: הערך חייב להיות קטן מ-{$max} או שווה לו.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ אי אפשר לבחור יותר מאפשרות אחת. }}
        two {{ אי אפשר לבחור יותר משתי אפשרויות. }}
        *   {{ אי אפשר לבחור יותר מ-{$max} אפשרויות. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ אי אפשר להוסיף יותר מפריט אחד. }}
        two {{ אי אפשר להוסיף יותר משני פריטים. }}
        *   {{ אי אפשר להוסיף יותר מ-{$max} פריטים. }}
  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    יש להזין לפחות {$min} תווים.
  too_long: |
    אפשר להזין עד {$max} תווים.
  # Type validation errors
  type_mismatch:
    number: הזינו מספר.
    email: הזינו כתובת דוא״ל תקינה.
    url: הזינו כתובת אינטרנט תקינה.

  # Value used for the same field in another entry of the collection
  value_not_unique: הערך הזה כבר משמש פריט אחר.

  # Custom field validation error
  invalid_value: ערך לא תקין.
  unexpected_error: אירעה שגיאה בלתי צפויה.

