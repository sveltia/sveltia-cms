    two {{ הפריט הודבק, אך שני קבצים שהוא משתמש בהם לא נמצאו. בדקו את שדות הקבצים בפריט. }}
    *   {{ הפריט הודבק, אך {$count} קבצים שהוא משתמש בהם לא נמצאו. בדקו את שדות הקבצים בפריט. }}

# Variable-type list selector
select_list_type: בחירת סוג הפריט

# Variable-type mismatch
