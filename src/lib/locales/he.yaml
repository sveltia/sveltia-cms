    stock_photos:
      api_keys:
        title: מפתחות API לשירותי תמונות מלאי
        description: ניהול מפתחות API עבור <a>שירותי תמונות מלאי</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: מפתח API של {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: הירשמו ל-<a {$homeHref}>API של {$service}</a> והזינו כאן את <a {$apiKeyHref}>מפתח ה-API שלכם</a> כדי להוסיף תמונות מלאי חינמיות לשדות תמונה.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: התמונות באדיבות {$service}
      no_services: לא הוגדרו <a>שירותי תמונות מלאי</a>.
    cloud_storage:
