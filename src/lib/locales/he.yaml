      switch_label: תמיד להציג קו תחתון בקישורים

  # Data Management panel
  data:
    title: ניהול נתונים
    clear_data:
      title: מחיקת נתונים
      # Clear File Cache button
      file_cache:
        description: מחיקת תוכן הקבצים והתמונות הממוזערות השמורים במטמון המקומי, כדי לפנות מקום או לפתור תקלות שנגרמות מנתונים ישנים.
        button_label: ניקוי מטמון הקבצים
        confirmation: תוכן הקבצים והתמונות הממוזערות השמורים במטמון המקומי יימחקו. הטיוטות שלא נשמרו וההגדרות יישמרו, וכל נתון שיימחק יורד או ייווצר מחדש לפי הצורך. המערכת תיטען מחדש בסיום.
      # Erase All Data button
      all_data:
        description: מחיקת כל מה שהמערכת שומרת בדפדפן הזה, לרבות הקבצים במטמון, הטיוטות שלא נשמרו וההגדרות. כל מה שכבר נשמר במאגר שלכם לא יושפע.
        button_label: מחיקת כל הנתונים
        confirmation: כל הנתונים השמורים בדפדפן הזה יימחקו, לרבות תוכן הקבצים במטמון, התמונות הממוזערות, הטיוטות שלא נשמרו, ההגדרות ומצב ההתחברות. המאגר שלכם לא יושפע, אבל כל שינוי שלא שמרתם יאבד, ותידרשו להתחבר מחדש. המערכת תיטען מחדש בסיום.

  # Developer panel
  developer:
    title: מפתחים
    developer_mode:
      title: מצב מפתחים
      description: הפעלת יכולות המיועדות למפתחים, ובהן רישום מפורט במסוף ותפריטי הקשר של הדפדפן.
      switch_label: הפעלת מצב מפתחים
    local_git:
      title: שליחת שינויים ל-Git
      description: שליחת השינויים שלכם לענף הנוכחי של המאגר המקומי בכל שמירה, כפי שהמערכת עושה בעבודה מול מאגר מרוחק. אפשר לבדוק ולדחוף את השינויים בכלי ה-Git הרגילים שלכם.
      switch_label: שליחת שינויים ל-Git
      checking: בודק את המאגר…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: השינויים יישלחו לענף {$branch} בשם {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: לא ניתן לשלוח שינויים כרגע. {$reason}
    deploy_hook:
      title: הוק פרסום
      description: הזינו כתובת webhook שתיקרא כשתפעילו פרסום ידנית באמצעות ״פרסום השינויים״. אפשר להשאיר ריק אם אתם משתמשים ב-GitHub Actions.
      # Hook URL input
      url:
        field_label: כתובת ההוק
        saved: כתובת ההוק נשמרה.
        removed: כתובת ההוק הוסרה.
      # Authorization header input
      auth:
        field_label: כותרת Authorization (למשל Bearer <token>) (רשות)
        saved: כותרת ה-Authorization נשמרה.
        removed: כותרת ה-Authorization הוסרה.

