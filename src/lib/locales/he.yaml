        one {{ שדה אחד תורגם מ{$source}. }}
        two {{ שני שדות תורגמו מ{$source}. }}
        *   {{ {$count} שדות תורגמו מ{$source}. }}
  copy:
    none: אין מה להעתיק.
    # {$source} is the source language name and {$count} is the number of copied fields
    complete: |
      .input {$count :integer}
      .match $count
        0   {{ לא הועתקו שדות מ{$source}. }}
        one {{ שדה אחד הועתק מ{$source}. }}
        two {{ שני שדות הועתקו מ{$source}. }}
        *   {{ {$count} שדות הועתקו מ{$source}. }}

# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: יש למלא את השדה הזה.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: התאריך והשעה חייבים להיות {$min} או אחרי כן.
    date: התאריך חייב להיות {$min} או אחרי כן.
    time: השעה חייבת להיות {$min} או אחרי כן.
    number: הערך חייב להיות גדול מ-{$min} או שווה לו.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ יש לבחור אפשרות אחת לפחות. }}
        two {{ יש לבחור שתי אפשרויות לפחות. }}
        *   {{ יש לבחור {$min} אפשרויות לפחות. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ יש להוסיף פריט אחד לפחות. }}
        two {{ יש להוסיף שני פריטים לפחות. }}
        *   {{ יש להוסיף {$min} פריטים לפחות. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: התאריך והשעה חייבים להיות {$max} או לפני כן.
    date: התאריך חייב להיות {$max} או לפני כן.
    time: השעה חייבת להיות {$max} או לפני כן.
    number: הערך חייב להיות קטן מ-{$max} או שווה לו.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ אי אפשר לבחור יותר מאפשרות אחת. }}
        two {{ אי אפשר לבחור יותר משתי אפשרויות. }}
        *   {{ אי אפשר לבחור יותר מ-{$max} אפשרויות. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ אי אפשר להוסיף יותר מפריט אחד. }}
        two {{ אי אפשר להוסיף יותר משני פריטים. }}
        *   {{ אי אפשר להוסיף יותר מ-{$max} פריטים. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: יש להזין לפחות {$min} תווים.
  too_long: אפשר להזין עד {$max} תווים.

  # Type validation errors
  type_mismatch:
    number: הזינו מספר.
    email: הזינו כתובת דוא״ל תקינה.
    url: הזינו כתובת אינטרנט תקינה.

  # Value used for the same field in another entry of the collection
  value_not_unique: הערך הזה כבר משמש פריט אחר.
  # Key of a keyed List field item used for another item of the same list
  key_not_unique: המפתח הזה כבר משמש פריט אחר.
  # Key of a keyed List field item that is a whole number, which doesn’t keep its order in a map
  key_numeric: המפתח אינו יכול להיות מספר שלם, מפני שהפריטים יאבדו את הסדר שלהם.

  # Custom field validation error
  invalid_value: ערך לא תקין.
  unexpected_error: אירעה שגיאה בלתי צפויה.

# ==============================================================================
# Entry Sidebar
# ==============================================================================
# Panels shown in the entry editor sidebar.

entry_sidebar:
  # Sidebar tab list aria-label
  sidebar_panels: לוחות הצד

  # Validation panel: shows field validation errors
  validation:
    title: בדיקת תקינות
    placeholder: תוצאות בדיקת התקינות יוצגו כאן.
    no_errors_found: לא נמצאו שגיאות.
    # Button in the panel header that validates the entry on demand
    validate: בדיקה

  # Slug panel: shows the entry slug and lets the user edit it
  slug:
    title: מזהה בכתובת
    generated_on_save: המזהה נוצר מתוכן הפריט בעת השמירה. כל תאריך ושעה שבו יהיו אלה של השמירה.
    unavailable: לפריט הזה אין מזהה בכתובת.

  # History panel: shows entry commit history
  history:
    title: היסטוריה
    fetch_failed: טעינת ההיסטוריה נכשלה.
    no_history: לא נמצאה היסטוריה.

  # Backlinks panel: shows entries referencing this entry
  backlinks:
    title: הפניות נכנסות
    no_entries: אף פריט אינו מפנה לפריט הזה.

  # Tab label of a panel with a count, e.g. of comments. {$title} is the panel title
  title_with_count: '{$title} ({$count})'

# Status shown next to the Save button while an entry with many new files is being saved
# {$done} and {$total} are the number of files prepared and to prepare, or the number of commits
# made and the estimated number of commits in all
save_progress:
  preparing: 'מכין קבצים: {$done} מתוך {$total}'
  committing: 'שומר ב-GitHub: {$done} מתוך כ-{$total} commits'

# Entry save error dialog
saving_entry:
  error:
    title: שגיאה
    description: אירעה שגיאה בשמירת הפריט. נסו שוב מאוחר יותר.

# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: הפריט שונה בידי מישהו אחר
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} שינה את הפריט הזה ב-{$date}, אחרי שפתחתם אותו.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: הפריט הזה שונה במאגר אחרי שפתחתם אותו.
  deleted: הפריט הזה נמחק מהמאגר אחרי שפתחתם אותו.
  # Follows `modified_by` or `modified`
  overwrite_warning: אם תשמרו עכשיו, השינויים שלהם יאבדו.
  # Follows `deleted`
  recreate_warning: אם תשמרו עכשיו, הפריט ייווצר מחדש.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: מאחר שהפריט שמור באותו קובץ עם פריטים אחרים, לא ניתן לשמור אותו על גבי השינוי. בטלו את העריכה, פתחו את הפריט מחדש מהרשימה ובצעו את השינויים שוב.
  # OK button label
  save_anyway: שמירה בכל זאת
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: המאגר עודכן בידי מישהו אחר במהלך השמירה. נסו שוב.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: פריט השמור באותו קובץ שונה בידי מישהו אחר. נסו שוב.
  # {$path} is the file path
  array_file_invalid: לא ניתן לעדכן את הקובץ {$path}, מפני שאינו מכיל רשימת פריטים תקינה.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
# repository while the user has it open. The change itself is described with the `save_conflict`
# strings above
remote_change:
  reload_entry: טעינת הפריט מחדש
  # Confirmation shown before reloading when the user has unsaved changes
  confirm_reloading_entry: לטעון את הפריט מחדש? השינויים שלא נשמרו יאבדו.

