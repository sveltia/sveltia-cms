# ==============================================================================
# Content and Asset Libraries
# ==============================================================================
# Strings used in the main content and asset management interfaces, including
# lists, navigation, and collection/folder views.

# Page container aria-labels
content_library: ספריית התוכן
asset_library: ספריית המדיה

# Primary sidebar section headings and list aria-labels
collections: אוספים
entries: פריטים
files: קבצים

# Asset location selector: option group labels
asset_location:
  # Assets stored in the site’s Git repository
  repository: האתר שלכם
  external: מיקומים חיצוניים
  stock_photos: תמונות מלאי

# Sidebar and list labels
# Collection assets panel aria-label
collection_assets: קובצי המדיה של האוסף
# List aria-labels for different list types
entry_list: רשימת פריטים
file_list: רשימת הקבצים
asset_list: רשימת קובצי המדיה

# Collection and folder page titles
# Used as aria-labels on page containers
# {$collection} is the current collection label
x_collection: אוסף „{$collection}”
# {$folder} is the current asset folder label
x_asset_folder: תיקיית מדיה „{$folder}”

# Navigation announcements (ARIA live regions)
# Announce page changes for screen reader users
viewing_collection_list: זוהי רשימת האוספים.
viewing_asset_folder_list: זוהי רשימת תיקיות המדיה.
# Collection view announcements with entry counts
# {$collection} is the collection label and {$count} is the number of entries in it
viewing_x_collection: |
  .input {$count :integer}
  .match $count
    0   {{ אתם צופים באוסף „{$collection}”, שאין בו עדיין פריטים. }}
    one {{ אתם צופים באוסף „{$collection}”, שיש בו פריט אחד. }}
    two {{ אתם צופים באוסף „{$collection}”, שיש בו שני פריטים. }}
    *   {{ אתם צופים באוסף „{$collection}”, שיש בו {$count} פריטים. }}
# Asset folder view announcements with asset counts
# {$folder} is the folder label and {$count} is the number of assets in it
viewing_x_asset_folder: |
  .input {$count :integer}
  .match $count
    0   {{ אתם צופים בתיקיית המדיה „{$folder}”, שאין בה עדיין קבצים. }}
    one {{ אתם צופים בתיקיית המדיה „{$folder}”, שיש בה קובץ אחד. }}
    two {{ אתם צופים בתיקיית המדיה „{$folder}”, שיש בה שני קבצים. }}
    *   {{ אתם צופים בתיקיית המדיה „{$folder}”, שיש בה {$count} קבצים. }}
# Cloud storage service view announcement
# {$service} is the cloud storage service name, e.g. Uploadcare
viewing_x_external_location: אלה קובצי המדיה ב{$service}.
# Administration page announcements
viewing_admin_section_list: זוהי רשימת האזורים בעמוד הניהול.
# {$section} is the section label, e.g. Users
viewing_x_admin_section: זהו האזור „{$section}” בעמוד הניהול.

# Singleton file selection announcement
# {$file} is the singleton file name
singleton_selected_announcement: הקישו Enter כדי לערוך את הקובץ „{$file}”.

# Error messages: page, collection, folder or file not found
page_not_found: העמוד לא נמצא.
collection_not_found: האוסף לא נמצא.
asset_folder_not_found: תיקיית המדיה לא נמצאה.
file_not_found: הקובץ לא נמצא.

# Selection count indicator
# Shown in the toolbar when items are selected (e.g., “2 of 10 selected”)
# {$selected} is the selected item count and {$total} is the total item count
