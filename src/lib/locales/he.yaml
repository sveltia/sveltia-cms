# Authentication errors
# Error messages shown during sign-in failures
sign_in_error:
  not_project_root: התיקייה שנבחרה אינה תיקיית השורש של מאגר. נסו שוב.
  picker_dismissed: לא נבחרה תיקיית שורש של מאגר. נסו שוב.
  authentication_aborted: האימות בוטל. נסו שוב.
  invalid_token: האסימון שהוזן אינו תקין. בדקו אותו ונסו שוב.
  # OAuth and authenticator errors (shown with error codes) — keys are defined in the Sveltia CMS Authenticator library
  UNSUPPORTED_BACKEND: שירות ה-Git שלכם אינו נתמך על ידי מנגנון האימות.
  UNSUPPORTED_DOMAIN: הדומיין שלכם אינו מורשה להשתמש במנגנון האימות.
  MISCONFIGURED_CLIENT: מזהה הלקוח או הסוד של יישום ה-OAuth אינם מוגדרים.
  AUTH_CODE_REQUEST_FAILED: קבלת קוד ההרשאה נכשלה. נסו שוב מאוחר יותר.
  CSRF_DETECTED: זוהתה מתקפת CSRF אפשרית. תהליך האימות בוטל.
  TOKEN_REQUEST_FAILED: בקשת אסימון הגישה נכשלה. נסו שוב מאוחר יותר.
  TOKEN_REFRESH_FAILED: רענון אסימון הגישה נכשל. נסו שוב מאוחר יותר.
  MALFORMED_RESPONSE: השרת החזיר נתונים פגומים. נסו שוב מאוחר יותר.

# Backend and repository validation errors
# Shown when the configured backend or repository is invalid or inaccessible
# {$name} is the backend display name like Forgejo and {$version} is the minimum supported version
backend_unsupported_version: ממשק {$name} דורש את {$name} בגרסה {$version} ומעלה.
# {$repo} is the repository identifier, typically in owner/repo format
repository_no_access: אין לכם גישה למאגר „{$repo}”.
repository_not_found: המאגר „{$repo}” אינו קיים.
repository_empty: למאגר „{$repo}” אין ענפים.
# {$repo} is the repository identifier, and {$branch} is the configured branch name
branch_not_found: למאגר „{$repo}” אין ענף בשם „{$branch}”.
# {$repo} is the repository identifier, and {$dir} is the configured root directory
root_dir_not_found: תיקיית השורש „{$dir}” אינה קיימת במאגר „{$repo}”.

# General errors
# Fallback error dialog title for unexpected errors
unexpected_error: שגיאה בלתי צפויה
# Shown in place of the page when an unexpected error stops it from being displayed
# {$message} is the error message
page_crashed: משהו השתבש, ולא ניתן להציג את העמוד הזה. {$message}
# Shown in place of a field editor or preview when an unexpected error stops it from being displayed
# {$message} is the error message
field_crashed: משהו השתבש, ולא ניתן להציג את השדה הזה. {$message}
# Button label for displaying a part of the page again after an unexpected error
try_again: ניסיון נוסף
# Button label for reloading the CMS after an unexpected error
reload_cms: טעינת המערכת מחדש

# Entry file parsing errors
# Toast notification when entry files fail to parse on initial load
# {$count} is the number of entry files that failed to parse
entry_parse_errors: |
  .input {$count :integer}
  .match $count
    one {{ אירעה שגיאה בפענוח קובץ של פריט. בדקו את מסוף הדפדפן לפרטים. }}
    *   {{ אירעו שגיאות בפענוח קובצי פריטים. בדקו את מסוף הדפדפן לפרטים. }}
