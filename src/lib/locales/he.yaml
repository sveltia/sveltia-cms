add_x: הוספת {$name}

# List item context menu
# aria-label for the button opening the menu, and for the menu itself
list_item_options: אפשרויות פריט הרשימה
add_item_above: הוספת פריט מעל
add_item_below: הוספת פריט מתחת

# Variable-type list selector
select_list_type: בחירת סוג הפריט

# Variable-type mismatch
unknown_variable_type: לא ניתן להציג את הפריט הזה בגלל סוג לא מוכר. בדקו את מסוף הדפדפן לפרטים.

# ==============================================================================
# Field Widgets
# ==============================================================================
# Strings for specific field widget types.

# Color field: opacity slider
opacity: אטימות

# Select field: empty option placeholder
unselected_option: (ללא)

# Relation field: creating a referenced entry without leaving the editor
relation_field:
  # Note shown in the dialog. {$name} is the singular label of the referenced collection
  save_together_hint: ה{$name} החדש יישמר יחד עם הפריט שאתם עורכים.
  # Error shown when the entry couldn’t be prepared. {$name} is the singular label of the collection
  add_failed: לא ניתן היה להוסיף את ה{$name}. בדקו את מסוף הדפדפן לפרטים.

# Select Assets dialog
assets_dialog:
  # Dialog titles for different selection modes
  title:
    file: בחירת קובץ
    image: בחירת תמונה
    folder: בחירת תיקייה

  # Search input labels
  search_for_file: חיפוש קבצים
  search_for_image: חיפוש תמונות

  # Locations panel aria-label
  locations: מיקומים

  # Folder selection mode for a File field with the `select_folder` option. {$path} is the public
  # path of the folder to be selected, and {$count} is the number of folders selected
  selected_folder: 'התיקייה שנבחרה: {$path}'
  selected_folders: |
    .input {$count :integer}
    .match $count
      one {{ תיקייה אחת נבחרה }}
      two {{ שתי תיקיות נבחרו }}
      *   {{ {$count} תיקיות נבחרו }}
  no_subfolders: אין תיקיות משנה בתיקייה הזו.

  # Asset folder options
  folder:
    field: קובצי המדיה של השדה
    entry: קובצי המדיה של הפריט
    file: קובצי המדיה של הקובץ
    collection: קובצי המדיה של האוסף
    global: קובצי מדיה כלליים

  # Error messages
  error:
    invalid_key: מפתח ה-API שלכם אינו תקין או שתוקפו פג. בדקו אותו ונסו שוב.
    search_fetch_failed: אירעה שגיאה בחיפוש קובצי מדיה. נסו שוב מאוחר יותר.
    image_fetch_failed: אירעה שגיאה בהורדת קובץ המדיה שנבחר. נסו שוב מאוחר יותר.

  # Stock photo panels
  available_images: תמונות זמינות
  available_files: קבצים זמינים

  # URL entry option
  enter_url: הזנת כתובת
  enter_file_url: 'הזינו את כתובת הקובץ:'
  enter_image_url: 'הזינו את כתובת התמונה:'

  # Large file warning dialog
  large_file:
    title: קובץ גדול

  # Invalid file warning dialog
  invalid_file:
    title: קובץ לא תקין

  # Warning dialog shown when files are rejected for more than one reason
  rejected_files:
    title: לא ניתן להעלות את הקבצים

  # Photo credit dialog (stock photos)
  photo_credit:
    title: קרדיט לתמונה
    description: 'השתמשו בקרדיט הבא אם אפשר:'

  # Unsaved asset badge
  unsaved: לא נשמר

# Character counter: shows character count for text fields
character_counter:
  # {$count} is the current character count; {$min} and {$max} are configured limits
  min_max: |
    .input {$count :integer}
    .match $count
      0   {{ לא הוזנו תווים. מינימום: {$min}. מקסימום: {$max}. }}
      one {{ הוזן תו אחד. מינימום: {$min}. מקסימום: {$max}. }}
      two {{ הוזנו שני תווים. מינימום: {$min}. מקסימום: {$max}. }}
      *   {{ הוזנו {$count} תווים. מינימום: {$min}. מקסימום: {$max}. }}
  # {$count} is the current character count and {$min} is the minimum allowed count
  min: |
    .input {$count :integer}
    .match $count
      0   {{ לא הוזנו תווים. מינימום: {$min}. }}
      one {{ הוזן תו אחד. מינימום: {$min}. }}
      two {{ הוזנו שני תווים. מינימום: {$min}. }}
      *   {{ הוזנו {$count} תווים. מינימום: {$min}. }}
  # {$count} is the current character count and {$max} is the maximum allowed count
  max: |
    .input {$count :integer}
    .match $count
      0   {{ לא הוזנו תווים. מקסימום: {$max}. }}
      one {{ הוזן תו אחד. מקסימום: {$max}. }}
      two {{ הוזנו שני תווים. מקסימום: {$max}. }}
      *   {{ הוזנו {$count} תווים. מקסימום: {$max}. }}
# YouTube video player iframe title
youtube_video_player: נגן הווידאו של YouTube

# Date/time field: quick action buttons
today: היום
now: עכשיו

# Rich-text editor: component field labels
editor_components:
  image: תמונה
  src: מקור
  alt: טקסט חלופי
  title: כותרת
  link: קישור

# Key-Value field: column headers and validation
key_value:
  key: מפתח
  value: ערך
  action: פעולה
  empty_key: חובה להזין מפתח.
  duplicate_key: המפתח חייב להיות ייחודי.

# Map field: location search and geolocation
find_place: חיפוש מקום
use_your_location: שימוש במיקום שלי

# Geolocation error dialog
geolocation_error_title: שגיאת איכון
geolocation_error_body: אירעה שגיאה בעת איתור המיקום שלכם.
geolocation_unsupported: ממשק האיכון אינו נתמך בדפדפן הזה.

# Boolean field: display labels
# Note that the keys must be quoted strings to avoid being interpreted as YAML booleans
boolean:
  'true': כן
  'false': לא

# ==============================================================================
