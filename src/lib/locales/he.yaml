  deleted: הפריט הזה נמחק מהמאגר אחרי שפתחתם אותו.
  # Follows `modified_by` or `modified`
  overwrite_warning: אם תשמרו עכשיו, השינויים שלהם יאבדו.
  # Follows `deleted`
  recreate_warning: אם תשמרו עכשיו, הפריט ייווצר מחדש.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
