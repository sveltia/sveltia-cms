      description: לאחר ההתחברות, לחצו שוב על כפתור הכניסה כדי להמשיך.
    auth_key_label: סוד API
    open_library: פתיחת Cloudinary

  uploadcare:
    auth_key_label: מפתח סוד API

  aws_s3:
    auth_key_label: מפתח גישה סודי

  bunny_storage:
    auth_key_label: סיסמת אזור האחסון

  cloudflare_r2:
    auth_key_label: מפתח גישה סודי

  digitalocean_spaces:
    auth_key_label: מפתח גישה סודי

# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ יש שגיאה בתצורת המערכת. פתרו את הבעיה ונסו שוב. }}
      *   {{ יש שגיאות בתצורת המערכת. פתרו את הבעיות ונסו שוב. }}
  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: אוסף {$collection}
    file: קובץ {$file}
    component: רכיב {$component}
    # Don’t localize `{$field}`
    field: שדה `{$field}`

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS פועלת רק בכתובות HTTPS או localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ כתובת קובץ התצורה חייבת להשתמש בפרוטוקול HTTPS או בכתובת localhost. }}
        *   {{ כתובות קובצי התצורה חייבות להשתמש בפרוטוקול HTTPS או בכתובות localhost. }}
    fetch_failed: לא ניתן היה לאחזר את קובץ התצורה.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: תגובת ה-HTTP חזרה עם קוד {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'לא ניתן היה לאחזר את קובץ התצורה. כדי למנוע את טעינת הקובץ `config.yml`, הוסיפו <a>`load_config_file: false`</a> לאובייקט התצורה המועבר ל-`CMS.init()`.'
    parse_failed: לא ניתן היה לפענח את קובץ התצורה.
    parse_failed_invalid_object: קובץ התצורה אינו אובייקט JavaScript תקין.
    parse_failed_unsupported_type: קובץ התצורה אינו מסוג נתמך. נתמכים YAML, TOML ו-JSON בלבד.
    no_collection: לא הוגדרו אוספים.
    # Don’t localize `hide`
    no_visible_collection: לפחות אוסף אחד חייב להיות גלוי. בדקו את האפשרות `hide`.
    missing_backend: לא הוגדר שירות Git.
    missing_backend_name: לא הוגדר שם שירות ה-Git.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: שירות {$name} <a>אינו נתמך</a> ב-Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: שירות {$name} המיושן <a>אינו נתמך</a> ב-Sveltia CMS.
    unsupported_custom_backend: שירותי Git מותאמים אישית <a>אינם נתמכים</a> ב-Sveltia CMS.
    unsupported_backend_suggestion: השתמשו באחד <a>השירותים הנתמכים</a> במקום זאת.
    missing_repository: לא הוגדר מאגר.
    invalid_repository: המאגר שהוגדר אינו תקין. עליו להיות בתבנית „owner/repo”.
    invalid_root_dir: תיקיית השורש אינה תקינה. עליה להיות נתיב בתוך המאגר, בלי „..”.
    invalid_root_dir_branch: לא ניתן להשתמש בתיקיית השורש בשמות הענפים של מצבי הפרסום `editorial_workflow` ו-`preview`. אף חלק בנתיב שלה אינו יכול להתחיל בנקודה, להסתיים ב-„.lock” או להכיל רווח או תו מיוחד כגון נקודתיים או כוכבית.
    path_outside_root_dir: הנתיב „{$path}” מוביל אל מחוץ לתיקיית השורש, שם המערכת אינה יכולה להציג קבצים.
    oauth_implicit_flow: שיטת האימות שהוגדרה (implicit flow) אינה נתמכת ב-Sveltia CMS. השתמשו ב<a>שיטת אימות</a> אחרת במקום זאת.
    github_pkce_unsupported: הרשאת PKCE אינה נתמכת עדיין בשל מגבלות של GitHub. השתמשו ב<a>שיטת אימות</a> אחרת במקום זאת.
    oauth_no_app_id: לא הוגדר מזהה יישום OAuth.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: האפשרות `open_authoring` מחייבת את מצב הפרסום `editorial_workflow` או `preview`. ראו <a>תיעוד</a> לפרטים.
    # Don’t localize `auth_methods`
    no_auth_methods: האפשרות `auth_methods` חייבת לכלול שיטה אחת לפחות.
    missing_media_folder: לא הוגדרה תיקיית מדיה.
    public_folder_relative_path: התיקייה הציבורית שהוגדרה אינה תקינה. עליה להיות נתיב מוחלט המתחיל ב-„/”.
    public_folder_absolute_url: כתובת מוחלטת עבור אפשרות התיקייה הציבורית אינה נתמכת ב-Sveltia CMS.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: האפשרות `{$option}` מכילה את תג התבנית `{$tag}`, שאינו נתמך שם. ניתן להשתמש רק בתגי תבנית של מזהה בכתובת, כגון `\{\{slug\}\}` ו-`\{\{year\}\}`, ובתגים `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` ו-`\{\{public_folder\}\}`.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: האפשרות `{$option}` מכילה את תג התבנית `{$tag}`, שניתן להשתמש בו רק באפשרות של אוסף, של קובץ באוסף או של שדה, שבהם יש פריט למלא ממנו.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: האפשרות `sanitize_replacement` מוגדרת כ-`{$replacement}`, אך היא מכילה תו שלא ניתן להשתמש בו במזהה בכתובת, ולכן אינה יכולה לשמש כתחליף.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: האפשרות `{$option}` מוגדרת כ-`{$url}`, אך עליה להיות כתובת מוחלטת המתחילה ב-`https://` או ב-`http://`.
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: האפשרות `stages` של `publish_mode` חייבת להתחיל ב-`draft` ולמנות את השלבים בסדר `draft`, `pending_review`, `pending_publish`, בלי לחזור על אף אחד מהם.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: האפשרות `i18n.locales` חייבת למנות שפה אחת לפחות.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: האפשרות `default_locale` מוגדרת כ-`{$locale}`, אך היא אינה אחת מ-`locales`.
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: האפשרות `initial_locales` מכילה את `{$locale}`, אך היא אינה אחת מ-`locales`.
    # Don’t localize `i18n`
    i18n_no_collections: 'האפשרות `i18n` מוגדרת ברמה העליונה, אך לאף אחד מהאוספים או מהקבצים הבודדים אין את האפשרות `i18n`, ולכן אין תוכן שניתן לתרגם. הוסיפו `i18n: true` לאוספים ולקבצים הבודדים שברצונכם לתרגם.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: האפשרות `transformations` מכילה מפתח `{$key}` שאינו נתמך. עליו להיות `raster_image`, `svg` או פורמט תמונה רסטרית נתמך.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: האפשרות `quality` של ההמרה `{$key}` אינה תקינה. עליה להיות מספר שלם בין 0 ל-100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: האפשרות `{$prop}` של ההמרה `{$key}` אינה תקינה. עליה להיות מספר שלם חיובי.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: לאוסף המדיה {$count} חייבת להיות אפשרות `name` המוגדרת כמחרוזת שאינה ריקה.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: שם אוסף המדיה `{$name}` אינו תקין. אסור שיכיל תווים מיוחדים.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: שמות אוספי מדיה חייבים להיות ייחודיים, אך `{$name}` מופיע יותר מפעם אחת.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: לאוסף חייבת להיות מוגדרת אחת מהאפשרויות `folder`, `file`, `files` או `divider`.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: לאוסף אסור שתהיה יותר מאחת מהאפשרויות `folder`, `file`, `files` ו-`divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: הסיומת `{$extension}` אינה תואמת לפורמט `{$format}`.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: השדה `{$name}` נשמר כגוף המסמך מתחת ל-front matter, שיכול להכיל טקסט בלבד — לא מספר, ערך בוליאני, רשימה או אובייקט כפי ששדה `{$widget}` מכיל. השתמשו בסוג שדה שמכיל טקסט, או שנו את שם השדה.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
    # brackets are escaped with backslashes for MessageFormat 2
    invalid_collection_data_file: האפשרות `file` בערך `{$file}` אינה תקינה. עליה להיות נתיב לקובץ JSON, בלי מציין המיקום `\{\{locale\}\}`.
    # {$prop} is the option name; Don’t localize `file`
    unsupported_collection_data_file_option: האפשרות `{$prop}` אינה נתמכת באוסף שיש בו האפשרות `file`.
    # Don’t localize `file`, `publish_mode` and `simple`
    collection_data_file_workflow: תהליך העריכה ותהליך התצוגה המקדימה, לרבות Open Authoring, אינם נתמכים באוסף שיש בו האפשרות `file`. הגדירו את האפשרות `publish_mode` של האוסף כ-`simple`.
    # {$prop} is the option name; Don’t localize `file` and `slug`. The curly brackets are escaped
    # with backslashes for MessageFormat 2
    collection_data_file_slug_tag: האפשרות `{$prop}` אינה יכולה להכיל את התג `\{\{slug\}\}` באוסף שיש בו האפשרות `file`, מפני שהמזהה של פריט הוא מיקומו, והוא משתנה כשמסדרים את הפריטים מחדש או מוחקים אותם. השתמשו בשדה בעל ערך ייחודי במקום זאת.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: תבנית המזהה `{$slug}` אינה תקינה מפני שאינה יכולה להכיל לוכסנים. כדי לארגן פריטים בתיקיות משנה, השתמשו באפשרות `path` במקום ב-`slug`.
    # {$name} is the field name from the configuration; Don’t localize `identifier_field`
