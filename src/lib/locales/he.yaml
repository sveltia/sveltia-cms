# Replace asset: menu item and dialog title
replace_asset: החלפת קובץ המדיה
# {$name} is the asset being replaced
replace_x: החלפת {$name}
# File/Image field: labels of the Replace and Remove buttons
replace_file: החלפת הקובץ
replace_image: החלפת התמונה
remove_file: הסרת הקובץ
remove_image: הסרת התמונה

# File selection prompts: drop zones and file pickers
# Browse prompt shown when drag-and-drop is unavailable on desktop and pointer devices
click_to_browse: לחצו לבחירת קובץ…
# Browse prompt shown on touch devices
tap_to_browse: הקישו לבחירת קובץ…
# Drop zone text with browse button
# {$count} is the number of files expected by the current picker mode
drop_files_or_click_to_browse: |
  .input {$count :integer}
  .match $count
    one {{ גררו קובץ לכאן או לחצו לבחירה… }}
    *   {{ גררו קבצים לכאן או לחצו לבחירה… }}
# Partial drop zone text (ends with inline button)
# {$count} is the number of files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_files_or: |
  .input {$count :integer}
  .match $count
    one {{ גררו קובץ לכאן או }}
    *   {{ גררו קבצים לכאן או }}
# Image-specific drop zone text
# {$count} is the number of image files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_image_files_or: |
  .input {$count :integer}
  .match $count
    one {{ גררו קובץ תמונה לכאן או }}
    *   {{ גררו קובצי תמונה לכאן או }}
# File picker and clipboard actions used by upload controls
browse: עיון
# Generic clipboard paste action used by non-image file fields
paste: הדבקה
# Clipboard paste action used by image fields
paste_image: הדבקת תמונה

# Clipboard paste errors
no_image_in_clipboard: לא נמצאה תמונה בלוח.
clipboard_access_denied: הגישה ללוח נדחתה.

# Drag-and-drop overlay text (shown while dragging)
# {$count} is the number of files expected by the current picker mode
drop_files_here: |
  .input {$count :integer}
  .match $count
    one {{ גררו קובץ לכאן }}
    *   {{ גררו קבצים לכאן }}
# File type validation errors
unsupported_file_type: סוג קובץ שאינו נתמך
# {$type} is the expected asset type label, such as image or document
dropped_file_type_mismatch: 'הקובץ שנגרר אינו מאחד הסוגים הבאים: {$types}. נסו שוב.'
dropped_image_type_mismatch: 'הקובץ שנגרר אינו נתמך. מתקבלת רק תמונה מהסוגים הבאים: {$types}. נסו שוב.'

# File chooser button label
# {$count} is the number of files the picker allows the user to choose
choose_files: |
  .input {$count :integer}
  .match $count
    one {{ בחירת קובץ }}
    *   {{ בחירת קבצים }}
# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    one {{ מחיקת קובץ מדיה }}
    *   {{ מחיקת קובצי מדיה }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ מחיקת קובץ המדיה הנבחר }}
    *   {{ מחיקת קובצי המדיה הנבחרים }}
confirm_deleting_this_asset: למחוק את קובץ המדיה הזה?
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ למחוק את קובץ המדיה הנבחר? }}
    two {{ למחוק את שני קובצי המדיה הנבחרים? }}
    *   {{ למחוק את {$count} קובצי המדיה הנבחרים? }}
confirm_deleting_all_assets: למחוק את כל קובצי המדיה?
# Note added to the confirmation when entries use the assets being deleted; the references are
# removed in the same commit. {$count} is the number of entries using them
deleting_referenced_assets_note: |
  .input {$count :integer}
  .match $count
    one {{ גם ההפניה אליו בפריט אחד תוסר. }}
    two {{ גם ההפניות אליו בשני פריטים יוסרו. }}
    *   {{ גם ההפניות אליו ב-{$count} פריטים יוסרו. }}
# Shown in place of the confirmation when removing the references would leave a field in an entry
# invalid, e.g. a required Image field with nothing left, so the deletion is refused. The fields are
# listed below the message, each with the validation error it would have. {$count} is the number of
# assets being deleted
cannot_delete_referenced_assets: |
  .input {$count :integer}
  .match $count
    one {{ לא ניתן למחוק את קובץ המדיה הזה, מפני שהשדות הבאים בפריטים שמשתמשים בו לא יהיו תקינים בלעדיו. עדכנו קודם את הפריטים האלה. }}
    *   {{ לא ניתן למחוק את קובצי המדיה האלה, מפני שהשדות הבאים בפריטים שמשתמשים בהם לא יהיו תקינים בלעדיהם. עדכנו קודם את הפריטים האלה. }}
# Error shown in the asset deletion dialog when the entries using the assets couldn’t be looked up,
# so the deletion can’t go ahead. {$count} is the number of assets being deleted
checking_asset_references_failed: |
  .input {$count :integer}
  .match $count
    one {{ לא ניתן לבדוק אילו פריטים משתמשים בקובץ המדיה הזה. סגרו את החלון ונסו שוב. }}
    *   {{ לא ניתן לבדוק אילו פריטים משתמשים בקובצי המדיה האלה. סגרו את החלון ונסו שוב. }}
# Delete entries: dialog titles and confirmation messages
# {$count} is the number of entries targeted by the action
delete_entries: |
  .input {$count :integer}
  .match $count
    one {{ מחיקת פריט }}
    *   {{ מחיקת פריטים }}
# {$count} is the number of selected entries
delete_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ מחיקת הפריט הנבחר }}
    *   {{ מחיקת הפריטים הנבחרים }}
confirm_deleting_this_entry: למחוק את הפריט הזה?
confirm_deleting_this_entry_with_assets: למחוק את הפריט הזה ואת קובצי המדיה המשויכים אליו?
# Error notification shown when an entry could not be deleted
deleting_entry_failed: מחיקת הפריט נכשלה. נסו שוב.
# {$count} is the number of selected entries
confirm_deleting_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ למחוק את הפריט הנבחר? }}
    two {{ למחוק את שני הפריטים הנבחרים? }}
    *   {{ למחוק את {$count} הפריטים הנבחרים? }}
# {$count} is the number of selected entries whose associated assets would also be removed
confirm_deleting_selected_entries_with_assets: |
  .input {$count :integer}
  .match $count
    one {{ למחוק את הפריט הנבחר ואת קובצי המדיה המשויכים אליו? }}
    two {{ למחוק את שני הפריטים הנבחרים ואת קובצי המדיה המשויכים אליהם? }}
    *   {{ למחוק את {$count} הפריטים הנבחרים ואת קובצי המדיה המשויכים אליהם? }}
confirm_deleting_all_entries: למחוק את כל הפריטים?
confirm_deleting_all_entries_with_assets: למחוק את כל הפריטים ואת קובצי המדיה המשויכים אליהם?
# Note added to the confirmation when other entries reference the entries being deleted through
# Relation fields; the references are removed in the same commit. {$count} is the number of
# referencing entries
deleting_referenced_entries_note: |
  .input {$count :integer}
  .match $count
    one {{ גם ההפניה אליו בפריט אחר תוסר. }}
    two {{ גם ההפניות אליו בשני פריטים אחרים יוסרו. }}
    *   {{ גם ההפניות אליו ב-{$count} פריטים אחרים יוסרו. }}
# Shown in place of the confirmation when removing the references would leave a Relation field in
# another entry invalid, e.g. a required field with nothing selected, so the deletion is refused.
# The fields are listed below the message, each with the validation error it would have. {$count}
# is the number of entries being deleted
cannot_delete_referenced_entries: |
  .input {$count :integer}
  .match $count
    one {{ לא ניתן למחוק את הפריט הזה, מפני שהשדות הבאים בפריטים אחרים לא יהיו תקינים בלעדיו. עדכנו קודם את הפריטים האלה. }}
    *   {{ לא ניתן למחוק את הפריטים האלה, מפני שהשדות הבאים בפריטים אחרים לא יהיו תקינים בלעדיהם. עדכנו קודם את הפריטים האלה. }}
# ==============================================================================
# Entry Reordering
# ==============================================================================
# Strings for manually reordering entries via drag-and-drop.

# Reorder mode: toggle buttons
reorder_entries: שינוי סדר הפריטים
done_reordering_entries: סיום שינוי הסדר
cancel_reordering_entries: ביטול שינוי הסדר

# Reorder error message
saving_reorder_failed: שמירת הסדר החדש נכשלה. נסו שוב.

# ==============================================================================
# Bulk Entry Editing
# ==============================================================================
# Strings for editing the fields of many entries at once in a table.

# Bulk edit mode: toggle buttons
bulk_edit_entries: עריכה מרוכזת של פריטים
save_bulk_edits: שמירת העריכה המרוכזת
cancel_bulk_edits: ביטול העריכה המרוכזת

# Bulk edit table: column header of the entry titles
bulk_edit_entry: פריט

# Bulk edit table: label of the table
bulk_edit_table: עורך מרוכז

# Bulk edit table: label of a cell input; {$field} is the field label, {$entry} is the entry title
bulk_edit_cell: '{$field} של {$entry}'

# Bulk edit status: number of changed fields
bulk_edit_count: |
  .input {$count :integer}
  .match $count
    0   {{ אין שינויים }}
    one {{ שינוי אחד }}
    two {{ שני שינויים }}
    *   {{ {$count} שינויים }}
# Bulk edit error messages
bulk_edit_invalid: חלק מהערכים אינם תקינים. תקנו את השדות המסומנים ונסו שוב.
saving_bulk_edits_failed: שמירת השינויים נכשלה. נסו שוב.

# Bulk edit: confirmation shown when leaving the mode with unsaved changes
discard_bulk_edits_confirm: לבטל את השינויים שבוצעו בפריטים?

# ==============================================================================
# File Upload and Processing
# ==============================================================================
# Strings for file upload dialogs, progress indicators, and validation.

# Processing indicator shown during file preparation
# {$count} is the number of files currently being processed
processing_files: |
  .input {$count :integer}
  .match $count
    one {{ מעבד קובץ. זה עשוי לקחת זמן. }}
    *   {{ מעבד קבצים. זה עשוי לקחת זמן. }}
# Uploading section aria-label
uploading_files: מעלה קבצים

# Replace file confirmation
# Dialog body when replacing an existing file
# {$name} is the existing file name that will be replaced
confirm_replacing_file: '„{$name}” יוחלף בקובץ הזה:'

# Upload confirmation with destination folder
# {$folder} is the destination folder label and {$count} is the number of files being uploaded
confirm_uploading_files: |
  .input {$count :integer}
  .match $count
    one {{ הקובץ הזה יישמר בתיקייה „{$folder}”: }}
    two {{ שני הקבצים האלה יישמרו בתיקייה „{$folder}”: }}
    *   {{ {$count} הקבצים האלה יישמרו בתיקייה „{$folder}”: }}
# File size validation
# Warning section for files exceeding size limits
oversized_files: קבצים גדולים מדי
# {$size} is the maximum allowed file size and {$count} is the number of oversized files
warning_oversized_files: |
  .input {$count :integer}
  .match $count
    one {{ לא ניתן להעלות את הקובץ הזה מפני שהוא חורג מהגודל המרבי, {$size}. הקטינו אותו או בחרו קובץ אחר. }}
    *   {{ לא ניתן להעלות את הקבצים האלה מפני שהם חורגים מהגודל המרבי, {$size}. הקטינו אותם או בחרו קבצים אחרים. }}
# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: קבצים לא תקינים
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    one {{ לא ניתן להעלות את הקובץ הזה מפני שהוא פגום, או שתוכנו אינו תואם לסיומת שלו. זה קורה לעיתים קרובות כששם התמונה שונה במקום שהיא הומרה, למשל תמונת HEIC שנשמרה כקובץ JPEG. המירו את הקובץ ונסו שוב. }}
    *   {{ לא ניתן להעלות את הקבצים האלה מפני שהם פגומים, או שתוכנם אינו תואם לסיומות שלהם. זה קורה לעיתים קרובות כששמות התמונות שונו במקום שהן הומרו, למשל תמונות HEIC שנשמרו כקובצי JPEG. המירו את הקבצים ונסו שוב. }}
# {$count} is the number of files that are not of a type the field accepts, even once transformed
# {$types} is the list of accepted file types, such as “.pdf or .txt”
warning_unsupported_files: |
  .input {$count :integer}
  .match $count
    one {{ לא ניתן להעלות את הקובץ הזה מפני שאינו מאחד הסוגים הבאים: {$types}. }}
    *   {{ לא ניתן להעלות את הקבצים האלה מפני שאינם מאחד הסוגים הבאים: {$types}. }}
# {$count} is the number of files that are not of an image type the field accepts
# {$types} is the list of accepted image formats, such as “PNG or WebP”
warning_unsupported_image_files: |
  .input {$count :integer}
  .match $count
    one {{ לא ניתן להעלות את הקובץ הזה מפני שמתקבלת רק תמונה מהסוגים הבאים: {$types}. }}
    *   {{ לא ניתן להעלות את הקבצים האלה מפני שמתקבלות רק תמונות מהסוגים הבאים: {$types}. }}
# File format validation when replacing an asset
# Warning section for replacement files that are in a different format
mismatched_files: קבצים שאינם תואמים
# {$name} is the name of the asset being replaced and {$count} is the number of mismatched files
warning_mismatched_files: |
  .input {$count :integer}
  .match $count
    one {{ הקובץ הזה אינו יכול להחליף את „{$name}” מפני שהוא בפורמט אחר. המירו אותו לאותו פורמט ונסו שוב. }}
    *   {{ הקבצים האלה אינם יכולים להחליף את „{$name}” מפני שהם בפורמט אחר. המירו אותם לאותו פורמט ונסו שוב. }}
# File name conflict resolution
# {$count} is the number of conflicting file names in the target folder
file_name_conflict_confirmation: |
  .input {$count :integer}
  .match $count
    one {{ קובץ בשם הזה כבר קיים בתיקייה. להחליף אותו? }}
    two {{ שני קבצים בשמות האלה כבר קיימים בתיקייה. להחליף אותם? }}
    *   {{ {$count} קבצים בשמות האלה כבר קיימים בתיקייה. להחליף אותם? }}
# {$name} is the conflicting file name when there is exactly one conflict; {$count} is the total conflict count
file_name_conflict_confirmation_with_name: |
  .input {$count :integer}
  .input {$name :string}
  .match $count
    one {{ קובץ בשם „{$name}” כבר קיים בתיקייה. להחליף אותו? }}
    two {{ שני קבצים בשמות האלה כבר קיימים בתיקייה. להחליף אותם? }}
    *   {{ {$count} קבצים בשמות האלה כבר קיימים בתיקייה. להחליף אותם? }}
file_name_conflict_resolution: טיפול בהתנגשות שמות קבצים
# Option to keep both files (rename the new one)
keep_both: שמירת שניהם

# Upload progress and error messages
uploading_files_progress: מעלה…
uploading_files_failed: ההעלאה נכשלה.
# Errors shown when a file on a cloud storage service could not be deleted or renamed
deleting_assets_failed: המחיקה נכשלה.
renaming_asset_failed: שינוי השם נכשל.
# Error shown when an edited text file in the Asset Library could not be saved
saving_asset_failed: השמירה נכשלה.

# File metadata display
# Appended when a file was auto-converted (e.g., HEIF to JPEG)
# {$type} is the original file type before conversion
file_meta_converted_from_x: (הומר מ-{$type})

# ==============================================================================
# Entry Management
# ==============================================================================
# Strings for creating and managing entries in collections

# Empty state messages
no_entries_created: אין עדיין פריטים באוסף הזה.
# Button to create first entry
create_new_entry: יצירת פריט חדש
# “Entry” option label in the create button menu
entry: פריט

# Special entry types
# Fallback label for collection index files when no custom label is configured
index_file: קובץ ראשי

# Empty state for file collections
no_files_in_collection: אין קבצים זמינים באוסף הזה.

# Entry duplication
duplicate_entry: שכפול הפריט
entry_duplicated: הפריט שוכפל כטיוטה חדשה.

# Validation errors
# Toast shown when entry has validation errors preventing save
# {$count} is the number of fields with validation errors
entry_validation_errors: |
  .input {$count :integer}
  .match $count
    one {{ בשדה אחד יש שגיאה. תקנו אותה כדי לשמור את הפריט. }}
    two {{ בשני שדות יש שגיאות. תקנו אותן כדי לשמור את הפריט. }}
    *   {{ ב-{$count} שדות יש שגיאות. תקנו אותן כדי לשמור את הפריט. }}
# Button on the validation error toast that opens the Validation panel listing the errors
show_errors: הצגת השגיאות

# ==============================================================================
# Success Notifications
# ==============================================================================
# Toast notifications shown after successful operations.

# Entry operations
# {$count} is the number of entries affected by the operation
entry_saved: |
  .input {$count :integer}
  .match $count
    one {{ הפריט נשמר. }}
    two {{ שני פריטים נשמרו. }}
    *   {{ {$count} פריטים נשמרו. }}
entry_saved_and_published: |
  .input {$count :integer}
  .match $count
    one {{ הפריט נשמר ופורסם. }}
    two {{ שני פריטים נשמרו ופורסמו. }}
    *   {{ {$count} פריטים נשמרו ופורסמו. }}
entries_deleted: |
  .input {$count :integer}
  .match $count
    one {{ הפריט נמחק. }}
    two {{ שני פריטים נמחקו. }}
    *   {{ {$count} פריטים נמחקו. }}
# Asset operations
# {$count} is the number of assets or asset-derived values affected by the operation
assets_saved: |
  .input {$count :integer}
  .match $count
    one {{ קובץ המדיה נשמר. }}
    two {{ שני קובצי מדיה נשמרו. }}
    *   {{ {$count} קובצי מדיה נשמרו. }}
assets_saved_and_published: |
  .input {$count :integer}
  .match $count
    one {{ קובץ המדיה נשמר ופורסם. }}
    two {{ שני קובצי מדיה נשמרו ופורסמו. }}
    *   {{ {$count} קובצי מדיה נשמרו ופורסמו. }}
asset_urls_copied: |
  .input {$count :integer}
  .match $count
    one {{ הכתובת הועתקה. }}
    two {{ שתי כתובות הועתקו. }}
    *   {{ {$count} כתובות הועתקו. }}
asset_paths_copied: |
  .input {$count :integer}
  .match $count
    one {{ נתיב הקובץ הועתק. }}
    two {{ שני נתיבי קבצים הועתקו. }}
    *   {{ {$count} נתיבי קבצים הועתקו. }}
asset_ids_copied: |
  .input {$count :integer}
  .match $count
    one {{ מזהה הקובץ הועתק. }}
    two {{ שני מזהי קבצים הועתקו. }}
    *   {{ {$count} מזהי קבצים הועתקו. }}
asset_data_copied: |
  .input {$count :integer}
  .match $count
    one {{ נתוני הקובץ הועתקו. }}
    two {{ נתוני שני קבצים הועתקו. }}
    *   {{ נתוני {$count} קבצים הועתקו. }}
assets_downloaded: |
