  array_item_changed: פריט השמור באותו קובץ שונה בידי מישהו אחר. נסו שוב.
  # {$path} is the file path
  array_file_invalid: לא ניתן לעדכן את הקובץ {$path}, מפני שאינו מכיל רשימת פריטים תקינה.

