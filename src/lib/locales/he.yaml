# Read https://github.com/sveltia/sveltia-cms/blob/main/src/lib/locales/README.md
# for instructions on how to add new languages or update existing translations.

# --- NOTES ---
# Follows the conventions set in the Hebrew locale of @sveltia/ui, so the two
# read as one product:
# 1. Prefer verbal nouns (like שמירה) over imperatives (like שמור)
# 2. Prefer neologisms (like סמלון) over loanwords (like אימוג'י)
# 3. Add a hyphen between Hebrew prefixes and English words (like ב-Markdown)
#
# Plus two of its own:
# 4. Hebrew has three plural categories — one, two, other (CLDR). The `two`
#    variant is only spelled out where the wording actually differs, e.g.
#    שני פריטים rather than 2 פריטים; where it would read the same as `*`
#    it is left out, so the count falls through.
# 5. Terms that collide in English are kept apart: Collection is אוסף,
#    Content is תוכן, Asset is קובץ מדיה, File is קובץ, Entry is פריט.

