  edit_conflict: „{$name}” שונה על ידי מישהו אחר מאז שערכתם אותו. פתחו אותו שוב מהשדה כדי לבדוק את השינויים שלכם מול הגרסה האחרונה.
  # Error shown when saving, if someone else has deleted an entry edited from the field since.
  # {$name} is the summary of that entry
  edit_deleted: „{$name}” נמחק על ידי מישהו אחר מאז שערכתם אותו. הסירו אותו מהשדה כדי לשמור את הפריט.
  # Accessible label of the menu listing the selected entries that can be edited
  select_entry_to_edit: בחירת פריט לעריכה
  # Warning shown in the editor of an entry that has been edited from a Relation field of another
  # entry, while the changes wait in that entry’s pull request. {$name} is the summary of that
  # entry
  edited_with_entry: השינויים בפריט הזה ממתינים לפרסום יחד עם „{$name}”. אם תשמרו אותו עכשיו, שתי קבוצות השינויים ישולבו כשהפריט ההוא יפורסם, וזה עלול להיכשל אם הן חופפות.
  # Warning shown in the dialog when an entry edited from the field has been changed by someone else
  # since. {$name} is the singular label of the collection
  changed_since_edit: ה{$name} הזה שונה על ידי מישהו אחר מאז שערכתם אותו. השינויים שלכם מוצגים מעל הגרסה האחרונה. בדקו אותם לפני העדכון.

