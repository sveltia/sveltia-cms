    one two {{ האוסף הזה מתקרב למכסה של פריט אחד. אפשר ליצור עוד שני פריטים בלבד. }}
    one *   {{ האוסף הזה מתקרב למכסה של פריט אחד. אפשר ליצור עוד {$remaining} פריטים בלבד. }}
    two one {{ האוסף הזה מתקרב למכסה של שני פריטים. אפשר ליצור עוד פריט אחד בלבד. }}
    two two {{ האוסף הזה מתקרב למכסה של שני פריטים. אפשר ליצור עוד שני פריטים בלבד. }}
    two *   {{ האוסף הזה מתקרב למכסה של שני פריטים. אפשר ליצור עוד {$remaining} פריטים בלבד. }}
    *   one {{ האוסף הזה מתקרב למכסה של {$quota} פריטים. אפשר ליצור עוד פריט אחד בלבד. }}
    *   two {{ האוסף הזה מתקרב למכסה של {$quota} פריטים. אפשר ליצור עוד שני פריטים בלבד. }}
