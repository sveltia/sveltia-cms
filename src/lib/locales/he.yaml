paste_item: הדבקת פריט
list_item_copied: הפריט הועתק.
# ⋮ stands for the icon of the item menu button; keep it, along with the button’s aria-label
no_list_item_to_paste: אין פריט מועתק להדבקה. כדי להעתיק פריט, פתחו את התפריט ⋮ (אפשרויות פריט הרשימה) שלו ובחרו „העתקה”.
list_item_not_compatible: הפריט שהועתק אינו מתאים לרשימה הזו.
# {$count} is the number of the values left out, as the list doesn’t have the fields
list_item_pasted_without_values: |
