        # {$app} is the name of the CMS
        subject: Ihr Passwort für {$app} wurde zurückgesetzt
        # {$app} is the name of the CMS
        message: Ihr Passwort für {$app} wurde zurückgesetzt, und Sie wurden überall abgemeldet. Öffnen Sie den folgenden Link, der Ihren Benutzernamen und Ihr temporäres Passwort ausfüllt, und legen Sie bei der Anmeldung ein neues Passwort fest.
    allowed_domains: Zulässige Domains
    allowed_domains_description: Die Websites, die Sveltia CMS Additions verwenden dürfen, ein Hostname pro Zeile. Ein Platzhalter (*) passt auf jede Subdomain, z. B. *.example.com. Geben Sie nach Möglichkeit exakte Hostnamen an. Die Liste gilt nur für diese Website, auch wenn dieselbe Instanz von Sveltia CMS Additions weitere Websites bedient.
    save_allowed_domains: Zulässige Domains speichern
    allowed_domains_saved: Die zulässigen Domains wurden gespeichert.
    sign_in_tab: Anmeldung
    # {$latest} is the newest version of Sveltia CMS Additions, {$current} the one in use
    update_available: Sveltia CMS Additions {$latest} ist verfügbar. Sie verwenden {$current}.
    release_notes: Versionshinweise
    github_username_optional: GitHub-Benutzername (optional)
    github_username_description: Mit einem GitHub-Benutzernamen meldet sich der Benutzer mit diesem GitHub-Konto statt mit einem Passwort an.
    # {$name} is the user’s name
    github_required: '{$name} kann sich nur mit GitHub anmelden, daher kann der GitHub-Benutzername nicht entfernt werden. Setzen Sie zuerst das Passwort zurück, damit sich die Person mit einem Passwort anmelden kann.'
    adopt: Konto übernehmen
    sign_in:
      github: Anmeldung mit GitHub erlauben
      github_description: Benutzer melden sich mit ihrem GitHub-Konto an und erhalten ein eigenes GitHub-Token, sodass ihre Änderungen unter ihrem Namen committet werden. Ein Admin fügt sie zuvor mit ihrem GitHub-Benutzernamen hinzu, sofern keine Registrierungsregel für sie gilt.
      # Shown when signing in with GitHub is being turned off while {$count} users can only sign in
      # with it
      github_only_warning: |
        .input {$count :integer}
        .match $count
          one {{ Ein Benutzer kann sich nur mit GitHub anmelden und kann sich nach dem Ausschalten nicht mehr anmelden, bis Sie das Passwort zurücksetzen. }}
          *   {{ {$count} Benutzer können sich nur mit GitHub anmelden und können sich nach dem Ausschalten nicht mehr anmelden, bis Sie ihre Passwörter zurücksetzen. }}
      rules: Registrierungsregeln
      rules_description: Mitglieder der GitHub-Organisation, in der die App installiert ist, können sich anmelden, ohne zuvor hinzugefügt zu werden. Ihr Konto erhält die von Ihnen gewählte Rolle und wird deaktiviert, wenn sie die Organisation verlassen, es sei denn, Sie übernehmen es.
      org: GitHub-Organisation
      add_rule: Regel hinzufügen
      # {$org} is the name of a GitHub organization
      remove_rule: Regel für {$org} entfernen
      # For a rule whose organization hasn’t been entered yet
      remove_empty_rule: Regel entfernen
      save: Anmeldeeinstellungen speichern
      saved: Die Anmeldeeinstellungen wurden gespeichert.
    domains_tab: Domains
    github_tab: GitHub
    github:
      app: GitHub App
      repository: Repository
      not_installed: Nicht installiert
      statuses:
        ok: Die App funktioniert.
        not_registered: Es ist noch keine GitHub App eingerichtet. Starten Sie den Einrichtungsassistenten auf der Anmeldeseite mit dem Admin-Secret.
        key_missing: Der private Schlüssel der App ging verloren, als das Admin-Secret ersetzt wurde. Erzeugen Sie in den App-Einstellungen auf GitHub einen neuen privaten Schlüssel und laden Sie ihn unten hoch.
        key_rejected: GitHub akzeptiert den privaten Schlüssel der App nicht, etwa weil er dort gelöscht wurde. Erzeugen Sie in den App-Einstellungen auf GitHub einen neuen privaten Schlüssel und laden Sie ihn unten hoch.
        not_installed: Die App ist im Repository nicht installiert. Installieren Sie sie erneut über die Seite der App auf GitHub oder starten Sie den Einrichtungsassistenten.
        suspended: Die Installation der App ist gesperrt. Heben Sie die Sperre in den Installationseinstellungen auf GitHub auf.
        unreachable: GitHub ist nicht erreichbar. Bitte später erneut versuchen.
