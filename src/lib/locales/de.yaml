  change_password: Passwort ändern
  # {$name} is the user’s username, {$role} their role, e.g. Editor
  signed_in_as_x_with_role: Angemeldet als {$name} ({$role})
  link_github: GitHub-Konto verknüpfen
  link_github_error: GitHub-Konto konnte nicht verknüpft werden
  current_password: Aktuelles Passwort
  # {$username} is the username filled in from a magic link emailed to the user
  filled_from_link: Benutzername und Passwort wurden aus einem Link übernommen. Melden Sie sich nur an, wenn „{$username}“ Ihr Benutzername ist.
