    # Don’t localize `preview_path`
    preview_path_no_date_field: Die Option `preview_path` verwendet Datums- und Zeit-Tags, die Sammlung hat aber kein DateTime-Feld, aus dem sie gelesen werden könnten. Der Vorschau-Link wird daher nicht angezeigt.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: Die Option `preview_path_date_field` verweist auf ein Feld namens `{$name}`, es ist aber kein DateTime-Feld mit diesem Namen definiert. Der Vorschau-Link wird daher nicht angezeigt.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: Die Option `preview_path` verweist auf `{$name}`, in der Sammlung ist aber kein solches Feld definiert. Der Vorschau-Link wird daher nicht angezeigt.
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: Die Sammlung hat kein Feld `{$name}`, nach dem neue Einträge benannt werden könnten, deshalb bekommt jeder neue Eintrag einen zufälligen Slug. Ein Feld `{$name}` ergänzen oder die Option `identifier_field` oder `slug` setzen.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: Die Option `i18n` von `slug` hat keine Wirkung, weil die Sammlung nicht die i18n-Struktur `multiple_files`, `multiple_folders` oder `multiple_root_folders` verwendet, bei der jede Sprache eine eigene Datei hat.
    # Don’t localize `slug`, `template` and `auto_increment`
    slug_template_ignored: Die Option `template` von `slug` wird ignoriert, weil die Option `auto_increment` die Slugs stattdessen durchnummeriert.
    # {$file} is the file path; Don’t localize `file`, `locale`, `i18n`, `false`,
    # `omit_default_locale_from_file_path` and the example paths. The curly brackets in the examples
    # are escaped with backslashes for MessageFormat 2
    locale_not_omitted_from_file_path: Der Platzhalter `locale` lässt sich nicht aus dem Pfad `file` `{$file}` entfernen, daher bleibt die Standardsprache trotz der i18n-Option `omit_default_locale_from_file_path` darin stehen. Um die Sprache wegzulassen, verwenden Sie den Platzhalter als ganzen Ordnernamen, etwa `\{\{locale\}\}/about.md`, oder zwischen Dateiname und Dateiendung, etwa `about.\{\{locale\}\}.md`. Um sie zu behalten, setzen Sie die Option in der Option `i18n` der Datei auf `false`.
    # Don’t localize `i18n`
    i18n_not_configured: Die Option `i18n` ist aktiviert, i18n ist aber weder auf der obersten Ebene der Konfiguration noch in der Sammlung konfiguriert, deshalb hat die Option keine Wirkung.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: Die Option `public_folder` ist eine leere Zeichenkette, daher wird für die in Einträgen gespeicherten Medienpfade stattdessen der Pfad aus `media_folder` verwendet. Entfernen Sie die Option oder setzen Sie sie auf den gewünschten Pfad, etwa `/images`.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: Die Option `{$option}` ist im Konfigurationsschema von Sveltia CMS nicht definiert. Sie wird ignoriert. Prüfen Sie auf einen Tippfehler oder einen Syntaxfehler.
    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: Die Option `default_localized` hat keine Wirkung, weil für die Sammlung i18n nicht aktiviert ist. Verwenden Sie stattdessen die Option `default`.
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: Die Option `default_localized` hat einen Wert für `{$locale}`, das keine der Sprachen der Sammlung ist, daher wird der Wert nie verwendet.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Einzelheiten stehen in den Kompatibilitätshinweisen: {$link}'

  # Console tip shown after config load
  schema_tip: Für eine bessere Entwicklungserfahrung können Sie Ihre Konfigurationsdatei gegen das JSON-Schema von Sveltia CMS prüfen. Einzelheiten unter {$link}.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Lokal
  # Browser compatibility warnings
  unsupported_browser: Der lokale Workflow wird von Ihrem Browser nicht unterstützt. Bitte verwenden Sie stattdessen Chrome oder Edge.
  disabled: Der lokale Workflow ist in Ihrem Browser deaktiviert. <a>So aktivieren Sie ihn</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Das Redaktions-Workflow-Board wird angezeigt. Entwürfe: {$draft}. In Prüfung: {$review}. Bereit: {$ready}. Löschung ausstehend: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Das Redaktions-Workflow-Board wird angezeigt. Entwürfe: {$draft}. In Prüfung: {$review}. Löschung ausstehend: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'Das Redaktions-Workflow-Board wird angezeigt. Entwürfe: {$draft}. Bereit: {$ready}. Löschung ausstehend: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'Die Seite „Entwürfe“ wird angezeigt. Entwürfe: {$draft}. Löschung ausstehend: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Entwurf
  drafts: Entwürfe
  in_review: In Prüfung
  ready: Bereit
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Löschung ausstehend
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: In Bereitstellung

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Löschung abbrechen
  confirm_cancelling_deletion: Soll diese Löschung wirklich abgebrochen werden? Der Eintrag bleibt veröffentlicht.
  confirm_completing_deletion: Soll dieser Eintrag wirklich gelöscht werden? Er wird sofort entfernt.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ Eintrag zur Löschung vorgemerkt. }}
      *   {{ {$count} Einträge zur Löschung vorgemerkt. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Änderungen verworfen. }}
      *   {{ Änderungen an {$count} Einträgen verworfen. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Löschung wird abgebrochen…
  deletion_cancelled: Löschung abgebrochen.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Die Löschung konnte nicht abgebrochen werden. Bitte erneut versuchen.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Unveröffentlichte Einträge
  published_entries: Veröffentlichte Einträge
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Status: {$status}'
  change_entry_status: Eintragsstatus ändern
  # Editor toolbar: progress label while the status is being changed
  changing_status: Status wird geändert…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Status wird aktualisiert…
  status_updated: Status aktualisiert.
  # Error notification when the status could not be changed
  status_change_failed: Der Status konnte nicht geändert werden. Bitte erneut versuchen.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: Neu laden
  refreshing: Wird neu geladen…
  refreshed: Die Übersicht ist auf dem neuesten Stand.
  # Error notification when the board could not be refreshed
  refresh_failed: Die Übersicht konnte nicht neu geladen werden. Bitte erneut versuchen.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: Der Eintrag enthält Fehler. Bitte beheben Sie sie, bevor Sie den Status ändern.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: Der Eintrag enthält Fehler. Bitte beheben Sie sie, bevor Sie ihn veröffentlichen.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Zur Prüfung einreichen
  confirm_sending_for_review: Die Änderungen wurden als Entwurf gespeichert. Soll der Eintrag zur Prüfung eingereicht werden, damit ihn jemand ansehen und veröffentlichen kann?
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: Als bereit markieren
  confirm_marking_as_ready: Ihre Änderungen wurden als Entwurf gespeichert. Den Eintrag als bereit markieren, damit er veröffentlicht werden kann?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Eintrag veröffentlichen
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Änderungen verwerfen
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Soll dieser Eintrag wirklich gelöscht werden? Er wird erst entfernt, wenn die Löschung veröffentlicht ist. Bis dahin steht er weiterhin in der Eintragsliste, markiert als „Löschung ausstehend“.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Dieser Eintrag wurde noch nicht veröffentlicht. Beim Löschen wird er vollständig verworfen.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Dieser Eintrag hat unveröffentlichte Änderungen. Beim Verwerfen wird die veröffentlichte Version wiederhergestellt. Der Eintrag selbst wird nicht gelöscht.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Er wurde noch nicht veröffentlicht, daher werden die unveröffentlichten Änderungen verworfen. Eine bereits veröffentlichte Version bleibt veröffentlicht. }}
      *   {{ Sie wurden noch nicht veröffentlicht, daher werden die unveröffentlichten Änderungen verworfen. Bereits veröffentlichte Versionen bleiben veröffentlicht. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ Einer davon wurde noch nicht veröffentlicht, daher werden die unveröffentlichten Änderungen verworfen. Eine bereits veröffentlichte Version bleibt veröffentlicht. }}
      *   {{ {$count} davon wurden noch nicht veröffentlicht, daher werden die unveröffentlichten Änderungen verworfen. Bereits veröffentlichte Versionen bleiben veröffentlicht. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: Soll dieser Eintrag wirklich veröffentlicht werden? Die Änderungen werden wirksam, sobald die Website neu erstellt wurde.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Eintrag wird veröffentlicht…
  entry_published: Eintrag veröffentlicht.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Eintrag wird gelöscht…
  discarding_changes: Änderungen werden verworfen…
  entry_deleted: Eintrag gelöscht.
  # Error notification when publishing fails
  publishing_entry_failed: Der Eintrag konnte nicht veröffentlicht werden. Bitte erneut versuchen.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: Dieser Eintrag kann hier nicht veröffentlicht werden, weil er weitere Änderungen mitbringt, die das CMS nicht anzeigen kann. Bitten Sie die Entwicklung, ihn zu prüfen.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: Der Eintrag wurde geändert, seit Sie ihn geöffnet haben. Laden Sie die Seite neu, um vor dem Veröffentlichen die aktuelle Fassung zu prüfen.
  review_on_x: Auf {$service} prüfen
  from_fork: Aus einem Fork
  fork_entry_editable: Dieser Eintrag stammt aus einem Pull Request, den eine beitragende Person aus „{$fork}“ geöffnet hat. Ihre Änderungen werden in deren Branch gespeichert. Prüfen und mergen Sie den Pull Request beim Git-Dienst.
  fork_entry_locked: Dieser Eintrag stammt aus einem Pull Request, den eine beitragende Person aus „{$fork}“ geöffnet hat. Die beitragende Person erlaubt der Projektbetreuung keine Bearbeitung, daher kann er hier nur angesehen werden.
  fork_not_editable: Die beitragende Person erlaubt der Projektbetreuung keine Bearbeitung dieses Pull Requests.
  fork_entry_gone: Der Pull Request der beitragenden Person ist nicht mehr offen, daher können die Änderungen nicht darin gespeichert werden.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: Für diesen Eintrag ist außerhalb des CMS bereits eine andere Anfrage ({$number}) offen. Bitten Sie die Entwicklung, sie zuerst zu schließen.
  # Workflow page: empty column message
  no_entries: Keine Einträge.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Ziehen, um den Status zu ändern
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Löschung
  # Workflow page: note on a card listing the new entries that were created from a Relation field
  # of the entry and are published along with it, e.g. “Also adds Section: Getting Started”
  companion_entries: Fügt außerdem {$entries} hinzu
  # Workflow page: note on a card listing the existing entries that were edited from a Relation
  # field of the entry and are published along with it, e.g. “Also changes Author: Ada Lovelace”
  edited_companion_entries: Ändert außerdem {$entries}
  # Workflow page: one of the entries listed by `companion_entries` or `edited_companion_entries`,
  # named by its collection’s singular label and its title
  companion_entry: '{$collection}: {$title}'

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: Commit-Nachricht
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: Beschreiben Sie Ihre Änderungen. Die Nachricht wird zusammen mit ihnen im Verlauf festgehalten.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: Ergänzen Sie die Nachricht, die zusammen mit Ihren Änderungen im Verlauf festgehalten wird, um eine Notiz, etwa eine Issue-Nummer. Das Feld kann leer bleiben.
  # Accessible name of the text box when the user writes the whole message
  message: Commit-Nachricht
  # Accessible name of the text box when the text is added before or after the message
  addition: Notiz
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'Nachricht: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Repository forken
  fork: Forken
  confirm_forking_repository: Um Änderungen an „{$repo}“ vorzuschlagen, muss in Ihrem Konto ein Fork des Repositorys angelegt werden. Ihre Änderungen werden in diesem Fork gespeichert und vor der Veröffentlichung von der Projektbetreuung geprüft.
  # Error shown when the user declined the dialog above
  fork_declined: Um Änderungen vorzuschlagen, wird ein Fork des Repositorys in Ihrem Konto benötigt.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Es konnte kein Fork des Repositorys „{$repo}“ in Ihrem Konto angelegt werden.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: Ihr Fork „{$fork}“ hat keinen Branch „{$branch}“. Aktualisieren Sie den Fork aus dem Repository „{$repo}“ und melden Sie sich dann erneut an.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Ihr Zugriff auf das Repository „{$repo}“ konnte nicht geprüft werden. Bitte gleich erneut versuchen.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Das Repository „{$repo}“ erlaubt keine Forks. Bitten Sie die Projektbetreuung, Forks dafür zu aktivieren.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Für das Repository „{$repo}“ liegt eine ausstehende Einladung vor. Nehmen Sie sie auf GitHub an und melden Sie sich danach erneut an.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Ihre Anmeldung umfasst keinen Zugriff auf private Repositorys, daher kann das Repository „{$repo}“ nicht gelesen werden. Bitten Sie die Projektbetreuung, die Authentifizierungseinstellungen des CMS zu prüfen.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Nur die Projektbetreuung kann Änderungen an dieser Website veröffentlichen. Setzen Sie Ihren Eintrag stattdessen auf „In Prüfung“, dann sieht ihn sich jemand an.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: Die Projektbetreuung hat diesen Eintrag bereits veröffentlicht, es gibt also nichts mehr zu prüfen.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Diese Änderung kann nicht direkt vorgenommen werden. Nur Bearbeitungen von Einträgen können zur Prüfung vorgeschlagen werden.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Ihre Änderungen werden in Ihrem Fork dieses Repositorys unter „{$repo}“ gespeichert und vor der Veröffentlichung geprüft.
  view_fork: Fork ansehen

# ==============================================================================
# Settings Dialog
# ==============================================================================
# Strings for the settings/preferences dialog and its panels.

# Settings page aria-label
categories: Kategorien

# Preferences panels
prefs:
  account:
    title: Konto
  # API key management feedback messages
  changes:
    api_key_saved: API-Schlüssel gespeichert.
    api_key_removed: API-Schlüssel entfernt.
    api_key_invalid: Der angegebene API-Schlüssel ist ungültig. Bitte prüfen und erneut versuchen.

  # Preferences operation errors
  error:
    permission_denied: Der Zugriff auf den Cookie-Speicher wurde verweigert. Bitte prüfen Sie die Berechtigungen Ihres Browsers und versuchen Sie es erneut.

  # Appearance panel
  appearance:
    title: Darstellung
    theme: Design
    select_theme: Design auswählen

  # Theme options
  theme:
    dark: Dunkel
    light: Hell

  # Language panel
  language:
    title: Sprache
    ui_language:
      title: Sprache der Benutzeroberfläche
      select_language: Sprache auswählen

  # Contents panel
  contents:
    title: Inhalte
    editor:
      title: Editor
      use_draft_backup:
        switch_label: Entwürfe von Einträgen automatisch sichern
      close_on_save:
        switch_label: Editor nach dem Speichern eines Entwurfs schließen
      close_with_escape:
        switch_label: Editor mit der Escape-Taste schließen

  # Internationalization panel
  i18n:
    title: Internationalisierung
    translators:
      default:
        title: Standard-Übersetzungsdienst
        select_service: Dienst auswählen
      api_keys:
        title: API-Schlüssel für Übersetzungsdienste
        description: API-Schlüssel für <a>Übersetzungsdienste</a> verwalten. API-Schlüssel für allgemeine KI-Dienste lassen sich in den KI-Einstellungen verwalten.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: '{$service}-Schlüssel'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Registrieren Sie sich bei <a {$homeHref}>{$service}</a> und geben Sie hier <a {$apiKeyHref}>Ihren API-Schlüssel</a> ein, um Textfelder schnell übersetzen zu können.

  # Media panel
  media:
    title: Medien
    stock_photos:
      api_keys:
        title: API-Schlüssel für Stockfoto-Dienste
        description: API-Schlüssel für <a>Stockfoto-Dienste</a> verwalten.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: '{$service}-API-Schlüssel'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Registrieren Sie sich für die <a {$homeHref}>{$service}-API</a> und geben Sie hier <a {$apiKeyHref}>Ihren API-Schlüssel</a> ein, um kostenlose Stockfotos in Bildfelder einzufügen.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Fotos bereitgestellt von {$service}
      no_services: Es sind keine <a>Stockfoto-Dienste</a> konfiguriert.
    cloud_storage:
      api_keys:
        title: API-Schlüssel für Cloud-Speicherdienste
        description: API-Schlüssel für <a>Cloud-Speicherdienste</a> verwalten.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: '{$service}-API-Schlüssel'
      no_services: Es sind keine <a>Cloud-Speicherdienste</a> konfiguriert.

  # AI panel
  ai:
    title: KI
    api_keys:
      title: API-Schlüssel für KI-Dienste
      description: API-Schlüssel für KI-Dienste verwalten.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: '{$service}-API-Schlüssel'

  # Accessibility panel
  accessibility:
    title: Barrierefreiheit
    underline_links:
      title: Links unterstreichen
      description: Links in der Eintragsvorschau und in Beschriftungen der Benutzeroberfläche unterstrichen darstellen.
      switch_label: Links immer unterstreichen

  # Data Management panel
  data:
    title: Datenverwaltung
    clear_data:
      title: Daten löschen
      # Clear File Cache button
      file_cache:
        description: Lokal zwischengespeicherte Dateiinhalte und Bildvorschauen löschen, um Speicherplatz freizugeben oder Probleme durch veraltete Daten zu beheben.
        button_label: Dateicache leeren
        confirmation: Die lokal zwischengespeicherten Dateiinhalte und Bildvorschauen werden gelöscht. Ungespeicherte Entwürfe und Einstellungen bleiben erhalten, gelöschte Daten werden bei Bedarf erneut heruntergeladen oder erzeugt. Das CMS wird danach neu geladen.
      # Erase All Data button
      all_data:
        description: Alles löschen, was das CMS in diesem Browser speichert, einschließlich zwischengespeicherter Dateien, ungespeicherter Entwürfe und Einstellungen. Bereits im Repository Gespeichertes ist nicht betroffen.
        button_label: Alle Daten löschen
        confirmation: Alle in diesem Browser gespeicherten Daten werden gelöscht, einschließlich zwischengespeicherter Dateiinhalte, Bildvorschauen, ungespeicherter Entwürfe, Einstellungen und Anmeldestatus. Das Repository ist nicht betroffen, aber alle nicht gespeicherten Änderungen gehen verloren, und Sie müssen sich erneut anmelden. Das CMS wird danach neu geladen.

  # Developer panel
  developer:
    title: Entwickler
    developer_mode:
      title: Entwicklermodus
      description: Einige Funktionen für die Entwicklung aktivieren, darunter ausführliche Konsolenausgaben und native Kontextmenüs.
      switch_label: Entwicklermodus aktivieren
    local_git:
      title: Git-Commits
      description: Änderungen bei jedem Speichern in den aktuellen Branch Ihres lokalen Repositorys committen, so wie es das CMS bei einem Remote-Repository tut. Die Commits lassen sich danach mit Ihren gewohnten Git-Werkzeugen prüfen und pushen.
      switch_label: Änderungen in Git committen
      checking: Repository wird geprüft…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Änderungen werden als {$name} ({$email}) in den Branch {$branch} committet.
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Änderungen können gerade nicht committet werden. {$reason}
    deploy_hook:
      title: Deploy-Hook
      description: Geben Sie eine Webhook-URL ein, die aufgerufen wird, wenn Sie über „Änderungen veröffentlichen“ manuell eine Bereitstellung auslösen. Bei Verwendung von GitHub Actions oder GitLab CI/CD kann das Feld leer bleiben.
      # Hook URL input
      url:
        field_label: Hook-URL
        saved: Hook-URL gespeichert.
        removed: Hook-URL entfernt.
      # Authorization header input
      auth:
        field_label: Authorization-Header (z. B. Bearer <token>) (optional)
        saved: Authorization-Header gespeichert.
        removed: Authorization-Header entfernt.

