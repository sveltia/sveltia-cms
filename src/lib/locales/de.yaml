    options: Benutzeroptionen
    reset_password: Passwort zurücksetzen
    sign_out_everywhere: Überall abmelden
    enable: Benutzer aktivieren
    disable: Benutzer deaktivieren
    delete: Benutzer löschen
    # {$name} is the user’s name
    reset_password_confirmation: '{$name} ein neues temporäres Passwort geben? Die Person wird überall abgemeldet und muss bei der nächsten Anmeldung ein neues Passwort festlegen.'
    delete_confirmation: '{$name} löschen? Dies kann nicht rückgängig gemacht werden.'
    temporary_password: Temporäres Passwort
    # {$name} is the user’s name
    temporary_password_description: Geben Sie diesen Benutzernamen und dieses temporäre Passwort an {$name} weiter. Das Passwort wird nicht erneut angezeigt, und die Person legt bei der Anmeldung ein eigenes fest.
    copy_username: Benutzername kopieren
    copy_password: Passwort kopieren
    # {$name} is the user’s name
    email_credentials: Per E-Mail an {$name}
    # The emails the admin sends from their own email app, with the sign-in details: `new` to a user
