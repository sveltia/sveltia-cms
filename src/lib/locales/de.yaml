# {$name} is the label of the item type that can be added
add_x: '{$name} hinzufügen'

# List item context menu
# aria-label for the button opening the menu, and for the menu itself
list_item_options: Optionen für das Listenelement
add_item_above: Element darüber einfügen
add_item_below: Element darunter einfügen
paste_item_above: Element oberhalb einfügen
paste_item_below: Element unterhalb einfügen
paste_item_to_replace: Einfügen und ersetzen

# List item clipboard
# Button in the list toolbar to paste a copied item, from any list in any entry, at the end of the
# list, or at the start with the `add_to_top` option
paste_item: Element einfügen
list_item_copied: Element kopiert.
# ⋮ stands for the icon of the item menu button; keep it, along with the button’s aria-label
no_list_item_to_paste: Es gibt kein kopiertes Element zum Einfügen. Um eines zu kopieren, öffnen Sie das Menü ⋮ (Optionen für das Listenelement) eines Elements und wählen Sie Kopieren.
list_item_not_compatible: Das kopierte Element passt nicht in diese Liste.
# {$count} is the number of the values left out, as the list doesn’t have the fields
list_item_pasted_without_values: |
  .input {$count :integer}
  .match $count
    one {{ Element eingefügt. Ein Wert, den diese Liste nicht aufnimmt, wurde ausgelassen. }}
    *   {{ Element eingefügt. {$count} Werte, die diese Liste nicht aufnimmt, wurden ausgelassen. }}
# {$count} is the number of the files the pasted item references that couldn’t be found
list_item_pasted_without_files: |
  .input {$count :integer}
  .match $count
    one {{ Element eingefügt, aber eine Datei, die es verwendet, wurde nicht gefunden. Prüfen Sie die Dateifelder des Elements. }}
    *   {{ Element eingefügt, aber {$count} Dateien, die es verwendet, wurden nicht gefunden. Prüfen Sie die Dateifelder des Elements. }}

# Variable-type list selector
select_list_type: Listentyp auswählen

# Variable-type mismatch
unknown_variable_type: Dieses Element kann wegen eines unbekannten Typs nicht angezeigt werden. Details stehen in der Browser-Konsole.

# ==============================================================================
# Field Widgets
# ==============================================================================
# Strings for specific field widget types.

# Color field: opacity slider
opacity: Deckkraft

# Select field: empty option placeholder
unselected_option: (keine)

# Relation field: creating or editing a referenced entry without leaving the editor
relation_field:
  # Note shown in the dialog. {$name} is the singular label of the referenced collection
  save_together_hint: Der neue Eintrag vom Typ „{$name}“ wird zusammen mit dem Eintrag gespeichert, der gerade bearbeitet wird.
  # Error shown when the entry couldn’t be prepared. {$name} is the singular label of the collection
  add_failed: „{$name}“ konnte nicht hinzugefügt werden. Details stehen in der Browser-Konsole.
  # Title of the dialog to edit an entry selected in the field. {$name} is the singular label of the
  # referenced collection
  edit_entry_title: '{$name} bearbeiten'
  # Note shown in the dialog. {$name} is the singular label of the referenced collection
  edit_together_hint: Ihre Änderungen am Eintrag vom Typ „{$name}“ werden zusammen mit dem Eintrag gespeichert, der gerade bearbeitet wird.
  # Error shown when the changes couldn’t be prepared. {$name} is the singular label of the collection
  edit_failed: Die Änderungen am Eintrag vom Typ „{$name}“ konnten nicht übernommen werden. Details stehen in der Browser-Konsole.
  # Error shown when the changes would move the entry to another file path, e.g. through a path
  # template using a field. {$name} is the singular label of the collection
  move_unsupported: Diese Änderungen würden den Eintrag vom Typ „{$name}“ an einen anderen Ort verschieben. Das geht nur, wenn Sie ihn einzeln bearbeiten.
  # Error shown when saving, if someone else has changed an entry edited from the field since. {$name}
  # is the summary of that entry
  edit_conflict: Der Eintrag „{$name}“ wurde von jemand anderem geändert, nachdem Sie ihn bearbeitet haben. Öffnen Sie ihn erneut über das Feld, um Ihre Änderungen mit dem neuesten Stand abzugleichen.
  # Error shown when saving, if someone else has deleted an entry edited from the field since.
  # {$name} is the summary of that entry
  edit_deleted: Der Eintrag „{$name}“ wurde von jemand anderem gelöscht, nachdem Sie ihn bearbeitet haben. Entfernen Sie ihn aus dem Feld, um speichern zu können.
  # Accessible label of the menu listing the selected entries that can be edited
  select_entry_to_edit: Eintrag zum Bearbeiten auswählen
  # Warning shown in the editor of an entry that has been edited from a Relation field of another
  # entry, while the changes wait in that entry’s pull request. {$name} is the summary of that
  # entry
  edited_with_entry: Änderungen an diesem Eintrag warten darauf, zusammen mit „{$name}“ veröffentlicht zu werden. Wenn Sie ihn jetzt speichern, werden beide Änderungen zusammengeführt, sobald jener Eintrag veröffentlicht wird. Das kann fehlschlagen, wenn sie sich überschneiden.
  # Warning shown in the dialog when an entry edited from the field has been changed by someone else
  # since. {$name} is the singular label of the collection
  changed_since_edit: Dieser Eintrag vom Typ „{$name}“ wurde von jemand anderem geändert, nachdem Sie ihn bearbeitet haben. Ihre Änderungen werden über dem neuesten Stand angezeigt. Prüfen Sie sie vor dem Aktualisieren.

# Select Assets dialog
assets_dialog:
  # Dialog titles for different selection modes
  title:
    file: Datei auswählen
    image: Bild auswählen
    folder: Ordner auswählen

  # Search input labels
  search_for_file: Nach Dateien suchen
  search_for_image: Nach Bildern suchen

  # Locations panel aria-label
  locations: Quellen

  # Folder selection mode for a File field with the `select_folder` option. {$path} is the public
  # path of the folder to be selected, and {$count} is the number of folders selected
  selected_folder: 'Ausgewählter Ordner: {$path}'
  selected_folders: |
    .input {$count :integer}
    .match $count
      one {{ {$count} Ordner ausgewählt }}
      *   {{ {$count} Ordner ausgewählt }}
  no_subfolders: Dieser Ordner enthält keine Unterordner.
  # Shown for a cloud storage service whose `prefix` option depends on fields of the entry
  prefix_unresolved: Füllen Sie die Felder aus, von denen dieser Speicherort abhängt, um seine Dateien zu durchsuchen und hochzuladen.

  # Asset folder options
  folder:
    field: Medien des Feldes
    entry: Medien des Eintrags
    file: Medien der Datei
    collection: Medien der Sammlung
    global: Globale Medien

  # Error messages
  error:
    invalid_key: Ihr API-Schlüssel ist ungültig oder abgelaufen. Bitte prüfen und erneut versuchen.
    search_fetch_failed: Bei der Suche nach Medien ist ein Fehler aufgetreten. Bitte später erneut versuchen.
    image_fetch_failed: Beim Herunterladen des ausgewählten Mediums ist ein Fehler aufgetreten. Bitte später erneut versuchen.

  # Stock photo panels
  available_images: Verfügbare Bilder
  available_files: Verfügbare Dateien

  # URL entry option
  enter_url: URL eingeben
  enter_file_url: 'URL der Datei eingeben:'
  enter_image_url: 'URL des Bildes eingeben:'

