      github_wrong_account: Die GitHub App wurde in einem Konto installiert, dem das Repository nicht gehört. Installieren Sie sie in dem Konto, dem das Repository gehört, und versuchen Sie es erneut.
      github_repository_not_included: Die GitHub App wurde ohne Zugriff auf das Repository installiert. Gewähren Sie ihr auf GitHub Zugriff auf das Repository und versuchen Sie es erneut.
