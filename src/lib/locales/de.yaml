# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: Dieses Feld ist erforderlich.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: Datum und Uhrzeit müssen auf {$min} oder danach liegen.
    date: Das Datum muss auf {$min} oder danach liegen.
    time: Die Uhrzeit muss auf {$min} oder danach liegen.
    number: Der Wert muss größer oder gleich {$min} sein.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Es muss mindestens {$min} Option ausgewählt werden. }}
        *   {{ Es müssen mindestens {$min} Optionen ausgewählt werden. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Es muss mindestens {$min} Element hinzugefügt werden. }}
        *   {{ Es müssen mindestens {$min} Elemente hinzugefügt werden. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: Datum und Uhrzeit müssen auf {$max} oder davor liegen.
    date: Das Datum muss auf {$max} oder davor liegen.
    time: Die Uhrzeit muss auf {$max} oder davor liegen.
    number: Der Wert muss kleiner oder gleich {$max} sein.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ Es darf höchstens {$max} Option ausgewählt werden. }}
        *   {{ Es dürfen höchstens {$max} Optionen ausgewählt werden. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ Es darf höchstens {$max} Element hinzugefügt werden. }}
        *   {{ Es dürfen höchstens {$max} Elemente hinzugefügt werden. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Es muss mindestens {$min} Zeichen eingegeben werden. }}
      *   {{ Es müssen mindestens {$min} Zeichen eingegeben werden. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ Es darf höchstens {$max} Zeichen eingegeben werden. }}
      *   {{ Es dürfen höchstens {$max} Zeichen eingegeben werden. }}

  # Type validation errors
  type_mismatch:
    number: Bitte geben Sie eine Zahl ein.
    email: Bitte geben Sie eine gültige E-Mail-Adresse ein.
    url: Bitte geben Sie eine gültige URL ein.

  # Value used for the same field in another entry of the collection
  value_not_unique: Dieser Wert wird bereits von einem anderen Eintrag verwendet.
  # Key of a keyed List field item used for another item of the same list
  key_not_unique: Dieser Schlüssel wird bereits von einem anderen Element verwendet.
  # Key of a keyed List field item that is a whole number, which doesn’t keep its order in a map
  key_numeric: Der Schlüssel darf keine ganze Zahl sein, sonst verlieren die Elemente ihre Reihenfolge.

  # Custom field validation error
  invalid_value: Ungültiger Wert.
  unexpected_error: Es ist ein unerwarteter Fehler aufgetreten.

# ==============================================================================
# Entry Sidebar
# ==============================================================================
# Panels shown in the entry editor sidebar.

entry_sidebar:
  # Sidebar tab list aria-label
  sidebar_panels: Seitenleisten-Bereiche

  # Validation panel: shows field validation errors
  validation:
    title: Prüfung
    placeholder: Die Prüfergebnisse werden hier angezeigt.
    no_errors_found: Keine Fehler gefunden.
    # Button in the panel header that validates the entry on demand
    validate: Validieren

  # Slug panel: shows the entry slug and lets the user edit it
  slug:
    title: Slug
    generated_on_save: Der Slug wird beim Speichern aus dem Inhalt des Eintrags erzeugt. Darin enthaltene Datums- und Zeitangaben entsprechen dem Zeitpunkt des Speicherns.
    unavailable: Dieser Eintrag hat keinen Slug.

  # History panel: shows entry commit history
  history:
    title: Verlauf
    fetch_failed: Der Verlauf konnte nicht geladen werden.
    no_history: Kein Verlauf vorhanden.

  # Backlinks panel: shows entries referencing this entry
  backlinks:
    title: Rückverweise
    no_entries: Kein Eintrag verweist auf diesen Eintrag.

  # Tab label of a panel with a count, e.g. of comments. {$title} is the panel title
  title_with_count: '{$title} ({$count})'

# Status shown next to the Save button while an entry with many new files is being saved
# {$done} and {$total} are the number of files prepared and to prepare, or the number of commits
# made and the estimated number of commits in all
save_progress:
  preparing: 'Dateien werden vorbereitet: {$done} von {$total}'
  committing: 'Wird auf GitHub gespeichert: {$done} von etwa {$total} Commits'

# Entry save error dialog
saving_entry:
  error:
    title: Fehler
    description: Beim Speichern des Eintrags ist ein Fehler aufgetreten. Bitte später erneut versuchen.

# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: Eintrag von jemand anderem geändert
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} hat diesen Eintrag am {$date} geändert, nachdem er hier geöffnet wurde.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Dieser Eintrag wurde im Repository geändert, nachdem er hier geöffnet wurde.
  deleted: Dieser Eintrag wurde im Repository gelöscht, nachdem er hier geöffnet wurde.
  # Follows `modified_by` or `modified`
  overwrite_warning: Wird jetzt gespeichert, gehen diese Änderungen verloren.
  # Follows `deleted`
  recreate_warning: Wird jetzt gespeichert, wird der Eintrag neu angelegt.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Da der Eintrag zusammen mit anderen Einträgen in einer Datei gespeichert ist, kann diese Änderung nicht überschrieben werden. Die Bearbeitung abbrechen, den Eintrag erneut aus der Liste öffnen und die Änderungen dann vornehmen.
  # OK button label
  save_anyway: Trotzdem speichern
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: Das Repository wurde während des Speicherns von jemand anderem aktualisiert. Bitte erneut versuchen.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Ein Eintrag in derselben Datei wurde von jemand anderem geändert. Bitte erneut versuchen.
  # {$path} is the file path
  array_file_invalid: Die Datei {$path} kann nicht aktualisiert werden, da sie keine gültige Liste von Einträgen enthält.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
# repository while the user has it open. The change itself is described with the `save_conflict`
# strings above
remote_change:
  reload_entry: Eintrag neu laden
  # Confirmation shown before reloading when the user has unsaved changes
  confirm_reloading_entry: Soll der Eintrag wirklich neu geladen werden? Nicht gespeicherte Änderungen gehen verloren.

