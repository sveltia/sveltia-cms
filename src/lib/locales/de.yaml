    credentials_email:
      # {$name} is the user’s name
      greeting: Hallo {$name},
      # {$url} is a link to the CMS that fills in the username and the temporary password
      sign_in_link: 'Anmeldelink: {$url}'
      # {$username} is the username
      username: 'Benutzername: {$username}'
      # {$password} is the temporary password
      password: 'Temporäres Passwort: {$password}'
      new:
        # {$app} is the name of the CMS
        subject: Ihre Anmeldedaten für {$app}
        # {$app} is the name of the CMS
        message: Sie können sich jetzt bei {$app} anmelden. Öffnen Sie den folgenden Link, der Ihren Benutzernamen und Ihr temporäres Passwort ausfüllt, und legen Sie bei der Anmeldung Ihr eigenes Passwort fest.
