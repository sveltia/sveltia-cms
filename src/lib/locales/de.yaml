back_to_collection_list: Zurück zur Liste der Sammlungen
asset_folder_list: Liste der Medienordner
back_to_asset_folder_list: Zurück zur Liste der Medienordner
# Back button shown in place of the one above while browsing a subfolder of an asset folder
back_to_parent_folder: Zurück zum übergeordneten Ordner

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: Suchergebnisse
# {$terms} is the current search query text
search_results_for_x: Suchergebnisse für „{$terms}“

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Suchergebnisse für „{$terms}“ werden angezeigt. Es wurden keine Einträge gefunden. }}
    one {{ Suchergebnisse für „{$terms}“ werden angezeigt. Es wurde ein Eintrag gefunden. }}
    *   {{ Suchergebnisse für „{$terms}“ werden angezeigt. Es wurden {$count} Einträge gefunden. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Suchergebnisse für „{$terms}“ werden angezeigt. Es wurden keine Medien gefunden. }}
    one {{ Suchergebnisse für „{$terms}“ werden angezeigt. Es wurde ein Medium gefunden. }}
    *   {{ Suchergebnisse für „{$terms}“ werden angezeigt. Es wurden {$count} Medien gefunden. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ Keine Einträge }}
    one {{ {$count} Eintrag }}
    *   {{ {$count} Einträge }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ Keine Medien }}
    one {{ {$count} Medium }}
    *   {{ {$count} Medien }}

# Empty state messages
no_files_found: Keine Dateien gefunden.
no_entries_found: Keine Einträge gefunden.

# ==============================================================================
# Asset Management
# ==============================================================================
# Strings for uploading, editing, and managing assets (images, documents, etc.).

# Upload dialog: title and button label
upload_assets: Neue Medien hochladen

# New Folder button and dialog in the Asset Library
new_folder: Neuer Ordner
new_folder_name: Ordnername
new_folder_create: Anlegen
# {$folder} is the path of the folder the new one will be created in, starting with a slash
new_folder_description: Der neue Ordner wird in „{$folder}“ angelegt.
# Validation errors for the new folder name
new_folder_error:
  empty: Der Ordnername darf nicht leer sein.
  invalid: Der Ordnername darf keine Schrägstriche enthalten und nicht mit einem Punkt beginnen.
  # A name the CMS itself is usually served from, e.g. `admin` or `cms`
  reserved: Die Dateien in einem Ordner mit diesem Namen sind schreibgeschützt, da das CMS selbst üblicherweise aus diesem Ordner ausgeliefert wird.
  duplicate: Ein Ordner oder eine Datei mit diesem Namen existiert hier bereits.
# Progress and error messages while the folder is being created
creating_folder: Ordner wird angelegt…
creating_folder_failed: Der Ordner konnte nicht angelegt werden.

# Menu on a folder in the Asset Library, and the Rename Folder and Delete Folder dialogs
folder_options: Ordneroptionen
show_folder_options: Ordneroptionen anzeigen
rename_folder: Ordner umbenennen
delete_folder: Ordner löschen
# Rename Folder dialog body text
# {$count} is the number of assets in the folder, which are moved along with it
enter_new_name_for_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Unten einen neuen Namen eingeben. }}
    one {{ Unten einen neuen Namen eingeben. Das Medium im Ordner wird mit verschoben, und jeder Eintrag, der es verwendet, wird aktualisiert. }}
    *   {{ Unten einen neuen Namen eingeben. Die {$count} Medien im Ordner werden mit verschoben, und alle Einträge, die sie verwenden, werden aktualisiert. }}
# Delete Folder confirmation
# {$name} is the folder name and {$count} is the number of assets in the folder
confirm_deleting_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Soll der leere Ordner „{$name}“ wirklich gelöscht werden? }}
    one {{ Soll der Ordner „{$name}“ mit dem darin enthaltenen Medium wirklich gelöscht werden? }}
    *   {{ Soll der Ordner „{$name}“ mit den {$count} darin enthaltenen Medien wirklich gelöscht werden? }}
# Progress and error messages while the folder is being renamed or deleted
renaming_folder: Ordner wird umbenannt…
renaming_folder_failed: Der Ordner konnte nicht umbenannt werden.
deleting_folder: Ordner wird gelöscht…
deleting_folder_failed: Der Ordner konnte nicht gelöscht werden.
# Asset Library and asset picker: notice shown when a cloud storage service holds more files than
# are listed at once
external_assets_truncated: Auf dem Dienst liegen zu viele Dateien, um alle aufzulisten, daher fehlen einige.

# Edit options menu: button and item labels
edit_options: Bearbeitungsoptionen
show_edit_options: Bearbeitungsoptionen anzeigen
# Copy menu aria-label
copy_options: Kopieroptionen
# Edit menu items with specific asset names
edit_asset: Medium bearbeiten
# {$name} is the selected asset name
edit_x: '{$name} bearbeiten'

# Asset text editor: switch for line wrapping
wrap_long_lines: Lange Zeilen umbrechen

# Move assets: dialog for moving assets to another folder in the repository
move: Verschieben
move_asset: Medium verschieben
# Dialog title. {$name} is the asset name when a single asset is moved, and {$count} is the number of
# assets being moved
move_assets_title: |
  .input {$count :integer}
  .match $count
    one {{ {$name} verschieben }}
    *   {{ {$count} Medien verschieben }}
# Dialog body text. {$count} is the number of entries that currently use the assets
select_asset_move_destination: |
  .input {$count :integer}
  .match $count
    0   {{ Wählen Sie den Zielordner aus. }}
    one {{ Wählen Sie den Zielordner aus. Ein Eintrag, der die Medien verwendet, wird ebenfalls aktualisiert. }}
    *   {{ Wählen Sie den Zielordner aus. {$count} Einträge, die die Medien verwenden, werden ebenfalls aktualisiert. }}
# Accessible label of the folder tree in the Move dialog
asset_move_destination: Zielordner
# Shown when the assets being moved are all in the selected folder already
assets_already_in_folder: |
  .input {$count :integer}
  .match $count
    one {{ Das Medium befindet sich bereits in diesem Ordner. }}
    *   {{ Die Medien befinden sich bereits in diesem Ordner. }}
# Shown when files with the same names exist in the selected folder. {$names} is a comma-separated
# list of file names
asset_move_conflict: 'Die folgenden Dateien existieren bereits in diesem Ordner: {$names}.'
moving_assets: Medien werden verschoben…
moving_assets_failed: Die Medien konnten nicht verschoben werden.
# Warning shown when files have been moved off a cloud storage service, but the originals couldn’t
# be deleted from it
asset_move_cleanup_failed: Die Dateien wurden verschoben, aber die Originale konnten nicht vom Speicherdienst gelöscht werden.
# Shown when files on a cloud storage service can’t be renamed or moved, because the entries using
# them can’t be updated, e.g. for an Open Authoring contributor. {$count} is the number of files
cannot_change_used_external_files: |
  .input {$count :integer}
  .match $count
    one {{ Diese Datei kann nicht umbenannt oder verschoben werden, da die Einträge, die sie verwenden, nicht aktualisiert werden können. }}
    *   {{ Diese Dateien können nicht umbenannt oder verschoben werden, da die Einträge, die sie verwenden, nicht aktualisiert werden können. }}

# Rename asset: dialog and validation
rename_asset: Medium umbenennen
# {$name} is the current asset name
rename_x: '{$name} umbenennen'
# Dialog body text indicating how many entries reference this asset
# {$count} is the number of entries that currently reference the asset
enter_new_name_for_asset: |
  .input {$count :integer}
  .match $count
    0   {{ Geben Sie unten einen neuen Namen ein. }}
    one {{ Geben Sie unten einen neuen Namen ein. Ein Eintrag, der dieses Medium verwendet, wird ebenfalls aktualisiert. }}
    *   {{ Geben Sie unten einen neuen Namen ein. {$count} Einträge, die dieses Medium verwenden, werden ebenfalls aktualisiert. }}
# Validation errors for asset renaming
enter_new_name_for_asset_error:
  empty: Der Dateiname darf nicht leer sein.
  character: Der Dateiname darf keine Sonderzeichen enthalten.
  duplicate: Dieser Dateiname wird bereits von einem anderen Medium verwendet.
  # A name starting with a dot hides the file, which the CMS wouldn’t list any more
  leading_dot: Der Dateiname darf nicht mit einem Punkt beginnen.
  # The name of a file next to the asset that isn’t an asset, like an entry file
  file_duplicate: Eine andere Datei mit diesem Namen existiert hier bereits.
  # The name of a folder next to the file
  folder_duplicate: Ein Ordner mit diesem Namen existiert hier bereits.
# Shown while renaming a file whose name will be changed on saving, e.g. by the `slugify_filename`
# media library option
file_will_be_saved_as: Die Datei wird als „{$name}“ gespeichert.
# Confirmation dialog shown when the file extension is changed while renaming an asset
change_file_extension: Dateiendung ändern
# {$oldExtension} and {$newExtension} are file extensions without a leading dot, e.g. png
confirm_file_extension_change:
  change: Soll die Endung wirklich von „.{$oldExtension}“ zu „.{$newExtension}“ geändert werden?
  add: Soll die Endung „.{$newExtension}“ wirklich hinzugefügt werden?
  remove: Soll die Endung „.{$oldExtension}“ wirklich entfernt werden?
file_extension_change_warning: Die Datei wird möglicherweise nicht korrekt angezeigt oder verarbeitet, wenn die Endung nicht zum tatsächlichen Dateiformat passt.

# Replace asset: menu item and dialog title
replace_asset: Medium ersetzen
# {$name} is the asset being replaced
replace_x: '{$name} ersetzen'
# File/Image field: labels of the Replace and Remove buttons
replace_file: Datei ersetzen
replace_image: Bild ersetzen
remove_file: Datei entfernen
remove_image: Bild entfernen

# File selection prompts: drop zones and file pickers
# Browse prompt shown when drag-and-drop is unavailable on desktop and pointer devices
click_to_browse: Zum Auswählen klicken…
# Browse prompt shown on touch devices
tap_to_browse: Zum Auswählen tippen…
# Drop zone text with browse button
# {$count} is the number of files expected by the current picker mode
drop_files_or_click_to_browse: |
  .input {$count :integer}
  .match $count
    one {{ Datei hierher ziehen oder zum Auswählen klicken… }}
    *   {{ Dateien hierher ziehen oder zum Auswählen klicken… }}
# Partial drop zone text (ends with inline button)
# {$count} is the number of files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Datei hierher ziehen oder }}
    *   {{ Dateien hierher ziehen oder }}
# Image-specific drop zone text
# {$count} is the number of image files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_image_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Bilddatei hierher ziehen oder }}
    *   {{ Bilddateien hierher ziehen oder }}

# File picker and clipboard actions used by upload controls
browse: Durchsuchen
# Generic clipboard paste action used by non-image file fields
paste: Einfügen
# Clipboard paste action used by image fields
paste_image: Bild einfügen

# Clipboard paste errors
no_image_in_clipboard: Kein Bild in der Zwischenablage gefunden.
clipboard_access_denied: Zugriff auf die Zwischenablage verweigert.

# Drag-and-drop overlay text (shown while dragging)
# {$count} is the number of files expected by the current picker mode
drop_files_here: |
  .input {$count :integer}
  .match $count
    one {{ Datei hierher ziehen }}
    *   {{ Dateien hierher ziehen }}

# File type validation errors
unsupported_file_type: Nicht unterstützter Dateityp
# {$type} is the expected asset type label, such as image or document
dropped_file_type_mismatch: 'Die abgelegte Datei hat keinen der folgenden Typen: {$types}. Bitte erneut versuchen.'
dropped_image_type_mismatch: 'Die abgelegte Datei wird nicht unterstützt. Zulässig ist nur ein Bild der folgenden Typen: {$types}. Bitte erneut versuchen.'

# File chooser button label
# {$count} is the number of files the picker allows the user to choose
choose_files: |
  .input {$count :integer}
  .match $count
    one {{ Datei auswählen }}
    *   {{ Dateien auswählen }}

# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    one {{ Medium löschen }}
    *   {{ Medien löschen }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Ausgewähltes Medium löschen }}
    *   {{ Ausgewählte Medien löschen }}
confirm_deleting_this_asset: Soll dieses Medium wirklich gelöscht werden?
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Soll das ausgewählte Medium wirklich gelöscht werden? }}
    *   {{ Sollen die ausgewählten {$count} Medien wirklich gelöscht werden? }}
confirm_deleting_all_assets: Sollen wirklich alle Medien gelöscht werden?
# Note added to the confirmation when entries use the assets being deleted; the references are
# removed in the same commit. {$count} is the number of entries using them
deleting_referenced_assets_note: |
  .input {$count :integer}
  .match $count
    one {{ Der Verweis darauf in einem Eintrag wird ebenfalls entfernt. }}
    *   {{ Die Verweise darauf in {$count} Einträgen werden ebenfalls entfernt. }}
# Shown in place of the confirmation when removing the references would leave a field in an entry
# invalid, e.g. a required Image field with nothing left, so the deletion is refused. The fields are
# listed below the message, each with the validation error it would have. {$count} is the number of
# assets being deleted
cannot_delete_referenced_assets: |
  .input {$count :integer}
  .match $count
    one {{ Dieses Medium kann nicht gelöscht werden, weil die folgenden Felder in den Einträgen, die es verwenden, ohne es nicht mehr gültig wären. Zuerst diese Einträge anpassen. }}
    *   {{ Diese Medien können nicht gelöscht werden, weil die folgenden Felder in den Einträgen, die sie verwenden, ohne sie nicht mehr gültig wären. Zuerst diese Einträge anpassen. }}
# Error shown in the asset deletion dialog when the entries using the assets couldn’t be looked up,
# so the deletion can’t go ahead. {$count} is the number of assets being deleted
checking_asset_references_failed: |
  .input {$count :integer}
  .match $count
    one {{ Es konnte nicht geprüft werden, welche Einträge dieses Medium verwenden. Schließen Sie diesen Dialog und versuchen Sie es erneut. }}
    *   {{ Es konnte nicht geprüft werden, welche Einträge diese Medien verwenden. Schließen Sie diesen Dialog und versuchen Sie es erneut. }}

# Delete entries: dialog titles and confirmation messages
# {$count} is the number of entries targeted by the action
delete_entries: |
  .input {$count :integer}
  .match $count
    one {{ Eintrag löschen }}
    *   {{ Einträge löschen }}
# {$count} is the number of selected entries
delete_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Ausgewählten Eintrag löschen }}
    *   {{ Ausgewählte Einträge löschen }}
confirm_deleting_this_entry: Soll dieser Eintrag wirklich gelöscht werden?
confirm_deleting_this_entry_with_assets: Sollen dieser Eintrag und die zugehörigen Medien wirklich gelöscht werden?
# Error notification shown when an entry could not be deleted
deleting_entry_failed: Der Eintrag konnte nicht gelöscht werden. Bitte erneut versuchen.
# {$count} is the number of selected entries
confirm_deleting_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Soll der ausgewählte Eintrag wirklich gelöscht werden? }}
    *   {{ Sollen die ausgewählten {$count} Einträge wirklich gelöscht werden? }}
# {$count} is the number of selected entries whose associated assets would also be removed
confirm_deleting_selected_entries_with_assets: |
  .input {$count :integer}
  .match $count
    one {{ Sollen der ausgewählte Eintrag und die zugehörigen Medien wirklich gelöscht werden? }}
    *   {{ Sollen die ausgewählten {$count} Einträge und die zugehörigen Medien wirklich gelöscht werden? }}
confirm_deleting_all_entries: Sollen wirklich alle Einträge gelöscht werden?
confirm_deleting_all_entries_with_assets: Sollen wirklich alle Einträge und die zugehörigen Medien gelöscht werden?
# Note added to the confirmation when other entries reference the entries being deleted through
# Relation fields; the references are removed in the same commit. {$count} is the number of
# referencing entries
deleting_referenced_entries_note: |
  .input {$count :integer}
  .match $count
    one {{ Der Verweis darauf in einem anderen Eintrag wird ebenfalls entfernt. }}
    *   {{ Die Verweise darauf in {$count} anderen Einträgen werden ebenfalls entfernt. }}
# Shown in place of the confirmation when removing the references would leave a Relation field in
# another entry invalid, e.g. a required field with nothing selected, so the deletion is refused.
# The fields are listed below the message, each with the validation error it would have. {$count}
# is the number of entries being deleted
cannot_delete_referenced_entries: |
  .input {$count :integer}
  .match $count
    one {{ Dieser Eintrag kann nicht gelöscht werden, weil die folgenden Felder in anderen Einträgen ohne ihn nicht mehr gültig wären. Zuerst diese Einträge anpassen. }}
    *   {{ Diese Einträge können nicht gelöscht werden, weil die folgenden Felder in anderen Einträgen ohne sie nicht mehr gültig wären. Zuerst diese Einträge anpassen. }}

# ==============================================================================
# Entry Reordering
# ==============================================================================
# Strings for manually reordering entries via drag-and-drop.

# Reorder mode: toggle buttons
reorder_entries: Einträge anordnen
done_reordering_entries: Anordnen beenden
cancel_reordering_entries: Anordnen abbrechen

# Reorder error message
saving_reorder_failed: Die neue Reihenfolge der Einträge konnte nicht gespeichert werden. Bitte erneut versuchen.

# ==============================================================================
# Bulk Entry Editing
# ==============================================================================
# Strings for editing the fields of many entries at once in a table.

# Bulk edit mode: toggle buttons
bulk_edit_entries: Mehrere Einträge bearbeiten
save_bulk_edits: Sammelbearbeitung speichern
cancel_bulk_edits: Sammelbearbeitung abbrechen

# Bulk edit table: column header of the entry titles
bulk_edit_entry: Eintrag

# Bulk edit table: label of the table
bulk_edit_table: Sammelbearbeitung

# Bulk edit table: label of a cell input; {$field} is the field label, {$entry} is the entry title
bulk_edit_cell: '{$field} von {$entry}'

# Bulk edit status: number of changed fields
bulk_edit_count: |
  .input {$count :integer}
  .match $count
    0   {{ Keine Änderungen }}
    one {{ 1 Änderung }}
    *   {{ {$count} Änderungen }}

# Bulk edit error messages
bulk_edit_invalid: Einige Werte sind ungültig. Korrigieren Sie die markierten Felder und versuchen Sie es erneut.
saving_bulk_edits_failed: Die Änderungen konnten nicht gespeichert werden. Bitte erneut versuchen.

# Bulk edit: confirmation shown when leaving the mode with unsaved changes
discard_bulk_edits_confirm: Die Änderungen an den Einträgen verwerfen?

# ==============================================================================
# File Upload and Processing
# ==============================================================================
# Strings for file upload dialogs, progress indicators, and validation.

# Processing indicator shown during file preparation
# {$count} is the number of files currently being processed
processing_files: |
  .input {$count :integer}
  .match $count
    one {{ Datei wird verarbeitet. Das kann einen Moment dauern. }}
    *   {{ Dateien werden verarbeitet. Das kann einen Moment dauern. }}

# Uploading section aria-label
uploading_files: Dateien werden hochgeladen

# Replace file confirmation
# Dialog body when replacing an existing file
# {$name} is the existing file name that will be replaced
confirm_replacing_file: '„{$name}“ wird durch diese Datei ersetzt:'

# Upload confirmation with destination folder
# {$folder} is the destination folder label and {$count} is the number of files being uploaded
confirm_uploading_files: |
  .input {$count :integer}
  .match $count
    one {{ Diese Datei wird im Ordner „{$folder}“ gespeichert: }}
    *   {{ Diese {$count} Dateien werden im Ordner „{$folder}“ gespeichert: }}

# File size validation
# Warning section for files exceeding size limits
oversized_files: Zu große Dateien
# {$size} is the maximum allowed file size and {$count} is the number of oversized files
warning_oversized_files: |
  .input {$count :integer}
  .match $count
    one {{ Diese Datei kann nicht hochgeladen werden, da sie die Maximalgröße von {$size} überschreitet. Bitte verkleinern Sie sie oder wählen Sie eine andere Datei. }}
    *   {{ Diese Dateien können nicht hochgeladen werden, da sie die Maximalgröße von {$size} überschreiten. Bitte verkleinern Sie sie oder wählen Sie andere Dateien. }}

# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: Ungültige Dateien
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    one {{ Diese Datei kann nicht hochgeladen werden, weil sie beschädigt ist oder ihr Inhalt nicht zur Dateiendung passt. Das passiert häufig, wenn ein Foto nur umbenannt statt umgewandelt wurde, etwa ein HEIC-Bild als JPEG-Datei gespeichert. Bitte wandeln Sie die Datei um und versuchen Sie es erneut. }}
    *   {{ Diese Dateien können nicht hochgeladen werden, weil sie beschädigt sind oder ihr Inhalt nicht zu ihren Dateiendungen passt. Das passiert häufig, wenn Fotos nur umbenannt statt umgewandelt wurden, etwa HEIC-Bilder als JPEG-Dateien gespeichert. Bitte wandeln Sie die Dateien um und versuchen Sie es erneut. }}
# {$count} is the number of files that are not of a type the field accepts, even once transformed
# {$types} is the list of accepted file types, such as “.pdf or .txt”
warning_unsupported_files: |
  .input {$count :integer}
  .match $count
    one {{ Diese Datei kann nicht hochgeladen werden, weil sie keinem der folgenden Typen entspricht: {$types}. }}
    *   {{ Diese Dateien können nicht hochgeladen werden, weil sie keinem der folgenden Typen entsprechen: {$types}. }}
# {$count} is the number of files that are not of an image type the field accepts
# {$types} is the list of accepted image formats, such as “PNG or WebP”
warning_unsupported_image_files: |
  .input {$count :integer}
  .match $count
    one {{ Diese Datei kann nicht hochgeladen werden, weil nur ein Bild der folgenden Typen angenommen wird: {$types}. }}
    *   {{ Diese Dateien können nicht hochgeladen werden, weil nur Bilder der folgenden Typen angenommen werden: {$types}. }}

# File format validation when replacing an asset
# Warning section for replacement files that are in a different format
mismatched_files: Dateien mit abweichendem Format
# {$name} is the name of the asset being replaced and {$count} is the number of mismatched files
warning_mismatched_files: |
  .input {$count :integer}
  .match $count
    one {{ Diese Datei kann „{$name}“ nicht ersetzen, weil sie ein anderes Format hat. Bitte wandeln Sie die Datei in dasselbe Format um und versuchen Sie es erneut. }}
    *   {{ Diese Dateien können „{$name}“ nicht ersetzen, weil sie ein anderes Format haben. Bitte wandeln Sie die Dateien in dasselbe Format um und versuchen Sie es erneut. }}

# File name conflict resolution
# {$count} is the number of conflicting file names in the target folder
file_name_conflict_confirmation: |
  .input {$count :integer}
  .match $count
    one {{ In diesem Ordner existiert bereits eine Datei mit demselben Namen. Soll sie ersetzt werden? }}
    *   {{ In diesem Ordner existieren bereits {$count} Dateien mit denselben Namen. Sollen sie ersetzt werden? }}
# {$name} is the conflicting file name when there is exactly one conflict; {$count} is the total conflict count
file_name_conflict_confirmation_with_name: |
  .input {$count :integer}
  .input {$name :string}
  .match $count
    one {{ In diesem Ordner existiert bereits eine Datei namens „{$name}“. Soll sie ersetzt werden? }}
    *   {{ In diesem Ordner existieren bereits {$count} Dateien mit denselben Namen. Sollen sie ersetzt werden? }}
file_name_conflict_resolution: Umgang mit Namenskonflikten
# Option to keep both files (rename the new one)
keep_both: Beide behalten

# Upload progress and error messages
uploading_files_progress: Wird hochgeladen…
uploading_files_failed: Hochladen fehlgeschlagen.
# Errors shown when a file on a cloud storage service could not be deleted or renamed
deleting_assets_failed: Löschen fehlgeschlagen.
renaming_asset_failed: Umbenennen fehlgeschlagen.
