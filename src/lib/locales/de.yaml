# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Die CMS-Konfiguration enthält einen Fehler. Bitte beheben Sie ihn und versuchen Sie es erneut. }}
      *   {{ Die CMS-Konfiguration enthält Fehler. Bitte beheben Sie sie und versuchen Sie es erneut. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: Sammlung {$collection}
    file: Datei {$file}
    component: Komponente {$component}
    # Don’t localize `{$field}`
    field: Feld `{$field}`

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS funktioniert nur mit HTTPS- oder localhost-URLs.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ Die URL der Konfigurationsdatei muss das HTTPS-Protokoll oder eine localhost-Adresse verwenden. }}
        *   {{ Die URLs der Konfigurationsdateien müssen das HTTPS-Protokoll oder localhost-Adressen verwenden. }}
    fetch_failed: Die Konfigurationsdatei konnte nicht abgerufen werden.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: Die HTTP-Antwort hat den Status {$status} zurückgegeben.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Die Konfigurationsdatei konnte nicht abgerufen werden. Damit die Datei `config.yml` nicht geladen wird, fügen Sie <a>`load_config_file: false`</a> zum Konfigurationsobjekt hinzu, das an `CMS.init()` übergeben wird.'
    parse_failed: Die Konfigurationsdatei konnte nicht eingelesen werden.
    parse_failed_invalid_object: Die Konfigurationsdatei ist kein gültiges JavaScript-Objekt.
    parse_failed_unsupported_type: Die Konfigurationsdatei hat keinen gültigen Dateityp. Unterstützt werden nur YAML, TOML und JSON.
    no_collection: Es sind keine Sammlungen definiert.
    # Don’t localize `hide`
    no_visible_collection: Mindestens eine Sammlung muss sichtbar sein. Prüfen Sie die Option `hide`.
    missing_backend: Das Backend ist nicht definiert.
    missing_backend_name: Der Name des Backends ist nicht definiert.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Das {$name}-Backend wird in Sveltia CMS <a>nicht unterstützt</a>.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Das veraltete {$name}-Backend wird in Sveltia CMS <a>nicht unterstützt</a>.
    unsupported_custom_backend: Eigene Backends werden in Sveltia CMS <a>nicht unterstützt</a>.
    unsupported_backend_suggestion: Verwenden Sie stattdessen eines der <a>unterstützten Backends</a>.
    missing_repository: Das Repository ist nicht definiert.
    invalid_repository: Das konfigurierte Repository ist ungültig. Es muss im Format „owner/repo“ angegeben werden.
    # Don’t localize `api_root`
    missing_api_root: Die Option `api_root` ist nicht definiert. Sie ist für das Forgejo-Backend erforderlich.
    invalid_root_dir: Das Stammverzeichnis ist ungültig. Es muss ein Pfad innerhalb des Repositorys sein, ohne „..“.
    invalid_root_dir_branch: Das Stammverzeichnis kann nicht in den Branch-Namen der Veröffentlichungsmodi `editorial_workflow` und `preview` verwendet werden. Kein Teil seines Pfads darf mit einem Punkt beginnen, auf „.lock“ enden oder ein Leerzeichen oder ein Sonderzeichen wie einen Doppelpunkt oder ein Sternchen enthalten.
    path_outside_root_dir: Der Pfad „{$path}“ führt aus dem Stammverzeichnis heraus, dort kann das CMS keine Dateien auflisten.
    oauth_implicit_flow: Die konfigurierte Authentifizierungsmethode (Implicit Flow) wird in Sveltia CMS nicht unterstützt. Verwenden Sie stattdessen eine andere <a>Authentifizierungsmethode</a>.
    github_pkce_unsupported: PKCE-Autorisierung wird aufgrund von Einschränkungen bei GitHub noch nicht unterstützt. Verwenden Sie stattdessen eine andere <a>Authentifizierungsmethode</a>.
    additions_no_base_url: Die Option `base_url` muss die URL Ihres Dienstes Sveltia CMS Additions sein.
    oauth_no_app_id: Die ID der OAuth-Anwendung ist nicht definiert.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: Die Option `open_authoring` erfordert den Veröffentlichungsmodus `editorial_workflow` oder `preview`. Details stehen in der <a>Dokumentation</a>.
    # Don’t localize `auth_methods`
    no_auth_methods: Die Option `auth_methods` muss mindestens eine Methode enthalten.
    # Don’t localize `auth_scope`, `repo` and `public_repo`
    auth_scope_no_repo: Die Option `auth_scope` muss `repo` oder `public_repo` enthalten.
    missing_media_folder: Der Medienordner ist nicht definiert.
    public_folder_relative_path: Der konfigurierte öffentliche Ordner ist ungültig. Er muss ein absoluter Pfad sein, der mit „/“ beginnt.
    public_folder_absolute_url: Eine absolute URL für die Option des öffentlichen Ordners wird in Sveltia CMS nicht unterstützt.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: Die Option `{$option}` enthält das Vorlagen-Tag `{$tag}`, das dort nicht unterstützt wird. Verwendet werden können nur die Slug-Vorlagen-Tags wie `\{\{slug\}\}` und `\{\{year\}\}` sowie die Tags `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` und `\{\{public_folder\}\}`.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: Die Option `{$option}` enthält das Vorlagen-Tag `{$tag}`, das nur in der Option einer Sammlung, einer Sammlungsdatei oder eines Feldes verwendet werden kann, wo es einen Eintrag gibt, mit dem es gefüllt wird.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: Die Option `sanitize_replacement` ist auf `{$replacement}` gesetzt, enthält aber ein Zeichen, das in einem Slug nicht vorkommen darf, und kann deshalb keines ersetzen.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: Die Option `{$option}` ist auf `{$url}` gesetzt, muss aber eine absolute URL sein, die mit `https://` oder `http://` beginnt.
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: Die Option `stages` von `publish_mode` muss mit `draft` beginnen und die Stufen in der Reihenfolge `draft`, `pending_review`, `pending_publish` auflisten, ohne eine zu wiederholen.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: Die Option `i18n.locales` muss mindestens eine Sprache enthalten.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: Die Option `default_locale` ist auf `{$locale}` gesetzt, in `locales` ist diese Sprache aber nicht enthalten.
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: Die Option `initial_locales` enthält `{$locale}`, in `locales` ist diese Sprache aber nicht enthalten.
    # Don’t localize `i18n`
    i18n_no_collections: 'Die Option `i18n` ist auf der obersten Ebene konfiguriert, aber keine Sammlung und keine Einzeldatei hat die Option `i18n`, daher lassen sich keine Inhalte übersetzen. Ergänzen Sie `i18n: true` bei den Sammlungen und Einzeldateien, die übersetzt werden sollen.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: Die Option `transformations` enthält den nicht unterstützten Schlüssel `{$key}`. Erlaubt sind `raster_image`, `svg` oder ein unterstütztes Rasterbildformat.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: Die Option `quality` der Transformation `{$key}` ist ungültig. Sie muss eine Ganzzahl zwischen 0 und 100 sein.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: Die Option `{$prop}` der Transformation `{$key}` ist ungültig. Sie muss eine positive Ganzzahl sein.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: Für die Mediensammlung {$count} muss die Option `name` als nicht leere Zeichenkette definiert sein.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Der Name der Mediensammlung `{$name}` ist ungültig. Er darf keine Sonderzeichen enthalten.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Namen von Mediensammlungen müssen eindeutig sein, aber `{$name}` wird mehrfach verwendet.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: Für die Sammlung muss entweder die Option `folder`, `file`, `files` oder `divider` definiert sein.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: Die Sammlung darf nur eine der Optionen `folder`, `file`, `files` und `divider` enthalten.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: Die Endung `{$extension}` passt nicht zum Format `{$format}`.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: Das Feld `{$name}` wird als Inhalt unterhalb des Front Matter gespeichert. Dort kann nur Text stehen, keine Zahl, kein Wahrheitswert, keine Liste und kein Objekt, wie es ein Feld vom Typ `{$widget}` speichert. Verwenden Sie einen Feldtyp für Text oder benennen Sie das Feld um.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
    # brackets are escaped with backslashes for MessageFormat 2
    invalid_collection_data_file: Die Option `file` `{$file}` ist ungültig. Sie muss der Pfad zu einer JSON-Datei sein, ohne den Platzhalter `\{\{locale\}\}`.
    # {$prop} is the option name; Don’t localize `file`
    unsupported_collection_data_file_option: Die Option `{$prop}` wird in einer Sammlung mit der Option `file` nicht unterstützt.
    # Don’t localize `file`, `publish_mode` and `simple`
    collection_data_file_workflow: Der Redaktions-Workflow und der Vorschau-Workflow, einschließlich Open Authoring, werden in einer Sammlung mit der Option `file` nicht unterstützt. Setzen Sie die Option `publish_mode` der Sammlung auf `simple`.
    # {$prop} is the option name; Don’t localize `file` and `slug`. The curly brackets are escaped
    # with backslashes for MessageFormat 2
    collection_data_file_slug_tag: Die Option `{$prop}` darf in einer Sammlung mit der Option `file` das Tag `\{\{slug\}\}` nicht enthalten, da der Slug eines Eintrags dort seine Position ist, die sich ändert, wenn Einträge neu angeordnet oder gelöscht werden. Verwenden Sie stattdessen ein Feld mit eindeutigem Wert.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Die Slug-Vorlage `{$slug}` ist ungültig, da sie keine Schrägstriche enthalten darf. Um Einträge in Unterordnern zu organisieren, verwenden Sie die Option `path` statt `slug`.
    # {$name} is the field name from the configuration; Don’t localize `identifier_field`
    invalid_identifier_field: Die Option `identifier_field` verweist auf ein Feld namens `{$name}`, in der Sammlung ist aber kein solches Feld definiert.
    # {$name} is the field name from the configuration; Don’t localize `filter`
    invalid_filter_field: Die Option `filter` verweist auf ein Feld namens `{$name}`, in der Sammlung ist aber kein solches Feld definiert.
    # Don’t localize `filter`, `value` and `pattern`
    invalid_filter_no_condition: Die Option `filter` braucht entweder die Option `value` oder die Option `pattern`, um Einträge abzugleichen.
    # {$option} is an option name such as `slug` or `summary` and {$name} is the field name or template tag from the configuration
    option_field_not_found: Die Option `{$option}` verweist auf `{$name}`, es ist aber kein solches Feld definiert.
    # {$name} is the field name from the configuration and {$widget} is its field type; Don’t localize `thumbnail`
    thumbnail_field_not_media: Die Option `thumbnail` verweist auf `{$name}`, das muss aber ein Bild- oder Datei-Feld sein, kein `{$widget}`-Feld.
    # Don’t localize `inline` or `multiple`
    invalid_inline_component_fields: Der Modus `inline` erfordert genau ein Feld vom Typ Boolean, Color, DateTime, Number, Relation, Select oder String. Bei einem Feld vom Typ Relation oder Select darf die Option `multiple` nicht aktiviert sein.
    # {$option} is an option name such as `pattern` or `filter` and {$pattern} is the configured pattern
    invalid_regex: Die Option `{$option}` enthält den ungültigen regulären Ausdruck `{$pattern}`, der ignoriert wird.
