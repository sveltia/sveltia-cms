    email_description: Sie wird in Ihren Commits verwendet, damit GitHub diese Ihrem Konto zuordnen kann. Ohne Adresse wird eine Platzhalteradresse verwendet. Nur ein Admin kann sie ändern.
    change_name: Name ändern
