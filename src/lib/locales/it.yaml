# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: Questo campo è obbligatorio.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: La data/ora deve essere uguale o successiva al {$min}.
    date: La data deve essere uguale o successiva al {$min}.
    time: L’ora deve essere uguale o successiva alle {$min}.
    number: Il valore deve essere maggiore o uguale a {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Devi selezionare almeno {$min} opzione. }}
        *   {{ Devi selezionare almeno {$min} opzioni. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Devi aggiungere almeno {$min} elemento. }}
        *   {{ Devi aggiungere almeno {$min} elementi. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: La data/ora deve essere uguale o precedente al {$max}.
    date: La data deve essere uguale o precedente al {$max}.
    time: L’ora deve essere uguale o precedente alle {$max}.
    number: Il valore deve essere minore o uguale a {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ Non puoi selezionare più di {$max} opzione. }}
        *   {{ Non puoi selezionare più di {$max} opzioni. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ Non puoi aggiungere più di {$max} elemento. }}
        *   {{ Non puoi aggiungere più di {$max} elementi. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Devi inserire almeno {$min} carattere. }}
      *   {{ Devi inserire almeno {$min} caratteri. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ Non puoi inserire più di {$max} carattere. }}
      *   {{ Non puoi inserire più di {$max} caratteri. }}

  # Type validation errors
  type_mismatch:
    number: Inserisci un numero.
    email: Inserisci un’email valida.
    url: Inserisci un URL valido.

  # Custom field validation error
  invalid_value: Valore non valido.
  unexpected_error: Si è verificato un errore imprevisto.

