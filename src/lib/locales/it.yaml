      one {{ {$count} carattere inserito. Minimo: {$min}. }}
      *   {{ {$count} caratteri inseriti. Minimo: {$min}. }}
  # {$count} is the current character count and {$max} is the maximum allowed count
  max: |
    .input {$count :integer}
    .match $count
      0   {{ Nessun carattere inserito. Massimo: {$max}. }}
      one {{ {$count} carattere inserito. Massimo: {$max}. }}
      *   {{ {$count} caratteri inseriti. Massimo: {$max}. }}

