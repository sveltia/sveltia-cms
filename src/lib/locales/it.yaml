    default_localized_without_i18n: L’opzione `default_localized` non ha effetto, perché l’i18n non è abilitata per la collezione. Usa invece l’opzione `default`.
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: L’opzione `default_localized` ha un valore per `{$locale}`, che non è una delle lingue della collezione, quindi il valore non viene mai usato.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Vedi le note di compatibilità per i dettagli: {$link}'

  # Console tip shown after config load
  schema_tip: Per una migliore esperienza di sviluppo, puoi convalidare il tuo file di configurazione con lo schema JSON di Sveltia CMS. Vedi {$link} per i dettagli.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Locale
  # Browser compatibility warnings
  unsupported_browser: Il Flusso Locale non è supportato nel tuo browser. Usa Chrome o Edge.
  disabled: Il Flusso Locale è disabilitato nel tuo browser. <a>Ecco come abilitarlo</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Stai visualizzando la bacheca del Flusso Editoriale. Bozze: {$draft}. In Revisione: {$review}. Pronti: {$ready}. In Attesa di Eliminazione: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Stai visualizzando la bacheca del Flusso Editoriale. Bozze: {$draft}. In Revisione: {$review}. In Attesa di Eliminazione: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'Stai visualizzando la bacheca del Flusso Editoriale. Bozze: {$draft}. Pronti: {$ready}. In Attesa di Eliminazione: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'Stai visualizzando la pagina Bozze. Bozze: {$draft}. In Attesa di Eliminazione: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Bozza
  drafts: Bozze
  in_review: In Revisione
  ready: Pronti
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: In Attesa di Eliminazione
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: In Pubblicazione

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Annulla Eliminazione
  confirm_cancelling_deletion: Sei sicuro di voler annullare questa eliminazione? La voce rimarrà pubblicata.
  confirm_completing_deletion: Sei sicuro di voler eliminare questa voce? Verrà rimossa immediatamente.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ Voce contrassegnata per l’eliminazione. }}
      *   {{ {$count} voci contrassegnate per l’eliminazione. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Modifiche scartate. }}
      *   {{ Modifiche a {$count} voci scartate. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Annullamento Eliminazione…
  deletion_cancelled: Eliminazione annullata.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Impossibile annullare l’eliminazione. Riprova.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Voci Non Pubblicate
  published_entries: Voci Pubblicate
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Stato: {$status}'
  change_entry_status: Cambia Stato Voce
  # Editor toolbar: progress label while the status is being changed
  changing_status: Cambio Stato…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Aggiornamento Stato…
  status_updated: Stato aggiornato.
  # Error notification when the status could not be changed
  status_change_failed: Impossibile cambiare lo stato. Riprova.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: Aggiorna
  refreshing: Aggiornamento…
  refreshed: La bacheca è aggiornata.
  # Error notification when the board could not be refreshed
  refresh_failed: Impossibile aggiornare la bacheca. Riprova.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: La voce contiene errori. Correggili prima di cambiare lo stato.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: La voce contiene errori. Correggili prima di pubblicarla.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Invia per Revisione
  confirm_sending_for_review: Le tue modifiche sono state salvate come bozza. Vuoi inviare la voce per la revisione in modo che qualcuno possa controllarla e pubblicarla?
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: Segna come Pronta
  confirm_marking_as_ready: Le tue modifiche sono state salvate come bozza. Vuoi segnare la voce come pronta in modo che possa essere pubblicata?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Pubblica Voce
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Scarta Modifiche
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Sei sicuro di voler eliminare questa voce? Non verrà rimossa finché l’eliminazione non sarà pubblicata. Fino ad allora la troverai nell’elenco delle voci, contrassegnata come In Attesa di Eliminazione.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Questa voce non è ancora stata pubblicata, quindi eliminarla la scarterà completamente.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Questa voce ha modifiche non pubblicate. Scartandole verrà ripristinata la versione pubblicata. La voce stessa non verrà eliminata.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Non è ancora stata pubblicata, quindi le tue modifiche non pubblicate verranno scartate. Qualsiasi versione pubblicata rimarrà invariata. }}
      *   {{ Non sono ancora state pubblicate, quindi le tue modifiche non pubblicate verranno scartate. Qualsiasi versione pubblicata rimarrà invariata. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ Una di queste non è ancora stata pubblicata, quindi le tue modifiche non pubblicate verranno scartate. Qualsiasi versione pubblicata rimarrà invariata. }}
      *   {{ {$count} di queste non sono ancora state pubblicate, quindi le tue modifiche non pubblicate verranno scartate. Qualsiasi versione pubblicata rimarrà invariata. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: Sei sicuro di voler pubblicare questa voce? Le tue modifiche saranno online non appena il sito sarà stato rigenerato.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Pubblicazione Voce…
  entry_published: Voce pubblicata.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Eliminazione Voce…
  discarding_changes: Scarto Modifiche…
  entry_deleted: Voce eliminata.
  # Error notification when publishing fails
  publishing_entry_failed: Impossibile pubblicare la voce. Riprova.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: Questa voce non può essere pubblicata qui, perché è accompagnata da altre modifiche che il CMS non può mostrarti. Chiedi a uno sviluppatore di esaminarla.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: La voce è stata modificata dopo che l’hai aperta. Ricarica la pagina per esaminare la versione più recente prima di pubblicarla.
  review_on_x: Esamina su {$service}
  from_fork: Da un fork
  fork_entry_editable: Questa voce proviene dalla pull request di un collaboratore aperta da “{$fork}”. Le tue modifiche vengono salvate nel suo branch. Esamina la pull request ed eseguine il merge sul servizio Git.
  fork_entry_locked: Questa voce proviene dalla pull request di un collaboratore aperta da “{$fork}”. Il collaboratore non consente ai manutentori di modificarla, quindi qui può essere solo visualizzata.
  fork_not_editable: Il collaboratore non consente ai manutentori di modificare questa pull request.
  fork_entry_gone: La pull request del collaboratore non è più aperta, quindi le modifiche non possono esservi salvate.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: Un’altra richiesta ({$number}) è già aperta per questa voce al di fuori del CMS. Chiedi a uno sviluppatore di chiuderla prima.
  # Workflow page: empty column message
  no_entries: Nessuna voce.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Trascina per cambiare lo stato
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Eliminazione
  # Workflow page: note on a card listing the new entries that were created from a Relation field
  # of the entry and are published along with it, e.g. “Also adds Section: Getting Started”
  companion_entries: Aggiunge anche {$entries}
  # Workflow page: note on a card listing the existing entries that were edited from a Relation
  # field of the entry and are published along with it, e.g. “Also changes Author: Ada Lovelace”
  edited_companion_entries: Modifica anche {$entries}
  # Workflow page: one of the entries listed by `companion_entries` or `edited_companion_entries`,
  # named by its collection’s singular label and its title
  companion_entry: '{$collection}: {$title}'

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: Messaggio di Commit
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: Descrivi le tue modifiche. Il messaggio viene registrato nella cronologia insieme a esse.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: Aggiungi una nota al messaggio registrato nella cronologia insieme alle tue modifiche, ad esempio il numero di una issue. Può essere lasciata vuota.
  # Accessible name of the text box when the user writes the whole message
  message: Messaggio di commit
  # Accessible name of the text box when the text is added before or after the message
  addition: Nota
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'Messaggio: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Crea Fork del Repository
  fork: Fork
  confirm_forking_repository: Per suggerire modifiche a “{$repo}”, deve essere creato un fork del repository sul tuo account. Le tue modifiche vengono salvate in quel fork e un manutentore le esamina prima che vengano pubblicate.
  # Error shown when the user declined the dialog above
  fork_declined: Hai bisogno di un fork del repository sul tuo account per suggerire modifiche.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Impossibile creare un fork del repository “{$repo}” sul tuo account.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: Il tuo fork “{$fork}” non ha il branch “{$branch}”. Aggiorna il fork dal repository “{$repo}”, poi accedi di nuovo.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Impossibile verificare il tuo accesso al repository “{$repo}”. Riprova tra poco.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Il repository “{$repo}” non consente i fork. Chiedi a un manutentore di abilitarli.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Hai un invito in sospeso per il repository “{$repo}”. Accettalo su GitHub, quindi accedi di nuovo.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Il tuo accesso non include i repository privati, quindi il repository “{$repo}” non può essere letto. Chiedi a un manutentore di controllare le impostazioni di autenticazione del CMS.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Solo un manutentore può pubblicare le modifiche su questo sito. Contrassegna la tua voce come In Revisione e qualcuno le darà un’occhiata.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: Un manutentore ha già pubblicato questa voce, quindi non c’è più niente da revisionare.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Questa modifica non può essere fatta direttamente. Solo le modifiche alle voci possono essere suggerite per la revisione.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Le tue modifiche vengono salvate nel tuo fork di questo repository in “{$repo}” e revisionate prima di essere pubblicate.
  view_fork: Visualizza Fork

# ==============================================================================
# Settings Dialog
# ==============================================================================
# Strings for the settings/preferences dialog and its panels.

# Settings page aria-label
categories: Categorie

# Preferences panels
prefs:
  account:
    title: Account
  # API key management feedback messages
  changes:
    api_key_saved: Chiave API salvata.
    api_key_removed: Chiave API rimossa.
    api_key_invalid: La chiave API fornita non è valida. Ricontrolla e riprova.

  # Preferences operation errors
  error:
    permission_denied: L’accesso all’archiviazione dei cookie è stato negato. Controlla i permessi del tuo browser e riprova.

  # Appearance panel
  appearance:
    title: Aspetto
    theme: Tema
    select_theme: Seleziona Tema

  # Theme options
  theme:
    dark: Scuro
    light: Chiaro

  # Language panel
  language:
    title: Lingua
    ui_language:
      title: Lingua dell’Interfaccia Utente
      select_language: Seleziona Lingua

  # Contents panel
  contents:
    title: Contenuti
    editor:
      title: Editor
      use_draft_backup:
        switch_label: Esegui automaticamente il backup delle bozze
      close_on_save:
        switch_label: Chiudi l’editor dopo aver salvato una bozza
      close_with_escape:
        switch_label: Chiudi l’editor con il tasto Esc

  # Internationalization panel
  i18n:
    title: Internazionalizzazione
    translators:
      default:
        title: Servizio di Traduzione Predefinito
        select_service: Seleziona Servizio
      api_keys:
        title: Chiavi API dei Servizi di Traduzione
        description: Gestisci le chiavi API per i <a>servizi di traduzione</a>. Le chiavi API per i servizi di IA generici possono essere gestite nelle impostazioni IA.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: Chiave {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Iscriviti a <a {$homeHref}>{$service}</a> e inserisci <a {$apiKeyHref}>la tua Chiave API</a> qui per abilitare la traduzione rapida dei campi di testo.

  # Media panel
  media:
    title: File Multimediali
    stock_photos:
      api_keys:
        title: Chiavi API dei Servizi di Foto Stock
        description: Gestisci le chiavi API per i <a>servizi di foto stock</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: Chiave API {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Iscriviti a <a {$homeHref}>API di {$service}</a> e inserisci <a {$apiKeyHref}>la tua Chiave API</a> qui per inserire foto stock gratuite nei campi immagine.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Foto fornite da {$service}
      no_services: Nessun <a>servizio di foto stock</a> è configurato.
    cloud_storage:
      api_keys:
        title: Chiavi API dei Servizi di Cloud Storage
        description: Gestisci le chiavi API per i <a>servizi di cloud storage</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: Chiave API {$service}
      no_services: Nessun <a>servizio di cloud storage</a> è configurato.

  # AI panel
  ai:
    title: IA
    api_keys:
      title: Chiavi API dei Servizi di IA
      description: Gestisci le chiavi API per i servizi di IA.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: Chiave API {$service}

  # Accessibility panel
  accessibility:
    title: Accessibilità
    underline_links:
      title: Sottolinea Link
      description: Mostra la sottolineatura per i link nell’anteprima della voce e nelle etichette dell’interfaccia utente.
      switch_label: Sottolinea Sempre i Link

  # Data Management panel
  data:
    title: Gestione Dati
    clear_data:
      title: Cancella Dati
      # Clear File Cache button
      file_cache:
        description: Elimina i contenuti dei file memorizzati nella cache locale e le miniature delle immagini per liberare spazio o risolvere problemi causati da dati obsoleti.
        button_label: Svuota Cache File
        confirmation: I contenuti dei file e le miniature delle immagini nella cache locale verranno eliminati. Le tue bozze non salvate e le impostazioni verranno mantenute, e qualsiasi dato eliminato verrà scaricato o generato di nuovo in base alle necessità. Il CMS verrà ricaricato al termine dell’operazione.
      # Erase All Data button
      all_data:
        description: Elimina tutto ciò che il CMS conserva in questo browser, inclusi i file memorizzati nella cache, le bozze non salvate e le impostazioni. Tutto ciò che è già stato salvato nel tuo repository non verrà interessato.
        button_label: Cancella Tutti i Dati
        confirmation: Tutti i dati memorizzati in questo browser verranno eliminati, inclusi i contenuti dei file nella cache, le miniature, le bozze non salvate, le impostazioni e lo stato di accesso. Il tuo repository non verrà interessato, ma qualsiasi modifica non salvata andrà persa e dovrai accedere di nuovo. Il CMS verrà ricaricato al termine dell’operazione.

  # Developer panel
  developer:
    title: Sviluppatore
    developer_mode:
      title: Modalità Sviluppatore
      description: Abilita alcune funzionalità orientate agli sviluppatori, inclusi log della console dettagliati e menu contestuali nativi.
      switch_label: Abilita Modalità Sviluppatore
    local_git:
      title: Commit Git
      description: Esegui il commit delle modifiche nel branch corrente del tuo repository locale ogni volta che le salvi, come fa il CMS quando lavori con un repository remoto. Potrai poi esaminare i commit ed eseguirne il push con i tuoi soliti strumenti Git.
      switch_label: Esegui il Commit delle Modifiche in Git
      checking: Controllo del repository…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Le modifiche verranno sottoposte a commit nel branch {$branch} come {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Al momento non è possibile eseguire il commit delle modifiche. {$reason}
    deploy_hook:
      title: Deploy Hook
      description: Inserisci un URL webhook da chiamare quando attivi manualmente una pubblicazione selezionando Pubblica Modifiche. Può essere lasciato vuoto se usi GitHub Actions o GitLab CI/CD.
      # Hook URL input
      url:
        field_label: URL Hook
        saved: URL Hook salvato.
        removed: URL Hook rimosso.
      # Authorization header input
      auth:
        field_label: Header di autorizzazione (es., Bearer <token>) (opzionale)
        saved: Header di autorizzazione salvato.
        removed: Header di autorizzazione rimosso.

