switching_language: Passaggio a {$locale}…
locale_load_failed: Impossibile caricare la traduzione in {$locale}. Riprova più tardi.

# Site and page navigation
# Toolbar button aria-label for visiting the live site
visit_live_site: Visita il Sito Live
# Page switcher button group aria-label for switching between main sections
switch_page: Cambia Pagina

# Search input placeholders
search_placeholder_contents: Cerca contenuti…
search_placeholder_assets: Cerca file multimediali…
search_placeholder_all: Cerca contenuti e file multimediali…

# Create button: aria-label for the create menu in the toolbar
create_entry_or_assets: Crea Voce o File Multimediali

# Publishing actions: button labels and progress indicators
publish_changes: Pubblica Modifiche
publishing_changes: Pubblicazione Modifiche…
# Error notification when publishing fails
publishing_changes_failed: Impossibile pubblicare le modifiche. Riprova.

# Notifications: button aria-labels and section headings
show_notifications: Mostra Notifiche
notifications: Notifiche

# Account menu: button aria-labels and section headings
show_account_menu: Mostra Menu Account
# Account section heading in the account menu and mobile menu page
account: Account

# Account menu items: links to external resources
live_site: Sito Live
git_repository: Repository Git
settings: Impostazioni

# Help menu: button aria-labels and section headings
show_help_menu: Mostra Menu Aiuto
# Help section heading in dropdowns and mobile menu
help: Aiuto

# Help menu items: documentation and support resources
keyboard_shortcuts: Scorciatoie da Tastiera
documentation: Documentazione
release_notes: Note di Rilascio
announcements: Annunci
# Version badge aria-label in the release notes menu item
# {$version} is the current app version string
version_x: 'Versione {$version}'
# Additional help menu items
report_issue: Segnala un Problema
share_feedback: Invia un Feedback
get_help: Richiedi Aiuto
donate: Dona
join_discord: Unisciti a noi su Discord
bluesky: Seguici su Bluesky

# Update notification: infobar message and button
update_available: È disponibile l’ultima versione di Sveltia CMS.
update_now: Aggiorna Ora

# Backend status notifications
# Shown when the Git backend (GitHub, GitLab, etc.) is experiencing issues
# {$service} is the backend service label shown in the toolbar notice, e.g., GitHub or GitLab
backend_status:
  minor_incident: '{$service} sta riscontrando alcuni problemi minori. Potrebbero presentarsi degli errori.'
  major_incident: '{$service} sta riscontrando gravi problemi. Ti consigliamo di attendere finché la situazione non sarà migliorata.'

# ==============================================================================
# Content and Asset Libraries
# ==============================================================================
# Strings used in the main content and asset management interfaces, including
# lists, navigation, and collection/folder views.

# Page container aria-labels
content_library: Libreria dei Contenuti
asset_library: Libreria dei File Multimediali

# Primary sidebar section headings and list aria-labels
collections: Collezioni
entries: Voci
files: File

# Asset location selector: option group labels
asset_location:
  # Assets stored in the site’s Git repository
  repository: Il Tuo Sito
  external: Posizioni Esterne
  stock_photos: Foto Stock

# Sidebar and list labels
# Collection assets panel aria-label
collection_assets: File Multimediali della Collezione
# List aria-labels for different list types
entry_list: Elenco delle Voci
file_list: Elenco dei File
asset_list: Elenco dei File Multimediali

# Collection and folder page titles
# Used as aria-labels on page containers
# {$collection} is the current collection label
x_collection: Collezione “{$collection}”
# {$folder} is the current asset folder label
x_asset_folder: Cartella File Multimediali “{$folder}”

# Navigation announcements (ARIA live regions)
# Announce page changes for screen reader users
viewing_collection_list: Stai visualizzando l’elenco delle collezioni.
viewing_asset_folder_list: Stai visualizzando l’elenco delle cartelle multimediali.
# Collection view announcements with entry counts
# {$collection} is the collection label and {$count} is the number of entries in it
viewing_x_collection: |
  .input {$count :integer}
  .match $count
    0   {{ Stai visualizzando la collezione “{$collection}”, che non contiene ancora nessuna voce. }}
    one {{ Stai visualizzando la collezione “{$collection}”, che contiene una voce. }}
    *   {{ Stai visualizzando la collezione “{$collection}”, che contiene {$count} voci. }}
# Asset folder view announcements with asset counts
# {$folder} is the folder label and {$count} is the number of assets in it
viewing_x_asset_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Stai visualizzando la cartella multimediale “{$folder}”, che non contiene ancora file. }}
    one {{ Stai visualizzando la cartella multimediale “{$folder}”, che contiene un file. }}
    *   {{ Stai visualizzando la cartella multimediale “{$folder}”, che contiene {$count} file. }}

# Singleton file selection announcement
# {$file} is the singleton file name
singleton_selected_announcement: Premi Invio per modificare il file “{$file}”.

# Error messages: page, collection, folder or file not found
page_not_found: Pagina non trovata.
collection_not_found: Collezione non trovata.
asset_folder_not_found: Cartella dei file multimediali non trovata.
file_not_found: File non trovato.

# Selection count indicator
# Shown in the toolbar when items are selected (e.g., “2 of 10 selected”)
# {$selected} is the selected item count and {$total} is the total item count
x_of_x_selected: '{$selected} di {$total} selezionati'

# View switcher: toggle between list and grid views
switch_view: Cambia Vista
list_view: Vista a Elenco
grid_view: Vista a Griglia
switch_to_list_view: Passa alla Vista a Elenco
switch_to_grid_view: Passa alla Vista a Griglia

