hide_info: Nascondi Info

# Folder display labels when no specific path is configured
all_assets: Tutti i File Multimediali
global_assets: File Multimediali Globali

# ==============================================================================
# Entry and Collection Actions
# ==============================================================================
# Strings related to creating, editing, and managing entries and collections.

# Message shown while entries are still being retrieved: in the entry editor, when it was opened
# with a direct link before all the data has been loaded, and on the Editorial Workflow page while
# the pull requests are being fetched. {$count} selects the form
loading_entries: |
  .input {$count :integer}
  .match $count
    one {{ Caricamento voce… }}
    *   {{ Caricamento voci… }}
# Error message when entry cannot be found
entry_not_found: Voce non trovata.

# Entry creation restrictions: tooltip and advisory messages
creating_entries_disabled_by_admin: La creazione di nuove voci in questa collezione è stata disabilitata dall’amministratore.
# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: Non puoi aggiungere nuove voci a questa collezione perché ha raggiunto il suo limite di {$quota} voci.
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$remaining :integer}
  .match $remaining
    one {{ Questa collezione si sta avvicinando al limite di {$quota} voci. Puoi creare ancora {$remaining} sola voce. }}
    *   {{ Questa collezione si sta avvicinando al limite di {$quota} voci. Puoi creare ancora {$remaining} voci. }}

# Navigation: back links and list labels
back_to_collection: Torna alla Collezione
collection_list: Elenco delle Collezioni
back_to_collection_list: Torna all’Elenco delle Collezioni
asset_folder_list: Elenco delle Cartelle Multimediali
back_to_asset_folder_list: Torna all’Elenco delle Cartelle Multimediali

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: Risultati della Ricerca
# {$terms} is the current search query text
search_results_for_x: Risultati della Ricerca per “{$terms}”

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Stai visualizzando i risultati della ricerca per “{$terms}”. Non abbiamo trovato nessuna voce. }}
    one {{ Stai visualizzando i risultati della ricerca per “{$terms}”. Abbiamo trovato una voce. }}
    *   {{ Stai visualizzando i risultati della ricerca per “{$terms}”. Abbiamo trovato {$count} voci. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Stai visualizzando i risultati della ricerca per “{$terms}”. Non abbiamo trovato nessun file multimediale. }}
    one {{ Stai visualizzando i risultati della ricerca per “{$terms}”. Abbiamo trovato un file multimediale. }}
    *   {{ Stai visualizzando i risultati della ricerca per “{$terms}”. Abbiamo trovato {$count} file multimediali. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ Nessuna voce }}
    one {{ {$count} voce }}
    *   {{ {$count} voci }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ Nessun file multimediale }}
    one {{ {$count} file multimediale }}
    *   {{ {$count} file multimediali }}

# Empty state messages
no_files_found: Nessun file trovato.
no_entries_found: Nessuna voce trovata.

# ==============================================================================
# Asset Management
# ==============================================================================
# Strings for uploading, editing, and managing assets (images, documents, etc.).

# Upload dialog: title and button label
upload_assets: Carica Nuovi File Multimediali

# Edit options menu: button and item labels
edit_options: Opzioni di Modifica
show_edit_options: Mostra Opzioni di Modifica
# Edit menu items with specific asset names
edit_asset: Modifica File Multimediale
# {$name} is the selected asset name
edit_x: 'Modifica {$name}'

# Asset text editor: switch for line wrapping
wrap_long_lines: Manda a capo le righe lunghe

# Rename asset: dialog and validation
rename_asset: Rinomina File Multimediale
# {$name} is the current asset name
rename_x: 'Rinomina {$name}'
# Dialog body text indicating how many entries reference this asset
# {$count} is the number of entries that currently reference the asset
enter_new_name_for_asset: |
  .input {$count :integer}
  .match $count
    0   {{ Inserisci un nuovo nome qui sotto. }}
    one {{ Inserisci un nuovo nome qui sotto. Verrà aggiornata anche una voce che utilizza questo file multimediale. }}
    *   {{ Inserisci un nuovo nome qui sotto. Verranno aggiornate anche {$count} voci che utilizzano questo file multimediale. }}
# Validation errors for asset renaming
enter_new_name_for_asset_error:
  empty: Il nome del file non può essere vuoto.
  character: Il nome del file non può contenere caratteri speciali.
  duplicate: Questo nome è già utilizzato per un altro file multimediale.
# Confirmation dialog shown when the file extension is changed while renaming an asset
change_file_extension: Cambia Estensione File
# {$oldExtension} and {$newExtension} are file extensions without a leading dot, e.g. png
confirm_file_extension_change:
  change: Sei sicuro di voler cambiare l’estensione da “.{$oldExtension}” a “.{$newExtension}”?
  add: Sei sicuro di voler aggiungere l’estensione “.{$newExtension}”?
  remove: Sei sicuro di voler rimuovere l’estensione “.{$oldExtension}”?
file_extension_change_warning: Il file potrebbe non essere visualizzato o gestito correttamente se l’estensione non corrisponde al formato reale del file.

# Replace asset: menu item and dialog title
replace_asset: Sostituisci File Multimediale
# {$name} is the asset being replaced
replace_x: 'Sostituisci {$name}'

