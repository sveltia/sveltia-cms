    # {$field} is the label of the Markdown field the credit is added to
    insert_to_field: Inserisci in {$field}
    copy_as_markdown: Copia come Markdown

  # Unsaved asset badge
  unsaved: Non salvato

# Character counter: shows character count for text fields
character_counter:
  # {$count} is the current character count; {$min} and {$max} are configured limits
  min_max: |
    .input {$count :integer}
    .match $count
      0   {{ Nessun carattere inserito. Minimo: {$min}. Massimo: {$max}. }}
      one {{ {$count} carattere inserito. Minimo: {$min}. Massimo: {$max}. }}
      *   {{ {$count} caratteri inseriti. Minimo: {$min}. Massimo: {$max}. }}
  # {$count} is the current character count and {$min} is the minimum allowed count
  min: |
    .input {$count :integer}
    .match $count
      0   {{ Nessun carattere inserito. Minimo: {$min}. }}
      one {{ {$count} carattere inserito. Minimo: {$min}. }}
      *   {{ {$count} caratteri inseriti. Minimo: {$min}. }}
  # {$count} is the current character count and {$max} is the maximum allowed count
  max: |
    .input {$count :integer}
    .match $count
      0   {{ Nessun carattere inserito. Massimo: {$max}. }}
      one {{ {$count} carattere inserito. Massimo: {$max}. }}
      *   {{ {$count} caratteri inseriti. Massimo: {$max}. }}

# YouTube video player iframe title
