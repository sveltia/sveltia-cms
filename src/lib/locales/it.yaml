        switch_label: Chiudi l’editor dopo aver salvato una bozza
      close_with_escape:
        switch_label: Chiudi l’editor con il tasto Esc

  # Internationalization panel
  i18n:
    title: Internazionalizzazione
    translators:
      default:
        title: Servizio di Traduzione Predefinito
        select_service: Seleziona Servizio
      api_keys:
        title: Chiavi API dei Servizi di Traduzione
        description: Gestisci le chiavi API per i <a>servizi di traduzione</a>.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: 'Chiave {$service}'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Iscriviti a <a {$homeHref}>{$service}</a> e inserisci <a {$apiKeyHref}>la tua Chiave API</a> qui per abilitare la traduzione rapida dei campi di testo.

  # Media panel
  media:
    title: File Multimediali
    stock_photos:
      api_keys:
        title: Chiavi API dei Servizi di Foto Stock
        description: Gestisci le chiavi API per i <a>servizi di foto stock</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: 'Chiave API {$service}'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Iscriviti a <a {$homeHref}>API di {$service}</a> e inserisci <a {$apiKeyHref}>la tua Chiave API</a> qui per inserire foto stock gratuite nei campi immagine.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Foto fornite da {$service}
      no_services: Nessun <a>servizio di foto stock</a> è configurato.
    cloud_storage:
      api_keys:
        title: Chiavi API dei Servizi di Cloud Storage
        description: Gestisci le chiavi API per i <a>servizi di cloud storage</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: 'Chiave API {$service}'
      no_services: Nessun <a>servizio di cloud storage</a> è configurato.

  # Accessibility panel
  accessibility:
    title: Accessibilità
    underline_links:
      title: Sottolinea Link
      description: Mostra la sottolineatura per i link nell’anteprima della voce e nelle etichette dell’interfaccia utente.
      switch_label: Sottolinea Sempre i Link

  # Advanced panel
  advanced:
    title: Avanzate
    beta:
      title: Funzionalità Beta
      description: Abilita alcune funzionalità beta che potrebbero essere instabili o non tradotte.
      switch_label: Partecipa al Programma Beta
    developer_mode:
      title: Modalità Sviluppatore
      description: Abilita alcune funzionalità orientate agli sviluppatori, inclusi log della console dettagliati e menu contestuali nativi.
      switch_label: Abilita Modalità Sviluppatore
    deploy_hook:
      title: Deploy Hook
      description: Inserisci un URL webhook da chiamare quando attivi manualmente una pubblicazione selezionando Pubblica Modifiche. Può essere lasciato vuoto se usi GitHub Actions.
      # Hook URL input
      url:
        field_label: URL Hook
        saved: URL Hook salvato.
        removed: URL Hook rimosso.
      # Authorization header input
      auth:
        field_label: Header di autorizzazione (es., Bearer <token>) (opzionale)
        saved: Header di autorizzazione salvato.
        removed: Header di autorizzazione rimosso.
    clear_data:
      title: Cancella Dati
      # Clear File Cache button
      file_cache:
        description: Elimina i contenuti dei file memorizzati nella cache locale e le miniature delle immagini per liberare spazio o risolvere problemi causati da dati obsoleti.
        button_label: Svuota Cache File
        confirmation: I contenuti dei file e le miniature delle immagini nella cache locale verranno eliminati. Le tue bozze non salvate e le impostazioni verranno mantenute, e qualsiasi dato eliminato verrà scaricato o generato di nuovo in base alle necessità. Il CMS verrà ricaricato al termine dell’operazione.
      # Erase All Data button
      all_data:
        description: Elimina tutto ciò che il CMS conserva in questo browser, inclusi i file memorizzati nella cache, le bozze non salvate e le impostazioni. Tutto ciò che è già stato salvato nel tuo repository non verrà interessato.
        button_label: Cancella Tutti i Dati
        confirmation: Tutti i dati memorizzati in questo browser verranno eliminati, inclusi i contenuti dei file nella cache, le miniature, le bozze non salvate, le impostazioni e lo stato di accesso. Il tuo repository non verrà interessato, ma qualsiasi modifica non salvata andrà persa e dovrai accedere di nuovo. Il CMS verrà ricaricato al termine dell’operazione.

