  folder:
    field: File Multimediali del Campo
    entry: File Multimediali della Voce
    file: File Multimediali del File
    collection: File Multimediali della Collezione
    global: File Multimediali Globali

  # Error messages
  error:
    invalid_key: La tua chiave API non è valida o è scaduta. Ricontrolla e riprova.
    search_fetch_failed: Si è verificato un errore durante la ricerca dei file multimediali. Riprova più tardi.
    image_fetch_failed: Si è verificato un errore durante il download del file multimediale selezionato. Riprova più tardi.

  # Stock photo panels
