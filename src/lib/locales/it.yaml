      branch_unprotected: Nessun ruleset protegge il branch “{$branch}” da force push ed eliminazione, quindi gli editor potrebbero riscriverne la cronologia o eliminarlo. Aggiungi nelle impostazioni del repository un ruleset che blocchi entrambi, senza l’app nella sua lista di bypass.
