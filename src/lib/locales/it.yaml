# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ C’è un errore nella configurazione del CMS. Risolvi il problema e riprova. }}
      *   {{ Ci sono errori nella configurazione del CMS. Risolvi i problemi e riprova. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: Collezione {$collection}
    file: File {$file}
    component: Componente {$component}
    # Don’t localize `{$field}`
    field: Campo `{$field}`

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS funziona solo con HTTPS o URL localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ L’URL del file di configurazione deve usare il protocollo HTTPS o un indirizzo localhost. }}
        *   {{ Gli URL del file di configurazione devono usare il protocollo HTTPS o indirizzi localhost. }}
    fetch_failed: Impossibile recuperare il file di configurazione.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: La risposta HTTP ha restituito lo stato {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Impossibile recuperare il file di configurazione. Per impedire il caricamento del file `config.yml`, aggiungi <a>`load_config_file: false`</a> all’oggetto di configurazione passato a `CMS.init()`.'
    parse_failed: Impossibile analizzare il file di configurazione.
    parse_failed_invalid_object: Il file di configurazione non è un oggetto JavaScript valido.
    parse_failed_unsupported_type: Il tipo di file di configurazione non è valido. Sono supportati solo YAML, TOML e JSON.
    no_collection: Le collezioni non sono state definite.
    # Don’t localize `hide`
    no_visible_collection: Deve essere visibile almeno una collezione. Controlla l’opzione `hide`.
    missing_backend: Il backend non è definito.
    missing_backend_name: Il nome del backend non è definito.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Il backend {$name} <a>non è supportato</a> in Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Il backend deprecato {$name} <a>non è supportato</a> in Sveltia CMS.
    unsupported_custom_backend: I backend personalizzati <a>non sono supportati</a> in Sveltia CMS.
    unsupported_backend_suggestion: Usa invece uno dei <a>backend supportati</a>.
    missing_repository: Il repository non è stato definito.
    invalid_repository: Il repository configurato non è valido. Deve essere nel formato “owner/repo”.
    # Don’t localize `api_root`
    missing_api_root: L’opzione `api_root` non è definita. È obbligatoria per il backend Forgejo.
    invalid_root_dir: La directory principale non è valida. Deve essere un percorso all’interno del repository, senza “..”.
    invalid_root_dir_branch: La directory principale non può essere usata nei nomi dei branch delle modalità di pubblicazione `editorial_workflow` e `preview`. Nessuna parte del suo percorso può iniziare con un punto, terminare con “.lock” o contenere uno spazio o un carattere speciale come i due punti o un asterisco.
    path_outside_root_dir: Il percorso “{$path}” porta al di fuori della directory principale, dove il CMS non può elencare i file.
    oauth_implicit_flow: Il metodo di autenticazione configurato (flusso implicito) non è supportato in Sveltia CMS. Usa un <a>metodo di autenticazione</a> diverso.
    github_pkce_unsupported: L’autorizzazione PKCE non è ancora supportata a causa delle limitazioni di GitHub. Usa un <a>metodo di autenticazione</a> diverso.
    additions_no_base_url: L’opzione `base_url` deve essere l’URL del tuo servizio Sveltia CMS Additions.
    oauth_no_app_id: L’ID dell’applicazione OAuth non è stato definito.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: L’opzione `open_authoring` richiede la modalità di pubblicazione `editorial_workflow` o `preview`. Consulta la <a>documentazione</a> per i dettagli.
    # Don’t localize `auth_methods`
    no_auth_methods: L’opzione `auth_methods` deve contenere almeno un metodo.
    # Don’t localize `auth_scope`, `repo` and `public_repo`
    auth_scope_no_repo: L’opzione `auth_scope` deve includere `repo` o `public_repo`.
    missing_media_folder: La cartella dei file multimediali non è stata definita.
    public_folder_relative_path: La cartella pubblica configurata non è valida. Deve essere un percorso assoluto che inizia con “/”.
    public_folder_absolute_url: Un URL assoluto per l’opzione della cartella pubblica non è supportato in Sveltia CMS.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: L’opzione `{$option}` contiene il tag di template `{$tag}`, che lì non è supportato. Si possono usare solo i tag di template dello slug, come `\{\{slug\}\}` e `\{\{year\}\}`, e i tag `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` e `\{\{public_folder\}\}`.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: L’opzione `{$option}` contiene il tag di template `{$tag}`, che può essere usato solo nell’opzione di una collezione, di un file di collezione o di un campo, dove c’è una voce con cui compilarlo.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: L’opzione `sanitize_replacement` è impostata su `{$replacement}`, ma contiene un carattere che non può essere usato in uno slug, quindi non può sostituirne uno.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: L’opzione `{$option}` è impostata su `{$url}`, ma deve essere un URL assoluto che inizia con `https://` o `http://`.
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: L’opzione `stages` di `publish_mode` deve iniziare con `draft` ed elencare le fasi nell’ordine `draft`, `pending_review`, `pending_publish`, senza ripeterne nessuna.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: L’opzione `i18n.locales` deve elencare almeno una lingua.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: L’opzione `default_locale` è impostata su `{$locale}`, ma non è una delle `locales`.
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: L’opzione `initial_locales` contiene `{$locale}`, ma non è una delle `locales`.
    # Don’t localize `i18n`
    i18n_no_collections: 'L’opzione `i18n` è configurata al livello principale, ma nessuna delle collezioni o dei singleton ha l’opzione `i18n`, quindi nessun contenuto può essere tradotto. Aggiungi `i18n: true` alle collezioni e ai singleton da tradurre.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: L’opzione `transformations` contiene una chiave `{$key}` non supportata. Deve essere `raster_image`, `svg` o un formato di immagine raster supportato.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: L’opzione `quality` per la trasformazione `{$key}` non è valida. Deve essere un intero compreso tra 0 e 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: L’opzione `{$prop}` per la trasformazione `{$key}` non è valida. Deve essere un intero positivo.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: La collezione di file multimediali {$count} deve avere l’opzione `name` definita come stringa non vuota.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Il nome della collezione di file multimediali `{$name}` non è valido. Non deve contenere caratteri speciali.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: I nomi delle collezioni di file multimediali devono essere univoci, ma `{$name}` è usato più di una volta.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: La collezione deve avere definita una tra le opzioni `folder`, `file`, `files` o `divider`.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: La collezione non può avere più di una tra le opzioni `folder`, `file`, `files` e `divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: L’estensione `{$extension}` non corrisponde al formato `{$format}`.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: Il campo `{$name}` viene salvato come corpo sotto il front matter, che può contenere solo testo, non un numero, un booleano, un elenco o un oggetto come fa un campo `{$widget}`. Usa un tipo di campo che contenga testo o rinomina il campo.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
    # brackets are escaped with backslashes for MessageFormat 2
    invalid_collection_data_file: L’opzione `file` `{$file}` non è valida. Deve essere il percorso di un file JSON, senza il segnaposto `\{\{locale\}\}`.
    # {$prop} is the option name; Don’t localize `file`
    unsupported_collection_data_file_option: L’opzione `{$prop}` non è supportata in una collezione con l’opzione `file`.
    # Don’t localize `file`, `publish_mode` and `simple`
    collection_data_file_workflow: Il Flusso Editoriale e il Flusso di Anteprima, inclusa la Contribuzione Aperta, non sono supportati in una collezione con l’opzione `file`. Imposta l’opzione `publish_mode` della collezione su `simple`.
    # {$prop} is the option name; Don’t localize `file` and `slug`. The curly brackets are escaped
    # with backslashes for MessageFormat 2
    collection_data_file_slug_tag: L’opzione `{$prop}` non può contenere il tag `\{\{slug\}\}` in una collezione con l’opzione `file`, poiché lo slug di una voce è la sua posizione, che cambia quando le voci vengono riordinate o eliminate. Usa invece un campo con un valore univoco.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Il modello di slug `{$slug}` non è valido poiché non può contenere slash. Per organizzare le voci in sottocartelle, usa l’opzione `path` invece di `slug`.
    # {$name} is the field name from the configuration; Don’t localize `identifier_field`
    invalid_identifier_field: L’opzione `identifier_field` fa riferimento a `{$name}`, ma nessun campo con questo nome è definito nella collezione.
    # {$name} is the field name from the configuration; Don’t localize `filter`
    invalid_filter_field: L’opzione `filter` fa riferimento a `{$name}`, ma nessun campo con questo nome è definito nella collezione.
    # Don’t localize `filter`, `value` and `pattern`
    invalid_filter_no_condition: L’opzione `filter` deve avere l’opzione `value` o `pattern` con cui confrontare le voci.
    # {$option} is an option name such as `slug` or `summary` and {$name} is the field name or template tag from the configuration
    option_field_not_found: L’opzione `{$option}` fa riferimento a `{$name}`, ma nessun campo con questo nome è definito.
    # {$name} is the field name from the configuration and {$widget} is its field type; Don’t localize `thumbnail`
    thumbnail_field_not_media: L’opzione `thumbnail` fa riferimento a `{$name}`, ma deve essere un campo Image o File, non un campo `{$widget}`.
    # Don’t localize `inline` or `multiple`
    invalid_inline_component_fields: La modalità `inline` richiede un singolo campo Boolean, Color, DateTime, Number, Relation, Select o String. Un campo Relation o Select non può avere l’opzione `multiple` abilitata.
    # {$option} is an option name such as `pattern` or `filter` and {$pattern} is the configured pattern
    invalid_regex: L’opzione `{$option}` contiene un’espressione regolare non valida `{$pattern}`, che viene ignorata.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: L’opzione `reorder` fa riferimento a un gruppo di visualizzazione chiamato `{$name}`, ma questo gruppo non è definito nell’opzione `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit` and `fields`
    invalid_bulk_edit_field: L’elenco `fields` dell’opzione `bulk_edit` fa riferimento a un campo chiamato `{$name}`, ma nessun campo di primo livello con questo nome è definito nella collezione.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit`, `fields` and `multiple`
    unsupported_bulk_edit_field: Il campo `{$name}` nell’elenco `fields` dell’opzione `bulk_edit` non può essere modificato in blocco. È supportato solo un campo Boolean, Color, DateTime, Number, Relation, Select o String che non sia di sola lettura, non abbia l’opzione `multiple` abilitata e non venga impostato automaticamente al salvataggio.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: L’opzione `sortable_fields` fa riferimento a un campo chiamato `{$name}`, ma questo campo non è definito nella collezione.
    # Don’t localize `sortable_fields` and `default_sort`
    multiple_sortable_field_defaults: Solo un elemento dell’opzione `sortable_fields` può avere l’opzione `default_sort`.
    # {$option} is `table_columns` or `summary_fields`, and {$name} is the field name from the configuration
    invalid_table_column_field: L’opzione `{$option}` fa riferimento a un campo chiamato `{$name}`, ma nessun campo con questo nome è definito nella collezione.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: L’opzione `view_groups` fa riferimento a un campo chiamato `{$name}`, ma questo campo non è definito nella collezione.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: L’opzione `view_filters` fa riferimento a un campo chiamato `{$name}`, ma questo campo non è definito nella collezione.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: Il gruppo di visualizzazione {$count} deve avere l’opzione `name` definita come stringa non vuota.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: Il nome del gruppo di visualizzazione `{$name}` non è valido. Non deve contenere caratteri speciali.
    duplicate_view_group_name: I nomi dei gruppi di visualizzazione devono essere univoci, ma `{$name}` è usato più di una volta.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: Il filtro di visualizzazione {$count} deve avere l’opzione `name` definita come stringa non vuota.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `pattern`, `eq` and `gte`
    invalid_view_filter_no_condition: Il filtro di visualizzazione {$count} deve avere l’opzione `pattern` o un’opzione di confronto come `eq` o `gte` con cui confrontare le voci.
    # {$name} is the invalid or duplicate view filter name
    invalid_view_filter_name: Il nome del filtro di visualizzazione `{$name}` non è valido. Non deve contenere caratteri speciali.
    duplicate_view_filter_name: I nomi dei filtri di visualizzazione devono essere univoci, ma `{$name}` è usato più di una volta.
    # {$name} is the default view group name from the configuration; Don’t localize `default` and `view_groups`
    invalid_view_group_default: L’opzione `default` di `view_groups` è impostata su `{$name}`, ma nessun gruppo di visualizzazione ha questo nome.
