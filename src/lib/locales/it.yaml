# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ C’è un errore nella configurazione del CMS. Risolvi il problema e riprova. }}
      *   {{ Ci sono errori nella configurazione del CMS. Risolvi i problemi e riprova. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: 'Collezione {$collection}'
    file: 'File {$file}'
    component: 'Componente {$component}'
    # Don’t localize `{$field}`
    field: 'Campo `{$field}`'

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS funziona solo con HTTPS o URL localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ L’URL del file di configurazione deve usare il protocollo HTTPS o un indirizzo localhost. }}
        *   {{ Gli URL del file di configurazione devono usare il protocollo HTTPS o indirizzi localhost. }}
    fetch_failed: Impossibile recuperare il file di configurazione.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: La risposta HTTP ha restituito lo stato {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Impossibile recuperare il file di configurazione. Per impedire il caricamento del file `config.yml`, aggiungi <a>`load_config_file: false`</a> all’oggetto di configurazione passato a `CMS.init()`.'
    parse_failed: Impossibile analizzare il file di configurazione.
    parse_failed_invalid_object: Il file di configurazione non è un oggetto JavaScript valido.
    parse_failed_unsupported_type: Il tipo di file di configurazione non è valido. Sono supportati solo YAML, TOML e JSON.
    no_collection: Le collezioni non sono state definite.
    # Don’t localize `hide`
    no_visible_collection: Deve essere visibile almeno una collezione. Controlla l’opzione `hide`.
    missing_backend: Il backend non è definito.
    missing_backend_name: Il nome del backend non è definito.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Il backend {$name} <a>non è supportato</a> in Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Il backend deprecato {$name} <a>non è supportato</a> in Sveltia CMS.
    unsupported_custom_backend: I backend personalizzati <a>non sono supportati</a> in Sveltia CMS.
    unsupported_backend_suggestion: Usa invece uno dei <a>backend supportati</a>.
    missing_repository: Il repository non è stato definito.
    invalid_repository: Il repository configurato non è valido. Deve essere nel formato “owner/repo”.
    oauth_implicit_flow: Il metodo di autenticazione configurato (flusso implicito) non è supportato in Sveltia CMS. Usa un <a>metodo di autenticazione</a> diverso.
    github_pkce_unsupported: L’autorizzazione PKCE non è ancora supportata a causa delle limitazioni di GitHub. Usa un <a>metodo di autenticazione</a> diverso.
    oauth_no_app_id: L’ID dell’applicazione OAuth non è stato definito.
    # Don’t localize `open_authoring` and `editorial_workflow`
    open_authoring_no_workflow: L’opzione `open_authoring` richiede la modalità di pubblicazione `editorial_workflow`. Consulta la <a>documentazione</a> per i dettagli.
    # Don’t localize `auth_methods`
    no_auth_methods: L’opzione `auth_methods` deve contenere almeno un metodo.
    missing_media_folder: La cartella dei file multimediali non è stata definita.
    public_folder_relative_path: La cartella pubblica configurata non è valida. Deve essere un percorso assoluto che inizia con “/”.
    public_folder_absolute_url: Un URL assoluto per l’opzione della cartella pubblica non è supportato in Sveltia CMS.
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: L’opzione `transformations` contiene una chiave `{$key}` non supportata. Deve essere `raster_image`, `svg` o un formato di immagine raster supportato.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: L’opzione `quality` per la trasformazione `{$key}` non è valida. Deve essere un intero compreso tra 0 e 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: L’opzione `{$prop}` per la trasformazione `{$key}` non è valida. Deve essere un intero positivo.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: La collezione di file multimediali {$count} deve avere l’opzione `name` definita come stringa non vuota.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Il nome della collezione di file multimediali `{$name}` non è valido. Non deve contenere caratteri speciali.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: I nomi delle collezioni di file multimediali devono essere univoci, ma `{$name}` è usato più di una volta.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_no_options: La collezione deve avere definita una tra le opzioni `folder`, `files` o `divider`.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_multiple_options: La collezione non può avere contemporaneamente le opzioni `folder`, `files` e `divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: L’estensione `{$extension}` non corrisponde al formato `{$format}`.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Il modello di slug `{$slug}` non è valido poiché non può contenere slash. Per organizzare le voci in sottocartelle, usa l’opzione `path` invece di `slug`.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: L’opzione `reorder` fa riferimento a un gruppo di visualizzazione chiamato `{$name}`, ma questo gruppo non è definito nell’opzione `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: L’opzione `sortable_fields` fa riferimento a un campo chiamato `{$name}`, ma questo campo non è definito nella collezione.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: L’opzione `view_groups` fa riferimento a un campo chiamato `{$name}`, ma questo campo non è definito nella collezione.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: L’opzione `view_filters` fa riferimento a un campo chiamato `{$name}`, ma questo campo non è definito nella collezione.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: Il gruppo di visualizzazione {$count} deve avere l’opzione `name` definita come stringa non vuota.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: Il nome del gruppo di visualizzazione `{$name}` non è valido. Non deve contenere caratteri speciali.
    duplicate_view_group_name: I nomi dei gruppi di visualizzazione devono essere univoci, ma `{$name}` è usato più di una volta.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: Il filtro di visualizzazione {$count} deve avere l’opzione `name` definita come stringa non vuota.
    # {$name} is the invalid or duplicate view filter name
    invalid_view_filter_name: Il nome del filtro di visualizzazione `{$name}` non è valido. Non deve contenere caratteri speciali.
    duplicate_view_filter_name: I nomi dei filtri di visualizzazione devono essere univoci, ma `{$name}` è usato più di una volta.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: La collezione {$count} deve avere l’opzione `name` definita come stringa non vuota.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: Il nome della collezione `{$name}` non è valido. Non deve contenere caratteri speciali.
    duplicate_collection_name: I nomi delle collezioni devono essere univoci, ma `{$name}` è usato più di una volta.
    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
    missing_collection_file_name: Il file della collezione {$count} deve avere l’opzione `name` definita come stringa non vuota.
    # {$name} is the invalid or duplicate collection file name
    invalid_collection_file_name: Il nome del file della collezione `{$name}` non è valido. Non deve contenere caratteri speciali.
    duplicate_collection_file_name: I nomi dei file di collezione devono essere univoci, ma `{$name}` è usato più di una volta.
    # Don’t localize `fields`
    collection_no_fields: La collezione deve avere l’opzione `fields` definita con almeno un campo.
    # Don’t localize `fields`
    collection_file_no_fields: Il file della collezione deve avere l’opzione `fields` definita con almeno un campo.
    # Don’t localize `i18n`, `locale` and `file`
    collection_file_i18n_required: Il file della collezione deve avere l’opzione `i18n` definita se il segnaposto `locale` viene utilizzato nel percorso `file`.
    # {$count} is the 1-based field index in the current fields array; Don’t localize `name`
    missing_field_name: Il campo {$count} deve avere l’opzione `name` definita come stringa non vuota.
    # {$name} is the invalid or duplicate field name
    invalid_field_name: Il nome del campo `{$name}` non è valido. Non deve contenere caratteri speciali. Se vuoi annidare i campi, <a>usa i campi Object invece della notazione col punto</a>.
    duplicate_field_name: I nomi dei campi devono essere univoci, ma `{$name}` è usato più di una volta.
    # {$count} is the 1-based variable type index in the current types array
    missing_variable_type: Il tipo di variabile {$count} deve avere l’opzione `name` definita come stringa non vuota.
    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: Il nome del tipo di variabile `{$name}` non è valido. Non deve contenere caratteri speciali.
    duplicate_variable_type: I nomi dei tipi di variabile devono essere univoci, ma `{$name}` è usato più di una volta.
    date_field_type: 'Il tipo di campo Date deprecato non è supportato in Sveltia CMS. Usa invece il tipo di campo DateTime con l’opzione `type: date`.'
    # {$timeZone} is the invalid IANA timezone identifier from the configuration
    invalid_timezone: 'Fuso orario non valido: {$timeZone}. Deve essere un identificatore di fuso orario IANA valido come `Europe/Rome` o `America/New_York`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: L’opzione deprecata `{$prop}` non è supportata in Sveltia CMS. Usa invece l’opzione `{$newProp}`.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: L’opzione `allow_multiple` non è supportata in Sveltia CMS. Usa invece l’opzione `multiple`, il cui valore predefinito è `false`.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: Il campo List non può avere contemporaneamente le opzioni `field`, `fields` e `types`.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: Il tipo di variabile del campo List non è valido. L’opzione `widget` è impostata su `{$widget}` ma deve essere `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: Il campo Object non può avere contemporaneamente le opzioni `fields` e `types`.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: La collezione di riferimento `{$collection}` non è valida o non è definita.
    relation_field_invalid_collection_file: Il file di riferimento `{$file}` non è valido o non è definito.
    # Don’t localize `file`
    relation_field_missing_file_name: L’opzione `file` deve essere definita per una relazione a una collezione di file.
    relation_field_invalid_value_field: Il campo valore di riferimento `{$field}` non è valido o non è definito.
    unexpected: Errore imprevisto

    # Schema validation errors, reported when the configuration doesn’t match the published JSON
    # schema. In all of these, {$option} is a configuration option path such as `backend.name` or
    # `view_filters[0].pattern`, relative to the collection, file or field named before it.
    # {$type} is a value type name from `schema_value_type` below
    schema_invalid_type: 'L’opzione `{$option}` deve essere {$type}.'
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'L’opzione `{$option}` deve essere uno di questi valori: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: 'L’opzione `{$option}` deve essere `{$value}`.'
    schema_invalid_empty_value: 'L’opzione `{$option}` deve essere una stringa vuota.'
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: 'L’opzione `{$option}` deve essere un array di {$count} elementi.'
    schema_invalid_value: 'L’opzione `{$option}` ha un valore non valido.'
    schema_missing_option: 'L’opzione `{$option}` è obbligatoria.'
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'È obbligatoria una di queste opzioni: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: una stringa
      number: un numero
      integer: un intero
      boolean: un booleano
      array: un array
      object: un oggetto
      'null': vuota

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: L’ID dell’applicazione OAuth non è stato definito. Agli utenti è richiesto di fornire un token di accesso per accedere.
    editorial_workflow_unsupported: Il Flusso Editoriale è attualmente supportato solo con i backend GitHub e GitLab.
    open_authoring_unsupported_backend: L’Open Authoring è attualmente supportato solo con il backend GitHub.
    nested_collections_unsupported: Le collezioni nidificate non sono ancora supportate in Sveltia CMS.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: L’opzione `{$prop}` non è supportata in Sveltia CMS. Verrà ignorata.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Sono impostate sia l’opzione `picker_utc` che le nuove opzioni di fuso orario (`input_timezone` o `output_utc`). Le nuove opzioni hanno la precedenza. Valuta di rimuovere `picker_utc` dalla tua configurazione.
    # Don’t localize `preview_path`
    preview_path_no_date_field: L’opzione `preview_path` utilizza tag di data e ora, ma la collezione non ha un campo DateTime da cui leggerli, quindi il link di anteprima non verrà mostrato.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: L’opzione `preview_path_date_field` fa riferimento a un campo chiamato `{$name}`, ma non è definito alcun campo DateTime con quel nome, quindi il link di anteprima non verrà mostrato.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: L’opzione `preview_path` fa riferimento a `{$name}`, ma nessun campo con questo nome è definito nella collezione, quindi il link di anteprima non verrà mostrato.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Vedi le note di compatibilità per i dettagli: {$link}'

  # Console tip shown after config load
  schema_tip: Per una migliore esperienza di sviluppo, puoi convalidare il tuo file di configurazione con lo schema JSON di Sveltia CMS. Vedi {$link} per i dettagli.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Locale
  # Browser compatibility warnings
  unsupported_browser: Il Flusso Locale non è supportato nel tuo browser. Usa Chrome o Edge.
  disabled: Il Flusso Locale è disabilitato nel tuo browser. <a>Ecco come abilitarlo</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Stai visualizzando la bacheca del Flusso Editoriale. Bozze: {$draft}. In Revisione: {$review}. Pronti: {$ready}. In Attesa di Eliminazione: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Stai visualizzando la bacheca del Flusso Editoriale. Bozze: {$draft}. In Revisione: {$review}. In Attesa di Eliminazione: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Bozza
  drafts: Bozze
  in_review: In Revisione
  ready: Pronti
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: In Attesa di Eliminazione

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Annulla Eliminazione
  confirm_cancelling_deletion: Sei sicuro di voler annullare questa eliminazione? La voce rimarrà pubblicata.
  confirm_completing_deletion: Sei sicuro di voler eliminare questa voce? Verrà rimossa immediatamente.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ Voce contrassegnata per l’eliminazione. }}
      *   {{ {$count} voci contrassegnate per l’eliminazione. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Modifiche scartate. }}
      *   {{ Modifiche a {$count} voci scartate. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Annullamento Eliminazione…
  deletion_cancelled: Eliminazione annullata.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Impossibile annullare l’eliminazione. Riprova.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Voci Non Pubblicate
  published_entries: Voci Pubblicate
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Stato: {$status}'
  change_entry_status: Cambia Stato Voce
  # Editor toolbar: progress label while the status is being changed
  changing_status: Cambio Stato…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Aggiornamento Stato…
  status_updated: Stato aggiornato.
  # Error notification when the status could not be changed
  status_change_failed: Impossibile cambiare lo stato. Riprova.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: La voce contiene errori. Correggili prima di cambiare lo stato.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: La voce contiene errori. Correggili prima di pubblicarla.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Invia per Revisione
  confirm_sending_for_review: Le tue modifiche sono state salvate come bozza. Vuoi inviare la voce per la revisione in modo che qualcuno possa controllarla e pubblicarla?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Pubblica Voce
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Scarta Modifiche
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Sei sicuro di voler eliminare questa voce? Non verrà rimossa finché l’eliminazione non sarà pubblicata. Fino ad allora la troverai nell’elenco delle voci, contrassegnata come In Attesa di Eliminazione.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Questa voce non è ancora stata pubblicata, quindi eliminarla la scarterà completamente.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Questa voce ha modifiche non pubblicate. Scartandole verrà ripristinata la versione pubblicata. La voce stessa non verrà eliminata.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Non è ancora stata pubblicata, quindi le tue modifiche non pubblicate verranno scartate. Qualsiasi versione pubblicata rimarrà invariata. }}
      *   {{ Non sono ancora state pubblicate, quindi le tue modifiche non pubblicate verranno scartate. Qualsiasi versione pubblicata rimarrà invariata. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ Una di queste non è ancora stata pubblicata, quindi le tue modifiche non pubblicate verranno scartate. Qualsiasi versione pubblicata rimarrà invariata. }}
      *   {{ {$count} di queste non sono ancora state pubblicate, quindi le tue modifiche non pubblicate verranno scartate. Qualsiasi versione pubblicata rimarrà invariata. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry: Sei sicuro di voler pubblicare questa voce? Le tue modifiche avranno effetto immediato.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Pubblicazione Voce…
  entry_published: Voce pubblicata.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Eliminazione Voce…
  discarding_changes: Scarto Modifiche…
  entry_deleted: Voce eliminata.
  # Error notification when publishing fails
  publishing_entry_failed: Impossibile pubblicare la voce. Riprova.
  # Workflow page: empty column message
  no_entries: Nessuna voce.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Trascina per cambiare lo stato

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Crea Fork del Repository
  fork: Fork
  confirm_forking_repository: Per suggerire modifiche a “{$repo}”, deve essere creato un fork del repository sul tuo account. Le tue modifiche vengono salvate in quel fork e un manutentore le esamina prima che vengano pubblicate.
  # Error shown when the user declined the dialog above
  fork_declined: Hai bisogno di un fork del repository sul tuo account per suggerire modifiche.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Impossibile creare un fork del repository “{$repo}” sul tuo account.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Impossibile verificare il tuo accesso al repository “{$repo}”. Riprova tra poco.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Il repository “{$repo}” non consente i fork. Chiedi a un manutentore di abilitarli.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Hai un invito in sospeso per il repository “{$repo}”. Accettalo su GitHub, quindi accedi di nuovo.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Il tuo accesso non include i repository privati, quindi il repository “{$repo}” non può essere letto. Chiedi a un manutentore di controllare le impostazioni di autenticazione del CMS.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Solo un manutentore può pubblicare le modifiche su questo sito. Contrassegna la tua voce come In Revisione e qualcuno le darà un’occhiata.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Questa modifica non può essere fatta direttamente. Solo le modifiche alle voci possono essere suggerite per la revisione.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Le tue modifiche vengono salvate nel tuo fork di questo repository in “{$repo}” e revisionate prima di essere pubblicate.
  view_fork: Visualizza Fork

