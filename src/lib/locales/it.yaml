sign_in_with_mobile_instruction: Scansiona il codice QR qui sotto con il tuo telefono o tablet per accedere senza password. Le tue impostazioni verranno copiate automaticamente.

# Account menu: user status and repository mode indicators
# Shown at the top of the account dropdown menu
# {$name} is the signed-in user’s login name
signed_in_as_x: 'Accesso effettuato come {$name}'
working_with_local_repo: Stai lavorando con il Repository Locale
working_with_test_repo: Stai lavorando con il Repository di Test

# Account menu: action items for sign-out and app installation
sign_out: Esci
install_as_app: Installa come App

