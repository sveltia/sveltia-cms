# repository since the entry was opened in the editor
save_conflict:
  title: Voce Modificata da Qualcun Altro
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} ha modificato questa voce il {$date}, dopo che l’hai aperta.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Questa voce è stata modificata nel repository dopo che l’hai aperta.
  deleted: Questa voce è stata eliminata dal repository dopo che l’hai aperta.
  # Follows `modified_by` or `modified`
  overwrite_warning: Se salvi ora, le modifiche dell’altra persona andranno perse.
  # Follows `deleted`
  recreate_warning: Se salvi ora, la voce verrà creata di nuovo.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Poiché la voce è memorizzata nello stesso file di altre voci, non può essere salvata sovrascrivendo la modifica. Annulla la modifica, poi riapri la voce dall’elenco e apporta di nuovo le tue modifiche.
  # OK button label
  save_anyway: Salva Comunque
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: Il repository è stato aggiornato da qualcun altro durante il salvataggio. Riprova.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Una voce memorizzata nello stesso file è stata modificata da qualcun altro. Riprova.
  # {$path} is the file path
  array_file_invalid: Il file {$path} non può essere aggiornato, perché non contiene un elenco di voci valido.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
# repository while the user has it open. The change itself is described with the `save_conflict`
