  # Title of the dialog to edit an entry selected in the field. {$name} is the singular label of the
  # referenced collection
  edit_entry_title: Modifica di {$name}
  # Note shown in the dialog. {$name} is the singular label of the referenced collection
  edit_together_hint: Le tue modifiche a questa voce ({$name}) verranno salvate insieme alla voce che stai modificando.
  # Error shown when the changes couldn’t be prepared. {$name} is the singular label of the collection
  edit_failed: Impossibile applicare le modifiche alla voce ({$name}). Controlla la console del browser per i dettagli.
  # Error shown when the changes would move the entry to another file path, e.g. through a path
  # template using a field. {$name} is the singular label of the collection
  move_unsupported: Queste modifiche sposterebbero la voce ({$name}) in un’altra posizione, operazione possibile solo modificandola separatamente.
  # Error shown when saving, if someone else has changed an entry edited from the field since. {$name}
  # is the summary of that entry
  edit_conflict: “{$name}” è stata modificata da qualcun altro dopo che l’hai modificata. Riaprila dal campo per confrontare le tue modifiche con la versione più recente.
  # Error shown when saving, if someone else has deleted an entry edited from the field since.
  # {$name} is the summary of that entry
  edit_deleted: “{$name}” è stata eliminata da qualcun altro dopo che l’hai modificata. Rimuovila dal campo per salvare la voce.
  # Accessible label of the menu listing the selected entries that can be edited
  select_entry_to_edit: Seleziona una Voce da Modificare
  # Warning shown in the editor of an entry that has been edited from a Relation field of another
  # entry, while the changes wait in that entry’s pull request. {$name} is the summary of that
  # entry
  edited_with_entry: Le modifiche a questa voce sono in attesa di essere pubblicate insieme a “{$name}”. Se la salvi ora, i due gruppi di modifiche verranno combinati quando quella voce sarà pubblicata, il che potrebbe non riuscire se si sovrappongono.
  # Warning shown in the dialog when an entry edited from the field has been changed by someone else
  # since. {$name} is the singular label of the collection
  changed_since_edit: Questa voce ({$name}) è stata modificata da qualcun altro dopo che l’hai modificata. Le tue modifiche sono mostrate sopra la versione più recente. Controllale prima di aggiornare.

# Select Assets dialog
assets_dialog:
  # Dialog titles for different selection modes
  title:
    file: Seleziona File
    image: Seleziona Immagine
    folder: Seleziona Cartella

  # Search input labels
  search_for_file: Cerca File
  search_for_image: Cerca Immagini

  # Locations panel aria-label
  locations: Posizioni

  # Folder selection mode for a File field with the `select_folder` option. {$path} is the public
  # path of the folder to be selected, and {$count} is the number of folders selected
  selected_folder: 'Cartella selezionata: {$path}'
  selected_folders: |
    .input {$count :integer}
    .match $count
      one {{ {$count} cartella selezionata }}
      *   {{ {$count} cartelle selezionate }}
  no_subfolders: Questa cartella non ha sottocartelle.
  # Shown for a cloud storage service whose `prefix` option depends on fields of the entry
  prefix_unresolved: Compila i campi da cui dipende questa posizione per sfogliarne e caricarne i file.

