    *   {{ Välj filer }}

# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    one {{ Radera resurs }}
    *   {{ Radera resurser }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Radera markerad resurs }}
    *   {{ Radera markerade resurser }}
confirm_deleting_this_asset: Är du säker på att du vill radera denna resurs?
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Är du säker på att du vill radera den markerade resursen? }}
    *   {{ Är du säker på att du vill radera de markerade {$count} resurserna? }}
confirm_deleting_all_assets: Är du säker på att du vill radera alla resurser?

# Delete entries: dialog titles and confirmation messages
# {$count} is the number of entries targeted by the action
delete_entries: |
  .input {$count :integer}
  .match $count
    one {{ Radera post }}
    *   {{ Radera poster }}
# {$count} is the number of selected entries
delete_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Radera markerad post }}
    *   {{ Radera markerade poster }}
confirm_deleting_this_entry: Är du säker på att du vill radera denna post?
confirm_deleting_this_entry_with_assets: Är du säker på att du vill radera denna post och tillhörande resurser?
# {$count} is the number of selected entries
confirm_deleting_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Är du säker på att du vill radera den markerade posten? }}
    *   {{ Är du säker på att du vill radera de {$count} markerade posterna? }}
# {$count} is the number of selected entries whose associated assets would also be removed
confirm_deleting_selected_entries_with_assets: |
  .input {$count :integer}
  .match $count
    one {{ Är du säker på att du vill radera den markerade posten och tillhörande resurser? }}
    *   {{ Är du säker på att du vill radera de {$count} markerade posterna och tillhörande resurser? }}
confirm_deleting_all_entries: Är du säker på att du vill radera alla poster?
confirm_deleting_all_entries_with_assets: Är du säker på att du vill radera alla poster och tillhörande resurser?

# ==============================================================================
# Entry Reordering
# ==============================================================================
# Strings for manually reordering entries via drag-and-drop.

# Reorder mode: toggle buttons
reorder_entries: Sortera poster
done_reordering_entries: Klar med att sortera poster
