drop_image_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Släpp en bild här eller }}
    *   {{ Släpp bilder här eller }}

# File picker and clipboard actions used by upload controls
browse: Bläddra
# Generic clipboard paste action used by non-image file fields
paste: Klistra in
# Clipboard paste action used by image fields
paste_image: Klistra in bild

# Clipboard paste errors
no_image_in_clipboard: Ingen bild hittades i urklipp.
clipboard_access_denied: Åtkomst till urklipp nekad.

# Drag-and-drop overlay text (shown while dragging)
