# Character counter: shows character count for text fields
character_counter:
  # {$count} is the current character count; {$min} and {$max} are configured limits
  min_max: |
    .input {$count :integer}
    .match $count
      0   {{ Inga tecken angivna. Min: {$min}. Max: {$max}. }}
      one {{ {$count} tecken angivna. Min: {$min}. Max: {$max}. }}
      *   {{ {$count} tecken angivna. Min: {$min}. Max: {$max}. }}
  # {$count} is the current character count and {$min} is the minimum allowed count
  min: |
    .input {$count :integer}
    .match $count
      0   {{ Inga tecken angivna. Min: {$min}. }}
      one {{ {$count} tecken angivna. Min: {$min}. }}
      *   {{ {$count} tecken angivna. Min: {$min}. }}
  # {$count} is the current character count and {$max} is the maximum allowed count
  max: |
    .input {$count :integer}
    .match $count
      0   {{ Inga tecken angivna. Max: {$max}. }}
      one {{ {$count} tecken angivna. Max: {$max}. }}
      *   {{ {$count} tecken angivna. Max: {$max}. }}

