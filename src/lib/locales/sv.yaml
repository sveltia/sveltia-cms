    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: '`default_localized`-alternativet har ingen effekt, eftersom i18n inte är aktiverat för samlingen. Använd `default`-alternativet i stället.'
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: '`default_localized`-alternativet har ett värde för `{$locale}`, som inte är ett av samlingens språk, så värdet används aldrig.'

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Se kompatibilitetsanteckningarna för detaljer: {$link}'

  # Console tip shown after config load
  schema_tip: För en bättre utvecklarupplevelse kan du validera din konfigurationsfil mot JSON-schemat för Sveltia CMS. Se {$link} för detaljer.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Lokal
  # Browser compatibility warnings
  unsupported_browser: Lokalt arbetsflöde stöds inte i din webbläsare. Använd Chrome eller Edge istället.
  disabled: Lokalt arbetsflöde är inaktiverat i din webbläsare. <a>Så här aktiverar du det</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Du visar nu tavlan för det redaktionella arbetsflödet. Utkast: {$draft}. Granskas: {$review}. Klara: {$ready}. Väntar på radering: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Du visar nu tavlan för det redaktionella arbetsflödet. Utkast: {$draft}. Granskas: {$review}. Väntar på radering: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'Du visar nu tavlan för det redaktionella arbetsflödet. Utkast: {$draft}. Klara: {$ready}. Väntar på radering: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'Du visar nu sidan Utkast. Utkast: {$draft}. Väntar på radering: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Utkast
  drafts: Utkast
  in_review: Granskas
  ready: Klar
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Väntar på radering
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: Distribueras

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Avbryt radering
  confirm_cancelling_deletion: Är du säker på att du vill avbryta denna radering? Posten förblir publicerad.
  confirm_completing_deletion: Är du säker på att du vill radera denna post? Den tas bort omedelbart.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ Post markerad för radering. }}
      *   {{ {$count} poster markerade för radering. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Ändringar förkastade. }}
      *   {{ Ändringar i {$count} poster förkastade. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Avbryter radering…
  deletion_cancelled: Radering avbruten.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Det gick inte att avbryta raderingen. Försök igen.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Opublicerade poster
  published_entries: Publicerade poster
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Status: {$status}'
  change_entry_status: Ändra poststatus
  # Editor toolbar: progress label while the status is being changed
  changing_status: Ändrar status…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Uppdaterar status…
  status_updated: Status uppdaterad.
  # Error notification when the status could not be changed
  status_change_failed: Det gick inte att ändra statusen. Försök igen.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: Uppdatera
  refreshing: Uppdaterar…
  refreshed: Tavlan är uppdaterad.
  # Error notification when the board could not be refreshed
  refresh_failed: Det gick inte att uppdatera tavlan. Försök igen.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: Posten innehåller fel. Rätta till dem innan du ändrar statusen.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: Posten innehåller fel. Rätta till dem innan du publicerar den.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Skicka för granskning
  confirm_sending_for_review: Dina ändringar har sparats som ett utkast. Vill du skicka posten för granskning så att någon kan titta på den och publicera den?
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: Markera som klar
  confirm_marking_as_ready: Dina ändringar har sparats som ett utkast. Vill du markera posten som klar så att den kan publiceras?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Publicera post
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Förkasta ändringar
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Är du säker på att du vill radera denna post? Den tas inte bort förrän raderingen har publicerats. Fram till dess finns den kvar i postlistan, markerad som “Väntar på radering”.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Denna post har inte publicerats än, så om du raderar den förkastas den helt.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Denna post har opublicerade ändringar. Om du förkastar dem återställs den publicerade versionen. Själva posten raderas inte.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Den har inte publicerats än, så dina opublicerade ändringar förkastas. En eventuell publicerad version förblir publicerad. }}
      *   {{ De har inte publicerats än, så dina opublicerade ändringar förkastas. Eventuella publicerade versioner förblir publicerade. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ En av dem har inte publicerats än, så dina opublicerade ändringar förkastas. En eventuell publicerad version förblir publicerad. }}
      *   {{ {$count} av dem har inte publicerats än, så dina opublicerade ändringar förkastas. Eventuella publicerade versioner förblir publicerade. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: Är du säker på att du vill publicera denna post? Dina ändringar syns på webbplatsen när den har byggts om.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Publicerar post…
  entry_published: Post publicerad.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Raderar post…
  discarding_changes: Förkastar ändringar…
  entry_deleted: Post raderad.
  # Error notification when publishing fails
  publishing_entry_failed: Det gick inte att publicera posten. Försök igen.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: Den här posten kan inte publiceras här, eftersom den innehåller andra ändringar som CMS:et inte kan visa dig. Be en utvecklare att granska den.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: Posten har ändrats sedan du öppnade den. Ladda om sidan för att granska den senaste versionen innan du publicerar den.
  review_on_x: Granska på {$service}
  from_fork: Från en fork
  fork_entry_editable: Den här posten kommer från en bidragsgivares pull request som öppnats från “{$fork}”. Dina ändringar sparas i bidragsgivarens branch. Granska och merga pull requesten i Git-tjänsten.
  fork_entry_locked: Den här posten kommer från en bidragsgivares pull request som öppnats från “{$fork}”. Bidragsgivaren tillåter inte att underhållare redigerar den, så den kan bara visas här.
  fork_not_editable: Bidragsgivaren tillåter inte att underhållare redigerar denna pull request.
  fork_entry_gone: Bidragsgivarens pull request är inte längre öppen, så ändringarna kan inte sparas i den.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: En annan begäran ({$number}) är redan öppen för den här posten utanför CMS:et. Be en utvecklare att stänga den först.
  # Workflow page: empty column message
  no_entries: Inga poster.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Dra för att ändra status
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Radering
  # Workflow page: note on a card listing the new entries that were created from a Relation field
  # of the entry and are published along with it, e.g. “Also adds Section: Getting Started”
  companion_entries: Lägger även till {$entries}
  # Workflow page: note on a card listing the existing entries that were edited from a Relation
  # field of the entry and are published along with it, e.g. “Also changes Author: Ada Lovelace”
  edited_companion_entries: Ändrar även {$entries}
  # Workflow page: one of the entries listed by `companion_entries` or `edited_companion_entries`,
  # named by its collection’s singular label and its title
  companion_entry: '{$collection}: {$title}'

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: Commit-meddelande
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: Beskriv dina ändringar. Meddelandet sparas i historiken tillsammans med dem.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: Lägg till en anteckning i meddelandet som sparas i historiken tillsammans med dina ändringar, till exempel ett ärendenummer. Det kan lämnas tomt.
  # Accessible name of the text box when the user writes the whole message
  message: Commit-meddelande
  # Accessible name of the text box when the text is added before or after the message
  addition: Anteckning
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'Meddelande: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Forka repot
  fork: Forka
  confirm_forking_repository: För att föreslå ändringar i “{$repo}” måste en fork av repot skapas på ditt konto. Dina ändringar sparas i den forken och granskas av en underhållare innan de publiceras.
  # Error shown when the user declined the dialog above
  fork_declined: Du behöver en fork av repot på ditt konto för att kunna föreslå ändringar.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Det gick inte att skapa en fork av repot “{$repo}” på ditt konto.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: Din fork “{$fork}” har inte branchen “{$branch}”. Uppdatera forken från repot “{$repo}” och logga sedan in igen.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Det gick inte att kontrollera din åtkomst till repot “{$repo}”. Försök igen om en stund.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Repot “{$repo}” tillåter inte forkar. Be en underhållare att aktivera forkning för det.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Du har en väntande inbjudan till repot “{$repo}”. Acceptera den på GitHub och logga sedan in igen.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Din inloggning ger inte åtkomst till privata repon, så repot “{$repo}” kan inte läsas. Be en underhållare att kontrollera autentiseringsinställningarna för CMS:et.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Endast en underhållare kan publicera ändringar på denna webbplats. Markera i stället din post som “Granskas”, så tittar någon på den.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: En underhållare har redan publicerat den här posten, så det finns inget kvar att granska.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Denna ändring kan inte göras direkt. Endast redigeringar av poster kan föreslås för granskning.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Dina ändringar sparas i din fork av detta repo på “{$repo}” och granskas innan de publiceras.
  view_fork: Visa fork

# ==============================================================================
# Settings Dialog
# ==============================================================================
# Strings for the settings/preferences dialog and its panels.

# Settings page aria-label
categories: Kategorier

# Preferences panels
prefs:
  account:
    title: Användarkonto
  # API key management feedback messages
  changes:
    api_key_saved: API-nyckel sparad.
    api_key_removed: API-nyckel borttagen.
    api_key_invalid: Den angivna API-nyckeln är ogiltig. Kontrollera och försök igen.

  # Preferences operation errors
  error:
    permission_denied: Åtkomst till cookie-lagring har nekats. Kontrollera dina webbläsarbehörigheter och försök igen.

  # Appearance panel
  appearance:
    title: Utseende
    theme: Tema
    select_theme: Välj tema

  # Theme options
  theme:
    dark: Mörkt
    light: Ljust

  # Language panel
  language:
    title: Språk
    ui_language:
      title: Användargränssnittets språk
      select_language: Välj språk

  # Contents panel
  contents:
    title: Innehåll
    editor:
      title: Redigerare
      use_draft_backup:
        switch_label: Säkerhetskopiera utkast automatiskt
      close_on_save:
        switch_label: Stäng redigeraren efter att ha sparat ett utkast
      close_with_escape:
        switch_label: Stäng redigeraren med Escape-tangenten

  # Internationalization panel
  i18n:
    title: Internationalisering
    translators:
      default:
        title: Standardöversättningstjänst
        select_service: Välj tjänst
      api_keys:
        title: API-nycklar för översättningstjänster
        description: Hantera API-nycklar för <a>översättningstjänster</a>. API-nycklar för allmänna AI-tjänster kan hanteras i AI-inställningarna.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: '{$service}-nyckel'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Registrera dig för <a {$homeHref}>{$service}</a> och ange <a {$apiKeyHref}>din API-nyckel</a> här för att möjliggöra snabb översättning av textinmatningsfält.

  # Media panel
  media:
    title: Media
    stock_photos:
      api_keys:
        title: API-nycklar för stockfototjänster
        description: Hantera API-nycklar för <a>stockfototjänster</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: '{$service}-nyckel'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Registrera dig för <a {$homeHref}>{$service} API</a> och ange <a {$apiKeyHref}>din API-nyckel</a> här för att infoga gratis stockfoton i bildinmatningsfält.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: 'Fotokälla: Bilder från {$service}'
      no_services: Inga <a>stockfototjänster</a> är konfigurerade.
    cloud_storage:
      api_keys:
        title: API-nycklar för molnlagringstjänster
        description: Hantera API-nycklar för <a>molnlagringstjänster</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: '{$service}-nyckel'
      no_services: Inga <a>molnlagringstjänster</a> är konfigurerade.

  # AI panel
  ai:
    title: AI
    api_keys:
      title: API-nycklar för AI-tjänster
      description: Hantera API-nycklar för AI-tjänster.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: '{$service}-nyckel'

  # Accessibility panel
  accessibility:
    title: Tillgänglighet
    underline_links:
      title: Understryk länkar
      description: Visa understrykning för länkar i förhandsgranskningen av inlägg och användargränssnittets etiketter.
      switch_label: Understryk alltid länkar

  # Data Management panel
  data:
    title: Datahantering
    clear_data:
      title: Rensa data
      # Clear File Cache button
      file_cache:
        description: Radera lokalt cachelagrat filinnehåll och miniatyrbilder för att frigöra lagringsutrymme eller lösa problem som orsakas av inaktuella data.
        button_label: Rensa filcache
        confirmation: Lokalt cachelagrat filinnehåll och miniatyrbilder raderas. Dina osparade utkast och inställningar behålls, och raderade data laddas ned eller genereras igen vid behov. CMS:et laddas om när det är klart.
      # Erase All Data button
      all_data:
        description: Radera allt som CMS:et lagrar i den här webbläsaren, inklusive cachelagrade filer, osparade utkast och inställningar. Det som redan sparats i ditt repo påverkas inte.
        button_label: Radera alla data
        confirmation: Alla data som lagras i den här webbläsaren raderas, inklusive cachelagrat filinnehåll, miniatyrbilder, osparade utkast, inställningar och inloggningsstatus. Ditt repo påverkas inte, men alla ändringar som du inte har sparat går förlorade, och du måste logga in igen. CMS:et laddas om när det är klart.

  # Developer panel
  developer:
    title: Utvecklare
    developer_mode:
      title: Utvecklarläge
      description: Aktivera vissa utvecklarinriktade funktioner, inklusive detaljerade konsolloggar och inbyggda kontextmenyer.
      switch_label: Aktivera utvecklarläge
    local_git:
      title: Git-commits
      description: Committa dina ändringar till den aktuella branchen i ditt lokala repo varje gång du sparar dem, på samma sätt som CMS:et gör när du arbetar med ett fjärr-repo. Du kan sedan granska och pusha dina commits med dina vanliga Git-verktyg.
      switch_label: Committa ändringar till Git
      checking: Kontrollerar repot…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Ändringar committas till branchen {$branch} som {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Ändringar kan inte committas just nu. {$reason}
    deploy_hook:
      title: Deploy Hook
      description: Ange en webhook-URL som ska anropas när du manuellt utlöser en distribution genom att välja Publicera ändringar. Detta kan lämnas tomt om du använder GitHub Actions eller GitLab CI/CD.
      # Hook URL input
      url:
        field_label: Hook-URL
        saved: Hook-URL sparad.
        removed: Hook-URL borttagen.
      # Authorization header input
      auth:
        field_label: Auktoriseringshuvud (t.ex. Bearer <token>) (valfritt)
        saved: Auktoriseringshuvud sparat.
        removed: Auktoriseringshuvud borttaget.

