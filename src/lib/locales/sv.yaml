  errors: |
    .input {$count :integer}
    .match $count
      one {{ Det finns ett fel i CMS-konfigurationen. Lös problemet och försök igen. }}
      *   {{ Det finns fel i CMS-konfigurationen. Lös problemen och försök igen. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: '{$collection}-samlingen'
    file: '{$file}-filen'
    component: '{$component}-komponenten'
    # Don’t localize `{$field}`
    field: '`{$field}` fältet'

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS måste köras i en säker kontext (HTTPS eller localhost) för att fungera korrekt.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ Konfigurationsfilens URL måste använda HTTPS-protokollet eller en localhost-adress. }}
        *   {{ Konfigurationsfilens URL:er måste använda HTTPS-protokollet eller localhost-adresser. }}
    fetch_failed: Konfigurationsfilen kunde inte hämtas.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: HTTP-svaret returnerade status {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Konfigurationsfilen kunde inte hämtas. För att förhindra att `config.yml`-filen laddas, lägg till <a>`load_config_file: false`</a> i konfigurationsobjektet som skickas till `CMS.init()`.'
    parse_failed: Konfigurationsfilen kunde inte tolkas.
    parse_failed_invalid_object: Konfigurationsfilen är inte ett giltigt JavaScript-objekt.
    parse_failed_unsupported_type: Konfigurationsfilen är inte en giltig filtyp. Endast YAML, TOML och JSON stöds.
    no_collection: Samlingar är inte definierade.
    missing_backend: Backend är inte definierad.
    missing_backend_name: Backend-namnet är inte definierat.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Backenden {$name} stöds <a>inte</a> i Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Backenden {$name} är föråldrad och stöds <a>inte</a> i Sveltia CMS.
