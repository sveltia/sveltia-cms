sign_in_with_mobile_instruction: Scanna QR-koden nedan med din telefon eller surfplatta för att logga in utan lösenord. Dina inställningar kommer överföras automatiskt.

# Account menu: user status and repository mode indicators
# Shown at the top of the account dropdown menu
# {$name} is the signed-in user’s login name
signed_in_as_x: 'Inloggad som {$name}'
working_with_local_repo: Arbetar med lokalt Git-repo
working_with_test_repo: Arbetar med test-repo

# Account menu: action items for sign-out and app installation
sign_out: Logga ut
install_as_app: Installera som app

