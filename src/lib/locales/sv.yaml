    # {$name} is the field name from the configuration; Don’t localize `bulk_edit` and `fields`
    invalid_bulk_edit_field: '`fields`-listan i `bulk_edit`-alternativet hänvisar till ett fält med namnet `{$name}`, men inget sådant fält på toppnivå är definierat i samlingen.'
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit`, `fields` and `multiple`
    unsupported_bulk_edit_field: Fältet `{$name}` i `fields`-listan i `bulk_edit`-alternativet kan inte massredigeras. Endast ett Boolean-, Color-, DateTime-, Number-, Relation-, Select- eller String-fält som inte är skrivskyddat, inte har `multiple`-alternativet aktiverat och inte ställs in automatiskt vid sparande stöds.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: '`sortable_fields`-alternativet hänvisar till ett fält med namnet `{$name}`, men inget sådant fält är definierat i samlingen.'
    # Don’t localize `sortable_fields` and `default_sort`
    multiple_sortable_field_defaults: Endast ett objekt i `sortable_fields`-alternativet kan ha `default_sort`-alternativet.
    # {$option} is `table_columns` or `summary_fields`, and {$name} is the field name from the configuration
    invalid_table_column_field: '`{$option}`-alternativet hänvisar till ett fält med namnet `{$name}`, men inget sådant fält är definierat i samlingen.'
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: '`view_groups`-alternativet hänvisar till ett fält med namnet `{$name}`, men inget sådant fält är definierat i samlingen.'
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: '`view_filters`-alternativet hänvisar till ett fält med namnet `{$name}`, men inget sådant fält är definierat i samlingen.'
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: Vygruppen {$count} måste ha `name`-alternativet definierat som en icke-tom sträng.
