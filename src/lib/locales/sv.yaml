global_assets: Globala resurser

# ==============================================================================
# Entry and Collection Actions
# ==============================================================================
# Strings related to creating, editing, and managing entries and collections.

# Error message when entry cannot be found
entry_not_found: Posten hittades inte.

# Entry creation restrictions: tooltip and advisory messages
creating_entries_disabled_by_admin: Skapande av nya poster är inaktiverat av administratören.
# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: Du kan inte lägga till nya poster i denna samling eftersom den har nått sin gräns på {$quota} poster.
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$remaining :integer}
  .match $remaining
    one {{ Denna samling närmar sig sin gräns på {$quota} poster. Du kan bara skapa {$remaining} fler post. }}
    *   {{ Denna samling närmar sig sin gräns på {$quota} poster. Du kan bara skapa {$remaining} fler poster. }}

# Navigation: back links and list labels
back_to_collection: Tillbaka till samling
collection_list: Samlingslista
back_to_collection_list: Tillbaka till samlingslista
asset_folder_list: Resursmapplista
back_to_asset_folder_list: Tillbaka till resursmapplista

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: Sökresultat
# {$terms} is the current search query text
search_results_for_x: Sökresultat för “{$terms}”

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Du tittar nu på sökresultat för “{$terms}”. Vi kunde inte hitta några poster. }}
    one {{ Du tittar nu på sökresultat för “{$terms}”. Vi har hittat en post. }}
    *   {{ Du tittar nu på sökresultat för “{$terms}”. Vi har hittat {$count} poster. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Du tittar nu på sökresultat för “{$terms}”. Vi kunde inte hitta några resurser. }}
    one {{ Du tittar nu på sökresultat för “{$terms}”. Vi har hittat en resurs. }}
    *   {{ Du tittar nu på sökresultat för “{$terms}”. Vi har hittat {$count} resurser. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ Inga poster }}
    one {{ {$count} post }}
    *   {{ {$count} poster }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ Inga resurser }}
    one {{ {$count} resurs }}
    *   {{ {$count} resurser }}

# Empty state messages
no_files_found: Inga filer hittades.
no_entries_found: Inga poster hittades.

# ==============================================================================
# Asset Management
# ==============================================================================
# Strings for uploading, editing, and managing assets (images, documents, etc.).

# Upload dialog: title and button label
upload_assets: Ladda upp resurser

# Edit options menu: button and item labels
edit_options: Redigera alternativ
show_edit_options: Visa redigeringsalternativ
# Edit menu items with specific asset names
edit_asset: Redigera resurs
# {$name} is the selected asset name
edit_x: 'Redigera {$name}'

# Asset text editor: switch for line wrapping
wrap_long_lines: Radbryt långa rader

# Rename asset: dialog and validation
rename_asset: Byt namn på resurs
# {$name} is the current asset name
rename_x: 'Byt namn på {$name}'
# Dialog body text indicating how many entries reference this asset
# {$count} is the number of entries that currently reference the asset
enter_new_name_for_asset: |
  .input {$count :integer}
  .match $count
    0   {{ Ange ett nytt namn nedan. }}
    one {{ Ange ett nytt namn nedan. En post som använder resursen kommer också att uppdateras. }}
    *   {{ Ange ett nytt namn nedan. {$count} poster som använder resursen kommer också att uppdateras. }}
# Validation errors for asset renaming
enter_new_name_for_asset_error:
  empty: Filnamnet får inte vara tomt.
  character: Filnamnet får inte innehålla specialtecken.
  duplicate: Detta filnamn används för en annan resurs.

# Replace asset: menu item and dialog title
replace_asset: Byt ut resurs
# {$name} is the asset being replaced
replace_x: 'Byt ut {$name}'

# File selection prompts: drop zones and file pickers
# Browse prompt shown when drag-and-drop is unavailable on desktop and pointer devices
click_to_browse: Klicka för att bläddra…
# Browse prompt shown on touch devices
tap_to_browse: Tryck för att bläddra…
