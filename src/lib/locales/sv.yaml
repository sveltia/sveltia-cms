  edit_failed: Ändringarna i {$name} kunde inte tillämpas. Kontrollera webbläsarkonsolen för mer information.
  # Error shown when the changes would move the entry to another file path, e.g. through a path
  # template using a field. {$name} is the singular label of the collection
  move_unsupported: Dessa ändringar skulle flytta {$name} till en annan plats, vilket bara kan göras genom att redigera den separat.
  # Error shown when saving, if someone else has changed an entry edited from the field since. {$name}
  # is the summary of that entry
  edit_conflict: “{$name}” har ändrats av någon annan sedan du redigerade den. Öppna den igen från fältet för att jämföra dina ändringar med den senaste versionen.
  # Error shown when saving, if someone else has deleted an entry edited from the field since.
  # {$name} is the summary of that entry
  edit_deleted: “{$name}” har raderats av någon annan sedan du redigerade den. Ta bort den från fältet för att spara posten.
  # Accessible label of the menu listing the selected entries that can be edited
  select_entry_to_edit: Välj en post att redigera
  # Warning shown in the editor of an entry that has been edited from a Relation field of another
  # entry, while the changes wait in that entry’s pull request. {$name} is the summary of that
  # entry
  edited_with_entry: Ändringar i den här posten väntar på att publiceras tillsammans med “{$name}”. Om du sparar den nu kombineras de två uppsättningarna ändringar när den posten publiceras, vilket kan misslyckas om de överlappar.
  # Warning shown in the dialog when an entry edited from the field has been changed by someone else
  # since. {$name} is the singular label of the collection
  changed_since_edit: Denna {$name} har ändrats av någon annan sedan du redigerade den. Dina ändringar visas ovanpå den senaste versionen. Granska dem innan du uppdaterar.

# Select Assets dialog
