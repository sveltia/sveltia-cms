publishing_changes_failed: Det gick inte att publicera ändringarna. Försök igen.

# Notifications: button aria-labels and section headings
show_notifications: Visa aviseringar
notifications: Aviseringar

# Account menu: button aria-labels and section headings
show_account_menu: Visa användarkontomeny
