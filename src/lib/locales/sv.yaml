    # {$values} is a list of the values the option accepts
    schema_invalid_enum: '`{$option}`-alternativet måste vara ett av dessa värden: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: '`{$option}`-alternativet måste vara `{$value}`.'
    schema_invalid_empty_value: '`{$option}`-alternativet måste vara en tom sträng.'
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: '`{$option}`-alternativet måste vara en array med {$count} element.'
    schema_invalid_value: '`{$option}`-alternativet har ett ogiltigt värde.'
    schema_missing_option: '`{$option}`-alternativet är obligatoriskt.'
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Ett av dessa alternativ är obligatoriskt: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: en sträng
      number: ett tal
      integer: ett heltal
      boolean: ett booleskt värde
      array: en array
      object: ett objekt
      'null': tomt

