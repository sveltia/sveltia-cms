# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: Detta fält är obligatoriskt.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: Datum/tid måste vara {$min} eller senare.
    date: Datumet måste vara {$min} eller senare.
    time: Tiden måste vara {$min} eller senare.
    number: Värdet måste vara större än eller lika med {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Du måste välja minst {$min} alternativ. }}
        *   {{ Du måste välja minst {$min} alternativ. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Du måste lägga till minst {$min} objekt. }}
        *   {{ Du måste lägga till minst {$min} objekt. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: Datum/tid måste vara {$max} eller tidigare.
    date: Datumet måste vara {$max} eller tidigare.
    time: Tiden måste vara {$max} eller tidigare.
    number: Värdet måste vara mindre än eller lika med {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ Du kan inte välja fler än {$max} alternativ. }}
        *   {{ Du kan inte välja fler än {$max} alternativ. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ Du kan inte lägga till fler än {$max} objekt. }}
        *   {{ Du kan inte lägga till fler än {$max} objekt. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Du måste ange minst {$min} tecken. }}
      *   {{ Du måste ange minst {$min} tecken. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ Du kan inte ange fler än {$max} tecken. }}
      *   {{ Du kan inte ange fler än {$max} tecken. }}

  # Type validation errors
  type_mismatch:
    number: Ange ett tal.
    email: Ange en giltig e-postadress.
    url: Ange en giltig URL.

