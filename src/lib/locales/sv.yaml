  preparing: 'Förbereder filer: {$done} av {$total}'
  committing: 'Sparar till GitHub: {$done} av cirka {$total} commits'

# Entry save error dialog
saving_entry:
  error:
    title: Fel
    description: Ett fel uppstod vid sparande av posten. Försök igen senare.

# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: Posten har ändrats av någon annan
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} ändrade den här posten {$date}, efter att du öppnade den.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Den här posten har ändrats i repot efter att du öppnade den.
  deleted: Den här posten har raderats från repot efter att du öppnade den.
  # Follows `modified_by` or `modified`
  overwrite_warning: Om du sparar nu går deras ändringar förlorade.
  # Follows `deleted`
  recreate_warning: Om du sparar nu skapas posten igen.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Eftersom posten lagras i samma fil som andra poster kan den inte sparas över ändringen. Avbryt redigeringen, öppna sedan posten igen från listan och gör dina ändringar.
  # OK button label
  save_anyway: Spara ändå
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: Repot har uppdaterats av någon annan medan du sparade. Försök igen.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: En post som lagras i samma fil har ändrats av någon annan. Försök igen.
  # {$path} is the file path
  array_file_invalid: Filen {$path} kan inte uppdateras, eftersom den inte innehåller en giltig lista med poster.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
# repository while the user has it open. The change itself is described with the `save_conflict`
# strings above
