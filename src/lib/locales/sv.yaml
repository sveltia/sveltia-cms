version_x: 'Version {$version}'
# Additional help menu items
report_issue: Rapportera problem
share_feedback: Dela feedback
get_help: Få hjälp
donate: Donera
join_discord: Gå med oss på Discord
bluesky: Följ oss på Bluesky

# Update notification: infobar message and button
update_available: Den senaste versionen av Sveltia CMS är tillgänglig.
update_now: Uppdatera nu

# Backend status notifications
# Shown when the Git backend (GitHub, GitLab, etc.) is experiencing issues
