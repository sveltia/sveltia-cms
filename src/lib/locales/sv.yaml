  .match $count
    one {{ Släpp en fil här }}
    *   {{ Släpp filer här }}

# File type validation errors
unsupported_file_type: Filtyp stöds inte
# {$type} is the expected asset type label, such as image or document
dropped_file_type_mismatch: 'Den släppta filen är inte en av följande typer: {$types}. Försök igen.'
dropped_image_type_mismatch: 'Den släppta filen stöds inte. Endast en bild av följande typer accepteras: {$types}. Försök igen.'

# File chooser button label
# {$count} is the number of files the picker allows the user to choose
choose_files: |
