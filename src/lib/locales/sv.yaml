    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: Vyfiltret {$count} måste ha `name`-alternativet definierat som en icke-tom sträng.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `pattern`, `eq` and `gte`
    invalid_view_filter_no_condition: Vyfiltret {$count} måste ha `pattern`-alternativet eller ett jämförelsealternativ som `eq` eller `gte` att matcha poster mot.
    # {$name} is the invalid or duplicate view filter name
