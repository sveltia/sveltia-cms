# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Det finns ett fel i CMS-konfigurationen. Lös problemet och försök igen. }}
      *   {{ Det finns fel i CMS-konfigurationen. Lös problemen och försök igen. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: '{$collection}-samlingen'
    file: '{$file}-filen'
    component: '{$component}-komponenten'
    # Don’t localize `{$field}`
    field: '`{$field}` fältet'

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS måste köras i en säker kontext (HTTPS eller localhost) för att fungera korrekt.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ Konfigurationsfilens URL måste använda HTTPS-protokollet eller en localhost-adress. }}
        *   {{ Konfigurationsfilens URL:er måste använda HTTPS-protokollet eller localhost-adresser. }}
    fetch_failed: Konfigurationsfilen kunde inte hämtas.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: HTTP-svaret returnerade status {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Konfigurationsfilen kunde inte hämtas. För att förhindra att `config.yml`-filen laddas, lägg till <a>`load_config_file: false`</a> i konfigurationsobjektet som skickas till `CMS.init()`.'
    parse_failed: Konfigurationsfilen kunde inte tolkas.
    parse_failed_invalid_object: Konfigurationsfilen är inte ett giltigt JavaScript-objekt.
    parse_failed_unsupported_type: Konfigurationsfilen är inte en giltig filtyp. Endast YAML, TOML och JSON stöds.
    no_collection: Samlingar är inte definierade.
    # Don’t localize `hide`
    no_visible_collection: Minst en samling måste vara synlig. Kontrollera `hide`-alternativet.
    missing_backend: Backend är inte definierad.
    missing_backend_name: Backend-namnet är inte definierat.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Backenden {$name} stöds <a>inte</a> i Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Backenden {$name} är föråldrad och stöds <a>inte</a> i Sveltia CMS.
    unsupported_custom_backend: Egna backends stöds <a>inte</a> i Sveltia CMS.
    unsupported_backend_suggestion: Använd istället en av de <a>backends som stöds</a>.
    missing_repository: Git-repot är inte definierat.
    invalid_repository: Det konfigurerade Git-repot är ogiltigt. Det måste vara i formatet “ägare/repo”.
    # Don’t localize `api_root`
    missing_api_root: '`api_root`-alternativet är inte definierat. Det krävs för Forgejo-backenden.'
    invalid_root_dir: Rotkatalogen är ogiltig. Den måste vara en sökväg inom repot, utan “..”.
    invalid_root_dir_branch: Rotkatalogen kan inte användas i branchnamnen för publiceringslägena `editorial_workflow` och `preview`. Ingen del av dess sökväg får börja med en punkt, sluta med “.lock” eller innehålla ett mellanslag eller ett specialtecken som kolon eller asterisk.
    path_outside_root_dir: Sökvägen “{$path}” leder utanför rotkatalogen, där CMS:et inte kan lista filer.
    oauth_implicit_flow: Den konfigurerade autentiseringsmetoden (implicit flow) stöds inte i Sveltia CMS. Använd en annan <a>autentiseringsmetod</a> istället.
    github_pkce_unsupported: PKCE-auktorisering stöds ännu inte på grund av GitHubs begränsningar. Använd en annan <a>autentiseringsmetod</a> istället.
    additions_no_base_url: '`base_url`-alternativet måste vara URL:en till din Sveltia CMS Additions-tjänst.'
    oauth_no_app_id: OAuth-applikations-ID är inte definierat.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: '`open_authoring`-alternativet kräver publiceringsläget `editorial_workflow` eller `preview`. Se <a>dokumentationen</a> för mer information.'
    # Don’t localize `auth_methods`
    no_auth_methods: '`auth_methods`-alternativet måste innehålla minst en metod.'
    # Don’t localize `auth_scope`, `repo` and `public_repo`
    auth_scope_no_repo: '`auth_scope`-alternativet måste innehålla `repo` eller `public_repo`.'
    missing_media_folder: Mediamappen är inte definierad.
    public_folder_relative_path: Den konfigurerade publika mappen är ogiltig. Den måste vara en absolut sökväg som börjar med “/”.
    public_folder_absolute_url: En absolut URL för det publika mapp-alternativet stöds inte i Sveltia CMS.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: '`{$option}`-alternativet innehåller malltaggen `{$tag}`, som inte stöds där. Endast slugg-malltaggarna, som `\{\{slug\}\}` och `\{\{year\}\}`, samt taggarna `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` och `\{\{public_folder\}\}` kan användas.'
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: '`{$option}`-alternativet innehåller malltaggen `{$tag}`, som bara kan användas i alternativet för en samling, en samlingsfil eller ett fält, där det finns en post att fylla i den med.'
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: '`sanitize_replacement`-alternativet är inställt på `{$replacement}`, men det innehåller ett tecken som inte kan användas i en slugg, så det kan inte ersätta ett sådant.'
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: '`{$option}`-alternativet är inställt på `{$url}`, men det måste vara en absolut URL som börjar med `https://` eller `http://`.'
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: '`stages`-alternativet för `publish_mode` måste börja med `draft` och lista stegen i ordningen `draft`, `pending_review`, `pending_publish`, utan upprepningar.'
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: '`i18n.locales`-alternativet måste innehålla minst ett språk.'
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: '`default_locale`-alternativet är inställt på `{$locale}`, men det finns inte bland `locales`.'
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: '`initial_locales`-alternativet innehåller `{$locale}`, men det finns inte bland `locales`.'
    # Don’t localize `i18n`
    i18n_no_collections: '`i18n`-alternativet är konfigurerat på toppnivå, men ingen av samlingarna eller singlarna har `i18n`-alternativet, så inget innehåll kan översättas. Lägg till `i18n: true` i de samlingar och singlar som ska översättas.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: '`transformations`-alternativet innehåller en nyckel `{$key}` som inte stöds. Den måste vara `raster_image`, `svg` eller ett rasterbildformat som stöds.'
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: '`quality`-alternativet för transformationen `{$key}` är ogiltigt. Det måste vara ett heltal mellan 0 och 100.'
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: '`{$prop}`-alternativet för transformationen `{$key}` är ogiltigt. Det måste vara ett positivt heltal.'
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: Resurs-samlingen {$count} måste ha `name`-alternativet definierat som en icke-tom sträng.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Namnet på resurs-samlingen `{$name}` är ogiltigt. Det får inte innehålla specialtecken.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Namnen på resurs-samlingar måste vara unika, men `{$name}` används mer än en gång.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: Samlingen måste ha antingen `folder`-, `file`-, `files`- eller `divider`-alternativet definierat.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: Samlingen kan inte ha mer än ett av alternativen `folder`, `file`, `files` och `divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: Filändelsen `{$extension}` matchar inte formatet `{$format}`.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: Fältet `{$name}` sparas som brödtexten under front matter, som bara kan innehålla text, inte ett tal, ett booleskt värde, en lista eller ett objekt som ett `{$widget}`-fält gör. Använd en fälttyp som innehåller text, eller byt namn på fältet.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
    # brackets are escaped with backslashes for MessageFormat 2
    invalid_collection_data_file: '`file`-alternativet `{$file}` är ogiltigt. Det måste vara sökvägen till en JSON-fil, utan platshållaren `\{\{locale\}\}`.'
    # {$prop} is the option name; Don’t localize `file`
    unsupported_collection_data_file_option: '`{$prop}`-alternativet stöds inte i en samling med `file`-alternativet.'
    # Don’t localize `file`, `publish_mode` and `simple`
    collection_data_file_workflow: Redaktionellt arbetsflöde och förhandsgranskningsarbetsflöde, inklusive öppen redigering, stöds inte i en samling med `file`-alternativet. Ställ in samlingens `publish_mode`-alternativ på `simple`.
    # {$prop} is the option name; Don’t localize `file` and `slug`. The curly brackets are escaped
    # with backslashes for MessageFormat 2
    collection_data_file_slug_tag: '`{$prop}`-alternativet får inte innehålla taggen `\{\{slug\}\}` i en samling med `file`-alternativet, eftersom en posts slugg är dess position, som ändras när posterna sorteras om eller raderas. Använd i stället ett fält med ett unikt värde.'
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Slugg-mallen `{$slug}` är ogiltig eftersom den inte kan innehålla snedstreck. För att organisera poster i undermappar, använd `path`-alternativet istället för `slug`.
    # {$name} is the field name from the configuration; Don’t localize `identifier_field`
    invalid_identifier_field: '`identifier_field`-alternativet hänvisar till `{$name}`, men inget sådant fält är definierat i samlingen.'
    # {$name} is the field name from the configuration; Don’t localize `filter`
    invalid_filter_field: '`filter`-alternativet hänvisar till `{$name}`, men inget sådant fält är definierat i samlingen.'
    # Don’t localize `filter`, `value` and `pattern`
    invalid_filter_no_condition: '`filter`-alternativet måste ha antingen `value`- eller `pattern`-alternativet att matcha poster mot.'
    # {$option} is an option name such as `slug` or `summary` and {$name} is the field name or template tag from the configuration
    option_field_not_found: '`{$option}`-alternativet hänvisar till `{$name}`, men inget sådant fält är definierat.'
    # {$name} is the field name from the configuration and {$widget} is its field type; Don’t localize `thumbnail`
    thumbnail_field_not_media: '`thumbnail`-alternativet hänvisar till `{$name}`, men det måste vara ett Image- eller File-fält, inte ett `{$widget}`-fält.'
    # Don’t localize `inline` or `multiple`
    invalid_inline_component_fields: '`inline`-läget kräver ett enda Boolean-, Color-, DateTime-, Number-, Relation-, Select- eller String-fält. Ett Relation- eller Select-fält får inte ha `multiple`-alternativet aktiverat.'
    # {$option} is an option name such as `pattern` or `filter` and {$pattern} is the configured pattern
    invalid_regex: '`{$option}`-alternativet innehåller ett ogiltigt reguljärt uttryck `{$pattern}`, som ignoreras.'
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
