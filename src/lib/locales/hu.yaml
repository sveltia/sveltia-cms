# ==============================================================================
# Common Actions
# ==============================================================================
# Generic action button labels used throughout the application. These are
# reusable strings for common operations like save, delete, cancel, etc.

# Primary actions: creation, selection, and file operations
create: Új
select: Kijelölés
select_all: Összes kijelölése
# Accessible name of the checkbox that selects a single entry or asset in a list
select_item: '{$name} kijelölése'
upload: Feltöltés
copy: Másolás
download: Letöltés
duplicate: Duplikálás
delete: Törlés
reorder: Átrendezés

# Dialog and form actions: confirmation and cancellation
cancel: Mégse
done: Kész
save: Mentés
# Progress indicator shown on the save button while a save operation is in progress
saving: Mentés…

# Publishing actions: used when committing changes to the repository
publish: Közzététel
# Progress indicator shown on the publish button during publishing
publishing: Közzététel…

# Modification actions: editing and updating content
rename: Átnevezés
update: Frissítés
replace: Csere

# List and collection actions: adding and removing items
add: Hozzáadás
remove: Eltávolítás
clear: Kiürítés

# Expansion and collapse actions: used for accordions, trees, and expandable sections
expand: Kibontás
expand_all: Összes kibontása
collapse: Összecsukás
collapse_all: Összes összecsukása

# Content manipulation: inserting, restoring, and discarding
insert: Beszúrás
restore: Visszaállítás
discard: Elvetés

# ==============================================================================
# Common UI Elements
# ==============================================================================
# Reusable labels and messages for common interface elements like status
# indicators, loading states, and toolbar regions.

# Status messages: search and results indicators
# Shown in ARIA live regions during search operations
searching: Keresés…
no_results: Nincs találat.

# Toolbar region labels: used as aria-labels for different toolbar areas
# These help screen readers identify which toolbar is being navigated
global: Globális
primary: Elsődleges
secondary: Másodlagos
collection: Gyűjtemény
folder: Mappa
# Label of the subfolder list in the asset picker
folders: Mappák
# Menu in a breadcrumb holding the folders that don’t fit
more_folders: További mappák

# ==============================================================================
# Miscellaneous Labels
# ==============================================================================
# Various labels used across the application for specific UI elements
# that don’t fit into other categories.

# Field and input labels
api_key: API-kulcs
details: Részletek
back: Vissza
# Reusable label for an option whose value is determined automatically, e.g. the UI language
automatic: Automatikus
# Loading indicator shown during async operations (asset preview, panels, etc.)
loading: Betöltés…
# Dismiss button for temporary notifications and infobars
later: Később

# Entry and collection labels
# Slug field heading in entry editors
slug: URL-azonosító
# Fallback labels for singleton collections when names aren’t configured
singleton: Egyedi oldal
singletons: Egyedi oldalak

# Error messages
# Toast notification when clipboard operations fail
clipboard_error: Nem sikerült a vágólapra másolni.

# ==============================================================================
# Sign-In Page
# ==============================================================================
# Strings specific to the authentication and sign-in page, including welcome
# messages, loading states, OAuth flows, and repository access options.

# Welcome and branding
# Screen reader announcement when the sign-in page loads
# {$name} is the app title shown on the sign-in screen, Sveltia CMS by default
welcome_message: '{$name} – üdvözlet!'
# Footer text with CMS branding
# {$name} is the CMS brand name shown in the footer, Sveltia CMS by default
powered_by: 'Működteti: {$name}'

# Shown during initial configuration and data loading
unsupported_browser_error: A böngésződ nem támogatott. Frissítsd a legújabb verzióra, vagy használj másik böngészőt.
loading_cms_config: CMS-konfiguráció betöltése…
loading_site_data: Webhelyadatok betöltése…
loading_site_data_error: Hiba történt a webhelyadatok betöltése közben.

# OAuth and token authentication
# Primary sign-in button label for OAuth providers (GitHub, GitLab, etc.)
# {$service} is the sign-in provider label, such as GitHub or GitLab
sign_in_with_x: Bejelentkezés {$service}-fiókkal

# Access token dialog: alternative authentication method
sign_in_using_access_token: Bejelentkezés hozzáférési tokennel
sign_in_using_access_token_description: Add meg alább a tokenedet. Olvasási és írási hozzáféréssel kell rendelkeznie a tároló tartalmához.
# Shown after the description above when Editorial Workflow is enabled, which opens and merges pull requests
sign_in_using_access_token_workflow_note: Mivel a szerkesztői munkafolyamat be van kapcsolva, a pull requestekhez is olvasási és írási hozzáféréssel kell rendelkeznie.
# Inline link text with embedded HTML anchor tag
# {$service} is the provider name whose user settings page contains the token generator, e.g., GitHub or GitLab
sign_in_using_access_token_link: 'Tokent itt hozhatsz létre: <a>{$service} – felhasználói beállítások</a>.'
# Input field label for personal access token
personal_access_token: Személyes hozzáférési token

# Authentication progress indicators
authorizing: Engedélyezés…
signing_in: Bejelentkezés…

# Local and test repository options
# Button label and description for working with a local Git repository
work_with_local_repo: Munka helyi tárolóval
# {$repo} is the configured repository name shown when it is available
work_with_local_repo_description: 'Amikor a rendszer kéri, válaszd ki a következő tároló gyökérkönyvtárát: „{$repo}”.'
work_with_local_repo_description_no_repo: Amikor a rendszer kéri, válaszd ki a Git-tárolód gyökérkönyvtárát.
# Button label for demo/test repository
work_with_test_repo: Munka teszttárolóval
# Button label for the test repository when sample content is seeded, e.g. on a demo site
start_demo: Demó indítása
# Shown below the disabled test repository option in a browser that can’t save files to its
# storage, e.g. Safari before version 26
test_repo_unsupported_browser: A böngésződ nem tudja menteni a teszttároló fájljait. Frissítsd a legújabb verzióra, vagy használj másik böngészőt.

# Authentication errors
# Error messages shown during sign-in failures
sign_in_error:
  not_project_root: A kiválasztott mappa nem egy tároló gyökérkönyvtára. Próbáld újra.
  picker_dismissed: Nem sikerült kiválasztani a tároló gyökérkönyvtárát. Próbáld újra.
  authentication_aborted: A hitelesítés megszakadt. Próbáld újra.
  invalid_token: A megadott token érvénytelen. Ellenőrizd, és próbáld újra.
  # OAuth and authenticator errors (shown with error codes) — keys are defined in the Sveltia CMS Authenticator library
  UNSUPPORTED_BACKEND: A hitelesítő nem támogatja a Git-háttérrendszeredet.
  UNSUPPORTED_DOMAIN: A domainednek nincs engedélye a hitelesítő használatára.
  MISCONFIGURED_CLIENT: Az OAuth-alkalmazás kliensazonosítója vagy titkos kulcsa nincs beállítva.
  AUTH_CODE_REQUEST_FAILED: Nem sikerült engedélyezési kódot kapni. Próbáld újra később.
  CSRF_DETECTED: Lehetséges CSRF-támadást észleltünk. A hitelesítési folyamat megszakadt.
  TOKEN_REQUEST_FAILED: Nem sikerült hozzáférési tokent kérni. Próbáld újra később.
  TOKEN_REFRESH_FAILED: Nem sikerült frissíteni a hozzáférési tokent. Próbáld újra később.
  MALFORMED_RESPONSE: A szerver hibás formátumú adatokkal válaszolt. Próbáld újra később.

# Backend and repository validation errors
# Shown when the configured backend or repository is invalid or inaccessible
# {$name} is the backend display name like Forgejo and {$version} is the minimum supported version
backend_unsupported_version: A háttérrendszer ({$name}) használatához {$name} {$version} vagy újabb verzió szükséges.
# {$repo} is the repository identifier, typically in owner/repo format
repository_no_access: 'Nincs hozzáférésed a következő tárolóhoz: „{$repo}”.'
# {$repo} is the repository identifier, typically in owner/repo format
repository_no_write_access: 'Nincs írási hozzáférésed a következő tárolóhoz: „{$repo}”.'
repository_not_found: 'A következő tároló nem létezik: „{$repo}”.'
repository_empty: 'A következő tárolóban nincs egyetlen ág sem: „{$repo}”.'
# {$repo} is the repository identifier, and {$branch} is the configured branch name
branch_not_found: A tárolóban („{$repo}”) nincs „{$branch}” nevű ág.
# {$repo} is the repository identifier, and {$dir} is the configured root directory
root_dir_not_found: 'A gyökérkönyvtár („{$dir}”) nem létezik a következő tárolóban: „{$repo}”.'

# General errors
# Fallback error dialog title for unexpected errors
unexpected_error: Váratlan hiba
# Shown in place of the page when an unexpected error stops it from being displayed
# {$message} is the error message
page_crashed: Hiba történt, ezért ez az oldal nem jeleníthető meg. {$message}
# Shown in place of a field editor or preview when an unexpected error stops it from being displayed
# {$message} is the error message
field_crashed: Hiba történt, ezért ez a mező nem jeleníthető meg. {$message}
# Button label for displaying a part of the page again after an unexpected error
try_again: Újrapróbálás
# Button label for reloading the CMS after an unexpected error
reload_cms: CMS újratöltése

# Entry file parsing errors
# Toast notification when entry files fail to parse on initial load
# {$count} is the number of entry files that failed to parse
entry_parse_errors: |
  .input {$count :integer}
  .match $count
    one {{ Hiba történt egy bejegyzésfájl feldolgozása közben. A részleteket a böngésző konzoljában találod. }}
    *   {{ Hibák történtek a bejegyzésfájlok feldolgozása közben. A részleteket a böngésző konzoljában találod. }}

# ==============================================================================
# Authentication and Account
# ==============================================================================
# These strings are used for sign-in, account management, and authentication
# flows throughout the application.

# Sign-in page and external assets panel: credential input field aria-labels
username: Felhasználónév
password: Jelszó

# Sign-in actions: primary button labels and account menu items
# Used on the sign-in page and in confirmation dialogs for external assets
sign_in: Bejelentkezés

# Mobile sign-in feature: dialog title and instructions for QR code authentication
sign_in_with_mobile: Bejelentkezés mobilon
# Instructions shown in the mobile sign-in dialog for passwordless authentication
sign_in_with_mobile_instruction: A jelszó nélküli bejelentkezéshez olvasd be az alábbi QR-kódot a telefonoddal vagy táblagépeddel. A beállításaid automatikusan átmásolódnak.
# Confirmation dialog shown when the CMS is opened with a sign-in link from the mobile sign-in
# QR code. {$account} is the account name, {$service} is the Git service name, e.g. GitHub
sign_in_with_link: Bejelentkezés hivatkozással
sign_in_with_link_confirmation: Ez a hivatkozás {$account} néven jelentkeztet be a szolgáltatásba ({$service}), és átmásolja a beállításokat arról az eszközről, amelyen létrehozták. Csak akkor folytasd, ha a hivatkozást te magad hoztad létre.

# Account menu: user status and repository mode indicators
# Shown at the top of the account dropdown menu
# {$name} is the signed-in user’s login name
signed_in_as_x: 'Bejelentkezve: {$name}'
working_with_local_repo: Munka helyi tárolóval
working_with_test_repo: Munka teszttárolóval
working_in_demo_mode: Demó mód

# Demo welcome dialog: shown once after signing in to a demo site, where the test repository is
# seeded with sample content and the changes are only stored in the browser
demo_welcome:
  title: Üdvözöl a Sveltia CMS demó
  description: Nyugodtan fedezd fel a CMS-t, és szerkeszd a mintatartalmat. A módosításaid csak ebben a böngészőben mentődnek. Semmi nem jelenik meg az interneten, és senki más nem látja őket.
  reset_hint: Ha az eredeti tartalommal szeretnéd újrakezdeni, válaszd az Összes adat törlése lehetőséget a Beállítások > Adatkezelés alatt.
  button_label: Kezdjük

# Account menu: action items for sign-out and app installation
sign_out: Kijelentkezés
install_as_app: Telepítés alkalmazásként

# ==============================================================================
# Global Toolbar
# ==============================================================================
# Strings used in the main application toolbar, including navigation, search,
# notifications, and menu items.

# Main page titles in the global navigation and page switcher button group
contents: Tartalom
assets: Médiatár
editorial_workflow: Szerkesztői munkafolyamat
# Name of the Editorial Workflow page when all the content uses Preview Workflow, which has no
# review stages, so the page only lists the drafts
drafts: Piszkozatok
cms_config: CMS-konfiguráció
# Mobile menu page title (shown only on small screens)
menu: Menü
# Mobile menu page section heading listing the custom pages registered by the site
custom_pages: Oldalak

# Mobile promo infobar: encouraging users to try the mobile version
mobile_promo_title: A Sveltia CMS már mobilon is elérhető!
mobile_promo_button: Próbáld ki

# New language infobar: encouraging users to switch to a newly available language
# {$locale} is the localized language name, e.g., “French”
new_language_available: A Sveltia CMS már {$locale} nyelven is elérhető!
change_language: Nyelv módosítása

# Live reload infobar: shown when the CMS runs on a page that a framework’s development server (e.g.
# Astro) reloads on every file change, instead of a static HTML file
live_reload_warning: A fejlesztői szervered minden fájlmódosításkor újratölti ezt az oldalt, ami megszakíthatja a mentést, és sérült fájlokat hagyhat maga után. Helyette statikus HTML-fájlból szolgáld ki a CMS-t. <a>További információ</a>

# Toast notification shown while the translation for the selected language is being downloaded
# {$locale} is the localized language name, e.g., “French”
switching_language: Váltás {$locale} nyelvre…
locale_load_failed: Nem sikerült betölteni a fordítást ({$locale}). Próbáld újra később.

# Toast notification shown when changes saved with the local backend couldn’t be committed to Git
# {$reason} is one of the `local_git_skip_reasons` strings below
local_git_not_committed: A módosításaidat mentettük, de nem commitoltuk őket a Gitbe. {$reason} Ha csak a fájlokat szeretnéd menteni, kapcsold ki a Git-commitokat a Beállítások > Fejlesztő részben.
local_git_skip_reasons:
  unsupported_repository: A tárolód olyan Git-funkciót használ, amelyet a CMS nem támogat, például csatolt munkafát (linked worktree), SHA-256 objektumneveket, reftable formátumot, ritka indexet (sparse index) vagy 3-as, illetve 4-es verziójú indexet, amelyet a feature.manyFiles beállítás és a git add -N használ.
  missing_identity: A neved és az e-mail-címed nincs beállítva a tároló Git-konfigurációjában, és a CMS nem tudja beolvasni a globálisat. Állítsd be őket a tárolóban a git config --local user.name "Your Name" és a git config --local user.email "you@example.com" paranccsal.
  locked: Egy másik Git-folyamat használja a tárolót. Ha egy sem fut, töröld a .git/index.lock fájlt.
  # The operation in progress, with how to finish or cancel it
  operation_in_progress:
    merge: Egy merge folyamatban van. Fejezd be a git commit paranccsal, vagy szakítsd meg a git merge --abort paranccsal.
    rebase: Egy rebase folyamatban van. Fejezd be a git rebase --continue paranccsal, vagy szakítsd meg a git rebase --abort paranccsal. Ha már továbbléptél, a git rebase --quit a fájlok módosítása nélkül elveti.
    cherry_pick: Egy cherry-pick folyamatban van. Fejezd be a git cherry-pick --continue paranccsal, vagy szakítsd meg a git cherry-pick --abort paranccsal.
    revert: Egy revert folyamatban van. Fejezd be a git revert --continue paranccsal, vagy szakítsd meg a git revert --abort paranccsal.
    am: Patchek alkalmazása van folyamatban a git am paranccsal. Fejezd be a git am --continue paranccsal, vagy szakítsd meg a git am --abort paranccsal.
    conflict: Egyes fájlokban ütközések vannak. Előbb oldd fel őket, és stage-eld az eredményt.
  detached_head: Nincs kiválasztott (checkout) ág.
  staged_changes: Más módosítások is commitra várnak (staged). Előbb commitold őket, vagy vond vissza a stage-elésüket.
  # {$path} is the file path
  lfs: '{$path} – ezt a fájlt a Git LFS követi, ezért a CMS nem tudja commitolni.'
  # {$message} is the error message
  error: Váratlan hiba történt. {$message}

