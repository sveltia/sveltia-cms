  .input {$count :integer}
  .match $count
    0   {{ Most ezt a gyűjteményt nézed: „{$collection}”. Még nincs benne bejegyzés. }}
    one {{ Most ezt a gyűjteményt nézed: „{$collection}”. Egy bejegyzés van benne. }}
    *   {{ Most ezt a gyűjteményt nézed: „{$collection}”. {$count} bejegyzés van benne. }}
# Asset folder view announcements with asset counts
# {$folder} is the folder label and {$count} is the number of assets in it
viewing_x_asset_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Most ezt a médiamappát nézed: „{$folder}”. Még nincs benne médiafájl. }}
    one {{ Most ezt a médiamappát nézed: „{$folder}”. Egy médiafájl van benne. }}
    *   {{ Most ezt a médiamappát nézed: „{$folder}”. {$count} médiafájl van benne. }}
