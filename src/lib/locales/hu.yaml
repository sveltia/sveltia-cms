    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Az alábbi beállítások egyikének megadása kötelező: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: karakterláncnak
      number: számnak
      integer: egész számnak
      boolean: logikai értéknek
      array: tömbnek
      object: objektumnak
      'null': üresnek

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: Az OAuth-alkalmazásazonosító nincs megadva. A felhasználóknak hozzáférési tokent kell megadniuk a bejelentkezéshez.
