warning_oversized_files: |
  .input {$count :integer}
  .match $count
    one {{ Ez a fájl nem tölthető fel, mert meghaladja a maximális {$size} méretet. Csökkentsd a méretét, vagy válassz másik fájlt. }}
    *   {{ Ezek a fájlok nem tölthetők fel, mert meghaladják a maximális {$size} méretet. Csökkentsd a méretüket, vagy válassz másik fájlokat. }}

# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: Érvénytelen fájlok
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    one {{ Ez a fájl nem tölthető fel, mert sérült, vagy a tartalma nem egyezik a kiterjesztésével. Ez gyakran előfordul, ha egy fényképet átneveznek ahelyett, hogy átalakítanák, például ha egy HEIC képet JPEG fájlként mentenek. Alakítsd át a fájlt, és próbáld újra. }}
    *   {{ Ezek a fájlok nem tölthetők fel, mert sérültek, vagy a tartalmuk nem egyezik a kiterjesztésükkel. Ez gyakran előfordul, ha fényképeket átneveznek ahelyett, hogy átalakítanák, például ha HEIC képeket JPEG fájlként mentenek. Alakítsd át a fájlokat, és próbáld újra. }}
