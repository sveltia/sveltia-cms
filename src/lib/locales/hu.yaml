    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: A beállítást (`{$prop}`) a Sveltia CMS nem támogatja. Figyelmen kívül marad.
    # Don’t localize `stages`, `publish_mode`, `editorial_workflow` and {$type}, which is `preview` or `simple`
    publish_mode_stages_ignored: A `publish_mode` `stages` beállítása csak az `editorial_workflow` közzétételi módra vonatkozik, ezért `{$type}` mód esetén figyelmen kívül marad.
    # Don’t localize `pattern`, `m` and `s`
    inline_component_multiline_pattern: Ennek a soron belüli komponensnek a `pattern` beállítása `m` vagy `s` jelzőt tartalmaz, vagy sortörésekre illeszkedik, de a soron belüli komponensek csak egy bekezdésen belül illeszkednek.
    # {$name} is a button or component name and {$option} is `buttons` or `editor_components`; Don’t localize them and `multiline: false`
    single_line_block_item: 'A `{$option}` beállítás `{$name}` eleme figyelmen kívül marad, mivel a `multiline: false` beállítású mező csak soron belüli tartalmat tartalmazhat.'
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: A `picker_utc` és az újabb időzóna-beállítások (`input_timezone` vagy `output_utc`) egyaránt meg vannak adva. Az új beállítások élveznek elsőbbséget. Érdemes eltávolítani a `picker_utc` beállítást a konfigurációból.
    # Don’t localize `localize_format` and `format`
    localize_format_without_format: A `localize_format` beállításnak nincs hatása, mert a mezőnek nincs `format` beállítása, és az értéke ISO 8601 formátumban tárolódik.
    # {$name} is a template tag like `fields.lines.*.price`; Don’t localize `value`, `*` and `sum()`
    compute_field_wildcard_without_item: A Compute típusú mező `value` beállítása egy címkére hivatkozik (`{$name}`), de a mező nem a `*` által jelölt lista egy elemében található, így semmire sem oldódik fel. A lista összes elemét csak összesítő függvény, például a `sum()` használhatja.
    # {$name} is a template tag like `fields.lines.*.amount`; Don’t localize `value`
    compute_field_self_reference: A Compute típusú mező `value` beállítása `{$name}` formában önmagára hivatkozik, így az értéke minden számításkor megváltozik, és sosem állandósul.
    # {$name} is a template tag like `fields.total`; Don’t localize `value`
    compute_field_reference_cycle: A Compute típusú mező `value` beállítása egy mezőre hivatkozik (`{$name}`), amely egy másik Compute típusú mező, és közvetlenül vagy más mezőkön keresztül visszahivatkozik erre a mezőre, így az értékeik sosem állandósulnak.
    # Don’t localize `localize_format`, `true` and `de`
    localize_format_without_i18n: A `localize_format` beállítás értéke `true`, de a gyűjteményben nincs engedélyezve az i18n, így az érték angol formátumban íródik ki. Állítsd inkább a beállítást egy nyelvkódra, például `de`.
    # {$locale} is the locale code from the configuration; Don’t localize `localize_format`
    localize_format_unsupported_locale: A `localize_format` beállítás értéke `{$locale}`, amely nem támogatott nyelv, így az érték angol formátumban íródik ki.
    # Don’t localize `preview_path`
    preview_path_no_date_field: A `preview_path` beállítás dátum- és időcímkéket használ, de a gyűjteményben nincs DateTime típusú mező, amelyből kiolvashatók lennének, így az előnézeti hivatkozás nem jelenik meg.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: A `preview_path_date_field` beállítás olyan mezőnévre hivatkozik (`{$name}`), amelyhez nincs megadva DateTime típusú mező, így az előnézeti hivatkozás nem jelenik meg.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: A `preview_path` beállítás olyan mezőre hivatkozik (`{$name}`), amely nincs megadva a gyűjteményben, így az előnézeti hivatkozás nem jelenik meg.
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: A gyűjteményben nincs `{$name}` mező, amellyel az új bejegyzések elnevezhetők, ezért minden új bejegyzés véletlenszerű URL-azonosítót kap. Adj hozzá egy `{$name}` mezőt, vagy állítsd be az `identifier_field` vagy a `slug` beállítást.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: A `slug` `i18n` beállításának nincs hatása, mert a gyűjtemény nem a `multiple_files`, `multiple_folders` vagy `multiple_root_folders` i18n-struktúrát használja, amelyben minden nyelvnek saját fájlja van.
    # Don’t localize `slug`, `template` and `auto_increment`
    slug_template_ignored: A `slug` `template` beállítása figyelmen kívül marad, mert az `auto_increment` beállítás számozza helyette az URL-azonosítókat.
    # {$file} is the file path; Don’t localize `file`, `locale`, `i18n`, `false`,
