  # OK button label
  save_anyway: Mentés mindenképp
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: A tárolót valaki más frissítette mentés közben. Próbáld újra.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Egy ugyanabban a fájlban tárolt bejegyzést valaki más módosított. Próbáld újra.
  # {$path} is the file path
  array_file_invalid: A fájl ({$path}) nem frissíthető, mert nem tartalmaz érvényes bejegyzéslistát.

