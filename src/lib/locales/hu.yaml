  .input {$count :integer}
  .match $count
    one {{ Ez a fájl nem tölthető fel, mert nem a következő típusok egyike: {$types}. }}
    *   {{ Ezek a fájlok nem tölthetők fel, mert nem a következő típusok egyikébe tartoznak: {$types}. }}
# {$count} is the number of files that are not of an image type the field accepts
# {$types} is the list of accepted image formats, such as “PNG or WebP”
warning_unsupported_image_files: |
  .input {$count :integer}
  .match $count
    one {{ Ez a fájl nem tölthető fel, mert csak a következő típusú kép fogadható el: {$types}. }}
    *   {{ Ezek a fájlok nem tölthetők fel, mert csak a következő típusú képek fogadhatók el: {$types}. }}

# File format validation when replacing an asset
# Warning section for replacement files that are in a different format
mismatched_files: Eltérő formátumú fájlok
# {$name} is the name of the asset being replaced and {$count} is the number of mismatched files
warning_mismatched_files: |
  .input {$count :integer}
  .match $count
    one {{ Ez a fájl nem cserélheti le a meglévő fájlt („{$name}”), mert eltérő a formátuma. Alakítsd át a fájlt ugyanarra a formátumra, és próbáld újra. }}
    *   {{ Ezek a fájlok nem cserélhetik le a meglévő fájlt („{$name}”), mert eltérő a formátumuk. Alakítsd át a fájlokat ugyanarra a formátumra, és próbáld újra. }}

# File name conflict resolution
