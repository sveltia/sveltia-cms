  .input {$count :integer}
  .match $count
    one {{ Ebben a mappában már létezik egy azonos nevű fájl. Lecseréled? }}
    *   {{ Ebben a mappában már létezik {$count} azonos nevű fájl. Lecseréled őket? }}
# {$name} is the conflicting file name when there is exactly one conflict; {$count} is the total conflict count
