creating_entries_nearing_quota: |
  .input {$quota :integer}
  .input {$remaining :integer}
  .match $quota $remaining
    one one {{ Ez a gyűjtemény közelít a korlátjához ({$quota} bejegyzés). Már csak {$remaining} bejegyzést hozhatsz létre. }}
    one *   {{ Ez a gyűjtemény közelít a korlátjához ({$quota} bejegyzés). Már csak {$remaining} bejegyzést hozhatsz létre. }}
    *   one {{ Ez a gyűjtemény közelít a korlátjához ({$quota} bejegyzés). Már csak {$remaining} bejegyzést hozhatsz létre. }}
    *   *   {{ Ez a gyűjtemény közelít a korlátjához ({$quota} bejegyzés). Már csak {$remaining} bejegyzést hozhatsz létre. }}

