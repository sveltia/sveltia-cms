      .input {$min :integer}
      .match $min
        one {{ Legalább {$min} elemet hozzá kell adnod. }}
        *   {{ Legalább {$min} elemet hozzá kell adnod. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: 'A dátum és időpont nem lehet későbbi ennél: {$max}.'
    date: 'A dátum nem lehet későbbi ennél: {$max}.'
    time: 'Az időpont nem lehet későbbi ennél: {$max}.'
    number: Az érték nem lehet nagyobb, mint {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ Legfeljebb {$max} lehetőséget választhatsz ki. }}
        *   {{ Legfeljebb {$max} lehetőséget választhatsz ki. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ Legfeljebb {$max} elemet adhatsz hozzá. }}
        *   {{ Legfeljebb {$max} elemet adhatsz hozzá. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Legalább {$min} karaktert meg kell adnod. }}
      *   {{ Legalább {$min} karaktert meg kell adnod. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ Legfeljebb {$max} karaktert adhatsz meg. }}
      *   {{ Legfeljebb {$max} karaktert adhatsz meg. }}

  # Type validation errors
  type_mismatch:
    number: Adj meg egy számot.
    email: Adj meg egy érvényes e-mail-címet.
    url: Adj meg egy érvényes URL-t.

  # Value used for the same field in another entry of the collection
  value_not_unique: Ezt az értéket már egy másik bejegyzés használja.
  # Key of a keyed List field item used for another item of the same list
  key_not_unique: Ezt a kulcsot már egy másik elem használja.
  # Key of a keyed List field item that is a whole number, which doesn’t keep its order in a map
  key_numeric: A kulcs nem lehet egész szám, mert az elemek elveszítenék a sorrendjüket.

  # Custom field validation error
  invalid_value: Érvénytelen érték.
  unexpected_error: Váratlan hiba történt.

