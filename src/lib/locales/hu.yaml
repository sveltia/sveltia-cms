  modified_by: '{$name} módosította ezt a bejegyzést ekkor: {$date}, miután megnyitottad.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Ezt a bejegyzést módosították a tárolóban, miután megnyitottad.
  deleted: Ezt a bejegyzést törölték a tárolóból, miután megnyitottad.
  # Follows `modified_by` or `modified`
  overwrite_warning: Ha most mented, az ő módosításai elvesznek.
  # Follows `deleted`
  recreate_warning: Ha most mented, a bejegyzés újra létrejön.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
