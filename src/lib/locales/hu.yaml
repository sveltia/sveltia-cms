# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: |
  .input {$quota :integer}
  .match $quota
    one {{ Ehhez a gyűjteményhez nem adhatsz hozzá új bejegyzést, mert elérte a korlátját ({$quota} bejegyzés). }}
    *   {{ Ehhez a gyűjteményhez nem adhatsz hozzá új bejegyzést, mert elérte a korlátját ({$quota} bejegyzés). }}
