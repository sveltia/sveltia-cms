      # Clear File Cache button
      file_cache:
        description: A helyileg gyorsítótárazott fájltartalmak és bélyegképek törlése tárhely felszabadításához vagy az elavult adatok okozta problémák megoldásához.
        button_label: Fájlgyorsítótár törlése
        confirmation: A helyileg gyorsítótárazott fájltartalmak és bélyegképek törlődnek. A nem mentett piszkozataid és beállításaid megmaradnak, a törölt adatok pedig szükség szerint újra letöltődnek vagy létrejönnek. Ezután a CMS újratöltődik.
      # Erase All Data button
      all_data:
        description: Minden olyan adat törlése, amelyet a CMS ebben a böngészőben tárol, beleértve a gyorsítótárazott fájlokat, a nem mentett piszkozatokat és a beállításokat. A tárolóba már elmentett tartalmakat ez nem érinti.
        button_label: Összes adat törlése
        confirmation: Az ebben a böngészőben tárolt összes adat törlődik, beleértve a gyorsítótárazott fájltartalmakat, a bélyegképeket, a nem mentett piszkozatokat, a beállításokat és a bejelentkezési állapotot. A tárolót ez nem érinti, de minden nem mentett módosítás elvész, és újra be kell jelentkezned. Ezután a CMS újratöltődik.

  # Developer panel
  developer:
    title: Fejlesztő
    developer_mode:
      title: Fejlesztői mód
      description: Néhány fejlesztőknek szóló funkció engedélyezése, többek között a részletes konzolnaplóké és a natív helyi menüké.
      switch_label: Fejlesztői mód engedélyezése
    local_git:
      title: Git-commitok
      description: A módosítások commitolása a helyi tároló aktuális ágára minden mentéskor, ahogyan a CMS távoli tároló esetén is teszi. A commitokat ezután a megszokott Git-eszközeiddel nézheted át és pusholhatod.
      switch_label: Módosítások commitolása a Gitbe
      checking: Tároló ellenőrzése…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: 'A CMS a módosításokat {$name} ({$email}) nevében commitolja a következő ágra: {$branch}.'
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: A módosítások most nem commitolhatók. {$reason}
    deploy_hook:
      title: Telepítési webhook
      description: Adj meg egy webhook-URL-t, amely akkor hívódik meg, amikor a „Módosítások közzététele” lehetőséggel manuálisan indítasz telepítést. Üresen hagyható, ha GitHub Actionst vagy GitLab CI/CD-t használsz.
      # Hook URL input
      url:
        field_label: Webhook-URL
        saved: Webhook-URL mentve.
        removed: Webhook-URL eltávolítva.
      # Authorization header input
      auth:
        field_label: Authorization fejléc (pl. Bearer <token>) (nem kötelező)
        saved: Authorization fejléc mentve.
        removed: Authorization fejléc eltávolítva.

