    missing_variable_type: 변수 유형 {$count}에는 `name` 옵션이 비어 있지 않은 문자열로 정의되어야 합니다.
    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: 변수 유형 이름 `{$name}`이(가) 올바르지 않습니다. 특수 문자를 포함할 수 없습니다.
