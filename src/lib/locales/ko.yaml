      # Erase All Data button
      all_data:
        description: 캐시된 파일, 저장하지 않은 초안, 설정 등 CMS가 이 브라우저에 보관하는 모든 데이터를 삭제합니다. 저장소에 이미 저장된 내용은 영향을 받지 않습니다.
        button_label: 모든 데이터 삭제
        confirmation: 캐시된 파일 내용, 이미지 썸네일, 저장하지 않은 초안, 설정, 로그인 상태 등 이 브라우저에 저장된 모든 데이터가 삭제됩니다. 저장소는 영향을 받지 않지만, 저장하지 않은 변경 사항은 사라지며 다시 로그인해야 합니다. 완료되면 CMS가 다시 로드됩니다.

