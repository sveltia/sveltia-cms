    light: 라이트

  # Language panel
  language:
    title: 언어
    ui_language:
      title: 사용자 인터페이스 언어
      select_language: 언어 선택

  # Contents panel
  contents:
    title: 콘텐츠
    editor:
      title: 에디터
      use_draft_backup:
        switch_label: 엔트리 초안 자동 백업
      close_on_save:
        switch_label: 초안을 저장한 후 에디터 닫기
      close_with_escape:
        switch_label: Escape 키로 에디터 닫기

  # Internationalization panel
  i18n:
    title: 국제화
    translators:
      default:
        title: 기본 번역 서비스
        select_service: 서비스 선택
      api_keys:
        title: 번역 서비스 API 키
        description: <a>번역 서비스</a>의 API 키를 관리합니다. 범용 AI 서비스의 API 키는 AI 설정에서 관리할 수 있습니다.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: '{$service} 키'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: <a {$homeHref}>{$service}</a>에 가입하신 후 여기에 <a {$apiKeyHref}>API 키</a>를 입력하시면 텍스트 입력 필드를 빠르게 번역할 수 있습니다.

  # Media panel
  media:
    title: 미디어
    stock_photos:
      api_keys:
        title: 스톡 사진 서비스 API 키
        description: <a>스톡 사진 서비스</a>의 API 키를 관리합니다.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: '{$service} API 키'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: <a {$homeHref}>{$service} API</a>에 가입하신 후 여기에 <a {$apiKeyHref}>API 키</a>를 입력하시면 이미지 입력 필드에 무료 스톡 사진을 삽입할 수 있습니다.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: '{$service}에서 제공하는 사진'
      no_services: 설정된 <a>스톡 사진 서비스</a>가 없습니다.
    cloud_storage:
      api_keys:
        title: 클라우드 스토리지 서비스 API 키
        description: <a>클라우드 스토리지 서비스</a>의 API 키를 관리합니다.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: '{$service} API 키'
      no_services: 설정된 <a>클라우드 스토리지 서비스</a>가 없습니다.

  # AI panel
  ai:
    title: AI
    api_keys:
      title: AI 서비스 API 키
      description: AI 서비스의 API 키를 관리합니다.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: '{$service} API 키'

  # Accessibility panel
  accessibility:
    title: 접근성
    underline_links:
      title: 링크 밑줄
      description: 엔트리 미리 보기와 사용자 인터페이스 레이블의 링크에 밑줄을 표시합니다.
      switch_label: 항상 링크에 밑줄 표시

  # Data Management panel
  data:
    title: 데이터 관리
    clear_data:
      title: 데이터 지우기
      # Clear File Cache button
      file_cache:
        description: 로컬에 캐시된 파일 내용과 이미지 썸네일을 삭제하여 저장 공간을 확보하거나 오래된 데이터로 인한 문제를 해결합니다.
        button_label: 파일 캐시 지우기
        confirmation: 로컬에 캐시된 파일 내용과 이미지 썸네일이 삭제됩니다. 저장하지 않은 초안과 설정은 유지되며, 삭제된 데이터는 필요할 때 다시 다운로드하거나 생성합니다. 완료되면 CMS가 다시 로드됩니다.
      # Erase All Data button
      all_data:
        description: 캐시된 파일, 저장하지 않은 초안, 설정 등 CMS가 이 브라우저에 보관하는 모든 데이터를 삭제합니다. 저장소에 이미 저장된 내용은 영향을 받지 않습니다.
        button_label: 모든 데이터 삭제
        confirmation: 캐시된 파일 내용, 이미지 썸네일, 저장하지 않은 초안, 설정, 로그인 상태 등 이 브라우저에 저장된 모든 데이터가 삭제됩니다. 저장소는 영향을 받지 않지만, 저장하지 않은 변경 사항은 사라지며 다시 로그인해야 합니다. 완료되면 CMS가 다시 로드됩니다.

  # Developer panel
  developer:
    title: 개발자
    developer_mode:
      title: 개발자 모드
      description: 자세한 콘솔 로그와 네이티브 컨텍스트 메뉴 등 개발자용 기능을 활성화합니다.
      switch_label: 개발자 모드 활성화
    local_git:
      title: Git 커밋
      description: 원격 저장소로 작업할 때처럼 변경 사항을 저장할 때마다 로컬 저장소의 현재 브랜치에 커밋합니다. 이후 평소 사용하는 Git 도구로 커밋을 검토하고 푸시할 수 있습니다.
      switch_label: 변경 사항을 Git에 커밋
      checking: 저장소를 확인하는 중…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: 변경 사항은 {$name}({$email})(으)로 {$branch} 브랜치에 커밋됩니다.
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: 지금은 변경 사항을 커밋할 수 없습니다. {$reason}
    deploy_hook:
      title: 배포 훅
      description: 변경 사항 게시를 선택하여 배포를 수동으로 실행할 때 호출할 웹훅 URL을 입력하십시오. GitHub Actions 또는 GitLab CI/CD를 사용하시는 경우 비워 두셔도 됩니다.
      # Hook URL input
      url:
        field_label: 훅 URL
        saved: 훅 URL이 저장되었습니다.
        removed: 훅 URL이 제거되었습니다.
      # Authorization header input
      auth:
        field_label: 'Authorization 헤더(예: Bearer <token>)(선택 사항)'
        saved: Authorization 헤더가 저장되었습니다.
        removed: Authorization 헤더가 제거되었습니다.

# ==============================================================================
# Keyboard Shortcuts
# ==============================================================================
# Action descriptions for the keyboard shortcuts dialog.

