local_git_skip_reasons:
  unsupported_repository: 저장소가 CMS에서 지원하지 않는 Git 기능을 사용하고 있습니다. 예를 들어 연결된 워크트리, SHA-256 객체 이름, reftable 형식, 희소 인덱스, 또는 feature.manyFiles 옵션과 git add -N이 사용하는 버전 3이나 4의 인덱스 등이 있습니다.
  missing_identity: 저장소의 Git 설정에 이름과 이메일 주소가 지정되어 있지 않으며, CMS가 전역 설정을 읽을 수 없습니다. git config --local user.name "Your Name" 및 git config --local user.email "you@example.com" 명령으로 저장소에 설정하십시오.
  locked: 다른 Git 프로세스가 저장소를 사용하고 있습니다. 실행 중인 프로세스가 없다면 .git/index.lock 파일을 삭제하십시오.
  # The operation in progress, with how to finish or cancel it
  operation_in_progress:
    merge: 병합이 진행 중입니다. git commit으로 완료하거나 git merge --abort로 취소하십시오.
    rebase: 리베이스가 진행 중입니다. git rebase --continue로 완료하거나 git rebase --abort로 취소하십시오. 이미 다른 작업으로 넘어갔다면 git rebase --quit로 파일을 변경하지 않고 리베이스를 중단할 수 있습니다.
    cherry_pick: 체리픽이 진행 중입니다. git cherry-pick --continue로 완료하거나 git cherry-pick --abort로 취소하십시오.
    revert: 되돌리기가 진행 중입니다. git revert --continue로 완료하거나 git revert --abort로 취소하십시오.
    am: git am으로 패치를 적용하는 중입니다. git am --continue로 완료하거나 git am --abort로 취소하십시오.
    conflict: 일부 파일에 충돌이 있습니다. 먼저 충돌을 해결하고 결과를 스테이징하십시오.
