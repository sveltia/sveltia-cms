  .input {$count :integer}
  .match $count
    0   {{ “{$terms}” 검색 결과를 표시하고 있습니다. 엔트리를 찾지 못했습니다. }}
    *   {{ “{$terms}” 검색 결과를 표시하고 있습니다. 엔트리 {$count}개를 찾았습니다. }}
