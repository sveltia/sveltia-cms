asset_editor: 媒體檔案編輯器

# Buttons to move between the listed assets in the asset editor
previous_asset: 上一個媒體檔案
next_asset: 下一個媒體檔案

# Preview unavailable message
preview_unavailable: 預覽無法使用。

# Copy menu items: public URLs, file paths, file data
# {$count} is the number of selected assets
public_urls: |
  .input {$count :integer}
  .match $count
    * {{ 公開 URL }}
# {$count} is the number of selected assets
file_paths: |
  .input {$count :integer}
  .match $count
    * {{ 檔案路徑 }}
# Identifier of a file on a cloud storage service, e.g. an object key or a UUID
# {$count} is the number of selected assets
file_ids: |
  .input {$count :integer}
  .match $count
    * {{ 檔案 ID }}
file_data: 檔案資料

# ==============================================================================
# Asset Info Panel
# ==============================================================================
# Section headings and labels in the asset information panel.

# Panel title and empty state shown in the asset sidebar
asset_info: 媒體檔案資訊
select_asset_show_info: 選擇媒體檔案即顯示資訊。

kind: 類型
size: 大小
dimensions: 尺寸
duration: 長度
# Short heading for a list of entries using the selected asset
used_in: 使用於
created_date: 建立日期
location: 位置

# Map aria-label showing GPS coordinates
# {$latitude} and {$longitude} are the formatted coordinate values displayed on the map
map_lat_lng: 顯示緯度 {$latitude}、經度 {$longitude} 的地圖

# ==============================================================================
# List and Object Field Controls
# ==============================================================================
# Controls for List and Object field types.

# List item actions
remove_this_item: 移除這一項
move_up: 上移
move_down: 下移
# Menu of a list item or file with the extra reorder actions, shown in a list of 3 or more items
reorder_options: 排序選項
move_to_top: 移到最上方
move_to_bottom: 移到最下方
# Opens a dialog asking for the position to move a list item to
move_to: 移到……
# Dialog asking for the new position of an item. {$count} is the number of items in the list
move_to_description: 請輸入 1 到 {$count} 之間的位置。
move_to_position: 位置
# aria-label for the drag handle that reorders a list item. The item can be dragged with a pointer,
# or moved with the arrow keys while the handle has focus
reorder_item: 調整項目順序
# aria-label for the text input holding one item of a simple List field, which has no subfield to
# take a label from
list_item_value: 項目值
# aria-label for each item of a List field, giving its position in the list
# {$position} is the 1-based position of the item, {$count} is the number of items
list_item_position: 第 {$position} 項，共 {$count} 項
# Message shown in place of a removed List field item or Object field, next to a Restore button
# that puts it back
item_removed: 已移除項目。

# Add item button label, also used by the Relation field to create a new entry in the referenced
# collection, with the collection’s singular label
# Example: “Add Image”, “Add Author”
# {$name} is the label of the item type that can be added
add_x: 新增 {$name}

# List item context menu
# aria-label for the button opening the menu, and for the menu itself
list_item_options: 清單項目選項
add_item_above: 在上方新增項目
add_item_below: 在下方新增項目
paste_item_above: 在上方貼上項目
paste_item_below: 在下方貼上項目
paste_item_to_replace: 貼上並替換

# List item clipboard
# Button in the list toolbar to paste a copied item, from any list in any entry, at the end of the
# list, or at the start with the `add_to_top` option
paste_item: 貼上項目
list_item_copied: 項目已複製。
# ⋮ stands for the icon of the item menu button; keep it, along with the button’s aria-label
no_list_item_to_paste: 沒有可貼上的已複製項目。若要複製項目，請開啟項目的 ⋮（清單項目選項）選單，然後選擇「複製」。
list_item_not_compatible: 複製的項目不適用於此清單。
# {$count} is the number of the values left out, as the list doesn’t have the fields
list_item_pasted_without_values: |
  .input {$count :integer}
  .match $count
    *   {{ 項目已貼上。此清單不接受的 {$count} 個值已被略過。 }}
# {$count} is the number of the files the pasted item references that couldn’t be found
list_item_pasted_without_files: |
  .input {$count :integer}
  .match $count
    *   {{ 項目已貼上，但找不到它使用的 {$count} 個檔案。請檢查項目中的檔案欄位。 }}

# Variable-type list selector
select_list_type: 選擇清單類型

# Variable-type mismatch
unknown_variable_type: 此項目的類型不明，無法顯示。詳細資訊請查看瀏覽器主控台。

# ==============================================================================
# Field Widgets
# ==============================================================================
# Strings for specific field widget types.

# Color field: opacity slider
opacity: 不透明度

# Select field: empty option placeholder
unselected_option: (無)

# Relation field: creating or editing a referenced entry without leaving the editor
relation_field:
  # Note shown in the dialog. {$name} is the singular label of the referenced collection
  save_together_hint: 新的{$name}將與您正在編輯的項目一起儲存。
  # Error shown when the entry couldn’t be prepared. {$name} is the singular label of the collection
  add_failed: 無法新增{$name}。詳細資訊請查看瀏覽器主控台。
  # Title of the dialog to edit an entry selected in the field. {$name} is the singular label of the
  # referenced collection
  edit_entry_title: 編輯{$name}
  # Note shown in the dialog. {$name} is the singular label of the referenced collection
  edit_together_hint: 您對{$name}所做的變更將與您正在編輯的項目一起儲存。
  # Error shown when the changes couldn’t be prepared. {$name} is the singular label of the collection
  edit_failed: 無法套用對{$name}所做的變更。詳細資訊請查看瀏覽器主控台。
  # Error shown when the changes would move the entry to another file path, e.g. through a path
  # template using a field. {$name} is the singular label of the collection
  move_unsupported: 這些變更會將{$name}移到其他位置，這只能透過單獨編輯它來完成。
  # Error shown when saving, if someone else has changed an entry edited from the field since. {$name}
  # is the summary of that entry
  edit_conflict: 在您編輯「{$name}」之後，它已被他人變更。請從欄位中重新開啟它，對照最新版本檢查您的變更。
  # Error shown when saving, if someone else has deleted an entry edited from the field since.
  # {$name} is the summary of that entry
  edit_deleted: 在您編輯「{$name}」之後，它已被他人刪除。請將它從欄位中移除，才能儲存項目。
  # Accessible label of the menu listing the selected entries that can be edited
  select_entry_to_edit: 選擇要編輯的項目
  # Warning shown in the editor of an entry that has been edited from a Relation field of another
  # entry, while the changes wait in that entry’s pull request. {$name} is the summary of that
  # entry
  edited_with_entry: 此項目的變更正等待與「{$name}」一起發布。如果現在儲存，兩組變更會在該項目發布時合併；若兩者有重疊，可能會失敗。
  # Warning shown in the dialog when an entry edited from the field has been changed by someone else
  # since. {$name} is the singular label of the collection
  changed_since_edit: 在您編輯此{$name}之後，它已被他人變更。您的變更會顯示在最新版本之上。請在更新前檢查。

# Select Assets dialog
assets_dialog:
  # Dialog titles for different selection modes
  title:
    file: 選擇檔案
    image: 選擇圖片
    folder: 選擇資料夾

  # Search input labels
  search_for_file: 搜尋檔案
  search_for_image: 搜尋圖片

  # Locations panel aria-label
  locations: 位置

  # Folder selection mode for a File field with the `select_folder` option. {$path} is the public
  # path of the folder to be selected, and {$count} is the number of folders selected
  selected_folder: 已選取的資料夾：{$path}
  selected_folders: |
    .input {$count :integer}
    .match $count
      *   {{ 已選取 {$count} 個資料夾 }}
  no_subfolders: 此資料夾沒有子資料夾。
  # Shown for a cloud storage service whose `prefix` option depends on fields of the entry
  prefix_unresolved: 請填寫此位置所依據的欄位，才能瀏覽和上傳其中的檔案。

  # Asset folder options
  folder:
    field: 欄位媒體
    entry: 項目媒體
    file: 檔案媒體
    collection: 集合媒體
    global: 全域媒體

  # Error messages
  error:
    invalid_key: 您的 API 金鑰無效或已過期。請檢查後再試一次。
    search_fetch_failed: 搜尋媒體檔案時發生錯誤。請稍後再試。
    image_fetch_failed: 下載所選媒體檔案時發生錯誤。請稍後再試。

  # Stock photo panels
  available_images: 可用的圖片
  available_files: 可用的檔案

  # URL entry option
  enter_url: 輸入 URL
  enter_file_url: 輸入檔案的 URL：
  enter_image_url: 輸入圖片的 URL：

  # Large file warning dialog
  large_file:
    title: 大檔案

  # Invalid file warning dialog
  invalid_file:
    title: 無效的檔案

  # Warning dialog shown when files are rejected for more than one reason
  rejected_files:
    title: 檔案無法上傳

  # Photo credit dialog (stock photos)
  photo_credit:
    title: 圖片來源
    description: 請盡可能使用以下出處標示：
    # {$field} is the label of the Markdown field the credit is added to
    insert_to_field: 插入到{$field}
    copy_as_markdown: 複製為 Markdown

  # Unsaved asset badge
  unsaved: 未儲存

# Character counter: shows character count for text fields
character_counter:
  # {$count} is the current character count; {$min} and {$max} are configured limits
  min_max: |
    .input {$count :integer}
    .match $count
      0   {{ 尚未輸入字元。最少：{$min}。最多：{$max}。 }}
      *   {{ 輸入 {$count} 個字元。最少：{$min}。最多：{$max}。 }}
  # {$count} is the current character count and {$min} is the minimum allowed count
  min: |
    .input {$count :integer}
    .match $count
      0   {{ 尚未輸入字元。最少：{$min}。 }}
      *   {{ 輸入 {$count} 個字元。最少：{$min}。 }}
  # {$count} is the current character count and {$max} is the maximum allowed count
  max: |
    .input {$count :integer}
    .match $count
      0   {{ 尚未輸入字元。最多：{$max}。 }}
      *   {{ 輸入 {$count} 個字元。最多：{$max}。 }}

# YouTube video player iframe title
youtube_video_player: YouTube 影片播放器

# Date/time field: quick action buttons
today: 今天
now: 現在

# Rich-text editor: component field labels
editor_components:
  image: 圖片
  src: 來源
  alt: 替代文字
  title: 標題
  link: 連結
  caption: 說明文字

# Key-Value field: column headers and validation
key_value:
  key: 鍵
  value: 值
  action: 操作
  empty_key: 鍵為必填。
  duplicate_key: 鍵必須唯一。

# Map field: location search and geolocation
find_place: 搜尋地點
use_your_location: 使用您的位置

# Geolocation error dialog
geolocation_error_title: 地理位置錯誤
geolocation_error_body: 取得您的位置時發生錯誤。
geolocation_unsupported: 此瀏覽器不支援地理位置 API。

# Boolean field: display labels
