      switch_label: 啟用開發者模式
    local_git:
      title: Git 提交
      description: 每次儲存變更時，將其提交到本機儲存庫的目前分支，就像使用遠端儲存庫時 CMS 所做的一樣。之後您可以使用慣用的 Git 工具檢查並推送這些提交。
      switch_label: 將變更提交到 Git
      checking: 正在檢查儲存庫……
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: 變更將以 {$name}（{$email}）的身分提交到 {$branch} 分支。
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: 目前無法提交變更。{$reason}
    deploy_hook:
      title: 部署 Hook
      description: 手動部署時（選擇「發布變更」）會呼叫此 Webhook URL。使用 GitHub Actions 或 GitLab CI/CD 時可留空。
      # Hook URL input
      url:
        field_label: Hook URL
        saved: Hook URL 已儲存。
        removed: Hook URL 已移除。
      # Authorization header input
      auth:
        field_label: Authorization 標頭（例如 Bearer <token>）（選填）
        saved: Authorization 標頭已儲存。
        removed: Authorization 標頭已移除。

