      # Erase All Data button
      all_data:
        description: 刪除 CMS 在此瀏覽器中儲存的所有內容，包括快取檔案、未儲存的草稿和設定。已儲存到儲存庫的內容不受影響。
        button_label: 清除所有資料
        confirmation: 此瀏覽器中儲存的所有資料將被刪除，包括快取的檔案內容、圖片縮圖、未儲存的草稿、設定和登入狀態。您的儲存庫不受影響，但任何未儲存的變更都將遺失，並且您需要重新登入。完成後 CMS 將重新載入。

  # Developer panel
  developer:
    title: 開發者
    developer_mode:
