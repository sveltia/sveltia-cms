    open_authoring_no_workflow: '`open_authoring` 選項需要搭配 `editorial_workflow` 發布模式。詳見<a>說明文件</a>。'
    # Don’t localize `auth_methods`
    no_auth_methods: '`auth_methods` 選項必須至少包含一種方法。'
    missing_media_folder: 未定義媒體資料夾。
