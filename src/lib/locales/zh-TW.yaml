    duplicate_view_filter_name: 檢視篩選器名稱必須是唯一的，但 `{$name}` 被使用了多次。
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: 集合 {$count} 必須將 `name` 選項定義為非空字串。
