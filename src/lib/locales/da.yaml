  # Follows `deleted`
  recreate_warning: Hvis du gemmer nu, bliver dokumentet oprettet igen.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Da dokumentet er gemt i samme fil som andre dokumenter, kan det ikke gemmes oven i ændringen. Annuller redigeringen, åbn derefter dokumentet igen fra listen, og foretag dine redigeringer.
  # OK button label
  save_anyway: Gem alligevel
