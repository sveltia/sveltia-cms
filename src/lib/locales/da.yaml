  .input {$quota :integer}
  .match $quota
    one {{ Du kan ikke tilføje nye dokumenter til denne samling da den har nået sin grænse på {$quota} dokument. }}
    *   {{ Du kan ikke tilføje nye dokumenter til denne samling da den har nået sin grænse på {$quota} dokumenter. }}
