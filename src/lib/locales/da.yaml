  edit_conflict: ”{$name}” er blevet ændret af en anden siden du redigerede det. Åbn det igen fra feltet for at gennemgå dine ændringer i forhold til den nyeste version.
  # Error shown when saving, if someone else has deleted an entry edited from the field since.
  # {$name} is the summary of that entry
  edit_deleted: ”{$name}” er blevet slettet af en anden siden du redigerede det. Fjern det fra feltet for at gemme dokumentet.
  # Accessible label of the menu listing the selected entries that can be edited
  select_entry_to_edit: Vælg et dokument der skal redigeres
  # Warning shown in the editor of an entry that has been edited from a Relation field of another
  # entry, while the changes wait in that entry’s pull request. {$name} is the summary of that
  # entry
  edited_with_entry: Ændringer i dette dokument venter på at blive udgivet sammen med ”{$name}”. Hvis du gemmer det nu, bliver de to sæt ændringer kombineret når det dokument udgives, hvilket kan mislykkes hvis de overlapper.
  # Warning shown in the dialog when an entry edited from the field has been changed by someone else
  # since. {$name} is the singular label of the collection
  changed_since_edit: '{$name} er blevet ændret af en anden siden du redigerede dokumentet. Dine ændringer vises oven på den nyeste version. Gennemgå dem før du opdaterer.'

# Select Assets dialog
