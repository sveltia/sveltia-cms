    invalid_collection_folder_locale: Stien `{$folder}` i `folder` er ugyldig. Pladsholderen `locale` må kun bruges én gang som et helt mappenavn, fx `content/\{\{locale\}\}/posts`.
    # Don’t localize `i18n`, `locale` and `file`
    collection_file_i18n_required: Samlingsfilen skal have indstillingen `i18n` defineret hvis pladsholderen `locale` bruges i stien i `file`.
    # Don’t localize `i18n`, `i18n: true` and `i18n: duplicate`
    collection_i18n_no_fields: 'Samlingen har indstillingen `i18n`, men ingen af dens felter har indstillingen `i18n`, så intet felt kan oversættes. Tilføj `i18n: true` eller `i18n: duplicate` til de felter der skal oversættes.'
    # Don’t localize `i18n` and `i18n: true`
    collection_i18n_no_files: 'Samlingen har indstillingen `i18n`, men ingen af dens filer har indstillingen `i18n`, så ingen fil kan oversættes. Tilføj `i18n: true` til de filer der skal oversættes.'
    # Don’t localize `i18n`, `i18n: true` and `i18n: duplicate`
    collection_file_i18n_no_fields: 'Samlingsfilen har indstillingen `i18n`, men ingen af dens felter har indstillingen `i18n`, så intet felt kan oversættes. Tilføj `i18n: true` eller `i18n: duplicate` til de felter der skal oversættes.'
    # {$count} is the 1-based field index in the current fields array; Don’t localize `name`
    missing_field_name: Felt {$count} skal have indstillingen `name` defineret som en ikke-tom streng.
    # {$name} is the invalid or duplicate field name
    invalid_field_name: Feltnavnet `{$name}` er ugyldigt. Det må ikke indeholde specialtegn. Hvis du vil indlejre felter, skal du <a>bruge objektfelter i stedet for punktnotation</a>.
    duplicate_field_name: Feltnavne skal være unikke, men `{$name}` bruges mere end én gang.
    # {$count} is the 1-based variable type index in the current types array
    missing_variable_type: Variabeltype {$count} skal have indstillingen `name` defineret som en ikke-tom streng.
    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: Variabeltypenavnet `{$name}` er ugyldigt. Det må ikke indeholde specialtegn.
    duplicate_variable_type: Navne på variabeltyper skal være unikke, men `{$name}` bruges mere end én gang.
    date_field_type: 'Den forældede felttype Date understøttes ikke i Sveltia CMS. Brug felttypen DateTime med indstillingen `type: date` i stedet.'
    # curly brackets in the placeholder are escaped with backslashes for MessageFormat 2
    hidden_field_locale_without_i18n: Indstillingen `default` i et Hidden-felt bruger pladsholderen `\{\{locale\}\}`, men i18n er ikke slået til for samlingen, så indholdet har intet sprog at udfylde den med.
    # {$timeZone} is the invalid IANA timezone identifier from the configuration
    invalid_timezone: 'Ugyldig tidszone: {$timeZone}. Den skal være et gyldigt IANA-tidszone-id som `America/New_York` eller `Asia/Tokyo`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: Den forældede indstilling `{$prop}` understøttes ikke i Sveltia CMS. Brug indstillingen `{$newProp}` i stedet.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: Indstillingen `allow_multiple` understøttes ikke i Sveltia CMS. Brug indstillingen `multiple` i stedet; den er som standard `false`.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: Listefeltet kan ikke have indstillingerne `field`, `fields` og `types` på samme tid.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: Listefeltets variabeltype er ugyldig. Indstillingen `widget` er sat til `{$widget}`, men den skal være `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: Objektfeltet kan ikke have indstillingerne `fields` og `types` på samme tid.
    # {$min} and {$max} are option names such as `min` and `max` or `minlength` and `maxlength`
    invalid_range_options: Indstillingen `{$min}` må ikke være større end indstillingen `{$max}`.
    # {$step} is the configured value; Don’t localize `step`
    invalid_step: Indstillingen `step` er sat til `{$step}`, men den skal være større end nul eller `-1` for at slå trin fra.
    # Don’t localize `options`
    select_field_no_options: Select-feltet skal have mindst ét element i indstillingen `options`.
    # {$value} is the option value from the configuration; Don’t localize `options`
    select_field_duplicate_option: Select-feltets `options` skal være unikke, men `{$value}` bruges mere end én gang.
    # {$value} is the default value from the configuration; Don’t localize `default` and `options`
    select_field_invalid_default: Select-feltets indstilling `default` er sat til `{$value}`, men det er ikke en af værdierne i `options`.
    # Don’t localize `fields` and `types`
    list_field_no_subfields: Listefeltets indstilling `fields` eller `types` skal have mindst ét element. Udelad indstillingen for en liste med simple værdier.
    # Don’t localize `default`, `fields` and `types`
    list_field_invalid_default_object: Listefeltets indstilling `default` indeholder et objekt, men hvert element skal være en simpel værdi, fordi feltet ikke har `fields` eller `types`.
    # {$value} is the default item from the configuration; Don’t localize `default`, `fields` and `types`
    list_field_invalid_default_item: Listefeltets indstilling `default` indeholder `{$value}`, men hvert element skal være et objekt, fordi feltet har `fields` eller `types`.
    # {$key} is a property name of the default item from the configuration; Don’t localize `default`
    list_field_invalid_default_key: Listefeltets indstilling `default` indeholder et element med egenskaben `{$key}`, men intet underfelt har det navn.
    # {$typeKey} is the configured type key, `type` by default; Don’t localize `default` and `types`
    list_field_default_missing_type: Listefeltets indstilling `default` indeholder et element uden egenskaben `{$typeKey}`, som angiver en af typerne i `types`.
    # {$typeKey} is the configured type key, `type` by default, and {$value} is its value in the default item; Don’t localize `default` and `types`
    list_field_invalid_default_type: Listefeltets indstilling `default` indeholder et element hvis egenskab `{$typeKey}` er `{$value}`, men det er ikke en af typerne i `types`.
    # Don’t localize `map_key_field`, `fields` and `types`
    list_field_map_key_no_subfields: Listefeltets indstilling `map_key_field` kræver indstillingen `fields` eller `types`, da hver nøgle hentes fra et underfelt.
    # {$name} is the subfield name; Don’t localize `map_key_field`
    list_field_map_key_not_found: Listefeltets indstilling `map_key_field` henviser til `{$name}`, men intet underfelt har det navn.
    # {$name} is the subfield name, and {$type} is the variable type name; Don’t localize `map_key_field`
    list_field_map_key_missing_in_type: Listefeltets indstilling `map_key_field` henviser til `{$name}`, men typen `{$type}` har intet underfelt med det navn.
    # {$name} is the subfield name, and {$widget} is its field type; Don’t localize `map_key_field`
    list_field_map_key_invalid_type: Listefeltets indstilling `map_key_field` henviser til `{$name}`, men det skal være et String-, Relation- eller Select-felt, ikke et `{$widget}`-felt.
    # {$name} is the subfield name; Don’t localize `map_key_field` and `multiple`
    list_field_map_key_multiple: Listefeltets indstilling `map_key_field` henviser til `{$name}`, men underfeltet kan ikke have flere værdier, da hvert element skal have én nøgle. Fjern dets indstilling `multiple`.
    # {$name} is the subfield name; Don’t localize `map_key_field`
    list_field_map_key_option_not_string: Listefeltets indstilling `map_key_field` henviser til `{$name}`, men underfeltets muligheder skal have strengværdier, da hver nøgle gemmes som en streng.
    # {$name} is the subfield name; Don’t localize `map_key_field` and `required`
    list_field_map_key_not_required: Listefeltets indstilling `map_key_field` henviser til `{$name}`, men underfeltet kan ikke være valgfrit, da hvert element skal have en nøgle. Fjern dets indstilling `required`.
    # {$name} is the subfield name; Don’t localize `map_key_field`, `i18n: false` and `i18n: duplicate`
    list_field_map_key_not_localized: 'Listefeltets indstilling `map_key_field` henviser til `{$name}`, men underfeltet kan ikke have `i18n: false`, da elementerne skal have en nøgle på alle sprog. Brug `i18n: duplicate`, eller fjern indstillingen.'
    # Don’t localize `i18n`, `duplicate_if_empty`, `multiple` and `true`
    duplicate_if_empty_multiple: 'Indstillingen `i18n: duplicate_if_empty` understøttes ikke for et felt med indstillingen `multiple`, så feltet fungerer som et felt med `i18n: true`.'
    # Don’t localize `default` and `multiple`
    invalid_default_multiple: Indstillingen `default` skal være et array, fordi indstillingen `multiple` er `true`.
    invalid_default_single: Indstillingen `default` skal være en enkelt værdi og ikke et array, fordi indstillingen `multiple` ikke er `true`.
    # {$key} is a property name of the default object from the configuration; Don’t localize `default`
    object_field_invalid_default_key: Objektfeltets indstilling `default` har egenskaben `{$key}`, men intet underfelt har det navn.
    # {$typeKey} is the configured type key, `type` by default; Don’t localize `default` and `types`
    object_field_default_missing_type: Objektfeltets indstilling `default` har ikke egenskaben `{$typeKey}`, som angiver en af typerne i `types`.
    # {$typeKey} is the configured type key, `type` by default, and {$value} is its value in the default object; Don’t localize `default` and `types`
    object_field_invalid_default_type: Egenskaben `{$typeKey}` i objektfeltets indstilling `default` er `{$value}`, men det er ikke en af typerne i `types`.
    # Don’t localize `default` and `output_code_only`
    code_field_invalid_default_object: Code-feltets indstilling `default` skal være en streng, fordi indstillingen `output_code_only` er `true`.
    # {$key} is a property name of the default object, {$code} and {$lang} are the configured property names; Don’t localize `default` and `keys`
    code_field_invalid_default_key: Code-feltets indstilling `default` har egenskaben `{$key}`, men indstillingen `keys` tillader kun `{$code}` og `{$lang}`.
    # {$valueType} is the configured value type; Don’t localize `value` and `value_type`
    compute_field_invalid_expression: Compute-feltets indstilling `value` skal være et gyldigt aritmetisk udtryk, fx `\{\{fields.price\}\} * \{\{fields.quantity\}\}`, fordi indstillingen `value_type` er `{$valueType}`.
    # {$valueType} is the configured value type; Don’t localize `value` and `value_type`
    compute_field_uuid_in_expression: Compute-feltets indstilling `value` kan ikke bruge et UUID-tag som `\{\{uuid\}\}`, fordi indstillingen `value_type` er `{$valueType}`, hvilket gør den til et aritmetisk udtryk.
    # {$value} is the default value and {$valueType} is the configured value type; Don’t localize `default` and `value_type`
    number_field_default_not_integer: Number-feltets indstilling `default` er sat til `{$value}`, men den skal være et heltal, fordi indstillingen `value_type` er `{$valueType}`.
    number_field_default_not_number: Number-feltets indstilling `default` er sat til `{$value}`, men den skal være et tal, fordi indstillingen `value_type` er `{$valueType}`.
    # Don’t localize `fields` and `types`
    object_field_no_subfields: Objektfeltets indstilling `fields` eller `types` skal have mindst ét element.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: Feltet henviser til en ugyldig eller udefineret samling `{$collection}`.
    relation_field_invalid_collection_file: Feltet henviser til en ugyldig eller udefineret fil `{$file}`.
    # Don’t localize `file`
    relation_field_missing_file_name: Indstillingen `file` skal være defineret for en relation til en filsamling.
    relation_field_invalid_value_field: Feltet henviser til et ugyldigt eller udefineret værdifelt `{$field}`.
    # {$collection} is the referenced collection name; Don’t localize `file`, `value_field` and `slug`.
    # The curly brackets are escaped with backslashes for MessageFormat 2
    relation_field_array_file_slug: Relationen til samlingen `{$collection}` kan ikke gemme værdien `\{\{slug\}\}`, da et dokuments slug i en samling med indstillingen `file` er dets position, som ændres når dokumenterne flyttes eller slettes. Sæt i stedet indstillingen `value_field` til et felt med en unik værdi.
    # {$collection} is the referenced collection name; Don’t localize `file`
    relation_field_array_file_workflow: En samling med indstillingen `file` kan ikke have en relation til samlingen `{$collection}`, som bruger redaktionel arbejdsgang eller forhåndsvisningsarbejdsgang, da henvisningerne til et dokument der omdøbes eller slettes dér, ikke kan opdateres i filen.
    relation_field_invalid_display_field: Feltet henviser til et ugyldigt eller udefineret visningsfelt `{$field}`.
    relation_field_invalid_search_field: Feltet henviser til et ugyldigt eller udefineret søgefelt `{$field}`.
    relation_field_invalid_filter_field: Feltet henviser til et ugyldigt eller udefineret filterfelt `{$field}`.
    relation_field_invalid_sort_field: Feltet henviser til et ugyldigt eller udefineret sorteringsfelt `{$field}`.
    # Don’t localize `sort_by` and `file`
    relation_field_sort_by_file_ignored: Indstillingen `sort_by` gælder ikke for en relation til en fil, hvis muligheder følger listeelementernes rækkefølge. Den bliver ignoreret.
    unexpected: Uventet fejl

    # Schema validation errors, reported when the configuration doesn’t match the published JSON
    # schema. In all of these, {$option} is a configuration option path such as `backend.name` or
    # `view_filters[0].pattern`, relative to the collection, file or field named before it.
    # {$type} is a value type name from `schema_value_type` below
    schema_invalid_type: Indstillingen `{$option}` skal være {$type}.
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'Indstillingen `{$option}` skal være en af disse værdier: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: Indstillingen `{$option}` skal være `{$value}`.
    schema_invalid_empty_value: Indstillingen `{$option}` skal være en tom streng.
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: Indstillingen `{$option}` skal være et array med {$count} elementer.
    schema_invalid_value: Indstillingen `{$option}` har en ugyldig værdi.
    schema_missing_option: Indstillingen `{$option}` er påkrævet.
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'En af disse indstillinger er påkrævet: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: en streng
      number: et tal
      integer: et heltal
      boolean: en boolesk værdi
      array: et array
      object: et objekt
      'null': tom

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: OAuth-applikationens id er ikke defineret. Brugere skal angive et adgangstoken for at logge ind.
    # Don’t localize `prefix`
    site_library_prefix_template: Indstillingen `prefix` i et mediebibliotek indeholder skabelontags, som kun understøttes på feltniveau, da der ikke er noget dokument at udfylde dem med på øverste niveau.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: Indstillingen `{$prop}` understøttes ikke i Sveltia CMS. Den bliver ignoreret.
    # Don’t localize `stages`, `publish_mode`, `editorial_workflow` and {$type}, which is `preview` or `simple`
    publish_mode_stages_ignored: Indstillingen `stages` i `publish_mode` gælder kun for udgivelsestilstanden `editorial_workflow`, så den ignoreres med `{$type}`.
    # Don’t localize `pattern`, `m` and `s`
    inline_component_multiline_pattern: Denne inline-komponents `pattern` har flaget `m` eller `s` eller matcher linjeskift, men en inline-komponent matches kun inden for et afsnit.
    # {$name} is a button or component name and {$option} is `buttons` or `editor_components`; Don’t localize them and `multiline: false`
    single_line_block_item: 'Elementet `{$name}` i indstillingen `{$option}` bliver ignoreret, da et felt med `multiline: false` kun kan indeholde inline-indhold.'
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Både `picker_utc` og de nyere tidszoneindstillinger (`input_timezone` eller `output_utc`) er sat. De nye indstillinger har forrang. Overvej at fjerne `picker_utc` fra din konfiguration.
    # Don’t localize `localize_format` and `format`
    localize_format_without_format: Indstillingen `localize_format` har ingen effekt, fordi feltet ikke har indstillingen `format`, og dets værdi gemmes i ISO 8601-formatet.
    # {$name} is a template tag like `fields.lines.*.price`; Don’t localize `value`, `*` and `sum()`
    compute_field_wildcard_without_item: Compute-feltets indstilling `value` henviser til `{$name}`, men feltet er ikke i et element i den liste som `*` står for, så det giver ingen værdi. Kun en aggregeringsfunktion som `sum()` kan bruge alle elementer i en liste.
    # {$name} is a template tag like `fields.lines.*.amount`; Don’t localize `value`
    compute_field_self_reference: Compute-feltets indstilling `value` henviser til selve feltet som `{$name}`, så dets værdi ændres hver gang den beregnes, og falder aldrig til ro.
    # {$name} is a template tag like `fields.total`; Don’t localize `value`
    compute_field_reference_cycle: Compute-feltets indstilling `value` henviser til `{$name}`, et andet Compute-felt der henviser tilbage til dette felt, direkte eller via andre felter, så deres værdier falder aldrig til ro.
    # Don’t localize `localize_format`, `true` and `de`
    localize_format_without_i18n: Indstillingen `localize_format` er `true`, men i18n er ikke slået til for samlingen, så værdien skrives på engelsk. Sæt i stedet indstillingen til en sprogkode som `de`.
    # {$locale} is the locale code from the configuration; Don’t localize `localize_format`
    localize_format_unsupported_locale: Indstillingen `localize_format` er sat til `{$locale}`, som ikke er et understøttet sprog, så værdien skrives på engelsk.
    # Don’t localize `preview_path`
    preview_path_no_date_field: Indstillingen `preview_path` bruger dato- og tidstags, men samlingen har ikke noget DateTime-felt at læse dem fra, så linket til forhåndsvisningen bliver ikke vist.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: Indstillingen `preview_path_date_field` henviser til et felt med navnet `{$name}`, men der er ikke defineret noget DateTime-felt med det navn, så linket til forhåndsvisningen bliver ikke vist.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: Indstillingen `preview_path` henviser til `{$name}`, men der er ikke defineret noget felt med det navn i samlingen, så linket til forhåndsvisningen bliver ikke vist.
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: Samlingen har intet `{$name}`-felt at navngive nye dokumenter med, så hvert nyt dokument får et tilfældigt slug. Tilføj et `{$name}`-felt, eller angiv indstillingen `identifier_field` eller `slug`.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: Indstillingen `i18n` i `slug` har ingen effekt, fordi samlingen ikke bruger i18n-strukturen `multiple_files`, `multiple_folders` eller `multiple_root_folders`, hvor hvert sprog har sin egen fil.
    # Don’t localize `slug`, `template` and `auto_increment`
    slug_template_ignored: Indstillingen `template` i `slug` bliver ignoreret, fordi indstillingen `auto_increment` nummererer sluggene i stedet.
    # {$file} is the file path; Don’t localize `file`, `locale`, `i18n`, `false`,
    # `omit_default_locale_from_file_path` and the example paths. The curly brackets in the examples
    # are escaped with backslashes for MessageFormat 2
    locale_not_omitted_from_file_path: Pladsholderen `locale` kan ikke fjernes fra stien `{$file}` i `file`, så standardsproget bevares i den trods i18n-indstillingen `omit_default_locale_from_file_path`. For at udelade sproget skal du bruge pladsholderen som et helt mappenavn, fx `\{\{locale\}\}/about.md`, eller mellem filnavnet og filendelsen, fx `about.\{\{locale\}\}.md`. For at bevare det skal du sætte indstillingen til `false` i filens indstilling `i18n`.
    # Don’t localize `i18n`
    i18n_not_configured: Indstillingen `i18n` er slået til, men i18n er ikke konfigureret på øverste niveau i konfigurationen eller i samlingen, så indstillingen har ingen effekt.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: Indstillingen `public_folder` er en tom streng, så stien i `media_folder` bruges i stedet til de mediestier der gemmes i dokumenter. Fjern indstillingen, eller sæt den til den sti du vil bruge, fx `/images`.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: Indstillingen `{$option}` er ikke defineret i konfigurationsskemaet for Sveltia CMS. Den bliver ignoreret. Tjek for slåfejl eller syntaksfejl.
    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: Indstillingen `default_localized` har ingen effekt, fordi i18n ikke er slået til for samlingen. Brug i stedet indstillingen `default`.
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: Indstillingen `default_localized` har en værdi for `{$locale}`, som ikke er et af samlingens sprog, så værdien bliver aldrig brugt.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Se kompatibilitetsnoterne for detaljer: {$link}'

  # Console tip shown after config load
  schema_tip: Du kan validere din konfigurationsfil mod JSON-skemaet for Sveltia CMS og få en bedre udvikleroplevelse. Se {$link} for detaljer.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Lokal
  # Browser compatibility warnings
  unsupported_browser: Lokal arbejdsgang understøttes ikke i din browser. Brug Chrome eller Edge i stedet.
  disabled: Lokal arbejdsgang er deaktiveret i din browser. <a>Sådan slår du den til</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Du ser nu tavlen for den redaktionelle arbejdsgang. Kladder: {$draft}. Til gennemsyn: {$review}. Klar: {$ready}. Afventer sletning: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Du ser nu tavlen for den redaktionelle arbejdsgang. Kladder: {$draft}. Til gennemsyn: {$review}. Afventer sletning: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'Du ser nu tavlen for den redaktionelle arbejdsgang. Kladder: {$draft}. Klar: {$ready}. Afventer sletning: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'Du ser nu siden Kladder. Kladder: {$draft}. Afventer sletning: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Kladde
  drafts: Kladder
  in_review: Til gennemsyn
  ready: Klar
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Afventer sletning
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: Udrulles

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Annuller sletning
  confirm_cancelling_deletion: Er du sikker på at du vil annullere denne sletning? Dokumentet forbliver udgivet.
  confirm_completing_deletion: Er du sikker på at du vil slette dette dokument? Det bliver fjernet med det samme.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ Dokumentet er markeret til sletning. }}
      *   {{ {$count} dokumenter er markeret til sletning. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Ændringerne er kasseret. }}
      *   {{ Ændringerne i {$count} dokumenter er kasseret. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Annullerer sletning…
  deletion_cancelled: Sletningen er annulleret.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Sletningen kunne ikke annulleres. Prøv igen.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Ikke-udgivne dokumenter
  published_entries: Udgivne dokumenter
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Status: {$status}'
  change_entry_status: Skift dokumentets status
  # Editor toolbar: progress label while the status is being changed
  changing_status: Skifter status…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Opdaterer status…
  status_updated: Status er opdateret.
  # Error notification when the status could not be changed
  status_change_failed: Status kunne ikke ændres. Prøv igen.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: Opdater
  refreshing: Opdaterer…
  refreshed: Tavlen er opdateret.
  # Error notification when the board could not be refreshed
  refresh_failed: Tavlen kunne ikke opdateres. Prøv igen.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: Dokumentet indeholder fejl. Ret dem før du ændrer status.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: Dokumentet indeholder fejl. Ret dem før du udgiver det.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Send til gennemsyn
  confirm_sending_for_review: Dine ændringer er gemt som en kladde. Vil du sende dokumentet til gennemsyn så nogen kan se på det og udgive det?
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: Markér som klar
  confirm_marking_as_ready: Dine ændringer er gemt som en kladde. Vil du markere dokumentet som klar så det kan udgives?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Udgiv dokument
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Kassér ændringer
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Er du sikker på at du vil slette dette dokument? Det bliver først fjernet når sletningen udgives. Indtil da kan du stadig finde det på listen over dokumenter, markeret som ”Afventer sletning”.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Dette dokument er endnu ikke udgivet, så hvis du sletter det, bliver det kasseret helt.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Dette dokument har ikke-udgivne ændringer. Hvis du kasserer dem, gendannes den udgivne version. Selve dokumentet bliver ikke slettet.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Det er endnu ikke udgivet, så dine ikke-udgivne ændringer bliver kasseret. En eventuel udgivet version forbliver udgivet. }}
      *   {{ De er endnu ikke udgivet, så dine ikke-udgivne ændringer bliver kasseret. Eventuelle udgivne versioner forbliver udgivet. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ Et af dem er endnu ikke udgivet, så dine ikke-udgivne ændringer bliver kasseret. En eventuel udgivet version forbliver udgivet. }}
      *   {{ {$count} af dem er endnu ikke udgivet, så dine ikke-udgivne ændringer bliver kasseret. Eventuelle udgivne versioner forbliver udgivet. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: Er du sikker på at du vil udgive dette dokument? Dine ændringer bliver offentlige når dit websted er bygget igen.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Udgiver dokument…
  entry_published: Dokumentet er udgivet.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Sletter dokument…
  discarding_changes: Kasserer ændringer…
  entry_deleted: Dokumentet er slettet.
  # Error notification when publishing fails
  publishing_entry_failed: Dokumentet kunne ikke udgives. Prøv igen.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: Dette dokument kan ikke udgives her, fordi det indeholder andre ændringer som CMS’et ikke kan vise dig. Bed en udvikler om at gennemse det.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: Dokumentet er blevet ændret siden du åbnede det. Genindlæs siden for at gennemse den nyeste version før du udgiver det.
  review_on_x: Gennemse på {$service}
  from_fork: Fra en fork
  fork_entry_editable: Dette dokument kommer fra en bidragyders pull request, der er oprettet fra ”{$fork}”. Dine ændringer gemmes i bidragyderens branch. Gennemse og merge pull requesten på Git-tjenesten.
  fork_entry_locked: Dette dokument kommer fra en bidragyders pull request, der er oprettet fra ”{$fork}”. Bidragyderen tillader ikke at de ansvarlige redigerer den, så den kan kun ses her.
  fork_not_editable: Bidragyderen tillader ikke at de ansvarlige redigerer denne pull request.
  fork_entry_gone: Bidragyderens pull request er ikke længere åben, så ændringerne kan ikke gemmes i den.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: En anden anmodning ({$number}) er allerede åben for dette dokument uden for CMS’et. Bed en udvikler om at lukke den først.
  # Workflow page: empty column message
  no_entries: Ingen dokumenter.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Træk for at ændre status
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Sletning
  # Workflow page: note on a card listing the new entries that were created from a Relation field
  # of the entry and are published along with it, e.g. “Also adds Section: Getting Started”
  companion_entries: Tilføjer også {$entries}
  # Workflow page: note on a card listing the existing entries that were edited from a Relation
  # field of the entry and are published along with it, e.g. “Also changes Author: Ada Lovelace”
  edited_companion_entries: Ændrer også {$entries}
  # Workflow page: one of the entries listed by `companion_entries` or `edited_companion_entries`,
  # named by its collection’s singular label and its title
  companion_entry: '{$collection}: {$title}'

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: Commit-besked
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: Beskriv dine ændringer. Beskeden registreres i historikken sammen med dem.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: Tilføj en note til den besked der registreres i historikken sammen med dine ændringer, fx et issuenummer. Feltet kan stå tomt.
  # Accessible name of the text box when the user writes the whole message
  message: Commit-besked
  # Accessible name of the text box when the text is added before or after the message
  addition: Note
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'Besked: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Fork repositoriet
  fork: Fork
  confirm_forking_repository: For at foreslå ændringer til ”{$repo}” skal der oprettes en fork af repositoriet på din konto. Dine ændringer gemmes i den fork, og en ansvarlig gennemser dem før de bliver offentliggjort.
  # Error shown when the user declined the dialog above
  fork_declined: Du skal have en fork af repositoriet på din konto for at kunne foreslå ændringer.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Der kunne ikke oprettes en fork af repositoriet ”{$repo}” på din konto.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: Din fork ”{$fork}” har ikke branchen ”{$branch}”. Opdater forken fra repositoriet ”{$repo}”, og log derefter ind igen.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Din adgang til repositoriet ”{$repo}” kunne ikke kontrolleres. Prøv igen om et øjeblik.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Repositoriet ”{$repo}” tillader ikke forks. Bed en ansvarlig om at slå forks til for det.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Du har en ventende invitation til repositoriet ”{$repo}”. Accepter den på GitHub, og log derefter ind igen.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Dit login giver ikke adgang til private repositorier, så repositoriet ”{$repo}” kan ikke læses. Bed en ansvarlig om at tjekke CMS’ets godkendelsesindstillinger.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Kun en ansvarlig kan udgive ændringer på dette websted. Marker i stedet dit dokument som ”Til gennemsyn”, så kigger nogen på det.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: En ansvarlig har allerede udgivet dette dokument, så der er intet tilbage at gennemse.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Denne ændring kan ikke foretages direkte. Kun redigeringer af dokumenter kan foreslås til gennemsyn.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Dine ændringer gemmes i din fork af dette repository på ”{$repo}” og gennemses før de bliver offentliggjort.
  view_fork: Vis fork

# ==============================================================================
# Settings Dialog
# ==============================================================================
# Strings for the settings/preferences dialog and its panels.

# Settings page aria-label
categories: Kategorier

# Preferences panels
prefs:
  account:
    title: Konto
  # API key management feedback messages
  changes:
    api_key_saved: API-nøglen er gemt.
    api_key_removed: API-nøglen er fjernet.
    api_key_invalid: Den angivne API-nøgle er ugyldig. Kontrollér den, og prøv igen.

  # Preferences operation errors
  error:
    permission_denied: Adgang til cookielagring er blevet nægtet. Kontrollér dine browsertilladelser, og prøv igen.

  # Appearance panel
  appearance:
    title: Udseende
    theme: Tema
    select_theme: Vælg tema

  # Theme options
  theme:
    dark: Mørk
    light: Lys

  # Language panel
  language:
    title: Sprog
    ui_language:
      title: Sprog i brugerfladen
      select_language: Vælg sprog

  # Contents panel
  contents:
    title: Indhold
    editor:
      title: Editor
      use_draft_backup:
        switch_label: Sikkerhedskopiér automatisk dokumentkladder
      close_on_save:
        switch_label: Luk editoren når en kladde er gemt
      close_with_escape:
        switch_label: Luk editoren med Escape-tasten

  # Internationalization panel
  i18n:
    title: Internationalisering
    translators:
      default:
        title: Standardoversættelsestjeneste
        select_service: Vælg tjeneste
      api_keys:
        title: API-nøgler til oversættelsestjenester
        description: Administrer API-nøgler til <a>oversættelsestjenester</a>. API-nøgler til generelle AI-tjenester kan administreres i AI-indstillingerne.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: '{$service}-nøgle'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Opret en konto hos <a {$homeHref}>{$service}</a>, og indtast <a {$apiKeyHref}>din API-nøgle</a> her for hurtigt at kunne oversætte tekstfelter.

  # Media panel
  media:
    title: Medier
    stock_photos:
      api_keys:
        title: API-nøgler til stockfototjenester
        description: Administrer API-nøgler til <a>stockfototjenester</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: '{$service}-API-nøgle'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Opret en konto hos <a {$homeHref}>{$service} API</a>, og indtast <a {$apiKeyHref}>din API-nøgle</a> her for at kunne indsætte gratis stockfotos i billedfelter.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Fotos leveret af {$service}
      no_services: Der er ikke konfigureret nogen <a>stockfototjenester</a>.
    cloud_storage:
      api_keys:
        title: API-nøgler til cloudlagringstjenester
        description: Administrer API-nøgler til <a>cloudlagringstjenester</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: '{$service}-API-nøgle'
      no_services: Der er ikke konfigureret nogen <a>cloudlagringstjenester</a>.

  # AI panel
  ai:
    title: AI
    api_keys:
      title: API-nøgler til AI-tjenester
      description: Administrer API-nøgler til AI-tjenester.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: '{$service}-API-nøgle'

  # Accessibility panel
  accessibility:
    title: Tilgængelighed
    underline_links:
      title: Understreg links
      description: Vis understregning af links i forhåndsvisningen af dokumenter og i brugerfladens tekster.
      switch_label: Understreg altid links

  # Data Management panel
  data:
    title: Datahåndtering
    clear_data:
      title: Ryd data
      # Clear File Cache button
      file_cache:
        description: Slet lokalt cachelagret filindhold og miniaturebilleder for at frigøre lagerplads eller løse problemer forårsaget af forældede data.
        button_label: Ryd filcache
        confirmation: Lokalt cachelagret filindhold og miniaturebilleder bliver slettet. Dine ikke-gemte kladder og indstillinger bevares, og slettede data bliver downloadet eller genereret igen efter behov. CMS’et genindlæses når det er færdigt.
      # Erase All Data button
      all_data:
        description: Slet alt hvad CMS’et gemmer i denne browser, herunder cachelagrede filer, ikke-gemte kladder og indstillinger. Det der allerede er gemt i dit repository, bliver ikke påvirket.
        button_label: Slet alle data
        confirmation: Alle data der er gemt i denne browser, bliver slettet, herunder cachelagret filindhold, miniaturebilleder, ikke-gemte kladder, indstillinger og loginstatus. Dit repository bliver ikke påvirket, men alle ændringer du ikke har gemt, går tabt, og du skal logge ind igen. CMS’et genindlæses når det er færdigt.

  # Developer panel
  developer:
    title: Udvikler
    developer_mode:
      title: Udviklertilstand
      description: Slå udviklerorienterede funktioner til, herunder detaljerede konsollogs og systemets egne kontekstmenuer.
      switch_label: Slå udviklertilstand til
    local_git:
      title: Git-commits
      description: Commit dine ændringer til den aktuelle branch i dit lokale repository hver gang du gemmer dem, sådan som CMS’et gør når du arbejder med et eksternt repository. Du kan derefter gennemse og pushe dine commits med dine sædvanlige Git-værktøjer.
      switch_label: Commit ændringer til Git
      checking: Kontrollerer repositoriet…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Ændringer bliver committet til branchen {$branch} som {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Ændringer kan ikke committes lige nu. {$reason}
    deploy_hook:
      title: Deploy-hook
      description: Indtast en webhook-URL der skal kaldes når du manuelt udløser en udrulning ved at vælge Udgiv ændringer. Feltet kan stå tomt hvis du bruger GitHub Actions eller GitLab CI/CD.
      # Hook URL input
      url:
        field_label: Hook-URL
        saved: Hook-URL’en er gemt.
        removed: Hook-URL’en er fjernet.
      # Authorization header input
      auth:
        field_label: Authorization-header (fx Bearer <token>) (valgfri)
        saved: Authorization-headeren er gemt.
        removed: Authorization-headeren er fjernet.

