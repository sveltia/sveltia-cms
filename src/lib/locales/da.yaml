# Asset Management
# ==============================================================================
# Strings for uploading, editing, and managing assets (images, documents, etc.).

# Upload dialog: title and button label
upload_assets: Upload nye mediefiler

# New Folder button and dialog in the Asset Library
new_folder: Ny mappe
new_folder_name: Mappenavn
new_folder_create: Opret
# {$folder} is the path of the folder the new one will be created in, starting with a slash
new_folder_description: Den nye mappe oprettes i ”{$folder}”.
# Validation errors for the new folder name
new_folder_error:
  empty: Mappenavnet må ikke være tomt.
  invalid: Mappenavnet må ikke indeholde skråstreger eller begynde med et punktum.
  # A name the CMS itself is usually served from, e.g. `admin` or `cms`
  reserved: Filerne i en mappe med dette navn er skrivebeskyttede, da selve CMS’et normalt serveres fra den.
  duplicate: Der findes allerede en mappe eller fil med dette navn her.
# Progress and error messages while the folder is being created
creating_folder: Opretter mappen…
creating_folder_failed: Mappen kunne ikke oprettes.

# Menu on a folder in the Asset Library, and the Rename Folder and Delete Folder dialogs
folder_options: Mappemuligheder
show_folder_options: Vis mappemuligheder
rename_folder: Omdøb mappe
delete_folder: Slet mappe
# Rename Folder dialog body text
# {$count} is the number of assets in the folder, which are moved along with it
enter_new_name_for_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Indtast et nyt navn herunder. }}
    one {{ Indtast et nyt navn herunder. Mediefilen i mappen flyttes med, og et dokument der bruger den, bliver opdateret. }}
    *   {{ Indtast et nyt navn herunder. De {$count} mediefiler i mappen flyttes med, og dokumenter der bruger dem, bliver opdateret. }}
# Delete Folder confirmation
# {$name} is the folder name and {$count} is the number of assets in the folder
confirm_deleting_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Er du sikker på at du vil slette den tomme mappe ”{$name}”? }}
    one {{ Er du sikker på at du vil slette mappen ”{$name}” og mediefilen i den? }}
    *   {{ Er du sikker på at du vil slette mappen ”{$name}” og de {$count} mediefiler i den? }}
# Progress and error messages while the folder is being renamed or deleted
renaming_folder: Omdøber mappen…
renaming_folder_failed: Mappen kunne ikke omdøbes.
deleting_folder: Sletter mappen…
deleting_folder_failed: Mappen kunne ikke slettes.
# Asset Library and asset picker: notice shown when a cloud storage service holds more files than
# are listed at once
external_assets_truncated: Der er for mange filer på tjenesten til at vise dem alle, så nogle af dem er udeladt.

# Edit options menu: button and item labels
edit_options: Redigeringsmuligheder
show_edit_options: Vis redigeringsmuligheder
# Copy menu aria-label
copy_options: Kopieringsindstillinger
# Edit menu items with specific asset names
edit_asset: Rediger mediefil
# {$name} is the selected asset name
edit_x: Rediger {$name}

# Asset text editor: switch for line wrapping
wrap_long_lines: Ombryd lange linjer

# Move assets: dialog for moving assets to another folder in the repository
move: Flyt
move_asset: Flyt mediefil
# Dialog title. {$name} is the asset name when a single asset is moved, and {$count} is the number of
# assets being moved
move_assets_title: |
  .input {$count :integer}
  .match $count
    one {{ Flyt {$name} }}
    *   {{ Flyt {$count} mediefiler }}
# Dialog body text. {$count} is the number of entries that currently use the assets
select_asset_move_destination: |
  .input {$count :integer}
  .match $count
    0   {{ Vælg den mappe der skal flyttes til. }}
    one {{ Vælg den mappe der skal flyttes til. Et dokument der bruger mediefilerne, bliver også opdateret. }}
    *   {{ Vælg den mappe der skal flyttes til. {$count} dokumenter der bruger mediefilerne, bliver også opdateret. }}
# Accessible label of the folder tree in the Move dialog
asset_move_destination: Destinationsmappe
# Shown when the assets being moved are all in the selected folder already
assets_already_in_folder: |
  .input {$count :integer}
  .match $count
    one {{ Mediefilen er allerede i denne mappe. }}
    *   {{ Mediefilerne er allerede i denne mappe. }}
# Shown when files with the same names exist in the selected folder. {$names} is a comma-separated
# list of file names
asset_move_conflict: 'Følgende filer findes allerede i denne mappe: {$names}.'
moving_assets: Flytter mediefilerne…
moving_assets_failed: Mediefilerne kunne ikke flyttes.
# Warning shown when files have been moved off a cloud storage service, but the originals couldn’t
# be deleted from it
asset_move_cleanup_failed: Filerne er flyttet, men originalerne kunne ikke slettes fra lagringstjenesten.
# Shown when files on a cloud storage service can’t be renamed or moved, because the entries using
# them can’t be updated, e.g. for an Open Authoring contributor. {$count} is the number of files
cannot_change_used_external_files: |
  .input {$count :integer}
  .match $count
    one {{ Denne fil kan ikke omdøbes eller flyttes, fordi de dokumenter der bruger den, ikke kan opdateres. }}
    *   {{ Disse filer kan ikke omdøbes eller flyttes, fordi de dokumenter der bruger dem, ikke kan opdateres. }}

# Rename asset: dialog and validation
rename_asset: Omdøb mediefil
# {$name} is the current asset name
rename_x: Omdøb {$name}
# Dialog body text indicating how many entries reference this asset
# {$count} is the number of entries that currently reference the asset
enter_new_name_for_asset: |
  .input {$count :integer}
  .match $count
    0   {{ Indtast et nyt navn herunder. }}
    one {{ Indtast et nyt navn herunder. Et dokument der bruger mediefilen, bliver også opdateret. }}
    *   {{ Indtast et nyt navn herunder. {$count} dokumenter der bruger mediefilen, bliver også opdateret. }}
# Validation errors for asset renaming
enter_new_name_for_asset_error:
  empty: Filnavnet må ikke være tomt.
  character: Filnavnet må ikke indeholde specialtegn.
  duplicate: Dette filnavn bruges allerede til en anden mediefil.
  # A name starting with a dot hides the file, which the CMS wouldn’t list any more
  leading_dot: Filnavnet må ikke begynde med et punktum.
  # The name of a file next to the asset that isn’t an asset, like an entry file
  file_duplicate: Der findes allerede en anden fil med dette navn her.
  # The name of a folder next to the file
  folder_duplicate: Der findes allerede en mappe med dette navn her.
# Shown while renaming a file whose name will be changed on saving, e.g. by the `slugify_filename`
# media library option
file_will_be_saved_as: Filen bliver gemt som ”{$name}”.
# Confirmation dialog shown when the file extension is changed while renaming an asset
change_file_extension: Skift filendelse
# {$oldExtension} and {$newExtension} are file extensions without a leading dot, e.g. png
confirm_file_extension_change:
  change: Er du sikker på at du vil ændre filendelsen fra ”.{$oldExtension}” til ”.{$newExtension}”?
  add: Er du sikker på at du vil tilføje filendelsen ”.{$newExtension}”?
  remove: Er du sikker på at du vil fjerne filendelsen ”.{$oldExtension}”?
file_extension_change_warning: Filen vises eller håndteres muligvis ikke korrekt hvis filendelsen ikke passer til det faktiske filformat.

# Replace asset: menu item and dialog title
replace_asset: Erstat mediefil
# {$name} is the asset being replaced
replace_x: Erstat {$name}
# File/Image field: labels of the Replace and Remove buttons
replace_file: Erstat fil
replace_image: Erstat billede
remove_file: Fjern fil
remove_image: Fjern billede

# File selection prompts: drop zones and file pickers
# Browse prompt shown when drag-and-drop is unavailable on desktop and pointer devices
click_to_browse: Klik for at gennemse…
# Browse prompt shown on touch devices
tap_to_browse: Tryk for at gennemse…
# Drop zone text with browse button
# {$count} is the number of files expected by the current picker mode
drop_files_or_click_to_browse: |
  .input {$count :integer}
  .match $count
    one {{ Træk en fil hertil, eller klik for at gennemse… }}
    *   {{ Træk filer hertil, eller klik for at gennemse… }}
# Partial drop zone text (ends with inline button)
# {$count} is the number of files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Træk en fil hertil, eller }}
    *   {{ Træk filer hertil, eller }}
# Image-specific drop zone text
# {$count} is the number of image files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_image_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Træk en billedfil hertil, eller }}
    *   {{ Træk billedfiler hertil, eller }}

# File picker and clipboard actions used by upload controls
browse: Gennemse
# Generic clipboard paste action used by non-image file fields
paste: Indsæt
# Clipboard paste action used by image fields
paste_image: Indsæt billede

# Clipboard paste errors
no_image_in_clipboard: Der blev ikke fundet noget billede i udklipsholderen.
clipboard_access_denied: Adgang til udklipsholderen blev nægtet.

# Drag-and-drop overlay text (shown while dragging)
# {$count} is the number of files expected by the current picker mode
drop_files_here: |
  .input {$count :integer}
  .match $count
    one {{ Slip filen her }}
    *   {{ Slip filerne her }}

# File type validation errors
unsupported_file_type: Filtypen understøttes ikke
# {$type} is the expected asset type label, such as image or document
dropped_file_type_mismatch: 'Filen du har trukket ind, er ikke en af følgende typer: {$types}. Prøv igen.'
dropped_image_type_mismatch: 'Filen du har trukket ind, understøttes ikke. Kun billeder af følgende typer accepteres: {$types}. Prøv igen.'

# File chooser button label
# {$count} is the number of files the picker allows the user to choose
choose_files: |
  .input {$count :integer}
  .match $count
    one {{ Vælg fil }}
    *   {{ Vælg filer }}

# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    one {{ Slet mediefil }}
    *   {{ Slet mediefiler }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Slet valgt mediefil }}
    *   {{ Slet valgte mediefiler }}
confirm_deleting_this_asset: Er du sikker på at du vil slette denne mediefil?
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Er du sikker på at du vil slette den valgte mediefil? }}
    *   {{ Er du sikker på at du vil slette de {$count} valgte mediefiler? }}
confirm_deleting_all_assets: Er du sikker på at du vil slette alle mediefilerne?
# Note added to the confirmation when entries use the assets being deleted; the references are
# removed in the same commit. {$count} is the number of entries using them
deleting_referenced_assets_note: |
  .input {$count :integer}
  .match $count
    one {{ Henvisningen til den i et dokument bliver også fjernet. }}
    *   {{ Henvisningerne til den i {$count} dokumenter bliver også fjernet. }}
# Shown in place of the confirmation when removing the references would leave a field in an entry
# invalid, e.g. a required Image field with nothing left, so the deletion is refused. The fields are
# listed below the message, each with the validation error it would have. {$count} is the number of
# assets being deleted
cannot_delete_referenced_assets: |
  .input {$count :integer}
  .match $count
    one {{ Denne mediefil kan ikke slettes, fordi følgende felter i de dokumenter der bruger den, ikke længere vil være gyldige uden den. Opdater først de dokumenter. }}
    *   {{ Disse mediefiler kan ikke slettes, fordi følgende felter i de dokumenter der bruger dem, ikke længere vil være gyldige uden dem. Opdater først de dokumenter. }}
# Error shown in the asset deletion dialog when the entries using the assets couldn’t be looked up,
# so the deletion can’t go ahead. {$count} is the number of assets being deleted
checking_asset_references_failed: |
  .input {$count :integer}
  .match $count
    one {{ Det kunne ikke kontrolleres hvilke dokumenter der bruger denne mediefil. Luk denne dialog, og prøv igen. }}
    *   {{ Det kunne ikke kontrolleres hvilke dokumenter der bruger disse mediefiler. Luk denne dialog, og prøv igen. }}

# Delete entries: dialog titles and confirmation messages
# {$count} is the number of entries targeted by the action
delete_entries: |
  .input {$count :integer}
  .match $count
    one {{ Slet dokument }}
    *   {{ Slet dokumenter }}
# {$count} is the number of selected entries
delete_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Slet valgt dokument }}
    *   {{ Slet valgte dokumenter }}
confirm_deleting_this_entry: Er du sikker på at du vil slette dette dokument?
confirm_deleting_this_entry_with_assets: Er du sikker på at du vil slette dette dokument og de tilknyttede mediefiler?
# Error notification shown when an entry could not be deleted
deleting_entry_failed: Dokumentet kunne ikke slettes. Prøv igen.
# {$count} is the number of selected entries
confirm_deleting_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Er du sikker på at du vil slette det valgte dokument? }}
    *   {{ Er du sikker på at du vil slette de {$count} valgte dokumenter? }}
# {$count} is the number of selected entries whose associated assets would also be removed
confirm_deleting_selected_entries_with_assets: |
  .input {$count :integer}
  .match $count
    one {{ Er du sikker på at du vil slette det valgte dokument og de tilknyttede mediefiler? }}
    *   {{ Er du sikker på at du vil slette de {$count} valgte dokumenter og de tilknyttede mediefiler? }}
confirm_deleting_all_entries: Er du sikker på at du vil slette alle dokumenterne?
confirm_deleting_all_entries_with_assets: Er du sikker på at du vil slette alle dokumenterne og de tilknyttede mediefiler?
# Note added to the confirmation when other entries reference the entries being deleted through
# Relation fields; the references are removed in the same commit. {$count} is the number of
# referencing entries
deleting_referenced_entries_note: |
  .input {$count :integer}
  .match $count
    one {{ Henvisningen til det i et andet dokument bliver også fjernet. }}
    *   {{ Henvisningerne til det i {$count} andre dokumenter bliver også fjernet. }}
# Shown in place of the confirmation when removing the references would leave a Relation field in
# another entry invalid, e.g. a required field with nothing selected, so the deletion is refused.
# The fields are listed below the message, each with the validation error it would have. {$count}
# is the number of entries being deleted
cannot_delete_referenced_entries: |
  .input {$count :integer}
  .match $count
    one {{ Dette dokument kan ikke slettes, fordi følgende felter i andre dokumenter ikke længere vil være gyldige uden det. Opdater først de dokumenter. }}
    *   {{ Disse dokumenter kan ikke slettes, fordi følgende felter i andre dokumenter ikke længere vil være gyldige uden dem. Opdater først de dokumenter. }}

# ==============================================================================
# Entry Reordering
# ==============================================================================
# Strings for manually reordering entries via drag-and-drop.

# Reorder mode: toggle buttons
reorder_entries: Ændr rækkefølge på dokumenter
done_reordering_entries: Færdig med at ændre rækkefølgen
cancel_reordering_entries: Annuller ændring af rækkefølgen

# Reorder error message
saving_reorder_failed: Den nye rækkefølge af dokumenter kunne ikke gemmes. Prøv igen.

# ==============================================================================
# Bulk Entry Editing
# ==============================================================================
# Strings for editing the fields of many entries at once in a table.

# Bulk edit mode: toggle buttons
bulk_edit_entries: Masseredigér dokumenter
save_bulk_edits: Gem masseredigeringer
cancel_bulk_edits: Annuller masseredigering

# Bulk edit table: column header of the entry titles
bulk_edit_entry: Dokument

# Bulk edit table: label of the table
bulk_edit_table: Masseredigering

# Bulk edit table: label of a cell input; {$field} is the field label, {$entry} is the entry title
bulk_edit_cell: '{$field} for {$entry}'

# Bulk edit status: number of changed fields
bulk_edit_count: |
  .input {$count :integer}
  .match $count
    0   {{ Ingen ændringer }}
    one {{ 1 ændring }}
    *   {{ {$count} ændringer }}

# Bulk edit error messages
bulk_edit_invalid: Nogle af værdierne er ugyldige. Ret de fremhævede felter, og prøv igen.
saving_bulk_edits_failed: Ændringerne kunne ikke gemmes. Prøv igen.

# Bulk edit: confirmation shown when leaving the mode with unsaved changes
discard_bulk_edits_confirm: Vil du kassere de ændringer der er foretaget i dokumenterne?

# ==============================================================================
# File Upload and Processing
# ==============================================================================
# Strings for file upload dialogs, progress indicators, and validation.

# Processing indicator shown during file preparation
# {$count} is the number of files currently being processed
processing_files: |
  .input {$count :integer}
  .match $count
    one {{ Behandler en fil. Det kan tage et stykke tid. }}
    *   {{ Behandler filer. Det kan tage et stykke tid. }}

# Uploading section aria-label
uploading_files: Uploader filer

# Replace file confirmation
# Dialog body when replacing an existing file
# {$name} is the existing file name that will be replaced
confirm_replacing_file: '”{$name}” bliver erstattet med denne fil:'

# Upload confirmation with destination folder
# {$folder} is the destination folder label and {$count} is the number of files being uploaded
confirm_uploading_files: |
  .input {$count :integer}
  .match $count
    one {{ Denne fil bliver gemt i mappen ”{$folder}”: }}
    *   {{ Disse {$count} filer bliver gemt i mappen ”{$folder}”: }}

# File size validation
# Warning section for files exceeding size limits
oversized_files: For store filer
# {$size} is the maximum allowed file size and {$count} is the number of oversized files
warning_oversized_files: |
  .input {$count :integer}
  .match $count
    one {{ Denne fil kan ikke uploades fordi den overskrider den maksimale størrelse på {$size}. Reducer størrelsen, eller vælg en anden fil. }}
    *   {{ Disse filer kan ikke uploades fordi de overskrider den maksimale størrelse på {$size}. Reducer størrelserne, eller vælg nogle andre filer. }}

# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: Ugyldige filer
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    one {{ Denne fil kan ikke uploades fordi den er beskadiget eller fordi indholdet ikke svarer til filendelsen. Det sker ofte når et foto er blevet omdøbt i stedet for konverteret, fx et HEIC-billede gemt som en JPEG-fil. Konvertér filen, og prøv igen. }}
    *   {{ Disse filer kan ikke uploades fordi de er beskadigede eller fordi indholdet ikke svarer til filendelserne. Det sker ofte når fotos er blevet omdøbt i stedet for konverteret, fx HEIC-billeder gemt som JPEG-filer. Konvertér filerne, og prøv igen. }}
# {$count} is the number of files that are not of a type the field accepts, even once transformed
# {$types} is the list of accepted file types, such as “.pdf or .txt”
warning_unsupported_files: |
  .input {$count :integer}
  .match $count
    one {{ Denne fil kan ikke uploades fordi den ikke er en af følgende typer: {$types}. }}
    *   {{ Disse filer kan ikke uploades fordi de ikke er en af følgende typer: {$types}. }}
# {$count} is the number of files that are not of an image type the field accepts
# {$types} is the list of accepted image formats, such as “PNG or WebP”
warning_unsupported_image_files: |
  .input {$count :integer}
  .match $count
    one {{ Denne fil kan ikke uploades fordi kun et billede af følgende typer accepteres: {$types}. }}
    *   {{ Disse filer kan ikke uploades fordi kun billeder af følgende typer accepteres: {$types}. }}

# File format validation when replacing an asset
# Warning section for replacement files that are in a different format
mismatched_files: Filer med forkert format
# {$name} is the name of the asset being replaced and {$count} is the number of mismatched files
warning_mismatched_files: |
  .input {$count :integer}
  .match $count
    one {{ Denne fil kan ikke erstatte ”{$name}” fordi den har et andet format. Konverter filen til samme format, og prøv igen. }}
    *   {{ Disse filer kan ikke erstatte ”{$name}” fordi de har et andet format. Konverter filerne til samme format, og prøv igen. }}

# File name conflict resolution
# {$count} is the number of conflicting file names in the target folder
file_name_conflict_confirmation: |
  .input {$count :integer}
  .match $count
    one {{ Der findes allerede en fil med samme navn i denne mappe. Vil du erstatte den? }}
    *   {{ Der findes allerede {$count} filer med de samme navne i denne mappe. Vil du erstatte dem? }}
# {$name} is the conflicting file name when there is exactly one conflict; {$count} is the total conflict count
file_name_conflict_confirmation_with_name: |
  .input {$count :integer}
  .input {$name :string}
  .match $count
    one {{ Der findes allerede en fil med navnet ”{$name}” i denne mappe. Vil du erstatte den? }}
    *   {{ Der findes allerede {$count} filer med de samme navne i denne mappe. Vil du erstatte dem? }}
file_name_conflict_resolution: Håndtering af filnavnekonflikter
# Option to keep both files (rename the new one)
keep_both: Behold begge

# Upload progress and error messages
uploading_files_progress: Uploader…
uploading_files_failed: Upload mislykkedes.
# Errors shown when a file on a cloud storage service could not be deleted or renamed
deleting_assets_failed: Sletning mislykkedes.
renaming_asset_failed: Omdøbning mislykkedes.
# Error shown when an edited text file in the Asset Library could not be saved
saving_asset_failed: Lagring mislykkedes.

# File metadata display
# Appended when a file was auto-converted (e.g., HEIF to JPEG)
# {$type} is the original file type before conversion
file_meta_converted_from_x: (konverteret fra {$type})

# ==============================================================================
# Entry Management
# ==============================================================================
# Strings for creating and managing entries in collections

# Empty state messages
no_entries_created: Denne samling har endnu ingen dokumenter.
# Button to create first entry
create_new_entry: Opret nyt dokument
# “Entry” option label in the create button menu
entry: Dokument

# Special entry types
# Fallback label for collection index files when no custom label is configured
index_file: Indeksfil

# Empty state for file collections
no_files_in_collection: Der er ingen tilgængelige filer i denne samling.

# Entry duplication
duplicate_entry: Duplikér dokument
entry_duplicated: Dokumentet er duplikeret som en ny kladde.

# Validation errors
# Toast shown when entry has validation errors preventing save
# {$count} is the number of fields with validation errors
entry_validation_errors: |
  .input {$count :integer}
  .match $count
    one {{ Ét felt har en fejl. Ret den for at gemme dokumentet. }}
    *   {{ {$count} felter har fejl. Ret dem for at gemme dokumentet. }}
# Button on the validation error toast that opens the Validation panel listing the errors
show_errors: Vis fejl

# ==============================================================================
# Success Notifications
# ==============================================================================
# Toast notifications shown after successful operations.

# Entry operations
# {$count} is the number of entries affected by the operation
entry_saved: |
  .input {$count :integer}
  .match $count
    one {{ Dokumentet er gemt. }}
    *   {{ {$count} dokumenter er gemt. }}
entry_saved_and_published: |
  .input {$count :integer}
  .match $count
    one {{ Dokumentet er gemt og udgivet. }}
    *   {{ {$count} dokumenter er gemt og udgivet. }}
entries_deleted: |
  .input {$count :integer}
  .match $count
    one {{ Dokumentet er slettet. }}
    *   {{ {$count} dokumenter er slettet. }}

# Asset operations
# {$count} is the number of assets or asset-derived values affected by the operation
assets_saved: |
  .input {$count :integer}
  .match $count
    one {{ Mediefilen er gemt. }}
    *   {{ {$count} mediefiler er gemt. }}
assets_saved_and_published: |
  .input {$count :integer}
  .match $count
    one {{ Mediefilen er gemt og udgivet. }}
    *   {{ {$count} mediefiler er gemt og udgivet. }}
asset_urls_copied: |
  .input {$count :integer}
  .match $count
    one {{ URL’en er kopieret til udklipsholderen. }}
    *   {{ {$count} URL’er er kopieret til udklipsholderen. }}
asset_paths_copied: |
  .input {$count :integer}
  .match $count
    one {{ Filstien er kopieret til udklipsholderen. }}
    *   {{ {$count} filstier er kopieret til udklipsholderen. }}
asset_ids_copied: |
