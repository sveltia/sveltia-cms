# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Der er en fejl i CMS-konfigurationen. Løs problemet, og prøv igen. }}
      *   {{ Der er fejl i CMS-konfigurationen. Løs problemerne, og prøv igen. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: samlingen {$collection}
    file: filen {$file}
    component: komponenten {$component}
    # Don’t localize `{$field}`
    field: feltet `{$field}`

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS virker kun med HTTPS- eller localhost-URL’er.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ Konfigurationsfilens URL skal bruge HTTPS-protokollen eller en localhost-adresse. }}
        *   {{ Konfigurationsfilernes URL’er skal bruge HTTPS-protokollen eller localhost-adresser. }}
    fetch_failed: Konfigurationsfilen kunne ikke hentes.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: HTTP-respons returneret med status {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Konfigurationsfilen kunne ikke hentes. For at forhindre at filen `config.yml` indlæses, kan du tilføje <a>`load_config_file: false`</a> til det konfigurationsobjekt der gives til `CMS.init()`.'
    parse_failed: Konfigurationsfilen kunne ikke fortolkes.
    parse_failed_invalid_object: Konfigurationsfilen er ikke et gyldigt JavaScript-objekt.
    parse_failed_unsupported_type: Konfigurationsfilen har ikke en gyldig filtype. Kun YAML, TOML og JSON understøttes.
    no_collection: Der er ikke defineret nogen samlinger.
    # Don’t localize `hide`
    no_visible_collection: Mindst én samling skal være synlig. Kontrollér indstillingen `hide`.
    missing_backend: Backenden er ikke defineret.
    missing_backend_name: Backendens navn er ikke defineret.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Backenden {$name} <a>understøttes ikke</a> i Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Den forældede backend {$name} <a>understøttes ikke</a> i Sveltia CMS.
    unsupported_custom_backend: Brugerdefinerede backends <a>understøttes ikke</a> i Sveltia CMS.
    unsupported_backend_suggestion: Brug i stedet en af de <a>understøttede backends</a>.
    missing_repository: Repositoriet er ikke defineret.
    invalid_repository: Det konfigurerede repository er ugyldigt. Det skal have formatet ”owner/repo”.
    # Don’t localize `api_root`
    missing_api_root: Indstillingen `api_root` er ikke defineret. Den er påkrævet for Forgejo-backenden.
    invalid_root_dir: Rodmappen er ugyldig. Den skal være en sti i repositoriet, uden ”..”.
    invalid_root_dir_branch: Rodmappen kan ikke bruges i branchnavnene for udgivelsestilstandene `editorial_workflow` og `preview`. Ingen del af dens sti må begynde med et punktum, slutte med ”.lock” eller indeholde et mellemrum eller et specialtegn som kolon eller stjerne.
    path_outside_root_dir: Stien ”{$path}” fører uden for rodmappen, hvor CMS’et ikke kan vise filer.
    oauth_implicit_flow: Den konfigurerede autentificeringsmetode (implicit flow) understøttes ikke i Sveltia CMS. Brug en anden <a>autentificeringsmetode</a> i stedet.
    github_pkce_unsupported: PKCE-autorisation understøttes endnu ikke på grund af begrænsninger hos GitHub. Brug en anden <a>autentificeringsmetode</a> i stedet.
    additions_no_base_url: Indstillingen `base_url` skal være URL’en til din Sveltia CMS Additions-tjeneste.
    oauth_no_app_id: OAuth-applikationens id er ikke defineret.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: Indstillingen `open_authoring` kræver udgivelsestilstanden `editorial_workflow` eller `preview`. Se <a>dokumentationen</a> for detaljer.
    # Don’t localize `auth_methods`
    no_auth_methods: Indstillingen `auth_methods` skal indeholde mindst én metode.
    # Don’t localize `auth_scope`, `repo` and `public_repo`
    auth_scope_no_repo: Indstillingen `auth_scope` skal indeholde `repo` eller `public_repo`.
    missing_media_folder: Mediemappen er ikke defineret.
    public_folder_relative_path: Den konfigurerede offentlige mappe er ugyldig. Den skal være en absolut sti der begynder med ”/”.
    public_folder_absolute_url: En absolut URL i indstillingen for den offentlige mappe understøttes ikke i Sveltia CMS.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: Indstillingen `{$option}` indeholder skabelontagget `{$tag}`, som ikke understøttes dér. Kun slug-skabelontags som `\{\{slug\}\}` og `\{\{year\}\}` samt tagsene `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` og `\{\{public_folder\}\}` kan bruges.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: Indstillingen `{$option}` indeholder skabelontagget `{$tag}`, som kun kan bruges i indstillingen for en samling, en samlingsfil eller et felt, hvor der er et dokument at udfylde det med.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: Indstillingen `sanitize_replacement` er sat til `{$replacement}`, men den indeholder et tegn der ikke kan bruges i et slug, så den kan ikke erstatte et.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: Indstillingen `{$option}` er sat til `{$url}`, men den skal være en absolut URL der begynder med `https://` eller `http://`.
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: Indstillingen `stages` i `publish_mode` skal begynde med `draft` og angive trinnene i rækkefølgen `draft`, `pending_review`, `pending_publish` uden gentagelser.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: Indstillingen `i18n.locales` skal angive mindst ét sprog.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: Indstillingen `default_locale` er sat til `{$locale}`, men det er ikke et af sprogene i `locales`.
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: Indstillingen `initial_locales` indeholder `{$locale}`, men det er ikke et af sprogene i `locales`.
    # Don’t localize `i18n`
    i18n_no_collections: 'Indstillingen `i18n` er konfigureret på øverste niveau, men ingen af samlingerne eller singletonerne har indstillingen `i18n`, så intet indhold kan oversættes. Tilføj `i18n: true` til de samlinger og singletoner der skal oversættes.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: Indstillingen `transformations` indeholder en ikke-understøttet nøgle `{$key}`. Den skal være `raster_image`, `svg` eller et understøttet rasterbilledformat.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: Indstillingen `quality` for transformationen `{$key}` er ugyldig. Den skal være et heltal mellem 0 og 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: Indstillingen `{$prop}` for transformationen `{$key}` er ugyldig. Den skal være et positivt heltal.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: Mediesamling {$count} skal have indstillingen `name` defineret som en ikke-tom streng.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Mediesamlingsnavnet `{$name}` er ugyldigt. Det må ikke indeholde specialtegn.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Navne på mediesamlinger skal være unikke, men `{$name}` bruges mere end én gang.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: Samlingen skal have enten indstillingen `folder`, `file`, `files` eller `divider` defineret.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: Samlingen kan ikke have mere end én af indstillingerne `folder`, `file`, `files` og `divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: Filendelsen `{$extension}` passer ikke til formatet `{$format}`.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: Feltet `{$name}` gemmes som brødteksten under front matter, som kun kan indeholde tekst og ikke et tal, en boolesk værdi, en liste eller et objekt, som et `{$widget}`-felt gør. Brug en felttype der indeholder tekst, eller omdøb feltet.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
    # brackets are escaped with backslashes for MessageFormat 2
    invalid_collection_data_file: Indstillingen `file` `{$file}` er ugyldig. Den skal være stien til en JSON-fil uden pladsholderen `\{\{locale\}\}`.
    # {$prop} is the option name; Don’t localize `file`
    unsupported_collection_data_file_option: Indstillingen `{$prop}` understøttes ikke i en samling med indstillingen `file`.
    # Don’t localize `file`, `publish_mode` and `simple`
    collection_data_file_workflow: Redaktionel arbejdsgang og forhåndsvisningsarbejdsgang, herunder åben redigering, understøttes ikke i en samling med indstillingen `file`. Sæt samlingens indstilling `publish_mode` til `simple`.
    # {$prop} is the option name; Don’t localize `file` and `slug`. The curly brackets are escaped
    # with backslashes for MessageFormat 2
    collection_data_file_slug_tag: Indstillingen `{$prop}` kan ikke indeholde tagget `\{\{slug\}\}` i en samling med indstillingen `file`, da et dokuments slug er dets position, som ændres når dokumenterne flyttes eller slettes. Brug i stedet et felt med en unik værdi.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Slug-skabelonen `{$slug}` er ugyldig da den ikke må indeholde skråstreger. Brug indstillingen `path` i stedet for `slug` for at organisere dokumenter i undermapper.
    # {$name} is the field name from the configuration; Don’t localize `identifier_field`
    invalid_identifier_field: Indstillingen `identifier_field` henviser til `{$name}`, men der er ikke defineret noget sådant felt i samlingen.
    # {$name} is the field name from the configuration; Don’t localize `filter`
    invalid_filter_field: Indstillingen `filter` henviser til `{$name}`, men der er ikke defineret noget sådant felt i samlingen.
    # Don’t localize `filter`, `value` and `pattern`
    invalid_filter_no_condition: Indstillingen `filter` skal have enten indstillingen `value` eller `pattern` at matche dokumenter mod.
    # {$option} is an option name such as `slug` or `summary` and {$name} is the field name or template tag from the configuration
    option_field_not_found: Indstillingen `{$option}` henviser til `{$name}`, men der er ikke defineret noget sådant felt.
    # {$name} is the field name from the configuration and {$widget} is its field type; Don’t localize `thumbnail`
    thumbnail_field_not_media: Indstillingen `thumbnail` henviser til `{$name}`, men det skal være et Image- eller File-felt, ikke et `{$widget}`-felt.
    # Don’t localize `inline` or `multiple`
    invalid_inline_component_fields: Tilstanden `inline` kræver et enkelt Boolean-, Color-, DateTime-, Number-, Relation-, Select- eller String-felt. Et Relation- eller Select-felt må ikke have indstillingen `multiple` slået til.
    # {$option} is an option name such as `pattern` or `filter` and {$pattern} is the configured pattern
    invalid_regex: Indstillingen `{$option}` indeholder et ugyldigt regulært udtryk `{$pattern}`, som bliver ignoreret.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: Indstillingen `reorder` henviser til en visningsgruppe med navnet `{$name}`, men der er ikke defineret nogen sådan gruppe i indstillingen `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit` and `fields`
    invalid_bulk_edit_field: Listen `fields` i indstillingen `bulk_edit` henviser til et felt med navnet `{$name}`, men der er ikke defineret noget sådant felt på øverste niveau i samlingen.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit`, `fields` and `multiple`
    unsupported_bulk_edit_field: Feltet `{$name}` i listen `fields` i indstillingen `bulk_edit` kan ikke masseredigeres. Kun Boolean-, Color-, DateTime-, Number-, Relation-, Select- og String-felter der ikke er skrivebeskyttede, ikke har indstillingen `multiple` slået til og ikke sættes automatisk ved lagring, understøttes.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: Indstillingen `sortable_fields` henviser til et felt med navnet `{$name}`, men der er ikke defineret noget sådant felt i samlingen.
    # Don’t localize `sortable_fields` and `default_sort`
    multiple_sortable_field_defaults: Kun ét element i indstillingen `sortable_fields` kan have indstillingen `default_sort`.
    # {$option} is `table_columns` or `summary_fields`, and {$name} is the field name from the configuration
    invalid_table_column_field: Indstillingen `{$option}` henviser til et felt med navnet `{$name}`, men der er ikke defineret noget sådant felt i samlingen.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: Indstillingen `view_groups` henviser til et felt med navnet `{$name}`, men der er ikke defineret noget sådant felt i samlingen.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: Indstillingen `view_filters` henviser til et felt med navnet `{$name}`, men der er ikke defineret noget sådant felt i samlingen.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: Visningsgruppe {$count} skal have indstillingen `name` defineret som en ikke-tom streng.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: Visningsgruppenavnet `{$name}` er ugyldigt. Det må ikke indeholde specialtegn.
    duplicate_view_group_name: Navne på visningsgrupper skal være unikke, men `{$name}` bruges mere end én gang.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: Visningsfilter {$count} skal have indstillingen `name` defineret som en ikke-tom streng.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `pattern`, `eq` and `gte`
    invalid_view_filter_no_condition: Visningsfilter {$count} skal have indstillingen `pattern` eller en sammenligningsindstilling som `eq` eller `gte` at matche dokumenter mod.
    # {$name} is the invalid or duplicate view filter name
    invalid_view_filter_name: Visningsfilternavnet `{$name}` er ugyldigt. Det må ikke indeholde specialtegn.
    duplicate_view_filter_name: Navne på visningsfiltre skal være unikke, men `{$name}` bruges mere end én gang.
    # {$name} is the default view group name from the configuration; Don’t localize `default` and `view_groups`
    invalid_view_group_default: Indstillingen `default` i `view_groups` er sat til `{$name}`, men ingen visningsgruppe har det navn.
    # {$name} is the default view filter name from the configuration; Don’t localize `default` and `view_filters`
    invalid_view_filter_default: Indstillingen `default` i `view_filters` er sat til `{$name}`, men intet visningsfilter har det navn.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: Samling {$count} skal have indstillingen `name` defineret som en ikke-tom streng.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: Samlingsnavnet `{$name}` er ugyldigt. Det må ikke indeholde specialtegn.
    duplicate_collection_name: Samlingsnavne skal være unikke, men `{$name}` bruges mere end én gang.
    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
    missing_collection_file_name: Samlingsfil {$count} skal have indstillingen `name` defineret som en ikke-tom streng.
    # {$name} is the invalid or duplicate collection file name
    invalid_collection_file_name: Samlingsfilnavnet `{$name}` er ugyldigt. Det må ikke indeholde specialtegn.
    duplicate_collection_file_name: Navne på samlingsfiler skal være unikke, men `{$name}` bruges mere end én gang.
    # Don’t localize `fields`
    collection_no_fields: Samlingen skal have indstillingen `fields` defineret med mindst ét felt.
    # Don’t localize `fields`
    collection_file_no_fields: Samlingsfilen skal have indstillingen `fields` defineret med mindst ét felt.
    # Don’t localize `i18n`, `locale` and `folder`
    collection_folder_i18n_required: Samlingen skal have indstillingen `i18n` defineret hvis pladsholderen `locale` bruges i stien i `folder`.
    # {$folder} is the invalid folder path; Don’t localize `locale`, `folder` and the example path. The
