  branch_moved: Repositoriet er blevet opdateret af en anden under lagringen. Prøv igen.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Et dokument der er gemt i samme fil, er blevet ændret af en anden. Prøv igen.
