      github: GitHub ({$login})
    actions: Ações
    you: (você)
    never: Nunca
    roles:
      admin: Administrador
      editor: Editor
      viewer: Leitor
    statuses:
      active: Ativo
      temporary_password: Palavra-passe temporária
      waiting_for_sign_in: A aguardar o primeiro início de sessão
      disabled: Desativado
    # {$name} is the user’s name
    show_options_for_x: Mostrar opções de {$name}
    options: Opções do utilizador
    reset_password: Repor palavra-passe
    sign_out_everywhere: Terminar sessão em todo o lado
    enable: Ativar utilizador
    disable: Desativar utilizador
    delete: Eliminar utilizador
    # {$name} is the user’s name
    reset_password_confirmation: Pretende atribuir uma nova palavra-passe temporária a {$name}? A sessão será terminada em todo o lado e terá de escolher uma nova palavra-passe no próximo início de sessão.
    delete_confirmation: Pretende eliminar {$name}? Esta ação não pode ser anulada.
    temporary_password: Palavra-passe temporária
    # {$name} is the user’s name
    temporary_password_description: Entregue este nome de utilizador e esta palavra-passe temporária a {$name}. Não serão mostrados novamente, e a pessoa escolherá a sua própria palavra-passe ao iniciar sessão.
    copy_username: Copiar nome de utilizador
    copy_password: Copiar palavra-passe
    # {$name} is the user’s name
    email_credentials: Enviar por e-mail a {$name}
    # The emails the admin sends from their own email app, with the sign-in details: `new` to a user
    # who has just been added, `reset` to one whose password has been reset. Each line is a string of
    # its own, as line breaks aren’t kept in these files
    credentials_email:
      # {$name} is the user’s name
      greeting: Olá {$name},
      # {$url} is a link to the CMS that fills in the username and the temporary password
      sign_in_link: 'Ligação de início de sessão: {$url}'
      # {$username} is the username
      username: 'Nome de utilizador: {$username}'
      # {$password} is the temporary password
      password: 'Palavra-passe temporária: {$password}'
      new:
        # {$app} is the name of the CMS
        subject: Os seus dados de início de sessão no {$app}
        # {$app} is the name of the CMS
        message: Já pode iniciar sessão no {$app}. Abra a ligação abaixo, que preenche o seu nome de utilizador e a palavra-passe temporária, e escolha a sua própria palavra-passe ao iniciar sessão.
      reset:
        # {$app} is the name of the CMS
        subject: A sua palavra-passe do {$app} foi reposta
        # {$app} is the name of the CMS
        message: A sua palavra-passe do {$app} foi reposta e a sua sessão foi terminada em todo o lado. Abra a ligação abaixo, que preenche o seu nome de utilizador e a palavra-passe temporária, e escolha uma nova palavra-passe ao iniciar sessão.
    allowed_domains: Domínios permitidos
    allowed_domains_description: Os sites que podem utilizar o Sveltia CMS Additions, um nome de anfitrião por linha. Um caráter universal (*) corresponde a qualquer subdomínio, por exemplo *.example.com. Sempre que possível, indique nomes de anfitrião exatos. A lista aplica-se apenas a este site, mesmo que a mesma instância do Sveltia CMS Additions sirva também outros sites.
    save_allowed_domains: Guardar domínios permitidos
    allowed_domains_saved: Os domínios permitidos foram guardados.
    sign_in_tab: Início de sessão
    # {$latest} is the newest version of Sveltia CMS Additions, {$current} the one in use
    update_available: Está disponível o Sveltia CMS Additions {$latest}. Está a utilizar a versão {$current}.
    release_notes: Notas de lançamento
    github_username_optional: Nome de utilizador do GitHub (opcional)
    github_username_description: Com um nome de utilizador do GitHub, o utilizador inicia sessão com essa conta do GitHub em vez de uma palavra-passe.
    # {$name} is the user’s name
    github_required: '{$name} só pode iniciar sessão com o GitHub, pelo que o respetivo nome de utilizador do GitHub não pode ser removido. Reponha primeiro a palavra-passe para lhe atribuir uma palavra-passe com que iniciar sessão.'
    adopt: Adotar conta
    sign_in:
      github: Permitir o início de sessão com o GitHub
      github_description: Os utilizadores iniciam sessão com a sua conta do GitHub e obtêm o seu próprio token do GitHub, pelo que as suas alterações são registadas em seu nome. Um administrador tem de os adicionar primeiro, com o respetivo nome de utilizador do GitHub, exceto se estiverem abrangidos por uma regra de registo.
      # Shown when signing in with GitHub is being turned off while {$count} users can only sign in
      # with it
      github_only_warning: |
        .input {$count :integer}
        .match $count
          one {{ Um utilizador só pode iniciar sessão com o GitHub e não conseguirá iniciar sessão depois de esta opção ser desativada, até que reponha a respetiva palavra-passe. }}
          *   {{ {$count} utilizadores só podem iniciar sessão com o GitHub e não conseguirão iniciar sessão depois de esta opção ser desativada, até que reponha as respetivas palavras-passe. }}
      rules: Regras de registo
      rules_description: Os membros da organização do GitHub em que a aplicação está instalada podem iniciar sessão sem serem adicionados primeiro. A conta recebe a função que escolher e é desativada se a pessoa sair da organização, exceto se a adotar.
      org: Organização do GitHub
      add_rule: Adicionar regra
      # {$org} is the name of a GitHub organization
      remove_rule: Remover regra de {$org}
      # For a rule whose organization hasn’t been entered yet
      remove_empty_rule: Remover regra
      save: Guardar definições de início de sessão
      saved: As definições de início de sessão foram guardadas.
    domains_tab: Domínios
    github_tab: GitHub
    github:
      app: GitHub App
      repository: Repositório
      not_installed: Não instalada
      statuses:
        ok: A aplicação está a funcionar.
        not_registered: Ainda não está configurada nenhuma GitHub App. Execute o assistente de configuração a partir da página de início de sessão com o segredo de administrador.
        key_missing: A chave privada da aplicação perdeu-se quando o segredo de administrador foi substituído. Gere uma nova chave privada nas definições da aplicação no GitHub e carregue-a abaixo.
        key_rejected: O GitHub não aceita a chave privada da aplicação, por exemplo porque foi eliminada lá. Gere uma nova chave privada nas definições da aplicação no GitHub e carregue-a abaixo.
        not_installed: A aplicação não está instalada no repositório. Instale-a novamente a partir da página da aplicação no GitHub ou execute o assistente de configuração.
