    # {$name} is the name of the site
    copy_site_url: Copiar o URL de {$name}
    delete_site: Eliminar site
    # {$name} is the name of the site
    delete_site_x: Eliminar {$name}
    # {$name} is the name of the site, {$id} is its ID
    delete_site_confirmation: Eliminar «{$name}» também elimina os respetivos utilizadores, definições e comentários. Esta ação não pode ser anulada. A GitHub App permanece no GitHub, onde a pode eliminar. Escreva «{$id}» para confirmar.
    site_id_to_confirm: ID do site para confirmar
    data_key_locked_title: Segredo de administrador alterado
    data_key_locked_description: O segredo de administrador foi alterado, pelo que não é possível ler as definições guardadas. Introduza o segredo anterior para as manter ou recomece se o tiver perdido.
    previous_secret: Segredo de administrador anterior
    unlock: Desbloquear
    rekey: Recomeçar
    rekey_confirmation: Recomeçar elimina as credenciais da GitHub App e os outros segredos guardados, e termina a sessão de todos os utilizadores. As palavras-passe são mantidas. Pretende continuar?
    result:
      ok: O GitHub está ligado. Já pode iniciar sessão.
      github_app_not_created: A GitHub App não foi criada. Utilize o segredo de administrador para tentar novamente.
      github_app_not_installed: A GitHub App não foi instalada. Utilize o segredo de administrador para tentar novamente.
      github_wrong_account: A GitHub App foi instalada numa conta que não é proprietária do repositório. Instale-a na conta proprietária do repositório e tente novamente.
      github_repository_not_included: A GitHub App foi instalada sem acesso ao repositório. Conceda-lhe acesso ao repositório no GitHub e tente novamente.
      unexpected: A ligação ao GitHub falhou devido a um erro inesperado. Tente novamente.
  locks:
    # {$name} is the name of the person editing the entry, {$time} when they started
    being_edited: '{$name} está a editar esta entrada desde {$time}, pelo que só a pode ver.'
    being_edited_by_you: Está a editar esta entrada noutro separador, pelo que aqui só a pode ver.
