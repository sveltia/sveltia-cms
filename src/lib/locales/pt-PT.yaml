      *   {{ {$count} caracteres introduzidos. Mínimo: {$min}. Máximo: {$max}. }}
  # {$count} is the current character count and {$min} is the minimum allowed count
  min: |
    .input {$count :integer}
    .match $count
      0   {{ Nenhum caráter introduzido. Mínimo: {$min}. }}
      one {{ {$count} caráter introduzido. Mínimo: {$min}. }}
      *   {{ {$count} caracteres introduzidos. Mínimo: {$min}. }}
  # {$count} is the current character count and {$max} is the maximum allowed count
  max: |
    .input {$count :integer}
    .match $count
      0   {{ Nenhum caráter introduzido. Máximo: {$max}. }}
      one {{ {$count} caráter introduzido. Máximo: {$max}. }}
      *   {{ {$count} caracteres introduzidos. Máximo: {$max}. }}

