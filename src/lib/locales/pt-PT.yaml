# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Existe um erro na configuração do CMS. Resolva o problema e tente novamente. }}
      *   {{ Existem erros na configuração do CMS. Resolva os problemas e tente novamente. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: 'coleção {$collection}'
    file: 'ficheiro {$file}'
    component: 'componente {$component}'
    # Don’t localize `{$field}`
    field: 'campo `{$field}`'

  # Configuration error messages
  error:
    no_secure_context: O Sveltia CMS só funciona com URL HTTPS ou de localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ O URL do ficheiro de configuração tem de utilizar o protocolo HTTPS ou um endereço localhost. }}
        *   {{ Os URL dos ficheiros de configuração têm de utilizar o protocolo HTTPS ou endereços localhost. }}
    fetch_failed: Não foi possível obter o ficheiro de configuração.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: A resposta HTTP devolveu o estado {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Não foi possível obter o ficheiro de configuração. Para impedir o carregamento do ficheiro `config.yml`, adicione <a>`load_config_file: false`</a> ao objeto de configuração passado a `CMS.init()`.'
    parse_failed: Não foi possível analisar o ficheiro de configuração.
    parse_failed_invalid_object: O ficheiro de configuração não é um objeto JavaScript válido.
    parse_failed_unsupported_type: O ficheiro de configuração não é de um tipo de ficheiro válido. Apenas são suportados YAML, TOML e JSON.
    no_collection: As coleções não estão definidas.
    missing_backend: O backend não está definido.
    missing_backend_name: O nome do backend não está definido.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: O backend {$name} <a>não é suportado</a> no Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: O backend descontinuado {$name} <a>não é suportado</a> no Sveltia CMS.
    unsupported_custom_backend: Os backends personalizados <a>não são suportados</a> no Sveltia CMS.
    unsupported_backend_suggestion: Utilize antes um dos <a>backends suportados</a>.
    missing_repository: O repositório não está definido.
    invalid_repository: O repositório configurado é inválido. Tem de estar no formato «owner/repo».
    oauth_implicit_flow: O método de autenticação configurado (fluxo implícito) não é suportado no Sveltia CMS. Utilize antes um <a>método de autenticação</a> diferente.
    github_pkce_unsupported: A autorização PKCE ainda não é suportada devido às limitações do GitHub. Utilize antes um <a>método de autenticação</a> diferente.
    oauth_no_app_id: O ID da aplicação OAuth não está definido.
    # Don’t localize `auth_methods`
    no_auth_methods: A opção `auth_methods` tem de conter pelo menos um método.
    missing_media_folder: A pasta de multimédia não está definida.
    public_folder_relative_path: A pasta pública configurada é inválida. Tem de ser um caminho absoluto que comece por «/».
    public_folder_absolute_url: Um URL absoluto para a opção da pasta pública não é suportado no Sveltia CMS.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: A coleção de recursos {$count} tem de ter a opção `name` definida como uma cadeia de caracteres não vazia.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: O nome da coleção de recursos `{$name}` é inválido. Não pode conter caracteres especiais.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Os nomes das coleções de recursos têm de ser únicos, mas `{$name}` é utilizado mais do que uma vez.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_no_options: A coleção tem de ter definida a opção `folder`, `files` ou `divider`.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_multiple_options: A coleção não pode ter as opções `folder`, `files` e `divider` em conjunto.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: A extensão `{$extension}` não corresponde ao formato `{$format}`.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: O modelo de slug `{$slug}` é inválido porque não pode conter barras. Para organizar as entradas em subpastas, utilize a opção `path` em vez de `slug`.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: A opção `reorder` refere-se a um grupo de vista com o nome `{$name}`, mas esse grupo não está definido na opção `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: A opção `sortable_fields` refere-se a um campo com o nome `{$name}`, mas esse campo não está definido na coleção.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: A opção `view_groups` refere-se a um campo com o nome `{$name}`, mas esse campo não está definido na coleção.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: A opção `view_filters` refere-se a um campo com o nome `{$name}`, mas esse campo não está definido na coleção.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: O grupo de vista {$count} tem de ter a opção `name` definida como uma cadeia de caracteres não vazia.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: O nome do grupo de vista `{$name}` é inválido. Não pode conter caracteres especiais.
    duplicate_view_group_name: Os nomes dos grupos de vista têm de ser únicos, mas `{$name}` é utilizado mais do que uma vez.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: O filtro de vista {$count} tem de ter a opção `name` definida como uma cadeia de caracteres não vazia.
    # {$name} is the invalid or duplicate view filter name
    invalid_view_filter_name: O nome do filtro de vista `{$name}` é inválido. Não pode conter caracteres especiais.
    duplicate_view_filter_name: Os nomes dos filtros de vista têm de ser únicos, mas `{$name}` é utilizado mais do que uma vez.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: A coleção {$count} tem de ter a opção `name` definida como uma cadeia de caracteres não vazia.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: O nome da coleção `{$name}` é inválido. Não pode conter caracteres especiais.
    duplicate_collection_name: Os nomes das coleções têm de ser únicos, mas `{$name}` é utilizado mais do que uma vez.
    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
    missing_collection_file_name: O ficheiro da coleção {$count} tem de ter a opção `name` definida como uma cadeia de caracteres não vazia.
    # {$name} is the invalid or duplicate collection file name
    invalid_collection_file_name: O nome do ficheiro da coleção `{$name}` é inválido. Não pode conter caracteres especiais.
    duplicate_collection_file_name: Os nomes dos ficheiros das coleções têm de ser únicos, mas `{$name}` é utilizado mais do que uma vez.
    # Don’t localize `fields`
    collection_no_fields: A coleção tem de ter a opção `fields` definida com pelo menos um campo.
    # Don’t localize `fields`
    collection_file_no_fields: O ficheiro da coleção tem de ter a opção `fields` definida com pelo menos um campo.
    # Don’t localize `i18n`, `locale` and `file`
    collection_file_i18n_required: O ficheiro da coleção tem de ter a opção `i18n` definida se o marcador de posição `locale` for utilizado no caminho `file`.
    # {$count} is the 1-based field index in the current fields array; Don’t localize `name`
    missing_field_name: O campo {$count} tem de ter a opção `name` definida como uma cadeia de caracteres não vazia.
    # {$name} is the invalid or duplicate field name
    invalid_field_name: O nome do campo `{$name}` é inválido. Não pode conter caracteres especiais. Se pretende aninhar campos, <a>utilize campos de Objeto em vez de notação por pontos</a>.
    duplicate_field_name: Os nomes dos campos têm de ser únicos, mas `{$name}` é utilizado mais do que uma vez.
    # {$count} is the 1-based variable type index in the current types array
    missing_variable_type: O tipo variável {$count} tem de ter a opção `name` definida como uma cadeia de caracteres não vazia.
    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: O nome do tipo variável `{$name}` é inválido. Não pode conter caracteres especiais.
    duplicate_variable_type: Os nomes dos tipos variáveis têm de ser únicos, mas `{$name}` é utilizado mais do que uma vez.
    date_field_type: 'O tipo de campo Date, descontinuado, não é suportado no Sveltia CMS. Utilize antes o tipo de campo DateTime com a opção `type: date`.'
    # {$timeZone} is the invalid IANA timezone identifier from the configuration
    invalid_timezone: 'Fuso horário inválido: {$timeZone}. Tem de ser um identificador de fuso horário IANA válido, como `America/New_York` ou `Asia/Tokyo`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: A opção `{$prop}`, descontinuada, não é suportada no Sveltia CMS. Utilize antes a opção `{$newProp}`.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: A opção `allow_multiple` não é suportada no Sveltia CMS. Utilize antes a opção `multiple`, cujo valor predefinido é `false`.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: O campo de Lista não pode ter as opções `field`, `fields` e `types` em conjunto.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: O tipo variável do campo de Lista é inválido. A opção `widget` está definida como `{$widget}`, mas tem de ser `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: O campo de Objeto não pode ter as opções `fields` e `types` em conjunto.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: A coleção `{$collection}` referenciada é inválida ou não está definida.
    relation_field_invalid_collection_file: O ficheiro `{$file}` referenciado é inválido ou não está definido.
    # Don’t localize `file`
    relation_field_missing_file_name: A opção `file` tem de estar definida para uma relação com uma coleção de ficheiros.
    relation_field_invalid_value_field: O campo de valor `{$field}` referenciado é inválido ou não está definido.
    unexpected: Erro inesperado

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: O ID da aplicação OAuth não está definido. Os utilizadores têm de fornecer um token de acesso para iniciar sessão.
    editorial_workflow_unsupported: O fluxo de trabalho editorial ainda não é suportado no Sveltia CMS.
    nested_collections_unsupported: As coleções aninhadas ainda não são suportadas no Sveltia CMS.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: A opção `{$prop}` não é suportada no Sveltia CMS. Será ignorada.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Estão definidas tanto a opção `picker_utc` como as opções de fuso horário mais recentes (`input_timezone` ou `output_utc`). As novas opções têm precedência. Considere remover `picker_utc` da sua configuração.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Consulte as notas de compatibilidade para mais detalhes: {$link}'

  # Console tip shown after config load
  schema_tip: Para uma melhor experiência de programação, pode validar o seu ficheiro de configuração com o esquema JSON do Sveltia CMS. Consulte {$link} para mais detalhes.

