local_git_skip_reasons:
  unsupported_repository: O seu repositório utiliza uma funcionalidade do Git que o CMS não suporta, como uma worktree ligada, nomes de objetos SHA-256, o formato reftable, um índice esparso ou um índice na versão 3 ou 4, que a opção feature.manyFiles e git add -N utilizam.
  missing_identity: O seu nome e endereço de e-mail não estão definidos na configuração do Git do repositório, e o CMS não consegue ler a sua configuração global. Defina-os no repositório com git config --local user.name "O Seu Nome" e git config --local user.email "you@example.com".
