# Read https://github.com/sveltia/sveltia-cms/blob/main/src/lib/locales/README.md
# for instructions on how to add new languages or update existing translations.

# ==============================================================================
# Common Actions
# ==============================================================================
# Generic action button labels used throughout the application. These are
# reusable strings for common operations like save, delete, cancel, etc.

# Primary actions: creation, selection, and file operations
create: Novo
select: Selecionar
select_all: Selecionar tudo
# Accessible name of the checkbox that selects a single entry or asset in a list
select_item: Selecionar {$name}
upload: Carregar
copy: Copiar
download: Transferir
duplicate: Duplicar
delete: Eliminar
reorder: Reordenar

# Dialog and form actions: confirmation and cancellation
cancel: Cancelar
done: Concluído
save: Guardar
# Progress indicator shown on the save button while a save operation is in progress
saving: A guardar…

# Publishing actions: used when committing changes to the repository
publish: Publicar
# Progress indicator shown on the publish button during publishing
publishing: A publicar…

# Modification actions: editing and updating content
rename: Mudar o nome
update: Atualizar
replace: Substituir

# List and collection actions: adding and removing items
add: Adicionar
remove: Remover
clear: Limpar

# Expansion and collapse actions: used for accordions, trees, and expandable sections
expand: Expandir
expand_all: Expandir tudo
collapse: Recolher
collapse_all: Recolher tudo

# Content manipulation: inserting, restoring, and discarding
insert: Inserir
restore: Restaurar
discard: Descartar

# ==============================================================================
# Common UI Elements
# ==============================================================================
# Reusable labels and messages for common interface elements like status
# indicators, loading states, and toolbar regions.

# Status messages: search and results indicators
# Shown in ARIA live regions during search operations
searching: A pesquisar…
no_results: Nenhum resultado encontrado.

# Toolbar region labels: used as aria-labels for different toolbar areas
# These help screen readers identify which toolbar is being navigated
global: Global
primary: Principal
secondary: Secundário
collection: Coleção
folder: Pasta
# Label of the subfolder list in the asset picker
folders: Pastas
# Menu in a breadcrumb holding the folders that don’t fit
more_folders: Mais pastas

# ==============================================================================
# Miscellaneous Labels
# ==============================================================================
# Various labels used across the application for specific UI elements
# that don’t fit into other categories.

# Field and input labels
api_key: Chave de API
details: Detalhes
back: Voltar
# Reusable label for an option whose value is determined automatically, e.g. the UI language
automatic: Automático
# Loading indicator shown during async operations (asset preview, panels, etc.)
loading: A carregar…
# Dismiss button for temporary notifications and infobars
later: Mais tarde

# Entry and collection labels
# Slug field heading in entry editors
slug: Slug
# Fallback labels for singleton collections when names aren’t configured
singleton: Ficheiro único
singletons: Ficheiros únicos

# Error messages
# Toast notification when clipboard operations fail
clipboard_error: Não foi possível copiar para a área de transferência.

# ==============================================================================
# Sign-In Page
# ==============================================================================
# Strings specific to the authentication and sign-in page, including welcome
# messages, loading states, OAuth flows, and repository access options.

# Welcome and branding
# Screen reader announcement when the sign-in page loads
# {$name} is the app title shown on the sign-in screen, Sveltia CMS by default
welcome_message: Bem-vindo ao {$name}
# Footer text with CMS branding
# {$name} is the CMS brand name shown in the footer, Sveltia CMS by default
powered_by: Desenvolvido por {$name}

# Shown during initial configuration and data loading
unsupported_browser_error: O seu navegador não é suportado. Atualize-o para a versão mais recente ou utilize outro navegador.
loading_cms_config: A carregar a configuração do CMS…
loading_site_data: A carregar os dados do site…
loading_site_data_error: Ocorreu um erro ao carregar os dados do site.

# OAuth and token authentication
# Primary sign-in button label for OAuth providers (GitHub, GitLab, etc.)
# {$service} is the sign-in provider label, such as GitHub or GitLab
sign_in_with_x: Iniciar sessão com {$service}

# Access token dialog: alternative authentication method
sign_in_using_access_token: Iniciar sessão com token de acesso
sign_in_using_access_token_description: Introduza o seu token abaixo. Tem de ter acesso de leitura/escrita ao conteúdo do repositório.
# Shown after the description above when Editorial Workflow is enabled, which opens and merges pull requests
sign_in_using_access_token_workflow_note: Uma vez que o fluxo de trabalho editorial está ativado, também tem de ter acesso de leitura/escrita aos pull requests.
# Inline link text with embedded HTML anchor tag
# {$service} is the provider name whose user settings page contains the token generator, e.g., GitHub or GitLab
sign_in_using_access_token_link: Pode gerar um token na <a>página de definições de utilizador do {$service}</a>.
# Input field label for personal access token
personal_access_token: Token de acesso pessoal

# Authentication progress indicators
authorizing: A autorizar…
signing_in: A iniciar sessão…

# Local and test repository options
# Button label and description for working with a local Git repository
work_with_local_repo: Trabalhar com repositório local
# {$repo} is the configured repository name shown when it is available
work_with_local_repo_description: Quando lhe for pedido, selecione o diretório raiz do repositório «{$repo}».
work_with_local_repo_description_no_repo: Quando lhe for pedido, selecione o diretório raiz do seu repositório Git.
# Button label for demo/test repository
work_with_test_repo: Trabalhar com repositório de teste
# Button label for the test repository when sample content is seeded, e.g. on a demo site
start_demo: Iniciar demonstração
# Shown below the disabled test repository option in a browser that can’t save files to its
# storage, e.g. Safari before version 26
test_repo_unsupported_browser: O seu navegador não consegue guardar os ficheiros do repositório de teste. Atualize-o para a versão mais recente ou utilize outro navegador.

# Authentication errors
# Error messages shown during sign-in failures
sign_in_error:
  not_project_root: A pasta selecionada não é o diretório raiz de um repositório. Tente novamente.
  picker_dismissed: Não foi possível selecionar um diretório raiz de repositório. Tente novamente.
  authentication_aborted: Autenticação cancelada. Tente novamente.
  invalid_token: O token fornecido é inválido. Verifique-o e tente novamente.
  # OAuth and authenticator errors (shown with error codes) — keys are defined in the Sveltia CMS Authenticator library
  UNSUPPORTED_BACKEND: O seu backend Git não é suportado pelo autenticador.
  UNSUPPORTED_DOMAIN: O seu domínio não tem autorização para utilizar o autenticador.
  MISCONFIGURED_CLIENT: O ID de cliente ou o segredo da aplicação OAuth não está definido.
  AUTH_CODE_REQUEST_FAILED: Não foi possível receber um código de autorização. Tente novamente mais tarde.
  CSRF_DETECTED: Foi detetado um potencial ataque CSRF. Fluxo de autenticação cancelado.
  TOKEN_REQUEST_FAILED: Não foi possível pedir um token de acesso. Tente novamente mais tarde.
  TOKEN_REFRESH_FAILED: Não foi possível renovar o token de acesso. Tente novamente mais tarde.
  MALFORMED_RESPONSE: O servidor respondeu com dados malformados. Tente novamente mais tarde.

# Backend and repository validation errors
# Shown when the configured backend or repository is invalid or inaccessible
# {$name} is the backend display name like Forgejo and {$version} is the minimum supported version
backend_unsupported_version: O backend {$name} requer o {$name} {$version} ou posterior.
# {$repo} is the repository identifier, typically in owner/repo format
repository_no_access: Não tem acesso ao repositório «{$repo}».
# {$repo} is the repository identifier, typically in owner/repo format
repository_no_write_access: Não tem acesso de escrita ao repositório «{$repo}».
repository_not_found: O repositório «{$repo}» não existe.
repository_empty: O repositório «{$repo}» não tem ramos.
# {$repo} is the repository identifier, and {$branch} is the configured branch name
branch_not_found: O repositório «{$repo}» não tem o ramo «{$branch}».
# {$repo} is the repository identifier, and {$dir} is the configured root directory
root_dir_not_found: O diretório raiz «{$dir}» não existe no repositório «{$repo}».

# General errors
# Fallback error dialog title for unexpected errors
unexpected_error: Erro inesperado
# Shown in place of the page when an unexpected error stops it from being displayed
# {$message} is the error message
page_crashed: Ocorreu um problema e não é possível apresentar esta página. {$message}
# Shown in place of a field editor or preview when an unexpected error stops it from being displayed
# {$message} is the error message
field_crashed: Ocorreu um problema e não é possível apresentar este campo. {$message}
# Button label for displaying a part of the page again after an unexpected error
try_again: Tentar novamente
# Button label for reloading the CMS after an unexpected error
reload_cms: Recarregar o CMS

# Entry file parsing errors
# Toast notification when entry files fail to parse on initial load
# {$count} is the number of entry files that failed to parse
entry_parse_errors: |
  .input {$count :integer}
  .match $count
    one {{ Ocorreu um erro ao analisar um ficheiro de entrada. Consulte a consola do navegador para mais detalhes. }}
    *   {{ Ocorreram erros ao analisar ficheiros de entrada. Consulte a consola do navegador para mais detalhes. }}

# ==============================================================================
# Authentication and Account
# ==============================================================================
# These strings are used for sign-in, account management, and authentication
# flows throughout the application.

# Sign-in page and external assets panel: credential input field aria-labels
username: Nome de utilizador
password: Palavra-passe

# Sign-in actions: primary button labels and account menu items
# Used on the sign-in page and in confirmation dialogs for external assets
sign_in: Iniciar sessão

# Mobile sign-in feature: dialog title and instructions for QR code authentication
sign_in_with_mobile: Iniciar sessão no telemóvel
# Instructions shown in the mobile sign-in dialog for passwordless authentication
sign_in_with_mobile_instruction: Leia o código QR abaixo com o seu telemóvel ou tablet para iniciar sessão sem palavra-passe. As suas definições serão copiadas automaticamente.
# Confirmation dialog shown when the CMS is opened with a sign-in link from the mobile sign-in
# QR code. {$account} is the account name, {$service} is the Git service name, e.g. GitHub
sign_in_with_link: Iniciar sessão com ligação
sign_in_with_link_confirmation: Esta ligação inicia sessão como {$account} no {$service} e copia as definições do dispositivo em que foi criada. Continue apenas se tiver sido o próprio a criar a ligação.

# Sign-in with Sveltia CMS Additions, which manages its own user accounts instead of the Git
# service’s. Don’t localize “Sveltia CMS Additions”
additions:
  username: Nome de utilizador
  password: Palavra-passe
  sign_in: Iniciar sessão
  new_password_title: Escolher uma nova palavra-passe
  new_password_description: Iniciou sessão com uma palavra-passe temporária. Escolha uma nova para continuar.
  new_password: Nova palavra-passe
  password_too_short: A palavra-passe é demasiado curta. Utilize pelo menos 12 caracteres.
  change_password: Alterar palavra-passe
  # {$name} is the user’s username, {$role} their role, e.g. Editor
  signed_in_as_x_with_role: Sessão iniciada como {$name} ({$role})
  link_github: Associar conta do GitHub
  link_github_error: Não foi possível associar a conta do GitHub
  current_password: Palavra-passe atual
  # {$username} is the username filled in from a magic link emailed to the user
  filled_from_link: O nome de utilizador e a palavra-passe foram preenchidos a partir de uma ligação. Inicie sessão apenas se «{$username}» for o seu nome de utilizador.
  change_password_description: Irá manter a sessão iniciada aqui e a sessão será terminada nos seus outros dispositivos.
  password_changed: A sua palavra-passe foi alterada.
  # The Account settings panel of a Sveltia CMS Additions user
  account:
