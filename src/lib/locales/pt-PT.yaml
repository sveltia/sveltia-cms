# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: Este campo é obrigatório.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: A data/hora tem de ser igual ou posterior a {$min}.
    date: A data tem de ser igual ou posterior a {$min}.
    time: A hora tem de ser igual ou posterior a {$min}.
    number: O valor tem de ser maior ou igual a {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Tem de selecionar pelo menos {$min} opção. }}
        *   {{ Tem de selecionar pelo menos {$min} opções. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Tem de adicionar pelo menos {$min} item. }}
        *   {{ Tem de adicionar pelo menos {$min} itens. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: A data/hora tem de ser igual ou anterior a {$max}.
    date: A data tem de ser igual ou anterior a {$max}.
    time: A hora tem de ser igual ou anterior a {$max}.
    number: O valor tem de ser menor ou igual a {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ Não pode selecionar mais do que {$max} opção. }}
        *   {{ Não pode selecionar mais do que {$max} opções. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ Não pode adicionar mais do que {$max} item. }}
        *   {{ Não pode adicionar mais do que {$max} itens. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Tem de introduzir pelo menos {$min} caráter. }}
      *   {{ Tem de introduzir pelo menos {$min} caracteres. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ Não pode introduzir mais do que {$max} caráter. }}
      *   {{ Não pode introduzir mais do que {$max} caracteres. }}

  # Type validation errors
  type_mismatch:
    number: Introduza um número.
    email: Introduza um endereço de e-mail válido.
    url: Introduza um URL válido.

  # Custom field validation error
  invalid_value: Valor inválido.
  unexpected_error: Ocorreu um erro inesperado.

