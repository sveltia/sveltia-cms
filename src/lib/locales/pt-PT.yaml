  # The operation in progress, with how to finish or cancel it
  operation_in_progress:
    merge: Está a decorrer um merge. Conclua-o com git commit ou cancele-o com git merge --abort.
    rebase: Está a decorrer um rebase. Conclua-o com git rebase --continue ou cancele-o com git rebase --abort. Se já tiver avançado, git rebase --quit descarta-o sem alterar os seus ficheiros.
    cherry_pick: Está a decorrer um cherry-pick. Conclua-o com git cherry-pick --continue ou cancele-o com git cherry-pick --abort.
    revert: Está a decorrer um revert. Conclua-o com git revert --continue ou cancele-o com git revert --abort.
    am: Está a decorrer a aplicação de patches com git am. Conclua-a com git am --continue ou cancele-a com git am --abort.
    conflict: Alguns ficheiros têm conflitos. Resolva-os e prepare primeiro os resultados para commit (stage).
  detached_head: Não há nenhum ramo ativo (checkout).
  staged_changes: Tem outras alterações preparadas para commit. Faça commit delas ou retire-as da área de preparação primeiro.
