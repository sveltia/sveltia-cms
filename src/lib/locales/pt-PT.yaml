# Strings for specific field widget types.

# Color field: opacity slider
opacity: Opacidade

# Select field: empty option placeholder
unselected_option: (Nenhuma)

# Relation field: creating or editing a referenced entry without leaving the editor
relation_field:
  # Note shown in the dialog. {$name} is the singular label of the referenced collection
  save_together_hint: A nova entrada de {$name} será guardada juntamente com a entrada que está a editar.
  # Error shown when the entry couldn’t be prepared. {$name} is the singular label of the collection
  add_failed: Não foi possível adicionar a entrada de {$name}. Consulte a consola do navegador para mais detalhes.
  # Title of the dialog to edit an entry selected in the field. {$name} is the singular label of the
  # referenced collection
  edit_entry_title: A editar {$name}
  # Note shown in the dialog. {$name} is the singular label of the referenced collection
  edit_together_hint: As suas alterações à entrada de {$name} serão guardadas juntamente com a entrada que está a editar.
  # Error shown when the changes couldn’t be prepared. {$name} is the singular label of the collection
  edit_failed: Não foi possível aplicar as alterações à entrada de {$name}. Consulte a consola do navegador para mais detalhes.
  # Error shown when the changes would move the entry to another file path, e.g. through a path
  # template using a field. {$name} is the singular label of the collection
  move_unsupported: Estas alterações moveriam a entrada de {$name} para outra localização, o que só pode ser feito editando-a separadamente.
  # Error shown when saving, if someone else has changed an entry edited from the field since. {$name}
  # is the summary of that entry
  edit_conflict: «{$name}» foi alterado por outra pessoa desde que o editou. Abra-o novamente a partir do campo para rever as suas alterações em relação à versão mais recente.
  # Error shown when saving, if someone else has deleted an entry edited from the field since.
  # {$name} is the summary of that entry
  edit_deleted: «{$name}» foi eliminado por outra pessoa desde que o editou. Remova-o do campo para guardar a entrada.
  # Accessible label of the menu listing the selected entries that can be edited
  select_entry_to_edit: Selecionar uma entrada para editar
  # Warning shown in the editor of an entry that has been edited from a Relation field of another
  # entry, while the changes wait in that entry’s pull request. {$name} is the summary of that
  # entry
  edited_with_entry: As alterações a esta entrada aguardam publicação juntamente com «{$name}». Se a guardar agora, os dois conjuntos de alterações serão combinados quando essa entrada for publicada, o que poderá falhar se se sobrepuserem.
  # Warning shown in the dialog when an entry edited from the field has been changed by someone else
  # since. {$name} is the singular label of the collection
  changed_since_edit: Esta entrada de {$name} foi alterada por outra pessoa desde que a editou. As suas alterações são apresentadas sobre a versão mais recente. Reveja-as antes de atualizar.

