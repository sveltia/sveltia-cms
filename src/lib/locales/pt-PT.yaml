    # Don’t localize `i18n`
    i18n_not_configured: A opção `i18n` está ativada, mas a i18n não está configurada ao nível superior da configuração nem na coleção, pelo que a opção não tem efeito.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: A opção `public_folder` é uma cadeia de caracteres vazia, pelo que é utilizado o caminho `media_folder` para os caminhos dos recursos guardados nas entradas. Remova a opção ou defina-a com o caminho que pretende utilizar, como `/images`.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: A opção `{$option}` não está definida no esquema de configuração do Sveltia CMS. Será ignorada. Verifique se há um erro de escrita ou de sintaxe.
    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: A opção `default_localized` não tem efeito, porque a i18n não está ativada para a coleção. Em vez disso, utilize a opção `default`.
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: A opção `default_localized` tem um valor para `{$locale}`, que não é um dos idiomas da coleção, pelo que o valor nunca é utilizado.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Consulte as notas de compatibilidade para mais detalhes: {$link}'

  # Console tip shown after config load
  schema_tip: Para uma melhor experiência de programação, pode validar o seu ficheiro de configuração com o esquema JSON do Sveltia CMS. Consulte {$link} para mais detalhes.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Local
  # Browser compatibility warnings
  unsupported_browser: O fluxo de trabalho local não é suportado no seu navegador. Utilize antes o Chrome ou o Edge.
  disabled: O fluxo de trabalho local está desativado no seu navegador. <a>Saiba como o ativar</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Está agora a ver o quadro do fluxo de trabalho editorial. Rascunhos: {$draft}. Em revisão: {$review}. Prontos: {$ready}. Eliminação pendente: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Está agora a ver o quadro do fluxo de trabalho editorial. Rascunhos: {$draft}. Em revisão: {$review}. Eliminação pendente: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'Está agora a ver o quadro do fluxo de trabalho editorial. Rascunhos: {$draft}. Prontos: {$ready}. Eliminação pendente: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'Está agora a ver a página de rascunhos. Rascunhos: {$draft}. Eliminação pendente: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Rascunho
  drafts: Rascunhos
  in_review: Em revisão
  ready: Pronto
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Eliminação pendente
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: Em implementação

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Cancelar eliminação
  confirm_cancelling_deletion: Tem a certeza de que pretende cancelar esta eliminação? A entrada continuará publicada.
  confirm_completing_deletion: Tem a certeza de que pretende eliminar esta entrada? Será removida de imediato.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ Entrada marcada para eliminação. }}
      *   {{ {$count} entradas marcadas para eliminação. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Alterações descartadas. }}
      *   {{ Alterações em {$count} entradas descartadas. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: A cancelar a eliminação…
  deletion_cancelled: Eliminação cancelada.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Não foi possível cancelar a eliminação. Tente novamente.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Entradas não publicadas
  published_entries: Entradas publicadas
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Estado: {$status}'
  change_entry_status: Alterar estado da entrada
  # Editor toolbar: progress label while the status is being changed
  changing_status: A alterar o estado…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: A atualizar o estado…
  status_updated: Estado atualizado.
  # Error notification when the status could not be changed
  status_change_failed: Não foi possível alterar o estado. Tente novamente.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: Atualizar
  refreshing: A atualizar…
  refreshed: O quadro está atualizado.
  # Error notification when the board could not be refreshed
  refresh_failed: Não foi possível atualizar o quadro. Tente novamente.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: A entrada contém erros. Corrija-os antes de alterar o estado.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: A entrada contém erros. Corrija-os antes de a publicar.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Enviar para revisão
  confirm_sending_for_review: As suas alterações foram guardadas como rascunho. Pretende enviar a entrada para revisão para que alguém a possa analisar e publicar?
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: Marcar como pronto
  confirm_marking_as_ready: As suas alterações foram guardadas como rascunho. Pretende marcar a entrada como pronta para que possa ser publicada?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Publicar entrada
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Descartar alterações
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Tem a certeza de que pretende eliminar esta entrada? Só será removida quando a eliminação for publicada. Até lá, continuará a encontrá-la na lista de entradas, marcada como «Eliminação pendente».
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Esta entrada ainda não foi publicada, pelo que eliminá-la irá descartá-la por completo.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Esta entrada tem alterações não publicadas. Descartá-las irá restaurar a versão publicada. A entrada em si não será eliminada.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Ainda não foi publicada, pelo que as suas alterações não publicadas serão descartadas. Qualquer versão publicada continuará publicada. }}
      *   {{ Ainda não foram publicadas, pelo que as suas alterações não publicadas serão descartadas. Quaisquer versões publicadas continuarão publicadas. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ Uma delas ainda não foi publicada, pelo que as suas alterações não publicadas serão descartadas. Qualquer versão publicada continuará publicada. }}
      *   {{ {$count} delas ainda não foram publicadas, pelo que as suas alterações não publicadas serão descartadas. Quaisquer versões publicadas continuarão publicadas. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: Tem a certeza de que pretende publicar esta entrada? As suas alterações ficarão disponíveis no site depois de este ser reconstruído.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: A publicar a entrada…
  entry_published: Entrada publicada.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: A eliminar a entrada…
  discarding_changes: A descartar as alterações…
  entry_deleted: Entrada eliminada.
  # Error notification when publishing fails
  publishing_entry_failed: Não foi possível publicar a entrada. Tente novamente.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: Esta entrada não pode ser publicada aqui, porque inclui outras alterações que o CMS não lhe consegue mostrar. Peça a um programador que a reveja.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: A entrada foi alterada desde que a abriu. Recarregue a página para rever a versão mais recente antes de a publicar.
  review_on_x: Rever no {$service}
  from_fork: De um fork
  fork_entry_editable: Esta entrada provém de um pull request de um colaborador aberto a partir de «{$fork}». As suas alterações são guardadas no ramo dessa pessoa. Reveja e faça merge do pull request no serviço Git.
  fork_entry_locked: Esta entrada provém de um pull request de um colaborador aberto a partir de «{$fork}». O colaborador não permite que os responsáveis o editem, pelo que só pode ser visto aqui.
  fork_not_editable: O colaborador não permite que os responsáveis editem este pull request.
  fork_entry_gone: O pull request do colaborador já não está aberto, pelo que não é possível guardar as alterações nele.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: Já existe outro pedido ({$number}) aberto para esta entrada fora do CMS. Peça a um programador que o feche primeiro.
  # Workflow page: empty column message
  no_entries: Sem entradas.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Arraste para alterar o estado
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Eliminação
  # Workflow page: note on a card listing the new entries that were created from a Relation field
  # of the entry and are published along with it, e.g. “Also adds Section: Getting Started”
  companion_entries: Também adiciona {$entries}
  # Workflow page: note on a card listing the existing entries that were edited from a Relation
  # field of the entry and are published along with it, e.g. “Also changes Author: Ada Lovelace”
  edited_companion_entries: Também altera {$entries}
  # Workflow page: one of the entries listed by `companion_entries` or `edited_companion_entries`,
  # named by its collection’s singular label and its title
  companion_entry: '{$collection}: {$title}'

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: Mensagem de commit
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: Descreva as suas alterações. A mensagem é registada no histórico juntamente com elas.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: Adicione uma nota à mensagem registada no histórico juntamente com as suas alterações, como o número de um problema. Pode ficar em branco.
  # Accessible name of the text box when the user writes the whole message
  message: Mensagem de commit
  # Accessible name of the text box when the text is added before or after the message
  addition: Nota
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'Mensagem: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Criar fork do repositório
  fork: Criar fork
  confirm_forking_repository: Para sugerir alterações a «{$repo}», é necessário criar um fork do repositório na sua conta. As suas alterações são guardadas nesse fork e um responsável revê-as antes de serem publicadas.
  # Error shown when the user declined the dialog above
  fork_declined: Precisa de um fork do repositório na sua conta para sugerir alterações.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Não foi possível criar um fork do repositório «{$repo}» na sua conta.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: O seu fork «{$fork}» não tem o ramo «{$branch}». Atualize o fork a partir do repositório «{$repo}» e, em seguida, inicie sessão novamente.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Não foi possível verificar o seu acesso ao repositório «{$repo}». Tente novamente dentro de instantes.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: O repositório «{$repo}» não permite forks. Peça a um responsável que ative os forks para o repositório.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Tem um convite pendente para o repositório «{$repo}». Aceite-o no GitHub e volte a iniciar sessão.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: O seu início de sessão não inclui acesso a repositórios privados, pelo que o repositório «{$repo}» não pode ser lido. Peça a um responsável que verifique as definições de autenticação do CMS.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Só um responsável pode publicar alterações neste site. Em vez disso, marque a sua entrada como «Em revisão» e alguém irá analisá-la.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: Um responsável já publicou esta entrada, pelo que não há mais nada para rever.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Esta alteração não pode ser feita diretamente. Só as edições de entradas podem ser sugeridas para revisão.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: As suas alterações são guardadas no seu fork deste repositório, em «{$repo}», e revistas antes de serem publicadas.
  view_fork: Ver fork

# ==============================================================================
# Settings Dialog
# ==============================================================================
# Strings for the settings/preferences dialog and its panels.

# Settings page aria-label
categories: Categorias

# Preferences panels
prefs:
  account:
    title: Conta
  # API key management feedback messages
  changes:
    api_key_saved: Chave de API guardada.
    api_key_removed: Chave de API removida.
    api_key_invalid: A chave de API fornecida é inválida. Verifique-a e tente novamente.

  # Preferences operation errors
  error:
    permission_denied: O acesso ao armazenamento de cookies foi negado. Verifique as permissões do seu navegador e tente novamente.

  # Appearance panel
  appearance:
    title: Aspeto
    theme: Tema
    select_theme: Selecionar tema

  # Theme options
  theme:
    dark: Escuro
    light: Claro

  # Language panel
  language:
    title: Idioma
    ui_language:
      title: Idioma da interface
      select_language: Selecionar idioma

  # Contents panel
  contents:
    title: Conteúdos
    editor:
      title: Editor
      use_draft_backup:
        switch_label: Criar automaticamente cópias de segurança dos rascunhos das entradas
      close_on_save:
        switch_label: Fechar o editor depois de guardar um rascunho
      close_with_escape:
        switch_label: Fechar o editor com a tecla Escape

  # Internationalization panel
  i18n:
    title: Internacionalização
    translators:
      default:
        title: Serviço de tradução predefinido
        select_service: Selecionar serviço
      api_keys:
        title: Chaves de API dos serviços de tradução
        description: Faça a gestão das chaves de API dos <a>serviços de tradução</a>. As chaves de API dos serviços de IA genéricos podem ser geridas nas definições de IA.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: Chave {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Registe-se no <a {$homeHref}>{$service}</a> e introduza aqui <a {$apiKeyHref}>a sua chave de API</a> para ativar a tradução rápida dos campos de texto das entradas.

  # Media panel
  media:
    title: Multimédia
    stock_photos:
      api_keys:
        title: Chaves de API dos serviços de fotografias de stock
        description: Faça a gestão das chaves de API dos <a>serviços de fotografias de stock</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: Chave de API {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Registe-se na <a {$homeHref}>API do {$service}</a> e introduza aqui <a {$apiKeyHref}>a sua chave de API</a> para inserir fotografias de stock gratuitas nos campos de imagem das entradas.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Fotografias fornecidas por {$service}
      no_services: Não há <a>serviços de fotografias de stock</a> definidos.
    cloud_storage:
      api_keys:
        title: Chaves de API dos serviços de armazenamento na nuvem
        description: Faça a gestão das chaves de API dos <a>serviços de armazenamento na nuvem</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: Chave de API {$service}
      no_services: Não há <a>serviços de armazenamento na nuvem</a> definidos.

  # AI panel
  ai:
    title: IA
    api_keys:
      title: Chaves de API dos serviços de IA
      description: Faça a gestão das chaves de API dos serviços de IA.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: Chave de API {$service}

  # Accessibility panel
  accessibility:
    title: Acessibilidade
    underline_links:
      title: Sublinhar ligações
      description: Mostrar o sublinhado nas ligações da pré-visualização da entrada e nas etiquetas da interface.
      switch_label: Sublinhar sempre as ligações

  # Data Management panel
  data:
    title: Gestão de dados
    clear_data:
      title: Limpar dados
      # Clear File Cache button
      file_cache:
        description: Eliminar o conteúdo dos ficheiros e as miniaturas de imagens guardados em cache localmente para libertar espaço de armazenamento ou resolver problemas causados por dados desatualizados.
        button_label: Limpar cache de ficheiros
        confirmation: O conteúdo dos ficheiros e as miniaturas de imagens guardados em cache localmente serão eliminados. Os seus rascunhos não guardados e as suas definições serão mantidos, e os dados eliminados serão transferidos ou gerados novamente conforme necessário. O CMS será recarregado quando terminar.
      # Erase All Data button
      all_data:
        description: Eliminar tudo o que o CMS guarda neste navegador, incluindo os ficheiros em cache, os rascunhos não guardados e as definições. O que já estiver guardado no seu repositório não será afetado.
        button_label: Apagar todos os dados
        confirmation: Todos os dados guardados neste navegador serão eliminados, incluindo o conteúdo dos ficheiros em cache, as miniaturas de imagens, os rascunhos não guardados, as definições e o estado de início de sessão. O seu repositório não será afetado, mas qualquer alteração que não tenha guardado será perdida e terá de iniciar sessão novamente. O CMS será recarregado quando terminar.

  # Developer panel
  developer:
    title: Programador
    developer_mode:
      title: Modo de programador
      description: Ativar algumas funcionalidades orientadas para programadores, incluindo registos detalhados na consola e menus de contexto nativos.
      switch_label: Ativar o modo de programador
    local_git:
      title: Commits do Git
      description: Faça commit das suas alterações no ramo atual do seu repositório local sempre que as guardar, tal como o CMS faz quando trabalha com um repositório remoto. Depois, pode rever os commits e fazer push com as suas ferramentas Git habituais.
      switch_label: Fazer commit das alterações no Git
      checking: A verificar o repositório…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Será feito commit das alterações no ramo {$branch} como {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Não é possível fazer commit das alterações neste momento. {$reason}
    deploy_hook:
      title: Hook de implementação
      description: Introduza o URL de um webhook a chamar quando acionar manualmente uma implementação ao selecionar Publicar alterações. Pode deixar em branco se estiver a utilizar o GitHub Actions ou o GitLab CI/CD.
      # Hook URL input
      url:
        field_label: URL do hook
        saved: URL do hook guardado.
        removed: URL do hook removido.
      # Authorization header input
      auth:
        field_label: Cabeçalho de autorização (por exemplo, Bearer <token>) (opcional)
        saved: Cabeçalho de autorização guardado.
        removed: Cabeçalho de autorização removido.

# ==============================================================================
# Keyboard Shortcuts
# ==============================================================================
# Action descriptions for the keyboard shortcuts dialog.

keyboard_shortcuts_:
