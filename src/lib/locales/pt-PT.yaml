# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Existe um erro na configuração do CMS. Resolva o problema e tente novamente. }}
      *   {{ Existem erros na configuração do CMS. Resolva os problemas e tente novamente. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: coleção {$collection}
    file: ficheiro {$file}
    component: componente {$component}
    # Don’t localize `{$field}`
    field: campo `{$field}`

  # Configuration error messages
  error:
    no_secure_context: O Sveltia CMS só funciona com URL HTTPS ou de localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ O URL do ficheiro de configuração tem de utilizar o protocolo HTTPS ou um endereço localhost. }}
        *   {{ Os URL dos ficheiros de configuração têm de utilizar o protocolo HTTPS ou endereços localhost. }}
    fetch_failed: Não foi possível obter o ficheiro de configuração.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: A resposta HTTP devolveu o estado {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Não foi possível obter o ficheiro de configuração. Para impedir o carregamento do ficheiro `config.yml`, adicione <a>`load_config_file: false`</a> ao objeto de configuração passado a `CMS.init()`.'
    parse_failed: Não foi possível analisar o ficheiro de configuração.
    parse_failed_invalid_object: O ficheiro de configuração não é um objeto JavaScript válido.
    parse_failed_unsupported_type: O ficheiro de configuração não é de um tipo de ficheiro válido. Apenas são suportados YAML, TOML e JSON.
    no_collection: As coleções não estão definidas.
    # Don’t localize `hide`
    no_visible_collection: Pelo menos uma coleção tem de estar visível. Verifique a opção `hide`.
    missing_backend: O backend não está definido.
    missing_backend_name: O nome do backend não está definido.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: O backend {$name} <a>não é suportado</a> no Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: O backend descontinuado {$name} <a>não é suportado</a> no Sveltia CMS.
    unsupported_custom_backend: Os backends personalizados <a>não são suportados</a> no Sveltia CMS.
    unsupported_backend_suggestion: Utilize antes um dos <a>backends suportados</a>.
    missing_repository: O repositório não está definido.
    invalid_repository: O repositório configurado é inválido. Tem de estar no formato «owner/repo».
    # Don’t localize `api_root`
    missing_api_root: A opção `api_root` não está definida. É obrigatória para o backend Forgejo.
    invalid_root_dir: O diretório raiz é inválido. Tem de ser um caminho dentro do repositório, sem «..».
    invalid_root_dir_branch: O diretório raiz não pode ser utilizado nos nomes dos ramos dos modos de publicação `editorial_workflow` e `preview`. Nenhuma parte do seu caminho pode começar por um ponto, terminar em «.lock» ou conter um espaço ou um caráter especial, como dois pontos ou um asterisco.
    path_outside_root_dir: O caminho «{$path}» aponta para fora do diretório raiz, onde o CMS não consegue listar ficheiros.
    oauth_implicit_flow: O método de autenticação configurado (fluxo implícito) não é suportado no Sveltia CMS. Utilize antes um <a>método de autenticação</a> diferente.
    github_pkce_unsupported: A autorização PKCE ainda não é suportada devido às limitações do GitHub. Utilize antes um <a>método de autenticação</a> diferente.
    additions_no_base_url: A opção `base_url` tem de ser o URL do seu serviço Sveltia CMS Additions.
    oauth_no_app_id: O ID da aplicação OAuth não está definido.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: A opção `open_authoring` requer o modo de publicação `editorial_workflow` ou `preview`. Consulte a <a>documentação</a> para mais detalhes.
    # Don’t localize `auth_methods`
    no_auth_methods: A opção `auth_methods` tem de conter pelo menos um método.
    # Don’t localize `auth_scope`, `repo` and `public_repo`
    auth_scope_no_repo: A opção `auth_scope` tem de incluir `repo` ou `public_repo`.
    missing_media_folder: A pasta de multimédia não está definida.
    public_folder_relative_path: A pasta pública configurada é inválida. Tem de ser um caminho absoluto que comece por «/».
    public_folder_absolute_url: Um URL absoluto para a opção da pasta pública não é suportado no Sveltia CMS.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: A opção `{$option}` contém a etiqueta de modelo `{$tag}`, que não é suportada aí. Só podem ser utilizadas as etiquetas de modelo de slug, como `\{\{slug\}\}` e `\{\{year\}\}`, e as etiquetas `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` e `\{\{public_folder\}\}`.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: A opção `{$option}` contém a etiqueta de modelo `{$tag}`, que só pode ser utilizada na opção de uma coleção, de um ficheiro de coleção ou de um campo, onde existe uma entrada com que a preencher.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: A opção `sanitize_replacement` está definida como `{$replacement}`, mas contém um caráter que não pode ser utilizado num slug, pelo que não pode substituir outros caracteres.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: A opção `{$option}` está definida como `{$url}`, mas tem de ser um URL absoluto que comece por `https://` ou `http://`.
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: A opção `stages` de `publish_mode` tem de começar por `draft` e listar as fases pela ordem `draft`, `pending_review`, `pending_publish`, sem repetir nenhuma.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: A opção `i18n.locales` tem de listar pelo menos um idioma.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: A opção `default_locale` está definida como `{$locale}`, mas este não é um dos `locales`.
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: A opção `initial_locales` contém `{$locale}`, mas este não é um dos `locales`.
    # Don’t localize `i18n`
    i18n_no_collections: 'A opção `i18n` está configurada ao nível superior, mas nenhuma das coleções ou ficheiros únicos tem a opção `i18n`, pelo que nenhum conteúdo pode ser traduzido. Adicione `i18n: true` às coleções e ficheiros únicos a traduzir.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: A opção `transformations` contém uma chave `{$key}` não suportada. Tem de ser `raster_image`, `svg` ou um formato de imagem raster suportado.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: A opção `quality` da transformação `{$key}` é inválida. Tem de ser um número inteiro entre 0 e 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: A opção `{$prop}` da transformação `{$key}` é inválida. Tem de ser um número inteiro positivo.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: A coleção de recursos {$count} tem de ter a opção `name` definida como uma cadeia de caracteres não vazia.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: O nome da coleção de recursos `{$name}` é inválido. Não pode conter caracteres especiais.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Os nomes das coleções de recursos têm de ser únicos, mas `{$name}` é utilizado mais do que uma vez.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: A coleção tem de ter definida a opção `folder`, `file`, `files` ou `divider`.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: A coleção não pode ter mais do que uma das opções `folder`, `file`, `files` e `divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: A extensão `{$extension}` não corresponde ao formato `{$format}`.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: O campo `{$name}` é guardado como corpo abaixo do front matter, que só pode conter texto, e não um número, um valor booleano, uma lista ou um objeto, como acontece com um campo `{$widget}`. Utilize um tipo de campo que contenha texto ou mude o nome do campo.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
    # brackets are escaped with backslashes for MessageFormat 2
    invalid_collection_data_file: A opção `file` `{$file}` é inválida. Tem de ser o caminho para um ficheiro JSON, sem o marcador de posição `\{\{locale\}\}`.
    # {$prop} is the option name; Don’t localize `file`
    unsupported_collection_data_file_option: A opção `{$prop}` não é suportada numa coleção com a opção `file`.
    # Don’t localize `file`, `publish_mode` and `simple`
    collection_data_file_workflow: O fluxo de trabalho editorial e o fluxo de trabalho de pré-visualização, incluindo a autoria aberta, não são suportados numa coleção com a opção `file`. Defina a opção `publish_mode` da coleção como `simple`.
    # {$prop} is the option name; Don’t localize `file` and `slug`. The curly brackets are escaped
    # with backslashes for MessageFormat 2
    collection_data_file_slug_tag: A opção `{$prop}` não pode conter a etiqueta `\{\{slug\}\}` numa coleção com a opção `file`, uma vez que o slug de uma entrada é a sua posição, que muda quando as entradas são reordenadas ou eliminadas. Em vez disso, utilize um campo com um valor único.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: O modelo de slug `{$slug}` é inválido porque não pode conter barras. Para organizar as entradas em subpastas, utilize a opção `path` em vez de `slug`.
    # {$name} is the field name from the configuration; Don’t localize `identifier_field`
    invalid_identifier_field: A opção `identifier_field` refere-se a `{$name}`, mas esse campo não está definido na coleção.
    # {$name} is the field name from the configuration; Don’t localize `filter`
    invalid_filter_field: A opção `filter` refere-se a `{$name}`, mas esse campo não está definido na coleção.
    # Don’t localize `filter`, `value` and `pattern`
    invalid_filter_no_condition: A opção `filter` tem de ter a opção `value` ou `pattern` com que comparar as entradas.
    # {$option} is an option name such as `slug` or `summary` and {$name} is the field name or template tag from the configuration
    option_field_not_found: A opção `{$option}` refere-se a `{$name}`, mas esse campo não está definido.
    # {$name} is the field name from the configuration and {$widget} is its field type; Don’t localize `thumbnail`
    thumbnail_field_not_media: A opção `thumbnail` refere-se a `{$name}`, mas tem de ser um campo Image ou File, e não um campo `{$widget}`.
    # Don’t localize `inline` or `multiple`
    invalid_inline_component_fields: O modo `inline` requer um único campo Boolean, Color, DateTime, Number, Relation, Select ou String. Um campo Relation ou Select não pode ter a opção `multiple` ativada.
    # {$option} is an option name such as `pattern` or `filter` and {$pattern} is the configured pattern
    invalid_regex: A opção `{$option}` contém uma expressão regular inválida, `{$pattern}`, que é ignorada.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: A opção `reorder` refere-se a um grupo de vista com o nome `{$name}`, mas esse grupo não está definido na opção `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit` and `fields`
    invalid_bulk_edit_field: A lista `fields` da opção `bulk_edit` refere-se a um campo com o nome `{$name}`, mas esse campo de nível superior não está definido na coleção.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit`, `fields` and `multiple`
    unsupported_bulk_edit_field: O campo `{$name}` da lista `fields` da opção `bulk_edit` não pode ser editado em massa. Só é suportado um campo Boolean, Color, DateTime, Number, Relation, Select ou String que não seja só de leitura, não tenha a opção `multiple` ativada e não seja definido automaticamente ao guardar.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: A opção `sortable_fields` refere-se a um campo com o nome `{$name}`, mas esse campo não está definido na coleção.
    # Don’t localize `sortable_fields` and `default_sort`
    multiple_sortable_field_defaults: Só um item da opção `sortable_fields` pode ter a opção `default_sort`.
    # {$option} is `table_columns` or `summary_fields`, and {$name} is the field name from the configuration
    invalid_table_column_field: A opção `{$option}` refere-se a um campo com o nome `{$name}`, mas esse campo não está definido na coleção.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: A opção `view_groups` refere-se a um campo com o nome `{$name}`, mas esse campo não está definido na coleção.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: A opção `view_filters` refere-se a um campo com o nome `{$name}`, mas esse campo não está definido na coleção.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: O grupo de vista {$count} tem de ter a opção `name` definida como uma cadeia de caracteres não vazia.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: O nome do grupo de vista `{$name}` é inválido. Não pode conter caracteres especiais.
