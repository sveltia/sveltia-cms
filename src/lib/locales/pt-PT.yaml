# Navigation: back links and list labels
back_to_collection: Voltar à coleção
collection_list: Lista de coleções
back_to_collection_list: Voltar à lista de coleções
asset_folder_list: Lista de pastas de recursos
back_to_asset_folder_list: Voltar à lista de pastas de recursos
# Back button shown in place of the one above while browsing a subfolder of an asset folder
back_to_parent_folder: Voltar à pasta superior

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: Resultados da pesquisa
# {$terms} is the current search query text
search_results_for_x: Resultados da pesquisa de «{$terms}»

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Está agora a ver os resultados da pesquisa de «{$terms}». Não foi possível encontrar entradas. }}
    one {{ Está agora a ver os resultados da pesquisa de «{$terms}». Encontrámos uma entrada. }}
    *   {{ Está agora a ver os resultados da pesquisa de «{$terms}». Encontrámos {$count} entradas. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Está agora a ver os resultados da pesquisa de «{$terms}». Não foi possível encontrar recursos. }}
    one {{ Está agora a ver os resultados da pesquisa de «{$terms}». Encontrámos um recurso. }}
    *   {{ Está agora a ver os resultados da pesquisa de «{$terms}». Encontrámos {$count} recursos. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ Nenhuma entrada }}
    one {{ {$count} entrada }}
    *   {{ {$count} entradas }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ Nenhum recurso }}
    one {{ {$count} recurso }}
    *   {{ {$count} recursos }}

# Empty state messages
no_files_found: Nenhum ficheiro encontrado.
no_entries_found: Nenhuma entrada encontrada.

# ==============================================================================
# Asset Management
# ==============================================================================
# Strings for uploading, editing, and managing assets (images, documents, etc.).

# Upload dialog: title and button label
upload_assets: Carregar novos recursos

# New Folder button and dialog in the Asset Library
new_folder: Nova pasta
new_folder_name: Nome da pasta
new_folder_create: Criar
# {$folder} is the path of the folder the new one will be created in, starting with a slash
new_folder_description: A nova pasta será criada em «{$folder}».
# Validation errors for the new folder name
new_folder_error:
  empty: O nome da pasta não pode estar vazio.
  invalid: O nome da pasta não pode conter barras nem começar por um ponto.
  # A name the CMS itself is usually served from, e.g. `admin` or `cms`
  reserved: Os ficheiros de uma pasta com este nome são só de leitura, uma vez que o próprio CMS é normalmente servido a partir dela.
  duplicate: Já existe aqui uma pasta ou um ficheiro com este nome.
# Progress and error messages while the folder is being created
creating_folder: A criar a pasta…
creating_folder_failed: Não foi possível criar a pasta.

# Menu on a folder in the Asset Library, and the Rename Folder and Delete Folder dialogs
folder_options: Opções da pasta
show_folder_options: Mostrar opções da pasta
rename_folder: Mudar o nome da pasta
delete_folder: Eliminar pasta
# Rename Folder dialog body text
# {$count} is the number of assets in the folder, which are moved along with it
enter_new_name_for_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Introduza um novo nome abaixo. }}
    one {{ Introduza um novo nome abaixo. O recurso da pasta será movido juntamente com ela e qualquer entrada que o utilize será atualizada. }}
    *   {{ Introduza um novo nome abaixo. Os {$count} recursos da pasta serão movidos juntamente com ela e quaisquer entradas que os utilizem serão atualizadas. }}
# Delete Folder confirmation
# {$name} is the folder name and {$count} is the number of assets in the folder
confirm_deleting_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Tem a certeza de que pretende eliminar a pasta vazia «{$name}»? }}
    one {{ Tem a certeza de que pretende eliminar a pasta «{$name}» e o recurso que contém? }}
    *   {{ Tem a certeza de que pretende eliminar a pasta «{$name}» e os {$count} recursos que contém? }}
# Progress and error messages while the folder is being renamed or deleted
renaming_folder: A mudar o nome da pasta…
renaming_folder_failed: Não foi possível mudar o nome da pasta.
deleting_folder: A eliminar a pasta…
deleting_folder_failed: Não foi possível eliminar a pasta.
# Asset Library and asset picker: notice shown when a cloud storage service holds more files than
# are listed at once
external_assets_truncated: Existem demasiados ficheiros no serviço para os listar a todos, pelo que alguns não são apresentados.

# Edit options menu: button and item labels
edit_options: Opções de edição
show_edit_options: Mostrar opções de edição
# Copy menu aria-label
copy_options: Opções de cópia
# Edit menu items with specific asset names
edit_asset: Editar recurso
# {$name} is the selected asset name
edit_x: Editar {$name}

# Asset text editor: switch for line wrapping
wrap_long_lines: Moldar linhas longas

# Move assets: dialog for moving assets to another folder in the repository
move: Mover
move_asset: Mover recurso
# Dialog title. {$name} is the asset name when a single asset is moved, and {$count} is the number of
# assets being moved
move_assets_title: |
  .input {$count :integer}
  .match $count
    one {{ Mover {$name} }}
    *   {{ Mover {$count} recursos }}
# Dialog body text. {$count} is the number of entries that currently use the assets
select_asset_move_destination: |
  .input {$count :integer}
  .match $count
    0   {{ Selecione a pasta de destino. }}
    one {{ Selecione a pasta de destino. Uma entrada que utiliza os recursos também será atualizada. }}
    *   {{ Selecione a pasta de destino. {$count} entradas que utilizam os recursos também serão atualizadas. }}
# Accessible label of the folder tree in the Move dialog
asset_move_destination: Pasta de destino
# Shown when the assets being moved are all in the selected folder already
assets_already_in_folder: |
  .input {$count :integer}
  .match $count
    one {{ O recurso já está nesta pasta. }}
    *   {{ Os recursos já estão nesta pasta. }}
# Shown when files with the same names exist in the selected folder. {$names} is a comma-separated
# list of file names
asset_move_conflict: 'Os seguintes ficheiros já existem nesta pasta: {$names}.'
moving_assets: A mover os recursos…
moving_assets_failed: Não foi possível mover os recursos.
# Warning shown when files have been moved off a cloud storage service, but the originals couldn’t
# be deleted from it
asset_move_cleanup_failed: Os ficheiros foram movidos, mas não foi possível eliminar os originais do serviço de armazenamento.
# Shown when files on a cloud storage service can’t be renamed or moved, because the entries using
# them can’t be updated, e.g. for an Open Authoring contributor. {$count} is the number of files
cannot_change_used_external_files: |
  .input {$count :integer}
  .match $count
    one {{ Não é possível mudar o nome deste ficheiro nem movê-lo, porque as entradas que o utilizam não podem ser atualizadas. }}
    *   {{ Não é possível mudar o nome destes ficheiros nem movê-los, porque as entradas que os utilizam não podem ser atualizadas. }}

# Rename asset: dialog and validation
rename_asset: Mudar o nome do recurso
# {$name} is the current asset name
rename_x: Mudar o nome de {$name}
# Dialog body text indicating how many entries reference this asset
# {$count} is the number of entries that currently reference the asset
enter_new_name_for_asset: |
  .input {$count :integer}
  .match $count
    0   {{ Introduza um novo nome abaixo. }}
    one {{ Introduza um novo nome abaixo. Uma entrada que utiliza o recurso também será atualizada. }}
    *   {{ Introduza um novo nome abaixo. {$count} entradas que utilizam o recurso também serão atualizadas. }}
# Validation errors for asset renaming
enter_new_name_for_asset_error:
  empty: O nome do ficheiro não pode estar vazio.
  character: O nome do ficheiro não pode conter caracteres especiais.
  duplicate: Este nome de ficheiro já é utilizado por outro recurso.
  # A name starting with a dot hides the file, which the CMS wouldn’t list any more
  leading_dot: O nome do ficheiro não pode começar por um ponto.
  # The name of a file next to the asset that isn’t an asset, like an entry file
  file_duplicate: Já existe aqui outro ficheiro com este nome.
  # The name of a folder next to the file
  folder_duplicate: Já existe aqui uma pasta com este nome.
# Shown while renaming a file whose name will be changed on saving, e.g. by the `slugify_filename`
# media library option
file_will_be_saved_as: O ficheiro será guardado como «{$name}».
# Confirmation dialog shown when the file extension is changed while renaming an asset
change_file_extension: Mudar a extensão do ficheiro
# {$oldExtension} and {$newExtension} are file extensions without a leading dot, e.g. png
confirm_file_extension_change:
  change: Tem a certeza de que pretende mudar a extensão de «.{$oldExtension}» para «.{$newExtension}»?
  add: Tem a certeza de que pretende adicionar a extensão «.{$newExtension}»?
  remove: Tem a certeza de que pretende remover a extensão «.{$oldExtension}»?
file_extension_change_warning: O ficheiro poderá não ser apresentado ou processado corretamente se a extensão não corresponder ao formato real do ficheiro.

# Replace asset: menu item and dialog title
replace_asset: Substituir recurso
# {$name} is the asset being replaced
replace_x: Substituir {$name}
# File/Image field: labels of the Replace and Remove buttons
replace_file: Substituir ficheiro
replace_image: Substituir imagem
remove_file: Remover ficheiro
remove_image: Remover imagem

# File selection prompts: drop zones and file pickers
# Browse prompt shown when drag-and-drop is unavailable on desktop and pointer devices
click_to_browse: Clique para procurar…
# Browse prompt shown on touch devices
tap_to_browse: Toque para procurar…
# Drop zone text with browse button
# {$count} is the number of files expected by the current picker mode
drop_files_or_click_to_browse: |
  .input {$count :integer}
  .match $count
    one {{ Largue um ficheiro aqui ou clique para procurar… }}
    *   {{ Largue ficheiros aqui ou clique para procurar… }}
# Partial drop zone text (ends with inline button)
# {$count} is the number of files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Largue um ficheiro aqui ou }}
    *   {{ Largue ficheiros aqui ou }}
# Image-specific drop zone text
# {$count} is the number of image files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_image_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Largue um ficheiro de imagem aqui ou }}
    *   {{ Largue ficheiros de imagem aqui ou }}

# File picker and clipboard actions used by upload controls
browse: Procurar
# Generic clipboard paste action used by non-image file fields
paste: Colar
# Clipboard paste action used by image fields
paste_image: Colar imagem

# Clipboard paste errors
no_image_in_clipboard: Nenhuma imagem encontrada na área de transferência.
clipboard_access_denied: Acesso à área de transferência negado.

# Drag-and-drop overlay text (shown while dragging)
# {$count} is the number of files expected by the current picker mode
drop_files_here: |
  .input {$count :integer}
  .match $count
    one {{ Largue um ficheiro aqui }}
    *   {{ Largue ficheiros aqui }}

# File type validation errors
unsupported_file_type: Tipo de ficheiro não suportado
# {$type} is the expected asset type label, such as image or document
dropped_file_type_mismatch: 'O ficheiro largado não é de um dos seguintes tipos: {$types}. Tente novamente.'
dropped_image_type_mismatch: 'O ficheiro largado não é suportado. Apenas é aceite uma imagem dos seguintes tipos: {$types}. Tente novamente.'

# File chooser button label
# {$count} is the number of files the picker allows the user to choose
choose_files: |
  .input {$count :integer}
  .match $count
    one {{ Escolher ficheiro }}
    *   {{ Escolher ficheiros }}

# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    one {{ Eliminar recurso }}
    *   {{ Eliminar recursos }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Eliminar recurso selecionado }}
    *   {{ Eliminar recursos selecionados }}
confirm_deleting_this_asset: Tem a certeza de que pretende eliminar este recurso?
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Tem a certeza de que pretende eliminar o recurso selecionado? }}
    *   {{ Tem a certeza de que pretende eliminar os {$count} recursos selecionados? }}
confirm_deleting_all_assets: Tem a certeza de que pretende eliminar todos os recursos?
# Note added to the confirmation when entries use the assets being deleted; the references are
# removed in the same commit. {$count} is the number of entries using them
deleting_referenced_assets_note: |
  .input {$count :integer}
  .match $count
    one {{ A referência numa entrada também será removida. }}
    *   {{ As referências em {$count} entradas também serão removidas. }}
# Shown in place of the confirmation when removing the references would leave a field in an entry
# invalid, e.g. a required Image field with nothing left, so the deletion is refused. The fields are
# listed below the message, each with the validation error it would have. {$count} is the number of
# assets being deleted
cannot_delete_referenced_assets: |
  .input {$count :integer}
  .match $count
    one {{ Não é possível eliminar este recurso, porque os seguintes campos das entradas que o utilizam deixariam de ser válidos sem ele. Atualize primeiro essas entradas. }}
    *   {{ Não é possível eliminar estes recursos, porque os seguintes campos das entradas que os utilizam deixariam de ser válidos sem eles. Atualize primeiro essas entradas. }}
# Error shown in the asset deletion dialog when the entries using the assets couldn’t be looked up,
# so the deletion can’t go ahead. {$count} is the number of assets being deleted
checking_asset_references_failed: |
  .input {$count :integer}
  .match $count
    one {{ Não foi possível verificar que entradas utilizam este recurso. Feche esta caixa de diálogo e tente novamente. }}
    *   {{ Não foi possível verificar que entradas utilizam estes recursos. Feche esta caixa de diálogo e tente novamente. }}

# Delete entries: dialog titles and confirmation messages
# {$count} is the number of entries targeted by the action
delete_entries: |
  .input {$count :integer}
  .match $count
    one {{ Eliminar entrada }}
    *   {{ Eliminar entradas }}
# {$count} is the number of selected entries
delete_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Eliminar entrada selecionada }}
    *   {{ Eliminar entradas selecionadas }}
confirm_deleting_this_entry: Tem a certeza de que pretende eliminar esta entrada?
confirm_deleting_this_entry_with_assets: Tem a certeza de que pretende eliminar esta entrada e os recursos associados?
# Error notification shown when an entry could not be deleted
deleting_entry_failed: Não foi possível eliminar a entrada. Tente novamente.
# {$count} is the number of selected entries
confirm_deleting_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Tem a certeza de que pretende eliminar a entrada selecionada? }}
    *   {{ Tem a certeza de que pretende eliminar as {$count} entradas selecionadas? }}
# {$count} is the number of selected entries whose associated assets would also be removed
confirm_deleting_selected_entries_with_assets: |
  .input {$count :integer}
  .match $count
    one {{ Tem a certeza de que pretende eliminar a entrada selecionada e os recursos associados? }}
    *   {{ Tem a certeza de que pretende eliminar as {$count} entradas selecionadas e os recursos associados? }}
confirm_deleting_all_entries: Tem a certeza de que pretende eliminar todas as entradas?
confirm_deleting_all_entries_with_assets: Tem a certeza de que pretende eliminar todas as entradas e os recursos associados?
# Note added to the confirmation when other entries reference the entries being deleted through
# Relation fields; the references are removed in the same commit. {$count} is the number of
# referencing entries
deleting_referenced_entries_note: |
  .input {$count :integer}
  .match $count
    one {{ A referência noutra entrada também será removida. }}
    *   {{ As referências noutras {$count} entradas também serão removidas. }}
# Shown in place of the confirmation when removing the references would leave a Relation field in
# another entry invalid, e.g. a required field with nothing selected, so the deletion is refused.
# The fields are listed below the message, each with the validation error it would have. {$count}
# is the number of entries being deleted
cannot_delete_referenced_entries: |
  .input {$count :integer}
  .match $count
    one {{ Não é possível eliminar esta entrada, porque os seguintes campos de outras entradas deixariam de ser válidos sem ela. Atualize primeiro essas entradas. }}
    *   {{ Não é possível eliminar estas entradas, porque os seguintes campos de outras entradas deixariam de ser válidos sem elas. Atualize primeiro essas entradas. }}

# ==============================================================================
# Entry Reordering
# ==============================================================================
# Strings for manually reordering entries via drag-and-drop.

# Reorder mode: toggle buttons
reorder_entries: Reordenar entradas
done_reordering_entries: Concluir a reordenação das entradas
cancel_reordering_entries: Cancelar a reordenação das entradas

# Reorder error message
saving_reorder_failed: Não foi possível guardar a nova ordem das entradas. Tente novamente.

# ==============================================================================
# Bulk Entry Editing
# ==============================================================================
# Strings for editing the fields of many entries at once in a table.

# Bulk edit mode: toggle buttons
bulk_edit_entries: Editar entradas em massa
save_bulk_edits: Guardar edições em massa
cancel_bulk_edits: Cancelar edições em massa

# Bulk edit table: column header of the entry titles
bulk_edit_entry: Entrada

# Bulk edit table: label of the table
bulk_edit_table: Editor em massa

# Bulk edit table: label of a cell input; {$field} is the field label, {$entry} is the entry title
bulk_edit_cell: '{$field} de {$entry}'

# Bulk edit status: number of changed fields
bulk_edit_count: |
  .input {$count :integer}
  .match $count
    0   {{ Sem alterações }}
    one {{ 1 alteração }}
    *   {{ {$count} alterações }}

# Bulk edit error messages
bulk_edit_invalid: Alguns dos valores não são válidos. Corrija os campos destacados e tente novamente.
saving_bulk_edits_failed: Não foi possível guardar as alterações. Tente novamente.

# Bulk edit: confirmation shown when leaving the mode with unsaved changes
discard_bulk_edits_confirm: Pretende descartar as alterações feitas às entradas?

# ==============================================================================
# File Upload and Processing
# ==============================================================================
# Strings for file upload dialogs, progress indicators, and validation.

# Processing indicator shown during file preparation
# {$count} is the number of files currently being processed
processing_files: |
  .input {$count :integer}
  .match $count
    one {{ A processar um ficheiro. Isto pode demorar algum tempo. }}
    *   {{ A processar ficheiros. Isto pode demorar algum tempo. }}

# Uploading section aria-label
uploading_files: A carregar ficheiros

# Replace file confirmation
# Dialog body when replacing an existing file
# {$name} is the existing file name that will be replaced
confirm_replacing_file: '«{$name}» será substituído por este ficheiro:'

# Upload confirmation with destination folder
# {$folder} is the destination folder label and {$count} is the number of files being uploaded
confirm_uploading_files: |
  .input {$count :integer}
  .match $count
    one {{ Este ficheiro será guardado na pasta «{$folder}»: }}
    *   {{ Estes {$count} ficheiros serão guardados na pasta «{$folder}»: }}

# File size validation
# Warning section for files exceeding size limits
oversized_files: Ficheiros demasiado grandes
# {$size} is the maximum allowed file size and {$count} is the number of oversized files
warning_oversized_files: |
  .input {$count :integer}
  .match $count
    one {{ Este ficheiro não pode ser carregado porque excede o tamanho máximo de {$size}. Reduza o tamanho ou selecione um ficheiro diferente. }}
    *   {{ Estes ficheiros não podem ser carregados porque excedem o tamanho máximo de {$size}. Reduza os tamanhos ou selecione ficheiros diferentes. }}

# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: Ficheiros inválidos
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    one {{ Este ficheiro não pode ser carregado porque está danificado ou o seu conteúdo não corresponde à extensão do ficheiro. Isto acontece frequentemente quando uma fotografia é renomeada em vez de ser convertida, por exemplo uma imagem HEIC guardada como ficheiro JPEG. Converta o ficheiro e tente novamente. }}
    *   {{ Estes ficheiros não podem ser carregados porque estão danificados ou o seu conteúdo não corresponde à extensão dos ficheiros. Isto acontece frequentemente quando as fotografias são renomeadas em vez de serem convertidas, por exemplo imagens HEIC guardadas como ficheiros JPEG. Converta os ficheiros e tente novamente. }}
# {$count} is the number of files that are not of a type the field accepts, even once transformed
# {$types} is the list of accepted file types, such as “.pdf or .txt”
warning_unsupported_files: |
  .input {$count :integer}
  .match $count
    one {{ Este ficheiro não pode ser carregado porque não é de um dos seguintes tipos: {$types}. }}
    *   {{ Estes ficheiros não podem ser carregados porque não são de um dos seguintes tipos: {$types}. }}
# {$count} is the number of files that are not of an image type the field accepts
# {$types} is the list of accepted image formats, such as “PNG or WebP”
warning_unsupported_image_files: |
  .input {$count :integer}
  .match $count
    one {{ Este ficheiro não pode ser carregado porque apenas é aceite uma imagem dos seguintes tipos: {$types}. }}
    *   {{ Estes ficheiros não podem ser carregados porque apenas são aceites imagens dos seguintes tipos: {$types}. }}

# File format validation when replacing an asset
# Warning section for replacement files that are in a different format
mismatched_files: Ficheiros de formato diferente
# {$name} is the name of the asset being replaced and {$count} is the number of mismatched files
warning_mismatched_files: |
  .input {$count :integer}
  .match $count
    one {{ Este ficheiro não pode substituir «{$name}» porque está num formato diferente. Converta o ficheiro para o mesmo formato e tente novamente. }}
    *   {{ Estes ficheiros não podem substituir «{$name}» porque estão num formato diferente. Converta os ficheiros para o mesmo formato e tente novamente. }}

# File name conflict resolution
# {$count} is the number of conflicting file names in the target folder
file_name_conflict_confirmation: |
  .input {$count :integer}
  .match $count
    one {{ Já existe um ficheiro com o mesmo nome nesta pasta. Pretende substituí-lo? }}
    *   {{ Já existem {$count} ficheiros com os mesmos nomes nesta pasta. Pretende substituí-los? }}
# {$name} is the conflicting file name when there is exactly one conflict; {$count} is the total conflict count
file_name_conflict_confirmation_with_name: |
  .input {$count :integer}
  .input {$name :string}
  .match $count
    one {{ Já existe um ficheiro com o nome «{$name}» nesta pasta. Pretende substituí-lo? }}
    *   {{ Já existem {$count} ficheiros com os mesmos nomes nesta pasta. Pretende substituí-los? }}
file_name_conflict_resolution: Resolução de conflitos de nomes de ficheiros
# Option to keep both files (rename the new one)
keep_both: Manter ambos

# Upload progress and error messages
uploading_files_progress: A carregar…
uploading_files_failed: O carregamento falhou.
# Errors shown when a file on a cloud storage service could not be deleted or renamed
deleting_assets_failed: Falha ao eliminar.
renaming_asset_failed: Falha ao mudar o nome.
# Error shown when an edited text file in the Asset Library could not be saved
saving_asset_failed: Falha ao guardar.

# File metadata display
# Appended when a file was auto-converted (e.g., HEIF to JPEG)
# {$type} is the original file type before conversion
file_meta_converted_from_x: (convertido de {$type})

# ==============================================================================
# Entry Management
# ==============================================================================
# Strings for creating and managing entries in collections

# Empty state messages
no_entries_created: Esta coleção ainda não tem entradas.
# Button to create first entry
create_new_entry: Criar nova entrada
# “Entry” option label in the create button menu
entry: Entrada

# Special entry types
# Fallback label for collection index files when no custom label is configured
index_file: Ficheiro de índice

# Empty state for file collections
