    github_connected: Ligado ao repositório «{$repo}» com a GitHub App «{$app}».
    connect_github: Ligar ao GitHub
    # {$step} is the number of the current step, {$total} the number of steps
    step_x_of_y: Passo {$step} de {$total}
    admin_exists: Existe uma conta de administrador.
    reset_admin_password: Repor palavra-passe de administrador
    setup_complete: A configuração está concluída. Inicie sessão com uma conta de administrador para gerir os utilizadores e as definições. Pode voltar aqui com o segredo de administrador em qualquer altura.
    manage_sites: Gerir outros sites
    back_to_setup: Voltar
    sites_title: Outros sites
    sites_description: Este serviço também pode servir outros sites, cada um com os seus próprios utilizadores, definições e GitHub App. Defina «base_url» na configuração do CMS de um site com o respetivo URL e, em seguida, configure o site aí com o segredo de administrador.
    no_sites: Ainda não existem outros sites.
    site_id: ID do site
    site_id_description: 1 a 32 letras minúsculas, algarismos e hífenes, por exemplo «acme». É apresentado no URL do site e não pode ser alterado.
    site_name_optional: Nome (opcional)
    add_site: Adicionar site
    # {$name} is the name of the site
