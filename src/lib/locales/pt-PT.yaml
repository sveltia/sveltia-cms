    taken_over: '{$name} assumiu o controlo desta entrada, pelo que agora só a pode ver.'
    take_over: Assumir o controlo
    unavailable: Os bloqueios de entradas não estão disponíveis, pelo que outra pessoa poderá estar a editar esta entrada ao mesmo tempo.
    # {$name} is the name of the person editing the entry
    being_edited_by_x: Em edição por {$name}
    # {$names} is a list of the other people who have the entry open in the editor
    also_open_by_x: Também aberta por {$names}
    # {$names} is a list of the people who have the entry open, besides anyone editing it
    open_by_x: Aberta por {$names}
  users:
    title: Utilizadores
    add_user: Adicionar utilizador
    edit_user: Editar utilizador
    add: Adicionar
    name: Nome
    username_description: Não é possível alterar o nome de utilizador depois de o utilizador ter sido adicionado.
    email_optional: E-mail (opcional)
    email_description: É utilizado nos commits que esta pessoa faz, para que o GitHub os possa associar à respetiva conta. Se não existir, é utilizado um endereço genérico.
