# ==============================================================================
# File Upload and Processing
# ==============================================================================
# Strings for file upload dialogs, progress indicators, and validation.

# Processing indicator shown during file preparation
# {$count} is the number of files currently being processed
processing_files: |
  .input {$count :integer}
  .match $count
    one {{ A processar um ficheiro. Isto pode demorar algum tempo. }}
    *   {{ A processar ficheiros. Isto pode demorar algum tempo. }}

# Uploading section aria-label
uploading_files: A carregar ficheiros

# Replace file confirmation
# Dialog body when replacing an existing file
# {$name} is the existing file name that will be replaced
confirm_replacing_file: '«{$name}» será substituído por este ficheiro:'

# Upload confirmation with destination folder
# {$folder} is the destination folder label and {$count} is the number of files being uploaded
confirm_uploading_files: |
  .input {$count :integer}
  .match $count
    one {{ Este ficheiro será guardado na pasta «{$folder}»: }}
    *   {{ Estes {$count} ficheiros serão guardados na pasta «{$folder}»: }}

# File size validation
# Warning section for files exceeding size limits
oversized_files: Ficheiros demasiado grandes
# {$size} is the maximum allowed file size and {$count} is the number of oversized files
warning_oversized_files: |
  .input {$count :integer}
  .match $count
    one {{ Este ficheiro não pode ser carregado porque excede o tamanho máximo de {$size}. Reduza o tamanho ou selecione um ficheiro diferente. }}
    *   {{ Estes ficheiros não podem ser carregados porque excedem o tamanho máximo de {$size}. Reduza os tamanhos ou selecione ficheiros diferentes. }}

# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: Ficheiros inválidos
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    one {{ Este ficheiro não pode ser carregado porque está danificado ou o seu conteúdo não corresponde à extensão do ficheiro. Isto acontece frequentemente quando uma fotografia é renomeada em vez de ser convertida, por exemplo uma imagem HEIC guardada como ficheiro JPEG. Converta o ficheiro e tente novamente. }}
    *   {{ Estes ficheiros não podem ser carregados porque estão danificados ou o seu conteúdo não corresponde à extensão dos ficheiros. Isto acontece frequentemente quando as fotografias são renomeadas em vez de serem convertidas, por exemplo imagens HEIC guardadas como ficheiros JPEG. Converta os ficheiros e tente novamente. }}

# File name conflict resolution
# {$count} is the number of conflicting file names in the target folder
file_name_conflict_confirmation: |
  .input {$count :integer}
  .match $count
    one {{ Já existe um ficheiro com o mesmo nome nesta pasta. Pretende substituí-lo? }}
    *   {{ Já existem {$count} ficheiros com os mesmos nomes nesta pasta. Pretende substituí-los? }}
# {$name} is the conflicting file name when there is exactly one conflict; {$count} is the total conflict count
file_name_conflict_confirmation_with_name: |
  .input {$count :integer}
  .input {$name :string}
  .match $count
    one {{ Já existe um ficheiro com o nome «{$name}» nesta pasta. Pretende substituí-lo? }}
    *   {{ Já existem {$count} ficheiros com os mesmos nomes nesta pasta. Pretende substituí-los? }}
