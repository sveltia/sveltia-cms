    username_description: O seu nome de utilizador não pode ser alterado.
    email: E-mail
    email_description: É utilizado nos commits que faz, para que o GitHub os possa associar à sua conta. Se não existir, é utilizado um endereço genérico. Apenas um administrador o pode alterar.
    change_name: Alterar nome
    name_changed: O seu nome foi alterado.
    password: Palavra-passe
    no_password: A sua conta só inicia sessão com o GitHub, pelo que não tem nenhuma palavra-passe para alterar. Um administrador pode atribuir-lhe uma ao repor a sua palavra-passe.
  setup:
    use_admin_secret: Utilizar segredo de administrador
    title: Configurar o Sveltia CMS Additions
    secret_description: Introduza o segredo de administrador definido nas definições do seu serviço Sveltia CMS Additions. Só é mantido neste separador durante a configuração.
    admin_secret: Segredo de administrador
    continue: Continuar
    back: Voltar ao início de sessão
    admin_title: Conta de administrador
    admin_create_description: Crie a primeira conta de administrador. Irá iniciar sessão com ela e gerir os outros utilizadores.
    admin_reset_description: Já existe uma conta de administrador. Para voltar a entrar, reponha aqui a palavra-passe de um administrador ou crie outro.
