local_git_skip_reasons:
  unsupported_repository: Reponuz CMS’in desteklemediği bir Git özelliği kullanıyor; örneğin bağlantılı bir worktree, SHA-256 nesne adları, reftable biçimi, seyrek (sparse) indeks veya feature.manyFiles seçeneği ile git add -N komutunun kullandığı 3 ya da 4 versiyonlu indeks.
  missing_identity: Adınız ve e-posta adresiniz reponun Git yapılandırmasında ayarlanmamış ve CMS genel yapılandırmanızı okuyamıyor. Bunları repoda git config --local user.name "Your Name" ve git config --local user.email "you@example.com" komutlarıyla ayarlayın.
  locked: Başka bir Git işlemi repoyu kullanıyor. Çalışan bir işlem yoksa .git/index.lock dosyasını silin.
  # The operation in progress, with how to finish or cancel it
  operation_in_progress:
    merge: Bir merge işlemi devam ediyor. git commit ile tamamlayın veya git merge --abort ile iptal edin.
    rebase: Bir rebase işlemi devam ediyor. git rebase --continue ile tamamlayın veya git rebase --abort ile iptal edin. Başka bir işe geçtiyseniz git rebase --quit, dosyalarınızı değiştirmeden işlemi bırakır.
    cherry_pick: Bir cherry-pick işlemi devam ediyor. git cherry-pick --continue ile tamamlayın veya git cherry-pick --abort ile iptal edin.
    revert: Bir revert işlemi devam ediyor. git revert --continue ile tamamlayın veya git revert --abort ile iptal edin.
    am: git am ile yama uygulama işlemi devam ediyor. git am --continue ile tamamlayın veya git am --abort ile iptal edin.
    conflict: Bazı dosyalarda çakışmalar var. Önce bunları çözün ve sonuçları stage’e ekleyin.
  detached_head: Checkout yapılmış bir branch yok.
  staged_changes: Commit için stage’e alınmış başka değişiklikleriniz var. Önce bunları commit edin veya stage’den çıkarın.
  # {$path} is the file path
  lfs: '{$path} Git LFS ile izleniyor ve CMS bu dosyaya commit yapamıyor.'
  # {$message} is the error message
  error: Beklenmeyen bir hata oluştu. {$message}

