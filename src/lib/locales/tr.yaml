# Move assets: dialog for moving assets to another folder in the repository
move: Taşı
move_asset: Medya Dosyasını Taşı
# Dialog title. {$name} is the asset name when a single asset is moved, and {$count} is the number of
# assets being moved
move_assets_title: |
  .input {$count :integer}
  .match $count
    one {{ {$name} Öğesini Taşı }}
    *   {{ {$count} Medya Dosyasını Taşı }}
# Dialog body text. {$count} is the number of entries that currently use the assets
select_asset_move_destination: |
  .input {$count :integer}
  .match $count
    0   {{ Taşınacak klasörü seçin. }}
    one {{ Taşınacak klasörü seçin. Medya dosyalarını kullanan bir içerik de güncellenecek. }}
    *   {{ Taşınacak klasörü seçin. Medya dosyalarını kullanan {$count} içerik de güncellenecek. }}
# Accessible label of the folder tree in the Move dialog
asset_move_destination: Hedef Klasör
# Shown when the assets being moved are all in the selected folder already
assets_already_in_folder: |
  .input {$count :integer}
  .match $count
    one {{ Medya dosyası zaten bu klasörde. }}
    *   {{ Medya dosyaları zaten bu klasörde. }}
# Shown when files with the same names exist in the selected folder. {$names} is a comma-separated
# list of file names
asset_move_conflict: 'Aşağıdaki dosyalar bu klasörde zaten var: {$names}.'
moving_assets: Medya dosyaları taşınıyor…
moving_assets_failed: Medya dosyaları taşınamadı.
