# List Controls: Sort, Filter, and Group
# ==============================================================================
# Strings for sorting, filtering, and grouping entries and assets in lists.

# Sort menu: button labels and options
sort: Sırala
sorting_options: Sıralama Seçenekleri
# Table view column labels for the entry metadata used as `{{…}}` template tags
table_column_keys:
  # The folder containing the entry file
  dirname: Klasör
  # The entry file name without the extension
  filename: Dosya Adı
  # The entry file extension
  extension: Uzantı
  # The enabled locales of the entry
  locales: Diller
# Sort key option labels
sort_keys:
  # No sorting; entries appear in their natural repository order
  none: Yok
  name: Ad
  slug: Slug
  # Sort by the last commit’s author name
  commit_author: Güncelleyen
  # Sort by the last commit date
  commit_date: Güncelleme tarihi
  # Sort by the date a file on a cloud storage service was last modified
  last_modified: Değiştirilme tarihi
  # Sort by file size
  size: Boyut
  # Sort by the entry’s computed summary text
  _summary: Özet
  # Manual order defined by the user via drag-and-drop
  _manual: Manuel
# Sort order labels used with field names
# Example: “Name, A to Z” or “Updated on, new to old”
# {$label} is the localized sort field label
ascending: '{$label}, A’dan Z’ye'
ascending_date: '{$label}, eskiden yeniye'
descending: '{$label}, Z’den A’ya'
descending_date: '{$label}, yeniden eskiye'
ascending_number: '{$label}, küçükten büyüğe'
descending_number: '{$label}, büyükten küçüğe'

# Filter menu: button labels and options
filter: Filtrele
filtering_options: Filtreleme Seçenekleri

# Group menu: button labels and options
group: Grupla
grouping_options: Gruplama Seçenekleri

# Asset type filter and group labels
type: Tür
all: Tümü
# Group option for the linked files, which can be hosted anywhere: the host name of the file’s URL
domain: Alan Adı
# Asset type labels
image: Görsel
video: Video
audio: Ses
document: Doküman
other: Diğer

# Toolbar toggles: show/hide panels
show_assets: Medya Dosyalarını Göster
hide_assets: Medya Dosyalarını Gizle
show_info: Bilgileri Göster
hide_info: Bilgileri Gizle

# Folder display labels when no specific path is configured
all_assets: Tüm Medya Dosyaları
global_assets: Genel Medya Dosyaları
# Virtual location listing the files that File/Image fields link to by URL, wherever they are hosted
linked_files: Bağlantılı Dosyalar
# Badge and message shown on a linked file that couldn’t be loaded, e.g. because it has been deleted
file_unavailable: Kullanılamıyor
file_unavailable_description: Bu dosya yüklenemedi. Taşınmış veya silinmiş olabilir.

# ==============================================================================
# Entry and Collection Actions
# ==============================================================================
# Strings related to creating, editing, and managing entries and collections.

# Message shown while entries are still being retrieved: in the entry editor, when it was opened
# with a direct link before all the data has been loaded, and on the Editorial Workflow page while
# the pull requests are being fetched. {$count} selects the form
loading_entries: |
  .input {$count :integer}
  .match $count
    one {{ İçerik yükleniyor… }}
    *   {{ İçerikler yükleniyor… }}
# Error message when entry cannot be found
entry_not_found: İçerik bulunamadı.

# Entry creation restrictions: tooltip and advisory messages
creating_entries_disabled_by_admin: Bu koleksiyonda yeni içerik oluşturma yönetici tarafından devre dışı bırakıldı.
# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: |
  .input {$quota :integer}
  .match $quota
    *   {{ {$quota} içerik sınırına ulaşıldığı için bu koleksiyona yeni içerik ekleyemezsiniz. }}
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$quota :integer}
  .input {$remaining :integer}
  .match $quota $remaining
    *   *   {{ Bu koleksiyon {$quota} içerik sınırına yaklaşıyor. Sadece {$remaining} içerik daha oluşturabilirsiniz. }}

# Read-only restrictions set with the `readonly` option: advisory messages
readonly_cms: CMS salt okunur modda. İçerikleri ve medya dosyalarını görüntüleyebilirsiniz ancak değişiklik yapamazsınız.
readonly_collection: Bu koleksiyon salt okunur. İçeriğini görüntüleyebilirsiniz ancak değişiklik yapamazsınız.
readonly_entry: Bu içerik salt okunur. Görüntüleyebilirsiniz ancak değişiklik yapamazsınız.
readonly_asset_folder: Bu klasör salt okunur. Medya dosyalarını görüntüleyebilirsiniz ancak değişiklik yapamazsınız.
readonly_branch: “{$branch}” branch’ine push yapma izniniz yok. Bu içeriği görüntüleyebilirsiniz ancak değişiklik yapamazsınız.
readonly_role: Yalnızca görüntüleme erişiminiz var. İçerikleri ve medya dosyalarını görüntüleyebilirsiniz ancak değişiklik yapamazsınız.
readonly_reference: İçerik salt okunur olduğu için referans kaldırılamıyor.
# {$entries} is a comma-separated list of entries, each shown as “Collection › Entry”
cannot_rename_referenced_entry: 'Aşağıdaki salt okunur içerikler bu içeriğe mevcut adıyla başvurduğu için içerik yeniden adlandırılamaz: {$entries}.'
# {$entries} is a comma-separated list of entries, each shown as “Collection › Entry”
cannot_move_referenced_asset: 'Aşağıdaki salt okunur içerikler bu medya dosyasını kullandığı için dosya taşınamaz veya yeniden adlandırılamaz: {$entries}.'

# Navigation: back links and list labels
back_to_collection: Koleksiyona Geri Dön
collection_list: Koleksiyon Listesi
back_to_collection_list: Koleksiyon Listesine Geri Dön
asset_folder_list: Medya Klasör Listesi
back_to_asset_folder_list: Medya Klasör Listesine Geri Dön
# Back button shown in place of the one above while browsing a subfolder of an asset folder
back_to_parent_folder: Üst Klasöre Geri Dön

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: Arama Sonuçları
# {$terms} is the current search query text
search_results_for_x: “{$terms}” için Arama Sonuçları

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Şu anda “{$terms}” için arama sonuçlarını görüntülüyorsunuz. Hiçbir içerik bulunamadı. }}
    *   {{ Şu anda “{$terms}” için arama sonuçlarını görüntülüyorsunuz. {$count} içerik bulundu. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Şu anda “{$terms}” için arama sonuçlarını görüntülüyorsunuz. Hiçbir medya dosyası bulunamadı. }}
    *   {{ Şu anda “{$terms}” için arama sonuçlarını görüntülüyorsunuz. {$count} medya dosyası bulundu. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ İçerik yok }}
    *   {{ {$count} içerik }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ Medya dosyası yok }}
    *   {{ {$count} medya dosyası }}

# Empty state messages
no_files_found: Dosya bulunamadı.
no_entries_found: İçerik bulunamadı.

# ==============================================================================
# Asset Management
# ==============================================================================
# Strings for uploading, editing, and managing assets (images, documents, etc.).

# Upload dialog: title and button label
upload_assets: Yeni Medya Dosyaları Yükle

# New Folder button and dialog in the Asset Library
new_folder: Yeni Klasör
new_folder_name: Klasör Adı
new_folder_create: Oluştur
# {$folder} is the path of the folder the new one will be created in, starting with a slash
new_folder_description: Yeni klasör “{$folder}” içinde oluşturulacak.
# Validation errors for the new folder name
new_folder_error:
  empty: Klasör adı boş olamaz.
  invalid: Klasör adı bölü çizgisi içeremez veya nokta ile başlayamaz.
  # A name the CMS itself is usually served from, e.g. `admin` or `cms`
  reserved: CMS genellikle bu ada sahip bir klasörden sunulduğu için bu klasördeki dosyalar salt okunurdur.
  duplicate: Burada bu ada sahip bir klasör veya dosya zaten var.
# Progress and error messages while the folder is being created
creating_folder: Klasör oluşturuluyor…
creating_folder_failed: Klasör oluşturulamadı.

# Menu on a folder in the Asset Library, and the Rename Folder and Delete Folder dialogs
folder_options: Klasör Seçenekleri
show_folder_options: Klasör Seçeneklerini Göster
rename_folder: Klasörü Yeniden Adlandır
delete_folder: Klasörü Sil
# Rename Folder dialog body text
# {$count} is the number of assets in the folder, which are moved along with it
enter_new_name_for_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Aşağıya yeni bir ad girin. }}
    one {{ Aşağıya yeni bir ad girin. Klasördeki medya dosyası da birlikte taşınacak ve onu kullanan içerikler güncellenecek. }}
    *   {{ Aşağıya yeni bir ad girin. Klasördeki {$count} medya dosyası da birlikte taşınacak ve bunları kullanan içerikler güncellenecek. }}
# Delete Folder confirmation
# {$name} is the folder name and {$count} is the number of assets in the folder
confirm_deleting_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Boş “{$name}” klasörünü silmek istediğinizden emin misiniz? }}
    one {{ “{$name}” klasörünü ve içindeki medya dosyasını silmek istediğinizden emin misiniz? }}
    *   {{ “{$name}” klasörünü ve içindeki {$count} medya dosyasını silmek istediğinizden emin misiniz? }}
# Progress and error messages while the folder is being renamed or deleted
renaming_folder: Klasör yeniden adlandırılıyor…
renaming_folder_failed: Klasör yeniden adlandırılamadı.
deleting_folder: Klasör siliniyor…
deleting_folder_failed: Klasör silinemedi.
# Asset Library and asset picker: notice shown when a cloud storage service holds more files than
# are listed at once
