# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    one {{ Medya Dosyasını Sil }}
    *   {{ Medya Dosyalarını Sil }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Seçili Medya Dosyasını Sil }}
    *   {{ Seçili Medya Dosyalarını Sil }}
confirm_deleting_this_asset: Bu medya dosyasını silmek istediğinizden emin misiniz?
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Seçilen medya dosyasını silmek istediğinizden emin misiniz? }}
    *   {{ Seçilen {$count} medya dosyasını silmek istediğinizden emin misiniz? }}
confirm_deleting_all_assets: Tüm medya dosyalarını silmek istediğinizden emin misiniz?
# Note added to the confirmation when entries use the assets being deleted; the references are
# removed in the same commit. {$count} is the number of entries using them
deleting_referenced_assets_note: |
  .input {$count :integer}
  .match $count
    one {{ Bir içerikteki bu dosyaya ait referans da kaldırılacak. }}
    *   {{ {$count} içerikteki bu dosyaya ait referanslar da kaldırılacak. }}
# Shown in place of the confirmation when removing the references would leave a field in an entry
# invalid, e.g. a required Image field with nothing left, so the deletion is refused. The fields are
# listed below the message, each with the validation error it would have. {$count} is the number of
# assets being deleted
cannot_delete_referenced_assets: |
  .input {$count :integer}
  .match $count
    one {{ Bu medya dosyası silinemez, çünkü onu kullanan içeriklerdeki aşağıdaki alanlar dosya olmadan artık geçerli olmayacak. Önce bu içerikleri güncelleyin. }}
    *   {{ Bu medya dosyaları silinemez, çünkü onları kullanan içeriklerdeki aşağıdaki alanlar dosyalar olmadan artık geçerli olmayacak. Önce bu içerikleri güncelleyin. }}
# Error shown in the asset deletion dialog when the entries using the assets couldn’t be looked up,
# so the deletion can’t go ahead. {$count} is the number of assets being deleted
checking_asset_references_failed: |
  .input {$count :integer}
  .match $count
    one {{ Bu medya dosyasını hangi içeriklerin kullandığı kontrol edilemedi. Bu iletişim kutusunu kapatıp tekrar deneyin. }}
    *   {{ Bu medya dosyalarını hangi içeriklerin kullandığı kontrol edilemedi. Bu iletişim kutusunu kapatıp tekrar deneyin. }}

# Delete entries: dialog titles and confirmation messages
# {$count} is the number of entries targeted by the action
delete_entries: |
  .input {$count :integer}
  .match $count
    one {{ İçeriği Sil }}
    *   {{ İçerikleri Sil }}
# {$count} is the number of selected entries
delete_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Seçili İçeriği Sil }}
    *   {{ Seçili İçerikleri Sil }}
confirm_deleting_this_entry: Bu içeriği silmek istediğinizden emin misiniz?
confirm_deleting_this_entry_with_assets: Bu içeriği ve ilişkili medya dosyalarını silmek istediğinizden emin misiniz?
# Error notification shown when an entry could not be deleted
deleting_entry_failed: İçerik silinemedi. Lütfen tekrar deneyin.
# {$count} is the number of selected entries
confirm_deleting_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Seçilen içeriği silmek istediğinizden emin misiniz? }}
    *   {{ Seçilen {$count} içeriği silmek istediğinizden emin misiniz? }}
# {$count} is the number of selected entries whose associated assets would also be removed
confirm_deleting_selected_entries_with_assets: |
  .input {$count :integer}
  .match $count
    one {{ Seçilen içeriği ve ilişkili medya dosyalarını silmek istediğinizden emin misiniz? }}
    *   {{ Seçilen {$count} içeriği ve ilişkili medya dosyalarını silmek istediğinizden emin misiniz? }}
confirm_deleting_all_entries: Tüm içerikleri silmek istediğinizden emin misiniz?
confirm_deleting_all_entries_with_assets: Tüm içerikleri ve ilişkili medya dosyalarını silmek istediğinizden emin misiniz?
# Note added to the confirmation when other entries reference the entries being deleted through
# Relation fields; the references are removed in the same commit. {$count} is the number of
# referencing entries
deleting_referenced_entries_note: |
  .input {$count :integer}
  .match $count
    one {{ Başka bir içerikteki bu içeriğe ait referans da kaldırılacak. }}
    *   {{ Diğer {$count} içerikteki bu içeriğe ait referanslar da kaldırılacak. }}
# Shown in place of the confirmation when removing the references would leave a Relation field in
# another entry invalid, e.g. a required field with nothing selected, so the deletion is refused.
# The fields are listed below the message, each with the validation error it would have. {$count}
