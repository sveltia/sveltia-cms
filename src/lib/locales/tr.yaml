  .input {$count :integer}
  .match $count
    one {{ Bu dosya şu türlerden biri olmadığı için yüklenemiyor: {$types}. }}
    *   {{ Bu dosyalar şu türlerden biri olmadığı için yüklenemiyor: {$types}. }}
# {$count} is the number of files that are not of an image type the field accepts
# {$types} is the list of accepted image formats, such as “PNG or WebP”
warning_unsupported_image_files: |
  .input {$count :integer}
  .match $count
    one {{ Yalnızca şu türlerdeki görseller kabul edildiği için bu dosya yüklenemiyor: {$types}. }}
    *   {{ Yalnızca şu türlerdeki görseller kabul edildiği için bu dosyalar yüklenemiyor: {$types}. }}

# File format validation when replacing an asset
# Warning section for replacement files that are in a different format
mismatched_files: Biçimi Uyuşmayan Dosyalar
# {$name} is the name of the asset being replaced and {$count} is the number of mismatched files
warning_mismatched_files: |
  .input {$count :integer}
  .match $count
    one {{ Bu dosya farklı bir biçimde olduğu için “{$name}” dosyasının yerine geçemez. Lütfen dosyayı aynı biçime dönüştürüp tekrar deneyin. }}
    *   {{ Bu dosyalar farklı bir biçimde olduğu için “{$name}” dosyasının yerine geçemez. Lütfen dosyaları aynı biçime dönüştürüp tekrar deneyin. }}

