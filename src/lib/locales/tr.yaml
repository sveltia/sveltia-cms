  add: “.{$newExtension}” uzantısını eklemek istediğinizden emin misiniz?
  remove: “.{$oldExtension}” uzantısını kaldırmak istediğinizden emin misiniz?
file_extension_change_warning: Uzantı dosyanın gerçek biçimiyle eşleşmiyorsa dosya doğru şekilde görüntülenmeyebilir veya işlenmeyebilir.

# Replace asset: menu item and dialog title
replace_asset: Medya Dosyasını Değiştir
# {$name} is the asset being replaced
replace_x: '{$name} Öğesini Değiştir'
# File/Image field: labels of the Replace and Remove buttons
replace_file: Dosyayı Değiştir
replace_image: Görseli Değiştir
remove_file: Dosyayı Kaldır
remove_image: Görseli Kaldır

