cannot_change_used_external_files: |
  .input {$count :integer}
  .match $count
    one {{ Bu dosyayı kullanan içerikler güncellenemediği için dosya yeniden adlandırılamaz veya taşınamaz. }}
    *   {{ Bu dosyaları kullanan içerikler güncellenemediği için dosyalar yeniden adlandırılamaz veya taşınamaz. }}

# Rename asset: dialog and validation
rename_asset: Medya Dosyasını Yeniden Adlandır
# {$name} is the current asset name
rename_x: '{$name} Öğesini Yeniden Adlandır'
# Dialog body text indicating how many entries reference this asset
# {$count} is the number of entries that currently reference the asset
enter_new_name_for_asset: |
  .input {$count :integer}
  .match $count
    0   {{ Aşağıya yeni bir ad girin. }}
    *   {{ Aşağıya yeni bir ad girin. Bu medya dosyasını kullanan {$count} içerik de güncellenecektir. }}
# Validation errors for asset renaming
enter_new_name_for_asset_error:
  empty: Dosya adı boş olamaz.
  character: Dosya adı özel karakterler içeremez.
  duplicate: Bu dosya adı başka bir medya dosyası için kullanılıyor.
  # A name starting with a dot hides the file, which the CMS wouldn’t list any more
  leading_dot: Dosya adı nokta ile başlayamaz.
  # The name of a file next to the asset that isn’t an asset, like an entry file
  file_duplicate: Burada bu ada sahip başka bir dosya zaten var.
  # The name of a folder next to the file
  folder_duplicate: Burada bu ada sahip bir klasör zaten var.
# Shown while renaming a file whose name will be changed on saving, e.g. by the `slugify_filename`
