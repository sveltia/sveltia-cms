  # Preferences operation errors
  error:
    permission_denied: Çerez (cookie) depolama erişimi reddedildi. Lütfen browser izinlerinizi kontrol edip tekrar deneyin.

  # Appearance panel
  appearance:
    title: Görünüm
    theme: Tema
    select_theme: Tema Seç

  # Theme options
  theme:
    dark: Koyu
    light: Açık

  # Language panel
  language:
    title: Dil
    ui_language:
      title: Kullanıcı Arayüzü Dili
      select_language: Dil Seç

  # Contents panel
  contents:
    title: İçerikler
    editor:
      title: Düzenleyici
      use_draft_backup:
        switch_label: İçerik taslaklarını otomatik olarak yedekle
      close_on_save:
        switch_label: Bir taslağı kaydettikten sonra düzenleyiciyi kapat
      close_with_escape:
        switch_label: Düzenleyiciyi Escape tuşu ile kapat

  # Internationalization panel
  i18n:
    title: Çoklu Dil (i18n)
    translators:
      default:
        title: Varsayılan Çeviri Servisi
        select_service: Servis Seç
      api_keys:
        title: Çeviri Servisi API Key’leri
        description: <a>Çeviri servisleri</a> için API key’lerini yönetin. Genel yapay zekâ servislerinin API key’leri Yapay Zekâ ayarlarından yönetilebilir.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: '{$service} Key'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Metin alanlarının hızlı çevirisini etkinleştirmek için <a {$homeHref}>{$service}</a> servisine kaydolun ve <a {$apiKeyHref}>API Key’inizi</a> buraya girin.

  # Media panel
  media:
    title: Medya
    stock_photos:
      api_keys:
        title: Stok Fotoğraf Servisi API Key’leri
        description: <a>Stok fotoğraf servisleri</a> için API key’lerini yönetin.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: '{$service} API Key'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Görsel içerik alanlarına ücretsiz stok fotoğraflar eklemek için <a {$homeHref}>{$service} API</a> servisine kaydolun ve <a {$apiKeyHref}>API Key’inizi</a> buraya girin.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Fotoğraflar {$service} tarafından sağlanmaktadır
      no_services: Yapılandırılmış <a>stok fotoğraf servisi</a> yok.
    cloud_storage:
      api_keys:
        title: Bulut Depolama Servisi API Key’leri
        description: <a>Bulut depolama servisleri</a> için API key’lerini yönetin.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: '{$service} API Key'
      no_services: Yapılandırılmış <a>bulut depolama servisi</a> yok.

  # AI panel
  ai:
    title: Yapay Zekâ
    api_keys:
      title: Yapay Zekâ Servisi API Key’leri
      description: Yapay zekâ servisleri için API key’lerini yönetin.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: '{$service} API Key'

  # Accessibility panel
  accessibility:
    title: Erişilebilirlik
    underline_links:
      title: Bağlantıların Altını Çiz
      description: İçerik önizlemesinde ve kullanıcı arayüzü etiketlerinde bağlantıların altını göster.
      switch_label: Bağlantıların Altını Her Zaman Çiz

  # Data Management panel
  data:
    title: Veri Yönetimi
    clear_data:
      title: Verileri Temizle
      # Clear File Cache button
      file_cache:
        description: Depolama alanı boşaltmak veya eski verilerin neden olduğu sorunları çözmek için yerel olarak önbelleğe alınan dosya içeriklerini ve görsel küçük resimlerini silin.
        button_label: Dosya Önbelleğini Temizle
        confirmation: Yerel olarak önbelleğe alınan dosya içerikleri ve görsel küçük resimleri silinecek. Kaydedilmemiş taslaklarınız ve ayarlarınız korunacak, silinen veriler ise gerektiğinde yeniden indirilecek veya oluşturulacak. İşlem tamamlandığında CMS yeniden yüklenecek.
      # Erase All Data button
      all_data:
        description: Önbelleğe alınan dosyalar, kaydedilmemiş taslaklar ve ayarlar dahil CMS’in bu tarayıcıda tuttuğu her şeyi silin. Reponuza zaten kaydedilmiş olanlar etkilenmez.
        button_label: Tüm Verileri Sil
        confirmation: Önbelleğe alınan dosya içerikleri, görsel küçük resimleri, kaydedilmemiş taslaklar, ayarlar ve giriş durumu dahil bu tarayıcıda depolanan tüm veriler silinecek. Reponuz etkilenmeyecek, ancak kaydetmediğiniz tüm değişiklikler kaybolacak ve yeniden giriş yapmanız gerekecek. İşlem tamamlandığında CMS yeniden yüklenecek.

  # Developer panel
  developer:
    title: Geliştirici
    developer_mode:
      title: Geliştirici Modu
      description: Ayrıntılı konsol günlükleri ve yerel bağlam menüleri dahil geliştiricilere yönelik bazı özellikleri etkinleştirin.
      switch_label: Geliştirici Modunu Etkinleştir
    local_git:
      title: Git Commit’leri
      description: Değişikliklerinizi her kaydettiğinizde, CMS’in uzak bir repoyla çalışırken yaptığı gibi yerel reponuzun mevcut branch’ine commit edin. Ardından commit’leri alıştığınız Git araçlarıyla inceleyip push edebilirsiniz.
      switch_label: Değişiklikleri Git’e Commit Et
      checking: Repo kontrol ediliyor…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Değişiklikler {$branch} branch’ine {$name} ({$email}) olarak commit edilecek.
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Değişiklikler şu anda commit edilemiyor. {$reason}
    deploy_hook:
      title: Dağıtım Webhook’u
      description: Değişiklikleri Yayınla seçeneği ile manuel bir dağıtım tetiklediğinizde çağrılacak bir webhook URL’i girin. GitHub Actions veya GitLab CI/CD kullanıyorsanız bu alan boş bırakılabilir.
      # Hook URL input
      url:
        field_label: Webhook URL’i
        saved: Webhook URL’i kaydedildi.
        removed: Webhook URL’i kaldırıldı.
      # Authorization header input
      auth:
        field_label: Yetkilendirme Başlığı (ör. Bearer <token>) (isteğe bağlı)
        saved: Yetkilendirme başlığı kaydedildi.
        removed: Yetkilendirme başlığı kaldırıldı.

