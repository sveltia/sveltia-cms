# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: İçerik Başka Biri Tarafından Değiştirildi
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} bu içeriği siz açtıktan sonra, {$date} tarihinde değiştirdi.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Bu içerik siz açtıktan sonra repoda değiştirildi.
  deleted: Bu içerik siz açtıktan sonra repodan silindi.
  # Follows `modified_by` or `modified`
  overwrite_warning: Şimdi kaydederseniz yapılan bu değişiklikler kaybolacak.
  # Follows `deleted`
  recreate_warning: Şimdi kaydederseniz içerik yeniden oluşturulacak.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: İçerik diğer içeriklerle aynı dosyada saklandığından değişikliğin üzerine kaydedilemez. Düzenlemeyi iptal edin, ardından içeriği listeden yeniden açıp düzenlemelerinizi yapın.
  # OK button label
  save_anyway: Yine de Kaydet
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: Kaydetme sırasında repo başka biri tarafından güncellendi. Lütfen tekrar deneyin.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Aynı dosyada saklanan bir içerik başka biri tarafından değiştirildi. Lütfen tekrar deneyin.
  # {$path} is the file path
  array_file_invalid: '{$path} dosyası geçerli bir içerik listesi içermediği için güncellenemiyor.'

