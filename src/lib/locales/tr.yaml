    list_field_invalid_default_type: List alanının `default` seçeneği, `{$typeKey}` özelliği `{$value}` olan bir öğe içeriyor, ancak bu değer `types` arasında yok.
    # Don’t localize `map_key_field`, `fields` and `types`
    list_field_map_key_no_subfields: List alanının `map_key_field` seçeneği, her key bir alt alandan alındığı için `fields` veya `types` seçeneğini gerektirir.
    # {$name} is the subfield name; Don’t localize `map_key_field`
    list_field_map_key_not_found: List alanının `map_key_field` seçeneği `{$name}` alanına başvuruyor, ancak bu ada sahip bir alt alan yok.
    # {$name} is the subfield name, and {$type} is the variable type name; Don’t localize `map_key_field`
    list_field_map_key_missing_in_type: List alanının `map_key_field` seçeneği `{$name}` alanına başvuruyor, ancak `{$type}` türünde bu ada sahip bir alt alan yok.
    # {$name} is the subfield name, and {$widget} is its field type; Don’t localize `map_key_field`
    list_field_map_key_invalid_type: List alanının `map_key_field` seçeneği `{$name}` alanına başvuruyor, ancak bu alan bir `{$widget}` alanı değil, String, Relation veya Select alanı olmalıdır.
    # {$name} is the subfield name; Don’t localize `map_key_field` and `multiple`
    list_field_map_key_multiple: List alanının `map_key_field` seçeneği `{$name}` alanına başvuruyor, ancak her öğe tek bir key gerektirdiğinden alt alan birden fazla değer alamaz. Alt alanın `multiple` seçeneğini kaldırın.
    # {$name} is the subfield name; Don’t localize `map_key_field`
    list_field_map_key_option_not_string: List alanının `map_key_field` seçeneği `{$name}` alanına başvuruyor, ancak her key metin olarak saklandığından alt alanın seçenekleri metin değerlerine sahip olmalıdır.
    # {$name} is the subfield name; Don’t localize `map_key_field` and `required`
    list_field_map_key_not_required: List alanının `map_key_field` seçeneği `{$name}` alanına başvuruyor, ancak her öğe bir key gerektirdiğinden alt alan isteğe bağlı olamaz. Alt alanın `required` seçeneğini kaldırın.
    # {$name} is the subfield name; Don’t localize `map_key_field`, `i18n: false` and `i18n: duplicate`
    list_field_map_key_not_localized: 'List alanının `map_key_field` seçeneği `{$name}` alanına başvuruyor, ancak öğelerin her dilde bir key’e ihtiyacı olduğundan alt alan `i18n: false` içeremez. `i18n: duplicate` kullanın veya seçeneği kaldırın.'
    # Don’t localize `i18n`, `duplicate_if_empty`, `multiple` and `true`
    duplicate_if_empty_multiple: '`i18n: duplicate_if_empty` seçeneği `multiple` seçeneğine sahip bir alan için desteklenmiyor; bu nedenle alan `i18n: true` olan bir alan gibi çalışır.'
    # Don’t localize `default` and `multiple`
    invalid_default_multiple: '`multiple` seçeneği `true` olduğundan `default` seçeneği bir dizi olmalıdır.'
    invalid_default_single: '`multiple` seçeneği `true` olmadığından `default` seçeneği bir dizi değil, tek bir değer olmalıdır.'
    # {$key} is a property name of the default object from the configuration; Don’t localize `default`
    object_field_invalid_default_key: Object alanının `default` seçeneği `{$key}` özelliğine sahip, ancak bu ada sahip bir alt alan yok.
    # {$typeKey} is the configured type key, `type` by default; Don’t localize `default` and `types`
    object_field_default_missing_type: Object alanının `default` seçeneğinde, `types` arasından birini belirleyen `{$typeKey}` özelliği yok.
    # {$typeKey} is the configured type key, `type` by default, and {$value} is its value in the default object; Don’t localize `default` and `types`
    object_field_invalid_default_type: Object alanının `default` seçeneğindeki `{$typeKey}` özelliği `{$value}`, ancak bu değer `types` arasında yok.
    # Don’t localize `default` and `output_code_only`
    code_field_invalid_default_object: '`output_code_only` seçeneği `true` olduğundan Code alanının `default` seçeneği bir metin olmalıdır.'
    # {$key} is a property name of the default object, {$code} and {$lang} are the configured property names; Don’t localize `default` and `keys`
    code_field_invalid_default_key: Code alanının `default` seçeneği `{$key}` özelliğine sahip, ancak `keys` seçeneği yalnızca `{$code}` ve `{$lang}` özelliklerine izin veriyor.
    # {$valueType} is the configured value type; Don’t localize `value` and `value_type`
    compute_field_invalid_expression: '`value_type` seçeneği `{$valueType}` olduğundan Compute alanının `value` seçeneği `\{\{fields.price\}\} * \{\{fields.quantity\}\}` gibi geçerli bir aritmetik ifade olmalıdır.'
    # {$valueType} is the configured value type; Don’t localize `value` and `value_type`
    compute_field_uuid_in_expression: Compute alanının `value` seçeneği `\{\{uuid\}\}` gibi bir UUID etiketi kullanamaz, çünkü `value_type` seçeneği `{$valueType}` olduğundan değer bir aritmetik ifadedir.
    # {$value} is the default value and {$valueType} is the configured value type; Don’t localize `default` and `value_type`
    number_field_default_not_integer: Number alanının `default` seçeneği `{$value}` olarak ayarlanmış, ancak `value_type` seçeneği `{$valueType}` olduğundan bir tam sayı olmalıdır.
    number_field_default_not_number: Number alanının `default` seçeneği `{$value}` olarak ayarlanmış, ancak `value_type` seçeneği `{$valueType}` olduğundan bir sayı olmalıdır.
    # Don’t localize `fields` and `types`
    object_field_no_subfields: Object alanının `fields` veya `types` seçeneğinde en az bir öğe olmalıdır.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: Referans verilen `{$collection}` koleksiyonu geçersiz veya tanımlanmamış.
    relation_field_invalid_collection_file: Referans verilen `{$file}` dosyası geçersiz veya tanımlanmamış.
    # Don’t localize `file`
    relation_field_missing_file_name: Bir dosya koleksiyonuna bağıntı kurulması için `file` seçeneği tanımlanmalıdır.
    relation_field_invalid_value_field: Referans verilen değer alanı `{$field}` geçersiz veya tanımlanmamış.
    # {$collection} is the referenced collection name; Don’t localize `file`, `value_field` and `slug`.
    # The curly brackets are escaped with backslashes for MessageFormat 2
    relation_field_array_file_slug: '`{$collection}` koleksiyonuna olan bağıntı `\{\{slug\}\}` değerini saklayamaz, çünkü `file` seçeneğine sahip bir koleksiyonda bir içeriğin slug’ı onun konumudur ve içerikler yeniden sıralandığında veya silindiğinde değişir. Bunun yerine `value_field` seçeneğini benzersiz değere sahip bir alana ayarlayın.'
    # {$collection} is the referenced collection name; Don’t localize `file`
    relation_field_array_file_workflow: '`file` seçeneğine sahip bir koleksiyon, Editöryal Akış veya Önizleme Akışı kullanan `{$collection}` koleksiyonuyla bağıntı kuramaz, çünkü orada yeniden adlandırılan veya silinen bir içeriğe ait referanslar dosyada güncellenemez.'
    relation_field_invalid_display_field: Referans verilen görüntüleme alanı `{$field}` geçersiz veya tanımlanmamış.
    relation_field_invalid_search_field: Referans verilen arama alanı `{$field}` geçersiz veya tanımlanmamış.
    relation_field_invalid_filter_field: Referans verilen filtre alanı `{$field}` geçersiz veya tanımlanmamış.
    relation_field_invalid_sort_field: Referans verilen sıralama alanı `{$field}` geçersiz veya tanımlanmamış.
    # Don’t localize `sort_by` and `file`
    relation_field_sort_by_file_ignored: '`sort_by` seçeneği, seçenekleri liste öğelerinin sırasını izleyen bir dosyaya olan bağıntı için geçerli değildir. Yoksayılacaktır.'
    unexpected: Beklenmeyen hata

    # Schema validation errors, reported when the configuration doesn’t match the published JSON
    # schema. In all of these, {$option} is a configuration option path such as `backend.name` or
    # `view_filters[0].pattern`, relative to the collection, file or field named before it.
    # {$type} is a value type name from `schema_value_type` below
    schema_invalid_type: '`{$option}` seçeneği {$type} olmalıdır.'
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: '`{$option}` seçeneği şu değerlerden biri olmalıdır: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: '`{$option}` seçeneği `{$value}` olmalıdır.'
    schema_invalid_empty_value: '`{$option}` seçeneği boş bir metin olmalıdır.'
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: '`{$option}` seçeneği {$count} öğeli bir dizi olmalıdır.'
    schema_invalid_value: '`{$option}` seçeneğinin değeri geçersiz.'
    schema_missing_option: '`{$option}` seçeneği zorunludur.'
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Şu seçeneklerden biri zorunludur: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: bir metin
      number: bir sayı
      integer: bir tam sayı
      boolean: bir mantıksal değer
      array: bir dizi
      object: bir nesne
      'null': boş

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: OAuth uygulama kimliği (App ID) tanımlanmamış. Kullanıcıların giriş yapabilmesi için bir erişim token’ı sağlaması gerekir.
    # Don’t localize `prefix`
    site_library_prefix_template: Bir medya kütüphanesinin `prefix` seçeneği şablon etiketleri içeriyor; üst düzeyde bunları dolduracak bir içerik olmadığından şablon etiketleri yalnızca alan düzeyinde desteklenir.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: '`{$prop}` seçeneği Sveltia CMS’te desteklenmiyor. Yoksayılacaktır.'
    # Don’t localize `stages`, `publish_mode`, `editorial_workflow` and {$type}, which is `preview` or `simple`
    publish_mode_stages_ignored: '`publish_mode` seçeneğinin `stages` seçeneği yalnızca `editorial_workflow` yayın modu için geçerlidir; bu nedenle `{$type}` ile yoksayılır.'
    # Don’t localize `pattern`, `m` and `s`
    inline_component_multiline_pattern: Bu satır içi bileşenin `pattern` değeri `m` veya `s` bayrağına sahip ya da satır sonlarıyla eşleşiyor, ancak satır içi bileşenler yalnızca bir paragraf içinde eşleştirilir.
    # {$name} is a button or component name and {$option} is `buttons` or `editor_components`; Don’t localize them and `multiline: false`
    single_line_block_item: '`{$option}` seçeneğinin `{$name}` öğesi yoksayılıyor, çünkü `multiline: false` olan bir alan yalnızca satır içi içerik tutabilir.'
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Hem `picker_utc` hem de daha yeni saat dilimi seçenekleri (`input_timezone` veya `output_utc`) ayarlanmış. Yeni seçenekler önceliklidir. Yapılandırmanızdan `picker_utc` seçeneğini kaldırmayı düşünün.
    # Don’t localize `localize_format` and `format`
    localize_format_without_format: '`localize_format` seçeneğinin bir etkisi yok, çünkü alanın `format` seçeneği yok ve değeri ISO 8601 biçiminde saklanıyor.'
    # {$name} is a template tag like `fields.lines.*.price`; Don’t localize `value`, `*` and `sum()`
    compute_field_wildcard_without_item: Compute alanının `value` seçeneği `{$name}` öğesine başvuruyor, ancak alan `*` karakterinin temsil ettiği listenin bir öğesinde bulunmadığı için bu başvuru boş sonuç verir. Bir listenin tüm öğelerini yalnızca `sum()` gibi bir toplama fonksiyonu kullanabilir.
    # {$name} is a template tag like `fields.lines.*.amount`; Don’t localize `value`
    compute_field_self_reference: Compute alanının `value` seçeneği alanın kendisine `{$name}` olarak başvuruyor; bu nedenle değeri her hesaplandığında değişir ve hiçbir zaman sabitlenmez.
    # {$name} is a template tag like `fields.total`; Don’t localize `value`
    compute_field_reference_cycle: Compute alanının `value` seçeneği, doğrudan veya diğer alanlar aracılığıyla bu alana geri başvuran başka bir Compute alanı olan `{$name}` öğesine başvuruyor; bu nedenle değerleri hiçbir zaman sabitlenmez.
    # Don’t localize `localize_format`, `true` and `de`
    localize_format_without_i18n: '`localize_format` seçeneği `true`, ancak koleksiyon için i18n etkin olmadığından değer İngilizce yazılır. Bunun yerine seçeneği `de` gibi bir dil koduna ayarlayın.'
    # {$locale} is the locale code from the configuration; Don’t localize `localize_format`
    localize_format_unsupported_locale: '`localize_format` seçeneği, desteklenen bir dil olmayan `{$locale}` olarak ayarlanmış; bu nedenle değer İngilizce yazılır.'
    # Don’t localize `preview_path`
    preview_path_no_date_field: '`preview_path` seçeneği tarih ve saat etiketleri kullanıyor, ancak koleksiyonda bunların okunacağı bir DateTime alanı yok; bu nedenle önizleme bağlantısı gösterilmeyecek.'
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: '`preview_path_date_field` seçeneği `{$name}` adlı bir alana başvuruyor, ancak bu ada sahip bir DateTime alanı tanımlanmamış; bu nedenle önizleme bağlantısı gösterilmeyecek.'
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: '`preview_path` seçeneği `{$name}` alanına başvuruyor, ancak koleksiyonda böyle bir alan tanımlanmamış; bu nedenle önizleme bağlantısı gösterilmeyecek.'
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: Koleksiyonda yeni içerikleri adlandırmak için bir `{$name}` alanı yok; bu nedenle her yeni içerik rastgele bir slug alır. Bir `{$name}` alanı ekleyin veya `identifier_field` ya da `slug` seçeneğini ayarlayın.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: '`slug` seçeneğinin `i18n` seçeneğinin bir etkisi yok, çünkü koleksiyon, her dilin kendi dosyasına sahip olduğu `multiple_files`, `multiple_folders` veya `multiple_root_folders` i18n yapısını kullanmıyor.'
    # Don’t localize `slug`, `template` and `auto_increment`
    slug_template_ignored: '`slug` seçeneğinin `template` seçeneği yoksayılıyor, çünkü slug’lar bunun yerine `auto_increment` seçeneğiyle numaralandırılıyor.'
    # {$file} is the file path; Don’t localize `file`, `locale`, `i18n`, `false`,
    # `omit_default_locale_from_file_path` and the example paths. The curly brackets in the examples
    # are escaped with backslashes for MessageFormat 2
    locale_not_omitted_from_file_path: '`locale` yer tutucusu `{$file}` `file` yolundan kaldırılamıyor; bu nedenle `omit_default_locale_from_file_path` i18n seçeneğine rağmen varsayılan dil yolda kalıyor. Dili yoldan çıkarmak için yer tutucuyu `\{\{locale\}\}/about.md` gibi tam bir klasör adı olarak veya `about.\{\{locale\}\}.md` gibi dosya adı ile uzantı arasında kullanın. Dili korumak için dosyanın `i18n` seçeneğinde bu seçeneği `false` olarak ayarlayın.'
    # Don’t localize `i18n`
    i18n_not_configured: '`i18n` seçeneği etkin, ancak i18n yapılandırmanın üst düzeyinde veya koleksiyonda yapılandırılmamış; bu nedenle seçeneğin bir etkisi yok.'
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: '`public_folder` seçeneği boş bir metin olduğundan, içeriklere kaydedilen medya dosyası yolları için bunun yerine `media_folder` yolu kullanılıyor. Seçeneği kaldırın veya `/images` gibi kullanmak istediğiniz yola ayarlayın.'
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: '`{$option}` seçeneği Sveltia CMS yapılandırma şemasında tanımlı değil. Yoksayılacaktır. Yazım veya söz dizimi hatası olup olmadığını kontrol edin.'
    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: '`default_localized` seçeneğinin bir etkisi yok, çünkü koleksiyon için i18n etkin değil. Bunun yerine `default` seçeneğini kullanın.'
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: '`default_localized` seçeneği, koleksiyonun dilleri arasında olmayan `{$locale}` için bir değer içeriyor; bu nedenle bu değer hiçbir zaman kullanılmıyor.'

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Ayrıntılar için uyumluluk notlarına bakın: {$link}'

  # Console tip shown after config load
  schema_tip: Daha iyi bir geliştirici deneyimi için yapılandırma dosyanızı Sveltia CMS JSON şemasına göre doğrulayabilirsiniz. Ayrıntılar için {$link} sayfasına bakın.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Yerel
  # Browser compatibility warnings
  unsupported_browser: Yerel İş Akışı browser’ınız tarafından desteklenmiyor. Lütfen Chrome veya Edge kullanın.
  disabled: Yerel İş Akışı browser’ınızda devre dışı bırakılmış. <a>Nasıl etkinleştirileceğini burada görebilirsiniz</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Şu anda editöryal akış panosunu görüntülüyorsunuz. Taslaklar: {$draft}. İncelemede: {$review}. Hazır: {$ready}. Silinmeyi Bekleyen: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Şu anda editöryal akış panosunu görüntülüyorsunuz. Taslaklar: {$draft}. İncelemede: {$review}. Silinmeyi Bekleyen: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'Şu anda editöryal akış panosunu görüntülüyorsunuz. Taslaklar: {$draft}. Hazır: {$ready}. Silinmeyi Bekleyen: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'Şu anda Taslaklar sayfasını görüntülüyorsunuz. Taslaklar: {$draft}. Silinmeyi Bekleyen: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Taslak
  drafts: Taslaklar
  in_review: İncelemede
  ready: Hazır
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Silinmeyi Bekliyor
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: Dağıtılıyor

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Silmeyi İptal Et
  confirm_cancelling_deletion: Bu silme işlemini iptal etmek istediğinizden emin misiniz? İçerik yayında kalacak.
  confirm_completing_deletion: Bu içeriği silmek istediğinizden emin misiniz? Hemen kaldırılacak.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ İçerik silinmek üzere işaretlendi. }}
      *   {{ {$count} içerik silinmek üzere işaretlendi. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Değişiklikler iptal edildi. }}
      *   {{ {$count} içerikteki değişiklikler iptal edildi. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Silme İptal Ediliyor…
  deletion_cancelled: Silme iptal edildi.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Silme iptal edilemedi. Lütfen tekrar deneyin.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Yayınlanmamış İçerikler
  published_entries: Yayınlanmış İçerikler
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Durum: {$status}'
  change_entry_status: İçerik Durumunu Değiştir
  # Editor toolbar: progress label while the status is being changed
  changing_status: Durum Değiştiriliyor…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Durum Güncelleniyor…
  status_updated: Durum güncellendi.
  # Error notification when the status could not be changed
  status_change_failed: Durum değiştirilemedi. Lütfen tekrar deneyin.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: Yenile
  refreshing: Yenileniyor…
  refreshed: Pano güncel.
  # Error notification when the board could not be refreshed
  refresh_failed: Pano yenilenemedi. Lütfen tekrar deneyin.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: İçerikte hatalar var. Lütfen durumu değiştirmeden önce bunları düzeltin.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: İçerikte hatalar var. Lütfen yayınlamadan önce bunları düzeltin.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: İncelemeye Gönder
  confirm_sending_for_review: Değişiklikleriniz taslak olarak kaydedildi. Birinin göz atıp yayınlayabilmesi için içerik incelemeye gönderilsin mi?
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: Hazır Olarak İşaretle
  confirm_marking_as_ready: Değişiklikleriniz taslak olarak kaydedildi. İçeriğin yayınlanabilmesi için hazır olarak işaretlensin mi?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: İçeriği Yayınla
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Değişiklikleri İptal Et
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Bu içeriği silmek istediğinizden emin misiniz? Silme işlemi yayınlanana kadar kaldırılmayacak. O zamana kadar içerik listesinde “Silinmeyi Bekliyor” olarak işaretli şekilde görmeye devam edeceksiniz.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Bu içerik henüz yayınlanmadı, bu nedenle silindiğinde tamamen iptal edilecek.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Bu içerikte yayınlanmamış değişiklikler var. Bunlar iptal edildiğinde yayınlanmış sürüm geri yüklenecek. İçeriğin kendisi silinmeyecek.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Henüz yayınlanmadığı için yayınlanmamış değişiklikleriniz iptal edilecek. Yayınlanmış bir sürüm varsa yayında kalacak. }}
      *   {{ Henüz yayınlanmadıkları için yayınlanmamış değişiklikleriniz iptal edilecek. Yayınlanmış sürümler varsa yayında kalacak. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ Bunlardan biri henüz yayınlanmadığı için yayınlanmamış değişiklikleriniz iptal edilecek. Yayınlanmış bir sürüm varsa yayında kalacak. }}
      *   {{ Bunlardan {$count} tanesi henüz yayınlanmadığı için yayınlanmamış değişiklikleriniz iptal edilecek. Yayınlanmış sürümler varsa yayında kalacak. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: Bu içeriği yayınlamak istediğinizden emin misiniz? Değişiklikleriniz siteniz yeniden oluşturulduktan sonra yayına girecek.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: İçerik Yayınlanıyor…
  entry_published: İçerik yayınlandı.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: İçerik Siliniyor…
  discarding_changes: Değişiklikler İptal Ediliyor…
  entry_deleted: İçerik silindi.
  # Error notification when publishing fails
  publishing_entry_failed: İçerik yayınlanamadı. Lütfen tekrar deneyin.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: Bu içerik burada yayınlanamaz, çünkü CMS’in size gösteremediği başka değişiklikler de içeriyor. Bir geliştiriciden incelemesini isteyin.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: İçerik siz açtıktan sonra değiştirildi. Yayınlamadan önce en son sürümü incelemek için sayfayı yeniden yükleyin.
  review_on_x: '{$service} Üzerinde İncele'
  from_fork: Bir çataldan
  fork_entry_editable: Bu içerik, bir katkıcının “{$fork}” çatalından açtığı pull request’ten geliyor. Değişiklikleriniz katkıcının branch’ine kaydedilir. Pull request’i Git servisinde inceleyip birleştirin.
  fork_entry_locked: Bu içerik, bir katkıcının “{$fork}” çatalından açtığı pull request’ten geliyor. Katkıcı, bakımcıların düzenlemesine izin vermediği için içerik burada yalnızca görüntülenebilir.
  fork_not_editable: Katkıcı, bakımcıların bu pull request’i düzenlemesine izin vermiyor.
  fork_entry_gone: Katkıcının pull request’i artık açık olmadığından değişiklikler ona kaydedilemez.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: Bu içerik için CMS dışında açılmış başka bir istek ({$number}) zaten var. Önce bir geliştiriciden bunu kapatmasını isteyin.
  # Workflow page: empty column message
  no_entries: İçerik yok.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Durumu değiştirmek için sürükleyin
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Silme
  # Workflow page: note on a card listing the new entries that were created from a Relation field
  # of the entry and are published along with it, e.g. “Also adds Section: Getting Started”
  companion_entries: 'Ayrıca ekler: {$entries}'
  # Workflow page: note on a card listing the existing entries that were edited from a Relation
  # field of the entry and are published along with it, e.g. “Also changes Author: Ada Lovelace”
  edited_companion_entries: 'Ayrıca değiştirir: {$entries}'
  # Workflow page: one of the entries listed by `companion_entries` or `edited_companion_entries`,
  # named by its collection’s singular label and its title
  companion_entry: '{$collection}: {$title}'

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: Commit Mesajı
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: Değişikliklerinizi açıklayın. Mesaj, değişikliklerle birlikte geçmişe kaydedilir.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: Değişikliklerinizle birlikte geçmişe kaydedilen mesaja, örneğin bir konu (issue) numarası gibi bir not ekleyin. Boş bırakılabilir.
  # Accessible name of the text box when the user writes the whole message
  message: Commit mesajı
  # Accessible name of the text box when the text is added before or after the message
  addition: Not
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'Mesaj: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Repoyu Çatalla
  fork: Çatalla
  confirm_forking_repository: “{$repo}” için değişiklik önermek üzere hesabınızda reponun bir çatalı oluşturulmalıdır. Değişiklikleriniz bu çatala kaydedilir ve yayınlanmadan önce bir bakımcı tarafından incelenir.
  # Error shown when the user declined the dialog above
  fork_declined: Değişiklik önermek için hesabınızda reponun bir çatalı olması gerekir.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: “{$repo}” reposunun çatalı hesabınızda oluşturulamadı.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: “{$fork}” çatalınızda “{$branch}” branch’i yok. Çatalı “{$repo}” reposundan güncelleyin, ardından tekrar giriş yapın.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: “{$repo}” reposuna erişiminiz kontrol edilemedi. Lütfen biraz sonra tekrar deneyin.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: “{$repo}” reposu çatallamaya izin vermiyor. Bir bakımcıdan çatallamayı etkinleştirmesini isteyin.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: “{$repo}” reposu için bekleyen bir davetiniz var. GitHub’da daveti kabul edip tekrar giriş yapın.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Girişiniz özel repolara erişimi kapsamıyor, bu nedenle “{$repo}” reposu okunamıyor. Bir bakımcıdan CMS kimlik doğrulama ayarlarını kontrol etmesini isteyin.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Bu sitede değişiklikleri yalnızca bir bakımcı yayınlayabilir. Bunun yerine içeriğinizi “İncelemede” olarak işaretleyin; biri göz atacaktır.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: Bir bakımcı bu içeriği zaten yayınladı; bu nedenle incelenecek bir şey kalmadı.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Bu değişiklik doğrudan yapılamaz. Yalnızca içerik düzenlemeleri inceleme için önerilebilir.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Değişiklikleriniz bu reponun “{$repo}” adresindeki çatalınıza kaydedilir ve yayınlanmadan önce incelenir.
  view_fork: Çatalı Görüntüle

