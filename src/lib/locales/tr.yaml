  .input {$count :integer}
  .match $count
    one {{ Bu dosya yüklenemiyor çünkü izin verilen maksimum {$size} boyutunu aşıyor. Lütfen boyutu küçültün veya farklı bir dosya seçin. }}
    *   {{ Bu dosyalar yüklenemiyor çünkü izin verilen maksimum {$size} boyutunu aşıyor. Lütfen boyutları küçültün veya farklı dosyalar seçin. }}

# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: Geçersiz Dosyalar
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    one {{ Bu dosya yüklenemiyor çünkü bozuk ya da içeriği dosya uzantısıyla eşleşmiyor. Bu durum genellikle bir fotoğrafın dönüştürülmek yerine yeniden adlandırılmasıyla, örneğin bir HEIC görselinin JPEG dosyası olarak kaydedilmesiyle oluşur. Lütfen dosyayı dönüştürüp tekrar deneyin. }}
    *   {{ Bu dosyalar yüklenemiyor çünkü bozuk ya da içerikleri dosya uzantılarıyla eşleşmiyor. Bu durum genellikle fotoğrafların dönüştürülmek yerine yeniden adlandırılmasıyla, örneğin HEIC görsellerinin JPEG dosyası olarak kaydedilmesiyle oluşur. Lütfen dosyaları dönüştürüp tekrar deneyin. }}
# {$count} is the number of files that are not of a type the field accepts, even once transformed
# {$types} is the list of accepted file types, such as “.pdf or .txt”
