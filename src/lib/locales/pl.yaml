    compute_field_wildcard_without_item: Opcja `value` pola typu Compute odwołuje się do `{$name}`, ale pole nie znajduje się w elemencie listy, którą reprezentuje `*`, więc nie zwraca żadnej wartości. Tylko funkcja agregująca, taka jak `sum()`, może używać wszystkich elementów listy.
    # {$name} is a template tag like `fields.lines.*.amount`; Don’t localize `value`
    compute_field_self_reference: Opcja `value` pola typu Compute odwołuje się do samego pola jako `{$name}`, więc jego wartość zmienia się przy każdym obliczeniu i nigdy się nie stabilizuje.
    # {$name} is a template tag like `fields.total`; Don’t localize `value`
    compute_field_reference_cycle: Opcja `value` pola typu Compute odwołuje się do `{$name}`, innego pola typu Compute, które odwołuje się z powrotem do tego pola, bezpośrednio lub przez inne pola, więc ich wartości nigdy się nie stabilizują.
    # Don’t localize `localize_format`, `true` and `de`
    localize_format_without_i18n: Opcja `localize_format` ma wartość `true`, ale internacjonalizacja nie jest włączona dla kolekcji, więc wartość jest zapisywana po angielsku. Zamiast tego ustaw opcję na kod języka, np. `de`.
    # {$locale} is the locale code from the configuration; Don’t localize `localize_format`
    localize_format_unsupported_locale: Opcja `localize_format` ma wartość `{$locale}`, która nie jest obsługiwanym językiem, więc wartość jest zapisywana po angielsku.
    # Don’t localize `preview_path`
    preview_path_no_date_field: Opcja `preview_path` używa tagów daty i czasu, ale kolekcja nie ma pola DateTime, z którego można je odczytać, więc link do podglądu nie zostanie wyświetlony.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: Opcja `preview_path_date_field` odwołuje się do pola o nazwie `{$name}`, ale pole DateTime o tej nazwie nie jest zdefiniowane, więc link do podglądu nie zostanie wyświetlony.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: Opcja `preview_path` odwołuje się do `{$name}`, ale takie pole nie jest zdefiniowane w kolekcji, więc link do podglądu nie zostanie wyświetlony.
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: Kolekcja nie ma pola `{$name}`, z którego można nadawać nazwy nowym wpisom, więc każdy nowy wpis otrzymuje losowy przyjazny link. Dodaj pole `{$name}` lub ustaw opcję `identifier_field` albo `slug`.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: Opcja `i18n` w `slug` nie ma żadnego efektu, ponieważ kolekcja nie używa struktury i18n `multiple_files`, `multiple_folders` ani `multiple_root_folders`, w której każdy język ma własny plik.
    # Don’t localize `slug`, `template` and `auto_increment`
    slug_template_ignored: Opcja `template` w `slug` jest ignorowana, ponieważ opcja `auto_increment` zamiast tego numeruje przyjazne linki.
    # {$file} is the file path; Don’t localize `file`, `locale`, `i18n`, `false`,
    # `omit_default_locale_from_file_path` and the example paths. The curly brackets in the examples
    # are escaped with backslashes for MessageFormat 2
    locale_not_omitted_from_file_path: Symbolu zastępczego `locale` nie można usunąć ze ścieżki `file` o wartości `{$file}`, więc domyślny język pozostaje w niej mimo opcji i18n `omit_default_locale_from_file_path`. Aby pominąć język, użyj symbolu zastępczego jako całej nazwy folderu, np. `\{\{locale\}\}/about.md`, lub między nazwą pliku a rozszerzeniem, np. `about.\{\{locale\}\}.md`. Aby go zachować, ustaw tę opcję na `false` w opcji `i18n` pliku.
    # Don’t localize `i18n`
    i18n_not_configured: Opcja `i18n` jest włączona, ale internacjonalizacja nie jest skonfigurowana na najwyższym poziomie konfiguracji ani w kolekcji, więc opcja nie ma żadnego efektu.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: Opcja `public_folder` jest pustym ciągiem znaków, więc zamiast niej dla ścieżek zasobów zapisywanych we wpisach używana jest ścieżka `media_folder`. Usuń tę opcję lub ustaw ją na ścieżkę, której chcesz używać, np. `/images`.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: Opcja `{$option}` nie jest zdefiniowana w schemacie konfiguracji Sveltia CMS. Zostanie zignorowana. Sprawdź, czy nie ma literówki lub błędu składni.
    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: Opcja `default_localized` nie ma żadnego efektu, ponieważ internacjonalizacja nie jest włączona dla kolekcji. Zamiast niej użyj opcji `default`.
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: Opcja `default_localized` ma wartość dla `{$locale}`, który nie jest jednym z języków kolekcji, więc ta wartość nigdy nie jest używana.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Szczegóły znajdziesz w informacjach o kompatybilności: {$link}'

  # Console tip shown after config load
  schema_tip: Aby uzyskać lepsze doświadczenie programistyczne, możesz zwalidować plik konfiguracyjny względem schematu JSON Sveltia CMS. Szczegóły znajdziesz na {$link}.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Lokalny
  # Browser compatibility warnings
  unsupported_browser: Praca lokalna nie jest obsługiwana w Twojej przeglądarce. Użyj Chrome lub Edge.
  disabled: Praca lokalna jest wyłączona w Twojej przeglądarce. <a>Dowiedz się, jak ją włączyć</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Przeglądasz teraz tablicę obiegu redakcyjnego. Szkice: {$draft}. W recenzji: {$review}. Gotowe: {$ready}. Oczekujące na usunięcie: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Przeglądasz teraz tablicę obiegu redakcyjnego. Szkice: {$draft}. W recenzji: {$review}. Oczekujące na usunięcie: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'Przeglądasz teraz tablicę obiegu redakcyjnego. Szkice: {$draft}. Gotowe: {$ready}. Oczekujące na usunięcie: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'Przeglądasz teraz stronę Szkice. Szkice: {$draft}. Oczekujące na usunięcie: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Szkic
  drafts: Szkice
  in_review: W recenzji
  ready: Gotowe
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Oczekuje na usunięcie
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: Wdrażanie

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Anuluj usunięcie
  confirm_cancelling_deletion: Czy na pewno chcesz anulować to usunięcie? Wpis pozostanie opublikowany.
  confirm_completing_deletion: Czy na pewno chcesz usunąć ten wpis? Zostanie usunięty natychmiast.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one  {{ Wpis oznaczony do usunięcia. }}
      few  {{ {$count} wpisy oznaczono do usunięcia. }}
      many {{ {$count} wpisów oznaczono do usunięcia. }}
      *    {{ {$count} wpisów oznaczono do usunięcia. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one  {{ Zmiany odrzucone. }}
      few  {{ Odrzucono zmiany w {$count} wpisach. }}
      many {{ Odrzucono zmiany w {$count} wpisach. }}
      *    {{ Odrzucono zmiany w {$count} wpisach. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Anulowanie usunięcia…
  deletion_cancelled: Usunięcie anulowane.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Nie udało się anulować usunięcia. Spróbuj ponownie.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Nieopublikowane wpisy
  published_entries: Opublikowane wpisy
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Status: {$status}'
  change_entry_status: Zmień status wpisu
  # Editor toolbar: progress label while the status is being changed
  changing_status: Zmienianie statusu…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Aktualizowanie statusu…
  status_updated: Status zaktualizowany.
  # Error notification when the status could not be changed
  status_change_failed: Nie udało się zmienić statusu. Spróbuj ponownie.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: Odśwież
  refreshing: Odświeżanie…
  refreshed: Tablica jest aktualna.
  # Error notification when the board could not be refreshed
  refresh_failed: Nie udało się odświeżyć tablicy. Spróbuj ponownie.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: Wpis zawiera błędy. Popraw je przed zmianą statusu.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: Wpis zawiera błędy. Popraw je przed opublikowaniem.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Wyślij do recenzji
  confirm_sending_for_review: Twoje zmiany zostały zapisane jako szkic. Czy wysłać wpis do recenzji, aby ktoś mógł go przejrzeć i opublikować?
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: Oznacz jako gotowe
  confirm_marking_as_ready: Twoje zmiany zostały zapisane jako szkic. Czy oznaczyć wpis jako gotowy, aby można go było opublikować?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Opublikuj wpis
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Odrzuć zmiany
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Czy na pewno chcesz usunąć ten wpis? Nie zostanie usunięty, dopóki usunięcie nie zostanie opublikowane. Do tego czasu nadal znajdziesz go na liście wpisów z oznaczeniem “Oczekuje na usunięcie”.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Ten wpis nie został jeszcze opublikowany, więc jego usunięcie spowoduje całkowite odrzucenie.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Ten wpis ma nieopublikowane zmiany. Ich odrzucenie przywróci opublikowaną wersję. Sam wpis nie zostanie usunięty.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Nie został jeszcze opublikowany, więc Twoje nieopublikowane zmiany zostaną odrzucone. Opublikowana wersja pozostanie opublikowana. }}
      *   {{ Nie zostały jeszcze opublikowane, więc Twoje nieopublikowane zmiany zostaną odrzucone. Opublikowane wersje pozostaną opublikowane. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one  {{ Jeden z nich nie został jeszcze opublikowany, więc Twoje nieopublikowane zmiany zostaną odrzucone. Opublikowana wersja pozostanie opublikowana. }}
      few  {{ {$count} z nich nie zostały jeszcze opublikowane, więc Twoje nieopublikowane zmiany zostaną odrzucone. Opublikowane wersje pozostaną opublikowane. }}
      many {{ {$count} z nich nie zostało jeszcze opublikowanych, więc Twoje nieopublikowane zmiany zostaną odrzucone. Opublikowane wersje pozostaną opublikowane. }}
      *    {{ {$count} z nich nie zostało jeszcze opublikowanych, więc Twoje nieopublikowane zmiany zostaną odrzucone. Opublikowane wersje pozostaną opublikowane. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: Czy na pewno chcesz opublikować ten wpis? Twoje zmiany pojawią się w witrynie po jej ponownym zbudowaniu.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Publikowanie wpisu…
  entry_published: Wpis opublikowany.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Usuwanie wpisu…
  discarding_changes: Odrzucanie zmian…
  entry_deleted: Wpis usunięty.
  # Error notification when publishing fails
  publishing_entry_failed: Nie udało się opublikować wpisu. Spróbuj ponownie.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: Tego wpisu nie można tutaj opublikować, ponieważ zawiera inne zmiany, których CMS nie może Ci pokazać. Poproś programistę o ich przejrzenie.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: Wpis został zmieniony od czasu, gdy go otwarto. Załaduj stronę ponownie, aby przejrzeć najnowszą wersję przed publikacją.
  review_on_x: Przejrzyj w {$service}
  from_fork: Z forka
  fork_entry_editable: Ten wpis pochodzi z pull requesta współtwórcy otwartego z “{$fork}”. Twoje zmiany są zapisywane w jego gałęzi. Przejrzyj i scal pull request w usłudze Git.
  fork_entry_locked: Ten wpis pochodzi z pull requesta współtwórcy otwartego z “{$fork}”. Współtwórca nie zezwala opiekunom na jego edycję, więc można go tutaj tylko wyświetlić.
  fork_not_editable: Współtwórca nie zezwala opiekunom na edycję tego pull requesta.
  fork_entry_gone: Pull request współtwórcy nie jest już otwarty, więc nie można w nim zapisać zmian.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: Poza CMS jest już otwarte inne zgłoszenie ({$number}) dla tego wpisu. Poproś programistę o jego zamknięcie.
  # Workflow page: empty column message
  no_entries: Brak wpisów.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Przeciągnij, aby zmienić status
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Usunięcie
  # Workflow page: note on a card listing the new entries that were created from a Relation field
  # of the entry and are published along with it, e.g. “Also adds Section: Getting Started”
  companion_entries: 'Dodaje również: {$entries}'
  # Workflow page: note on a card listing the existing entries that were edited from a Relation
  # field of the entry and are published along with it, e.g. “Also changes Author: Ada Lovelace”
  edited_companion_entries: 'Zmienia również: {$entries}'
  # Workflow page: one of the entries listed by `companion_entries` or `edited_companion_entries`,
  # named by its collection’s singular label and its title
  companion_entry: '{$collection}: {$title}'

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: Opis commita
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: Opisz swoje zmiany. Opis zostanie zapisany w historii razem z nimi.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: Dodaj notatkę do opisu zapisywanego w historii razem z Twoimi zmianami, np. numer zgłoszenia. Można pozostawić puste.
  # Accessible name of the text box when the user writes the whole message
  message: Opis commita
  # Accessible name of the text box when the text is added before or after the message
  addition: Notatka
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'Opis: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Utwórz fork repozytorium
  fork: Utwórz fork
  confirm_forking_repository: Aby zaproponować zmiany w “{$repo}”, na Twoim koncie musi zostać utworzony fork repozytorium. Twoje zmiany są zapisywane w tym forku, a opiekun przegląda je przed publikacją.
  # Error shown when the user declined the dialog above
  fork_declined: Aby proponować zmiany, potrzebujesz forka repozytorium na swoim koncie.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Nie udało się utworzyć forka repozytorium “{$repo}” na Twoim koncie.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: Twój fork “{$fork}” nie ma gałęzi “{$branch}”. Zaktualizuj fork z repozytorium “{$repo}”, a następnie zaloguj się ponownie.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Nie udało się sprawdzić Twojego dostępu do repozytorium “{$repo}”. Spróbuj ponownie za chwilę.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Repozytorium “{$repo}” nie zezwala na forki. Poproś opiekuna o włączenie forkowania.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Masz oczekujące zaproszenie do repozytorium “{$repo}”. Zaakceptuj je w GitHub, a następnie zaloguj się ponownie.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Twoje logowanie nie obejmuje dostępu do prywatnych repozytoriów, więc nie można odczytać repozytorium “{$repo}”. Poproś opiekuna o sprawdzenie ustawień uwierzytelniania CMS.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Tylko opiekun może publikować zmiany w tej witrynie. Zamiast tego oznacz swój wpis jako “W recenzji”, a ktoś się nim zajmie.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: Opiekun już opublikował ten wpis, więc nie ma już nic do recenzji.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Tej zmiany nie można wprowadzić bezpośrednio. Do recenzji można proponować tylko edycje wpisów.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Twoje zmiany są zapisywane w Twoim forku tego repozytorium “{$repo}” i przeglądane przed publikacją.
  view_fork: Zobacz fork

# ==============================================================================
# Settings Dialog
# ==============================================================================
# Strings for the settings/preferences dialog and its panels.

# Settings page aria-label
categories: Kategorie

# Preferences panels
prefs:
  account:
    title: Konto
  # API key management feedback messages
  changes:
    api_key_saved: Klucz API zapisany.
    api_key_removed: Klucz API usunięty.
    api_key_invalid: Podany klucz API jest nieprawidłowy. Sprawdź go i spróbuj ponownie.

  # Preferences operation errors
  error:
    permission_denied: Odmowa dostępu do przechowywania plików cookie. Sprawdź uprawnienia przeglądarki i spróbuj ponownie.

  # Appearance panel
  appearance:
    title: Wygląd
    theme: Motyw
    select_theme: Wybierz motyw

  # Theme options
  theme:
    dark: Ciemny
    light: Jasny

  # Language panel
  language:
    title: Język
    ui_language:
      title: Język interfejsu użytkownika
      select_language: Wybierz język

  # Contents panel
  contents:
    title: Treści
    editor:
      title: Edytor
      use_draft_backup:
        switch_label: Automatycznie twórz kopie zapasowe szkiców wpisów
      close_on_save:
        switch_label: Zamknij edytor po zapisaniu szkicu
      close_with_escape:
        switch_label: Zamknij edytor klawiszem Escape

  # Internationalization panel
  i18n:
    title: Internacjonalizacja
    translators:
      default:
        title: Domyślna usługa tłumaczeniowa
        select_service: Wybierz usługę
      api_keys:
        title: Klucze API usług tłumaczeniowych
        description: Zarządzaj kluczami API dla <a>usług tłumaczeniowych</a>. Kluczami API ogólnych usług AI można zarządzać w ustawieniach AI.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: Klucz {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Zarejestruj się w <a {$homeHref}>{$service}</a> i wprowadź <a {$apiKeyHref}>swój klucz API</a> tutaj, aby umożliwić szybkie tłumaczenie pól tekstowych wpisów.

  # Media panel
  media:
    title: Multimedia
    stock_photos:
      api_keys:
        title: Klucze API usług zdjęć stockowych
        description: Zarządzaj kluczami API dla <a>usług zdjęć stockowych</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: Klucz API {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Zarejestruj się w <a {$homeHref}>{$service} API</a> i wprowadź <a {$apiKeyHref}>swój klucz API</a> tutaj, aby wstawiać darmowe zdjęcia stockowe do pól obrazów we wpisach.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Zdjęcia dostarczone przez {$service}
      no_services: Nie skonfigurowano żadnych <a>usług zdjęć stockowych</a>.
    cloud_storage:
      api_keys:
        title: Klucze API usług przechowywania w chmurze
        description: Zarządzaj kluczami API dla <a>usług przechowywania w chmurze</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: Klucz API {$service}
      no_services: Nie skonfigurowano żadnych <a>usług przechowywania w chmurze</a>.

  # AI panel
  ai:
    title: AI
    api_keys:
      title: Klucze API usług AI
      description: Zarządzaj kluczami API dla usług AI.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: Klucz API {$service}

  # Accessibility panel
  accessibility:
    title: Dostępność
    underline_links:
      title: Podkreślanie linków
      description: Pokaż podkreślenie linków w podglądzie wpisu i etykietach interfejsu użytkownika.
      switch_label: Zawsze podkreślaj linki

  # Data Management panel
  data:
    title: Zarządzanie danymi
    clear_data:
      title: Wyczyść dane
      # Clear File Cache button
      file_cache:
        description: Usuń zapisaną lokalnie w pamięci podręcznej zawartość plików i miniatury obrazów, aby zwolnić miejsce lub rozwiązać problemy spowodowane nieaktualnymi danymi.
        button_label: Wyczyść pamięć podręczną plików
        confirmation: Zapisana lokalnie w pamięci podręcznej zawartość plików i miniatury obrazów zostaną usunięte. Twoje niezapisane szkice i ustawienia zostaną zachowane, a usunięte dane zostaną w razie potrzeby ponownie pobrane lub wygenerowane. Po zakończeniu CMS zostanie przeładowany.
      # Erase All Data button
      all_data:
        description: Usuń wszystko, co CMS przechowuje w tej przeglądarce, w tym pliki w pamięci podręcznej, niezapisane szkice i ustawienia. Nie wpłynie to na nic, co zostało już zapisane w repozytorium.
        button_label: Wymaż wszystkie dane
        confirmation: Wszystkie dane przechowywane w tej przeglądarce zostaną usunięte, w tym zawartość plików w pamięci podręcznej, miniatury obrazów, niezapisane szkice, ustawienia i stan logowania. Nie wpłynie to na repozytorium, ale wszystkie niezapisane zmiany zostaną utracone i konieczne będzie ponowne zalogowanie. Po zakończeniu CMS zostanie przeładowany.

  # Developer panel
  developer:
    title: Programista
    developer_mode:
      title: Tryb programisty
      description: Włącz niektóre funkcje skierowane do programistów, w tym szczegółowe logi w konsoli i natywne menu kontekstowe.
      switch_label: Włącz tryb programisty
    local_git:
      title: Commity Git
      description: Zatwierdzaj zmiany w bieżącej gałęzi lokalnego repozytorium przy każdym zapisie, tak jak robi to CMS podczas pracy ze zdalnym repozytorium. Następnie możesz przejrzeć i wypchnąć commity za pomocą swoich zwykłych narzędzi Git.
      switch_label: Zatwierdzaj zmiany w Git
      checking: Sprawdzanie repozytorium…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Zmiany będą zatwierdzane w gałęzi {$branch} jako {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Nie można teraz zatwierdzić zmian. {$reason}
    deploy_hook:
      title: Webhook wdrożeniowy
      description: Wprowadź adres URL webhooka, który zostanie wywołany po ręcznym uruchomieniu wdrożenia poprzez wybranie Opublikuj zmiany. Można pozostawić puste, jeśli używasz GitHub Actions lub GitLab CI/CD.
      # Hook URL input
      url:
        field_label: Adres URL hooka
        saved: Adres URL hooka zapisany.
        removed: Adres URL hooka usunięty.
      # Authorization header input
      auth:
        field_label: Nagłówek autoryzacji (np. Bearer <token>) (opcjonalnie)
        saved: Nagłówek autoryzacji zapisany.
        removed: Nagłówek autoryzacji usunięty.

