    few  {{ Czy na pewno chcesz usunąć zaznaczone {$count} wpisy i powiązane zasoby? }}
    many {{ Czy na pewno chcesz usunąć zaznaczonych {$count} wpisów i powiązane zasoby? }}
    *    {{ Czy na pewno chcesz usunąć zaznaczonych {$count} wpisów i powiązane zasoby? }}
confirm_deleting_all_entries: Czy na pewno chcesz usunąć wszystkie wpisy?
confirm_deleting_all_entries_with_assets: Czy na pewno chcesz usunąć wszystkie wpisy i powiązane zasoby?
# Note added to the confirmation when other entries reference the entries being deleted through
