# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Wystąpił błąd w konfiguracji CMS. Rozwiąż problem i spróbuj ponownie. }}
      *   {{ Wystąpiły błędy w konfiguracji CMS. Rozwiąż problemy i spróbuj ponownie. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: kolekcja {$collection}
    file: plik {$file}
    component: komponent {$component}
    # Don’t localize `{$field}`
    field: pole `{$field}`

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS działa tylko z adresami HTTPS lub localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ Adres URL pliku konfiguracyjnego musi używać protokołu HTTPS lub adresu localhost. }}
        *   {{ Adresy URL plików konfiguracyjnych muszą używać protokołu HTTPS lub adresów localhost. }}
    fetch_failed: Nie udało się pobrać pliku konfiguracyjnego.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: Odpowiedź HTTP zwrócona ze statusem {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Nie udało się pobrać pliku konfiguracyjnego. Aby zapobiec ładowaniu pliku `config.yml`, dodaj <a>`load_config_file: false`</a> do obiektu konfiguracji przekazanego do `CMS.init()`.'
    parse_failed: Nie udało się przetworzyć pliku konfiguracyjnego.
    parse_failed_invalid_object: Plik konfiguracyjny nie jest prawidłowym obiektem JavaScript.
    parse_failed_unsupported_type: Plik konfiguracyjny nie jest prawidłowym typem pliku. Obsługiwane są tylko formaty YAML, TOML i JSON.
    no_collection: Kolekcje nie są zdefiniowane.
    # Don’t localize `hide`
    no_visible_collection: Co najmniej jedna kolekcja musi być widoczna. Sprawdź opcję `hide`.
    missing_backend: Backend nie jest zdefiniowany.
    missing_backend_name: Nazwa backendu nie jest zdefiniowana.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Backend {$name} <a>nie jest obsługiwany</a> w Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Przestarzały backend {$name} <a>nie jest obsługiwany</a> w Sveltia CMS.
    unsupported_custom_backend: Własne backendy <a>nie są obsługiwane</a> w Sveltia CMS.
    unsupported_backend_suggestion: Użyj jednego z <a>obsługiwanych backendów</a>.
    missing_repository: Repozytorium nie jest zdefiniowane.
    invalid_repository: Skonfigurowane repozytorium jest nieprawidłowe. Musi być w formacie “właściciel/repozytorium”.
    # Don’t localize `api_root`
    missing_api_root: Opcja `api_root` nie jest zdefiniowana. Jest wymagana dla backendu Forgejo.
    invalid_root_dir: Katalog główny jest nieprawidłowy. Musi być ścieżką w obrębie repozytorium, bez “..”.
    invalid_root_dir_branch: Katalogu głównego nie można użyć w nazwach gałęzi trybów publikacji `editorial_workflow` i `preview`. Żadna część jego ścieżki nie może zaczynać się od kropki, kończyć na “.lock” ani zawierać spacji lub znaku specjalnego, takiego jak dwukropek czy gwiazdka.
    path_outside_root_dir: Ścieżka “{$path}” prowadzi poza katalog główny, w którym CMS nie może wyświetlać plików.
    oauth_implicit_flow: Skonfigurowana metoda uwierzytelniania (implicit flow) nie jest obsługiwana w Sveltia CMS. Użyj innej <a>metody uwierzytelniania</a>.
    github_pkce_unsupported: Autoryzacja PKCE nie jest jeszcze obsługiwana z powodu ograniczeń GitHub. Użyj innej <a>metody uwierzytelniania</a>.
    additions_no_base_url: Opcja `base_url` musi być adresem URL Twojej usługi Sveltia CMS Additions.
    oauth_no_app_id: Identyfikator aplikacji OAuth nie jest zdefiniowany.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: Opcja `open_authoring` wymaga trybu publikacji `editorial_workflow` lub `preview`. Szczegóły znajdziesz w <a>dokumentacji</a>.
    # Don’t localize `auth_methods`
    no_auth_methods: Opcja `auth_methods` musi zawierać co najmniej jedną metodę.
    # Don’t localize `auth_scope`, `repo` and `public_repo`
    auth_scope_no_repo: Opcja `auth_scope` musi zawierać `repo` lub `public_repo`.
    missing_media_folder: Folder multimediów nie jest zdefiniowany.
    public_folder_relative_path: Skonfigurowany folder publiczny jest nieprawidłowy. Musi być ścieżką bezwzględną zaczynającą się od “/”.
    public_folder_absolute_url: Bezwzględny adres URL dla opcji folderu publicznego nie jest obsługiwany w Sveltia CMS.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: Opcja `{$option}` zawiera znacznik szablonu `{$tag}`, który nie jest tam obsługiwany. Można używać tylko znaczników szablonu przyjaznego linku, takich jak `\{\{slug\}\}` i `\{\{year\}\}`, oraz znaczników `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` i `\{\{public_folder\}\}`.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: Opcja `{$option}` zawiera znacznik szablonu `{$tag}`, którego można używać tylko w opcji kolekcji, pliku kolekcji lub pola, gdzie istnieje wpis, z którego można go wypełnić.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: Opcja `sanitize_replacement` ma wartość `{$replacement}`, ale zawiera znak, którego nie można użyć w przyjaznym linku, więc nie może go zastępować.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: Opcja `{$option}` ma wartość `{$url}`, ale musi być bezwzględnym adresem URL zaczynającym się od `https://` lub `http://`.
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: Opcja `stages` w `publish_mode` musi zaczynać się od `draft` i wymieniać etapy w kolejności `draft`, `pending_review`, `pending_publish`, bez powtórzeń.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: Opcja `i18n.locales` musi zawierać co najmniej jeden język.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: Opcja `default_locale` ma wartość `{$locale}`, ale nie jest ona jednym z języków w `locales`.
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: Opcja `initial_locales` zawiera `{$locale}`, ale nie jest to jeden z języków w `locales`.
    # Don’t localize `i18n`
    i18n_no_collections: 'Opcja `i18n` jest skonfigurowana na najwyższym poziomie, ale żadna z kolekcji ani wpisów pojedynczych nie ma opcji `i18n`, więc żadnej treści nie można przetłumaczyć. Dodaj `i18n: true` do kolekcji i wpisów pojedynczych, które mają być tłumaczone.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: Opcja `transformations` zawiera nieobsługiwany klucz `{$key}`. Musi to być `raster_image`, `svg` lub obsługiwany format obrazu rastrowego.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: Opcja `quality` transformacji `{$key}` jest nieprawidłowa. Musi to być liczba całkowita od 0 do 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: Opcja `{$prop}` transformacji `{$key}` jest nieprawidłowa. Musi to być dodatnia liczba całkowita.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: Kolekcja zasobów {$count} musi mieć opcję `name` zdefiniowaną jako niepusty ciąg znaków.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Nazwa kolekcji zasobów `{$name}` jest nieprawidłowa. Nie może zawierać znaków specjalnych.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Nazwy kolekcji zasobów muszą być unikalne, ale `{$name}` jest użyta więcej niż raz.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: Kolekcja musi mieć zdefiniowaną opcję `folder`, `file`, `files` lub `divider`.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: Kolekcja nie może mieć więcej niż jednej z opcji `folder`, `file`, `files` i `divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: Rozszerzenie `{$extension}` nie odpowiada formatowi `{$format}`.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: Pole `{$name}` jest zapisywane jako treść pod front matter, która może zawierać tylko tekst, a nie liczbę, wartość logiczną, listę ani obiekt, jak pole typu `{$widget}`. Użyj typu pola przechowującego tekst lub zmień nazwę pola.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
    # brackets are escaped with backslashes for MessageFormat 2
    invalid_collection_data_file: Opcja `file` o wartości `{$file}` jest nieprawidłowa. Musi to być ścieżka do pliku JSON, bez symbolu zastępczego `\{\{locale\}\}`.
    # {$prop} is the option name; Don’t localize `file`
    unsupported_collection_data_file_option: Opcja `{$prop}` nie jest obsługiwana w kolekcji z opcją `file`.
    # Don’t localize `file`, `publish_mode` and `simple`
    collection_data_file_workflow: Obieg redakcyjny i obieg podglądu, w tym otwarte autorstwo, nie są obsługiwane w kolekcji z opcją `file`. Ustaw opcję `publish_mode` kolekcji na `simple`.
    # {$prop} is the option name; Don’t localize `file` and `slug`. The curly brackets are escaped
    # with backslashes for MessageFormat 2
    collection_data_file_slug_tag: Opcja `{$prop}` nie może zawierać znacznika `\{\{slug\}\}` w kolekcji z opcją `file`, ponieważ przyjazny link wpisu to jego pozycja, która zmienia się, gdy wpisy są przestawiane lub usuwane. Zamiast tego użyj pola o unikalnej wartości.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Szablon przyjaznego linku `{$slug}` jest nieprawidłowy, ponieważ nie może zawierać ukośników. Aby organizować wpisy w podfolderach, użyj opcji `path` zamiast `slug`.
    # {$name} is the field name from the configuration; Don’t localize `identifier_field`
    invalid_identifier_field: Opcja `identifier_field` odwołuje się do `{$name}`, ale takie pole nie jest zdefiniowane w kolekcji.
    # {$name} is the field name from the configuration; Don’t localize `filter`
    invalid_filter_field: Opcja `filter` odwołuje się do `{$name}`, ale takie pole nie jest zdefiniowane w kolekcji.
    # Don’t localize `filter`, `value` and `pattern`
    invalid_filter_no_condition: Opcja `filter` musi mieć opcję `value` lub `pattern`, według której dopasowywane są wpisy.
    # {$option} is an option name such as `slug` or `summary` and {$name} is the field name or template tag from the configuration
    option_field_not_found: Opcja `{$option}` odwołuje się do `{$name}`, ale takie pole nie jest zdefiniowane.
    # {$name} is the field name from the configuration and {$widget} is its field type; Don’t localize `thumbnail`
    thumbnail_field_not_media: Opcja `thumbnail` odwołuje się do `{$name}`, ale musi to być pole typu Image lub File, a nie pole typu `{$widget}`.
    # Don’t localize `inline` or `multiple`
    invalid_inline_component_fields: Tryb `inline` wymaga pojedynczego pola typu Boolean, Color, DateTime, Number, Relation, Select lub String. Pole typu Relation lub Select nie może mieć włączonej opcji `multiple`.
    # {$option} is an option name such as `pattern` or `filter` and {$pattern} is the configured pattern
    invalid_regex: Opcja `{$option}` zawiera nieprawidłowe wyrażenie regularne `{$pattern}`, które zostanie zignorowane.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: Opcja `reorder` odwołuje się do grupy widoku o nazwie `{$name}`, ale taka grupa nie jest zdefiniowana w opcji `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit` and `fields`
    invalid_bulk_edit_field: Lista `fields` opcji `bulk_edit` odwołuje się do pola o nazwie `{$name}`, ale takie pole najwyższego poziomu nie jest zdefiniowane w kolekcji.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit`, `fields` and `multiple`
    unsupported_bulk_edit_field: Pola `{$name}` z listy `fields` opcji `bulk_edit` nie można edytować zbiorczo. Obsługiwane jest tylko pole typu Boolean, Color, DateTime, Number, Relation, Select lub String, które nie jest tylko do odczytu, nie ma włączonej opcji `multiple` i nie jest ustawiane automatycznie podczas zapisywania.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
