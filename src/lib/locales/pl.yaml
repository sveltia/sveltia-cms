# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: Nieprawidłowe pliki
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    one {{ Ten plik nie może zostać przesłany, ponieważ jest uszkodzony lub jego zawartość nie odpowiada rozszerzeniu pliku. Zdarza się to często, gdy zdjęcie zostało przemianowane zamiast przekonwertowane, np. obraz HEIC zapisany jako plik JPEG. Przekonwertuj plik i spróbuj ponownie. }}
    *   {{ Te pliki nie mogą zostać przesłane, ponieważ są uszkodzone lub ich zawartość nie odpowiada rozszerzeniom plików. Zdarza się to często, gdy zdjęcia zostały przemianowane zamiast przekonwertowane, np. obrazy HEIC zapisane jako pliki JPEG. Przekonwertuj pliki i spróbuj ponownie. }}
