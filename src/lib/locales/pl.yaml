readonly_collection: Ta kolekcja jest tylko do odczytu. Możesz przeglądać jej treść, ale nie możesz wprowadzać żadnych zmian.
readonly_entry: Ten wpis jest tylko do odczytu. Możesz go przeglądać, ale nie możesz wprowadzać żadnych zmian.
readonly_asset_folder: Ten folder jest tylko do odczytu. Możesz przeglądać jego zasoby, ale nie możesz wprowadzać żadnych zmian.
readonly_branch: Nie masz uprawnień do wypychania zmian do gałęzi “{$branch}”. Możesz przeglądać tę treść, ale nie możesz wprowadzać żadnych zmian.
