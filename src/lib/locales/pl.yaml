# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: To pole jest wymagane.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: Data/godzina musi być nie wcześniejsza niż {$min}.
    date: Data musi być nie wcześniejsza niż {$min}.
    time: Godzina musi być nie wcześniejsza niż {$min}.
    number: Wartość musi być większa lub równa {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Musisz wybrać co najmniej {$min} opcję. }}
        *   {{ Musisz wybrać co najmniej {$min} opcji. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Musisz dodać co najmniej {$min} element. }}
        *   {{ Musisz dodać co najmniej {$min} elementów. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: Data/godzina musi być nie późniejsza niż {$max}.
    date: Data musi być nie późniejsza niż {$max}.
    time: Godzina musi być nie późniejsza niż {$max}.
    number: Wartość musi być mniejsza lub równa {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ Nie możesz wybrać więcej niż {$max} opcję. }}
        *   {{ Nie możesz wybrać więcej niż {$max} opcji. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ Nie możesz dodać więcej niż {$max} element. }}
        *   {{ Nie możesz dodać więcej niż {$max} elementów. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Musisz wprowadzić co najmniej {$min} znak. }}
      *   {{ Musisz wprowadzić co najmniej {$min} znaków. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ Nie możesz wprowadzić więcej niż {$max} znak. }}
      *   {{ Nie możesz wprowadzić więcej niż {$max} znaków. }}

