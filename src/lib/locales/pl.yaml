  # {$count} is the current character count; {$min} and {$max} are configured limits
  min_max: |
    .input {$count :integer}
    .match $count
      0    {{ Nie wprowadzono żadnych znaków. Minimum: {$min}. Maksimum: {$max}. }}
      one  {{ Wprowadzono {$count} znak. Minimum: {$min}. Maksimum: {$max}. }}
      few  {{ Wprowadzono {$count} znaki. Minimum: {$min}. Maksimum: {$max}. }}
      many {{ Wprowadzono {$count} znaków. Minimum: {$min}. Maksimum: {$max}. }}
      *    {{ Wprowadzono {$count} znaków. Minimum: {$min}. Maksimum: {$max}. }}
  # {$count} is the current character count and {$min} is the minimum allowed count
  min: |
    .input {$count :integer}
    .match $count
      0    {{ Nie wprowadzono żadnych znaków. Minimum: {$min}. }}
      one  {{ Wprowadzono {$count} znak. Minimum: {$min}. }}
      few  {{ Wprowadzono {$count} znaki. Minimum: {$min}. }}
      many {{ Wprowadzono {$count} znaków. Minimum: {$min}. }}
      *    {{ Wprowadzono {$count} znaków. Minimum: {$min}. }}
  # {$count} is the current character count and {$max} is the maximum allowed count
  max: |
    .input {$count :integer}
    .match $count
      0    {{ Nie wprowadzono żadnych znaków. Maksimum: {$max}. }}
      one  {{ Wprowadzono {$count} znak. Maksimum: {$max}. }}
      few  {{ Wprowadzono {$count} znaki. Maksimum: {$max}. }}
      many {{ Wprowadzono {$count} znaków. Maksimum: {$max}. }}
      *    {{ Wprowadzono {$count} znaków. Maksimum: {$max}. }}

