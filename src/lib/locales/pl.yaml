sign_in: Zaloguj się

# Mobile sign-in feature: dialog title and instructions for QR code authentication
sign_in_with_mobile: Zaloguj się z urządzenia mobilnego
# Instructions shown in the mobile sign-in dialog for passwordless authentication
sign_in_with_mobile_instruction: Zeskanuj poniższy kod QR telefonem lub tabletem, aby zalogować się bez hasła. Twoje ustawienia zostaną automatycznie skopiowane.

# Account menu: user status and repository mode indicators
# Shown at the top of the account dropdown menu
# {$name} is the signed-in user’s login name
signed_in_as_x: 'Zalogowano jako {$name}'
working_with_local_repo: Praca z lokalnym repozytorium
working_with_test_repo: Praca z repozytorium testowym

# Account menu: action items for sign-out and app installation
sign_out: Wyloguj się
install_as_app: Zainstaluj jako aplikację

