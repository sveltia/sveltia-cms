backend_status:
  minor_incident: '{$service} doświadcza drobnej awarii. Twoja praca może być utrudniona.'
  major_incident: '{$service} doświadcza poważnej awarii. Zalecamy poczekać, aż sytuacja się poprawi.'

# ==============================================================================
# Content and Asset Libraries
# ==============================================================================
# Strings used in the main content and asset management interfaces, including
# lists, navigation, and collection/folder views.

# Page container aria-labels
content_library: Biblioteka treści
asset_library: Biblioteka zasobów

# Primary sidebar section headings and list aria-labels
collections: Kolekcje
entries: Wpisy
files: Pliki

# Asset location selector: option group labels
asset_location:
  # Assets stored in the site’s Git repository
  repository: Twoja witryna
  external: Lokalizacje zewnętrzne
  stock_photos: Zdjęcia stockowe

# Sidebar and list labels
# Collection assets panel aria-label
collection_assets: Zasoby kolekcji
# List aria-labels for different list types
entry_list: Lista wpisów
file_list: Lista plików
asset_list: Lista zasobów

# Collection and folder page titles
# Used as aria-labels on page containers
# {$collection} is the current collection label
x_collection: Kolekcja “{$collection}”
# {$folder} is the current asset folder label
x_asset_folder: Folder zasobów “{$folder}”

# Navigation announcements (ARIA live regions)
# Announce page changes for screen reader users
viewing_collection_list: Przeglądasz teraz listę kolekcji.
viewing_asset_folder_list: Przeglądasz teraz listę folderów zasobów.
# Collection view announcements with entry counts
# {$collection} is the collection label and {$count} is the number of entries in it
viewing_x_collection: |
  .input {$count :integer}
  .match $count
    0   {{ Przeglądasz teraz kolekcję “{$collection}”, która nie ma jeszcze żadnych wpisów. }}
    one {{ Przeglądasz teraz kolekcję “{$collection}”, która ma jeden wpis. }}
    *   {{ Przeglądasz teraz kolekcję “{$collection}”, która ma {$count} wpisów. }}
# Asset folder view announcements with asset counts
# {$folder} is the folder label and {$count} is the number of assets in it
viewing_x_asset_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Przeglądasz teraz folder zasobów “{$folder}”, który nie ma jeszcze żadnych zasobów. }}
    one {{ Przeglądasz teraz folder zasobów “{$folder}”, który ma jeden zasób. }}
    *   {{ Przeglądasz teraz folder zasobów “{$folder}”, który ma {$count} zasobów. }}

# Singleton file selection announcement
# {$file} is the singleton file name
singleton_selected_announcement: Naciśnij Enter, aby edytować plik “{$file}”.

# Error messages: collection or file not found
collection_not_found: Nie znaleziono kolekcji.
file_not_found: Nie znaleziono pliku.

# Selection count indicator
# Shown in the toolbar when items are selected (e.g., ”2 of 10 selected”)
# {$selected} is the selected item count and {$total} is the total item count
x_of_x_selected: 'Zaznaczono {$selected} z {$total}'

# View switcher: toggle between list and grid views
switch_view: Przełącz widok
list_view: Widok listy
grid_view: Widok siatki
switch_to_list_view: Przełącz na widok listy
switch_to_grid_view: Przełącz na widok siatki

