# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Wystąpił błąd w konfiguracji CMS. Rozwiąż problem i spróbuj ponownie. }}
      *   {{ Wystąpiły błędy w konfiguracji CMS. Rozwiąż problemy i spróbuj ponownie. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: 'kolekcja {$collection}'
    file: 'plik {$file}'
    component: 'komponent {$component}'
    # Don’t localize `{$field}`
    field: 'pole `{$field}`'

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS działa tylko z adresami HTTPS lub localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ Adres URL pliku konfiguracyjnego musi używać protokołu HTTPS lub adresu localhost. }}
        *   {{ Adresy URL plików konfiguracyjnych muszą używać protokołu HTTPS lub adresów localhost. }}
    fetch_failed: Nie udało się pobrać pliku konfiguracyjnego.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: Odpowiedź HTTP zwrócona ze statusem {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Nie udało się pobrać pliku konfiguracyjnego. Aby zapobiec ładowaniu pliku `config.yml`, dodaj <a>`load_config_file: false`</a> do obiektu konfiguracji przekazanego do `CMS.init()`.'
    parse_failed: Nie udało się przetworzyć pliku konfiguracyjnego.
    parse_failed_invalid_object: Plik konfiguracyjny nie jest prawidłowym obiektem JavaScript.
    parse_failed_unsupported_type: Plik konfiguracyjny nie jest prawidłowym typem pliku. Obsługiwane są tylko formaty YAML, TOML i JSON.
    no_collection: Kolekcje nie są zdefiniowane.
    missing_backend: Backend nie jest zdefiniowany.
    missing_backend_name: Nazwa backendu nie jest zdefiniowana.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Backend {$name} <a>nie jest obsługiwany</a> w Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Przestarzały backend {$name} <a>nie jest obsługiwany</a> w Sveltia CMS.
    unsupported_custom_backend: Własne backendy <a>nie są obsługiwane</a> w Sveltia CMS.
    unsupported_backend_suggestion: Użyj jednego z <a>obsługiwanych backendów</a>.
    missing_repository: Repozytorium nie jest zdefiniowane.
    invalid_repository: Skonfigurowane repozytorium jest nieprawidłowe. Musi być w formacie “właściciel/repozytorium”.
    oauth_implicit_flow: Skonfigurowana metoda uwierzytelniania (implicit flow) nie jest obsługiwana w Sveltia CMS. Użyj innej <a>metody uwierzytelniania</a>.
    github_pkce_unsupported: Autoryzacja PKCE nie jest jeszcze obsługiwana z powodu ograniczeń GitHub. Użyj innej <a>metody uwierzytelniania</a>.
    oauth_no_app_id: Identyfikator aplikacji OAuth nie jest zdefiniowany.
    # Don’t localize `auth_methods`
    no_auth_methods: Opcja `auth_methods` musi zawierać co najmniej jedną metodę.
    missing_media_folder: Folder multimediów nie jest zdefiniowany.
    public_folder_relative_path: Skonfigurowany folder publiczny jest nieprawidłowy. Musi być ścieżką bezwzględną zaczynającą się od “/”.
    public_folder_absolute_url: Bezwzględny adres URL dla opcji folderu publicznego nie jest obsługiwany w Sveltia CMS.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: Kolekcja zasobów {$count} musi mieć opcję `name` zdefiniowaną jako niepusty ciąg znaków.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Nazwa kolekcji zasobów `{$name}` jest nieprawidłowa. Nie może zawierać znaków specjalnych.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Nazwy kolekcji zasobów muszą być unikalne, ale `{$name}` jest użyta więcej niż raz.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_no_options: Kolekcja musi mieć zdefiniowaną opcję `folder`, `files` lub `divider`.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_multiple_options: Kolekcja nie może mieć jednocześnie opcji `folder`, `files` i `divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: Rozszerzenie `{$extension}` nie odpowiada formatowi `{$format}`.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Szablon przyjaznego linku `{$slug}` jest nieprawidłowy, ponieważ nie może zawierać ukośników. Aby organizować wpisy w podfolderach, użyj opcji `path` zamiast `slug`.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: Kolekcja {$count} musi mieć opcję `name` zdefiniowaną jako niepusty ciąg znaków.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: Nazwa kolekcji `{$name}` jest nieprawidłowa. Nie może zawierać znaków specjalnych.
    duplicate_collection_name: Nazwy kolekcji muszą być unikalne, ale `{$name}` jest użyta więcej niż raz.
    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
    missing_collection_file_name: Plik kolekcji {$count} musi mieć opcję `name` zdefiniowaną jako niepusty ciąg znaków.
    # {$name} is the invalid or duplicate collection file name
    invalid_collection_file_name: Nazwa pliku kolekcji `{$name}` jest nieprawidłowa. Nie może zawierać znaków specjalnych.
    duplicate_collection_file_name: Nazwy plików kolekcji muszą być unikalne, ale `{$name}` jest użyta więcej niż raz.
    # Don’t localize `fields`
    collection_no_fields: Kolekcja musi mieć opcję `fields` zdefiniowaną z co najmniej jednym polem.
    # Don’t localize `fields`
    collection_file_no_fields: Plik kolekcji musi mieć opcję `fields` zdefiniowaną z co najmniej jednym polem.
    # Don’t localize `i18n`, `locale` and `file`
    collection_file_i18n_required: Plik kolekcji musi mieć opcję `i18n` zdefiniowaną, jeśli w ścieżce `file` jest użyty znacznik `locale`.
    # {$count} is the 1-based field index in the current fields array; Don’t localize `name`
    missing_field_name: Pole {$count} musi mieć opcję `name` zdefiniowaną jako niepusty ciąg znaków.
    # {$name} is the invalid or duplicate field name
    invalid_field_name: Nazwa pola `{$name}` jest nieprawidłowa. Nie może zawierać znaków specjalnych. Jeśli chcesz zagnieżdżać pola, <a>użyj pól typu Object zamiast notacji kropkowej</a>.
    duplicate_field_name: Nazwy pól muszą być unikalne, ale `{$name}` jest użyta więcej niż raz.
    # {$count} is the 1-based variable type index in the current types array
    missing_variable_type: Typ zmiennej {$count} musi mieć opcję `name` zdefiniowaną jako niepusty ciąg znaków.
    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: Nazwa typu zmiennej `{$name}` jest nieprawidłowa. Nie może zawierać znaków specjalnych.
    duplicate_variable_type: Nazwy typów zmiennych muszą być unikalne, ale `{$name}` jest użyta więcej niż raz.
    date_field_type: 'Przestarzały typ pola Date nie jest obsługiwany w Sveltia CMS. Użyj typu pola DateTime z opcją `type: date`.'
    # {$timeZone} is the invalid IANA timezone identifier from the configuration
    invalid_timezone: 'Nieprawidłowa strefa czasowa: {$timeZone}. Musi być prawidłowym identyfikatorem strefy czasowej IANA, np. `America/New_York` lub `Asia/Tokyo`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: Przestarzała opcja `{$prop}` nie jest obsługiwana w Sveltia CMS. Użyj opcji `{$newProp}`.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: Opcja `allow_multiple` nie jest obsługiwana w Sveltia CMS. Użyj opcji `multiple`, która domyślnie ma wartość `false`.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: Pole typu List nie może mieć jednocześnie opcji `field`, `fields` i `types`.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: Typ zmiennej pola List jest nieprawidłowy. Opcja `widget` jest ustawiona na `{$widget}`, ale musi być `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: Pole typu Object nie może mieć jednocześnie opcji `fields` i `types`.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: Odwołanie do kolekcji `{$collection}` jest nieprawidłowe lub kolekcja nie jest zdefiniowana.
    relation_field_invalid_collection_file: Odwołanie do pliku `{$file}` jest nieprawidłowe lub plik nie jest zdefiniowany.
    # Don’t localize `file`
    relation_field_missing_file_name: Opcja `file` musi być zdefiniowana dla relacji do kolekcji plików.
    relation_field_invalid_value_field: Odwołanie do pola wartości `{$field}` jest nieprawidłowe lub pole nie jest zdefiniowane.
    unexpected: Nieoczekiwany błąd

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: Identyfikator aplikacji OAuth nie jest zdefiniowany. Użytkownicy muszą podać token dostępu, aby się zalogować.
    editorial_workflow_unsupported: Obieg redakcyjny nie jest jeszcze obsługiwany w Sveltia CMS.
    nested_collections_unsupported: Zagnieżdżone kolekcje nie są jeszcze obsługiwane w Sveltia CMS.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: Opcja `{$prop}` nie jest obsługiwana w Sveltia CMS. Zostanie zignorowana.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Ustawiono zarówno `picker_utc`, jak i nowsze opcje stref czasowych (`input_timezone` lub `output_utc`). Nowe opcje mają pierwszeństwo. Rozważ usunięcie `picker_utc` z konfiguracji.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Szczegóły znajdziesz w informacjach o kompatybilności: {$link}'

  # Console tip shown after config load
  schema_tip: Aby uzyskać lepsze doświadczenie programistyczne, możesz zwalidować plik konfiguracyjny względem schematu JSON Sveltia CMS. Szczegóły znajdziesz na {$link}.

