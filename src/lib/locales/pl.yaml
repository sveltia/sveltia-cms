visit_live_site: Odwiedź witrynę
# Page switcher button group aria-label for switching between main sections
switch_page: Przełącz stronę

# Search input placeholders
search_placeholder_contents: Szukaj treści…
search_placeholder_assets: Szukaj zasobów…
search_placeholder_all: Szukaj treści i zasobów…

# Create button: aria-label for the create menu in the toolbar
create_entry_or_assets: Utwórz wpis lub zasoby

# Publishing actions: button labels and progress indicators
publish_changes: Opublikuj zmiany
publishing_changes: Publikowanie zmian…
# Error notification when publishing fails
publishing_changes_failed: Nie udało się opublikować zmian. Spróbuj ponownie.

# Notifications: button aria-labels and section headings
show_notifications: Pokaż powiadomienia
notifications: Powiadomienia

# Account menu: button aria-labels and section headings
show_account_menu: Pokaż menu konta
# Account section heading in the account menu and mobile menu page
account: Konto

# Account menu items: links to external resources
live_site: Witryna
git_repository: Repozytorium Git
settings: Ustawienia

# Help menu: button aria-labels and section headings
show_help_menu: Pokaż menu pomocy
# Help section heading in dropdowns and mobile menu
help: Pomoc

# Help menu items: documentation and support resources
keyboard_shortcuts: Skróty klawiszowe
documentation: Dokumentacja
release_notes: Informacje o wydaniu
