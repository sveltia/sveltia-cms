report_issue: Zgłoś problem
share_feedback: Podziel się opinią
get_help: Uzyskaj pomoc
donate: Wspomóż
join_discord: Dołącz do nas na Discordzie
bluesky: Obserwuj nas na Bluesky

# Update notification: infobar message and button
update_available: Dostępna jest najnowsza wersja Sveltia CMS.
update_now: Zaktualizuj teraz

# Backend status notifications
# Shown when the Git backend (GitHub, GitLab, etc.) is experiencing issues
