# {$types} is the list of accepted image formats, such as “PNG or WebP”
warning_unsupported_image_files: |
  .input {$count :integer}
  .match $count
    one {{ Ten plik nie może zostać przesłany, ponieważ akceptowany jest tylko obraz następujących typów: {$types}. }}
    *   {{ Te pliki nie mogą zostać przesłane, ponieważ akceptowane są tylko obrazy następujących typów: {$types}. }}

