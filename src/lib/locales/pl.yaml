  accessibility:
    title: Dostępność
    underline_links:
      title: Podkreślanie linków
      description: Pokaż podkreślenie linków w podglądzie wpisu i etykietach interfejsu użytkownika.
      switch_label: Zawsze podkreślaj linki

  # Advanced panel
  advanced:
