# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: |
  .input {$quota :integer}
  .match $quota
    one  {{ Nie możesz dodać nowych wpisów do tej kolekcji, ponieważ osiągnęła ona limit {$quota} wpisu. }}
    few  {{ Nie możesz dodać nowych wpisów do tej kolekcji, ponieważ osiągnęła ona limit {$quota} wpisów. }}
    many {{ Nie możesz dodać nowych wpisów do tej kolekcji, ponieważ osiągnęła ona limit {$quota} wpisów. }}
    *    {{ Nie możesz dodać nowych wpisów do tej kolekcji, ponieważ osiągnęła ona limit {$quota} wpisów. }}
