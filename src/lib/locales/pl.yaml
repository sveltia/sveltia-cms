local_git_skip_reasons:
  unsupported_repository: Twoje repozytorium używa funkcji Git, której CMS nie obsługuje, takiej jak powiązane drzewo robocze (linked worktree), nazwy obiektów SHA-256, format reftable, rzadki indeks (sparse index) lub indeks w wersji 3 albo 4, używany przez opcję feature.manyFiles i polecenie git add -N.
  missing_identity: Twoje imię i nazwisko oraz adres e-mail nie są ustawione w konfiguracji Git repozytorium, a CMS nie może odczytać Twojej konfiguracji globalnej. Ustaw je w repozytorium poleceniami git config --local user.name "Your Name" i git config --local user.email "you@example.com".
  locked: Inny proces Git używa repozytorium. Jeśli żaden nie jest uruchomiony, usuń plik .git/index.lock.
  # The operation in progress, with how to finish or cancel it
  operation_in_progress:
    merge: Trwa scalanie (merge). Dokończ je poleceniem git commit lub anuluj poleceniem git merge --abort.
    rebase: Trwa rebase. Dokończ go poleceniem git rebase --continue lub anuluj poleceniem git rebase --abort. Jeśli zajmujesz się już czymś innym, polecenie git rebase --quit porzuci go bez zmieniania Twoich plików.
    cherry_pick: Trwa cherry-pick. Dokończ go poleceniem git cherry-pick --continue lub anuluj poleceniem git cherry-pick --abort.
    revert: Trwa wycofywanie (revert). Dokończ je poleceniem git revert --continue lub anuluj poleceniem git revert --abort.
    am: Trwa nakładanie poprawek poleceniem git am. Dokończ je poleceniem git am --continue lub anuluj poleceniem git am --abort.
    conflict: Niektóre pliki mają konflikty. Najpierw je rozwiąż i dodaj wyniki do poczekalni (stage).
  detached_head: Nie jest wybrana żadna gałąź (checkout).
  staged_changes: Masz inne zmiany przygotowane do zatwierdzenia (staged). Najpierw je zatwierdź lub usuń z poczekalni.
