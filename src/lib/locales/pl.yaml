  # template using a field. {$name} is the singular label of the collection
  move_unsupported: Te zmiany przeniosłyby element ({$name}) do innej lokalizacji, co można zrobić tylko podczas jego osobnej edycji.
  # Error shown when saving, if someone else has changed an entry edited from the field since. {$name}
  # is the summary of that entry
  edit_conflict: Wpis “{$name}” został zmieniony przez kogoś innego od czasu Twojej edycji. Otwórz go ponownie z pola, aby porównać swoje zmiany z najnowszą wersją.
  # Error shown when saving, if someone else has deleted an entry edited from the field since.
  # {$name} is the summary of that entry
  edit_deleted: Wpis “{$name}” został usunięty przez kogoś innego od czasu Twojej edycji. Usuń go z pola, aby zapisać wpis.
  # Accessible label of the menu listing the selected entries that can be edited
  select_entry_to_edit: Wybierz wpis do edycji
  # Warning shown in the editor of an entry that has been edited from a Relation field of another
  # entry, while the changes wait in that entry’s pull request. {$name} is the summary of that
  # entry
  edited_with_entry: Zmiany w tym wpisie czekają na publikację razem z wpisem “{$name}”. Jeśli zapiszesz go teraz, oba zestawy zmian zostaną połączone podczas publikacji tamtego wpisu, co może się nie udać, jeśli się pokrywają.
  # Warning shown in the dialog when an entry edited from the field has been changed by someone else
  # since. {$name} is the singular label of the collection
  changed_since_edit: Ten element ({$name}) został zmieniony przez kogoś innego od czasu Twojej edycji. Twoje zmiany są wyświetlane na tle najnowszej wersji. Przejrzyj je przed aktualizacją.

