  .input {$count :integer}
  .match $count
    one {{ Ten plik nie może zostać przesłany, ponieważ nie jest jednym z następujących typów: {$types}. }}
    *   {{ Te pliki nie mogą zostać przesłane, ponieważ nie są jednym z następujących typów: {$types}. }}
