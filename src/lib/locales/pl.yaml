    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'Opcja `{$option}` musi mieć jedną z tych wartości: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: Opcja `{$option}` musi mieć wartość `{$value}`.
    schema_invalid_empty_value: Opcja `{$option}` musi być pustym ciągiem znaków.
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: Opcja `{$option}` musi być tablicą o {$count} elementach.
    schema_invalid_value: Opcja `{$option}` ma nieprawidłową wartość.
    schema_missing_option: Opcja `{$option}` jest wymagana.
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Wymagana jest jedna z tych opcji: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: ciągiem znaków
      number: liczbą
      integer: liczbą całkowitą
      boolean: wartością logiczną
      array: tablicą
      object: obiektem
      'null': pusta

