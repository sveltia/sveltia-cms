        # {$app} is the name of the CMS
        subject: Twoje hasło do {$app} zostało zresetowane
        # {$app} is the name of the CMS
        message: Twoje hasło do {$app} zostało zresetowane i nastąpiło wylogowanie ze wszystkich urządzeń. Otwórz poniższy link, który wypełni Twoją nazwę użytkownika i hasło tymczasowe, a podczas logowania wybierz nowe hasło.
