hide_info: Ukryj informacje

# Folder display labels when no specific path is configured
all_assets: Wszystkie zasoby
global_assets: Zasoby globalne

# ==============================================================================
# Entry and Collection Actions
# ==============================================================================
# Strings related to creating, editing, and managing entries and collections.

# Error message when entry cannot be found
entry_not_found: Nie znaleziono wpisu.

# Entry creation restrictions: tooltip and advisory messages
creating_entries_disabled_by_admin: Tworzenie nowych wpisów w tej kolekcji zostało wyłączone przez administratora.
# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: Nie możesz dodać nowych wpisów do tej kolekcji, ponieważ osiągnęła ona limit {$quota} wpisów.
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$remaining :integer}
  .match $remaining
    one {{ Ta kolekcja zbliża się do limitu {$quota} wpisów. Możesz utworzyć jeszcze tylko {$remaining} wpis. }}
    *   {{ Ta kolekcja zbliża się do limitu {$quota} wpisów. Możesz utworzyć jeszcze tylko {$remaining} wpisów. }}

# Navigation: back links and list labels
back_to_collection: Powrót do kolekcji
collection_list: Lista kolekcji
back_to_collection_list: Powrót do listy kolekcji
asset_folder_list: Lista folderów zasobów
back_to_asset_folder_list: Powrót do listy folderów zasobów

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: Wyniki wyszukiwania
# {$terms} is the current search query text
search_results_for_x: Wyniki wyszukiwania dla “{$terms}”

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Przeglądasz teraz wyniki wyszukiwania dla “{$terms}”. Nie znaleziono żadnych wpisów. }}
    one {{ Przeglądasz teraz wyniki wyszukiwania dla “{$terms}”. Znaleziono jeden wpis. }}
    *   {{ Przeglądasz teraz wyniki wyszukiwania dla “{$terms}”. Znaleziono {$count} wpisów. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Przeglądasz teraz wyniki wyszukiwania dla “{$terms}”. Nie znaleziono żadnych zasobów. }}
    one {{ Przeglądasz teraz wyniki wyszukiwania dla “{$terms}”. Znaleziono jeden zasób. }}
    *   {{ Przeglądasz teraz wyniki wyszukiwania dla “{$terms}”. Znaleziono {$count} zasobów. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ Brak wpisów }}
    one {{ {$count} wpis }}
    *   {{ {$count} wpisów }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ Brak zasobów }}
    one {{ {$count} zasób }}
    *   {{ {$count} zasobów }}

# Empty state messages
no_files_found: Nie znaleziono plików.
no_entries_found: Nie znaleziono wpisów.

# ==============================================================================
# Asset Management
