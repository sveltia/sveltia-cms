  .input {$count :integer}
  .match $count
    one  {{ Plik o takiej samej nazwie już istnieje w tym folderze. Czy chcesz go zastąpić? }}
    few  {{ {$count} pliki o takich samych nazwach już istnieją w tym folderze. Czy chcesz je zastąpić? }}
    many {{ {$count} plików o takich samych nazwach już istnieje w tym folderze. Czy chcesz je zastąpić? }}
    *    {{ {$count} plików o takich samych nazwach już istnieje w tym folderze. Czy chcesz je zastąpić? }}
