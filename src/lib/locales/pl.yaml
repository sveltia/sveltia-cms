      url:
        field_label: Adres URL hooka
        saved: Adres URL hooka zapisany.
        removed: Adres URL hooka usunięty.
      # Authorization header input
      auth:
        field_label: Nagłówek autoryzacji (np. Bearer <token>) (opcjonalnie)
        saved: Nagłówek autoryzacji zapisany.
        removed: Nagłówek autoryzacji usunięty.

