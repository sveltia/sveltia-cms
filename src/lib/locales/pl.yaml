  .input {$count :integer}
  .match $count
    one {{ Ten plik nie może zastąpić “{$name}”, ponieważ ma inny format. Przekonwertuj plik na ten sam format i spróbuj ponownie. }}
    *   {{ Te pliki nie mogą zastąpić “{$name}”, ponieważ mają inny format. Przekonwertuj pliki na ten sam format i spróbuj ponownie. }}

