# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: To pole jest wymagane.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: Data/godzina musi być nie wcześniejsza niż {$min}.
    date: Data musi być nie wcześniejsza niż {$min}.
    time: Godzina musi być nie wcześniejsza niż {$min}.
    number: Wartość musi być większa lub równa {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one  {{ Musisz wybrać co najmniej {$min} opcję. }}
        few  {{ Musisz wybrać co najmniej {$min} opcje. }}
        many {{ Musisz wybrać co najmniej {$min} opcji. }}
        *    {{ Musisz wybrać co najmniej {$min} opcji. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one  {{ Musisz dodać co najmniej {$min} element. }}
        few  {{ Musisz dodać co najmniej {$min} elementy. }}
        many {{ Musisz dodać co najmniej {$min} elementów. }}
        *    {{ Musisz dodać co najmniej {$min} elementów. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: Data/godzina musi być nie późniejsza niż {$max}.
    date: Data musi być nie późniejsza niż {$max}.
    time: Godzina musi być nie późniejsza niż {$max}.
    number: Wartość musi być mniejsza lub równa {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one  {{ Nie możesz wybrać więcej niż {$max} opcję. }}
        few  {{ Nie możesz wybrać więcej niż {$max} opcje. }}
        many {{ Nie możesz wybrać więcej niż {$max} opcji. }}
        *    {{ Nie możesz wybrać więcej niż {$max} opcji. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one  {{ Nie możesz dodać więcej niż {$max} element. }}
        few  {{ Nie możesz dodać więcej niż {$max} elementy. }}
        many {{ Nie możesz dodać więcej niż {$max} elementów. }}
        *    {{ Nie możesz dodać więcej niż {$max} elementów. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one  {{ Musisz wprowadzić co najmniej {$min} znak. }}
      few  {{ Musisz wprowadzić co najmniej {$min} znaki. }}
      many {{ Musisz wprowadzić co najmniej {$min} znaków. }}
      *    {{ Musisz wprowadzić co najmniej {$min} znaków. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one  {{ Nie możesz wprowadzić więcej niż {$max} znak. }}
      few  {{ Nie możesz wprowadzić więcej niż {$max} znaki. }}
      many {{ Nie możesz wprowadzić więcej niż {$max} znaków. }}
      *    {{ Nie możesz wprowadzić więcej niż {$max} znaków. }}

  # Type validation errors
  type_mismatch:
    number: Wprowadź liczbę.
    email: Wprowadź prawidłowy adres e-mail.
    url: Wprowadź prawidłowy adres URL.

  # Value used for the same field in another entry of the collection
  value_not_unique: Ta wartość jest używana w innym wpisie.
  # Key of a keyed List field item used for another item of the same list
  key_not_unique: Ten klucz jest używany przez inny element.
  # Key of a keyed List field item that is a whole number, which doesn’t keep its order in a map
  key_numeric: Klucz nie może być liczbą całkowitą, ponieważ elementy straciłyby swoją kolejność.

  # Custom field validation error
  invalid_value: Nieprawidłowa wartość.
  unexpected_error: Wystąpił nieoczekiwany błąd.

# ==============================================================================
# Entry Sidebar
# ==============================================================================
# Panels shown in the entry editor sidebar.

entry_sidebar:
  # Sidebar tab list aria-label
  sidebar_panels: Panele boczne

  # Validation panel: shows field validation errors
  validation:
    title: Walidacja
    placeholder: Wyniki walidacji zostaną wyświetlone tutaj.
    no_errors_found: Nie znaleziono błędów.
    # Button in the panel header that validates the entry on demand
    validate: Sprawdź

  # Slug panel: shows the entry slug and lets the user edit it
  slug:
    title: Przyjazny link
    generated_on_save: Przyjazny link jest generowany na podstawie treści wpisu podczas zapisywania. Data i godzina w nim zawarte będą odpowiadać momentowi zapisu.
    unavailable: Ten wpis nie ma przyjaznego linku.

  # History panel: shows entry commit history
  history:
    title: Historia
    fetch_failed: Nie udało się załadować historii.
    no_history: Nie znaleziono historii.

  # Backlinks panel: shows entries referencing this entry
  backlinks:
    title: Odnośniki zwrotne
    no_entries: Żaden wpis nie odwołuje się do tego wpisu.

  # Tab label of a panel with a count, e.g. of comments. {$title} is the panel title
  title_with_count: '{$title} ({$count})'

# Status shown next to the Save button while an entry with many new files is being saved
# {$done} and {$total} are the number of files prepared and to prepare, or the number of commits
# made and the estimated number of commits in all
save_progress:
  preparing: 'Przygotowywanie plików: {$done} z {$total}'
  committing: 'Zapisywanie w GitHub: {$done} z około {$total} commitów'

# Entry save error dialog
saving_entry:
  error:
    title: Błąd
    description: Wystąpił błąd podczas zapisywania wpisu. Spróbuj ponownie później.

# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: Wpis zmieniony przez kogoś innego
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} zmienił(-a) ten wpis {$date}, po tym jak go otworzono.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Ten wpis został zmieniony w repozytorium po tym, jak go otworzono.
  deleted: Ten wpis został usunięty z repozytorium po tym, jak go otworzono.
  # Follows `modified_by` or `modified`
  overwrite_warning: Jeśli zapiszesz teraz, zmiany tej osoby zostaną utracone.
  # Follows `deleted`
  recreate_warning: Jeśli zapiszesz teraz, wpis zostanie utworzony ponownie.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Ponieważ wpis jest przechowywany w tym samym pliku co inne wpisy, nie można go zapisać z nadpisaniem tej zmiany. Anuluj edycję, a następnie ponownie otwórz wpis z listy i wprowadź swoje zmiany.
  # OK button label
  save_anyway: Zapisz mimo to
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: Repozytorium zostało zaktualizowane przez kogoś innego podczas zapisywania. Spróbuj ponownie.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Wpis przechowywany w tym samym pliku został zmieniony przez kogoś innego. Spróbuj ponownie.
  # {$path} is the file path
  array_file_invalid: Nie można zaktualizować pliku {$path}, ponieważ nie zawiera on prawidłowej listy wpisów.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
# repository while the user has it open. The change itself is described with the `save_conflict`
# strings above
remote_change:
  reload_entry: Załaduj wpis ponownie
  # Confirmation shown before reloading when the user has unsaved changes
  confirm_reloading_entry: Czy na pewno chcesz ponownie załadować wpis? Twoje niezapisane zmiany zostaną utracone.

