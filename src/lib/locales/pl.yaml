revert_all_changes: Cofnij wszystkie zmiany
restore_default: Przywróć domyślne
clear_all: Wyczyść wszystko
confirm_reverting_changes: Czy na pewno chcesz cofnąć wszystkie zmiany wprowadzone w tym wpisie?
# {$locale} is a locale name, e.g. French
confirm_reverting_changes_x_locale: Czy na pewno chcesz cofnąć wszystkie zmiany wprowadzone w treści {$locale}?
confirm_restoring_defaults: Czy na pewno chcesz przywrócić wartości domyślne wszystkich pól w tym wpisie? Twoje zmiany zostaną utracone.
confirm_restoring_defaults_x_locale: Czy na pewno chcesz przywrócić wartości domyślne wszystkich pól w treści {$locale}? Twoje zmiany zostaną utracone.
confirm_clearing_fields: Czy na pewno chcesz wyczyścić wszystkie pola w tym wpisie? Twoje zmiany zostaną utracone.
confirm_clearing_fields_x_locale: Czy na pewno chcesz wyczyścić wszystkie pola w treści {$locale}? Twoje zmiany zostaną utracone.

