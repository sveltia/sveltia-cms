      switch_label: Włącz tryb programisty
    deploy_hook:
      title: Webhook wdrożeniowy
      description: Wprowadź adres URL webhooka, który zostanie wywołany po ręcznym uruchomieniu wdrożenia poprzez wybranie Opublikuj zmiany. Można pozostawić puste, jeśli używasz GitHub Actions.
