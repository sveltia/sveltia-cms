# Read https://github.com/sveltia/sveltia-cms/blob/main/src/lib/locales/README.md
# for instructions on how to add new languages or update existing translations.

# ==============================================================================
# Common Actions
# ==============================================================================
# Generic action button labels used throughout the application. These are
# reusable strings for common operations like save, delete, cancel, etc.

# Primary actions: creation, selection, and file operations
create: Nuevo
select: Seleccionar
select_all: Seleccionar todo
# Accessible name of the checkbox that selects a single entry or asset in a list
select_item: Seleccionar {$name}
upload: Subir
copy: Copiar
download: Descargar
duplicate: Duplicar
delete: Eliminar
reorder: Reordenar

# Dialog and form actions: confirmation and cancellation
cancel: Cancelar
done: Hecho
save: Guardar
# Progress indicator shown on the save button while a save operation is in progress
saving: Guardando…

# Publishing actions: used when committing changes to the repository
publish: Publicar
# Progress indicator shown on the publish button during publishing
publishing: Publicando…

# Modification actions: editing and updating content
rename: Renombrar
update: Actualizar
replace: Reemplazar

# List and collection actions: adding and removing items
add: Añadir
remove: Quitar
clear: Limpiar

# Expansion and collapse actions: used for accordions, trees, and expandable sections
expand: Expandir
expand_all: Expandir todo
collapse: Contraer
collapse_all: Contraer todo

# Content manipulation: inserting, restoring, and discarding
insert: Insertar
restore: Restaurar
discard: Descartar

# ==============================================================================
# Common UI Elements
# ==============================================================================
# Reusable labels and messages for common interface elements like status
# indicators, loading states, and toolbar regions.

# Status messages: search and results indicators
# Shown in ARIA live regions during search operations
searching: Buscando…
no_results: No se han encontrado resultados.

# Toolbar region labels: used as aria-labels for different toolbar areas
# These help screen readers identify which toolbar is being navigated
global: Global
primary: Principal
secondary: Secundario
collection: Colección
folder: Carpeta
# Label of the subfolder list in the asset picker
folders: Carpetas
# Menu in a breadcrumb holding the folders that don’t fit
more_folders: Más carpetas

# ==============================================================================
# Miscellaneous Labels
# ==============================================================================
# Various labels used across the application for specific UI elements
# that don’t fit into other categories.

# Field and input labels
api_key: Clave de API
details: Detalles
back: Atrás
# Reusable label for an option whose value is determined automatically, e.g. the UI language
automatic: Automático
# Loading indicator shown during async operations (asset preview, panels, etc.)
loading: Cargando…
# Dismiss button for temporary notifications and infobars
later: Más tarde

# Entry and collection labels
# Slug field heading in entry editors
slug: Slug
# Fallback labels for singleton collections when names aren’t configured
singleton: Singleton
singletons: Singletons

# Error messages
# Toast notification when clipboard operations fail
clipboard_error: No se ha podido copiar al portapapeles.

# ==============================================================================
# Sign-In Page
# ==============================================================================
# Strings specific to the authentication and sign-in page, including welcome
# messages, loading states, OAuth flows, and repository access options.

# Welcome and branding
# Screen reader announcement when the sign-in page loads
# {$name} is the app title shown on the sign-in screen, Sveltia CMS by default
welcome_message: Te damos la bienvenida a {$name}
# Footer text with CMS branding
# {$name} is the CMS brand name shown in the footer, Sveltia CMS by default
powered_by: Con tecnología de {$name}

# Shown during initial configuration and data loading
unsupported_browser_error: Tu navegador no es compatible. Actualízalo a la última versión o usa otro navegador.
loading_cms_config: Cargando la configuración del CMS…
loading_site_data: Cargando los datos del sitio…
loading_site_data_error: Se ha producido un error al cargar los datos del sitio.

# OAuth and token authentication
# Primary sign-in button label for OAuth providers (GitHub, GitLab, etc.)
# {$service} is the sign-in provider label, such as GitHub or GitLab
sign_in_with_x: Iniciar sesión con {$service}

# Access token dialog: alternative authentication method
sign_in_using_access_token: Iniciar sesión con un token de acceso
sign_in_using_access_token_description: Introduce tu token a continuación. Debe tener acceso de lectura/escritura al contenido del repositorio.
# Shown after the description above when Editorial Workflow is enabled, which opens and merges pull requests
sign_in_using_access_token_workflow_note: Como el flujo editorial está activado, también debe tener acceso de lectura/escritura a las ‘pull requests’.
# Inline link text with embedded HTML anchor tag
# {$service} is the provider name whose user settings page contains the token generator, e.g., GitHub or GitLab
sign_in_using_access_token_link: Puedes generar un token en la <a>página de configuración de usuario de {$service}</a>.
# Input field label for personal access token
personal_access_token: Token de acceso personal

# Authentication progress indicators
authorizing: Autorizando…
signing_in: Iniciando sesión…

# Local and test repository options
# Button label and description for working with a local Git repository
work_with_local_repo: Trabajar con un repositorio local
# {$repo} is the configured repository name shown when it is available
work_with_local_repo_description: Cuando se te solicite, selecciona el directorio raíz del repositorio “{$repo}”.
work_with_local_repo_description_no_repo: Cuando se te solicite, selecciona el directorio raíz de tu repositorio Git.
# Button label for demo/test repository
work_with_test_repo: Trabajar con un repositorio de prueba
# Button label for the test repository when sample content is seeded, e.g. on a demo site
start_demo: Iniciar la demo
# Shown below the disabled test repository option in a browser that can’t save files to its
# storage, e.g. Safari before version 26
test_repo_unsupported_browser: Tu navegador no puede guardar los archivos del repositorio de prueba. Actualízalo a la última versión o usa otro navegador.

# Authentication errors
# Error messages shown during sign-in failures
sign_in_error:
  not_project_root: La carpeta seleccionada no es el directorio raíz de un repositorio. Inténtalo de nuevo.
  picker_dismissed: No se ha podido seleccionar un directorio raíz de repositorio. Inténtalo de nuevo.
  authentication_aborted: Se ha cancelado la autenticación. Inténtalo de nuevo.
  invalid_token: El token proporcionado no es válido. Verifícalo e inténtalo de nuevo.
  # OAuth and authenticator errors (shown with error codes) — keys are defined in the Sveltia CMS Authenticator library
  UNSUPPORTED_BACKEND: El autenticador no admite tu backend de Git.
  UNSUPPORTED_DOMAIN: Tu dominio no tiene permiso para usar el autenticador.
  MISCONFIGURED_CLIENT: El ID de cliente o el secreto de la aplicación OAuth no están configurados.
  AUTH_CODE_REQUEST_FAILED: No se ha podido recibir un código de autorización. Inténtalo de nuevo más tarde.
  CSRF_DETECTED: Se ha detectado un posible ataque CSRF. Se ha cancelado el flujo de autenticación.
  TOKEN_REQUEST_FAILED: No se ha podido solicitar un token de acceso. Inténtalo de nuevo más tarde.
  TOKEN_REFRESH_FAILED: No se ha podido renovar el token de acceso. Inténtalo de nuevo más tarde.
  MALFORMED_RESPONSE: El servidor ha respondido con datos con formato incorrecto. Inténtalo de nuevo más tarde.

# Backend and repository validation errors
# Shown when the configured backend or repository is invalid or inaccessible
# {$name} is the backend display name like Forgejo and {$version} is the minimum supported version
backend_unsupported_version: El backend {$name} requiere {$name} {$version} o una versión posterior.
# {$repo} is the repository identifier, typically in owner/repo format
repository_no_access: No tienes acceso al repositorio “{$repo}”.
# {$repo} is the repository identifier, typically in owner/repo format
repository_no_write_access: No tienes acceso de escritura al repositorio “{$repo}”.
repository_not_found: El repositorio “{$repo}” no existe.
repository_empty: El repositorio “{$repo}” no tiene `branches`.
# {$repo} is the repository identifier, and {$branch} is the configured branch name
branch_not_found: El repositorio “{$repo}” no tiene la `branch` “{$branch}”.
# {$repo} is the repository identifier, and {$dir} is the configured root directory
root_dir_not_found: El directorio raíz “{$dir}” no existe en el repositorio “{$repo}”.

# General errors
# Fallback error dialog title for unexpected errors
unexpected_error: Error inesperado
# Shown in place of the page when an unexpected error stops it from being displayed
# {$message} is the error message
page_crashed: Algo ha fallado y no se puede mostrar esta página. {$message}
# Shown in place of a field editor or preview when an unexpected error stops it from being displayed
# {$message} is the error message
field_crashed: Algo ha fallado y no se puede mostrar este campo. {$message}
# Button label for displaying a part of the page again after an unexpected error
try_again: Reintentar
# Button label for reloading the CMS after an unexpected error
reload_cms: Volver a cargar el CMS

# Entry file parsing errors
# Toast notification when entry files fail to parse on initial load
# {$count} is the number of entry files that failed to parse
entry_parse_errors: |
  .input {$count :integer}
  .match $count
    one {{ Se ha producido un error al analizar un archivo de entrada. Revisa la consola del navegador para ver los detalles. }}
    *   {{ Se han producido errores al analizar los archivos de entrada. Revisa la consola del navegador para ver los detalles. }}

# ==============================================================================
# Authentication and Account
# ==============================================================================
# These strings are used for sign-in, account management, and authentication
# flows throughout the application.

# Sign-in page and external assets panel: credential input field aria-labels
username: Nombre de usuario
password: Contraseña

# Sign-in actions: primary button labels and account menu items
# Used on the sign-in page and in confirmation dialogs for external assets
sign_in: Iniciar sesión

# Mobile sign-in feature: dialog title and instructions for QR code authentication
sign_in_with_mobile: Iniciar sesión con el móvil
# Instructions shown in the mobile sign-in dialog for passwordless authentication
sign_in_with_mobile_instruction: Escanea el siguiente código QR con tu teléfono o tableta para iniciar sesión sin contraseña. Tu configuración se copiará automáticamente.
# Confirmation dialog shown when the CMS is opened with a sign-in link from the mobile sign-in
# QR code. {$account} is the account name, {$service} is the Git service name, e.g. GitHub
sign_in_with_link: Iniciar sesión con un enlace
sign_in_with_link_confirmation: Este enlace inicia tu sesión como {$account} en {$service} y copia la configuración del dispositivo en el que se creó. Continúa solo si has creado el enlace tú mismo.

# Account menu: user status and repository mode indicators
# Shown at the top of the account dropdown menu
# {$name} is the signed-in user’s login name
signed_in_as_x: Sesión iniciada como {$name}
working_with_local_repo: Trabajando con un repositorio local
working_with_test_repo: Trabajando con un repositorio de prueba
working_in_demo_mode: Modo de demostración

# Demo welcome dialog: shown once after signing in to a demo site, where the test repository is
# seeded with sample content and the changes are only stored in the browser
demo_welcome:
  title: Te damos la bienvenida a la demo de Sveltia CMS
  description: Explora el CMS con total libertad y edita el contenido de ejemplo. Tus cambios solo se guardan en este navegador. No se publica nada en Internet y nadie más puede verlos.
  reset_hint: Para empezar de nuevo con el contenido original, selecciona Borrar todos los datos en Ajustes > Gestión de datos.
  button_label: Empezar

# Account menu: action items for sign-out and app installation
sign_out: Cerrar sesión
install_as_app: Instalar como aplicación

# ==============================================================================
# Global Toolbar
# ==============================================================================
# Strings used in the main application toolbar, including navigation, search,
# notifications, and menu items.

# Main page titles in the global navigation and page switcher button group
contents: Contenido
assets: Recursos
editorial_workflow: Flujo editorial
# Name of the Editorial Workflow page when all the content uses Preview Workflow, which has no
# review stages, so the page only lists the drafts
drafts: Borradores
cms_config: Configuración del CMS
# Mobile menu page title (shown only on small screens)
menu: Menú
# Mobile menu page section heading listing the custom pages registered by the site
custom_pages: Páginas

# Mobile promo infobar: encouraging users to try the mobile version
mobile_promo_title: ¡Sveltia CMS ya está disponible en móviles!
mobile_promo_button: Pruébalo

# New language infobar: encouraging users to switch to a newly available language
# {$locale} is the localized language name, e.g., “French”
new_language_available: ¡Sveltia CMS ya está disponible en {$locale}!
change_language: Cambiar idioma

# Live reload infobar: shown when the CMS runs on a page that a framework’s development server (e.g.
# Astro) reloads on every file change, instead of a static HTML file
live_reload_warning: Tu servidor de desarrollo vuelve a cargar esta página cada vez que cambia un archivo, lo que puede interrumpir el guardado y dañar tus archivos. Carga el CMS desde un archivo HTML estático. <a>Más información</a>

# Toast notification shown while the translation for the selected language is being downloaded
# {$locale} is the localized language name, e.g., “French”
switching_language: Cambiando a {$locale}…
locale_load_failed: No se ha podido cargar la traducción de {$locale}. Inténtalo de nuevo más tarde.

# Toast notification shown when changes saved with the local backend couldn’t be committed to Git
# {$reason} is one of the `local_git_skip_reasons` strings below
local_git_not_committed: Tus cambios se han guardado, pero no se ha hecho commit en Git. {$reason} Para guardar solo los archivos, desactiva los commits de Git en Ajustes > Desarrollador.
local_git_skip_reasons:
  unsupported_repository: Tu repositorio usa una función de Git que el CMS no admite, como un árbol de trabajo vinculado, nombres de objeto SHA-256, el formato reftable, un índice disperso o un índice en la versión 3 o 4, que usan la opción feature.manyFiles y git add -N.
  missing_identity: Tu nombre y tu dirección de correo electrónico no están definidos en la configuración de Git del repositorio, y el CMS no puede leer tu configuración global. Defínelos en el repositorio con ‘git config --local user.name "Tu nombre"’ y ‘git config --local user.email "tu@example.com"’.
  locked: Otro proceso de Git está usando el repositorio. Si no hay ninguno en ejecución, elimina el archivo .git/index.lock.
  # The operation in progress, with how to finish or cancel it
  operation_in_progress:
    merge: Hay un ‘merge’ en curso. Termínalo con ‘git commit’ o cancélalo con ‘git merge --abort’.
    rebase: Hay un ‘rebase’ en curso. Termínalo con ‘git rebase --continue’ o cancélalo con ‘git rebase --abort’. Si ya has pasado a otra cosa, ‘git rebase --quit’ lo descarta sin modificar tus archivos.
    cherry_pick: Hay un ‘cherry-pick’ en curso. Termínalo con ‘git cherry-pick --continue’ o cancélalo con ‘git cherry-pick --abort’.
    revert: Hay un ‘revert’ en curso. Termínalo con ‘git revert --continue’ o cancélalo con ‘git revert --abort’.
    am: Hay una aplicación de parches con ‘git am’ en curso. Termínalo con ‘git am --continue’ o cancélalo con ‘git am --abort’.
    conflict: Algunos archivos tienen conflictos. Resuélvelos y prepara primero los resultados para el commit.
  detached_head: No hay ninguna ‘branch’ activa.
  staged_changes: Tienes otros cambios preparados para el ‘commit’. Haz commit de ellos o sácalos del área de preparación primero.
  # {$path} is the file path
  lfs: '{$path} está gestionado con Git LFS, en el que el CMS no puede hacer commits.'
  # {$message} is the error message
  error: Se ha producido un error inesperado. {$message}

