list_item_pasted_without_files: |
  .input {$count :integer}
  .match $count
    one {{ Elemento pegado, pero no se ha encontrado un archivo que utiliza. Revisa los campos de archivo del elemento. }}
    *   {{ Elemento pegado, pero no se han encontrado {$count} archivos que utiliza. Revisa los campos de archivo del elemento. }}

# Variable-type list selector
select_list_type: Seleccionar el tipo de lista

# Variable-type mismatch
unknown_variable_type: Este elemento no se puede mostrar debido a un tipo desconocido. Revisa la consola del navegador para ver los detalles.

# ==============================================================================
# Field Widgets
# ==============================================================================
# Strings for specific field widget types.

# Color field: opacity slider
opacity: Opacidad

# Select field: empty option placeholder
unselected_option: (Ninguno)

# Relation field: creating or editing a referenced entry without leaving the editor
relation_field:
  # Note shown in the dialog. {$name} is the singular label of the referenced collection
  save_together_hint: '{$name} se guardará junto con la entrada que estás editando.'
  # Error shown when the entry couldn’t be prepared. {$name} is the singular label of the collection
  add_failed: 'No se ha podido añadir: {$name}. Revisa la consola del navegador para ver los detalles.'
  # Title of the dialog to edit an entry selected in the field. {$name} is the singular label of the
  # referenced collection
  edit_entry_title: 'Editando: {$name}'
  # Note shown in the dialog. {$name} is the singular label of the referenced collection
  edit_together_hint: Tus cambios en {$name} se guardarán junto con la entrada que estás editando.
  # Error shown when the changes couldn’t be prepared. {$name} is the singular label of the collection
  edit_failed: No se han podido aplicar los cambios en {$name}. Revisa la consola del navegador para ver los detalles.
  # Error shown when the changes would move the entry to another file path, e.g. through a path
  # template using a field. {$name} is the singular label of the collection
  move_unsupported: Estos cambios moverían {$name} a otra ubicación, lo que solo se puede realizar editándolo por separado.
  # Error shown when saving, if someone else has changed an entry edited from the field since. {$name}
  # is the summary of that entry
  edit_conflict: Otra persona ha modificado “{$name}” desde que lo editaste. Vuelve a abrirlo desde el campo para revisar tus cambios con respecto a la versión más reciente.
  # Error shown when saving, if someone else has deleted an entry edited from the field since.
  # {$name} is the summary of that entry
  edit_deleted: Otra persona ha eliminado “{$name}” desde que lo editaste. Quítalo del campo para guardar la entrada.
  # Accessible label of the menu listing the selected entries that can be edited
  select_entry_to_edit: Selecciona una entrada para editarla
  # Warning shown in the editor of an entry that has been edited from a Relation field of another
  # entry, while the changes wait in that entry’s pull request. {$name} is the summary of that
  # entry
  edited_with_entry: Los cambios en esta entrada están pendientes de publicarse junto con “{$name}”. Si la guardas ahora, los dos conjuntos de cambios se combinarán cuando se publique esa entrada, lo que puede fallar si se solapan.
  # Warning shown in the dialog when an entry edited from the field has been changed by someone else
  # since. {$name} is the singular label of the collection
  changed_since_edit: Otra persona ha modificado este elemento ({$name}) desde que lo editaste. Tus cambios se muestran sobre la versión más reciente. Revísalos antes de actualizar.

# Select Assets dialog
assets_dialog:
  # Dialog titles for different selection modes
  title:
    file: Seleccionar archivo
    image: Seleccionar imagen
    folder: Seleccionar carpeta

  # Search input labels
  search_for_file: Buscar archivos
  search_for_image: Buscar imágenes

  # Locations panel aria-label
  locations: Ubicaciones

  # Folder selection mode for a File field with the `select_folder` option. {$path} is the public
  # path of the folder to be selected, and {$count} is the number of folders selected
  selected_folder: 'Carpeta seleccionada: {$path}'
  selected_folders: |
    .input {$count :integer}
    .match $count
      one {{ {$count} carpeta seleccionada }}
      *   {{ {$count} carpetas seleccionadas }}
  no_subfolders: Esta carpeta no tiene subdirectorios.
  # Shown for a cloud storage service whose `prefix` option depends on fields of the entry
  prefix_unresolved: Rellena los campos de los que depende esta ubicación para explorar sus archivos y subir otros nuevos.

  # Asset folder options
  folder:
    field: Recursos del campo
    entry: Recursos de la entrada
    file: Recursos del archivo
    collection: Recursos de la colección
    global: Recursos globales

  # Error messages
  error:
    invalid_key: Tu clave de API no es válida o ha caducado. Verifícala e inténtalo de nuevo.
    search_fetch_failed: Se ha producido un error al buscar recursos. Inténtalo de nuevo más tarde.
    image_fetch_failed: Se ha producido un error al descargar el recurso seleccionado. Inténtalo de nuevo más tarde.

  # Stock photo panels
  available_images: Imágenes disponibles
  available_files: Archivos disponibles

  # URL entry option
  enter_url: Introducir una URL
  enter_file_url: 'Introduce la URL del archivo:'
  enter_image_url: 'Introduce la URL de la imagen:'

  # Large file warning dialog
  large_file:
    title: Archivo grande

  # Invalid file warning dialog
  invalid_file:
    title: Archivo no válido

  # Warning dialog shown when files are rejected for more than one reason
  rejected_files:
    title: No se pueden subir los archivos

  # Photo credit dialog (stock photos)
  photo_credit:
    title: Autoría de la foto
    description: 'Incluye la autoría original si es posible:'

  # Unsaved asset badge
  unsaved: Sin guardar

# Character counter: shows character count for text fields
character_counter:
  # {$count} is the current character count; {$min} and {$max} are configured limits
  min_max: |
    .input {$count :integer}
    .match $count
      0   {{ No se ha introducido ningún carácter. Mínimo: {$min}. Máximo: {$max}. }}
      one {{ Se ha introducido {$count} carácter. Mínimo: {$min}. Máximo: {$max}. }}
      *   {{ Se han introducido {$count} caracteres. Mínimo: {$min}. Máximo: {$max}. }}
  # {$count} is the current character count and {$min} is the minimum allowed count
  min: |
    .input {$count :integer}
    .match $count
      0   {{ No se ha introducido ningún carácter. Mínimo: {$min}. }}
      one {{ Se ha introducido {$count} carácter. Mínimo: {$min}. }}
      *   {{ Se han introducido {$count} caracteres. Mínimo: {$min}. }}
  # {$count} is the current character count and {$max} is the maximum allowed count
  max: |
    .input {$count :integer}
    .match $count
      0   {{ No se ha introducido ningún carácter. Máximo: {$max}. }}
      one {{ Se ha introducido {$count} carácter. Máximo: {$max}. }}
      *   {{ Se han introducido {$count} caracteres. Máximo: {$max}. }}

# YouTube video player iframe title
youtube_video_player: Reproductor de vídeo de YouTube

