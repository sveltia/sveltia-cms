bulk_edit_invalid: Algunos valores no son válidos. Corrige los campos resaltados e inténtalo de nuevo.
saving_bulk_edits_failed: No se han podido guardar los cambios. Inténtalo de nuevo.

# Bulk edit: confirmation shown when leaving the mode with unsaved changes
discard_bulk_edits_confirm: ¿Quieres descartar los cambios hechos en las entradas?

# ==============================================================================
# File Upload and Processing
# ==============================================================================
# Strings for file upload dialogs, progress indicators, and validation.

# Processing indicator shown during file preparation
# {$count} is the number of files currently being processed
processing_files: |
  .input {$count :integer}
  .match $count
    one {{ Procesando un archivo. Esto puede tardar un poco. }}
    *   {{ Procesando archivos. Esto puede tardar un poco. }}

# Uploading section aria-label
uploading_files: Subiendo archivos

# Replace file confirmation
# Dialog body when replacing an existing file
# {$name} is the existing file name that will be replaced
confirm_replacing_file: '“{$name}” se reemplazará con este archivo:'

# Upload confirmation with destination folder
# {$folder} is the destination folder label and {$count} is the number of files being uploaded
confirm_uploading_files: |
  .input {$count :integer}
  .match $count
    one {{ Este archivo se guardará en la carpeta “{$folder}”: }}
    *   {{ Estos {$count} archivos se guardarán en la carpeta “{$folder}”: }}

# File size validation
# Warning section for files exceeding size limits
oversized_files: Archivos demasiado grandes
# {$size} is the maximum allowed file size and {$count} is the number of oversized files
warning_oversized_files: |
  .input {$count :integer}
  .match $count
    one {{ Este archivo no se puede subir porque supera el tamaño máximo de {$size}. Reduce el tamaño o selecciona otro archivo. }}
    *   {{ Estos archivos no se pueden subir porque superan el tamaño máximo de {$size}. Reduce los tamaños o selecciona otros archivos. }}

# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: Archivos no válidos
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
    one {{ Este archivo no se puede subir porque está dañado, o su contenido no coincide con su extensión. Esto suele ocurrir cuando se le cambia el nombre a una foto en lugar de convertirla, como una imagen HEIC guardada como archivo JPEG. Convierte el archivo e inténtalo de nuevo. }}
    *   {{ Estos archivos no se pueden subir porque están dañados, o su contenido no coincide con sus extensiones. Esto suele ocurrir cuando se les cambia el nombre a las fotos en lugar de convertirlas, como imágenes HEIC guardadas como archivos JPEG. Convierte los archivos e inténtalo de nuevo. }}
# {$count} is the number of files that are not of a type the field accepts, even once transformed
# {$types} is the list of accepted file types, such as “.pdf or .txt”
warning_unsupported_files: |
  .input {$count :integer}
  .match $count
    one {{ No se puede subir este archivo porque no es de ninguno de los siguientes formatos: {$types}. }}
    *   {{ No se pueden subir estos archivos porque no son de ninguno de los siguientes formatos: {$types}. }}
# {$count} is the number of files that are not of an image type the field accepts
# {$types} is the list of accepted image formats, such as “PNG or WebP”
warning_unsupported_image_files: |
  .input {$count :integer}
  .match $count
    one {{ No se puede subir este archivo porque solo se acepta una imagen de los siguientes formatos: {$types}. }}
    *   {{ No se pueden subir estos archivos porque solo se aceptan imágenes de los siguientes formatos: {$types}. }}

# File format validation when replacing an asset
# Warning section for replacement files that are in a different format
mismatched_files: Archivos con formato distinto
# {$name} is the name of the asset being replaced and {$count} is the number of mismatched files
warning_mismatched_files: |
  .input {$count :integer}
  .match $count
    one {{ Este archivo no puede reemplazar a “{$name}” porque tiene un formato distinto. Convierte el archivo al mismo formato e inténtalo de nuevo. }}
    *   {{ Estos archivos no pueden reemplazar a “{$name}” porque tienen un formato distinto. Convierte los archivos al mismo formato e inténtalo de nuevo. }}

# File name conflict resolution
# {$count} is the number of conflicting file names in the target folder
file_name_conflict_confirmation: |
  .input {$count :integer}
  .match $count
    one {{ Ya existe un archivo con el mismo nombre en esta carpeta. ¿Quieres reemplazarlo? }}
    *   {{ Ya existen {$count} archivos con los mismos nombres en esta carpeta. ¿Quieres reemplazarlos? }}
# {$name} is the conflicting file name when there is exactly one conflict; {$count} is the total conflict count
file_name_conflict_confirmation_with_name: |
  .input {$count :integer}
  .input {$name :string}
  .match $count
    one {{ Ya existe un archivo llamado “{$name}” en esta carpeta. ¿Quieres reemplazarlo? }}
    *   {{ Ya existen {$count} archivos con los mismos nombres en esta carpeta. ¿Quieres reemplazarlos? }}
file_name_conflict_resolution: Resolución de conflictos de nombres de archivo
# Option to keep both files (rename the new one)
keep_both: Conservar ambos

# Upload progress and error messages
uploading_files_progress: Subiendo…
uploading_files_failed: Error al subir.
# Errors shown when a file on a cloud storage service could not be deleted or renamed
deleting_assets_failed: Error al eliminar.
renaming_asset_failed: Error al cambiar el nombre.
# Error shown when an edited text file in the Asset Library could not be saved
saving_asset_failed: No se ha podido guardar.

# File metadata display
# Appended when a file was auto-converted (e.g., HEIF to JPEG)
# {$type} is the original file type before conversion
file_meta_converted_from_x: (convertido desde {$type})

# ==============================================================================
# Entry Management
# ==============================================================================
# Strings for creating and managing entries in collections

# Empty state messages
no_entries_created: Esta colección aún no tiene entradas.
# Button to create first entry
create_new_entry: Crear una nueva entrada
# “Entry” option label in the create button menu
entry: Entrada

# Special entry types
# Fallback label for collection index files when no custom label is configured
index_file: Archivo de índice

# Empty state for file collections
no_files_in_collection: No hay archivos disponibles en esta colección.

# Entry duplication
duplicate_entry: Duplicar entrada
entry_duplicated: La entrada se ha duplicado como un nuevo borrador.

# Validation errors
# Toast shown when entry has validation errors preventing save
# {$count} is the number of fields with validation errors
entry_validation_errors: |
  .input {$count :integer}
  .match $count
    one {{ Un campo tiene un error. Corrígelo para guardar la entrada. }}
    *   {{ {$count} campos tienen errores. Corrígelos para guardar la entrada. }}
# Button on the validation error toast that opens the Validation panel listing the errors
show_errors: Mostrar los errores

# ==============================================================================
# Success Notifications
# ==============================================================================
# Toast notifications shown after successful operations.

# Entry operations
# {$count} is the number of entries affected by the operation
entry_saved: |
  .input {$count :integer}
  .match $count
    one {{ Entrada guardada. }}
    *   {{ {$count} entradas guardadas. }}
entry_saved_and_published: |
  .input {$count :integer}
  .match $count
    one {{ Entrada guardada y publicada. }}
    *   {{ {$count} entradas guardadas y publicadas. }}
entries_deleted: |
  .input {$count :integer}
  .match $count
    one {{ Entrada eliminada. }}
    *   {{ {$count} entradas eliminadas. }}

# Asset operations
# {$count} is the number of assets or asset-derived values affected by the operation
assets_saved: |
  .input {$count :integer}
  .match $count
    one {{ Recurso guardado. }}
    *   {{ {$count} recursos guardados. }}
assets_saved_and_published: |
  .input {$count :integer}
  .match $count
    one {{ Recurso guardado y publicado. }}
    *   {{ {$count} recursos guardados y publicados. }}
asset_urls_copied: |
  .input {$count :integer}
  .match $count
    one {{ URL copiada al portapapeles. }}
    *   {{ {$count} URL copiadas al portapapeles. }}
asset_paths_copied: |
  .input {$count :integer}
  .match $count
    one {{ Ruta del archivo copiada al portapapeles. }}
    *   {{ {$count} rutas de archivo copiadas al portapapeles. }}
asset_ids_copied: |
  .input {$count :integer}
  .match $count
    one {{ ID del archivo copiado al portapapeles. }}
    *   {{ {$count} ID de archivos copiados al portapapeles. }}
asset_data_copied: |
  .input {$count :integer}
  .match $count
    one {{ Datos del archivo copiados al portapapeles. }}
    *   {{ Datos de {$count} archivos copiados al portapapeles. }}
assets_downloaded: |
  .input {$count :integer}
  .match $count
    one {{ Recurso descargado. }}
    *   {{ {$count} recursos descargados. }}
assets_moved: |
  .input {$count :integer}
  .match $count
    one {{ Recurso movido. }}
    *   {{ {$count} recursos movidos. }}
assets_renamed: |
  .input {$count :integer}
  .match $count
    one {{ Se ha cambiado el nombre del recurso. }}
    *   {{ Se ha cambiado el nombre de {$count} recursos. }}
assets_deleted: |
  .input {$count :integer}
  .match $count
    one {{ Recurso eliminado. }}
    *   {{ {$count} recursos eliminados. }}
folder_created: Carpeta creada.
# Folder info panel in the Asset Library sidebar
folder_path: Ruta de la carpeta
folder_contents: Contenido
# {$count} is the number of subfolders in the folder
x_folders: |
  .input {$count :integer}
  .match $count
    0   {{ Sin carpetas }}
    one {{ {$count} carpeta }}
    *   {{ {$count} carpetas }}
folder_renamed: Se ha renombrado la carpeta.
folder_deleted: Carpeta eliminada.

# ==============================================================================
# Content Editor
# ==============================================================================
# Strings for the main content/entry editor interface.

# Editor container aria-label
content_editor: Editor de contenido

# Draft backup: restore dialog
restore_backup_title: Restaurar borrador
# {$datetime} is the localized timestamp of the saved draft backup
restore_backup_description: Esta entrada tiene una copia de seguridad del {$datetime}. ¿Quieres restaurar el borrador editado?

# Draft backup notifications
draft_backup_saved: Copia de seguridad del borrador guardada.
draft_backup_restored: Copia de seguridad del borrador restaurada.
draft_backup_deleted: Copia de seguridad del borrador eliminada.

# Editor toolbar actions
cancel_editing: Cancelar la edición

# Editor page titles and announcements
# Creating a new entry
# {$name} is the singular label of the collection being created in
create_entry_title: Creando {$name}
# {$collection} is the collection label
create_entry_announcement: Ahora estás creando una nueva entrada en la colección “{$collection}”.
# Editing an existing entry
# {$entry} is the current entry label and {$collection} is the collection label
edit_entry_announcement: Ahora estás editando la entrada “{$entry}” en la colección “{$collection}”.
# {$file} is the file name and {$collection} is the collection label
edit_file_announcement: Ahora estás editando el archivo “{$file}” en la colección “{$collection}”.
# {$file} is the singleton file name
edit_singleton_announcement: Ahora estás editando el archivo “{$file}”.

# Save button variants
# Shown when CI skip is enabled/disabled
save_and_publish: Guardar y publicar
save_without_publishing: Guardar sin publicar
# Shown disabled in place of `save_and_publish` while entries created or edited from a Relation
# field are in a collection whose review can’t be skipped with the `direct_publish` option
save_and_publish_needs_review: Guardar y publicar (las entradas relacionadas necesitan revisión)

# Editor options menu
show_editor_options: Mostrar las opciones del editor
editor_options: Opciones del editor

# Preview controls
show_second_pane: Mostrar el segundo panel
show_preview: Mostrar la vista previa

# Editor settings
sync_scrolling: Sincronizar el desplazamiento

# Locale controls
switch_locale: Cambiar de idioma
# Short status indicators appended to locale names
locale_content_disabled_short: (deshabilitado)
locale_content_error_short: (error)

# Pane labels
edit: Editar
preview: Vista previa

# Pane controls; not to be confused with pages
swap_panes: Intercambiar los paneles

# Locale-specific pane labels
# {$locale} is the localized language name for the current content pane, e.g., English
edit_x_locale: Editar el contenido en {$locale}
preview_x_locale: Ver la vista previa del contenido en {$locale}
# The content of a monolingual entry, which has no locale to name
edit_content: Editar el contenido
preview_content: Vista previa del contenido

# Preview iframe labels
content_preview: Vista previa del contenido

# Locale content options
# {$locale} is the localized language name for the content options menu, e.g., English
show_content_options_x_locale: Mostrar las opciones de contenido en {$locale}
content_options_x_locale: Opciones de contenido en {$locale}
show_content_options: Mostrar las opciones de contenido
content_options: Opciones de contenido

# Field container labels
# {$field} is the field’s display label
x_field: Campo “{$field}”

# Field options menu
show_field_options: Mostrar las opciones del campo
field_options: Opciones del campo

# Unsupported field type error
# {$name} is the unsupported field widget or type name
unsupported_field_type_x: 'Tipo de campo no admitido: {$name}'

# Locale management actions
# {$locale} is the localized language name being enabled or disabled, e.g., English
enable_x_locale: Habilitar {$locale}
reenable_x_locale: Volver a habilitar {$locale}
disable_x_locale: Deshabilitar {$locale}

# Locale status messages
# {$locale} is the localized language name affected by the status change, e.g., English
locale_x_has_been_disabled: El contenido en {$locale} se ha deshabilitado.
locale_x_now_disabled: El contenido en {$locale} ahora está deshabilitado. Se eliminará cuando guardes la entrada.

# Repository and site links
view_in_repository: Ver en el repositorio
# {$service} is the external service label, such as GitHub or GitLab
view_on_x: Ver en {$service}
view_on_live_site: Ver en el sitio publicado

# Deploy preview links. The URL comes from the CI/CD provider connected to the Git backend, so the
# states mirror the build’s: it may be queued, live or failed. Keep the wording free of CI jargon,
# as editors are often non-technical.
deploy_preview:
  # Button and menu item shown when a preview URL is available for an unpublished entry
  view: Ver la vista previa
  # Shown while the site is still being built, with or without a URL to open yet
  building: La vista previa aún se está generando.
  # Shown when the build failed, so no preview is available
  failed: No se ha podido generar la vista previa.
  # Shown briefly while the CI/CD provider is being queried
  checking: Buscando una vista previa…
  # Menu item to query the CI/CD provider again, offered once the automatic checks gave up
  check_again: Buscar vista previa
  # Button label while the CMS is waiting for the provider to build a preview of this entry. The
  # control is disabled meanwhile, because the live site holds the published version, or nothing at
  # all when the entry is new
  awaiting: Buscando vista previa
  # Short forms of the states above, used on the compact badge shown on an Editorial Workflow card,
  # where the full sentences don’t fit. A lookup in flight gets no badge, because it’s over in
  # moments
  short:
    building: Generando…
    failed: Error de compilación

# Content copying from other locales
copy_from: Copiar desde…
# {$locale} is the localized language name of the source content being copied, e.g., English
copy_from_x: Copiar desde {$locale}

# Translation features
translation_options: Opciones de traducción
translate: Traducir
# {$count} is the number of fields selected for translation
translate_fields: |
  .input {$count :integer}
  .match $count
    one {{ Traducir campo }}
    *   {{ Traducir campos }}
translate_from: Traducir desde…
# {$locale} is the localized language name of the source content being translated, e.g., English
translate_from_x: Traducir desde {$locale}

# Revert changes, restore the default values or clear the fields. The field options menu offers
# them for a field, the content options menu of an editor pane for the locale it shows, and the
# editor options menu for the whole entry, the latter two asking for confirmation first
revert_changes: Deshacer los cambios
revert_all_changes: Deshacer todos los cambios
restore_default: Restaurar los valores predeterminados
clear_all: Borrar todo
confirm_reverting_changes: ¿Seguro que quieres deshacer todos los cambios hechos en esta entrada?
# {$locale} is a locale name, e.g. French
confirm_reverting_changes_x_locale: ¿Seguro que quieres deshacer todos los cambios hechos en el contenido en {$locale}?
confirm_restoring_defaults: ¿Seguro que quieres restaurar los valores predeterminados de todos los campos de esta entrada? Se perderán tus cambios.
confirm_restoring_defaults_x_locale: ¿Seguro que quieres restaurar los valores predeterminados de todos los campos del contenido en {$locale}? Se perderán tus cambios.
confirm_clearing_fields: ¿Seguro que quieres borrar todos los campos de esta entrada? Se perderán tus cambios.
confirm_clearing_fields_x_locale: ¿Seguro que quieres borrar todos los campos del contenido en {$locale}? Se perderán tus cambios.

# Slug editing
edit_slug: Editar el ‘slug’
edit_slug_error:
  empty: El ‘slug’ no puede estar vacío.
  invalid: El ‘slug’ no puede contener caracteres especiales, incluidas las barras y los espacios.
  duplicate: Este ‘slug’ ya se usa para otra entrada.

# Entry path editing for nested entries
# Heading for the parent folder picker shown when the `meta.path` option is enabled
entry_parent_folder: Carpeta principal
new_parent_folder: Nueva carpeta
new_parent_folder_create: Crear
new_parent_folder_name: Nombre de la carpeta
# {$folder} is the name of the folder the new one will be created in
new_parent_folder_description: La nueva carpeta se creará en “{$folder}”.
new_parent_folder_error:
  empty: El nombre de la carpeta no puede estar vacío.
  invalid: El nombre de la carpeta no puede contener barras ni empezar con un punto, y debe incluir letras o números.
  duplicate: Ya existe una carpeta con este nombre en este directorio.
edit_path_error:
  invalid: La ruta no puede contener directorios relativos como “..”.
  recursive: La entrada no se puede mover a una de sus propias subcarpetas.
  duplicate: Esta ruta ya se usa para otra entrada.

# Required field indicator
required: Obligatorio

# Editor operation feedback
# Translation and copy operation status messages
editor:
  translation:
    none: No hay nada que traducir.
    started: Traduciendo…
    error: Error en la traducción.
    # {$source} is the source language name and {$count} is the number of translated fields
    complete: |
      .input {$count :integer}
      .match $count
        0   {{ No se tradujo ningún campo desde {$source}. }}
        one {{ Campo traducido desde {$source}. }}
        *   {{ {$count} campos traducidos desde {$source}. }}
  copy:
    none: No hay nada que copiar.
    # {$source} is the source language name and {$count} is the number of copied fields
    complete: |
      .input {$count :integer}
      .match $count
        0   {{ No se ha copiado ningún campo desde {$source}. }}
        one {{ Campo copiado desde {$source}. }}
        *   {{ {$count} campos copiados desde {$source}. }}

# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: Este campo es obligatorio.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: La fecha/hora debe ser igual o posterior a {$min}.
    date: La fecha debe ser igual o posterior a {$min}.
    time: La hora debe ser igual o posterior a {$min}.
    number: El valor debe ser mayor o igual que {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Debes seleccionar al menos {$min} opción. }}
        *   {{ Debes seleccionar al menos {$min} opciones. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Debes añadir al menos {$min} elemento. }}
        *   {{ Debes añadir al menos {$min} elementos. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: La fecha/hora debe ser igual o anterior a {$max}.
    date: La fecha debe ser igual o anterior a {$max}.
    time: La hora debe ser igual o anterior a {$max}.
    number: El valor debe ser menor o igual que {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ No puedes seleccionar más de {$max} opción. }}
        *   {{ No puedes seleccionar más de {$max} opciones. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ No puedes añadir más de {$max} elemento. }}
        *   {{ No puedes añadir más de {$max} elementos. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Debes introducir al menos {$min} carácter. }}
      *   {{ Debes introducir al menos {$min} caracteres. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ No puedes introducir más de {$max} carácter. }}
      *   {{ No puedes introducir más de {$max} caracteres. }}

  # Type validation errors
  type_mismatch:
    number: Introduce un número.
    email: Introduce un correo electrónico válido.
    url: Introduce una URL válida.

  # Value used for the same field in another entry of the collection
  value_not_unique: Este valor ya se usa en otra entrada.
  # Key of a keyed List field item used for another item of the same list
  key_not_unique: Esta clave ya se usa en otro elemento.
  # Key of a keyed List field item that is a whole number, which doesn’t keep its order in a map
  key_numeric: La clave no puede ser un número entero, ya que los elementos perderían su orden.

  # Custom field validation error
  invalid_value: Valor no válido.
  unexpected_error: Se ha producido un error inesperado.

# ==============================================================================
# Entry Sidebar
# ==============================================================================
# Panels shown in the entry editor sidebar.

entry_sidebar:
  # Sidebar tab list aria-label
  sidebar_panels: Paneles de la barra lateral

  # Validation panel: shows field validation errors
  validation:
    title: Validación
    placeholder: Los resultados de la validación se mostrarán aquí.
    no_errors_found: No se han encontrado errores.
    # Button in the panel header that validates the entry on demand
    validate: Validar

  # Slug panel: shows the entry slug and lets the user edit it
  slug:
    title: Slug
    generated_on_save: El slug se genera a partir del contenido de la entrada al guardarla. La fecha y la hora que contenga serán las del momento de guardar.
    unavailable: Esta entrada no tiene slug.

  # History panel: shows entry commit history
  history:
    title: Historial
    fetch_failed: No se ha podido cargar el historial.
    no_history: No se ha encontrado historial.

  # Backlinks panel: shows entries referencing this entry
  backlinks:
    title: Enlaces entrantes
    no_entries: Ninguna entrada hace referencia a esta entrada.

# Status shown next to the Save button while an entry with many new files is being saved
# {$done} and {$total} are the number of files prepared and to prepare, or the number of commits
# made and the estimated number of commits in all
save_progress:
  preparing: 'Preparando archivos: {$done} de {$total}'
  committing: 'Guardando en GitHub: {$done} de alrededor {$total} commits'

# Entry save error dialog
saving_entry:
  error:
    title: Error
    description: Se ha producido un error al guardar la entrada. Inténtalo de nuevo más tarde.

# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: La entrada fue modificada por otra persona
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: '{$name} modificó esta entrada el {$date}, después de que la abrieras.'
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Esta entrada se ha modificado en el repositorio después de que la abrieras.
  deleted: Esta entrada se ha eliminado del repositorio después de que la abrieras.
  # Follows `modified_by` or `modified`
  overwrite_warning: Si guardas ahora, se perderán los cambios realizados por otros.
  # Follows `deleted`
  recreate_warning: Si guardas ahora, la entrada se volverá a crear.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Como la entrada está guardada en el mismo archivo que otras entradas, no se puede guardar encima de los cambios. Cancela la edición, vuelve a abrir la entrada desde la lista y realiza tus modificaciones.
  # OK button label
  save_anyway: Guardar de todos modos
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: Otra persona ha actualizado el repositorio mientras se guardaba. Inténtalo de nuevo.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Otra persona ha modificado una entrada guardada en el mismo archivo. Inténtalo de nuevo.
  # {$path} is the file path
  array_file_invalid: No se puede actualizar el archivo {$path}, ya que no contiene una lista de entradas válida.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
# repository while the user has it open. The change itself is described with the `save_conflict`
# strings above
remote_change:
  reload_entry: Volver a cargar la entrada
  # Confirmation shown before reloading when the user has unsaved changes
  confirm_reloading_entry: ¿Seguro que quieres volver a cargar la entrada? Se perderán los cambios que no hayas guardado.

