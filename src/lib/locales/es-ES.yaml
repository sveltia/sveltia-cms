# ==============================================================================
# Entry and Collection Actions
# ==============================================================================
# Strings related to creating, editing, and managing entries and collections.

# Message shown while entries are still being retrieved: in the entry editor, when it was opened
# with a direct link before all the data has been loaded, and on the Editorial Workflow page while
# the pull requests are being fetched. {$count} selects the form
loading_entries: |
  .input {$count :integer}
  .match $count
    one {{ Cargando la entrada… }}
    *   {{ Cargando las entradas… }}
# Error message when entry cannot be found
entry_not_found: No se ha encontrado la entrada.

# Entry creation restrictions: tooltip and advisory messages
creating_entries_disabled_by_admin: El administrador ha deshabilitado la creación de nuevas entradas en esta colección.
# {$quota} is the collection’s maximum entry count
creating_entries_disabled_by_quota: |
  .input {$quota :integer}
  .match $quota
    one {{ No puedes añadir nuevas entradas a esta colección porque ha alcanzado el límite de {$quota} entrada. }}
    *   {{ No puedes añadir nuevas entradas a esta colección porque ha alcanzado el límite de {$quota} entradas. }}
# {$quota} is the collection limit and {$remaining} is the number of entries that can still be created
creating_entries_nearing_quota: |
  .input {$quota :integer}
  .input {$remaining :integer}
  .match $quota $remaining
    one one {{ Esta colección se acerca al límite de {$quota} entrada. Solo puedes crear {$remaining} entrada más. }}
    one *   {{ Esta colección se acerca al límite de {$quota} entrada. Solo puedes crear {$remaining} entradas más. }}
    *   one {{ Esta colección se acerca al límite de {$quota} entradas. Solo puedes crear {$remaining} entrada más. }}
    *   *   {{ Esta colección se acerca al límite de {$quota} entradas. Solo puedes crear {$remaining} entradas más. }}

# Read-only restrictions set with the `readonly` option: advisory messages
readonly_cms: El CMS está en modo de solo lectura. Puedes ver el contenido y los recursos, pero no puedes realizar cambios.
readonly_collection: Esta colección es de solo lectura. Puedes ver su contenido, pero no puedes realizar cambios.
readonly_entry: Esta entrada es de solo lectura. Puedes verla, pero no puedes realizar cambios.
readonly_asset_folder: Esta carpeta es de solo lectura. Puedes ver sus recursos, pero no realizar cambios.
readonly_branch: No tienes permiso para hacer ‘push’ a la `branch` “{$branch}”. Puedes ver este contenido, pero no puedes realizar cambios.
readonly_reference: La entrada es de solo lectura, así que no se puede eliminar la referencia.
# {$entries} is a comma-separated list of entries, each shown as “Collection › Entry”
cannot_rename_referenced_entry: 'No se puede renombrar esta entrada porque las siguientes entradas de solo lectura hacen referencia a ella por su nombre actual: {$entries}.'
# {$entries} is a comma-separated list of entries, each shown as “Collection › Entry”
cannot_move_referenced_asset: 'No se puede mover este recurso ni cambiar su nombre porque lo usan las siguientes entradas de solo lectura: {$entries}.'

# Navigation: back links and list labels
back_to_collection: Volver a la colección
collection_list: Lista de colecciones
back_to_collection_list: Volver a la lista de colecciones
asset_folder_list: Lista de carpetas de recursos
back_to_asset_folder_list: Volver a la lista de carpetas de recursos
# Back button shown in place of the one above while browsing a subfolder of an asset folder
back_to_parent_folder: Volver a la carpeta superior

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: Resultados de búsqueda
# {$terms} is the current search query text
search_results_for_x: Resultados de búsqueda para “{$terms}”

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Ahora estás viendo los resultados de búsqueda para “{$terms}”. No se encontró ninguna entrada. }}
    one {{ Ahora estás viendo los resultados de búsqueda para “{$terms}”. Se encontró una entrada. }}
    *   {{ Ahora estás viendo los resultados de búsqueda para “{$terms}”. Se encontraron {$count} entradas. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Ahora estás viendo los resultados de búsqueda para “{$terms}”. No se encontró ningún recurso. }}
    one {{ Ahora estás viendo los resultados de búsqueda para “{$terms}”. Se encontró un recurso. }}
    *   {{ Ahora estás viendo los resultados de búsqueda para “{$terms}”. Se encontraron {$count} recursos. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ Sin entradas }}
    one {{ {$count} entrada }}
    *   {{ {$count} entradas }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ Sin recursos }}
    one {{ {$count} recurso }}
    *   {{ {$count} recursos }}

# Empty state messages
no_files_found: No se han encontrado archivos.
no_entries_found: No se han encontrado entradas.

# ==============================================================================
# Asset Management
# ==============================================================================
# Strings for uploading, editing, and managing assets (images, documents, etc.).

# Upload dialog: title and button label
upload_assets: Subir nuevos recursos

# New Folder button and dialog in the Asset Library
new_folder: Nueva carpeta
new_folder_name: Nombre de la carpeta
new_folder_create: Crear
# {$folder} is the path of the folder the new one will be created in, starting with a slash
new_folder_description: La nueva carpeta se creará en “{$folder}”.
# Validation errors for the new folder name
new_folder_error:
  empty: El nombre de la carpeta no puede estar vacío.
  invalid: El nombre de la carpeta no puede contener barras ni empezar por un punto.
  # A name the CMS itself is usually served from, e.g. `admin` or `cms`
  reserved: Los archivos de una carpeta con este nombre son de solo lectura, ya que el propio CMS suele cargarlos desde ella.
  duplicate: Ya existe aquí una carpeta o un archivo con este nombre.
# Progress and error messages while the folder is being created
creating_folder: Creando la carpeta…
creating_folder_failed: No se ha podido crear la carpeta.

# Menu on a folder in the Asset Library, and the Rename Folder and Delete Folder dialogs
folder_options: Opciones de carpeta
show_folder_options: Mostrar las opciones de carpeta
rename_folder: Cambiar el nombre de la carpeta
delete_folder: Eliminar carpeta
# Rename Folder dialog body text
# {$count} is the number of assets in the folder, which are moved along with it
enter_new_name_for_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Introduce un nuevo nombre a continuación. }}
    one {{ Introduce un nuevo nombre a continuación. El recurso de la carpeta se moverá con ella y se actualizará cualquier entrada que lo use. }}
    *   {{ Introduce un nuevo nombre a continuación. Los {$count} recursos de la carpeta se moverán con ella y se actualizarán las entradas que los usen. }}
# Rename Folder dialog body text for a cloud storage service, whose files are hotlinked from the
# entries, so a move changes the URLs and the entries aren’t updated
enter_new_name_for_external_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Introduce un nuevo nombre a continuación. }}
    one {{ Introduce un nuevo nombre a continuación. El archivo de la carpeta se moverá con ella y su URL cambiará, así que actualiza cualquier entrada que lo use. }}
    *   {{ Introduce un nuevo nombre a continuación. {$count} archivos de la carpeta se moverán con ella y sus URL cambiarán, así que actualiza las entradas que los usen. }}
# Rename Folder dialog for a cloud storage service: warning shown when entries link to files in the
# folder, which aren’t updated. {$count} is the number of entries
renaming_external_folder_breaks_links: |
  .input {$count :integer}
  .match $count
    one {{ Una entrada enlaza a un archivo de esta carpeta. La entrada no se actualizará, así que el enlace dejará de funcionar cuando se cambie el nombre de la carpeta. }}
    *   {{ {$count} entradas enlazan a archivos de esta carpeta. Las entradas no se actualizarán, así que los enlaces dejarán de funcionar cuando se cambie el nombre de la carpeta. }}
# Delete Folder confirmation
# {$name} is the folder name and {$count} is the number of assets in the folder
confirm_deleting_folder: |
  .input {$count :integer}
  .match $count
    0   {{ ¿Seguro que quieres eliminar la carpeta vacía “{$name}”? }}
    one {{ ¿Seguro que quieres eliminar la carpeta “{$name}” y el recurso que contiene? }}
    *   {{ ¿Seguro que quieres eliminar la carpeta “{$name}” y los {$count} recursos que contiene? }}
# Progress and error messages while the folder is being renamed or deleted
renaming_folder: Cambiando el nombre de la carpeta…
renaming_folder_failed: No se ha podido cambiar el nombre de la carpeta.
deleting_folder: Eliminando la carpeta…
deleting_folder_failed: No se ha podido eliminar la carpeta.
# Asset Library and asset picker: notice shown when a cloud storage service holds more files than
# are listed at once
external_assets_truncated: Hay demasiados archivos en el servicio para mostrarlos todos, así que se han omitido resultados.

# Edit options menu: button and item labels
edit_options: Opciones de edición
show_edit_options: Mostrar las opciones de edición
# Copy menu aria-label
copy_options: Opciones de copia
# Edit menu items with specific asset names
edit_asset: Editar recurso
# {$name} is the selected asset name
edit_x: Editar {$name}

# Asset text editor: switch for line wrapping
wrap_long_lines: Ajuste de línea automático

# Rename asset: dialog and validation
rename_asset: Cambiar el nombre del recurso
# {$name} is the current asset name
rename_x: Cambiar el nombre de {$name}
# Dialog body text indicating how many entries reference this asset
# {$count} is the number of entries that currently reference the asset
enter_new_name_for_asset: |
  .input {$count :integer}
  .match $count
    0   {{ Introduce un nuevo nombre a continuación. }}
    one {{ Introduce un nuevo nombre a continuación. También se actualizará una entrada que usa el recurso. }}
    *   {{ Introduce un nuevo nombre a continuación. También se actualizarán {$count} entradas que usan el recurso. }}
# Rename Asset dialog for a file on a cloud storage service: warning shown when entries link to the
# file, which aren’t updated. {$count} is the number of entries
renaming_external_asset_breaks_links: |
  .input {$count :integer}
  .match $count
    one {{ Una entrada enlaza a este archivo. La entrada no se actualizará, así que el enlace dejará de funcionar cuando se cambie el nombre del archivo. }}
    *   {{ {$count} entradas enlazan a este archivo. Las entradas no se actualizarán, así que los enlaces dejarán de funcionar cuando se cambie el nombre del archivo. }}
# Validation errors for asset renaming
enter_new_name_for_asset_error:
  empty: El nombre del archivo no puede estar vacío.
  character: El nombre del archivo no puede contener caracteres especiales.
  duplicate: Este nombre de archivo ya se usa para otro recurso.
  # A name starting with a dot hides the file, which the CMS wouldn’t list any more
  leading_dot: El nombre del archivo no puede empezar por un punto.
  # The name of a file next to the asset that isn’t an asset, like an entry file
  file_duplicate: Ya existe otro archivo con este nombre en este directorio.
  # The name of a folder next to the file
  folder_duplicate: Ya existe una carpeta con este nombre en este directorio.
# Shown while renaming a file whose name will be changed on saving, e.g. by the `slugify_filename`
# media library option
file_will_be_saved_as: El archivo se guardará como “{$name}”.
# Confirmation dialog shown when the file extension is changed while renaming an asset
change_file_extension: Cambiar la extensión del archivo
# {$oldExtension} and {$newExtension} are file extensions without a leading dot, e.g. png
confirm_file_extension_change:
  change: ¿Seguro que quieres cambiar la extensión de “.{$oldExtension}” a “.{$newExtension}”?
  add: ¿Seguro que quieres añadir la extensión “.{$newExtension}”?
  remove: ¿Seguro que quieres quitar la extensión “.{$oldExtension}”?
file_extension_change_warning: Es posible que el archivo no se muestre o no se procese correctamente si la extensión no coincide con el formato real del archivo.

# Replace asset: menu item and dialog title
replace_asset: Reemplazar recurso
# {$name} is the asset being replaced
replace_x: Reemplazar {$name}
# File/Image field: labels of the Replace and Remove buttons
replace_file: Reemplazar archivo
replace_image: Reemplazar imagen
remove_file: Quitar archivo
remove_image: Quitar imagen

# File selection prompts: drop zones and file pickers
# Browse prompt shown when drag-and-drop is unavailable on desktop and pointer devices
click_to_browse: Haz clic para explorar…
# Browse prompt shown on touch devices
tap_to_browse: Haz tap para explorar…
# Drop zone text with browse button
# {$count} is the number of files expected by the current picker mode
drop_files_or_click_to_browse: |
  .input {$count :integer}
  .match $count
    one {{ Arrastra un archivo aquí o haz clic para explorar… }}
    *   {{ Arrastra archivos aquí o haz clic para explorar… }}
# Partial drop zone text (ends with inline button)
# {$count} is the number of files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Arrastra un archivo aquí o }}
    *   {{ Arrastra los archivos aquí o }}
# Image-specific drop zone text
# {$count} is the number of image files expected by the current picker mode
# After the “or” text, the inline buttons are rendered with the localized strings
drop_image_files_or: |
  .input {$count :integer}
  .match $count
    one {{ Arrastra un archivo de imagen aquí o }}
    *   {{ Arrastra los archivos de imagen aquí o }}

# File picker and clipboard actions used by upload controls
browse: Explorar
# Generic clipboard paste action used by non-image file fields
paste: Pegar
# Clipboard paste action used by image fields
paste_image: Pegar imagen

# Clipboard paste errors
no_image_in_clipboard: No se ha encontrado ninguna imagen en el portapapeles.
clipboard_access_denied: Se ha denegado el acceso al portapapeles.

# Drag-and-drop overlay text (shown while dragging)
# {$count} is the number of files expected by the current picker mode
drop_files_here: |
  .input {$count :integer}
  .match $count
    one {{ Arrastra un archivo aquí }}
    *   {{ Arrastra los archivos aquí }}

# File type validation errors
unsupported_file_type: Tipo de archivo no admitido
# {$type} is the expected asset type label, such as image or document
dropped_file_type_mismatch: 'El archivo arrastrado no es de ninguno de los siguientes formatos: {$types}. Inténtalo de nuevo.'
dropped_image_type_mismatch: 'El archivo arrastrado no es compatible. Solo se acepta una imagen en los siguientes formatos: {$types}. Inténtalo de nuevo.'

# File chooser button label
# {$count} is the number of files the picker allows the user to choose
choose_files: |
  .input {$count :integer}
  .match $count
    one {{ Elegir archivo }}
    *   {{ Elegir archivos }}

# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    one {{ Eliminar recurso }}
    *   {{ Eliminar recursos }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Eliminar el recurso seleccionado }}
    *   {{ Eliminar los recursos seleccionados }}
confirm_deleting_this_asset: ¿Seguro que quieres eliminar este recurso?
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ ¿Seguro que quieres eliminar el recurso seleccionado? }}
    *   {{ ¿Seguro que quieres eliminar los {$count} recursos seleccionados? }}
confirm_deleting_all_assets: ¿Seguro que quieres eliminar todos los recursos?
# Note added to the confirmation when entries use the assets being deleted; the references are
# removed in the same commit. {$count} is the number of entries using them
deleting_referenced_assets_note: |
  .input {$count :integer}
  .match $count
    one {{ También se quitará la referencia que hay en una entrada. }}
    *   {{ También se quitarán las referencias que hay en {$count} entradas. }}
# Shown in place of the confirmation when removing the references would leave a field in an entry
# invalid, e.g. a required Image field with nothing left, so the deletion is refused. The fields are
# listed below the message, each with the validation error it would have. {$count} is the number of
# assets being deleted
cannot_delete_referenced_assets: |
  .input {$count :integer}
  .match $count
    one {{ No se puede eliminar este recurso porque los siguientes campos de las entradas que lo usan dejarían de ser válidos sin él. Actualiza primero esas entradas. }}
    *   {{ No se pueden eliminar estos recursos porque los siguientes campos de las entradas que los usan dejarían de ser válidos sin ellos. Actualiza primero esas entradas. }}
# Error shown in the asset deletion dialog when the entries using the assets couldn’t be looked up,
# so the deletion can’t go ahead. {$count} is the number of assets being deleted
checking_asset_references_failed: |
  .input {$count :integer}
  .match $count
    one {{ No se ha podido comprobar qué entradas usan este recurso. Cierra este cuadro de diálogo e inténtalo de nuevo. }}
    *   {{ No se ha podido comprobar qué entradas usan estos recursos. Cierra este cuadro de diálogo e inténtalo de nuevo. }}

# Delete entries: dialog titles and confirmation messages
# {$count} is the number of entries targeted by the action
delete_entries: |
  .input {$count :integer}
  .match $count
    one {{ Eliminar entrada }}
    *   {{ Eliminar entradas }}
# {$count} is the number of selected entries
delete_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Eliminar la entrada seleccionada }}
    *   {{ Eliminar las entradas seleccionadas }}
confirm_deleting_this_entry: ¿Seguro que quieres eliminar esta entrada?
confirm_deleting_this_entry_with_assets: ¿Seguro que quieres eliminar esta entrada y los recursos asociados?
# Error notification shown when an entry could not be deleted
deleting_entry_failed: No se ha podido eliminar la entrada. Inténtalo de nuevo.
# {$count} is the number of selected entries
confirm_deleting_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ ¿Seguro que quieres eliminar la entrada seleccionada? }}
    *   {{ ¿Seguro que quieres eliminar las {$count} entradas seleccionadas? }}
# {$count} is the number of selected entries whose associated assets would also be removed
confirm_deleting_selected_entries_with_assets: |
  .input {$count :integer}
  .match $count
    one {{ ¿Seguro que quieres eliminar la entrada seleccionada y los recursos asociados? }}
    *   {{ ¿Seguro que quieres eliminar las {$count} entradas seleccionadas y los recursos asociados? }}
confirm_deleting_all_entries: ¿Seguro que quieres eliminar todas las entradas?
confirm_deleting_all_entries_with_assets: ¿Seguro que quieres eliminar todas las entradas y los recursos asociados?
# Note added to the confirmation when other entries reference the entries being deleted through
# Relation fields; the references are removed in the same commit. {$count} is the number of
# referencing entries
deleting_referenced_entries_note: |
  .input {$count :integer}
  .match $count
    one {{ También se quitará la referencia que hay en otra entrada. }}
    *   {{ También se quitarán las referencias que hay en otras {$count} entradas. }}
# Shown in place of the confirmation when removing the references would leave a Relation field in
# another entry invalid, e.g. a required field with nothing selected, so the deletion is refused.
# The fields are listed below the message, each with the validation error it would have. {$count}
# is the number of entries being deleted
cannot_delete_referenced_entries: |
  .input {$count :integer}
  .match $count
    one {{ No se puede eliminar esta entrada porque los siguientes campos de otras entradas dejarían de ser válidos sin ella. Actualiza primero esas entradas. }}
    *   {{ No se pueden eliminar estas entradas porque los siguientes campos de otras entradas dejarían de ser válidos sin ellas. Actualiza primero esas entradas. }}

# ==============================================================================
