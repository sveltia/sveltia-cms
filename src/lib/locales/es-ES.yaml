  compatibility_link: 'Consulta las notas de compatibilidad para ver los detalles: {$link}'

  # Console tip shown after config load
  schema_tip: Para una mejor experiencia de desarrollo, puedes validar tu archivo de configuración con el esquema JSON de Sveltia CMS. Consulta {$link} para ver los detalles.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Local
  # Browser compatibility warnings
  unsupported_browser: El flujo de trabajo local no es compatible con tu navegador. Usa Chrome o Edge en su lugar.
  disabled: El flujo de trabajo local está deshabilitado en tu navegador. <a>Aquí te explicamos cómo habilitarlo</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Ahora estás viendo el tablero del flujo editorial. Borradores: {$draft}. En revisión: {$review}. Listos: {$ready}. Pendientes de eliminación: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Ahora estás viendo el tablero del flujo editorial. Borradores: {$draft}. En revisión: {$review}. Pendientes de eliminación: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'Ahora estás viendo el tablero del flujo editorial. Borradores: {$draft}. Listos: {$ready}. Pendientes de eliminación: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'Ahora estás viendo la página de borradores. Borradores: {$draft}. Pendientes de eliminación: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Borrador
  drafts: Borradores
  in_review: En revisión
  ready: Listo
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Pendiente de eliminación
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: Desplegando

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Cancelar la eliminación
  confirm_cancelling_deletion: ¿Seguro que quieres cancelar esta eliminación? La entrada seguirá publicada.
  confirm_completing_deletion: ¿Seguro que quieres eliminar esta entrada? Se quitará de inmediato.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ Entrada marcada para eliminación. }}
      *   {{ {$count} entradas marcadas para eliminación. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Cambios descartados. }}
      *   {{ Se han descartado los cambios de {$count} entradas. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Cancelando la eliminación…
  deletion_cancelled: Eliminación cancelada.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: No se ha podido cancelar la eliminación. Inténtalo de nuevo.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Entradas sin publicar
  published_entries: Entradas publicadas
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Estado: {$status}'
  change_entry_status: Cambiar el estado de la entrada
  # Editor toolbar: progress label while the status is being changed
  changing_status: Cambiando el estado…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Actualizando el estado…
  status_updated: Estado actualizado.
  # Error notification when the status could not be changed
  status_change_failed: No se ha podido cambiar el estado. Inténtalo de nuevo.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: Actualizar
  refreshing: Actualizando…
  refreshed: El tablero está actualizado.
  # Error notification when the board could not be refreshed
  refresh_failed: No se ha podido actualizar el tablero. Inténtalo de nuevo.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: La entrada tiene errores. Corrígelos antes de cambiar el estado.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: La entrada tiene errores. Corrígelos antes de publicarla.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Enviar a revisión
  confirm_sending_for_review: Tus cambios se han guardado como borrador. ¿Quieres enviar la entrada a revisión para que alguien la revise y la publique?
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: Marcar como lista
  confirm_marking_as_ready: Tus cambios se han guardado como borrador. ¿Quieres marcar la entrada como lista para que se pueda publicar?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Publicar la entrada
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Descartar los cambios
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: ¿Seguro que quieres eliminar esta entrada? No se quitará hasta que se publique la eliminación. Mientras tanto, la seguirás encontrando en la lista de entradas, marcada como “Pendiente de eliminación”.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Esta entrada aún no se ha publicado, así que eliminarla la descartará por completo.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Esta entrada tiene cambios sin publicar. Al descartarlos se restaurará la versión publicada. La entrada en sí no se eliminará.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Aún no se ha publicado, así que tus cambios sin publicar se descartarán. Cualquier versión publicada seguirá publicada. }}
      *   {{ Aún no se han publicado, así que tus cambios sin publicar se descartarán. Cualquier versión publicada seguirá publicada. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ Una de ellas aún no se ha publicado, así que tus cambios sin publicar se descartarán. Cualquier versión publicada seguirá publicada. }}
      *   {{ {$count} de ellas aún no se han publicado, así que tus cambios sin publicar se descartarán. Cualquier versión publicada seguirá publicada. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: ¿Seguro que quieres publicar esta entrada? Tus cambios estarán visibles cuando se haya vuelto a generar tu sitio.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Publicando la entrada…
  entry_published: Entrada publicada.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Eliminando la entrada…
  discarding_changes: Descartando los cambios…
  entry_deleted: Entrada eliminada.
  # Error notification when publishing fails
  publishing_entry_failed: No se ha podido publicar la entrada. Inténtalo de nuevo.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: Esta entrada no se puede publicar desde aquí porque incluye otros cambios que el CMS no puede mostrarte. Pide a un desarrollador que la revise.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: La entrada se ha modificado desde que la abriste. Vuelve a cargar la página para revisar la versión más reciente antes de publicarla.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: Ya hay otra solicitud ({$number}) abierta para esta entrada fuera del CMS. Pide a un desarrollador que la cierre primero.
  # Workflow page: empty column message
  no_entries: No hay entradas.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Arrastra para cambiar el estado
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Eliminación
  # Workflow page: note on a card listing the new entries that were created from a Relation field
  # of the entry and are published along with it, e.g. “Also adds Section: Getting Started”
  companion_entries: También añade {$entries}
  # Workflow page: note on a card listing the existing entries that were edited from a Relation
  # field of the entry and are published along with it, e.g. “Also changes Author: Ada Lovelace”
  edited_companion_entries: También modifica {$entries}
  # Workflow page: one of the entries listed by `companion_entries` or `edited_companion_entries`,
  # named by its collection’s singular label and its title
  companion_entry: '{$collection}: {$title}'

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: Mensaje de commit
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: Describe tus cambios. El mensaje se registra en el historial junto con ellos.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: Añade una nota al mensaje que se registra en el historial junto con tus cambios, como un número de incidencia. Puedes dejarlo vacío.
  # Accessible name of the text box when the user writes the whole message
  message: Mensaje de commit
  # Accessible name of the text box when the text is added before or after the message
  addition: Nota adicional
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'Mensaje: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Bifurcar (‘fork’) el repositorio
  fork: Fork
  confirm_forking_repository: Para sugerir cambios en “{$repo}”, hay que crear un fork del repositorio en tu cuenta. Tus cambios se guardan en ese fork y un administrador los revisa antes de que se publiquen.
  # Error shown when the user declined the dialog above
  fork_declined: Necesitas un fork del repositorio en tu cuenta para sugerir cambios.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: No se ha podido crear un fork del repositorio “{$repo}” en tu cuenta.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: Tu fork “{$fork}” no tiene la branch “{$branch}”. Actualiza el fork desde el repositorio “{$repo}” y vuelve a iniciar sesión.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: No se ha podido comprobar tu acceso al repositorio “{$repo}”. Inténtalo de nuevo en un momento.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: El repositorio “{$repo}” no permite forks. Pídele a un administrador que los habilite.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Tienes una invitación pendiente al repositorio “{$repo}”. Acéptala en GitHub y vuelve a iniciar sesión.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Tu inicio de sesión no incluye acceso a repositorios privados, así que no se puede leer el repositorio “{$repo}”. Pídele a un administrador que revise la configuración de autenticación del CMS.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Solo un administrador puede publicar cambios en este sitio. En su lugar, marca tu entrada como “En revisión” y alguien la revisará.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: Un administrador ya ha publicado esta entrada, así que no queda nada por revisar.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Este cambio no se puede hacer directamente. Solo se pueden sugerir para revisión las modificaciones de entradas.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Tus cambios se guardan en tu fork de este repositorio, “{$repo}”, y se revisan antes de publicarse.
  view_fork: Ver el fork

# ==============================================================================
# Settings Dialog
# ==============================================================================
# Strings for the settings/preferences dialog and its panels.

# Settings page aria-label
categories: Categorías

# Site Configuration Editor
site_configuration_editor: Editor de configuración del sitio

# Preferences panels
prefs:
  # API key management feedback messages
  changes:
    api_key_saved: Clave de API guardada.
    api_key_removed: Clave de API eliminada.
    api_key_invalid: La clave de API proporcionada no es válida. Verifícala e inténtalo de nuevo.

  # Preferences operation errors
  error:
    permission_denied: Se ha denegado el acceso al almacenamiento de cookies. Revisa los permisos de tu navegador e inténtalo de nuevo.

  # Appearance panel
  appearance:
    title: Apariencia
    theme: Tema
    select_theme: Seleccionar tema

  # Theme options
  theme:
    dark: Oscuro
    light: Claro

  # Language panel
  language:
    title: Idioma
    ui_language:
      title: Idioma de la interfaz de usuario
      select_language: Seleccionar idioma

  # Contents panel
  contents:
    title: Contenido
    editor:
      title: Editor
      use_draft_backup:
        switch_label: Hacer copias de seguridad automáticas de los borradores de las entradas
      close_on_save:
        switch_label: Cerrar el editor después de guardar un borrador
      close_with_escape:
        switch_label: Cerrar el editor con la tecla Escape

  # Internationalization panel
  i18n:
    title: Internacionalización
    translators:
      default:
        title: Servicio de traducción predeterminado
        select_service: Seleccionar servicio
      api_keys:
        title: Claves de API de los servicios de traducción
        description: Gestiona las claves de API de los <a>servicios de traducción</a>. Las claves de API de los servicios de IA genéricos se pueden gestionar en los ajustes de IA.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: Clave de {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Regístrate en <a {$homeHref}>{$service}</a> e introduce aquí <a {$apiKeyHref}>tu clave de API</a> para habilitar la traducción rápida de los campos de texto de las entradas.

  # Media panel
  media:
    title: Medios
    stock_photos:
      api_keys:
        title: Claves de API de los servicios de fotos de stock
        description: Gestiona las claves de API de los <a>servicios de fotos de stock</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: Clave de API de {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Regístrate en <a {$homeHref}>la API de {$service}</a> e introduce aquí <a {$apiKeyHref}>tu clave de API</a> para insertar fotos de stock gratuitas en los campos de imagen de las entradas.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Fotos proporcionadas por {$service}
      no_services: No hay <a>servicios de fotos de stock</a> configurados.
    cloud_storage:
      api_keys:
        title: Claves de API de los servicios de almacenamiento en la nube
        description: Gestiona las claves de API de los <a>servicios de almacenamiento en la nube</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: Clave de API de {$service}
      no_services: No hay <a>servicios de almacenamiento en la nube</a> configurados.

  # AI panel
  ai:
    title: IA
    api_keys:
      title: Claves de API de los servicios de IA
      description: Gestiona las claves de API de los servicios de IA.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: Clave de API de {$service}

  # Accessibility panel
  accessibility:
    title: Accesibilidad
    underline_links:
      title: Subrayar los enlaces
      description: Mostrar el subrayado de los enlaces en la vista previa de la entrada y en las etiquetas de la interfaz de usuario.
      switch_label: Subrayar siempre los enlaces

  # Data Management panel
  data:
    title: Gestión de datos
    clear_data:
      title: Borrar datos
      # Clear File Cache button
      file_cache:
        description: Elimina el contenido de los archivos y las miniaturas de imágenes almacenados en la caché local para liberar espacio o resolver problemas causados por datos obsoletos.
        button_label: Limpiar la caché de archivos
        confirmation: Se eliminarán el contenido de los archivos y las miniaturas de imágenes almacenados en la caché local. Tus borradores sin guardar y tu configuración se conservarán, y los datos eliminados se volverán a descargar o generar cuando sea necesario. El CMS se recargará al terminar.
      # Erase All Data button
      all_data:
        description: Elimina todo lo que el CMS guarda en este navegador, incluidos los archivos en caché, los borradores sin guardar y la configuración. Lo que ya esté guardado en tu repositorio no se verá afectado.
        button_label: Borrar todos los datos
        confirmation: Se eliminarán todos los datos almacenados en este navegador, incluidos el contenido de los archivos en caché, las miniaturas de imágenes, los borradores sin guardar, la configuración y el estado de inicio de sesión. Tu repositorio no se verá afectado, pero se perderá cualquier cambio que no hayas guardado y tendrás que iniciar sesión de nuevo. El CMS se recargará al terminar.

  # Developer panel
  developer:
    title: Desarrollador
    developer_mode:
      title: Modo de desarrollador
      description: Habilitar algunas funciones orientadas a desarrolladores, incluidos registros detallados en la consola y menús contextuales nativos.
      switch_label: Habilitar el modo de desarrollador
    local_git:
      title: Commits de Git
      description: Haz commit de tus cambios en la branch actual de tu repositorio local cada vez que los guardes, como hace el CMS cuando trabajas con un repositorio remoto. Después podrás revisar los commits y hacer push con tus herramientas de Git habituales.
      switch_label: Hacer commit de los cambios en Git
      checking: Comprobando el repositorio…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Se hará commit de los cambios en la branch {$branch} como {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: No se puede hacer commit de los cambios en este momento. {$reason}
    deploy_hook:
      title: Hook de despliegue
      description: Introduce una URL de webhook que se llamará cuando actives manualmente un despliegue seleccionando Publicar cambios. Puedes dejarlo en blanco si usas GitHub Actions.
      # Hook URL input
      url:
        field_label: URL del hook
        saved: URL del hook guardada.
        removed: URL del hook eliminada.
      # Authorization header input
      auth:
        field_label: Encabezado de autorización (p. ej., Bearer <token>) (opcional)
        saved: Encabezado de autorización guardado.
        removed: Encabezado de autorización eliminado.

