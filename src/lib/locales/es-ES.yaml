    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'La opción `{$option}` debe ser uno de estos valores: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: La opción `{$option}` debe ser `{$value}`.
    schema_invalid_empty_value: La opción `{$option}` debe ser una cadena vacía.
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: La opción `{$option}` debe ser un array de {$count} elementos.
    schema_invalid_value: La opción `{$option}` tiene un valor no válido.
    schema_missing_option: La opción `{$option}` es obligatoria.
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Se requiere una de estas opciones: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: una cadena
      number: un número
      integer: un entero
      boolean: un booleano
      array: un array
      object: un objeto
      'null': vacía

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: No se ha definido el ID de la aplicación OAuth. Los usuarios deben proporcionar un token de acceso para iniciar sesión.
    # Don’t localize `prefix`
    site_library_prefix_template: La opción `prefix` de una biblioteca de medios contiene etiquetas de plantilla, que solo se admiten a nivel de campo, ya que en el nivel superior no hay ninguna entrada con la que rellenarlas.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: La opción `{$prop}` no es compatible con Sveltia CMS. Se ignorará.
    # Don’t localize `stages`, `publish_mode`, `editorial_workflow` and {$type}, which is `preview` or `simple`
    publish_mode_stages_ignored: La opción `stages` de `publish_mode` solo se aplica al modo de publicación `editorial_workflow`, así que se ignora con `{$type}`.
    # Don’t localize `pattern`, `m` and `s`
    inline_component_multiline_pattern: El `pattern` de este componente en línea tiene el indicador `m` o `s` o coincide con saltos de línea, pero un componente en línea solo se busca dentro de un párrafo.
    # {$name} is a button or component name and {$option} is `buttons` or `editor_components`; Don’t localize them and `multiline: false`
    single_line_block_item: 'El elemento `{$name}` de la opción `{$option}` se ignora, ya que un campo con `multiline: false` solo puede contener contenido en línea.'
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Se han establecido tanto `picker_utc` como las nuevas opciones de zona horaria (`input_timezone` u `output_utc`). Las nuevas opciones tienen prioridad. Considera quitar `picker_utc` de tu configuración.
    # Don’t localize `localize_format` and `format`
    localize_format_without_format: La opción `localize_format` no tiene efecto porque el campo no tiene la opción `format` y su valor se guarda en el formato ISO 8601.
    # {$name} is a template tag like `fields.lines.*.price`; Don’t localize `value`, `*` and `sum()`
    compute_field_wildcard_without_item: La opción `value` del campo Compute hace referencia a `{$name}`, pero el campo no está en un elemento de la lista que representa `*`, así que no se resuelve en nada. Solo una función de agregado como `sum()` puede usar todos los elementos de una lista.
    # {$name} is a template tag like `fields.lines.*.amount`; Don’t localize `value`
    compute_field_self_reference: La opción `value` del campo Compute hace referencia al propio campo como `{$name}`, así que su valor cambia cada vez que se calcula y nunca se estabiliza.
    # {$name} is a template tag like `fields.total`; Don’t localize `value`
    compute_field_reference_cycle: La opción `value` del campo Compute hace referencia a `{$name}`, otro campo Compute que hace referencia a este campo, directamente o a través de otros campos, así que sus valores nunca se estabilizan.
    # Don’t localize `localize_format`, `true` and `de`
    localize_format_without_i18n: La opción `localize_format` es `true`, pero la internacionalización no está activada en la colección, así que el valor se escribe en inglés. Establece en su lugar la opción en un código de idioma como `es`.
    # {$locale} is the locale code from the configuration; Don’t localize `localize_format`
    localize_format_unsupported_locale: La opción `localize_format` está establecida en `{$locale}`, que no es un idioma admitido, así que el valor se escribe en inglés.
    # Don’t localize `preview_path`
    preview_path_no_date_field: La opción `preview_path` usa etiquetas de fecha y hora, pero la colección no tiene ningún campo DateTime del que leerlas, así que no se mostrará el enlace de vista previa.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: La opción `preview_path_date_field` hace referencia a un campo llamado `{$name}`, pero no hay ningún campo DateTime definido con ese nombre, así que no se mostrará el enlace de vista previa.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: La opción `preview_path` hace referencia a `{$name}`, pero no hay ningún campo con ese nombre definido en la colección, así que no se mostrará el enlace de vista previa.
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: La colección no tiene ningún campo `{$name}` con el que nombrar las entradas nuevas, así que cada entrada nueva recibe un slug aleatorio. Añade un campo `{$name}` o establece la opción `identifier_field` o `slug`.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: La opción `i18n` de `slug` no tiene efecto porque la colección no usa la estructura de internacionalización `multiple_files`, `multiple_folders` ni `multiple_root_folders`, en la que cada idioma tiene su propio archivo.
    # Don’t localize `slug`, `template` and `auto_increment`
    slug_template_ignored: La opción `template` de `slug` se ignora porque la opción `auto_increment` numera los slugs en su lugar.
    # {$file} is the file path; Don’t localize `file`, `locale`, `i18n`, `false`,
    # `omit_default_locale_from_file_path` and the example paths. The curly brackets in the examples
    # are escaped with backslashes for MessageFormat 2
    locale_not_omitted_from_file_path: El marcador de posición `locale` no se puede quitar de la ruta de `file` `{$file}`, así que el idioma predeterminado se mantiene en ella a pesar de la opción de internacionalización `omit_default_locale_from_file_path`. Para omitir el idioma, usa el marcador de posición como nombre completo de una carpeta, como en `\{\{locale\}\}/about.md`, o entre el nombre del archivo y la extensión, como en `about.\{\{locale\}\}.md`. Para mantenerlo, establece la opción en `false` en la opción `i18n` del archivo.
    # Don’t localize `i18n`
    i18n_not_configured: La opción `i18n` está activada, pero la internacionalización no está configurada en el nivel superior de la configuración ni en la colección, así que la opción no tiene efecto.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: La opción `public_folder` es una cadena vacía, así que en su lugar se usa la ruta de `media_folder` para las rutas de los recursos guardadas en las entradas. Quita la opción o establécela en la ruta que quieras usar, como `/images`.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: La opción `{$option}` no está definida en el esquema de configuración de Sveltia CMS. Se ignorará. Revisa si hay un error tipográfico o de sintaxis.
    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: La opción `default_localized` no tiene efecto porque la internacionalización no está activada en la colección. Usa en su lugar la opción `default`.
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: La opción `default_localized` tiene un valor para `{$locale}`, que no es uno de los idiomas de la colección, así que el valor nunca se usa.

