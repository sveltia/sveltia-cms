item_removed: Elemento eliminado.

# Add item button label, also used by the Relation field to create a new entry in the referenced
# collection, with the collection’s singular label
# Example: “Add Image”, “Add Author”
# {$name} is the label of the item type that can be added
add_x: Añadir {$name}

# List item context menu
# aria-label for the button opening the menu, and for the menu itself
list_item_options: Opciones del elemento de la lista
add_item_above: Añadir un elemento encima
add_item_below: Añadir un elemento debajo
paste_item_above: Pegar el elemento encima
paste_item_below: Pegar el elemento debajo
paste_item_to_replace: Pegar para reemplazar

# List item clipboard
# Button in the list toolbar to paste a copied item, from any list in any entry, at the end of the
# list, or at the start with the `add_to_top` option
paste_item: Pegar el elemento
list_item_copied: Elemento copiado.
# ⋮ stands for the icon of the item menu button; keep it, along with the button’s aria-label
no_list_item_to_paste: No hay ningún elemento copiado para pegar. Para copiar uno, abre el menú ⋮ (Opciones del elemento de la lista) de un elemento y selecciona Copiar.
list_item_not_compatible: El elemento copiado no encaja en esta lista.
# {$count} is the number of the values left out, as the list doesn’t have the fields
list_item_pasted_without_values: |
