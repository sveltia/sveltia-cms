# Reorder mode: toggle buttons
reorder_entries: Reordenar entradas
done_reordering_entries: Terminar de reordenar las entradas
cancel_reordering_entries: Cancelar el reordenamiento de las entradas

# Reorder error message
saving_reorder_failed: No se ha podido guardar el nuevo orden de las entradas. Inténtalo de nuevo.

# ==============================================================================
# Bulk Entry Editing
# ==============================================================================
# Strings for editing the fields of many entries at once in a table.

# Bulk edit mode: toggle buttons
bulk_edit_entries: Editar entradas en bloque
save_bulk_edits: Guardar la edición en bloque
cancel_bulk_edits: Cancelar la edición en bloque

# Bulk edit table: column header of the entry titles
bulk_edit_entry: Entrada

# Bulk edit table: label of the table
bulk_edit_table: Editor en bloque

# Bulk edit table: label of a cell input; {$field} is the field label, {$entry} is the entry title
bulk_edit_cell: '{$field} de {$entry}'

