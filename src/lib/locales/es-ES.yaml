# ==============================================================================
# List and Object Field Controls
# ==============================================================================
# Controls for List and Object field types.

# List item actions
remove_this_item: Quitar este elemento
move_up: Mover hacia arriba
move_down: Mover hacia abajo
# Menu of a list item or file with the extra reorder actions, shown in a list of 3 or more items
reorder_options: Opciones de reordenado
move_to_top: Mover al principio
move_to_bottom: Mover al final
# Opens a dialog asking for the position to move a list item to
move_to: Mover a…
# Dialog asking for the new position of an item. {$count} is the number of items in the list
move_to_description: Introduce una posición del 1 al {$count}.
move_to_position: Posición
