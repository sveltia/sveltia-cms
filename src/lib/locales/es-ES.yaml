collection_not_found: No se ha encontrado la colección.
asset_folder_not_found: No se ha encontrado la carpeta de recursos.
file_not_found: No se ha encontrado el archivo.

# Selection count indicator
# Shown in the toolbar when items are selected (e.g., “2 of 10 selected”)
# {$selected} is the selected item count and {$total} is the total item count
