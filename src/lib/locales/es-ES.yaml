# ==============================================================================
# Cloud Storage Services
# ==============================================================================
# Strings for external cloud storage service integrations.

cloud_storage:
  # Configuration error
  invalid: El servicio no está configurado correctamente.

  # Authentication states
  auth:
    api_key:
      key_label: Clave de API
      # {$key} is the credential label, e.g., API Key, and {$service} is the cloud service name
      initial: Introduce tu {$key} para {$service}.
      requested: Validando…
      # {$key} is the credential label the user entered, e.g., API Key
      error: El {$key} proporcionado no es válido. Verifícalo e inténtalo de nuevo.
    password:
      # {$service} is the cloud service name
      initial: Introduce tu contraseña para {$service}.
      requested: Iniciando sesión…
      error: El nombre de usuario o la contraseña son incorrectos. Verifícalos e inténtalo de nuevo.

  # Shared by the S3-compatible services, unless overridden below
  s3:
    auth_key_label: Clave de acceso secreta

  # Service-specific configurations
  cloudinary:
    iframe_title: Biblioteca multimedia de Cloudinary
    activate:
      button_label: Activar Cloudinary
      description: Después de iniciar sesión, vuelve a hacer clic en el botón Iniciar sesión para continuar.
    auth_key_label: Secreto de API
    open_library: Abrir Cloudinary

  uploadcare:
    auth_key_label: Clave secreta de API

  azure_blob_storage:
    auth_key_label: Token SAS

  backblaze_b2:
    auth_key_label: Clave de aplicación

  bunny_storage:
    auth_key_label: Contraseña de la zona de almacenamiento

# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Hay un error en la configuración del CMS. Soluciona el problema e inténtalo de nuevo. }}
      *   {{ Hay errores en la configuración del CMS. Soluciona los problemas e inténtalo de nuevo. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: colección {$collection}
    file: archivo {$file}
    component: componente {$component}
    # Don’t localize `{$field}`
    field: campo `{$field}`

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS solo funciona con URL HTTPS o localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ La URL del archivo de configuración debe usar el protocolo HTTPS o una dirección localhost. }}
        *   {{ Las URL de los archivos de configuración deben usar el protocolo HTTPS o direcciones localhost. }}
    fetch_failed: No se ha podido obtener el archivo de configuración.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: La respuesta HTTP se ha devuelto con el estado {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'No se ha podido obtener el archivo de configuración. Para evitar que se cargue el archivo `config.yml`, añade <a>`load_config_file: false`</a> al objeto de configuración que se pasa a `CMS.init()`.'
    parse_failed: No se ha podido analizar el archivo de configuración.
    parse_failed_invalid_object: El archivo de configuración no es un objeto de JavaScript válido.
    parse_failed_unsupported_type: El archivo de configuración no es un tipo de archivo válido. Solo se admiten YAML, TOML y JSON.
    no_collection: No se han definido colecciones.
    # Don’t localize `hide`
    no_visible_collection: Al menos una colección debe estar visible. Revisa la opción `hide`.
    missing_backend: No se ha definido el backend.
    missing_backend_name: No se ha definido el nombre del backend.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: El backend {$name} <a>no es compatible</a> con Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: El backend obsoleto {$name} <a>no es compatible</a> con Sveltia CMS.
    unsupported_custom_backend: Los backends personalizados <a>no son compatibles</a> con Sveltia CMS.
    unsupported_backend_suggestion: Usa uno de los <a>backends compatibles</a> en su lugar.
    missing_repository: No se ha definido el repositorio.
    invalid_repository: El repositorio configurado no es válido. Debe tener el formato “owner/repo”.
    # Don’t localize `api_root`
    missing_api_root: La opción `api_root` no está definida. Es obligatoria para el backend de Forgejo.
    invalid_root_dir: El directorio raíz no es válido. Debe ser una ruta dentro del repositorio, sin “..”.
    invalid_root_dir_branch: El directorio raíz no se puede usar en los nombres de la ‘branch’ de los modos de publicación `editorial_workflow` y `preview`. Ninguna parte de su ruta puede empezar por un punto, terminar en “.lock” ni contener un espacio o un carácter especial, como dos puntos o un asterisco.
    path_outside_root_dir: La ruta “{$path}” sale del directorio raíz, donde el CMS no puede listar archivos.
    oauth_implicit_flow: El método de autenticación configurado (flujo implícito) no es compatible con Sveltia CMS. Usa un <a>método de autenticación</a> diferente en su lugar.
    github_pkce_unsupported: La autorización PKCE aún no es compatible debido a las limitaciones de GitHub. Usa un <a>método de autenticación</a> diferente en su lugar.
    oauth_no_app_id: No se ha definido el ID de la aplicación OAuth.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: La opción `open_authoring` requiere el modo de publicación `editorial_workflow` o `preview`. Consulta la <a>documentación</a> para más detalles.
    # Don’t localize `auth_methods`
    no_auth_methods: La opción `auth_methods` debe contener al menos un método.
    # Don’t localize `auth_scope`, `repo` and `public_repo`
    auth_scope_no_repo: La opción `auth_scope` debe incluir `repo` o `public_repo`.
    missing_media_folder: No se ha definido la carpeta de medios.
    public_folder_relative_path: La carpeta pública configurada no es válida. Debe ser una ruta absoluta que empiece con “/”.
    public_folder_absolute_url: No se admite una URL absoluta para la opción de carpeta pública en Sveltia CMS.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: La opción `{$option}` contiene la etiqueta de plantilla `{$tag}` no admitida. Solo se pueden usar las etiquetas de plantilla del slug, como `\{\{slug\}\}` y `\{\{year\}\}`, y las etiquetas `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` y `\{\{public_folder\}\}`.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: La opción `{$option}` contiene la etiqueta de plantilla `{$tag}`, que solo se puede usar en la opción de una colección, de un archivo de colección o de un campo, donde hay una entrada con la que rellenarla.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: La opción `sanitize_replacement` está establecida en `{$replacement}`, pero contiene un carácter que no se puede usar en un slug, así que no puede sustituir a otro.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: La opción `{$option}` está establecida en `{$url}`, pero debe ser una URL absoluta que empiece por `https://` o `http://`.
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: La opción `stages` de `publish_mode` debe empezar por `draft` y enumerar las fases en el orden `draft`, `pending_review`, `pending_publish`, sin repetir ninguna.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: La opción `i18n.locales` debe incluir al menos un idioma.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: La opción `default_locale` está establecida en `{$locale}`, pero no es uno de los `locales`.
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: La opción `initial_locales` contiene `{$locale}`, pero no es uno de los `locales`.
    # Don’t localize `i18n`
    i18n_no_collections: 'La opción `i18n` está configurada en el nivel superior, pero ninguna de las colecciones o singletons tiene la opción `i18n`, así que no se puede traducir ningún contenido. Añade `i18n: true` a las colecciones y singletons que quieras traducir.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: La opción `transformations` contiene una clave `{$key}` no compatible. Debe ser `raster_image`, `svg` o un formato de imagen rasterizada compatible.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: La opción `quality` de la transformación `{$key}` no es válida. Debe ser un número entero entre 0 y 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: La opción `{$prop}` de la transformación `{$key}` no es válida. Debe ser un número entero positivo.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: La colección de recursos {$count} debe tener la opción `name` definida como una cadena de texto no vacía.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: El nombre de la colección de recursos `{$name}` no es válido. No debe contener caracteres especiales.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Los nombres de las colecciones de recursos deben ser únicos, pero `{$name}` se usa más de una vez.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: La colección debe tener definida una de las opciones `folder`, `file`, `files` o `divider`.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: La colección no puede tener más de una de las opciones `folder`, `file`, `files` y `divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: La extensión `{$extension}` no coincide con el formato `{$format}`.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: El campo `{$name}` se guarda como el cuerpo debajo del ‘front matter’, que solo puede contener texto, no un número, un booleano, una lista o un objeto como hace un campo `{$widget}`. Usa un tipo de campo que contenga texto o cambia el nombre del campo.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
    # brackets are escaped with backslashes for MessageFormat 2
    invalid_collection_data_file: La opción `file` `{$file}` no es válida. Debe ser la ruta a un archivo JSON, sin el marcador de posición `\{\{locale\}\}`.
    # {$prop} is the option name; Don’t localize `file`
    unsupported_collection_data_file_option: La opción `{$prop}` no se admite en una colección con la opción `file`.
    # Don’t localize `file`, `publish_mode` and `simple`
    collection_data_file_workflow: El flujo editorial y el flujo de vista previa, incluida la autoría abierta (Open Authoring), no se admiten en una colección con la opción `file`. Establece la opción `publish_mode` de la colección en `simple`.
    # {$prop} is the option name; Don’t localize `file` and `slug`. The curly brackets are escaped
    # with backslashes for MessageFormat 2
    collection_data_file_slug_tag: La opción `{$prop}` no puede contener la etiqueta `\{\{slug\}\}` en una colección con la opción `file`, ya que el slug de una entrada es su posición, que cambia cuando las entradas se reordenan o se eliminan. Usa en su lugar un campo con un valor único.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: La plantilla de slug `{$slug}` no es válida porque no puede contener barras. Para organizar las entradas en subcarpetas, usa la opción `path` en lugar de `slug`.
    # {$name} is the field name from the configuration; Don’t localize `identifier_field`
    invalid_identifier_field: La opción `identifier_field` hace referencia a `{$name}`, pero no hay ningún campo con ese nombre definido en la colección.
    # {$name} is the field name from the configuration; Don’t localize `filter`
    invalid_filter_field: La opción `filter` hace referencia a `{$name}`, pero no hay ningún campo con ese nombre definido en la colección.
    # Don’t localize `filter`, `value` and `pattern`
    invalid_filter_no_condition: La opción `filter` debe tener la opción `value` o `pattern` con la que comparar las entradas.
    # {$option} is an option name such as `slug` or `summary` and {$name} is the field name or template tag from the configuration
    option_field_not_found: La opción `{$option}` hace referencia a `{$name}`, pero no hay ningún campo con ese nombre definido.
    # {$name} is the field name from the configuration and {$widget} is its field type; Don’t localize `thumbnail`
    thumbnail_field_not_media: La opción `thumbnail` hace referencia a `{$name}`, pero debe ser un campo Image o File, no un campo `{$widget}`.
    # Don’t localize `inline` or `multiple`
    invalid_inline_component_fields: El modo `inline` requiere un único campo Boolean, Color, DateTime, Number, Relation, Select o String. Un campo Relation o Select no puede tener activada la opción `multiple`.
    # {$option} is an option name such as `pattern` or `filter` and {$pattern} is the configured pattern
    invalid_regex: La opción `{$option}` contiene una expresión regular no válida, `{$pattern}`, que se ignora.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: La opción `reorder` hace referencia a un grupo de vista llamado `{$name}`, pero no se ha definido ningún grupo con ese nombre en la opción `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit` and `fields`
    invalid_bulk_edit_field: La lista `fields` de la opción `bulk_edit` hace referencia a un campo llamado `{$name}`, pero no hay ningún campo de nivel superior con ese nombre definido en la colección.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit`, `fields` and `multiple`
    unsupported_bulk_edit_field: El campo `{$name}` de la lista `fields` de la opción `bulk_edit` no se puede editar en bloque. Solo se admite un campo Boolean, Color, DateTime, Number, Relation, Select o String que no sea de solo lectura, no tenga activada la opción `multiple` y no se establezca automáticamente al guardar.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: La opción `sortable_fields` hace referencia a un campo llamado `{$name}`, pero no se ha definido ningún campo con ese nombre en la colección.
    # Don’t localize `sortable_fields` and `default_sort`
    multiple_sortable_field_defaults: Solo un elemento de la opción `sortable_fields` puede tener la opción `default_sort`.
    # {$option} is `table_columns` or `summary_fields`, and {$name} is the field name from the configuration
    invalid_table_column_field: La opción `{$option}` hace referencia a un campo llamado `{$name}`, pero no hay ningún campo con ese nombre definido en la colección.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: La opción `view_groups` hace referencia a un campo llamado `{$name}`, pero no se ha definido ningún campo con ese nombre en la colección.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: La opción `view_filters` hace referencia a un campo llamado `{$name}`, pero no se ha definido ningún campo con ese nombre en la colección.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: El grupo de vista {$count} debe tener la opción `name` definida como una cadena de texto no vacía.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: El nombre del grupo de vista `{$name}` no es válido. No debe contener caracteres especiales.
    duplicate_view_group_name: Los nombres de los grupos de vista deben ser únicos, pero `{$name}` se usa más de una vez.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: El filtro de vista {$count} debe tener la opción `name` definida como una cadena de texto no vacía.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `pattern`, `eq` and `gte`
    invalid_view_filter_no_condition: El filtro de vista {$count} debe tener la opción `pattern` o una opción de comparación, como `eq` o `gte`, con la que comparar las entradas.
    # {$name} is the invalid or duplicate view filter name
    invalid_view_filter_name: El nombre del filtro de vista `{$name}` no es válido. No debe contener caracteres especiales.
    duplicate_view_filter_name: Los nombres de los filtros de vista deben ser únicos, pero `{$name}` se usa más de una vez.
