remote_change:
  reload_entry: Επαναφόρτωση καταχώρισης
  # Confirmation shown before reloading when the user has unsaved changes
  confirm_reloading_entry: Είστε βέβαιοι ότι θέλετε να επαναφορτώσετε την καταχώριση; Οι μη αποθηκευμένες αλλαγές σας θα χαθούν.

