    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: Το πεδίο List δεν μπορεί να έχει ταυτόχρονα τις επιλογές `field`, `fields` και `types`.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: Ο τύπος μεταβλητής του πεδίου List είναι άκυρος. Η επιλογή `widget` είναι ορισμένη σε `{$widget}` αλλά πρέπει να είναι `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: Το πεδίο Object δεν μπορεί να έχει ταυτόχρονα τις επιλογές `fields` και `types`.
    # Don’t localize `fields`, and `types`
    object_field_missing_fields: Το πεδίο Object πρέπει να έχει ορισμένη είτε την επιλογή `fields` ή την `types`.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: Η συλλογή αναφοράς `{$collection}` είναι άκυρη ή δεν έχει οριστεί.
    relation_field_invalid_collection_file: Το αρχείο αναφοράς `{$file}` είναι άκυρο ή δεν έχει οριστεί.
    # Don’t localize `file`
    relation_field_missing_file_name: Η επιλογή `file` πρέπει να οριστεί για μια σχέση με μια συλλογή αρχείων.
    relation_field_invalid_value_field: Το πεδίο τιμής αναφοράς `{$field}` είναι άκυρο ή δεν έχει οριστεί.
    unexpected: Μη αναμενόμενο σφάλμα

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: Το OAuth application ID δεν έχει οριστεί. Οι χρήστες πρέπει να παρέχουν διακριτικό πρόσβασης για να συνδεθούν.
    editorial_workflow_unsupported: Η ροή εργασίας σύνταξης δεν υποστηρίζεται ακόμη στο Sveltia CMS.
    open_authoring_unsupported: Η ανοιχτή συγγραφή (open authoring) δεν υποστηρίζεται ακόμη στο Sveltia CMS.
    nested_collections_unsupported: Οι εμφωλευμένες (nested) συλλογές δεν υποστηρίζονται ακόμη στο Sveltia CMS.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: Η επιλογή `{$prop}` δεν υποστηρίζεται στο Sveltia CMS και θα αγνοηθεί.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Είναι ορισμένες ταυτόχρονα η επιλογή `picker_utc` και οι νεότερες επιλογές ζώνης ώρας (`input_timezone` ή `output_utc`). Οι νέες επιλογές έχουν προτεραιότητα. Σκεφτείτε να αφαιρέσετε το `picker_utc` από τις ρυθμίσεις σας.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Δείτε τις σημειώσεις συμβατότητας για λεπτομέρειες: {$link}'

  # Console tip shown after config load
  schema_tip: Για καλύτερη εμπειρία ανάπτυξης (Dx), μπορείτε να επικυρώσετε το αρχείο ρυθμίσεών σας έναντι του JSON σχήματος του Sveltia CMS. Δείτε το {$link} για λεπτομέρειες.

