# ==============================================================================
# Field Validation
# ==============================================================================
# Inline validation error messages for form fields.

validation:
  # Required field missing
  value_missing: Αυτό το πεδίο είναι υποχρεωτικό.

  # Minimum value/count not met
  range_underflow:
    # {$min} is the minimum allowed value, already formatted for the input type
    datetime-local: Η ημερομηνία/ώρα πρέπει να είναι στις ή μετά τις {$min}.
    date: Η ημερομηνία πρέπει να είναι στις ή μετά τις {$min}.
    time: Η ώρα πρέπει να είναι στις ή μετά τις {$min}.
    number: Η τιμή πρέπει να είναι μεγαλύτερη ή ίση με {$min}.
    # {$min} is the minimum number of selected options
    select: |
      .input {$min :integer}
      .match $min
        one {{ Πρέπει να επιλέξετε τουλάχιστον {$min} επιλογή. }}
        *   {{ Πρέπει να επιλέξετε τουλάχιστον {$min} επιλογές. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Πρέπει να προσθέσετε τουλάχιστον {$min} αντικείμενο. }}
        *   {{ Πρέπει να προσθέσετε τουλάχιστον {$min} αντικείμενα. }}

  # Maximum value/count exceeded
  range_overflow:
    # {$max} is the maximum allowed value, already formatted for the input type
    datetime-local: Η ημερομηνία/ώρα πρέπει να είναι στις ή πριν τις {$max}.
    date: Η ημερομηνία πρέπει να είναι στις ή πριν τις {$max}.
    time: Η ώρα πρέπει να είναι στις ή πριν τις {$max}.
    number: Η τιμή πρέπει να είναι μικρότερη ή ίση με {$max}.
    # {$max} is the maximum number of selected options
    select: |
      .input {$max :integer}
      .match $max
        one {{ Δεν μπορείτε να επιλέξετε περισσότερες από {$max} επιλογή. }}
        *   {{ Δεν μπορείτε να επιλέξετε περισσότερες από {$max} επιλογές. }}
    # {$max} is the maximum number of list items
    add: |
      .input {$max :integer}
      .match $max
        one {{ Δεν μπορείτε να προσθέσετε περισσότερα από {$max} αντικείμενο. }}
        *   {{ Δεν μπορείτε να προσθέσετε περισσότερα από {$max} αντικείμενα. }}

  # String length constraints
  # {$min :integer} and {$max :integer} are character-count limits
  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Πρέπει να εισαγάγετε τουλάχιστον {$min} χαρακτήρα. }}
      *   {{ Πρέπει να εισαγάγετε τουλάχιστον {$min} χαρακτήρες. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ Δεν μπορείτε να εισαγάγετε περισσότερους από {$max} χαρακτήρα. }}
      *   {{ Δεν μπορείτε να εισαγάγετε περισσότερους από {$max} χαρακτήρες. }}

  # Type validation errors
  type_mismatch:
    number: Παρακαλούμε εισαγάγετε έναν αριθμό.
    email: Παρακαλούμε εισαγάγετε μια έγκυρη διεύθυνση email.
    url: Παρακαλούμε εισαγάγετε ένα έγκυρο URL.

  # Value used for the same field in another entry of the collection
  value_not_unique: Αυτή η τιμή χρησιμοποιείται ήδη σε άλλη καταχώριση.
  # Key of a keyed List field item used for another item of the same list
  key_not_unique: Αυτό το κλειδί χρησιμοποιείται ήδη σε άλλο στοιχείο.
  # Key of a keyed List field item that is a whole number, which doesn’t keep its order in a map
  key_numeric: Το κλειδί δεν μπορεί να είναι ακέραιος αριθμός, καθώς τα στοιχεία θα έχαναν τη σειρά τους.

  # Custom field validation error
  invalid_value: Μη έγκυρη τιμή.
  unexpected_error: Παρουσιάστηκε μη αναμενόμενο σφάλμα.

