# Collection view announcements with entry counts
# {$collection} is the collection label and {$count} is the number of entries in it
viewing_x_collection: |
  .input {$count :integer}
  .match $count
    0   {{ Τώρα βλέπετε τη συλλογή “{$collection}”, η οποία δεν έχει ακόμα καταχωρίσεις. }}
    one {{ Τώρα βλέπετε τη συλλογή “{$collection}”, η οποία έχει μία καταχώριση. }}
    *   {{ Τώρα βλέπετε τη συλλογή “{$collection}”, η οποία έχει {$count} καταχωρίσεις. }}
# Asset folder view announcements with asset counts
# {$folder} is the folder label and {$count} is the number of assets in it
viewing_x_asset_folder: |
  .input {$count :integer}
  .match $count
    0   {{ Τώρα βλέπετε τον φάκελο πόρων “{$folder}”, ο οποίος δεν έχει ακόμα πόρους. }}
    one {{ Τώρα βλέπετε τον φάκελο πόρων “{$folder}”, ο οποίος έχει έναν πόρο. }}
    *   {{ Τώρα βλέπετε τον φάκελο πόρων “{$folder}”, ο οποίος έχει {$count} πόρους. }}

