    object_field_default_missing_type: Η επιλογή `default` του πεδίου Object δεν έχει την ιδιότητα `{$typeKey}`, η οποία προσδιορίζει έναν από τους τύπους `types`.
    # {$typeKey} is the configured type key, `type` by default, and {$value} is its value in the default object; Don’t localize `default` and `types`
    object_field_invalid_default_type: Η ιδιότητα `{$typeKey}` της επιλογής `default` του πεδίου Object είναι `{$value}`, αλλά αυτό δεν περιλαμβάνεται στα `types`.
    # Don’t localize `default` and `output_code_only`
