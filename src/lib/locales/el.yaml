    # Don’t localize `pattern`, `m` and `s`
    inline_component_multiline_pattern: Το `pattern` αυτού του ενσωματωμένου (inline) στοιχείου έχει τη σημαία `m` ή `s` ή αντιστοιχεί σε αλλαγές γραμμής, αλλά ένα inline στοιχείο αντιστοιχίζεται μόνο μέσα σε μια παράγραφο.
