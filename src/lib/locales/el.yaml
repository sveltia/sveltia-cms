    collection_file_i18n_no_fields: 'Το αρχείο συλλογής έχει την επιλογή `i18n`, αλλά κανένα από τα πεδία του δεν έχει την επιλογή `i18n`, επομένως κανένα πεδίο δεν μπορεί να μεταφραστεί. Προσθέστε `i18n: true` ή `i18n: duplicate` στα πεδία που θέλετε να μεταφράσετε.'
