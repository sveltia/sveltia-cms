    list_field_map_key_not_localized: 'Η επιλογή `map_key_field` του πεδίου List αναφέρεται στο `{$name}`, αλλά το υποπεδίο δεν μπορεί να έχει `i18n: false`, καθώς τα στοιχεία χρειάζονται κλειδί σε κάθε γλώσσα. Χρησιμοποιήστε `i18n: duplicate` ή αφαιρέστε την επιλογή.'
