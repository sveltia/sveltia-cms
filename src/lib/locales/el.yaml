  .input {$count :integer}
  .match $count
    one {{ Αυτό το αρχείο δεν μπορεί να μεταφορτωθεί επειδή γίνονται δεκτές μόνο εικόνες των εξής τύπων: {$types}. }}
    *   {{ Αυτά τα αρχεία δεν μπορούν να μεταφορτωθούν επειδή γίνονται δεκτές μόνο εικόνες των εξής τύπων: {$types}. }}

