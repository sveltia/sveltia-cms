# Toast notification shown when changes saved with the local backend couldn’t be committed to Git
# {$reason} is one of the `local_git_skip_reasons` strings below
local_git_not_committed: Οι αλλαγές σας αποθηκεύτηκαν, αλλά δεν έγιναν commit στο Git. {$reason} Για να αποθηκεύονται μόνο τα αρχεία, απενεργοποιήστε τα commits Git στις Ρυθμίσεις > Για προγραμματιστές.
local_git_skip_reasons:
  unsupported_repository: Το repository σας χρησιμοποιεί μια δυνατότητα του Git που δεν υποστηρίζει το CMS, όπως linked worktree, ονόματα αντικειμένων SHA-256, τη μορφή reftable, sparse index ή index στην έκδοση 3 ή 4, την οποία χρησιμοποιούν η επιλογή feature.manyFiles και η εντολή git add -N.
  missing_identity: Το όνομα και η διεύθυνση email σας δεν έχουν οριστεί στις ρυθμίσεις Git του repository και το CMS δεν μπορεί να διαβάσει τις γενικές σας ρυθμίσεις. Ορίστε τα στο repository με τις εντολές git config --local user.name "Your Name" και git config --local user.email "you@example.com".
  locked: Μια άλλη διεργασία Git χρησιμοποιεί το repository. Αν δεν εκτελείται καμία, διαγράψτε το αρχείο .git/index.lock.
  # The operation in progress, with how to finish or cancel it
  operation_in_progress:
    merge: Βρίσκεται σε εξέλιξη ένα merge. Ολοκληρώστε το με git commit ή ακυρώστε το με git merge --abort.
    rebase: Βρίσκεται σε εξέλιξη ένα rebase. Ολοκληρώστε το με git rebase --continue ή ακυρώστε το με git rebase --abort. Αν έχετε προχωρήσει σε κάτι άλλο, η εντολή git rebase --quit το εγκαταλείπει χωρίς να αλλάξει τα αρχεία σας.
    cherry_pick: Βρίσκεται σε εξέλιξη ένα cherry-pick. Ολοκληρώστε το με git cherry-pick --continue ή ακυρώστε το με git cherry-pick --abort.
    revert: Βρίσκεται σε εξέλιξη ένα revert. Ολοκληρώστε το με git revert --continue ή ακυρώστε το με git revert --abort.
    am: Βρίσκεται σε εξέλιξη εφαρμογή patches με git am. Ολοκληρώστε την με git am --continue ή ακυρώστε την με git am --abort.
    conflict: Ορισμένα αρχεία έχουν συγκρούσεις. Επιλύστε τις και προσθέστε πρώτα τα αποτελέσματα στο stage.
  detached_head: Δεν έχει γίνει checkout σε κανέναν κλάδο.
  staged_changes: Έχετε άλλες αλλαγές στο stage για commit. Κάντε τις commit ή αφαιρέστε τις πρώτα από το stage.
  # {$path} is the file path
  lfs: Το {$path} παρακολουθείται με το Git LFS, στο οποίο το CMS δεν μπορεί να κάνει commit.
  # {$message} is the error message
  error: Παρουσιάστηκε μη αναμενόμενο σφάλμα. {$message}

