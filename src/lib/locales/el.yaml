    *   {{ Αυτά τα αρχεία δεν μπορούν να μεταφορτωθούν επειδή είναι κατεστραμμένα ή το περιεχόμενό τους δεν αντιστοιχεί στις επεκτάσεις των αρχείων. Αυτό συμβαίνει συχνά όταν φωτογραφίες μετονομάζονται αντί να μετατραπούν, όπως εικόνες HEIC που αποθηκεύτηκαν ως αρχεία JPEG. Παρακαλούμε μετατρέψτε τα αρχεία και δοκιμάστε ξανά. }}
