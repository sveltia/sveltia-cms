    relation_field_invalid_search_field: Το πεδίο αναζήτησης αναφοράς `{$field}` είναι άκυρο ή δεν έχει οριστεί.
    relation_field_invalid_filter_field: Το πεδίο φίλτρου αναφοράς `{$field}` είναι άκυρο ή δεν έχει οριστεί.
    relation_field_invalid_sort_field: Το πεδίο ταξινόμησης αναφοράς `{$field}` είναι άκυρο ή δεν έχει οριστεί.
    # Don’t localize `sort_by` and `file`
    relation_field_sort_by_file_ignored: Η επιλογή `sort_by` δεν ισχύει για σχέση με αρχείο, του οποίου οι επιλογές ακολουθούν τη σειρά των στοιχείων της λίστας. Θα αγνοηθεί.
    unexpected: Μη αναμενόμενο σφάλμα

    # Schema validation errors, reported when the configuration doesn’t match the published JSON
    # schema. In all of these, {$option} is a configuration option path such as `backend.name` or
    # `view_filters[0].pattern`, relative to the collection, file or field named before it.
    # {$type} is a value type name from `schema_value_type` below
    schema_invalid_type: Η επιλογή `{$option}` πρέπει να είναι {$type}.
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'Η επιλογή `{$option}` πρέπει να είναι μία από τις εξής τιμές: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: Η επιλογή `{$option}` πρέπει να είναι `{$value}`.
    schema_invalid_empty_value: Η επιλογή `{$option}` πρέπει να είναι κενό string.
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: Η επιλογή `{$option}` πρέπει να είναι πίνακας με {$count} στοιχεία.
    schema_invalid_value: Η επιλογή `{$option}` έχει μη έγκυρη τιμή.
    schema_missing_option: Η επιλογή `{$option}` είναι υποχρεωτική.
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Απαιτείται μία από τις εξής επιλογές: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: string
      number: number
      integer: integer
      boolean: boolean
      array: array
      object: object
      'null': 'null'

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: Το OAuth application ID δεν έχει οριστεί. Οι χρήστες πρέπει να παρέχουν διακριτικό πρόσβασης για να συνδεθούν.
