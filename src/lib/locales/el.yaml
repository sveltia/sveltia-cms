    single_line_block_item: 'Το στοιχείο `{$name}` της επιλογής `{$option}` αγνοείται, καθώς ένα πεδίο με `multiline: false` μπορεί να περιέχει μόνο ενσωματωμένο (inline) περιεχόμενο.'
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Είναι ορισμένες ταυτόχρονα η επιλογή `picker_utc` και οι νεότερες επιλογές ζώνης ώρας (`input_timezone` ή `output_utc`). Οι νέες επιλογές έχουν προτεραιότητα. Σκεφτείτε να αφαιρέσετε το `picker_utc` από τις ρυθμίσεις σας.
    # Don’t localize `localize_format` and `format`
    localize_format_without_format: Η επιλογή `localize_format` δεν έχει κανένα αποτέλεσμα, επειδή το πεδίο δεν έχει επιλογή `format` και η τιμή του αποθηκεύεται σε μορφή ISO 8601.
    # {$name} is a template tag like `fields.lines.*.price`; Don’t localize `value`, `*` and `sum()`
    compute_field_wildcard_without_item: Η επιλογή `value` του πεδίου Compute αναφέρεται στο `{$name}`, αλλά το πεδίο δεν βρίσκεται σε στοιχείο της λίστας που αντιπροσωπεύει το `*`, επομένως δεν επιστρέφει τίποτα. Μόνο μια συγκεντρωτική συνάρτηση όπως η `sum()` μπορεί να χρησιμοποιήσει όλα τα στοιχεία μιας λίστας.
    # {$name} is a template tag like `fields.lines.*.amount`; Don’t localize `value`
    compute_field_self_reference: Η επιλογή `value` του πεδίου Compute αναφέρεται στο ίδιο το πεδίο ως `{$name}`, επομένως η τιμή του αλλάζει κάθε φορά που υπολογίζεται και δεν σταθεροποιείται ποτέ.
    # {$name} is a template tag like `fields.total`; Don’t localize `value`
    compute_field_reference_cycle: Η επιλογή `value` του πεδίου Compute αναφέρεται στο `{$name}`, ένα άλλο πεδίο Compute που αναφέρεται πίσω σε αυτό το πεδίο, άμεσα ή μέσω άλλων πεδίων, επομένως οι τιμές τους δεν σταθεροποιούνται ποτέ.
    # Don’t localize `localize_format`, `true` and `de`
    localize_format_without_i18n: Η επιλογή `localize_format` είναι `true`, αλλά η διεθνοποίηση δεν είναι ενεργοποιημένη για τη συλλογή, επομένως η τιμή γράφεται στα αγγλικά. Ορίστε αντ’ αυτού την επιλογή σε έναν κωδικό γλώσσας, όπως `de`.
    # {$locale} is the locale code from the configuration; Don’t localize `localize_format`
    localize_format_unsupported_locale: Η επιλογή `localize_format` έχει οριστεί σε `{$locale}`, που δεν είναι υποστηριζόμενη γλώσσα, επομένως η τιμή γράφεται στα αγγλικά.
    # Don’t localize `preview_path`
    preview_path_no_date_field: Η επιλογή `preview_path` χρησιμοποιεί ετικέτες ημερομηνίας και ώρας, αλλά η συλλογή δεν έχει πεδίο DateTime από το οποίο να τις διαβάσει, επομένως ο σύνδεσμος προεπισκόπησης δεν θα εμφανιστεί.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: Η επιλογή `preview_path_date_field` αναφέρεται σε ένα πεδίο με όνομα `{$name}`, αλλά δεν έχει οριστεί πεδίο DateTime με αυτό το όνομα, επομένως ο σύνδεσμος προεπισκόπησης δεν θα εμφανιστεί.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: Η επιλογή `preview_path` αναφέρεται στο `{$name}`, αλλά δεν έχει οριστεί τέτοιο πεδίο στη συλλογή, επομένως ο σύνδεσμος προεπισκόπησης δεν θα εμφανιστεί.
    # {$name} is the default identifier field name; Don’t localize `identifier_field` and `slug`
    missing_identifier_field: Η συλλογή δεν έχει πεδίο `{$name}` για την ονομασία νέων καταχωρίσεων, επομένως κάθε νέα καταχώριση λαμβάνει τυχαίο slug. Προσθέστε ένα πεδίο `{$name}` ή ορίστε την επιλογή `identifier_field` ή `slug`.
    # Don’t localize `slug`, `i18n`, `multiple_files`, `multiple_folders` and `multiple_root_folders`
    slug_i18n_ineffective: Η επιλογή `i18n` του `slug` δεν έχει κανένα αποτέλεσμα, επειδή η συλλογή δεν χρησιμοποιεί τη δομή i18n `multiple_files`, `multiple_folders` ή `multiple_root_folders`, όπου κάθε γλώσσα έχει δικό της αρχείο.
    # Don’t localize `slug`, `template` and `auto_increment`
    slug_template_ignored: Η επιλογή `template` του `slug` αγνοείται, επειδή η επιλογή `auto_increment` αριθμεί αντ’ αυτού τα slugs.
    # {$file} is the file path; Don’t localize `file`, `locale`, `i18n`, `false`,
    # `omit_default_locale_from_file_path` and the example paths. The curly brackets in the examples
    # are escaped with backslashes for MessageFormat 2
    locale_not_omitted_from_file_path: Το placeholder `locale` δεν μπορεί να αφαιρεθεί από τη διαδρομή `file` `{$file}`, επομένως η προεπιλεγμένη γλώσσα παραμένει σε αυτήν παρά την επιλογή i18n `omit_default_locale_from_file_path`. Για να παραλείψετε τη γλώσσα, χρησιμοποιήστε το placeholder ως ολόκληρο όνομα φακέλου, όπως `\{\{locale\}\}/about.md`, ή ανάμεσα στο όνομα αρχείου και την επέκταση, όπως `about.\{\{locale\}\}.md`. Για να τη διατηρήσετε, ορίστε την επιλογή σε `false` στην επιλογή `i18n` του αρχείου.
    # Don’t localize `i18n`
    i18n_not_configured: Η επιλογή `i18n` είναι ενεργοποιημένη, αλλά η διεθνοποίηση δεν έχει ρυθμιστεί στο ανώτερο επίπεδο των ρυθμίσεων ή στη συλλογή, επομένως η επιλογή δεν έχει κανένα αποτέλεσμα.
    # Don’t localize `public_folder` and `media_folder`
    empty_public_folder: Η επιλογή `public_folder` είναι κενό string, επομένως για τις διαδρομές πόρων που αποθηκεύονται στις καταχωρίσεις χρησιμοποιείται αντ’ αυτού η διαδρομή `media_folder`. Αφαιρέστε την επιλογή ή ορίστε τη στη διαδρομή που θέλετε να χρησιμοποιήσετε, όπως `/images`.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: Η επιλογή `{$option}` δεν ορίζεται στο σχήμα ρυθμίσεων του Sveltia CMS και θα αγνοηθεί. Ελέγξτε για τυπογραφικό ή συντακτικό λάθος.
    # Don’t localize `default_localized`, `default` and `i18n`
    default_localized_without_i18n: Η επιλογή `default_localized` δεν έχει κανένα αποτέλεσμα, επειδή η διεθνοποίηση δεν είναι ενεργοποιημένη για τη συλλογή. Χρησιμοποιήστε αντ’ αυτού την επιλογή `default`.
    # {$locale} is a locale code from the configuration; Don’t localize `default_localized`
    default_localized_unknown_locale: Η επιλογή `default_localized` έχει τιμή για το `{$locale}`, το οποίο δεν είναι μία από τις γλώσσες της συλλογής, επομένως η τιμή δεν χρησιμοποιείται ποτέ.

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Δείτε τις σημειώσεις συμβατότητας για λεπτομέρειες: {$link}'

  # Console tip shown after config load
  schema_tip: Για καλύτερη εμπειρία ανάπτυξης (Dx), μπορείτε να επικυρώσετε το αρχείο ρυθμίσεών σας έναντι του JSON σχήματος του Sveltia CMS. Δείτε το {$link} για λεπτομέρειες.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Τοπικό
  # Browser compatibility warnings
  unsupported_browser: Το Local Workflow δεν υποστηρίζεται από το φυλλομετρητή σας. Παρακαλούμε χρησιμοποιήστε Chrome ή Edge.
  disabled: Το Local Workflow είναι απενεργοποιημένο στον φυλλομετρητή σας. <a>Δείτε πώς να το ενεργοποιήσετε</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Τώρα βλέπετε τον πίνακα της ροής εργασίας σύνταξης. Προσχέδια: {$draft}. Σε αξιολόγηση: {$review}. Έτοιμα: {$ready}. Σε αναμονή διαγραφής: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Τώρα βλέπετε τον πίνακα της ροής εργασίας σύνταξης. Προσχέδια: {$draft}. Σε αξιολόγηση: {$review}. Σε αναμονή διαγραφής: {$deletion}.'
# Same as above, when the In Review stage is left out with the `stages` publish mode option
viewing_editorial_workflow_without_review: 'Τώρα βλέπετε τον πίνακα της ροής εργασίας σύνταξης. Προσχέδια: {$draft}. Έτοιμα: {$ready}. Σε αναμονή διαγραφής: {$deletion}.'
# Same as above, when all the content uses Preview Workflow, which has no review stages, so the
# page only lists the drafts
viewing_preview_workflow: 'Τώρα βλέπετε τη σελίδα Προσχεδίων. Προσχέδια: {$draft}. Σε αναμονή διαγραφής: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Προσχέδιο
  drafts: Προσχέδια
  in_review: Σε αξιολόγηση
  ready: Έτοιμο
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Σε αναμονή διαγραφής
  # Merged changes the site hasn’t caught up with yet: it’s being rebuilt and deployed from the
  # merge, so a published entry isn’t live and a deleted one is still up. Heading of the tray below
  # the board that lists them until the site has caught up
  deploying: Σε ανάπτυξη

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Ακύρωση διαγραφής
  confirm_cancelling_deletion: Είστε βέβαιοι ότι θέλετε να ακυρώσετε αυτή τη διαγραφή; Η καταχώριση θα παραμείνει δημοσιευμένη.
  confirm_completing_deletion: Είστε βέβαιοι ότι θέλετε να διαγράψετε αυτή την καταχώριση; Θα αφαιρεθεί αμέσως.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ Η καταχώριση επισημάνθηκε για διαγραφή. }}
      *   {{ {$count} καταχωρίσεις επισημάνθηκαν για διαγραφή. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Οι αλλαγές απορρίφθηκαν. }}
      *   {{ Οι αλλαγές σε {$count} καταχωρίσεις απορρίφθηκαν. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Ακύρωση διαγραφής…
  deletion_cancelled: Η διαγραφή ακυρώθηκε.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: Δεν ήταν δυνατή η ακύρωση της διαγραφής. Παρακαλούμε δοκιμάστε ξανά.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Μη δημοσιευμένες καταχωρίσεις
  published_entries: Δημοσιευμένες καταχωρίσεις
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Κατάσταση: {$status}'
  change_entry_status: Αλλαγή κατάστασης καταχώρισης
  # Editor toolbar: progress label while the status is being changed
  changing_status: Αλλαγή κατάστασης…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Ενημέρωση κατάστασης…
  status_updated: Η κατάσταση ενημερώθηκε.
  # Error notification when the status could not be changed
  status_change_failed: Δεν ήταν δυνατή η αλλαγή της κατάστασης. Παρακαλούμε δοκιμάστε ξανά.
  # Workflow page: toolbar button that reads the pull requests again, to pick up the changes made
  # by anyone else since the board was loaded, and the toast notifications shown while doing so and
  # once done
  refresh: Ανανέωση
  refreshing: Ανανέωση…
  refreshed: Ο πίνακας είναι ενημερωμένος.
  # Error notification when the board could not be refreshed
  refresh_failed: Δεν ήταν δυνατή η ανανέωση του πίνακα. Παρακαλούμε δοκιμάστε ξανά.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: Η καταχώριση περιέχει σφάλματα. Παρακαλούμε διορθώστε τα πριν αλλάξετε την κατάσταση.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: Η καταχώριση περιέχει σφάλματα. Παρακαλούμε διορθώστε τα πριν τη δημοσιεύσετε.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Αποστολή για αξιολόγηση
  confirm_sending_for_review: Οι αλλαγές σας αποθηκεύτηκαν ως προσχέδιο. Θέλετε να στείλετε την καταχώριση για αξιολόγηση, ώστε κάποιος να τη δει και να τη δημοσιεύσει;
  # Same as above, when the In Review stage is left out with the `stages` publish mode option, so
  # the next step is to mark the entry as ready to be published
  mark_as_ready: Σήμανση ως έτοιμο
  confirm_marking_as_ready: Οι αλλαγές σας αποθηκεύτηκαν ως προσχέδιο. Θέλετε να επισημάνετε την καταχώριση ως έτοιμη, ώστε να μπορεί να δημοσιευτεί;
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Δημοσίευση καταχώρισης
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Απόρριψη αλλαγών
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: Είστε βέβαιοι ότι θέλετε να διαγράψετε αυτή την καταχώριση; Δεν θα αφαιρεθεί μέχρι να δημοσιευτεί η διαγραφή. Μέχρι τότε θα τη βρίσκετε στη λίστα καταχωρίσεων, επισημασμένη ως “Σε αναμονή διαγραφής”.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Αυτή η καταχώριση δεν έχει δημοσιευτεί ακόμη, επομένως η διαγραφή της θα την απορρίψει εντελώς.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Αυτή η καταχώριση έχει μη δημοσιευμένες αλλαγές. Η απόρριψή τους θα επαναφέρει τη δημοσιευμένη έκδοση. Η ίδια η καταχώριση δεν θα διαγραφεί.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Δεν έχει δημοσιευτεί ακόμη, επομένως οι μη δημοσιευμένες αλλαγές σας θα απορριφθούν. Τυχόν δημοσιευμένη έκδοση θα παραμείνει δημοσιευμένη. }}
      *   {{ Δεν έχουν δημοσιευτεί ακόμη, επομένως οι μη δημοσιευμένες αλλαγές σας θα απορριφθούν. Τυχόν δημοσιευμένες εκδόσεις θα παραμείνουν δημοσιευμένες. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ Μία από αυτές δεν έχει δημοσιευτεί ακόμη, επομένως οι μη δημοσιευμένες αλλαγές σας θα απορριφθούν. Τυχόν δημοσιευμένη έκδοση θα παραμείνει δημοσιευμένη. }}
      *   {{ {$count} από αυτές δεν έχουν δημοσιευτεί ακόμη, επομένως οι μη δημοσιευμένες αλλαγές σας θα απορριφθούν. Τυχόν δημοσιευμένες εκδόσεις θα παραμείνουν δημοσιευμένες. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry_after_build: Είστε βέβαιοι ότι θέλετε να δημοσιεύσετε αυτή την καταχώριση; Οι αλλαγές σας θα εμφανιστούν στον ιστότοπο μόλις ολοκληρωθεί η εκ νέου δημιουργία του.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Δημοσίευση καταχώρισης…
  entry_published: Η καταχώριση δημοσιεύτηκε.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Διαγραφή καταχώρισης…
  discarding_changes: Απόρριψη αλλαγών…
  entry_deleted: Η καταχώριση διαγράφηκε.
  # Error notification when publishing fails
  publishing_entry_failed: Δεν ήταν δυνατή η δημοσίευση της καταχώρισης. Παρακαλούμε δοκιμάστε ξανά.
  # Error notification when an entry can’t be published from the CMS, because its request also
  # changes files that aren’t part of the entry and that the CMS doesn’t show, goes somewhere other
  # than the site’s branch, or is too large to check. Keep the wording free of Git jargon
  publish_refused_other_changes: Αυτή η καταχώριση δεν μπορεί να δημοσιευτεί εδώ, επειδή συνοδεύεται από άλλες αλλαγές που το CMS δεν μπορεί να σας δείξει. Ζητήστε από έναν προγραμματιστή να την ελέγξει.
  # Error notification when an entry can’t be published because its branch has been committed to
  # since the entry was opened, so what would be published isn’t what was reviewed
  publish_refused_entry_changed: Η καταχώριση άλλαξε αφού την ανοίξατε. Επαναφορτώστε τη σελίδα για να ελέγξετε την πιο πρόσφατη έκδοση πριν τη δημοσιεύσετε.
  review_on_x: Αξιολόγηση στο {$service}
  from_fork: Από fork
  fork_entry_editable: Αυτή η καταχώριση προέρχεται από pull request ενός συνεισφέροντα που άνοιξε από το “{$fork}”. Οι αλλαγές σας αποθηκεύονται στον κλάδο του. Ελέγξτε και κάντε merge το pull request στην υπηρεσία Git.
  fork_entry_locked: Αυτή η καταχώριση προέρχεται από pull request ενός συνεισφέροντα που άνοιξε από το “{$fork}”. Ο συνεισφέρων δεν επιτρέπει στους συντηρητές να το επεξεργαστούν, επομένως εδώ μπορεί μόνο να προβληθεί.
  fork_not_editable: Ο συνεισφέρων δεν επιτρέπει στους συντηρητές να επεξεργαστούν αυτό το pull request.
  fork_entry_gone: Το pull request του συνεισφέροντα δεν είναι πλέον ανοιχτό, επομένως οι αλλαγές δεν μπορούν να αποθηκευτούν σε αυτό.
  # Error shown in the save error dialog when an entry can’t be saved for review, because a request
  # the CMS doesn’t show is already open from the branch the entry would be saved to. `{$number}` is
  # the request number, e.g. `#12` on GitHub or `!12` on GitLab. Keep the wording free of Git jargon
  branch_in_use: Ένα άλλο αίτημα ({$number}) είναι ήδη ανοιχτό για αυτή την καταχώριση εκτός του CMS. Ζητήστε από έναν προγραμματιστή να το κλείσει πρώτα.
  # Workflow page: empty column message
  no_entries: Δεν υπάρχουν καταχωρίσεις.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Σύρετε για να αλλάξετε την κατάσταση
  # Workflow page: note on a card in the Deploying tray, marking an entry that’s being removed from
  # the site rather than published to it
  deploying_deletion: Διαγραφή
  # Workflow page: note on a card listing the new entries that were created from a Relation field
  # of the entry and are published along with it, e.g. “Also adds Section: Getting Started”
  companion_entries: 'Προσθέτει επίσης: {$entries}'
  # Workflow page: note on a card listing the existing entries that were edited from a Relation
  # field of the entry and are published along with it, e.g. “Also changes Author: Ada Lovelace”
  edited_companion_entries: 'Αλλάζει επίσης: {$entries}'
  # Workflow page: one of the entries listed by `companion_entries` or `edited_companion_entries`,
  # named by its collection’s singular label and its title
  companion_entry: '{$collection}: {$title}'

# Dialog asking the user for a commit message every time changes are saved, when the site is
# configured to. The message is recorded in the repository’s history along with the changes
commit_message:
  # Dialog title
  title: Μήνυμα commit
  # Description when the user writes the whole message, which the text box is filled in with
  description_replace: Περιγράψτε τις αλλαγές σας. Το μήνυμα καταγράφεται στο ιστορικό μαζί με αυτές.
  # Description when the text the user enters is added before or after a message the CMS writes
  description_addition: Προσθέστε μια σημείωση στο μήνυμα που καταγράφεται στο ιστορικό μαζί με τις αλλαγές σας, όπως έναν αριθμό ζητήματος. Μπορεί να μείνει κενό.
  # Accessible name of the text box when the user writes the whole message
  message: Μήνυμα commit
  # Accessible name of the text box when the text is added before or after the message
  addition: Σημείωση
  # Preview of the message as it will be recorded. {$message} is the message
  preview: 'Μήνυμα: {$message}'

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Fork του repository
  fork: Fork
  confirm_forking_repository: Για να προτείνετε αλλαγές στο “{$repo}”, πρέπει να δημιουργηθεί ένα fork του repository στον λογαριασμό σας. Οι αλλαγές σας αποθηκεύονται σε αυτό το fork και ένας συντηρητής τις ελέγχει πριν δημοσιευτούν.
  # Error shown when the user declined the dialog above
  fork_declined: Χρειάζεστε ένα fork του repository στον λογαριασμό σας για να προτείνετε αλλαγές.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: Δεν ήταν δυνατή η δημιουργία fork του repository “{$repo}” στον λογαριασμό σας.
  # Error shown when the user’s fork doesn’t have the branch the CMS is configured with, so there’s
  # nothing to start their changes from. {$fork} and {$repo} are repository identifiers in
  # owner/repo format, {$branch} is the branch name
  fork_branch_missing: Το fork σας “{$fork}” δεν έχει τον κλάδο “{$branch}”. Ενημερώστε το fork από το repository “{$repo}” και, στη συνέχεια, συνδεθείτε ξανά.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: Δεν ήταν δυνατός ο έλεγχος της πρόσβασής σας στο repository “{$repo}”. Παρακαλούμε δοκιμάστε ξανά σε λίγο.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: Το repository “{$repo}” δεν επιτρέπει fork. Ζητήστε από έναν συντηρητή να ενεργοποιήσει τη δυνατότητα fork για αυτό.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Έχετε μια εκκρεμή πρόσκληση για το repository “{$repo}”. Αποδεχτείτε την στο GitHub και μετά συνδεθείτε ξανά.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Η σύνδεσή σας δεν περιλαμβάνει πρόσβαση σε ιδιωτικά repository, επομένως το repository “{$repo}” δεν μπορεί να διαβαστεί. Ζητήστε από έναν συντηρητή να ελέγξει τις ρυθμίσεις ταυτοποίησης του CMS.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Μόνο ένας συντηρητής μπορεί να δημοσιεύσει αλλαγές σε αυτόν τον ιστότοπο. Αντ’ αυτού, επισημάνετε την καταχώρισή σας ως “Σε αξιολόγηση” και κάποιος θα τη δει.
  # Error shown when a contributor changes the status of an entry whose request a maintainer has
  # published since the page was loaded, leaving nothing to review. The entry then leaves the
  # Editorial Workflow board and the editor closes. Keep the wording free of Git jargon
  entry_already_published: Ένας συντηρητής έχει ήδη δημοσιεύσει αυτή την καταχώριση, επομένως δεν απομένει τίποτα για αξιολόγηση.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Αυτή η αλλαγή δεν μπορεί να γίνει απευθείας. Μόνο επεξεργασμένες καταχωρίσεις μπορούν να προταθούν για αξιολόγηση.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Οι αλλαγές σας αποθηκεύονται στο fork αυτού του repository στο “{$repo}” και ελέγχονται πριν δημοσιευτούν.
  view_fork: Προβολή fork

