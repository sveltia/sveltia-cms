    # {$valueType} is the configured value type; Don’t localize `value` and `value_type`
    compute_field_uuid_in_expression: Η επιλογή `value` του πεδίου Compute δεν μπορεί να χρησιμοποιεί ετικέτα UUID όπως `\{\{uuid\}\}`, επειδή η επιλογή `value_type` είναι `{$valueType}`, κάτι που την καθιστά αριθμητική παράσταση.
