# Cloud Storage Services
# ==============================================================================
# Strings for external cloud storage service integrations.

cloud_storage:
  # Configuration error
  invalid: Η υπηρεσία δεν έχει ρυθμιστεί σωστά.

  # Authentication states
  auth:
    api_key:
      key_label: Κλειδί API
      # {$key} is the credential label, e.g., API Key, and {$service} is the cloud service name
      initial: Εισαγάγετε το {$key} για το {$service}.
      requested: Επικύρωση…
      # {$key} is the credential label the user entered, e.g., API Key
      error: Το {$key} που παρείχατε δεν είναι έγκυρο. Παρακαλούμε ελέγξτε το και δοκιμάστε ξανά.
    password:
      # {$service} is the cloud service name
      initial: Εισαγάγετε τον κωδικό πρόσβασής σας για το {$service}.
      requested: Σύνδεση…
      error: Το όνομα χρήστη ή ο κωδικός πρόσβασης είναι λανθασμένα. Παρακαλούμε ελέγξτε τα και δοκιμάστε ξανά.

  # Shared by the S3-compatible services, unless overridden below
  s3:
    auth_key_label: Secret Access Key

  # Service-specific configurations
  cloudinary:
    iframe_title: Βιβλιοθήκη μέσων Cloudinary
    activate:
      button_label: Ενεργοποίηση Cloudinary
      description: Αφού συνδεθείτε, κάντε πάλι κλικ στο κουμπί Σύνδεση για να συνεχίσετε.
    auth_key_label: API Secret
    open_library: Άνοιγμα Cloudinary

  uploadcare:
    auth_key_label: API Secret Key

  azure_blob_storage:
    auth_key_label: SAS token

  backblaze_b2:
    auth_key_label: Κλειδί εφαρμογής

  bunny_storage:
    auth_key_label: Κωδικός πρόσβασης Storage Zone

# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Υπάρχει ένα σφάλμα στις ρυθμίσεις του CMS. Παρακαλούμε λύστε το πρόβλημα και δοκιμάστε ξανά. }}
      *   {{ Υπάρχουν σφάλματα στις ρυθμίσεις του CMS. Παρακαλούμε λύστε τα προβλήματα και δοκιμάστε ξανά. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: Συλλογή {$collection}
    file: Αρχείο {$file}
    component: '{$component} component'
    # Don’t localize `{$field}`
    field: Πεδίο `{$field}`

  # Configuration error messages
  error:
    no_secure_context: Το Sveltia CMS λειτουργεί μόνο με HTTPS ή localhost URLs.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ Το URL του αρχείου ρυθμίσεων πρέπει να χρησιμοποιεί το πρωτόκολλο HTTPS ή μια διεύθυνση localhost. }}
        *   {{ Τα URLs των αρχείων ρυθμίσεων πρέπει να χρησιμοποιούν το πρωτόκολλο HTTPS ή διευθύνσεις localhost. }}
    fetch_failed: Δεν ήταν δυνατή η ανάκτηση του αρχείου ρυθμίσεων.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: Η απόκριση HTTP επέστρεψε με κατάσταση {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'Δεν ήταν δυνατή η ανάκτηση του αρχείου ρυθμίσεων. Για να αποτρέψετε τη φόρτωση του αρχείου `config.yml`, προσθέστε <a>`load_config_file: false`</a> στο αντικείμενο ρυθμίσεων που μεταβιβάζεται στο `CMS.init()`.'
    parse_failed: Αδυναμία ανάλυσης του αρχείου ρυθμίσεων.
    parse_failed_invalid_object: Το αρχείο ρυθμίσεων δεν είναι έγκυρο αντικείμενο JavaScript.
    parse_failed_unsupported_type: Το αρχείο ρυθμίσεων δεν είναι υποστηριζόμενος τύπος αρχείου. Υποστηρίζονται μόνο YAML, TOML και JSON.
    no_collection: Δεν έχουν οριστεί συλλογές.
    # Don’t localize `hide`
    no_visible_collection: Τουλάχιστον μία συλλογή πρέπει να είναι ορατή. Ελέγξτε την επιλογή `hide`.
    missing_backend: Το backend δεν έχει οριστεί.
    missing_backend_name: Το όνομα του backend δεν έχει οριστεί.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Το backend {$name} <a>δεν υποστηρίζεται</a> στο Sveltia CMS.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Το παρωχημένο backend {$name} <a>δεν υποστηρίζεται</a> στο Sveltia CMS.
    unsupported_custom_backend: Προσαρμοσμένα backends <a>δεν υποστηρίζονται</a> στο Sveltia CMS.
    unsupported_backend_suggestion: Χρησιμοποιήστε ένα από τα <a>υποστηριζόμενα backends</a> αντ’ αυτού.
    missing_repository: Το repository δεν έχει οριστεί.
    invalid_repository: Το ρυθμισμένο repository είναι άκυρο. Πρέπει να είναι σε μορφή «owner/repo».
    # Don’t localize `api_root`
    missing_api_root: Η επιλογή `api_root` δεν έχει οριστεί. Είναι υποχρεωτική για το backend Forgejo.
    invalid_root_dir: Ο αρχικός κατάλογος δεν είναι έγκυρος. Πρέπει να είναι μια διαδρομή μέσα στο repository, χωρίς “..”.
    invalid_root_dir_branch: Ο αρχικός κατάλογος δεν μπορεί να χρησιμοποιηθεί στα ονόματα κλάδων των λειτουργιών δημοσίευσης `editorial_workflow` και `preview`. Κανένα τμήμα της διαδρομής του δεν μπορεί να ξεκινά με τελεία, να τελειώνει σε “.lock” ή να περιέχει κενό διάστημα ή ειδικό χαρακτήρα, όπως άνω και κάτω τελεία ή αστερίσκο.
    path_outside_root_dir: Η διαδρομή “{$path}” οδηγεί έξω από τον αρχικό κατάλογο, όπου το CMS δεν μπορεί να εμφανίσει αρχεία.
    oauth_implicit_flow: Η ρυθμισμένη μέθοδος ταυτοποίησης (implicit flow) δεν υποστηρίζεται στο Sveltia CMS. Χρησιμοποιήστε μια διαφορετική <a>μέθοδο ταυτοποίησης</a>.
    github_pkce_unsupported: Η εξουσιοδότηση PKCE δεν υποστηρίζεται ακόμη λόγω των περιορισμών του GitHub. Χρησιμοποιήστε μια διαφορετική <a>μέθοδο ταυτοποίησης</a>.
    additions_no_base_url: Η επιλογή `base_url` πρέπει να είναι το URL της υπηρεσίας Sveltia CMS Additions.
    oauth_no_app_id: Το OAuth application ID δεν έχει οριστεί.
    # Don’t localize `open_authoring`, `editorial_workflow` and `preview`
    open_authoring_no_workflow: Η επιλογή `open_authoring` απαιτεί τη λειτουργία δημοσίευσης `editorial_workflow` ή `preview`. Δείτε την <a>τεκμηρίωση</a> για λεπτομέρειες.
    # Don’t localize `auth_methods`
    no_auth_methods: Η επιλογή `auth_methods` πρέπει να περιέχει τουλάχιστον μία μέθοδο.
    # Don’t localize `auth_scope`, `repo` and `public_repo`
    auth_scope_no_repo: Η επιλογή `auth_scope` πρέπει να περιλαμβάνει το `repo` ή το `public_repo`.
    missing_media_folder: Ο φάκελος μέσων δεν έχει οριστεί.
    public_folder_relative_path: Ο ρυθμισμένος δημόσιος φάκελος είναι άκυρος. Πρέπει να είναι μια απόλυτη διαδρομή που ξεκινά με «/».
    public_folder_absolute_url: Δεν υποστηρίζεται absolute URL για την επιλογή του δημόσιου φακέλου στο Sveltia CMS.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    unsupported_folder_template_tag: Η επιλογή `{$option}` περιέχει την ετικέτα προτύπου `{$tag}`, η οποία δεν υποστηρίζεται εκεί. Μπορούν να χρησιμοποιηθούν μόνο οι ετικέτες προτύπου του slug, όπως `\{\{slug\}\}` και `\{\{year\}\}`, καθώς και οι ετικέτες `\{\{dirname\}\}`, `\{\{filename\}\}`, `\{\{extension\}\}`, `\{\{media_folder\}\}` και `\{\{public_folder\}\}`.
    # {$option} is `media_folder` or `public_folder` and {$tag} is the template tag from the configuration; Don’t localize the template tags. The curly brackets are escaped with backslashes for MessageFormat 2
    global_folder_template_tag: Η επιλογή `{$option}` περιέχει την ετικέτα προτύπου `{$tag}`, η οποία μπορεί να χρησιμοποιηθεί μόνο στην επιλογή μιας συλλογής, ενός αρχείου συλλογής ή ενός πεδίου, όπου υπάρχει καταχώριση από την οποία να συμπληρωθεί.
    # {$replacement} is the configured replacement string; Don’t localize `sanitize_replacement`
    invalid_sanitize_replacement: Η επιλογή `sanitize_replacement` έχει οριστεί σε `{$replacement}`, αλλά περιέχει χαρακτήρα που δεν μπορεί να χρησιμοποιηθεί σε slug, επομένως δεν μπορεί να αντικαταστήσει έναν τέτοιο χαρακτήρα.
    # {$option} is the option name (`site_url` or `display_url`) and {$url} is the configured value
    invalid_url_option: Η επιλογή `{$option}` έχει οριστεί σε `{$url}`, αλλά πρέπει να είναι απόλυτο URL που ξεκινά με `https://` ή `http://`.
    # Don’t localize `publish_mode`, `stages`, `draft`, `pending_review` and `pending_publish`
    invalid_publish_mode_stages: Η επιλογή `stages` του `publish_mode` πρέπει να ξεκινά με `draft` και να παραθέτει τα στάδια με τη σειρά `draft`, `pending_review`, `pending_publish`, χωρίς επαναλήψεις.
    # Don’t localize `i18n` and `locales`
    i18n_no_locales: Η επιλογή `i18n.locales` πρέπει να περιέχει τουλάχιστον μία γλώσσα.
    # {$locale} is the locale code from the configuration; Don’t localize `default_locale` and `locales`
    i18n_invalid_default_locale: Η επιλογή `default_locale` έχει οριστεί σε `{$locale}`, αλλά αυτή δεν περιλαμβάνεται στα `locales`.
    # {$locale} is the locale code from the configuration; Don’t localize `initial_locales` and `locales`
    i18n_invalid_initial_locale: Η επιλογή `initial_locales` περιέχει το `{$locale}`, αλλά αυτό δεν περιλαμβάνεται στα `locales`.
    # Don’t localize `i18n`
    i18n_no_collections: 'Η επιλογή `i18n` έχει ρυθμιστεί στο ανώτερο επίπεδο, αλλά καμία από τις συλλογές ή τα singletons δεν έχει την επιλογή `i18n`, επομένως κανένα περιεχόμενο δεν μπορεί να μεταφραστεί. Προσθέστε `i18n: true` στις συλλογές και στα singletons που θέλετε να μεταφράσετε.'
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: Η επιλογή `transformations` περιέχει ένα μη υποστηριζόμενο κλειδί `{$key}`. Πρέπει να είναι `raster_image`, `svg` ή μια υποστηριζόμενη μορφή εικόνας raster.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: Η επιλογή `quality` για τον μετασχηματισμό `{$key}` δεν είναι έγκυρη. Πρέπει να είναι ακέραιος αριθμός μεταξύ 0 και 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: Η επιλογή `{$prop}` για τον μετασχηματισμό `{$key}` δεν είναι έγκυρη. Πρέπει να είναι θετικός ακέραιος αριθμός.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: Η συλλογή πόρων {$count} πρέπει να έχει την επιλογή `name` ορισμένη ως μη κενό string.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: Το όνομα της συλλογής πόρων `{$name}` είναι άκυρο. Δεν πρέπει να περιέχει ειδικούς χαρακτήρες.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Τα ονόματα των συλλογών πόρων πρέπει να είναι μοναδικά, αλλά το `{$name}` χρησιμοποιείται περισσότερες από μία φορές.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_no_options: Η συλλογή πρέπει να έχει ορισμένη μία από τις επιλογές `folder`, `file`, `files` ή `divider`.
    # Don’t localize `folder`, `file`, `files`, and `divider`
    invalid_collection_multiple_options: Η συλλογή δεν μπορεί να έχει περισσότερες από μία από τις επιλογές `folder`, `file`, `files` και `divider`.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: Η επέκταση `{$extension}` δεν ταιριάζει με τη μορφή `{$format}`.
    # {$name} is the field name from the configuration and {$widget} is its field type
    front_matter_body_field_not_text: Το πεδίο `{$name}` αποθηκεύεται ως σώμα κάτω από το front matter, το οποίο μπορεί να περιέχει μόνο κείμενο, όχι αριθμό, boolean, λίστα ή αντικείμενο όπως ένα πεδίο `{$widget}`. Χρησιμοποιήστε τύπο πεδίου που περιέχει κείμενο ή μετονομάστε το πεδίο.
    # {$file} is the file path from the configuration; Don’t localize `file` and `locale`. The curly
    # brackets are escaped with backslashes for MessageFormat 2
    invalid_collection_data_file: Η επιλογή `file` `{$file}` δεν είναι έγκυρη. Πρέπει να είναι η διαδρομή προς ένα αρχείο JSON, χωρίς το placeholder `\{\{locale\}\}`.
    # {$prop} is the option name; Don’t localize `file`
    unsupported_collection_data_file_option: Η επιλογή `{$prop}` δεν υποστηρίζεται σε συλλογή με την επιλογή `file`.
    # Don’t localize `file`, `publish_mode` and `simple`
    collection_data_file_workflow: Η ροή εργασίας σύνταξης και η ροή εργασίας προεπισκόπησης, συμπεριλαμβανομένης της ανοιχτής συγγραφής, δεν υποστηρίζονται σε συλλογή με την επιλογή `file`. Ορίστε την επιλογή `publish_mode` της συλλογής σε `simple`.
    # {$prop} is the option name; Don’t localize `file` and `slug`. The curly brackets are escaped
    # with backslashes for MessageFormat 2
    collection_data_file_slug_tag: Η επιλογή `{$prop}` δεν μπορεί να περιέχει την ετικέτα `\{\{slug\}\}` σε συλλογή με την επιλογή `file`, καθώς το slug μιας καταχώρισης είναι η θέση της, η οποία αλλάζει όταν οι καταχωρίσεις αναδιατάσσονται ή διαγράφονται. Χρησιμοποιήστε αντ’ αυτού ένα πεδίο με μοναδική τιμή.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: Το πρότυπο slug `{$slug}` είναι άκυρο καθώς δεν μπορεί να περιέχει καθέτους (/). Για την οργάνωση καταχωρίσεων σε υποφακέλους, χρησιμοποιήστε την επιλογή `path` αντί για το `slug`.
    # {$name} is the field name from the configuration; Don’t localize `identifier_field`
    invalid_identifier_field: Η επιλογή `identifier_field` αναφέρεται στο `{$name}`, αλλά δεν έχει οριστεί τέτοιο πεδίο στη συλλογή.
    # {$name} is the field name from the configuration; Don’t localize `filter`
    invalid_filter_field: Η επιλογή `filter` αναφέρεται στο `{$name}`, αλλά δεν έχει οριστεί τέτοιο πεδίο στη συλλογή.
    # Don’t localize `filter`, `value` and `pattern`
    invalid_filter_no_condition: Η επιλογή `filter` πρέπει να έχει την επιλογή `value` ή `pattern` για την αντιστοίχιση καταχωρίσεων.
    # {$option} is an option name such as `slug` or `summary` and {$name} is the field name or template tag from the configuration
    option_field_not_found: Η επιλογή `{$option}` αναφέρεται στο `{$name}`, αλλά δεν έχει οριστεί τέτοιο πεδίο.
    # {$name} is the field name from the configuration and {$widget} is its field type; Don’t localize `thumbnail`
    thumbnail_field_not_media: Η επιλογή `thumbnail` αναφέρεται στο `{$name}`, αλλά πρέπει να είναι πεδίο Image ή File, όχι πεδίο `{$widget}`.
    # Don’t localize `inline` or `multiple`
    invalid_inline_component_fields: Η λειτουργία `inline` απαιτεί ένα μόνο πεδίο Boolean, Color, DateTime, Number, Relation, Select ή String. Ένα πεδίο Relation ή Select δεν μπορεί να έχει ενεργοποιημένη την επιλογή `multiple`.
    # {$option} is an option name such as `pattern` or `filter` and {$pattern} is the configured pattern
    invalid_regex: Η επιλογή `{$option}` περιέχει μη έγκυρη κανονική έκφραση `{$pattern}`, η οποία αγνοείται.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: Η επιλογή `reorder` αναφέρεται σε μια ομάδα προβολής με όνομα `{$name}`, αλλά δεν έχει οριστεί τέτοια ομάδα στην επιλογή `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit` and `fields`
    invalid_bulk_edit_field: Η λίστα `fields` της επιλογής `bulk_edit` αναφέρεται σε πεδίο με όνομα `{$name}`, αλλά δεν έχει οριστεί τέτοιο πεδίο ανώτερου επιπέδου στη συλλογή.
    # {$name} is the field name from the configuration; Don’t localize `bulk_edit`, `fields` and `multiple`
    unsupported_bulk_edit_field: Το πεδίο `{$name}` στη λίστα `fields` της επιλογής `bulk_edit` δεν μπορεί να επεξεργαστεί μαζικά. Υποστηρίζεται μόνο πεδίο Boolean, Color, DateTime, Number, Relation, Select ή String που δεν είναι μόνο για ανάγνωση, δεν έχει ενεργοποιημένη την επιλογή `multiple` και δεν ορίζεται αυτόματα κατά την αποθήκευση.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: Η επιλογή `sortable_fields` αναφέρεται σε ένα πεδίο με όνομα `{$name}`, αλλά δεν έχει οριστεί τέτοιο πεδίο στη συλλογή.
    # Don’t localize `sortable_fields` and `default_sort`
    multiple_sortable_field_defaults: Μόνο ένα στοιχείο της επιλογής `sortable_fields` μπορεί να έχει την επιλογή `default_sort`.
    # {$option} is `table_columns` or `summary_fields`, and {$name} is the field name from the configuration
    invalid_table_column_field: Η επιλογή `{$option}` αναφέρεται σε πεδίο με όνομα `{$name}`, αλλά δεν έχει οριστεί τέτοιο πεδίο στη συλλογή.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: Η επιλογή `view_groups` αναφέρεται σε ένα πεδίο με όνομα `{$name}`, αλλά δεν έχει οριστεί τέτοιο πεδίο στη συλλογή.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: Η επιλογή `view_filters` αναφέρεται σε ένα πεδίο με όνομα `{$name}`, αλλά δεν έχει οριστεί τέτοιο πεδίο στη συλλογή.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: Η ομάδα προβολής {$count} πρέπει να έχει την επιλογή `name` ορισμένη ως μη κενό string.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: Το όνομα ομάδας προβολής `{$name}` δεν είναι έγκυρο. Δεν πρέπει να περιέχει ειδικούς χαρακτήρες.
    duplicate_view_group_name: Τα ονόματα των ομάδων προβολής πρέπει να είναι μοναδικά, αλλά το `{$name}` χρησιμοποιείται περισσότερες από μία φορές.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: Το φίλτρο προβολής {$count} πρέπει να έχει την επιλογή `name` ορισμένη ως μη κενό string.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `pattern`, `eq` and `gte`
    invalid_view_filter_no_condition: Το φίλτρο προβολής {$count} πρέπει να έχει την επιλογή `pattern` ή μια επιλογή σύγκρισης, όπως `eq` ή `gte`, για την αντιστοίχιση καταχωρίσεων.
    # {$name} is the invalid or duplicate view filter name
    invalid_view_filter_name: Το όνομα φίλτρου προβολής `{$name}` δεν είναι έγκυρο. Δεν πρέπει να περιέχει ειδικούς χαρακτήρες.
    duplicate_view_filter_name: Τα ονόματα των φίλτρων προβολής πρέπει να είναι μοναδικά, αλλά το `{$name}` χρησιμοποιείται περισσότερες από μία φορές.
    # {$name} is the default view group name from the configuration; Don’t localize `default` and `view_groups`
    invalid_view_group_default: Η επιλογή `default` του `view_groups` έχει οριστεί σε `{$name}`, αλλά καμία ομάδα προβολής δεν έχει αυτό το όνομα.
    # {$name} is the default view filter name from the configuration; Don’t localize `default` and `view_filters`
    invalid_view_filter_default: Η επιλογή `default` του `view_filters` έχει οριστεί σε `{$name}`, αλλά κανένα φίλτρο προβολής δεν έχει αυτό το όνομα.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: Η συλλογή {$count} πρέπει να έχει την επιλογή `name` ορισμένη ως μη κενό string.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: Το όνομα της συλλογής `{$name}` είναι άκυρο. Δεν πρέπει να περιέχει ειδικούς χαρακτήρες.
