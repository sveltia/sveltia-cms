  # Shown when the build failed, so no preview is available. The failure may lie in the site’s own
  # code rather than the entry, so the editor is told not to assume it’s theirs, and who to ask
  build_failed: Δεν ήταν δυνατή η δημιουργία της προεπισκόπησης. Αυτό δεν οφείλεται απαραίτητα στις αλλαγές σας. Αν το πρόβλημα παραμένει, επικοινωνήστε με τον διαχειριστή του ιστοτόπου σας.
