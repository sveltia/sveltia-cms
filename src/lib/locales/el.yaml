# ==============================================================================
# Common Actions
# ==============================================================================
# Generic action button labels used throughout the application. These are
# reusable strings for common operations like save, delete, cancel, etc.

# Primary actions: creation, selection, and file operations
create: Νέο
select: Επιλογή
select_all: Επιλογή όλων
upload: Μεταφόρτωση
copy: Αντιγραφή
download: Λήψη
duplicate: Δημιουργία αντιγράφου
delete: Διαγραφή
reorder: Αναδιάταξη

# Dialog and form actions: confirmation and cancellation
cancel: Άκυρο
done: Τέλος
save: Αποθήκευση
# Progress indicator shown on the save button while a save operation is in progress
saving: Αποθήκευση…

# Publishing actions: used when committing changes to the repository
publish: Δημοσίευση
# Progress indicator shown on the publish button during publishing
publishing: Δημοσίευση…

# Modification actions: editing and updating content
rename: Μετονομασία
update: Ενημέρωση
replace: Αντικατάσταση

# List and collection actions: adding and removing items
add: Προσθήκη
remove: Κατάργηση
clear: Εκκαθάριση

# Expansion and collapse actions: used for accordions, trees, and expandable sections
expand: Ανάπτυξη
expand_all: Ανάπτυξη όλων
collapse: Σύμπτυξη
collapse_all: Σύμπτυξη όλων

# Content manipulation: inserting, restoring, and discarding
insert: Εισαγωγή
restore: Επαναφορά
discard: Απόρριψη

# ==============================================================================
# Common UI Elements
# ==============================================================================
# Reusable labels and messages for common interface elements like status
# indicators, loading states, and toolbar regions.

# Status messages: search and results indicators
# Shown in ARIA live regions during search operations
searching: Αναζήτηση…
no_results: Δεν βρέθηκαν αποτελέσματα.

# Toolbar region labels: used as aria-labels for different toolbar areas
# These help screen readers identify which toolbar is being navigated
global: Γενικό
primary: Κύριο
secondary: Δευτερεύον
collection: Συλλογή
folder: Φάκελος

# ==============================================================================
# Miscellaneous Labels
# ==============================================================================
# Various labels used across the application for specific UI elements
# that don’t fit into other categories.

# Field and input labels
api_key: Κλειδί API
details: Λεπτομέρειες
back: Πίσω
# Loading indicator shown during async operations (asset preview, panels, etc.)
loading: Φόρτωση…
# Dismiss button for temporary notifications and infobars
later: Αργότερα

# Entry and collection labels
# Slug field heading in entry editors
slug: Slug
# Fallback labels for singleton collections when names aren’t configured
singleton: Singleton
singletons: Singletons

# Error messages
# Toast notification when clipboard operations fail
clipboard_error: Αδυναμία αντιγραφής στο πρόχειρο.

# ==============================================================================
# Sign-In Page
# ==============================================================================
# Strings specific to the authentication and sign-in page, including welcome
# messages, loading states, OAuth flows, and repository access options.

# Welcome and branding
# Screen reader announcement when the sign-in page loads
# {$name} is the app title shown on the sign-in screen, Sveltia CMS by default
welcome_message: 'Καλώς ήρθατε στο {$name}'
# Footer text with CMS branding
# {$name} is the CMS brand name shown in the footer, Sveltia CMS by default
powered_by: 'Με την υποστήριξη του {$name}'

# Shown during initial configuration and data loading
loading_cms_config: Φόρτωση ρυθμίσεων CMS…
loading_site_data: Φόρτωση δεδομένων ιστότοπου…
loading_site_data_error: Παρουσιάστηκε σφάλμα κατά τη φόρτωση των δεδομένων του ιστότοπου.

# OAuth and token authentication
# Primary sign-in button label for OAuth providers (GitHub, GitLab, etc.)
# {$service} is the sign-in provider label, such as GitHub or GitLab
sign_in_with_x: 'Σύνδεση με {$service}'

# Access token dialog: alternative authentication method
sign_in_using_access_token: Σύνδεση με χρήση token πρόσβασης
sign_in_using_access_token_description: Εισαγάγετε το token σας παρακάτω. Πρέπει να έχει πρόσβαση ανάγνωσης/γραφής στο περιεχόμενο του repository.
# Inline link text with embedded HTML anchor tag
# {$service} is the provider name whose user settings page contains the token generator, e.g., GitHub or GitLab
sign_in_using_access_token_link: Μπορείτε να δημιουργήσετε ένα token στη <a>σελίδα ρυθμίσεων χρήστη του {$service}</a>.
# Input field label for personal access token
personal_access_token: Προσωπικό token πρόσβασης

# Authentication progress indicators
authorizing: Εξουσιοδότηση…
signing_in: Σύνδεση…

# Local and test repository options
# Button label and description for working with a local Git repository
work_with_local_repo: Εργασία με τοπικό repository
# {$repo} is the configured repository name shown when it is available
work_with_local_repo_description: Όταν σας ζητηθεί, επιλέξτε τον αρχικό φάκελο του repository “{$repo}”.
work_with_local_repo_description_no_repo: Όταν σας ζητηθεί, επιλέξτε τον αρχικό φάκελο του Git repository σας.
# Button label for demo/test repository
work_with_test_repo: Εργασία με δοκιμαστικό repository

# Authentication errors
# Error messages shown during sign-in failures
sign_in_error:
  not_project_root: Ο επιλεγμένος φάκελος δεν είναι ο αρχικός φάκελος του repository. Παρακαλούμε δοκιμάστε ξανά.
  picker_dismissed: Δεν ήταν δυνατή η επιλογή του αρχικού φακέλου του repository. Παρακαλούμε δοκιμάστε ξανά.
  authentication_aborted: Η ταυτοποίηση ακυρώθηκε. Παρακαλούμε δοκιμάστε ξανά.
  invalid_token: Το token που παρείχατε δεν είναι έγκυρο. Παρακαλούμε ελέγξτε το και δοκιμάστε ξανά.
  # OAuth and authenticator errors (shown with error codes) — keys are defined in the Sveltia CMS Authenticator library
  UNSUPPORTED_BACKEND: Το Git σύστημα σας δεν υποστηρίζεται από την υπηρεσία ταυτοποίησης.
  UNSUPPORTED_DOMAIN: Το domain σας δεν επιτρέπεται να χρησιμοποιήσει την υπηρεσία ταυτοποίησης.
  MISCONFIGURED_CLIENT: Το client ID ή το secret της εφαρμογής OAuth δεν έχει ρυθμιστεί.
  AUTH_CODE_REQUEST_FAILED: Αποτυχία λήψης κώδικα εξουσιοδότησης. Παρακαλούμε δοκιμάστε αργότερα.
  CSRF_DETECTED: Ανιχνεύθηκε πιθανή επίθεση CSRF. Η ροή ταυτοποίησης διακόπηκε.
  TOKEN_REQUEST_FAILED: Αποτυχία αιτήματος token πρόσβασης. Παρακαλούμε δοκιμάστε αργότερα.
  TOKEN_REFRESH_FAILED: Αποτυχία ανανέωσης του token πρόσβασης. Παρακαλούμε δοκιμάστε αργότερα.
  MALFORMED_RESPONSE: Ο διακομιστής αποκρίθηκε με κακοσχηματισμένα δεδομένα. Παρακαλούμε δοκιμάστε αργότερα.

# Backend and repository validation errors
# Shown when the configured backend or repository is invalid or inaccessible
# {$name} is the backend display name like Forgejo and {$version} is the minimum supported version
backend_unsupported_version: 'Το backend {$name} απαιτεί την έκδοση {$name} {$version} ή μεταγενέστερη.'
# {$repo} is the repository identifier, typically in owner/repo format
repository_no_access: Δεν έχετε πρόσβαση στο repository “{$repo}”.
repository_not_found: Το repository “{$repo}” δεν υπάρχει.
repository_empty: Το repository “{$repo}” δεν έχει κλάδους (branches).
# {$repo} is the repository identifier, and {$branch} is the configured branch name
branch_not_found: Το repository “{$repo}” δεν διαθέτει τον κλάδο “{$branch}”.

# General errors
# Fallback error dialog title for unexpected errors
unexpected_error: Μη αναμενόμενο σφάλμα

# Entry file parsing errors
# Toast notification when entry files fail to parse on initial load
# {$count} is the number of entry files that failed to parse
entry_parse_errors: |
  .input {$count :integer}
  .match $count
    one {{ Παρουσιάστηκε σφάλμα κατά την ανάλυση ενός αρχείου καταχώρισης. Ελέγξτε την κονσόλα του φυλλομετρητή για λεπτομέρειες. }}
    *   {{ Παρουσιάστηκαν σφάλματα κατά την ανάλυση αρχείων καταχώρισης. Ελέγξτε την κονσόλα του φυλλομετρητή για λεπτομέρειες. }}

