    # {$key} is a property name of the default object, {$code} and {$lang} are the configured property names; Don’t localize `default` and `keys`
    code_field_invalid_default_key: Η επιλογή `default` του πεδίου Code έχει την ιδιότητα `{$key}`, αλλά η επιλογή `keys` επιτρέπει μόνο τα `{$code}` και `{$lang}`.
