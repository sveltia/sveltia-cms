  preparing: 'Προετοιμασία αρχείων: {$done} από {$total}'
  committing: 'Αποθήκευση στο GitHub: {$done} από περίπου {$total} commits'

# Entry save error dialog
saving_entry:
  error:
    title: Σφάλμα
    description: Παρουσιάστηκε σφάλμα κατά την αποθήκευση της καταχώρισης. Παρακαλούμε δοκιμάστε αργότερα.

# Dialog shown when saving the entry would overwrite a change someone else has made in the
# repository since the entry was opened in the editor
save_conflict:
  title: Η καταχώριση άλλαξε από κάποιον άλλο
  # `{$name}` is the other person’s name, `{$date}` when they made the change
  modified_by: Ο χρήστης {$name} άλλαξε αυτή την καταχώριση στις {$date}, αφού την ανοίξατε.
  # Shown instead of `modified_by` when the other person isn’t known
  modified: Αυτή η καταχώριση άλλαξε στο repository αφού την ανοίξατε.
  deleted: Αυτή η καταχώριση διαγράφηκε από το repository αφού την ανοίξατε.
  # Follows `modified_by` or `modified`
  overwrite_warning: Αν αποθηκεύσετε τώρα, οι αλλαγές του άλλου χρήστη θα χαθούν.
  # Follows `deleted`
  recreate_warning: Αν αποθηκεύσετε τώρα, η καταχώριση θα δημιουργηθεί ξανά.
  # Follows `modified_by`, `modified` or `deleted` for an entry stored in the same file as the other
  # entries of the collection, which can’t be saved over the change
  reload_warning: Επειδή η καταχώριση είναι αποθηκευμένη στο ίδιο αρχείο με άλλες καταχωρίσεις, δεν μπορεί να αποθηκευτεί πάνω από την αλλαγή. Ακυρώστε την επεξεργασία, ανοίξτε ξανά την καταχώριση από τη λίστα και κάντε τις αλλαγές σας.
  # OK button label
  save_anyway: Αποθήκευση ούτως ή άλλως
  # Error shown when the repository was updated between the check above and the commit itself
  branch_moved: Το repository ενημερώθηκε από κάποιον άλλο κατά την αποθήκευση. Παρακαλούμε δοκιμάστε ξανά.
  # Error shown when saving would change an item in a file storing all the entries of a collection,
  # which someone else has changed or moved since it was loaded
  array_item_changed: Μια καταχώριση αποθηκευμένη στο ίδιο αρχείο άλλαξε από κάποιον άλλο. Παρακαλούμε δοκιμάστε ξανά.
  # {$path} is the file path
  array_file_invalid: Το αρχείο {$path} δεν μπορεί να ενημερωθεί, καθώς δεν περιέχει έγκυρη λίστα καταχωρίσεων.

# Notice shown in the entry editor when someone else has changed or deleted the entry in the
# repository while the user has it open. The change itself is described with the `save_conflict`
