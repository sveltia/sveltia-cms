    relation_field_array_file_slug: Η σχέση με τη συλλογή `{$collection}` δεν μπορεί να αποθηκεύει την τιμή `\{\{slug\}\}`, καθώς το slug μιας καταχώρισης σε συλλογή με την επιλογή `file` είναι η θέση της, η οποία αλλάζει όταν οι καταχωρίσεις αναδιατάσσονται ή διαγράφονται. Ορίστε αντ’ αυτού την επιλογή `value_field` σε ένα πεδίο με μοναδική τιμή.
    # {$collection} is the referenced collection name; Don’t localize `file`
    relation_field_array_file_workflow: Μια συλλογή με την επιλογή `file` δεν μπορεί να έχει σχέση με τη συλλογή `{$collection}`, η οποία χρησιμοποιεί τη ροή εργασίας σύνταξης ή τη ροή εργασίας προεπισκόπησης, καθώς οι αναφορές σε μια καταχώριση που μετονομάζεται ή διαγράφεται εκεί δεν μπορούν να ενημερωθούν στο αρχείο.
