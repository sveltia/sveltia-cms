collection_list: Λίστα συλλογών
back_to_collection_list: Επιστροφή στη λίστα συλλογών
asset_folder_list: Λίστα φακέλων πόρων
back_to_asset_folder_list: Επιστροφή στη λίστα φακέλων πόρων

# ==============================================================================
# Search
# ==============================================================================
# Strings used in the search feature for finding entries and assets.

# Search page: headings and aria-labels
search_results: Αποτελέσματα αναζήτησης
# {$terms} is the current search query text
search_results_for_x: Αποτελέσματα αναζήτησης για “{$terms}”

# Search result announcements (ARIA live regions)
# Entry search results with counts
# {$terms} is the search query and {$count} is the number of matching entries
viewing_entry_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Τώρα βλέπετε αποτελέσματα αναζήτησης για “{$terms}”. Δεν βρέθηκαν καταχωρίσεις. }}
    one {{ Τώρα βλέπετε αποτελέσματα αναζήτησης για “{$terms}”. Βρέθηκε μία καταχώριση. }}
    *   {{ Τώρα βλέπετε αποτελέσματα αναζήτησης για “{$terms}”. Βρέθηκαν {$count} καταχωρίσεις. }}
# Asset search results with counts
# {$terms} is the search query and {$count} is the number of matching assets
viewing_asset_search_results: |
  .input {$count :integer}
  .match $count
    0   {{ Τώρα βλέπετε αποτελέσματα αναζήτησης για “{$terms}”. Δεν βρέθηκαν πόροι. }}
    one {{ Τώρα βλέπετε αποτελέσματα αναζήτησης για “{$terms}”. Βρέθηκε ένας πόρος. }}
    *   {{ Τώρα βλέπετε αποτελέσματα αναζήτησης για “{$terms}”. Βρέθηκαν {$count} πόροι. }}

# Result count labels
# Used in search result headings to show counts
# {$count} is the number of matching entries
x_entries: |
  .input {$count :integer}
  .match $count
    0   {{ Καμία καταχώριση }}
    one {{ {$count} καταχώριση }}
    *   {{ {$count} καταχωρίσεις }}
# {$count} is the number of matching assets
x_assets: |
  .input {$count :integer}
  .match $count
    0   {{ Κανένας πόρος }}
    one {{ {$count} πόρος }}
    *   {{ {$count} πόροι }}

# Empty state messages
no_files_found: Δεν βρέθηκαν αρχεία.
no_entries_found: Δεν βρέθηκαν καταχωρίσεις.

