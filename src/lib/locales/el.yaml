      .input {$min :integer}
      .match $min
        one {{ Πρέπει να επιλέξετε τουλάχιστον {$min} επιλογή. }}
        *   {{ Πρέπει να επιλέξετε τουλάχιστον {$min} επιλογές. }}
    # {$min} is the minimum number of list items
    add: |
      .input {$min :integer}
      .match $min
        one {{ Πρέπει να προσθέσετε τουλάχιστον {$min} αντικείμενο. }}
        *   {{ Πρέπει να προσθέσετε τουλάχιστον {$min} αντικείμενα. }}

  # Maximum value/count exceeded
  range_overflow:
