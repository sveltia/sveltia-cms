  .input {$count :integer}
  .match $count
    one {{ Διαγραφή καταχώρισης }}
    *   {{ Διαγραφή καταχωρίσεων }}
# {$count} is the number of selected entries
delete_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Διαγραφή επιλεγμένης καταχώρισης }}
    *   {{ Διαγραφή επιλεγμένων καταχωρίσεων }}
confirm_deleting_this_entry: Είστε βέβαιοι ότι θέλετε να διαγράψετε αυτή την καταχώριση;
confirm_deleting_this_entry_with_assets: Είστε βέβαιοι ότι θέλετε να διαγράψετε αυτή την καταχώριση και τους σχετικούς πόρους;
# Error notification shown when an entry could not be deleted
deleting_entry_failed: Δεν ήταν δυνατή η διαγραφή της καταχώρισης. Παρακαλούμε δοκιμάστε ξανά.
# {$count} is the number of selected entries
confirm_deleting_selected_entries: |
  .input {$count :integer}
  .match $count
    one {{ Είστε βέβαιοι ότι θέλετε να διαγράψετε την επιλεγμένη καταχώριση; }}
    *   {{ Είστε βέβαιοι ότι θέλετε να διαγράψετε τις επιλεγμένες {$count} καταχωρίσεις; }}
# {$count} is the number of selected entries whose associated assets would also be removed
confirm_deleting_selected_entries_with_assets: |
  .input {$count :integer}
  .match $count
    one {{ Είστε βέβαιοι ότι θέλετε να διαγράψετε την επιλεγμένη καταχώριση και τους σχετικούς πόρους; }}
    *   {{ Είστε βέβαιοι ότι θέλετε να διαγράψετε τις επιλεγμένες {$count} καταχωρίσεις και τους σχετικούς πόρους; }}
confirm_deleting_all_entries: Είστε βέβαιοι ότι θέλετε να διαγράψετε όλες τις καταχωρίσεις;
confirm_deleting_all_entries_with_assets: Είστε βέβαιοι ότι θέλετε να διαγράψετε όλες τις καταχωρίσεις και τους σχετικούς πόρους;
# Note added to the confirmation when other entries reference the entries being deleted through
# Relation fields; the references are removed in the same commit. {$count} is the number of
# referencing entries
deleting_referenced_entries_note: |
  .input {$count :integer}
  .match $count
    one {{ Η αναφορά σε αυτήν σε μια άλλη καταχώριση θα αφαιρεθεί επίσης. }}
    *   {{ Οι αναφορές σε αυτήν σε {$count} άλλες καταχωρίσεις θα αφαιρεθούν επίσης. }}
# Shown in place of the confirmation when removing the references would leave a Relation field in
# another entry invalid, e.g. a required field with nothing selected, so the deletion is refused.
