# ==============================================================================
# Delete Confirmations
# ==============================================================================
# Confirmation dialogs for deleting assets and entries.

# Delete assets: dialog titles and confirmation messages
# {$count} is the number of assets targeted by the action
delete_assets: |
  .input {$count :integer}
  .match $count
    one {{ Διαγραφή πόρου }}
    *   {{ Διαγραφή πόρων }}
# {$count} is the number of selected assets
delete_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Διαγραφή επιλεγμένου πόρου }}
    *   {{ Διαγραφή επιλεγμένων πόρων }}
confirm_deleting_this_asset: Είστε βέβαιοι ότι θέλετε να διαγράψετε αυτόν τον πόρο;
# {$count} is the number of selected assets
confirm_deleting_selected_assets: |
  .input {$count :integer}
  .match $count
    one {{ Είστε βέβαιοι ότι θέλετε να διαγράψετε τον επιλεγμένο πόρο; }}
    *   {{ Είστε βέβαιοι ότι θέλετε να διαγράψετε τους επιλεγμένους {$count} πόρους; }}
confirm_deleting_all_assets: Είστε βέβαιοι ότι θέλετε να διαγράψετε όλους τους πόρους;
# Note added to the confirmation when entries use the assets being deleted; the references are
# removed in the same commit. {$count} is the number of entries using them
deleting_referenced_assets_note: |
  .input {$count :integer}
  .match $count
    one {{ Η αναφορά σε αυτόν σε μια καταχώριση θα αφαιρεθεί επίσης. }}
    *   {{ Οι αναφορές σε αυτόν σε {$count} καταχωρίσεις θα αφαιρεθούν επίσης. }}
# Shown in place of the confirmation when removing the references would leave a field in an entry
# invalid, e.g. a required Image field with nothing left, so the deletion is refused. The fields are
# listed below the message, each with the validation error it would have. {$count} is the number of
# assets being deleted
cannot_delete_referenced_assets: |
  .input {$count :integer}
  .match $count
    one {{ Αυτός ο πόρος δεν μπορεί να διαγραφεί, επειδή τα ακόλουθα πεδία στις καταχωρίσεις που τον χρησιμοποιούν δεν θα ήταν πλέον έγκυρα χωρίς αυτόν. Ενημερώστε πρώτα αυτές τις καταχωρίσεις. }}
    *   {{ Αυτοί οι πόροι δεν μπορούν να διαγραφούν, επειδή τα ακόλουθα πεδία στις καταχωρίσεις που τους χρησιμοποιούν δεν θα ήταν πλέον έγκυρα χωρίς αυτούς. Ενημερώστε πρώτα αυτές τις καταχωρίσεις. }}
# Error shown in the asset deletion dialog when the entries using the assets couldn’t be looked up,
# so the deletion can’t go ahead. {$count} is the number of assets being deleted
checking_asset_references_failed: |
  .input {$count :integer}
  .match $count
    one {{ Δεν ήταν δυνατός ο έλεγχος των καταχωρίσεων που χρησιμοποιούν αυτόν τον πόρο. Κλείστε αυτό το παράθυρο διαλόγου και δοκιμάστε ξανά. }}
    *   {{ Δεν ήταν δυνατός ο έλεγχος των καταχωρίσεων που χρησιμοποιούν αυτούς τους πόρους. Κλείστε αυτό το παράθυρο διαλόγου και δοκιμάστε ξανά. }}

# Delete entries: dialog titles and confirmation messages
