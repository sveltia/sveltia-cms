    number_field_default_not_number: Η επιλογή `default` του πεδίου Number έχει οριστεί σε `{$value}`, αλλά πρέπει να είναι αριθμός, επειδή η επιλογή `value_type` είναι `{$valueType}`.
    # Don’t localize `fields` and `types`
    object_field_no_subfields: Η επιλογή `fields` ή `types` του πεδίου Object πρέπει να έχει τουλάχιστον ένα στοιχείο.
