    invalid_timezone: 'Άκυρη ζώνη ώρας: {$timeZone}. Πρέπει να είναι ένας έγκυρος αναγνωριστικός κωδικός IANA, όπως `Europe/Athens`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: Η παρωχημένη επιλογή `{$prop}` δεν υποστηρίζεται στο Sveltia CMS. Χρησιμοποιήστε την επιλογή `{$newProp}` αντ’ αυτού.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: Η επιλογή `allow_multiple` δεν υποστηρίζεται στο Sveltia CMS. Χρησιμοποιήστε την επιλογή `multiple`, η οποία έχει ως προεπιλογή το `false`.
