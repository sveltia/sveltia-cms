    api_key_invalid: Το κλειδί API που παρείχατε δεν είναι έγκυρο. Παρακαλούμε ελέγξτε το και δοκιμάστε ξανά.

  # Preferences operation errors
  error:
    permission_denied: Η πρόσβαση στην αποθήκευση cookies απορρίφθηκε. Παρακαλούμε ελέγξτε τα δικαιώματα του φυλλομετρητή.

  # Appearance panel
  appearance:
    title: Εμφάνιση
    theme: Θέμα
    select_theme: Επιλογή θέματος

  # Theme options
  theme:
    dark: Σκούρο
    light: Ανοιχτό

  # Language panel
  language:
    title: Γλώσσα
    ui_language:
      title: Γλώσσα περιβάλλοντος χρήστη
      select_language: Επιλογή γλώσσας

  # Contents panel
  contents:
    title: Περιεχόμενα
    editor:
      title: Επεξεργαστής
      use_draft_backup:
        switch_label: Αυτόματη δημιουργία αντιγράφων ασφαλείας προσχεδίων
      close_on_save:
        switch_label: Κλείσιμο του επεξεργαστή μετά την αποθήκευση ενός προσχεδίου
      close_with_escape:
        switch_label: Κλείσιμο του επεξεργαστή με το πλήκτρο Escape

  # Internationalization panel
  i18n:
    title: Διεθνοποίηση
    translators:
      default:
        title: Προεπιλεγμένη υπηρεσία μετάφρασης
        select_service: Επιλογή υπηρεσίας
      api_keys:
        title: Κλειδιά API υπηρεσιών μετάφρασης
        description: Διαχείριση κλειδιών API για <a>υπηρεσίες μετάφρασης</a>. Τα κλειδιά API για γενικές υπηρεσίες AI μπορούν να διαχειριστούν στις ρυθμίσεις AI.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: Κλειδί {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Εγγραφείτε στο <a {$homeHref}>{$service}</a> και εισαγάγετε <a {$apiKeyHref}>το κλειδί API σας</a> εδώ για να ενεργοποιήσετε τη γρήγορη μετάφραση πεδίων κειμένου.

  # Media panel
  media:
    title: Μέσα
    stock_photos:
      api_keys:
        title: Κλειδιά API υπηρεσιών φωτογραφιών stock
        description: Διαχείριση κλειδιών API για <a>υπηρεσίες φωτογραφιών stock</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: Κλειδί API {$service}
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Εγγραφείτε στο <a {$homeHref}>{$service} API</a> και εισαγάγετε <a {$apiKeyHref}>το κλειδί API σας</a> εδώ για να εισάγετε δωρεάν φωτογραφίες σε πεδία εικόνων.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Φωτογραφίες stock από {$service}
      no_services: Δεν έχουν ρυθμιστεί <a>υπηρεσίες φωτογραφιών</a>.
    cloud_storage:
      api_keys:
        title: Κλειδιά API υπηρεσιών αποθήκευσης στο σύννεφο
        description: Διαχείριση κλειδιών API για <a>υπηρεσίες αποθήκευσης στο σύννεφο</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: Κλειδί API {$service}
      no_services: Δεν έχουν ρυθμιστεί <a>υπηρεσίες αποθήκευσης στο σύννεφο</a>.

  # AI panel
  ai:
    title: AI
    api_keys:
      title: Κλειδιά API υπηρεσιών AI
      description: Διαχείριση κλειδιών API για υπηρεσίες AI.
    # API key input label, e.g., “OpenAI GPT API Key”
    # {$service} is the AI service name
    field_label: Κλειδί API {$service}

  # Accessibility panel
  accessibility:
    title: Προσβασιμότητα
    underline_links:
      title: Υπογράμμιση συνδέσμων
      description: Εμφάνιση υπογράμμισης για συνδέσμους στην προεπισκόπηση και στις ετικέτες του περιβάλλοντος χρήστη.
      switch_label: Πάντα υπογράμμιση συνδέσμων

  # Data Management panel
  data:
    title: Διαχείριση δεδομένων
    clear_data:
      title: Εκκαθάριση δεδομένων
      # Clear File Cache button
      file_cache:
        description: Διαγραφή του τοπικά αποθηκευμένου στην cache περιεχομένου αρχείων και των μικρογραφιών εικόνων, για να ελευθερωθεί χώρος αποθήκευσης ή να επιλυθούν προβλήματα που προκαλούνται από παλιά δεδομένα.
        button_label: Εκκαθάριση cache αρχείων
        confirmation: Το τοπικά αποθηκευμένο στην cache περιεχόμενο αρχείων και οι μικρογραφίες εικόνων θα διαγραφούν. Τα μη αποθηκευμένα προσχέδια και οι ρυθμίσεις σας θα διατηρηθούν, και τα διαγραμμένα δεδομένα θα ληφθούν ή θα δημιουργηθούν ξανά όταν χρειαστεί. Το CMS θα επαναφορτωθεί μόλις ολοκληρωθεί η διαδικασία.
      # Erase All Data button
      all_data:
        description: Διαγραφή όλων όσων διατηρεί το CMS σε αυτό το φυλλομετρητή, συμπεριλαμβανομένων των αρχείων στην cache, των μη αποθηκευμένων προσχεδίων και των ρυθμίσεων. Ό,τι έχει ήδη αποθηκευτεί στο repository σας δεν θα επηρεαστεί.
        button_label: Διαγραφή όλων των δεδομένων
        confirmation: Όλα τα δεδομένα που είναι αποθηκευμένα σε αυτό το φυλλομετρητή θα διαγραφούν, συμπεριλαμβανομένου του περιεχομένου αρχείων στην cache, των μικρογραφιών εικόνων, των μη αποθηκευμένων προσχεδίων, των ρυθμίσεων και της κατάστασης σύνδεσης. Το repository σας δεν θα επηρεαστεί, αλλά κάθε αλλαγή που δεν έχετε αποθηκεύσει θα χαθεί και θα χρειαστεί να συνδεθείτε ξανά. Το CMS θα επαναφορτωθεί μόλις ολοκληρωθεί η διαδικασία.

  # Developer panel
  developer:
    title: Για προγραμματιστές
    developer_mode:
      title: Λειτουργία Developer
      description: Ενεργοποίηση δυνατοτήτων για προγραμματιστές, συμπεριλαμβανομένων λεπτομερών καταγραφών κονσόλας και εγγενών μενού πλαισίου.
      switch_label: Ενεργοποίηση λειτουργίας developer
    local_git:
      title: Commits Git
      description: Κάντε commit τις αλλαγές σας στον τρέχοντα κλάδο του τοπικού σας repository κάθε φορά που τις αποθηκεύετε, όπως κάνει το CMS όταν εργάζεστε με απομακρυσμένο repository. Στη συνέχεια, μπορείτε να ελέγξετε και να κάνετε push τα commits με τα συνηθισμένα εργαλεία Git σας.
      switch_label: Commit αλλαγών στο Git
      checking: Έλεγχος του repository…
      # {$branch} is the branch name, {$name} and {$email} are the commit author’s name and email address
      ready: Οι αλλαγές θα γίνονται commit στον κλάδο {$branch} ως {$name} ({$email}).
      # {$reason} is one of the `local_git_skip_reasons` strings
      not_ready: Δεν είναι δυνατό να γίνει commit των αλλαγών αυτή τη στιγμή. {$reason}
    deploy_hook:
      title: Deploy Hook
      description: Εισαγάγετε ένα webhook URL που θα καλείται όταν ενεργοποιείτε χειροκίνητα μια δημοσίευση επιλέγοντας Δημοσίευση αλλαγών. Μπορεί να μείνει κενό εάν χρησιμοποιείτε GitHub Actions ή GitLab CI/CD.
      # Hook URL input
      url:
        field_label: Hook URL
        saved: Το URL του Hook αποθηκεύτηκε.
        removed: Το URL του Hook αφαιρέθηκε.
      # Authorization header input
      auth:
        field_label: Κεφαλίδα εξουσιοδότησης (π.χ. Bearer <token>) (προαιρετικό)
        saved: Η κεφαλίδα εξουσιοδότησης αποθηκεύτηκε.
        removed: Η κεφαλίδα εξουσιοδότησης αφαιρέθηκε.

