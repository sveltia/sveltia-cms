cannot_delete_referenced_entries: |
  .input {$count :integer}
  .match $count
    one {{ Αυτή η καταχώριση δεν μπορεί να διαγραφεί, επειδή τα ακόλουθα πεδία σε άλλες καταχωρίσεις δεν θα ήταν πλέον έγκυρα χωρίς αυτήν. Ενημερώστε πρώτα αυτές τις καταχωρίσεις. }}
    *   {{ Αυτές οι καταχωρίσεις δεν μπορούν να διαγραφούν, επειδή τα ακόλουθα πεδία σε άλλες καταχωρίσεις δεν θα ήταν πλέον έγκυρα χωρίς αυτές. Ενημερώστε πρώτα αυτές τις καταχωρίσεις. }}

