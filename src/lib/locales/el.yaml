# File Upload and Processing
# ==============================================================================
# Strings for file upload dialogs, progress indicators, and validation.

# Processing indicator shown during file preparation
# {$count} is the number of files currently being processed
processing_files: |
  .input {$count :integer}
  .match $count
    one {{ Επεξεργασία αρχείου. Αυτό μπορεί να πάρει λίγο χρόνο. }}
    *   {{ Επεξεργασία αρχείων. Αυτό μπορεί να πάρει λίγο χρόνο. }}

# Uploading section aria-label
uploading_files: Μεταφόρτωση αρχείων

# Replace file confirmation
# Dialog body when replacing an existing file
# {$name} is the existing file name that will be replaced
confirm_replacing_file: 'Το αρχείο “{$name}” θα αντικατασταθεί από αυτό το αρχείο:'

# Upload confirmation with destination folder
# {$folder} is the destination folder label and {$count} is the number of files being uploaded
confirm_uploading_files: |
  .input {$count :integer}
  .match $count
    one {{ Αυτό το αρχείο θα αποθηκευτεί στον φάκελο “{$folder}”: }}
    *   {{ Αυτά τα {$count} αρχεία θα αποθηκευτούν στον φάκελο “{$folder}”: }}

# File size validation
# Warning section for files exceeding size limits
oversized_files: Αρχεία μεγάλου μεγέθους
# {$size} is the maximum allowed file size and {$count} is the number of oversized files
warning_oversized_files: |
  .input {$count :integer}
  .match $count
    one {{ Αυτό το αρχείο δεν μπορεί να μεταφορτωθεί επειδή υπερβαίνει το μέγιστο όριο των {$size}. Παρακαλούμε μειώστε το μέγεθος ή επιλέξτε άλλο αρχείο. }}
    *   {{ Αυτά τα αρχεία δεν μπορούν να μεταφορτωθούν επειδή υπερβαίνουν το μέγιστο όριο των {$size}. Παρακαλούμε μειώστε τα μεγέθη ή επιλέξτε διαφορετικά αρχεία. }}

# File integrity validation
# Warning section for files that cannot be decoded
invalid_files: Μη έγκυρα αρχεία
# {$count} is the number of invalid files
warning_invalid_files: |
  .input {$count :integer}
  .match $count
