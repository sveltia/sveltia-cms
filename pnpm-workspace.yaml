# cSpell:ignore gcqx minimatch

allowBuilds:
  unrs-resolver: false

engineStrict: true

auditConfig:
  ignoreGhsas:
    # deepmerge: low severity, unpatched. Only used at build time by `@sveltejs/vite-plugin-svelte`;
    # the CMS itself uses `@fastify/deepmerge` instead
    # https://github.com/advisories/GHSA-gcqx-w48m-w2h4
    - GHSA-gcqx-w48m-w2h4

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@sveltia/*'

overrides:
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@<11.0.1: ^11.0.1
