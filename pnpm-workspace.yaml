allowBuilds:
  unrs-resolver: false

auditConfig:
  ignoreGhsas:
    # braces, used only in Stylelint
    # https://github.com/advisories/GHSA-vfj7-8cjw-p6xm
    - GHSA-vfj7-8cjw-p6xm

engineStrict: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@sveltia/*'

overrides:
  # esrap 2.3.3 wraps any node carrying a leading `/** @type {...} */` comment in parentheses,
  # including binding positions (`catch` params, function params, `let` declarators) where
  # parentheses are syntactically invalid. Svelte uses esrap to print compiled output, so this
  # breaks the build and tests. Pin to the last good release until the upstream fix lands.
  # https://github.com/sveltejs/svelte/issues/18643
  esrap: 2.3.2

patchedDependencies:
  # The table plugin’s `pointerdown` handler, on the window, also takes a click in a rich text
  # editor nested in an editor component for its own: it looks up the nested table in the parent
  # editor and throws, and the recovery moves the selection back to the parent and scrolls to it.
  # Leave a click whose nearest editor is another one to that editor, like
  # `isSelectionWithinEditor()` does. Remove once the upstream fix lands.
  # https://github.com/facebook/lexical/issues/9355
  '@lexical/table@0.52.0': patches/@lexical__table@0.52.0.patch
